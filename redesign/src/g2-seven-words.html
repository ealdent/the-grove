<meta charset="utf-8">
<title>Grove Seven Words II</title>
<meta name="description" content="Four iterations of the Seven Words hub on identical data: a justified wood-type block, a warm serif on bone, the words in Phosphor Wake, and a split with the picture beside the words.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1&display=swap">
<style>
@font-face{font-family:"Phosphor Wake";src:url("__PHOSPHOR_WOFF2__") format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Phosphor Wake Burn";src:url("__PHOSPHOR_BURN_WOFF2__") format("woff2");font-weight:400 700;font-display:swap}
:root{--bg:#0d0a08;--ink:#d8c29c;--ink-2:#f0dfbd;--dim:#5d5040;--ember:#e8873a;--stroke:rgba(232,200,150,.6);
  --f-grot:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;--f-serif:'Fraunces',Georgia,'Times New Roman',serif;--f-pix:'Phosphor Wake',ui-monospace,monospace;--f-pixb:'Phosphor Wake Burn','Phosphor Wake',ui-monospace,monospace}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-grot)}
a{color:inherit}
.hub{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:4vh 5vw 3.5vh;gap:2vh;justify-items:center;position:relative}
.hub > *{width:min(100%,var(--stack,100%))}
.brand{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.words{display:grid;align-content:center;justify-items:start}
.w{position:relative;display:inline-flex;align-items:flex-start;gap:.12em;text-decoration:none;color:var(--ink);font-weight:800;text-transform:uppercase;white-space:nowrap;
  font-size:min(11.4vh,12.6vw);line-height:.9;letter-spacing:-.025em;font-variation-settings:"opsz" 96,"wdth" 82;max-width:100%}
.w .t{position:relative;display:inline-block;-webkit-text-stroke:1px rgba(216,194,156,.25)}
/* two image layers stacked on the word so one can fade into the next */
.w .f{position:absolute;inset:0;pointer-events:none;color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-size:cover;background-position:center top;
  -webkit-text-stroke:1.5px var(--stroke);filter:contrast(1.15) brightness(1.45) saturate(1.2);opacity:0;transition:opacity .9s ease}
.w .f.on{opacity:1}
.w.lit .t{color:transparent;-webkit-text-fill-color:transparent}
.w:not(.lit):hover .t,.w:not(.lit):focus-visible .t{color:var(--ink-2)}
.w:focus-visible{outline:none}
.w sup{font-size:.2em;font-weight:500;letter-spacing:0;color:var(--ember);font-variation-settings:"opsz" 12,"wdth" 100;margin-top:.12em;line-height:1}
.cap{display:flex;flex-wrap:wrap;gap:.4em 1.4em;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);min-height:1.4em}
.cap a{color:var(--ember);text-decoration:none}
.cap a:hover,.cap a:focus-visible{text-decoration:underline;text-underline-offset:3px;outline:none}
.panel{display:none}

/* ---- 1 · block: every line scaled to one measure ---- */
[data-v="1"] .w{max-width:none;align-items:baseline}
[data-v="1"] .words{gap:.02em}
[data-v="1"] .w sup{position:absolute;right:-1.6em;top:.1em;font-size:14px;margin:0}

/* ---- 2 · serif on bone, title case, slow pan ---- */
[data-v="2"]{--bg:#e9e2d2;--ink:#1c1814;--ink-2:#000;--dim:#8a7d6c;--ember:#b8461f;--stroke:rgba(28,24,20,.35)}
[data-v="2"] body,[data-v="2"] .hub{background:var(--bg)}
[data-v="2"] .w{font-family:var(--f-serif);font-weight:900;text-transform:none;letter-spacing:-.02em;line-height:.95;font-variation-settings:"opsz" 144,"SOFT" 40,"WONK" 1;font-size:min(11.6vh,12.6vw)}
[data-v="2"] .w .t{-webkit-text-stroke:0}
[data-v="2"] .w .f{-webkit-text-stroke:1px var(--stroke);filter:contrast(1.1) brightness(1.05) saturate(1.1);animation:pan 9s ease-in-out infinite alternate}
[data-v="2"] .w sup{font-family:var(--f-serif);font-weight:500;font-variation-settings:"opsz" 12,"SOFT" 0,"WONK" 0;font-variant-numeric:oldstyle-nums;font-size:.24em;margin-top:.3em}
[data-v="2"] .brand,[data-v="2"] .cap{font-family:var(--f-serif);text-transform:none;letter-spacing:.04em;font-size:15px;font-weight:500}
@keyframes pan{from{background-position:0% 0%}to{background-position:100% 60%}}

/* ---- 3 · phosphor: the house face ---- */
[data-v="3"]{--bg:#070907;--ink:#9fe07a;--ink-2:#d3ffc5;--dim:#3e5e34;--ember:#d3ffc5;--stroke:rgba(211,255,197,.55)}
[data-v="3"] body,[data-v="3"] .hub{background:var(--bg);background-image:radial-gradient(ellipse 80% 60% at 50% 40%,#0c140c,transparent 70%)}
[data-v="3"] .w{font-family:var(--f-pixb);font-weight:400;letter-spacing:0;line-height:1;font-size:min(10.6vh,10.8vw);text-shadow:0 0 3px rgba(211,255,197,.25),0 0 14px rgba(144,255,105,.35),0 0 36px rgba(144,255,105,.2)}
[data-v="3"] .w .t{-webkit-text-stroke:0}
[data-v="3"] .w .f{-webkit-text-stroke:1.5px rgba(211,255,197,.78);filter:contrast(1.25) brightness(1.8) saturate(1.3) drop-shadow(0 0 10px rgba(144,255,105,.45));text-shadow:none}
[data-v="3"] .w sup{font-family:var(--f-pix);font-weight:400;font-size:.28em;color:var(--dim);margin-top:.05em}
[data-v="3"] .brand,[data-v="3"] .cap{font-family:var(--f-pix);letter-spacing:.06em;font-size:15px;font-weight:400}

/* ---- 4 · split: the picture beside the words ---- */
[data-v="4"] .hub{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:4vw;justify-items:start}
[data-v="4"] .hub > *{width:100%}
[data-v="4"] .brand{grid-column:1}
[data-v="4"] .words{grid-column:1;grid-row:2}
[data-v="4"] .cap{grid-column:1;grid-row:3}
[data-v="4"] .w{font-size:min(10.6vh,6.4vw)}
[data-v="4"] .w .f{display:none}
[data-v="4"] .w.lit .t{color:var(--ember);-webkit-text-fill-color:var(--ember);-webkit-text-stroke:0}
[data-v="4"] .panel{display:block;grid-column:2;grid-row:1/4;position:relative;align-self:stretch;min-height:60vh;overflow:hidden;background:#000}
[data-v="4"] .panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;opacity:0;transition:opacity .9s ease;filter:brightness(.82) saturate(.95)}
[data-v="4"] .panel img.on{opacity:1}
[data-v="4"] .panel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0,transparent 18%),linear-gradient(0deg,var(--bg) 0,transparent 22%);pointer-events:none}
@media (max-width:860px){[data-v="4"] .hub{grid-template-columns:1fr}[data-v="4"] .panel{grid-column:1;grid-row:1/4;opacity:.35}[data-v="4"] .brand,[data-v="4"] .words,[data-v="4"] .cap{position:relative;z-index:1}}

/* review switcher, not part of the design */
.sw{position:fixed;right:14px;bottom:12px;display:flex;gap:14px;font:600 11px/1 var(--f-grot);letter-spacing:.18em;text-transform:uppercase;z-index:9}
.sw button{font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:0;padding:4px 0;color:var(--dim);cursor:pointer;border-bottom:1px solid transparent}
.sw button[aria-pressed="true"]{color:var(--ember);border-bottom-color:var(--ember)}
@media (prefers-reduced-motion:reduce){.w .f,.panel img{transition:none;animation:none!important}}
</style>

<main class="hub">
  <div class="brand">The Grove</div>
  <nav class="words" id="words" aria-label="Sections"></nav>
  <div class="cap" id="cap" aria-live="polite"></div>
  <div class="panel" aria-hidden="true"><img id="p0" alt=""><img id="p1" alt=""></div>
</main>
<div class="sw" role="group" aria-label="Variant" id="sw">
  <button type="button" data-v="1">1 Block</button><button type="button" data-v="2">2 Serif</button><button type="button" data-v="3">3 Phosphor</button><button type="button" data-v="4">4 Split</button>
</div>

<script>
(() => {
  const M = __MANIFEST_JSON__;
  const THUMBS = __THUMBS_JSON__;
  const SITE = "__SITE_BASE__";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const href = w => SITE + w.path.replace(/\/index\.html$/, '/');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CATS = [
    { name: 'Tower Defense', sections: ['tower-def'], href: 'tower-def/' },
    { name: 'SVG Forest', sections: ['svg-forest'], href: 'svg-forest/' },
    { name: 'Time Loop', sections: ['time-loop'], href: 'time-loop/' },
    { name: 'Rail Shooter', sections: ['rail-shooter'], href: 'rail-shooter/' },
    { name: 'Arcade', sections: ['arcade', 'vector-defense'], href: 'arcade/' },
    { name: 'Learn', sections: ['learn'], href: 'learn/' },
    { name: 'Workshop', sections: ['utils', 'shaders', 'greenhouse-todo', 'depths'], href: 'utils/' },
  ];
  let seed = Math.floor(Date.now() / 864e5); const rng = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  CATS.forEach(c => { c.works = shuffle(M.works.filter(w => c.sections.includes(w.section) && THUMBS[w.id])); c.count = M.works.filter(w => c.sections.includes(w.section)).length; c.i = 0; });

  const root = document.documentElement, hub = document.querySelector('.hub');
  const nav = document.getElementById('words'), cap = document.getElementById('cap');
  nav.innerHTML = CATS.map((c, i) => `<a class="w" href="${SITE + c.href}" data-i="${i}"><span class="t">${esc(c.name)}<span class="f" aria-hidden="true">${esc(c.name)}</span><span class="f" aria-hidden="true">${esc(c.name)}</span></span><sup>${c.count}</sup></a>`).join('');
  const els = [...nav.children], pimgs = [document.getElementById('p0'), document.getElementById('p1')];
  let lit = Math.floor(rng() * CATS.length), timer = null, front = {};

  function show(step) {
    const c = CATS[lit]; if (!c.works.length) return;
    if (step) c.i = (c.i + 1) % c.works.length;
    const w = c.works[c.i];
    els.forEach((el, i) => {
      el.classList.toggle('lit', i === lit);
      const layers = el.querySelectorAll('.f');
      if (i !== lit) { layers.forEach(l => l.classList.remove('on')); return; }
      const f = front[i] || 0, b = 1 - f; layers[b].style.backgroundImage = `url("${THUMBS[w.id]}")`;
      layers[b].classList.add('on'); layers[f].classList.remove('on'); front[i] = b;
    });
    const pf = front.p || 0, pb = 1 - pf; pimgs[pb].src = THUMBS[w.id]; pimgs[pb].classList.add('on'); pimgs[pf].classList.remove('on'); front.p = pb;
    cap.innerHTML = `<a href="${href(w)}">${esc(w.title)}</a>${w.model ? `<span>${esc(w.model)}${w.effort ? ' ' + esc(w.effort) : ''}</span>` : ''}`;
  }
  function arm(ms) { clearInterval(timer); if (!reduced) timer = setInterval(() => show(true), ms); }
  nav.addEventListener('pointerover', e => { const a = e.target.closest('.w'); if (a && +a.dataset.i !== lit) { lit = +a.dataset.i; show(false); arm(1400); } });
  nav.addEventListener('focusin', e => { const a = e.target.closest('.w'); if (a) { lit = +a.dataset.i; show(false); arm(1400); } });
  nav.addEventListener('pointerleave', () => arm(3200));

  // composition: the stack is as wide as its longest word; in the block variant every line is scaled to one measure
  function fit() {
    const v = root.dataset.v;
    els.forEach(el => el.style.fontSize = '');
    if (v === '1') {
      const measure = Math.min(innerWidth * .82, 1400), avail = innerHeight * .74;
      hub.style.setProperty('--stack', measure + 'px');
      const sizes = els.map(el => { el.style.fontSize = '100px'; const w = el.querySelector('.t').getBoundingClientRect().width; return 100 * measure / w; });
      let total = 0; els.forEach((el, i) => { el.style.fontSize = sizes[i] + 'px'; total += el.getBoundingClientRect().height; });
      const k = Math.min(1, avail / total); if (k < 1) els.forEach((el, i) => el.style.fontSize = sizes[i] * k + 'px');
      hub.style.setProperty('--stack', (measure * k) + 'px');
    } else if (v === '4') {
      hub.style.removeProperty('--stack');
      const colW = nav.getBoundingClientRect().width, base = Math.min(innerHeight * .106, innerWidth * .064);
      els.forEach(el => { el.style.fontSize = '100px'; const w = el.getBoundingClientRect().width; el.style.fontSize = Math.min(base, 100 * colW / w) + 'px'; });
    } else {
      hub.style.setProperty('--stack', Math.max(...els.map(e => e.getBoundingClientRect().width)) + 'px');
    }
  }
  function setV(v) {
    root.dataset.v = v; document.querySelectorAll('.sw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
    if (location.hash !== '#v' + v) history.replaceState(null, '', '#v' + v);
    fit(); requestAnimationFrame(fit);
  }
  document.getElementById('sw').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setV(b.dataset.v); });
  addEventListener('keydown', e => { if (/^[1-4]$/.test(e.key) && !e.metaKey && !e.ctrlKey) setV(e.key); });
  addEventListener('hashchange', () => { const m = location.hash.match(/^#v([1-4])$/); if (m) setV(m[1]); });
  addEventListener('resize', fit); if (document.fonts) document.fonts.ready.then(fit);
  const m = location.hash.match(/^#v([1-4])$/); setV(m ? m[1] : '1');
  show(false); arm(3200);
})();
</script>
