<meta charset="utf-8">
<title>Grove Lantern</title>
<meta name="description" content="The current hub kept and quieted: the illustration, the painted icons, ash and grain stay; the card grid goes, and resting on a lantern projects that category's title screens onto the scene.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap">
<style>
:root{--bg:#0a0908;--ink:#c8b89a;--gold:#d4a853;--dim:rgba(180,160,130,.6);--ember:#e0872f}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Share Tech Mono',ui-monospace,monospace;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:var(--bg)}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transition:opacity 1.1s ease;filter:saturate(.55) brightness(.75) contrast(1.1)}
.bg img.slide{filter:saturate(.55) brightness(.62) contrast(1.12) sepia(.3);opacity:0}
.bg img.slide.on{opacity:1}
.overlay{position:fixed;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(10,8,6,.62) 0%,rgba(10,8,6,.22) 28%,rgba(10,8,6,.2) 55%,rgba(10,8,6,.88) 100%)}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.12;background-size:180px;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)'/%3E%3C/svg%3E")}
.vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55) 100%)}
.ash{position:fixed;inset:0;z-index:2;pointer-events:none}
.content{position:relative;z-index:4;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(1.6rem,4vw,3rem) clamp(1rem,3vw,2rem) clamp(1rem,3vh,2rem)}
h1{font-family:'Special Elite',cursive;font-weight:400;font-size:clamp(2.6rem,6.5vw,4.6rem);color:var(--gold);text-align:center;margin:0;letter-spacing:.06em;
  text-shadow:0 0 40px rgba(180,120,40,.35),0 0 80px rgba(180,120,40,.15),2px 2px 0 rgba(0,0,0,.6);animation:flicker 4s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.92}49%{opacity:1}72%{opacity:1}73%{opacity:.88}74%{opacity:.95}75%{opacity:1}}
.now{align-self:end;justify-self:center;text-align:center;font-size:clamp(.78rem,1.3vw,.95rem);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);min-height:1.6em;margin:0 0 1.4rem;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.now a{color:var(--gold);text-decoration:none}
.now a:hover,.now a:focus-visible{text-decoration:underline;text-underline-offset:3px;outline:none}
.lanterns{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(.4rem,1.6vw,1.2rem) clamp(.6rem,2.4vw,2rem);margin:0;padding:0;list-style:none}
.lantern{display:grid;justify-items:center;gap:.35rem;text-decoration:none;color:var(--ink);width:clamp(92px,11vw,132px);padding:.5rem .2rem}
.lantern img{width:clamp(54px,6.4vw,84px);height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.65)) brightness(.82);transition:filter .3s,transform .3s}
.lantern:hover img,.lantern:focus-visible img,.lantern.lit img{filter:drop-shadow(0 0 20px rgba(224,135,47,.55)) brightness(1.15);transform:translateY(-4px)}
.lantern .name{font-family:'Special Elite',cursive;font-size:clamp(.9rem,1.35vw,1.12rem);color:var(--gold);text-align:center;line-height:1.1;text-shadow:1px 1px 0 rgba(0,0,0,.7)}
.lantern .n{font-size:.68rem;letter-spacing:.2em;color:var(--dim)}
.lantern:focus-visible{outline:1px solid var(--ember);outline-offset:4px;border-radius:4px}
@media (prefers-reduced-motion:reduce){h1{animation:none}.bg img{transition:none}.lantern img{transition:none}}
</style>

<div class="bg" aria-hidden="true">
  <img class="base" src="__IMG:redesign/assets/backdrop.jpg__" alt="">
  <img class="slide" id="s0" alt=""><img class="slide" id="s1" alt="">
</div>
<div class="overlay" aria-hidden="true"></div>
<canvas class="ash" id="ash" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main class="content">
  <h1>The Grove</h1>
  <p class="now" id="now" aria-live="polite"></p>
  <nav class="lanterns" id="lanterns" aria-label="Sections"></nav>
</main>

<script>
(() => {
  const M = __MANIFEST_JSON__;
  const THUMBS = __THUMBS_JSON__;
  const SITE = "__SITE_BASE__";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const href = w => SITE + w.path.replace(/\/index\.html$/, '/');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CATS = [
    { name: 'Tower Defense', sections: ['tower-def'], href: 'tower-def/', icon: '__IMG:images/icons/gate.png__' },
    { name: 'SVG Forest', sections: ['svg-forest'], href: 'svg-forest/', icon: '__IMG:images/icons/pine.png__' },
    { name: 'Time Loop', sections: ['time-loop'], href: 'time-loop/', icon: '__IMG:images/icons/lighthouse.png__' },
    { name: 'Rail Shooter', sections: ['rail-shooter'], href: 'rail-shooter/', icon: '__IMG:images/icons/beacon.png__' },
    { name: 'Arcade', sections: ['arcade', 'vector-defense'], href: 'arcade/', icon: '__IMG:images/icons/beaver.png__' },
    { name: 'Learn', sections: ['learn'], href: 'learn/', icon: '__IMG:images/icons/campfire.png__' },
    { name: 'Workshop', sections: ['utils', 'shaders', 'depths'], href: 'utils/', icon: '__IMG:images/icons/mountain.png__' },
    { name: 'Greenhouse', sections: ['greenhouse-todo'], href: 'greenhouse-todo/', icon: '__IMG:images/icons/grape.png__' },
  ];
  let seed = Math.floor(Date.now() / 864e5); const rng = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  CATS.forEach(c => { c.all = M.works.filter(w => c.sections.includes(w.section)); c.works = shuffle(c.all.filter(w => THUMBS[w.id])); c.i = 0; });

  const nav = document.getElementById('lanterns'), now = document.getElementById('now');
  nav.innerHTML = CATS.map((c, i) => `<a class="lantern" href="${SITE + c.href}" data-i="${i}"><img src="${c.icon}" alt="" width="84" height="84"><span class="name">${esc(c.name)}</span><span class="n">${c.all.length}</span></a>`).join('');
  const lanterns = [...nav.children], slides = [document.getElementById('s0'), document.getElementById('s1')];
  let lit = -1, front = 0, timer = null;

  function project(step) {
    const c = CATS[lit]; if (!c || !c.works.length) return;
    if (step) c.i = (c.i + 1) % c.works.length;
    const w = c.works[c.i], back = 1 - front;
    slides[back].src = THUMBS[w.id];
    slides[back].classList.add('on'); slides[front].classList.remove('on'); front = back;
    now.innerHTML = `<a href="${href(w)}">${esc(w.title)}</a>${w.model ? ` · ${esc(w.model)}${w.effort ? ' ' + esc(w.effort) : ''}` : ''}`;
  }
  function dim() { clearInterval(timer); lit = -1; slides.forEach(s => s.classList.remove('on')); lanterns.forEach(l => l.classList.remove('lit')); now.textContent = ''; }
  function light(i) {
    if (i === lit) return; lit = i; lanterns.forEach((l, k) => l.classList.toggle('lit', k === i));
    project(false); clearInterval(timer); if (!reduced) timer = setInterval(() => project(true), 2400);
  }
  nav.addEventListener('pointerover', e => { const a = e.target.closest('.lantern'); if (a) light(+a.dataset.i); });
  nav.addEventListener('pointerleave', dim);
  nav.addEventListener('focusin', e => { const a = e.target.closest('.lantern'); if (a) light(+a.dataset.i); });
  nav.addEventListener('focusout', e => { if (!nav.contains(e.relatedTarget)) dim(); });

  // falling ash, as on the current hub
  const canvas = document.getElementById('ash'), ctx = canvas.getContext('2d');
  if (!reduced) {
    let w = 0, h = 0; const P = [];
    const spawn = init => ({ x: Math.random() * w, y: init ? Math.random() * h : -Math.random() * 40, r: .5 + Math.random() * 1.1, vy: .12 + Math.random() * .25, drift: .3 + Math.random() * .6, phase: Math.random() * Math.PI * 2, freq: .0008 + Math.random() * .0012, alpha: .14 + Math.random() * .18 });
    const resize = () => { const dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; canvas.width = w * dpr; canvas.height = h * dpr; canvas.style.width = w + 'px'; canvas.style.height = h + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    resize(); for (let i = 0; i < 100; i++) P.push(spawn(true));
    addEventListener('resize', resize);
    const tick = t => { ctx.clearRect(0, 0, w, h); for (const p of P) { p.y += p.vy; if (p.y - p.r > h) { Object.assign(p, spawn(false)); continue; } ctx.beginPath(); ctx.arc(p.x + Math.sin(t * p.freq + p.phase) * p.drift, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(70,65,60,${p.alpha})`; ctx.fill(); } requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
})();
</script>
