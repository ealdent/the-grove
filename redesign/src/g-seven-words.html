<meta charset="utf-8">
<title>Grove Seven Words</title>
<meta name="description" content="The Grove in seven words: each category set huge, the lit word filled with its own works' title screens.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap">
<style>
:root{--bg:#0d0a08;--ink:#d8c29c;--ink-2:#f0dfbd;--dim:#5d5040;--ember:#e8873a;--f:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f)}
.hub{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:4vh 5vw 3.5vh;gap:2vh;justify-items:center}
.hub > *{width:min(100%,var(--stack,100%))}
.brand{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.words{display:grid;align-content:center;justify-items:start}
.w{display:inline-flex;align-items:flex-start;gap:.12em;text-decoration:none;color:var(--ink);font-weight:800;text-transform:uppercase;
  font-size:min(11.4vh,12.6vw);line-height:.9;letter-spacing:-.025em;font-variation-settings:"opsz" 96,"wdth" 82;max-width:100%}
.w .t{-webkit-background-clip:text;background-clip:text;background-size:cover;background-position:center top;-webkit-text-stroke:1px rgba(216,194,156,.25);transition:color .2s}
.w.lit .t{color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.5px rgba(232,200,150,.6);filter:contrast(1.15) brightness(1.45) saturate(1.2)}
.w:not(.lit):hover .t,.w:not(.lit):focus-visible .t{color:var(--ink-2)}
.w:focus-visible{outline:none}
.w sup{font-size:.2em;font-weight:500;letter-spacing:0;color:var(--ember);font-variation-settings:"opsz" 12,"wdth" 100;margin-top:.12em;line-height:1}
.cap{display:flex;flex-wrap:wrap;gap:.4em 1.4em;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);min-height:1.4em}
.cap a{color:var(--ember);text-decoration:none}
.cap a:hover,.cap a:focus-visible{text-decoration:underline;text-underline-offset:3px;outline:none}
@media (prefers-reduced-motion:reduce){.w .t{transition:none}}
</style>

<main class="hub">
  <div class="brand">The Grove</div>
  <nav class="words" id="words" aria-label="Sections"></nav>
  <div class="cap" id="cap" aria-live="polite"></div>
</main>

<script>
(() => {
  const M = __MANIFEST_JSON__;
  const THUMBS = __THUMBS_JSON__;
  const SITE = "__SITE_BASE__";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const href = w => SITE + w.path.replace(/\/index\.html$/, '/');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CATS = [
    { name: 'Tower Defense', sections: ['tower-def'], href: 'tower-def/' },
    { name: 'SVG Forest', sections: ['svg-forest'], href: 'svg-forest/' },
    { name: 'Time Loop', sections: ['time-loop'], href: 'time-loop/' },
    { name: 'Rail Shooter', sections: ['rail-shooter'], href: 'rail-shooter/' },
    { name: 'Arcade', sections: ['arcade', 'vector-defense'], href: 'arcade/' },
    { name: 'Learn', sections: ['learn'], href: 'learn/' },
    { name: 'Workshop', sections: ['utils', 'shaders', 'greenhouse-todo', 'depths'], href: 'utils/' },
  ];
  const day = Math.floor(Date.now() / 864e5);
  let seed = day; const rng = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  CATS.forEach(c => { c.works = shuffle(M.works.filter(w => c.sections.includes(w.section) && THUMBS[w.id])); c.count = M.works.filter(w => c.sections.includes(w.section)).length; c.i = 0; });

  const nav = document.getElementById('words'), cap = document.getElementById('cap');
  nav.innerHTML = CATS.map((c, i) => `<a class="w" href="${SITE + c.href}" data-i="${i}"><span class="t">${esc(c.name)}</span><sup>${c.count}</sup></a>`).join('');
  const els = [...nav.children];
  let lit = Math.floor(rng() * CATS.length), timer = null;

  function show(step) {
    const c = CATS[lit]; if (!c.works.length) return;
    if (step) c.i = (c.i + 1) % c.works.length;
    const w = c.works[c.i];
    els.forEach((el, i) => { el.classList.toggle('lit', i === lit); if (i === lit) el.querySelector('.t').style.backgroundImage = `url("${THUMBS[w.id]}")`; });
    cap.innerHTML = `<a href="${href(w)}">${esc(w.title)}</a>${w.model ? `<span>${esc(w.model)}${w.effort ? ' ' + esc(w.effort) : ''}</span>` : ''}`;
  }
  function arm(ms) { clearInterval(timer); if (!reduced) timer = setInterval(() => show(true), ms); }
  nav.addEventListener('pointerover', e => { const a = e.target.closest('.w'); if (a && +a.dataset.i !== lit) { lit = +a.dataset.i; show(false); arm(1100); } });
  nav.addEventListener('focusin', e => { const a = e.target.closest('.w'); if (a) { lit = +a.dataset.i; show(false); arm(1100); } });
  nav.addEventListener('pointerleave', () => arm(2600));
  // the stack is as wide as its longest word, then sits centred as one object
  const fit = () => { document.querySelector('.hub').style.setProperty('--stack', Math.max(...els.map(e => e.getBoundingClientRect().width)) + 'px'); };
  fit(); addEventListener('resize', fit); if (document.fonts) document.fonts.ready.then(fit);
  show(false); arm(2600);
})();
</script>
