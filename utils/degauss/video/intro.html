<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Degauss intro renderer</title>
<!--
  Frame-stepped renderer for the 15 s Degauss launch video (1080x1080, 60 fps).
  window.__render(i, type, quality) draws frame i and returns it as a data URL.
  window.__audio() renders the score offline; the WAV is left in window.__wav
  as base64 chunks. Open with ?t=<seconds> to look at one moment in a browser.
-->
<style>
  @font-face { font-family: Degauss; src: url('../Degauss-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: Degauss; src: url('../Degauss-Bold.woff2') format('woff2'); font-weight: 700; }
  html, body { margin: 0; background: #000; }
  canvas#gl { display: block; width: 1080px; height: 1080px; }
</style>
</head>
<body>
<canvas id="gl" width="1080" height="1080"></canvas>
<script>window.onerror = (msg, src, line) => { window.__error = `${msg} (line ${line})`; };</script>
<script>
'use strict';
const SIZE = 1080, S = 1.5, CW = Math.round(SIZE * S);
const FPS = 60, DURATION = 15;
const BEAT = 0.5; // 120 bpm; every cut lands on the beat grid

// Palette: the specimen page's beam and width-class colours.
const CORE = '#ffe7bf', AMBER = '#ffb447', DIM = '#c9965c', FAINT = '#8a6a48';
const CLS = { 300: '#f5c24a', 450: '#f08b2e', 600: '#e3502c', 900: '#b8703f' };
const GREEN = '#b8ffc8', ICE = '#e3eeff', OSD = '#8dffb4', REC = '#f1462c';
const WM_Y = 520, WM_SIZE = 216, SUB_Y = 622; // the wordmark sits in the same place on the title and end cards

// --- small maths -----------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeOutBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const blink = (t, hz) => Math.floor(t * hz * 2) % 2 === 0;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mix(hexA, hexB, k) {
  const a = parseInt(hexA.slice(1), 16), b = parseInt(hexB.slice(1), 16);
  const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, k));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

// --- 2D scene drawing (in 1080 units) ----------------------------------------------------------
function makeCanvas() { const c = document.createElement('canvas'); c.width = c.height = CW; return c; }
const scene = makeCanvas();
let cx = scene.getContext('2d');

function font(size, weight = 400) { cx.font = `${weight} ${size}px Degauss`; }
function measure(s, size, weight = 400) { font(size, weight); return cx.measureText(s).width; }
function txt(s, x, y, size, o = {}) {
  const a = o.a ?? 1;
  if (a <= 0) return;
  font(size, o.w || 400);
  cx.textAlign = o.align || 'left';
  cx.textBaseline = 'alphabetic';
  cx.globalAlpha = a;
  cx.fillStyle = o.c || CORE;
  cx.fillText(s, x, y);
  cx.globalAlpha = 1;
}
const advCache = new Map();
function adv(ch) {
  // Advance in font units, snapped to the 150-unit grid every Degauss width sits on.
  if (!advCache.has(ch)) advCache.set(ch, Math.round(measure(ch, 1000) / 150) * 150);
  return advCache.get(ch);
}
function rrect(x, y, w, h, r) {
  w = Math.max(0, w);
  cx.beginPath(); cx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2));
}
function cursor(x, y, w, h, c = CORE) { cx.fillStyle = c; cx.fillRect(x, y - h, w, h); }
function rawRun(seq, center, base, size, gap, color) {
  // Each character is drawn on its own, so no ligature can form.
  const k = size / 1000, chars = [...seq], units = chars.map(adv);
  let x = center - (units.reduce((s, u) => s + u, 0) * k + gap * (chars.length - 1)) / 2;
  chars.forEach((ch, i) => { txt(ch, x + units[i] * k / 2, base, size, { align: 'center', c: color }); x += units[i] * k + gap; });
}

function burnIn() {
  // A VCR menu burned into the phosphor long ago.
  const o = { w: 700, c: AMBER, a: 0.085 };
  txt('PRESS PLAY', 1008, 850, 44, { ...o, align: 'right' });
  txt('ON TAPE', 1008, 900, 44, { ...o, align: 'right' });
  cx.globalAlpha = o.a; cx.fillStyle = AMBER; cx.fillRect(72, 934, 936, 3); cx.globalAlpha = 1;
  txt('COUNTER 000', 72, 980, 30, { c: AMBER, a: o.a });
  txt('C90', 1008, 980, 30, { c: AMBER, a: o.a, align: 'right' });
}

function osd(t) {
  const a = seg(t, 0.84, 0.9) * (1 - seg(t, 1.32, 1.45));
  if (a <= 0) return;
  cx.globalAlpha = a;
  rrect(340, 176, 400, 96, 18); cx.fillStyle = 'rgba(0,36,18,0.55)'; cx.fill();
  cx.lineWidth = 3; cx.strokeStyle = OSD; cx.stroke();
  cx.globalAlpha = 1;
  txt('DEGAUSSING', 540, 222, 34, { w: 700, align: 'center', c: OSD, a });
  const filled = Math.floor(clamp((t - 0.88) / 0.5) * 12);
  for (let i = 0; i < 12; i++) {
    cx.globalAlpha = a * (i < filled ? 1 : 0.22);
    cx.fillStyle = OSD; cx.fillRect(388 + i * 26, 240, 18, 16);
  }
  cx.globalAlpha = 1;
}

const SUBTITLE = 'a mixed-space typeface', TYPE_AT = 2.56, TYPE_CPS = 27;
function sceneTitle(t) {
  txt('READY.', 72, 112, 38);
  if (blink(t, 1)) cursor(72 + measure('READY.', 38) + 10, 114, 22, 36);
  txt('C90  TYPE II', 1008, 112, 38, { align: 'right', c: DIM });
  burnIn();
  osd(t);
  txt('DEGAUSS', 540, WM_Y, WM_SIZE, { w: 700, align: 'center' });
  if (t > TYPE_AT) {
    const n = clamp(Math.floor((t - TYPE_AT) * TYPE_CPS), 0, SUBTITLE.length);
    const x0 = 540 - measure(SUBTITLE, 62) / 2;
    txt(SUBTITLE.slice(0, n), x0, SUB_Y, 62);
    if (n < SUBTITLE.length || blink(t, 1.25)) cursor(x0 + measure(SUBTITLE.slice(0, n), 62) + 6, SUB_Y + 6, 28, 58);
  }
}

const WORD = 'firmware'; // C45 C30 C45 C90 C90 C60 C45 C60: all four classes
function sceneWidths(u) {
  const m = u < 1.1 ? 0 : easeOutBack(clamp((u - 1.1) / 0.5));
  const mc = clamp(m);
  const monoA = 1 - seg(u, 1.02, 1.12), mixA = seg(u, 1.1, 1.22);
  txt('monospace', 540, 200, 70, { w: 700, align: 'center', c: DIM, a: monoA });
  txt('every glyph forced into one cell', 540, 262, 40, { align: 'center', c: FAINT, a: monoA });
  txt('mixed-space', 540, 200, 70, { w: 700, align: 'center', a: mixA });
  txt('four fixed widths', 540, 262, 40, { align: 'center', c: AMBER, a: mixA });
  const size = 196, k = size / 1000;
  const units = [...WORD].map(adv);
  const widths = units.map(w => lerp(600, w, m) * k);
  let x = 540 - widths.reduce((s, w) => s + w, 0) / 2;
  const top = 350, bottom = 628, base = 574;
  units.forEach((unit, i) => {
    const w = widths[i];
    rrect(x + 3, top, w - 6, bottom - top, 14);
    cx.lineWidth = 2; cx.strokeStyle = `rgba(255,231,191,${0.30 - 0.14 * mc})`; cx.stroke();
    // In the monospace state wide glyphs are squeezed and narrow ones float.
    const sx = lerp(Math.min(1, 600 / unit), 1, mc);
    cx.save(); cx.translate(x + w / 2, base); cx.scale(sx, 1);
    txt(WORD[i], 0, 0, size, { align: 'center' }); cx.restore();
    rrect(x + 6, 652, w - 12, 16, 8); cx.fillStyle = mix('#5b4633', CLS[unit], mc); cx.fill();
    txt('C' + unit / 10, x + w / 2, 712, 26, { w: 700, align: 'center', c: CLS[unit], a: seg(u, 1.45, 1.6) });
    x += w;
  });
  if (u > 2.1) legend(u - 2.1);
}

function legend(v) {
  let x = 60;
  [300, 450, 600, 900].forEach((c, i) => {
    const full = c / 150 * 60, a = clamp((v - i * 0.08) / 0.12);
    txt('C' + c / 10, x, 818, 32, { w: 700, c: CLS[c], a });
    rrect(x, 836, full * easeOut(clamp((v - i * 0.08) / 0.28)), 30, 15); cx.fillStyle = CLS[c]; cx.fill();
    txt(String(c), x, 902, 26, { c: DIM, a });
    x += full + 20;
  });
  txt('2 : 3 : 4 : 6', 540, 982, 42, { w: 700, align: 'center', a: seg(v, 0.5, 0.65) });
}

const LIGS = [
  ['->', 'Rust  C++  PHP'], ['!=', 'every language'], ['=>', 'JavaScript  Scala'], ['|>', 'Elixir  F#  Elm'],
  ['===', 'JavaScript  Ruby'], ['<=', 'every language'], ['<>', 'SQL  Haskell'],
];
const LIG_AT = 0.16; // seconds into each beat when the characters fuse
function sceneLigatures(u) {
  txt('60 coding ligatures', 540, 190, 66, { w: 700, align: 'center' });
  txt('each character keeps its own width', 540, 250, 40, { align: 'center', c: DIM });
  const b = Math.min(LIGS.length - 1, Math.floor(u / BEAT)), v = u - b * BEAT;
  const [seq, langs] = LIGS[b];
  const size = 300, base = 632;
  if (v < LIG_AT) {
    rawRun(seq, 540, base, size, 40, DIM);
    chip('calt off', FAINT);
  } else {
    const pop = 1 + 0.16 * (1 - easeOut(clamp((v - LIG_AT) / 0.16)));
    cx.save(); cx.translate(540, base - 90); cx.scale(pop, pop);
    txt(seq, 0, 90, size, { align: 'center' });
    cx.restore();
    chip('calt on', AMBER);
  }
  rawRun(seq, 540, 780, 48, 12, FAINT);
  txt(langs, 540, 866, 42, { align: 'center', c: AMBER });
  for (let i = 0; i < LIGS.length; i++) {
    cx.beginPath(); cx.arc(540 + (i - 3) * 34, 962, i === b ? 9 : 6, 0, Math.PI * 2);
    cx.fillStyle = i <= b ? CORE : '#4a3a2c'; cx.fill();
  }
}
function chip(label, color) {
  const w = measure(label, 30) + 38;
  rrect(540 - w / 2, 298, w, 48, 14); cx.lineWidth = 2; cx.strokeStyle = color; cx.stroke();
  txt(label, 540, 332, 30, { align: 'center', c: color });
}

const GLYPHS = ['0', '@', '&', 'g', 'Ж', 'λ', 'ß', 'Ω', '⏻', '⏵', '∞', 'Æ', '?', '₿', '⌘', 'Ψ'];
const TINTS = [CORE, GREEN, ICE, AMBER];
const SLOT = BEAT / 4;
function sceneRoulette(u) {
  const i = Math.min(GLYPHS.length - 1, Math.floor(u / SLOT));
  txt('LATIN  GREEK  CYRILLIC  CODE  TERMINAL', 540, 120, 36, { align: 'center', c: DIM });
  txt(GLYPHS[i], 540, 742, 560, { w: i % 2 ? 700 : 400, align: 'center', c: TINTS[i % TINTS.length] });
  txt('913 glyphs', 540, 980, 60, { w: 700, align: 'center' });
}

const URL_TEXT = 'ealdent.github.io/the-grove/utils/degauss.html', URL_AT = 0.64, URL_CPS = 70;
function sceneEnd(u, still = false) {
  const a = (s, e) => still ? 1 : seg(u, s, e);
  txt('DEGAUSS', 540, WM_Y, WM_SIZE, { w: 700, align: 'center', a: a(0, 0.1) });
  txt('a free mixed-space font', 540, SUB_Y, 62, { align: 'center', a: a(0.2, 0.32) });
  const top = a(0.2, 0.3);
  if (still || blink(u, 1)) { cx.globalAlpha = top; cx.beginPath(); cx.arc(86, 100, 13, 0, Math.PI * 2); cx.fillStyle = REC; cx.fill(); cx.globalAlpha = 1; }
  txt('OUT NOW', 112, 114, 38, { w: 700, a: top });
  txt('MIT  v1.0', 1008, 114, 38, { align: 'right', c: DIM, a: top });
  const parts = [2, 3, 4, 6].map(r => r / 15 * 840), grow = a(0.36, 0.52);
  let x = 120;
  [300, 450, 600, 900].forEach((c, i) => {
    cx.fillStyle = CLS[c]; cx.fillRect(x, 666, parts[i] * clamp(grow * 4 - i), 18);
    x += parts[i];
  });
  txt('Regular + Bold    TTF  OTF  WOFF2', 540, 772, 42, { align: 'center', c: DIM, a: a(0.5, 0.62) });
  const n = still ? URL_TEXT.length : clamp(Math.floor((u - URL_AT) * URL_CPS), 0, URL_TEXT.length);
  const x0 = 540 - measure(URL_TEXT, 38) / 2;
  if (n > 0) txt(URL_TEXT.slice(0, n), x0, 884, 38);
  if (!still && u > URL_AT && (n < URL_TEXT.length || blink(u, 1.25))) cursor(x0 + measure(URL_TEXT.slice(0, n), 38) + 6, 890, 18, 38);
}

function paint(canvas, draw) {
  cx = canvas.getContext('2d');
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = '#000'; cx.fillRect(0, 0, CW, CW);
  cx.setTransform(S, 0, 0, S, 0, 0);
  draw();
  cx = scene.getContext('2d');
}
function drawScene(t) {
  paint(scene, () => {
    if (t < 3.5) sceneTitle(t);
    else if (t < 7.0) sceneWidths(t - 3.5);
    else if (t < 10.5) sceneLigatures(t - 7.0);
    else if (t < 12.5) sceneRoulette(t - 10.5);
    else sceneEnd(t - 12.5);
  });
}

// --- tube parameters over time ------------------------------------------------------------------
// The loop point is the power-off dot with the end card's afterglow behind it,
// so the last frame runs straight back into the first.
const GHOST = 0.11;
function tube(t) {
  const P = { sx: 1, sy: 1, vis: 1, lineW: 0, lineI: 0, dotI: 0, flash: 0, magnet: 0, wob: 0, phase: 0,
              stat: 0, persist: 0.6, bright: 1, ghost: 0 };
  if (t < 0.5) {                                   // power-on: dot, line, picture
    P.persist = 0.8;
    P.ghost = GHOST * (1 - smooth(seg(t, 0.22, 0.36)));
    if (t < 0.1) { P.vis = 0; P.dotI = lerp(0.45, 1.1, t / 0.1); }
    else if (t < 0.22) { P.vis = 0; const k = easeOut((t - 0.1) / 0.12); P.lineW = k; P.lineI = 1.3; P.dotI = 1.1 * (1 - k); }
    else {
      const k = clamp((t - 0.22) / 0.2);
      P.sy = Math.max(0.004, easeOutBack(k)); P.lineW = 1; P.lineI = 1.3 * (1 - clamp(k * 2.5));
      P.bright = 1 + 1.2 * (1 - k);
      if (t > 0.3) P.flash = 0.42 * Math.exp(-(t - 0.3) * 13);
    }
  }
  P.magnet = t < 1.0 ? smooth(seg(t, 0.3, 0.55)) : Math.pow(Math.max(0, 1 - (t - 1.0) / 1.15), 2);
  if (t >= 1.0 && t < 3.0) {                       // the degauss
    const d = t - 1.0;
    P.wob = Math.exp(-d * 2.2) * smooth(clamp(d / 0.04)) * (1 - smooth(seg(d, 1.3, 1.9)));
    P.phase = d * Math.PI * 2 * 5.4;
    P.flash += 0.35 * Math.exp(-d * 11);
    P.persist = 0.84;
  }
  for (const c of [3.5, 7.0, 10.5]) {             // channel flips between scenes
    if (t >= c - 0.03 && t < c + 0.06) P.stat = 0.8 * (1 - clamp((t - (c - 0.03)) / 0.09));
  }
  if (t >= 10.5 && t < 12.5) { P.persist = 0.45; if ((t - 10.5) % SLOT < 1.2 / FPS) P.stat = Math.max(P.stat, 0.3); }
  if (t >= 7.0 && t < 10.5) { const v = (t - 7.0) % BEAT; if (v >= LIG_AT && v < LIG_AT + 0.08) P.flash += 0.16 * (1 - (v - LIG_AT) / 0.08); }
  if (t >= 12.5 && t < 12.8) P.flash += 0.38 * Math.exp(-(t - 12.5) * 14);
  if (t >= 14.5) {                                 // power-off: line, dot, afterglow
    const d = t - 14.5;
    P.persist = 0.78;
    P.ghost = GHOST * smooth(seg(d, 0.12, 0.26));
    if (d < 0.12) { const k = d / 0.12; P.sy = lerp(1, 0.004, easeIn(k)); P.bright = 1 + 1.6 * k; P.lineW = 1; P.lineI = 1.4 * k; }
    else if (d < 0.24) { const k = (d - 0.12) / 0.12; P.vis = 0; P.lineW = 1 - easeIn(k); P.lineI = 1.4; P.dotI = 1.1 * k; }
    else { P.vis = 0; P.dotI = lerp(1.1, 0.45, (d - 0.24) / 0.26); }
  }
  return P;
}

// --- WebGL2 picture tube -----------------------------------------------------------------------------
const glc = document.getElementById('gl');
const gl = glc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
const VS = `#version 300 es
in vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }`;
const FS_TUBE = `#version 300 es
precision highp float;
uniform sampler2D uScene, uPrev, uGhost;
uniform vec2 uRes;
uniform float uTime, uSx, uSy, uVis, uLineW, uLineI, uDotI, uFlash, uMagnet, uWob, uPhase, uStatic, uPersist, uBright, uGhostA, uSeed;
out vec4 frag;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec3 hue(vec3 c, float a) {
  float Y = dot(c, vec3(0.299, 0.587, 0.114));
  float I = dot(c, vec3(0.596, -0.274, -0.322));
  float Q = dot(c, vec3(0.211, -0.523, 0.312));
  float h = atan(Q, I) + a, ch = length(vec2(I, Q));
  I = ch * cos(h); Q = ch * sin(h);
  return vec3(Y + 0.956 * I + 0.621 * Q, Y - 0.272 * I - 0.647 * Q, Y - 1.106 * I + 1.703 * Q);
}
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = uv * 2.0 - 1.0;
  vec2 pc = p * (1.0 + 0.055 * dot(p, p));                      // curved glass
  vec2 e = abs(pc) - vec2(0.955);
  float edge = length(max(e + 0.1, 0.0)) - 0.1;
  float mask = 1.0 - smoothstep(-0.014, 0.004, edge);
  float w = uWob;
  vec2 q = pc;                                                   // the degauss field bends the raster
  q.x += w * (0.06 * sin(q.y * 3.1 + uPhase) + 0.028 * sin(q.y * 7.3 - uPhase * 1.7));
  q.y += w * 0.048 * sin(q.x * 2.6 - uPhase * 1.2);
  q *= vec2(1.0 + w * 0.06 * sin(uPhase * 0.9), 1.0 - w * 0.05 * sin(uPhase * 1.1));
  q /= vec2(max(uSx, 1e-3), max(uSy, 1e-3));
  vec2 cuv = vec2(q.x * 0.5 + 0.5, 0.5 - q.y * 0.5);
  float inside = step(0.0, cuv.x) * step(cuv.x, 1.0) * step(0.0, cuv.y) * step(cuv.y, 1.0);
  vec2 ca = pc * (0.0018 + w * 0.011) + vec2(w * 0.007 * sin(uPhase * 1.3), 0.0);
  vec3 col = vec3(texture(uScene, cuv + ca).r, texture(uScene, cuv).g, texture(uScene, cuv - ca).b);
  vec3 glow = textureLod(uScene, cuv, 3.0).rgb * 0.5 + textureLod(uScene, cuv, 4.5).rgb * 0.55 + textureLod(uScene, cuv, 6.0).rgb * 0.55;
  col = (col + glow * 0.8) * inside * uVis;
  float field = uMagnet * (1.7 * sin(pc.x * 2.3 + 0.8) * cos(pc.y * 1.9 - 0.5) + 0.9 * sin(pc.x * 4.1 - pc.y * 3.3 + uTime * 0.9));
  field += w * 3.4 * sin(uPhase * 0.7 + pc.x * 2.2 + pc.y * 1.6);  // purity blotches
  vec3 purity = 0.5 + 0.5 * cos(field * 1.3 + vec3(0.0, 2.1, 4.2));
  col = max(hue(col, field), 0.0) * mix(vec3(1.0), purity * 1.6, clamp(uMagnet + w * 1.5, 0.0, 1.0) * 0.55) * uBright;
  vec2 guv = vec2(pc.x * 0.5 + 0.5, 0.5 - pc.y * 0.5);           // afterglow of the last picture
  col += textureLod(uGhost, guv, 1.6).rgb * vec3(1.0, 0.74, 0.5) * uGhostA;
  float lx = 1.0 - smoothstep(uLineW - 0.03, uLineW + 0.03, abs(p.x));
  float yPix = p.y * uRes.y * 0.5;
  col += vec3(1.0, 0.93, 0.82) * uLineI * lx * (exp(-pow(yPix / 2.6, 2.0)) + 0.4 * exp(-pow(yPix / 16.0, 2.0)));
  float dr = length(p * uRes * 0.5);
  col += vec3(1.0, 0.95, 0.88) * uDotI * (1.5 * exp(-pow(dr / 8.0, 2.0)) + 0.45 * exp(-pow(dr / 42.0, 2.0)));
  col *= 0.87 + 0.13 * cos(gl_FragCoord.y * 3.14159265 / 3.0);  // scanlines, 6 px pitch
  float n = hash(gl_FragCoord.xy + vec2(uSeed * 17.0, uSeed * 31.0));
  col += uFlash * vec3(1.0, 0.94, 0.84) * mask;
  col = mix(col, vec3(n * 0.95), uStatic * mask);
  col += (n - 0.5) * 0.03 * mask;
  col += vec3(0.02, 0.017, 0.014) * mask;                       // phosphor black is never black
  col += vec3(0.022, 0.024, 0.026) * (1.0 - smoothstep(0.0, 0.75, length((pc - vec2(-0.5, 0.58)) * vec2(1.0, 1.7)))) * mask;
  col *= mix(1.0, 1.0 - smoothstep(0.45, 1.6, length(pc)), 0.55);
  col *= mask;
  col = max(col, texture(uPrev, uv).rgb * uPersist);             // phosphor persistence
  frag = vec4(col, 1.0);
}`;
const FS_COPY = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uRes; out vec4 frag;
void main() { frag = vec4(texture(uSrc, gl_FragCoord.xy / uRes).rgb, 1.0); }`;

function program(fs) {
  const p = gl.createProgram();

}
window.__audio = async () => {
  const ctx = new OfflineAudioContext(2, 48000 * DURATION, 48000);
  buildScore(ctx);
  const { chunks, peak } = wavBase64(await ctx.startRendering());
  window.__wav = chunks;
  return { chunks: chunks.length, peak };
};

// --- boot -------------------------------------------------------------------------------------------
window.__ready = false;
Promise.all([document.fonts.load('400 40px Degauss'), document.fonts.load('700 40px Degauss')]).then(() => {
  const ghost = makeCanvas();
  paint(ghost, () => sceneEnd(0, true));
  gl.activeTexture(gl.TEXTURE2); upload(ghostTex, ghost);
  const t = new URLSearchParams(location.search).get('t');
  if (t !== null) renderFrame(Math.round(Number(t) * FPS));
  window.__ready = true;
});
</script>
