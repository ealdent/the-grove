<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixiecast — a very small person, dressed by your weather</title>
<meta name="description" content="A modern take on the WeatherPixie: a cartoon pixie whose outfit encodes your current local weather. Single file, no install, no tracking.">
<style>
:root {
  --accent: #3a9d8a;
  --page-a: #f3eee4;
  --page-b: #e9e2d4;
  --page-ink: #2b2622;
  --page-muted: rgba(43, 38, 34, .62);
  --paper: #fffdf8;
  --ink: #2b2622;
  --muted: #7b736a;
  --line: rgba(43, 38, 34, .12);
  --sky-a: #4d9fdf;
  --sky-b: #c5e6f8;
  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--sans);
  color: var(--page-ink);
  background: linear-gradient(180deg, var(--page-a), var(--page-b)) fixed;
  min-height: 100vh;
  transition: background .9s ease, color .9s ease;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.page { max-width: 1060px; margin: 0 auto; padding: clamp(14px, 3vw, 34px) clamp(14px, 3vw, 28px) 40px; }

/* ---------- masthead ---------- */
.masthead {
  display: grid;
  grid-template-columns: 1fr minmax(260px, 360px) auto;
  gap: 14px 22px;
  align-items: end;
  margin-bottom: 20px;
}
.back { grid-column: 1 / -1; font-size: 13px; color: var(--page-muted); text-decoration: none; letter-spacing: .02em; }
.back:hover { color: var(--accent); }
h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-style: italic;
  font-size: clamp(36px, 5.2vw, 56px);
  letter-spacing: -.025em;
  line-height: .95;
  margin: 0;
}
.tag { margin: 8px 0 0; color: var(--page-muted); font-size: 15px; line-height: 1.4; max-width: 44ch; }
.tag a { color: inherit; }

.finder { position: relative; }
.field {
  display: flex; align-items: center; gap: 6px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 4px 4px 16px;
  box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 12px 28px -18px rgba(20,15,10,.45);
}
.field input {
  flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
  font: inherit; font-size: 15px; color: var(--ink);
}
.field input::-webkit-search-cancel-button { -webkit-appearance: none; }
.field button {
  border: 0; width: 36px; height: 36px; border-radius: 999px; cursor: pointer;
  background: var(--accent); color: #fff; display: grid; place-items: center;
  transition: transform .15s ease, filter .15s ease;
}
.field button:hover { filter: brightness(1.08); transform: scale(1.04); }
.field button svg { width: 18px; height: 18px; }
.field button.busy svg { animation: spin 1.2s linear infinite; }
.status { position: absolute; left: 18px; top: calc(100% + 5px); font-size: 12px; color: var(--page-muted); }
.suggest {
  position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 20;
  list-style: none; margin: 0; padding: 6px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 24px 48px -24px rgba(20,15,10,.5);
  color: var(--ink);
}
.suggest li { padding: 9px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
.suggest li small { color: var(--muted); white-space: nowrap; }
.suggest li[aria-selected="true"], .suggest li:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }

.units {
  display: inline-flex; padding: 3px; border-radius: 999px;
  background: var(--paper); border: 1px solid var(--line);
}
.units button {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  font-size: 13px; padding: 7px 13px; border-radius: 999px;
}
.units button.on { background: var(--ink); color: var(--paper); }

/* ---------- card ---------- */
.card {
  display: grid;
  grid-template-columns: minmax(280px, 400px) 1fr;
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 40px 70px -48px rgba(30,25,20,.55);
}
.scene-wrap {
  padding: 18px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--sky-b) 40%, var(--paper)), var(--paper) 70%);
}
.scene {
  aspect-ratio: 360 / 440;
  border-radius: 20px;
  overflow: hidden;
  background: var(--sky-b);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), 0 18px 30px -24px rgba(0,0,0,.45);
}
.scene svg { display: block; width: 100%; height: 100%; }
.caption {
  margin-top: 12px;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px;
}
.report {
  padding: clamp(22px, 3vw, 34px) clamp(20px, 3.4vw, 40px);
  display: flex; flex-direction: column; gap: 22px;
  min-width: 0;
}
.report h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(22px, 2.6vw, 28px); margin: 0; letter-spacing: -.01em; }
.report h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.when { color: var(--muted); font-size: 14px; margin-top: 4px; }
.now { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.temp { font-family: var(--serif); font-size: clamp(64px, 8vw, 92px); line-height: .85; letter-spacing: -.05em; }
.cond .label { font-size: 18px; font-weight: 500; }
.cond .feels { color: var(--muted); font-size: 14px; margin-top: 4px; }
.note { font-family: var(--serif); font-size: clamp(17px, 1.9vw, 20px); line-height: 1.45; margin: 0; text-wrap: pretty; }

.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chips button {
  --swatch: var(--accent);
  display: inline-flex; align-items: baseline; gap: 8px;
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 999px; padding: 6px 12px 6px 10px; cursor: pointer; font-size: 13.5px;
  transition: border-color .15s ease, background .15s ease;
}
.chips button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--swatch); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); align-self: center; }
.chips button span { color: var(--muted); font-size: 12px; }
.chips button:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.chips .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }

.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px 16px; margin: 0; }
.facts div { border-top: 1px solid var(--line); padding-top: 8px; }
.facts dt { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.facts dd { margin: 3px 0 0; font-size: 15.5px; }
.facts dd small { color: var(--muted); font-size: 12px; }

.strip { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.hour {
  flex: 0 0 58px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 4px 8px; border-radius: 14px; font-size: 12px;
  background: color-mix(in srgb, var(--accent) 7%, transparent);
}
.hour .h { color: var(--muted); font-size: 11px; }
.hour svg { width: 22px; height: 22px; }
.hour .t { font-weight: 600; }
.hour .p { color: var(--accent); font-size: 11px; }
.upcoming { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.upcoming b { color: var(--ink); font-weight: 600; }

.empty { display: flex; flex-direction: column; gap: 14px; }
.empty .actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--ink); color: var(--paper);
  border-radius: 999px; padding: 9px 16px; cursor: pointer; font-size: 14px;
}
.btn.ghost { background: transparent; color: var(--ink); }

/* ---------- footer ---------- */
.foot {
  margin-top: 24px; font-size: 13px; color: var(--page-muted);
  display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center;
}
.foot a { color: inherit; }
.dressup { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dressup button {
  border: 1px dashed color-mix(in srgb, currentColor 40%, transparent); background: transparent; color: inherit;
  border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px;
}
.dressup button:hover, .dressup button.on { border-style: solid; background: var(--paper); color: var(--ink); }

/* ---------- scene animation ---------- */
.wing { animation: flutter 1.1s ease-in-out infinite; transform-box: fill-box; }
.wl { transform-origin: right center; }
.wr { transform-origin: left center; animation-delay: -.55s; }
.windy .wing { animation-duration: .45s; }
@keyframes flutter { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.5); } }
.rays { animation: spin 90s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.cloud { animation: drift 34s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translateX(-16px); } to { transform: translateX(16px); } }
.rain line { animation: fall 1s linear infinite; }
@keyframes fall { from { transform: translateY(-460px); } to { transform: translateY(0); } }
.snow circle { animation: snowfall 7s linear infinite; }
@keyframes snowfall { from { transform: translate(0, -470px); } 50% { transform: translate(12px, -235px); } to { transform: translate(-4px, 0); } }
.star { animation: twinkle 2.6s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .2; } to { opacity: 1; } }
.flash, .bolt { opacity: 0; animation: flash 9s linear infinite; }
@keyframes flash { 0%, 88%, 90.5%, 100% { opacity: 0; } 88.8%, 90% { opacity: .8; } }
.shiver { animation: shiver .17s linear infinite; }
@keyframes shiver { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-1.3px); } 70% { transform: translateX(1.3px); } }
.drip { animation: drip 1.7s ease-in infinite; }
@keyframes drip { 0% { transform: translateY(0); opacity: 0; } 25% { opacity: .95; } 100% { transform: translateY(16px); opacity: 0; } }
.puff { animation: puff 2.6s ease-out infinite; transform-box: fill-box; transform-origin: left center; }
@keyframes puff { 0% { transform: scale(.3); opacity: 0; } 25% { opacity: .85; } 100% { transform: scale(1.4) translateX(10px); opacity: 0; } }
.steam { animation: steam 2.2s ease-in-out infinite; }
@keyframes steam { 0% { transform: translateY(0); opacity: 0; } 35% { opacity: .85; } 100% { transform: translateY(-14px); opacity: 0; } }
.flap { animation: flap .55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
@keyframes flap { from { transform: rotate(-5deg); } to { transform: rotate(6deg); } }
.lamp { animation: lamp 1.4s ease-in-out infinite alternate; }
@keyframes lamp { from { opacity: .65; } to { opacity: 1; } }
.dust { animation: twinkle 1.7s ease-in-out infinite alternate; }
.ripple { animation: ripple 1.9s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ripple { from { transform: scale(.15); opacity: .9; } to { transform: scale(1); opacity: 0; } }
.fogband { animation: fogdrift 26s ease-in-out infinite alternate; }
@keyframes fogdrift { from { transform: translateX(-34px); } to { transform: translateX(34px); } }
.hl { animation: hl .7s ease-in-out 3; }
@keyframes hl { 50% { opacity: .1; } }
@media (prefers-reduced-motion: reduce) {
  .scene * { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
  body { transition: none; }
}

@media (max-width: 820px) {
  .masthead { grid-template-columns: 1fr auto; }
  .finder { grid-column: 1 / -1; }
  .units { justify-self: start; }
  .card { grid-template-columns: 1fr; }
  .scene-wrap { padding: 14px 14px 10px; }
  .scene { max-width: 420px; margin: 0 auto; }
  .caption { justify-content: center; text-align: center; }
}
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <a class="back" href="./">&larr; utils</a>
    <div class="brand">
      <h1>Pixiecast</h1>
      <p class="tag">A very small person, dressed by your weather. In the spirit of <a href="https://web.archive.org/web/2005/http://www.weatherpixie.com/" rel="noopener">weatherpixie.com</a>, 2002&ndash;2012.</p>
    </div>
    <form class="finder" id="finder" role="search" autocomplete="off">
      <label class="sr-only" for="q">Find a place</label>
      <div class="field">
        <input id="q" type="search" placeholder="Search a town, city, or village…" spellcheck="false" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
        <button type="button" id="locate" title="Use my location" aria-label="Use my location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
        </button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <ul id="suggest" class="suggest" role="listbox" hidden></ul>
    </form>
    <div class="units" role="group" aria-label="Temperature units">
      <button type="button" data-unit="f" class="on" aria-pressed="true">&deg;F</button>
      <button type="button" data-unit="c" aria-pressed="false">&deg;C</button>
    </div>
  </header>

  <main class="card" id="card">
    <section class="scene-wrap">
      <div class="scene" id="scene"></div>
      <div class="caption" id="caption"><span>PIXIECAST</span><span>GETTING DRESSED</span></div>
    </section>
    <section class="report" id="report" aria-live="polite"></section>
  </main>

  <footer class="foot">
    <div class="dressup" id="dressup"><span>Dress-up:</span></div>
    <div>Weather by <a href="https://open-meteo.com/" rel="noopener">Open-Meteo</a> &middot; place names by <a href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap</a> &middot; nothing installed, nothing tracked; your last place stays in this browser.</div>
  </footer>
</div>
<script>
(() => {
'use strict';
/* ============================================================
   Pixiecast — a very small person, dressed by your weather.
   Single file. Runtime data: Open-Meteo (forecast + geocoding),
   OpenStreetMap Nominatim (reverse geocode for browser location).
   ============================================================ */

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const r1 = n => Math.round(n * 10) / 10;

// Deterministic PRNG so particles don't reshuffle on every re-render.
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ---------- colours
const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgb2hex = rgb => '#' + rgb.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => lerp(v, B[i], t))); };
const luma = h => { const [r, g, b] = hex2rgb(h); return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; };

// ---------- state & units
const state = { unit: 'f', place: null, data: null, demo: null, timer: null };
const cToF = c => c * 9 / 5 + 32;
const fmtT = c => Math.round(state.unit === 'f' ? cToF(c) : c) + '°';
const deg = f => (state.unit === 'f' ? Math.round(f) : Math.round((f - 32) * 5 / 9)) + '°';   // a threshold stated in °F, shown in the user's unit
const fmtWind = kmh => state.unit === 'f' ? Math.round(kmh / 1.609) + ' mph' : Math.round(kmh) + ' km/h';
const fmtMm = mm => state.unit === 'f' ? (mm / 25.4 < 0.01 ? '0' : (mm / 25.4).toFixed(2).replace(/^0/, '')) + ' in' : mm.toFixed(1) + ' mm';
const DIRS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
const compass = d => DIRS[Math.round((d % 360) / 22.5) % 16];

// ---------- WMO weather codes → label, kind, intensity
const WMO = {
  0: ['Clear sky', 'clear', 0], 1: ['Mainly clear', 'clear', 0], 2: ['Partly cloudy', 'cloudy', 0], 3: ['Overcast', 'overcast', 0],
  45: ['Fog', 'fog', 1], 48: ['Rime fog', 'fog', 2],
  51: ['Light drizzle', 'drizzle', 1], 53: ['Drizzle', 'drizzle', 2], 55: ['Dense drizzle', 'drizzle', 3],
  56: ['Freezing drizzle', 'freezing', 1], 57: ['Dense freezing drizzle', 'freezing', 2],
  61: ['Light rain', 'rain', 1], 63: ['Rain', 'rain', 2], 65: ['Heavy rain', 'rain', 3],
  66: ['Freezing rain', 'freezing', 2], 67: ['Heavy freezing rain', 'freezing', 3],
  71: ['Light snow', 'snow', 1], 73: ['Snow', 'snow', 2], 75: ['Heavy snow', 'snow', 3], 77: ['Snow grains', 'snow', 1],
  80: ['Light showers', 'showers', 1], 81: ['Showers', 'showers', 2], 82: ['Violent showers', 'showers', 3],
  85: ['Snow showers', 'snow', 1], 86: ['Heavy snow showers', 'snow', 3],
  95: ['Thunderstorm', 'storm', 2], 96: ['Thunderstorm with hail', 'storm', 3], 99: ['Thunderstorm with heavy hail', 'storm', 3],
};
const wmo = code => { const w = WMO[code] || ['Weather', 'cloudy', 0]; return { label: w[0], kind: w[1], intensity: w[2] }; };
const WET = new Set(['drizzle', 'rain', 'showers', 'storm', 'freezing']);

// ---------- local-time helpers (Open-Meteo returns wall-clock strings for the place's own zone)
const mins = iso => +iso.slice(11, 13) * 60 + +iso.slice(14, 16);
const hourLabel = iso => { const h = +iso.slice(11, 13); return (h % 12 || 12) + (h < 12 ? ' AM' : ' PM'); };
const clock = iso => { const h = +iso.slice(11, 13); return (h % 12 || 12) + ':' + iso.slice(14, 16) + (h < 12 ? ' AM' : ' PM'); };
const weekday = iso => new Date(iso.slice(0, 10) + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long' });
const hourIndex = (data, iso) => { const k = iso.slice(0, 13); const i = data.hourly.time.findIndex(t => t.slice(0, 13) === k); return i < 0 ? 0 : i; };

// Moon phase fraction: 0 new, .25 first quarter, .5 full, .75 last quarter.
function moonPhase(date) {
  const synodic = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  let p = ((date - ref) / 86400000 / synodic) % 1;
  return p < 0 ? p + 1 : p;
}

// ---------- conditions model: one flat object per moment (current, or hourly index hi)
function conditions(data, hi = null) {
  const c = data.current, H = data.hourly, D = data.daily;
  const cur = hi === null;
  const iso = cur ? c.time : H.time[hi];
  const ci = hourIndex(data, iso);
  const pick = (cf, hf) => cur ? c[cf] : (H[hf || cf] ? H[hf || cf][hi] : c[cf]);
  const tempC = pick('temperature_2m');
  const feelsC = pick('apparent_temperature') ?? tempC;
  const w = wmo(pick('weather_code'));
  const windKmh = pick('wind_speed_10m') ?? 0;
  const gustKmh = pick('wind_gusts_10m') ?? windKmh * 1.4;
  const di = Math.max(0, D.time.indexOf(iso.slice(0, 10)));
  const sr = mins(D.sunrise[di]), ss = mins(D.sunset[di]), m = mins(iso);
  let phase = 'day';
  if (m < sr - 40 || m > ss + 40) phase = 'night';
  else if (m <= sr + 40) phase = 'dawn';
  else if (m > ss) phase = 'dusk';
  else if (m >= ss - 60) phase = 'golden';
  const nightLen = 1440 - ss + sr;
  const nightT = m > ss ? (m - ss) / nightLen : (m + 1440 - ss) / nightLen;
  return {
    iso, tempC, feelsC, feelsF: cToF(feelsC), code: pick('weather_code'), ...w,
    windKmh, windMph: windKmh / 1.609, gustKmh, gustMph: gustKmh / 1.609, windDir: pick('wind_direction_10m') ?? 0,
    cloud: pick('cloud_cover') ?? 50, isDay: !!pick('is_day'), humidity: pick('relative_humidity_2m') ?? 50,
    precipMm: pick('precipitation') ?? 0, prob: H.precipitation_probability[ci] ?? 0, uv: H.uv_index[ci] ?? 0,
    phase, sunT: clamp((m - sr) / (ss - sr), 0, 1), nightT: clamp(nightT, 0, 1),
    sunrise: D.sunrise[di], sunset: D.sunset[di], hi: D.temperature_2m_max[di], lo: D.temperature_2m_min[di],
    uvMax: D.uv_index_max[di], probMax: D.precipitation_probability_max[di],
    moon: moonPhase(new Date()), late: m >= 23 * 60 || m < 5 * 60,
    wet: WET.has(w.kind), snowy: w.kind === 'snow',
  };
}

// ---------- wardrobe palette (shared by the drawing and the chips' swatches)
const SKIN = '#f4cba7', SKIN_D = '#dda583', HAIR = '#2fa38f', HAIR_D = '#217f6e', BLUSH = '#f0908f';
const COL = {
  tank: '#f2745b', tee: '#fbf7ef', stripes: '#f5f1e8', stripesLine: '#2c3e73', sweater: '#d9a441', sweaterD: '#b9862d',
  coat: '#6b3a5e', coatD: '#522b48', parka: '#2d5aa8', parkaD: '#234a8c', raincoat: '#f7c948', raincoatD: '#d9a520',
  shorts: '#5b7fb5', skirt: '#c2673f', pants: '#7c7a4c', pantsD: '#62603a', snowpants: '#2a3f6e',
  sandals: '#8a5a3b', sneakers: '#fbf7ef', sneakersToe: '#e4574f', boots: '#6c4a2e', rainboots: '#d8382f', snowboots: '#5a6572',
  fur: '#f2ede4', beanie: '#3f8f5a', beanieD: '#2f6f45', pom: '#f2ede4', scarf: '#d8382f', scarf2: '#fbf7ef', mitten: '#d8382f',
  umbrella: '#d8382f', umbrella2: '#fbf1dc', sunhat: '#e8c27a', sunhatD: '#c9a25a', cap: '#3f6bb5', shades: '#1f1d24',
  lantern: '#4a4541', towel: '#f6e9d6', slipper: '#f2a5c0', mug: '#fbf7ef', earmuff: '#8a6c9e', fan: '#f2a5c0',
};

// ---------- the wardrobe rules: conditions → outfit + a reason for each garment
function dress(c) {
  const T = c.feelsF, W = c.windMph, t = fmtT(c.feelsC), uv = Math.round(c.uv);
  const o = { top: null, over: null, bottom: null, feet: null, hat: null, hood: false, earmuffs: false, scarf: null, mittens: false,
    shades: false, nose: false, hold: null, umbrella: null, hair: 'normal', face: 'content', fx: [], items: [], band: null };
  const add = (slot, id, label, why, color) => { o[slot] = id; o.items.push({ slot, id, label, why, color }); };
  const flag = (slot, label, why, color) => { o[slot] = true; o.items.push({ slot, id: slot, label, why, color }); };

  const band = o.band = T >= 90 ? 'scorch' : T >= 78 ? 'hot' : T >= 66 ? 'warm' : T >= 55 ? 'mild' : T >= 45 ? 'cool' : T >= 33 ? 'cold' : T >= 15 ? 'freezing' : 'arctic';

  // tops
  if (band === 'scorch') add('top', 'tank', 'coral tank top', 'feels like ' + t + '; anything more is a hazard', COL.tank);
  else if (band === 'hot' || band === 'warm') add('top', 'tee', 'toadstool tee', 'tee weather from ' + deg(66) + ' feels-like', COL.tee);
  else if (band === 'mild') add('top', 'stripes', 'breton stripes', 'long sleeves once it feels under ' + deg(66), COL.stripesLine);
  else if (band === 'cool') add('top', 'sweater', 'mustard sweater', 'the sweater line is ' + deg(55) + ' feels-like', COL.sweater);
  else if (band === 'cold') add('top', 'coat', 'plum wool coat', 'coat comes out under ' + deg(45), COL.coat);
  else add('top', 'parka', 'blue parka', 'parka below ' + deg(33) + ' feels-like', COL.parka);

  // bottoms
  if (band === 'scorch' || band === 'hot') add('bottom', 'shorts', 'denim shorts', 'legs out from ' + deg(78), COL.shorts);
  else if (band === 'warm') add('bottom', 'skirt', 'rust skirt', deg(66) + ' to ' + deg(78) + ' is skirt weather', COL.skirt);
  else if (band === 'freezing' || band === 'arctic') add('bottom', 'snowpants', 'puffy snow pants', 'below ' + deg(33) + ' the legs get insulation too', COL.snowpants);
  else add('bottom', 'pants', 'olive cords', 'trousers under ' + deg(66), COL.pants);

  // feet
  if (c.snowy || band === 'freezing' || band === 'arctic') add('feet', 'snowboots', 'fur-top snow boots', c.snowy ? 'snow in the air' : 'below ' + deg(33), COL.snowboots);
  else if (c.wet) add('feet', 'rainboots', 'red rain boots', c.label.toLowerCase() + ' right now', COL.rainboots);
  else if (band === 'scorch' || band === 'hot') add('feet', 'sandals', 'sandals', 'above ' + deg(78) + ' toes go free', COL.sandals);
  else if (band === 'warm' || band === 'mild') add('feet', 'sneakers', 'canvas sneakers', 'dry and between ' + deg(55) + ' and ' + deg(78), COL.sneakersToe);
  else add('feet', 'boots', 'brown boots', 'boots under ' + deg(55), COL.boots);

  // rain gear
  if (c.wet) {
    add('over', 'raincoat', 'yellow slicker', c.kind === 'drizzle' ? 'drizzle: slicker on, hood up' : c.label.toLowerCase() + ': slicker on', COL.raincoat);
    if (c.kind === 'drizzle' || c.kind === 'freezing' || W >= 40) { o.hood = true; o.items.push({ slot: 'hood', id: 'hood', label: 'hood up', why: c.kind === 'drizzle' ? 'drizzle does not earn an umbrella' : W >= 40 ? 'wind at ' + fmtWind(c.windKmh) + '; an umbrella would be a kite' : 'freezing rain: hood, not umbrella', color: COL.raincoatD }); }
    if (c.kind !== 'drizzle') {
      if (W >= 28) add('umbrella', 'inverted', 'the umbrella, inverted', 'wind at ' + fmtWind(c.windKmh) + ' has turned it into a bowl', COL.umbrella);
      else add('umbrella', 'up', 'red umbrella', c.kind === 'storm' ? 'thunderstorm; held with reservations' : c.label.toLowerCase() + ' with wind under ' + (state.unit === 'f' ? '28 mph' : '45 km/h'), COL.umbrella);
    }
  } else if (band === 'arctic') { o.hood = true; o.items.push({ slot: 'hood', id: 'hood', label: 'parka hood up', why: 'below ' + deg(15) + ' the hood is not optional', color: COL.parkaD }); }

  // hats (skipped when a hood is up)
  if (!o.hood) {
    if (band === 'scorch' && c.isDay) add('hat', 'sunhat', 'straw sun hat', 'sun and ' + t, COL.sunhat);
    else if (band === 'hot' && c.isDay && uv >= 5) add('hat', 'cap', 'ball cap', 'UV index ' + uv, COL.cap);
    else if (band === 'cold') add('hat', 'beanie', 'green beanie', 'ears get cold under ' + deg(45), COL.beanie);
    else if (band === 'freezing' || band === 'arctic') add('hat', 'pombeanie', 'pom beanie', 'below ' + deg(33) + ', with pom for morale', COL.beanie);
    if (band === 'freezing' || band === 'arctic') flag('earmuffs', 'earmuffs', 'below ' + deg(33) + ' the ears file a complaint', COL.earmuff);
  }

  // scarf, mittens, sun
  if (T < 15) add('scarf', 'bigscarf', 'the enormous scarf', 'under ' + deg(15) + ' the scarf goes over the nose', COL.scarf);
  else if (T < 45) add('scarf', 'scarf', 'striped scarf', 'scarf line: ' + deg(45) + ' feels-like', COL.scarf);
  if (T < 33) flag('mittens', 'red mittens', 'fingers below ' + deg(33), COL.mitten);
  if (c.isDay && !c.wet && uv >= 3 && (c.kind === 'clear' || c.kind === 'cloudy')) flag('shades', 'sunglasses', 'UV index ' + uv + '; squinting is not a strategy', COL.shades);
  if (c.isDay && uv >= 8) flag('nose', 'sunscreen nose', 'UV ' + uv + ' burns pixies too', '#fff');

  // one free hand
  if (o.umbrella) o.hold = null;
  else if (!c.isDay) add('hold', 'lantern', 'a small lantern', 'it is dark out', '#ffd27a');
  else if (band === 'scorch') add('hold', 'popsicle', 'a popsicle', 'emergency measures above ' + deg(90), '#f26b8a');
  else if (T < 45 && !c.wet && !c.snowy && c.kind !== 'fog') add('hold', 'cocoa', 'cocoa', 'cold and dry, so: cocoa', '#8a5a3b');
  else if (band === 'hot' && c.humidity >= 75) add('hold', 'fan', 'paper fan', c.humidity + '% humidity', COL.fan);

  // hair, face, effects
  o.hair = W >= 18 ? 'windy' : (c.wet && !o.umbrella && !o.hood) ? 'wet' : (c.humidity >= 75 && T >= 72) ? 'frizz' : 'normal';
  if (o.hair === 'windy') o.items.push({ slot: 'hair', id: 'hair', label: 'hair, horizontal', why: 'wind at ' + fmtWind(c.windKmh), color: HAIR });
  else if (o.hair === 'frizz') o.items.push({ slot: 'hair', id: 'hair', label: 'hair, ambitious', why: c.humidity + '% humidity', color: HAIR });
  o.face = c.kind === 'storm' ? 'worried' : T >= 95 ? 'wilted' : T < 15 ? 'shiver' : (c.snowy && W < 18) ? 'tongue'
    : (c.late && !c.isDay) ? 'sleepy' : o.shades ? 'shades' : (c.isDay && c.kind === 'clear' && (band === 'warm' || band === 'mild' || band === 'hot')) ? 'happy' : 'content';
  if (T >= 90) o.fx.push('sweat');
  if (T < 33 && o.scarf !== 'bigscarf') o.fx.push('breath');
  if (T < 15) o.fx.push('shiver');
  if (W >= 25) o.fx.push('lean');
  if (W >= 40) o.fx.push('gale');
  return o;
}
const signature = o => o.items.map(i => i.id).join('|');

// ---------- the dressing note
function note(c, o) {
  const t = fmtT(c.feelsC);
  const base = {
    scorch: t + ' feels-like. Wisp has abandoned dignity for a tank top and a popsicle.',
    hot: t + ' and ' + (c.isDay ? 'bright' : 'still warm after dark') + '. Shorts, a tee, and ' + (o.shades ? 'the good sunglasses.' : 'a certain confidence.'),
    warm: 'A ' + t + ' kind of day. Wisp is in a tee and the rust skirt and considers this ideal.',
    mild: t + ': long-sleeves weather. Wisp says this is the correct amount of weather.',
    cool: t + ' feels-like calls for the mustard sweater.' + (o.scarf ? '' : ' The scarf is on standby.'),
    cold: t + '. Coat, scarf, hat. Wisp is fine. Wisp would like cocoa.',
    freezing: t + ' feels-like. Full parka, mittens, and a strong opinion about going back inside.',
    arctic: t + '. Every layer Wisp owns, plus the enormous scarf, plus resentment.',
  }[o.band];
  const more = [];
  if (c.kind === 'storm') more.push('Thunder. The umbrella is up, but nobody is enjoying it.');
  else if (c.kind === 'drizzle') more.push('Only drizzle, so: hood up, no umbrella, light grumbling.');
  else if (o.umbrella === 'inverted') more.push('Wind at ' + fmtWind(c.windKmh) + ' has turned the umbrella into a bowl.');
  else if (c.kind === 'freezing') more.push('Freezing rain. Hood up, boots on, every step negotiated.');
  else if (c.wet) more.push(c.intensity >= 3 ? 'Proper rain. Umbrella up, boots on, puddles under review.' : 'Rain. Umbrella up; the red boots were not optional.');
  else if (c.snowy) more.push(c.intensity >= 2 ? 'Real snow. Boots, mittens, tongue out.' : 'A little snow. Wisp is catching it, professionally.');
  else if (c.kind === 'fog') more.push('Fog thick enough to lose a pixie in. Wisp is walking carefully.');
  if (o.hair === 'windy' && o.umbrella !== 'inverted' && !o.hood) more.push('The wind is ' + fmtWind(c.windKmh) + ', which explains the hair.');
  if (o.hold === 'lantern') more.push(c.late ? 'It is very late. The lantern is lit; the pixie is not.' : 'Night, so the lantern is lit.');
  return base + ' ' + more.slice(0, 2).join(' ');
}

// ---------- the next outfit change in the coming 12 hours
function upcoming(data, curSig) {
  const start = hourIndex(data, data.current.time);
  const cur = new Map(dress(conditions(data)).items.map(i => [i.id, i.label]));
  for (let i = start + 1; i <= start + 12 && i < data.hourly.time.length; i++) {
    const o = dress(conditions(data, i));
    if (signature(o) === curSig) continue;
    const next = new Map(o.items.map(x => [x.id, x.label]));
    const adds = [...next].filter(([id]) => !cur.has(id)).map(([, l]) => l).slice(0, 3);
    const drops = [...cur].filter(([id]) => !next.has(id)).map(([, l]) => l).slice(0, 3);
    const list = a => a.length === 1 ? a[0] : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
    const parts = [];
    if (adds.length) parts.push('adds ' + list(adds));
    if (drops.length) parts.push('drops ' + list(drops));
    if (!parts.length) continue;
    return { when: hourLabel(data.hourly.time[i]), text: parts.join(' and ') };
  }
  return null;
}

// ============================================================
//  SCENE
// ============================================================
function palette(c) {
  const base = { night: ['#0f1738', '#2b3a6b'], dawn: ['#5a6aa6', '#f7c489'], day: ['#4d9fdf', '#c5e6f8'], golden: ['#6d8fcc', '#ffc178'], dusk: ['#3b3f78', '#e39a8a'] }[c.phase];
  const night = c.phase === 'night';
  let a = base[0], b = base[1];
  const grey = night ? ['#151a26', '#3a4150'] : ['#7e8b97', '#c9d1d8'];
  const g = clamp((c.cloud - 30) / 70, 0, 1) * 0.85;
  a = mix(a, grey[0], g); b = mix(b, grey[1], g);
  if (c.wet) { a = mix(a, night ? '#141821' : '#5f6d7b', .5); b = mix(b, night ? '#2c333d' : '#a9b4be', .5); }
  if (c.kind === 'storm') { a = mix(a, '#2e333d', .6); b = mix(b, '#6c7482', .6); }
  if (c.kind === 'fog') { a = mix(a, '#b5bcc2', .7); b = mix(b, '#e3e7ea', .7); }
  if (c.snowy) { a = mix(a, night ? '#2a3448' : '#9fb3c8', .4); b = mix(b, night ? '#4a5568' : '#eef3f7', .5); }
  const T = c.feelsF;
  let ground, groundD;
  if (c.snowy || (T < 30 && c.cloud > 60)) { ground = '#eef2f6'; groundD = '#cfd9e3'; }
  else if (T < 40) { ground = '#8b8a5e'; groundD = '#6f6e48'; }
  else if (T < 60) { ground = '#7fa35a'; groundD = '#5f7f42'; }
  else if (T < 85) { ground = '#6fae57'; groundD = '#4f8a3f'; }
  else { ground = '#a8b25a'; groundD = '#8a9345'; }
  if (c.wet) { ground = mix(ground, '#3f5a3a', .35); groundD = mix(groundD, '#2e4230', .35); }
  if (night) { ground = mix(ground, '#101828', .6); groundD = mix(groundD, '#0b1020', .65); }
  else if (c.phase === 'dusk' || c.phase === 'dawn') { ground = mix(ground, '#3a3355', .3); groundD = mix(groundD, '#2a2540', .3); }
  return { skyA: a, skyB: b, ground, groundD, night };
}

function applyMood(c, P) {
  const r = document.documentElement.style;
  const accent = c.kind === 'storm' ? '#7a6ad8' : c.wet ? '#3f7fbf' : c.snowy ? '#6b8cba' : c.kind === 'fog' ? '#7d858c'
    : P.night ? '#a58ee0' : (c.phase === 'dawn' || c.phase === 'golden' || c.phase === 'dusk') ? '#e07a4a' : c.feelsF >= 85 ? '#e2892f' : '#3a9d8a';
  const pa = mix('#f3eee4', P.skyB, P.night ? .55 : .45), pb = mix('#efe7d8', P.skyA, P.night ? .7 : .35);
  const dark = luma(pa) < .5;
  r.setProperty('--accent', accent);
  r.setProperty('--page-a', pa); r.setProperty('--page-b', pb);
  r.setProperty('--page-ink', dark ? '#f2eee6' : '#2b2622');
  r.setProperty('--page-muted', dark ? 'rgba(242,238,230,.7)' : 'rgba(43,38,34,.62)');
  r.setProperty('--sky-a', P.skyA); r.setProperty('--sky-b', P.skyB);
}

const stars = (c) => {
  const R = rng(7), out = [];
  const n = c.cloud > 70 ? 8 : 42;
  for (let i = 0; i < n; i++) {
    const x = R() * 360, y = R() * 250, s = .6 + R() * 1.3;
    out.push('<circle class="star" cx="' + r1(x) + '" cy="' + r1(y) + '" r="' + r1(s) + '" fill="#fff" style="animation-delay:-' + r1(R() * 3) + 's;animation-duration:' + r1(2 + R() * 3) + 's"/>');
  }
  return '<g opacity="' + (c.phase === 'dusk' ? .5 : .9) + '">' + out.join('') + '</g>';
};

function moon(cx, cy, r, p) {
  const k = Math.cos(2 * Math.PI * p);                 // 1 new … −1 full
  const litRight = p < .5;
  const rx = Math.max(.01, r * Math.abs(k));
  const outer = litRight ? 1 : 0;
  const term = (litRight === (k > 0)) ? 0 : 1;
  const d = 'M' + cx + ' ' + (cy - r) + ' A' + r + ' ' + r + ' 0 0 ' + outer + ' ' + cx + ' ' + (cy + r) + ' A' + r1(rx) + ' ' + r + ' 0 0 ' + term + ' ' + cx + ' ' + (cy - r) + 'Z';
  return '<g class="moon"><circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 2.6) + '" fill="url(#glow)" opacity=".35"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#2a3352"/><path d="' + d + '" fill="#f6efd2"/>' +
    '<circle cx="' + (cx - 5) + '" cy="' + (cy - 4) + '" r="3" fill="#e2d9b8" opacity=".6"/><circle cx="' + (cx + 6) + '" cy="' + (cy + 6) + '" r="2" fill="#e2d9b8" opacity=".6"/></g>';
}

function celestial(c) {
  if (c.phase === 'night') {
    const t = c.nightT, x = 30 + t * 300, y = 120 - Math.sin(t * Math.PI) * 90;
    return '<g opacity="' + (c.cloud > 80 ? .35 : 1) + '">' + moon(r1(x), r1(y), 20, c.moon) + '</g>';
  }
  const t = c.sunT, x = r1(30 + t * 300), y = r1(130 - Math.sin(t * Math.PI) * 100);
  const dim = c.cloud > 70 || c.wet || c.kind === 'fog';
  let rays = '';
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; rays += '<line x1="' + r1(x + Math.cos(a) * 32) + '" y1="' + r1(y + Math.sin(a) * 32) + '" x2="' + r1(x + Math.cos(a) * 44) + '" y2="' + r1(y + Math.sin(a) * 44) + '"/>'; }
  return '<g class="sun" opacity="' + (dim ? .3 : 1) + '"><circle cx="' + x + '" cy="' + y + '" r="72" fill="url(#glow)"/>' +
    '<g class="rays" style="transform-origin:' + x + 'px ' + y + 'px" stroke="#ffd95e" stroke-width="3" stroke-linecap="round" opacity=".8">' + rays + '</g>' +
    '<circle cx="' + x + '" cy="' + y + '" r="24" fill="#ffd95e" stroke="#f4b83a" stroke-width="3"/></g>';
}

function clouds(c, P) {
  const n = c.cloud < 10 ? 0 : c.cloud < 35 ? 2 : c.cloud < 65 ? 3 : c.cloud < 85 ? 5 : 7;
  if (!n) return '';
  const fill = c.kind === 'storm' ? '#4e5661' : P.night ? '#3b4457' : c.cloud > 70 || c.wet ? '#d3dae1' : '#ffffff';
  const R = rng(11), out = [];
  for (let i = 0; i < n; i++) {
    const x = 20 + (i / n) * 330 + R() * 30, y = 40 + R() * 110, s = .7 + R() * .8;
    out.push('<g class="cloud" style="animation-duration:' + r1(26 + R() * 20) + 's;animation-delay:-' + r1(R() * 30) + 's"><g transform="translate(' + r1(x) + ' ' + r1(y) + ') scale(' + r1(s) + ')" fill="' + fill + '" opacity=".92">' +
      '<ellipse cx="0" cy="0" rx="36" ry="14"/><circle cx="-14" cy="-8" r="16"/><circle cx="8" cy="-13" r="21"/><circle cx="26" cy="-4" r="14"/></g></g>');
  }
  if (c.kind === 'storm') out.push('<polyline class="bolt" points="250,70 236,104 254,102 238,140" fill="none" stroke="#fff3b0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>');
  return out.join('');
}

function ground(c, P) {
  const s = ['<path d="M0 372 C60 356 120 384 180 370 S300 352 360 368 L360 440 L0 440Z" fill="' + P.ground + '"/>',
    '<path d="M0 402 C80 390 160 412 240 398 S320 388 360 398 L360 440 L0 440Z" fill="' + P.groundD + '" opacity=".55"/>'];
  const snowGround = c.snowy || (c.feelsF < 30 && c.cloud > 60);
  const R = rng(23);
  if (snowGround) {
    s.push('<ellipse cx="120" cy="392" rx="70" ry="8" fill="#fff" opacity=".7"/><ellipse cx="290" cy="410" rx="60" ry="7" fill="#fff" opacity=".6"/>');
  } else if (c.feelsF >= 48) {
    for (let i = 0; i < 14; i++) { const x = r1(8 + R() * 344), y = r1(372 + R() * 26); s.push('<path d="M' + x + ' ' + y + ' l-3 -8 M' + x + ' ' + y + ' l2 -9 M' + x + ' ' + y + ' l5 -6" stroke="' + P.groundD + '" stroke-width="1.6" stroke-linecap="round" fill="none"/>'); }
    if (c.feelsF >= 60 && !P.night) for (let i = 0; i < 5; i++) { const x = r1(20 + R() * 320), y = r1(380 + R() * 20); s.push('<circle cx="' + x + '" cy="' + y + '" r="2.4" fill="' + ['#f7d15c', '#f28ca6', '#fff'][i % 3] + '"/>'); }
  }
  if (c.wet) {
    s.push('<ellipse cx="262" cy="392" rx="48" ry="6" fill="' + (P.night ? '#556a86' : '#cfe4f2') + '" opacity=".55"/>');
    for (let i = 0; i < 3; i++) s.push('<ellipse class="ripple" cx="' + (240 + i * 20) + '" cy="392" rx="12" ry="2.4" fill="none" stroke="#fff" stroke-width="1" style="animation-delay:-' + r1(i * .6) + 's"/>');
  }
  return s.join('');
}

function toadstool(c, P) {
  const snow = c.snowy || (c.feelsF < 30 && c.cloud > 60);
  return '<g class="toadstool"><rect x="56" y="346" width="16" height="30" rx="6" fill="#f1e6cf"/>' +
    (P.night ? '<circle cx="64" cy="360" r="14" fill="url(#lamp)" opacity=".8"/><rect class="lamp" x="61" y="354" width="6" height="8" rx="2" fill="#ffd27a"/>' : '<rect x="61" y="354" width="6" height="8" rx="2" fill="#d9c9a8"/>') +
    '<path d="M30 350 C30 318 98 318 98 350 Z" fill="#d9483b"/><circle cx="50" cy="336" r="4" fill="#fff"/><circle cx="70" cy="330" r="3" fill="#fff"/><circle cx="84" cy="342" r="2.6" fill="#fff"/>' +
    (snow ? '<path d="M36 336 C44 322 84 320 92 336 C80 330 48 330 36 336Z" fill="#fff"/>' : '') + '</g>';
}

function precip(c) {
  if (!(c.wet || c.snowy)) return '';
  const R = rng(5), out = [];
  if (c.snowy) {
    const n = 18 + c.intensity * 16;
    for (let i = 0; i < n; i++) out.push('<circle cx="' + r1(R() * 360) + '" cy="' + r1(R() * 440) + '" r="' + r1(1.4 + R() * 2) + '" fill="#fff" opacity=".9" style="animation-duration:' + r1(5 + R() * 5) + 's;animation-delay:-' + r1(R() * 10) + 's"/>');
    return '<g class="snow">' + out.join('') + '</g>';
  }
  const drizzle = c.kind === 'drizzle';
  const n = drizzle ? 26 : 30 + c.intensity * 22;

function glyph(kind, isDay) {
  const cloud = '<path d="M7 18h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.2 9.3 4.4 4.4 0 0 0 7 18z" fill="currentColor" opacity=".85"/>';
  const sun = '<circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g>';
  const moonG = '<path d="M15.5 3.5a8.5 8.5 0 1 0 5 15.3A7 7 0 0 1 15.5 3.5z" fill="currentColor"/>';
  const drops = '<g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 20.5l1-2M12 21.5l1-2M16 20.5l1-2"/></g>';
  const flakes = '<g fill="currentColor"><circle cx="8.5" cy="20.5" r="1.2"/><circle cx="12.5" cy="22" r="1.2"/><circle cx="16.5" cy="20.5" r="1.2"/></g>';
  const bolt = '<path d="M12.5 15l-2 4h2.5l-1.5 4 4.5-5.5h-2.5l1.5-2.5z" fill="currentColor"/>';
  const small = isDay ? '<circle cx="16" cy="8" r="3.5" fill="currentColor" opacity=".7"/>' : '<path d="M17 4a4 4 0 1 0 3 7.5A3.5 3.5 0 0 1 17 4z" fill="currentColor" opacity=".7"/>';
  let body;
  switch (kind) {
    case 'clear': body = isDay ? sun : moonG; break;
    case 'cloudy': body = small + cloud; break;
    case 'overcast': body = cloud; break;
    case 'fog': body = '<g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M6 13h14M4 17h12"/></g>'; break;
    case 'snow': body = cloud.replace('18h10', '16h10').replace('18z', '16z') + flakes; break;
    case 'storm': body = cloud.replace('18h10', '15h10').replace('18z', '15z') + bolt; break;
    case 'freezing': body = cloud.replace('18h10', '16h10').replace('18z', '16z') + '<circle cx="9" cy="20.5" r="1.2" fill="currentColor"/><path d="M15 21.5l1-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'; break;

  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + body + '</svg>';
}

const HOURLY = 'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,precipitation,weather_code,is_day,wind_speed_10m,wind_gusts_10m,wind_direction_10m,uv_index,cloud_cover';
const CURRENT = 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m,wind_direction_10m';
const DAILY = 'sunrise,sunset,uv_index_max,temperature_2m_max,temperature_2m_min,precipitation_probability_max';

async function getJSON(url) {
  const r = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' from ' + new URL(url).host);
  return r.json();
}
const forecast = (lat, lon) => getJSON('https://api.open-meteo.com/v1/forecast?' + new URLSearchParams({ latitude: lat, longitude: lon, current: CURRENT, hourly: HOURLY, daily: DAILY, timezone: 'auto', forecast_days: 2 }));
const geocode = async q => (await getJSON('https://geocoding-api.open-meteo.com/v1/search?' + new URLSearchParams({ name: q, count: 6, language: 'en', format: 'json' }))).results || [];
async function reverse(lat, lon) {
  try {
    const j = await getJSON('https://nominatim.openstreetmap.org/reverse?' + new URLSearchParams({ format: 'jsonv2', lat, lon, zoom: 10 }));
    const a = j.address || {};
    const name = a.city || a.town || a.village || a.hamlet || a.municipality || a.county || j.name;
    if (name) return { name, admin: a.state || a.region || '', country: a.country || '', cc: (a.country_code || '').toUpperCase(), lat, lon };
  } catch (e) { /* fall through to coordinates */ }
  return { name: lat.toFixed(2) + ', ' + lon.toFixed(2), admin: '', country: 'your spot', cc: '', lat, lon };
}

const KEY = 'pixiecast:v1';
function save() { try { localStorage.setItem(KEY, JSON.stringify({ place: state.place, unit: state.unit })); } catch (e) { /* private mode */ } }
function restore() { try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j) { if (j.unit) state.unit = j.unit; if (j.place && isFinite(j.place.lat)) state.place = j.place; } } catch (e) { /* ignore */ } }
function pushURL() {
  const u = new URL(location.href); u.search = '';
  if (state.demo) u.searchParams.set('demo', state.demo);
  else if (state.place) { u.searchParams.set('lat', state.place.lat.toFixed(4)); u.searchParams.set('lon', state.place.lon.toFixed(4)); u.searchParams.set('name', shortPlace(state.place)); }
  history.replaceState(null, '', u);
}

let inflight = 0;
async function load(place) {
  const id = ++inflight;
  state.place = place; state.demo = null; state.data = null;
  renderLoading({ title: 'Checking the sky over ' + place.name + '…', body: 'One moment. Wisp is getting dressed.' });
  try {
    const data = await forecast(place.lat, place.lon);
    if (id !== inflight) return;
    state.data = data; save(); pushURL(); render();
    clearTimeout(state.timer); state.timer = setTimeout(() => { if (document.visibilityState === 'visible' && !state.demo) load(state.place); }, 15 * 60 * 1000);
  } catch (e) {
    if (id !== inflight) return;
    renderLoading({ title: 'The weather did not answer.', body: (e && e.message ? e.message + '. ' : '') + 'Wisp is standing by in a towel.', actions: '<button class="btn" id="retry">Try again</button>' }, true);
    $('#retry').onclick = () => load(place);
  }
}

function setUnit(u) {
  state.unit = u; save();
  document.querySelectorAll('.units button').forEach(b => { const on = b.dataset.unit === u; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  if (state.data) render();
}

  drizzle: { label: 'Drizzle', town: 'Mizzleford', temp: 15, feels: 14, code: 51, cloud: 96, wind: 10, hum: 92, uv: 1, hour: 9, prob: 70, precip: .3 },
  rain: { label: 'Rain', town: 'Puddleton', temp: 12, feels: 10, code: 63, cloud: 98, wind: 14, hum: 90, uv: 1, hour: 11, prob: 90, precip: 2.6, drift: -.5 },
  storm: { label: 'Thunderstorm', town: 'Thunderby', temp: 24, feels: 26, code: 95, cloud: 100, wind: 22, hum: 88, uv: 1, hour: 17, prob: 95, precip: 6 },
  gale: { label: 'Gale', town: 'Gustwick', temp: 11, feels: 6, code: 61, cloud: 90, wind: 52, gust: 80, hum: 80, uv: 0, hour: 16, prob: 70, precip: 1 },
  fog: { label: 'Fog', town: 'Murkhaven', temp: 8, feels: 7, code: 45, cloud: 100, wind: 4, hum: 98, uv: 0, hour: 7, sr: '06:50' },
  snow: { label: 'Snow day', town: 'Flakebury', temp: -3, feels: -6, code: 73, cloud: 100, wind: 10, hum: 85, uv: 0, hour: 15, prob: 80, precip: 1.2 },
  night: { label: 'Cold clear night', town: 'Starling Hollow', temp: -1, feels: -4, code: 0, cloud: 5, wind: 6, hum: 60, uv: 0, hour: 23 },
  arctic: { label: 'Arctic', town: 'Frostmoor', temp: -20, feels: -28, code: 1, cloud: 10, wind: 15, hum: 70, uv: 1, hour: 12 },
};
function synth(d) {
  const day = new Date().toISOString().slice(0, 10), sr = d.sr || '06:40', ss = d.ss || '19:30';
  const stamp = (dayOffset, h) => { const dt = new Date(day + 'T00:00:00Z'); dt.setUTCDate(dt.getUTCDate() + dayOffset); return dt.toISOString().slice(0, 10) + 'T' + String(h).padStart(2, '0') + ':00'; };
  const H = { time: [], temperature_2m: [], apparent_temperature: [], relative_humidity_2m: [], precipitation_probability: [], precipitation: [], weather_code: [], is_day: [], wind_speed_10m: [], wind_gusts_10m: [], wind_direction_10m: [], uv_index: [], cloud_cover: [] };
  const srm = mins('2000-01-01T' + sr), ssm = mins('2000-01-01T' + ss);
  for (let i = 0; i < 48; i++) {
    const h = i % 24, dayOff = i < 24 ? 0 : 1, hoursAhead = i - d.hour;
    const drift = hoursAhead > 0 ? hoursAhead * (d.drift ?? -.35) : 0;
    const isDay = h * 60 >= srm && h * 60 <= ssm ? 1 : 0;
    H.time.push(stamp(dayOff, h)); H.temperature_2m.push(r1(d.temp + drift)); H.apparent_temperature.push(r1(d.feels + drift));
    H.relative_humidity_2m.push(d.hum); H.precipitation_probability.push(hoursAhead > 6 ? Math.max(0, (d.prob || 0) - 40) : d.prob || 0);
    H.precipitation.push(hoursAhead > 6 ? 0 : d.precip || 0); H.weather_code.push(hoursAhead > 6 && d.code >= 50 ? 3 : d.code); H.is_day.push(isDay);
    H.wind_speed_10m.push(d.wind); H.wind_gusts_10m.push(d.gust || d.wind * 1.4); H.wind_direction_10m.push(240);
    H.uv_index.push(isDay ? d.uv : 0); H.cloud_cover.push(d.cloud);
  }
  return {
    current: { time: stamp(0, d.hour).slice(0, 14) + '20', temperature_2m: d.temp, relative_humidity_2m: d.hum, apparent_temperature: d.feels, is_day: d.hour * 60 >= srm && d.hour * 60 <= ssm ? 1 : 0, precipitation: d.precip || 0, weather_code: d.code, cloud_cover: d.cloud, wind_speed_10m: d.wind, wind_gusts_10m: d.gust || d.wind * 1.4, wind_direction_10m: 240 },
    hourly: H,
    daily: { time: [stamp(0, 0).slice(0, 10), stamp(1, 0).slice(0, 10)], sunrise: [stamp(0, 0).slice(0, 10) + 'T' + sr, stamp(1, 0).slice(0, 10) + 'T' + sr], sunset: [stamp(0, 0).slice(0, 10) + 'T' + ss, stamp(1, 0).slice(0, 10) + 'T' + ss], uv_index_max: [d.uv, d.uv], temperature_2m_max: [d.temp + 2, d.temp], temperature_2m_min: [d.temp - 6, d.temp - 8], precipitation_probability_max: [d.prob || 0, 0] },
  };
}
function runDemo(key) {
  const d = DEMOS[key]; if (!d) return;
  inflight++; clearTimeout(state.timer);
  state.demo = key; state.data = synth(d); state.place = { name: d.town, admin: 'Dress-up mode', country: '', cc: '', lat: 0, lon: 0 };
  document.querySelectorAll('#dressup button').forEach(b => b.classList.toggle('on', b.dataset.demo === key));
  pushURL(); render();
}

// ============================================================
//  UI WIRING
// ============================================================
const q = $('#q'), sug = $('#suggest'), status = $('#status');
let results = [], sel = -1, debounce = 0;
function showSuggest(list) {
  results = list; sel = -1;
  sug.innerHTML = list.map((r, i) => '<li role="option" data-i="' + i + '">' + esc(r.name + (r.admin1 ? ', ' + r.admin1 : '')) + '<small>' + esc(r.country || r.country_code || '') + '</small></li>').join('');
  sug.hidden = !list.length; q.setAttribute('aria-expanded', String(!list.length ? false : true));
}
function hideSuggest() { sug.hidden = true; q.setAttribute('aria-expanded', 'false'); }
function choose(r) {
  hideSuggest(); q.value = ''; q.blur(); status.textContent = '';
  document.querySelectorAll('#dressup button').forEach(b => b.classList.remove('on'));
  load({ name: r.name, admin: r.admin1 || '', country: r.country || '', cc: r.country_code || '', lat: r.latitude, lon: r.longitude });
}
q.addEventListener('input', () => {
  clearTimeout(debounce);
  const v = q.value.trim();
  if (v.length < 2) { hideSuggest(); return; }
  debounce = setTimeout(async () => { try { showSuggest(await geocode(v)); } catch (e) { status.textContent = 'Search is unavailable right now.'; } }, 220);
});
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (sug.hidden) return; e.preventDefault();
    sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
    [...sug.children].forEach((li, i) => li.setAttribute('aria-selected', i === sel));
  } else if (e.key === 'Escape') hideSuggest();
  else if (e.key === 'Enter') { e.preventDefault(); $('#finder').requestSubmit(); }
});
$('#finder').addEventListener('submit', async e => {
  e.preventDefault();
  if (!sug.hidden && results.length) return choose(results[sel < 0 ? 0 : sel]);
  const v = q.value.trim(); if (v.length < 2) return;
  status.textContent = 'Searching…';
  try { const r = await geocode(v); if (r.length) choose(r[0]); else status.textContent = 'No place by that name. Try a bigger town nearby.'; }
  catch (err) { status.textContent = 'Search is unavailable right now.'; }
});
sug.addEventListener('mousedown', e => { const li = e.target.closest('li'); if (li) { e.preventDefault(); choose(results[+li.dataset.i]); } });
document.addEventListener('click', e => { if (!e.target.closest('.finder')) hideSuggest(); });

function locate(auto) {
  if (!navigator.geolocation) { status.textContent = 'This browser has no location service; search instead.'; return; }
  const btn = $('#locate'); btn.classList.add('busy'); status.textContent = 'Asking where you are…';
  navigator.geolocation.getCurrentPosition(async pos => {
    btn.classList.remove('busy'); status.textContent = '';
    document.querySelectorAll('#dressup button').forEach(b => b.classList.remove('on'));
    const { latitude: lat, longitude: lon } = pos.coords;
    inflight++;
    renderLoading({ title: 'Found you. Naming the place…', body: 'One moment. Wisp is getting dressed.' });
    load(await reverse(lat, lon));
  }, err => {
    btn.classList.remove('busy');
    status.textContent = err.code === 1 ? 'Location was declined; search for a place instead.' : 'Could not get a location; search for a place instead.';
    if (auto && !state.data) renderLoading({ title: 'Where are you?', body: 'Search for a town above, or allow location access, and Wisp will get dressed for it.', actions: '<button class="btn" id="tryloc">Use my location</button><button class="btn ghost" id="tryrain">Or just try the rain</button>' });
    const t = $('#tryloc'); if (t) t.onclick = () => locate(false);
    const r = $('#tryrain'); if (r) r.onclick = () => runDemo('rain');
  }, { timeout: 12000, maximumAge: 600000 });
}
$('#locate').addEventListener('click', () => locate(false));
document.querySelectorAll('.units button').forEach(b => b.addEventListener('click', () => setUnit(b.dataset.unit)));
$('#report').addEventListener('click', e => {
  const b = e.target.closest('button[data-part]'); if (!b) return;
  const g = $('#scene').querySelector('[data-part="' + b.dataset.part + '"]');
  if (!g) return;
  g.classList.remove('hl'); void g.getBoundingClientRect(); g.classList.add('hl');
  g.addEventListener('animationend', () => g.classList.remove('hl'), { once: true });
});
const dressup = $('#dressup');
Object.entries(DEMOS).forEach(([k, d]) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.demo = k; b.textContent = d.label; b.addEventListener('click', () => runDemo(k)); dressup.appendChild(b); });

// expose a little for headless verification
window.__pixiecast = { conditions, dress, note, upcoming, synth, DEMOS, runDemo, load, state };

// ============================================================
//  BOOT
// ============================================================
(function boot() {
  restore();
  setUnit(state.unit);
  const p = new URLSearchParams(location.search);
  if (p.get('demo') && DEMOS[p.get('demo')]) return runDemo(p.get('demo'));
  const lat = parseFloat(p.get('lat')), lon = parseFloat(p.get('lon'));
  if (isFinite(lat) && isFinite(lon)) {
    const name = p.get('name') || '';
    const known = state.place && Math.abs(state.place.lat - lat) < .01 && Math.abs(state.place.lon - lon) < .01 ? state.place : null;
    return load(known || { name: name.split(',')[0] || lat.toFixed(2) + ', ' + lon.toFixed(2), admin: '', country: name.split(',').slice(1).join(',').trim(), cc: '', lat, lon });
  }
  if (state.place) return load(state.place);
  renderLoading({ title: 'Finding you…', body: 'Wisp needs to know where you are before choosing socks.' });
  locate(true);
})();
})();
</script>
