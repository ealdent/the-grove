<!doctype html>
<meta charset="utf-8">
<title>Empty-page frame cadence baseline</title>
<h1>Empty-page frame cadence baseline</h1>
<p>Five seconds of native requestAnimationFrame callbacks. No greenhouse, WebGL, animation, or external resources. This measures browser scheduling, not scene performance.</p>
<pre id="result">Sampling…</pre>
<script>
const intervals = [];
let start, previous, interrupted = false;
document.addEventListener('visibilitychange', () => { interrupted = true; });
function sample(t) {
  if (start === undefined) { start = previous = t; requestAnimationFrame(sample); return; }
  intervals.push(t - previous); previous = t;
  if (t - start < 5000) { requestAnimationFrame(sample); return; }
  const sorted = intervals.slice().sort((a,b) => a-b);
  window.cadenceResult = {
    recordedAt: new Date().toISOString(), userAgent: navigator.userAgent,
    sampleMs: t-start, count: intervals.length,
    averageFPS: intervals.length*1000/(t-start),
    p99Ms: sorted[Math.ceil(sorted.length*.99)-1], worstMs: sorted.at(-1),
    interrupted, visibility: document.visibilityState, intervals
  };
  document.getElementById('result').textContent = JSON.stringify(window.cadenceResult, null, 2);
}
requestAnimationFrame(sample);
</script>
