<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grove Video share card</title>
<!-- The link-preview image for videos/ (1200×630, captured at 2×). frames/shelf-sky.jpg is the live hero, captured
     without its words by render.mjs. Rebuild: node cards/render.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Krona+One&family=Caveat:wght@700&display=block" rel="stylesheet">
<style>
  @font-face { font-family: "Phosphor Wake"; src: url("../../utils/phosphor-wake/PhosphorWake-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Phosphor Burn"; src: url("../../utils/phosphor-wake/PhosphorWake-Burn.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; color: #f4e9d2; background: #07060d url("frames/shelf-sky.jpg") center / cover no-repeat; }
  body::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(7, 6, 13, 0.55), transparent 55%); }
  .m { position: absolute; z-index: 2; left: 60px; top: 70px; }
  .eyebrow { margin: 0 0 16px; font-family: "Phosphor Wake", monospace; font-size: 18px; letter-spacing: 0.42em; color: #ffb03b; text-shadow: 0 0 10px rgba(255, 176, 59, 0.7); }
  h1 { margin: 0; font-family: "Krona One", sans-serif; font-weight: 400; line-height: 0.86; letter-spacing: -0.02em; transform: skewX(-9deg); transform-origin: left bottom; }
  h1 .w { display: block; position: relative; font-size: 150px; }
  h1 .w span { position: relative; z-index: 1; color: transparent; -webkit-background-clip: text; background-clip: text;
    background: linear-gradient(180deg, #f7fbff 0%, #b9d4f2 30%, #6c93c7 47%, #fffaf0 49.5%, #4a2d1c 51%, #8a4b25 64%, #e7a463 82%, #fff1d4 100%); -webkit-background-clip: text; -webkit-text-stroke: 1px rgba(255, 255, 255, 0.35); }
  h1 .w::before { content: attr(data-t); position: absolute; left: 0; top: 0; z-index: 0; color: #2a0b19;
    text-shadow: 1px 1px 0 #3b0f22, 2px 2px 0 #4c1229, 3px 3px 0 #5e1530, 4px 4px 0 #701937, 5px 5px 0 #841c3d, 6px 6px 0 #961f43, 7px 7px 0 #a8234a, 8px 8px 0 #b92650, 9px 10px 14px rgba(0, 0, 0, 0.8), 0 0 70px rgba(255, 61, 127, 0.45); }
  h1 .w.small { font-size: 64px; margin-top: 0.1em; }
  h1 .w.small span { background: linear-gradient(180deg, #fff6dc 0%, #ffd27a 45%, #ff8a3d 55%, #ff3d7f 100%); -webkit-background-clip: text; background-clip: text; }
  .tapes { position: absolute; z-index: 2; left: 60px; bottom: 54px; display: flex; gap: 18px; }
  .t { width: 248px; padding: 10px; border-radius: 9px; background: linear-gradient(180deg, #2f2a28, #1b1816); box-shadow: inset 0 0 0 2px #0c0b0a, 0 14px 30px -10px #000; }
  .lab { position: relative; height: 92px; border-radius: 4px; overflow: hidden; }
  .lab .win { position: absolute; left: 22%; right: 22%; top: 46%; height: 30%; border-radius: 20px; background: #0c0a0a; }
  .lab .win::before, .lab .win::after { content: ""; position: absolute; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: radial-gradient(circle, #f6f1e4 0 30%, #5b3b26 32%); }
  .lab .win::before { left: 12%; } .lab .win::after { right: 12%; }
  .seat { background: #f3ead7; }
  .seat b { position: absolute; left: 10px; top: 2px; font-family: "Caveat", cursive; font-size: 30px; color: #2c2521; transform: rotate(-3deg); white-space: nowrap; }
  .seat i { position: absolute; left: 0; right: 0; bottom: 8%; height: 11%; background: linear-gradient(180deg, #ffc21a 0 50%, #26324d 50%); }
  .doom { background: #0b0806; box-shadow: inset 0 0 0 2px #3a2c1e; }
  .doom b { position: absolute; left: 10px; top: 6px; font-family: "Phosphor Burn", monospace; font-weight: 400; font-size: 28px; color: #ffe7bf; text-shadow: 0 0 8px #ffb447; }
  .doom i { position: absolute; left: 0; right: 0; bottom: 8%; height: 11%; background: linear-gradient(180deg, #ffb447 0 33%, #ff7a45 33% 66%, #f1462c 66%); }
  .meta { margin-top: 8px; display: flex; justify-content: space-between; font-family: "Phosphor Wake", monospace; font-size: 14px; letter-spacing: 0.16em; color: #8dffb4; text-shadow: 0 0 6px rgba(141, 255, 180, 0.5); }
  .url { position: absolute; z-index: 2; right: 40px; bottom: 22px; font-family: "Phosphor Wake", monospace; font-size: 15px; letter-spacing: 0.18em; color: rgba(244, 233, 210, 0.75); }
</style>
</head>
<body>
  <div class="m">
    <p class="eyebrow">THE GROVE PRESENTS</p>
    <h1><span class="w" data-t="VIDEO"><span>VIDEO</span></span><span class="w small" data-t="ON TAPE"><span>ON TAPE</span></span></h1>
  </div>
  <div class="tapes">
    <div class="t"><div class="lab seat"><b>Save Me a Seat</b><span class="win"></span><i></i></div><div class="meta"><span>CH 01</span><span>▶ 3:21</span></div></div>
    <div class="t"><div class="lab doom"><b>P(DOOM)</b><span class="win"></span><i></i></div><div class="meta"><span>CH 02</span><span>▶ 2:22</span></div></div>
  </div>
  <div class="url">EALDENT.GITHUB.IO/THE-GROVE/VIDEOS</div>
</body>
</html>
