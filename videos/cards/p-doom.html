  .rec::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: currentColor; margin-right: 9px; box-shadow: 0 0 10px currentColor; }
  h1 { margin: 16px 0 0; font-family: "Phosphor Burn", monospace; font-weight: 400; font-size: 104px; line-height: 0.9; letter-spacing: 0.02em; color: #ffe7bf;

</style>
