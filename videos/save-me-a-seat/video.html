<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Save Me a Seat (hand-drawn)</title>
<style>html,body{margin:0;background:#222}canvas{display:block;width:100vw;height:auto}</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>window.onerror = (m, s, l) => { window.__error = `${m} (${s}:${l})`; };</script>
<script src="data.js"></script>
<script src="ink.js"></script>
<script src="cast.js"></script>
<script src="cast2.js"></script>
<script src="props.js"></script>
<script src="props2.js"></script>
<script src="props3.js"></script>
<script src="scenes.js"></script>
<script src="scenes_b.js"></script>
<script src="scenes_c.js"></script>
<script src="scenes_d.js"></script>
<script src="edit.js"></script>
<script>
'use strict';
// __render(i): draw output frame i (24 fps) and return it as a data URL. Drawings change on twos (12 a second).
const FPS = DATA.fps;
window.__fps = FPS;
window.__frames = Math.round((window.END || DATA.dur) * FPS);
function sceneAt(t) {
  for (let i = SCENES.length - 1; i >= 0; i--) if (t >= SCENES[i].t) return [SCENES[i], SCENES[i + 1] ? SCENES[i + 1].t : DATA.dur];
  return [SCENES[0], SCENES[1].t];
}
function drawAt(t) {
  const td = Math.floor(t * DRAW_FPS + 1e-6) / DRAW_FPS;       // on twos
  const [s, t1] = sceneAt(td);
  beginFrame(td);
  const o = s.draw(td - s.t, td, t1 - s.t) || {};
  endFrame(o);
}
window.__render = (i, type = 'image/jpeg') => { drawAt(i / FPS); return document.getElementById('cv').toDataURL(type, 0.93); };
initInk();
const q = new URLSearchParams(location.search);
if (q.has('t')) drawAt(Number(q.get('t')));
window.__ready = true;
</script>
</body>
</html>
