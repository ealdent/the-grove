<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05070a">
<title>Mountain Land</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Archivo:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#05070a; --bezel:#0b0e12; --ink:#e9eee6; --ink-2:#9fb0a4; --ink-3:#5f6f66; --gold:#f2b53a; --gold-ink:#2a1e05; --cyan:#7fe3ff;
  --card:rgba(8,12,15,.72); --card-line:rgba(233,238,230,.14);
  --f-hud:"VT323",ui-monospace,Menlo,monospace; --f-ui:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab;background:var(--bezel)}
#stage.drag{cursor:grabbing}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#ov text{font-family:var(--f-hud);user-select:none}
#ov .state path{fill:none;stroke:var(--cyan);stroke-opacity:.35;stroke-width:1;vector-effect:non-scaling-stroke}
#ov .city text{font-size:15px;letter-spacing:.08em;fill:var(--ink-2);opacity:.85}
#ov .city circle{fill:var(--ink-2)}
#ov .peak text{font-size:14px;fill:var(--ink-2);opacity:.8}
#ov .peak path{fill:none;stroke:var(--ink-2);stroke-width:1.2}
#ov .pin{pointer-events:auto;cursor:pointer}
#ov .pin .ring{fill:none;stroke:var(--gold);stroke-width:1.4;opacity:.9}
#ov .pin .ring2{fill:none;stroke:var(--gold);stroke-width:1;opacity:.35;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
#ov .pin .tether{stroke:var(--gold);stroke-width:1.2;stroke-dasharray:3 3;opacity:.85}
#ov .pin .tag rect{fill:rgba(10,12,14,.82);stroke:var(--gold);stroke-width:1.2}
#ov .pin .tag text{font-size:18px;letter-spacing:.06em;fill:var(--gold);text-transform:uppercase}
#ov .pin .tag path{fill:var(--gold)}
#ov .pin.sel .tag rect{fill:var(--gold)} #ov .pin.sel .tag text{fill:var(--gold-ink)} #ov .pin.sel .tag path{fill:var(--gold)}
#ov .pin.dim{opacity:.5}
@keyframes ping{0%{transform:scale(.5);opacity:.6}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){#ov .pin .ring2{animation:none;opacity:.25}}

/* screen chrome: the bezel of a big display, thin on phones */
.bezel{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 6px #0b0e12, inset 0 0 0 7px #1a1f25, inset 0 0 60px rgba(0,0,0,.6);border-radius:14px}
@media (min-width:760px){.bezel{box-shadow:inset 0 0 0 14px #0b0e12, inset 0 0 0 15px #22282f, inset 0 0 90px rgba(0,0,0,.65);border-radius:22px}}
.hud{position:fixed;font-family:var(--f-hud);font-size:19px;letter-spacing:.06em;color:var(--ink-2);text-shadow:0 0 6px rgba(127,227,255,.25);pointer-events:none;text-transform:uppercase}
.hud b{color:var(--ink);font-weight:400}
.hud .rec{color:#ff5a4a;animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.hud .rec{animation:none}}
.brand{left:24px;top:calc(18px + var(--safe-t))}
.tele{right:24px;top:calc(18px + var(--safe-t));text-align:right;font-variant-numeric:tabular-nums}
.hint{left:50%;bottom:calc(26px + var(--safe-b));transform:translateX(-50%);white-space:nowrap;transition:opacity .5s}
.hint.hidden{opacity:0}
.home{position:fixed;right:20px;bottom:calc(22px + var(--safe-b));width:40px;height:40px;border-radius:10px;border:1px solid var(--card-line);background:var(--card);color:var(--ink);font:400 22px/1 var(--f-hud);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.card{position:fixed;left:16px;right:16px;bottom:calc(18px + var(--safe-b));background:var(--card);border:1px solid var(--card-line);border-radius:14px;padding:14px 14px 12px;backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(127,227,255,.06);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px)}
.card.hidden{transform:translateY(120%);opacity:0;pointer-events:none}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card h2{margin:0;font-family:var(--f-hud);font-size:30px;font-weight:400;letter-spacing:.04em;line-height:1;color:var(--gold);text-transform:uppercase;text-shadow:0 0 10px rgba(242,181,58,.35)}
.card .sub{margin:6px 0 0;color:var(--ink-2);font-size:13.5px;font-variant-numeric:tabular-nums}
.card button.x{appearance:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--card-line);background:transparent;color:var(--ink);font:400 22px/1 var(--f-hud);cursor:pointer;flex:none}
.card .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.card .stat{border:1px solid var(--card-line);border-radius:10px;padding:8px 12px}
.card .stat b{display:block;font-family:var(--f-hud);font-size:34px;font-weight:400;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.card .stat b small{font-size:18px;color:var(--ink-2);margin-left:4px}
.card .stat span{display:block;font-family:var(--f-hud);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.card .row{display:flex;align-items:center;gap:8px;margin-top:12px}
.card .open{flex:1;display:flex;align-items:center;justify-content:center;height:44px;border-radius:10px;background:var(--gold);color:var(--gold-ink);text-decoration:none;font-family:var(--f-hud);font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.card .open:hover{filter:brightness(1.06)}
.card .nav button{appearance:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--card-line);background:transparent;color:var(--ink);font:400 26px/1 var(--f-hud);cursor:pointer}
@media (min-width:760px){ .card{left:auto;right:28px;bottom:28px;width:350px} .home{right:28px;bottom:calc(28px + 96px)} .brand{left:32px;top:26px} .tele{right:32px;top:26px} .hint{bottom:30px} }
.fallback{position:fixed;inset:0;display:grid;place-content:center;gap:10px;padding:24px;text-align:center}
.fallback a{color:var(--gold)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <svg id="ov" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g id="gStates"></g><g id="gPlaces"></g><g id="gPins"></g></svg>
</div>
<div class="bezel"></div>
<div class="hud brand"><span class="rec">&#9679;</span> <b>Mountain land</b> <span id="count"></span></div>
<div class="hud tele"><span id="tAlt"></span><br><span id="tLat"></span></div>
<div class="hud hint" id="hint">scroll to orbit &middot; tap a pin</div>
<button type="button" class="home" id="home" aria-label="Reset view" title="Reset view">&#8982;</button>
<aside class="card hidden" id="card" aria-live="polite">
  <div class="top"><div><h2 id="cName"></h2><p class="sub" id="cSub"></p></div><button type="button" class="x" id="cClose" aria-label="Close">&times;</button></div>
  <div class="stats">
    <div class="stat"><b id="cView"></b><span>ground in view</span></div>
    <div class="stat"><b id="cSky"></b><span>horizon</span></div>
  </div>
  <div class="row"><a class="open" id="cOpen" href="#">Open the map</a><div class="nav"><button type="button" id="cPrev" aria-label="Previous">&#8249;</button><button type="button" id="cNext" aria-label="Next">&#8250;</button></div></div>
</aside>
<script>/*__DATA__*/</script>
<script>
(async function(){
'use strict';
const R = window.REGION, bb = R.bbox, TW = R.w, TH = R.h;
const Wm = TW*R.mpp[0], Hm = TH*R.mpp[1];          // map size in metres
const Rc = 2500e3;                                   // exaggerated planet radius: the world visibly curves
const VE = 3.0;                                      // vertical exaggeration
const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('gl'), ov = $('ov');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('count').textContent = R.props.length + ' tracts';

// ---------- payload ----------
async function inflate(b64){ const bin=atob(b64), u8=new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, powerPreference:'high-performance'});
if (!gl || !('DecompressionStream' in window)){ fallback('This browser cannot draw the relief.'); return; }
const [demBytes, waterBytes] = await Promise.all([inflate(R.dem), inflate(R.water)]);
const d16 = new Int16Array(demBytes.buffer); const elev = new Float32Array(TW*TH);
for (let r=0;r<TH;r++){ let acc=0; const o=r*TW; for (let c=0;c<TW;c++){ acc+=d16[o+c]; elev[o+c]=acc; } }
const water = new Uint8Array(TW*TH); for (let k=0;k<TW*TH;k++) water[k] = ((waterBytes[k>>3]>>(7-(k&7)))&1) ? 255 : 0;
const elevAt = (u,v) => { const c=Math.min(TW-1,Math.max(0,Math.round(u*TW-0.5))), r=Math.min(TH-1,Math.max(0,Math.round(v*TH-0.5))); return elev[r*TW+c]; };

// ---------- GL helpers ----------
const floatLinear = !!gl.getExtension('OES_texture_float_linear');
gl.getExtension('EXT_color_buffer_float');
function tex2d(unit, internal, fmt, type, w, h, data, linear){ const t=gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT,1); gl.texImage2D(gl.TEXTURE_2D,0,internal,w,h,0,fmt,type,data);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,linear?gl.LINEAR:gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,linear?gl.LINEAR:gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); return t; }
const texElev = tex2d(0, gl.R32F, gl.RED, gl.FLOAT, TW, TH, elev, floatLinear);
const texWater = tex2d(1, gl.R8, gl.RED, gl.UNSIGNED_BYTE, TW, TH, water, true);
function program(vs, fs){ const mk=(t,s)=>{ const sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh); if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)+'\n'+s.split('\n').slice(0,3).join('\n')); return sh; };
  const p=gl.createProgram(); gl.attachShader(p,mk(gl.VERTEX_SHADER,vs)); gl.attachShader(p,mk(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }

const COMMON = `
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
vec3 onSphere(vec2 m, float z, float Rc){ vec2 a = m / Rc; float cy = cos(a.y); vec3 d = vec3(sin(a.x)*cy, sin(a.y), cos(a.x)*cy); return d*(Rc+z) - vec3(0.,0.,Rc); }`;

// ---------- terrain + skirt ----------
const VS_T = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 aUv; uniform sampler2D uElev; uniform mat4 uVP; uniform vec2 uMapM; uniform float uRc, uVE, uSkirt, uTime; uniform vec3 uEye;
out vec2 vUv; out float vDist; out vec3 vPos;
${COMMON}
void main(){
  vec2 uv = aUv; float z;
  if (uSkirt > 0.5){ uv = aUv; vec2 m = (uv - 0.5) * uMapM * 9.0; float far = length(uv-0.5)*2.0; z = (noise(uv*60.0)*0.5+noise(uv*13.0)*0.5) * 380.0 * smoothstep(0.02, 0.2, far) - 160.0;
    vec3 p = onSphere(m, z*uVE, uRc); vPos = p; vUv = (m / uMapM) + 0.5; vDist = distance(p, uEye); gl_Position = uVP * vec4(p,1.0); return; }
  z = texture(uElev, uv).r;
  vec2 m = (uv - 0.5) * uMapM * vec2(1.0, -1.0);          // uv.y grows southward; metres y grows northward
  vec3 p = onSphere(m, z*uVE, uRc); vPos = p; vUv = uv; vDist = distance(p, uEye);
  gl_Position = uVP * vec4(p,1.0);
}`;
const FS_T = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D uElev, uWater; uniform vec2 uTex, uPxM, uZ; uniform float uTime, uSkirt, uLinear, uOrbit, uRc; uniform vec3 uSun, uEye;
in vec2 vUv; in float vDist; in vec3 vPos; out vec4 o;
${COMMON}
float ebi(vec2 uv){ vec2 p = uv*uTex - 0.5; vec2 i = floor(p), f = fract(p); vec2 t = 1.0/uTex;
  float a = texture(uElev,(i+0.5)*t).r, b = texture(uElev,(i+vec2(1,0)+0.5)*t).r, c = texture(uElev,(i+vec2(0,1)+0.5)*t).r, d = texture(uElev,(i+1.0+0.5)*t).r;
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }
float E(vec2 uv){ return uLinear > 0.5 ? texture(uElev, uv).r : ebi(uv); }
vec3 ramp(float t){
  vec3 c0=vec3(.10,.16,.19), c1=vec3(.16,.27,.23), c2=vec3(.28,.42,.28), c3=vec3(.48,.55,.35), c4=vec3(.70,.62,.44), c5=vec3(.87,.83,.76), c6=vec3(.97,.96,.93);
  if (t<.13) return mix(c0,c1,t/.13); if (t<.30) return mix(c1,c2,(t-.13)/.17); if (t<.50) return mix(c2,c3,(t-.30)/.20);
  if (t<.70) return mix(c3,c4,(t-.50)/.20); if (t<.88) return mix(c4,c5,(t-.70)/.18); return mix(c5,c6,(t-.88)/.12); }
void main(){
  vec3 atm = vec3(.55,.70,.86);
  vec3 up = normalize(vPos + vec3(0.,0.,uRc));
  vec3 col;
  bool inside = uSkirt < 0.5 && vUv.x > 0.0 && vUv.x < 1.0 && vUv.y > 0.0 && vUv.y < 1.0;
  if (inside){
    vec2 e = 1.0/uTex; vec2 cuv = clamp(vUv, e, 1.0-e);
    float z = E(cuv);
    float ve = 2.2;
    float zW = E(cuv - vec2(e.x,0.)), zE = E(cuv + vec2(e.x,0.)), zN = E(cuv - vec2(0.,e.y)), zS = E(cuv + vec2(0.,e.y));
    vec3 n = normalize(vec3(-(zE-zW)/(2.0*uPxM.x)*ve, -(zN-zS)/(2.0*uPxM.y)*ve, 1.0));
    float diff = max(dot(n, uSun), 0.0);
    float shade = mix(0.36, 1.15, diff);
    float occ = 0.0;
    for (int i=0;i<6;i++){ float a = float(i)*1.0472; vec2 dv = vec2(cos(a), sin(a));
      occ += max(0.0, (E(cuv + dv*e*3.0) - z)/(3.0*uPxM.x)) + 0.6*max(0.0, (E(cuv + dv*e*9.0) - z)/(9.0*uPxM.x)); }
    float ao = 1.0 - clamp(occ/6.0*1.5*ve, 0.0, 0.5);
    float t = clamp((z - uZ.x)/(uZ.y - uZ.x), 0.0, 1.0); t = pow(t, 0.72);
    col = ramp(t) * shade * ao;
    float haze = pow(1.0 - t, 2.0) * 0.14; col = mix(col, vec3(.18,.24,.30), haze);
    float iv = 100.0; float fz = fract(z/iv); float dist = min(fz, 1.0-fz)*iv; float wz = fwidth(z) + 1e-3;
    float line = 1.0 - smoothstep(0.35*wz, 1.3*wz, dist); float fade = 1.0 - smoothstep(25.0, 70.0, wz);
    float band = fract(z/900.0 - uTime*0.02); float shimmer = smoothstep(0.0, 0.12, band) * (1.0 - smoothstep(0.12, 0.5, band));
    col = mix(col, vec3(1.0,.95,.86), line * fade * (0.14 + 0.22*shimmer));
    float w = smoothstep(0.35, 0.65, texture(uWater, cuv).r);
    vec2 wp = vUv*uTex*0.9; float rip = noise(wp + uTime*0.35)*0.6 + noise(wp*2.3 - uTime*0.5)*0.4;
    vec3 wn = normalize(vec3((rip-0.5)*0.18, (noise(wp*1.7+uTime*0.3)-0.5)*0.18, 1.0));
    float glint = pow(max(dot(reflect(-uSun, wn), vec3(0.,0.,1.)), 0.0), 48.0);
    col = mix(col, vec3(.10,.22,.33)*(0.85+0.3*rip) + glint*0.35, w);
    // soften the map edge into the skirt
    vec2 fe = smoothstep(0.0, 0.09, vUv) * smoothstep(0.0, 0.09, 1.0-vUv); float edge = fe.x*fe.y;
    vec3 skirt = ramp(0.22) * (0.55 + 0.45*max(dot(up, uSun), 0.0)) * (0.85 + 0.3*noise(vUv*40.0));
    col = mix(skirt, col, edge);
  } else {
    // land beyond the survey: dark, faintly textured, lit by the same sun
    float nz = noise(vUv*40.0)*0.5 + noise(vUv*9.0)*0.5;
    col = mix(ramp(0.12), ramp(0.3), nz) * 0.8 * (0.55 + 0.45*max(dot(up, uSun), 0.0));
  }
  // atmosphere: distance fog toward the horizon, and a rim as the surface turns away from the eye
  vec3 toEye = normalize(uEye - vPos);
  float rim = pow(1.0 - clamp(dot(up, toEye), 0.0, 1.0), 2.5);
  float fogD = mix(1400e3, 3600e3, uOrbit);
  float fog = 1.0 - exp(-vDist / fogD);
  col = mix(col, atm, clamp(fog*0.7 + rim*0.45, 0.0, 0.9));
  o = vec4(col, 1.0);
}`;
// ---------- sky ----------
const VS_Q = `#version 300 es
in vec2 p; out vec2 vN; void main(){ vN = p; gl_Position = vec4(p,0.,1.); }`;
const FS_SKY = `#version 300 es
precision highp float;
uniform mat4 uInvVP; uniform vec3 uEye, uSun; uniform float uRc, uTime; in vec2 vN; out vec4 o;
${COMMON}
void main(){
  vec4 pw = uInvVP * vec4(vN, 1.0, 1.0); vec3 far = pw.xyz / pw.w; vec3 d = normalize(far - uEye);
  vec3 O = vec3(0.,0.,-uRc); vec3 toC = O - uEye; float dc = length(toC); vec3 tc = toC / dc;
  float cosH = sqrt(max(0.0, 1.0 - (uRc*uRc)/(dc*dc)));          // cosine of the angle from nadir to the horizon
  float ang = acos(clamp(dot(d, tc), -1.0, 1.0)) - acos(cosH);    // radians above the horizon
  float t = clamp(ang / 0.9, 0.0, 1.0);
  vec3 limb = vec3(.86,.93,1.0), blue = vec3(.24,.45,.78), space = vec3(.010,.014,.024);
  vec3 col = mix(limb, blue, smoothstep(0.0, 0.05, t));
  col = mix(col, space, smoothstep(0.03, 0.30, t));
  // stars
  vec3 sd = d*400.0; vec3 fi = floor(sd); float h = hash(fi.xy + fi.z*0.37); float star = smoothstep(0.9935, 1.0, h) * smoothstep(0.10, 0.30, t);
  star *= 0.7 + 0.5*sin(uTime*2.0 + h*60.0);
  col += vec3(star)*1.3;
  // sun glow
  float s = max(dot(d, uSun), 0.0); col += vec3(1.0,.9,.7) * pow(s, 260.0) * 1.2 + vec3(.9,.8,.6)*pow(s, 12.0)*0.06*smoothstep(0.0,0.1,t);
  // below the horizon (should be covered by terrain): deep atmosphere
  if (ang < 0.0) col = mix(limb, vec3(.45,.60,.78), clamp(-ang*6.0, 0.0, 1.0));
  o = vec4(col, 1.0);
}`;
// ---------- post: filming a big screen ----------
const FS_POST = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D uScene; uniform vec2 uRes; uniform float uTime, uDpr; in vec2 vN; out vec4 o;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
vec2 barrel(vec2 n){ float r2 = dot(n,n); return n * (1.0 + 0.045*r2 + 0.012*r2*r2) * 0.985; }
void main(){
  vec2 n = barrel(vN); vec2 uv = n*0.5 + 0.5;
  float r2 = dot(n,n);
  // chromatic aberration grows toward the edges
  vec2 ca = n * 0.0028 * r2;
  vec3 c; c.r = texture(uScene, uv + ca).r; c.g = texture(uScene, uv).g; c.b = texture(uScene, uv - ca).b;
  // phosphor bloom: a soft ring of samples
  vec3 bl = vec3(0.); float px = 1.0/uRes.y * 3.0;
  bl += texture(uScene, uv + vec2(px,0.)).rgb + texture(uScene, uv - vec2(px,0.)).rgb + texture(uScene, uv + vec2(0.,px)).rgb + texture(uScene, uv - vec2(0.,px)).rgb;
  c = mix(c, bl*0.25, 0.22) + max(bl*0.25 - 0.55, 0.0) * 0.35;
  c *= 1.22;

  gl.disable(gl.DEPTH_TEST); gl.useProgram(progSky); gl.bindVertexArray(quad);
  gl.uniformMatrix4fv(U(progSky,'uInvVP'), false, cam.invVP); gl.uniform3fv(U(progSky,'uEye'), cam.eye); gl.uniform3fv(U(progSky,'uSun'), sunDir); gl.uniform1f(U(progSky,'uRc'), Rc); gl.uniform1f(U(progSky,'uTime'), tNow);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.clear(gl.DEPTH_BUFFER_BIT); gl.useProgram(progT);
  gl.uniform1i(U(progT,'uElev'),0); gl.uniform1i(U(progT,'uWater'),1); gl.uniformMatrix4fv(U(progT,'uVP'), false, cam.VP); gl.uniform2f(U(progT,'uMapM'), Wm, Hm);
  gl.uniform1f(U(progT,'uRc'), Rc); gl.uniform1f(U(progT,'uVE'), VE); gl.uniform1f(U(progT,'uTime'), tNow); gl.uniform3fv(U(progT,'uEye'), cam.eye); gl.uniform3fv(U(progT,'uSun'), sunDir);
  gl.uniform2f(U(progT,'uTex'), TW, TH); gl.uniform2f(U(progT,'uPxM'), R.mpp[0], R.mpp[1]); gl.uniform2f(U(progT,'uZ'), R.zmin, R.zmax); gl.uniform1f(U(progT,'uLinear'), floatLinear?1:0); gl.uniform1f(U(progT,'uOrbit'), view.orbit);
  gl.uniform1f(U(progT,'uSkirt'), 1); gl.bindVertexArray(meshSkirt.vao); gl.drawElements(gl.TRIANGLES, meshSkirt.n, gl.UNSIGNED_INT, 0);
  gl.uniform1f(U(progT,'uSkirt'), 0); gl.bindVertexArray(meshFine.vao); gl.drawElements(gl.TRIANGLES, meshFine.n, gl.UNSIGNED_INT, 0);
  // post: to the screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0,0,canvas.width,canvas.height); gl.disable(gl.DEPTH_TEST);
  gl.useProgram(progPost); gl.bindVertexArray(quad); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, fboTex); gl.uniform1i(U(progPost,'uScene'), 2);
  gl.uniform2f(U(progPost,'uRes'), canvas.width, canvas.height); gl.uniform1f(U(progPost,'uTime'), tNow); gl.uniform1f(U(progPost,'uDpr'), dpr);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  layout();
}
requestAnimationFrame(frame);
window.__region = { view, goal, select, deselect, props: R.props, cam: ()=>cam };

function fallback(msg){ document.getElementById('stage').innerHTML=''; const f=document.createElement('div'); f.className='fallback'; f.innerHTML='<p>'+msg+'</p>'+R.props.map(p=>`<a href="${p.slug}.html">${p.name}</a>`).join('<br>'); document.body.appendChild(f); }
})().catch(err => { console.error(err); const f=document.createElement('div'); f.className='fallback'; f.innerHTML='<p>Could not draw the map: '+err.message+'</p>'+window.REGION.props.map(p=>`<a href="${p.slug}.html">${p.name}</a>`).join('<br>'); document.body.appendChild(f); });
</script>
