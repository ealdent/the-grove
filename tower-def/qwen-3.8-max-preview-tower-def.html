<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17123a">
<title>🌙 Dream Defenders — Slumber Siege</title>
<style>
:root{
  --bg1:#17123a; --bg2:#241d5c;
  --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.14);
  --txt:#f3efff; --dim:#b9aee8;
  --gold:#ffd75e; --pink:#ff8fc7; --mint:#7ef0c3; --violet:#a78bfa;
  --font:ui-rounded,'Hiragino Maru Gothic ProN','Quicksand','Comfortaa','Comic Sans MS','Chalkboard SE',cursive,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--txt);font-family:var(--font);
  background:radial-gradient(1200px 800px at 85% -10%,#3b2e8f 0%,transparent 60%),
  radial-gradient(1000px 700px at -10% 110%,#4c1d95 0%,transparent 55%),
  linear-gradient(180deg,var(--bg1),var(--bg2));}
#app{max-width:1400px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.logo span{background:linear-gradient(90deg,#ffd75e,#ff8fc7,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);padding:6px 13px;border-radius:999px;font-weight:800;
  display:flex;gap:6px;align-items:center;min-width:78px;justify-content:center;font-size:14px}
.chip b{font-variant-numeric:tabular-nums}
.chip.gold b{color:var(--gold)} .chip.pinkc b{color:var(--pink)}
.chip.ouch{animation:ouchF .5s}
@keyframes ouchF{0%,100%{background:var(--card)}30%{background:rgba(255,80,120,.5)}}
.ctrls{margin-left:auto;display:flex;gap:8px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:800}
button:disabled{cursor:default}
.iconBtn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:8px 12px;font-size:14px;transition:.15s}
.iconBtn:hover{background:var(--card2);transform:translateY(-1px)}
main{display:flex;gap:12px;align-items:flex-start}
#stage{position:relative;flex:1 1 auto;min-width:0;border-radius:20px;overflow:hidden;aspect-ratio:3/2;background:#241d5c;
  box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.08)}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:20px;box-shadow:inset 0 0 90px rgba(10,5,30,.5)}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#banner{position:absolute;top:11%;left:0;right:0;text-align:center;pointer-events:none;z-index:2;
  font-size:clamp(22px,4.5vw,36px);font-weight:900;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#banner.show{animation:ban 1.9s ease-out}
#banner .sub{display:block;font-size:14px;color:var(--dim);font-weight:700}
@keyframes ban{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.06)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:rgba(15,10,40,.72);backdrop-filter:blur(6px);padding:14px}
#overlay.hidden{display:none}
.ovCard{background:linear-gradient(180deg,rgba(62,47,133,.96),rgba(35,25,85,.96));border:2px solid rgba(255,255,255,.16);
  border-radius:24px;padding:26px 32px;max-width:470px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.ovEmoji{font-size:56px;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.ovCard h1{margin:6px 0 8px;font-size:30px;background:linear-gradient(90deg,#ffd75e,#ff8fc7);-webkit-background-clip:text;background-clip:text;color:transparent}
.ovCard p{color:var(--dim);font-size:14px;line-height:1.55;margin:6px 0}
.ovCard p b{color:var(--txt)}
.howto{text-align:left;font-size:13px;color:var(--dim);padding-left:20px;margin:12px 0 18px;line-height:1.8}
.bigBtn{padding:13px 26px;font-size:17px;color:#3d2600;background:linear-gradient(180deg,#ffe9a3,#ffc93d);
  box-shadow:0 4px 0 #d9a514,0 10px 24px rgba(255,201,61,.3);border-radius:16px;transition:.1s}
.bigBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a514}
.bigBtn.pink{color:#4a1030;background:linear-gradient(180deg,#ffb1d3,#ff7ab8);box-shadow:0 4px 0 #d1478c,0 10px 24px rgba(255,122,184,.3)}
.bigBtn.pink:active{box-shadow:0 1px 0 #d1478c}
#side{width:302px;flex:0 0 302px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase}
.shopCard{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:12px;border:2px solid transparent;
  background:rgba(255,255,255,.05);margin-bottom:8px;cursor:pointer;transition:.15s;user-select:none}
.shopCard:last-child{margin-bottom:0}
.shopCard:hover{background:rgba(255,255,255,.11);transform:translateX(2px)}
.shopCard.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(255,215,94,.28)}
.shopCard.cant{opacity:.45;filter:grayscale(.6)}
.shopCard canvas{width:46px;height:46px;flex:0 0 46px}
.scName{font-weight:900;font-size:13.5px}
.scDesc{font-size:11px;color:var(--dim)}
.scCost{margin-left:auto;color:var(--gold);font-weight:900;white-space:nowrap;font-size:14px}
.selHead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
#selIcon{width:56px;height:56px;flex:0 0 56px}
#selName{font-weight:900;font-size:16px}
.pips{color:var(--gold);letter-spacing:3px;font-size:14px}
#selStats{margin:4px 0 10px}
.statRow{display:flex;justify-content:space-between;font-size:13px;padding:4px 2px;border-bottom:1px dashed rgba(255,255,255,.1)}
.statRow .nxt{color:var(--mint);font-size:11px;margin-left:6px;font-weight:900}
.bigBtn.small{width:100%;padding:10px;font-size:14px;margin-bottom:6px}
.bigBtn.small:disabled{filter:grayscale(.8);opacity:.55}
.iconBtn.wide{width:100%;padding:9px;font-size:13px;background:rgba(255,107,138,.12);border-color:rgba(255,107,138,.4);color:#ffb3c6}
.preview{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:26px}
.pvChip{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.pvChip.boss{border-color:var(--gold);color:var(--gold)}
#startBtn{width:100%;padding:12px;font-size:16px;color:#4a1030;background:linear-gradient(180deg,#ffb1d3,#ff7ab8);
  box-shadow:0 4px 0 #d1478c,0 8px 20px rgba(255,122,184,.35);border-radius:14px;transition:.1s}
#startBtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #d1478c}
#startBtn.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
#startBtn:disabled{filter:grayscale(.7);opacity:.6;animation:none}
.hint{font-size:11px;color:var(--dim);text-align:center;margin:0}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(30,20,70,.94);border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-weight:800;
  font-size:13px;animation:tin .25s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.4)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
.toast.out{opacity:0;transform:translateY(-6px);transition:.3s}
.hidden{display:none!important}
.back-btn{display:inline-block;align-self:flex-start;margin-bottom:2px;color:var(--dim);text-decoration:none;font-weight:800;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;transition:.15s}
.back-btn:hover{color:var(--txt);background:var(--card2)}
@media(max-width:980px){
  main{flex-direction:column}
  #side{width:100%;flex:1 1 auto;flex-direction:row;flex-wrap:wrap}
  #side .panel{flex:1 1 264px}
  #selPanel{order:-1}
  #shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .shopCard{margin-bottom:0}
}
@media(max-width:600px){
  #shop{grid-template-columns:1fr}
  .ctrls{margin-left:0;width:100%}
  .ctrls .iconBtn{flex:1}
  .logo{font-size:18px}
}
</style>
</head>
<body>
<div id="app">
  <a class="back-btn" href="index.html">&larr; back to selection</a>
  <header>
    <div class="logo">🌙 <span>Dream Defenders</span></div>
    <div class="stats">
      <div class="chip gold" id="dustChip" title="Dream Dust — spend it on guardians">✨ <b id="dust">130</b></div>
      <div class="chip pinkc" id="livesChip" title="Dream hearts — nightmares reaching the bed cost hearts">💜 <b id="lives">20</b></div>
      <div class="chip" title="Wave">🌊 <b id="waveNum">1/25</b></div>
    </div>
    <div class="ctrls">
      <button class="iconBtn" id="speedBtn" title="Game speed (F)">⏩ 1×</button>
      <button class="iconBtn" id="muteBtn" title="Sound (M)">🔊</button>
      <button class="iconBtn" id="newBtn" title="Randomize the dream track & restart">🌀 New Dream</button>
    </div>
  </header>
  <main>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="banner"></div>
      <div id="overlay"></div>
    </div>
    <aside id="side">
      <section class="panel"><h3>🛍️ Dream Shop</h3><div id="shop"></div></section>
      <section class="panel hidden" id="selPanel">
        <h3>🧸 Chosen Guardian</h3>
        <div class="selHead"><canvas id="selIcon" width="92" height="92"></canvas>
          <div><div id="selName"></div><div class="pips" id="selPips"></div></div></div>
        <div id="selStats"></div>
        <button class="bigBtn small" id="upBtn"></button>
        <button class="iconBtn wide" id="sellBtn"></button>
      </section>
      <section class="panel">
        <h3>🌊 Nightmare Watch</h3>
        <div class="preview" id="preview"></div>
        <button id="startBtn">▶ Start Wave 1</button>
      </section>
      <p class="hint">Keys: 1–5 pick guardian · Esc cancel · Space start wave · F speed · M mute</p>
    </aside>
  </main>
</div>
<div id="toasts"></div>

<script>
(()=>{'use strict';
/* ============ CONSTANTS & DATA ============ */
const W=960,H=640,CELL=64,COLS=15,ROWS=10;
const FONT='"Comic Sans MS","Chalkboard SE",ui-rounded,sans-serif';
const START_DUST=130, START_LIVES=20, TOTAL_WAVES=25;

const TOWERS={
  star:{name:'Twinkle Turret',cost:50,desc:'Rapid twinkling star shots',color:'#ffd75e',levels:[
    {dmg:6,rate:2.4,range:110},
    {dmg:9,rate:2.7,range:118,cost:40},
    {dmg:13,rate:3.0,range:126,cost:75},
    {dmg:18,rate:3.4,range:136,cost:120},
    {dmg:26,rate:4.0,range:150,cost:185}]},
  moon:{name:'Luna Mage',cost:75,desc:'Moon orbs with splash damage',color:'#ffe9a3',levels:[
    {dmg:14,rate:0.8,range:120,splash:46},
    {dmg:21,rate:0.85,range:126,splash:54,cost:60},
    {dmg:30,rate:0.9,range:132,splash:62,cost:105},
    {dmg:42,rate:1.0,range:140,splash:72,cost:165},
    {dmg:60,rate:1.1,range:150,splash:88,cost:250}]},
  bear:{name:'Snuggle Bear',cost:65,desc:'Hug pulses slow all nearby foes',color:'#ff8fc7',levels:[
    {dmg:2,rate:1.4,range:100,slow:.25,slowDur:1.2},
    {dmg:3,rate:1.5,range:110,slow:.32,slowDur:1.3,cost:50},
    {dmg:5,rate:1.6,range:120,slow:.40,slowDur:1.4,cost:90},
    {dmg:7,rate:1.7,range:132,slow:.48,slowDur:1.5,cost:145},
    {dmg:10,rate:1.9,range:146,slow:.55,slowDur:1.6,sleep:.08,cost:210}]},
  cloud:{name:'Nimbus Cannon',cost:90,desc:'Zappy chain lightning',color:'#fff3a0',levels:[
    {dmg:10,rate:1.1,range:115,chains:2},
    {dmg:15,rate:1.2,range:120,chains:2,cost:70},
    {dmg:21,rate:1.3,range:128,chains:3,cost:120},
    {dmg:29,rate:1.4,range:136,chains:4,cost:185},
    {dmg:40,rate:1.6,range:146,chains:5,stun:.25,cost:270}]},
  prism:{name:'Prism Weaver',cost:110,desc:'Piercing rainbow beam',color:'#c78bfa',levels:[
    {dmg:9,rate:1.3,range:130},
    {dmg:13,rate:1.4,range:138,cost:85},
    {dmg:18,rate:1.5,range:146,burn:4,cost:140},
    {dmg:25,rate:1.7,range:156,burn:7,cost:215},
    {dmg:35,rate:1.9,range:168,burn:11,wide:1,cost:310}]}
};
const order=['star','moon','bear','cloud','prism'];

const ENEMIES={
  gloom:{name:'Gloomling',hp:26,speed:55,reward:6,dmg:1,r:12,emoji:'👾'},
  alarm:{name:'Jitter Alarm',hp:16,speed:105,reward:7,dmg:1,r:11,emoji:'⏰'},
  moth:{name:'Dread Moth',hp:34,speed:70,reward:8,dmg:1,r:12,slowResist:.5,emoji:'🦋'},
  grumble:{name:'Grumble',hp:95,speed:38,reward:14,dmg:2,r:17,emoji:'👹'},
  snail:{name:'Doom Snail',hp:230,speed:24,reward:26,dmg:3,r:16,emoji:'🐌'},
  wisp:{name:'Panic Wisp',hp:22,speed:128,reward:9,dmg:1,r:10,emoji:'💨'},
  gking:{name:'Grumble King',hp:850,speed:34,reward:110,dmg:5,r:26,boss:1,emoji:'👑'},
  nmare:{name:'Night Mare',hp:1900,speed:56,reward:200,dmg:8,r:24,boss:1,emoji:'🦄'},
  mqueen:{name:'Moth Queen',hp:3400,speed:46,reward:300,dmg:10,r:26,boss:1,slowResist:.7,emoji:'👸'},
  nking:{name:'Nightmare King',hp:6500,speed:40,reward:480,dmg:14,r:30,boss:1,emoji:'😈'},
  sandman:{name:'Sandman Undone',hp:13000,speed:44,reward:900,dmg:20,r:30,boss:1,emoji:'⏳'}
};

const WAVES=[
  [{t:'gloom',n:8,gap:1.0}],
  [{t:'gloom',n:12,gap:.85}],
  [{t:'gloom',n:6,gap:.9},{t:'alarm',n:6,gap:.7,delay:6}],
  [{t:'alarm',n:14,gap:.55}],
  [{t:'gloom',n:6,gap:.8},{t:'gking',n:1,gap:1,delay:5}],
  [{t:'moth',n:10,gap:.9}],
  [{t:'gloom',n:14,gap:.6},{t:'grumble',n:4,gap:2.2,delay:3}],
  [{t:'alarm',n:12,gap:.5},{t:'moth',n:8,gap:1,delay:4}],
  [{t:'grumble',n:6,gap:1.8},{t:'gloom',n:10,gap:.7,delay:2}],
  [{t:'wisp',n:8,gap:.5},{t:'nmare',n:1,gap:1,delay:5}],
  [{t:'alarm',n:18,gap:.4},{t:'moth',n:8,gap:.8,delay:6}],
  [{t:'grumble',n:8,gap:1.5},{t:'snail',n:1,gap:1,delay:8}],
  [{t:'moth',n:14,gap:.6},{t:'wisp',n:10,gap:.45,delay:5}],
  [{t:'snail',n:3,gap:4},{t:'gloom',n:12,gap:.6,delay:2}],
  [{t:'moth',n:10,gap:.7},{t:'mqueen',n:1,gap:1,delay:8}],
  [{t:'alarm',n:14,gap:.35},{t:'wisp',n:12,gap:.4,delay:6},{t:'grumble',n:4,gap:2,delay:10}],
  [{t:'grumble',n:10,gap:1.3},{t:'moth',n:10,gap:.7,delay:4}],
  [{t:'snail',n:5,gap:3},{t:'alarm',n:14,gap:.4,delay:5}],
  [{t:'wisp',n:20,gap:.3},{t:'moth',n:10,gap:.6,delay:8}],
  [{t:'grumble',n:8,gap:1.2},{t:'nking',n:1,gap:1,delay:10}],
  [{t:'gloom',n:16,gap:.4},{t:'alarm',n:14,gap:.35,delay:4},{t:'moth',n:10,gap:.6,delay:9}],
  [{t:'snail',n:8,gap:2.2}],
  [{t:'alarm',n:20,gap:.25},{t:'wisp',n:18,gap:.3,delay:8}],
  [{t:'grumble',n:12,gap:1},{t:'snail',n:6,gap:2.5,delay:6},{t:'moth',n:12,gap:.5,delay:10}],
  [{t:'wisp',n:12,gap:.35},{t:'grumble',n:8,gap:1.2,delay:4},{t:'sandman',n:1,gap:1,delay:14}]
];

/* ============ DOM ============ */
const $=id=>document.getElementById(id);
const cv=$('cv'),stage=$('stage'),bannerEl=$('banner'),ov=$('overlay'),
  dustEl=$('dust'),livesEl=$('lives'),waveEl=$('waveNum'),livesChip=$('livesChip'),
  speedBtn=$('speedBtn'),muteBtn=$('muteBtn'),newBtn=$('newBtn'),
  shopEl=$('shop'),selPanel=$('selPanel'),selIcon=$('selIcon'),selName=$('selName'),
  selPips=$('selPips'),selStats=$('selStats'),upBtn=$('upBtn'),sellBtn=$('sellBtn'),
  previewEl=$('preview'),startBtn=$('startBtn'),toastsEl=$('toasts');
let ctx=cv.getContext('2d');

/* ============ AUDIO (tiny synth, no files) ============ */
let AC=null,master=null,muted=false,lastPop=0,lastZap=0,lastBoom=0;
function audio(){try{
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.35;master.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();
}catch(e){}}
function tone(f,dur,type,vol,slide,delay){
  if(!AC||muted)return;try{
  const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+dur);
  g.gain.setValueAtTime(vol||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);}catch(e){}}
const SFX={
  click:()=>tone(620,.06,'square',.06),
  err:()=>tone(150,.16,'sawtooth',.1,-50),
  place:()=>{tone(523,.09,'triangle',.16);tone(784,.12,'triangle',.16,0,.07);},
  upgrade:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.1,'triangle',.14,0,i*.07)),
  sell:()=>{tone(700,.08,'triangle',.12);tone(420,.1,'triangle',.12,0,.06);},
  pop:()=>{if(time-lastPop>.05){lastPop=time;tone(280+Math.random()*240,.09,'triangle',.1,-170);}},
  boom:()=>{if(time-lastBoom>.09){lastBoom=time;tone(170,.16,'triangle',.13,-70);}},
  zap:()=>{if(time-lastZap>.07){lastZap=time;tone(1300,.05,'square',.045,-800);}},
  leak:()=>tone(190,.3,'sawtooth',.16,-100),
  wave:()=>[392,523,659].forEach((f,i)=>tone(f,.12,'square',.08,0,i*.09)),
  boss:()=>{tone(90,.8,'sawtooth',.16,-30);tone(125,.8,'square',.1,-45,.1);},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,'triangle',.16,0,i*.12)),
  lose:()=>[400,340,280,200].forEach((f,i)=>tone(f,.22,'sawtooth',.12,0,i*.16))
};

/* ============ STATE ============ */
let time=0,gt=0,state='menu',gameSpeed=1;
let dust=START_DUST,lives=START_LIVES,wave=1,kills=0,endless=false,nextEndlessDef=null;
let pathPts=[],segLen=[],segAng=[],cum=[],totalLen=0;
let towers=[],enemies=[],projectiles=[],effects=[],particles=[],texts=[];
let spawnQueue=[],spawnT=0,shake=0;
let buildType=null,sel=null;
const mouse={x:0,y:0,in:false};
let scale=1;

/* ============ PATH (random every game) ============ */
function genPath(){
  for(let tries=0;tries<40;tries++){
    const cells=[],used=new Set();
    let r=1+((Math.random()*(ROWS-2))|0),c=0,vert=0;
    const add=(c,r)=>{cells.push([c,r]);used.add(c+','+r);};
    add(c,r);
    while(c<COLS-1){
      if(Math.random()<.85){
        const dir=Math.random()<.5?-1:1,n=1+((Math.random()*3)|0);
        for(let i=0;i<n;i++){const nr=r+dir;
          if(nr<1||nr>ROWS-2)break;if(used.has(c+','+nr))break;
          r=nr;add(c,r);vert++;}
      }
      c++;add(c,r);
    }
    if(vert>=6)return cells.map(([cc,rr])=>({x:cc*CELL+CELL/2,y:rr*CELL+CELL/2}));
  }
  return [{x:32,y:320},{x:928,y:320}];
}
function buildMetrics(){
  segLen=[];segAng=[];cum=[0];totalLen=0;
  for(let i=0;i<pathPts.length-1;i++){
    const a=pathPts[i],b=pathPts[i+1],l=Math.hypot(b.x-a.x,b.y-a.y);

/* ============ DRAW HELPERS ============ */
function blob(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}

  ctx.bezierCurveTo(cx,cy,cx-s*.55,cy,cx-s*.55,cy+s*.3);
  ctx.bezierCurveTo(cx-s*.55,cy+s*.55,cx-s*.2,cy+s*.75,cx,cy+s*.95);
  ctx.bezierCurveTo(cx+s*.2,cy+s*.75,cx+s*.55,cy+s*.55,cx+s*.55,cy+s*.3);

  ctx.lineTo(x,y-s*.5);ctx.lineTo(x+s*.5,y+s*.15);ctx.lineTo(x+s,y-s*.2);ctx.lineTo(x+s,y+s*.6);

    ctx.fillStyle='#3a2b5f';ctx.beginPath();ctx.arc(x+s*5*sc+px*.6,y-1*sc+py*.6,1.9*sc,0,7);ctx.fill();}
  ctx.strokeStyle='#3a2b5f';ctx.lineWidth=1.6*sc;

  ctx.fillStyle='rgba(255,140,180,.55)';
  for(const s of[-1,1]){ctx.beginPath();ctx.arc(x+s*8.5*sc,y+2.5*sc,2*sc,0,7);ctx.fill();}
}

/* ============ TOWER BODIES ============ */

/* ============ FX ============ */
function spark(x,y,c,n){for(let i=0;i<(n||5);i++){const a=Math.random()*7,sp=30+Math.random()*70;
  particles.push({kind:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-20,life:.35+Math.random()*.3,max:.6,s:2+Math.random()*2,c});}}
function poof(x,y,c,n){for(let i=0;i<(n||8);i++){const a=Math.random()*7,sp=20+Math.random()*50;
  particles.push({kind:'poof',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-15,life:.5+Math.random()*.3,max:.8,s:5+Math.random()*5,c});}}
function hearts(x,y,n){for(let i=0;i<(n||3);i++)
  particles.push({kind:'heart',x:x+(Math.random()-.5)*16,y,vx:(Math.random()-.5)*20,vy:-30-Math.random()*20,life:.9,max:.9,s:6+Math.random()*4,c:'#ff8fc7'});}
function addText(x,y,txt,c){texts.push({x,y,txt,c,life:1});}
function stepFx(dt){
  for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;}
  particles=particles.filter(p=>p.life>0);
  effects=effects.filter(f=>time-f.t0<f.ttl);
  for(const t of texts){t.life-=dt;t.y-=22*dt;}
  texts=texts.filter(t=>t.life>0);
  if(state!=='menu'&&Math.random()<dt*3){const p=pathPts[0];
    spark(p.x+(Math.random()-.5)*20,p.y+(Math.random()-.5)*20,'#a78bfa',1);}
}

function damage(e,amt){

function killEnemy(e){
  if(e.dead)return;e.dead=true;kills++;dust+=e.reward;

  particles.push({kind:'star',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,g:160,life:1.1,max:1.1,s:4+Math.random()*3,

function leak(e){

function addBolt(x1,y1,x2,y2){
  const pts=[{x:x1,y:y1}],dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  for(let i=1;i<5;i++){const tt=i/5,off=(Math.random()-.5)*14;
    pts.push({x:x1+dx*tt+nx*off,y:y1+dy*tt+ny*off});}
  pts.push({x:x2,y:y2});
  effects.push({type:'bolt',pts,t0:time,ttl:.15});
}
function chain(t,e,st,ox,oy){
  const hits=[e];let last=e;
  while(hits.length<st.chains){
    let best=null,bd=95;
    for(const o of enemies){if(o.dead||hits.indexOf(o)>=0)continue;
      const d=Math.hypot(o.x-last.x,o.y-last.y);if(d<bd){bd=d;best=o;}}
    if(!best)break;hits.push(best);last=best;}
  let prev={x:ox,y:oy};
  for(const o of hits){damage(o,st.dmg);
    if(st.stun)o.stunUntil=Math.max(o.stunUntil,gt+st.stun);
    addBolt(prev.x,prev.y,o.x,o.y);spark(o.x,o.y,'#ffe9a3',3);prev=o;}
}
function fireBeam(t,e,st,ox,oy){
  const ang=Math.atan2(e.y-oy,e.x-ox),len=st.range*1.15;
  const ex=ox+Math.cos(ang)*len,ey=oy+Math.sin(ang)*len,w=st.wide?16:10;
  const a={x:ox,y:oy},b={x:ex,y:ey};
  for(const o of enemies){if(!o.dead&&distToSeg(o.x,o.y,a,b)<w/2+o.r){
    damage(o,st.dmg);if(st.burn)o.burns.push({dps:st.burn,until:gt+2});}}
  effects.push({type:'beam',x1:ox,y1:oy,x2:ex,y2:ey,w,t0:time,ttl:.18});
}
function pulse(t,st){
  effects.push({type:'ring',x:t.x,y:t.y-4,r0:12,r1:st.range,t0:time,ttl:.45,color:'#ff8fc7'});
  let hit=false;
  for(const o of enemies){
    if(!o.dead&&Math.hypot(o.x-t.x,o.y-(t.y-4))<=st.range+o.r){
      hit=true;damage(o,st.dmg);
      const fac=st.slow*(1-o.slowResist);
      if(fac>o.slowFac)o.slowFac=fac;
      o.slowUntil=Math.max(o.slowUntil,gt+st.slowDur);
      if(st.sleep&&Math.random()<st.sleep){o.stunUntil=Math.max(o.stunUntil,gt+.9);addText(o.x,o.y-o.r-8,'💤','#c4b5fd');}}}
  if(hit)hearts(t.x,t.y-16,2);
}
function explodeOrb(p){
  effects.push({type:'ring',x:p.x,y:p.y,r0:6,r1:p.splash,t0:time,ttl:.3,color:'#ffd75e'});
  for(const o of enemies)if(!o.dead&&Math.hypot(o.x-p.x,o.y-p.y)<=p.splash+o.r)damage(o,p.dmg);
  poof(p.x,p.y,'#ffe9a3',5);SFX.boom();
}
function fire(t,e,st){
  const ox=t.x,oy=t.y-12;
  if(t.type==='star'){projectiles.push({type:'star',x:ox,y:oy,target:e,speed:440,dmg:st.dmg,ang:0});spark(ox,oy,'#ffd75e',2);}
  else if(t.type==='moon')projectiles.push({type:'orb',x:ox,y:oy,target:e,speed:255,dmg:st.dmg,splash:st.splash,ang:0});
  else if(t.type==='cloud'){chain(t,e,st,ox,oy);SFX.zap();}
  else if(t.type==='prism')fireBeam(t,e,st,ox,oy);
  else pulse(t,st);
}

/* ============ WAVES ============ */
function makeEndless(w){
  const pool=['gloom','alarm','moth','grumble','snail','wisp'],gs=[];
  const k=2+((Math.random()*2)|0);
  for(let i=0;i<k;i++){const t=pool[(Math.random()*pool.length)|0];
    gs.push({t,n:Math.round(6+w*.7+Math.random()*6),gap:Math.max(.25,.8-w*.01),delay:i*4});}
  if(w%5===0)gs.push({t:['gking','nmare','mqueen','nking','sandman'][((w/5)|0)%5],n:1+(((w-25)/10)|0),gap:5,delay:8});
  return gs;
}
function buildQueue(w){
  const def=w<=WAVES.length?WAVES[w-1]:(nextEndlessDef||(nextEndlessDef=makeEndless(w)));
  const q=[];
  for(const g of def)for(let i=0;i<g.n;i++)q.push({t:g.t,time:(g.delay||0)+i*g.gap});
  q.sort((a,b)=>a.time-b.time);return q;
}
function spawn(ev){
  const d=ENEMIES[ev.t],hpM=1+(wave-1)*.13,spM=1+Math.min(.45,(wave-1)*.007);
  enemies.push({type:ev.t,hp:d.hp*hpM,maxHp:d.hp*hpM,speed:d.speed*spM,r:d.r,
    reward:Math.round(d.reward*(1+(wave-1)*.02)),dmg:d.dmg,dist:-20-Math.random()*16,
    x:pathPts[0].x,y:pathPts[0].y,ang:0,phase:Math.random()*7,
    slowFac:0,slowUntil:0,stunUntil:0,burns:[],flash:-9,dead:false,
    boss:!!d.boss,slowResist:d.slowResist||0});
  if(d.boss){SFX.boss();showBanner('⚠️ '+d.name+'!','A boss nightmare!');}
}
function startWave(){
  if(state!=='build')return;
  spawnQueue=buildQueue(wave);spawnT=0;state='wave';
  showBanner('🌊 Wave '+wave,wave%5===0?'Something big stirs…':(endless?'The dream deepens…':''));
  SFX.wave();syncUI();
}
function waveCleared(){
  const bonus=20+wave*5;dust+=bonus;
  toast('Wave '+wave+' cleared! +'+bonus+' ✨');
  for(let i=0;i<18;i++)particles.push({kind:'star',x:Math.random()*W,y:-10,
    vx:(Math.random()-.5)*40,vy:60+Math.random()*60,g:40,life:1.6,max:1.6,s:4+Math.random()*3,
    c:['#ffd75e','#ff8fc7','#7ef0c3','#a78bfa'][i%4]});
  if(wave>=TOTAL_WAVES&&!endless){victory();return;}
  wave++;if(endless)nextEndlessDef=makeEndless(wave);
  state='build';SFX.wave();syncUI();
}

/* ============ UPDATE ============ */
function update(dt){
  stepFx(dt);
  if(state!=='wave'&&state!=='build')return;
  gt+=dt;
  if(state==='wave'){
    spawnT+=dt;
    while(spawnQueue.length&&spawnQueue[0].time<=spawnT)spawn(spawnQueue.shift());
  }
  for(const e of enemies){
    if(e.burns.length){
      e.burns=e.burns.filter(b=>b.until>gt);let dps=0;
      for(const b of e.burns)dps+=b.dps;
      if(dps>0){e.hp-=dps*dt;e.flash=time;
        if(Math.random()<dt*6)particles.push({kind:'spark',x:e.x+(Math.random()-.5)*e.r,y:e.y-e.r*.5,
          vx:0,vy:-30,life:.3,max:.3,s:2.5,c:'#ff9e4a'});
        if(e.hp<=0){killEnemy(e);continue;}}}
    let sp=e.speed;
    if(e.slowUntil>gt)sp*=(1-e.slowFac);else e.slowFac=0;
    if(e.stunUntil>gt)sp=0;
    e.dist+=sp*dt;
    const p=posAt(e.dist);e.x=p.x;e.y=p.y;e.ang=p.ang;
    if((e.type==='wisp'||e.type==='nmare')&&Math.random()<dt*12)
      spark(e.x+(Math.random()-.5)*6,e.y+e.r*.5,e.type==='nmare'?'#c084fc':'#a5f3fc',1);
    if(e.dist>=totalLen+24)leak(e);
  }
  enemies=enemies.filter(e=>!e.dead);
  for(const t of towers){
    const st=TOWERS[t.type].levels[t.level];
    let target=null,best=-1;
    for(const e of enemies){const d=Math.hypot(e.x-t.x,e.y-(t.y-8));
      if(d<=st.range+e.r&&e.dist>best){best=e.dist;target=e;}}
    if(target)t.aim=Math.atan2(target.y-(t.y-12),target.x-t.x);
    t.cd-=dt;
    if(target&&t.cd<=0){t.cd=1/st.rate;t.flash=time;fire(t,target,st);}
  }
  for(const p of projectiles){
    const tg=p.target;
    if(tg&&tg.dead){if(p.type==='orb')explodeOrb(p);p.done=true;continue;}
    const tx=tg?tg.x:p.tx,ty=tg?tg.y:p.ty;
    const d=Math.hypot(tx-p.x,ty-p.y),step=p.speed*dt;
    p.ang=Math.atan2(ty-p.y,tx-p.x);
    if(d<=step+6){
      if(p.type==='star'){if(tg&&!tg.dead)damage(tg,p.dmg);spark(p.x,p.y,'#ffd75e',4);}
      else explodeOrb(p);
      p.done=true;
    }else{p.x+=(tx-p.x)/d*step;p.y+=(ty-p.y)/d*step;
      if(p.type==='orb'&&Math.random()<.5)spark(p.x,p.y,'#ffe9a3',1);}
  }
  projectiles=projectiles.filter(p=>!p.done);
  if(state==='wave'&&!spawnQueue.length&&!enemies.length)waveCleared();
}

}
function render(){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>.3){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;}else shake=0;
  drawBG();drawPath();drawPortal();drawBed();
  if(sel){const st=TOWERS[sel.type].levels[sel.level];ringInd(sel.x,sel.y-6,st.range,'255,215,94');}
  if(buildType&&mouse.in&&(state==='build'||state==='wave')){
    const ok=canPlace(mouse.x,mouse.y);
    ringInd(mouse.x,mouse.y,TOWERS[buildType].levels[0].range,ok?'126,240,195':'255,107,138');
    ctx.save();ctx.translate(mouse.x,mouse.y);ctx.globalAlpha=.75;
    drawTowerBody(buildType,0,time,-1.2,-9);ctx.restore();ctx.globalAlpha=1;}
  const list=[];
  for(const t of towers)list.push({y:t.y,k:0,o:t});
  for(const e of enemies)list.push({y:e.y,k:1,o:e});
  list.sort((a,b)=>a.y-b.y);
  for(const d of list)d.k?drawEnemy(d.o):drawTower(d.o);
  for(const p of projectiles){
    if(p.type==='star'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(time*12);
      ctx.globalAlpha=.4;ctx.fillStyle='#ffd75e';starPath(0,0,8,3.5,5);ctx.fill();
      ctx.globalAlpha=1;ctx.fillStyle='#ffe9a3';starPath(0,0,5.5,2.4,5);ctx.fill();ctx.restore();}
    else{ctx.save();ctx.translate(p.x,p.y);
      ctx.fillStyle='#fff6d8';ctx.beginPath();ctx.arc(0,0,6.5,0,7);ctx.fill();
      ctx.strokeStyle='#e6c86e';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#f0dfa6';blob(-2,-1,1.5);blob(2,2,1.2);ctx.restore();}}
  for(const f of effects){
    const p=(time-f.t0)/f.ttl;
    if(f.type==='ring'){const r=f.r0+(f.r1-f.r0)*(1-Math.pow(1-p,2));
      ctx.globalAlpha=1-p;ctx.strokeStyle=f.bad?'#ff6b8a':(f.color||'#ff8fc7');ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(f.x,f.y,r,0,7);ctx.stroke();}
    else if(f.type==='bolt'){ctx.globalAlpha=1-p;
      ctx.strokeStyle='rgba(255,215,94,.4)';ctx.lineWidth=6;
      ctx.beginPath();ctx.moveTo(f.pts[0].x,f.pts[0].y);for(let i=1;i<f.pts.length;i++)ctx.lineTo(f.pts[i].x,f.pts[i].y);ctx.stroke();
      ctx.strokeStyle='#fffbe0';ctx.lineWidth=2.5;ctx.stroke();}
    else if(f.type==='beam'){
      const g=ctx.createLinearGradient(f.x1,f.y1,f.x2,f.y2);
      ['#ff6b8a','#ffd75e','#7ef0c3','#7cc4ff','#c78bfa'].forEach((c,i)=>g.addColorStop(i/4,c));
      ctx.globalAlpha=1-p;ctx.lineCap='round';ctx.strokeStyle=g;ctx.lineWidth=f.w*(1.2-p*.6);
      ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=f.w*.35;ctx.stroke();}}
  ctx.globalAlpha=1;
  for(const p of particles){
    const a=Math.max(0,p.life/p.max);
    if(p.kind==='spark'){ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*a+.5,0,7);ctx.fill();}
    else if(p.kind==='poof'){ctx.globalAlpha=a*.5;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1.6-a*.6),0,7);ctx.fill();}
    else if(p.kind==='heart'){ctx.globalAlpha=a;ctx.fillStyle=p.c;heartPath(p.x,p.y-4,p.s);ctx.fill();}
    else if(p.kind==='star'){ctx.globalAlpha=a;ctx.fillStyle=p.c;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*5);starPath(0,0,p.s,p.s*.45,5);ctx.fill();ctx.restore();}}
  ctx.globalAlpha=1;
  ctx.font='bold 14px '+FONT;ctx.textAlign='center';
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.life*2);
    ctx.lineWidth=3;ctx.strokeStyle='rgba(20,10,50,.8)';ctx.strokeText(t.txt,t.x,t.y);
    ctx.fillStyle=t.c;ctx.fillText(t.txt,t.x,t.y);}
  ctx.globalAlpha=1;
  const boss=enemies.find(e=>e.boss&&!e.dead);
  if(boss){const bw=300,x=(W-bw)/2,y=16,pct=Math.max(0,boss.hp/boss.maxHp);
    ctx.fillStyle='rgba(15,10,40,.65)';rr(x-2,y-2,bw+4,14,8);ctx.fill();
    ctx.fillStyle='#ff6b8a';rr(x,y,bw*pct,10,6);ctx.fill();
    ctx.fillStyle='#ffe9a3';ctx.font='bold 12px '+FONT;ctx.textAlign='center';
    ctx.fillText('👑 '+ENEMIES[boss.type].name,W/2,y+26);}
  ctx.restore();
}

/* ============ UI ============ */
const iconCtxs={};
function buildShop(){
  order.forEach((k,i)=>{const d=TOWERS[k];
    const card=document.createElement('div');card.className='shopCard';card.dataset.type=k;
    card.innerHTML='<canvas width="92" height="92"></canvas><div><div class="scName">'+(i+1)+'. '+d.name+
      '</div><div class="scDesc">'+d.desc+'</div></div><div class="scCost">✨'+d.cost+'</div>';
    card.addEventListener('click',()=>{audio();toggleBuild(k);});
    shopEl.appendChild(card);
    iconCtxs[k]=card.querySelector('canvas').getContext('2d');});
}
function toggleBuild(k){
  if(state!=='build'&&state!=='wave')return;
  if(buildType===k)buildType=null;
  else{if(dust<TOWERS[k].cost){SFX.err();toast('Not enough ✨ for '+TOWERS[k].name);return;}
    buildType=k;select(null);}
  SFX.click();syncUI();
}
function canPlace(x,y){
  if(x<24||x>W-24||y<24||y>H-24)return false;
  if(distToPath(x,y)<48)return false;
  for(const t of towers)if(Math.hypot(t.x-x,t.y-y)<40)return false;
  return true;
}
function tryPlace(x,y){
  const def=TOWERS[buildType];
  if(!canPlace(x,y)){SFX.err();toast("Can't build there!");
    effects.push({type:'ring',x,y,r0:8,r1:26,t0:time,ttl:.3,bad:true});return;}
  if(dust<def.cost){SFX.err();toast('Not enough ✨');return;}
  dust-=def.cost;
  const t={type:buildType,x,y,level:0,cd:0,phase:Math.random()*7,aim:-Math.PI/2,flash:-9,invested:def.cost};
  towers.push(t);SFX.place();spark(x,y-10,'#ffd75e',10);
  buildType=null;select(t);syncUI();
}
function select(t){sel=t;selPanel.classList.toggle('hidden',!t);if(t)renderSel();}
function specialTxt(type,st,nx){
  let s='—';
  if(type==='moon')s='Splash '+st.splash;
  else if(type==='bear')s='Slow '+Math.round(st.slow*100)+'%'+(st.sleep?' +💤':'');
  else if(type==='cloud')s='Chain ×'+st.chains+(st.stun?' +stun':'');
  else if(type==='prism')s='Pierce beam'+(st.burn?' +burn '+st.burn:'');
  return s;
}
function renderSel(){
  if(!sel)return;
  const def=TOWERS[sel.type],lv=sel.level,st=def.levels[lv],nx=def.levels[lv+1];
  selName.textContent=def.name;
  selPips.textContent='★'.repeat(lv+1)+'☆'.repeat(4-lv);
  const row=(n,v,nv)=>'<div class="statRow"><span>'+n+'</span><span><b>'+v+'</b>'+
    (nv!=null?'<span class="nxt">→ '+nv+'</span>':'')+'</span></div>';
  selStats.innerHTML=
    row('Damage',st.dmg,nx?nx.dmg:null)+
    row('Rate',st.rate.toFixed(1)+'/s',nx?nx.rate.toFixed(1)+'/s':null)+
    row('Range',st.range,nx?nx.range:null)+
    row('Special',specialTxt(sel.type,st),null);
  if(nx){upBtn.textContent='⬆ Upgrade · ✨'+nx.cost;upBtn.disabled=dust<nx.cost;}
  else{upBtn.textContent='✦ MAX LEVEL ✦';upBtn.disabled=true;}
  sellBtn.textContent='Sell · ✨'+Math.floor(sel.invested*.7);
}
function doUpgrade(){
  if(!sel)return;
  const nx=TOWERS[sel.type].levels[sel.level+1];
  if(!nx||dust<nx.cost){SFX.err();return;}
  dust-=nx.cost;sel.invested+=nx.cost;sel.level++;
  SFX.upgrade();spark(sel.x,sel.y-14,'#ffd75e',12);addText(sel.x,sel.y-32,'⬆️','#7ef0c3');
  renderSel();syncUI();
}
function doSell(){
  if(!sel)return;
  const refund=Math.floor(sel.invested*.7);
  dust+=refund;towers=towers.filter(t=>t!==sel);
  addText(sel.x,sel.y-20,'+'+refund,'#ffe9a3');SFX.sell();
  select(null);syncUI();
}
function previewFor(w){
  const def=w<=WAVES.length?WAVES[w-1]:(nextEndlessDef||(nextEndlessDef=makeEndless(w)));
  const m={};for(const g of def)m[g.t]=(m[g.t]||0)+g.n;
  return Object.keys(m).map(t=>{const d=ENEMIES[t];
    return '<span class="pvChip'+(d.boss?' boss':'')+'">'+d.emoji+' '+d.name+' ×'+m[t]+'</span>';}).join('');
}
function syncUI(){
  dustEl.textContent=dust;livesEl.textContent=lives;
  waveEl.textContent=endless?'∞':Math.min(wave,TOTAL_WAVES)+'/'+TOTAL_WAVES;
  document.querySelectorAll('.shopCard').forEach(c=>{const k=c.dataset.type;
    c.classList.toggle('cant',dust<TOWERS[k].cost);c.classList.toggle('sel',buildType===k);});
  if(sel)renderSel();
  if(state==='build'){startBtn.disabled=false;startBtn.classList.add('pulse');
    startBtn.textContent='▶ Start Wave '+wave+(endless?' ∞':'');
    previewEl.innerHTML=previewFor(wave);}
  else if(state==='wave'){startBtn.disabled=true;startBtn.classList.remove('pulse');
    startBtn.textContent='💤 Wave in progress…';
    previewEl.innerHTML='<span class="pvChip">🌊 '+(enemies.length+spawnQueue.length)+' foes remaining</span>';}
  else{startBtn.disabled=true;startBtn.classList.remove('pulse');}
}
function showBanner(txt,sub){
  bannerEl.innerHTML=txt+(sub?'<span class="sub">'+sub+'</span>':'');
  bannerEl.classList.remove('show');void bannerEl.offsetWidth;bannerEl.classList.add('show');
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  toastsEl.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),350);},2200);
}
function showOverlay(html){ov.innerHTML=html;ov.classList.remove('hidden');}
function hideOverlay(){ov.classList.add('hidden');}
function showStart(){
  showOverlay('<div class="ovCard"><div class="ovEmoji">🌙</div><h1>Dream Defenders</h1>'+
  '<p>Nightmares are slipping down the <b>Stardust River</b> toward the sleeping child. Summon dreamy guardians, upgrade them between waves, and survive <b>25 waves</b> — every dream (map) is random!</p>'+
  '<ul class="howto">'+
  '<li>🛍️ Pick a guardian in the shop, then tap the meadow to place it</li>'+
  '<li>⬆️ Tap a placed guardian to upgrade it (<b>4 tiers!</b>) or sell it</li>'+
  '<li>💜 Nightmares that reach the bed cost you hearts</li>'+
  '<li>👑 Bosses every 5th wave · ⏩ speed toggle · hotkeys 1–5</li></ul>'+
  '<button class="bigBtn" id="playBtn">✨ Enter the Dream</button></div>');
  $('playBtn').onclick=e=>{e.currentTarget.blur();audio();hideOverlay();state='build';
    SFX.wave();toast('Build a guardian, then start Wave 1!');syncUI();};
}
function gameOver(){
  state='over';SFX.lose();
  showOverlay('<div class="ovCard"><div class="ovEmoji">💔</div><h1>The Dreamer Woke…</h1>'+
  '<p>The nightmares got through. You reached <b>Wave '+wave+'</b> and banished <b>'+kills+'</b> nightmares.</p>'+
  '<button class="bigBtn pink" id="retryBtn">🌀 Dream Again</button></div>');
  $('retryBtn').onclick=e=>{e.currentTarget.blur();audio();reset();toast('A fresh dream begins…');};
}
function victory(){
  state='won';SFX.win();
  showOverlay('<div class="ovCard"><div class="ovEmoji">🏆</div><h1>Sweet Dreams Prevail!</h1>'+
  '<p>All 25 waves repelled — '+kills+' nightmares banished! The child sleeps peacefully… but the dream goes deeper.</p>'+
  '<button class="bigBtn" id="endlessBtn">♾️ Endless Dream</button><br><br>'+
  '<button class="bigBtn pink" id="newDreamBtn">🌀 New Dream</button></div>');
  $('endlessBtn').onclick=e=>{e.currentTarget.blur();audio();endless=true;wave++;
    nextEndlessDef=makeEndless(wave);state='build';hideOverlay();
    toast('Endless mode — waves scale forever!');syncUI();};
  $('newDreamBtn').onclick=e=>{e.currentTarget.blur();audio();reset();};
}
function reset(){
  pathPts=genPath();buildMetrics();
  towers=[];enemies=[];projectiles=[];effects=[];particles=[];texts=[];spawnQueue=[];
  dust=START_DUST;lives=START_LIVES;wave=1;kills=0;endless=false;nextEndlessDef=null;
  buildType=null;select(null);gameSpeed=1;speedBtn.textContent='⏩ 1×';
  state='build';hideOverlay();syncUI();
}

/* ============ INPUT ============ */
function toLocal(ev){const r=cv.getBoundingClientRect();
  return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',ev=>{
  audio();cv.setPointerCapture(ev.pointerId);
  const p=toLocal(ev);mouse.x=p.x;mouse.y=p.y;mouse.in=true;
  if(state!=='build'&&state!=='wave')return;
  const t=towers.find(t=>Math.hypot(t.x-p.x,t.y-p.y)<26);
  if(t&&!buildType){SFX.click();select(t);return;}
  if(buildType){tryPlace(p.x,p.y);return;}
  if(sel)select(null);
});
cv.addEventListener('pointermove',ev=>{
  const p=toLocal(ev);mouse.x=p.x;mouse.y=p.y;mouse.in=true;
  cv.style.cursor=buildType?'crosshair':
    (towers.some(t=>Math.hypot(t.x-mouse.x,t.y-mouse.y)<26)?'pointer':'default');
});
cv.addEventListener('pointerleave',()=>mouse.in=false);
cv.addEventListener('contextmenu',ev=>{ev.preventDefault();buildType=null;syncUI();});
window.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='5'){audio();toggleBuild(order[+e.key-1]);}
  else if(e.key==='Escape'){buildType=null;select(null);syncUI();}
  else if(e.key===' '){e.preventDefault();if(state==='build')startWave();}
  else if(e.key==='f'||e.key==='F')cycleSpeed();
  else if(e.key==='m'||e.key==='M')toggleMute();
});
startBtn.addEventListener('click',e=>{audio();e.currentTarget.blur();startWave();});
upBtn.addEventListener('click',()=>{audio();doUpgrade();});
sellBtn.addEventListener('click',()=>{audio();doSell();});
function cycleSpeed(){gameSpeed=gameSpeed===1?2:gameSpeed===2?3:1;
  speedBtn.textContent='⏩ '+gameSpeed+'×';SFX.click();}
function toggleMute(){muted=!muted;muteBtn.textContent=muted?'🔇':'🔊';}
muteBtn.addEventListener('click',()=>{audio();toggleMute();});
speedBtn.addEventListener('click',()=>{audio();cycleSpeed();});
newBtn.addEventListener('click',()=>{audio();reset();toast('🌀 A new dream unfolds…');});

/* ============ ICONS & LOOP ============ */
function drawIcons(){
  for(const k of order){const c=iconCtxs[k];
    c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,92,92);
    c.setTransform(1.7,0,0,1.7,46,58);
    const old=ctx;ctx=c;drawTowerBody(k,0,time,-1.2,-9);ctx=old;}
  if(sel){const c=selIcon.getContext('2d');
    c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,92,92);
    c.setTransform(1.9,0,0,1.9,46,58);
    const old=ctx;ctx=c;drawTowerBody(sel.type,sel.level,time,-1.2,sel.flash);ctx=old;}
}
function resize(){
  const r=stage.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  scale=cv.width/W;
}
window.addEventListener('resize',resize);
let lastT=performance.now(),uiT=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-lastT)/1000;lastT=now;if(dt>.1)dt=.1;
  time+=dt;
  update(dt*gameSpeed);
  render();
  drawIcons();
  uiT+=dt;if(uiT>.15){uiT=0;syncUI();}
}

/* ============ INIT ============ */
buildShop();
resize();
reset();
state='menu';
showStart();
syncUI();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
