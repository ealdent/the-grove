<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>⚙️ CLOCKWORK DEFENSE · GEARS VS GADGETS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #2b2b3a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Fredoka', 'Comic Sans MS', 'Patrick Hand', cursive, sans-serif;
      padding: 20px;
      margin: 0;
    }
    .game-container {
      background: #fbe9d7;
      border-radius: 48px 48px 36px 36px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.5), inset 0 2px 8px rgba(255,255,200,0.8);
      padding: 20px 20px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid #c9a87c;
      max-width: 850px;
      width: fit-content;
      margin: auto;
    }
    canvas {
      display: block;
      border-radius: 32px;
      background: #fef7e0;
      box-shadow: inset 0 0 0 4px #dbb45c, 0 12px 18px rgba(0,0,0,0.35);
      width: 100%;
      height: auto;
      max-width: 700px;
      cursor: crosshair;
    }
    .ui-panel {
      width: 100%;
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: #fffaee;
      border-radius: 60px;
      padding: 12px 22px;
      border: 3px solid #e7b575;
      box-shadow: 0 6px 10px rgba(0,0,0,0.2);
      gap: 15px;
    }
    .stats {
      display: flex;
      gap: 20px;
      font-weight: bold;
      color: #4a3724;
      background: #f7e5c2;
      padding: 8px 20px;
      border-radius: 30px;
      align-items: center;
      flex-wrap: wrap;
    }
    .stats span {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 1.2rem;
    }
    .tower-select {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tower-card {
      background: #fff3db;
      border: 3px solid #ccaa70;
      border-radius: 30px;
      padding: 5px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      min-width: 70px;
    }
    .tower-card.selected {
      border: 4px solid #f09d4b;
      background: #ffe0b5;
      transform: scale(1.05);
      box-shadow: 0 0 18px #f9b953;
    }
    .tower-emoji {
      font-size: 2rem;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
    }
    .tower-name {
      font-weight: bold;
      font-size: 0.8rem;
      color: #5e3a1c;
    }
    .tower-cost {
      font-size: 0.8rem;
      background: #dba958;
      color: white;
      padding: 2px 10px;
      border-radius: 20px;
    }
    .action-buttons {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      background: #f7c56c;
      border: none;
      border-radius: 40px;
      padding: 10px 22px;
      font-weight: bold;
      font-size: 1rem;
      color: #3e2e1f;
      cursor: pointer;
      box-shadow: 0 5px 0 #b2823d, 0 6px 10px rgba(0,0,0,0.2);
      transition: 0.1s linear;
      border: 2px solid #ffe3aa;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b2823d, 0 4px 8px rgba(0,0,0,0.2);
    }
    button.wave-btn {
      background: #ffb347;
      color: #2d2416;
      font-size: 1.2rem;
    }
    .wave-info {
      background: #ebcba0;
      border-radius: 25px;
      padding: 6px 18px;
      font-weight: bold;
      color: #2d2d1c;
    }
    @media (max-width: 650px) {
      .ui-panel {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
<div class="game-container">
  <canvas id="gameCanvas" width="700" height="500" aria-label="Clockwork tower defense game map"></canvas>
  <div class="ui-panel">
    <div class="stats">
      <span>⚙️ <span id="goldDisplay">200</span></span>
      <span>❤️ <span id="livesDisplay">20</span></span>
      <span class="wave-info">🌊 <span id="waveDisplay">1/20</span></span>
    </div>
    <div class="tower-select" id="towerPalette">
      <!-- dynamically filled but we keep structure -->
    </div>
    <div class="action-buttons">
      <button id="upgradeBtn"><span>🔧</span> Upgrade</button>
      <button id="nextWaveBtn" class="wave-btn"><span>▶️</span> Next Wave</button>
    </div>
  </div>
  <div style="color:#5e3a1c; margin-top:5px; font-size:0.9rem;">✨ Click on path borders to build · Click tower to upgrade (during break)</div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI elements
    const goldSpan = document.getElementById('goldDisplay');
    const livesSpan = document.getElementById('livesDisplay');
    const waveSpan = document.getElementById('waveDisplay');
    const towerPalette = document.getElementById('towerPalette');
    const upgradeBtn = document.getElementById('upgradeBtn');
    const nextWaveBtn = document.getElementById('nextWaveBtn');

    // ---------- THEME: CLOCKWORK GADGETS ----------
    const TOWER_TYPES = [
      { name: 'Gearspinner', emoji: '⚙️', baseCost: 60, color: '#b58b4f', description: 'rapid cogs' },
      { name: 'Tesla Coil', emoji: '⚡', baseCost: 85, color: '#5f9ea0', description: 'chain lightning' },
      { name: 'CogPult', emoji: '🔄', baseCost: 70, color: '#b8865b', description: 'splash gears' },
      { name: 'Chronoblaster', emoji: '⏳', baseCost: 100, color: '#ac6b8e', description: 'time slow' },
      { name: 'Spark Sentry', emoji: '🔆', baseCost: 50, color: '#daa520', description: 'burning lens' }
    ];

    // Game state
    let gold = 200;
    let lives = 20;
    let wave = 1;
    const MAX_WAVE = 20;
    let gameOver = false;
    let waveActive = false;
    let enemies = [];
    let towers = [];
    let selectedTowerType = 0; // index in TOWER_TYPES

    // Path definition (curvy track for clockwork theme)
    const waypoints = [
      {x: 40, y: 240}, {x: 150, y: 240}, {x: 200, y: 140}, {x: 280, y: 140},
      {x: 330, y: 280}, {x: 430, y: 280}, {x: 480, y: 160}, {x: 560, y: 160},
      {x: 610, y: 320}, {x: 680, y: 320}
    ];

    // Enemy definitions per wave (creative mix)
    function getEnemySpec(waveNum) {
      let baseHp = 22 + waveNum * 5;
      let speed = 0.9 + (waveNum % 4) * 0.15;
      let reward = 18 + waveNum * 3;
      let color = '#5d4a3c';
      let size = 14;
      let type = 'walker';
      if (waveNum % 5 === 0) {
        type = 'tank'; baseHp = 70 + waveNum * 9; speed = 0.55; reward = 45 + waveNum*4; color = '#8b5a2b'; size = 20;
      } else if (waveNum % 3 === 0) {
        type = 'runner'; baseHp = 28 + waveNum*3; speed = 1.9; reward = 22 + waveNum*2; color = '#b5592e'; size = 12;
      } else if (waveNum % 7 === 0) {
        type = 'clockworkKnight'; baseHp = 55+ waveNum*6; speed = 0.8; reward=50; color='#4f5b62'; size=18;
      }
      return { baseHp, speed, reward, color, size, type };
    }

    // Tower class
    class Tower {
      constructor(x, y, typeIndex) {
        this.x = x;
        this.y = y;
        this.typeIndex = typeIndex;
        this.level = 1; // 1..4
        this.attackCooldown = 0;
        this.target = null;
        this.range = this.getRange();
        this.damage = this.getDamage();
        this.cooldownMax = this.getCooldown();
      }
      getRange() {
        const base = [110, 125, 100, 130, 105][this.typeIndex];
        return base + (this.level-1) * 12;
      }
      getDamage() {
        const baseDmg = [14, 22, 18, 16, 12][this.typeIndex];
        return baseDmg + (this.level-1) * (this.typeIndex===1? 8 : 6);
      }
      getCooldown() {
        const baseCd = [28, 45, 38, 50, 25][this.typeIndex];
        return Math.max(12, baseCd - (this.level-1) * (this.typeIndex===0? 5 : 4));
      }
      getUpgradeCost() {
        return Math.floor((TOWER_TYPES[this.typeIndex].baseCost * 0.7) * this.level);
      }
      upgradeTower() {
        if (this.level >= 4) return false;
        this.level++;
        this.range = this.getRange();
        this.damage = this.getDamage();
        this.cooldownMax = this.getCooldown();
        return true;
      }
    }

    // Enemy class
    class Enemy {
      constructor(waveNum, id) {
        const spec = getEnemySpec(waveNum);
        this.id = id;
        this.hp = spec.baseHp;
        this.maxHp = spec.baseHp;
        this.speed = spec.speed;
        this.reward = spec.reward;
        this.color = spec.color;
        this.size = spec.size;
        this.type = spec.type;
        this.pos = { ...waypoints[0] };
        this.targetWaypointIndex = 1;
        this.distanceTraveled = 0;
        this.slowTimer = 0;
      }
      move(delta) {
        if (this.slowTimer > 0) {
          this.slowTimer -= delta;
          delta *= 0.45; // slowed
        }
        if (this.targetWaypointIndex >= waypoints.length) {
          return true; // reached end
        }
        const target = waypoints[this.targetWaypointIndex];
        const dx = target.x - this.pos.x;
        const dy = target.y - this.pos.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < 1.5) {
          this.pos.x = target.x;
          this.pos.y = target.y;
          this.targetWaypointIndex++;
          return this.targetWaypointIndex >= waypoints.length;
        }
        const step = Math.min(dist, this.speed * delta * 60);
        this.pos.x += (dx/dist) * step;
        this.pos.y += (dy/dist) * step;
        return false;
      }
      takeDamage(amount) {
        this.hp -= amount;
        return this.hp <= 0;
      }
    }

    // Game functions
    function canPlaceTower(x, y) {
      // avoid path proximity & overlap with towers
      for (let wp of waypoints) {
        const d = Math.hypot(x-wp.x, y-wp.y);
        if (d < 28) return false;
      }
      for (let t of towers) {
        if (Math.hypot(x-t.x, y-t.y) < 32) return false;
      }
      return x>25 && x<675 && y>25 && y<475;
    }

    function buyTower(x, y, typeIndex) {
      const cost = TOWER_TYPES[typeIndex].baseCost;
      if (gold < cost) return false;
      if (!canPlaceTower(x, y)) return false;
      gold -= cost;
      towers.push(new Tower(x, y, typeIndex));
      updateUI();
      return true;
    }

    function attemptUpgrade(tower) {
      const cost = tower.getUpgradeCost();
      if (gold < cost || tower.level >= 4) return false;
      gold -= cost;
      tower.upgradeTower();
      updateUI();
      return true;
    }

    function updateUI() {
      goldSpan.textContent = gold;
      livesSpan.textContent = lives;
      waveSpan.textContent = `${wave}/${MAX_WAVE}`;
    }

    // Tower attack logic
    function updateTowers(delta) {
      for (let t of towers) {
        if (t.attackCooldown > 0) {
          t.attackCooldown -= delta;
        }
        // find target
        let closestEnemy = null;
        let minDist = Infinity;
        for (let e of enemies) {
          const d = Math.hypot(t.x - e.pos.x, t.y - e.pos.y);
          if (d <= t.range && d < minDist) {
            minDist = d;
            closestEnemy = e;
          }
        }
        t.target = closestEnemy;
        if (t.target && t.attackCooldown <= 0) {
          // attack!
          t.attackCooldown = t.cooldownMax;
          const enemy = t.target;
          const dmg = t.damage;
          enemy.takeDamage(dmg);
          // Special effects based on tower type
          if (t.typeIndex === 1) { // Tesla chain
            for (let e2 of enemies) {
              if (e2 !== enemy && Math.hypot(enemy.pos.x-e2.pos.x, enemy.pos.y-e2.pos.y) < 80) {
                e2.takeDamage(Math.floor(dmg * 0.45));
              }
            }
          } else if (t.typeIndex === 3) { // Chronoblaster slow
            enemy.slowTimer = 1.2;
          } else if (t.typeIndex === 4) { // Spark Sentry burn
            enemy.takeDamage(Math.floor(dmg * 0.2)); // extra tick
          }
        }
      }
    }

    function spawnWave(waveNum) {
      const count = 6 + Math.floor(waveNum * 1.6);
      const newEnemies = [];
      for (let i=0; i<count; i++) {
        newEnemies.push(new Enemy(waveNum, Date.now()+i));
      }
      // stagger spawn slightly
      enemies.push(...newEnemies);
    }

    function nextWave() {
      if (gameOver) return;
      if (waveActive) return;
      if (wave > MAX_WAVE) {
        alert('🎉 You conquered all clockwork waves! Victory!');
        return;
      }
      waveActive = true;
      spawnWave(wave);
    }

    function checkGameOver() {
      if (lives <= 0) {
        gameOver = true;
        waveActive = false;
        alert('💔 The gadgets broke through! Try again.');
      }
    }

    // Main loop
    let lastTime = performance.now();
    function gameLoop(now) {
      if (gameOver) {
        requestAnimationFrame(gameLoop);
        draw();
        return;
      }
      const delta = Math.min(0.1, (now - lastTime) / 1000); // seconds
      lastTime = now;

      if (waveActive) {
        // Move enemies
        for (let i=enemies.length-1; i>=0; i--) {
          const e = enemies[i];
          const reachedEnd = e.move(delta);
          if (reachedEnd) {
            lives--;
            enemies.splice(i,1);
            updateUI();
            checkGameOver();
          }
        }
        // Towers attack
        updateTowers(delta);

        // Remove dead enemies & grant gold
        for (let i=enemies.length-1; i>=0; i--) {
          if (enemies[i].hp <= 0) {
            gold += enemies[i].reward;
            enemies.splice(i,1);
            updateUI();
          }
        }

        // Wave finished?
        if (enemies.length === 0 && waveActive) {
          waveActive = false;
          wave++;
          updateUI();
          if (wave > MAX_WAVE) {
            alert('🏆 You defended the clockwork realm! Legendary!');
            gameOver = true;
          }
        }
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    function drawPath() {
      ctx.beginPath();
      ctx.moveTo(waypoints[0].x, waypoints[0].y);
      for (let i=1; i<waypoints.length; i++) {
        ctx.lineTo(waypoints[i].x, waypoints[i].y);
      }
      ctx.strokeStyle = '#c9a06b';
      ctx.lineWidth = 24;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.strokeStyle = '#e7c284';
      ctx.lineWidth = 14;
      ctx.stroke();
      // gear decorations along path
      for (let wp of waypoints) {
        ctx.beginPath();
        ctx.arc(wp.x, wp.y, 9, 0, Math.PI*2);
        ctx.fillStyle = '#b39264';
        ctx.fill();
        ctx.strokeStyle = '#5e3a1c';
        ctx.lineWidth=2;
        ctx.stroke();
      }
    }

    function drawTowers() {
      for (let t of towers) {
        const type = TOWER_TYPES[t.typeIndex];
        ctx.save();
        ctx.translate(t.x, t.y);
        // base
        ctx.fillStyle = '#d9b382';
        ctx.beginPath();
        ctx.arc(0,0,16,0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#6b4f32';
        ctx.lineWidth=2.5;
        ctx.stroke();
        // emblem
        ctx.font = '24px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(type.emoji, 0, -2);
        // level stars
        ctx.font = 'bold 12px "Fredoka"';
        ctx.fillStyle = '#f7da6c';
        for (let i=0; i<t.level; i++) {
          ctx.fillText('⭐', -14 + i*9, 18);
        }
        // range indicator (subtle)
        if (t.level > 1) {
          ctx.beginPath();
          ctx.arc(0,0,t.range,0,Math.PI*2);
          ctx.strokeStyle = '#f9d59b';
          ctx.lineWidth=1.5;
          ctx.setLineDash([4,6]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.restore();
      }
    }

    function drawEnemies() {
      for (let e of enemies) {
        ctx.save();
        ctx.translate(e.pos.x, e.pos.y);
        // body
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(0,0,e.size,0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#2d2416';
        ctx.lineWidth=2;
        ctx.stroke();
        // face
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(-4,-3,3,0,Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(4,-3,3,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#1e1e1e';
        ctx.beginPath();
        ctx.arc(-4,-3,1.5,0,Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(4,-3,1.5,0,Math.PI*2);
        ctx.fill();
        // hp bar
        const hpPercent = e.hp/e.maxHp;
        ctx.fillStyle = '#d64545';
        ctx.fillRect(-12, -e.size-8, 24, 4);
        ctx.fillStyle = '#6fbf4c';
        ctx.fillRect(-12, -e.size-8, 24*hpPercent, 4);
        // type indicator
        if (e.type==='tank') ctx.fillText('🛡️',0,-e.size-13);
        else if (e.type==='runner') ctx.fillText('💨',0,-e.size-13);
        else if (e.type==='clockworkKnight') ctx.fillText('🗝️',0,-e.size-13);
        ctx.restore();
      }
    }

    function drawUIOverlay() {
      if (!waveActive && !gameOver && wave<=MAX_WAVE) {
        ctx.fillStyle = '#fffbe4';
        ctx.font = 'bold 18px "Fredoka"';
        ctx.fillText('⏸️ Break - build/upgrade', 480, 40);
      }
      if (gameOver) {
        ctx.fillStyle = '#422c1c';
        ctx.font = 'bold 26px "Fredoka"';
        ctx.fillText('GAME OVER', 260, 250);
      }
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      // background
      ctx.fillStyle = '#f7e9cd';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      drawPath();
      drawTowers();
      drawEnemies();
      drawUIOverlay();
    }

    // Event handling
    canvas.addEventListener('click', (e) => {
      if (gameOver || waveActive) return; // only during break
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;

      // Check if clicked on existing tower (for upgrade)
      for (let t of towers) {
        const dist = Math.hypot(mouseX - t.x, mouseY - t.y);
        if (dist < 22) {
          const success = attemptUpgrade(t);
          if (!success && t.level>=4) alert('🔩 Max level!');
          else if (!success) alert('Not enough gold for upgrade.');
          return;
        }
      }
      // Otherwise try to place new tower
      const success = buyTower(mouseX, mouseY, selectedTowerType);
      if (!success) {
        if (gold < TOWER_TYPES[selectedTowerType].baseCost) alert('💰 Not enough gears!');
        else alert('🚫 Cannot build here (too close to path or another tower)');
      }
    });

    // Tower selection UI
    function renderTowerPalette() {
      towerPalette.innerHTML = '';
      TOWER_TYPES.forEach((type, idx) => {
        const card = document.createElement('div');
        card.className = `tower-card ${idx === selectedTowerType ? 'selected' : ''}`;
        card.innerHTML = `<span class="tower-emoji">${type.emoji}</span><span class="tower-name">${type.name}</span><span class="tower-cost">${type.baseCost}g</span>`;
        card.addEventListener('click', (e) => {
          selectedTowerType = idx;
          renderTowerPalette();
        });
        towerPalette.appendChild(card);
      });
    }
    renderTowerPalette();

    upgradeBtn.addEventListener('click', () => {
      if (waveActive || gameOver) {
        alert('Upgrade only during break!');
        return;
      }
      if (towers.length===0) {
        alert('Build a tower first!');
        return;
      }
      alert('🔧 Click on a tower directly to upgrade it (cost varies).');
    });

    nextWaveBtn.addEventListener('click', () => {
      if (gameOver) return;
      if (waveActive) {
        alert('Wave already in progress!');
        return;
      }
      nextWave();
    });

    // Start first wave automatically? We let player press next wave.
    updateUI();
    requestAnimationFrame(gameLoop);
    // initial small hint
    setTimeout(()=> {
      if (!gameOver && wave===1 && enemies.length===0) {
        // friendly prompt
      }
    }, 400);
  })();
</script>
</body>
</html>
