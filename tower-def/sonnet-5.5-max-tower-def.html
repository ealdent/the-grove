  for (let i = 0; i < n; i++) { const rr2 = r * (.35 + rn() * .6); g.beginPath(); g.arc((x + (rn() - .5) * r * 1.6) * k, (y + (rn() - .5) * r * 1.6) * k, rr2 * k, 0, TAU); g.fill(); }
  g.restore();
};

R.onEvent = function (ev) {
  const G = this.G, cs = this.cs;
  switch (ev.k) {
    case 'place': {
      const t = ev.t; t.vis = { born: this.time }; this.shake = Math.max(this.shake, .16);
      this.ring(t.x, t.y, .2, 1.0, .35, TOWERS[t.type].ink, .07);
      this.burst(t.x, t.y, 7, TOWERS[t.type].ink, 1.6, .08, .5, 'spark');
      break;
    }
    case 'upgrade': {
      const t = ev.t; t.vis = { born: this.time, up: true };
      this.ring(t.x, t.y, .2, 1.4, .5, t.tier >= 4 ? C.gold : TOWERS[t.type].ink, .08);
      this.burst(t.x, t.y, 10 + t.tier * 3, t.tier >= 4 ? C.gold : TOWERS[t.type].ink, 2.2, .09, .8, 'spark');
      break;
    }
    case 'sell': this.burst(ev.t.x, ev.t.y, 10, '#8c8577', 1.6, .09, .6); this.floater(ev.t.x, ev.t.y - .3, '+' + ev.v, C.gold, .34); break;
    case 'shot': {
      const t = ev.t;
      if (ev.kind === 'dagger') this.burst(t.x + Math.cos(t.ang) * .3, t.y + Math.sin(t.ang) * .3, 3, TOWERS.dagger.ink, 1.2, .05, .25);
      if (ev.kind === 'interrobang') { this.burst(t.x, t.y - .1, 5, C.gold, 1.4, .07, .4); }
      break;
    }
    case 'chain': this.arcs.push({ pts: ev.pts, life: .2, max: .2 }); break;
    case 'hit': this.burst(ev.x, ev.y, 3, C.blue, 2, .1, .35, 'spark'); break;
    case 'dele': this.deleMark(ev.x, ev.y); break;
    case 'kill': {
      const col = ev.type === 'ghost' ? '#8b86a0' : ev.type === 'corrector' ? '#132226' : '#17141f';
      this.stamp(ev.x, ev.y, ev.r * (ev.boss ? 1.2 : .7), col, ev.boss ? .3 : .14);
      this.burst(ev.x, ev.y, ev.boss ? 40 : 6, col, ev.boss ? 5 : 2.2, ev.boss ? .16 : .07, ev.boss ? 1.4 : .5);
      if (ev.bounty > 0) this.floater(ev.x, ev.y - ev.r, '+' + ev.bounty, C.gold, .3);
      if (ev.boss) { this.shake = 1; this.flash = .5; this.flashCol = '#fff8dc'; this.ring(ev.x, ev.y, .3, 4, 1.1, C.ink, .12); }
      break;
    }
    case 'leak': {
      this.shake = Math.max(this.shake, ev.boss ? 1 : .32); this.sealPulse = 1; this.flash = Math.max(this.flash, ev.boss ? .5 : .16); this.flashCol = '#f0357f';
      this.burst(G.map.exit.x, G.map.exit.y, 10, C.ink, 2.6, .09, .8);
      break;
    }
    case 'boom': {
      this.ring(ev.x, ev.y, .1, ev.r, .38, C.gold, .09);
      this.burst(ev.x, ev.y, 10, ev.conf ? C.gold : C.ink2, 2.2, .08, .5);
      this.stamp(ev.x, ev.y, ev.r * .5, '#2b2738', .1);
      this.shake = Math.max(this.shake, .12);
      break;
    }
    case 'pulse': { const t = ev.t; this.ring(t.x, t.y, .2, t.s.range, ev.kind === 'stun' ? .55 : .4, C.red, ev.kind === 'stun' ? .14 : .09, ev.kind === 'push'); break; }
    case 'strike': { this.bolts.push({ x0: ev.x, y0: ev.y, x1: ev.t.x, y1: ev.t.y, life: .35, max: .35 }); break; }
    case 'split': {
      this.floater(ev.x - .3, ev.y - .3, 'hy-', C.teal, .3, 'italic'); this.floater(ev.x + .3, ev.y - .1, '-phen', C.teal, .3, 'italic');
      this.burst(ev.x, ev.y, 8, '#10252d', 2.4, .07, .5);
      break;
    }
    case 'summon': this.ring(ev.x, ev.y, .2, 1.6, .6, C.ink, .08); break;
    case 'layer': this.shake = .7; this.flash = .3; this.flashCol = '#fff'; this.burst(ev.e.x, ev.e.y, 30, '#d8cdb0', 4, .14, 1.2); break;
    case 'boss': this.shake = .35; break;
    case 'stet': this.stetFx(ev.n); break;
    case 'waveClear': this.startPress(CH[ev.i] ? CH[ev.i].L : ''); this.floater(this.bw / cs / 2, this.bh / cs * .46, (CH[ev.i] ? 'Chapter ' + CH[ev.i].L + ' is set' : 'Set') + '   +' + fmt(ev.bonus) + ' ink', C.ink, .46, 'italic'); break;
  }
};

R.deleMark = function (x, y) { this.parts.push({ k: 'dele', x, y, vx: 0, vy: 0, life: .9, max: .9, size: .6, col: C.red }); this.burst(x, y, 12, C.red, 3, .08, .6); };
R.stetFx = function (n) {
  this.flash = .28; this.flashCol = '#fffbe6';
  this.floater(this.bw / this.cs / 2, this.bh / this.cs * .18, 'stet', C.teal, .9, 'italic');
};

R.updateFx = function (dt) {
  this.time += dt;
  if (this.reveal < 1) this.reveal = Math.min(1, this.reveal + dt / .9);
  this.shake = Math.max(0, this.shake - dt * 2.6); this.flash = Math.max(0, this.flash - dt * 2.4); this.sealPulse = Math.max(0, this.sealPulse - dt * 2);
  for (let i = this.parts.length - 1; i >= 0; i--) {
    const p = this.parts[i]; p.life -= dt;
    if (p.life <= 0) { this.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(.05, dt); p.vy *= Math.pow(.05, dt); if (p.rot != null) p.rot += p.vr * dt;
  }
  for (const f of this.floaters) { f.life -= dt; f.y += f.vy * dt; }
  this.floaters = this.floaters.filter(f => f.life > 0);
  for (const r of this.rings) r.life -= dt; this.rings = this.rings.filter(r => r.life > 0);
  for (const a of this.arcs) a.life -= dt; this.arcs = this.arcs.filter(a => a.life > 0);
  for (const b of this.bolts) b.life -= dt; this.bolts = this.bolts.filter(b => b.life > 0);
  this.decalFade += dt;
  if (this.decalFade > .8 && this.decal) { this.decalFade = 0; const g = this.decal.getContext('2d'); g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = 'rgba(0,0,0,.11)'; g.fillRect(0, 0, this.decal.width, this.decal.height); g.restore(); }
  this.updatePress(dt);
};

/* ---- drawing ------------------------------------------------------------------------------- */
R.cellAt = function (clientX, clientY) {
  const b = this.cv.getBoundingClientRect(), x = clientX - b.left, y = clientY - b.top;
  return { cx: Math.floor(x / this.cs), cy: Math.floor(y / this.cs), x: x / this.cs, y: y / this.cs };
};

R.rangeOf = function (type, tier, buffedRange) { const s = towerStats(type, tier); return s.range * (1 + (buffedRange || 0)); };

R.drawRange = function (g, x, y, r, col, fill, dash) {
  g.save(); g.beginPath(); g.arc(x, y, r, 0, TAU);
  g.fillStyle = col; g.globalAlpha = fill; g.fill();
  g.globalAlpha = .75; g.strokeStyle = col; g.lineWidth = .04; if (dash) g.setLineDash([.18, .12]); g.stroke(); g.restore();
};

R.drawTower = function (g, t, phase) {
  const ppc = this.cs * this.dpr, sp = towerSprite(t.type, t.tier, ppc);
  let sc = 1, lift = 0;
  const v = t.vis;
  if (v && this.time - v.born < .32) { const u = (this.time - v.born) / .32; sc = 1 + (1 - ease.out(u)) * .34; lift = -(1 - u) * .18; }
  g.save(); g.translate(t.x, t.y + lift); g.scale(sc, sc);
  g.drawImage(sp.plinth, -.58, -.58, 1.16, 1.16);
  const kick = t.kick > 0 ? 1 + t.kick * .1 : 1;
  g.save(); g.translate(0, -.02);
  if (t.type === 'dagger') g.rotate(t.ang - Math.PI / 2 + (t.kick > 0 ? Math.sin(t.kick * 9) * .08 : 0)); else g.rotate(Math.sin(this.time * 1.4 + t.id) * .04);
  g.scale(kick, kick); g.drawImage(sp.glyph, -.55, -.55, 1.1, 1.1); g.restore();
  if (t.disabledT > 0) {
    g.fillStyle = 'rgba(243,236,220,.55)'; rr(g, -.44, -.44, .88, .88, .11); g.fill();
    g.strokeStyle = C.red; g.lineWidth = .07; g.lineCap = 'round'; g.beginPath(); g.moveTo(-.5, .12); g.lineTo(.5, -.12); g.stroke();
  }
  // upgrade cue on the Bench
  if (phase === 'prep' && t.tier < 4 && this.G.ink >= TOWERS[t.type].up[t.tier].cost) {
    const b = Math.sin(this.time * 4 + t.id) * .04;
    g.fillStyle = C.teal; g.beginPath(); g.moveTo(.3, -.52 + b); g.lineTo(.46, -.3 + b); g.lineTo(.14, -.3 + b); g.closePath(); g.fill();
    g.strokeStyle = C.paper3; g.lineWidth = .03; g.stroke();
  }
  if (t.buff && t.buff.rate > 0 && t.type !== 'fleuron') { g.fillStyle = C.teal; g.beginPath(); g.arc(-.4, -.4, .06, 0, TAU); g.fill(); }
  g.restore();
  if (t.tier >= 4 && !this.reduced && Math.random() < .02) this.burst(t.x + (Math.random() - .5) * .6, t.y + (Math.random() - .5) * .6, 1, C.gold, .2, .05, .7, 'spark');
};

R.draw = function (phase) {
  const G = this.G; if (!G || !this.paper) return;
  const g = this.g, { dpr, cs, bw, bh } = this;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, bw, bh);
  const rv = ease.out(this.reveal);
  g.globalAlpha = rv;
  const sk = this.reduced ? 0 : this.shake * this.shake * cs * .16;
  g.save(); g.translate((Math.random() - .5) * sk + 0, (Math.random() - .5) * sk + (1 - rv) * 10);
  g.drawImage(this.paper, 0, 0, bw, bh);
  if (this.inkDirty) this.paintInk();
  // giant chapter letter as a watermark
  const L = this.curLetter();
  if (L && phase !== 'won') { g.save(); g.globalAlpha = rv * .06; g.fillStyle = C.pink; g.font = `italic 700 ${Math.round(Math.min(bw, bh) * .95)}px ${F.display}`; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillText(L, bw / 2, bh * .86); g.restore(); }
  g.drawImage(this.ink, 0, 0, bw, bh);
  g.globalCompositeOperation = 'multiply'; g.drawImage(this.decal, 0, 0, bw, bh); g.globalCompositeOperation = 'source-over';

  g.save(); g.scale(cs, cs);
  const T = this.time;
  // flow marks (guillemets drifting toward the Colophon)
  const m = G.map; g.strokeStyle = C.blue; g.lineWidth = .045; g.lineCap = 'round'; g.globalAlpha = rv * .38;
  const sp = .95, off = (T * .55) % sp;
  for (let d = off; d < m.len - .3; d += sp) { const q = riverAt(m, d, this.tmpP || (this.tmpP = { x: 0, y: 0, a: 0 })); g.save(); g.translate(q.x, q.y); g.rotate(q.a); g.beginPath(); g.moveTo(-.07, -.1); g.lineTo(.05, 0); g.lineTo(-.07, .1); g.moveTo(-.2, -.1); g.lineTo(-.08, 0); g.lineTo(-.2, .1); g.stroke(); g.restore(); }
  g.globalAlpha = rv;
  // the Colophon
  const ex = m.exit.x, ey = m.exit.y, pulse = 1 + this.sealPulse * .15 + Math.sin(T * 2) * .012;
  g.save(); g.translate(ex, ey); g.scale(pulse, pulse); g.fillStyle = C.paper3; g.beginPath(); g.arc(0, 0, .5, 0, TAU); g.fill();
  drawSeal(g, .44, Math.round((1 - G.names / MAX_NAMES) * 8), G.names < 30 ? C.red : C.blue); g.restore();

  // placement preview
  const pl = this.place, hv = this.hover;
  if (pl && phase !== 'won' && phase !== 'lost') {
    g.save(); g.globalAlpha = .34 * rv; g.strokeStyle = TOWERS[pl].ink; g.lineWidth = .04; g.lineCap = 'round';
    for (let cy = 0; cy < G.rows; cy++) for (let cx = 0; cx < G.cols; cx++) if (G.canPlace(cx, cy)) { g.beginPath(); g.moveTo(cx + .5, cy + .38); g.lineTo(cx + .5, cy + .62); g.moveTo(cx + .38, cy + .5); g.lineTo(cx + .62, cy + .5); g.stroke(); }
    g.restore();
  }
  const sel = this.sel;
  if (sel && G.towers.indexOf(sel) < 0) this.sel = null;
  if (this.sel) { const s = this.sel; this.drawRange(g, s.x, s.y, s.s.range, TOWERS[s.type].ink, .08, s.type === 'pilcrow'); }
  else if (hv && !pl) { const th = G.towerAt(hv.cx, hv.cy); if (th) this.drawRange(g, th.x, th.y, th.s.range, TOWERS[th.type].ink, .05, true); }
  if (pl && (this.pending || hv)) {
    const c = this.pending || hv, ok = G.canPlace(c.cx, c.cy) && G.ink >= TOWERS[pl].cost;
    if (c.cx >= 0 && c.cy >= 0 && c.cx < G.cols && c.cy < G.rows) {
      const px = c.cx + .5, py = c.cy + .5, s0 = towerStats(pl, 0);
      this.drawRange(g, px, py, s0.range, ok ? TOWERS[pl].ink : C.red, .09, true);
      g.save(); g.globalAlpha = ok ? .72 : .3;
      const spr = towerSprite(pl, 0, cs * dpr); g.translate(px, py); g.drawImage(spr.plinth, -.58, -.58, 1.16, 1.16); g.drawImage(spr.glyph, -.55, -.55, 1.1, 1.1); g.restore();
      // registration mark
      g.save(); g.strokeStyle = ok ? C.ink : C.red; g.lineWidth = .04; g.globalAlpha = .9; g.beginPath(); g.arc(px, py, .62, 0, TAU); g.moveTo(px - .78, py); g.lineTo(px - .46, py); g.moveTo(px + .46, py); g.lineTo(px + .78, py); g.moveTo(px, py - .78); g.lineTo(px, py - .46); g.moveTo(px, py + .46); g.lineTo(px, py + .78); g.stroke(); g.restore();
    }
  }

  if (this.kb && phase !== 'won' && phase !== 'lost') {
    const px = this.kb.cx + .5, py = this.kb.cy + .5;
    g.save(); g.strokeStyle = C.ink; g.lineWidth = .05; g.setLineDash([.14, .1]); g.globalAlpha = .9; g.strokeRect(this.kb.cx + .04, this.kb.cy + .04, .92, .92);
    g.setLineDash([]); g.beginPath(); g.moveTo(px - .16, py); g.lineTo(px + .16, py); g.moveTo(px, py - .16); g.lineTo(px, py + .16); g.stroke(); g.restore();
  }
  // towers (crop marks for selection)
  for (const t of G.towers) {
    this.drawTower(g, t, phase);
    if (t === this.sel) {
      g.save(); g.strokeStyle = C.ink; g.lineWidth = .05; g.lineCap = 'butt';
      const x0 = t.cx - .06, y0 = t.cy - .06, x1 = t.cx + 1.06, y1 = t.cy + 1.06, l = .26;
      for (const [x, y, sx, sy] of [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]]) { g.beginPath(); g.moveTo(x, y + sy * l); g.lineTo(x, y); g.lineTo(x + sx * l, y); g.stroke(); }
      g.restore();
      if (t.type === 'fleuron') for (const o of G.towers) if (o !== t && dist(o.x, o.y, t.x, t.y) <= t.s0.range + .01) { g.save(); g.strokeStyle = C.teal; g.lineWidth = .04; g.setLineDash([.1, .08]); g.beginPath(); g.moveTo(t.x, t.y); g.quadraticCurveTo((t.x + o.x) / 2, (t.y + o.y) / 2 - .3, o.x, o.y); g.stroke(); g.restore(); }
    }
  }

  // links between bonded enemies
  g.save(); g.strokeStyle = C.pink; g.lineWidth = .05; g.setLineDash([.1, .08]);
  for (const e of G.enemies) if (e.link && e.link.alive && e.id < e.link.id && e.linkT > 0) { g.beginPath(); g.moveTo(e.x, e.y); g.lineTo(e.link.x, e.link.y); g.stroke(); }
  g.restore();

  // enemies, back to front
  const es = G.enemies.slice().sort((a, b) => a.y - b.y);
  for (const e of es) { if (!e.alive) continue; drawEnemy(g, e, T); this.hpBar(g, e); }

  // projectiles
  for (const p of G.shots) this.drawShot(g, p);

  // arcs and bolts

  const seal = $('#endSeal'); seal.innerHTML = ''; const c = mkCanvas(184, 184); c.style.width = c.style.height = '92px'; seal.appendChild(c);

UI.onEvent = function (ev) {

    case 'waveClear': {

/* ---- board input -------------------------------------------------------------------------- */
UI.enemyAt = function (x, y, touch) {

  for (const e of UI.G.enemies) { if (!e.alive || e.fade) continue; const d = Math.hypot(e.x - x, e.y - y) - e.r * .6; if (d < bd) { bd = d; best = e; } }
  return best;
};
UI.onBoardTap = function (ev) {
  const c = R.cellAt(ev.clientX, ev.clientY);
  UI.tapCell(c, ev.pointerType === 'touch' || ev.pointerType === 'pen');
};
UI.tapCell = function (c, touch) {
  const G = UI.G; if (!G || UI.phase !== 'play' || UI.modals.length) return;
  if (UI.deleArmed) {
    const e = UI.enemyAt(c.x != null ? c.x : c.cx + .5, c.y != null ? c.y : c.cy + .5, touch);
    if (e && G.dele(e)) { UI.deleArmed = false; } else Sfx.play('deny');

  }
  if (!G.inside(c.cx, c.cy)) return;
  const th = G.towerAt(c.cx, c.cy);

    if (th) { UI.select(th); return; }
    if (!G.canPlace(c.cx, c.cy)) { Sfx.play('deny'); R.pending = null; return; }
    if (G.ink < TOWERS[UI.place].cost) { Sfx.play('deny'); return; }
    if (touch && !(R.pending && R.pending.cx === c.cx && R.pending.cy === c.cy)) { R.pending = { cx: c.cx, cy: c.cy }; Sfx.play('ui'); return; }
    const t = G.placeTower(UI.place, c.cx, c.cy);
    R.pending = null;
    if (t) {
      if (touch) UI.select(t);
      else if (G.ink < TOWERS[UI.place].cost) { UI.place = null; R.place = null; }

  addEventListener('resize', UI.scheduleRelayout);
  addEventListener('orientationchange', () => setTimeout(UI.scheduleRelayout, 250));
  if (window.ResizeObserver) new ResizeObserver(UI.scheduleRelayout).observe($('#stage'));
};

/* ---- the loop ---------------------------------------------------------------------------- */
UI.pump = function () {
  const G = UI.G, ev = G.ev;
  for (let i = 0; i < ev.length; i++) { R.onEvent(ev[i]); Sfx.onEvent(ev[i]); UI.onEvent(ev[i]); }
  ev.length = 0;
};
UI.frame = function (ts) {
  requestAnimationFrame(UI.frame);
  const G = UI.G; if (!G) return;
  const dtReal = Math.min(.1, (ts - UI.last) / 1000 || 0); UI.last = ts;
  const running = UI.phase === 'play' && !UI.modals.length && !document.hidden;
  if (running) {
    const dt = dtReal * UI.speed, n = Math.max(1, Math.ceil(dt / .02)), h = dt / n;
    for (let i = 0; i < n; i++) G.step(h);
  }
  UI.pump();
  R.updateFx(UI.modals.length && UI.phase === 'play' ? 0 : dtReal * Math.min(UI.speed, 3));
  R.syncNames();
  const cv = $('#board'); const cls = UI.deleArmed ? 'dele' : UI.place ? 'placing' : ''; if (cv._c !== cls) { cv._c = cls; cv.className = cls; }
  R.draw(G.phase);
  UI.syncHud();
};

UI.boot = function () {
  R.attach($('#board'));
  UI.buildStatic(); UI.bindInput(); UI.updateSoundIcon();
  const q = new URLSearchParams(location.search);
  if (q.has('diff')) { const dv = parseInt(q.get('diff'), 10); if (!isNaN(dv)) UI.diff = clamp(dv, 0, 2); }
  UI.relayout();
  const seed = q.has('seed') ? parseInt(q.get('seed'), 10) : undefined;
  UI.newGame(seed, true);
  UI.setDiff(UI.diff, true);
  UI.updateBest(); UI.setInert();
  if (q.get('play') === '1') UI.begin();
  requestAnimationFrame(t => { UI.last = t; UI.frame(t); });
};
window.__stet = { UI, R, Sfx, get G() { return UI.G; }, Game, CH, TOWERS, ENEMIES, TUNE };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', UI.boot); else UI.boot();

</script>
</body>
