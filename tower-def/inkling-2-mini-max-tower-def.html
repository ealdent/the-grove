<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last Lamp — a Warding of the Hollow</title>
<style>
  :root{
    --bg0:#080614; --bg1:#0d0a20;
    --panel:rgba(22,17,42,.86);
    --line:rgba(143,127,255,.18);
    --gold:#ffd166; --cyan:#6ee7ff; --magenta:#ff6ee7; --ember:#ff9e57;
    --mint:#a9f0c0; --violet:#8f7bff; --rose:#ff5d7e; --green:#b8e6a0;
    --text:#ece7fa; --dim:#9d94c0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; color:var(--text);
    background:radial-gradient(1200px 700px at 50% -10%, #1a1440 0%, #0d0a20 55%, #070512 100%);
    font-family:ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
  }
  #app{display:grid; grid-template-rows:auto 1fr; height:100dvh; min-height:0}

  /* ---------- top bar ---------- */
  #topbar{
    display:flex; align-items:center; gap:12px 16px; flex-wrap:wrap;
    padding:9px 14px;
    background:linear-gradient(180deg,#181330 0%,#120e27 100%);
    border-bottom:1px solid var(--line);
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    z-index:10;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0}
  .brand .lamp{width:30px;height:30px;color:var(--gold);flex:0 0 auto;filter:drop-shadow(0 0 7px rgba(255,209,102,.65))}
  h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:16px;letter-spacing:.22em;margin:0;color:#f6efdd;font-weight:600;white-space:nowrap}
  .tagline{margin:1px 0 0;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stats{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .lumen{display:flex;align-items:center;gap:7px;background:rgba(255,209,102,.09);border:1px solid rgba(255,209,102,.30);padding:6px 12px;border-radius:999px;box-shadow:inset 0 0 12px rgba(255,209,102,.10)}
  .lumen svg{width:16px;height:16px;color:var(--gold)}
  .lumen .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;color:var(--gold);font-size:15px;min-width:34px;text-align:right}
  .lightwrap{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:999px; padding:6px 12px}
  .lightwrap .lampLbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .lightbar{width:132px;height:10px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
  .lightbar .fill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#ff8c42,#ffd166);box-shadow:0 0 10px rgba(255,209,102,.65);transition:width .35s ease}
  .lightwrap.low .fill{background:linear-gradient(90deg,#ff3b5c,#ff8c42);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .wavepill{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:600;text-transform:uppercase;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:7px 12px;border-radius:999px}
  .wavepill b{color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
  .controls{display:flex;gap:7px;align-items:center}
  .ctl-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:34px;min-width:34px;padding:0 11px;border-radius:9px;
    background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--text);
    font:600 10.5px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    transition:background .15s,border-color .15s,transform .12s;
  }
  .ctl-btn:hover{background:rgba(255,255,255,.10);transform:translateY(-1px)}
  .ctl-btn:active{transform:translateY(0)}
  .ctl-btn svg{width:15px;height:15px}
  .ctl-btn.on{background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.45);color:var(--gold)}

  /* ---------- main layout ---------- */
  #main{display:grid;grid-template-columns:1fr 330px;min-height:0}
  #stage{position:relative;min-height:0;overflow:hidden;background:#0a0718}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  #toasts{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:6;width:max-content;max-width:92%}
  .toast{
    padding:9px 18px;border-radius:999px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;
    background:rgba(16,12,33,.86);border:1px solid rgba(255,209,102,.35);color:#ffe6b0;
    box-shadow:0 8px 30px rgba(0,0,0,.5), inset 0 0 18px rgba(255,209,102,.10);
    animation:toastIn .35s cubic-bezier(.2,.9,.25,1.2), toastOut .4s ease forwards;
    animation-delay:0s, var(--t, 1.4s);
  }
  .toast.boss{border-color:rgba(255,93,126,.5);color:#ffc4d0;box-shadow:0 8px 30px rgba(0,0,0,.5), inset 0 0 18px rgba(255,93,126,.14)}
  .toast.clear{border-color:rgba(169,240,192,.4);color:#d9ffe6;box-shadow:0 8px 30px rgba(0,0,0,.5), inset 0 0 18px rgba(169,240,192,.10)}
  .toast.warn{border-color:rgba(255,140,66,.45);color:#ffd7bd;box-shadow:0 8px 30px rgba(0,0,0,.5), inset 0 0 18px rgba(255,140,66,.10)}
  @keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.95)}}
  #hint{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:9.5px;letter-spacing:.18em;color:rgba(236,231,250,.42);text-transform:uppercase;pointer-events:none;z-index:5;
    text-shadow:0 2px 8px rgba(0,0,0,.8);
  }
  #pauseVeil{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:7;
    background:rgba(8,6,20,.45);backdrop-filter:blur(3px);cursor:pointer;
  }
  #pauseVeil.show{display:flex}
  #pauseVeil .veil-txt{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:28px;letter-spacing:.34em;text-transform:uppercase;color:#f6efdd;text-shadow:0 0 30px rgba(255,209,102,.4)}

  /* ---------- panel ---------- */
  #panel{
    border-left:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);
    overflow-y:auto;overscroll-behavior:contain;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(143,127,255,.3) transparent;
  }
  #panel::-webkit-scrollbar{width:8px}
  #panel::-webkit-scrollbar-thumb{background:rgba(143,127,255,.25);border-radius:8px}
  .sec-title{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .btn-begin{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,209,102,.5);
    background:linear-gradient(180deg,#55401f 0%,#2e2210 100%);color:#ffe6b0;
    font:700 12px/1.2 ui-sans-serif,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 6px 22px rgba(255,209,102,.18), inset 0 1px 0 rgba(255,255,255,.14);
    transition:transform .12s, box-shadow .2s;
  }
  .btn-begin:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(255,209,102,.28), inset 0 1px 0 rgba(255,255,255,.2)}
  .btn-begin:active{transform:translateY(0)}
  .btn-begin.boss{border-color:rgba(255,93,126,.55);background:linear-gradient(180deg,#4a1630 0%,#260d1c 100%);color:#ffc4d0;box-shadow:0 6px 22px rgba(255,93,126,.22), inset 0 1px 0 rgba(255,255,255,.12)}
  .btn-begin[disabled]{filter:grayscale(.5);opacity:.6;cursor:default;transform:none}
  .wp{margin-top:9px;height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
  .wp .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--ember));border-radius:99px;transition:width .3s}
  .wavesub{margin-top:7px;font-size:10.5px;color:var(--dim);letter-spacing:.06em;text-align:center}
  .build-list{display:flex;flex-direction:column;gap:7px}
  .card{
    display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;text-align:left;
    background:rgba(255,255,255,.035);border:1px solid var(--line);cursor:pointer;color:var(--text);
    transition:background .15s, border-color .15s, transform .12s;
  }
  .card:hover{background:rgba(255,255,255,.075);transform:translateY(-1px)}
  .card.active{border-color:var(--gold);background:rgba(255,209,102,.10);box-shadow:0 0 0 1px rgba(255,209,102,.35), 0 4px 18px rgba(255,209,102,.12)}
  .card.poor{opacity:.55}
  .card .ic{width:34px;height:34px;flex:0 0 auto;color:var(--c,#ffd166);filter:drop-shadow(0 0 6px var(--c,#ffd166))}
  .card .ic svg{width:100%;height:100%}
  .card .mid{flex:1;min-width:0}
  .card .nm{font-size:12.5px;font-weight:700;letter-spacing:.02em;display:block}
  .card .ds{font-size:10px;color:var(--dim);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .cost{display:flex;align-items:center;gap:4px;font:700 12px ui-monospace,Menlo,monospace;color:var(--gold);flex:0 0 auto}
  .card .key{flex:0 0 auto;font:600 9px ui-monospace,Menlo,monospace;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:3px 5px;letter-spacing:.06em}
  .sel{
    border:1px solid var(--line);border-radius:14px;padding:11px;background:rgba(255,255,255,.03);
  }
  .sel .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .sel .nm{font-size:13px;font-weight:800;letter-spacing:.03em}
  .sel .tier{font-size:10px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
  .pips{display:flex;gap:4px;margin:7px 0 0}
  .pips i{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.10)}
  .pips i.on{background:var(--gold);box-shadow:0 0 8px rgba(255,209,102,.5)}
  .sel .stats{margin-top:8px;font-size:11px;color:#cfcae8;line-height:1.55}
  .sel .desc{margin-top:7px;font-size:10.5px;color:var(--dim);font-style:italic;line-height:1.5}
  .sel .actions{display:flex;gap:7px;margin-top:10px}
  .btn-sm{flex:1;padding:9px 8px;border-radius:10px;border:1px solid rgba(255,209,102,.45);background:linear-gradient(180deg,#4a3820,#2b2110);color:#ffe6b0;font:700 10.5px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:transform .12s}
  .btn-sm:hover{transform:translateY(-1px)}
  .btn-sm.ghost{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--dim);flex:0 0 auto;padding:9px 11px}
  .btn-sm[disabled]{opacity:.45;cursor:default;transform:none}
  .quick{display:flex;flex-direction:column;gap:6px}
  .qrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;text-align:left;transition:background .15s}
  .qrow:hover{background:rgba(255,255,255,.08)}
  .qrow .nm{font-size:11px;font-weight:700}
  .qrow .nm em{color:var(--dim);font-style:normal;font-weight:600;margin-left:5px}
  .qrow .cost{font:700 11px ui-monospace,Menlo,monospace;color:var(--gold);flex:0 0 auto}
  .qrow.maxed{opacity:.45;cursor:default}
  .empty{font-size:11.5px;color:var(--dim);text-align:center;padding:12px;border:1px dashed var(--line);border-radius:12px;line-height:1.5}
  .panelfoot{font-size:10px;color:var(--dim);letter-spacing:.08em;text-align:center;line-height:1.7;text-transform:uppercase}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(8,6,20,.74);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:18px}
  .overlay[hidden]{display:none}
  .ov{
    max-width:540px;width:100%;max-height:92dvh;overflow-y:auto;
    background:linear-gradient(180deg,#1d1538 0%,#120d26 100%);
    border:1px solid rgba(255,209,102,.28);border-radius:20px;padding:30px 30px 26px;text-align:center;
    box-shadow:0 40px 90px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .ov .kicker{font-size:10px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase;margin:0}
  .ov h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;letter-spacing:.14em;font-size:26px;margin:12px 0 4px;color:#f6efdd}
  .ov .rule{width:70px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,209,102,.6),transparent);margin:10px auto 14px}
  .ov .lore{font-size:13.5px;line-height:1.72;color:#cfcae8;margin:0 0 12px;text-align:left}
  .ov .lore strong{color:#ffe6b0}
  .ov .lore .small{font-size:11.5px;color:var(--dim);font-style:italic}
  .ov .lore em{color:var(--gold);font-style:italic}
  .ov .btn-primary{
    display:inline-block;margin-top:8px;padding:14px 26px;border-radius:12px;border:1px solid rgba(255,209,102,.5);
    background:linear-gradient(180deg,#55401f,#2e2210);color:#ffe6b0;
    font:700 13px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 10px 34px rgba(255,209,102,.24), inset 0 1px 0 rgba(255,255,255,.14);transition:transform .12s;
  }
  .ov .btn-primary:hover{transform:translateY(-2px)}
  .ov .meta{margin-top:14px;font-size:10.5px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;line-height:1.8}
  .ov .end-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:16px 0 4px}
  .ov .stat-cell{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 8px}
  .ov .stat-cell .n{font:700 20px ui-monospace,Menlo,monospace;color:var(--gold)}
  .ov .stat-cell .l{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:3px}
  .ft-tag{margin-top:16px;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;line-height:1.8}

  /* ---------- responsive ---------- */
  @media (max-width:1020px){
    #main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
    .brand .tagline{display:none}
    h1{font-size:14px;letter-spacing:.14em}
    .lightbar{width:92px}
    .lightwrap .lampLbl{display:none}
    #panel{
      flex-direction:column;border-left:none;border-top:1px solid var(--line);max-height:43dvh;
      padding:10px;gap:10px;flex-direction:column;
    }
    .build-list{flex-direction:row;overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap}
    .card{min-width:170px}
    .card .ds{display:none}
    #hint{display:none}
    .controls .ctl-btn{min-width:32px;height:32px;padding:0 9px}
    .controls .ctl-btn .lbl{display:none}
    .toast{font-size:10px;padding:7px 12px;letter-spacing:.12em}
  }
  @media (max-width:560px){
    #topbar{padding:8px 10px;gap:8px 10px}
    .tagline{display:none}
    .lumen{padding:5px 9px}.lumen .v{font-size:13px}
    .wavepill{padding:6px 9px;font-size:10px}
    .ov{padding:22px 18px}
    .ov h2{font-size:21px}
    .ov .lore{font-size:12.5px}
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <svg class="lamp" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6c1 2.8 2.7 4.5 2.7 6.9a2.7 2.7 0 1 1-5.4 0C9.3 6.1 11 4.4 12 1.6Z" fill="currentColor"/><path d="M8.2 12.4h7.6l-.9 2.7H9.1l-.9-2.7Z" fill="currentColor"/><path d="M7.6 16h8.8l1.1 3.6a1.3 1.3 0 0 1-1.3 1.5H7.8a1.3 1.3 0 0 1-1.3-1.5L7.6 16Z" fill="currentColor"/></svg>
      <div>
        <h1>THE LAST LAMP</h1>
        <p class="tagline">A warding of the Hollow</p>
      </div>
    </div>
    <div class="stats">
      <div class="lumen" title="Lumen — the currency of the ward">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.4" fill="currentColor"/><circle cx="10.6" cy="10.4" r="2.2" fill="#0b0817" opacity=".38"/></svg>
        <span class="v" id="statLumen">0</span>
      </div>
      <div class="lightwrap" id="lightWrap" title="Lamp-light remaining">
        <span class="lampLbl">Lamp-light</span>
        <div class="lightbar"><div class="fill" id="lightFill"></div></div>
      </div>
      <div class="wavepill" title="Wave progress"><span id="statWave">Wave —</span></div>
    </div>
    <div class="controls">
      <button class="ctl-btn" id="btnPause" aria-label="Pause" title="Pause (P)"></button>
      <button class="ctl-btn" id="btnSpeed" aria-label="Speed" title="Toggle speed (F)"></button>
      <button class="ctl-btn" id="btnMute" aria-label="Sound" title="Sound"></button>
      <button class="ctl-btn" id="btnRestart" aria-label="New garden" title="Start a new vigil"></button>
    </div>
  </header>

  <main id="main">
    <section id="stage">
      <canvas id="game" aria-label="Vesper Garden — the vein"></canvas>
      <div id="toasts"></div>
      <div id="hint">1–5 select a lantern &nbsp;·&nbsp; click a tile to place &nbsp;·&nbsp; click a lantern to manage &nbsp;·&nbsp; space begins the wave &nbsp;·&nbsp; F speed &nbsp;·&nbsp; P pause</div>
      <div id="pauseVeil"><span class="veil-txt">Paused</span></div>
    </section>
    <aside id="panel" aria-label="Build and manage lanterns"></aside>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="ov" id="overlayCard"></div>
</div>

<script>
(() => {
'use strict';

/* =========================================================
   THE LAST LAMP — a warding of the Hollow
   A single-file tower defense. No dependencies.
   ========================================================= */

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const TAU = Math.PI*2;
const deg2rad = d => d * Math.PI / 180;
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function angDiff(a,b){ let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
const key = (cx,cy) => cx + ',' + cy;

/* =========================================================
   AUDIO — tiny synthesized sound (no assets)
   ========================================================= */
const Sfx = (() => {
  let ctx = null, master = null, muted = false;
  function ensure(){
    if (!ctx){
      try{
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = 0.5;
        master.connect(ctx.destination);
      } catch(e){ return false; }
    }
    if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
    return true;
  }
  function tone(f, dur, type, vol, slideTo, delay){
    if (muted || !ensure()) return;
    const t0 = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  return {
    init(){ ensure(); },
    setMuted(m){ muted = m; },
    get muted(){ return muted; },
    place(){ tone(340, .16, 'triangle', .22, 520); },
    upgrade(){ tone(440,.12,'triangle',.20); tone(660,.16,'triangle',.20, null, .08); },
    select(){ tone(520,.07,'sine',.10); },
    kill(){ tone(300,.14,'triangle',.16,120); },
    fire(){ /* no per-shot audio: too noisy */ },
    chime(){ tone(880,.34,'sine',.10,830); },
    ink(){ tone(220,.12,'sine',.12,140); },
    moth(){ tone(980,.06,'sine',.07,760); },
    beam(){ /* no per-frame audio */ },
    thud(){ tone(96,.28,'sine',.34,48); },
    boss(){ tone(110,.9,'sawtooth',.20,55); tone(220,.9,'sine',.12,110, .12); },

const POINT_COST = { span:1, skirr:1.1, hulk:3.6, wisp:1.7, acolyte:2.7, boss:0 };

function weightsFor(n){
  if (n <= 2) return { span:10, skirr:2 };
  if (n <= 4) return { span:8, skirr:4 };
  if (n <= 7) return { span:6, skirr:4, hulk:2.5 };
  if (n <= 10) return { span:5, skirr:4, hulk:4, wisp:3 };
  if (n <= 14) return { span:4, skirr:4, hulk:4, wisp:4, acolyte:3 };
  return { span:4, skirr:5, hulk:4.5, wisp:4.5, acolyte:3.5 };
}
function sampleDistinct(weights, k, rng){
  const pool = Object.entries(weights).map(([t,w]) => ({t,w}));
  const out = [];
  for (let i = 0; i < k && pool.length; i++){
    const total = pool.reduce((s,x) => s + x.w, 0);
    let r = rng() * total;
    for (let j = 0; j < pool.length; j++){ r -= pool[j].w; if (r <= 0){ out.push(pool[j].t); pool.splice(j,1); break; } }
  }
  return out;
}
function genWaves(seed){
  const rng = mulberry32(seed ^ 0x5157);
  const waves = [];
  for (let n = 1; n <= TOTAL_WAVES; n++){
    const hpMul = 1 + 0.15*(n-1) + 0.012*(n-1)*(n-1);
    const isBoss = n % 5 === 0;
    const groups = [];
    if (isBoss){
      groups.push({ type:'span', count: Math.round(2 + n*0.18), interval: 1.25, start: 0 });
      if (n >= 10) groups.push({ type:'skirr', count: Math.round(1 + n*0.12), interval: 1.05, start: 1.6 });
      groups.push({ type:'boss', count: 1, interval: 0, start: 6 + n*0.15 });
    } else {
      const budget = 8 + n * 3.6;
      const types = sampleDistinct(weightsFor(n), (rng() < 0.42 && n >= 8) ? 3 : 2, rng);
      let left = budget;
      types.forEach((t, idx) => {
        let share;
        if (idx === types.length - 1) share = Math.max(2, left);
        else share = Math.round(budget * (0.42 + rng()*0.22));
        left = Math.max(2, left - share);
        const cost = POINT_COST[t];
        let count = clamp(Math.round(share / cost), 1, 34);
        const interval = Math.max(0.3, 22 / count) * (t === 'hulk' ? 1.6 : t === 'acolyte' ? 1.25 : 1);
        groups.push({ type:t, count, interval, start: idx * 7 + rng() * 2 });
      });
    }
    waves.push({ n, hpMul, groups, isBoss });
  }
  return waves;
}

/* =========================================================
   PATH — generated fresh each vigil (one cell per column)
   ========================================================= */
function genPath(rng){
  let row = 2 + Math.floor(rng() * (ROWS - 4));
  const cells = [];
  for (let cx = 0; cx < COLS; cx++){
    if (cx > 0){
      const roll = rng();
      let delta = 0;
      if (roll < 0.20) delta = (rng() < 0.5 ? -1 : 1) * 2;
      else if (roll < 0.66) delta = (rng() < 0.5 ? -1 : 1);
      const next = row + delta;
      if (next < 1 || next > ROWS - 2) delta = 0;
      row = row + delta;
    }
    cells.push({ cx, row });
  }
  return cells;
}
function buildPath(cells){
  const pts = [{ x:-1.4, y:cells[0].row + 0.5 }];
  for (const c of cells) pts.push({ x:c.cx + 0.5, y:c.row + 0.5 });
  const segs = []; let total = 0;
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i+1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push({ a, b, len, start: total }); total += len;
  }
  return { pts, segs, total };
}
function pathPos(path, dist){
  if (dist <= 0){
    const s = path.segs[0];
    return { x:path.pts[0].x, y:path.pts[0].y, ang:Math.atan2(s.b.y - s.a.y, s.b.x - s.a.x) };
  }
  if (dist >= path.total){
    const s = path.segs[path.segs.length - 1];
    return { x:s.b.x, y:s.b.y, ang:Math.atan2(s.b.y - s.a.y, s.b.x - s.a.x) };
  }
  for (const s of path.segs){
    if (dist >= s.start && dist <= s.start + s.len){
      const f = (dist - s.start) / s.len;
      return { x: s.a.x + (s.b.x - s.a.x)*f, y: s.a.y + (s.b.y - s.a.y)*f, ang: Math.atan2(s.b.y - s.a.y, s.b.x - s.a.x) };
    }
  }
  return { x:path.pts[0].x, y:path.pts[0].y, ang:0 };
}

const stage = $('#stage'), canvas = $('#game'), ctx = canvas.getContext('2d');
const view = { w:0, h:0, cell:40, ox:0, oy:0, dpr:1 };
let bgLayer = null;

function resize(){
  const r = stage.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(200, r.height);
  view.dpr = Math.min(2, window.devicePixelRatio || 1);
  view.w = w; view.h = h;
  canvas.width = Math.round(w * view.dpr);
  canvas.height = Math.round(h * view.dpr);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const pad = 6;
  view.cell = Math.floor(Math.min((w - pad) / COLS, (h - pad) / ROWS));
  view.ox = (w - view.cell * COLS) / 2;
  view.oy = (h - view.cell * ROWS) / 2;
  renderBG();
}
function cellPx(cx, cy){ return { x:view.ox + (cx + 0.5) * view.cell, y:view.oy + (cy + 0.5) * view.cell }; }
function pxOf(cx, cy){ const p = cellPx(cx, cy); return p; }

function renderBG(){
  const w = view.w, h = view.h, dpr = view.dpr;
  bgLayer = document.createElement('canvas');
  bgLayer.width = Math.round(w * dpr); bgLayer.height = Math.round(h * dpr);
  const b = bgLayer.getContext('2d');
  b.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = b.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#141031'); g.addColorStop(0.5, '#0e0a22'); g.addColorStop(1, '#080614');
  b.fillStyle = g; b.fillRect(0, 0, w, h);
  // nebula blobs
  const blobs = [
    { x:0.22, y:0.30, r:0.34, c:'rgba(120,80,220,0.20)' },
    { x:0.78, y:0.22, r:0.30, c:'rgba(60,140,190,0.14)' },
    { x:0.55, y:0.78, r:0.36, c:'rgba(190,70,160,0.12)' },
    { x:0.30, y:0.85, r:0.28, c:'rgba(255,140,66,0.06)' },
  ];
  for (const bl of blobs){
    const rg = b.createRadialGradient(w*bl.x, h*bl.y, 0, w*bl.x, h*bl.y, w*bl.r);
    rg.addColorStop(0, bl.c); rg.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = rg; b.fillRect(0, 0, w, h);
  }
  // stars
  if (G.stars) for (const s of G.stars){
    const sx = s.x * w, sy = s.y * h;
    b.globalAlpha = s.a;
    b.fillStyle = s.ph > 4 ? '#ffe6b0' : (s.ph > 2 ? '#bfe9ff' : '#ffffff');
    b.beginPath(); b.arc(sx, sy, s.r, 0, TAU); b.fill();
  }
  b.globalAlpha = 1;
  // vignette
  const vg = b.createRadialGradient(w/2, h/2, Math.min(w,h)*0.42, w/2, h/2, Math.max(w,h)*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(4,3,12,0.55)');
  b.fillStyle = vg; b.fillRect(0, 0, w, h);
}

/* =========================================================
   GAME FLOW
   ========================================================= */
function startWave(){
  if (G.mode !== 'between' || G.paused) return;
  const def = G.waves[G.nextWave - 1];
  if (!def) return;
  G.wave = G.nextWave;
  const flat = [];
  for (const g of def.groups){
    for (let i = 0; i < g.count; i++){
      flat.push({ time: g.start + i * g.interval + (G.rng() - 0.5) * 0.5, type: g.type });
    }
  }
  flat.sort((a,b) => a.time - b.time);
  G.spawnQueue = flat; G.waveTotal = flat.length; G.spawnTime = 0;
  G.mode = 'wave';
  toast(def.isBoss ? `Wave ${def.n} — a Hollow-Lord stirs` : `Wave ${def.n}`, def.isBoss ? 'boss' : 'wave');
  Sfx.wave(def.isBoss);
  renderPanel();
}
function clearWave(){
  const bonus = 30 + 8 * G.wave;
  G.lumen += bonus; G.lumenEarned += bonus;
  toast(`Wave ${G.wave} cleared — +${bonus} Lumen`, 'clear');
  Sfx.clear();
  if (G.wave >= TOTAL_WAVES){ gameWin(); return; }
  G.nextWave = G.wave + 1;
  G.mode = 'between';
  renderPanel();
}
function gameOver(){
  G.mode = 'over';
  G.paused = false;
  Sfx.over();
  saveBest(Math.max(G.best, G.wave - 1));
  showEnd(false);
}
function gameWin(){
  G.mode = 'win';
  G.paused = false;
  Sfx.win();
  saveBest(TOTAL_WAVES);
  showEnd(true);
}

/* =========================================================
   SPAWNING & ENEMIES
   ========================================================= */
function spawnEnemy(spec){
  const def = ENEMIES[spec.type];
  const waveDef = G.waves[G.wave - 1];
  const hp = Math.round(def.hp * waveDef.hpMul);
  const e = {
    id: G.enemySeq++, type: spec.type, def,
    hp, maxHp: hp, speed: def.speed, dist: 0,
    px: 0, py: 0, ang: 0,
    phase: G.rng() * TAU,
    slowUntil: 0, slowPct: 0, flash: 0,
    boss: !!def.boss, ward: !!def.ward, healer: def.healer || 0,
    alive: true, dead: false, wobble: G.rng() * TAU,
  };
  const p0 = pathPos(G.path, 0);
  e.px = view.ox + p0.x * view.cell; e.py = view.oy + p0.y * view.cell; e.ang = p0.ang;
  G.enemies.push(e);
  if (e.boss) toast('A Hollow-Lord approaches — bold lanterns!', 'boss');
}
function damageEnemy(e, amt){
  if (e.dead || !e.alive) return;
  e.hp -= amt;
  e.flash = Math.max(e.flash, 0.09);
  if (e.hp <= 0 && !e.dead){ killEnemy(e); }
}
function killEnemy(e){
  if (e.dead) return;
  e.dead = true; e.alive = false;
  const reward = e.def.reward;
  G.lumen += reward; G.lumenEarned += reward; G.kills++;
  spawnText(e.px, e.py - 10, '+' + reward, '#ffd166');
  spawnBurst(e.px, e.py, e.def.color, e.boss ? 26 : 7, e.boss ? 4.2 : 2.1);
  if (e.boss){
    G.shake = Math.max(G.shake, 9);
    toast('The Hollow-Lord falls!', 'boss');
    Sfx.boss();
    spawnRing(e.px, e.py, 2.2 * view.cell, '#ff5d7e', 0.55);
  } else Sfx.kill();
}
function onArrive(e){
  G.light -= e.def.dmg;
  G.flashShrine = 0.4;
  G.shake = Math.max(G.shake, e.boss ? 12 : 4.5);
  spawnBurst(view.ox + (G.path.pts[G.path.pts.length-1].x) * view.cell, view.oy + (G.path.pts[G.path.pts.length-1].y) * view.cell, '#ff5d7e', e.boss ? 22 : 8, 2.6);
  Sfx.thud();
  if (G.light <= 0){
    G.light = 0;
    gameOver();
  }
  refreshHUD();
}

/* =========================================================
   TOWER ECONOMY
   ========================================================= */
function isBuildable(cx, cy){
  if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return false;
  if (G.pathSet.has(key(cx, cy))) return false;
  for (const t of G.towers) if (t.cx === cx && t.cy === cy) return false;
  return true;
}
function towerAt(cx, cy){
  for (const t of G.towers) if (t.cx === cx && t.cy === cy) return t;
  return null;
}
function tryPlace(cx, cy, id){
  const def = TOWER_BY_ID[id];
  if (!def || !isBuildable(cx, cy)){ return false; }
  if (G.lumen < def.cost){ toast('Not enough Lumen for ' + def.name + '.', 'warn'); Sfx.select(); return false; }
  const p = cellPx(cx, cy);
  const t = { id: G.towerSeq++, type: id, def, tier: 1, cx, cy, px: p.x, py: p.y,
    fireTimer: 0, pulseTimer: 0.3, angle: G.rng() * TAU, flash: 0, moths: [], invested: def.cost, alive: true };
  G.towers.push(t);
  G.lumen -= def.cost;
  G.placed++;
  spawnBurst(p.x, p.y, def.color, 10, 1.6);
  Sfx.place();
  renderPanel();
  refreshHUD();
  return true;
}
function upgradeTower(t){
  if (!t || t.tier >= 5) return;
  const cost = t.def.ups[t.tier - 1];
  if (G.lumen < cost){ toast('Not enough Lumen to upgrade.', 'warn'); return; }
  G.lumen -= cost;
  t.tier++; t.invested += cost;
  G.upgrades++;
  spawnBurst(t.px, t.py, t.def.color, 12, 1.8);
  spawnRing(t.px, t.py, 1.1 * view.cell, t.def.color, 0.4);
  Sfx.upgrade();
  if (t.sel) {} // no-op
  renderPanel(); refreshHUD();
}
function sellTower(t){
  if (!t) return;
  const refund = Math.floor(t.invested * 0.4);
  G.lumen += refund;
  G.towers = G.towers.filter(x => x !== t);
  if (G.sel === t) G.sel = null;
  spawnBurst(t.px, t.py, '#c9c2e6', 9, 1.4);
  Sfx.select();
  toast('Lantern sold — +' + refund + ' Lumen', 'clear');
  renderPanel(); refreshHUD();
}

   ========================================================= */
function towerPx(t){ return { x: view.ox + (t.cx + 0.5) * view.cell, y: view.oy + (t.cy + 0.5) * view.cell }; }
function pickTarget(t, rangeCells){
  let best = null, bestDist = -1;
  const r = rangeCells * view.cell;
  for (const e of G.enemies){
    if (e.dead || !e.alive) continue;
    const d = Math.hypot(e.px - t.px, e.py - t.py);
    if (d <= r && e.dist > bestDist){ best = e; bestDist = e.dist; }
  }
  return best;
}
function inRange(t, e, rangeCells){
  return Math.hypot(e.px - t.px, e.py - t.py) <= rangeCells * view.cell;
}
function ensureMoths(t, tier){
  while (t.moths.length < tier.moths){
    const i = t.moths.length;
    t.moths.push({ dx: Math.cos(i * 2.1) * 0.7, dy: Math.sin(i * 2.1) * 0.7, phase: i * 2.1, atk: 0.1, target: null });
  }
  t.moths.length = Math.min(t.moths.length, tier.moths);
}
function spawnBurst(x, y, color, n, speed){
  for (let i = 0; i < n; i++){
    const a = Math.random() * TAU, s = (0.3 + Math.random() * 0.7) * speed * 60;
    G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: 0.5 + Math.random() * 0.4, ttl: 0.9, color, size: 1.4 + Math.random() * 2.2 });
  }
}
function spawnRing(x, y, r, color, ttl){
  G.effects.push({ kind:'ring', x, y, r, color, t: 0, ttl: ttl || 0.45 });
}
function spawnText(x, y, text, color){
  G.texts.push({ x, y, text, color, life: 1.15 });
}

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt){
  if (G.mode === 'intro' || G.mode === 'over' || G.mode === 'win') return;
  G.animT += dt;

  // ambient lamp sparks
  G.sparkT -= dt;
  if (G.sparkT <= 0){
    G.sparkT = 0.22 + Math.random() * 0.22;
    const end = G.path.pts[G.path.pts.length - 1];
    const p = pathPos(G.path, G.path.total);
    G.particles.push({ x: view.ox + p.x * view.cell + (Math.random() - 0.5) * 6, y: view.oy + p.y * view.cell - 8, vx: (Math.random() - 0.5) * 12, vy: -24 - Math.random() * 14, life: 0.8, ttl: 0.8, color: '#ffd166', size: 1.4 + Math.random() * 1.4 });
  }

  // spawning
  if (G.mode === 'wave'){
    G.spawnTime += dt;
    while (G.spawnQueue.length && G.spawnQueue[0].time <= G.spawnTime){
      spawnEnemy(G.spawnQueue.shift());
    }
  }

  // enemies
  for (const e of G.enemies){
    if (e.dead) continue;
    const slowed = G.animT < e.slowUntil && !e.ward;
    const sp = e.speed * (slowed ? (1 - e.slowPct) : 1);
    e.dist += sp * dt;
    const p = pathPos(G.path, e.dist);
    e.px = view.ox + p.x * view.cell; e.py = view.oy + p.y * view.cell; e.ang = p.ang;
    e.flash = Math.max(0, e.flash - dt);
    // acolyte healing
    if (e.healer){
      for (const o of G.enemies){
        if (o === e || o.dead || !o.alive) continue;
        const d = Math.hypot(o.px - e.px, o.py - e.py);
        if (d <= 1.7 * view.cell && o.hp < o.maxHp){
          o.hp = Math.min(o.maxHp, o.hp + e.healer * dt);
          if (Math.random() < dt * 3) spawnBurst(o.px, o.py - 4, '#7dffc9', 1, 0.4);
        }
      }
    }
    if (e.dist >= G.path.total - 0.02){
      e.dead = true; e.alive = false;
      onArrive(e);
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);

  // towers
  for (const t of G.towers){
    if (!t.alive) continue;
    const tp = towerPx(t); t.px = tp.x; t.py = tp.y;
    const tier = t.def.tiers[t.tier - 1];
    t.flash = Math.max(0, t.flash - dt);
    if (t.def.kind === 'pierce'){
      t.fireTimer -= dt;
      if (t.fireTimer <= 0){
        const target = pickTarget(t, tier.range);
        if (target){
          t.fireTimer = 1 / tier.rof;
          const d = Math.hypot(target.px - t.px, target.py - t.py) || 1;
          G.projs.push({ kind:'quill', x:t.px, y:t.py, dx:(target.px - t.px)/d, dy:(target.py - t.py)/d, speed: view.cell * 9.5, pierce: tier.pierce, dmg: tier.dmg, life: 1.4, hit: new Set() });
          t.flash = 0.12;
        } else t.fireTimer = 0.12;
      }
    } else if (t.def.kind === 'pulse'){
      t.pulseTimer -= dt;
      if (t.pulseTimer <= 0){
        t.pulseTimer = tier.every; t.flash = 0.3;
        spawnRing(t.px, t.py, tier.radius * view.cell, '#6ee7ff', 0.5);
        for (const e of G.enemies){
          if (e.dead) continue;
          const d = Math.hypot(e.px - t.px, e.py - t.py);
          if (d <= tier.radius * view.cell){
            damageEnemy(e, tier.dmg);
            if (!e.ward){ e.slowUntil = G.animT + tier.slowDur; e.slowPct = tier.slow; }
          }
        }
        Sfx.chime();
      }
    } else if (t.def.kind === 'arc'){
      t.fireTimer -= dt;
      if (t.fireTimer <= 0){
        const target = pickTarget(t, tier.range);
        if (target){
          t.fireTimer = tier.every;
          const d = Math.hypot(target.px - t.px, target.py - t.py);
          const dur = clamp(d / (view.cell * 6.5), 0.24, 0.62);
          G.projs.push({ kind:'arc', x:t.px, y:t.py, toX:target.px, toY:target.py, t:0, dur, dmg:tier.dmg, splash:tier.splash * view.cell, slow:tier.slow, slowDur:tier.slowDur, arc: 30 + d * 0.22 });
          t.flash = 0.12;
          Sfx.ink();
        } else t.fireTimer = 0.12;
      }
    } else if (t.def.kind === 'drone'){
      ensureMoths(t, tier);
      for (const m of t.moths){
        if (!m.target || m.target.dead || !inRange(t, m.target, tier.range)) m.target = pickTarget(t, tier.range);
        const mx = t.px + m.dx * view.cell, my = t.py + m.dy * view.cell;
        if (m.target){
          const dx = m.target.px - mx, dy = m.target.py - my;
          const d = Math.hypot(dx, dy);
          if (d > 0.45 * view.cell){
            const sp = tier.speed * view.cell;
            m.dx += (dx / d) * sp * dt / view.cell;
            m.dy += (dy / d) * sp * dt / view.cell;
          } else {
            m.atk -= dt;
            if (m.atk <= 0){
              m.atk = tier.tick;
              damageEnemy(m.target, tier.dmg);
              spawnBurst(m.target.px, m.target.py, '#ffb36b', 2, 0.8);
              Sfx.moth();
            }
          }
        } else {
          m.phase += dt * 1.5;
          const wx = Math.cos(m.phase) * 0.95, wy = Math.sin(m.phase) * 0.95;
          m.dx += (wx - m.dx) * Math.min(1, dt * 3);
          m.dy += (wy - m.dy) * Math.min(1, dt * 3);
          m.atk = Math.max(m.atk, 0.05);
        }
      }
      t.flash = Math.max(0, t.flash - dt);
    } else if (t.def.kind === 'beam'){
      t.angle += deg2rad(tier.speed) * dt;
      t.flash = Math.max(0, t.flash - dt);
      const halfW = deg2rad(tier.width) / 2;
      for (const e of G.enemies){
        if (e.dead) continue;
        const dx = e.px - t.px, dy = e.py - t.py;
        const d = Math.hypot(dx, dy);
        if (d > tier.range * view.cell) continue;
        if (Math.abs(angDiff(Math.atan2(dy, dx), t.angle)) <= halfW){
          damageEnemy(e, tier.dps * dt);
        }
      }
    }
  }

  // projectiles
  for (const p of G.projs){
    if (p.kind === 'quill'){
      p.x += p.dx * p.speed * dt; p.y += p.dy * p.speed * dt;
      p.life -= dt;
      for (const e of G.enemies){
        if (e.dead || p.hit.has(e.id)) continue;
        const d = Math.hypot(e.px - p.x, e.py - p.y);
        if (d < e.def.r * view.cell + 5){
          p.hit.add(e.id);
          damageEnemy(e, p.dmg);
          spawnBurst(p.x, p.y, '#e8ffd8', 3, 1.2);
          p.pierce--;
          if (p.pierce <= 0){ p.life = 0; break; }
        }
      }
      if (p.life <= 0 || p.x < -60 || p.x > view.w + 60 || p.y < -60 || p.y > view.h + 60) p.remove = true;
    } else if (p.kind === 'arc'){
      p.t += dt;
      if (p.t >= p.dur){
        explodeInk(p); p.remove = true;
      }
    }
  }
  G.projs = G.projs.filter(p => !p.remove);

  // effects
  for (const fx of G.effects){ fx.t += dt; }
  G.effects = G.effects.filter(fx => fx.t < fx.ttl);
  // particles
  for (const pt of G.particles){
    pt.life -= dt;
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vy += 40 * dt;
  }
  G.particles = G.particles.filter(pt => pt.life > 0);
  // texts
  for (const tx of G.texts){ tx.life -= dt; tx.y -= 26 * dt; }
  G.texts = G.texts.filter(tx => tx.life > 0);

  // shake decay
  G.shake = Math.max(0, G.shake - dt * 26);
  G.flashShrine = Math.max(0, G.flashShrine - dt);

  // wave clear?
  if (G.mode === 'wave' && G.spawnQueue.length === 0 && G.enemies.length === 0){
    clearWave();
  }
}
function explodeInk(p){
  for (const e of G.enemies){
    if (e.dead) continue;
    const d = Math.hypot(e.px - p.toX, e.py - p.toY);
    if (d <= p.splash){
      damageEnemy(e, p.dmg);
      if (!e.ward){ e.slowUntil = G.animT + p.slowDur; e.slowPct = p.slow; }
    }
  }
  spawnBurst(p.toX, p.toY, '#ff6ee7', 13, 2.2);
  spawnRing(p.toX, p.toY, p.splash, '#ff6ee7', 0.4);
}

/* =========================================================
   RENDER
   ========================================================= */
function drawBackground(){
  if (bgLayer) ctx.drawImage(bgLayer, 0, 0, view.w, view.h);
  // ambient motes
  ctx.save();
  for (let i = 0; i < 22; i++){
    const mx = ((i * 173.3) % view.w) + Math.sin(G.animT * 0.35 + i * 1.7) * 18;
    const my = ((i * 97.7) % view.h) + Math.cos(G.animT * 0.28 + i * 2.3) * 14;
    ctx.globalAlpha = 0.10 + 0.09 * Math.sin(G.animT * 0.8 + i);
    ctx.fillStyle = i % 3 === 0 ? '#ffd166' : (i % 3 === 1 ? '#6ee7ff' : '#c9b6ff');
    ctx.beginPath(); ctx.arc(mx, my, 1.6, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawGrid(){
  // subtle buildable dots
  ctx.save();
  ctx.strokeStyle = 'rgba(143,127,255,0.10)';
  ctx.lineWidth = 1;
  for (let cx = 0; cx < COLS; cx++){
    for (let cy = 0; cy < ROWS; cy++){
      if (G.pathSet && G.pathSet.has(key(cx, cy))) continue;
      const x = view.ox + cx * view.cell, y = view.oy + cy * view.cell, s = view.cell;
      ctx.globalAlpha = 0.16;
      ctx.strokeRect(x + 3, y + 3, s - 6, s - 6);
    }
  }
  ctx.restore();
}
function drawPath(){
  const c = view.cell;
  const pts = G.path.pts.map(p => ({ x: view.ox + p.x * c, y: view.oy + p.y * c }));
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // outer glow
  ctx.strokeStyle = 'rgba(120,80,200,0.16)';
  ctx.lineWidth = c * 1.2;
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
  // core
  ctx.strokeStyle = '#15102c';
  ctx.lineWidth = c * 0.74;
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
  // inner line
  ctx.strokeStyle = '#2b1d52';
  ctx.lineWidth = c * 0.46;
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
  // flowing dashes
  ctx.strokeStyle = 'rgba(255,209,102,0.45)';
  ctx.lineWidth = Math.max(2, c * 0.07);
  ctx.setLineDash([c * 0.4, c * 0.55]);
  ctx.lineDashOffset = -G.animT * c * 0.9;
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
function drawShrine(){
  const c = view.cell;
  const last = G.path.pts[G.path.pts.length - 1];
  const x = view.ox + last.x * c, y = view.oy + last.y * c;
  const low = G.light <= 30;
  const flick = 0.75 + 0.25 * Math.sin(G.animT * 7.3) + 0.06 * Math.sin(G.animT * 23.1);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const beam = ctx.createLinearGradient(x, y - 3.6 * c, x, y - 0.2 * c);
  beam.addColorStop(0, 'rgba(255,209,102,0)');
  beam.addColorStop(1, `rgba(255,209,102,${0.20 * flick * (low ? 0.5 : 1)})`);
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(x - c * 0.16, y - c * 0.1); ctx.lineTo(x + c * 0.16, y - c * 0.1);
  ctx.lineTo(x + c * 0.38, y - c * 3.4); ctx.lineTo(x - c * 0.38, y - c * 3.4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // pedestal
  ctx.save();
  ctx.fillStyle = '#241d44';
  ctx.beginPath();
  rr(x - c * 0.42, y + c * 0.22, c * 0.84, c * 0.34, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(255,209,102,0.4)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); rr(x - c * 0.42, y + c * 0.22, c * 0.84, c * 0.34, 5); ctx.stroke();
  // glass cage
  const low2 = G.light / G.maxLight;
  const grd = ctx.createLinearGradient(x, y - c * 0.62, x, y + c * 0.1);
  grd.addColorStop(0, 'rgba(255,235,180,0.10)'); grd.addColorStop(1, `rgba(255,190,110,${0.30 * flick * low2})`);
  ctx.fillStyle = grd;
  ctx.beginPath(); rr(x - c * 0.24, y - c * 0.60, c * 0.48, c * 0.80, 6); ctx.fill();
  ctx.strokeStyle = `rgba(255,209,102,${0.5 + 0.3 * flick})`; ctx.lineWidth = 1.6;
  ctx.beginPath(); rr(x - c * 0.24, y - c * 0.60, c * 0.48, c * 0.80, 6); ctx.stroke();
  // flame
  const fr = (c * 0.11 + Math.sin(G.animT * 11) * 1.6) * flick;
  ctx.globalCompositeOperation = 'lighter';
  const fg = ctx.createRadialGradient(x, y - c * 0.12, 0, x, y - c * 0.12, fr * 3.2);
  fg.addColorStop(0, 'rgba(255,240,190,0.95)'); fg.addColorStop(0.4, 'rgba(255,190,110,0.6)'); fg.addColorStop(1, 'rgba(255,140,66,0)');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.arc(x, y - c * 0.12, fr * 3.2, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#fff6da';
  ctx.beginPath(); ctx.ellipse(x, y - c * 0.12, fr * 0.7, fr * 1.25, 0, 0, TAU); ctx.fill();
  // flash when hit
  if (G.flashShrine > 0){
    ctx.globalAlpha = G.flashShrine * 1.6;
    ctx.fillStyle = '#ff5d7e';
    ctx.beginPath(); ctx.arc(x, y - c * 0.12, c * 0.62, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawRange(x, y, r, color){
  ctx.save();
  ctx.strokeStyle = color; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.6;
  ctx.setLineDash([5, 7]); ctx.lineDashOffset = -G.animT * 14;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 0.07; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawTower(t){
  const c = view.cell;
  const x = t.px, y = t.py;
  const tier = t.def.tiers[t.tier - 1];
  const bob = Math.sin(G.animT * 2.1 + t.id * 1.7) * 1.6;
  const yOff = -c * 0.05 + bob;
  ctx.save();
  // plate
  ctx.fillStyle = '#1a1433';
  ctx.beginPath(); rr(x - c * 0.34, y + c * 0.18, c * 0.68, c * 0.3, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(143,127,255,0.35)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); rr(x - c * 0.34, y + c * 0.18, c * 0.68, c * 0.3, 6); ctx.stroke();
  // tier pips
  for (let i = 0; i < 5; i++){
    ctx.fillStyle = i < t.tier ? '#ffd166' : 'rgba(255,255,255,0.14)';
    ctx.beginPath(); ctx.arc(x - c * 0.22 + i * c * 0.11, y + c * 0.39, 1.8, 0, TAU); ctx.fill();
  }
  const flash = t.flash > 0 ? 1 : 0;
  const color = t.def.color;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (t.type === 'quill'){
    const sway = Math.sin(G.animT * 1.8 + t.id) * 0.12 + (t.flash > 0 ? -0.18 : 0);
    ctx.save();
    ctx.translate(x, y + yOff); ctx.rotate(sway + 0.5);
    // glow
    const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, c * 0.5);
    gg.addColorStop(0, 'rgba(184,240,192,0.32)'); gg.addColorStop(1, 'rgba(184,240,192,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, c * 0.5, 0, TAU); ctx.fill();
    // feather
    const fw = c * 0.13, fh = c * 0.52;
    const fg = ctx.createLinearGradient(0, -fh, 0, 0);
    fg.addColorStop(0, '#f2ffe6'); fg.addColorStop(1, '#7fce95');
    ctx.fillStyle = fg; ctx.strokeStyle = 'rgba(30,60,40,0.7)'; ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-fw, -fh * 0.35, -fw * 0.55, -fh);
    ctx.quadraticCurveTo(0, -fh * 1.08, fw * 0.55, -fh);
    ctx.quadraticCurveTo(fw, -fh * 0.35, 0, 0);
    ctx.fill(); ctx.stroke();
    // shaft
    ctx.strokeStyle = 'rgba(40,70,50,0.75)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -fh); ctx.stroke();
    ctx.restore();
  } else if (t.type === 'chime'){
    ctx.save();
    ctx.translate(x, y + yOff);
    const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, c * 0.52);
    gg.addColorStop(0, 'rgba(110,231,255,0.30)'); gg.addColorStop(1, 'rgba(110,231,255,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, c * 0.52, 0, TAU); ctx.fill();
    // yoke
    ctx.fillStyle = '#2c3550';
    ctx.beginPath(); rr(-c * 0.05, -c * 0.46, c * 0.10, c * 0.16, 3); ctx.fill();
    // bell
    const grd = ctx.createLinearGradient(0, -c * 0.34, 0, c * 0.26);
    grd.addColorStop(0, '#d8f7ff'); grd.addColorStop(0.55, '#7fd4ee'); grd.addColorStop(1, '#3f93b5');
    ctx.fillStyle = grd; ctx.strokeStyle = 'rgba(20,50,70,0.85)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-c * 0.13, -c * 0.32);
    ctx.quadraticCurveTo(-c * 0.32, -c * 0.16, -c * 0.34, c * 0.12);
    ctx.quadraticCurveTo(-c * 0.34, c * 0.22, -c * 0.18, c * 0.22);
    ctx.lineTo(c * 0.18, c * 0.22);
    ctx.quadraticCurveTo(c * 0.34, c * 0.22, c * 0.34, c * 0.12);
    ctx.quadraticCurveTo(c * 0.32, -c * 0.16, c * 0.13, -c * 0.32);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // clapper
    ctx.fillStyle = '#bfe9ff';
    ctx.beginPath(); ctx.arc(0, c * 0.26 + Math.sin(G.animT * 8 + t.id) * 1.2, c * 0.075, 0, TAU); ctx.fill();
    ctx.restore();
  } else if (t.type === 'inkflare'){
    ctx.save();
    ctx.translate(x, y + yOff);
    const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, c * 0.5);
    gg.addColorStop(0, 'rgba(255,110,231,0.30)'); gg.addColorStop(1, 'rgba(255,110,231,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, c * 0.5, 0, TAU); ctx.fill();
    // urn
    const grd = ctx.createLinearGradient(0, -c * 0.34, 0, c * 0.28);
    grd.addColorStop(0, '#2b1740'); grd.addColorStop(1, '#180d28');
    ctx.fillStyle = grd; ctx.strokeStyle = 'rgba(255,110,231,0.75)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-c * 0.22, -c * 0.26);
    ctx.lineTo(c * 0.22, -c * 0.26);
    ctx.quadraticCurveTo(c * 0.30, c * 0.08, c * 0.16, c * 0.22);
    ctx.lineTo(-c * 0.16, c * 0.22);
    ctx.quadraticCurveTo(-c * 0.30, c * 0.08, -c * 0.22, -c * 0.26);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // lid
    ctx.fillStyle = '#3d2358';
    ctx.beginPath(); rr(-c * 0.17, -c * 0.33, c * 0.34, c * 0.10, 4); ctx.fill();
    // ink drop
    const dr = c * (0.10 + 0.02 * Math.sin(G.animT * 5 + t.id));
    const dg = ctx.createRadialGradient(0, -c * 0.02, 0, 0, -c * 0.02, dr * 1.6);
    dg.addColorStop(0, 'rgba(255,180,250,0.95)'); dg.addColorStop(1, 'rgba(255,110,231,0)');
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.arc(0, -c * 0.02, dr * 1.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff6ee7';
    ctx.beginPath(); ctx.arc(0, -c * 0.02, dr, 0, TAU); ctx.fill();
    ctx.restore();

function drawEnemy(e){

    ctx.fillStyle = '#2c1224'; ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#ffd6de';
    ctx.beginPath(); ctx.arc(-r*0.36, -r*0.18, r*0.16, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.36, -r*0.18, r*0.16, 0, TAU); ctx.fill();

    ctx.fillStyle = '#ffffff';

    ctx.save();
    ctx.globalAlpha = 0.55 + 0.2 * Math.sin(G.animT * 10);
    ctx.strokeStyle = '#9be7ff'; ctx.lineWidth = 1.6;
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.ellipse(x, y + bob, r * 1.28, r * 1.06, 0, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  // ward shimmer for shrouded enemies
  if (e.ward){
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = '#e6defc'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(x, y + bob, r * 1.22, r * 1.02, 0, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.restore();
  }

  const bw = e.boss ? Math.max(54, r * 1.9) : Math.max(26, r * 1.55);
  const bh = e.boss ? 5 : 3.2;

  ctx.fillStyle = e.boss ? '#ff5d7e' : '#7dffc9';
  if (frac > 0){ rr(bx, by, bw * frac, bh, 3); ctx.fill(); }
}
function hexA(hex, a){
  const m = /^#([0-9a-f]{6})$/i.exec(hex);
  if (!m) return hex;
  const v = parseInt(m[1], 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
}
function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawWedge(t, tier){
  const c = view.cell;
  const halfW = deg2rad(tier.width) / 2;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const a0 = t.angle - halfW, a1 = t.angle + halfW;
  const inner = c * 0.28, outer = tier.range * c;
  const flick = 0.72 + 0.28 * Math.sin(G.animT * 17 + t.id * 3.1);
  const grad = ctx.createRadialGradient(t.px, t.py, inner, t.px, t.py, outer);
  grad.addColorStop(0, `rgba(255,222,140,${0.34 * flick})`);
  grad.addColorStop(0.62, `rgba(255,180,80,${0.16 * flick})`);
  grad.addColorStop(1, 'rgba(255,140,66,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(t.px + Math.cos(a0) * inner, t.py + Math.sin(a0) * inner);
  ctx.lineTo(t.px + Math.cos(a0) * outer, t.py + Math.sin(a0) * outer);
  ctx.arc(t.px, t.py, outer, a0, a1);
  ctx.lineTo(t.px + Math.cos(a1) * inner, t.py + Math.sin(a1) * inner);
  ctx.closePath(); ctx.fill();
  // crisp edge lines
  ctx.strokeStyle = `rgba(255,230,160,${0.5 * flick})`;
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(t.px + Math.cos(a0) * inner, t.py + Math.sin(a0) * inner); ctx.lineTo(t.px + Math.cos(a0) * outer, t.py + Math.sin(a0) * outer); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(t.px + Math.cos(a1) * inner, t.py + Math.sin(a1) * inner); ctx.lineTo(t.px + Math.cos(a1) * outer, t.py + Math.sin(a1) * outer); ctx.stroke();
  ctx.restore();
}
function drawMoth(t, m){
  const c = view.cell;
  const x = t.px + m.dx * c, y = t.py + m.dy * c;
  const flap = Math.sin(G.animT * 22 + t.id) * 0.9;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const gg = ctx.createRadialGradient(x, y, 0, x, y, c * 0.4);
  gg.addColorStop(0, 'rgba(255,200,140,0.5)'); gg.addColorStop(1, 'rgba(255,120,50,0)');

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(side * (Math.PI * 0.5 + wAng * 0.4) * 0.5);
    const grd = ctx.createLinearGradient(0, 0, 0, -c * 0.30);
    grd.addColorStop(0, '#ffdca0'); grd.addColorStop(1, 'rgba(255,150,80,0.25)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.ellipse(0, -c * 0.16, c * 0.10, c * 0.22, side * 0.5, 0, TAU); ctx.fill();

function drawEffects(){
  // rings
  for (const fx of G.effects){
    if (fx.kind !== 'ring') continue;
    const f = fx.t / fx.ttl;
    const r = fx.r * (0.25 + 0.75 * f);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (1 - f) * 0.8;
    ctx.strokeStyle = fx.color; ctx.lineWidth = 3 * (1 - f) + 1;
    ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (1 - f) * 0.35;
    ctx.fillStyle = fx.color;
    ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // particles
  for (const p of G.particles){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.max(0, p.life / p.ttl);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // floating texts
  ctx.save();
  ctx.textAlign = 'center';
  for (const t of G.texts){
    ctx.globalAlpha = Math.min(1, t.life);
    ctx.font = '700 12px ui-monospace, Menlo, monospace';
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.restore();
}
function drawProjectiles(){
  for (const p of G.projs){
    if (p.kind === 'quill'){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.dy, p.dx));
      const grd = ctx.createLinearGradient(-14, 0, 10, 0);
      grd.addColorStop(0, 'rgba(220,255,220,0)'); grd.addColorStop(0.7, 'rgba(220,255,220,0.75)'); grd.addColorStop(1, '#ffffff');
      ctx.strokeStyle = grd; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(9, 0); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(11, 0, 2.2, 0, TAU); ctx.fill();
      ctx.restore();
    } else if (p.kind === 'arc'){
      const f = clamp(p.t / p.dur, 0, 1);
      const gx = lerp(p.x, p.toX, f), gy = lerp(p.y, p.toY, f);
      const z = Math.sin(f * Math.PI) * p.arc;
      // ground shadow
      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(gx, gy, 5, 2.4, 0, 0, TAU); ctx.fill();
      ctx.restore();
      const y = gy - z;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const gg = ctx.createRadialGradient(gx, y, 0, gx, y, 12);
      gg.addColorStop(0, '#ffd6f6'); gg.addColorStop(0.4, '#ff6ee7'); gg.addColorStop(1, 'rgba(255,110,231,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(gx, y, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(gx, y, 2.4, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}
function drawGhost(){
  if (!G.placing || !G.hover) return;
  const { cx, cy } = G.hover;
  if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return;
  const def = TOWER_BY_ID[G.placing];
  if (!def) return;
  const p = cellPx(cx, cy);
  const valid = isBuildable(cx, cy) && G.lumen >= def.cost;
  const tier = def.tiers[0];
  const range = (def.kind === 'pulse' ? tier.radius : def.kind === 'arc' ? tier.range : def.kind === 'pierce' ? tier.range : tier.kind === 'drone' ? tier.range : tier.range) * view.cell;
  // careful: tier fields differ; use a safe accessor:
  const rng = (def.kind === 'pulse') ? tier.radius * view.cell : (def.kind === 'drone') ? tier.range * view.cell : (def.kind === 'arc') ? tier.range * view.cell : (def.kind === 'pierce') ? tier.range * view.cell : tier.range * view.cell;
  drawRange(p.x, p.y, rng, valid ? def.color : '#ff5d7e');
  ctx.save();
  ctx.globalAlpha = 0.62;
  const fake = { id: 99999, type: def.id, def, tier: 1, cx, cy, px: p.x, py: p.y, flash: 0, angle: 0, moths: [], invested: 0, alive: true };
  if (def.kind !== 'drone' && def.kind !== 'beam') drawTower(fake);
  else drawTower(fake); // draw anyway for consistency
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = valid ? 'rgba(184,240,192,0.95)' : 'rgba(255,93,126,0.9)';
  ctx.beginPath(); ctx.arc(p.x, p.y - view.cell * 0.78, 3.2, 0, TAU); ctx.fill();
  ctx.restore();
}
function render(){
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, view.w, view.h);
  // screen shake
  if (G.shake > 0.1){
    const s = G.shake;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }
  drawBackground();
  drawGrid();
  drawPath();
  drawShrine();
  // range rings
  if (G.sel && G.sel.alive){
    const tier = G.sel.def.tiers[G.sel.tier - 1];
    const r = (G.sel.def.kind === 'pulse' ? tier.radius : tier.range) * view.cell;
    drawRange(G.sel.px, G.sel.py, r, G.sel.def.color);
  } else if (G.placing && G.hover) drawRange(cellPx(G.hover.cx, G.hover.cy).x, cellPx(G.hover.cx, G.hover.cy).y, (TOWER_BY_ID[G.placing].tiers[0].kind === 'pulse' ? TOWER_BY_ID[G.placing].tiers[0].radius : TOWER_BY_ID[G.placing].tiers[0].range) * view.cell, TOWER_BY_ID[G.placing].color);
  drawGhost();
  for (const t of G.towers) drawTower(t);
  for (const e of G.enemies) drawEnemy(e);
  // sundial wedge + moths + moth-nests above enemies
  for (const t of G.towers){
    if (t.def.kind === 'beam') drawWedge(t, t.def.tiers[t.tier - 1]);
  }
  for (const t of G.towers){
    if (t.def.kind === 'drone') for (const m of t.moths) drawMoth(t, m);
  }
  drawProjectiles();
  drawEffects();
  // shrine pulse subtle
  // (flashShrine drawn in shrine)
}

  quill: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 3.5C11 4 6.3 9 5 19c6.5-1.3 14.5-6.5 13.5-15.5Z"/><path d="M5.5 18.5 17.5 6.5"/></svg>',
  chime: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5c0 3.2-1.1 4.6-2 5.9-.6.9-.3 2 1.2 2h13.6c1.5 0 1.8-1.1 1.2-2-.9-1.3-2-2.7-2-5.9A5.5 5.5 0 0 0 12 3.5Z"/><path d="M10 20.5h4"/></svg>',
  inkflare: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5s6 6.3 6 11a6 6 0 0 1-12 0c0-4.7 6-11 6-11Z"/><path d="M9.5 13.5a2.5 2.5 0 0 0 2.5 2.5"/></svg>',
  moth: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12.5C8.5 7.5 3.5 8 3.5 12.5c0 3 2.7 4.4 4.9 3.6 1.6-.6 2-3.1 3.6-3.1s2 2.5 3.6 3.1c2.2.8 4.9-.6 4.9-3.6 0-4.5-5-5-8.5 0Z"/><path d="M12 10.5v8"/></svg>',
  sundial: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5.2"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M5.4 18.6l1.7-1.7M16.9 7.1l1.7-1.7"/></svg>'
};

function statLine(t){
  const tier = t.def.tiers[t.tier - 1];
  if (t.def.kind === 'pierce') return `${tier.dmg} dmg &nbsp;·&nbsp; ${tier.rof}/s &nbsp;·&nbsp; pierces ${tier.pierce} &nbsp;·&nbsp; ${tier.range.toFixed(1)}r`;
  if (t.def.kind === 'pulse') return `${tier.dmg} dmg &nbsp;·&nbsp; ${tier.radius.toFixed(1)}r &nbsp;·&nbsp; slows ${Math.round(tier.slow*100)}% for ${tier.slowDur}s &nbsp;·&nbsp; every ${tier.every}s`;
  if (t.def.kind === 'arc') return `${tier.dmg} dmg &nbsp;·&nbsp; ${tier.splash.toFixed(1)}r splash &nbsp;·&nbsp; slows ${Math.round(tier.slow*100)}% &nbsp;·&nbsp; every ${tier.every}s`;
  if (t.def.kind === 'drone') return `${tier.dmg} dmg &nbsp;·&nbsp; every ${tier.tick}s &nbsp;·&nbsp; ${tier.moths} moth${tier.moths > 1 ? 's' : ''} &nbsp;·&nbsp; ${tier.range.toFixed(1)}r`;
  return `${tier.dps} dps &nbsp;·&nbsp; ${tier.width}° beam &nbsp;·&nbsp; ${tier.speed}°/s &nbsp;·&nbsp; ${tier.range.toFixed(1)}r`;
}

function renderPanel(){
  const running = G.mode === 'wave';
  const waveDef = G.waves[G.nextWave - 1];
  const boss = waveDef && waveDef.isBoss;
  const placeCost = id => TOWER_BY_ID[id].cost;
  const cards = TOWERS.map(def => `
    <button class="card${G.placing === def.id ? ' active' : ''}${G.lumen < def.cost ? ' poor' : ''}" data-action="select" data-id="${def.id}" title="${def.name}">
      <span class="ic" style="--c:${def.color}">${ICONS[def.icon]}</span>
      <span class="mid"><span class="nm">${def.name}</span><span class="ds">${def.desc}</span></span>
      <span class="cost">${def.cost}</span>
      <span class="key">${def.hotkey}</span>
    </button>`).join('');

  const sel = G.sel && G.sel.alive ? G.sel : null;
  let selHtml = '';
  if (sel){
    const maxed = sel.tier >= 5;
    const cost = maxed ? 0 : sel.def.ups[sel.tier - 1];
    const pips = Array.from({length: 5}, (_, i) => `<i class="${i < sel.tier ? 'on' : ''}"></i>`).join('');
    selHtml = `
      <div class="sec-title">Selected · Lantern ${sel.id}</div>
      <div class="sel">
        <div class="head"><span class="nm">${sel.def.name}</span><span class="tier">Tier ${sel.tier} / 5</span></div>
        <div class="pips">${pips}</div>
        <div class="stats">${statLine(sel)}</div>
        <div class="desc">${sel.def.desc}</div>
        <div class="actions">
          ${maxed
            ? '<button class="btn-sm" disabled>Fully grown</button>'
            : `<button class="btn-sm" data-action="upgrade" data-id="${sel.id}">Grow · ${cost}</button>`}
          <button class="btn-sm ghost" data-action="sell" data-id="${sel.id}" title="Sell lantern">Sell</button>
        </div>
      </div>`;
  }

  const qs = G.mode !== 'intro' ? G.towers.filter(t => t.tier < 5) : [];
  let quickHtml = '';
  if (G.mode === 'between'){
    if (qs.length){
      quickHtml = `
        <div class="sec-title">Between the waves — grow &amp; fortify</div>
        <div class="quick">
          ${qs.map(t => {
            const cost = t.def.ups[t.tier - 1];
            return `<button class="qrow" data-action="upgrade" data-id="${t.id}">
              <span class="nm">${t.def.name}<em>Tier ${t.tier} → ${t.tier + 1}</em></span>
              <span class="cost">${cost}</span>
            </button>`;
          }).join('')}
        </div>`;
    } else if (G.towers.length){
      quickHtml = `<div class="sec-title">Between the waves</div><div class="empty">Every lantern is fully grown. The tide will not wait.</div>`;
    } else {
      quickHtml = `<div class="empty">No lanterns yet. Place one along the vein — the Hollow is already tasting the light.</div>`;
    }
  }

  const progress = running && G.waveTotal ? clamp((G.waveTotal - (G.spawnQueue.length + G.enemies.length)) / G.waveTotal, 0, 1) : 0;
  const countLeft = running ? (G.spawnQueue.length + G.enemies.length) : 0;

  panel.innerHTML = `
    <div class="sec-title">The Vigil</div>
    ${running
      ? `<button class="btn-begin" disabled>Wave ${G.wave} underway</button>
         <div class="wp"><div class="fill" style="width:${Math.round(progress*100)}%"></div></div>
         <div class="wavesub">${countLeft} remaining</div>`
      : `<button class="btn-begin${boss ? ' boss' : ''}" data-action="start-wave">${boss ? 'Face the Hollow-Lord' : 'Begin Wave ' + G.nextWave}</button>
         <div class="wavesub">${boss ? 'A Hollow-Lord approaches — hold the vein.' : 'Wave ' + G.nextWave + ' of ' + TOTAL_WAVES + ' · ' + G.lumen + ' Lumen to spend'}</div>`}
    <div class="sec-title">Lanterns <span style="letter-spacing:.02em;text-transform:none;font-weight:600;color:var(--dim)">— click to choose, then a tile</span></div>
    <div class="build-list">${cards}</div>
    ${selHtml}
    ${quickHtml}
    <div class="panelfoot">The vein, the waves &amp; the gardens are all drawn fresh each vigil — no two gardens alike.</div>
  `;
}

function refreshHUD(){
  $('#statLumen').textContent = Math.floor(G.lumen);
  $('#lightFill').style.width = clamp(G.light / G.maxLight * 100, 0, 100) + '%';
  $('#lightWrap').classList.toggle('low', G.light <= 30);
  const w = G.mode === 'wave' ? G.wave : (G.mode === 'between' ? G.nextWave : G.wave || '—');
  $('#statWave').textContent = G.mode === 'over' || G.mode === 'win' ? '—' : (w === '—' ? '—' : `Wave ${w} · ${TOTAL_WAVES}`);
}

let toastTimer = 0;
function toast(msg, cls){
  const el = document.createElement('div');
  el.className = 'toast ' + (cls || '');
  el.textContent = msg;
  el.style.setProperty('--t', '1.7s');
  toasts.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 2300);
  while (toasts.children.length > 3) toasts.removeChild(toasts.firstChild);
}

let panelKey = '';
function refreshPanel(){
  const key2 = [G.mode, G.nextWave, G.wave, G.placing, G.sel ? G.sel.id + ':' + G.sel.tier : 0, G.towers.map(t => t.id + ':' + t.tier).join(','), G.lumen >= 0 ? Math.floor(G.lumen / 30) : 0].join('|');
  if (key2 === panelKey) return;
  panelKey = key2;
  renderPanel();
}

/* =========================================================
   OVERLAY (intro / end)
   ========================================================= */
const overlay = $('#overlay'), overlayCard = $('#overlayCard');
function showIntro(){
  overlay.hidden = false;
  overlayCard.innerHTML = `
    <p class="kicker">The Vesper Garden · The Hour Before Dawn</p>
    <h2>THE LAST LAMP</h2>
    <div class="rule"></div>
    <p class="lore">The Accord failed. Light — the pale, patient fire that held Vesper’s garden together — is draining away down the <em>Hollow vein</em>, cell by cold cell.</p>
    <p class="lore">You are the <strong>Warden of the Last Lamp</strong>, the slightest keeper of that fire. Plant the five kinds of lanterns along the vein and hold the dark at bay — until the Accord mends.</p>
    <p class="lore"><span class="small">Twenty-five waves. Five towers, grown to five tiers. The vein, the enemies and the waves are all drawn fresh each vigil — no two gardens alike.</span></p>
    <button class="btn-primary" data-overlay="begin">Tend the Lanterns</button>
    <div class="meta">${G.best ? 'Best vigil — wave ' + G.best + ' of ' + TOTAL_WAVES : 'No vigil has been kept before you'}</div>`;
  overlayCard.querySelector('[data-overlay="begin"]').addEventListener('click', () => {
    Sfx.init(); Sfx.place();
    overlay.hidden = true;
    G.mode = 'between';
    renderPanel(); refreshHUD();
  });
}
function showEnd(win){
  const wavesCleared = win ? TOTAL_WAVES : Math.max(0, G.wave - 1);
  const best = Math.max(G.best, wavesCleared);
  saveBest(best);
  overlay.hidden = false;
  overlayCard.innerHTML = win ? `
    <p class="kicker">The Accord Endures</p>
    <h2>THE LAMP LIVES</h2>
    <div class="rule"></div>
    <p class="lore">The last bell of the vein has sounded, and still the Last Lamp burns. Something far below the dark has been compelled to kneel — for its turn.</p>
    <p class="lore"><span class="small">You are not finished, Warden. The garden remembers your lantern-work.</span></p>
    ${endStats(wavesCleared, best)}
    <button class="btn-primary" data-overlay="restart">Tend a New Garden</button>
  ` : `
    <p class="kicker">The Tide Turned</p>
    <h2>THE LAMP HAS FADED</h2>
    <div class="rule"></div>
    <p class="lore">The Hollow moved through the vein like water looking for its level. The last cell of the garden has gone dark — but a garden is not a grave, and a Warden is never finished.</p>
    <p class="lore"><span class="small">Plant the lanterns again. The vein is not the same, but it will be something.</span></p>
    ${endStats(wavesCleared, best)}
    <button class="btn-primary" data-overlay="restart">Tend a New Garden</button>
  `;
  overlayCard.querySelector('[data-overlay="restart"]').addEventListener('click', () => {
    Sfx.init();
    newGame('between');
    overlay.hidden = true;
    renderPanel(); refreshHUD();
  });
}
function endStats(wavesCleared, best){
  return `
    <div class="end-stats">
      <div class="stat-cell"><div class="n">${wavesCleared}</div><div class="l">Waves held</div></div>
      <div class="stat-cell"><div class="n">${G.kills}</div><div class="l">The Hollow felled</div></div>
      <div class="stat-cell"><div class="n">${G.placed}</div><div class="l">Lanterns planted</div></div>
      <div class="stat-cell"><div class="n">${best}</div><div class="l">Best vigil · wave</div></div>
    </div>`;
}

/* =========================================================
   INPUT
   ========================================================= */
function eventCell(e){
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  return { cx: Math.floor((x - view.ox) / view.cell), cy: Math.floor((y - view.oy) / view.cell), x, y };
}
function updateHover(e){
  const { cx, cy } = eventCell(e);
  const tower = towerAt(cx, cy);
  G.hover = { cx, cy };
  G.hoverTower = tower;
  canvas.style.cursor = G.placing ? (isBuildable(cx, cy) ? 'crosshair' : 'not-allowed') : (tower ? 'pointer' : 'default');
  return tower;
}
function cancelPlacing(){
  if (G.placing){ G.placing = null; renderPanel(); refreshPanel(); return true; }
  return false;
}
canvas.addEventListener('pointermove', updateHover);
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  if (G.mode === 'intro' || G.mode === 'over' || G.mode === 'win') return;
  const tower = updateHover(e);
  const { cx, cy } = eventCell(e);
  if (G.placing){
    if (tower){
      G.placing = null; G.sel = tower; Sfx.select();
      renderPanel(); refreshPanel();
      return;
    }
    if (isBuildable(cx, cy)){
      tryPlace(cx, cy, G.placing);
      refreshPanel(); refreshHUD();
    } else {
      Sfx.select(); // soft tick, stay placing
    }
    return;
  }
  if (tower){
    G.sel = tower; Sfx.select();
    renderPanel(); refreshPanel();
    return;
  }
  if (G.sel || G.placing){ G.sel = null; G.placing = null; renderPanel(); refreshPanel(); }
});
canvas.addEventListener('contextmenu', e => { e.preventDefault(); if (cancelPlacing()) return; G.sel = null; renderPanel(); refreshPanel(); });
canvas.addEventListener('pointerleave', () => { G.hover = null; G.hoverTower = null; });

window.addEventListener('keydown', e => {
  if (!overlay.hidden){
    if (e.key === ' ' || e.key === 'Enter'){
      e.preventDefault();
      const btn = overlayCard.querySelector('.btn-primary');
      if (btn) btn.click();
    }
    return;
  }
  if (e.key >= '1' && e.key <= '5'){
    const def = TOWERS[parseInt(e.key, 10) - 1];
    if (def){
      G.placing = G.placing === def.id ? null : def.id;
      if (G.placing){ G.sel = null; }
      Sfx.select();
      renderPanel(); refreshPanel();
    }
    return;
  }
  if (e.key === 'Escape'){
    cancelPlacing();
    G.sel = null; renderPanel(); refreshPanel();
    return;
  }
  if (e.key === ' '){
    e.preventDefault();
    if (G.mode === 'between') startWave();
    else if (G.mode === 'wave') togglePause();
    return;
  }
  if (e.key === 'Enter'){
    if (G.mode === 'between') startWave();
    return;
  }
  if (e.key === 'p' || e.key === 'P'){ togglePause(); return; }
  if (e.key === 'f' || e.key === 'F'){ toggleSpeed(); return; }
});
window.addEventListener('blur', () => { if (G.mode === 'wave' && !G.paused){ G.paused = true; syncControls(); } });

document.addEventListener('pointerdown', e => {
  if (!overlay.hidden) return;
  // click outside canvas (e.g. panel) doesn't deselect
});

/* panel events (delegated) */
panel.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action, id = btn.dataset.id;
  if (action === 'select'){
    const def = TOWER_BY_ID[id];
    G.placing = G.placing === id ? null : id;
    if (G.placing) G.sel = null;
    Sfx.select();
    renderPanel(); refreshPanel();
    return;
  }
  if (action === 'start-wave'){ if (G.mode === 'between' && !G.paused) startWave(); return; }
  const t = G.towers.find(x => String(x.id) === String(id));
  if (action === 'upgrade'){ if (t) upgradeTower(t); return; }
  if (action === 'sell'){ if (t) sellTower(t); return; }
});

/* topbar controls */
function togglePause(){
  if (G.mode !== 'wave' && G.mode !== 'between') return;
  G.paused = !G.paused;
  syncControls();
}
function toggleSpeed(){
  G.speed = G.speed === 1 ? 2 : 1;
  syncControls();
}
function syncControls(){
  $('#btnPause').innerHTML = G.paused ? ICONS_UI.play : ICONS_UI.pause;
  $('#btnPause').classList.toggle('on', G.paused);
  $('#btnSpeed').innerHTML = ICONS_UI.fast + `<span class="lbl">${G.speed === 2 ? '2×' : '1×'}</span>`;
  $('#btnSpeed').classList.toggle('on', G.speed === 2);
  $('#btnMute').innerHTML = Sfx.muted ? ICONS_UI.mute : ICONS_UI.sound;
  $('#btnMute').classList.toggle('on', Sfx.muted);
  $('#btnRestart').innerHTML = ICONS_UI.restart + '<span class="lbl">New</span>';
  $('#pauseVeil').classList.toggle('show', G.paused);
}
const ICONS_UI = {
  pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M8.5 5v14M15.5 5v14"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5 18 12 8 18.5Z"/></svg>',
  fast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6l6.5 6-6.5 6M11.5 6l6.5 6-6.5 6"/></svg>',
  sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z" fill="currentColor" stroke="none"/><path d="M15 9.5a4 4 0 0 1 0 5M17.5 7a8 8 0 0 1 0 10"/></svg>',
  mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z" fill="currentColor" stroke="none"/><path d="M15.5 10.5l5 5M20.5 10.5l-5 5"/></svg>',
  restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3.5V9h-5.5"/></svg>'
};
$('#btnPause').addEventListener('click', togglePause);
$('#btnSpeed').addEventListener('click', toggleSpeed);
$('#btnMute').addEventListener('click', () => { Sfx.setMuted(!Sfx.muted); syncControls(); });
$('#btnRestart').addEventListener('click', () => {
  Sfx.init();
  newGame('between');
  overlay.hidden = true;
  renderPanel(); refreshHUD();
  toast('A fresh garden — new vein, new tide', 'clear');
});
$('#pauseVeil').addEventListener('click', togglePause);
$('#hint').style.display = 'block';

/* =========================================================
   MAIN LOOP
   ========================================================= */
let last = performance.now();
function frame(now){
  const raw = Math.min(0.05, (now - last) / 1000);
  last = now;
  const dt = G.paused ? 0 : raw * G.speed;
  update(dt);
  render();
  refreshHUD();
  requestAnimationFrame(frame);
}
function init(){
  G.best = loadBest();
  newGame('intro');
  resize();
  syncControls();
  showIntro();
  renderPanel(); refreshHUD();
  requestAnimationFrame(frame);
  setInterval(refreshPanel, 250);
}
if (window.ResizeObserver){
  new ResizeObserver(resize).observe(stage);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
init();

})();
</script>
</body>
</html>
