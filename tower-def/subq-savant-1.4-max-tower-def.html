<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WICK &amp; WING — a tower defense in the glasshouse</title>
<meta name="description" content="Vesper Hollow keeps one lamp. You are the Keeper of the Wicks. Five lights, four deepenings each, twenty-four tides of moths, and a hexagonal glasshouse roof that is never the same twice.">
<meta name="theme-color" content="#070810">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 21c-4-2-7-6-7-10 0-3 2-5 4-5 1.6 0 2.6 1 3 2 .4-1 1.4-2 3-2 2 0 4 2 4 5 0 4-3 8-7 10z' fill='%23ffc46b'/%3E%3Ccircle cx='12' cy='8' r='1.6' fill='%23fff3d6'/%3E%3C/svg%3E">
<style>
:root{
  --night:#070810; --night2:#0b1020; --panel:#080b15;
  --lamp:#ffc46b; --lamp2:#ffe9bd; --ivory:#f0e9dd; --muted:#8e9bb8;
  --rose:#e58aa7; --mint:#86e3c4; --violet:#b7a3f2; --teal:#7fc8d8;
  --line:rgba(255,214,160,.16); --line2:rgba(255,214,160,.30);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(120% 80% at 30% 0%, rgba(255,196,107,.07), transparent 60%),
    radial-gradient(90% 70% at 80% 100%, rgba(134,227,196,.05), transparent 60%),
    var(--night);
  color:var(--ivory); font-family:var(--serif); overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
img{-webkit-user-drag:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* ---------- HUD ---------- */
#hud{
  flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:8px 12px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(12,16,30,.92), rgba(7,8,16,.72));
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  min-height:50px;
}
.brand{display:flex; align-items:center; gap:8px; margin-right:2px}
.brand .mark{color:var(--lamp); font-size:15px; text-shadow:0 0 12px rgba(255,196,107,.8)}
.brand .bt{font-size:13px; letter-spacing:.26em; text-transform:uppercase; white-space:nowrap}
.brand .bt i{font-style:normal; color:var(--lamp); opacity:.8; margin:0 -.06em}
.chips{display:flex; gap:6px; flex:1 1 auto; min-width:0; overflow:hidden}
.chip{
  display:flex; align-items:center; gap:6px; padding:4px 9px; border:1px solid var(--line);
  border-radius:2px; background:rgba(255,255,255,.025); white-space:nowrap;
}
.chip .lbl{font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
.chip .val{font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums}
.chip.light .val{color:var(--lamp)} .chip.wax .val{color:var(--lamp2)}
.chip.wave .val{color:var(--teal)}
.chip.flash{animation:chipflash .5s ease}
@keyframes chipflash{0%{border-color:var(--lamp); box-shadow:0 0 0 rgba(255,196,107,.6)}100%{border-color:var(--line)}}
.tools{display:flex; gap:5px; flex:0 0 auto}
.tool{
  appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.03);
  color:var(--ivory); border-radius:2px; min-width:34px; height:30px; padding:0 8px;
  font-family:var(--mono); font-size:12px; cursor:pointer; transition:.15s ease;
}
.tool:hover{border-color:var(--line2); background:rgba(255,196,107,.10)}
.tool.on{border-color:var(--lamp); color:var(--lamp)}

/* ---------- layout ---------- */
#body{flex:1 1 auto; display:flex; min-height:0}
#stage{position:relative; flex:1 1 auto; min-width:0; min-height:0; overflow:hidden}
#board{display:block; width:100%; height:100%; touch-action:none; cursor:crosshair}
#panel{
  flex:0 0 336px; display:flex; flex-direction:column; min-height:0;
  border-left:1px solid var(--line); background:linear-gradient(180deg, rgba(10,13,24,.96), rgba(6,8,14,.98));
}
.panel-top{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:10px 12px 8px; border-bottom:1px solid var(--line)}
.panel-title{margin:0; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); font-weight:400}
.panel-x{appearance:none; border:1px solid var(--line); background:none; color:var(--muted); width:24px; height:24px; border-radius:2px; cursor:pointer; font-size:11px}
.panel-scroll{flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; padding:10px 12px; min-height:0}
.panel-foot{flex:0 0 auto; padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line)}
.hint{font-size:11.5px; color:var(--muted); margin:0 0 8px; line-height:1.35; min-height:15px}
.primary{
  width:100%; appearance:none; border:1px solid rgba(255,196,107,.55);
  background:linear-gradient(180deg, rgba(255,196,107,.24), rgba(255,196,107,.10));
  color:var(--lamp2); padding:11px 14px; border-radius:2px; cursor:pointer;
  font-family:var(--serif); font-size:13px; letter-spacing:.2em; text-transform:uppercase;
  transition:.18s ease;
}
.primary:hover{background:linear-gradient(180deg, rgba(255,196,107,.34), rgba(255,196,107,.16)); box-shadow:0 0 22px rgba(255,196,107,.18)}
.primary:disabled{opacity:.42; cursor:default; box-shadow:none}
.progress{height:3px; background:rgba(255,255,255,.07); border-radius:2px; overflow:hidden; margin-top:8px}
.progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg, var(--lamp), var(--mint)); transition:width .2s linear}

/* ---------- shop ---------- */
.shop{display:flex; flex-direction:column; gap:7px}
.tw{
  appearance:none; width:100%; text-align:left; cursor:pointer; color:var(--ivory);
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:2px;
  border:1px solid var(--line); background:rgba(255,255,255,.022);
  transition:.16s ease; font-family:var(--serif);
}
.tw:hover{background:rgba(255,196,107,.07); border-color:var(--line2)}
.tw.on{border-color:var(--lamp); background:rgba(255,196,107,.10); box-shadow:inset 0 0 22px rgba(255,196,107,.06)}
.tw.poor{opacity:.45}
.tw-ico{flex:0 0 26px; display:grid; place-items:center}
.tw-ico svg{width:22px; height:22px; overflow:visible}
.tw-txt{display:flex; flex-direction:column; gap:1px; min-width:0}
.tw-txt b{font-weight:400; font-size:13.5px; letter-spacing:.04em}
.tw-txt i{font-style:normal; font-size:10.5px; color:var(--muted); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tw-cost{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--lamp)}

/* ---------- inspect ---------- */
.inspect{display:flex; flex-direction:column; gap:9px}
.insp-head{display:flex; align-items:baseline; gap:8px}
.insp-name{font-size:16px; letter-spacing:.03em}
.insp-lv{font-family:var(--mono); font-size:10.5px; color:var(--lamp); border:1px solid var(--line2); padding:1px 6px; border-radius:2px}
.insp-blurb{margin:0; font-size:11.5px; color:var(--muted); font-style:italic; line-height:1.4}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.stats span b{color:var(--ivory); font-weight:400}
.ups{list-style:none; margin:2px 0 0; padding:0; display:flex; flex-direction:column; gap:5px}
.up{display:flex; gap:8px; align-items:flex-start; padding:6px 8px; border:1px solid var(--line); border-radius:2px; background:rgba(255,255,255,.02)}
.up.done{border-color:rgba(134,227,196,.35); background:rgba(134,227,196,.05)}
.up.locked{opacity:.45}
.up-body{flex:1 1 auto; min-width:0}
.up-body b{display:block; font-weight:400; font-size:12px}
.up-body i{font-style:normal; display:block; font-size:10.5px; color:var(--muted); line-height:1.35}
.up-buy{
  flex:0 0 auto; appearance:none; cursor:pointer; font-family:var(--mono); font-size:10.5px;
  border:1px solid var(--line2); background:rgba(255,196,107,.10); color:var(--lamp2);
  padding:4px 7px; border-radius:2px; transition:.15s ease;
}
.up-buy:hover{background:rgba(255,196,107,.22)}
.up-buy:disabled{opacity:.4; cursor:default}
.up-tick{flex:0 0 auto; color:var(--mint); font-size:11px; line-height:1.4}
.sell{
  margin-top:4px; appearance:none; cursor:pointer; width:100%; padding:7px;
  border:1px solid var(--line); background:none; color:var(--muted);
  font-family:var(--mono); font-size:10.5px; border-radius:2px; letter-spacing:.06em;
}
.sell:hover{border-color:var(--rose); color:var(--rose)}

/* ---------- overlay ---------- */
.overlay{
  position:absolute; inset:0; display:grid; place-items:center; padding:16px;
  background:radial-gradient(80% 60% at 50% 40%, rgba(7,8,16,.78), rgba(4,5,10,.94));
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  z-index:5; animation:fadein .4s ease;
}
.overlay[hidden]{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{
  max-width:520px; width:100%; max-height:100%; overflow-y:auto; overscroll-behavior:contain;
  border:1px solid var(--line2); border-radius:3px; padding:22px 22px 18px;
  background:linear-gradient(180deg, rgba(14,18,34,.97), rgba(8,10,18,.98));
  box-shadow:0 30px 90px rgba(0,0,0,.7), inset 0 0 60px rgba(255,196,107,.05);
}
.sheet h1{margin:0 0 2px; font-size:25px; font-weight:400; letter-spacing:.14em; text-transform:uppercase}
.sheet h1 em{font-style:normal; color:var(--lamp)}
.sheet .sub{margin:0 0 14px; font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--muted)}
.sheet p{margin:0 0 10px; font-size:13px; line-height:1.58; color:#cfd3de}
.sheet p.lede{color:var(--lamp2)}
.sheet p.small{font-size:11.5px; color:var(--muted); font-style:italic}
.sheet .rule{height:1px; background:linear-gradient(90deg, transparent, var(--line2), transparent); margin:14px 0}
.sheet .btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.sheet .btnrow .primary{flex:1 1 160px; width:auto}
.ghost{
  appearance:none; cursor:pointer; padding:11px 14px; border-radius:2px;
  border:1px solid var(--line); background:none; color:var(--muted);
  font-family:var(--serif); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
}
.ghost:hover{border-color:var(--line2); color:var(--ivory)}
.keys{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:11.5px; color:var(--muted); margin-top:6px}
.keys b{color:var(--ivory); font-weight:400; font-family:var(--mono); font-size:10.5px}

/* favors */
.favors{display:flex; flex-direction:column; gap:7px; margin-top:10px}
.favor{
  appearance:none; cursor:pointer; text-align:left; color:var(--ivory);
  border:1px solid var(--line); border-radius:2px; padding:9px 11px;
  background:rgba(255,255,255,.022); transition:.16s ease; font-family:var(--serif);
}
.favor:hover{border-color:var(--lamp); background:rgba(255,196,107,.09)}
.favor b{display:block; font-weight:400; font-size:13px; letter-spacing:.03em}
.favor i{display:block; font-style:normal; font-size:11px; color:var(--muted); margin-top:1px}

/* banner */
.banner{
  position:absolute; left:50%; top:14px; transform:translateX(-50%);
  padding:7px 16px; border:1px solid var(--line2); border-radius:2px;
  background:rgba(8,11,20,.9); backdrop-filter:blur(6px);
  font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--lamp2);
  white-space:nowrap; pointer-events:none; z-index:4;
  animation:bannerin .35s ease;
}
.banner .b-sub{display:block; font-size:9.5px; letter-spacing:.14em; color:var(--muted); margin-top:2px; text-transform:none; font-style:italic}
.banner[hidden]{display:none}
@keyframes bannerin{from{opacity:0; transform:translate(-50%,-8px)}to{opacity:1; transform:translate(-50%,0)}}
.banner.warn{border-color:rgba(229,138,167,.6); color:var(--rose)}

/* toast for leaks */
.leak{
  position:absolute; right:12px; top:12px; z-index:4; pointer-events:none;
  font-family:var(--mono); font-size:11px; color:var(--rose); opacity:0;
}
.leak.show{animation:leakpop 1s ease forwards}
@keyframes leakpop{0%{opacity:0; transform:translateY(4px)}20%{opacity:1; transform:none}100%{opacity:0}}

/* mobile */
@media (max-width: 900px){
  #body{flex-direction:column}
  #stage{flex:1 1 auto; min-height:0}
  #panel{flex:0 0 auto; max-height:44vh; border-left:none; border-top:1px solid var(--line)}
  .brand .bt{display:none}
  .chip .lbl{display:none}
  #hud{min-height:44px; padding:6px 9px}
  .sheet{padding:18px 16px 14px}
  .sheet h1{font-size:20px}
}
@media (max-height: 520px){
  .sheet{max-height:88vh}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand"><span class="mark">&#10022;</span><span class="bt">Wick <i>&amp;</i> Wing</span></div>
    <div class="chips">
      <div class="chip light" id="chipLight"><span class="lbl">Light</span><span class="val" id="lightVal">20</span></div>
      <div class="chip wax" id="chipWax"><span class="lbl">Wax</span><span class="val" id="waxVal">240</span></div>
      <div class="chip wave"><span class="lbl">Tide</span><span class="val" id="waveVal">0 / 24</span></div>
    </div>
    <div class="tools">
      <button class="tool" id="speedBtn" title="Speed">1&times;</button>
      <button class="tool" id="pauseBtn" title="Pause">&#10074;&#10074;</button>
      <button class="tool" id="soundBtn" title="Sound">&#9834;</button>
      <button class="tool" id="restartBtn" title="New night">&#8635;</button>
    </div>
  </header>

  <div id="body">
    <main id="stage">
      <canvas id="board"></canvas>
      <div class="banner" id="banner" hidden></div>
      <div class="leak" id="leak"></div>
      <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
    </main>
    <aside id="panel">
      <div class="panel-top">
        <h2 class="panel-title" id="panelTitle">The Glasshouse</h2>
        <button class="panel-x" id="panelX" hidden aria-label="Back to shelf">&#10005;</button>
      </div>
      <div class="panel-scroll">
        <div class="shop" id="shopList"></div>
        <div class="inspect" id="inspect" hidden></div>
      </div>
      <div class="panel-foot">
        <p class="hint" id="hint">Choose a light from the shelf, then tap a hex pane.</p>
        <button class="primary" id="waveBtn">Begin Tide 1</button>
        <div class="progress" id="waveProg" hidden><i id="waveProgFill"></i></div>
      </div>
    </aside>
  </div>
</div>
<script>
// ═══════════════════════════════════════════════════════════════════
//  WICK & WING — a tower defense in the Glasshouse of Vesper Hollow
//
//  Vesper Hollow sits at the edge of the salt flats. Salt keeps things:
//  the town's dead, its letters, and finally its light. The townspeople
//  built the Glasshouse — a hexagonal roof of leaded panes — around a
//  single lamp, and hired a Keeper to sit with it, because a flame left
//  alone is a flame that goes out.
//
//  The moths came later, and nobody agrees why. The old folk say they
//  are the town's memories, drawn home; the young ones say they are
//  merely hungry. Both are true on some nights. They cross the roof in
//  slow tides, from the salt door to the lamp, and the Keeper decides
//  which of them get to be near the flame.
//
//  A Keeper's tools are five lights: a candle with opinions, a prism
//  that cannot keep a secret, a lantern strung in thorns, a bellows
//  that argues with the wind, and a mirror that has decided it is an
//  eye. Each can be deepened four times — the old word for an upgrade
//  was a "deepening", as though a light were a well.
//
//  Every night the roof is laid differently. The glass remembers
//  nothing. The Keeper remembers everything.
// ═══════════════════════════════════════════════════════════════════

(() => {
'use strict';

const SQRT3 = Math.sqrt(3);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
function shuffled(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
  return a;
}

// ── hex lattice (pointy-top, axial coordinates) ───────────────────
const HEX_DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const hkey = (q, r) => q + ',' + r;
const hworld = (q, r) => ({ x: SQRT3 * (q + r / 2), y: 1.5 * r });
function hneighbors(q, r) { return HEX_DIRS.map(d => [q + d[0], r + d[1]]); }
function hdist(q1, r1, q2, r2) { const dq = q1 - q2, dr = r1 - r2; return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2; }
function hexRound(q, r) {
  const x = q, z = r, y = -x - z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return { q: rx, r: rz };
}
const TILE = (() => {
  const pts = [];
  for (let k = 0; k < 6; k++) {
    const a = (Math.PI / 180) * (60 * k - 30);
    pts.push([Math.cos(a), Math.sin(a)]);
  }
  return pts;
})();

// ── the moths ─────────────────────────────────────────────────────
const ENEMY_KINDS = {
  dusk:    { name: 'Dusk Moth',    hp: 34,  spd: 1.55, armor: 0, bounty: 6,  leak: 1, r: 0.42, body: '#cbb8a2', wing: '#8b7a68', traits: [] },
  flutter: { name: 'Flutterling',  hp: 19,  spd: 2.65, armor: 0, bounty: 5,  leak: 1, r: 0.32, body: '#ffe6bb', wing: '#e0a05a', traits: ['erratic'] },
  soot:    { name: 'Soot Moth',    hp: 92,  spd: 0.98, armor: 5, bounty: 10, leak: 2, r: 0.52, body: '#78737f', wing: '#3d3945', traits: [] },
  glass:   { name: 'Glasswing',    hp: 54,  spd: 1.95, armor: 7, bounty: 12, leak: 1, r: 0.42, body: '#cdeaf3', wing: '#7fb6c9', traits: [] },
  cinder:  { name: 'Cinder Moth',  hp: 66,  spd: 1.32, armor: 1, bounty: 9,  leak: 1, r: 0.44, body: '#ffab6b', wing: '#c2522a', traits: ['splits'] },
  hollow:  { name: 'Hollow Moth',  hp: 148, spd: 1.04, armor: 2, bounty: 14, leak: 2, r: 0.46, body: '#cdb6f4', wing: '#7a5ea8', traits: ['noslow', 'fireproof'] },
  drifter: { name: 'Pale Drifter', hp: 90,  spd: 1.18, armor: 1, bounty: 12, leak: 1, r: 0.40, body: '#eef0e4', wing: '#a8c2b2', traits: ['healer'] },
  thief:   { name: 'Wax Thief',    hp: 78,  spd: 2.18, armor: 0, bounty: 8,  leak: 1, r: 0.38, body: '#ffd9a3', wing: '#b4863f', traits: ['thief'] },
  regent:  { name: 'Regent Moth',  hp: 760, spd: 0.80, armor: 6, bounty: 80, leak: 4, r: 0.74, body: '#ffe9a8', wing: '#c98a2e', traits: ['boss', 'spawner'] },
};

// ── the lights ────────────────────────────────────────────────────
const TOWER_TYPES = {
  candle: {
    name: 'Candlewick', role: 'Quick single flame · sets them burning', cost: 60, hue: '#ffc46b',
    blurb: 'A stub of tallow with a stubborn flame. It remembers every moth it has ever lit.',
    base: { range: 4.2, rate: 1.25, dmg: 9, burn: 3.5, burnTime: 2.2, shots: 1 },
    ups: [
      { name: 'Trim the Wick', cost: 50, desc: 'A faster flame: +30% cadence.', mod: { rate: 1.3 } },
      { name: "Beekeeper's Tallow", cost: 85, desc: 'Burns more than twice as hot, and lingers.', mod: { burn: 2.2, burnTime: 1.6 } },
      { name: 'Double Flame', cost: 140, desc: 'Two flames per breath.', mod: { shots: 1 } },
      { name: 'Vespers', cost: 220, desc: '+35% power; a moth that dies burning sets its neighbours alight.', mod: { dmg: 1.35, deathfire: 1 } },
    ],
  },
  bramble: {
    name: 'Bramble Lantern', role: 'Chills them · roots them in place', cost: 80, hue: '#86e3c4',
    blurb: 'A lantern hung in thorns. The thorns are patient and have very long memories.',
    base: { range: 3.9, slow: 0.30, tick: 2.2, dmg: 7, rootEvery: 3.4, rootTime: 0.55, roots: 1 },

const WAVE_NAMES = [
  'First Draught', 'The Waxing', 'Saltwind', 'Ashes in the Rye', 'The Long Kitchen', 'Glass Hour',
  'The Hungry Door', 'Regent of Small Things', 'Paper Tides', 'Smoke Ladder', 'The Quiet Choir', 'Moth Feast',
  'Candlemas', 'The Hollow Census', 'Wickfall', 'Regent of Wide Wings', 'Salt and Honey', 'The Late Lamps',
  'Thorn Procession', 'Ember Court', 'The Thinning', 'Wax and Bone', 'Last Draught', 'The Final Regent',
];

function buildWaves() {
  const waves = [];
  for (let i = 1; i <= 24; i++) {
    const idx = i - 1;
    const hpMul = 1 + idx * 0.26 + idx * idx * 0.0115;
    const groups = [];
    const g = (kind, count, gap, delay) => { if (count > 0) groups.push({ kind, count, gap, delay }); };
    g('dusk', 5 + Math.floor(i * 0.85), Math.max(0.42, 0.95 - i * 0.018), 0);
    if (i >= 3) g('flutter', Math.min(11, 2 + Math.floor(i * 0.55)), 0.32, 3.4);
    if (i >= 5) g('soot', Math.min(9, 1 + Math.floor(i * 0.40)), 1.05, 6.2);
    if (i >= 7) g('glass', Math.min(7, Math.floor(i * 0.33)), 0.8, 8.8);
    if (i >= 10 && i % 2 === 0) g('cinder', Math.min(6, Math.floor(i * 0.26)), 0.9, 10.5);
    if (i >= 13) g('hollow', Math.min(4, 1 + Math.floor((i - 13) * 0.32)), 1.6, 12.5);
    if (i >= 14 && i % 3 === 0) g('drifter', 1 + Math.floor((i - 14) / 4), 1.5, 7.2);
    if (i >= 16 && i % 2 === 1) g('thief', Math.min(4, Math.floor((i - 14) * 0.4)), 0.8, 5.2);
    if (i % 8 === 0) g('regent', i >= 24 ? 2 : 1, 2.6, 6.5);
    waves.push({ n: i, name: WAVE_NAMES[idx], groups, hpMul, spdMul: 1 + idx * 0.006, bountyMul: 1 + idx * 0.05 });
  }
  return waves;
}

// ── the glasshouse floor ────────────────────────────────────────
const BOARD_R = 7;

function makeBoard(rng) {
  const cells = new Map();
  for (let q = -BOARD_R; q <= BOARD_R; q++) {
    for (let r = Math.max(-BOARD_R, -q - BOARD_R); r <= Math.min(BOARD_R, -q + BOARD_R); r++) {
      cells.set(hkey(q, r), { q, r, track: false, tower: null, ring: hdist(q, r, 0, 0) });
    }
  }
  const path = carveTrack(rng, cells);
  for (const h of path) cells.get(hkey(h.q, h.r)).track = true;
  // outer silhouette of the roof: each boundary edge once, as a segment.
  // Endpoints are the midpoints of the shared hex side, offset perpendicular
  // to the neighbour direction by half a side length, so the outline is a
  // closed loop of unit-length segments.
  const frame = [];
  const seenEdge = new Set();
  const rk = (x, y) => (Math.round(x * 1e4) / 1e4 + 0).toFixed(4) + ',' + (Math.round(y * 1e4) / 1e4 + 0).toFixed(4);
  for (const c of cells.values()) {
    const w = hworld(c.q, c.r);
    for (const d of HEX_DIRS) {
      if (cells.has(hkey(c.q + d[0], c.r + d[1]))) continue;
      const nw = hworld(c.q + d[0], c.r + d[1]);
      let ux = nw.x - w.x, uy = nw.y - w.y;
      const L = Math.hypot(ux, uy); ux /= L; uy /= L;
      const mx = w.x + ux * (SQRT3 / 2), my = w.y + uy * (SQRT3 / 2);
      const px = -uy * 0.5, py = ux * 0.5;
      const a = { x: mx - px, y: my - py }, b = { x: mx + px, y: my + py };
      const ek = [rk(a.x, a.y), rk(b.x, b.y)].sort().join('|');
      if (seenEdge.has(ek)) continue;
      seenEdge.add(ek);
      frame.push([a, b]);
    }
  }
  const pts = path.map(h => hworld(h.q, h.r));
  let total = 0;
  const segs = [];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push({ a, b, len, at: total });
    total += len;
  }
  return { cells, path, pts, segs, total, frame };
}

function carveTrack(rng, cells) {
  const all = [...cells.values()];
  const mid = all.filter(h => h.ring >= BOARD_R - 2);
  // A random target length per roof, so tracks vary from snaking to direct.
  const MINL = 22, MAXL = 46;
  let best = null;
  for (let attempt = 0; attempt < 40; attempt++) {
    const targetLen = MINL + Math.floor(rng() * (MAXL - MINL + 1));
    const start = pick(rng, mid);
    // the far end is drawn from the opposite side of the board, with jitter
    let end = start, far = -1;
    for (const b of mid) {
      const d = hdist(b.q, b.r, start.q, start.r) + rng() * 4;
      if (d > far) { far = d; end = b; }
    }
    if (end === start) continue;
    // Meandering DFS with a soft length window: accept when we land near target.
    const visited = new Set([hkey(start.q, start.r)]);
    const path = [start];
    const stack = [{ node: start, nbrs: shuffled(rng, hneighbors(start.q, start.r)) }];
    let settled = null, guard = 0;
    while (stack.length && guard++ < 6000) {
      const top = stack[stack.length - 1];
      if (top.node === end && path.length >= MINL) {
        const score = Math.abs(path.length - targetLen);
        if (!settled || score < settled.score) settled = { score, path: path.slice() };
        if (score <= 3) break;
        // keep walking past the end to hunt a better length match
      }
      if (!top.nbrs.length || path.length >= MAXL) {
        stack.pop(); visited.delete(hkey(top.node.q, top.node.r)); path.pop();
        continue;
      }
      const nb = top.nbrs.pop();
      const k = hkey(nb[0], nb[1]);
      if (visited.has(k) || !cells.has(k)) continue;
      visited.add(k);
      path.push(cells.get(k));
      stack.push({ node: cells.get(k), nbrs: shuffled(rng, hneighbors(nb[0], nb[1])) });
    }
    if (settled && (!best || settled.score < best.score)) best = settled;
  }
  if (best) return best.path;
  // last resort: a walk from the rim inward
  const start = pick(rng, mid);
  const path = [start];
  let q = start.q, r = start.r;
  for (let step = 0; step < 26; step++) {
    const opts = shuffled(rng, hneighbors(q, r)).filter(nb => cells.has(hkey(nb[0], nb[1])) && !path.some(p => p.q === nb[0] && p.r === nb[1]));
    if (!opts.length) break;
    q = opts[0][0]; r = opts[0][1];
    path.push(cells.get(hkey(q, r)));
  }
  return path;
}
