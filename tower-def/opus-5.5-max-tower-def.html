  fg.addColorStop(0, 'rgba(8,3,1,0)'); fg.addColorStop(1, 'rgba(8,3,1,.92)');
  g.fillStyle = fg; g.fillRect(0, view.h - H * 1.4, view.w, H * 1.4);
  const rise = G.phase === 'dawn' || (G.phase === 'over' && G.won) ? Math.min(1, G.dawnT / 1.5) * H * 0.22 : 0;
  for (const s of view.seats) {
    if (s.empty) { drawChair(g, s.x, base, H); continue; }
    const hop = s.hop > 0 ? Math.sin((1 - s.hop / 0.45) * Math.PI) * H * 0.22 : 0;
    const gasp = s.gasp > 0 ? Math.sin(s.gasp / 0.6 * Math.PI) * H * 0.07 : 0;
    const bob = G.calm ? 0 : Math.sin(G.real * 1.3 + s.ph) * H * 0.015;
    drawHead(g, s.x, base - rise - hop + gasp + bob, H * s.s, s.kind);
  }
}
function drawWisps(g) {
  if (!G.wisps.length) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  const cs = view.cs, ty = view.h - view.audH * 0.7;
  for (const w of G.wisps) {
    const t = clamp(w.t, 0, 1);
    for (let k = 0; k < 5; k++) {
      const tt = clamp(t - k * 0.045, 0, 1), u = 1 - tt;
      const x = u * u * w.x0 + 2 * u * tt * w.cx + tt * tt * w.seat.x;
      const y = u * u * w.y0 + 2 * u * tt * w.cy + tt * tt * ty;
      g.fillStyle = 'rgba(255,226,160,' + (0.5 * (1 - k / 5)).toFixed(3) + ')';
      g.beginPath(); g.arc(x, y, Math.max(1, cs * (0.07 - k * 0.011) * (w.big ? 2 : 1)), 0, TAU); g.fill();
    }
  }
  g.restore();
}

// ============================================================ the frame
function flicker() {
  let f = 1;
  if (!G.calm) { const t = G.real; f += 0.022 * Math.sin(t * 7.3) + 0.016 * Math.sin(t * 13.1 + 1.3) + 0.01 * Math.sin(t * 29.7 + 0.4); }
  return f - G.dimPulse * 0.3;
}

function eyeXY() { return [sx(EYE.x + 0.5, EYE.y + 0.5), sy(EYE.x + 0.5, EYE.y + 0.5)]; }

function lightPass(g, lampF, flick) {
  const cs = view.cs;
  const [ex, ey] = eyeXY();
  g.save();
  g.globalCompositeOperation = 'lighter';
  const r = cs * (1.1 + 1.5 * lampF) * Math.max(0.6, flick);
  const gl = g.createRadialGradient(ex, ey, 0, ex, ey, r);
  gl.addColorStop(0, 'rgba(255,236,190,' + (0.5 * lampF + 0.08).toFixed(3) + ')');
  gl.addColorStop(0.35, 'rgba(255,190,110,' + (0.2 * lampF).toFixed(3) + ')');
  gl.addColorStop(1, 'rgba(255,160,80,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(ex, ey, r, 0, TAU); g.fill();
  for (const t of G.towers) {
    if (t.type !== 'glim' || G.moving === t) continue;
    const X = sx(t.x, t.y), Y = sy(t.x, t.y), R = t.st.range * cs;
    const f = (1 + 0.04 * Math.sin(G.real * 9 + t.id)) * (t.frozenT > 0 ? 0.55 : 1) * (0.5 + 0.5 * (t.press < 1 ? t.press : 1));
    const lg = g.createRadialGradient(X, Y, R * 0.1, X, Y, R * f);
    lg.addColorStop(0, 'rgba(255,214,130,.3)'); lg.addColorStop(0.72, 'rgba(255,190,100,.14)'); lg.addColorStop(1, 'rgba(255,170,80,0)');
    g.fillStyle = lg; g.beginPath(); g.arc(X, Y, R * f, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,236,190,.22)'; g.lineWidth = Math.max(1, cs * 0.03);
    g.beginPath(); g.arc(X, Y, R, 0, TAU); g.stroke();
    if (t.st.beam && t.frozenT <= 0) {
      const ox = X + t.face * 0.34 * cs, oy = Y - 0.34 * cs, L = t.st.beamRange * cs;
      for (let k = 0; k < 2; k++) {
        const a = t.beamA + k * Math.PI;
        const dxl = Math.cos(a), dyl = Math.sin(a);
        const dxs = view.portrait ? dyl : dxl, dys = view.portrait ? dxl : dyl;
        const nx = -dys, ny = dxs, w0 = cs * 0.06, w1 = cs * 0.42;
        const bgr = g.createLinearGradient(ox, oy, ox + dxs * L, oy + dys * L);
        bgr.addColorStop(0, 'rgba(255,242,205,.5)'); bgr.addColorStop(1, 'rgba(255,215,150,0)');
        g.fillStyle = bgr; g.beginPath();
        g.moveTo(ox + nx * w0, oy + ny * w0); g.lineTo(ox + dxs * L + nx * w1, oy + dys * L + ny * w1);
        g.lineTo(ox + dxs * L - nx * w1, oy + dys * L - ny * w1); g.lineTo(ox - nx * w0, oy - ny * w0); g.closePath(); g.fill();
      }
    }
  }
  g.restore();
}

function drawEye(g, lampF, flick) {
  const cs = view.cs;
  const [ex, ey] = eyeXY();
  g.save(); g.translate(ex, ey); g.rotate(G.real * 0.05);
  g.fillStyle = 'rgba(40,14,3,.5)';
  for (let i = 0; i < 12; i++) {
    const a = i * TAU / 12, R = cs * (i % 2 ? 0.5 : 0.62);
    g.beginPath(); g.moveTo(Math.cos(a - 0.09) * cs * 0.34, Math.sin(a - 0.09) * cs * 0.34); g.lineTo(Math.cos(a) * R, Math.sin(a) * R); g.lineTo(Math.cos(a + 0.09) * cs * 0.34, Math.sin(a + 0.09) * cs * 0.34); g.fill();
  }
  g.strokeStyle = 'rgba(40,14,3,.5)'; g.lineWidth = cs * 0.04; g.beginPath(); g.arc(0, 0, cs * 0.3, 0, TAU); g.stroke();
  g.fillStyle = 'rgba(255,250,235,.9)';
  for (let i = 0; i < 16; i++) { const a = i * TAU / 16; g.beginPath(); g.arc(Math.cos(a) * cs * 0.3, Math.sin(a) * cs * 0.3, Math.max(0.8, cs * 0.014), 0, TAU); g.fill(); }
  g.restore();
  g.save(); g.globalCompositeOperation = 'lighter';
  const core = cs * 0.2 * (0.55 + 0.45 * lampF) * Math.max(0.5, flick);
  const cg = g.createRadialGradient(ex, ey, 0, ex, ey, core * 1.6);
  cg.addColorStop(0, 'rgba(255,255,245,.95)'); cg.addColorStop(0.5, 'rgba(255,236,190,.5)'); cg.addColorStop(1, 'rgba(255,220,160,0)');
  g.fillStyle = cg; g.beginPath(); g.arc(ex, ey, core * 1.6, 0, TAU); g.fill();
  g.restore();
}

function cellRect(cx, cy) {
  const x0 = sx(cx, cy), y0 = sy(cx, cy), x1 = sx(cx + 1, cy + 1), y1 = sy(cx + 1, cy + 1);
  return [Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0)];
}

function drawOpenCells(g) {
  g.fillStyle = 'rgba(255,250,230,.07)';
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!canBuildAt(x, y)) continue;
    const r = cellRect(x, y);
    g.fillRect(r[0] + 2, r[1] + 2, r[2] - 4, r[3] - 4);
  }
}

function drawReach(g, x, y, type, st, ok) {
  const cs = view.cs, X = sx(x, y), Y = sy(x, y);
  g.save();
  g.beginPath(); g.arc(X, Y, st.range * cs, 0, TAU);
  g.fillStyle = ok ? 'rgba(255,248,225,.1)' : 'rgba(210,60,30,.1)'; g.fill();
  g.setLineDash([cs * 0.12, cs * 0.1]); g.lineWidth = 1.5;
  g.strokeStyle = ok ? 'rgba(60,22,5,.6)' : 'rgba(170,40,20,.65)'; g.stroke();
  if (type === 'glim' && st.beam) { g.beginPath(); g.arc(X, Y, st.beamRange * cs, 0, TAU); g.lineWidth = 1; g.stroke(); }
  g.setLineDash([]);
  if (type === 'teller') {
    g.beginPath(); g.arc(X, Y, st.aura * cs, 0, TAU);
    g.fillStyle = 'rgba(166,64,125,.12)'; g.fill();
    g.strokeStyle = 'rgba(140,40,100,.65)'; g.lineWidth = 1.3; g.stroke();
  }
  g.restore();
}

function drawAuras(g) {
  const cs = view.cs;
  for (const t of G.towers) {
    if (G.moving === t) continue;
    if (t.type === 'teller') {
      const X = sx(t.x, t.y), Y = sy(t.x, t.y);
      g.save(); g.setLineDash([2, 5]); g.strokeStyle = 'rgba(130,34,90,.4)'; g.lineWidth = 1.2;
      g.beginPath(); g.arc(X, Y, t.st.aura * cs, 0, TAU); g.stroke(); g.restore();
    } else if (G.ranges && t !== G.selected) {
      const X = sx(t.x, t.y), Y = sy(t.x, t.y);
      g.save(); g.setLineDash([3, 5]); g.strokeStyle = 'rgba(60,22,5,.3)'; g.lineWidth = 1;
      g.beginPath(); g.arc(X, Y, t.st.range * cs, 0, TAU); g.stroke(); g.restore();
    }
  }
  for (const e of G.enemies) {
    if (!e.def.canopy) continue;
    const X = sx(e.x, e.y), Y = sy(e.x, e.y);
    g.fillStyle = 'rgba(30,10,3,.08)';
    g.beginPath(); g.arc(X, Y, e.def.canopy * cs, 0, TAU); g.fill();
  }
}

// how tall a shadow looks on the screen, in cells (bosses are drawn larger than they collide)
function vsize(d) { return d.size * (d.scale || 1); }
function liftOf(e) {
  const cs = view.cs;
  if (e.airT > 0) return Math.sin((1 - e.airT / HOP_TIME) * Math.PI) * cs * 0.45;
  if (e.type === 'moth') return cs * 0.06 * Math.sin(G.time * 8 + e.id);
  return 0;
}

function drawShadows(g) {
  const cs = view.cs;
  for (const e of G.enemies) {
    const X = sx(e.x, e.y), Y = sy(e.x, e.y);
    const d = e.def;
    const vx = (view.portrait ? e.ty : e.tx) * (e.v < 0 ? -1 : 1);
    if (Math.abs(vx) > 0.25) e.face = vx > 0 ? 1 : -1;
    const age = G.time - e.born;
    let alpha = age < 0.5 ? age / 0.5 : 1;
    if (d.faint) alpha *= e.revealT > 0 ? 0.8 : 0.12 + 0.05 * Math.sin(G.real * 3 + e.id);
    const lift = liftOf(e);
    const spr = spriteFor(e), S = spr.size;
    if (lift > 1) { g.fillStyle = 'rgba(30,10,2,.22)'; g.beginPath(); g.ellipse(X, Y + cs * 0.1, cs * 0.18, cs * 0.06, 0, 0, TAU); g.fill(); }
    g.save();
    g.globalAlpha = alpha;
    g.translate(X, Y - lift - vsize(d) * cs * 0.45);
    if (e.hitT > 0) { const k = e.hitT / 0.14; g.scale(1 + k * 0.07, 1 - k * 0.05); }
    if (age < 0.5) { const k = 1 + (1 - age / 0.5) * 0.6; g.scale(k, k); }
    if (e.face < 0) g.scale(-1, 1);
    g.drawImage(spr.canvas, -S / 2, -S / 2, S, S);
    g.restore();
    const top = Y - lift - vsize(d) * cs * 1.02;
    if (e.dazeT > 0) {
      g.fillStyle = HOLE;
      for (let i = 0; i < 3; i++) { const a = G.time * 6 + i * TAU / 3; g.beginPath(); g.arc(X + Math.cos(a) * cs * 0.14, top + Math.sin(a) * cs * 0.05, Math.max(1, cs * 0.025), 0, TAU); g.fill(); }
    }
    if (e.slow > 0 && !d.stubborn && lift < 1) {
      g.strokeStyle = 'rgba(255,244,215,.45)'; g.lineWidth = 1;
      const r = d.size * cs * 0.7;
      g.beginPath(); g.ellipse(X, Y + cs * 0.03, r, r * 0.28, 0, 0, TAU); g.stroke();
    }
    if (d.faint && e.revealT > 0) {
      g.save(); g.setLineDash([2, 3]); g.strokeStyle = 'rgba(255,240,200,.65)'; g.lineWidth = 1;
      g.beginPath(); g.arc(X, Y - d.size * cs * 0.45, d.size * cs * 0.85, 0, TAU); g.stroke(); g.restore();
    }
  }
}

function drawPuppets(g) {
  const cs = view.cs;
  const list = G.towers.slice().sort((a, b) => sy(a.x, a.y) - sy(b.x, b.y));
  for (const t of list) {
    if (G.moving === t) continue;
    const X = sx(t.x, t.y), Y = sy(t.x, t.y);
    if (t.aim) { const ax = sx(t.aim.x, t.aim.y); if (Math.abs(ax - X) > 2) t.face = ax > X ? 1 : -1; }
    if (t.buff && t.buff.dmg > 0) {
      g.fillStyle = 'rgba(166,64,125,.55)';
      g.beginPath(); g.ellipse(X, Y + cs * 0.43, cs * 0.2, cs * 0.05, 0, 0, TAU); g.fill();
    }
    if (G.selected === t) {
      g.strokeStyle = 'rgba(255,236,180,.95)'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(X, Y + cs * 0.43, cs * 0.3, cs * 0.08, 0, 0, TAU); g.stroke();
    }
    const press = t.press < 1 ? smooth(t.press) : 1;
    g.save();
    if (press < 1) {
      g.globalAlpha = 0.35 + 0.65 * press;
      if (HAS_FILTER && press < 0.85) g.filter = 'blur(' + ((1 - press) * cs * 0.06).toFixed(1) + 'px)';
    }
    if (t.frozenT > 0) g.globalAlpha *= 0.62;
    drawPuppet(g, t.type, t.tier, X, Y, cs * (1 + (1 - press) * 0.35), t);
    g.restore();
    if (t.tier > 1) {
      for (let i = 0; i < t.tier - 1; i++) {
        const px = X + (i - (t.tier - 2) / 2) * cs * 0.1;
        g.fillStyle = INK; g.beginPath(); g.arc(px, Y + cs * 0.47, Math.max(1.5, cs * 0.034), 0, TAU); g.fill();
        g.fillStyle = GEL.gold; g.beginPath(); g.arc(px, Y + cs * 0.47, Math.max(1, cs * 0.022), 0, TAU); g.fill();
      }
    }
    if (t.frozenT > 0) {
      const cx = X, cy = Y - cs * 0.55, r = Math.max(5, cs * 0.12);
      g.fillStyle = 'rgba(255,248,230,.92)'; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
      g.strokeStyle = INK; g.lineWidth = 1.2; g.stroke();
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + r * 0.45, cy + r * 0.25); g.moveTo(cx, cy); g.lineTo(cx + r * 0.2, cy - r * 0.7); g.stroke();
    }
  }
}

function drawGhost(g) {
  const cs = view.cs;
  if (G.selected && !G.moving && G.towers.includes(G.selected)) drawReach(g, G.selected.x, G.selected.y, G.selected.type, G.selected.st, true);
  const type = G.moving ? G.moving.type : G.placing;
  if (!type || !G.ghost) return;
  const { cx, cy } = G.ghost;
  if (!inBoard(cx, cy)) return;
  const tier = G.moving ? G.moving.tier : 1;
  const ok = canBuildAt(cx, cy) && (G.moving || G.coppers >= TOWERS[type].cost);
  const r = cellRect(cx, cy);
  g.fillStyle = ok ? 'rgba(255,248,220,.24)' : 'rgba(200,40,20,.22)';
  g.fillRect(r[0] + 1, r[1] + 1, r[2] - 2, r[3] - 2);
  drawReach(g, cx + 0.5, cy + 0.5, type, previewStats(type, tier, cx, cy), ok);
  const X = sx(cx + 0.5, cy + 0.5), Y = sy(cx + 0.5, cy + 0.5);
  g.save();
  g.globalAlpha = ok ? 0.6 : 0.3;
  if (HAS_FILTER) g.filter = 'blur(' + (cs * 0.045).toFixed(1) + 'px)';
  drawPuppet(g, type, tier, X, Y, cs * 1.2, G.moving || null);
  g.restore();
  if (!ok) {
    g.strokeStyle = 'rgba(170,30,15,.85)'; g.lineWidth = 2.5; const k = cs * 0.18;
    g.beginPath(); g.moveTo(X - k, Y - k); g.lineTo(X + k, Y + k); g.moveTo(X + k, Y - k); g.lineTo(X - k, Y + k); g.stroke();
  }
}

function drawBars(g) {
  const cs = view.cs;
  for (const e of G.enemies) {
    if (e.def.boss || e.hp >= e.maxHp || (e.def.faint && e.revealT <= 0)) continue;
    const X = sx(e.x, e.y), Y = sy(e.x, e.y) - liftOf(e) - vsize(e.def) * cs * 1.18;
    const w = cs * Math.max(0.42, e.def.size * 1.1), h = Math.max(2.5, cs * 0.055);
    const f = clamp(e.hp / e.maxHp, 0, 1);
    g.fillStyle = 'rgba(20,8,3,.78)'; g.fillRect(X - w / 2 - 1, Y - 1, w + 2, h + 2);
    g.fillStyle = f > 0.5 ? '#fff0c8' : f > 0.25 ? '#ffc56b' : '#ff7a4a';
    g.fillRect(X - w / 2, Y, w * f, h);
  }
}

function strokeLine(g, x0, y0, x1, y1) { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }

function drawFx(g) {
  const cs = view.cs;
  for (const f of G.fx) {
    const k = clamp(f.t / f.dur, 0, 1), a = 1 - k;
    const X = sx(f.x, f.y), Y = sy(f.x, f.y);
    switch (f.kind) {
      case 'snip': {
        g.save(); g.translate(X, Y - cs * 0.2); g.rotate(f.rot);
        g.strokeStyle = 'rgba(255,252,235,' + a.toFixed(3) + ')'; g.lineWidth = cs * 0.045 * a + 1;
        g.beginPath(); g.arc(0, 0, f.r * cs * (0.6 + 0.5 * k), -1.1, 1.1); g.stroke();
        if (f.clean) { const L = f.r * cs; strokeLine(g, -L, -L * 0.2, L, L * 0.2); strokeLine(g, -L * 0.2, -L, L * 0.2, L); }
        g.restore(); break;
      }
      case 'ripple': {
        const rings = f.boom ? 3 : 2;
        for (let i = 0; i < rings; i++) {
          const kk = clamp(k - i * 0.15, 0, 1);
          if (kk <= 0) continue;
          const R = f.r * cs * (0.2 + 0.8 * (1 - (1 - kk) * (1 - kk)));
          g.strokeStyle = 'rgba(40,14,3,' + (0.45 * (1 - kk)).toFixed(3) + ')'; g.lineWidth = cs * (f.boom ? 0.09 : 0.06);
          g.beginPath(); g.arc(X, Y, R, 0, TAU); g.stroke();
          g.strokeStyle = 'rgba(255,245,220,' + (0.5 * (1 - kk)).toFixed(3) + ')'; g.lineWidth = cs * 0.025;
          g.beginPath(); g.arc(X, Y, Math.max(1, R - cs * 0.06), 0, TAU); g.stroke();
        }
        break;
      }
      case 'flare': {
        g.save(); g.globalCompositeOperation = 'lighter';
        const R = f.r * cs * (0.5 + 0.6 * k);
        const gr = g.createRadialGradient(X, Y, 0, X, Y, R);
        gr.addColorStop(0, 'rgba(255,240,200,' + (0.45 * a).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(255,200,120,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(X, Y, R, 0, TAU); g.fill();
        g.strokeStyle = 'rgba(255,250,230,' + (0.7 * a).toFixed(3) + ')'; g.lineWidth = cs * 0.03;
        g.beginPath(); g.arc(X, Y, R, 0, TAU); g.stroke();
        g.restore(); break;
      }
      case 'beam': {
        const t = f.tower;
        const TX = sx(t.x, t.y), TY = sy(t.x, t.y);
        const ox = f.mirror ? TX - t.face * 0.2 * cs : TX + t.face * 0.25 * cs;
        const oy = f.mirror ? TY - 0.1 * cs : TY - 0.36 * cs;
        const X2 = sx(f.x2, f.y2), Y2 = sy(f.x2, f.y2) - cs * 0.2;
        const [ex, ey] = eyeXY();
        g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
        g.strokeStyle = 'rgba(255,236,190,' + (0.22 * a).toFixed(3) + ')'; g.lineWidth = Math.max(1, cs * 0.04);
        strokeLine(g, ex, ey, ox, oy);
        g.strokeStyle = 'rgba(255,214,140,' + ((f.ecl ? 0.5 : 0.35) * a).toFixed(3) + ')'; g.lineWidth = f.w * cs * 1.9;
        strokeLine(g, ox, oy, X2, Y2);
        g.strokeStyle = 'rgba(255,248,228,' + (0.85 * a).toFixed(3) + ')'; g.lineWidth = Math.max(1.5, f.w * cs * 0.45);
        strokeLine(g, ox, oy, X2, Y2);
        g.restore();
        if (f.ecl) { g.strokeStyle = 'rgba(30,10,4,' + (0.75 * a).toFixed(3) + ')'; g.lineWidth = Math.max(1, f.w * cs * 0.12); strokeLine(g, ox, oy, X2, Y2); }
        break;
      }
      case 'heal': {
        const R = f.r * cs * (0.3 + 0.7 * k);
        g.strokeStyle = 'rgba(25,8,3,' + (0.45 * a).toFixed(3) + ')'; g.lineWidth = cs * 0.05;
        g.beginPath(); g.arc(X, Y - cs * 0.2, R, 0, TAU); g.stroke();
        g.fillStyle = 'rgba(25,8,3,' + (0.12 * a).toFixed(3) + ')'; g.fill();
        break;
      }
      case 'chime': {
        for (let i = 0; i < 3; i++) {
          const kk = clamp(k * 1.3 - i * 0.18, 0, 1);
          if (kk <= 0 || kk >= 1) continue;
          g.strokeStyle = 'rgba(35,20,40,' + (0.5 * (1 - kk)).toFixed(3) + ')'; g.lineWidth = cs * 0.05;
          g.beginPath(); g.arc(X, Y - cs * 0.4, f.r * cs * kk, 0, TAU); g.stroke();
        }
        break;
      }
      case 'gulp': {
        const R = f.r * cs * (1 - k * 0.85);
        g.strokeStyle = 'rgba(15,4,1,' + (0.75 * a).toFixed(3) + ')'; g.lineWidth = cs * 0.14 * a + 1;
        g.beginPath(); g.arc(X, Y, R, 0, TAU); g.stroke();
        break;
      }
      case 'summon': {
        const R = f.r * cs * k;

      case 'press': {

        g.beginPath(); g.ellipse(X, Y + cs * 0.3, R, R * 0.35, 0, 0, TAU); g.stroke();

          g.beginPath(); g.arc(X + Math.cos(ang) * R, Y - cs * (0.1 + 0.4 * k) + Math.sin(ang) * R * 0.4, Math.max(1, cs * 0.03), 0, TAU); g.fill();
        }

      case 'ink': {

        g.beginPath(); g.arc(X, Y - cs * 0.2, f.r * cs * (0.5 + 0.5 * k), 0, TAU); g.fill();
        break;
      }

}

function drawShots(g) {
  const cs = view.cs, size = Math.max(5, cs * 0.16);
  for (const s of G.shots) {
    const X = sx(s.x, s.y), Y = sy(s.x, s.y) - cs * 0.2;
    g.save(); g.translate(X, Y); g.rotate(Math.sin(s.spin) * 0.5); g.scale(size, size);
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = 'rgba(255,238,200,.6)'; g.lineWidth = 0.34; g.beginPath(); GLYPHS[s.g](g); g.stroke();
    g.strokeStyle = '#2a0c1e'; g.lineWidth = 0.16; g.beginPath(); GLYPHS[s.g](g); g.stroke();
    g.restore();
  }
}

function drawParticles(g) {
  for (const p of G.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    switch (p.kind) {
      case 'smoke': g.fillStyle = 'rgba(22,9,5,' + (0.42 * a).toFixed(3) + ')'; g.beginPath(); g.arc(p.x, p.y, p.size * (1.6 - a * 0.6), 0, TAU); g.fill(); break;
      case 'clip': g.fillStyle = 'rgba(22,9,5,' + a.toFixed(3) + ')'; g.fillRect(p.x, p.y, p.size, p.size * 0.6); break;
      case 'ember': g.fillStyle = 'rgba(255,' + ((150 + 80 * a) | 0) + ',60,' + a.toFixed(3) + ')'; g.fillRect(p.x, p.y, p.size, p.size); break;
      case 'thread':
        g.strokeStyle = 'rgba(22,9,5,' + (0.7 * a).toFixed(3) + ')'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(p.x, p.y); g.quadraticCurveTo(p.x + p.size * 0.5, p.y - p.size * 0.3, p.x + p.size, p.y + p.size * 0.1); g.stroke(); break;
      case 'spark': g.fillStyle = 'rgba(255,236,170,' + a.toFixed(3) + ')'; g.fillRect(p.x, p.y, p.size, p.size); break;
      case 'dust': g.fillStyle = 'rgba(255,240,205,' + (0.8 * a).toFixed(3) + ')'; g.fillRect(p.x, p.y, p.size, p.size); break;
    }

}

function drawFloaters(g) {
  if (!G.floaters.length) return;
  const cs = view.cs;
  g.font = '700 ' + Math.round(clamp(cs * 0.28, 10, 17)) + 'px ' + FONT_UI;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  for (const f of G.floaters) {
    const k = f.t / 1.1, y = f.y - k * cs * 0.8;
    g.globalAlpha = 1 - k * k;
    g.lineWidth = 3; g.strokeStyle = 'rgba(30,10,3,.85)'; g.strokeText(f.text, f.x, y);
    g.fillStyle = f.color; g.fillText(f.text, f.x, y);
  }
  g.globalAlpha = 1;
}

function drawMothAt(g, x, y, frame, scale) {
  const spr = getSprite('moth', frame), S = spr.size * (scale || 1);
  g.drawImage(spr.canvas, x - S / 2, y - S / 2, S, S);
}

function drawTitleMoth(g) {
  const t = G.real, cs = view.cs;
  const [ex, ey] = eyeXY();
  drawMothAt(g, ex + Math.cos(t * 0.8) * cs * 1.3, ey + Math.sin(t * 1.6) * cs * 0.55 - cs * 0.2, Math.floor(t * 14) % FRAMES, 1);
}

function drawDawnMoth(g) {
  const seat = view.seats.find(s => s.empty);
  if (!seat) return;
  const k = clamp((G.dawnT - 1) / 2.8, 0, 1);
  if (k <= 0) return;
  const [ex, ey] = eyeXY();
  const H = view.audH, tx = seat.x, ty = view.h + 2 - H * 0.95 - H * 0.1;
  const e = smooth(k);
  const x = lerp(ex, tx, e) + Math.sin(k * 9) * view.cs * 0.5 * (1 - k);
  const y = lerp(ey, ty, e) - Math.sin(k * Math.PI) * view.cs * 1.5;
  drawMothAt(g, x, y, k < 1 ? Math.floor(G.real * 12) % FRAMES : 0, 0.75);
}

// The paper dims as Old Sun loses flame, and darkens for a beat whenever a shadow drinks from it.
// (The lamp's own flicker lives in the eye and lantern glows, which keeps this pass off at full flame.)
function dimPass(g, lampF) {
  const P = view.paper;
  const a = G.phase === 'title' ? 0.06 : 0.5 * Math.pow(1 - lampF, 1.3) + G.dimPulse * 0.24;
  if (a > 0.006) { g.fillStyle = 'rgba(20,6,2,' + clamp(a, 0, 0.85).toFixed(3) + ')'; g.fillRect(P.x, P.y, P.w, P.h); }
}

function endPasses(g) {
  if (G.phase === 'dawn' || (G.phase === 'over' && G.won)) {
    const k = clamp(G.dawnT / 3.2, 0, 1);
    g.save(); g.globalCompositeOperation = 'lighter';
    const gr = g.createLinearGradient(view.w, 0, 0, view.h);
    gr.addColorStop(0, 'rgba(255,236,200,' + (0.5 * k).toFixed(3) + ')');
    gr.addColorStop(0.6, 'rgba(255,205,150,' + (0.22 * k).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(255,190,120,' + (0.08 * k).toFixed(3) + ')');
    g.fillStyle = gr; g.fillRect(0, 0, view.w, view.h);
    g.restore();
    drawDawnMoth(g);
  }
  if (G.phase === 'gutter' || (G.phase === 'over' && !G.won)) {
    const k = clamp(G.gutterT / 2.4, 0, 1);
    g.fillStyle = 'rgba(4,2,1,' + (0.8 * k).toFixed(3) + ')'; g.fillRect(0, 0, view.w, view.h);
    const [ex, ey] = eyeXY();
    const ember = Math.max(0, 1 - k * 0.8) * (0.7 + 0.3 * Math.sin(G.real * 17));
    g.save(); g.globalCompositeOperation = 'lighter';
    g.fillStyle = 'rgba(255,120,40,' + (0.6 * ember).toFixed(3) + ')';
    g.beginPath(); g.arc(ex, ey, view.cs * 0.08, 0, TAU); g.fill();
    g.restore();
  }
}

function render() {
  if (view.dirty && !layout()) return;
  const g = ctx, cs = view.cs;
  g.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  let shx = 0, shy = 0;
  if (G.shake > 0 && !G.calm) { shx = (Math.random() - 0.5) * cs * 0.14 * G.shake; shy = (Math.random() - 0.5) * cs * 0.14 * G.shake; }
  g.save(); g.translate(shx, shy);
  g.drawImage(bg, 0, 0, view.w, view.h);
  const lampF = G.phase === 'title' ? 1 : clamp(G.lamp / G.lampMax, 0, 1);
  const flick = flicker();
  lightPass(g, lampF, flick);
  drawEye(g, lampF, flick);
  if (G.placing || G.moving) drawOpenCells(g);
  drawAuras(g);
  drawShadows(g);
  drawPuppets(g);
  drawFx(g);
  drawShots(g);
  drawGhost(g);
  drawBars(g);
  drawParticles(g);
  drawFloaters(g);
  if (G.phase === 'title') drawTitleMoth(g);
  g.restore();
  dimPass(g, lampF);
  drawAudience(g);
  drawWisps(g);
  endPasses(g);
}

// ================================================================= sound
// Everything is synthesised: gamelan-ish bells, paper, drums, a hissing lamp.
const PENTA = [293.66, 349.23, 392.0, 440.0, 523.25, 587.33, 698.46, 783.99, 880.0];
const AudioSys = {
  ctx: null, out: null, sfxBus: null, musicBus: null, noiseBuf: null,
  muted: store.get('muted', false), sfxOn: store.get('sfx', true), musicOn: store.get('music', true),
  last: Object.create(null),
  init() {

      comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.2;
      comp.connect(c.destination);
      this.out = c.createGain(); this.out.gain.value = this.muted ? 0 : 0.85; this.out.connect(comp);
      this.sfxBus = c.createGain(); this.sfxBus.gain.value = this.sfxOn ? 1 : 0; this.sfxBus.connect(this.out);
      this.musicBus = c.createGain(); this.musicBus.gain.value = this.musicOn ? 0.55 : 0; this.musicBus.connect(this.out);
      const len = (c.sampleRate * 1.5) | 0, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      this.startMusic();
    } catch (e) { this.ctx = null; }
  },
  apply() {
    store.set('muted', this.muted); store.set('sfx', this.sfxOn); store.set('music', this.musicOn);
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.out.gain.setTargetAtTime(this.muted ? 0 : 0.85, t, 0.05);
    this.sfxBus.gain.setTargetAtTime(this.sfxOn ? 1 : 0, t, 0.05);
    this.musicBus.gain.setTargetAtTime(this.musicOn ? 0.55 : 0, t, 0.3);
  },
  tone(f, dur, o) {

    osc.frequency.setValueAtTime(f, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.1, t0 + (o.attack || 0.006));

  },
  hiss(dur, o) {

    const f = c.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1000, t0); f.Q.value = o.q || 1;
    if (o.slide) f.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur);

    g.gain.exponentialRampToValueAtTime(o.gain || 0.1, t0 + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(o.bus || this.sfxBus);

  },
  bell(f, dur, gain, delay, bus) {
    this.tone(f, dur, { gain, delay, bus, attack: 0.003 });
    this.tone(f * 2.76, dur * 0.5, { gain: gain * 0.35, delay, bus, attack: 0.002 });
    this.tone(f * 5.4, dur * 0.25, { gain: gain * 0.12, delay, bus, attack: 0.002 });
  },
  play(name) {
    if (!this.ctx || this.muted || !this.sfxOn || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime;
    const gap = { snip: 0.05, clean: 0.05, home: 0.05, drum: 0.07, glyph: 0.06, beam: 0.06, lamp: 0.12, flare: 0.1, place: 0.05, tick: 0.03 }[name] || 0.03;
    if (this.last[name] && now - this.last[name] < gap) return;
    this.last[name] = now;
    const pick = () => PENTA[(Math.random() * PENTA.length) | 0];
    switch (name) {
      case 'snip': this.hiss(0.03, { freq: 4200, q: 3, gain: 0.07 }); this.hiss(0.03, { freq: 5400, q: 3, gain: 0.05, delay: 0.045 }); break;
      case 'clean': this.hiss(0.05, { freq: 3800, q: 2, gain: 0.1 }); this.tone(1760, 0.2, { type: 'triangle', gain: 0.05, delay: 0.03 }); break;
      case 'drum': this.tone(118, 0.32, { slide: 50, gain: 0.3 }); this.hiss(0.05, { filter: 'lowpass', freq: 420, gain: 0.1 }); break;
      case 'boom': this.tone(86, 0.8, { slide: 32, gain: 0.45 }); this.hiss(0.3, { filter: 'lowpass', freq: 240, gain: 0.25 }); break;
      case 'flare': this.hiss(0.35, { freq: 600, slide: 2600, q: 1.2, gain: 0.07 }); break;
      case 'beam': this.tone(1318.5, 0.22, { gain: 0.045, slide: 1760 }); this.tone(1975.5, 0.18, { gain: 0.02 }); break;
      case 'eclipse': this.tone(659.3, 0.7, { gain: 0.08, slide: 330 }); this.tone(988, 0.6, { gain: 0.04 }); this.hiss(0.45, { freq: 1200, gain: 0.05 }); break;
      case 'glyph': this.tone(pick() * 2, 0.12, { type: 'triangle', gain: 0.03 }); break;
      case 'twist': this.tone(880, 0.32, { slide: 440, type: 'triangle', gain: 0.05 }); break;
      case 'home': this.bell(pick() * 2, 0.5, 0.028); break;
      case 'bosshome': this.bell(293.66, 2.4, 0.12); this.bell(440, 2.2, 0.08, 0.15); this.bell(587.33, 2.2, 0.06, 0.3); break;
      case 'lamp': this.tone(92, 0.65, { slide: 44, gain: 0.34 }); this.hiss(0.5, { filter: 'lowpass', freq: 380, gain: 0.18 }); break;
      case 'place': this.hiss(0.09, { filter: 'lowpass', freq: 900, gain: 0.16 }); this.tone(196, 0.14, { gain: 0.07 }); break;
      case 'upgrade': this.bell(587.33, 0.7, 0.06); this.bell(880, 0.8, 0.05, 0.09); break;
      case 'sell': this.bell(440, 0.4, 0.045); this.bell(293.66, 0.5, 0.045, 0.08); break;
      case 'gong':
        for (const [m, gn, d] of [[1, 0.2, 3.2], [2.1, 0.08, 2.4], [3.3, 0.05, 1.6], [4.6, 0.03, 1.2]]) this.tone(98 * m, d, { gain: gn, attack: 0.01 });

      case 'bell': this.bell(783.99, 1.3, 0.07); this.bell(1174.7, 1.4, 0.04, 0.12); break;
      case 'chime': [523.25, 659.25, 783.99, 523.25].forEach((f, i) => this.bell(f, 1.1, 0.07, i * 0.22)); break;
      case 'dawn': [293.66, 349.23, 440, 523.25, 587.33, 698.46, 880].forEach((f, i) => this.bell(f, 2.6, 0.06, i * 0.16)); break;
      case 'gutter': [440, 392, 349.23, 293.66, 220].forEach((f, i) => this.tone(f, 1.4, { gain: 0.06, delay: i * 0.28, type: 'triangle' })); this.hiss(2.2, { filter: 'lowpass', freq: 500, slide: 120, gain: 0.08 }); break;
      case 'nope': this.tone(150, 0.12, { type: 'square', gain: 0.025 }); break;

  startMusic() {

      if (!this.ctx) return;

    setTimeout(tick, 1500);
  },
};

      b.type = 'button'; b.dataset.type = k;
      b.setAttribute('aria-label', T.name + ', ' + T.epithet + '. ' + T.cost + ' coppers. Key ' + (i + 1) + '.');
      b.title = T.name + ', ' + T.epithet + ': ' + T.role;
      b.innerHTML = '<div class="portrait"><img alt="" src="' + portraitURL(k, 1) + '"></div><kbd>' + (i + 1) + '</kbd>'
        + '<div class="nm">' + T.name + '</div>'
        + '<div class="cost">' + COIN + T.cost + '</div>';
      b.addEventListener('click', () => { AudioSys.init(); selectPlacing(k); });
      list.appendChild(b);
    });
  },
  refreshCompany() {
    for (const b of $('companyList').children) {
      const k = b.dataset.type;
      b.classList.toggle('active', G.placing === k);
      b.classList.toggle('poor', G.coppers < TOWERS[k].cost);
    }
  },

  renderInspector() {
    const box = $('inspector');
    const t = G.selected && G.towers.includes(G.selected) ? G.selected : null;
    const type = t ? t.type : G.placing;
    $('panel').classList.toggle('inspecting', !!t);
    this.sellArmT = 0;
    if (!type) {
      box.innerHTML = '<div class="empty">Choose a puppet from <b>the Company</b>, then press it to any lit square beside the road. Select a placed puppet to upgrade, re-block or strike it.'
        + '<br><br>Every shadow you send home earns coppers from the audience. Between scenes, you can spend them.</div>';
      return;
    }
    const T = TOWERS[type], tier = t ? t.tier : 1;
    const st = t ? t.st : previewStats(type, 1, null);
    const next = tier < 5 ? T.tiers[tier] : null;
    let html = '<div class="insp-head"><div class="portrait"><img alt="" src="' + portraitURL(type, tier) + '"></div>'
      + '<div style="min-width:0"><div class="insp-name">' + T.name + '</div><div class="insp-epi">' + T.epithet + ' · '
      + (t ? 'Tier ' + roman(tier) + ' of V · <span id="inspKills">' + t.kills + '</span> sent home' : T.cost + ' coppers · ' + T.role) + '</div></div>'
      + '<button class="close-x insp-close" data-act="close" type="button" aria-label="Close"><svg class="i"><use href="#i-close"/></svg></button></div>';
    if (!t) html += '<p class="insp-lore">' + T.lore + '</p>';
    html += '<div class="statrow">' + statTriple(type, st, t).map(s => '<div><b>' + s[1] + '</b><span>' + s[0] + '</span></div>').join('') + '</div>';
    html += '<ol class="ladder" aria-label="Upgrades">' + T.tiers.map((u, i) => {
      const cls = i < tier ? 'done' : i === tier ? 'next' : 'locked';
      const cost = i === tier ? ' <span style="white-space:nowrap">· ' + COIN_S + ' ' + u.cost + '</span>' : '';
      return '<li class="' + cls + '"><span class="pip">' + roman(i + 1) + '</span><div><div class="un">' + u.name + cost + '</div><div class="ud">' + u.text + '</div></div></li>';
    }).join('') + '</ol>';
    if (next) html += '<div class="ladder-desc"><b>' + next.name + ':</b> ' + next.text + '</div>';
    if (t) {
      const afford = next && G.coppers >= next.cost;
      html += '<div class="insp-actions">'
        + '<button class="btn" data-act="upgrade" type="button"' + (afford ? '' : ' disabled') + '>' + (next ? 'Upgrade · ' + next.cost : 'Fully restored') + '<span class="kbd">U</span></button>'
        + '<button class="btn ghost" data-act="sell" type="button">Strike · +' + sellValue(t) + '<span class="kbd">S</span></button>'
        + (G.phase === 'intermission' ? '<button class="btn ghost wide" data-act="move" type="button">Re-block: move it for free<span class="kbd">M</span></button>' : '')
        + '</div>';
      if (T.targets) {
        html += '<div class="aim-row"><span class="seg-label">Aim at</span><div class="seg" role="group" aria-label="Aim at">'
          + [['first', 'First'], ['last', 'Last'], ['strong', 'Strong'], ['near', 'Near']].map(([m, l]) => '<button type="button" data-act="aim:' + m + '" aria-pressed="' + (t.targeting === m) + '">' + l + '</button>').join('')
          + '</div></div>';
      }
    }
    box.innerHTML = html;
  },
  refreshInspectorState() {
    const t = G.selected;
    if (!t) return;
    const b = $('inspector').querySelector('[data-act="upgrade"]');
    if (b) b.disabled = t.tier >= 5 || G.coppers < upgradeCost(t);
  },
  onInspector(e) {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act, t = G.selected;
    if (act === 'close') { deselect(); return; }
    if (!t) return;
    if (act === 'upgrade') doUpgrade();
    else if (act === 'sell') {
      if (this.sellArmT > 0) doSell();
      else { this.sellArmT = 2.5; b.textContent = 'Really strike? +' + sellValue(t); b.classList.remove('ghost'); }
    } else if (act === 'move') beginMove();
    else if (act.startsWith('aim:')) { t.targeting = act.slice(4); sfx('tick'); this.renderInspector(); }
  },

  renderNext() {
    const box = $('nextScene');
    const ph = G.phase;
    if (ph === 'title') { box.hidden = true; return; }
    box.hidden = false;
    if (ph === 'intermission') {
      const n = G.scene + 1, sc = sceneDef(n);
      const label = n > SCENES.length ? 'Encore ' + roman(n - SCENES.length) : 'Scene ' + roman(n) + ' of ' + roman(SCENES.length);
      box.classList.remove('compact');
      box.innerHTML = '<div><div class="kicker">Next · ' + label + '</div><div class="title">' + sc.title + '</div><div class="dir">' + sc.dir + '</div></div>'
        + noteHTML(sc)
        + '<div class="cast" aria-label="Cast">' + castHTML(n) + '</div>'
        + '<button class="btn curtain-btn" id="btnCurtain" type="button"><svg aria-hidden="true"><use href="#i-curtain"/></svg>Raise the Curtain<span class="kbd">Space</span></button>';
    } else if (ph === 'scene') {
      const n = G.scene, sc = sceneDef(n);
      box.classList.add('compact');
      box.innerHTML = '<div><div class="kicker">Now playing · ' + sceneLabel(n) + '</div><div class="title">' + sc.title + '</div></div>'
        + '<div class="progress" aria-hidden="true"><i id="sceneProg"></i></div>'
        + '<button class="btn curtain-btn" type="button" disabled><span id="sceneLeft">The scene is playing</span></button>';
    } else if (ph === 'dawn' || (ph === 'over' && G.won)) {
      box.classList.add('compact');
      box.innerHTML = '<div><div class="kicker">The Long Night</div><div class="title">Dawn</div><div class="dir">Thin gold light through the paper.</div></div>';
    } else {
      box.classList.add('compact');
      box.innerHTML = '<div><div class="kicker">The Long Night</div><div class="title">The lamp is out</div><div class="dir">The screen is dark.</div></div>';
    }
  },

  updateSceneChip() {
    let num, ttl;
    if (G.phase === 'title') { num = 'Before the curtain'; ttl = 'The Long Night'; }
    else if (G.phase === 'intermission') { num = G.scene ? 'Intermission · after ' + sceneLabel(G.scene) : 'Before the curtain'; ttl = 'Next: ' + sceneDef(G.scene + 1).title; }
    else if (G.phase === 'scene') { num = sceneLabel(G.scene) + (G.scene <= SCENES.length ? ' of ' + roman(SCENES.length) : ''); ttl = sceneDef(G.scene).title; }
    else if (G.phase === 'dawn' || G.won) { num = 'The Long Night'; ttl = 'Dawn'; }
    else { num = 'The Long Night'; ttl = 'The lamp gutters'; }
    $('hudSceneNum').textContent = num;
    $('hudSceneTitle').textContent = ttl;
  },

  sync(dt) {
    const h = this.hud;
    if (h.lamp !== G.lamp) { $('hudLamp').textContent = G.lamp; h.lamp = G.lamp; }
    if (h.cop !== G.coppers) {
      $('hudCoppers').textContent = G.coppers;
      if (h.cop != null && G.coppers > h.cop && G.phase !== 'title') bump('hudCoinWrap', 'gain');
      h.cop = G.coppers;
      this.refreshCompany();
      this.refreshInspectorState();
    }
    const key = G.phase + ':' + G.scene + ':' + G.won;
    if (h.phase !== key) { h.phase = key; this.updateSceneChip(); this.renderNext(); this.renderInspector(); this.refreshCompany(); }
    if (G.phase === 'scene') {
      const prog = $('sceneProg'), left = $('sceneLeft');
      const remain = G.queue.length + G.enemies.length;
      if (prog) prog.style.width = (G.sceneTotal ? (100 * G.sceneSpawned / G.sceneTotal) : 0).toFixed(1) + '%';
      if (left && h.remain !== remain) { left.textContent = remain + (remain === 1 ? ' shadow' : ' shadows') + ' still loose'; h.remain = remain; }
    }
    let boss = null;
    for (const e of G.enemies) if (e.def.boss && e.alive) { boss = e; break; }
    const bb = $('bossBar');
    if (boss) {
      if (bb.hidden) bb.hidden = false;
      if (h.bossId !== boss.id) { $('bossName').textContent = boss.def.name; h.bossId = boss.id; }
      $('bossFill').style.transform = 'scaleX(' + clamp(boss.hp / boss.maxHp, 0, 1).toFixed(3) + ')';
    } else if (!bb.hidden) { bb.hidden = true; h.bossId = null; }
    const prog = G.phase === 'title' ? 0 : clamp((Math.min(G.scene, SCENES.length) - (G.phase === 'scene' ? 0.5 : 0)) / SCENES.length, 0, 1);
    const dawn = G.phase === 'dawn' || (G.phase === 'over' && G.won) || G.encore;
    const nk = prog.toFixed(3) + dawn;
    if (h.night !== nk) {
      h.night = nk;
      const a = Math.PI + prog * Math.PI;
      $('nightMoon').setAttribute('transform', 'translate(' + (42 + Math.cos(a) * 36).toFixed(1) + ',' + (29 + Math.sin(a) * 23).toFixed(1) + ')');
      $('nightMoon').style.opacity = dawn ? 0.15 : 1;
      $('nightSun').setAttribute('opacity', dawn ? 1 : 0.25);
    }
    const paused = G.paused && (G.phase === 'scene' || G.phase === 'intermission');
    if (h.paused !== paused) {
      h.paused = paused;
      $('pausedTag').hidden = !paused;
      $('btnPause').innerHTML = '<svg class="i"><use href="#i-' + (paused ? 'play' : 'pause') + '"/></svg>';
      $('btnPause').setAttribute('aria-label', paused ? 'Resume (P)' : 'Pause (P)');
    }
    if (this.toastT > 0 && (this.toastT -= dt) <= 0) $('toast').classList.remove('show');
    if (this.sellArmT > 0 && (this.sellArmT -= dt) <= 0) this.renderInspector();
    if (G.selected && h.kills !== G.selected.kills) { const k = $('inspKills'); if (k) k.textContent = G.selected.kills; h.kills = G.selected.kills; }
    const hint = this.currentHint();
    if (h.hint !== hint) { h.hint = hint; $('hint').textContent = hint; $('hint').classList.toggle('show', !!hint); }
  },
  currentHint() {
    if (G.phase !== 'scene' && G.phase !== 'intermission') return '';
    if (G.moving) return TOUCHY ? 'Tap a lit square twice to set ' + TOWERS[G.moving.type].name + ' down' : 'Click a lit square to set ' + TOWERS[G.moving.type].name + ' down · Esc cancels';
    if (G.placing) {
      const T = TOWERS[G.placing];
      if (G.coppers < T.cost) return T.name + ' needs ' + (T.cost - G.coppers) + ' more coppers';
      return TOUCHY ? 'Tap a lit square, then tap again to place ' + T.name : 'Click a lit square to place ' + T.name + ' · right-click or Esc cancels';
    }
    if (G.phase === 'intermission' && G.scene === 0 && !G.towers.length) return 'Choose a puppet from the Company to begin';
    return '';
  },
  toast(msg, warn) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('warn', !!warn);
    t.classList.add('show');
    this.toastT = 2.6;
  },
  intertitle(k, title, dur, small) {
    $('itK').textContent = k; $('itT').textContent = title;
    const it = $('intertitle');
    it.classList.toggle('small', !!small);
    it.classList.add('show');
    clearTimeout(this.itTimer);
    this.itTimer = setTimeout(() => it.classList.remove('show'), dur * 1000);
  },
  flashLamp() { bump('hudLampWrap', 'hurt'); },

  onPerformanceStart() {
    this.hud = {};
    this.renderInspector(); this.renderNext(); this.refreshCompany();
    this.intertitle('The Long Night of Umberfold', 'Place your puppets, then raise the curtain', 2.6, true);
  },
  onSceneStart(n) {
    this.intertitle(sceneLabel(n), sceneDef(n).title, 2.4);
  },
  onSceneEnd(n, bonus, flawless) {
    this.toast(sceneLabel(n) + ' ends · +' + bonus + ' coppers' + (flawless ? ' (a flawless scene)' : ''));
  },
  onDawn() { this.intertitle('Dawn', 'The first sunrise in forty days', 4.5); },
  onGutter() { this.intertitle('The lamp gutters', 'Old Sun is out', 3); },

  showEnd(won) {
    const s = G.stats;
    const mins = Math.max(1, Math.round((performance.now() - s.start) / 60000));
    const encoreRun = G.encore;
    $('endTitle').textContent = won ? 'Dawn' : encoreRun ? 'The Encore Ends' : 'The Lamp Gutters';
    $('endText').innerHTML = won
      ? 'The last shadow stops at the edge of the light. You would swear it bows. Then it is gone, and through the paper, thin and gold, comes the first sunrise in forty days.<br><br>In the front row, a moth settles on the empty chair.'
      : encoreRun
        ? 'Old Sun burns down at last, long after the sun came up. The audience goes home the long way, each of them trailing a shadow that knows exactly whose it is.'
        : 'Old Sun gutters. In the dark every shadow in Umberfold sits down to wait for morning, and not one of them remembers whose it is.<br><br>The prompt book is still open where you left it. The play can be performed again.';
    const reached = encoreRun ? sceneLabel(G.scene) : won ? 'All ' + SCENES.length : sceneLabel(G.scene);
    $('endStats').innerHTML = [
      [won ? 'Scenes' : 'Reached', reached],
      ['Sent home', s.home],
      ['Coppers earned', s.earned],
      ['Flame lost', s.lost],
      ['Puppets placed', s.placed],
      ['Minutes', mins],
    ].map(r => '<div><b>' + r[1] + '</b><span>' + r[0] + '</span></div>').join('');
    let acts = '';
    if (won) acts += '<button class="btn gilt" data-end="encore" type="button">Encore: keep the lamp lit</button>';
    acts += '<button class="btn" data-end="again" type="button">Perform again, same road</button>';
    acts += '<button class="btn ghost" data-end="new" type="button">A new night</button>';
    $('endActions').innerHTML = acts;
    setTimeout(() => { $('endScreen').classList.add('show'); const b = $('endActions').querySelector('button'); if (b) b.focus(); }, 300);
  },

  buildTitle() {
    $('prologue').innerHTML = PROLOGUE.map((p, i) => '<p' + (i === PROLOGUE.length - 1 ? ' class="last"' : '') + '>' + p + '</p>').join('');
    const tk = $('tickets');
    tk.innerHTML = '';
    for (const k of Object.keys(DIFFS)) {
      const D = DIFFS[k];
      const b = el('button', 'ticket');
      b.type = 'button'; b.setAttribute('role', 'radio'); b.dataset.diff = k;
      b.innerHTML = '<div class="adm">Admit one</div><div class="tn">' + D.name + '</div><div class="tb">' + D.blurb + '</div><div class="best">' + bestLabel(k) + '</div>';
      b.addEventListener('click', () => { this.titleDiff = k; store.set('diff', k); this.syncTickets(); AudioSys.init(); sfx('tick'); });
      tk.appendChild(b);
    }
    this.syncTickets();
    $('nightNo').textContent = G.seed;
    this.syncResume();
  },
  syncResume() {
    const r = savedRun(), b = $('btnResume');
    b.hidden = !r;
    if (r) {
      b.textContent = 'Resume · ' + DIFFS[r.diff].name + ', after ' + sceneLabel(r.scene);
      b.title = 'Night No. ' + r.seed + ', ' + r.lamp + ' flame left';
    }
  },
  syncTickets() {
    for (const b of $('tickets').children) {
      const on = b.dataset.diff === this.titleDiff;
      b.setAttribute('aria-checked', String(on));
      b.tabIndex = on ? 0 : -1;
    }
  },
  showTitle() {
    this.closeAll();
    for (const b of $('tickets').children) b.querySelector('.best').textContent = bestLabel(b.dataset.diff);
    $('nightNo').textContent = G.seed;
    this.syncResume();
    $('titleScreen').classList.add('show');
    this.hud = {};
    setTimeout(() => $('btnBegin').focus(), 50);
  },

  openMenu() {
    if (!['intermission', 'scene'].includes(G.phase)) return;
    this.pauseForModal();
    $('menuModal').classList.add('show');
    setTimeout(() => $('mResume').focus(), 30);
  },
  openBook(tab, fromTitle) {
    if (!fromTitle) this.pauseForModal();
    this.bookTab = tab || this.bookTab;
    this.renderBook();
    $('bookModal').classList.add('show');
    setTimeout(() => $('bookClose').focus(), 30);
  },
  pauseForModal() {
    if (G.phase === 'scene' || G.phase === 'intermission') { this.resumeAfterModal = !G.paused; G.paused = true; }
    else this.resumeAfterModal = false;
  },
  closeModal(id) {
    $(id).classList.remove('show');
    if (!this.anyModal() && this.resumeAfterModal) { G.paused = false; this.resumeAfterModal = false; }
  },
  closeAll() { for (const id of ['menuModal', 'bookModal', 'endScreen']) $(id).classList.remove('show'); },
  anyModal() { return ['menuModal', 'bookModal', 'endScreen', 'titleScreen'].some(id => $(id).classList.contains('show')); },

  renderBook() {
    for (const b of $('bookTabs').children) b.setAttribute('aria-selected', String(b.dataset.tab === this.bookTab));
    const body = $('bookBody');
    let html = '';
    switch (this.bookTab) {
      case 'night':
        html = PROLOGUE.map(p => '<p class="lore">' + p + '</p>').join('')
          + '<h4>How the play works</h4><ul class="how">'
          + '<li>Choose a puppet from <b>the Company</b> and press it to any lit square that isn\'t the road.</li>'
          + '<li>Loose shadows walk the road toward <b>Old Sun</b>, the lamp at the centre of the screen. Each one that arrives dims the flame. If the flame goes out, the play is over.</li>'
          + '<li>Every shadow you send home earns <b>coppers</b> from the audience, and a whole scene earns more. A scene where nothing reaches the lamp earns a little extra.</li>'
          + '<li>Each puppet has <b>four upgrades</b>. Between scenes you can also <b>re-block</b> (move) any puppet for free, and anything you bought since the last curtain refunds in full.</li>'
          + '<li>Glazed shadows shrug off small hits, the Faint can only be seen in light, and umbrellas shade their neighbours from light. Read the cast list before each scene.</li>'
          + '<li>Hold the screen through twenty-four scenes, until dawn.</li></ul>'
          + '<h4>Keys</h4><div class="keys">'
          + '<kbd>1 – 5</kbd><span>Choose a puppet</span><kbd>Space</kbd><span>Raise the curtain, or pause mid-scene</span>'
          + '<kbd>U</kbd><span>Upgrade the selected puppet</span><kbd>S</kbd><span>Strike (sell); press twice to confirm</span>'
          + '<kbd>M</kbd><span>Re-block (between scenes)</span><kbd>T</kbd><span>Cycle aim: first, last, strong, near</span>'
          + '<kbd>F</kbd><span>Cycle speed</span><kbd>P</kbd><span>Pause</span><kbd>N</kbd><span>Sound on or off</span><kbd>B</kbd><span>This book</span>'
          + '<kbd>Esc</kbd><span>Cancel or close</span></div>'
          + '<p style="margin-top:12px;color:#7a6040">This is night No. ' + G.seed + '. Add <code>?night=' + G.seed + '</code> to the address to perform on the same road again.</p>';
        break;
      case 'company':
        html = TOWER_ORDER.map(k => {
          const T = TOWERS[k];
          return '<div class="entry"><div class="portrait"><img alt="" src="' + portraitURL(k, 5) + '"></div><div>'
            + '<div class="en">' + T.name + '<small>' + T.epithet.toUpperCase() + ' · ' + T.cost + ' COPPERS</small></div>'
            + '<div class="ea lore">' + T.lore + '</div>'
            + '<div class="tiers">' + T.tiers.map((u, i) => '<div><b>' + roman(i + 1) + '. ' + u.name + '</b>' + (u.cost ? ' (' + u.cost + ')' : '') + ': ' + u.text + '</div>').join('') + '</div>'
            + '</div></div>';
        }).join('');
        break;
      case 'shadows':
        html = SHADOW_ORDER.map(k => {
          const S = SHADOWS[k], seen = G.seen.has(k);
          if (!seen) return '<div class="entry unseen"><div class="portrait"><img alt="" src="' + iconURL(k) + '"></div><div><div class="en">Not yet on the screen</div><div class="ea">You haven\'t met this shadow yet.</div></div></div>';
          return '<div class="entry"><div class="portrait"><img alt="" src="' + iconURL(k) + '"></div><div>'
            + '<div class="en">' + S.name + (S.boss ? '<small>SCENE BOSS</small>' : '') + '</div>'
            + '<div class="ea">' + S.ability + '</div><div class="ea lore">' + S.lore + '</div></div></div>';
        }).join('');
        break;
      case 'margins': {
        const upto = Math.max(G.furthest, Math.min(G.scene, SCENES.length));
        html = '<p class="lore">Notes in Orrin Moth\'s hand, found in the margins of the prompt book. More appear as the night goes on.</p><div class="note-list">';
        for (let i = 0; i < SCENES.length; i++) {
          const sc = SCENES[i];
          if (i < upto) {
            html += '<div class="n"><div class="s">Scene ' + roman(i + 1) + ' · ' + sc.title + '</div><div class="q">'
              + (sc.moth ? '<svg viewBox="0 0 40 28" style="width:40px;height:28px;fill:#7a2a1a" role="img" aria-label="A small drawing of a moth"><use href="#i-moth"/></svg>' : sc.note) + '</div></div>';
          }
        }
        if (upto < SCENES.length) html += '<p class="locked">' + (SCENES.length - upto) + ' more pages you haven\'t reached.</p>';
        html += '</div>';
        break;
      }
    }
    body.innerHTML = html;
    body.scrollTop = 0;
  },

  syncToggles() {
    $('tSound').setAttribute('aria-checked', String(AudioSys.sfxOn));
    $('tMusic').setAttribute('aria-checked', String(AudioSys.musicOn));
    $('tMotion').setAttribute('aria-checked', String(G.calm));
    $('tRanges').setAttribute('aria-checked', String(G.ranges));
  },
  syncSound() {
    $('btnSound').innerHTML = '<svg class="i"><use href="#i-' + (AudioSys.muted ? 'mute' : 'sound') + '"/></svg>';
    $('btnSound').setAttribute('aria-pressed', String(AudioSys.muted));
  },

  bind() {
    $('btnBegin').addEventListener('click', () => { AudioSys.init(); startPerformance(); });
    $('btnResume').addEventListener('click', () => {
      const r = savedRun();
      if (!r) { this.syncResume(); return; }
      AudioSys.init();
      UI.closeAll();
      $('titleScreen').classList.remove('show');
      resumeRun(r);
      setSpeed(1);
      this.hud = {};
      this.renderInspector(); this.renderNext(); this.refreshCompany();
      this.intertitle('The Long Night resumes', 'After ' + sceneLabel(G.scene) + ': ' + sceneDef(G.scene).title, 2.6, true);
      updateUrl();
    });
    $('btnReroll').addEventListener('click', () => {
      prepareNight(randomSeed());
      $('nightNo').textContent = G.seed;
      AudioSys.init(); sfx('tick');
    });
    $('btnHow').addEventListener('click', () => this.openBook('night', true));
    $('btnTitleBook').addEventListener('click', () => this.openBook('company', true));
    $('tickets').addEventListener('keydown', e => {
      const keys = Object.keys(DIFFS), i = keys.indexOf(this.titleDiff);
      let j = -1;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % keys.length;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i + keys.length - 1) % keys.length;
      if (j < 0) return;
      e.preventDefault();
      this.titleDiff = keys[j]; store.set('diff', keys[j]); this.syncTickets();
      $('tickets').children[j].focus();
    });
    $('btnPause').addEventListener('click', () => togglePause());
    document.querySelectorAll('.speed button').forEach(b => b.addEventListener('click', () => setSpeed(+b.dataset.speed)));
    $('btnSound').addEventListener('click', () => { AudioSys.init(); AudioSys.muted = !AudioSys.muted; AudioSys.apply(); this.syncSound(); });
    $('btnBook').addEventListener('click', () => this.openBook(null));
    $('btnMenu').addEventListener('click', () => this.openMenu());
    $('nextScene').addEventListener('click', e => { if (e.target.closest('#btnCurtain')) { AudioSys.init(); startScene(); } });
    $('inspector').addEventListener('click', e => this.onInspector(e));
    $('mResume').addEventListener('click', () => this.closeModal('menuModal'));
    $('mBook').addEventListener('click', () => { $('menuModal').classList.remove('show'); this.bookTab = 'night'; this.renderBook(); $('bookModal').classList.add('show'); setTimeout(() => $('bookClose').focus(), 30); });
    $('mRestart').addEventListener('click', () => { this.closeAll(); this.resumeAfterModal = false; startPerformance(G.diff); });
    $('mTitle').addEventListener('click', () => { this.resumeAfterModal = false; prepareNight(G.seed); this.showTitle(); });
    $('bookClose').addEventListener('click', () => this.closeModal('bookModal'));
    $('bookTabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { this.bookTab = b.dataset.tab; this.renderBook(); } });
    $('tSound').addEventListener('click', () => { AudioSys.init(); AudioSys.sfxOn = !AudioSys.sfxOn; AudioSys.apply(); this.syncToggles(); });
    $('tMusic').addEventListener('click', () => { AudioSys.init(); AudioSys.musicOn = !AudioSys.musicOn; AudioSys.apply(); this.syncToggles(); });
    $('tMotion').addEventListener('click', () => { G.calm = !G.calm; store.set('calm', G.calm); this.syncToggles(); });
    $('tRanges').addEventListener('click', () => { G.ranges = !G.ranges; store.set('ranges', G.ranges); this.syncToggles(); });
    for (const id of ['menuModal', 'bookModal']) $(id).addEventListener('pointerdown', e => { if (e.target.id === id) this.closeModal(id); });
    $('endActions').addEventListener('click', e => {
      const b = e.target.closest('[data-end]');
      if (!b) return;
      const act = b.dataset.end;
      $('endScreen').classList.remove('show');
      if (act === 'encore') startEncore();
      else if (act === 'again') startPerformance(G.diff);
      else { prepareNight(randomSeed()); this.showTitle(); }
    });

    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !G.moving) G.ghost = null; });
    canvas.addEventListener('contextmenu', e => { e.preventDefault(); cancelAll(); });
    window.addEventListener('keydown', onKey);
    if (window.ResizeObserver) new ResizeObserver(() => { view.dirty = true; }).observe($('pros'));
    window.addEventListener('resize', () => { view.dirty = true; });
    window.addEventListener('pagehide', () => { if (G.phase === 'intermission') saveRun(); });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && G.phase === 'scene' && !G.paused) { G.paused = true; this.toast('Paused while you were away'); }
    });
  },
};

function bestLabel(k) {
  const b = store.get('best.' + k, null);
  if (!b) return '';
  if (b.won) return b.encore ? 'Dawn reached · ' + b.encore + ' encore' + (b.encore === 1 ? '' : 's') : 'Dawn reached';
  return b.scene ? 'Best: Scene ' + roman(b.scene) : '';
}

function randomSeed() { return 1 + Math.floor(Math.random() * 99999); }

// ------------------------------------------------------------- actions
function startPerformance(diff) {
  UI.closeAll();
  $('titleScreen').classList.remove('show');
  beginPerformance(diff || UI.titleDiff);
  setSpeed(1);
  UI.onPerformanceStart();
  updateUrl();
}
function startEncore() {
  G.encore = true;
  G.won = false;
  G.phase = 'intermission';
  G.dawnT = 0;
  UI.hud = {};
  UI.toast('The audience refuses to leave. Keep the lamp lit.');
}
function updateUrl() {
  try { const u = new URL(location.href); u.searchParams.set('night', G.seed); history.replaceState(null, '', u); } catch (e) { /* file:// in some browsers */ }
}
function togglePause() {
  if (G.phase !== 'scene' && G.phase !== 'intermission') return;
  G.paused = !G.paused;
  sfx('tick');
}
function setSpeed(n) {
  G.speed = n;
  document.querySelectorAll('.speed button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.speed === n)));
}
function selectPlacing(type) {
  if (G.phase !== 'intermission' && G.phase !== 'scene') return;
  if (G.placing === type) { cancelAll(); return; }
  G.moving = null; G.selected = null; G.ghost = null;
  G.placing = type;
  sfx('tick');
  UI.refreshCompany(); UI.renderInspector();
}
function selectTower(t) {
  G.selected = t; G.placing = null; G.moving = null; G.ghost = null;
  sfx('tick');
  UI.refreshCompany(); UI.renderInspector();
}
function deselect() {
  if (!G.selected && !G.placing && !G.moving) return;
  G.selected = null; G.placing = null; G.moving = null; G.ghost = null;
  UI.refreshCompany(); UI.renderInspector();
}
function cancelAll() { deselect(); }
function doUpgrade() {
  const t = G.selected;
  if (!t) return;
  if (t.tier >= 5) { UI.toast(TOWERS[t.type].name + ' is fully restored.'); return; }
  if (!upgradePuppet(t)) { UI.toast('Need ' + (upgradeCost(t) - G.coppers) + ' more coppers.', true); sfx('nope'); return; }
  UI.renderInspector();
}
function doSell() {
  const t = G.selected;
  if (!t) return;
  sellPuppet(t);
  G.selected = null;
  UI.renderInspector(); UI.refreshCompany();
}
function beginMove() {
  const t = G.selected;
  if (!t || G.phase !== 'intermission') return;
  G.moving = t; G.placing = null; G.ghost = { cx: t.cx, cy: t.cy };
  sfx('tick');
  UI.renderInspector();
}

function eventCell(e) {
  const r = canvas.getBoundingClientRect();
  const p = toLogical(e.clientX - r.left, e.clientY - r.top);
  return { cx: Math.floor(p.x), cy: Math.floor(p.y) };
}
function onPointerMove(e) {
  if (G.phase !== 'scene' && G.phase !== 'intermission') return;
  const { cx, cy } = eventCell(e);
  const inside = inBoard(cx, cy);
  if ((G.placing || G.moving) && e.pointerType === 'mouse') G.ghost = inside ? { cx, cy } : null;
  const over = inside && G.towerAt[cy * COLS + cx];
  canvas.className = G.placing || G.moving ? 'placing' : over ? 'pointing' : '';
}
function onPointerDown(e) {
  if (e.button === 2) return;
  if (G.phase !== 'scene' && G.phase !== 'intermission') return;
  AudioSys.init();
  const { cx, cy } = eventCell(e);
  const inside = inBoard(cx, cy);
  const touch = e.pointerType !== 'mouse';
  const type = G.moving ? G.moving.type : G.placing;
  if (type) {
    if (!inside) { cancelAll(); return; }
    const tw = G.towerAt[cy * COLS + cx];
    if (tw && tw !== G.moving) { selectTower(tw); return; }
    if (touch && (!G.ghost || G.ghost.cx !== cx || G.ghost.cy !== cy)) { G.ghost = { cx, cy }; return; }
    G.ghost = { cx, cy };
    if (G.moving) {
      const t = G.moving;
      if (t.cx === cx && t.cy === cy) { G.moving = null; selectTower(t); return; }
      if (movePuppet(t, cx, cy)) { G.moving = null; selectTower(t); }
      else { UI.toast(G.cells[cy * COLS + cx] ? 'Puppets can\'t stand on the road.' : 'That square is taken.', true); sfx('nope'); }
      return;
    }
    const T = TOWERS[type];
    if (!canBuildAt(cx, cy)) { UI.toast(G.cells[cy * COLS + cx] ? 'Puppets can\'t stand on the road.' : 'That square is taken.', true); sfx('nope'); return; }
    if (G.coppers < T.cost) { UI.toast('Need ' + (T.cost - G.coppers) + ' more coppers for ' + T.name + '.', true); sfx('nope'); return; }
    const t = buildPuppet(type, cx, cy);
    if (t) {
      if (e.shiftKey && G.coppers >= T.cost) { G.ghost = null; UI.refreshCompany(); return; }
      // where the inspector is a sheet over the board, don't throw it up after every placement
      if (getComputedStyle($('inspector')).position === 'fixed') {
        G.placing = null; G.ghost = null;
        UI.refreshCompany(); UI.renderInspector();
        UI.toast(T.name + ' is on the screen. Tap ' + (t.type === 'heron' || t.type === 'lune' ? 'her' : 'him') + ' to upgrade.');
      } else selectTower(t);
    }
    return;
  }
  if (!inside) { deselect(); return; }
  const tw = G.towerAt[cy * COLS + cx];
  if (tw) selectTower(tw); else deselect();
}

function onKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) return;
  const k = e.key;
  if ($('titleScreen').classList.contains('show')) {
    if (k === 'Escape' && $('bookModal').classList.contains('show')) UI.closeModal('bookModal');
    return;
  }
  if (k === 'Escape') {
    if ($('bookModal').classList.contains('show')) { UI.closeModal('bookModal'); return; }
    if ($('menuModal').classList.contains('show')) { UI.closeModal('menuModal'); return; }
    if (G.placing || G.moving || G.selected) { cancelAll(); return; }
    UI.openMenu();
    return;
  }
  if (UI.anyModal()) return;
  const lower = k.length === 1 ? k.toLowerCase() : k;
  if (k === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (G.phase === 'intermission') { AudioSys.init(); startScene(); }
    else togglePause();
    return;
  }
  if (lower >= '1' && lower <= '5') { AudioSys.init(); selectPlacing(TOWER_ORDER[+lower - 1]); return; }
  switch (lower) {
    case 'u': doUpgrade(); break;
    case 's': case 'Delete': case 'Backspace':
      if (!G.selected) break;
      if (UI.sellArmT > 0) doSell();
      else { UI.sellArmT = 2.5; UI.toast('Press S again to strike ' + TOWERS[G.selected.type].name + ' for ' + sellValue(G.selected) + ' coppers.'); }
      break;
    case 'm':
      if (G.selected && G.phase !== 'intermission') UI.toast('Puppets can only be re-blocked between scenes.');
      else beginMove();
      break;
    case 't':
      if (G.selected && TOWERS[G.selected.type].targets) {
        const modes = ['first', 'last', 'strong', 'near'];
        G.selected.targeting = modes[(modes.indexOf(G.selected.targeting) + 1) % 4];
        UI.renderInspector(); UI.toast('Aiming at: ' + G.selected.targeting);
      }
      break;
    case 'f': setSpeed(G.speed % 3 + 1); break;
    case 'p': togglePause(); break;
    case 'n': AudioSys.init(); AudioSys.muted = !AudioSys.muted; AudioSys.apply(); UI.syncSound(); break;
    case 'b': UI.openBook(null); break;
  }
}

// ================================================================ loop
let lastNow = null, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (lastNow === null) lastNow = now;
  const dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000));
  lastNow = now;
  G.real += dt;
  const live = G.phase === 'scene' || G.phase === 'intermission';
  if (!(G.paused && live)) {
    acc += dt * (G.phase === 'scene' ? G.speed : 1);
    let n = 0;
    while (acc >= STEP && n < 12) { step(STEP); acc -= STEP; n++; }
    if (n >= 12) acc = 0;
  }
  realTimers(dt);
  render();
  UI.sync(dt);
}
function realTimers(dt) {
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 2.5);
  if (G.dimPulse > 0) G.dimPulse = Math.max(0, G.dimPulse - dt * 1.6);
  for (const s of view.seats) { if (s.hop > 0) s.hop -= dt; if (s.gasp > 0) s.gasp -= dt; }
  if (G.phase === 'dawn') { G.dawnT += dt; if (G.dawnT > 5.2) finish(true); }
  else if (G.phase === 'over' && G.won) G.dawnT += dt;
  if (G.phase === 'gutter') { G.gutterT += dt; if (G.gutterT > 3) finish(false); }
}

// ======================================================= test harness
// A small handle for headless checks: deterministic stepping without rAF.
window.__umbra = {
  G, view, TOWERS, SHADOWS, SCENES, DIFFS,
  step(sec) { const n = Math.round(sec / STEP); for (let i = 0; i < n; i++) step(STEP); return G.phase; },
  begin(diff, seed) { if (seed) prepareNight(seed); startPerformance(diff || 'evening'); return G.road.cells.length; },
  startScene, build: buildPuppet, upgrade: upgradePuppet, sell: sellPuppet, move: movePuppet, spawn: spawnShadow,
  canBuildAt, render, layout: () => { view.dirty = true; return layout(); },
  road() { return { cells: G.road.cells.map(c => c.slice()), L: G.road.L, entry: G.road.entry }; },
  generateRoad,
};

// ================================================================ boot
(function boot() {
  let seed = 0;
  try { seed = parseInt(new URLSearchParams(location.search).get('night'), 10); } catch (e) { seed = 0; }
  if (!(seed > 0)) seed = randomSeed();
  prepareNight(seed);
  UI.init();
  layout();
  requestAnimationFrame(frame);
})();
})();
</script>
</body>
