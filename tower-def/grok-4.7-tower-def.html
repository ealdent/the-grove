<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140c10">
<title>Iris Well</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23140c10'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e2b657' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%237d5cff'/%3E%3C/svg%3E">
<style>
  :root {
    --lacquer: #140c10;
    --panel: #23151b;
    --panel-2: #2e1c24;
    --line: rgba(226, 182, 87, 0.5);
    --gold: #e2b657;
    --gold-2: #f6dd9d;
    --cream: #f6efe2;
    --ink: #24160f;
    --muted: #cbbba6;
    --vermilion: #d4534a;
    --cobalt: #3d62c8;
    --iris: #7d5cff;
    --viridian: #1f8a6e;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1000px 420px at 8% -10%, rgba(226, 182, 87, 0.09), transparent 50%),
      radial-gradient(800px 520px at 110% 110%, rgba(125, 92, 255, 0.14), transparent 46%),
      var(--lacquer);
    color: var(--cream);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--gold); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }

  .app {
    height: 100dvh;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 348px);
    grid-template-rows: auto minmax(0, 1fr);
    gap: 10px 12px;
    padding:
      max(10px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }

  .topbar {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 18px;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
  .back {
    color: var(--gold);
    text-decoration: none;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-size: 0.68rem;
    width: max-content;
  }
  .back:hover { color: var(--gold-2); }
  .eyebrow {
    margin: 6px 0 0;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 0.64rem;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: 1.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .docket { min-width: min(100%, 220px); }
  .docket-row, .hue-row { display: flex; align-items: center; gap: 8px; }
  .docket-row { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .hue-row strong { font-family: var(--serif); font-weight: 500; font-size: 1.15rem; }
  .hue-dot {
    width: 12px; height: 12px; border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
    background: #888;
    flex: 0 0 auto;
  }
  .pips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; max-width: 250px; }
  .pip {
    width: 8px; height: 8px; border-radius: 1px;
    background: rgba(246, 239, 226, 0.14);
  }
  .pip.now { box-shadow: 0 0 0 1px var(--gold); }

  .meters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .meter {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(226, 182, 87, 0.28);
    border-radius: 10px;
    padding: 6px 10px 7px;
    min-width: 84px;
  }
  .meter span { display: block; color: var(--muted); font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; }
  .meter b { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
  .meter i { display: block; height: 3px; margin-top: 4px; border-radius: 99px; background: var(--viridian); width: 100%; }

  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .tools button, .ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--gold-2);
    border-radius: 999px;
    min-height: 40px;
    padding: 0 12px;
    letter-spacing: 0.06em;
  }
  .tools button:hover, .ghost:hover { background: rgba(226, 182, 87, 0.1); }
  .tools button[aria-pressed="true"] { background: rgba(226, 182, 87, 0.16); color: white; }

  .stage-shell { min-height: 0; position: relative; display: flex; flex-direction: column; gap: 8px; }
  .statusline {
    flex: 0 0 auto;
    font-family: var(--serif);
    font-style: italic;
    color: var(--gold-2);
    font-size: 0.95rem;
    min-height: 1.3em;
  }
  #stage {
    flex: 1;
    min-height: 0;
    overflow: auto;
    border-radius: 16px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.04), transparent 28%),
      #1a1014;
    box-shadow: inset 0 0 0 1px var(--line), inset 0 0 0 7px rgba(226, 182, 87, 0.06), 0 18px 40px rgba(0,0,0,0.28);
  }
  .board-wrap {
    min-width: 100%;
    min-height: 100%;
    width: max-content;
    height: max-content;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }
  canvas { display: block; border-radius: 10px; touch-action: manipulation; }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    background: rgba(20, 12, 16, 0.9);
    border: 1px solid var(--line);
    color: var(--cream);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.85rem;
    pointer-events: none;
    z-index: 3;
    max-width: min(92%, 440px);
    text-align: center;
  }
  .toast[hidden] { display: none !important; }

  .bench {
    min-height: 0;
    overflow: auto;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 80px), var(--panel);
    border: 1px solid rgba(226, 182, 87, 0.32);
    border-radius: 16px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.22);
  }
  .bench-head h2 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: 1.25rem;
    letter-spacing: 0.04em;
  }
  .bench-head p { margin: 2px 0 0; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }

  .shop { display: flex; flex-direction: column; gap: 6px; }
  .card {
    text-align: left;
    background: #1a1014;
    border: 1px solid rgba(226, 182, 87, 0.28);
    border-radius: 12px;
    padding: 8px 10px 8px 12px;
    display: grid;
    grid-template-columns: 8px 1fr auto;
    column-gap: 8px;
    row-gap: 1px;
    align-items: center;
    position: relative;
  }
  .card .bar { width: 8px; height: 100%; min-height: 28px; border-radius: 99px; grid-row: 1 / span 2; }
  .card .nm { font-family: var(--serif); font-size: 0.98rem; }
  .card .cost { font-variant-numeric: tabular-nums; color: var(--gold-2); }
  .card .role { grid-column: 2 / -1; color: var(--muted); font-size: 0.75rem; }
  .card.armed { border-color: var(--accent, var(--gold)); box-shadow: inset 0 0 0 1px var(--accent, var(--gold)); }
  .card.broke { opacity: 0.55; }
  .card:hover { background: #24161c; }

  .note {
    margin: 0;
    padding: 0 2px 0 10px;
    border-left: 2px solid rgba(226, 182, 87, 0.7);
    font-family: var(--serif);
    font-style: italic;
    color: #f3e6cf;
    font-size: 0.92rem;
  }
  .note cite { display: block; margin-top: 4px; font-style: normal; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.66rem; color: var(--gold); font-family: var(--sans); }

  .detail {
    background: rgba(0,0,0,0.18);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .detail h3 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 1.05rem; }
  .detail p { margin: 0; color: var(--muted); font-size: 0.84rem; }
  .stats { color: var(--cream); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .modes { display: flex; flex-wrap: wrap; gap: 4px; }
  .modes button, .upgrade, .sell {
    border-radius: 999px;
    min-height: 36px;
    padding: 0 10px;
    border: 1px solid rgba(226, 182, 87, 0.35);
    background: transparent;
    color: var(--cream);
    font-size: 0.78rem;
  }
  .modes button[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .upgrade {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
    font-family: var(--serif);
    font-size: 0.92rem;
    min-height: 42px;
    text-align: left;
  }
  .upgrade:disabled, .sell:disabled, .go:disabled { opacity: 0.45; cursor: default; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .sell { color: var(--gold-2); }

  .go {
    margin-top: auto;
    position: sticky;
    bottom: 0;
    border: none;
    border-radius: 999px;
    min-height: 50px;
    padding: 12px 16px;
    background: radial-gradient(circle at 35% 30%, #ee7b70, #a3322c 72%);
    color: #fff8f2;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: var(--serif);
    font-size: 0.98rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 10px 24px rgba(160, 40, 30, 0.28);
  }
  .go:hover:not(:disabled) { filter: brightness(1.05); }
  .go.ready { animation: seal 2.4s ease-in-out infinite; }
  @keyframes seal {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1px); }
  }
  .hint, .seedline { margin: 0; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.04em; }
  .seedline { font-variant-numeric: tabular-nums; }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(10, 6, 8, 0.72);
    display: grid;
    place-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .modal[hidden] { display: none !important; }
  .paper {
    width: min(680px, 100%);
    max-height: min(88dvh, 860px);
    overflow: auto;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.45), transparent 90px),
      #f3e7d2;
    color: var(--ink);
    border-radius: 8px 18px 12px 18px;
    padding: 26px 24px 22px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(80, 50, 20, 0.15);
  }
  .paper h2 { font-family: var(--serif); font-weight: 500; font-size: 2rem; margin: 0 0 6px; letter-spacing: 0.04em; }
  .paper h3 { font-family: var(--serif); font-weight: 500; margin: 1.1rem 0 0.3rem; }
  .paper p { margin: 0.45rem 0; }
  .paper .kicker { letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.72rem; color: #8a5a28; margin: 0; }
  .rules { padding-left: 1.1rem; margin: 0.6rem 0 1rem; }
  .rules li { margin: 0.25rem 0; }
  .paper button.primary, .paper button.secondary {
    border-radius: 999px;
    min-height: 46px;
    padding: 0 16px;
    margin: 8px 8px 0 0;
  }
  .paper button.primary { background: #9d342e; color: #fff8f2; border: none; letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--serif); }
  .paper button.secondary { background: transparent; border: 1px solid rgba(36, 22, 15, 0.35); color: var(--ink); }
  .paper details { margin-top: 10px; }
  .paper summary { cursor: pointer; color: #8a5a28; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.75rem; }
  .entry { border-top: 1px solid rgba(36, 22, 15, 0.12); padding: 8px 0; }
  .entry b { font-family: var(--serif); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border-radius: 999px; padding: 3px 8px; font-size: 0.75rem; background: rgba(255,255,255,0.45); }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); border: 0;
  }

  @media (max-width: 980px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(180px, 40dvh) minmax(240px, 1fr);
    }
    h1 { font-size: 1.25rem; letter-spacing: 0.12em; }
    .shop { flex-direction: row; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
    .card { min-width: 190px; scroll-snap-align: start; }
    .go { position: sticky; }
  }
  @media (max-width: 640px) {
    .docket { flex: 1 1 100%; }
    .meter { min-width: 72px; }
    .tools button { padding: 0 10px; }
    .paper { padding: 18px 14px; }
    .paper h2 { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .go.ready { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <a class="back" href="index.html">← Missions</a>
      <p class="eyebrow">Pellucid Municipal Works</p>
      <h1>Iris Well</h1>
    </div>
    <div class="docket">
      <div class="docket-row"><span id="watch">First watch</span><span id="docketNum">Docket 1 / 24</span></div>
      <div class="hue-row"><span id="hueDot" class="hue-dot"></span><strong id="hueName">Ledger Gray</strong></div>
      <div id="pips" class="pips" aria-hidden="true"></div>
    </div>
    <div class="meters">
      <div class="meter"><span>Pigment</span><b id="goldNum">0</b></div>
      <div class="meter"><span>Hues</span><b id="lifeNum">20</b><i id="lifeBar"></i></div>
      <div class="tools">
        <button type="button" id="speedBtn" aria-label="Cycle speed">1×</button>
        <button type="button" id="pauseBtn">Hold</button>
        <button type="button" id="muteBtn" aria-pressed="false">Sound</button>
        <button type="button" id="ledgerBtn">Ledger</button>
        <button type="button" id="nightBtn">New night</button>
      </div>
    </div>
  </header>

  <div class="stage-shell">
    <div id="statusline" class="statusline"></div>
    <div id="stage">
      <div class="board-wrap">
        <canvas id="board" width="960" height="600" aria-label="Stillroom floor. The glass pipes are the only road."></canvas>
      </div>
    </div>
    <div id="toast" class="toast" hidden></div>
  </div>

  <aside class="bench">
    <div class="bench-head">
      <h2>The Bench</h2>
      <p>Night apprentice · Lumen Vetch</p>
    </div>
    <div id="shop" class="shop"></div>
    <blockquote class="note" id="note"></blockquote>
    <div id="detail" class="detail"></div>
    <button type="button" id="startBtn" class="go">Open the mains</button>
    <p class="hint">Keys: 1–5 arm an instrument, U tunes it, Space opens the mains, Esc lowers your hand.</p>
    <p class="seedline" id="seedLine"></p>
  </aside>
</div>
<div id="modal" class="modal" hidden>
  <div class="paper" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="color:#f6efe2;padding:24px">Iris Well keeps all of its machinery inside this page, and it needs JavaScript to open the mains.</p></noscript>
<script>
'use strict';

const COLS = 16;
const ROWS = 10;
const STEP = 1 / 60;
const TOWER_ORDER = ['quill', 'bell', 'loom', 'fan', 'siphon'];

const TOWERS = {

  },

    ]
  },
  fan: {
    id: 'fan', name: 'Prism Fan', cost: 135, hotkey: '4', accent: '#7d5cff',

  },
  siphon: {
    id: 'siphon', name: 'Well Siphon', cost: 185, hotkey: '5', accent: '#1f8a6e',
    role: 'A heavy cup of the Well. Later it makes the neighboring instruments braver.',
    flavor: 'Rude to everyone nearby, which the nearby instruments appreciate.',

      { name: 'Brass Cup', cost: 0, range: 3.2, rate: 1.7, damage: 54, splash: 0.65, desc: 'A slow glob of living color.' },

    ]
  }
};

function hasDom() { return typeof document !== 'undefined'; }

function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function keyOf(c, r) { return c + ',' + r; }

function generateOrganic(rng) {
  const start = { c: 0, r: 1 + Math.floor(rng() * (ROWS - 2)) };
  const goal = { c: COLS - 1, r: 1 + Math.floor(rng() * (ROWS - 2)) };
  const path = [start];
  const used = new Set([keyOf(start.c, start.r)]);
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  let guard = 0;
  while (guard++ < 6000) {
    const cur = path[path.length - 1];
    if (cur.c === goal.c && cur.r === goal.r && path.length >= 34) return path.map(p => ({ c: p.c, r: p.r }));
    const opts = [];
    for (const [dc, dr] of dirs) {
      const nc = cur.c + dc, nr = cur.r + dr;
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      if (used.has(keyOf(nc, nr))) continue;
      let touch = 0;
      for (const [ac, ar] of dirs) {
        const tc = nc + ac, tr = nr + ar;
        if (tc === cur.c && tr === cur.r) continue;
        if (tc < 0 || tr < 0 || tc >= COLS || tr >= ROWS) continue;
        if (used.has(keyOf(tc, tr))) touch++;
      }
      if (touch > 0) continue;
      const before = Math.abs(goal.c - cur.c) + Math.abs(goal.r - cur.r);
      const after = Math.abs(goal.c - nc) + Math.abs(goal.r - nr);
      const toward = before - after;
      const wander = path.length < 40 ? 1 : 0.25;
      const weight = rng() * wander + toward * (path.length > 42 ? 1.4 : 0.2) + (nc > cur.c ? 0.15 : 0);
      opts.push({ c: nc, r: nr, weight });
    }
    if (!opts.length) {
      if (path.length <= 1) return null;
      const dead = path.pop();
      used.delete(keyOf(dead.c, dead.r));
      continue;
    }
    opts.sort((a, b) => b.weight - a.weight);
    const span = path.length > 46 ? 1 : Math.min(opts.length, 3);
    const pick = opts[Math.floor(rng() * span)];
    path.push(pick);
    used.add(keyOf(pick.c, pick.r));
  }
  return null;
}

function serpentine(rng) {
  const lanes = [];
  let r = rng() < 0.5 ? 0 : 1;
  while (r < ROWS) {
    lanes.push(r);
    r += rng() < 0.65 ? 2 : 3;
  }
  if (lanes.length < 3) {
    lanes.length = 0;
    const offset = rng() < 0.5 ? 0 : 1;
    for (let i = offset; i < ROWS; i += 2) lanes.push(i);
  }
  if (lanes.length % 2 === 0) {
    const last = lanes[lanes.length - 1];
    if (last + 2 < ROWS) lanes.push(last + 2);
    else if (lanes.length > 3) lanes.pop();
  }
  const path = [];
  const used = new Set();
  const add = (c, row) => {
    const k = keyOf(c, row);
    if (used.has(k) || c < 0 || row < 0 || c >= COLS || row >= ROWS) return;
    used.add(k);
    path.push({ c, r: row });
  };
  let dir = 1;
  for (let i = 0; i < lanes.length; i++) {
    const row = lanes[i];
    if (dir === 1) for (let c = 0; c < COLS; c++) add(c, row);
    else for (let c = COLS - 1; c >= 0; c--) add(c, row);
    if (i < lanes.length - 1) {
      const next = lanes[i + 1];
      const turnC = dir === 1 ? COLS - 1 : 0;
      const step = next > row ? 1 : -1;
      for (let rr = row + step; rr !== next; rr += step) add(turnC, rr);
      dir *= -1;
    }
  }
  return path;
}

function fixedSnake() {
  const path = [];
  const lanes = [0, 2, 4, 6, 8];
  let dir = 1;
  for (let i = 0; i < lanes.length; i++) {
    const row = lanes[i];
    if (dir === 1) for (let c = 0; c < COLS; c++) path.push({ c, r: row });
    else for (let c = COLS - 1; c >= 0; c--) path.push({ c, r: row });
    if (i < lanes.length - 1) {
      path.push({ c: dir === 1 ? COLS - 1 : 0, r: row + 1 });
      dir *= -1;
    }
  }
  return path;
}

function validPath(path) {
  if (!path || path.length < 28) return false;
  const seen = new Set();
  for (let i = 0; i < path.length; i++) {
    const p = path[i];
    if (p.c < 0 || p.r < 0 || p.c >= COLS || p.r >= ROWS) return false;
    const k = keyOf(p.c, p.r);
    if (seen.has(k)) return false;
    seen.add(k);
    if (i > 0) {
      const q = path[i - 1];
      if (Math.abs(q.c - p.c) + Math.abs(q.r - p.r) !== 1) return false;
    }
  }
  return true;
}

function generateMap(rng) {
  for (let i = 0; i < 48; i++) {
    const path = generateOrganic(rng);
    if (validPath(path)) return path;
  }
  const snake = serpentine(rng);
  if (validPath(snake)) return snake;
  return fixedSnake();
}

function buildMetrics(path) {
  const pts = path.map(p => ({ x: p.c + 0.5, y: p.r + 0.5 }));
  const segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const x1 = pts[i - 1].x, y1 = pts[i - 1].y, x2 = pts[i].x, y2 = pts[i].y;
    const len = Math.hypot(x2 - x1, y2 - y1);
    segs.push({ x1, y1, x2, y2, len, start: total, end: total + len, angle: Math.atan2(y2 - y1, x2 - x1) });
    total += len;
  }
  return { pts, segs, total };
}

function pointAt(dist) {
  const segs = state.metrics.segs;
  if (!segs.length) return { x: 0.5, y: 0.5, angle: 0 };
  if (dist <= 0) return { x: segs[0].x1, y: segs[0].y1, angle: segs[0].angle };
  if (dist >= state.metrics.total) {
    const last = segs[segs.length - 1];
    return { x: last.x2, y: last.y2, angle: last.angle };
  }
  let lo = 0, hi = segs.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (segs[mid].end < dist) lo = mid + 1;
    else hi = mid;
  }
  const s = segs[lo];
  const t = (dist - s.start) / (s.len || 1);
  return { x: s.x1 + (s.x2 - s.x1) * t, y: s.y1 + (s.y2 - s.y1) * t, angle: s.angle };
}

function cachePositions() {
  for (const e of state.enemies) {
    const p = pointAt(e.dist);
    e.x = p.x; e.y = p.y; e.angle = p.angle;
  }
}

function activeWave() {
  return WAVES[Math.max(0, Math.min(WAVES.length - 1, state.waveIndex))];
}

function liveColor(wave) {
  if (!wave) return { h: 30, s: 20, l: 60 };
  if (wave.name === "Iride's Window") {
    return { h: (wave.color.h + Math.sin(state.time * 0.45) * 22 + 360) % 360, s: 52, l: wave.color.l };
  }
  return wave.color;
}

function cssColor(c, alpha) {
  const a = alpha == null ? 1 : alpha;
  return `hsla(${c.h}, ${c.s}%, ${c.l}%, ${a})`;
}

function watchName(i) {
  if (i < 6) return 'First watch';
  if (i < 12) return 'Second watch';
  if (i < 18) return 'Third watch';
  if (i < 23) return 'The small hours';
  return 'Almost dawn';
}

function selectedTower() {
  return state.towers.find(t => t.id === state.selectedId) || null;
}

function canBuild() {
  return state.phase === 'build' || state.phase === 'combat';
}

function canPlace(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return false;
  if (state.pathSet.has(keyOf(c, r))) return false;
  if (state.towers.some(t => t.c === c && t.r === r)) return false;
  return true;
}

function statsOf(tower) {
  return TOWERS[tower.kind].levels[tower.level];
}

function allyAura(tower) {
  let bonus = 0;
  for (const other of state.towers) {
    if (other.id === tower.id) continue;
    const st = statsOf(other);
    if (!st.aura) continue;
    if (Math.hypot(other.c - tower.c, other.r - tower.r) <= st.auraRange) bonus += st.aura;
  }
  return Math.min(0.5, bonus);
}

function auditorPenalty(tower) {
  let n = 0;
  const x = tower.c + 0.5, y = tower.r + 0.5;
  for (const e of state.enemies) {
    if (e.dead || !ENEMIES[e.type].aura) continue;
    if (Math.hypot(e.x - x, e.y - y) <= ENEMIES[e.type].aura) n++;
  }
  return Math.min(0.42, n * 0.12);
}

function damageMul(tower) {
  return (1 + allyAura(tower)) * (1 - auditorPenalty(tower));
}

function pickTarget(tower, range, excludeId) {
  const x = tower.c + 0.5, y = tower.r + 0.5;
  const list = state.enemies.filter(e => !e.dead && e.id !== excludeId && Math.hypot(e.x - x, e.y - y) <= range);
  if (!list.length) return null;
  const mode = tower.targetMode || 'first';
  if (mode === 'first') list.sort((a, b) => b.dist - a.dist);
  else if (mode === 'last') list.sort((a, b) => a.dist - b.dist);
  else if (mode === 'strong') list.sort((a, b) => b.hp - a.hp);
  else list.sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y));
  return list[0];
}

function newGame(seed, intro) {
  const muted = !!state.muted;
  const speed = state.speed || 1;
  state.seed = seed >>> 0;
  state.muted = muted;
  state.speed = speed;
  state.phase = intro ? 'intro' : 'build';
  state.paused = false;
  state.waveIndex = 0;
  state.gold = 155;
  state.confirmEmpty = false;
  state.resumeAt = 0;
  state.lives = 20;
  state.maxLives = 20;
  state.towers = [];
  state.enemies = [];
  state.shots = [];
  state.fx = [];
  state.floaters = [];
  const rng = makeRng(state.seed);
  state.path = generateMap(rng);
  state.pathSet = new Set(state.path.map(p => keyOf(p.c, p.r)));
  state.metrics = buildMetrics(state.path);
  state.backdrop = null;
  state.selectedId = null;
  state.armed = 'quill';
  state.hover = null;
  state.spawn = null;
  state.currentWave = null;
  state.cleared = [];
  state.kills = 0;
  state.acc = 0;
  state.shake = 0;
  state.wellFlash = 0;
  state.nextId = 1;
  state.ended = false;
  state.detailKey = '';
  if (hasDom()) {
    syncAll();
    if (intro) openIntro();
    else closeSheet();
  }
}

function startWave() {
  if (state.phase !== 'build') return;
  if (typeof performance !== 'undefined' && performance.now() < (state.resumeAt || 0)) return;
  if (!state.towers.length && hasDom() && !state.confirmEmpty) {
    state.confirmEmpty = true;
    toast('The plaster is still empty. Open again if you mean to.');
    return;
  }
  state.confirmEmpty = false;
  const wave = WAVES[state.waveIndex];
  state.currentWave = wave;
  state.phase = 'combat';
  state.paused = false;
  state.spawn = {
    wave,
    groups: wave.groups.map(g => ({ type: g.type, count: g.count, interval: g.interval, spawned: 0 })),
    gi: 0,
    timer: 0.7,
    done: false
  };
  announce(wave.name + ' is on the glass.');
  toast(wave.name);
  sfx('open');
  if (hasDom()) {
    const start = document.getElementById('startBtn');
    if (start) start.blur();
  }
  syncAll();
}

function spawnEnemy(type, wave, opts) {
  opts = opts || {};
  const def = ENEMIES[type];
  let hp = def.hp * (wave.hpMul || 1);
  if (opts.hp != null) hp = opts.hp;
  else if (type === 'seal' && wave.bossHp) hp = wave.bossHp;
  const e = {
    id: state.nextId++,
    type,
    hp,
    maxHp: hp,
    dist: Math.max(0, opts.dist || 0),
    slow: 0,
    slowT: 0,
    freezeT: 0,
    dot: 0,
    dotT: 0,
    gilt: 0,
    saturation: 0,
    shell: !!def.shell,
    dead: false,
    hue: wave.color.h,
    summonT: def.summon ? 6 : 0,
    hitFlash: 0,
    noSplit: !!opts.noSplit,
    rewarded: false
  };
  const p = pointAt(e.dist);
  e.x = p.x; e.y = p.y; e.angle = p.angle;
  state.enemies.push(e);
  return e;
}

function updateSpawn(dt) {
  const sp = state.spawn;
  if (!sp || sp.done || state.phase !== 'combat') return;
  sp.timer -= dt;
  if (sp.timer > 0) return;
  const g = sp.groups[sp.gi];
  spawnEnemy(g.type, sp.wave);
  g.spawned++;
  if (g.spawned >= g.count) {
    sp.gi++;
    if (sp.gi >= sp.groups.length) {
      sp.done = true;
      return;
    }
    sp.timer = 1.15;
  } else sp.timer = g.interval;
}

function floater(x, y, text, color) {
  state.floaters.push({ x, y, text, color, life: 0.95, max: 0.95 });
  if (state.floaters.length > 40) state.floaters.shift();
}

function burst(x, y, hue, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 0.35 + Math.random() * 1.5;
    state.fx.push({
      kind: 'dot', x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 0.2,
      life: 0.4 + Math.random() * 0.35,
      max: 0.75,
      hue,
      r: 0.035 + Math.random() * 0.05
    });
  }
  if (state.fx.length > 240) state.fx.splice(0, state.fx.length - 240);
}

function onKill(e) {
  if (e.rewarded) return;
  e.rewarded = true;
  e.dead = true;
  const def = ENEMIES[e.type];
  const bounty = def.bounty + (e.gilt || 0);
  state.gold += bounty;
  state.kills++;
  floater(e.x || 0, e.y || 0, '+' + bounty, '#e2b657');
  burst(e.x || 0, e.y || 0, e.hue, def.boss ? 18 : 8);
  sfx('pop');
  if (def.split && !e.noSplit && state.currentWave && state.phase === 'combat') {
    const hp = Math.max(10, e.maxHp * 0.42);
    spawnEnemy('smudge', state.currentWave, { hp, dist: Math.max(0, e.dist - 0.22), noSplit: true });
    spawnEnemy('smudge', state.currentWave, { hp, dist: Math.max(0, e.dist - 0.5), noSplit: true });
  }
  syncMoney();
}

function hurt(e, raw, opts) {
  if (!e || e.dead) return;
  opts = opts || {};
  const def = ENEMIES[e.type];
  let armor = def.armor || 0;
  if (def.shell && !e.shell) armor = 0.1;
  if (opts.ignoreArmor) armor = 0;
  const dmg = Math.max(0, raw) * (1 - armor);
  if (dmg <= 0) return;
  e.hp -= dmg;
  e.saturation = Math.min(1, e.saturation + dmg / e.maxHp);
  e.hitFlash = 0.1;
  if (!opts.dot && dmg >= 8) floater(e.x, e.y - 0.15, String(Math.round(dmg)), '#fff8ef');
  if (e.hp <= 0) onKill(e);
}

function leakEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  if (state.phase === 'lost' || state.phase === 'won') return;
  const def = ENEMIES[e.type];
  state.lives = Math.max(0, state.lives - def.leak);
  if (def.steal) state.gold = Math.max(0, state.gold - def.steal);
  state.shake = Math.min(1, state.shake + 0.55);
  state.wellFlash = 0.45;
  const end = state.metrics.pts[state.metrics.pts.length - 1];
  floater(end.x, end.y - 0.2, '-' + def.leak + (def.leak === 1 ? ' hue' : ' hues'), '#d4534a');
  sfx('leak');
  syncMoney();
  if (state.lives <= 0 && !state.ended) {
    state.phase = 'lost';
    state.ended = true;
    openLoss();
  }
}

function updateEnemy(e, dt) {
  if (e.dead || state.phase !== 'combat') return;
  const def = ENEMIES[e.type];
  if (e.freezeT > 0) e.freezeT -= dt;
  if (e.slowT > 0) e.slowT -= dt;
  else e.slow = 0;
  if (e.dotT > 0) {
    e.dotT -= dt;
    hurt(e, e.dot * dt, { ignoreArmor: true, dot: true });
    if (e.dead) return;
  } else e.dot = 0;
  if (def.regen && e.hp < e.maxHp) {
    const gain = e.maxHp * def.regen * dt;
    e.hp = Math.min(e.maxHp, e.hp + gain);
    e.saturation = Math.max(0, e.saturation - def.regen * dt * 0.8);
  }
  if (def.shell && e.shell && e.hp <= e.maxHp * 0.5) e.shell = false;
  let resist = def.slowResist;
  if (def.shell && e.shell) resist = 1;
  else if (def.shell && !e.shell) resist = 0.1;
  const factor = e.freezeT > 0 ? 0 : 1 - Math.min(0.8, e.slow * (1 - resist));
  e.dist += def.speed * factor * dt;
  if (e.dist >= state.metrics.total) {
    leakEnemy(e);
    return;
  }
  if (def.summon) {
    e.summonT -= dt;
    if (e.summonT <= 0) {
      e.summonT = 7.2;
      if (state.enemies.length < 46 && state.currentWave) {
        spawnEnemy('clerk', state.currentWave, { dist: Math.max(0, e.dist - 0.85) });
      }
    }
  }
}

function launchBolt(tower, target, dmg, opts) {
  const x = tower.c + 0.5, y = tower.r + 0.5;
  const dx = target.x - x, dy = target.y - y;
  const mag = Math.hypot(dx, dy) || 1;
  const speed = opts.speed || 8;
  state.shots.push({
    kind: opts.kind || 'quill',
    x, y,
    vx: dx / mag * speed,
    vy: dy / mag * speed,
    speed,
    targetId: target.id,
    homing: true,
    damage: dmg,
    left: 1 + (opts.pierce || 0),
    hit: new Set(),
    ignoreArmor: !!opts.ignoreArmor,
    execute: opts.execute || 0,
    splash: opts.splash || 0,
    splashDmg: opts.splashDmg || 0,
    stun: opts.stun || 0,
    comet: !!opts.comet,
    life: 2.1,
    dead: false,
    hue: opts.hue || 4
  });
}

function splashAt(origin, radius, amount, ignoreId, ignoreArmor) {
  for (const o of state.enemies) {
    if (o.dead || o.id === ignoreId) continue;
    if (Math.hypot(o.x - origin.x, o.y - origin.y) <= radius) hurt(o, amount, { ignoreArmor });
  }
}

function tryFire(tower, dt) {
  const stats = statsOf(tower);
  const mul = damageMul(tower);
  if (tower.kind === 'bell') {
    applyBell(tower, stats, dt, 1 - auditorPenalty(tower));
    return;
  }
  tower.cd -= dt;
  if (tower.cd > 0) return;
  const target = pickTarget(tower, stats.range);
  if (!target) { tower.cd = 0; return; }
  if (tower.kind === 'quill') {
    const dmg = stats.damage * mul;
    launchBolt(tower, target, dmg, {
      pierce: stats.pierce || 0,
      ignoreArmor: !!stats.ignoreArmor,
      execute: stats.execute || 0,
      hue: 4
    });
    if (stats.phantom) {
      const second = pickTarget(tower, stats.range, target.id);
      if (second) launchBolt(tower, second, dmg * stats.phantom, { ignoreArmor: !!stats.ignoreArmor, hue: 350 });
    }
    sfx('quill');
  } else if (tower.kind === 'loom') {
    applyThread(target, stats);
    state.fx.push({ kind: 'thread', x1: tower.c + 0.5, y1: tower.r + 0.5, x2: target.x, y2: target.y, life: 0.22, max: 0.22 });
    if (stats.spread) {
      const near = state.enemies.filter(e => !e.dead && e.id !== target.id && Math.hypot(e.x - target.x, e.y - target.y) <= stats.spread);
      near.sort((a, b) => Math.hypot(a.x - target.x, a.y - target.y) - Math.hypot(b.x - target.x, b.y - target.y));
      near.slice(0, stats.spreadCount || 2).forEach(e => {
        applyThread(e, stats);
        state.fx.push({ kind: 'thread', x1: target.x, y1: target.y, x2: e.x, y2: e.y, life: 0.22, max: 0.22 });
      });
    }
    sfx('loom');
  } else if (tower.kind === 'fan') {
    const dmg = stats.damage * mul;
    const list = state.enemies.filter(e => !e.dead && Math.hypot(e.x - (tower.c + 0.5), e.y - (tower.r + 0.5)) <= stats.range);
    if (stats.sweep) {
      list.forEach(e => hurt(e, dmg, {}));
    } else {
      hurt(target, dmg, {});
      if (stats.splash) splashAt(target, stats.splash, dmg * 0.5, target.id, false);
      if (stats.chains) {
        const others = list.filter(e => e.id !== target.id && !e.dead);
        others.sort((a, b) => Math.hypot(a.x - target.x, a.y - target.y) - Math.hypot(b.x - target.x, b.y - target.y));
        others.slice(0, stats.chains).forEach(e => hurt(e, dmg * 0.6, {}));
      }
    }
    state.fx.push({ kind: 'arc', x: tower.c + 0.5, y: tower.r + 0.5, range: stats.range, life: 0.18, max: 0.18 });
    sfx('fan');
  } else if (tower.kind === 'siphon') {
    tower.shotCount = (tower.shotCount || 0) + 1;
    const comet = !!(stats.cometEvery && tower.shotCount % stats.cometEvery === 0);
    const dmg = stats.damage * mul * (comet ? stats.cometMul : 1);
    launchBolt(tower, target, dmg, {
      kind: comet ? 'comet' : 'siphon',
      speed: 5.4,
      splash: comet ? Math.max(stats.splash, 1.15) : stats.splash,
      splashDmg: dmg * (comet ? 0.55 : 0.4),
      stun: comet ? stats.stun : 0,
      comet,
      hue: 160
    });
    sfx(comet ? 'comet' : 'siphon');
  }
  tower.cd = stats.rate;
}

function applyThread(enemy, stats) {
  enemy.dot = Math.max(enemy.dot, stats.dot);
  enemy.dotT = Math.max(enemy.dotT, stats.dotDur);
  enemy.gilt = Math.max(enemy.gilt || 0, stats.gilt || 0);
}

function applyBell(tower, stats, dt, sure) {
  const x = tower.c + 0.5, y = tower.r + 0.5;
  const slow = stats.slow * sure;
  for (const e of state.enemies) {
    if (e.dead) continue;
    if (Math.hypot(e.x - x, e.y - y) <= stats.range) {
      e.slow = Math.max(e.slow, slow);
      e.slowT = Math.max(e.slowT, stats.linger || 0.12);
    }
  }
  if (!stats.freeze) return;
  tower.pulse = (tower.pulse == null ? stats.freezeEvery * 0.65 : tower.pulse) - dt;
  if (tower.pulse <= 0) {
    tower.pulse = stats.freezeEvery;
    for (const e of state.enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x - x, e.y - y) <= stats.range) e.freezeT = Math.max(e.freezeT, stats.freeze);
    }
    state.fx.push({ kind: 'ring', x, y, range: stats.range, life: 0.5, max: 0.5 });
    sfx('bell');
  }
}

function strike(e, p) {
  if (p.execute && e.maxHp > 0 && e.hp / e.maxHp <= p.execute) {
    floater(e.x, e.y - 0.25, 'resigns', '#f6dd9d');
    e.hp = 0;
    onKill(e);
    sfx('resign');
    return;
  }
  hurt(e, p.damage, { ignoreArmor: p.ignoreArmor });
  if (p.stun) e.freezeT = Math.max(e.freezeT || 0, p.stun);
  if (p.splash) splashAt(e, p.splash, p.splashDmg, e.id, p.ignoreArmor);
}

function updateShots(dt) {
  for (const p of state.shots) {
    const target = p.homing ? state.enemies.find(e => e.id === p.targetId && !e.dead) : null;
    if (target) {
      const dx = target.x - p.x, dy = target.y - p.y;
      const mag = Math.hypot(dx, dy) || 1;
      p.vx = dx / mag * p.speed;
      p.vy = dy / mag * p.speed;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    for (const e of state.enemies) {
      if (e.dead || p.hit.has(e.id)) continue;
      if (Math.hypot(e.x - p.x, e.y - p.y) <= 0.3) {
        p.hit.add(e.id);
        strike(e, p);
        p.homing = false;
        p.left--;
        if (p.left <= 0) p.dead = true;
        break;
      }
    }
    if (p.life <= 0 || p.x < -1 || p.y < -1 || p.x > COLS + 1 || p.y > ROWS + 1) p.dead = true;
  }
  if (state.shots.length > 180) state.shots.splice(0, state.shots.length - 180);
  state.shots = state.shots.filter(p => !p.dead);
}

function closeDocket() {
  if (state.phase !== 'combat') return;
  const wave = WAVES[state.waveIndex];
  state.gold += wave.reward;
  state.cleared.push(wave);
  state.waveIndex++;
  state.spawn = null;
  state.shots = [];
  if (state.waveIndex >= WAVES.length) {
    state.phase = 'won';
    state.ended = true;
    announce('Dawn comes in a color without a form.');
    sfx('win');
    openWin();
  } else {
    state.phase = 'build';
    state.paused = false;
    state.resumeAt = (typeof performance !== 'undefined' ? performance.now() : 0) + 700;
    toast('Docket closed. +' + wave.reward + ' pigment');
    announce(WAVES[state.waveIndex].name + ' is next. The pipes are sleeping.');
    sfx('clear');
  }
  syncAll();
}

function update(dt) {
  if (state.phase !== 'combat') return;
  updateSpawn(dt);
  const list = state.enemies.slice();
  for (const e of list) updateEnemy(e, dt);
  if (state.phase !== 'combat') {
    state.enemies = state.enemies.filter(e => !e.dead);
    return;
  }
  cachePositions();
  for (const tower of state.towers) tryFire(tower, dt);
  cachePositions();
  updateShots(dt);
  state.enemies = state.enemies.filter(e => !e.dead);
  if (state.spawn && state.spawn.done && state.enemies.length === 0) closeDocket();
}

function updateFx(dt) {
  for (const p of state.fx) {
    if (!p.kind || p.kind === 'dot') {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.35 * dt;
    }
    p.life -= dt;
  }
  state.fx = state.fx.filter(p => p.life > 0);
  for (const f of state.floaters) f.life -= dt;
  state.floaters = state.floaters.filter(f => f.life > 0);
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt);
  if (state.wellFlash > 0) state.wellFlash = Math.max(0, state.wellFlash - dt);
  for (const e of state.enemies) if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
}

function placeAt(c, r) {
  if (!canBuild() || !state.armed) return;
  const existing = state.towers.find(t => t.c === c && t.r === r);
  if (existing) {
    state.selectedId = existing.id;
    syncDetail(true);
    return;
  }
  if (state.pathSet.has(keyOf(c, r))) {
    toast('The glass is not yours to build on.');
    return;
  }
  if (!canPlace(c, r)) return;
  const def = TOWERS[state.armed];
  if (state.gold < def.cost) {
    toast('Not enough pigment.');
    sfx('deny');
    return;
  }
  state.gold -= def.cost;
  const tower = {
    id: state.nextId++,
    kind: state.armed,
    c, r,
    level: 0,
    invested: def.cost,
    cd: 0.15,
    pulse: 3,
    shotCount: 0,
    targetMode: state.targetMode
  };
  state.towers.push(tower);
  state.selectedId = tower.id;
  burst(c + 0.5, r + 0.5, 42, 6);
  sfx('place');
  syncAll();
}

function upgradeSelected() {
  const tower = selectedTower();
  if (!tower || !canBuild()) return;
  if (tower.level >= 4) return;
  const next = TOWERS[tower.kind].levels[tower.level + 1];
  if (state.gold < next.cost) {
    toast('Not enough pigment to tune.');
    sfx('deny');
    return;
  }
  state.gold -= next.cost;
  tower.invested += next.cost;
  tower.level++;
  sfx('tune');
  toast(next.name);
  syncAll();
}

function sellSelected() {
  const tower = selectedTower();
  if (!tower || !canBuild()) return;
  const refund = Math.floor(tower.invested * 0.6);
  state.gold += refund;
  state.towers = state.towers.filter(t => t.id !== tower.id);
  state.selectedId = null;
  sfx('sell');
  toast('Returned ' + refund + ' pigment');
  syncAll();
}

function cycleTarget(mode) {
  const tower = selectedTower();
  if (!tower) {
    state.targetMode = mode;
  } else {
    tower.targetMode = mode;
    state.targetMode = mode;
  }
  syncDetail(true);
}

function arm(kind) {
  state.armed = kind;
  state.selectedId = null;
  sfx('ui');
  syncShop();
  syncDetail(true);
}

function traceRounded(ctx, pts, radius) {
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++) {
    const prev = pts[i - 1], cur = pts[i], next = pts[i + 1];
    const v1x = cur.x - prev.x, v1y = cur.y - prev.y;
    const v2x = next.x - cur.x, v2y = next.y - cur.y;
    const l1 = Math.hypot(v1x, v1y) || 1;
    const l2 = Math.hypot(v2x, v2y) || 1;
    const r = Math.min(radius, l1 * 0.45, l2 * 0.45);
    const ax = cur.x - (v1x / l1) * r, ay = cur.y - (v1y / l1) * r;
    const bx = cur.x + (v2x / l2) * r, by = cur.y + (v2y / l2) * r;
    ctx.lineTo(ax, ay);
    ctx.quadraticCurveTo(cur.x, cur.y, bx, by);
  }
  const last = pts[pts.length - 1];
  ctx.lineTo(last.x, last.y);
}

function cellHash(c, r, n) {
  let x = Math.imul((c + 1) ^ (state.seed + n), 374761393) ^ Math.imul(r + 3, 668265263);
  x = Math.imul(x ^ (x >>> 13), 1274126177);
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}

function paintStatic(ctx) {
  const g = ctx.createLinearGradient(0, 0, COLS, ROWS);
  g.addColorStop(0, '#f7f0e2');
  g.addColorStop(0.55, '#f0e2cb');
  g.addColorStop(1, '#e6d3b6');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, COLS, ROWS);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const h = cellHash(c, r, 1);
      ctx.fillStyle = h > 0.55 ? 'rgba(255,255,255,0.18)' : 'rgba(120, 72, 36, 0.045)';
      ctx.fillRect(c + 0.035, r + 0.035, 0.93, 0.93);
      if (!state.pathSet.has(keyOf(c, r)) && h > 0.93) {
        ctx.fillStyle = 'rgba(176, 64, 58, 0.28)';
        ctx.beginPath();
        ctx.arc(c + 0.28, r + 0.32, 0.035, 0, Math.PI * 2);
        ctx.arc(c + 0.34, r + 0.28, 0.03, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(70, 120, 70, 0.35)';
        ctx.fillRect(c + 0.31, r + 0.34, 0.02, 0.06);
      } else if (h < 0.05) {
        ctx.strokeStyle = 'rgba(90, 60, 40, 0.25)';
        ctx.lineWidth = 0.015;
        ctx.beginPath();
        ctx.moveTo(c + 0.2, r + 0.7);
        ctx.lineTo(c + 0.55, r + 0.4);
        ctx.lineTo(c + 0.7, r + 0.62);
        ctx.stroke();
      }
    }
  }
  ctx.save();
  traceRounded(ctx, state.metrics.pts, 0.34);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 0.84;
  ctx.strokeStyle = '#6a5144';
  ctx.stroke();
  ctx.lineWidth = 0.66;
  ctx.strokeStyle = '#2c221c';
  ctx.stroke();
  ctx.restore();
  const start = state.metrics.pts[0];
  const end = state.metrics.pts[state.metrics.pts.length - 1];
  ctx.fillStyle = '#8d6434';
  ctx.beginPath();
  ctx.arc(start.x, start.y, 0.34, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#f0d48a';
  ctx.lineWidth = 0.04;
  ctx.stroke();
  ctx.fillStyle = '#5b3d22';
  ctx.font = '0.16px Palatino, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('MAINS', start.x, start.y);
  ctx.fillStyle = '#1b3e3a';
  ctx.beginPath();
  ctx.arc(end.x, end.y, 0.42, 0, Math.PI * 2);
  ctx.fill();
  const vig = ctx.createRadialGradient(COLS / 2, ROWS / 2, 2.2, COLS / 2, ROWS / 2, 9.2);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(90, 48, 24, 0.16)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, COLS, ROWS);
  ctx.strokeStyle = 'rgba(140, 98, 48, 0.45)';
  ctx.lineWidth = 0.06;
  ctx.strokeRect(0.08, 0.08, COLS - 0.16, ROWS - 0.16);
}

function ensureBackdrop() {
  const canvas = document.getElementById('board');
  if (state.backdrop && state.backdrop.width === canvas.width && state.backdrop.height === canvas.height && state.backdropSeed === state.seed) return;
  const off = document.createElement('canvas');
  off.width = canvas.width;
  off.height = canvas.height;
  const ctx = off.getContext('2d');
  ctx.setTransform(canvas.width / COLS, 0, 0, canvas.height / ROWS, 0, 0);
  paintStatic(ctx);
  state.backdrop = off;
  state.backdropSeed = state.seed;
}

function roundAdd(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function paintShape(ctx, e, trace) {
  ctx.beginPath();
  trace(ctx);
  ctx.fillStyle = e.shell ? '#f4f1ea' : '#ddd6cb';
  ctx.fill();
  ctx.save();
  ctx.clip();
  const sat = Math.max(0, Math.min(1, e.saturation));
  ctx.fillStyle = `hsl(${e.hue} 70% 46%)`;
  ctx.fillRect(-1.5, 0.7 - sat * 1.45, 3, 1.6);
  if (e.hitFlash > 0) {
    ctx.fillStyle = `rgba(255,248,240,${Math.min(0.7, e.hitFlash * 6)})`;
    ctx.fillRect(-1.5, -1.5, 3, 3);
  }
  ctx.restore();
  ctx.beginPath();
  trace(ctx);
  ctx.lineWidth = 0.035;
  ctx.strokeStyle = '#2a211c';
  ctx.stroke();
}

function eyes(ctx, y, awake) {
  ctx.fillStyle = '#24160f';
  ctx.beginPath();
  ctx.arc(-0.045, y, 0.02, 0, Math.PI * 2);
  ctx.arc(0.045, y, 0.02, 0, Math.PI * 2);
  ctx.fill();
  if (awake) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-0.039, y - 0.007, 0.008, 0, Math.PI * 2);
    ctx.arc(0.051, y - 0.007, 0.008, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawEnemy(ctx, e) {
  const def = ENEMIES[e.type];
  const bob = Math.sin(state.time * 3 + e.id) * (state.reduceMotion ? 0 : 0.025);
  ctx.save();
  ctx.translate(e.x, e.y + bob);
  ctx.fillStyle = 'rgba(70, 36, 24, 0.15)';
  ctx.beginPath();
  ctx.ellipse(0.03, 0.28, def.radius * 0.9, 0.07, 0, 0, Math.PI * 2);
  ctx.fill();
  if (def.facesPath) ctx.rotate(e.angle);
  if (def.boss) ctx.scale(1.28, 1.28);
  const awake = e.saturation > 0.55;
  if (e.type === 'clerk') {
    paintShape(ctx, e, c => { c.arc(0, -0.16, 0.11, 0, Math.PI * 2); });
    paintShape(ctx, e, c => roundAdd(c, -0.15, -0.05, 0.3, 0.32, 0.08));
    eyes(ctx, -0.16, awake);
    ctx.fillStyle = '#8d6434';
    ctx.fillRect(0.08, -0.02, 0.08, 0.08);
  } else if (e.type === 'runner') {
    paintShape(ctx, e, c => {
      c.moveTo(0.34, 0);
      c.lineTo(0.16, 0.07);
      c.lineTo(-0.2, 0.07);
      c.lineTo(-0.28, 0);
      c.lineTo(-0.2, -0.07);
      c.lineTo(0.16, -0.07);
      c.closePath();
    });
    ctx.fillStyle = '#c4554c';
    ctx.fillRect(-0.28, -0.045, 0.06, 0.09);
  } else if (e.type === 'cabinet') {
    paintShape(ctx, e, c => roundAdd(c, -0.2, -0.24, 0.4, 0.48, 0.04));
    ctx.strokeStyle = '#2a211c';
    ctx.lineWidth = 0.03;
    ctx.beginPath();
    ctx.moveTo(-0.16, -0.08); ctx.lineTo(0.16, -0.08);
    ctx.moveTo(-0.16, 0.06); ctx.lineTo(0.16, 0.06);
    ctx.stroke();
  } else if (e.type === 'tape') {
    paintShape(ctx, e, c => {
      c.moveTo(-0.32, 0);
      c.bezierCurveTo(-0.16, -0.2, 0.05, 0.18, 0.32, -0.02);
      c.bezierCurveTo(0.18, 0.16, 0.02, -0.08, -0.22, 0.16);
      c.closePath();
    });
  } else if (e.type === 'moth') {
    paintShape(ctx, e, c => {
      c.ellipse(-0.1, -0.02, 0.14, 0.1, -0.4, 0, Math.PI * 2);
      c.ellipse(0.1, -0.02, 0.14, 0.1, 0.4, 0, Math.PI * 2);
    });
    paintShape(ctx, e, c => { c.ellipse(0, 0.02, 0.05, 0.1, 0, 0, Math.PI * 2); });
  } else if (e.type === 'swatch') {
    paintShape(ctx, e, c => roundAdd(c, -0.16, -0.16, 0.32, 0.32, 0.04));
    ctx.fillStyle = `hsl(${e.hue} 80% 50%)`;
    ctx.fillRect(-0.06, -0.06, 0.12, 0.12);
  } else if (e.type === 'copy' || e.type === 'smudge') {
    ctx.save();
    ctx.translate(e.type === 'copy' ? 0.06 : 0, 0);
    paintShape(ctx, e, c => roundAdd(c, -0.14, -0.16, 0.26, 0.34, 0.08));
    ctx.restore();
    if (e.type === 'copy') {
      ctx.globalAlpha = 0.75;
      ctx.translate(-0.07, 0.02);
      paintShape(ctx, e, c => roundAdd(c, -0.14, -0.16, 0.26, 0.34, 0.08));
      ctx.globalAlpha = 1;
    }
  } else if (e.type === 'warden') {
    paintShape(ctx, e, c => roundAdd(c, -0.2, -0.22, 0.4, 0.46, 0.1));
    if (e.shell) {
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 0.05;
      ctx.strokeRect(-0.16, -0.16, 0.32, 0.34);
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 0.03;
      ctx.beginPath();
      ctx.moveTo(-0.1, -0.16); ctx.lineTo(0.02, 0.02); ctx.lineTo(0.12, -0.04);
      ctx.stroke();
    }
    eyes(ctx, -0.06, awake && !e.shell);
  } else if (e.type === 'auditor') {
    paintShape(ctx, e, c => roundAdd(c, -0.11, -0.28, 0.22, 0.52, 0.08));
    ctx.fillStyle = '#2a211c';
    ctx.beginPath();
    ctx.moveTo(-0.12, -0.26); ctx.lineTo(0.12, -0.26); ctx.lineTo(0, -0.36); ctx.fill();
    eyes(ctx, -0.12, awake);
    ctx.strokeStyle = 'rgba(90,90,90,0.7)';
    ctx.lineWidth = 0.025;
    ctx.beginPath();
    ctx.arc(0.08, -0.1, 0.05, 0, Math.PI * 2);
    ctx.stroke();
  } else if (e.type === 'seal') {
    paintShape(ctx, e, c => { c.arc(0, 0, 0.24, 0, Math.PI * 2); });
    ctx.strokeStyle = '#2a211c';
    ctx.lineWidth = 0.03;
    ctx.beginPath();
    ctx.arc(0, 0, 0.14, 0, Math.PI * 2);
    ctx.stroke();
    eyes(ctx, -0.02, awake);
    ctx.fillStyle = '#8d342e';
    ctx.fillRect(-0.05, 0.18, 0.22, 0.08);
  }
  ctx.restore();
  if (e.gilt) {
    ctx.strokeStyle = '#e2b657';
    ctx.lineWidth = 0.03;
    ctx.beginPath();
    ctx.arc(e.x, e.y, def.radius + 0.08, state.time * 2, state.time * 2 + 1.2);
    ctx.stroke();
  }
  if (e.freezeT > 0) {
    ctx.strokeStyle = 'rgba(170, 210, 255, 0.9)';
    ctx.lineWidth = 0.035;
    ctx.strokeRect(e.x - 0.2, e.y - 0.24, 0.4, 0.48);
  } else if (e.slow > 0.05) {
    ctx.fillStyle = 'rgba(61, 98, 200, 0.85)';
    ctx.fillRect(e.x - 0.06, e.y + 0.3, 0.04, 0.06);
    ctx.fillRect(e.x + 0.02, e.y + 0.3, 0.04, 0.06);
  }
  if (def.aura) {
    ctx.strokeStyle = 'rgba(80, 80, 80, 0.28)';
    ctx.lineWidth = 0.03;
    ctx.setLineDash([0.08, 0.08]);
    ctx.beginPath();
    ctx.arc(e.x, e.y, def.aura, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawTower(ctx, tower, ghost) {
  const def = TOWERS[tower.kind];
  ctx.save();
  ctx.translate(tower.c + 0.5, tower.r + 0.5);
  if (ghost) ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgba(70, 40, 20, 0.13)';
  ctx.beginPath();
  ctx.ellipse(0, 0.22, 0.22, 0.08, 0, 0, Math.PI * 2);
  ctx.fill();
  if (tower.kind === 'quill') {
    ctx.fillStyle = '#8c6232';
    ctx.beginPath(); ctx.ellipse(0, 0.12, 0.18, 0.07, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e2b657';
    ctx.beginPath(); ctx.ellipse(0, 0.08, 0.13, 0.055, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.rotate(-0.65);
    ctx.fillStyle = '#f7f3ec';
    ctx.fillRect(-0.025, -0.36, 0.05, 0.32);
    ctx.fillStyle = '#d4534a';
    ctx.beginPath(); ctx.moveTo(0, -0.44); ctx.lineTo(0.07, -0.28); ctx.lineTo(-0.07, -0.28); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#8e2424';
    ctx.beginPath(); ctx.arc(0.02, -0.02, 0.08, 0, Math.PI * 2); ctx.fill();
    if (!state.reduceMotion) {
      const drip = (state.time * 0.7 + tower.id) % 1;
      ctx.globalAlpha = (ghost ? 0.55 : 1) * (1 - drip);
      ctx.fillStyle = '#d4534a';
      ctx.beginPath(); ctx.arc(0.12, 0.05 + drip * 0.25, 0.025, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = ghost ? 0.55 : 1;
    }
  } else if (tower.kind === 'bell') {
    ctx.fillStyle = '#8c6232';
    ctx.fillRect(-0.03, -0.02, 0.06, 0.24);
    const swing = state.reduceMotion ? 0 : Math.sin(state.time * 2 + tower.id) * 0.08;
    ctx.save();
    ctx.rotate(swing);
    ctx.fillStyle = '#2c4eb8';
    ctx.beginPath();
    ctx.moveTo(-0.18, -0.02);
    ctx.quadraticCurveTo(-0.22, 0.2, 0, 0.24);
    ctx.quadraticCurveTo(0.22, 0.2, 0.18, -0.02);
    ctx.quadraticCurveTo(0, -0.16, -0.18, -0.02);
    ctx.fill();
    ctx.fillStyle = '#d5ecff';
    ctx.beginPath(); ctx.ellipse(0, 0.02, 0.07, 0.04, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e2b657';
    ctx.beginPath(); ctx.arc(0, 0.16, 0.03, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else if (tower.kind === 'loom') {
    ctx.strokeStyle = '#8c6232';
    ctx.lineWidth = 0.045;
    ctx.beginPath();
    ctx.moveTo(-0.16, 0.2); ctx.lineTo(-0.16, -0.18);
    ctx.moveTo(0.16, 0.2); ctx.lineTo(0.16, -0.18);
    ctx.stroke();
    ctx.strokeStyle = '#e2b657';
    ctx.lineWidth = 0.03;
    const spin = state.time * 2.4 + tower.id;
    ctx.beginPath();
    ctx.moveTo(-0.16, -0.02);
    ctx.bezierCurveTo(-0.04, -0.18, 0.06, 0.16 + Math.sin(spin) * 0.04, 0.16, 0);
    ctx.stroke();
    ctx.fillStyle = '#f6dd9d';
    ctx.beginPath(); ctx.arc(0, 0.04, 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8d6428';
    ctx.beginPath(); ctx.arc(0, 0.04, 0.08, spin, spin + 1.4); ctx.stroke();
  } else if (tower.kind === 'fan') {
    const open = 0.85 + (state.reduceMotion ? 0 : Math.sin(state.time * 1.8 + tower.id) * 0.18);
    const colors = ['#d4534a', '#e2b657', '#1f8a6e', '#3d62c8', '#7d5cff'];
    for (let i = 0; i < 5; i++) {
      const a0 = -open + (i / 5) * open * 2 - Math.PI / 2;
      const a1 = -open + ((i + 1) / 5) * open * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(0, 0.1);
      ctx.arc(0, 0.1, 0.36, a0, a1);
      ctx.closePath();
      ctx.fillStyle = colors[i];
      ctx.globalAlpha = ghost ? 0.4 : 0.92;
      ctx.fill();
    }
    ctx.globalAlpha = ghost ? 0.55 : 1;
    ctx.fillStyle = '#e2b657';
    ctx.beginPath(); ctx.arc(0, 0.1, 0.045, 0, Math.PI * 2); ctx.fill();
  } else if (tower.kind === 'siphon') {
    ctx.strokeStyle = '#c9963a';
    ctx.lineWidth = 0.05;
    ctx.beginPath(); ctx.arc(0, 0.02, 0.22, 0, Math.PI * 2); ctx.stroke();
    const grd = ctx.createRadialGradient(-0.04, -0.02, 0.02, 0, 0.02, 0.18);
    grd.addColorStop(0, '#f4fff8');
    grd.addColorStop(0.45, '#3dba96');
    grd.addColorStop(1, '#0f5e4c');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0.02, 0.17, 0, Math.PI * 2); ctx.fill();
    const bob = state.reduceMotion ? 0 : Math.sin(state.time * 2.2 + tower.id) * 0.04;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(0.05, bob - 0.02, 0.045, 0, Math.PI * 2); ctx.fill();
  }
  if (!ghost) {
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(-0.15 + i * 0.1, 0.36, 0.028, 0, Math.PI * 2);
      ctx.fillStyle = i < tower.level ? '#e2b657' : 'rgba(70,40,20,0.28)';
      ctx.fill();
    }
    if (!ghost && auditorPenalty(tower) > 0.05) {
      ctx.fillStyle = `rgba(80, 80, 80, ${0.18 + auditorPenalty(tower)})`;
      ctx.beginPath(); ctx.arc(0, 0.02, 0.28, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
  if (!ghost && def) {
    const st = statsOf(tower);
    if (st.aura && state.selectedId === tower.id) {
      ctx.strokeStyle = 'rgba(31, 138, 110, 0.45)';
      ctx.lineWidth = 0.03;
      for (const other of state.towers) {
        if (other.id === tower.id) continue;
        if (Math.hypot(other.c - tower.c, other.r - tower.r) <= st.auraRange) {
          ctx.beginPath();
          ctx.moveTo(tower.c + 0.5, tower.r + 0.5);
          ctx.lineTo(other.c + 0.5, other.r + 0.5);
          ctx.stroke();
        }
      }
    }
  }
}

function drawRange(ctx, x, y, radius, color, alpha) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  ctx.fill();
  ctx.globalAlpha = Math.min(0.9, alpha * 3);
  ctx.strokeStyle = color;
  ctx.lineWidth = 0.035;
  ctx.stroke();
  ctx.restore();
}

function render() {
  if (!hasDom()) return;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  ensureBackdrop();
  cachePositions();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(state.backdrop, 0, 0);
  const sx = canvas.width / COLS;
  const sy = canvas.height / ROWS;
  let ox = 0, oy = 0;
  if (state.shake > 0 && !state.reduceMotion) {
    ox = Math.sin(state.time * 46) * state.shake * 5;
    oy = Math.cos(state.time * 38) * state.shake * 4;
  }
  ctx.setTransform(sx, 0, 0, sy, ox, oy);

  const wave = activeWave();
  const col = liveColor(wave);
  const flow = state.phase === 'combat' && !state.paused ? 0.55 : 0.12;
  ctx.save();
  traceRounded(ctx, state.metrics.pts, 0.34);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 0.4;
  ctx.strokeStyle = cssColor(col, 0.95);
  if (!state.reduceMotion) {
    ctx.setLineDash([0.22, 0.16]);
    ctx.lineDashOffset = -state.time * flow;
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  const end = state.metrics.pts[state.metrics.pts.length - 1];
  const wg = ctx.createRadialGradient(end.x, end.y, 0.05, end.x, end.y, 0.48);
  wg.addColorStop(0, '#fffaf2');
  wg.addColorStop(0.45, cssColor(col, 0.95));
  wg.addColorStop(1, 'rgba(20, 40, 40, 0.15)');
  ctx.fillStyle = wg;
  ctx.beginPath();
  ctx.arc(end.x, end.y, 0.4, 0, Math.PI * 2);
  ctx.fill();
  if (state.wellFlash > 0) {
    ctx.fillStyle = `rgba(212, 83, 74, ${state.wellFlash})`;
    ctx.beginPath();
    ctx.arc(end.x, end.y, 0.46, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 0.03;
  ctx.beginPath();
  const spins = state.reduceMotion ? 2 : state.time * 0.9;
  for (let a = 0; a < 6; a += 0.25) {
    const rr = 0.05 + a * 0.05;
    const ang = spins + a;
    const x = end.x + Math.cos(ang) * rr;
    const y = end.y + Math.sin(ang) * rr * 0.86;
    if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  state.cleared.forEach((w, i) => {
    const ang = -Math.PI / 2 + i * (Math.PI * 2 / WAVES.length);
    ctx.strokeStyle = cssColor(w.color, 0.95);
    ctx.lineWidth = 0.055;
    ctx.beginPath();
    ctx.arc(end.x, end.y, 0.7, ang - 0.09, ang + 0.09);
    ctx.stroke();
  });

  if (state.selectedId) {
    const tower = selectedTower();
    if (tower) drawRange(ctx, tower.c + 0.5, tower.r + 0.5, statsOf(tower).range, TOWERS[tower.kind].accent, 0.12);
  }
  if (state.hover && state.armed && canBuild()) {
    const def = TOWERS[state.armed];
    const ok = canPlace(state.hover.c, state.hover.r) && state.gold >= def.cost;
    const onPath = state.pathSet.has(keyOf(state.hover.c, state.hover.r));
    if (!onPath) {
      drawRange(ctx, state.hover.c + 0.5, state.hover.r + 0.5, def.levels[0].range, ok ? def.accent : '#d4534a', 0.1);
      drawTower(ctx, { c: state.hover.c, r: state.hover.r, kind: state.armed, id: 0, level: 0 }, true);
    }
  }

  for (const tower of state.towers) {
    if (state.selectedId === tower.id) {
      ctx.strokeStyle = '#e2b657';
      ctx.lineWidth = 0.04;
      ctx.strokeRect(tower.c + 0.08, tower.r + 0.08, 0.84, 0.84);
    }
    drawTower(ctx, tower, false);
  }

  for (const fx of state.fx) {
    const a = Math.max(0, fx.life / (fx.max || 0.5));
    if (fx.kind === 'thread') {
      ctx.strokeStyle = `rgba(226, 182, 87, ${a})`;
      ctx.lineWidth = 0.03;
      ctx.beginPath(); ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2); ctx.stroke();
    } else if (fx.kind === 'arc' || fx.kind === 'ring') {
      ctx.strokeStyle = fx.kind === 'ring' ? `rgba(140, 180, 255, ${a})` : `rgba(180, 140, 255, ${a})`;
      ctx.lineWidth = 0.05;
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, (fx.range || 1) * (fx.kind === 'ring' ? (1 - a * 0.2) : 0.75), -0.9, 0.9);
      ctx.stroke();
    } else {
      ctx.fillStyle = `hsla(${fx.hue}, 75%, 52%, ${a})`;
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, fx.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (const shot of state.shots) {
    ctx.fillStyle = shot.comet ? '#fff4d2' : (shot.kind === 'siphon' ? '#7dffe0' : '#e45448');
    ctx.beginPath();
    ctx.arc(shot.x, shot.y, shot.comet ? 0.12 : shot.kind === 'siphon' ? 0.09 : 0.055, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const e of state.enemies) drawEnemy(ctx, e);

  if (state.selectedId) {
    const tower = selectedTower();
    if (tower && state.phase === 'combat') {
      const target = pickTarget(tower, statsOf(tower).range);
      if (target) {
        ctx.strokeStyle = TOWERS[tower.kind].accent;
        ctx.lineWidth = 0.03;
        ctx.beginPath();
        ctx.moveTo(target.x - 0.08, target.y - 0.34);
        ctx.lineTo(target.x, target.y - 0.42);
        ctx.lineTo(target.x + 0.08, target.y - 0.34);
        ctx.stroke();
      }
    }
  }

  ctx.font = '0.2px Palatino, Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of state.floaters) {
    ctx.globalAlpha = Math.max(0, f.life / f.max);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y - (1 - f.life / f.max) * 0.45);
  }
  ctx.globalAlpha = 1;
}

function layout() {
  if (!hasDom()) return;
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('board');
  const narrow = window.innerWidth < 820;
  const pad = 20;
  const availW = Math.max(160, stage.clientWidth - pad);
  const availH = Math.max(160, stage.clientHeight - pad);
  let cell = Math.min(availW / COLS, availH / ROWS);
  if (narrow && cell < 38) cell = 38;
  const cssW = Math.floor(cell * COLS);
  const cssH = Math.floor(cell * ROWS);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const bw = Math.max(1, Math.round(cssW * dpr));
  const bh = Math.max(1, Math.round(cssH * dpr));
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
    state.backdrop = null;
  }
}

function esc(s) {
  return String(s).replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
}

function statBits(st) {
  const bits = [];
  if (st.damage) bits.push('Damage ' + st.damage);
  if (st.rate) bits.push('Every ' + st.rate.toFixed(2) + 's');
  if (st.range) bits.push('Reach ' + st.range.toFixed(1));
  if (st.slow) bits.push('Slow ' + Math.round(st.slow * 100) + '%');
  if (st.dot) bits.push('Thread ' + st.dot + '/s for ' + st.dotDur + 's');
  if (st.gilt) bits.push('+' + st.gilt + ' pigment on resigning');
  if (st.splash && !st.sweep) bits.push('Splash ' + st.splash);
  if (st.pierce) bits.push('Through ' + (1 + st.pierce) + ' bodies');
  if (st.ignoreArmor) bits.push('Ignores armor');
  if (st.execute) bits.push('Resigns below ' + Math.round(st.execute * 100) + '%');
  if (st.phantom) bits.push('A second, fainter stroke');
  if (st.linger && st.linger > 0.3) bits.push('Lingers ' + st.linger + 's');
  if (st.freeze) bits.push('Peal freezes ' + st.freeze + 's');
  if (st.chains) bits.push('Bends to ' + st.chains + ' more');
  if (st.sweep) bits.push('Addresses the whole reach');
  if (st.spread) bits.push('Knot spreads');
  if (st.aura) bits.push('Neighbors +' + Math.round(st.aura * 100) + '%');
  if (st.cometEvery) bits.push('Every ' + st.cometEvery + 'th shot is a comet');
  return bits.join(' · ');
}

function speedWord(speed) {
  if (speed >= 1.8) return 'swift';
  if (speed >= 1.15) return 'brisk';
  if (speed >= 0.75) return 'measured';
  if (speed >= 0.55) return 'slow';
  return 'ponderous';
}

function strengthWord(hp) {
  if (hp >= 400) return 'monumental';
  if (hp >= 140) return 'heavy';
  if (hp >= 70) return 'sturdy';
  if (hp >= 32) return 'ordinary';
  return 'frail';
}

function syncShop() {
  if (!hasDom()) return;
  document.querySelectorAll('.card').forEach(btn => {
    const def = TOWERS[btn.dataset.kind];
    btn.classList.toggle('armed', state.armed === btn.dataset.kind);
    btn.classList.toggle('broke', state.gold < def.cost);

}

function syncMoney() {
  if (!hasDom()) return;
  const gold = document.getElementById('goldNum');
  const life = document.getElementById('lifeNum');
  const bar = document.getElementById('lifeBar');
  if (gold) gold.textContent = String(state.gold);
  if (life) life.textContent = String(state.lives);
  if (bar) {

    bar.style.width = pct + '%';

  syncShop();
  const up = document.getElementById('upgradeBtn');
  if (up) {
    const tower = selectedTower();
    if (tower && tower.level < 4) {

      up.disabled = state.gold < next.cost || !canBuild();

function detailSignature() {
  const tower = selectedTower();
  return [
    state.phase,
    state.armed,
    state.waveIndex,

function syncDetail(force) {

function syncPips() {
  if (!hasDom()) return;
  document.querySelectorAll('#pips .pip').forEach(el => {

function syncStatus() {
  if (!hasDom()) return;
  const wave = state.waveIndex < WAVES.length ? WAVES[state.waveIndex] : WAVES[WAVES.length - 1];
  const line = document.getElementById('statusline');
  const note = document.getElementById('note');
  const watch = document.getElementById('watch');
  const num = document.getElementById('docketNum');
  const name = document.getElementById('hueName');
  const dot = document.getElementById('hueDot');
  const shown = state.phase === 'won' ? WAVES.length : state.waveIndex + 1;
  if (watch) watch.textContent = state.phase === 'won' ? 'Dawn' : watchName(state.waveIndex);
  if (num) num.textContent = state.phase === 'won' ? 'All 24 dockets closed' : 'Docket ' + shown + ' / ' + WAVES.length;
  if (name) name.textContent = wave.name;
  const col = liveColor(wave);
  if (dot) dot.style.background = cssColor(col);
  if (note) note.innerHTML = esc(wave.note) + '<cite>Iride, in the margin</cite>';
  let status = '';
  if (state.phase === 'build') status = 'The pipes are sleeping. ' + wave.name + ' is next — ' + wave.reward + ' pigment if the Well holds.';
  else if (state.phase === 'combat' && state.paused) status = 'Held. The ink is waiting. You may still tune.';
  else if (state.phase === 'combat') status = 'The mains are open. ' + state.enemies.length + ' still on the glass.';
  else if (state.phase === 'won') status = 'Dawn is in the room.';
  else if (state.phase === 'lost') status = 'The filing went through.';
  else status = 'The stillroom is lit. The pipes have not chosen to move yet.';
  if (line && line.textContent !== status) line.textContent = status;
  const seedLine = document.getElementById('seedLine');
  if (seedLine) seedLine.textContent = 'Pipes ' + (state.seed >>> 0).toString(16).toUpperCase().padStart(8, '0');
  const start = document.getElementById('startBtn');
  if (start) {
    if (state.phase === 'build') {
      const cooling = typeof performance !== 'undefined' && performance.now() < (state.resumeAt || 0);
      start.disabled = cooling;
      start.textContent = state.waveIndex > 0 ? 'Open the next docket' : 'Open the mains';
      start.classList.toggle('ready', !cooling);
    } else if (state.phase === 'combat') {
      start.disabled = true;
      start.classList.remove('ready');
      start.textContent = state.paused ? 'Held' : (state.enemies.length + ' on the glass');
    } else {
      start.disabled = true;
      start.classList.remove('ready');
      start.textContent = 'The shift is over';
    }
  }
  const pauseBtn = document.getElementById('pauseBtn');
  if (pauseBtn) {
    pauseBtn.textContent = state.paused ? 'Resume' : 'Hold';
    pauseBtn.setAttribute('aria-pressed', state.paused ? 'true' : 'false');
    pauseBtn.disabled = state.phase !== 'combat';
  }
  const speedBtn = document.getElementById('speedBtn');
  if (speedBtn) speedBtn.textContent = state.speed + '×';
  syncPips();
}

function syncAll() {

function askNewNight() {
  if (state.phase === 'intro') return;
  if (state.phase === 'won' || state.phase === 'lost' || (state.phase === 'build' && state.waveIndex === 0 && !state.towers.length)) {
    beginFresh();
    return;
  }
  openConfirm();
}

function beginShift() {
  ensureAudio();
  state.phase = 'build';
  closeSheet();
  syncAll();
  toast('The plaster takes instruments. The glass does not.');
  announce('The night shift has begun.');
}

function beginFresh() {
  newGame((Math.random() * 0x100000000) >>> 0, false);
  ensureAudio();
  sfx('ui');
  toast('The pipes have dreamed a new route.');
}

function beginRetry() {
  newGame(state.seed, false);
  ensureAudio();
}

function ensureAudio() {
  if (!hasDom()) return null;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!state.audio) state.audio = new Ctx();
  if (state.audio.state === 'suspended') state.audio.resume();
  return state.audio;
}

let lastSfx = 0;
function sfx(kind) {
  if (state.muted || typeof window === 'undefined') return;
  const ctx = state.audio;
  if (!ctx) return;
  const nowMs = performance.now();
  if (kind === 'pop' && nowMs - lastSfx < 70) return;
  lastSfx = nowMs;
  const t = ctx.currentTime;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const map = {
    ui: [660, 0.04, 'sine', 0.03, 0],
    place: [520, 0.07, 'triangle', 0.04, 740],
    tune: [640, 0.12, 'triangle', 0.045, 980],
    sell: [420, 0.12, 'sine', 0.04, 180],
    deny: [180, 0.08, 'square', 0.02, 120],
    open: [330, 0.22, 'sine', 0.04, 660],
    clear: [523, 0.18, 'triangle', 0.04, 784],
    win: [523, 0.35, 'triangle', 0.05, 1046],
    leak: [140, 0.22, 'sawtooth', 0.03, 70],
    pop: [880, 0.04, 'sine', 0.02, 1200],
    quill: [980, 0.03, 'triangle', 0.015, 0],
    bell: [220, 0.28, 'sine', 0.03, 140],
    loom: [540, 0.06, 'triangle', 0.02, 0],
    fan: [760, 0.05, 'sawtooth', 0.012, 420],
    siphon: [150, 0.1, 'sine', 0.03, 90],
    comet: [180, 0.16, 'triangle', 0.04, 60],
    resign: [720, 0.14, 'sine', 0.03, 1280]
  };
  const spec = map[kind] || map.ui;
  o.type = spec[2];
  o.frequency.setValueAtTime(spec[0], t);
  if (spec[4]) o.frequency.exponentialRampToValueAtTime(Math.max(40, spec[4]), t + spec[1]);
  g.gain.setValueAtTime(spec[3], t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + spec[1]);
  o.connect(g);
  g.connect(ctx.destination);
  o.start(t);
  o.stop(t + spec[1] + 0.02);
}

function toggleMute() {
  state.muted = !state.muted;
  const btn = document.getElementById('muteBtn');
  btn.textContent = state.muted ? 'Muted' : 'Sound';
  btn.setAttribute('aria-pressed', state.muted ? 'true' : 'false');
  try { localStorage.setItem('iris-well-mute', state.muted ? '1' : '0'); } catch (err) { /* private mode */ }
  if (!state.muted) { ensureAudio(); sfx('ui'); }
}

function togglePause() {
  if (state.phase !== 'combat') return;
  state.paused = !state.paused;
  syncStatus();
}

function cycleSpeed() {
  state.speed = state.speed === 1 ? 2 : state.speed === 2 ? 3 : 1;
  syncStatus();
}

function cellFromEvent(e) {
  const canvas = document.getElementById('board');
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * COLS;
  const y = (e.clientY - rect.top) / rect.height * ROWS;
  const c = Math.floor(x), r = Math.floor(y);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;
  return { c, r };
}

function onCell(cell) {
  if (!cell || document.getElementById('modal').hidden === false) return;
  const tower = state.towers.find(t => t.c === cell.c && t.r === cell.r);
  if (tower) {
    state.selectedId = tower.id;
    syncDetail(true);
    return;
  }
  if (state.armed) placeAt(cell.c, cell.r);
  else {
    state.selectedId = null;
    syncDetail(true);
  }
}

function frame(ts) {
  const now = ts / 1000;
  if (!state.last) state.last = now;
  const raw = Math.min(0.05, now - state.last);
  state.last = now;
  state.time += raw;
  const modalOpen = hasDom() && document.getElementById('modal') && !document.getElementById('modal').hidden;
  if (state.phase === 'combat' && !state.paused && !modalOpen) {
    state.acc += raw * state.speed;
    let steps = 0;
    while (state.acc >= STEP && steps < 6 && state.phase === 'combat' && !state.paused && !modalOpen) {
      update(STEP);
      state.acc -= STEP;
      steps++;
    }
    if (steps === 6) state.acc = 0;
  } else state.acc = 0;
  updateFx(raw);
  render();
  if (state.phase === 'combat' || (state.resumeAt && performance.now() < state.resumeAt + 800)) syncStatus();
  requestAnimationFrame(frame);
}

function boot() {
  if (WAVES.length < 20) throw new Error('The docket is short.');
  TOWER_ORDER.forEach(id => {
    if (!TOWERS[id] || TOWERS[id].levels.length !== 5) throw new Error('Tunings missing for ' + id);
  });
  state.reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { state.muted = localStorage.getItem('iris-well-mute') === '1'; } catch (err) { state.muted = false; }
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.textContent = state.muted ? 'Muted' : 'Sound';
  muteBtn.setAttribute('aria-pressed', state.muted ? 'true' : 'false');

  const shop = document.getElementById('shop');
  TOWER_ORDER.forEach(id => {
    const def = TOWERS[id];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    btn.dataset.kind = id;
    btn.style.setProperty('--accent', def.accent);
    btn.innerHTML = '<i class="bar" style="background:' + def.accent + '"></i><span class="nm">' + esc(def.name) + '</span><span class="cost">' + def.cost + '</span><span class="role">' + esc(def.role) + '</span>';
    btn.addEventListener('click', () => arm(id));
    shop.appendChild(btn);
  });
  const pips = document.getElementById('pips');
  WAVES.forEach((w, i) => {
    const pip = document.createElement('i');
    pip.className = 'pip';
    pip.dataset.i = String(i);
    pip.title = w.name;
    pips.appendChild(pip);
  });

  document.getElementById('startBtn').addEventListener('click', () => { ensureAudio(); startWave(); });
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('speedBtn').addEventListener('click', cycleSpeed);
  document.getElementById('muteBtn').addEventListener('click', toggleMute);
  document.getElementById('ledgerBtn').addEventListener('click', () => { ensureAudio(); openLedger(); });
  document.getElementById('nightBtn').addEventListener('click', askNewNight);
  document.getElementById('modal').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'begin') beginShift();
    else if (act === 'close') closeSheet();
    else if (act === 'fresh') beginFresh();
    else if (act === 'retry') beginRetry();
  });

  const canvas = document.getElementById('board');
  let pointer = null;
  canvas.addEventListener('pointermove', (e) => { state.hover = cellFromEvent(e); });
  canvas.addEventListener('pointerleave', () => { state.hover = null; });
  canvas.addEventListener('pointerdown', (e) => {
    pointer = { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now(), cell: cellFromEvent(e) };
  });
  canvas.addEventListener('pointerup', (e) => {
    if (!pointer || pointer.id !== e.pointerId) return;
    const dist = Math.hypot(e.clientX - pointer.x, e.clientY - pointer.y);
    const tap = dist < 12 && Date.now() - pointer.t < 600;
    const cell = pointer.cell;
    pointer = null;
    if (tap) onCell(cell);
  });
  canvas.addEventListener('pointercancel', () => { pointer = null; });
  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    state.armed = null;
    syncShop();
    syncDetail(true);
  });

  window.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea')) return;
    const modalOpen = !document.getElementById('modal').hidden;
    const nums = { Digit1: 'quill', Digit2: 'bell', Digit3: 'loom', Digit4: 'fan', Digit5: 'siphon' };
    if (!modalOpen && nums[e.code]) arm(nums[e.code]);
    if (e.code === 'Escape') {
      if (modalOpen && state.phase !== 'intro' && state.phase !== 'won' && state.phase !== 'lost') closeSheet();
      else if (!modalOpen) {
        state.armed = null;
        state.selectedId = null;
        syncShop();
        syncDetail(true);
      }
    }
    if (e.code === 'Space' && !e.target.closest('button, a, summary')) {
      e.preventDefault();
      if (modalOpen) return;
      if (state.phase === 'build') { ensureAudio(); startWave(); }
      else togglePause();
    }
    if (!modalOpen && (e.key === 'u' || e.key === 'U')) upgradeSelected();
    if (!modalOpen && (e.key === 'm' || e.key === 'M')) toggleMute();
  });
  window.addEventListener('resize', layout);

  const seed = (Date.now() ^ (Math.random() * 0x100000000)) >>> 0;
  newGame(seed, true);
  layout();
  requestAnimationFrame(frame);
}

if (typeof window !== 'undefined') {
  boot();
}
</script>
</body>
</html>
