<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOLD FAST · a tower defense in old ink</title>
<meta name="description" content="An old sailor's tattoos wake at night to hold off the sea. A single-file tower defense: five tattoos, twenty-four bells, a different rope every night.">
<meta name="theme-color" content="#0f1819">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 20.6C3.2 14.4 3 8.6 5.6 6.1c2.1-2 5.1-1.3 6.4 1 1.3-2.3 4.3-3 6.4-1 2.6 2.5 2.4 8.3-6.4 14.5z' fill='%23c13a2c' stroke='%231c2130' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<!--
  HOLD FAST
  Every charm a sailor wears is bought on credit. Ned Curnow, A.B., is ashore for good, and the
  tide has come up the stairs to settle the account. You are the ink.

  One file, no dependencies, nothing loaded. Fonts, art and sound are all made here:
  the display lettering is a stroke alphabet, the drawings are canvas paths, the bell is arithmetic.
-->
<style>
:root {
  --wall: #0f1819; --wall2: #172527; --plank: #0a1112;
  --paper: #f1e5c7; --paper2: #e6d6b0; --paper3: #d9c69a;
  --ink: #1c2130; --ink2: #454b5c; --red: #c13a2c; --red2: #8e2a20; --gold: #e0a62b; --gold2: #f1d27c;
  --green: #3f7f5a; --blue: #33709b; --stencil: #6b52a6; --sea: #2f7f97;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Noto Serif", serif;
  --slab: Rockwell, "Rockwell Nova", "Roboto Slab", Clarendon, "Bookman Old Style", Georgia, "Noto Serif", serif;
  --hud: 52px; --side: 308px; --gap: 10px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
img { -webkit-user-drag: none; -webkit-touch-callout: none; }
body {
  background:
    radial-gradient(120% 90% at 50% 40%, rgba(40, 62, 64, 0.55), rgba(8, 13, 14, 0) 70%),
    repeating-linear-gradient(90deg, var(--wall) 0 118px, var(--plank) 118px 120px),
    var(--wall);
  color: var(--paper); font: 15px/1.45 var(--serif);
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold2); outline-offset: 2px; }
.ltr { display: block; overflow: visible; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
i, em { font-style: italic; }

#app {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: var(--sat) var(--sar) var(--sab) var(--sal);
  height: 100vh; height: 100dvh;
}

/* ---------------- top rail ---------------- */
#hud {
  flex: 0 0 var(--hud); display: flex; align-items: center; gap: 8px; padding: 0 10px;
  background: linear-gradient(#131f21, #0c1415); border-bottom: 2px solid #050909;
  box-shadow: 0 2px 0 rgba(255, 255, 255, 0.04) inset;
  position: relative; z-index: 5;
}
.chip {
  display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 7px;
  background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 5px;
  box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.55); font: 700 18px/1 var(--slab); font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.chip svg { width: 22px; height: 22px; flex: none; }
.chip b { min-width: 2ch; text-align: right; }
.chip.bump { animation: bump 0.32s ease-out; }
.chip.hurt { animation: hurt 0.5s ease-out; }
@keyframes bump { 30% { transform: translateY(-3px) scale(1.06); } }
@keyframes hurt { 0%, 40% { background: #f0b3a6; transform: translateX(-3px); } 20%, 60% { transform: translateX(3px); } }
#watch {
  flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 12px;
  color: var(--paper2);
}
#watchName { display: flex; align-items: center; }
#pips { display: flex; gap: 3px; align-items: center; }
#pips svg { width: 17px; height: 17px; display: block; }
#pips .pip path { fill: none; stroke: #6c7a78; stroke-width: 1.6; stroke-linejoin: round; }
#pips .pip.rung path { fill: var(--gold); stroke: #f6dc93; }
#pips .pip.now path { fill: var(--red); stroke: var(--gold2); animation: toll 1.1s ease-in-out infinite; transform-origin: 50% 10%; }
#pips .pip.sep { margin-left: 5px; }
@keyframes toll { 0%, 100% { transform: rotate(-11deg); } 50% { transform: rotate(11deg); } }
#bellWord { font: italic 14px/1 var(--serif); color: #b9c4bd; white-space: nowrap; }
.tools { display: flex; gap: 6px; }
.tool {
  width: 36px; height: 34px; display: grid; place-items: center; padding: 0;
  background: #1d2c2e; border: 2px solid #050909; border-radius: 5px; color: var(--paper2);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset, 2px 2px 0 rgba(0, 0, 0, 0.5);
  font: 700 14px/1 var(--slab);
}
.tool:hover { background: #273a3d; }
.tool:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.5); }
.tool svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tool[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
.tool.off { color: #6c7a78; }

/* ---------------- stage ---------------- */
#stage { flex: 1 1 auto; min-height: 0; display: flex; gap: var(--gap); padding: var(--gap); }
#board {
  position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; border-radius: 10px; overflow: hidden;
  background: #0a1011; box-shadow: 0 0 0 2px #050909, 0 10px 30px rgba(0, 0, 0, 0.5);
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
#board.placing #cv { cursor: crosshair; }

#banner {
  position: absolute; left: 50%; top: 13%; transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 8px; width: max-content; max-width: 94%;
  transition: opacity 0.35s, transform 0.35s; z-index: 3;
}
#banner.on { opacity: 1; transform: translate(-50%, 0); }
#banner .rib {
  background: var(--red); padding: 9px 34px 7px; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
  clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 50%, 100% 100%, 0 100%, 14px 50%);
  filter: drop-shadow(3px 4px 0 rgba(0, 0, 0, 0.45));
  max-width: 100%; overflow: hidden;
}
#banner .rib .ltr { max-width: 100%; height: auto; }
#banner .sub {
  font: italic 16px/1.25 var(--serif); color: var(--paper); text-align: center; max-width: 34em;
  background: rgba(12, 18, 19, 0.78); padding: 5px 14px 6px; border-radius: 4px;
}
#banner .sub:empty { display: none; }

#bossbar {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: min(430px, 76%);
  display: none; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; z-index: 2;
}
#bossbar.on { display: flex; }
#bossbar .nm { font: 700 13px/1 var(--slab); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); padding: 3px 9px 2px; border-radius: 3px; }
#bossbar .bar { width: 100%; height: 12px; background: #20262f; border: 2px solid var(--ink); border-radius: 3px; overflow: hidden; box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4); }
#bossbar .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(#58a9bd, var(--sea)); transform-origin: 0 50%; }

#toast {
  position: absolute; left: 50%; bottom: 12px; transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 10px; max-width: min(520px, 92%); z-index: 3;
  background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; padding: 7px 12px 7px 8px;
  box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5); transition: opacity 0.3s, transform 0.3s; font-size: 14px; line-height: 1.3;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast img { width: 40px; height: 40px; flex: none; }
#toast b { font: 700 13px/1.2 var(--slab); letter-spacing: 0.08em; text-transform: uppercase; display: block; }
#toast .new { color: var(--red); margin-right: 6px; }

.kn { fill: #e8cfa6; stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; }
.cuff { fill: var(--paper); stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; }
.stripe { fill: none; stroke: #234e70; stroke-width: 4.4; }
.cr { fill: none; stroke: rgba(28, 33, 48, 0.42); stroke-width: 1.7; stroke-linecap: round; }
.lt { fill: none; stroke: #bfae8c; stroke-width: 2.7; stroke-linejoin: round; }
.lt.lit { stroke: var(--ink); }
/* HOLD FAST: two fists, eight knuckles, eight letters */
#deck { flex: 0 0 auto; display: grid; grid-template-columns: 1fr; gap: 8px; }
#grip {
  display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 36px; padding: 3px 10px 2px; border-radius: 6px;
  background: var(--paper); border: 2px solid var(--ink); box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.55); color: var(--ink);
  transition: transform 0.12s;
}
#grip svg { display: block; width: 124px; height: 28px; flex: none; }
#grip small { font: 700 10px/1.1 var(--slab); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink2); }
#grip:disabled { cursor: default; }
#grip.ready { background: var(--gold2); animation: ready 1s ease-in-out infinite; }
#grip.ready small { color: var(--red2); }
#grip.ready:active { transform: translate(2px, 2px); }
#grip.used { animation: clench 0.4s ease-out; }
@keyframes ready { 50% { box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.55), 0 0 0 5px rgba(224, 166, 43, 0.45); } }
@keyframes clench { 30% { transform: scale(0.9); } }

/* ---------------- flash sheet (side) ---------------- */
#side {
  flex: 0 0 var(--side); min-height: 0; display: flex; flex-direction: column; gap: 8px; position: relative;
}
.sheet {
  background:
    radial-gradient(90% 60% at 20% 10%, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 60%),
    radial-gradient(60% 50% at 90% 95%, rgba(150, 110, 50, 0.22), rgba(150, 110, 50, 0) 70%),
    var(--paper);
  color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
}
#shop { display: grid; gap: 6px; padding: 8px; grid-template-columns: 1fr; }
.flash {
  position: relative; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; text-align: left;
  padding: 1px 8px 1px 4px; min-height: 46px; background: rgba(255, 255, 255, 0.28); border: 2px solid var(--ink); border-radius: 5px;
  box-shadow: 2px 2px 0 var(--ink); color: var(--ink); transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
}
.flash:hover { background: rgba(255, 255, 255, 0.6); }
.flash:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
.flash canvas { width: 44px; height: 44px; display: block; }
.flash .nm, .flash .rl { display: block; }
.flash { touch-action: none; }
.flash .nm { font: 700 14px/1.15 var(--slab); letter-spacing: 0.06em; text-transform: uppercase; }
.flash .rl { font: italic 12px/1.2 var(--serif); color: var(--ink2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flash .tx { min-width: 0; }
.flash .pr {
  min-width: 44px; height: 30px; display: grid; place-items: center; padding: 0 6px; border-radius: 15px;
  background: var(--gold); border: 2px solid var(--ink); font: 700 15px/1 var(--slab); font-variant-numeric: tabular-nums;
}
.flash kbd { position: absolute; left: 3px; top: 2px; font: 700 10px/1 var(--slab); color: var(--ink2); opacity: 0.75; }
.flash.poor { filter: saturate(0.35); }
.flash.poor .pr { background: #d8c9a6; color: var(--red2); }
.flash[aria-pressed="true"] { background: #e9e0f6; border-color: var(--stencil); box-shadow: 2px 2px 0 var(--stencil), 0 0 0 3px rgba(107, 82, 166, 0.3); }
.flash.nope { animation: nope 0.3s; }
@keyframes nope { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

#info { flex: 1 1 auto; min-height: 0; padding: 10px 12px; overflow: auto; font-size: 13.5px; line-height: 1.4; position: relative; scrollbar-width: thin; }
#info h3 { margin: 0 0 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#info .stars { color: var(--gold); -webkit-text-stroke: 0.6px var(--ink); letter-spacing: 1px; font-size: 15px; }
#info .stars s { color: #cdbd97; text-decoration: none; }
#info p { margin: 0 0 6px; }
#info .role { font: italic 13px/1.3 var(--serif); color: var(--ink2); }
#info .lore { font-style: italic; color: #4c4038; border-left: 3px solid var(--red); padding: 1px 0 1px 8px; margin: 4px 0 3px; }
#info .stats { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 4px 0; padding: 0; list-style: none; }
#info .stats li { background: rgba(28, 33, 48, 0.08); border: 1px solid rgba(28, 33, 48, 0.25); border-radius: 3px; padding: 1px 6px; font: 600 12px/1.5 var(--slab); white-space: nowrap; }
#info .stats li.pri { padding: 0; border: 1.5px dashed var(--stencil); background: rgba(107, 82, 166, 0.1); }
#info .stats li.pri button { font: inherit; color: var(--stencil); background: none; border: 0; padding: 0 6px; cursor: pointer; }
#info .stats li.pri button:hover { background: rgba(107, 82, 166, 0.14); }
#info .up { border: 2px dashed var(--stencil); border-radius: 5px; padding: 5px 8px 4px; margin: 6px 0 4px; background: rgba(107, 82, 166, 0.07); }
#info .up b { font: 700 13px/1.2 var(--slab); letter-spacing: 0.06em; text-transform: uppercase; color: var(--stencil); }
#info .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 -10px; padding: 6px 4px 10px 0; position: sticky; bottom: -10px; background: linear-gradient(rgba(241, 229, 199, 0), var(--paper) 7px); }
#info .tally2 { margin: 2px 0 0; }
#info .close { position: absolute; right: 6px; top: 6px; width: 28px; height: 28px; padding: 0; border: 0; background: none; font: 700 20px/1 var(--slab); color: var(--ink2); border-radius: 4px; }
#info .close:hover { background: rgba(28, 33, 48, 0.1); }
#info .kicker { font: 700 11px/1.2 var(--slab); letter-spacing: 0.16em; text-transform: uppercase; color: var(--red2); margin: 0 0 3px; }
#info .next { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 2px; }
.foe { display: flex; align-items: center; gap: 2px; padding: 1px 6px 1px 1px; border: 1.5px solid var(--ink); border-radius: 16px; background: rgba(47, 127, 151, 0.12); font: 700 12px/1 var(--slab); position: relative; color: var(--ink); }
.foe img { width: 28px; height: 28px; display: block; }
.foe.new { background: #f6dc93; }
.foe.new::after { content: "new"; position: absolute; right: -4px; top: -7px; background: var(--red); color: var(--paper); font: 700 9px/1 var(--slab); letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 4px; border-radius: 3px; border: 1px solid var(--ink); }
#info .newnote { margin: 5px 0 0; padding: 4px 7px; background: #f6dc93; border: 1.5px solid var(--ink); border-radius: 4px; font-size: 12.5px; }
#info .hint { color: var(--ink2); font-style: italic; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 4px 12px;
  background: var(--paper2); color: var(--ink); border: 2px solid var(--ink); border-radius: 5px; box-shadow: 3px 3px 0 var(--ink);
  font: 700 13px/1.1 var(--slab); letter-spacing: 0.07em; text-transform: uppercase; white-space: nowrap;
  transition: transform 0.07s, box-shadow 0.07s, background 0.15s;
}
.btn:hover { background: #f6ecd2; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.red { background: var(--red); color: var(--paper); }
.btn.red:hover { background: #d1483a; }
.btn.gold { background: var(--gold); }
.btn.gold:hover { background: var(--gold2); }
.btn.violet { background: var(--stencil); color: #fff; }
.btn.violet:hover { background: #7d64b8; }
.btn:disabled, .btn.dis { background: #cfc3a4; color: #7d776a; box-shadow: 3px 3px 0 #6e6a61; border-color: #6e6a61; cursor: not-allowed; }
.btn .n { font-variant-numeric: tabular-nums; }
.btn.big { min-height: 46px; font-size: 15px; padding: 6px 18px; }
.btn.arm { background: var(--red); color: var(--paper); }

#bell {
  flex: 0 0 auto; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 10px; text-align: left;
  min-height: 62px; padding: 6px 14px 6px 10px; background: var(--red); color: var(--paper); border: 2px solid var(--ink); border-radius: 6px;
  box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.55); transition: transform 0.07s, box-shadow 0.07s, background 0.15s;
}
#bell:hover { background: #d1483a; }
#bell:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.55); }
#bell svg.ico { width: 38px; height: 38px; grid-row: 1 / span 2; }
#bell .t { display: block; }
#bell .s { font: italic 13px/1.15 var(--serif); color: #f7dcd0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bell .mini { display: inline-flex; align-items: center; gap: 1px; font-style: normal; }
#bell .mini img { width: 19px; height: 19px; display: block; filter: drop-shadow(0 0 0.6px #f1e5c7) drop-shadow(0 0 0.6px #f1e5c7); }
#bell .mini b { font: 700 11.5px/1 var(--slab); margin-right: 6px; color: var(--paper); }
#bell.wait { background: #24383b; color: #b9c4bd; cursor: default; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4); }
#bell.wait .s { color: #92a09a; }
#bell.wait:active { transform: none; }
#bell.ring svg.ico { animation: toll 0.5s ease-in-out 3; transform-origin: 50% 8%; }
#bell.call { animation: call 1.6s ease-in-out infinite; }
@keyframes call { 50% { box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.55), 0 0 0 5px rgba(224, 166, 43, 0.4); } }

/* ---------------- sheets over everything ---------------- */
#veil {
  position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 14px;
  background: rgba(6, 10, 11, 0.74); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
#veil.on { display: grid; }
.card {
  position: relative; width: min(680px, 100%); max-height: 100%; overflow: auto; padding: 22px 26px 20px;
  background:
    radial-gradient(70% 40% at 15% 0%, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 70%),
    radial-gradient(60% 40% at 100% 100%, rgba(150, 110, 50, 0.25), rgba(150, 110, 50, 0) 70%),
    var(--paper);
  color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 7px 8px 0 rgba(0, 0, 0, 0.55);
  animation: pin 0.28s ease-out; scrollbar-width: thin;
}
.card.wide { width: min(860px, 100%); }
@keyframes pin { from { transform: translateY(14px) rotate(-0.6deg); opacity: 0; } }
.card::before, .card::after { content: ""; position: absolute; top: 8px; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f08a7d, var(--red) 55%, var(--red2)); border: 1.5px solid var(--ink); box-shadow: 1px 2px 0 rgba(0, 0, 0, 0.35); }
.card::before { left: 9px; } .card::after { right: 9px; }
.card h2 { margin: 0 0 8px; display: flex; justify-content: center; }
.card h2 .ltr { max-width: 100%; height: auto; }
.card p { margin: 0 0 10px; }
.card .lede { font-size: 17px; font-style: italic; text-align: center; margin-bottom: 12px; }
.card .story p { font-size: 15.5px; line-height: 1.5; }
.card .story p:first-child { font-style: italic; }
.card .story p:last-child { font-weight: 700; }
.card .story.plain p { font-style: normal; font-weight: 400; text-align: center; }
.card .acts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.card .acts.stick { position: sticky; bottom: -20px; margin: 12px -26px -20px; padding: 12px 26px 18px; background: var(--paper2); border-top: 1.5px dashed rgba(28, 33, 48, 0.4); z-index: 1; }
.card .fine { font-size: 12.5px; color: var(--ink2); text-align: center; margin: 12px 0 0; }
.card .fine a { color: var(--red2); white-space: nowrap; }
.card .x { position: absolute; right: 8px; top: 24px; width: 34px; height: 34px; padding: 0; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper2); font: 700 18px/1 var(--slab); color: var(--ink); box-shadow: 2px 2px 0 var(--ink); z-index: 2; }
.card .x:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.logo { display: flex; justify-content: center; margin: 2px 0 4px; }
.logo svg { width: min(430px, 100%); height: auto; filter: drop-shadow(4px 5px 0 rgba(28, 33, 48, 0.28)); }
.gripico svg { width: 70px; height: auto; display: block; }

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const hypot = Math.hypot;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

/* signed shortest turn from angle b to angle a, in (-PI, PI] */
function angDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
  return d;
}

/* small seeded generator, so a night can be replayed from its number */
function mulberry32(seed) {
  let a = seed >>> 0;

/* ======================================================================
   THE NIGHT ITSELF: simulation only, no drawing and no DOM.
   Everything visible is plain data on the Game; everything that happens
   is pushed to game.events for the page to draw and sound.
   ====================================================================== */
const R_TOWER = 30;       // footprint radius of a tattoo
const ROPE_HALF = 13;     // half the drawn width of the rope
const HEART_R = 46;
const STEP = 6;           // spacing of the rope's sample points
const BIRD_SLOTS = { 1: [[0, -3]], 2: [[-14, -5], [14, -5]], 3: [[0, -15], [-17, 6], [17, 6]] };

/* The skin is always about the same area; only its shape follows the screen.
   Phones get a smaller patch so tattoos stay big enough to press. */
function worldSize(aspect, compact) {
  const a = clamp(aspect, 0.6, 2.1), area = compact ? 600000 : 940000;
  const W = Math.round(Math.sqrt(area * a));
  return { W, H: Math.round(area / W) };
}

/* The rope: a self-avoiding walk on a coarse grid that never lets two lanes
   touch (so there is always skin between them), then smoothed into a curve
   and resampled every STEP units. It comes in from off the skin and ends at the heart. */
function genRope(rng, W, H, compact) {
  const m = 60, c0 = compact ? 78 : 98;
  const cols = Math.max(4, Math.floor((W - 2 * m) / c0)), rows = Math.max(4, Math.floor((H - 2 * m) / c0));
  const cw = (W - 2 * m) / cols, ch = (H - 2 * m) / rows, N = cols * rows;
  const want = Math.round(N * 0.33);
  const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
  let best = null, bestScore = -Infinity;

  for (let att = 0; att < 700; att++) {
    const vis = new Uint8Array(N), edge = (rng() * 4) | 0;
    let x, y, d;
    if (edge === 0) { x = 0; y = (rng() * rows) | 0; d = 0; }
    else if (edge === 1) { y = 0; x = (rng() * cols) | 0; d = 1; }
    else if (edge === 2) { x = cols - 1; y = (rng() * rows) | 0; d = 2; }
    else { y = rows - 1; x = (rng() * cols) | 0; d = 3; }
    const d0 = d, cells = [x, y];
    vis[y * cols + x] = 1;
    let turns = 0, run = 1;
    const stopAt = want + ((rng() * 5) | 0);
    const cand = [0, 0, 0], wts = [0, 0, 0];
    while (cells.length / 2 < stopAt) {
      let nc = 0, wsum = 0;
      const L = cells.length, px = L >= 4 ? cells[L - 4] : -9, py = L >= 4 ? cells[L - 3] : -9;
      for (let k = 0; k < 4; k++) {
        if (k === ((d + 2) & 3)) continue;
        if (L === 2 && k !== d0) continue;                      // first step runs straight in
        const nx = x + DX[k], ny = y + DY[k];
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows || vis[ny * cols + nx]) continue;
        let ok = true;                                          // no lane may touch another, even at a corner
        for (let oy = -1; oy <= 1 && ok; oy++) for (let ox = -1; ox <= 1; ox++) {
          const tx = nx + ox, ty = ny + oy;
          if ((!ox && !oy) || tx < 0 || ty < 0 || tx >= cols || ty >= rows || !vis[ty * cols + tx]) continue;
          if ((tx === x && ty === y) || (tx === px && ty === py)) continue;
          ok = false; break;
        }
        if (!ok) continue;
        const w = k === d ? (run >= 3 ? 0.45 : 1.3) : 1;
        cand[nc] = k; wts[nc] = w; wsum += w; nc++;
      }
      if (!nc) break;
      let r = rng() * wsum, pick = cand[nc - 1];
      for (let i = 0; i < nc; i++) { r -= wts[i]; if (r <= 0) { pick = cand[i]; break; } }
      if (pick !== d) { turns++; run = 1; } else run++;
      d = pick; x += DX[d]; y += DY[d]; vis[y * cols + x] = 1; cells.push(x, y);
    }
    const len = cells.length / 2;
    let x0 = 99, x1 = -1, y0 = 99, y1 = -1;
    for (let i = 0; i < len; i++) {
      const cx = cells[2 * i], cy = cells[2 * i + 1];
      if (cx < x0) x0 = cx; if (cx > x1) x1 = cx; if (cy < y0) y0 = cy; if (cy > y1) y1 = cy;
    }
    const spread = ((x1 - x0 + 1) / cols) * ((y1 - y0 + 1) / rows);
    const score = -Math.abs(len - (want + 2)) * 3 + Math.min(turns, len * 0.45) * 1.2 + spread * 14 + rng() * 2
      - (len < want * 0.75 ? 50 : 0);
    if (score > bestScore) { bestScore = score; best = { cells, d0 }; }
  }

  /* waypoints: an entry point off the skin, then the (slightly wandering) cell centres */
  const cells = best.cells, n = cells.length / 2, d0 = best.d0, wp = [];
  const cx = i => m + (cells[2 * i] + 0.5) * cw, cy = i => m + (cells[2 * i + 1] + 0.5) * ch;
  const out = ((d0 & 1) ? m + ch * 0.5 : m + cw * 0.5) + 84;
  wp.push({ x: cx(0) - DX[d0] * out, y: cy(0) - DY[d0] * out });
  for (let i = 0; i < n; i++) {
    const j = (i === 0 || i === n - 1) ? 0 : 0.17;
    wp.push({ x: cx(i) + (rng() * 2 - 1) * j * cw, y: cy(i) + (rng() * 2 - 1) * j * ch });
  }

  /* Catmull-Rom through the waypoints, then even spacing */
  const dense = [], P = i => wp[clamp(i, 0, wp.length - 1)];
  for (let i = 0; i < wp.length - 1; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let k = 0; k < 16; k++) {
      const t = k / 16, t2 = t * t, t3 = t2 * t;
      dense.push({
        x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
      });
    }
  }
  dense.push(wp[wp.length - 1]);
  const pts = [{ x: dense[0].x, y: dense[0].y }];
  let acc = 0;
  for (let i = 1; i < dense.length; i++) {
    let ax = dense[i - 1].x, ay = dense[i - 1].y;
    const bx = dense[i].x, by = dense[i].y;
    let seg = hypot(bx - ax, by - ay);
    while (acc + seg >= STEP) {
      const t = (STEP - acc) / seg;
      ax += (bx - ax) * t; ay += (by - ay) * t;
      pts.push({ x: ax, y: ay });
      seg = hypot(bx - ax, by - ay); acc = 0;
    }
    acc += seg;
  }
  const len = (pts.length - 1) * STEP;
  return { pts, len, leakS: len - 34, cells, cols, rows, entry: d0 };
}

class Game {
  constructor(o) {
    o = o || {};
    this.seed = (o.seed >>> 0) || 1;
    this.tierKey = Object.prototype.hasOwnProperty.call(TIERS, o.tier) ? o.tier : 'able';
    this.tier = TIERS[this.tierKey];
    this.compact = !!o.compact;
    this.rng = mulberry32(this.seed);
    const ws = worldSize(o.aspect || 1.6, this.compact);
    this.W = ws.W; this.H = ws.H;
    this.rope = genRope(this.rng, this.W, this.H, this.compact);
    const end = this.rope.pts[this.rope.pts.length - 1];
    this.hx = end.x; this.hy = end.y;
    this.luck = this.tier.luck;
    this.heart = this.heartMax = this.tier.heart;
    this.wave = 0;             // bells already struck and survived
    this.phase = 'build';      // build | wave | won | lost
    this.time = 0; this.waveTime = 0;
    this.towers = []; this.enemies = []; this.shots = []; this.queue = []; this.blockers = [];
    this.events = []; this.nextId = 1;
    this.grip = 0;             // HOLD FAST charge, 0..1
    this.saveUsed = false;
    this.hpMul = 1; this.armMul = 1; this.meleeMul = 1;
    this.seen = {};
    this.stats = { kills: 0, leaked: 0, earned: 0, spent: 0, grips: 0, saves: 0, dmg: {} };
    this._p = { x: 0, y: 0, a: 0 };
  }

  ev(type, data) { data = data || {}; data.type = type; this.events.push(data); }

  /* ---------------- the rope ---------------- */
  posAt(s, out) {
    const pts = this.rope.pts, f = clamp(s, 0, this.rope.len) / STEP;
    const i = Math.min(f | 0, pts.length - 2), t = f - i, a = pts[i], b = pts[i + 1];
    out.x = a.x + (b.x - a.x) * t; out.y = a.y + (b.y - a.y) * t;
    out.a = Math.atan2(b.y - a.y, b.x - a.x);
    return out;
  }
  nearest(x, y) {
    const pts = this.rope.pts;
    let bi = 0, bd = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const dx = pts[i].x - x, dy = pts[i].y - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; bi = i; }
    }
    let best = { s: bi * STEP, d: Math.sqrt(bd), x: pts[bi].x, y: pts[bi].y };
    for (let i = Math.max(0, bi - 1); i <= Math.min(pts.length - 2, bi); i++) {
      const a = pts[i], b = pts[i + 1], vx = b.x - a.x, vy = b.y - a.y;
      const t = clamp(((x - a.x) * vx + (y - a.y) * vy) / (vx * vx + vy * vy || 1), 0, 1);
      const qx = a.x + vx * t, qy = a.y + vy * t, d = hypot(qx - x, qy - y);
      if (d < best.d) best = { s: (i + t) * STEP, d, x: qx, y: qy };
    }
    return best;
  }
  locate(e) {
    const p = this.posAt(e.s, this._p), c = Math.cos(p.a), s = Math.sin(p.a);
    e.x = p.x - s * e.lat; e.y = p.y + c * e.lat; e.a = p.a;
  }

  /* ---------------- inking, touching up, wiping off ---------------- */
  canPlace(type, x, y, ignore) {
    const T = TOWERS[type];
    if (!T) return { ok: false, why: '' };
    if (x < R_TOWER || y < R_TOWER || x > this.W - R_TOWER || y > this.H - R_TOWER) return { ok: false, why: 'Off the skin' };
    const n = this.nearest(x, y);
    if (n.d < ROPE_HALF + R_TOWER - 3) return { ok: false, why: 'On the rope', near: n };
    if (hypot(x - this.hx, y - this.hy) < HEART_R + R_TOWER - 4) return { ok: false, why: 'Too near the heart', near: n };
    for (const tw of this.towers) {
      if (tw !== ignore && hypot(tw.x - x, tw.y - y) < R_TOWER * 2 - 4) return { ok: false, why: 'Over another tattoo', near: n };
    }
    if (type === 'pig' && n.d > T.lv[0].reach) return { ok: false, why: 'Too far from the rope', near: n };
    return { ok: true, near: n };
  }

  place(type, x, y) {
    const T = TOWERS[type];
    if (!T || this.luck < T.cost || this.phase === 'won' || this.phase === 'lost') return null;
    const c = this.canPlace(type, x, y);
    if (!c.ok) return null;
    this.luck -= T.cost; this.stats.spent += T.cost;
    const tw = {
      id: this.nextId++, type, x, y, lvl: 0, spent: T.cost, fresh: this.phase === 'build' ? T.cost : 0,
      pri: T.pri, cd: 0.35, born: this.time, sleepUntil: 0, calm: 1, kills: 0, dmg: 0, face: -Math.PI / 2, fireT: -9,
    };
    if (type === 'swallow') tw.birds = [];
    else if (type === 'anchor') tw.an = { st: 0, x, y, a: 0, tgt: null };
    else if (type === 'light') tw.ang = this.rng() * TAU;
    else if (type === 'clipper') tw.salvo = null;
    else if (type === 'pig') {
      tw.rallyS = clamp(c.near.s, 40, this.rope.leakS - 30);
      tw.units = [this.makeUnit(tw, 'pig', -9, 5), this.makeUnit(tw, 'cock', 9, -5)];
    }
    this.towers.push(tw);
    this.refit(tw);
    this.ev('place', { tw });
    return tw;
  }
  makeUnit(tw, kind, ds, lat) {
    const u = { tw, kind, s: tw.rallyS + ds, lat, x: tw.x, y: tw.y, rx: 0, ry: 0, hp: 1, max: 1, cap: 1, alive: true, hop: 0, respawn: 0, cd: 0.3, eng: [], hurtT: -9, face: 1, hitT: -9 };
    const p = this.posAt(u.s, {}), c = Math.cos(p.a), s = Math.sin(p.a);
    u.rx = p.x - s * lat; u.ry = p.y + c * lat;
    return u;
  }
  /* bring a tattoo's moving parts in line with its level */
  refit(tw) {
    const L = TOWERS[tw.type].lv[tw.lvl];
    if (tw.type === 'swallow') {
      const slots = BIRD_SLOTS[L.birds];
      while (tw.birds.length < L.birds) tw.birds.push({ st: 0, x: tw.x, y: tw.y, a: -0.4, tgt: null, rest: 0.2 + 0.25 * tw.birds.length, left: 0, dm: 0, px: 0, py: 0 });
      tw.birds.forEach((b, i) => { b.px = slots[i][0]; b.py = slots[i][1]; if (b.st === 0) { b.x = tw.x + b.px; b.y = tw.y + b.py; } });
    } else if (tw.type === 'pig') {
      for (const u of tw.units) {
        const S = L[u.kind], was = u.max;
        u.max = S.hp; u.cap = S.cap;
        u.hp = u.alive ? Math.min(u.max, u.hp + (u.max - was)) : u.max;
      }
    }
    this.blockers = [];
    for (const t of this.towers) if (t.type === 'pig') for (const u of t.units) this.blockers.push(u);
  }
  upCost(tw) { const u = TOWERS[tw.type].ups[tw.lvl]; return u ? u.cost : null; }
  upgrade(tw) {
    const u = TOWERS[tw.type].ups[tw.lvl];
    if (!u || this.luck < u.cost || this.phase === 'won' || this.phase === 'lost') return false;
    this.luck -= u.cost; this.stats.spent += u.cost;
    tw.spent += u.cost; if (this.phase === 'build') tw.fresh += u.cost;
    tw.lvl++;
    this.refit(tw);
    this.ev('upgrade', { tw });
    return true;
  }
  /* luck spent since the last bell comes back whole (the stencil wipes off); older ink at a discount */
  sellValue(tw) { return Math.round(tw.fresh + (tw.spent - tw.fresh) * SELL_BACK); }
  sell(tw) {
    const i = this.towers.indexOf(tw);
    if (i < 0 || this.phase === 'won' || this.phase === 'lost') return false;
    if (tw.units) for (const u of tw.units) { for (const e of u.eng) e.blk = null; u.eng.length = 0; u.alive = false; }
    this.towers.splice(i, 1);
    const v = this.sellValue(tw);
    this.luck += v;
    tw.sold = true;
    this.refit(tw);
    this.ev('sell', { tw, v });
    return true;
  }

  /* ---------------- bells ---------------- */
  startWave() {
    if (this.phase !== 'build' || this.wave >= WAVES.length) return false;
    this.phase = 'wave'; this.waveTime = 0; this.saveUsed = false;
    for (const tw of this.towers) tw.fresh = 0;
    this.hpMul = hpCurve(this.wave) * this.tier.hp * (this.compact ? COMPACT_HP : 1);
    this.armMul = 1 + 0.05 * this.wave;
    this.meleeMul = 1 + 0.05 * this.wave;
    const q = [];
    for (const g of WAVES[this.wave].groups) for (let i = 0; i < g[1]; i++) q.push({ t: g[3] + i * g[2], type: g[0] });
    q.sort((a, b) => b.t - a.t);
    this.queue = q;
    this.ev('waveStart', { n: this.wave });
    return true;
  }
  endWave() {
    const bonus = waveBonus(this.wave);
    this.luck += bonus; this.stats.earned += bonus;
    this.wave++;
    this.phase = this.wave >= WAVES.length ? 'won' : 'build';
    this.ev('waveEnd', { n: this.wave - 1, bonus });
    if (this.phase === 'won') this.ev('won');
  }
  remaining() { return this.queue.length + this.enemies.length; }

  /* HOLD FAST: both fists close, and everything on the rope is gripped where it stands */
  holdFast() {
    if (this.grip < 1 || this.phase !== 'wave') return false;
    this.grip = 0; this.stats.grips++;
    const es = this.enemies;
    for (let i = 0; i < es.length; i++) {
      const e = es[i];
      if (e.dead || e.gone || e.born === this.time) continue;    // not what this same grip just burst out of something
      this.stun(e, e.boss ? 1.4 : 3, true);
      this.hurt(e, 14 + e.max * (e.boss ? 0.03 : 0.1), 1, null);
    }
    this.ev('holdfast');
    return true;
  }

  /* ---------------- collectors ---------------- */
  spawn(type, s) {
    const E = ENEMIES[type], r = this.rng;
    const e = {
      id: this.nextId++, type, E, s, x: 0, y: 0, a: 0, v: 0,
      lat: E.boss ? 0 : (r() * 2 - 1) * 6,
      hp: E.hp * this.hpMul, max: E.hp * this.hpMul,
      armor: (E.armor || 0) * this.armMul, melee: (E.melee || 0) * this.meleeMul,
      speed: E.speed * this.tier.speed * (0.94 + r() * 0.12),
      fly: !!E.fly, boss: !!E.boss,
      slowUntil: 0, slowAmt: 0, stunUntil: 0, stunImm: 0, hook: null, hookImm: 0,
      reveal: 0, shroud: false, haste: 1, blk: null,
      burnUntil: 0, burnDps: 0, burnBy: null, vulnUntil: 0, shredUntil: 0, lit: null,
      tmr: E.every ? E.every * (0.45 + 0.55 * r()) : 0, open: 0,
      born: this.time, hitT: -9, wob: r() * TAU, dead: false, gone: false,
    };
    this.locate(e);
    this.enemies.push(e);
    if (!this.seen[type]) { this.seen[type] = true; this.ev('met', { kind: type }); }
    if (E.boss) this.ev('boss', { e });
    return e;
  }

  stun(e, dur, force) {
    const now = this.time;
    if (!force) {
      if (e.E.ghost || now < e.stunImm) return;
      if (e.boss) dur *= 0.3;
    }
    e.stunUntil = Math.max(e.stunUntil, now + dur);
    e.stunImm = e.stunUntil + 2.5;
  }
  unblock(e) {
    const u = e.blk;
    if (!u) return;
    const i = u.eng.indexOf(e);
    if (i >= 0) u.eng.splice(i, 1);
    e.blk = null;
  }

  /* pierce: 0 = shell counts in full, 1 = shell ignored */
  hurt(e, amt, pierce, tw) {
    if (e.dead || e.gone) return 0;
    let armor = e.armor;
    if (e.type === 'locker' && e.open > 0) armor = 0;
    if (e.shredUntil > this.time) armor *= 0.4;
    armor *= 1 - (pierce || 0);
    let d = Math.max(amt - armor, amt * 0.2);
    if (e.vulnUntil > this.time) d *= 1.35;
    e.hp -= d; e.hitT = this.time;
    if (tw) { tw.dmg += d; this.stats.dmg[tw.type] = (this.stats.dmg[tw.type] || 0) + d; }
    if (e.hp <= 0) this.kill(e, tw);
    return d;
  }
  kill(e, tw) {
    e.dead = true;
    this.unblock(e);
    const b = e.E.bounty;
    this.luck += b; this.stats.earned += b; this.stats.kills++;
    if (tw) tw.kills++;
    this.grip = Math.min(1, this.grip + GRIP_PER_KILL);
    this.ev('kill', { e, x: e.x, y: e.y, bounty: b });
    if (e.E.split) {
      for (let i = 0; i < e.E.splitN; i++) {
        const c = this.spawn(e.E.split, Math.max(0, e.s - i * 10));
        c.lat = (i - (e.E.splitN - 1) / 2) * 7; this.locate(c);
      }
    }
  }
  leak(e) {
    if (!this.saveUsed) {                 // Neither Shall Drown
      const tw = this.towers.find(t => t.type === 'pig' && t.lvl >= 4 && t.sleepUntil <= this.time);
      if (tw) {
        this.saveUsed = true; this.stats.saves++;
        this.unblock(e);
        const x0 = e.x, y0 = e.y;
        e.s = Math.max(0, tw.rallyS - 44);
        e.hook = null;
        this.stun(e, 1.2, true);
        this.locate(e);
        this.ev('save', { e, tw, x0, y0 });
        return;
      }
    }
    e.gone = true;
    this.unblock(e);
    this.heart -= e.E.lives; this.stats.leaked++;
    this.ev('leak', { e, n: e.E.lives });
    if (this.heart <= 0) { this.heart = 0; this.phase = 'lost'; this.ev('lost'); }
  }

  /* fog, fast water and dead calm are recomputed every tick from whoever is still walking */
  auras(now) {
    const es = this.enemies;
    let fogs = null, rips = null, calms = null;
    for (let i = 0; i < es.length; i++) {
      const e = es[i], k = e.E.aura;
      if (!k || e.dead || e.gone) continue;
      if (k === 'fog') (fogs || (fogs = [])).push(e);
      else if (k === 'haste') (rips || (rips = [])).push(e);
      else if (k === 'calm') (calms || (calms = [])).push(e);
    }
    for (let i = 0; i < es.length; i++) {
      const e = es[i];
      let sh = false, h = 1;
      if (fogs && !e.boss && e.E.aura !== 'fog' && e.reveal <= now) {
        for (let j = 0; j < fogs.length; j++) {
          const f = fogs[j], dx = f.x - e.x, dy = f.y - e.y;
          if (dx * dx + dy * dy < f.E.auraR * f.E.auraR) { sh = true; break; }
        }
      }
      if (rips && !e.boss) {
        for (let j = 0; j < rips.length; j++) {
          const f = rips[j];
          if (f === e) continue;
          const dx = f.x - e.x, dy = f.y - e.y;
          if (dx * dx + dy * dy < f.E.auraR * f.E.auraR && f.E.auraAmt > h) h = f.E.auraAmt;
        }
      }
      e.shroud = sh; e.haste = h;
    }
    for (const tw of this.towers) {
      let c = 1;
      if (calms) for (let j = 0; j < calms.length; j++) {
        const f = calms[j];
        if (hypot(f.x - tw.x, f.y - tw.y) < f.E.auraR) { c = f.E.auraAmt; break; }
      }
      tw.calm = c;
    }
  }

  special(e, now) {
    switch (e.E.special) {
      case 'blink': {
        const x0 = e.x, y0 = e.y;
        e.s += 70;
        if (e.s >= this.rope.leakS) { this.leak(e); return; }
        this.locate(e);
        this.ev('blink', { x0, y0, x: e.x, y: e.y });
        break;
      }
      case 'sing': {
        let best = null, bd = 175;
        for (const tw of this.towers) {
          if (tw.sleepUntil > now) continue;
          const d = hypot(tw.x - e.x, tw.y - e.y);
          if (d < bd) { bd = d; best = tw; }
        }
        if (best) { best.sleepUntil = now + 3.5; this.ev('sing', { e, tw: best }); }
        else e.tmr = 1;
        break;
      }
      case 'shed':
        for (let i = 0; i < 2; i++) { const c = this.spawn('corposant', Math.max(0, e.s - 8 - i * 12)); c.hp = c.max = c.max * 0.7; }
        this.ev('shed', { e });
        break;
      case 'loose':
        for (let i = 0; i < 3; i++) this.spawn('petrel', Math.max(0, e.s - 6 - i * 12));
        this.ev('shed', { e });
        break;
      case 'payout':
        e.open = 4.5; e.tmr += 4.5;
        for (let i = 0; i < 2; i++) {                      // the drowned it pays out are thinner than the living crew
          const c = this.spawn('shipmate', Math.max(0, e.s + 14 + i * 13));
          c.hp = c.max = c.max * 0.55;
        }
        this.ev('payout', { e });
        break;
    }
  }

  stepEnemy(e, dt, now) {
    if (e.dead || e.gone) return;
    const E = e.E;
    if (e.burnUntil > now) { this.hurt(e, e.burnDps * dt, 1, e.burnBy); if (e.dead) return; }
    if (e.open > 0) e.open -= dt;

    if (e.hook) {                          // on the anchor: hauled back, then held
      const h = e.hook;
      h.t += dt;
      if (h.t < h.dur) e.s = lerp(h.from, h.to, easeInOut(h.t / h.dur));
      else {
        e.s = h.to;
        if (h.t >= h.dur + h.hold) { e.hook = null; e.hookImm = now + HOOK_IMMUNE; }
      }
      e.v = 0;
      this.locate(e);
      return;
    }
    const stunned = e.stunUntil > now;
    if (E.every && !stunned) {
      e.tmr -= dt;
      if (e.tmr <= 0) { e.tmr += E.every; this.special(e, now); if (e.dead || e.gone) return; }
    }
    if (e.blk) {                           // held by the pig or the rooster
      const u = e.blk;
      if (!u.alive) this.unblock(e);
      else {
        if (!stunned) {
          u.hp -= e.melee * dt; u.hurtT = now;
          if (u.hp <= 0) this.unitDown(u);
        }
        e.v = 0;
        return;
      }
    }
    if (stunned) { e.v = 0; return; }
    let v = e.speed * e.haste;
    if (e.slowUntil > now && !E.firm) v *= 1 - e.slowAmt;
    if (e.open > 0) v = 0;
    e.v = v;
    e.s += v * dt;
    if (e.s >= this.rope.leakS) { this.leak(e); return; }
    this.locate(e);
    if (!e.fly && !e.boss && !E.ghost) {
      const bl = this.blockers;
      for (let i = 0; i < bl.length; i++) {
        const u = bl[i];
        if (!u.alive || u.hop < 1 || u.eng.length >= u.cap) continue;
        const ds = e.s - u.s;
        if (ds >= -13 && ds <= 3) { e.blk = u; u.eng.push(e); break; }
      }
    }
  }
  unitDown(u) {
    u.alive = false; u.hp = 0;
    u.respawn = TOWERS.pig.lv[u.tw.lvl].respawn;
    for (const e of u.eng) e.blk = null;
    u.eng.length = 0;
    this.ev('unitDown', { u });
  }

  /* choose a mark. o: { air, ground, min, pri, score(e, v) } */
  pick(x, y, range, o) {
    const es = this.enemies;
    let best = null, bv = -Infinity;
    for (let i = 0; i < es.length; i++) {
      const e = es[i];
      if (e.dead || e.gone) continue;
      if (e.fly ? !o.air : o.ground === false) continue;
      const d = hypot(e.x - x, e.y - y), r = e.shroud ? range * 0.5 : range;
      if (d > r || (o.min && d < o.min)) continue;
      let v;
      if (o.pri === 'last') v = -e.s;
      else if (o.pri === 'strong') v = e.hp + e.s * 1e-3;
      else if (o.pri === 'near') v = -d;
      else v = e.s;
      if (o.score) v = o.score(e, v);
      if (v > bv) { bv = v; best = e; }
    }
    return best;
  }

  /* ---------------- tattoos at work ---------------- */
  stepSwallows(tw, dt, now, asleep, L) {
    for (const b of tw.birds) {
      if (b.st === 0) {                                   // on the skin
        b.x = tw.x + b.px; b.y = tw.y + b.py;
        if (b.rest > 0) { b.rest -= dt; continue; }
        if (asleep) continue;
        const t = this.pick(tw.x, tw.y, L.range, { air: true, pri: tw.pri });
        if (t) { b.st = 1; b.tgt = t; b.left = L.strikes; b.dm = L.dmg; tw.fireT = now; }
        continue;
      }
      if (b.st === 1) {
        let t = b.tgt;
        if (asleep) { b.st = 2; b.tgt = null; }
        else if (!t || t.dead || t.gone || hypot(t.x - tw.x, t.y - tw.y) > L.range * 1.5) {
          const lim = L.range * 1.3;
          t = this.pick(b.x, b.y, 130, { air: true, pri: 'near', score: (e, v) => (hypot(e.x - tw.x, e.y - tw.y) > lim ? -Infinity : v) });
          b.tgt = t;
          if (!t) b.st = 2;
        }
      }
      const out = b.st === 1;
      const gx = out ? b.tgt.x : tw.x + b.px, gy = out ? b.tgt.y : tw.y + b.py;
      const dx = gx - b.x, dy = gy - b.y, d = hypot(dx, dy), sl = L.fly * (out ? 1 : 1.15) * dt;
      if (d <= sl + (out ? 7 : 0)) {
        if (out) {
          const e = b.tgt;
          this.hurt(e, b.dm, 0, tw);
          this.ev('peck', { x: e.x, y: e.y });
          if (e.dead && L.soul) { this.luck += L.soul; this.stats.earned += L.soul; this.ev('soul', { x: e.x, y: e.y, n: L.soul }); }
          b.left--;
          if (b.left > 0) {
            const lim = L.range * 1.3;
            const n2 = this.pick(e.x, e.y, 115, { air: true, pri: 'near', score: (c, v) => (c === e || hypot(c.x - tw.x, c.y - tw.y) > lim ? -Infinity : v) });
            if (n2) { b.tgt = n2; b.dm = L.dmg * 0.7; continue; }
          }
          b.st = 2; b.tgt = null;
        } else { b.st = 0; b.rest = L.rest; b.x = gx; b.y = gy; }
      } else {
        b.x += dx / d * sl; b.y += dy / d * sl; b.a = Math.atan2(dy, dx);
      }
    }
  }

  stepAnchor(tw, dt, now, asleep, L) {
    const a = tw.an;
    if (a.st === 0) {
      a.x = tw.x; a.y = tw.y;
      tw.cd -= dt;
      if (tw.cd > 0 || asleep) return;
      const t = this.pick(tw.x, tw.y, L.range, {
        air: false, pri: tw.pri,
        score: (e, v) => (e.hook ? -Infinity : (e.hookImm > now || e.E.ghost) ? v - 1e7 : v),
      });
      if (!t) return;
      a.st = 1; a.tgt = t; tw.fireT = now;
      this.ev('anchorThrow', { tw });
      return;
    }
    if (a.st === 1) {
      let t = a.tgt;
      if (!t || t.dead || t.gone) {
        t = this.pick(a.x, a.y, 140, { air: false, pri: 'near' });
        a.tgt = t;
        if (!t) { a.st = 3; return; }
      }
      const dx = t.x - a.x, dy = t.y - a.y, d = hypot(dx, dy), sl = 600 * dt;
      if (d > sl + 8) { a.x += dx / d * sl; a.y += dy / d * sl; a.a = Math.atan2(dy, dx); return; }
      a.x = t.x; a.y = t.y;
      this.ev('anchorHit', { x: t.x, y: t.y, tw, big: !!L.stun });
      if (L.stun) {
        const es = this.enemies;
        for (let i = 0; i < es.length; i++) {
          const e = es[i];
          if (e !== t && !e.dead && !e.gone && !e.fly && hypot(e.x - t.x, e.y - t.y) < L.stunR) this.stun(e, L.stun);
        }
      }
      this.hurt(t, L.dmg, 1, tw);
      if (!t.dead) {
        if (!t.E.ghost && t.hookImm <= now && !t.hook) {
          const pull = L.drag * (t.boss ? 0.25 : t.E.heavy ? 0.5 : 1);
          if (L.vuln) t.vulnUntil = now + 4;              // moored: for a few breaths everything hurts it more
          this.unblock(t);
          t.hook = { from: t.s, to: Math.max(0, t.s - pull), t: 0, dur: 0.55, hold: L.moor || 0.15 };
          a.st = 2;
          return;
        }
      }
      a.st = 3;
      return;
    }
    if (a.st === 2) {                                     // riding with its catch
      const t = a.tgt;
      if (!t || t.dead || t.gone || !t.hook || t.hook.t >= t.hook.dur) { a.st = 3; return; }
      a.x = t.x; a.y = t.y;
      return;
    }
    const dx = tw.x - a.x, dy = tw.y - a.y, d = hypot(dx, dy), sl = 720 * dt;   // coming home
    if (d <= sl) { a.st = 0; a.x = tw.x; a.y = tw.y; a.tgt = null; tw.cd = L.cd; }
    else { a.x += dx / d * sl; a.y += dy / d * sl; a.a = Math.atan2(-dy, -dx); }
  }

  stepLight(tw, dt, now, asleep, L) {
    tw.ang = (tw.ang + TAU / L.period * dt) % TAU;
    if (asleep) return;
    const es = this.enemies, gap = L.period / L.beams * 0.6, r2 = L.range * L.range;
    for (let i = 0; i < es.length; i++) {
      const e = es[i];
      if (e.dead || e.gone) continue;
      const dx = e.x - tw.x, dy = e.y - tw.y;
      if (dx * dx + dy * dy > r2) continue;
      const lit = e.lit || (e.lit = {});
      if (now - (lit[tw.id] || -99) < gap) continue;
      const phi = Math.atan2(dy, dx);
      for (let k = 0; k < L.beams; k++) {
        if (Math.abs(angDiff(tw.ang + k * TAU / L.beams, phi)) > L.half) continue;
        lit[tw.id] = now;
        e.reveal = now + L.reveal;
        if (!e.E.firm) {
          const amt = L.slow * (e.boss ? 0.5 : 1);
          if (!(e.slowUntil > now && e.slowAmt > amt)) e.slowAmt = amt;
          e.slowUntil = Math.max(e.slowUntil, now + L.slowT);
        }
        if (L.burn) { e.burnUntil = now + 3; e.burnDps = L.burn; e.burnBy = tw; }
        tw.fireT = now;
        this.ev('flash', { x: e.x, y: e.y });
        this.hurt(e, L.dmg * (e.E.aura === 'fog' ? 3 : 1), 0.5, tw);
        break;
      }
    }
  }

  stepClipper(tw, dt, now, asleep, L) {
    const sv = tw.salvo;
    if (sv) {
      sv.t -= dt;
      while (tw.salvo && sv.t <= 0) {
        this.fireBall(tw, L, sv);
        sv.i++;
        if (sv.i >= L.guns) tw.salvo = null; else sv.t += 0.13;
      }
      return;
    }
    tw.cd -= dt;
    if (tw.cd > 0 || asleep) return;
    const t = this.pick(tw.x, tw.y, L.range, { air: false, min: L.min, pri: tw.pri });
    if (!t) return;
    tw.cd = L.cd;
    tw.salvo = { i: 0, t: 0, tgt: t, s: t.s };
    tw.face = Math.atan2(t.y - tw.y, t.x - tw.x);
  }
  fireBall(tw, L, sv) {
    const t = sv.tgt, live = t && !t.dead && !t.gone, dur = 0.62;
    if (live) sv.s = t.s;
    const lead = live && !t.hook ? t.v : 0;
    const p = this.posAt(clamp(sv.s + lead * dur + (sv.i - (L.guns - 1) / 2) * 15, 0, this.rope.len), {});
    const r = this.rng;
    this.shots.push({ x0: tw.x, y0: tw.y, x1: p.x + (r() - 0.5) * 10, y1: p.y + (r() - 0.5) * 10, t: 0, dur, L, tw });
    tw.fireT = this.time;
    this.ev('cannon', { tw });
  }
  stepShots(dt, now) {
    const sh = this.shots;
    for (let i = sh.length - 1; i >= 0; i--) {
      const b = sh[i];
      b.t += dt;
      if (b.t < b.dur) continue;
      sh.splice(i, 1);
      const L = b.L, R = L.splash, es = this.enemies;
      for (let j = 0; j < es.length; j++) {
        const e = es[j];
        if (e.dead || e.gone || e.fly || e.born === now) continue;   // bluebottles outlive the ball that made them
        const d = hypot(e.x - b.x1, e.y - b.y1);
        if (d > R + e.E.r * 0.5) continue;
        const f = d < R * 0.5 ? 1 : lerp(1, 0.5, clamp((d - R * 0.5) / (R * 0.5), 0, 1));
        if (L.shred) e.shredUntil = now + 5;
        this.hurt(e, L.dmg * f, 0.3, b.tw);
      }
      this.ev('splash', { x: b.x1, y: b.y1, r: R });
    }
  }

  stepPig(tw, dt, now, asleep, L) {
    for (const u of tw.units) {
      const S = L[u.kind];
      if (!u.alive) {
        u.respawn -= dt;
        if (u.respawn <= 0) { u.alive = true; u.hp = u.max; u.hop = 0; u.eng.length = 0; u.x = tw.x; u.y = tw.y; this.ev('unitUp', { u }); }
        continue;
      }
      if (u.hop < 1) {                                    // hopping down off the skin
        u.hop = Math.min(1, u.hop + dt / 0.5);
        const k = easeOut(u.hop);
        u.x = lerp(tw.x, u.rx, k); u.y = lerp(tw.y, u.ry, k);
        if (u.hop < 1) continue;
      }
      if (L.regen && now - u.hurtT > 2 && u.hp < u.max) u.hp = Math.min(u.max, u.hp + u.max * L.regen * dt);
      if (asleep) continue;
      u.cd -= dt;
      if (u.cd > 0) continue;
      while (u.eng.length && (u.eng[0].dead || u.eng[0].gone || u.eng[0].blk !== u)) u.eng.shift();
      let t = u.eng[0] || null;
      if (!t) t = this.pick(u.x, u.y, 32, { air: !!S.air, pri: 'near' });
      if (!t) { u.cd = 0.06; continue; }
      let dmg = S.dmg;
      if (L.rage) for (const o of tw.units) if (o !== u && !o.alive) dmg *= 1.6;
      u.cd = S.every; u.hitT = now; u.face = t.x >= u.x ? 1 : -1; tw.fireT = now;
      this.ev('bite', { u, x: t.x, y: t.y });
      this.hurt(t, dmg, S.pierce || 0, tw);
    }
  }

  /* ---------------- one tick ---------------- */
  step(dt) {
    if (this.phase === 'won' || this.phase === 'lost') return;
    const now = (this.time += dt);
    if (this.phase === 'wave') {
      this.waveTime += dt;
      const q = this.queue;
      while (q.length && q[q.length - 1].t <= this.waveTime) this.spawn(q.pop().type, 0);
      this.grip = Math.min(1, this.grip + dt / GRIP_SECONDS);
    }
    this.auras(now);
    const es = this.enemies;
    for (let i = 0; i < es.length; i++) { this.stepEnemy(es[i], dt, now); if (this.phase === 'lost') return; }
    for (let i = 0; i < this.towers.length; i++) {
      const tw = this.towers[i], asleep = tw.sleepUntil > now, L = TOWERS[tw.type].lv[tw.lvl], d = dt * tw.calm;
      switch (tw.type) {
        case 'swallow': this.stepSwallows(tw, d, now, asleep, L); break;
        case 'anchor': this.stepAnchor(tw, d, now, asleep, L); break;
        case 'light': this.stepLight(tw, d, now, asleep, L); break;
        case 'clipper': this.stepClipper(tw, d, now, asleep, L); break;
        case 'pig': this.stepPig(tw, d, now, asleep, L); break;
      }
    }
    this.stepShots(dt, now);
    let w = 0;
    for (let i = 0; i < es.length; i++) { const e = es[i]; if (!e.dead && !e.gone) es[w++] = e; }
    es.length = w;
    if (this.phase === 'wave' && !this.queue.length && !w) this.endWave();
  }
}

const LETTER = (() => {
  const SERIF = 0.66, parsed = {};
  function parse(ch) {
    if (parsed[ch]) return parsed[ch];
    const g = GLYPHS[ch] || GLYPHS['?'], subs = [];
    let cur = null;
    for (const tok of g[1].match(/[MLQZ][^MLQZ]*/g) || []) {
      const c = tok[0], n = tok.slice(1).trim().split(/[ ,]+/).filter(Boolean).map(Number);
      if (c === 'M') { cur = { cmds: [[c, n]], closed: false }; subs.push(cur); }
      else if (c === 'Z') cur.closed = true;
      else cur.cmds.push([c, n]);
    }
    if (!g[2]) {                 // slab serifs wherever a stem or diagonal stops on the cap line or the baseline
      const extra = [];
      for (const s of subs) {
        if (s.closed || s.cmds.length < 2) continue;
        const pt = k => { const n = s.cmds[k][1]; return [n[n.length - 2], n[n.length - 1]]; };
        const ends = [[pt(0), s.cmds[1][1].slice(0, 2)], [pt(s.cmds.length - 1), (() => { const k = s.cmds.length - 1, n = s.cmds[k][1]; return n.length === 4 ? [n[0], n[1]] : pt(k - 1); })()]];
        for (const [p, q] of ends) {
          if (Math.abs(p[1]) > 0.01 && Math.abs(p[1] - 6) > 0.01) continue;
          if (Math.abs(q[1] - p[1]) < 0.3 * Math.abs(q[0] - p[0]) + 0.01) continue;
          extra.push({ cmds: [['M', [p[0] - SERIF, p[1]]], ['L', [p[0] + SERIF, p[1]]]], closed: false });
        }
      }
      for (const e of extra) subs.push(e);
    }
    return (parsed[ch] = { w: g[0], subs });
  }
  const r2 = v => Math.round(v * 100) / 100;

  /* path data for a line of text at the given cap height; x runs from 0 */
  function path(text, size, track) {
    const sc = size / 6, tr = track == null ? 1.25 : track;
    let x = 0, d = '';
    for (const ch0 of String(text)) {
      const ch = GLYPHS[ch0] ? ch0 : GLYPHS[ch0.toUpperCase()] ? ch0.toUpperCase() : '?';
      const g = parse(ch);
      for (const s of g.subs) {
        for (const [c, n] of s.cmds) {
          d += c;
          for (let i = 0; i < n.length; i += 2) d += r2((n[i] + x) * sc) + ' ' + r2(n[i + 1] * sc) + ' ';
        }
        if (s.closed) d += 'Z';
      }
      x += g.w + tr;
    }
    return { d, w: Math.max(0, x - tr) * sc, h: size };
  }

  /* inline SVG. o: { h, color, outline, weight, track, shadow, shadowColor } */
  function svg(text, o) {
    o = o || {};
    const h = o.h || 20, sc = h / 6, p = path(text, h, o.track);
    const wt = (o.weight || 0.95) * sc, ol = o.outline ? (o.outlineW || 0.34) * sc : 0, sh = o.shadow ? (o.shadow === true ? 0.3 : o.shadow) * sc : 0;
    const pad = wt / 2 + ol + SERIF * sc + 1, W = p.w + pad * 2 + sh, H = h + pad * 2 + sh + 0.5 * sc;
    const attr = 'fill="none" stroke-linejoin="round" stroke-linecap="butt"';
    let body = '';
    if (sh) body += `<path d="${p.d}" transform="translate(${r2(sh)} ${r2(sh)})" ${attr} stroke="${o.shadowColor || o.outline || '#1c2130'}" stroke-width="${r2(wt + ol * 2)}"/>`;
    if (ol) body += `<path d="${p.d}" ${attr} stroke="${o.outline}" stroke-width="${r2(wt + ol * 2)}"/>`;
    body += `<path d="${p.d}" ${attr} stroke="${o.color || 'currentColor'}" stroke-width="${r2(wt)}"/>`;
    return `<svg class="ltr" xmlns="http://www.w3.org/2000/svg" width="${r2(W)}" height="${r2(H)}" viewBox="${r2(-pad)} ${r2(-pad)} ${r2(W)} ${r2(H)}" aria-hidden="true" focusable="false">${body}</svg>`;
  }

  /* canvas. o: { color, outline, weight, track, align: 'center' | 'left' | 'right', shadow } ; y is the cap line */
  const cache = new Map();
  function draw(ctx, text, x, y, size, o) {
    o = o || {};
    const key = text + '|' + size + '|' + (o.track == null ? '' : o.track);
    let p = cache.get(key);
    if (!p) { p = path(text, size, o.track); p.p2 = new Path2D(p.d); if (cache.size > 300) cache.clear(); cache.set(key, p); }
    const sc = size / 6, wt = (o.weight || 0.95) * sc, ol = o.outline ? (o.outlineW || 0.34) * sc : 0;
    const ox = o.align === 'left' ? 0 : o.align === 'right' ? -p.w : -p.w / 2;
    ctx.save();
    ctx.translate(x + ox, y);
    ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
    if (o.shadow) { ctx.save(); ctx.translate(o.shadow * sc, o.shadow * sc); ctx.strokeStyle = o.shadowColor || o.outline || '#1c2130'; ctx.lineWidth = wt + ol * 2; ctx.stroke(p.p2); ctx.restore(); }
    if (ol) { ctx.strokeStyle = o.outline; ctx.lineWidth = wt + ol * 2; ctx.stroke(p.p2); }
    ctx.strokeStyle = o.color || '#1c2130'; ctx.lineWidth = wt; ctx.stroke(p.p2);
    ctx.restore();
    return p.w;
  }
  return { path, svg, draw, width: (t, size, track) => path(t, size, track).w };
})();

/* ======================================================================
   FLASH: every tattoo, drawn with one pen.
   mode 0 = inked in colour, 1 = line only, 2 = purple transfer stencil.
   All drawings are in skin units about (0,0); a tattoo fits a radius of ~32.
   ====================================================================== */
const C = {
  skin: '#ead7b4', skinLt: '#f1e2c4', skinDk: '#d3b588',
  ink: '#1c2130', red: '#c13a2c', redDk: '#8e2a20', gold: '#e0a62b', goldLt: '#f1d27c',
  green: '#3f7f5a', greenDk: '#2c5c43', blue: '#33709b', blueDk: '#234e70', cream: '#f4e9cc',
  brown: '#8a5a33', brownLt: '#b98652', pink: '#e9a79b', pinkDk: '#cf8377', steel: '#9aabb8',
  stencil: '#6b52a6',
  sea: '#2f7f97', seaDk: '#1b4a66', seaLt: '#8cc5cd', foam: '#eef8f2', seaLine: '#12283d',
  wall: '#0f1819',
};

function Pen(ctx, mode, lineColor) {
  const line = mode === 2 ? C.stencil : (lineColor || C.ink);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  return {
    ctx, mode, line,
    fill(color) { if (mode === 0 && color) { ctx.fillStyle = color; ctx.fill(); } },
    stroke(w) { ctx.lineWidth = mode === 2 ? Math.max(0.9, w * 0.5) : w; ctx.strokeStyle = line; ctx.stroke(); },
    /* a path built by fn: filled, then outlined (w = 0 for no outline) */
    shape(fn, color, w) {
      ctx.beginPath(); fn(ctx);
      this.fill(color);
      if (w !== 0) this.stroke(w == null ? 2 : w);
    },
    /* whip shading: a soft black fade inside the given path */
    shade(fn, x0, y0, x1, y1, a) {
      if (mode !== 0) return;
      ctx.save(); ctx.beginPath(); fn(ctx); ctx.clip();
      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, 'rgba(22,24,38,' + (a == null ? 0.5 : a) + ')'); g.addColorStop(1, 'rgba(22,24,38,0)');
      ctx.fillStyle = g; ctx.fillRect(-60, -60, 120, 120);
      ctx.restore();
    },
    dot(x, y, r, color) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
      if (mode === 0) { ctx.fillStyle = color || line; ctx.fill(); }
      else if (r > 1.2) { ctx.lineWidth = 0.9; ctx.strokeStyle = line; ctx.stroke(); }
    },
    seg(x0, y0, x1, y1, w) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); this.stroke(w == null ? 2 : w); },
  };
}

function starPath(c, x, y, r, rot) {
  for (let i = 0; i < 10; i++) {
    const a = (rot || -Math.PI / 2) + i * Math.PI / 5, rr = i & 1 ? r * 0.44 : r;
    if (i) c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else c.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  c.closePath();
}
function ellipse(c, x, y, rx, ry, rot) { c.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }

const ART = {
  /* the little scroll under every tattoo; its stars are the sittings it has had since the first */
  ribbon(p, y, w, lvl) {
    const h = w / 2;
    p.shape(c => { c.moveTo(-h + 1, y - 3); c.lineTo(-h - 6, y - 0.5); c.lineTo(-h - 3, y + 3.2); c.lineTo(-h - 6.5, y + 7); c.lineTo(-h + 2, y + 5); c.closePath(); }, C.redDk, 1.5);
    p.shape(c => { c.moveTo(h - 1, y - 3); c.lineTo(h + 6, y - 0.5); c.lineTo(h + 3, y + 3.2); c.lineTo(h + 6.5, y + 7); c.lineTo(h - 2, y + 5); c.closePath(); }, C.redDk, 1.5);
    p.shape(c => { c.moveTo(-h, y - 4.2); c.quadraticCurveTo(0, y - 7.4, h, y - 4.2); c.lineTo(h, y + 4.2); c.quadraticCurveTo(0, y + 1, -h, y + 4.2); c.closePath(); }, C.cream, 1.7);
    for (let i = 0; i < lvl; i++) {
      const x = (i - (lvl - 1) / 2) * 7.4, yy = y - 1.6 + Math.abs(x) * 0.07;
      p.shape(c => starPath(c, x, yy, 3), C.gold, 0.9);
    }
  },

  /* ---------- the swallow (faces +x; span 1 = wings spread, 0.3 = folded) ---------- */
  swallow(p, span, plain) {
    const s = span == null ? 1 : span;
    p.shape(c => { c.moveTo(-5, -1.6); c.lineTo(-17.5, -6.6); c.lineTo(-10.5, -0.6); c.lineTo(-10.5, 0.6); c.lineTo(-17.5, 6.6); c.lineTo(-5, 1.6); c.closePath(); }, C.blueDk, 1.4);
    for (const k of [-1, 1]) {
      p.shape(c => { c.moveTo(5, k * 2); c.quadraticCurveTo(3, k * 11 * s, -8.5, k * 16.5 * s); c.quadraticCurveTo(-3.5, k * 8 * s, -4, k * 2); c.closePath(); }, C.blue, 1.5);
      if (!plain) p.shade(c => { c.moveTo(5, k * 2); c.quadraticCurveTo(3, k * 11 * s, -8.5, k * 16.5 * s); c.quadraticCurveTo(-3.5, k * 8 * s, -4, k * 2); c.closePath(); }, -9, k * 15 * s, 2, k * 4, 0.55);
    }
    p.shape(c => ellipse(c, 1, 0, 8.2, 3.7), C.blue, 1.5);
    p.shape(c => ellipse(c, 3.6, 0, 3.4, 2.1), C.cream, 0);
    p.shape(c => { c.moveTo(11.4, -1.3); c.lineTo(15.4, 0); c.lineTo(11.4, 1.3); c.closePath(); }, C.gold, 1);
    p.shape(c => c.arc(8.6, 0, 3.5, 0, TAU), C.red, 1.5);
    p.dot(9.6, -1.5, 0.7); p.dot(9.6, 1.5, 0.7);
  },

  /* ---------- the anchor (ring up) ---------- */
  anchor(p, lvl) {
    const c0 = p.ctx;
    c0.save();
    if (lvl >= 3) c0.scale(1.1, 1.1);
    const arms = c => {
      c.moveTo(-17, 3.5); c.quadraticCurveTo(-16, 20.5, 0, 21.5); c.quadraticCurveTo(16, 20.5, 17, 3.5);
      c.lineTo(12.6, 5.6); c.quadraticCurveTo(11.6, 15.2, 0, 15.8); c.quadraticCurveTo(-11.6, 15.2, -12.6, 5.6); c.closePath();
    };
    p.shape(arms, C.steel, 1.9);
    p.shade(arms, 14, 22, -4, 8, 0.55);
    for (const k of [-1, 1]) p.shape(c => { c.moveTo(k * 20.6, 7.6); c.lineTo(k * 15.2, -1.8); c.lineTo(k * 9.6, 8.2); c.closePath(); }, lvl >= 1 ? C.gold : C.steel, 1.7);
    const shank = c => c.rect(-2.5, -13, 5, 30);
    p.shape(shank, C.steel, 1.9);
    p.shade(shank, 3, 0, -2, 0, 0.5);
    p.shape(c => { c.moveTo(-11.5, -12.6); c.lineTo(11.5, -12.6); c.lineTo(11.5, -8.6); c.lineTo(-11.5, -8.6); c.closePath(); }, C.brown, 1.8);
    p.dot(-11.5, -10.6, 2.6, C.brownLt); p.dot(11.5, -10.6, 2.6, C.brownLt);
    c0.beginPath(); c0.arc(0, -17.4, 3.7, 0, TAU); p.stroke(2.6);
    if (lvl >= 4) p.shape(c => starPath(c, 0, 17.6, 3.4), C.red, 1);
    if (lvl >= 2) {              // fouled: the cable wound round the shank
      const cable = c => { c.moveTo(-5.5, -15.5); c.bezierCurveTo(12, -9, -12, -2, 5, 3); c.bezierCurveTo(13, 6, -9, 9, -7, 14); };
      c0.beginPath(); cable(c0); p.stroke(4.4);
      if (p.mode === 0) { c0.beginPath(); cable(c0); c0.lineWidth = 2.1; c0.strokeStyle = C.goldLt; c0.stroke(); }
    }
    c0.restore();
  },

  /* ---------- the light: lantern sits at (0,-2), where the beam turns ---------- */
  light(p, lvl) {
    const c0 = p.ctx;
    p.shape(c => { c.moveTo(-19, 30); c.quadraticCurveTo(-19, 21, -10, 22); c.quadraticCurveTo(-3, 18.5, 6, 21.5); c.quadraticCurveTo(17, 20, 19, 30); c.closePath(); }, '#8c7b68', 1.8);
    const tower = c => { c.moveTo(-8.4, 24); c.lineTo(-5, 5.4); c.lineTo(5, 5.4); c.lineTo(8.4, 24); c.closePath(); };
    p.shape(tower, C.cream, 0);
    if (p.mode === 0) {
      c0.save(); c0.beginPath(); tower(c0); c0.clip();
      c0.fillStyle = C.red; c0.fillRect(-10, 9, 20, 4.6); c0.fillRect(-10, 17.6, 20, 4.4);
      c0.restore();
    }
    p.shade(tower, 9, 14, -2, 14, 0.5);
    c0.beginPath(); tower(c0); p.stroke(1.9);
    p.shape(c => c.rect(-7.6, 3.2, 15.2, 2.6), C.ink, 1.4);
    const lw = lvl >= 3 ? 5.6 : 4.6;
    p.shape(c => c.rect(-lw, -7.4, lw * 2, 10.6), lvl >= 1 ? C.goldLt : C.gold, 1.7);
    if (lvl >= 3) { p.seg(-lw, -2, lw, -2, 0.9); p.seg(-lw / 2, -7.4, -lw / 2, 3.2, 0.9); p.seg(lw / 2, -7.4, lw / 2, 3.2, 0.9); }
    else p.seg(0, -7.4, 0, 3.2, 0.9);
    p.shape(c => { c.moveTo(-lw - 1.8, -7.4); c.lineTo(0, -15.4); c.lineTo(lw + 1.8, -7.4); c.closePath(); }, C.red, 1.7);
    p.seg(0, -15.4, 0, -18.6, 1.5); p.dot(0, -19.4, 1.4, C.gold);
    if (lvl >= 4) p.shape(c => { c.moveTo(0, 17); c.bezierCurveTo(-4.2, 13.4, -2.6, 10.4, 0, 12.6); c.bezierCurveTo(2.6, 10.4, 4.2, 13.4, 0, 17); c.closePath(); }, C.goldLt, 1);
    else p.shape(c => { c.moveTo(-1.8, 24); c.lineTo(-1.8, 19.6); c.quadraticCurveTo(0, 17.4, 1.8, 19.6); c.lineTo(1.8, 24); }, C.ink, 1);
    ART.ribbon(p, 28.5, 30, lvl);
  },

  /* ---------- the clipper (bows to +x) ---------- */
  clipper(p, lvl) {
    const c0 = p.ctx;
    c0.save(); c0.scale(0.84, 0.84); c0.translate(-3, 0);
    const sail = (x, y0, y1, w0, w1) => {
      const f = c => { c.moveTo(x - w0 / 2, y0); c.lineTo(x + w0 / 2, y0); c.quadraticCurveTo(x + w1 / 2 + 3.4, (y0 + y1) / 2, x + w1 / 2, y1); c.lineTo(x - w1 / 2, y1); c.quadraticCurveTo(x - w1 / 2 + 3.4, (y0 + y1) / 2, x - w0 / 2, y0); c.closePath(); };
      p.shape(f, C.cream, 1.5);
      p.shade(f, x - w1 / 2, y1, x + 2, y0 - 2, 0.3);
    };
    const tall = lvl >= 2;                               // royals and skysails
    for (const [x, top] of [[-14, tall ? -27 : -19], [1, tall ? -32 : -23], [15, tall ? -25 : -17]]) p.seg(x, 8, x, top - 3, 1.5);
    p.seg(24, 4, 36, -3, 1.6);
    p.shape(c => { c.moveTo(16, tall ? -22 : -15); c.lineTo(35, -2.4); c.lineTo(18.5, 3.5); c.closePath(); }, C.cream, 1.4);
    sail(-14, -6, 5, 11, 13); sail(-14, -17, -7.5, 8.5, 10.5);
    sail(1, -8, 5, 12.5, 15); sail(1, -21, -9.5, 10, 12);
    sail(15, -5, 5, 10, 12); sail(15, -15, -6.5, 7.5, 9.5);
    if (tall) { sail(-14, -25.5, -18.5, 6, 8); sail(1, -30.5, -22.5, 7, 9.4); sail(15, -23.5, -16.5, 5.4, 7.2); }
    for (const [x, top] of [[-14, tall ? -30 : -22], [1, tall ? -35 : -26], [15, tall ? -28 : -20]]) {
      p.shape(c => { c.moveTo(x, top); c.lineTo(x - 7, top + 1.8); c.lineTo(x, top + 3.6); c.closePath(); }, C.red, 1);
    }
    const hull = c => { c.moveTo(-26, 5); c.lineTo(-23, 15.5); c.quadraticCurveTo(-21, 19, -14, 19); c.lineTo(13, 19); c.quadraticCurveTo(23, 18, 29.5, 4.5); c.lineTo(22, 7.5); c.lineTo(-20, 7.5); c.closePath(); };
    p.shape(hull, C.ink, 1.8);
    if (p.mode === 0) {
      c0.save(); c0.beginPath(); hull(c0); c0.clip();
      c0.fillStyle = C.red; c0.fillRect(-30, 15.4, 62, 5);
      c0.fillStyle = C.cream; c0.fillRect(-30, 9.6, 62, 3.6);
      c0.restore();
      c0.beginPath(); hull(c0); p.stroke(1.8);
    }
    const guns = TOWERS.clipper.lv[lvl].guns;
    for (let i = 0; i < guns; i++) {
      const gx = -15 + i * (guns > 3 ? 8.4 : 10.5) + (4 - guns) * 2.2;
      p.shape(c => c.rect(gx - 1.7, 9.8, 3.4, 3.2), C.ink, 0);
      if (p.mode !== 0) p.shape(c => c.rect(gx - 1.7, 9.8, 3.4, 3.2), null, 0.9);
    }
    if (p.mode === 0) {
      c0.beginPath();
      for (let x = -30; x <= 30; x += 10) { c0.moveTo(x, 23.4); c0.quadraticCurveTo(x + 2.5, 20.6, x + 5, 23.4); c0.quadraticCurveTo(x + 7.5, 26, x + 10, 23.4); }
      c0.lineWidth = 1.5; c0.strokeStyle = C.blue; c0.stroke();
    }
    c0.restore();
    ART.ribbon(p, 28.5, 30, lvl);
  },

  /* ---------- the hencoop they came ashore on ---------- */
  coop(p, lvl) {
    const c0 = p.ctx;
    const box = c => { c.moveTo(-15, -7); c.lineTo(15, -7); c.lineTo(15, 12); c.lineTo(-15, 12); c.closePath(); };
    p.shape(box, C.brownLt, 1.8);
    p.shade(box, 0, 14, 0, -2, 0.4);
    for (const x of [-9, -3, 3, 9]) p.seg(x, -7, x, 12, 1.3);
    p.shape(c => { c.moveTo(-17.5, -7); c.lineTo(0, -15.5); c.lineTo(17.5, -7); c.closePath(); }, C.brown, 1.8);
    p.seg(-15, 2.5, 15, 2.5, 1.3);
    if (lvl >= 3) p.shape(c => c.rect(-17.4, 4.6, 34.8, 3), C.gold, 1.2);       // crated together: a strap
    if (lvl >= 4) p.shape(c => { c0.arc(0, -8.6, 3.6, 0, TAU); }, C.cream, 1.4);  // and a lifebuoy
    if (lvl >= 4 && p.mode === 0) { c0.beginPath(); c0.arc(0, -8.6, 3.6, 0, TAU); c0.lineWidth = 1.6; c0.setLineDash([2.2, 3.4]); c0.strokeStyle = C.red; c0.stroke(); c0.setLineDash([]); }
  },

  /* ---------- pig and rooster (face +x; t animates a little) ---------- */
  pig(p, t, lvl) {
    const c0 = p.ctx, bob = Math.sin(t * 9) * 0.7, big = lvl >= 1 ? 1.12 : 1;
    c0.save(); c0.scale(big, big); c0.translate(0, bob * 0.4);
    for (const [x, ph] of [[-6.2, 0], [-2.4, 1.6], [3, 0.8], [6.8, 2.4]]) {
      const ly = Math.sin(t * 9 + ph) * 0.9;
      p.shape(c => c.rect(x - 1.5, 4.6, 3, 5.4 + ly), C.pinkDk, 1.3);
    }
    c0.beginPath(); c0.moveTo(-10.4, -1.5); c0.bezierCurveTo(-15.4, -3.4, -13.6, -8, -11.4, -5.2); p.stroke(1.5);
    const body = c => ellipse(c, 0, 0, 10.6, 7.3);
    p.shape(body, C.pink, 1.8);
    p.shade(body, 2, 9, 0, -2, 0.42);
    p.shape(c => { c.moveTo(5.4, -6.2); c.lineTo(7.6, -12); c.lineTo(11, -6.8); c.closePath(); }, C.pinkDk, 1.5);
    p.shape(c => c.arc(9.2, -1.6, 5.7, 0, TAU), C.pink, 1.8);
    p.shape(c => ellipse(c, 14.2, -0.8, 2.7, 2.4), C.pinkDk, 1.4);
    p.dot(13.6, -0.9, 0.6); p.dot(15, -0.9, 0.6);
    p.dot(10.2, -3.6, 0.95);
    c0.restore();
  },
  cock(p, t, lvl) {
    const c0 = p.ctx, bob = Math.sin(t * 11) * 0.8;
    c0.save(); c0.translate(0, bob * 0.4);
    for (const [x, ph] of [[-0.6, 0], [3, 1.7]]) {
      const lx = Math.sin(t * 11 + ph) * 1.2;
      p.seg(x, 6, x + lx, 11.6, 1.4); p.seg(x + lx - 1.8, 12, x + lx + 2.4, 12, 1.4);
    }
    for (const [col, a] of [[C.green, 0], [C.blueDk, 0.42], [C.red, 0.86]]) {
      c0.save(); c0.rotate(-a * 0.62);
      p.shape(c => { c.moveTo(-4, 0); c.quadraticCurveTo(-14.5, -3, -12.6, -15); c.quadraticCurveTo(-8, -8.4, -2.4, -4.6); c.closePath(); }, col, 1.4);
      c0.restore();
    }
    const body = c => { c.moveTo(-6.4, 1.6); c.quadraticCurveTo(-6.6, -6, 1.6, -5.2); c.quadraticCurveTo(8.6, -4, 7.2, 3); c.quadraticCurveTo(4.4, 8.4, -1.8, 7.4); c.quadraticCurveTo(-6.2, 6.2, -6.4, 1.6); c.closePath(); };
    p.shape(body, C.gold, 1.8);
    p.shade(body, 1, 9, 0, -1, 0.42);
    c0.beginPath(); c0.moveTo(-3, 1.4); c0.quadraticCurveTo(0.6, 4.4, 4, 1.2); p.stroke(1.2);
    p.shape(c => { c.moveTo(4.2, -11); c.quadraticCurveTo(5.2, -14.6, 6.2, -11.4); c.quadraticCurveTo(7.4, -15.2, 8.4, -11.4); c.quadraticCurveTo(9.8, -14.2, 10.4, -10.4); c.closePath(); }, C.red, 1.3);
    p.shape(c => c.arc(7.2, -8, 3.7, 0, TAU), C.gold, 1.7);
    p.shape(c => { c.moveTo(10.4, -9); c.lineTo(14.6, -7.6); c.lineTo(10.4, -6.2); c.closePath(); }, C.goldLt, 1.1);
    p.shape(c => ellipse(c, 9.8, -4.4, 1.3, 2), C.red, 1);
    p.dot(8, -8.8, 0.85);
    if (lvl >= 2) { p.seg(-0.6, 9.4, -3.6, 8, 1.3); p.seg(3, 9.4, 0, 8, 1.3); }   // spurs
    c0.restore();
  },

  /* ---------- MOTHER: the heart. full = how much of it is still red (0..1) ---------- */
  heart(p, full, lettering) {
    const c0 = p.ctx;
    const hp = c => { c.moveTo(0, 26); c.bezierCurveTo(-38, 2, -32, -29, -13, -26.5); c.bezierCurveTo(-4.5, -25.4, 0, -19, 0, -13.5); c.bezierCurveTo(0, -19, 4.5, -25.4, 13, -26.5); c.bezierCurveTo(32, -29, 38, 2, 0, 26); c.closePath(); };
    p.shape(hp, '#f0d0c2', 0);
    if (p.mode === 0) {
      c0.save(); c0.beginPath(); hp(c0); c0.clip();
      c0.fillStyle = C.red; c0.fillRect(-40, 26 - 54 * clamp(full, 0, 1), 80, 60);
      c0.restore();
      p.shade(hp, 22, 20, -6, -8, 0.5);
      c0.beginPath(); c0.moveTo(-23, -14); c0.quadraticCurveTo(-21.5, -21, -14, -21.6);
      c0.lineWidth = 2.6; c0.strokeStyle = 'rgba(255,244,230,.8)'; c0.stroke();
    }
    c0.beginPath(); hp(c0); p.stroke(2.6);
    c0.save(); c0.rotate(-0.09);
    for (const k of [-1, 1]) p.shape(c => { c.moveTo(k * 33, -6.4); c.lineTo(k * 45.5, -2); c.lineTo(k * 40, 3.4); c.lineTo(k * 46.5, 9.6); c.lineTo(k * 31, 6.4); c.closePath(); }, C.redDk, 1.7);
    p.shape(c => { c.moveTo(-36, -8); c.quadraticCurveTo(0, -12.4, 36, -8); c.lineTo(36, 7.2); c.quadraticCurveTo(0, 2.8, -36, 7.2); c.closePath(); }, C.cream, 2);
    if (lettering !== false) LETTER.draw(c0, 'MOTHER', 0, -6.3, 8.2, { color: p.line, weight: 1.02, track: 1.5 });
    c0.restore();
  },

  /* ---------- small things ---------- */
  ball(p) { p.shape(c => c.arc(0, 0, 3.6, 0, TAU), C.ink, 1); if (p.mode === 0) p.dot(-1.1, -1.2, 1, 'rgba(255,255,255,.55)'); },
  star(p, r, col) { p.shape(c => starPath(c, 0, 0, r), col || C.ink, r > 5 ? 1.2 : 0); },
  sparkle(p, r) { p.shape(c => { for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i & 1 ? r * 0.26 : r; if (i) c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); else c.moveTo(rr, 0); } c.closePath(); }, C.ink, 0); },

  /* the static part of each tattoo, and (for shop cards) the whole thing at rest */
  base(p, type, lvl) {
    if (type === 'swallow') ART.ribbon(p, 23, 30, lvl);
    else if (type === 'anchor') ART.ribbon(p, 27.5, 28, lvl);
    else if (type === 'light') ART.light(p, lvl);
    else if (type === 'clipper') ART.clipper(p, lvl);
    else { ART.coop(p, lvl); ART.ribbon(p, 21, 30, lvl); }
  },
  whole(p, type, lvl) {
    const c0 = p.ctx;
    if (type === 'pig') {
      c0.save(); c0.translate(0, -9); c0.scale(0.82, 0.82); ART.coop(p, lvl); c0.restore();
      c0.save(); c0.translate(-11.5, 9); c0.scale(0.8, 0.8); ART.pig(p, 0, lvl); c0.restore();
      c0.save(); c0.translate(11.5, 7.5); c0.scale(0.8, 0.8); ART.cock(p, 0, lvl); c0.restore();
      ART.ribbon(p, 25, 30, lvl);
      return;
    }
    ART.base(p, type, lvl);
    if (type === 'swallow') {
      for (const s of BIRD_SLOTS[TOWERS.swallow.lv[lvl].birds]) { c0.save(); c0.translate(s[0], s[1]); c0.rotate(-0.5); c0.scale(0.86, 0.86); ART.swallow(p, 0.9); c0.restore(); }
    } else if (type === 'anchor') { c0.save(); c0.translate(0, -3); c0.scale(0.98, 0.98); ART.anchor(p, lvl); c0.restore(); }
  },
};

/* ======================================================================
   THE SEA'S COLLECTORS: drawn in wash rather than line-and-fill, because
   they are not ink. Each faces +x; t is seconds, for the wobble.
   ====================================================================== */
const SEA = {
  eyes(p, x, y, gap, r, look) {
    for (const k of [-1, 1]) {
      p.dot(x + k * gap, y, r, C.foam);
      p.dot(x + k * gap + (look || 0.4), y + 0.1, r * 0.52, C.seaLine);
    }
  },

/* ======================================================================
   DRAWING THE SKIN
   One canvas. A cached still layer (skin, rope, old ink), a cached sprite

   ====================================================================== */
const S = {                    // what the page knows that the night does not
  game: null, sel: null, placing: null, ghost: null, hover: null,

const VIEW = { cw: 300, ch: 200, dpr: 1, scale: 1, ox: 0, oy: 0, k: 1 };
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

let bgCanvas = null, bgDirty = true, decal = null, decalCtx = null, decalT = 0;

const FX = { parts: [], texts: [], rings: [], bolts: [], stamp: null, shake: 0, hurt: 0, flash: 0, t: 0 };
const inkPen = Pen(ctx, 0), stencilPen = Pen(ctx, 2), linePen = Pen(ctx, 1), seaPen = Pen(ctx, 0, C.seaLine);

function resizeView() {
  const r = boardEl.getBoundingClientRect();

  VIEW.dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(6.5e6 / (VIEW.cw * VIEW.ch)));   // never more than ~6.5M pixels to fill
  const w = Math.round(VIEW.cw * VIEW.dpr), h = Math.round(VIEW.ch * VIEW.dpr);

}
function fitView() {

  VIEW.ox = (VIEW.cw - g.W * VIEW.scale) / 2; VIEW.oy = (VIEW.ch - g.H * VIEW.scale) / 2;

}
const toWorld = (px, py) => ({ x: (px - VIEW.ox) / VIEW.scale, y: (py - VIEW.oy) / VIEW.scale });
function worldXf(c) { c.setTransform(VIEW.k, 0, 0, VIEW.k, VIEW.ox * VIEW.dpr, VIEW.oy * VIEW.dpr); }

/* ---------------- the still layer ---------------- */
function ropePath(pts, off) {
  const p = new Path2D();
  for (let i = 0; i < pts.length; i++) {
    let x = pts[i].x, y = pts[i].y;
    if (off) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], d = hypot(b.x - a.x, b.y - a.y) || 1;
      x += -(b.y - a.y) / d * off; y += (b.x - a.x) / d * off;
    }
    if (i) p.lineTo(x, y); else p.moveTo(x, y);
  }

}
function drawRope(g, pts) {
  g.lineJoin = g.lineCap = 'round';
  const path = ropePath(pts, 0);
  g.strokeStyle = 'rgba(28,33,48,0.2)'; g.lineWidth = ROPE_HALF * 2 + 6; g.stroke(path);
  g.strokeStyle = C.ink; g.lineWidth = ROPE_HALF * 2; g.stroke(path);
  g.strokeStyle = '#dcbb78'; g.lineWidth = ROPE_HALF * 2 - 4.6; g.stroke(path);
  g.strokeStyle = 'rgba(96,58,20,0.3)'; g.lineWidth = 8; g.stroke(ropePath(pts, 5.4));
  g.strokeStyle = 'rgba(255,246,216,0.55)'; g.lineWidth = 2.4; g.stroke(ropePath(pts, -6.2));

  for (let i = 1; i < pts.length - 1; i += 2) {
    const a = pts[i - 1], b = pts[i + 1], p = pts[i], d = hypot(b.x - a.x, b.y - a.y) || 1;
    const tx = (b.x - a.x) / d, ty = (b.y - a.y) / d, nx = -ty, ny = tx;
    g.moveTo(p.x - nx * 10.2 - tx * 5.5, p.y - ny * 10.2 - ty * 5.5);
    g.quadraticCurveTo(p.x - tx * 1.5, p.y - ty * 1.5, p.x + nx * 10.2 + tx * 5.5, p.y + ny * 10.2 + ty * 5.5);

function buildBg() {
  const G = S.game;
