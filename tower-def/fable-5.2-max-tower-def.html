  bgCanvas.width = cv.width; bgCanvas.height = cv.height;
  const g = bgCanvas.getContext('2d'), W = G.W, H = G.H, rnd = mulberry32(G.seed ^ 0x51ED);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#0a1011'; g.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  worldXf(g);
  g.save();
  skinPath(g, W, H); g.clip();
  g.fillStyle = C.skin; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 46; i++) {                       // mottle
    const x = rnd() * W, y = rnd() * H, r = 50 + rnd() * 190, lt = rnd() < 0.5;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, lt ? 'rgba(247,233,205,0.16)' : 'rgba(196,160,112,0.13)'); gr.addColorStop(1, 'rgba(230,205,165,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let c = 0; c < 6; c++) {                        // freckles, in drifts
    const cx = rnd() * W, cy = rnd() * H, n = 18 + ((rnd() * 30) | 0);
    for (let i = 0; i < n; i++) {
      const a = rnd() * TAU, d = Math.pow(rnd(), 0.6) * 130;
      g.fillStyle = 'rgba(150,98,58,' + (0.14 + rnd() * 0.2).toFixed(2) + ')';
      g.beginPath(); g.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 0.7 + rnd() * 1.3, 0, TAU); g.fill();
    }
  }
  for (let i = 0; i < 3; i++) { g.fillStyle = 'rgba(112,70,44,0.5)'; g.beginPath(); g.arc(rnd() * W, rnd() * H, 2 + rnd() * 1.6, 0, TAU); g.fill(); }
  /* old filler, faded: the stars and dots a needle-man drops into every gap */
  const fp = Pen(g, 0);
  g.globalAlpha = 0.3;
  for (let i = 0, tries = 0; i < 26 && tries < 400; tries++) {
    const x = 30 + rnd() * (W - 60), y = 30 + rnd() * (H - 60);
    if (G.nearest(x, y).d < 44 || hypot(x - G.hx, y - G.hy) < 86) continue;
    g.save(); g.translate(x, y); g.rotate(rnd() * TAU);
    const k = rnd();
    if (k < 0.45) ART.star(fp, 3.5 + rnd() * 3);
    else if (k < 0.75) ART.sparkle(fp, 5 + rnd() * 4);
    else { for (let j = 0; j < 3; j++) fp.dot(j * 6 - 6, 0, 1.5); }
    g.restore(); i++;
  }
  /* and three older pieces in the widest gaps: a star to steer by, a ship's name, a girl's */
  const spots = [];
  for (let y = 60; y < H - 50; y += 34) for (let x = 60; x < W - 60; x += 34) {
    const c = Math.min(G.nearest(x, y).d - ROPE_HALF, hypot(x - G.hx, y - G.hy) - 62, x - 16, y - 16, W - 16 - x, H - 16 - y);
    if (c > 36) spots.push({ x, y, c: c + rnd() * 14 });
  }
  spots.sort((a, b) => b.c - a.c);
  const took = [];
  const take = need => {
    for (const s of spots) { if (s.c < need) break; if (took.every(t => hypot(t.x - s.x, t.y - s.y) > 150)) { took.push(s); return s; } }
    return null;
  };
  g.globalAlpha = 0.24;
  let sp = take(58);
  if (sp) {                                            // the nautical star
    g.save(); g.translate(sp.x, sp.y); g.rotate((rnd() - 0.5) * 0.5);
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * TAU / 5, tx = Math.cos(a) * 34, ty = Math.sin(a) * 34;
      for (const k of [-1, 1]) {
        const b = a + k * Math.PI / 5;

    }
    g.restore();
  }
  sp = take(46);
  if (sp) {
    g.save(); g.translate(sp.x, sp.y); g.rotate((rnd() - 0.5) * 0.3);
    LETTER.draw(g, 'MARIGOLD', 0, -13, 11.5, { color: C.ink, weight: 0.95, track: 1.6 });
    LETTER.draw(g, '1894', 0, 5, 8.5, { color: C.ink, weight: 0.95, track: 2 });
    g.restore();

    g.save(); g.translate(sp.x, sp.y); g.rotate((rnd() - 0.5) * 0.4);
    g.beginPath(); g.moveTo(0, 4); g.bezierCurveTo(-17, -6, -14, -20, -6, -19); g.bezierCurveTo(-2, -18.5, 0, -15.6, 0, -13); g.bezierCurveTo(0, -15.6, 2, -18.5, 6, -19); g.bezierCurveTo(14, -20, 17, -6, 0, 4); g.closePath();
    g.lineWidth = 1.7; g.strokeStyle = C.ink; g.stroke();
    LETTER.draw(g, 'NELL', 0, 9, 6.5, { color: C.ink, weight: 0.95, track: 1.8 });

  drawRope(g, G.rope.pts);
  const vg = g.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.3, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(120,72,30,0)'); vg.addColorStop(1, 'rgba(96,52,20,0.34)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

}
function wetMark(x, y, r) {

/* ---------------- sprites and icons ---------------- */
function sprite(type, lvl, mode) {
  const key = type + lvl + mode;
  let s = sprites.get(key);
  if (s) return s;
  s = document.createElement('canvas');
  s.width = s.height = Math.max(8, Math.ceil(SPR * VIEW.k));
  const g = s.getContext('2d');
  g.setTransform(VIEW.k, 0, 0, VIEW.k, s.width / 2, s.height / 2);
  if (mode === 0) { g.shadowColor = 'rgba(28,33,48,0.4)'; g.shadowBlur = 1.6 * VIEW.k; }   // old ink spreads a little
  ART.base(Pen(g, mode), type, lvl);

  return s;
}
function iconCanvas(type, lvl, px, mode) {
  const c = document.createElement('canvas'), d = Math.min(window.devicePixelRatio || 1, 2);
  c.width = c.height = Math.round(px * d);
  const g = c.getContext('2d'), k = px * d / 78;
  g.setTransform(k, 0, 0, k, c.width / 2, c.height / 2 - 1.5 * k);

}
const foeIcons = {};
function foeIcon(type) {
  if (foeIcons[type]) return foeIcons[type];
  const c = document.createElement('canvas'), r = ENEMIES[type].r, px = 96;
  c.width = c.height = px;
  const g = c.getContext('2d'), k = px / (Math.max(r, 11) * 2.9);
  g.setTransform(k, 0, 0, k, px / 2, px / 2 + (ENEMIES[type].boss ? 4 * k : 0));

/* ---------------- things that happen ---------------- */
function part(x, y, vx, vy, life, r, col, kind, grav) { if (FX.parts.length < 520) FX.parts.push({ x, y, vx, vy, life, max: life, r, col, kind: kind || 0, g: grav || 0, rot: Math.random() * TAU }); }
function burst(x, y, n, speed, life, r, col, kind, grav) {
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = speed * (0.4 + Math.random() * 0.8); part(x, y, Math.cos(a) * v, Math.sin(a) * v, life * (0.6 + Math.random() * 0.6), r * (0.6 + Math.random() * 0.7), col, kind, grav); }
}
function floatText(x, y, str, col, size) { if (FX.texts.length < 40) FX.texts.push({ x, y, str, col, size: size || 9, life: 1.1, max: 1.1 }); }
function ring(x, y, r0, r1, life, col, lw) { FX.rings.push({ x, y, r0, r1, life, max: life, col, lw: lw || 2 }); }

function stepFx(dt) {
  const P = FX.parts;
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.life -= dt;
    if (p.life <= 0) { P[i] = P[P.length - 1]; P.pop(); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
    if (p.kind === 2) { p.vx *= 1 - 2.2 * dt; p.vy *= 1 - 2.2 * dt; }
  }
  for (let i = FX.texts.length - 1; i >= 0; i--) { const t = FX.texts[i]; t.life -= dt; t.y -= 22 * dt; if (t.life <= 0) FX.texts.splice(i, 1); }
  for (let i = FX.rings.length - 1; i >= 0; i--) { const r = FX.rings[i]; r.life -= dt; if (r.life <= 0) FX.rings.splice(i, 1); }
  for (let i = FX.bolts.length - 1; i >= 0; i--) { const b = FX.bolts[i]; b.life -= dt; if (b.life <= 0) FX.bolts.splice(i, 1); }
  if (FX.stamp) { FX.stamp.life -= dt; if (FX.stamp.life <= 0) FX.stamp = null; }
  FX.shake = Math.max(0, FX.shake - dt * 3.2);
  FX.hurt = Math.max(0, FX.hurt - dt * 2);
  FX.flash = Math.max(0, FX.flash - dt * 2.4);
  decalT += dt;
  if (decalT > 0.3 && decalCtx) {                       // drying
    decalT = 0;
    decalCtx.setTransform(1, 0, 0, 1, 0, 0);
    decalCtx.globalCompositeOperation = 'destination-out';
    decalCtx.fillStyle = 'rgba(0,0,0,0.035)'; decalCtx.fillRect(0, 0, decal.width, decal.height);
    decalCtx.globalCompositeOperation = 'source-over';
  }
}

/* lamp, then moon, then the window going grey, then gold */
const NIGHT = [[0, 255, 242, 216], [0.3, 248, 222, 184], [0.37, 182, 198, 234], [0.56, 160, 180, 230], [0.68, 166, 182, 226], [0.8, 198, 192, 216], [0.92, 244, 204, 184], [1, 255, 236, 200]];
function nightTint(p) {
  let i = 1;
  while (i < NIGHT.length - 1 && NIGHT[i][0] < p) i++;
  const a = NIGHT[i - 1], b = NIGHT[i], t = clamp((p - a[0]) / (b[0] - a[0] || 1), 0, 1);
  return 'rgb(' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ',' + Math.round(lerp(a[3], b[3], t)) + ')';
}
function nightProgress(G) {
  let p = G.wave;
  if (G.phase === 'wave') p += clamp(G.waveTime / 70, 0, 0.92);
  return clamp(p / WAVES.length, 0, 1);
}

/* ---------------- one frame ---------------- */
function drawNote(x, y, s, a) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
  ctx.fillStyle = C.stencil; ctx.strokeStyle = C.stencil; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 4, 3, 2.3, -0.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(2.6, 3.4); ctx.lineTo(2.6, -6); ctx.quadraticCurveTo(6, -5, 7, -1.6); ctx.stroke();
  ctx.restore();
}
function hpBar(x, y, w, f, col) {
  ctx.fillStyle = C.ink; ctx.fillRect(x - w / 2 - 1, y - 1, w + 2, 5);
  ctx.fillStyle = '#e9dcc0'; ctx.fillRect(x - w / 2, y, w, 3);
  ctx.fillStyle = col; ctx.fillRect(x - w / 2, y, w * clamp(f, 0, 1), 3);
}
function dashedCircle(x, y, r, col, lw, dash, spin) {

  ctx.setLineDash(dash || [7, 7]); ctx.lineWidth = lw || 1.6; ctx.strokeStyle = col; ctx.stroke();
  ctx.restore();
}

function drawTowerBase(tw, now) {
  const age = now - tw.born, asleep = tw.sleepUntil > now, T = tw.type;
  const k = age < 0.75 ? easeOut(clamp((age - 0.12) / 0.63, 0, 1)) : 1;    // stencil first, then the ink goes in
  let flip = false, ox = 0, oy = 0;
  if (T === 'clipper') {
    flip = Math.cos(tw.face) < 0;
    const rc = now - tw.fireT;
    if (rc < 0.22) { ox = -Math.cos(tw.face) * 2.6 * (1 - rc / 0.22); oy = -Math.sin(tw.face) * 2.6 * (1 - rc / 0.22); }
  }
  ctx.save(); ctx.translate(tw.x + ox, tw.y + oy);
  if (flip) ctx.scale(-1, 1);
  const up = tw.upT != null ? now - tw.upT : 9;
  if (up < 0.5) { const s = 1 + Math.sin(up / 0.5 * Math.PI) * 0.09; ctx.scale(s, s); }
  if (asleep || k < 1) {
    ctx.globalAlpha = asleep ? 0.85 : (1 - k) * 0.9;
    ctx.drawImage(sprite(T, tw.lvl, 2), -SPR / 2, -SPR / 2, SPR, SPR);
  }
  if (!asleep && k > 0) {
    ctx.globalAlpha = k * (tw.calm < 1 ? 0.62 : 1);
    ctx.drawImage(sprite(T, tw.lvl, 0), -SPR / 2, -SPR / 2, SPR, SPR);
  }

function drawSwallowBird(x, y, a, span, pen, alpha, sc) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(sc || 0.84, sc || 0.84); ctx.globalAlpha = alpha;
  ART.swallow(pen, span, true);
  ctx.restore();
}

function frame(dtReal) {
  const G = S.game;
  if (!G) return;
  if (bgDirty) buildBg();
  const now = G.time, W = G.W, H = G.H;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  let shx = 0, shy = 0;
  if (FX.shake > 0 && !S.calm) { shx = (Math.random() - 0.5) * FX.shake * 9 * VIEW.dpr; shy = (Math.random() - 0.5) * FX.shake * 9 * VIEW.dpr; }
  ctx.drawImage(bgCanvas, shx, shy);
  if (decal) ctx.drawImage(decal, shx, shy, cv.width, cv.height);
  ctx.setTransform(VIEW.k, 0, 0, VIEW.k, VIEW.ox * VIEW.dpr + shx, VIEW.oy * VIEW.dpr + shy);
  ctx.lineJoin = ctx.lineCap = 'round';

  /* --- the heart --- */
  FX.t += Math.min(0.05, dtReal || 0);                  // a clock of its own, so the heart beats even while the night stands still

      }
    }

      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.3; ctx.stroke();

  }

  const gh = S.ghost;

    const L = TOWERS[S.placing].lv[0], r = L.range || L.reach, col = gh.ok ? 'rgba(107,82,166,0.85)' : 'rgba(193,58,44,0.9)';

/* ---------- two fists, eight knuckles ---------- */
function fistsSVG(lit, cropped) {
  const fw = 30, fh = 52, off = [9, 3, 0, 4, 4, 0, 3, 9];
  let s = '';
  for (let f = 0; f < 2; f++) {
    const x0 = 8 + f * 152;
    if (!cropped) {
      s += `<path class="cuff" d="M${x0 + 16} 90h94v30h-94z"/><path class="stripe" d="M${x0 + 16} 101h94M${x0 + 16} 111h94"/>`;
      s += `<path class="kn" d="M${x0 - 3} 46h132v20q0 26-32 30h-68q-32-4-32-30z"/>`;
      s += `<ellipse class="kn" cx="${f ? x0 + 34 : x0 + 92}" cy="78" rx="33" ry="12" transform="rotate(${f ? 10 : -10} ${f ? x0 + 34 : x0 + 92} 78)"/>`;
      s += `<path class="cr" d="M${f ? x0 + 9 : x0 + 105} 75q6-5 12 0"/>`;
    }
    for (let i = 0; i < 4; i++) {
      const k = f * 4 + i, x = x0 + i * 32, y = 4 + off[k], p = LETTER.path('HOLDFAST'[k], 17);
      s += `<path class="kn" d="M${x} ${y + 13}q0-13 ${fw / 2}-13q${fw / 2} 0 ${fw / 2} 13v${fh - 13}h-${fw}z"/>`;
      s += `<path class="cr" d="M${x + 6} ${y + fh - 9}q${fw / 2 - 6} 4 ${fw - 12} 0"/>`;
      s += `<path class="lt${k < lit ? ' lit' : ''}" d="${p.d}" transform="translate(${(x + fw / 2 - p.w / 2).toFixed(1)} ${y + 15})"/>`;
    }

  return `<svg viewBox="0 0 294 ${cropped ? 66 : 118}" aria-hidden="true">${s}</svg>`;
}

    <p class="lede">${watchOf(Math.min(G.wave, 23)).name}, ${G.wave} of 24 bells behind you.</p>
    <div class="acts"><button class="btn red big" type="button" data-act="close" data-focus>Carry on</button><button class="btn big" type="button" data-act="book">The book</button></div>
    <div class="acts"><button class="btn" type="button" data-act="snd">${SOUND_WORDS[save.snd]}</button><button class="btn" type="button" data-act="spd">Speed ${S.speed}×</button></div>
    <div class="acts"><button class="btn" type="button" data-act="again">This night again</button><button class="btn" type="button" data-act="over">Turn over: a new rope</button><button class="btn" type="button" data-act="title">Change the weather</button></div>
    <p class="seed">Night No. ${G.seed} · ${G.tier.name}</p>`, 'pause');
}
function showEnd(won) {
  const G = S.game, st = G.stats, w = Math.min(G.wave, 23);
  const head = won ? 'Eight bells' : 'Slipped his cable';
  const sub = won ? 'And all’s well.' : `He slipped his cable at ${bellName(w).toLowerCase()} of the ${watchOf(w).name.toLowerCase()}.`;
  const body = won ? STORY.won.map(p => '<p>' + p + '</p>').join('') : '<p>' + STORY.lost + '</p>';
  openCard(`<h2>${ltr(head, 24, C.red, { outline: C.ink, shadow: 0.4 })}</h2><p class="lede">${sub}</p><div class="${won ? 'story' : 'story plain'}">${body}</div>
    <div class="tally"><div><b>${G.wave}</b><span>bells survived</span></div><div><b>${G.heart}</b><span>beats of heart left</span></div><div><b>${st.kills}</b><span>collectors turned back</span></div><div><b>${st.earned}</b><span>luck taken back</span></div></div>
    <div class="acts"><button class="btn red big" type="button" data-act="over" data-focus>Turn over: a new rope</button><button class="btn big" type="button" data-act="again">This night again</button></div>
    <div class="acts"><button class="btn" type="button" data-act="title">Change the weather</button><button class="btn" type="button" data-act="book" data-tab="ledger">The ledger</button></div>
    <p class="seed">Night No. ${G.seed} · ${G.tier.name}</p>`, 'end');
}

/* ---------- a night begins ---------- */
function newNight(seed, tier) {
  clearTimeout(UI.endT);
  const r = boardEl.getBoundingClientRect(), w = Math.max(80, r.width), h = Math.max(80, r.height);
  S.game = new Game({ seed: seed || (10000 + Math.floor(Math.random() * 90000)), aspect: w / h, compact: w * h < 330000, tier: tier || save.tier });
  S.sel = null; S.placing = null; S.ghost = null; S.hover = null; UI.heartSel = false; UI.armed = null; UI.lastInfo = '';
  FX.parts.length = 0; FX.texts.length = 0; FX.rings.length = 0; FX.bolts.length = 0; FX.stamp = null; FX.shake = 0; FX.flash = 0; FX.hurt = 0;
  for (const k in shown) shown[k] = k === 'phase' || k === 'poor' ? '' : k === 'ready' || k === 'boss' || k === 'placing' || k === 'canUp' ? null : -1;
  boardEl.classList.remove('placing');
  bannerEl.classList.remove('on'); toastEl.classList.remove('on'); bossEl.classList.remove('on');
  resizeView();
  if (decalCtx) { decalCtx.setTransform(1, 0, 0, 1, 0, 0); decalCtx.clearRect(0, 0, decal.width, decal.height); }
  renderInfo(true); renderBell();
}
function begin() {
  AUDIO.init(); AUDIO.setLevel(save.snd); AUDIO.resume(); AUDIO.setVerse(0); AUDIO.music(true);
  closeCard();
  S.started = true; S.speed = save.speed || 1;
  announce(WATCHES[0].name, STORY.watch[0], 5200);
  if (save.runs < 3) setTimeout(() => { if (S.game && !S.game.towers.length && !UI.modal) toast('<span><b>Ink first</b>Pick a design from the flash, then press it into the skin beside the rope.</span>', 7000); }, 5400);
}
function restart(seed) { newNight(seed, save.tier); AUDIO.setVerse(0); AUDIO.music(true); closeCard(); S.started = true; announce(WATCHES[0].name, STORY.watch[0], 4200); }

/* ---------- hands ---------- */
veil.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tier],[data-tab]');
  if (!t) { if (e.target === veil && (UI.modal === 'book' || UI.modal === 'pause')) backFromCard(); return; }
  AUDIO.init(); AUDIO.resume(); AUDIO.click();
  if (t.dataset.tier) {
    save.tier = t.dataset.tier; persist();
    veil.querySelectorAll('.tier').forEach(b => b.setAttribute('aria-checked', String(b === t)));
    if (!S.started) newNight(S.game.seed, save.tier);
    return;
  }
  if (t.dataset.tab && !t.dataset.act) { showBook(t.dataset.tab); return; }
  const a = t.dataset.act;
  if ((a === 'again' || a === 'over' || a === 'title') && UI.modal === 'pause' && S.game.wave > 0 && !t.dataset.armed) {
    t.dataset.armed = '1'; t.classList.add('arm'); t.textContent = 'Sure? ' + t.textContent;
    return;
  }
  if (a === 'go') begin();
  else if (a === 'book') showBook(t.dataset.tab || 'how');
  else if (a === 'close') backFromCard();
  else if (a === 'again') restart(S.game.seed);
  else if (a === 'over') restart(0);
  else if (a === 'title') { S.started = false; AUDIO.music(false); newNight(0, save.tier); showTitle(); }
  else if (a === 'snd') { cycleSound(); t.textContent = SOUND_WORDS[save.snd]; }
  else if (a === 'spd') { setSpeed(S.speed % 3 + 1); t.textContent = 'Speed ' + S.speed + '×'; }
});
function backFromCard() {
  if (UI.modal === 'book' && UI.bookFrom) {
    const from = UI.bookFrom; UI.bookFrom = null;
    if (from === 'title') showTitle(); else if (from === 'pause') showPause(); else if (from === 'end') showEnd(S.game.phase === 'won'); else closeCard();
  } else if (UI.modal === 'title' || UI.modal === 'end') return;
  else closeCard();
}
infoEl.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act;
  if (a === 'cancel') cancel(); else if (a === 'up') doUpgrade(); else if (a === 'sell') doSell(); else if (a === 'pri') doPri();
});
bellEl.addEventListener('click', strikeBell);
gripEl.addEventListener('click', holdFast);
hud.speed.addEventListener('click', () => { setSpeed(S.speed % 3 + 1); AUDIO.click(); });
hud.pause.addEventListener('click', () => { if (S.started && !UI.modal) showPause(); });
hud.sound.addEventListener('click', cycleSound);
hud.book.addEventListener('click', () => { if (UI.modal === 'book') backFromCard(); else showBook('how'); });

shopEl.addEventListener('pointerdown', e => {
  const b = e.target.closest('.flash');
  if (!b || !S.started || UI.modal || !e.isPrimary) return;                  // one finger at a time
  UI.shopPress = { type: b.dataset.type, x: e.clientX, y: e.clientY, id: e.pointerId, moved: false, touch: e.pointerType !== 'mouse' };
});
window.addEventListener('pointermove', e => {
  const sp = UI.shopPress;
  if (!sp || e.pointerId !== sp.id) return;
  if (!sp.moved && hypot(e.clientX - sp.x, e.clientY - sp.y) > 12) { sp.moved = true; UI.dragged = true; if (S.placing !== sp.type) setPlacing(sp.type); }
  if (sp.moved && S.placing) { UI.lastX = e.clientX; UI.lastY = e.clientY; ghostAt(e.clientX, e.clientY, sp.touch); }
});
function endShopPress(e, cancelled) {
  const sp = UI.shopPress;
  if (!sp || e.pointerId !== sp.id) return;
  UI.shopPress = null;
  if (!sp.moved) return;
  const r = cv.getBoundingClientRect(), inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY - (sp.touch ? 58 : 0) >= r.top - 30 && e.clientY <= r.bottom + 70;
  if (!cancelled && inside && S.placing) { ghostAt(e.clientX, e.clientY, sp.touch); tryPlace(false); if (S.placing && !sp.touch) S.ghost = null; }
  else if (S.placing) setPlacing(null);
  setTimeout(() => { UI.dragged = false; }, 0);
}
window.addEventListener('pointerup', e => { endShopPress(e, false); if (UI.press && UI.press.id === e.pointerId) UI.press = null; });
window.addEventListener('pointercancel', e => { endShopPress(e, true); if (UI.press && UI.press.id === e.pointerId) UI.press = null; });
shopEl.addEventListener('click', e => {
  const b = e.target.closest('.flash');
  if (!b || !S.started || UI.modal) return;
  if (UI.dragged) { UI.dragged = false; return; }
  AUDIO.resume(); AUDIO.click();
  if (S.placing === b.dataset.type) setPlacing(null);
  else {
    setPlacing(b.dataset.type);
    if (S.game.luck < TOWERS[b.dataset.type].cost) { b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope'); }
  }
});

cv.addEventListener('pointerdown', e => {
  UI.ptype = e.pointerType;
  if (!S.started || UI.modal || e.button === 2 || !e.isPrimary) return;      // a second finger is ignored
  UI.shopPress = null;
  const G = S.game, touch = e.pointerType !== 'mouse';
  UI.lastX = e.clientX; UI.lastY = e.clientY;
  AUDIO.resume();
  if (S.placing) {
    UI.press = { id: e.pointerId, touch };
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointers cannot be captured */ }
    ghostAt(e.clientX, e.clientY, touch);
    e.preventDefault();
    return;
  }
  const r = cv.getBoundingClientRect(), w = toWorld(e.clientX - r.left, e.clientY - r.top), tw = towerAt(w.x, w.y, touch);
  if (tw) { AUDIO.click(); select(tw); }
  else if (hypot(w.x - G.hx, w.y - G.hy) < 48) { S.sel = null; UI.heartSel = true; renderInfo(); }
  else cancel();
});
cv.addEventListener('pointermove', e => {
  if (!S.started || UI.modal) return;
  UI.lastX = e.clientX; UI.lastY = e.clientY;
  if (S.placing) { if (e.pointerType === 'mouse' || UI.press) ghostAt(e.clientX, e.clientY, e.pointerType !== 'mouse'); return; }
  if (e.pointerType === 'mouse') { const r = cv.getBoundingClientRect(), w = toWorld(e.clientX - r.left, e.clientY - r.top); S.hover = towerAt(w.x, w.y, false); cv.style.cursor = S.hover ? 'pointer' : ''; }
});
cv.addEventListener('pointerup', e => {
  const p = UI.press;
  if (!p || p.id !== e.pointerId) return;
  UI.press = null;
  if (!S.placing) return;
  ghostAt(e.clientX, e.clientY, p.touch);
  tryPlace(e.shiftKey);
});
cv.addEventListener('pointercancel', () => { UI.press = null; });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { if (S.placing && !UI.press) S.ghost = null; S.hover = null; } });
cv.addEventListener('contextmenu', e => { e.preventDefault(); if (UI.ptype === 'mouse') cancel(); });

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.repeat && e.key !== 'Tab') return;               // a held key is one press: it must not confirm its own "Sure?"
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (UI.modal) {
    if (k === 'Escape') { if (UI.modal === 'title') return; backFromCard(); e.preventDefault(); }
    else if (k === 'Enter' && UI.modal === 'title' && document.activeElement && document.activeElement.dataset.act !== 'book' && !document.activeElement.dataset.tier) { begin(); e.preventDefault(); }
    else if (k === 'Tab') {                                // keep the tab key inside the card
      const f = [...veil.querySelectorAll('button')];
      if (!f.length) return;
      const i = f.indexOf(document.activeElement), n = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i === f.length - 1 ? 0 : i + 1);
      f[n].focus(); e.preventDefault();
    }
    return;
  }
  if (!S.started) return;
  const inBtn = document.activeElement && document.activeElement.tagName === 'BUTTON';
  if (k >= '1' && k <= '5') { const t = TOWER_ORDER[+k - 1]; setPlacing(S.placing === t ? null : t); AUDIO.click(); }
  else if (k === 'Escape') cancel();
  else if (k === ' ' || k === 'Enter') { if (inBtn) return; strikeBell(); e.preventDefault(); }
  else if (k === 'u') doUpgrade();
  else if (k === 't') doPri();
  else if (k === 'x' || k === 'Delete' || k === 'Backspace') doSell();
  else if (k === 'h' || k === 'g') holdFast();
  else if (k === 'f') { setSpeed(S.speed % 3 + 1); AUDIO.click(); }
  else if (k === 'p') showPause();
  else if (k === 'm') cycleSound();
  else if (k === 'b' || k === '?') showBook('how');
});
/* a mouse click should not leave Space aimed at whatever was clicked last */
document.addEventListener('click', e => { const b = e.detail > 0 && e.target.closest && e.target.closest('button'); if (b && !veil.contains(b)) b.blur(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) AUDIO.suspend(); else if (S.started) AUDIO.resume(); });

/* ---------- the clock ---------- */
let lastTs = 0, acc = 0;
function tick(ts) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.1, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  const G = S.game;
  if (!G) return;
  const live = S.started && !UI.modal && G.phase !== 'won' && G.phase !== 'lost';
  if (live) {
    acc += dt * S.speed;
    let n = 0;
    while (acc >= SIM_DT && n < 12) { G.step(SIM_DT); acc -= SIM_DT; n++; if (G.events.length) drain(); }
    if (n === 12) acc = 0;
    stepFx(dt * S.speed);
  } else if (!UI.modal || UI.modal === 'end') stepFx(dt);
  syncHud(frame(dt) || null);
}

/* ---------- raise the curtain ---------- */
function boot() {
  buildShop();
  hud.pips.innerHTML = Array.from({ length: 8 }, (_, i) => `<span class="pip${i && i % 2 === 0 ? ' sep' : ''}">${ICON.pip}</span>`).join('');
  hud.pause.innerHTML = ICON.pause;
  gripEl.innerHTML = fistsSVG(0, true) + '<small>Hold fast</small>';
  const q = new URLSearchParams(location.search), night = parseInt(q.get('night'), 10);
  if (isTier(q.get('tier'))) save.tier = q.get('tier');
  newNight(night > 0 ? night : 0, save.tier);
  let rz = 0;
  const onResize = () => {
    cancelAnimationFrame(rz);
    rz = requestAnimationFrame(() => {
      if (!S.started && S.game) { const seed = S.game.seed; newNight(seed, save.tier); }   // nothing inked yet: re-lay the rope to fit
      else resizeView();
      renderBell();
    });
  };
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(boardEl); else window.addEventListener('resize', onResize);
  showTitle();
  requestAnimationFrame(tick);
}
boot();
/* a handle for the curious, and for the scripts that test this page */
window.__holdfast = { S, UI, FX, VIEW, AUDIO, Game, TOWERS, ENEMIES, WAVES, strikeBell, holdFast, newNight, begin, restart, setPlacing, select, toWorld };

})();
</script>
</body>
