/* =========================================================================
   CANVAS
   ========================================================================= */

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });
let view = { scale:1, dpr:1, w:WORLD_W, h:WORLD_H };

function fitCanvas() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.25);
  const w = Math.max(320, Math.round(r.width)), h = Math.max(210, Math.round(r.height));
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  view.dpr = dpr; view.w = w; view.h = h;
  view.scale = Math.min(w / WORLD_W, h / WORLD_H);
  view.ox = (w - WORLD_W * view.scale) / 2;
  view.oy = (h - WORLD_H * view.scale) / 2;
}
function toWorld(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  const x = (clientX - r.left) * (view.w / r.width);
  const y = (clientY - r.top)  * (view.h / r.height);
  return { x: (x - view.ox) / view.scale, y: (y - view.oy) / view.scale };
}

/* ---------- the cloth: baked once per map, damaged permanently in place --- */

const cloth = document.createElement('canvas');
cloth.width = WORLD_W; cloth.height = WORLD_H;
const cctx = cloth.getContext('2d');

function bakeLinen() {
  // Plain weave, generated per pixel: warp over weft, weft over warp, plus
  // slubs and the general unevenness of anything made by hand.
  const img = cctx.createImageData(WORLD_W, WORLD_H);
  const d = img.data;
  const base = [229, 217, 191];
  const nr = mulberry32(0x5EED ^ (S.map ? S.map.seed : 1));
  // low-frequency mottle field
  const MW = 40, MH = 28, mot = new Float32Array(MW * MH);
  for (let i = 0; i < mot.length; i++) mot[i] = nr() * 2 - 1;
  const mottle = (x, y) => {
    const fx = x / WORLD_W * (MW - 1), fy = y / WORLD_H * (MH - 1);
    const x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0;
    const x1 = Math.min(MW - 1, x0 + 1), y1 = Math.min(MH - 1, y0 + 1);
    return lerp(lerp(mot[y0 * MW + x0], mot[y0 * MW + x1], tx),
                lerp(mot[y1 * MW + x0], mot[y1 * MW + x1], tx), ty);
  };
  const BUMP = [-7, 4, 4, -7];
  let p = 0;
  for (let y = 0; y < WORLD_H; y++) {
    const by = (y >> 2) & 1, fy = y & 3;
    for (let x = 0; x < WORLD_W; x++) {
      const bx = (x >> 2) & 1;
      const over = bx ^ by;                       // which thread is on top here
      const fx = x & 3;
      let v = over ? 9 : -11;                     // over-threads catch the light
      v += BUMP[over ? fy : fx];                  // rounding across the thread
      v += mottle(x, y) * 7;                      // hand-dyed unevenness
      v += (Math.random() * 2 - 1) * 3.2;         // fibre noise
      d[p]     = clamp(base[0] + v, 0, 255);
      d[p + 1] = clamp(base[1] + v * 0.96, 0, 255);
      d[p + 2] = clamp(base[2] + v * 0.86, 0, 255);
      d[p + 3] = 255;
      p += 4;
    }
  }
  cctx.putImageData(img, 0, 0);

  // slubs: thicker bits of yarn
  cctx.save();
  for (let i = 0; i < 130; i++) {
    const x = nr() * WORLD_W, y = nr() * WORLD_H, horiz = nr() < 0.5, L = 8 + nr() * 46;
    cctx.globalAlpha = 0.05 + nr() * 0.07;
    cctx.strokeStyle = nr() < 0.5 ? '#fdf5e2' : '#a9906a';
    cctx.lineWidth = 1 + nr() * 2.2;
    cctx.beginPath();
    cctx.moveTo(x, y); cctx.lineTo(horiz ? x + L : x, horiz ? y : y + L);
    cctx.stroke();
  }
  // age spots
  for (let i = 0; i < 16; i++) {
    const x = nr() * WORLD_W, y = nr() * WORLD_H, R = 22 + nr() * 90;
    const gr = cctx.createRadialGradient(x, y, 0, x, y, R);
    gr.addColorStop(0, 'rgba(150,116,64,0.055)');
    gr.addColorStop(1, 'rgba(150,116,64,0)');
    cctx.globalAlpha = 1; cctx.fillStyle = gr;
    cctx.beginPath(); cctx.arc(x, y, R, 0, TAU); cctx.fill();
  }
  cctx.restore();
}

function strokePath(c, pts, w, style, cap) {
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  c.lineWidth = w; c.strokeStyle = style; c.lineCap = cap || 'round'; c.lineJoin = 'round';
  c.stroke();
}

function bakeSnag() {
  const m = S.map, p = m.pts;
  cctx.save();
  // 1. the worn channel: the weave is thin where the thread was dragged out
  strokePath(cctx, p, 46, 'rgba(120,96,58,0.10)');
  strokePath(cctx, p, 34, 'rgba(120,96,58,0.13)');
  strokePath(cctx, p, 26, '#cdbc97');
  strokePath(cctx, p, 22, '#d6c7a4');
  // 2. picked fibres along both lips of the channel
  const nr = mulberry32(0xBEE5 ^ m.seed);
  cctx.lineWidth = 1;
  for (let i = 2; i < p.length - 2; i += 1) {
    const a = p[i], b = p[i + 1];
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    for (let s = -1; s <= 1; s += 2) {
      if (nr() > 0.55) continue;
      const nx = Math.cos(ang + s * Math.PI / 2), ny = Math.sin(ang + s * Math.PI / 2);
      const l0 = 11 + nr() * 2, l1 = l0 + 3 + nr() * 7;
      cctx.strokeStyle = 'rgba(126,102,64,' + (0.16 + nr() * 0.26).toFixed(3) + ')';
      cctx.beginPath();
      cctx.moveTo(a.x + nx * l0, a.y + ny * l0);
      cctx.lineTo(a.x + nx * l1 + (nr() - 0.5) * 4, a.y + ny * l1 + (nr() - 0.5) * 4);
      cctx.stroke();
    }
  }
  // 3. the pulled thread itself, couched down the middle with visible twist
  strokePath(cctx, p, 7, 'rgba(70,54,32,0.20)');
  strokePath(cctx, p, 5.4, '#b39a70');
  cctx.save();
  cctx.setLineDash([3, 4]); cctx.lineDashOffset = 0;
  strokePath(cctx, p, 4.6, 'rgba(255,243,215,0.35)');
  cctx.setLineDash([2, 6]);
  strokePath(cctx, p, 5.6, 'rgba(84,64,38,0.34)');
  cctx.restore();
  // 4. couching stitches holding it down
  let acc = 0;
  for (let i = 0; i < m.segs.length; i++) {
    const s = m.segs[i]; acc += s.len;
    if (acc < 21) continue; acc = 0;
    const nx = Math.cos(s.ang + Math.PI / 2), ny = Math.sin(s.ang + Math.PI / 2);
    cctx.strokeStyle = 'rgba(96,74,44,0.5)'; cctx.lineWidth = 1.7; cctx.lineCap = 'round';
    cctx.beginPath();
    cctx.moveTo(s.a.x - nx * 6.5, s.a.y - ny * 6.5);
    cctx.lineTo(s.a.x + nx * 6.5, s.a.y + ny * 6.5);
    cctx.stroke();
  }
  cctx.restore();
}

/* A leak burns a real hole. It never heals; you can read the whole game off
   the cloth at the end. */
function punchHole(x, y, R) {
  const nr = mulberry32(((x * 7349 + y * 911) | 0) >>> 0);
  cctx.save();
  // frayed rim first
  for (let i = 0; i < 26; i++) {
    const a = nr() * TAU, r0 = R * (0.72 + nr() * 0.3), r1 = R * (1.02 + nr() * 0.65);
    cctx.strokeStyle = 'rgba(120,96,58,' + (0.2 + nr() * 0.4).toFixed(2) + ')';
    cctx.lineWidth = 0.8 + nr() * 1.6;
    cctx.beginPath();
    cctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0);
    cctx.lineTo(x + Math.cos(a + (nr() - 0.5) * 0.5) * r1, y + Math.sin(a + (nr() - 0.5) * 0.5) * r1);
    cctx.stroke();
  }
  // the Wardrobe Dark behind
  cctx.beginPath();
  const N = 16;
  for (let i = 0; i <= N; i++) {
    const a = i / N * TAU, rr = R * (0.62 + nr() * 0.34);
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i === 0) cctx.moveTo(px, py); else cctx.lineTo(px, py);
  }
  cctx.closePath();
  const gr = cctx.createRadialGradient(x, y, 0, x, y, R);
  gr.addColorStop(0, '#080605'); gr.addColorStop(0.72, '#100c09'); gr.addColorStop(1, 'rgba(24,18,13,0.75)');
  cctx.fillStyle = gr; cctx.fill();
  cctx.restore();
}

function rebakeCloth() {
  bakeLinen();
  bakeSnag();
  for (const h of S.holes) punchHole(h.x, h.y, h.r);
}

/* =========================================================================
   ENTITIES
   ========================================================================= */

function towerAt(c, r) { for (const t of S.towers) if (t.c === c && t.r === r) return t; return null; }
function canBuild(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return false;
  if (!S.map.build[idxOf(c, r)]) return false;
  return !towerAt(c, r);
}

function makeTower(key, c, r) {
  return {
    key, lvl:0, c, r,
    x: c * CELL + CELL / 2, y: r * CELL + CELL / 2,
    cd: 0, ang: -Math.PI / 2, mode: 'first',
    burstLeft: 0, burstT: 0,
    kills: 0, dealt: 0, invested: TOWERS[key].cost,
    sew: 0.5, smother: 0, fireFlash: 0, pulseAnim: 0, seed: rng() * 1000
  };
}

/* Resolved stats, including whatever wax is within reach. */
function tstats(t) {
  const T = TOWERS[t.key];
  const s = Object.assign({}, T.tiers[t.lvl]);
  s.type = T; s.lvl = t.lvl;
  let bd = 0, br = 0;
  if (t.key !== 'wax') {
    for (const w of S.towers) {
      if (w.key !== 'wax' || w === t) continue;
      const ws = TOWERS.wax.tiers[w.lvl];
      const dx = w.x - t.x, dy = w.y - t.y;
      if (dx * dx + dy * dy <= ws.range * ws.range) { bd = Math.max(bd, ws.buffD); br = Math.max(br, ws.buffR); }
    }
  }
  s.buffD = bd; s.buffR = br;
  if (s.dmg) s.dmg = s.dmg * (1 + bd);
  if (s.rate) s.rate = s.rate / (1 + br);
  return s;
}
function upgradeCost(t) { const T = TOWERS[t.key]; return t.lvl < 4 ? T.tiers[t.lvl + 1].cost : 0; }
function sellValue(t) { return Math.floor(t.invested * 0.7); }

/* ------------------------------------------------------------- enemies --- */

function hpScale(courseNo) {
  const w = courseNo - 1;
  return (1 + 0.13 * w + 0.006 * w * w) * S.diff.hp;
}

function spawnEnemy(id, courseNo, offset) {
  const def = ENEMIES[id];
  const scale = def.noScale ? (0.62 + 0.38 * S.diff.hp) : hpScale(courseNo);
  const hp = Math.round(def.hp * scale);
  const e = {
    id, def, boss: !!def.boss, fly: !!def.fly,
    hp, maxHp: hp,
    d: -(offset || 0), prog: 0,
    x: S.map.entry.x, y: S.map.entry.y, ang: 0,
    baseSpd: def.spd * (def.boss ? 1 : rand(0.94, 1.06)),
    slowT: 0, slowAmt: 0, rootT: 0,
    frayT: 0, frayDps: 0,
    phaseT: def.phase ? rand(1, def.phase[0]) : 0, phasing: false,
    shield: def.shield || 0, maxShield: def.shield || 0, shieldT: 0,
    accelMul: 1, spawnT: def.spawn ? def.spawn.every : 0,
    smotherT: 2.5,
    rootImmT: 0, waxCd: 0,
    alive: true, hurtT: 0, wob: rng() * TAU, seed: rng() * 1000, bounty: def.bounty
  };
  if (e.fly) {
    const hx = S.map.heart.x - S.map.entry.x, hy = S.map.heart.y - S.map.entry.y;
    e.flyLen = Math.hypot(hx, hy);
    e.flyDx = hx / e.flyLen; e.flyDy = hy / e.flyLen;
  }
  S.enemies.push(e);
  S.alive++;
  if (e.boss) { S.boss = e; Snd.boss(); }
  return e;
}

function enemySpeed(e) {
  let s = e.baseSpd * e.accelMul;
  if (e.rootT > 0) return 0;
  if (e.slowT > 0) {
    const res = e.def.slowRes || 0;
    s *= (1 - e.slowAmt * (1 - res));
  }
  if (e.def.erratic) s *= 0.55 + 0.85 * (0.5 + 0.5 * Math.sin(S.time * 5.5 + e.wob));
  return s;
}

function applySlow(e, amt, dur) {
  if (amt <= 0) return;
  if (amt >= e.slowAmt || e.slowT <= 0) { e.slowAmt = amt; e.slowT = Math.max(e.slowT, dur); }
  else e.slowT = Math.max(e.slowT, dur);
}
/* Roots have diminishing returns. Without this, two long-rooting Bodkins can
   overlap forever and an enemy never advances or dies, which hangs the course.
   After every pin an enemy gets a window in which it cannot be pinned again,
   so the Unpicking always makes progress no matter how the frame is built. */
const ROOT_RECOVERY = 1.0;
function applyRoot(e, dur) {
  if (e.def.rootImm || dur <= 0) return;
  if (e.rootImmT > 0) return;
  e.rootT = Math.max(e.rootT, dur);
  e.rootImmT = dur + ROOT_RECOVERY;
}

function damage(e, amount, opts) {
  if (!e.alive || e.phasing) return 0;
  opts = opts || {};
  let armorFactor = 1;
  if (opts.dmgType === 'sever') armorFactor = 0.5;
  else if (opts.dmgType === 'true') armorFactor = 0;
  else armorFactor = 1 - (opts.apen || 0);
  let amt = amount;
  if (opts.chain && e.def.chainVuln) amt *= e.def.chainVuln;
  if (e.boss && opts.bossMul) amt *= opts.bossMul;
  const eff = (e.def.armor || 0) * armorFactor;
  let dmg = Math.max(1, amt - eff);

  if (e.shield > 0) {
    const absorbed = Math.min(e.shield, dmg);
    e.shield -= absorbed; dmg -= absorbed; e.shieldT = 0;
    if (dmg <= 0) { e.hurtT = 0.12; return absorbed; }
  }
  e.shieldT = 0;
  e.hp -= dmg; e.hurtT = 0.14;
  if (opts.src) { opts.src.dealt += dmg; }
  if (e.hp <= 0) killEnemy(e, opts.src);
  return dmg;
}

function killEnemy(e, src) {
  if (!e.alive) return;
  e.alive = false; S.alive--;
  S.stats.killed++;
  if (src) src.kills++;
  const gold = Math.round(e.bounty * (1 + 0.03 * (S.course - 1)));
  addFloss(gold);
  floatText(e.x, e.y - e.def.r - 6, '+' + gold, C.brass2, e.boss ? 20 : 13);
  burst(e.x, e.y, e.boss ? 46 : 12, e.def.col, e.def.r);
  if (e.boss) { Snd.big(); S.shake = Math.max(S.shake, 16); S.flash = 0.5; if (S.boss === e) S.boss = null; }
  else Snd.kill();
  if (e.def.split) {
    for (let i = 0; i < e.def.split.length; i++) {
      const child = spawnEnemy(e.def.split[i], S.course, 0);
      child.d = e.d - (i * 13) - 6;
      child.hp = Math.round(child.maxHp * (e.boss ? 1 : 0.75));
      child.maxHp = child.hp;
      if (!e.fly && child.fly) { child.fly = false; }
    }
  }
}

function leak(e) {
  e.alive = false; S.alive--;
  S.stats.leaked++;
  const dmg = Math.min(S.warp, e.def.leak);
  S.warp -= dmg;
  S.shake = Math.max(S.shake, e.boss ? 22 : 9);
  S.flash = Math.max(S.flash, e.boss ? 0.6 : 0.25);
  Snd.leak();
  const a = rand(0, TAU), rr = rand(0, 26);
  const hx = S.map.heart.x + Math.cos(a) * rr, hy = S.map.heart.y + Math.sin(a) * rr;
  const hole = { x: hx, y: hy, r: 9 + dmg * 5 };
  S.holes.push(hole); punchHole(hx, hy, hole.r);
  floatText(S.map.heart.x, S.map.heart.y - 34, '-' + dmg + ' warp', '#ff9c8e', 18);
  toast(e.def.name + ' reached the knot', 'bad');
  gaugeHurt();
  if (S.boss === e) S.boss = null;
  if (S.warp <= 0) endGame(false);
}

/* --------------------------------------------------------------- effects - */

function burst(x, y, n, col, spread) {
  for (let i = 0; i < n; i++) {
    const a = rng() * TAU, sp = rand(20, 130);
    S.fx.push({ k:'lint', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                life:rand(0.3,0.9), max:0.9, col, s:rand(1.1,3.1), rot:rng()*TAU, vr:rand(-6,6) });
  }
  for (let i = 0; i < Math.max(2, n / 4); i++) {
    const a = rng() * TAU, sp = rand(30, 90);
    S.fx.push({ k:'snip', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                life:rand(0.4,1.0), max:1.0, col, s:rand(4,9), rot:rng()*TAU, vr:rand(-9,9) });
  }
}
function floatText(x, y, txt, col, size) {
  S.texts.push({ x, y, txt, col, size: size || 13, life: 1.0, vy: -30 });
}
function arcFx(pts, col) { S.fx.push({ k:'arc', pts, col, life:0.2, max:0.2 }); }

/* --------------------------------------------------------------- targeting */

function targetable(e, air) {
  if (!e.alive || e.phasing || e.d < 0) return false;
  if (e.fly && !air) return false;
  return true;
}
function pickTarget(t, st) {
  const air = st.type.air, R2 = st.range * st.range;
  let best = null, bestV = 0;
  for (const e of S.enemies) {
    if (!targetable(e, air)) continue;
    const dx = e.x - t.x, dy = e.y - t.y, d2 = dx * dx + dy * dy;
    if (d2 > R2) continue;
    let v;
    switch (t.mode) {
      case 'last':   v = -e.prog; break;
      case 'strong': v = e.hp; break;
      case 'close':  v = -d2; break;
      default:       v = e.prog;
    }
    if (!best || v > bestV) { best = e; bestV = v; }
  }
  return best;
}

/* =========================================================================
   SIMULATION
   ========================================================================= */

function fire(t, st, target) {
  const T = TOWERS[t.key];
  t.fireFlash = 0.12;
  const dx = target.x - t.x, dy = target.y - t.y;
  t.ang = Math.atan2(dy, dx);

  if (t.key === 'knot') {
    let dmg = st.dmg, crit = false;
    if (st.crit && rng() < st.crit) { dmg *= st.critX; crit = true; }
    S.shots.push({ k:'knot', x:t.x + Math.cos(t.ang)*15, y:t.y + Math.sin(t.ang)*15,
                   tgt:target, spd:640, dmg, crit, col:T.color, src:t, life:1.6,
                   dmgType:T.dmgType, trail:[] });
    Snd.knot();

  } else if (t.key === 'pin') {
    const ang = t.ang;
    S.shots.push({ k:'pin', x:t.x + Math.cos(ang)*20, y:t.y + Math.sin(ang)*20,
                   vx:Math.cos(ang)*1080, vy:Math.sin(ang)*1080,
                   dmg:st.dmg, pierce:st.pierce, apen:st.apen, root:st.root, bossMul:st.boss,
                   hit:new Set(), col:T.color, src:t, life:0.72, dmgType:T.dmgType, len:26 });
    Snd.pin();
    t.recoil = 1;

  } else if (t.key === 'chain') {
    let cur = target, dmg = st.dmg;
    const hitSet = new Set([cur]);
    const pts = [{ x:t.x, y:t.y }];
    for (let b = 0; b <= st.bounce; b++) {
      pts.push({ x:cur.x, y:cur.y });
      damage(cur, dmg, { dmgType:T.dmgType, chain:true, src:t });
      applySlow(cur, st.slow, st.slowT);
      let nxt = null, nd = 1e9;
      for (const e of S.enemies) {
        if (!targetable(e, true) || hitSet.has(e)) continue;
        const ddx = e.x - cur.x, ddy = e.y - cur.y, d2 = ddx * ddx + ddy * ddy;
        if (d2 < 132 * 132 && d2 < nd) { nd = d2; nxt = e; }
      }
      if (!nxt) break;
      cur = nxt; hitSet.add(cur); dmg *= st.fall;
    }
    arcFx(pts, T.color);
    Snd.chain();

  } else if (t.key === 'blanket') {
    S.rings.push({ x:t.x, y:t.y, r:10, maxR:st.range, dmg:st.dmg, fray:st.fray, frayT:st.frayT,
                   slowBonus:st.slowBonus, hit:new Set(), col:T.color, src:t, life:1, dmgType:T.dmgType });
    t.pulseAnim = 1;
    Snd.pulse();
  }
}

function stepTowers(dt) {
  for (const t of S.towers) {
    if (t.sew > 0) t.sew -= dt;
    if (t.fireFlash > 0) t.fireFlash -= dt;
    if (t.pulseAnim > 0) t.pulseAnim -= dt * 2.2;
    if (t.recoil > 0) t.recoil -= dt * 5;
    if (t.smother > 0) { t.smother -= dt; continue; }
    if (t.key === 'wax') continue;

    const st = tstats(t);
    // burst continuation
    if (t.burstLeft > 0) {
      t.burstT -= dt;
      if (t.burstT <= 0) {
        const tgt = pickTarget(t, st);
        if (tgt) { fire(t, st, tgt); t.burstLeft--; t.burstT = 0.075; }
        else t.burstLeft = 0;
      }
      continue;
    }
    t.cd -= dt;
    // idle aim so the frame never looks dead
    const tgt = pickTarget(t, st);
    if (tgt) {
      const want = Math.atan2(tgt.y - t.y, tgt.x - t.x);
      let df = ((want - t.ang + Math.PI * 3) % TAU) - Math.PI;
      t.ang += df * Math.min(1, dt * 14);
      if (t.cd <= 0) {
        fire(t, st, tgt);
        t.cd = st.rate;
        if ((st.burst || 1) > 1) { t.burstLeft = st.burst - 1; t.burstT = 0.075; }
      }
    }
  }
}

function stepWax(dt) {
  for (const w of S.towers) {
    if (w.key !== 'wax' || w.smother > 0) continue;
    const ws = TOWERS.wax.tiers[w.lvl];
    const R2 = ws.range * ws.range;
    for (const e of S.enemies) {
      if (!e.alive || e.d < 0 || e.fly) continue;
      const dx = e.x - w.x, dy = e.y - w.y;
      if (dx * dx + dy * dy > R2) continue;
      applySlow(e, ws.slow, 0.35);
      /* An occasional proc, on a per-vermin cooldown. Rolling this every tick
         would set anything in the aura solid permanently. */
      if (ws.freeze && e.waxCd <= 0 && !e.def.rootImm && e.rootT <= 0 && e.rootImmT <= 0) {
        e.waxCd = 2.6;
        if (rng() < ws.freeze) { applyRoot(e, 0.85); floatText(e.x, e.y - 16, 'set', '#ffd27a', 11); }
      }
    }
  }
}

function stepShots(dt) {
  for (let i = S.shots.length - 1; i >= 0; i--) {
    const p = S.shots[i];
    p.life -= dt;
    if (p.life <= 0) { S.shots.splice(i, 1); continue; }

    if (p.k === 'knot') {
      const tgt = p.tgt;
      if (!tgt || !tgt.alive) {
        p.x += Math.cos(p.ang || 0) * p.spd * dt;
        p.life -= dt * 4;
        continue;
      }
      const dx = tgt.x - p.x, dy = tgt.y - p.y, d = Math.hypot(dx, dy) || 1;
      p.ang = Math.atan2(dy, dx);
      const step = p.spd * dt;
      p.trail.push({ x:p.x, y:p.y }); if (p.trail.length > 7) p.trail.shift();
      if (step >= d - (tgt.def.r * 0.6)) {
        damage(tgt, p.dmg, { dmgType:p.dmgType, src:p.src });
        if (p.crit) floatText(tgt.x, tgt.y - tgt.def.r - 4, Math.round(p.dmg) + '!', '#ffd27a', 14);
        burst(p.x, p.y, 3, p.col, 4);
        Snd.hit();
        S.shots.splice(i, 1);
      } else { p.x += dx / d * step; p.y += dy / d * step; }

    } else if (p.k === 'pin') {
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      for (const e of S.enemies) {
        if (!targetable(e, true) || p.hit.has(e)) continue;
        // point-segment distance
        const ax = nx - p.x, ay = ny - p.y;
        const bx = e.x - p.x, by = e.y - p.y;
        const L2 = ax * ax + ay * ay || 1;
        const tt = clamp((ax * bx + ay * by) / L2, 0, 1);
        const px = p.x + ax * tt, py = p.y + ay * tt;
        if (Math.hypot(e.x - px, e.y - py) <= e.def.r + 5) {
          p.hit.add(e);
          damage(e, p.dmg, { dmgType:p.dmgType, apen:p.apen, bossMul:p.bossMul, src:p.src });
          applyRoot(e, p.root);
          burst(px, py, 5, '#fff3d8', 4);
          Snd.hit();
          if (p.hit.size >= p.pierce) { S.shots.splice(i, 1); break; }
        }
      }
      if (S.shots[i] === p) {
        p.x = nx; p.y = ny;
        if (p.x < -60 || p.y < -60 || p.x > WORLD_W + 60 || p.y > WORLD_H + 60) S.shots.splice(i, 1);
      }
    }
  }
}

function stepRings(dt) {
  for (let i = S.rings.length - 1; i >= 0; i--) {
    const g = S.rings[i];
    const grow = g.maxR / 0.30;
    g.r += grow * dt;
    for (const e of S.enemies) {
      if (!e.alive || e.d < 0 || e.fly || e.phasing || g.hit.has(e)) continue;
      const d = Math.hypot(e.x - g.x, e.y - g.y);
      if (d <= g.r + e.def.r * 0.5) {
        g.hit.add(e);
        let dmg = g.dmg;
        if (g.slowBonus && e.slowT > 0) dmg *= 1 + g.slowBonus;
        damage(e, dmg, { dmgType:g.dmgType, src:g.src });
        if (g.fray > 0 && e.alive) { e.frayDps = Math.max(e.frayDps, g.fray); e.frayT = Math.max(e.frayT, g.frayT); }
      }
    }
    if (g.r >= g.maxR) S.rings.splice(i, 1);
  }
}

function stepEnemies(dt) {
  const m = S.map;
  for (let i = S.enemies.length - 1; i >= 0; i--) {
    const e = S.enemies[i];
    if (!e.alive) { S.enemies.splice(i, 1); continue; }

    if (e.hurtT > 0) e.hurtT -= dt;
    if (e.slowT > 0) e.slowT -= dt;
    if (e.rootT > 0) e.rootT -= dt;
    if (e.rootImmT > 0) e.rootImmT -= dt;
    if (e.waxCd > 0) e.waxCd -= dt;

    if (e.frayT > 0) {
      e.frayT -= dt;
      e.hp -= e.frayDps * dt;
      if (rng() < dt * 9) S.fx.push({ k:'lint', x:e.x + rand(-6,6), y:e.y + rand(-6,6),
                                      vx:rand(-12,12), vy:rand(-26,-6), life:0.5, max:0.5, col:'#d9c9a6', s:1.6, rot:0, vr:0 });
      if (e.hp <= 0) { killEnemy(e); continue; }
    }
    if (e.def.accel) e.accelMul = Math.min(e.def.accelMax, e.accelMul + e.def.accel * dt);
    if (e.maxShield > 0 && e.shield < e.maxShield) {
      e.shieldT += dt;
      if (e.shieldT > (e.def.shieldDelay || 3)) e.shield = Math.min(e.maxShield, e.shield + e.maxShield * 0.8 * dt);
    }
    if (e.def.phase) {
      e.phaseT -= dt;
      if (e.phaseT <= 0) {
        e.phasing = !e.phasing;
        e.phaseT = e.phasing ? e.def.phase[1] : e.def.phase[0];
      }
    }
    if (e.def.heal) {
      for (const o of S.enemies) {
        if (o === e || !o.alive || o.hp >= o.maxHp) continue;
        const dx = o.x - e.x, dy = o.y - e.y;
        if (dx * dx + dy * dy < e.def.healR * e.def.healR) o.hp = Math.min(o.maxHp, o.hp + e.def.heal * dt);
      }
    }
    if (e.def.spawn && e.d >= 0) {
      e.spawnT -= dt;
      if (e.spawnT <= 0) {
        e.spawnT = e.def.spawn.every;
        for (let k = 0; k < e.def.spawn.n; k++) {
          const c = spawnEnemy(e.def.spawn.of, S.course, 0);
          c.d = Math.max(0, e.d - rand(4, 26));
          if (c.fly && !e.fly) { /* ground-launched flits still fly */ }
        }
      }
    }
    if (e.def.smother && e.d >= 0) {
      e.smotherT -= dt;
      if (e.smotherT <= 0) {
        e.smotherT = 3.2;
        let best = null, bd = 260 * 260;
        for (const t of S.towers) {
          const dx = t.x - e.x, dy = t.y - e.y, d2 = dx * dx + dy * dy;
          if (d2 < bd && t.smother <= 0) { bd = d2; best = t; }
        }
        if (best) { best.smother = 2.4; floatText(best.x, best.y - 26, 'smothered', '#b7a3d8', 12); }
      }
    }

    const spd = enemySpeed(e);
    e.d += spd * dt;

    if (e.fly) {
      const t01 = Math.max(0, e.d) ;
      e.prog = clamp(t01 / e.flyLen, 0, 1);
      const wob = Math.sin(S.time * 7 + e.wob) * (e.boss ? 9 : 15);
      e.x = m.entry.x + e.flyDx * t01 - e.flyDy * wob;
      e.y = m.entry.y + e.flyDy * t01 + e.flyDx * wob;
      e.ang = Math.atan2(e.flyDy, e.flyDx);
      if (t01 >= e.flyLen) { leak(e); S.enemies.splice(i, 1); continue; }
    } else {
      e.prog = clamp(e.d / m.total, 0, 1);
      const p = posAt(m, Math.max(0, e.d));
      e.x = p.x; e.y = p.y; e.ang = p.ang;
      if (e.d >= m.total) { leak(e); S.enemies.splice(i, 1); continue; }
    }
  }
}

function stepFx(dt) {
  for (let i = S.fx.length - 1; i >= 0; i--) {
    const f = S.fx[i];
    f.life -= dt;
    if (f.life <= 0) { S.fx.splice(i, 1); continue; }
    if (f.k !== 'arc') {
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.vx *= 0.94; f.vy *= 0.94; f.vy += 44 * dt;
      f.rot += f.vr * dt;
    }
  }
  for (let i = S.texts.length - 1; i >= 0; i--) {
    const t = S.texts[i];
    t.life -= dt * 1.15; t.y += t.vy * dt; t.vy *= 0.93;
    if (t.life <= 0) S.texts.splice(i, 1);
  }
}

/* =========================================================================
   COURSE FLOW
   ========================================================================= */

function buildSpawnQueue(courseNo) {
  const c = COURSES[courseNo - 1];
  const q = [];
  for (const grp of c.g) {
    for (let i = 0; i < grp.n; i++) q.push({ t: grp.delay + i * grp.gap, id: grp.t });
  }
  q.sort((a, b) => a.t - b.t);
  return q;
}

function startCourse() {
  if (S.phase !== 'prep' && S.phase !== 'title') return;
  S.course++;
  if (S.course > TOTAL_COURSES) { endGame(true); return; }
  // early-mend bounty: the sooner you call it, the more floss you keep
  if (S.prepT > 0) {
    const bonus = Math.ceil(S.prepT) * 2;
    addFloss(bonus);
    toast('Early mend  +' + bonus + ' floss', 'good');
  }
  // wax fonts pay out at the head of each course
  let income = 0;
  for (const t of S.towers) if (t.key === 'wax') income += TOWERS.wax.tiers[t.lvl].income || 0;
  if (income > 0) { addFloss(income); toast('Wax rendered  +' + income + ' floss', 'good'); }

  S.phase = 'course';
  S.spawnQ = buildSpawnQueue(S.course);
  S.spawnT = 0;
  S.spawnedAll = false;
  S.prepT = 0;
  Snd.wave();
  const def = COURSES[S.course - 1];
  showLedgerLine(null);
  toast('Course ' + S.course + ' \u2014 ' + def.n, def.boss ? 'bad' : '');
  syncUI();
}

function finishCourse() {
  S.phase = 'prep';
  S.boss = null;
  const bonus = 35 + S.course * 9;
  addFloss(bonus);
  Snd.clear();
  if (S.course > S.best) {
    S.best = S.course;
    try { localStorage.setItem('needleward.best', String(S.best)); } catch (e) {}
  }
  showLedgerLine(LEDGER_LINES[S.course - 1] || '');
  toast('Course held  +' + bonus + ' floss', 'good');
  unlockEntries();
  if (S.course >= TOTAL_COURSES) { endGame(true); return; }
  S.prepT = S.prepMax;
  syncUI();
}

function stepCourse(dt) {
  if (S.phase === 'prep') {
    if (S.prepT > 0) {
      S.prepT -= dt;
      if (S.prepT <= 0) { S.prepT = 0; }
      syncMendFuse();
    }
    return;
  }
  if (S.phase !== 'course') return;

  S.spawnT += dt;
  while (S.spawnQ.length && S.spawnQ[0].t <= S.spawnT) {
    const item = S.spawnQ.shift();
    spawnEnemy(item.id, S.course, 0);
  }
  if (!S.spawnQ.length) S.spawnedAll = true;
  /* Derive the live count rather than trusting the running tally: a single
     missed decrement anywhere would otherwise hang the course forever. */
  if (S.spawnedAll) {
    let live = 0;
    for (let i = 0; i < S.enemies.length; i++) if (S.enemies[i].alive) live++;
    S.alive = live;
    if (live <= 0) finishCourse();
  }
}

function addFloss(n) { S.floss += n; if (n > 0) S.stats.earned += n; gaugePulse(); }

function endGame(won) {
  if (S.phase === 'won' || S.phase === 'lost') return;
  S.phase = won ? 'won' : 'lost';
  if (won) { S.unlocked = LEDGER_ENTRIES.length; Snd.win(); }
  else Snd.lose();
  showEnd(won);
  syncUI();
}

function unlockEntries() {
  let n = 0;
  for (const e of LEDGER_ENTRIES) if (S.course >= e.at) n++;
  if (n > S.unlocked) {
    S.unlocked = n;
    toast('Ledger entry recovered', 'good');
    renderLedger();
  }
}

/* =========================================================================
   MAIN LOOP
   ========================================================================= */

let lastT = performance.now(), acc = 0;
const STEP = 1 / 120;

function frame(now) {
  requestAnimationFrame(frame);
  let raw = (now - lastT) / 1000;
  lastT = now;
  if (raw > 0.25) raw = 0.25;

  const running = !S.paused && (S.phase === 'course' || S.phase === 'prep');
  if (running) {
    acc += raw * S.speed;
    let guard = 0;
    while (acc >= STEP && guard++ < 600) {
      acc -= STEP;
      S.time += STEP;
      stepCourse(STEP);
      stepWax(STEP);
      stepTowers(STEP);
      stepShots(STEP);
      stepRings(STEP);
      stepEnemies(STEP);
      stepFx(STEP);
    }
  } else {
    // keep cosmetic timers alive so the frame breathes while paused
    S.time += raw * 0.35;
  }
  if (S.shake > 0) S.shake = Math.max(0, S.shake - raw * 42);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - raw * 1.9);

  draw();
  syncLive();
}

/* =========================================================================
   DRAWING — everything is stitched. Nothing here is an image.
   ========================================================================= */

function stitchDisc(c, x, y, r, fill, edge, hatchAng) {
  c.save();
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  c.fillStyle = fill; c.fill();
  c.save(); c.clip();
  c.globalAlpha = 0.3; c.strokeStyle = edge; c.lineWidth = 1.15;
  const ha = hatchAng || 0.32;
  for (let i = -r * 2; i < r * 2; i += 3) {
    c.beginPath();
    c.moveTo(x - r * 1.6, y + i);
    c.lineTo(x + r * 1.6, y + i + r * 2 * ha);
    c.stroke();
  }
  c.restore();
  c.strokeStyle = edge; c.lineWidth = 1.5; c.lineCap = 'round';
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke();
  const n = Math.max(9, Math.round(r * 0.85));
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    c.beginPath();
    c.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    c.lineTo(x + Math.cos(a) * (r + 3.2), y + Math.sin(a) * (r + 3.2));
    c.stroke();
  }
  c.restore();
}

function knotDot(c, x, y, r, col, hi) {
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  c.fillStyle = col; c.fill();
  c.beginPath(); c.arc(x - r * 0.3, y - r * 0.34, r * 0.42, 0, TAU);
  c.fillStyle = hi; c.globalAlpha = 0.85; c.fill(); c.globalAlpha = 1;
}

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (k > 0) { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
  else { r *= 1 + k; g *= 1 + k; b *= 1 + k; }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}

/* --------------------------------------------------------------- notions - */

function drawNotion(c, key, lvl, x, y, s, ang, tm, st) {
  const T = TOWERS[key];
  const col = T.color, dk = shade(col, -0.55), lt = shade(col, 0.5);
  c.save();
  c.translate(x, y);
  c.scale(s, s);

  // shadow onto the cloth
  c.globalAlpha = 0.22; c.fillStyle = '#4a3a24';
  c.beginPath(); c.ellipse(2.5, 4, 20, 15, 0, 0, TAU); c.fill();
  c.globalAlpha = 1;

  if (key === 'knot') {
    stitchDisc(c, 0, 0, 17, shade(col, -0.18), dk);
    const rings = [0, 1, 2, 3, 4][lvl];
    knotDot(c, 0, 0, 5.4, lt, '#fff6dd');
    const counts = [3, 5, 7, 9, 12][lvl];
    for (let i = 0; i < counts; i++) {
      const a = i / counts * TAU + tm * 0.25;
      const rr = 9.6 + (i % 2) * 2.2;
      knotDot(c, Math.cos(a) * rr, Math.sin(a) * rr, 2.5 + lvl * 0.2, col, lt);
    }
    if (lvl >= 2) { for (let i = 0; i < 6; i++) { const a = i / 6 * TAU - tm * 0.4;
      knotDot(c, Math.cos(a) * 14.4, Math.sin(a) * 14.4, 1.6, shade(col, .25), '#fff'); } }
    // the working needle
    c.rotate(ang);
    c.strokeStyle = '#bf4436'; c.lineWidth = 1.3;
    c.beginPath(); c.moveTo(2, 3); c.quadraticCurveTo(10, 4, 17, 0); c.stroke();
    c.fillStyle = '#efe6d0'; c.strokeStyle = '#5a4a34'; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(12, -1.6); c.lineTo(24 + lvl * 0.7, 0); c.lineTo(12, 1.6); c.closePath();
    c.fill(); c.stroke();

  } else if (key === 'chain') {
    stitchDisc(c, 0, 0, 17, shade(col, -0.22), dk, -0.3);
    const n = 6 + lvl;
    c.lineWidth = 2.3; c.strokeStyle = lt;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + tm * 0.7;
      c.save(); c.rotate(a); c.translate(12.6, 0); c.rotate(Math.PI / 2);
      c.beginPath(); c.ellipse(0, 0, 3.1, 4.6, 0, 0, TAU); c.stroke();
      c.restore();
    }
    const pulse = 0.5 + 0.5 * Math.sin(tm * 3.4);
    c.globalAlpha = 0.5 + 0.5 * pulse;
    knotDot(c, 0, 0, 5.6 + pulse * 1.4, shade(col, 0.35), '#eaf3ff');
    c.globalAlpha = 1;
    if (lvl >= 3) {
      c.strokeStyle = 'rgba(200,225,255,0.6)'; c.lineWidth = 1;
      for (let i = 0; i < 3; i++) { const a = tm * 2 + i / 3 * TAU;
        c.beginPath(); c.arc(0, 0, 19.5, a, a + 0.7); c.stroke(); }
    }

  } else if (key === 'pin') {
    stitchDisc(c, 0, 0, 15, '#b6ac97', '#5b5344', 0.1);
    c.save();
    c.rotate(ang);
    const rec = st && st.recoil > 0 ? st.recoil * 4 : 0;
    c.translate(-rec, 0);
    const L = 22 + lvl * 4.6;
    c.strokeStyle = 'rgba(60,48,32,0.35)'; c.lineWidth = 4.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-12, 1.6); c.lineTo(L, 1.6); c.stroke();
    c.strokeStyle = '#e8edf1'; c.lineWidth = 3.2;
    c.beginPath(); c.moveTo(-12, 0); c.lineTo(L, 0); c.stroke();
    c.strokeStyle = '#ffffff'; c.lineWidth = 1; c.globalAlpha = 0.8;
    c.beginPath(); c.moveTo(-10, -1); c.lineTo(L - 3, -1); c.stroke();
    c.globalAlpha = 1;
    c.fillStyle = '#f4f8fb';
    c.beginPath(); c.moveTo(L, -1.8); c.lineTo(L + 7 + lvl, 0); c.lineTo(L, 1.8); c.closePath(); c.fill();
    const bead = ['#bf4436', '#e2a331', '#5a7fb5', '#4f9b7d', '#9a6392'][lvl];
    c.beginPath(); c.arc(-13, 0, 5 + lvl * 0.45, 0, TAU);
    c.fillStyle = bead; c.fill();
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 0.9; c.stroke();
    c.beginPath(); c.arc(-14.5, -1.6, 1.7, 0, TAU); c.fillStyle = 'rgba(255,255,255,.8)'; c.fill();
    c.restore();

  } else if (key === 'blanket') {
    const R = 15;
    c.save();
    c.fillStyle = shade(col, -0.24);
    c.beginPath();
    c.roundRect ? c.roundRect(-R, -R, R * 2, R * 2, 3) : c.rect(-R, -R, R * 2, R * 2);
    c.fill();
    c.save(); c.clip();
    c.globalAlpha = 0.32; c.strokeStyle = dk; c.lineWidth = 1.1;
    for (let i = -R * 2; i < R * 2; i += 3) { c.beginPath(); c.moveTo(-R, i); c.lineTo(R, i + R); c.stroke(); }
    c.restore();
    c.strokeStyle = lt; c.lineWidth = 1.7; c.lineJoin = 'round'; c.lineCap = 'round';
    const per = 4 + lvl;
    for (let side = 0; side < 4; side++) {
      c.save(); c.rotate(side * Math.PI / 2);
      for (let i = 0; i <= per; i++) {
        const px = -R + (i / per) * (R * 2);
        c.beginPath(); c.moveTo(px, -R); c.lineTo(px, -R - 4.6); c.stroke();
      }
      c.beginPath(); c.moveTo(-R, -R - 4.6); c.lineTo(R, -R - 4.6); c.stroke();
      c.restore();
    }
    c.restore();
    const p = st && st.pulseAnim > 0 ? st.pulseAnim : 0;
    c.globalAlpha = 0.4 + 0.4 * Math.sin(tm * 2);
    knotDot(c, 0, 0, 5 + p * 3, lt, '#ffe8e2');
    c.globalAlpha = 1;

  } else if (key === 'wax') {
    const hexR = 9.5;
    const cells = [[0,0],[1,0],[0.5,0.87],[-0.5,0.87],[-1,0],[-0.5,-0.87],[0.5,-0.87]];
    const show = [1, 3, 5, 7, 7][lvl];
    const glow = 0.5 + 0.5 * Math.sin(tm * 1.9);
    c.save();
    c.shadowColor = 'rgba(230,170,50,' + (0.4 + glow * 0.45) + ')';
    c.shadowBlur = 12 + glow * 12;
    for (let i = 0; i < show; i++) {
      const hx = cells[i][0] * hexR * 1.62, hy = cells[i][1] * hexR * 1.62;
      c.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * TAU + Math.PI / 6;
        const px = hx + Math.cos(a) * hexR, py = hy + Math.sin(a) * hexR;
        if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
      const gr = c.createRadialGradient(hx, hy - 2, 1, hx, hy, hexR);
      gr.addColorStop(0, lvl >= 4 ? '#ffe9a8' : '#f3cf7a');
      gr.addColorStop(1, lvl >= 4 ? '#c98b16' : '#a87a20');
      c.fillStyle = gr; c.fill();
      c.strokeStyle = 'rgba(90,60,12,.62)'; c.lineWidth = 1.1; c.stroke();
    }
    c.restore();
    if (lvl >= 2) {
      c.strokeStyle = 'rgba(255,222,150,.5)'; c.lineWidth = 1;
      c.beginPath(); c.arc(0, 0, 19 + Math.sin(tm * 2.4) * 1.4, 0, TAU); c.stroke();
    }
  }

  // tier pips, worked into the ground cloth beneath
  c.rotate(0);
  for (let i = 0; i < 5; i++) {
    const a = Math.PI * 0.62 + (i / 4) * Math.PI * 0.76;
    const px = Math.cos(a) * 22.5, py = Math.sin(a) * 22.5;
    c.beginPath(); c.arc(px, py, 1.9, 0, TAU);
    c.fillStyle = i <= lvl ? C.brass2 : 'rgba(60,48,32,0.30)';
    c.fill();
  }
  c.restore();
}

/* --------------------------------------------------------------- vermin -- */

function drawVermin(c, id, x, y, s, ang, tm, e) {
  const D = ENEMIES[id];
  const col = D.col, dk = D.col2;
  const wig = Math.sin(tm * 9 + (e ? e.wob : 0));
  c.save();
  c.translate(x, y);

  if (D.fly) {
    c.save(); c.globalAlpha = 0.2; c.fillStyle = '#5a4a30';
    c.beginPath(); c.ellipse(4, 16 * s, D.r * s * 0.8, D.r * s * 0.34, 0, 0, TAU); c.fill(); c.restore();
  } else {
    c.save(); c.globalAlpha = 0.2; c.fillStyle = '#5a4a30';
    c.beginPath(); c.ellipse(1.6, 3, D.r * s * 0.95, D.r * s * 0.55, 0, 0, TAU); c.fill(); c.restore();
  }

  c.rotate(ang);
  c.scale(s, s);
  if (e && e.hurtT > 0) { c.globalAlpha = 0.86; }

  const R = D.r;
  c.lineJoin = 'round'; c.lineCap = 'round';

  switch (id) {
    case 'nib': {
      c.fillStyle = col; c.strokeStyle = dk; c.lineWidth = 1.2;
      c.beginPath();
      c.moveTo(-R, wig * 1.4);
      c.quadraticCurveTo(-R * 0.2, -R * 0.85 + wig, R * 0.55, wig * 0.6);
      c.quadraticCurveTo(R * 1.05, R * 0.1, R * 0.4, R * 0.62);
      c.quadraticCurveTo(-R * 0.3, R * 0.9 + wig, -R, wig * 1.4);
      c.fill(); c.stroke();
      c.strokeStyle = dk; c.lineWidth = 0.9; c.globalAlpha = 0.65;
      for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 3.4, -R * 0.55); c.lineTo(i * 3.4, R * 0.55); c.stroke(); }
      c.globalAlpha = 1;
      knotDot(c, R * 0.62, wig * 0.4, 1.5, '#2a221b', '#000');
      break;
    }
    case 'lint': {
      c.fillStyle = col; c.strokeStyle = dk; c.lineWidth = 0.9;
      c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fill();
      for (let i = 0; i < 9; i++) { const a = i / 9 * TAU + tm;
        c.beginPath(); c.moveTo(Math.cos(a) * R * 0.7, Math.sin(a) * R * 0.7);
        c.lineTo(Math.cos(a) * (R + 4), Math.sin(a) * (R + 4)); c.stroke(); }
      break;
    }
    case 'flit': case 'queen': {
      const big = id === 'queen';
      const flap = Math.abs(Math.sin(tm * (big ? 6 : 15) + (e ? e.wob : 0)));
      c.save();
      c.scale(1, 0.42 + 0.58 * flap);
      for (const sgn of [-1, 1]) {
        c.save(); c.scale(1, sgn);
        c.beginPath();
        c.moveTo(-R * 0.2, 0);
        c.quadraticCurveTo(-R * 1.1, -R * 1.5, R * 0.15, -R * 1.25);
        c.quadraticCurveTo(R * 0.95, -R * 0.95, R * 0.35, -R * 0.1);
        c.closePath();
        const gr = c.createLinearGradient(0, -R * 1.4, 0, 0);
        gr.addColorStop(0, shade(col, 0.28)); gr.addColorStop(1, dk);
        c.fillStyle = gr; c.fill();
        c.strokeStyle = 'rgba(30,22,14,.55)'; c.lineWidth = 1; c.stroke();
        c.globalAlpha = 0.5; c.strokeStyle = shade(col, 0.55); c.lineWidth = 0.8;
        c.beginPath(); c.moveTo(-R * 0.1, -R * 0.3); c.lineTo(R * 0.3, -R * 0.95); c.stroke();
        if (big) { c.beginPath(); c.arc(R * 0.05, -R * 0.75, R * 0.22, 0, TAU); c.stroke(); }
        c.globalAlpha = 1;
        c.restore();
      }
      c.restore();
      c.fillStyle = dk; c.strokeStyle = '#2a221b'; c.lineWidth = 0.9;
      c.beginPath(); c.ellipse(0, 0, R * 0.6, R * 0.3, 0, 0, TAU); c.fill(); c.stroke();
      c.strokeStyle = dk; c.lineWidth = 1.1;
      c.beginPath(); c.moveTo(R * 0.5, -1.5); c.quadraticCurveTo(R * 1.1, -R * 0.6, R * 1.35, -R * 0.75); c.stroke();
      c.beginPath(); c.moveTo(R * 0.5, 1.5); c.quadraticCurveTo(R * 1.1, R * 0.6, R * 1.35, R * 0.75); c.stroke();
      if (big) { knotDot(c, R * 0.45, -R * 0.16, 2.1, '#e8d7a8', '#fff'); knotDot(c, R * 0.45, R * 0.16, 2.1, '#e8d7a8', '#fff'); }
      break;
    }
    case 'silver': {
      c.fillStyle = col; c.strokeStyle = dk; c.lineWidth = 1;
      c.beginPath();
      c.moveTo(R, 0);
      c.quadraticCurveTo(R * 0.2, -R * 0.62, -R * 0.9, -R * 0.3 + wig);
      c.quadraticCurveTo(-R * 1.1, 0, -R * 0.9, R * 0.3 + wig);
      c.quadraticCurveTo(R * 0.2, R * 0.62, R, 0);
      c.fill(); c.stroke();
      c.globalAlpha = 0.6; c.strokeStyle = '#fff';
      c.beginPath(); c.moveTo(R * 0.5, -R * 0.15); c.lineTo(-R * 0.5, -R * 0.28); c.stroke();
      c.globalAlpha = 1;
      c.strokeStyle = dk; c.lineWidth = 0.9;
      for (const sgn of [-1, 0, 1]) { c.beginPath(); c.moveTo(-R * 0.85, sgn * R * 0.22);
        c.lineTo(-R * 1.7, sgn * R * 0.7 + wig * 2); c.stroke(); }
      for (let i = 0; i < 3; i++) { const yy = (i - 1) * R * 0.34;
        c.beginPath(); c.moveTo(R * 0.3, yy); c.lineTo(R * 0.75, yy + Math.sin(tm * 26 + i) * 2); c.stroke(); }
      break;
    }
    case 'weevil': {
      c.fillStyle = dk; c.beginPath(); c.ellipse(-R * 0.15, 0, R * 0.95, R * 0.8, 0, 0, TAU); c.fill();
      const gr = c.createRadialGradient(-R * 0.4, -R * 0.4, 1, 0, 0, R);
      gr.addColorStop(0, shade(col, 0.4)); gr.addColorStop(1, col);
      c.fillStyle = gr;
      c.beginPath(); c.ellipse(-R * 0.15, 0, R * 0.82, R * 0.68, 0, 0, TAU); c.fill();
      c.strokeStyle = '#40230c'; c.lineWidth = 1.1;
      for (let i = -2; i <= 2; i++) { c.beginPath();
        c.ellipse(-R * 0.15, 0, R * 0.82 - Math.abs(i) * 1.3, R * 0.68, 0, 0, TAU); }
      c.beginPath(); c.moveTo(-R * 0.15, -R * 0.66); c.lineTo(-R * 0.15, R * 0.66); c.stroke();
      c.globalAlpha = .5;
      for (let i = 0; i < 12; i++) { const a = rngFixed(e, i) * TAU, rr = rngFixed(e, i + 40) * R * 0.7;
        c.beginPath(); c.arc(-R * 0.15 + Math.cos(a) * rr, Math.sin(a) * rr * 0.8, 1.2, 0, TAU);
        c.fillStyle = '#6d3a12'; c.fill(); }
      c.globalAlpha = 1;
      c.strokeStyle = dk; c.lineWidth = 2.2;
      c.beginPath(); c.moveTo(R * 0.6, 0); c.lineTo(R * 1.15, 0); c.stroke();
      knotDot(c, R * 0.55, -R * 0.3, 1.6, '#2a221b', '#000');
      knotDot(c, R * 0.55, R * 0.3, 1.6, '#2a221b', '#000');
      break;
    }
    case 'casebearer': {
      c.fillStyle = col; c.strokeStyle = dk; c.lineWidth = 1.2;
      c.beginPath();
      c.moveTo(-R, -R * 0.5); c.lineTo(R * 0.35, -R * 0.62); c.lineTo(R * 0.4, R * 0.62); c.lineTo(-R, R * 0.5);
      c.closePath(); c.fill(); c.stroke();
      c.globalAlpha = .55; c.strokeStyle = dk; c.lineWidth = 1;
      for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(i * 3.2 - 2, -R * 0.55); c.lineTo(i * 3.2 + 2, R * 0.55); c.stroke(); }
      c.globalAlpha = 1;
      c.fillStyle = '#e6dcc0'; c.strokeStyle = dk;
      c.beginPath(); c.ellipse(R * 0.72, wig, R * 0.42, R * 0.32, 0, 0, TAU); c.fill(); c.stroke();
      knotDot(c, R * 0.92, wig, 1.4, '#2a221b', '#000');
      break;
    }
    case 'bloom': {
      const lobes = 7;
      c.beginPath();
      for (let i = 0; i <= 40; i++) {
        const a = i / 40 * TAU;
        const rr = R * (0.78 + 0.24 * Math.sin(a * lobes + tm * 1.4));
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
      const gr = c.createRadialGradient(0, 0, 1, 0, 0, R * 1.1);
      gr.addColorStop(0, shade(col, 0.4)); gr.addColorStop(1, dk);
      c.fillStyle = gr; c.fill();
      c.strokeStyle = 'rgba(30,44,24,.6)'; c.lineWidth = 1; c.stroke();
      for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + tm * 0.5;
        knotDot(c, Math.cos(a) * R * 0.48, Math.sin(a) * R * 0.48, 2, shade(col, 0.55), '#f2ffe8'); }
      break;
    }
    case 'snarl': {
      c.strokeStyle = col; c.lineWidth = 2; c.globalAlpha = 0.95;
      c.save(); c.rotate(tm * 0.9);
      for (let k = 0; k < 7; k++) {
        c.beginPath();
        const rr = R * (0.4 + rngFixed(e, k) * 0.75);
        const off = rngFixed(e, k + 20) * TAU;
        for (let i = 0; i <= 22; i++) {
          const a = i / 22 * TAU;
          const w = rr * (0.7 + 0.4 * Math.sin(a * 3 + off));
          const px = Math.cos(a + off) * w, py = Math.sin(a + off) * w * 0.85;
          if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
        }
        c.strokeStyle = k % 2 ? col : dk;
        c.stroke();
      }
      c.restore(); c.globalAlpha = 1;
      knotDot(c, 0, 0, 3.2, shade(col, 0.4), '#fff');
      break;
    }
    case 'mote': {
      c.save(); c.rotate(tm * 3);
      c.strokeStyle = col; c.lineWidth = 2.1;
      for (let i = 0; i < 6; i++) { const a = i / 6 * TAU;
        const rr = R * (0.7 + 0.5 * Math.abs(Math.sin(tm * 11 + i)));
        c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); c.stroke(); }
      c.restore();
      knotDot(c, 0, 0, R * 0.42, '#fffbe8', '#fff');
      c.globalAlpha = 0.35; c.strokeStyle = '#fff6c8'; c.lineWidth = 0.9;
      c.beginPath(); c.arc(0, 0, R * (1.1 + 0.2 * Math.sin(tm * 8)), 0, TAU); c.stroke();
      c.globalAlpha = 1;
      break;
    }
    case 'frayling': {
      const spread = e ? clamp((e.accelMul - 1) / 1.4, 0, 1) : 0.4;
      c.strokeStyle = col; c.lineWidth = 2.2; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-R * 1.5, 0); c.lineTo(0, 0); c.stroke();
      for (let i = 0; i < 5; i++) {
        const a = (i / 4 - 0.5) * (0.55 + spread * 1.5);
        c.strokeStyle = i % 2 ? col : dk; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(0, 0);
        c.quadraticCurveTo(R * 0.6, Math.sin(a) * R * 0.7,
          R * 1.35, Math.sin(a + Math.sin(tm * 12 + i) * 0.15) * R * 1.15);
        c.stroke();
      }
      knotDot(c, -R * 1.5, 0, 2.4, dk, col);
      break;
    }
    case 'wraith': {
      const ph = e && e.phasing ? 0.2 : 0.85;
      c.globalAlpha = ph;
      c.beginPath();
      for (let i = 0; i <= 26; i++) {
        const a = i / 26 * TAU;
        const rr = R * (0.85 + 0.2 * Math.sin(a * 4 + tm * 2.2));
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 1.12;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
      const gr = c.createLinearGradient(0, -R, 0, R);
      gr.addColorStop(0, shade(col, 0.3)); gr.addColorStop(1, dk);
      c.fillStyle = gr; c.fill();
      c.strokeStyle = 'rgba(240,248,255,.5)'; c.lineWidth = 1; c.setLineDash([3, 3]); c.stroke(); c.setLineDash([]);
      c.globalAlpha = ph;
      knotDot(c, R * 0.3, -R * 0.22, 1.9, '#0e1218', '#334');
      knotDot(c, R * 0.3, R * 0.22, 1.9, '#0e1218', '#334');
      c.globalAlpha = 1;
      break;
    }
    case 'bobbin': {
      c.fillStyle = dk;
      c.beginPath(); c.rect(-R * 0.85, -R * 0.9, R * 1.7, R * 1.8); c.fill();
      c.fillStyle = col;
      c.beginPath(); c.rect(-R * 0.55, -R * 0.9, R * 1.1, R * 1.8); c.fill();
      c.strokeStyle = shade(col, -0.4); c.lineWidth = 1;
      for (let i = -4; i <= 4; i++) { c.beginPath(); c.moveTo(-R * 0.55, i * R * 0.2); c.lineTo(R * 0.55, i * R * 0.2); c.stroke(); }
      c.fillStyle = shade(col, -0.3);
      c.beginPath(); c.rect(-R * 0.95, -R, R * 0.35, R * 2); c.fill();
      c.beginPath(); c.rect(R * 0.6, -R, R * 0.35, R * 2); c.fill();
      knotDot(c, R * 0.2, -R * 0.35, 1.6, '#1b1712', '#000');
      break;
    }
    case 'shears': {
      const open = 0.28 + 0.22 * Math.abs(Math.sin(tm * 2.2));
      for (const sgn of [-1, 1]) {
        c.save(); c.rotate(sgn * open);
        c.fillStyle = col; c.strokeStyle = dk; c.lineWidth = 1.4;
        c.beginPath();
        c.moveTo(-R * 0.2, sgn * 2);
        for (let i = 0; i <= 9; i++) {
          const px = -R * 0.2 + (i / 9) * R * 1.5;
          const py = sgn * (2 + (i % 2 === 0 ? 0 : R * 0.3));
          c.lineTo(px, py);
        }
        c.lineTo(R * 1.32, sgn * R * 0.05); c.lineTo(-R * 0.2, sgn * R * 0.05);
        c.closePath(); c.fill(); c.stroke();
        c.strokeStyle = '#2b3138'; c.lineWidth = 3;
        c.beginPath(); c.moveTo(-R * 0.25, sgn * 2); c.lineTo(-R * 0.95, sgn * R * 0.5); c.stroke();
        c.beginPath(); c.ellipse(-R * 1.15, sgn * R * 0.72, R * 0.3, R * 0.22, sgn * 0.5, 0, TAU); c.stroke();
        c.restore();
      }
      knotDot(c, -R * 0.2, 0, 3, '#8d959d', '#e8eef4');
      break;
    }
    case 'ripper': {
      c.strokeStyle = '#2b3138'; c.lineWidth = R * 0.42; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-R * 1.25, 0); c.lineTo(R * 0.15, 0); c.stroke();
      c.strokeStyle = '#4a5058'; c.lineWidth = R * 0.3;
      c.beginPath(); c.moveTo(-R * 1.2, 0); c.lineTo(-R * 0.2, 0); c.stroke();
      c.fillStyle = col; c.strokeStyle = '#31363c'; c.lineWidth = 1.3;
      c.beginPath();
      c.moveTo(R * 0.1, -R * 0.34);
      c.lineTo(R * 1.25, -R * 0.5);
      c.lineTo(R * 0.72, 0);
      c.lineTo(R * 1.1, R * 0.55);
      c.lineTo(R * 0.1, R * 0.3);
      c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.arc(R * 1.14, R * 0.6, R * 0.24, 0, TAU);
      c.fillStyle = '#bf4436'; c.fill(); c.strokeStyle = '#6d2119'; c.stroke();
      c.globalAlpha = 0.55; c.strokeStyle = '#fff'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(R * 0.25, -R * 0.2); c.lineTo(R * 1.05, -R * 0.42); c.stroke();
      c.globalAlpha = 1;
      break;
    }
    case 'dark': {
      c.save();
      const wobR = R * (1 + 0.05 * Math.sin(tm * 1.7));
      c.beginPath();
      for (let i = 0; i <= 34; i++) {
        const a = i / 34 * TAU;
        const rr = wobR * (0.82 + 0.26 * Math.sin(a * 5 + tm * 0.8) * Math.cos(a * 2.3 - tm * 0.5));
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
      const gr = c.createRadialGradient(0, 0, 2, 0, 0, wobR);
      gr.addColorStop(0, '#000'); gr.addColorStop(0.7, '#08060a'); gr.addColorStop(1, '#1b1420');
      c.fillStyle = gr; c.fill();
      c.strokeStyle = 'rgba(190,160,110,.5)'; c.lineWidth = 1.2;
      for (let i = 0; i < 30; i++) {
        const a = i / 30 * TAU + tm * 0.15;
        const r0 = wobR * (0.86 + rngFixed(e, i) * 0.2), r1 = r0 + 5 + rngFixed(e, i + 30) * 13;
        c.beginPath();
        c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
        c.lineTo(Math.cos(a + 0.05) * r1, Math.sin(a + 0.05) * r1);
        c.stroke();
      }
      for (let i = 0; i < 3; i++) {
        const a = tm * 0.7 + i * 2.1;
        const ex = Math.cos(a) * wobR * 0.4, ey = Math.sin(a * 1.3) * wobR * 0.32;
        const blink = Math.sin(tm * 2 + i * 1.7) > -0.7 ? 1 : 0.06;
        c.save(); c.globalAlpha = blink;
        c.beginPath(); c.ellipse(ex, ey, 4.2, 2.4, a, 0, TAU);
        c.fillStyle = '#e8dcb8'; c.fill();
        c.beginPath(); c.arc(ex, ey, 1.3, 0, TAU); c.fillStyle = '#100c09'; c.fill();
        c.restore();
      }
      c.restore();
      break;
    }
  }
  c.restore();
}

// stable per-entity pseudo-random so texture doesn't crawl between frames
function rngFixed(e, i) {
  const s = ((e ? e.seed : 7) * 1013 + i * 7919) % 1000;
  return (Math.sin(s) * 43758.5453) % 1 < 0 ? -((Math.sin(s) * 43758.5453) % 1) : (Math.sin(s) * 43758.5453) % 1;
}

/* ------------------------------------------------------------ heart knot - */

function drawHeart(c) {
  const m = S.map, x = m.heart.x, y = m.heart.y;
  const pulse = 0.5 + 0.5 * Math.sin(S.time * 1.6);
  const frac = S.warp / S.diff.warp;

  // anchoring threads out to the selvedge — one per warp thread you still have
  const N = S.diff.warp;
  for (let i = 0; i < N; i++) {
    const a = i / N * TAU + 0.13;
    const intact = i < S.warp;
    const L = intact ? 300 : 34 + (i % 3) * 8;
    c.strokeStyle = intact ? 'rgba(150,120,74,0.30)' : 'rgba(120,60,48,0.55)';
    c.lineWidth = intact ? 1.3 : 1.9;
    c.beginPath();
    c.moveTo(x + Math.cos(a) * 26, y + Math.sin(a) * 26);
    c.lineTo(x + Math.cos(a) * (26 + L), y + Math.sin(a) * (26 + L));
    c.stroke();
    if (!intact) {
      c.strokeStyle = 'rgba(150,70,54,0.75)'; c.lineWidth = 1.1;
      for (let k = -1; k <= 1; k += 2) {
        c.beginPath();
        c.moveTo(x + Math.cos(a) * (26 + L), y + Math.sin(a) * (26 + L));
        c.lineTo(x + Math.cos(a + k * 0.22) * (26 + L + 7), y + Math.sin(a + k * 0.22) * (26 + L + 7));
        c.stroke();
      }
    }
  }

  // the knot itself
  c.save();
  c.shadowColor = 'rgba(210,90,60,' + (0.24 + pulse * 0.3) + ')';
  c.shadowBlur = 18 + pulse * 16;
  const R = 25 + pulse * 1.6;
  const gr = c.createRadialGradient(x - 5, y - 6, 2, x, y, R);
  gr.addColorStop(0, '#e9705c'); gr.addColorStop(0.6, '#bf4436'); gr.addColorStop(1, '#71241c');
  c.beginPath(); c.arc(x, y, R, 0, TAU); c.fillStyle = gr; c.fill();
  c.restore();
  // wrapped floss
  c.save(); c.beginPath(); c.arc(x, y, R, 0, TAU); c.clip();
  c.strokeStyle = 'rgba(255,220,200,.24)'; c.lineWidth = 2.1;
  for (let i = -9; i < 9; i++) {
    c.beginPath(); c.moveTo(x - R, y + i * 3.2); c.lineTo(x + R, y + i * 3.2 + R * 0.7); c.stroke();
  }
  c.restore();
  // outer French knots, damaged ones missing
  const OUT = 14;
  for (let i = 0; i < OUT; i++) {
    const a = i / OUT * TAU + S.time * 0.16;
    const gone = (i / OUT) > frac;
    knotDot(c, x + Math.cos(a) * (R + 7), y + Math.sin(a) * (R + 7), gone ? 1.6 : 3.4,
      gone ? '#6a4a3c' : C.brass, gone ? '#8a6a54' : C.brass2);
  }
  c.font = '600 10px ' + 'ui-monospace, Menlo, monospace';
  c.fillStyle = 'rgba(255,240,215,.85)'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(String(S.warp), x, y + 0.5);
}

/* ------------------------------------------------------------------ draw - */

function drawRangeRing(c, x, y, r, col, strong) {
  c.save();
  c.globalAlpha = strong ? 0.11 : 0.07;
  c.fillStyle = col;
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.globalAlpha = strong ? 0.75 : 0.4;
  c.strokeStyle = col; c.lineWidth = 1.4;
  c.setLineDash([6, 5]); c.lineDashOffset = -S.time * 16;
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke();
  c.setLineDash([]);
  c.restore();
}

function draw() {
  fitCanvas();
  const c = ctx;
  c.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  c.fillStyle = '#1a130e';
  c.fillRect(0, 0, view.w, view.h);

  const sh = S.shake;
  const sx = sh ? (Math.random() - 0.5) * sh : 0;
  const sy = sh ? (Math.random() - 0.5) * sh : 0;

  c.save();
  c.translate(view.ox + sx, view.oy + sy);
  c.scale(view.scale, view.scale);
  c.beginPath(); c.rect(0, 0, WORLD_W, WORLD_H); c.clip();

  c.drawImage(cloth, 0, 0);

  // build grid while placing
  if (S.selectedType) {
    c.save();
    c.lineWidth = 1;
    for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
      const ok = canBuild(col, r);
      c.strokeStyle = ok ? 'rgba(90,140,110,0.30)' : 'rgba(150,70,54,0.13)';
      c.strokeRect(col * CELL + 3, r * CELL + 3, CELL - 6, CELL - 6);
    }
    c.restore();
  }

  drawHeart(c);

  // range previews
  if (S.selected) {
    const st = tstats(S.selected);
    drawRangeRing(c, S.selected.x, S.selected.y, st.range, TOWERS[S.selected.key].color, true);
  }
  if (S.selectedType && S.hover.on) {
    const T = TOWERS[S.selectedType];
    const cx = S.hover.c * CELL + CELL / 2, cy = S.hover.r * CELL + CELL / 2;
    drawRangeRing(c, cx, cy, T.tiers[0].range, T.color, true);
  }
  // wax auras always visible, quietly
  for (const w of S.towers) {
    if (w.key !== 'wax') continue;
    const ws = TOWERS.wax.tiers[w.lvl];
    c.save();
    const gr = c.createRadialGradient(w.x, w.y, ws.range * 0.2, w.x, w.y, ws.range);
    gr.addColorStop(0, 'rgba(232,176,60,0.13)');
    gr.addColorStop(1, 'rgba(232,176,60,0)');
    c.fillStyle = gr; c.beginPath(); c.arc(w.x, w.y, ws.range, 0, TAU); c.fill();
    c.restore();
  }

  // blanket pulses
  for (const g of S.rings) {
    const t01 = g.r / g.maxR;
    c.save();
    c.globalAlpha = (1 - t01) * 0.85;
    c.strokeStyle = shade(g.col, 0.25); c.lineWidth = 3;
    c.beginPath(); c.arc(g.x, g.y, g.r, 0, TAU); c.stroke();
    const n = Math.max(10, Math.floor(g.r / 7));
    c.lineWidth = 2;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + g.r * 0.02;
      c.beginPath();
      c.moveTo(g.x + Math.cos(a) * g.r, g.y + Math.sin(a) * g.r);
      c.lineTo(g.x + Math.cos(a) * (g.r - 7), g.y + Math.sin(a) * (g.r - 7));
      c.stroke();
    }
    c.restore();
  }

  // towers
  for (const t of S.towers) {
    const s = t.sew > 0 ? lerp(0.4, 1, 1 - t.sew / 0.5) : 1;
    drawNotion(c, t.key, t.lvl, t.x, t.y, s, t.ang, S.time, t);
    if (t.sew > 0) {
      const p = 1 - t.sew / 0.5;
      c.save(); c.globalAlpha = 1 - p;
      c.strokeStyle = '#efe6d0'; c.lineWidth = 1.6;
      const a = p * TAU * 2;
      c.beginPath(); c.moveTo(t.x + Math.cos(a) * 46 * (1 - p), t.y + Math.sin(a) * 46 * (1 - p));
      c.lineTo(t.x, t.y); c.stroke();
      c.restore();
    }
    if (t.smother > 0) {
      c.save(); c.globalAlpha = 0.55 + 0.25 * Math.sin(S.time * 12);
      c.fillStyle = '#241a2c';
      c.beginPath(); c.arc(t.x, t.y, 22, 0, TAU); c.fill();
      c.restore();
    }
    if (t === S.selected) {
      c.save();
      c.strokeStyle = C.brass2; c.lineWidth = 1.7;
      c.setLineDash([5, 4]); c.lineDashOffset = -S.time * 22;
      c.strokeRect(t.c * CELL + 2, t.r * CELL + 2, CELL - 4, CELL - 4);
      c.restore();
    }
  }

  // enemies
  for (const e of S.enemies) {
    if (e.d < 0) continue;
    const s = e.boss ? 1 : 1;
    drawVermin(c, e.id, e.x, e.y, s, e.ang, S.time, e);
    // status marks
    if (e.slowT > 0 && !e.phasing) {
      c.save(); c.globalAlpha = 0.5; c.fillStyle = '#f0c15a';
      c.beginPath(); c.arc(e.x, e.y, e.def.r + 3, 0, TAU); c.fill(); c.restore();
    }
    if (e.rootT > 0) {
      c.save(); c.strokeStyle = '#dfe8f2'; c.lineWidth = 1.4; c.globalAlpha = 0.85;
      for (let i = 0; i < 4; i++) { const a = i / 4 * TAU + 0.4;
        c.beginPath();
        c.moveTo(e.x + Math.cos(a) * (e.def.r + 2), e.y + Math.sin(a) * (e.def.r + 2));
        c.lineTo(e.x + Math.cos(a) * (e.def.r + 9), e.y + Math.sin(a) * (e.def.r + 9)); c.stroke(); }
      c.restore();
    }
    if (e.shield > 0) {
      c.save(); c.globalAlpha = 0.28 + 0.5 * (e.shield / e.maxShield);
      c.strokeStyle = '#a9d8ff'; c.lineWidth = 2;
      c.beginPath(); c.arc(e.x, e.y, e.def.r + 5, 0, TAU); c.stroke(); c.restore();
    }
    if (e.frayT > 0) {
      c.save(); c.globalAlpha = 0.6; c.strokeStyle = '#e79a6a'; c.lineWidth = 1;
      for (let i = 0; i < 5; i++) { const a = S.time * 3 + i * 1.3;
        c.beginPath();
        c.moveTo(e.x + Math.cos(a) * e.def.r, e.y + Math.sin(a) * e.def.r);
        c.lineTo(e.x + Math.cos(a) * (e.def.r + 6), e.y + Math.sin(a) * (e.def.r + 6) - 3); c.stroke(); }
      c.restore();
    }
    // health, only once it matters
    if (e.hp < e.maxHp && !e.boss) {
      const w = Math.max(16, e.def.r * 2.1), h = 3.4;
      const bx = e.x - w / 2, by = e.y - e.def.r - 9;
      c.fillStyle = 'rgba(20,14,10,.72)'; c.fillRect(bx - 1, by - 1, w + 2, h + 2);
      const f = clamp(e.hp / e.maxHp, 0, 1);
      c.fillStyle = f > 0.55 ? '#7fc48f' : f > 0.25 ? '#e0a02c' : '#d75648';
      c.fillRect(bx, by, w * f, h);
    }
  }

  // projectiles
  for (const p of S.shots) {
    if (p.k === 'knot') {
      c.save();
      if (p.trail.length > 1) {
        c.strokeStyle = 'rgba(226,163,49,0.4)'; c.lineWidth = 1.2;
        c.beginPath(); c.moveTo(p.trail[0].x, p.trail[0].y);
        for (const q of p.trail) c.lineTo(q.x, q.y);
        c.lineTo(p.x, p.y); c.stroke();
      }
      knotDot(c, p.x, p.y, p.crit ? 4.4 : 3.2, p.crit ? '#ffe08a' : p.col, '#fff8e2');
      c.restore();
    } else if (p.k === 'pin') {
      const a = Math.atan2(p.vy, p.vx);
      c.save(); c.translate(p.x, p.y); c.rotate(a);
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 3.4;
      c.beginPath(); c.moveTo(-p.len, 0); c.lineTo(4, 0); c.stroke();
      c.strokeStyle = '#f2f7fb'; c.lineWidth = 1.7;
      c.beginPath(); c.moveTo(-p.len, 0); c.lineTo(6, 0); c.stroke();
      c.restore();
    }
  }

  // effects
  for (const f of S.fx) {
    const a = clamp(f.life / f.max, 0, 1);
    if (f.k === 'arc') {
      c.save();
      c.globalAlpha = a;
      c.lineCap = 'round'; c.lineJoin = 'round';
      for (let pass = 0; pass < 2; pass++) {
        c.strokeStyle = pass ? '#dff0ff' : f.col;
        c.lineWidth = pass ? 1.5 : 5;
        c.globalAlpha = pass ? a : a * 0.4;
        c.beginPath();
        for (let i = 0; i < f.pts.length - 1; i++) {
          const p0 = f.pts[i], p1 = f.pts[i + 1];
          c.moveTo(p0.x, p0.y);
          const steps = 4;
          for (let k = 1; k <= steps; k++) {
            const t = k / steps;
            const jx = (k === steps) ? 0 : (Math.random() - 0.5) * 11;
            const jy = (k === steps) ? 0 : (Math.random() - 0.5) * 11;
            c.lineTo(lerp(p0.x, p1.x, t) + jx, lerp(p0.y, p1.y, t) + jy);
          }
        }
        c.stroke();
      }
      c.restore();
    } else if (f.k === 'snip') {
      c.save(); c.globalAlpha = a; c.translate(f.x, f.y); c.rotate(f.rot);
      c.strokeStyle = f.col; c.lineWidth = 1.5; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-f.s / 2, 0); c.lineTo(f.s / 2, 0); c.stroke();
      c.restore();
    } else {
      c.globalAlpha = a;
      c.fillStyle = f.col;
      c.beginPath(); c.arc(f.x, f.y, f.s, 0, TAU); c.fill();
      c.globalAlpha = 1;
    }
  }
  c.globalAlpha = 1;

  // floating text
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const t of S.texts) {
    c.save();
    c.globalAlpha = clamp(t.life, 0, 1);
    c.font = '700 ' + t.size + 'px ui-monospace, Menlo, monospace';
    c.lineWidth = 3; c.strokeStyle = 'rgba(16,12,8,.72)';
    c.strokeText(t.txt, t.x, t.y);
    c.fillStyle = t.col;
    c.fillText(t.txt, t.x, t.y);
    c.restore();
  }

  // placement ghost
  if (S.selectedType && S.hover.on) {
    const ok = canBuild(S.hover.c, S.hover.r) && S.floss >= TOWERS[S.selectedType].cost;
    const cx = S.hover.c * CELL + CELL / 2, cy = S.hover.r * CELL + CELL / 2;
    c.save();
    c.globalAlpha = ok ? 0.72 : 0.34;
    drawNotion(c, S.selectedType, 0, cx, cy, 1, -Math.PI / 2, S.time, null);
    c.globalAlpha = 1;
    c.strokeStyle = ok ? '#8fd6a8' : '#e0776a'; c.lineWidth = 2;
    c.setLineDash([6, 4]); c.lineDashOffset = -S.time * 20;
    c.strokeRect(S.hover.c * CELL + 3, S.hover.r * CELL + 3, CELL - 6, CELL - 6);
    if (!ok) {
      c.setLineDash([]);
      c.beginPath();
      c.moveTo(S.hover.c * CELL + 12, S.hover.r * CELL + 12);
      c.lineTo(S.hover.c * CELL + CELL - 12, S.hover.r * CELL + CELL - 12);
      c.moveTo(S.hover.c * CELL + CELL - 12, S.hover.r * CELL + 12);
      c.lineTo(S.hover.c * CELL + 12, S.hover.r * CELL + CELL - 12);
      c.stroke();
    }
    c.restore();
  }

  // selvedge: the cloth darkens where the frame grips it
  const vg = c.createRadialGradient(WORLD_W / 2, WORLD_H / 2, WORLD_H * 0.34, WORLD_W / 2, WORLD_H / 2, WORLD_H * 0.86);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(38,26,14,0.42)');
  c.fillStyle = vg; c.fillRect(0, 0, WORLD_W, WORLD_H);

  if (S.flash > 0) {
    c.fillStyle = 'rgba(190,60,44,' + (S.flash * 0.34) + ')';
    c.fillRect(0, 0, WORLD_W, WORLD_H);
  }

  c.restore();

  if (S.paused && (S.phase === 'course' || S.phase === 'prep')) {
    c.fillStyle = 'rgba(10,7,5,0.5)';
    c.fillRect(0, 0, view.w, view.h);
    c.fillStyle = '#e6c65b';
    c.font = '600 ' + Math.round(clamp(view.w * 0.035, 14, 30)) + 'px ui-serif, Georgia, serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('THE FRAME IS STILL', view.w / 2, view.h / 2);
  }
}
