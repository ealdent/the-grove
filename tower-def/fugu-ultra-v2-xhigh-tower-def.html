const $ = id => document.getElementById(id);
const elWarp = $('warpVal'), elFloss = $('flossVal'), elWave = $('waveVal');
const elBasket = $('basket'), elInsp = $('inspector'), elNext = $('nextBox');
const elMend = $('btnMend'), elMendTxt = $('mendTxt'), elMendSub = $('mendSub'), elFuse = $('mendFuse');
const elCtN = $('ctN'), elCtT = $('ctT');
const elOvl = $('ovl'), elOvlCard = $('ovlCard');
const elTip = $('tip'), elToasts = $('toastWrap');
const elLine = $('ledgerLine'), elLineTxt = $('ledgerTxt');
const elBossBar = $('bossBar'), elBossNm = $('bossNm'), elBossFl = $('bossFl');

function makeIcon(key, lvl, px) {
  const cn = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cn.width = px * dpr; cn.height = px * dpr;
  cn.style.width = px + 'px'; cn.style.height = px + 'px';
  const g = cn.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = px / 54;
  drawNotion(g, key, lvl, px / 2, px / 2, s, -Math.PI / 2, 0, null);
  return cn;
}
function makeVerminIcon(id, px) {
  const cn = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cn.width = px * dpr; cn.height = px * dpr;
  cn.style.width = px + 'px'; cn.style.height = px + 'px';
  const g = cn.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const D = ENEMIES[id];
  const s = (px * 0.40) / D.r;
  drawVermin(g, id, px / 2, px / 2, s, 0, 0.6, { wob: 0.4, seed: 3, accelMul: 1.6, phasing: false, hurtT: 0 });
  return cn;
}

let toastN = 0;
function toast(msg, kind) {
  const d = document.createElement('div');
  d.className = 'toast' + (kind ? ' ' + kind : '');
  d.textContent = msg;
  elToasts.appendChild(d);
  const mine = ++toastN;
  setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 2450);
  while (elToasts.children.length > 4) elToasts.removeChild(elToasts.firstChild);
  return mine;
}
function showLedgerLine(txt) {
  if (!txt) { elLine.classList.remove('on'); return; }
  elLineTxt.textContent = txt;
  elLine.classList.add('on');
}
function gaugePulse() { const g = $('gFloss'); g.classList.remove('pulse'); void g.offsetWidth; g.classList.add('pulse'); }
function gaugeHurt()  { const g = $('gWarp');  g.classList.remove('hurt');  void g.offsetWidth; g.classList.add('hurt'); }

/* ------------------------------------------------------------- workbasket */

function buildBasket() {
  elBasket.innerHTML = '';
  TOWER_ORDER.forEach((key, i) => {
    const T = TOWERS[key];
    const b = document.createElement('button');
    b.className = 'nCard';
    b.dataset.key = key;
    b.innerHTML =
      '<span class="swatch" style="background:' + T.color + '"></span>' +
      '<span class="hot">' + (i + 1) + '</span>' +
      '<div class="row1"></div>' +
      '<div class="cost"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="18" rx="1.6" fill="#c9a227"/><rect x="6" y="6" width="12" height="12" rx="1" fill="#e6c65b"/></svg>' + T.cost + '</div>';
    const row = b.querySelector('.row1');
    row.appendChild(makeIcon(key, 0, 30));
    const txt = document.createElement('div');
    txt.innerHTML = '<div class="nm">' + T.name + '</div><div class="role">' + T.role + '</div>';
    row.appendChild(txt);
    b.addEventListener('click', () => selectType(key));
    b.addEventListener('pointerenter', ev => showTip(ev, towerTip(key)));
    b.addEventListener('pointerleave', hideTip);
    b.addEventListener('pointermove', moveTip);
    elBasket.appendChild(b);
  });
}

function towerTip(key) {
  const T = TOWERS[key], t0 = T.tiers[0];
  let stats = '';
  if (key === 'wax') {
    stats = '<span>Slow</span><span>' + Math.round(t0.slow * 100) + '%</span>' +
            '<span>Reach</span><span>' + t0.range + '</span>' +
            '<span>Notion dmg</span><span>+' + Math.round(t0.buffD * 100) + '%</span>';
  } else if (key === 'blanket') {
    stats = '<span>Pulse</span><span>' + t0.dmg + '</span>' +
            '<span>Every</span><span>' + t0.rate.toFixed(2) + 's</span>' +
            '<span>Radius</span><span>' + t0.range + '</span>';
  } else {
    stats = '<span>Damage</span><span>' + t0.dmg + '</span>' +
            '<span>Every</span><span>' + t0.rate.toFixed(2) + 's</span>' +
            '<span>Reach</span><span>' + t0.range + '</span>';
  }
  stats += '<span>Fliers</span><span>' + (T.air ? 'yes' : 'no') + '</span>';
  return '<div class="tt">' + T.name + '</div><div class="tr2">' + T.role + ' &middot; ' + T.cost + ' floss</div>' +
         '<div class="tb">' + T.blurb + '<br><i>' + T.flavour + '</i></div>' +
         '<div class="tstats">' + stats + '</div>';
}

function selectType(key) {
  Snd.resume();
  if (S.selectedType === key) { S.selectedType = null; }
  else { S.selectedType = key; S.selected = null; }
  syncUI();
}

/* -------------------------------------------------------------- inspector */

function renderInspector() {
  const t = S.selected;
  if (!t) {
    elInsp.className = '';
    elInsp.innerHTML = '<div class="emptyInsp">Nothing selected.<br>Pick a notion from the workbasket, or tap one already sewn into the cloth.</div>';
    return;
  }
  const T = TOWERS[t.key], tier = T.tiers[t.lvl], st = tstats(t);
  const nx = t.lvl < 4 ? T.tiers[t.lvl + 1] : null;
  const cost = upgradeCost(t);
  const afford = nx && S.floss >= cost;

  const rows = [];
  const cmp = (label, a, b, fmt, better) => {
    const av = fmt ? fmt(a) : a;
    let up = '';
    if (nx && b !== undefined && b !== null && b !== a) {
      const good = better === 'lower' ? b < a : b > a;
      up = '<span class="up" style="color:' + (good ? '#7fc48f' : '#d99') + '">&rarr; ' + (fmt ? fmt(b) : b) + '</span>';
    }
    rows.push('<div class="stat"><span class="k">' + label + '</span><span class="v">' + av + up + '</span></div>');
  };

  if (t.key === 'wax') {
    cmp('Slow', tier.slow, nx && nx.slow, v => Math.round(v * 100) + '%');
    cmp('Reach', tier.range, nx && nx.range);
    cmp('Notion dmg', tier.buffD, nx && nx.buffD, v => '+' + Math.round(v * 100) + '%');
    cmp('Notion rate', tier.buffR, nx && nx.buffR, v => '+' + Math.round(v * 100) + '%');
    cmp('Per course', tier.income, nx && nx.income, v => v ? '+' + v + ' floss' : '&mdash;');
    cmp('Sets solid', tier.freeze, nx && nx.freeze, v => v ? Math.round(v * 100) + '%' : '&mdash;');
  } else if (t.key === 'blanket') {
    cmp('Pulse', tier.dmg, nx && nx.dmg);
    cmp('Interval', tier.rate, nx && nx.rate, v => v.toFixed(2) + 's', 'lower');
    cmp('Radius', tier.range, nx && nx.range);
    cmp('Fray', tier.fray, nx && nx.fray, v => v ? v + '/s' : '&mdash;');
    cmp('DPS (area)', Math.round(st.dmg / st.rate), null);
    cmp('Vs slowed', tier.slowBonus, nx && nx.slowBonus, v => v ? '+' + Math.round(v * 100) + '%' : '&mdash;');
  } else if (t.key === 'chain') {
    cmp('Damage', tier.dmg, nx && nx.dmg);
    cmp('Interval', tier.rate, nx && nx.rate, v => v.toFixed(2) + 's', 'lower');
    cmp('Reach', tier.range, nx && nx.range);
    cmp('Leaps', tier.bounce, nx && nx.bounce);
    cmp('Snarl', tier.slow, nx && nx.slow, v => v ? Math.round(v * 100) + '%' : '&mdash;');
    cmp('DPS', Math.round(st.dmg / st.rate), null);
  } else if (t.key === 'pin') {
    cmp('Damage', tier.dmg, nx && nx.dmg);
    cmp('Interval', tier.rate, nx && nx.rate, v => v.toFixed(2) + 's', 'lower');
    cmp('Reach', tier.range, nx && nx.range);
    cmp('Pierces', tier.pierce, nx && nx.pierce);
    cmp('Pins for', tier.root, nx && nx.root, v => v ? v.toFixed(2) + 's' : '&mdash;');
    cmp('Vs bosses', tier.boss, nx && nx.boss, v => '\u00d7' + v.toFixed(2));
  } else {
    cmp('Damage', tier.dmg, nx && nx.dmg);
    cmp('Interval', tier.rate, nx && nx.rate, v => v.toFixed(2) + 's', 'lower');
    cmp('Reach', tier.range, nx && nx.range);
    cmp('Shots', tier.burst, nx && nx.burst);
    cmp('Crit', tier.crit, nx && nx.crit, v => v ? Math.round(v * 100) + '%' : '&mdash;');
    cmp('DPS', Math.round(st.dmg * (st.burst || 1) / st.rate), null);
  }

  const pips = [0,1,2,3,4].map(i => '<span class="pip' + (i <= t.lvl ? ' on' : '') + '"></span>').join('');
  const modes = t.key === 'wax' ? '' :
    '<div class="tgt">' + ['first','last','strong','close'].map(m =>
      '<button data-mode="' + m + '"' + (t.mode === m ? ' class="on"' : '') + '>' +
      ({first:'First',last:'Last',strong:'Strong',close:'Near'})[m] + '</button>').join('') + '</div>';

  const buff = (st.buffD > 0)
    ? '<div class="stat" style="grid-column:1/-1"><span class="k">Waxed</span><span class="v" style="color:#e2a331">+' +
      Math.round(st.buffD * 100) + '% dmg' + (st.buffR ? ', +' + Math.round(st.buffR * 100) + '% rate' : '') + '</span></div>'
    : '';

  elInsp.className = 'insp';
  elInsp.innerHTML =
    '<div class="top"><div id="inspIco"></div><div style="min-width:0">' +
      '<div class="ttl">' + tier.n + '</div>' +
      '<div class="tier">' + T.name + ' &middot; tier ' + (t.lvl + 1) + ' of 5</div>' +
      '<div class="pips">' + pips + '</div>' +
    '</div></div>' +
    '<div class="flav">' + tier.note + '</div>' +
    '<div class="stats">' + rows.join('') + buff + '</div>' +
    modes +
    '<div class="acts">' +
      '<button class="bigBtn bUp" id="btnUp"' + (nx && afford ? '' : ' disabled') + '>' +
        (nx ? 'Work up' : 'Fully worked') +
        '<span class="sub">' + (nx ? nx.n + ' \u00b7 ' + cost + ' floss' : 'tier 5 of 5') + '</span></button>' +
      '<button class="bigBtn bSell" id="btnSell">Unpick<span class="sub">+' + sellValue(t) + '</span></button>' +
    '</div>' +
    '<div style="font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--bone-dim);opacity:.55;text-align:center">' +
      t.kills + ' felled \u00b7 ' + Math.round(t.dealt).toLocaleString() + ' damage \u00b7 ' + t.invested + ' invested</div>';

  $('inspIco').appendChild(makeIcon(t.key, t.lvl, 44));
  const up = $('btnUp'), sell = $('btnSell');
  if (up) up.addEventListener('click', doUpgrade);
  if (sell) sell.addEventListener('click', doSell);
  elInsp.querySelectorAll('.tgt button').forEach(b =>
    b.addEventListener('click', () => { t.mode = b.dataset.mode; renderInspector(); }));
}

function doUpgrade() {
  const t = S.selected; if (!t || t.lvl >= 4) return;
  const cost = upgradeCost(t);
  if (S.floss < cost) { toast('Not enough floss', 'bad'); return; }
  S.floss -= cost; S.stats.spent += cost;
  t.invested += cost; t.lvl++;
  t.sew = 0.35;
  Snd.up();
  floatText(t.x, t.y - 30, TOWERS[t.key].tiers[t.lvl].n, C.brass2, 13);
  burst(t.x, t.y, 12, TOWERS[t.key].color, 10);
  syncUI();
}
function doSell() {
  const t = S.selected; if (!t) return;
  S.floss += sellValue(t);
  burst(t.x, t.y, 14, TOWERS[t.key].color, 10);
  S.towers.splice(S.towers.indexOf(t), 1);
  S.selected = null;
  Snd.sell();
  syncUI();
}

/* --------------------------------------------------------- next course --- */

function renderNext() {
  const n = S.course + (S.phase === 'course' ? 0 : 1);
  if (n > TOTAL_COURSES) {
    elNext.innerHTML = '<div class="hdr"><span class="cn">The frame is whole</span></div>' +
      '<div style="font-family:var(--serif);font-style:italic;font-size:.8rem;color:var(--bone-dim)">Nothing further is scheduled.</div>';
    return;
  }
  const c = COURSES[n - 1];
  const counts = {};
  for (const grp of c.g) counts[grp.t] = (counts[grp.t] || 0) + grp.n;
  const chips = Object.keys(counts).map(id => {
    const D = ENEMIES[id];
    return '<span class="threat' + (D.boss ? ' boss' : '') + '" data-vermin="' + id + '">' +
      '<span class="vico" data-id="' + id + '"></span>' + D.name + ' <span class="q">\u00d7' + counts[id] + '</span></span>';
  }).join('');
  elNext.innerHTML =
    '<div class="hdr"><span class="cn">' + (c.boss ? '\u2694 ' : '') + c.n + '</span>' +
    '<span class="cc">Course ' + String(n).padStart(2, '0') + '</span></div>' +
    '<div class="threats">' + chips + '</div>';
  elNext.querySelectorAll('.vico').forEach(sp => sp.appendChild(makeVerminIcon(sp.dataset.id, 20)));
  elNext.querySelectorAll('.threat').forEach(sp => {
    const D = ENEMIES[sp.dataset.vermin];
    const traits = [];
    if (D.fly) traits.push('flies the short way');
    if (D.armor >= 8) traits.push('armoured ' + D.armor);
    if (D.slowRes) traits.push('resists wax');
    if (D.rootImm) traits.push('cannot be pinned');
    if (D.split) traits.push('splits when killed');
    if (D.heal) traits.push('heals its neighbours');
    if (D.shield) traits.push('regrows a shield');
    if (D.phase) traits.push('phases out of reach');
    if (D.accel) traits.push('accelerates');
    if (D.spawn) traits.push('spawns ' + ENEMIES[D.spawn.of].name);
    const body = '<div class="tt">' + D.name + '</div>' +
      '<div class="tr2">' + (D.boss ? 'Boss' : 'Vermin') + ' &middot; ' + D.leak + ' warp if it lands</div>' +
      '<div class="tb">' + D.desc + (traits.length ? '<br><i>' + traits.join(' \u00b7 ') + '</i>' : '') + '</div>' +
      '<div class="tstats"><span>Base life</span><span>' + D.hp + '</span><span>Pace</span><span>' + D.spd + '</span>' +
      '<span>Bounty</span><span>' + D.bounty + '</span></div>';
    sp.addEventListener('pointerenter', ev => showTip(ev, body));
    sp.addEventListener('pointerleave', hideTip);
    sp.addEventListener('pointermove', moveTip);
  });
}

/* -------------------------------------------------------------- tooltips - */

function showTip(ev, html) {
  if (window.matchMedia('(hover: none)').matches) return;
  elTip.innerHTML = html;
  elTip.classList.add('on');
  moveTip(ev);
}
function moveTip(ev) {
  if (!elTip.classList.contains('on')) return;
  const r = elTip.getBoundingClientRect();
  let x = ev.clientX + 16, y = ev.clientY + 16;
  if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > window.innerHeight - 8) y = window.innerHeight - r.height - 10;
  elTip.style.left = Math.max(6, x) + 'px';
  elTip.style.top = Math.max(6, y) + 'px';
}
function hideTip() { elTip.classList.remove('on'); }

/* ------------------------------------------------------------------ sync - */

let lastSync = { warp:-1, floss:-1, wave:'', mend:'' };

function syncLive() {
  if (S.warp !== lastSync.warp) { elWarp.textContent = S.warp; lastSync.warp = S.warp; }
  const f = Math.floor(S.floss);
  if (f !== lastSync.floss) {
    elFloss.textContent = f.toLocaleString(); lastSync.floss = f;
    // affordability shading without a full rebuild
    elBasket.querySelectorAll('.nCard').forEach(b =>
      b.classList.toggle('poor', S.floss < TOWERS[b.dataset.key].cost));
    const up = $('btnUp');
    if (up && S.selected && S.selected.lvl < 4) up.disabled = S.floss < upgradeCost(S.selected);
  }
  const wv = Math.max(1, S.course) + '/' + TOTAL_COURSES;
  if (wv !== lastSync.wave) { elWave.textContent = (S.course || 0) + '/' + TOTAL_COURSES; lastSync.wave = wv; }

  if (S.boss && S.boss.alive) {
    elBossBar.classList.add('on');
    elBossNm.textContent = S.boss.def.name;
    elBossFl.style.width = (clamp(S.boss.hp / S.boss.maxHp, 0, 1) * 100) + '%';
  } else elBossBar.classList.remove('on');

  if (S.phase === 'prep' && S.prepT > 0) syncMendFuse();
}

function syncMendFuse() {
  elFuse.style.width = (S.prepT / S.prepMax * 100) + '%';
  const bonus = Math.ceil(S.prepT) * 2;
  elMendSub.textContent = bonus > 0
    ? 'Begin Course ' + (S.course + 1) + '  \u00b7  early +' + bonus
    : 'Begin Course ' + (S.course + 1);
}

function syncUI() {
  elBasket.querySelectorAll('.nCard').forEach(b => {
    b.classList.toggle('sel', S.selectedType === b.dataset.key);
    b.classList.toggle('poor', S.floss < TOWERS[b.dataset.key].cost);
  });
  renderInspector();
  renderNext();

  const running = S.phase === 'course';
  elMend.disabled = running || S.phase === 'won' || S.phase === 'lost' || S.phase === 'title';
  if (running) {
    elMendTxt.textContent = 'In progress';
    elMendSub.textContent = S.alive + ' on the cloth \u00b7 ' + S.spawnQ.length + ' to come';
    elFuse.style.width = '0%';
  } else if (S.phase === 'prep') {
    elMendTxt.textContent = 'Mend';
    syncMendFuse();
  } else {
    elMendTxt.textContent = 'Mend';
    elMendSub.textContent = 'Begin Course ' + Math.min(TOTAL_COURSES, S.course + 1);
  }

  const cn = S.phase === 'course' ? S.course : Math.min(TOTAL_COURSES, S.course + (S.phase === 'prep' ? 1 : 1));
  const cdef = COURSES[clamp(cn, 1, TOTAL_COURSES) - 1];
  elCtN.textContent = 'Course ' + String(S.phase === 'course' ? S.course : S.course).padStart(2, '0');
  elCtT.textContent = S.phase === 'course'
    ? (COURSES[S.course - 1].boss ? '\u2694 ' : '') + COURSES[S.course - 1].n
    : (S.course === 0 ? 'The frame is set' : 'Held \u00b7 next: ' + cdef.n);

  lastSync.floss = -1;
  syncLive();
}

      '<div><div class="k">Courses held</div><div class="v">' + S.course + (won ? '' : '') + '</div></div>' +

      '<div><div class="k">Warp lost</div><div class="v">' + (S.diff.warp - S.warp) + '</div></div>' +
      '<div><div class="k">Floss earned</div><div class="v">' + st.earned.toLocaleString() + '</div></div>' +

/* ---------------------------------------------------------------- input -- */

function pointerCell(ev) {
  const w = toWorld(ev.clientX, ev.clientY);
  return { x:w.x, y:w.y, c:Math.floor(w.x / CELL), r:Math.floor(w.y / CELL) };
}

cv.addEventListener('pointermove', ev => {
  const p = pointerCell(ev);
  S.hover.x = p.x; S.hover.y = p.y; S.hover.c = p.c; S.hover.r = p.r;
  S.hover.on = p.x >= 0 && p.y >= 0 && p.x < WORLD_W && p.y < WORLD_H;
});
cv.addEventListener('pointerleave', () => { S.hover.on = false; });

cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  Snd.resume();
  if (S.phase === 'title' || S.phase === 'won' || S.phase === 'lost') return;
  const p = pointerCell(ev);
  S.hover.x = p.x; S.hover.y = p.y; S.hover.c = p.c; S.hover.r = p.r; S.hover.on = true;

  if (ev.button === 2) { S.selectedType = null; S.selected = null; syncUI(); return; }

  const existing = towerAt(p.c, p.r);
  if (S.selectedType) {
    const T = TOWERS[S.selectedType];
    if (!canBuild(p.c, p.r)) { toast(existing ? 'Already worked' : 'The weave will not take it', 'bad'); return; }
    if (S.floss < T.cost) { toast('Not enough floss', 'bad'); return; }
    S.floss -= T.cost; S.stats.spent += T.cost;
    const t = makeTower(S.selectedType, p.c, p.r);
    S.towers.push(t);
    S.selected = t;
    if (!ev.shiftKey) S.selectedType = null;
    Snd.place();
    burst(t.x, t.y, 8, T.color, 8);
    syncUI();
    return;
  }
  S.selected = existing || null;
  syncUI();
});
cv.addEventListener('contextmenu', ev => ev.preventDefault());

/* keyboard */
window.addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if (k === 'escape') {
    if ($('ledgerModal').classList.contains('on')) { closeLedger(); return; }
    S.selectedType = null; S.selected = null; syncUI(); return;
  }
  if (S.phase === 'title') { if (k === 'enter' || k === ' ') { const b = $('btnStart'); if (b) b.click(); ev.preventDefault(); } return; }
  if (k >= '1' && k <= '5') { selectType(TOWER_ORDER[parseInt(k, 10) - 1]); ev.preventDefault(); return; }
  if (k === 'f') { cycleSpeed(); return; }
  if (k === 'l') { $('ledgerModal').classList.contains('on') ? closeLedger() : openLedger(); return; }
  if (k === 'm') { toggleSound(); return; }
  if (k === 'u') { if (S.selected) doUpgrade(); return; }
  if (k === 'x') { if (S.selected) doSell(); return; }
  if (k === 'p') { togglePause(); return; }
  if (k === ' ' || k === 'enter') {
    ev.preventDefault();
    if (S.phase === 'prep') startCourse();
    else if (S.phase === 'course') togglePause();
  }
});

/* buttons */
function cycleSpeed() {
  S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1;
  $('spdTxt').textContent = S.speed + '\u00d7';
  $('btnSpeed').classList.toggle('on', S.speed > 1);
}
function togglePause() {
  if (S.phase !== 'course' && S.phase !== 'prep') return;
  S.paused = !S.paused;
  $('btnPause').classList.toggle('on', S.paused);
  $('pauseIco').innerHTML = S.paused
    ? '<path d="M7 4l12 8-12 8z" fill="currentColor"/>'
    : '<g fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></g>';
}
function toggleSound() {
  S.sound = !S.sound;
  $('btnSound').classList.toggle('on', S.sound);
  $('sndWaves').style.opacity = S.sound ? '1' : '0.15';
  if (S.sound) Snd.resume();
}
$('btnSpeed').addEventListener('click', cycleSpeed);
$('btnPause').addEventListener('click', togglePause);
$('btnSound').addEventListener('click', toggleSound);
$('btnLedger').addEventListener('click', openLedger);
$('ledgerClose').addEventListener('click', closeLedger);
$('ledgerModal').addEventListener('click', ev => { if (ev.target === $('ledgerModal')) closeLedger(); });
elMend.addEventListener('click', () => { Snd.resume(); if (S.phase === 'prep') startCourse(); });

$('gWarp').addEventListener('pointerenter', ev => showTip(ev,
  '<div class="tt">Warp threads</div><div class="tr2">' + S.diff.warp + ' at the start</div>' +
  '<div class="tb">Every leak snaps warp. At zero the Heart Knot lets go and the province is unmade. Heavier vermin snap more than one.</div>'));
$('gFloss').addEventListener('pointerenter', ev => showTip(ev,
  '<div class="tt">Floss</div><div class="tr2">currency</div>' +
  '<div class="tb">Won from felled vermin, from holding a course, from calling the next course early, and from rendered wax.</div>'));
$('gWave').addEventListener('pointerenter', ev => showTip(ev,
  '<div class="tt">Course</div><div class="tr2">' + TOTAL_COURSES + ' in the posting</div>' +
  '<div class="tb">Hold all twenty-four and the mending arrives from outside the frame.</div>'));
['gWarp','gFloss','gWave'].forEach(id => {
  $(id).addEventListener('pointerleave', hideTip);
  $(id).addEventListener('pointermove', moveTip);
});

/* ------------------------------------------------------------------ boot - */

function newMap(seed) {
  S.map = buildMap(seed === undefined ? ((Math.random() * 4294967295) >>> 0) : seed);
  S.holes.length = 0;
  rebakeCloth();
}

function hardReset() {
  S.phase = 'title';
  S.floss = S.diff.floss; S.warp = S.diff.warp;
  S.course = 0;
  S.towers.length = 0; S.enemies.length = 0; S.shots.length = 0;
  S.fx.length = 0; S.texts.length = 0; S.rings.length = 0;
  S.selected = null; S.selectedType = null;
  S.spawnQ.length = 0; S.alive = 0; S.spawnedAll = false;
  S.boss = null; S.paused = false; S.prepT = 0;
  S.unlocked = 0;
  S.stats = { killed:0, leaked:0, spent:0, earned:0 };
  S.shake = 0; S.flash = 0;
  $('btnPause').classList.remove('on');
  newMap();
  showLedgerLine(null);
  elBossBar.classList.remove('on');
  lastSync = { warp:-1, floss:-1, wave:'', mend:'' };
  showTitle();
  syncUI();
}

window.addEventListener('resize', () => { fitCanvas(); });
if (window.ResizeObserver) new ResizeObserver(() => fitCanvas()).observe(cv);

buildBasket();
newMap();
renderLedger();
showTitle();
syncUI();
fitCanvas();
requestAnimationFrame(frame);

/* A read-only handle on the frame, for anyone who wants to look at the
   arithmetic. Nothing in the game reads it. */
window.__needleward = { S, TOWERS, ENEMIES, COURSES, DIFFS, buildMap, newMap,
                        startCourse, makeTower, tstats, hpScale, syncUI, canBuild };

})();
</script>
</body>
</html>
