<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Needleward &mdash; Hold the Hole Until Help Comes</title>
<meta name="description" content="A tower defense of the Great Coat. Five stitched notions, twenty-four courses of the Unpicking, and a new snag every game. No dependencies.">
<style>
/* ============================================================
   NEEDLEWARD
   A defense of the Great Coat.
   Single file. No network requests. No dependencies.
   ============================================================ */

:root{
  --soot:#0d0b09;
  --walnut:#1e1712;
  --walnut-2:#2a201a;
  --walnut-3:#3a2c23;
  --walnut-4:#4b382c;
  --linen:#e7dcc4;
  --bone:#f2ead9;
  --bone-dim:#bfb298;
  --brass:#c9a227;
  --brass-2:#e6c65b;
  --brass-dim:#7d6418;
  --madder:#bf4436;
  --indigo:#5a7fb5;
  --verdigris:#4f9b7d;
  --saffron:#e2a331;
  --plum:#9a6392;
  --ok:#77c493;
  --bad:#d75648;
  --warn:#e0a02c;
  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 3px;
  --shadow: 0 10px 34px rgba(0,0,0,.55);
}

*{ margin:0; padding:0; box-sizing:border-box; }

html,body{ height:100%; }

body{
  background:
    radial-gradient(1200px 700px at 50% -10%, #35271e 0%, transparent 62%),
    radial-gradient(900px 600px at 100% 110%, #241a14 0%, transparent 60%),
    var(--walnut);
  color:var(--bone);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}

/* faint woodgrain over the whole chrome */
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  opacity:.32;
  background-image:
    repeating-linear-gradient(97deg, rgba(0,0,0,.22) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(93deg, rgba(255,225,180,.035) 0 1px, transparent 1px 13px);
}

button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
button:disabled{ cursor:not-allowed; }
:focus-visible{ outline:2px solid var(--brass-2); outline-offset:2px; }

/* ---------------- layout shell ---------------- */

.app{
  position:relative; z-index:1;
  display:grid;
  grid-template-rows:auto 1fr;
  gap:10px;
  padding:10px;
  max-width:1720px;
  margin:0 auto;
  min-height:100%;
}

@media (min-width:1001px){
  html,body{ overflow:hidden; }
  .app{ height:100dvh; height:100vh; }
}

/* ---------------- top bar ---------------- */

.topbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:9px 14px;
  background:linear-gradient(180deg, var(--walnut-3), var(--walnut-2));
  border:1px solid #0000;
  border-image:none;
  box-shadow: inset 0 1px 0 rgba(255,220,170,.10), inset 0 -1px 0 rgba(0,0,0,.5), var(--shadow);
  border-radius:var(--r);
}

.brand{ display:flex; align-items:center; gap:11px; min-width:0; }
.brand svg{ width:34px; height:34px; flex:0 0 auto; filter:drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
.brand h1{
  font-family:var(--serif); font-size:1.28rem; font-weight:600;
  letter-spacing:.22em; color:var(--bone); line-height:1;
  text-transform:uppercase; white-space:nowrap;
}
.brand p{
  font-family:var(--serif); font-style:italic; font-size:.74rem;
  color:var(--bone-dim); opacity:.75; margin-top:3px; white-space:nowrap;
}

.gauges{ display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }

.gauge{
  display:flex; align-items:center; gap:8px;
  padding:5px 11px 5px 9px;
  background:linear-gradient(180deg, rgba(0,0,0,.34), rgba(0,0,0,.16));
  border:1px solid rgba(201,162,39,.22);
  border-radius:var(--r);
  min-width:104px;
}
.gauge .ico{ width:19px; height:19px; flex:0 0 auto; opacity:.95; }
.gauge .lab{
  font-size:.56rem; letter-spacing:.19em; text-transform:uppercase;
  color:var(--bone-dim); opacity:.72; line-height:1.1;
}
.gauge .val{
  font-family:var(--mono); font-size:1.02rem; font-weight:600;
  line-height:1.1; letter-spacing:.01em;
  font-variant-numeric:tabular-nums;
}
#warpVal{ color:var(--madder); }
#flossVal{ color:var(--brass-2); }
#waveVal{ color:var(--bone); }
.gauge.pulse{ animation:gaugePulse .5s ease; }
@keyframes gaugePulse{
  0%{ transform:scale(1); }
  35%{ transform:scale(1.07); box-shadow:0 0 20px rgba(201,162,39,.4); }
  100%{ transform:scale(1); }
}
.gauge.hurt{ animation:gaugeHurt .5s ease; }
@keyframes gaugeHurt{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-4px); }
  50%{ transform:translateX(4px); }
  80%{ transform:translateX(-2px); }
}

.tools{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }

.tbtn{
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 11px; min-height:36px;
  font-size:.7rem; letter-spacing:.13em; text-transform:uppercase;
  color:var(--bone-dim);
  background:linear-gradient(180deg, rgba(255,225,180,.055), rgba(0,0,0,.22));
  border:1px solid rgba(201,162,39,.24);
  border-radius:var(--r);
  transition:background .15s, color .15s, border-color .15s, transform .08s;
}
.tbtn:hover{ color:var(--bone); border-color:rgba(201,162,39,.5); background:linear-gradient(180deg, rgba(255,225,180,.12), rgba(0,0,0,.16)); }
.tbtn:active{ transform:translateY(1px); }
.tbtn.on{ color:var(--soot); background:linear-gradient(180deg, var(--brass-2), var(--brass)); border-color:var(--brass-2); font-weight:700; }
.tbtn svg{ width:15px; height:15px; }
.tbtn .kbd{
  font-family:var(--mono); font-size:.6rem; opacity:.5;
  border:1px solid currentColor; border-radius:2px; padding:0 3px; margin-left:2px;
}

a.tbtn{ text-decoration:none; }

/* ---------------- stage ---------------- */

.stage{
  display:grid;
  grid-template-columns:minmax(0,1fr) 356px;
  gap:10px;
  min-height:0;
}

@media (max-width:1000px){
  .stage{ grid-template-columns:minmax(0,1fr); }
}

/* ---------------- board ---------------- */

.board{
  position:relative;
  min-width:0; min-height:0;
  display:flex; align-items:center; justify-content:center;
  background:
    linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.55));
  border-radius:var(--r);
  box-shadow: inset 0 0 0 1px rgba(201,162,39,.14), var(--shadow);
  padding:10px;
  overflow:hidden;
}

.board-inner{
  position:relative;
  width:100%;
  max-width:100%;
  max-height:100%;
  aspect-ratio:3 / 2;
  /* the slate frame */
  padding:11px;
  background:
    linear-gradient(180deg,#5b4331,#39281c 42%,#2b1d14);
  border-radius:5px;
  box-shadow:
    inset 0 2px 0 rgba(255,214,158,.20),
    inset 0 -2px 0 rgba(0,0,0,.6),
    0 14px 44px rgba(0,0,0,.62);
}
/* frame woodgrain + lacing */
.board-inner::before{
  content:""; position:absolute; inset:0; border-radius:5px; pointer-events:none;
  background-image:repeating-linear-gradient(90deg, rgba(0,0,0,.20) 0 1px, transparent 1px 7px);
  opacity:.5;
}
.board-inner::after{
  content:""; position:absolute; inset:6px; border-radius:3px; pointer-events:none;
  box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 0 0 2px rgba(255,214,158,.10);
}

canvas#cv{
  display:block; width:100%; height:100%;
  border-radius:2px;
  touch-action:none;
  cursor:crosshair;
  background:#ddd0b4;
}

/* board-anchored HUD */
.boardHud{
  position:absolute; inset:11px; pointer-events:none; border-radius:2px; overflow:hidden;
}

.courseTag{
  position:absolute; top:9px; left:9px;
  display:flex; align-items:baseline; gap:8px;
  padding:5px 11px;
  background:rgba(16,12,9,.74);
  border-left:2px solid var(--brass);
  border-radius:2px;
  backdrop-filter:blur(3px);
  max-width:min(72%,520px);
}
.courseTag .n{ font-family:var(--mono); font-size:.62rem; letter-spacing:.18em; color:var(--brass-2); text-transform:uppercase; }
.courseTag .t{ font-family:var(--serif); font-size:.92rem; color:var(--bone); letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.bossBar{
  position:absolute; top:9px; left:50%; transform:translateX(-50%);
  width:min(58%,460px); display:none;
}
.bossBar.on{ display:block; }
.bossBar .nm{
  font-family:var(--serif); font-size:.76rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--madder); text-align:center; margin-bottom:3px; text-shadow:0 1px 3px #000;
}
.bossBar .tr{ height:7px; background:rgba(10,7,5,.8); border:1px solid rgba(191,68,54,.5); border-radius:99px; overflow:hidden; }
.bossBar .fl{ height:100%; width:100%; background:linear-gradient(90deg,#8e2c22,#d75648,#f0a08f); transition:width .12s linear; }

.ledgerLine{
  position:absolute; left:9px; right:9px; bottom:9px;
  padding:9px 13px;
  background:linear-gradient(90deg, rgba(16,12,9,.88), rgba(16,12,9,.62));
  border-left:2px solid var(--brass-dim);
  font-family:var(--serif); font-style:italic; font-size:.86rem;
  color:#e9dcc0; letter-spacing:.012em;
  opacity:0; transform:translateY(8px);
  transition:opacity .5s ease, transform .5s ease;
  backdrop-filter:blur(3px);
}
.ledgerLine.on{ opacity:1; transform:translateY(0); }
.ledgerLine b{ color:var(--brass-2); font-weight:600; font-style:normal; font-family:var(--mono); font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; display:block; margin-bottom:2px; }

.toastWrap{ position:absolute; top:52px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:5px; align-items:center; }
.toast{
  font-family:var(--mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
  padding:6px 13px; border-radius:2px;
  background:rgba(16,12,9,.86); border:1px solid rgba(201,162,39,.34); color:var(--brass-2);
  animation:toastIn 2.4s ease forwards;
}
.toast.bad{ color:#ffb4aa; border-color:rgba(215,86,72,.5); }
.toast.good{ color:#a9e8c0; border-color:rgba(119,196,147,.45); }
@keyframes toastIn{
  0%{ opacity:0; transform:translateY(-8px); }
  12%,72%{ opacity:1; transform:translateY(0); }
  100%{ opacity:0; transform:translateY(-6px); }
}

/* ---------------- side panel ---------------- */

.panel{
  display:flex; flex-direction:column; min-height:0;
  background:linear-gradient(180deg, var(--walnut-2), #211913);
  border-radius:var(--r);
  box-shadow: inset 0 1px 0 rgba(255,220,170,.08), inset 0 0 0 1px rgba(201,162,39,.13), var(--shadow);
  overflow:hidden;
}

.panelScroll{ flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:11px; display:flex; flex-direction:column; gap:11px; }
.panelScroll::-webkit-scrollbar{ width:8px; }
.panelScroll::-webkit-scrollbar-track{ background:rgba(0,0,0,.28); }
.panelScroll::-webkit-scrollbar-thumb{ background:rgba(201,162,39,.28); border-radius:9px; }
.panelScroll::-webkit-scrollbar-thumb:hover{ background:rgba(201,162,39,.5); }

.sect{ display:flex; flex-direction:column; gap:8px; }
.sectHead{
  display:flex; align-items:center; gap:9px;
  font-family:var(--mono); font-size:.6rem; letter-spacing:.22em; text-transform:uppercase;
  color:var(--brass); opacity:.9;
}
.sectHead::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, rgba(201,162,39,.34), transparent); }
.sectHead .hint{ font-size:.55rem; letter-spacing:.1em; opacity:.55; color:var(--bone-dim); }

/* workbasket cards */
.basket{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }

.nCard{
  position:relative; text-align:left;
  padding:8px 8px 7px 8px;
  background:linear-gradient(180deg, rgba(255,228,186,.045), rgba(0,0,0,.24));
  border:1px solid rgba(201,162,39,.17);
  border-radius:var(--r);
  transition:border-color .14s, background .14s, transform .08s;
  overflow:hidden;
  min-height:76px;
}
.nCard:hover{ border-color:rgba(201,162,39,.45); background:linear-gradient(180deg, rgba(255,228,186,.1), rgba(0,0,0,.18)); }
.nCard:active{ transform:translateY(1px); }
.nCard.sel{ border-color:var(--brass-2); box-shadow:0 0 0 1px var(--brass-2), 0 0 18px rgba(201,162,39,.24); background:linear-gradient(180deg, rgba(255,228,186,.15), rgba(0,0,0,.1)); }
.nCard.poor{ opacity:.42; }
.nCard .swatch{ position:absolute; left:0; top:0; bottom:0; width:3px; }
.nCard .row1{ display:flex; align-items:center; gap:7px; }
.nCard canvas{ width:30px; height:30px; flex:0 0 auto; image-rendering:auto; }
.nCard .nm{ font-family:var(--serif); font-size:.83rem; letter-spacing:.02em; color:var(--bone); line-height:1.15; }
.nCard .role{ font-size:.58rem; letter-spacing:.13em; text-transform:uppercase; color:var(--bone-dim); opacity:.7; margin-top:2px; }
.nCard .cost{ display:flex; align-items:center; gap:4px; margin-top:6px; font-family:var(--mono); font-size:.76rem; color:var(--brass-2); font-variant-numeric:tabular-nums; }
.nCard .cost svg{ width:12px; height:12px; }
.nCard .hot{ position:absolute; top:5px; right:6px; font-family:var(--mono); font-size:.58rem; color:var(--bone-dim); opacity:.42; }

/* inspector */
.insp{
  background:linear-gradient(180deg, rgba(255,228,186,.05), rgba(0,0,0,.22));
  border:1px solid rgba(201,162,39,.19);
  border-radius:var(--r);
  padding:10px;
  display:flex; flex-direction:column; gap:9px;
}
.insp .top{ display:flex; gap:10px; align-items:flex-start; }
.insp canvas{ width:44px; height:44px; flex:0 0 auto; }
.insp .ttl{ font-family:var(--serif); font-size:1rem; color:var(--bone); line-height:1.2; }
.insp .tier{ font-family:var(--mono); font-size:.58rem; letter-spacing:.16em; text-transform:uppercase; color:var(--brass); margin-top:3px; }
.insp .flav{ font-family:var(--serif); font-style:italic; font-size:.78rem; color:var(--bone-dim); opacity:.82; line-height:1.4; }

.pips{ display:flex; gap:4px; margin-top:5px; }
.pip{ width:15px; height:4px; border-radius:9px; background:rgba(255,255,255,.11); }
.pip.on{ background:var(--brass-2); box-shadow:0 0 7px rgba(230,198,91,.55); }

.stats{ display:grid; grid-template-columns:1fr 1fr; gap:5px 9px; }
.stat{ display:flex; justify-content:space-between; align-items:baseline; gap:6px; font-size:.7rem; border-bottom:1px dotted rgba(201,162,39,.16); padding-bottom:3px; }
.stat .k{ color:var(--bone-dim); opacity:.72; letter-spacing:.05em; }
.stat .v{ font-family:var(--mono); color:var(--bone); font-variant-numeric:tabular-nums; }
.stat .v .up{ color:var(--ok); font-size:.62rem; margin-left:3px; }

.tgt{ display:flex; gap:4px; }
.tgt button{
  flex:1; padding:5px 2px; font-size:.58rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--bone-dim); border:1px solid rgba(201,162,39,.18); border-radius:2px; background:rgba(0,0,0,.2);
  transition:.13s;
}
.tgt button:hover{ color:var(--bone); border-color:rgba(201,162,39,.4); }
.tgt button.on{ background:linear-gradient(180deg,var(--brass-2),var(--brass)); color:var(--soot); font-weight:700; border-color:var(--brass-2); }

.acts{ display:flex; gap:6px; }
.bigBtn{
  flex:1; padding:9px 8px; min-height:42px;
  font-size:.72rem; letter-spacing:.13em; text-transform:uppercase; font-weight:700;
  border-radius:var(--r); transition:.14s; text-align:center;
  border:1px solid transparent;
}
.bUp{ background:linear-gradient(180deg,#3f7f5f,#2a5b43); color:#eafff2; border-color:#54a077; box-shadow:0 2px 0 rgba(0,0,0,.4); }
.bUp:hover:not(:disabled){ background:linear-gradient(180deg,#4d9772,#336a4e); }
.bUp:disabled{ background:rgba(255,255,255,.05); color:rgba(255,255,255,.28); border-color:rgba(255,255,255,.08); box-shadow:none; }
.bUp .sub{ display:block; font-size:.62rem; letter-spacing:.08em; opacity:.85; font-weight:400; text-transform:none; margin-top:2px; font-family:var(--mono); }
.bSell{ flex:0 0 96px; background:linear-gradient(180deg,#6a3830,#4a2620); color:#ffd9d1; border-color:#8b4a3f; box-shadow:0 2px 0 rgba(0,0,0,.4); }
.bSell:hover{ background:linear-gradient(180deg,#7d443a,#5a2f27); }
.bSell .sub{ display:block; font-size:.62rem; letter-spacing:.06em; opacity:.85; font-weight:400; text-transform:none; margin-top:2px; font-family:var(--mono); }

.emptyInsp{ padding:16px 12px; text-align:center; font-family:var(--serif); font-style:italic; font-size:.8rem; color:var(--bone-dim); opacity:.55; line-height:1.5; }

/* next course preview */
.nextBox{
  background:linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.14));
  border:1px solid rgba(201,162,39,.16);
  border-radius:var(--r); padding:9px 10px; display:flex; flex-direction:column; gap:7px;
}
.nextBox .hdr{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.nextBox .cn{ font-family:var(--serif); font-size:.86rem; color:var(--bone); }
.nextBox .cc{ font-family:var(--mono); font-size:.6rem; color:var(--brass); letter-spacing:.16em; }
.threats{ display:flex; flex-wrap:wrap; gap:5px; }
.threat{
  display:flex; align-items:center; gap:5px; padding:3px 7px 3px 4px;
  background:rgba(0,0,0,.32); border:1px solid rgba(201,162,39,.15); border-radius:99px;
  font-size:.64rem; color:var(--bone-dim);
}
.threat canvas{ width:20px; height:20px; }
.threat .q{ font-family:var(--mono); color:var(--bone); font-size:.62rem; }
.threat.boss{ border-color:rgba(215,86,72,.55); background:rgba(80,20,14,.35); color:#ffc8c0; }

.panelFoot{ flex:0 0 auto; padding:10px; border-top:1px solid rgba(201,162,39,.14); background:linear-gradient(180deg, rgba(0,0,0,.2), rgba(0,0,0,.42)); }

.mendBtn{
  width:100%; padding:13px 12px; min-height:56px;
  background:linear-gradient(180deg,#d8b544,#a5811a);
  color:#241a06; border-radius:var(--r);
  font-size:.92rem; letter-spacing:.26em; text-transform:uppercase; font-weight:800;
  box-shadow:0 3px 0 #6b520d, 0 8px 22px rgba(201,162,39,.24);
  transition:.14s; position:relative; overflow:hidden;
}
.mendBtn:hover:not(:disabled){ background:linear-gradient(180deg,#eccb5c,#b8912a); transform:translateY(-1px); box-shadow:0 4px 0 #6b520d, 0 10px 26px rgba(201,162,39,.32); }
.mendBtn:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 #6b520d; }
.mendBtn:disabled{ background:linear-gradient(180deg,#3a3128,#2a231c); color:rgba(242,234,217,.34); box-shadow:none; }
.mendBtn .sub{ display:block; font-size:.6rem; letter-spacing:.14em; font-weight:500; margin-top:3px; opacity:.8; font-family:var(--mono); text-transform:none; }
.mendBtn .fuse{ position:absolute; left:0; bottom:0; height:3px; background:rgba(36,26,6,.5); width:0%; }

/* ---------------- overlay screens ---------------- */

.ovl{
  position:absolute; inset:11px; border-radius:2px; z-index:20;
  display:flex; align-items:center; justify-content:center; padding:18px;
  background:radial-gradient(120% 100% at 50% 0%, rgba(28,20,14,.90), rgba(8,6,4,.96));
  backdrop-filter:blur(4px);
  opacity:0; pointer-events:none; transition:opacity .35s ease;
  overflow-y:auto;
}
.ovl.on{ opacity:1; pointer-events:auto; }

.card{
  width:min(660px,100%); text-align:center;
  padding:clamp(16px,3.4vw,34px);
  background:linear-gradient(180deg, rgba(46,34,25,.95), rgba(22,16,12,.97));
  border:1px solid rgba(201,162,39,.3);
  border-radius:4px;
  box-shadow:0 20px 70px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,220,170,.12);
}
.card .kicker{ font-family:var(--mono); font-size:.6rem; letter-spacing:.4em; text-transform:uppercase; color:var(--brass); opacity:.85; }
.card h2{
  font-family:var(--serif); font-weight:600;
  font-size:clamp(1.7rem,5.6vw,3rem); letter-spacing:.14em; text-transform:uppercase;
  margin:9px 0 4px; color:var(--bone);
  text-shadow:0 3px 20px rgba(0,0,0,.7);
}
.card .tag{ font-family:var(--serif); font-style:italic; font-size:clamp(.86rem,2.3vw,1.02rem); color:var(--brass-2); opacity:.9; }
.card .prose{
  margin:16px auto 0; max-width:52ch; text-align:left;
  font-family:var(--serif); font-size:clamp(.82rem,2.1vw,.94rem); line-height:1.66; color:#ddd0b7;
}
.card .prose p{ margin-bottom:9px; }
.card .prose p:last-child{ margin-bottom:0; }

.tip{

   NEEDLEWARD — a defense of the Great Coat
   ----------------------------------------------------------------------------
   Everything below is self-contained: no fonts, no images, no libraries.
   The linen, the snag, every notion and every moth is drawn from arithmetic.
   ========================================================================== */
(function () {

/* ---------------------------------------------------------------- constants */

const WORLD_W = 1200, WORLD_H = 800;   // fixed world; canvas scales to fit
const CELL    = 50;
const COLS    = WORLD_W / CELL;        // 24
const ROWS    = WORLD_H / CELL;        // 16
const TOTAL_COURSES = 24;

/* ---------------------------------------------------------------------- rng */
// Small deterministic PRNG so a "snag" can be reproduced from a seed.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32((Math.random() * 4294967295) >>> 0);
const rand  = (a, b) => a + rng() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick  = arr => arr[Math.floor(rng() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;

/* =========================================================================
   THE SNAG — procedural map generation
   A snag is a thread pulled loose. It runs where it runs; no two postings
   look alike. The generator refuses paths that touch themselves, so there is
   always a course of sound weave between passes for the notions to sit in.
   ========================================================================= */

const idxOf = (c, r) => r * COLS + c;
const md    = (a, b) => Math.abs(a.c - b.c) + Math.abs(a.r - b.r);
const cheb  = (a, b) => Math.max(Math.abs(a.c - b.c), Math.abs(a.r - b.r));

function tryGenSnag() {
  const heart = { c: randi(7, COLS - 8), r: randi(4, ROWS - 5) };
  const edge  = randi(0, 3);
  let sc, sr;
  if (edge === 0)      { sc = 0;        sr = randi(1, ROWS - 2); }
  else if (edge === 1) { sc = COLS - 1; sr = randi(1, ROWS - 2); }
  else if (edge === 2) { sr = 0;        sc = randi(1, COLS - 2); }
  else                 { sr = ROWS - 1; sc = randi(1, COLS - 2); }

  const minLen = 27, maxLen = 76;
  const mark = new Uint8Array(COLS * ROWS);
  const path = [];
  let budget = 30000;

  const NB = [[1,0],[-1,0],[0,1],[0,-1]];

  function untouched(c, r, prev) {
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return false;
    if (mark[idxOf(c, r)]) return false;
    for (let i = 0; i < 4; i++) {
      const nc = c + NB[i][0], nr = r + NB[i][1];
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      if (mark[idxOf(nc, nr)] && !(nc === prev.c && nr === prev.r)) return false;
    }
    return true;
  }
  const okStep  = (c, r, prev) => cheb({c,r}, heart) > 1 && untouched(c, r, prev);
  const okFinal = (c, r, prev) => untouched(c, r, prev);

  function dfs(cur) {
    if (budget-- <= 0) return false;
    if (path.length >= maxLen) return false;
    const order = NB.slice();
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = order[i]; order[i] = order[j]; order[j] = t;
    }
    // early on we wander; once long enough we start leaning toward the knot
    if (rng() < (path.length < minLen ? 0.22 : 0.7)) {
      order.sort((a, b) =>
        md({ c: cur.c + a[0], r: cur.r + a[1] }, heart) -
        md({ c: cur.c + b[0], r: cur.r + b[1] }, heart));
    }
    for (let i = 0; i < 4; i++) {
      const nc = cur.c + order[i][0], nr = cur.r + order[i][1];
      if (md({ c: nc, r: nr }, heart) === 1) {
        if (path.length + 1 < minLen) continue;
        if (!okFinal(nc, nr, cur)) continue;
        path.push({ c: nc, r: nr }, { c: heart.c, r: heart.r });
        return true;
      }
      if (!okStep(nc, nr, cur)) continue;
      mark[idxOf(nc, nr)] = 1; path.push({ c: nc, r: nr });
      if (dfs({ c: nc, r: nr })) return true;
      path.pop(); mark[idxOf(nc, nr)] = 0;
    }
    return false;
  }

  mark[idxOf(sc, sr)] = 1;
  path.push({ c: sc, r: sr });
  if (!dfs({ c: sc, r: sr })) return null;
  return { heart, cells: path, edge };
}

function fallbackSnag() {
  // A plain serpentine, used only if the generator somehow starves.
  const cells = [];
  let r = 2;
  for (let band = 0; band < 4; band++) {
    const l2r = band % 2 === 0;
    for (let i = 0; i < COLS - 4; i++) cells.push({ c: l2r ? 1 + i : COLS - 2 - i, r });
    if (band < 3) { cells.push({ c: l2r ? COLS - 3 : 2, r: r + 1 }); cells.push({ c: l2r ? COLS - 3 : 2, r: r + 2 }); r += 3; }
  }
  const last = cells[cells.length - 1];
  return { heart: { c: last.c, r: last.r }, cells, edge: 0 };
}

function chaikin(p, iters) {
  for (let k = 0; k < iters; k++) {
    const out = [p[0]];
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1];
      out.push({ x: a.x * 0.75 + b.x * 0.25, y: a.y * 0.75 + b.y * 0.25 });
      out.push({ x: a.x * 0.25 + b.x * 0.75, y: a.y * 0.25 + b.y * 0.75 });
    }
    out.push(p[p.length - 1]);
    p = out;
  }
  return p;
}

function buildMap(seed) {
  rng = mulberry32(seed >>> 0);
  let raw = null;
  for (let a = 0; a < 500 && !raw; a++) raw = tryGenSnag();
  if (!raw) raw = fallbackSnag();

  const cx = c => c * CELL + CELL / 2;
  const cy = r => r * CELL + CELL / 2;

  let pts = raw.cells.map(k => ({ x: cx(k.c), y: cy(k.r) }));
  // Bring the snag in from under the frame.
  const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
  const dl = Math.hypot(dx, dy) || 1;
  pts.unshift({ x: pts[0].x + dx / dl * CELL * 1.6, y: pts[0].y + dy / dl * CELL * 1.6 });
  pts = chaikin(pts, 2);

  // arc-length table
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push({ a, b, len, s: total, ang: Math.atan2(b.y - a.y, b.x - a.x) });
    total += len;
  }

  // buildability
  const build = new Uint8Array(COLS * ROWS).fill(1);
  for (const k of raw.cells) build[idxOf(k.c, k.r)] = 0;
  for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
    const c = raw.heart.c + dc, r = raw.heart.r + dr;
    if (c >= 0 && r >= 0 && c < COLS && r < ROWS) build[idxOf(c, r)] = 0;
  }
  // Also protect the mouth of the snag so nothing is built on the entry.
  const first = raw.cells[0];
  for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
    const c = first.c + dc, r = first.r + dr;
    if (c >= 0 && r >= 0 && c < COLS && r < ROWS) build[idxOf(c, r)] = 0;
  }

  const heartPt = { x: cx(raw.heart.c), y: cy(raw.heart.r) };
  const entry   = { x: pts[0].x, y: pts[0].y };

  return { seed, cells: raw.cells, heartCell: raw.heart, heart: heartPt, entry, pts, segs, total, build };
}

function posAt(map, d) {
  if (d <= 0) { const s = map.segs[0]; return { x: s.a.x, y: s.a.y, ang: s.ang }; }
  if (d >= map.total) { const s = map.segs[map.segs.length - 1]; return { x: s.b.x, y: s.b.y, ang: s.ang }; }
  // segments are short and uniform-ish; a guarded linear scan from a hint is plenty
  let lo = 0, hi = map.segs.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (map.segs[mid].s + map.segs[mid].len < d) lo = mid + 1; else hi = mid;
  }
  const s = map.segs[lo];
  const t = (d - s.s) / (s.len || 1);
  return { x: lerp(s.a.x, s.b.x, t), y: lerp(s.a.y, s.b.y, t), ang: s.ang };
}

/* =========================================================================
   SOUND — tiny synthesised workroom. Nothing is loaded.
   ========================================================================= */

const Snd = (function () {
  let ctx = null, master = null, ready = false;
  function boot() {
    if (ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.32;
      const comp = ctx.createDynamicsCompressor();
      master.connect(comp); comp.connect(ctx.destination);
      ready = true;
    } catch (e) { ready = false; }
  }
  function env(type, f0, f1, dur, vol, wave) {
    if (!ready || !S.sound || ctx.state === 'suspended') return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = wave || type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.012, dur * 0.3));
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq, q) {
    if (!ready || !S.sound) return;
    const t = ctx.currentTime;
    const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q || 1.2;
    const gn = ctx.createGain(); gn.gain.value = vol;
    src.connect(bp); bp.connect(gn); gn.connect(master);
    src.start(t);
  }
  return {
    resume() { boot(); if (ctx && ctx.state === 'suspended') ctx.resume(); },
    place()  { env('triangle', 320, 150, 0.13, 0.20); noise(0.07, 0.10, 1500, 2); },
    sell()   { env('sine', 420, 180, 0.16, 0.16); },
    up()     { env('triangle', 380, 720, 0.16, 0.18); env('sine', 760, 1100, 0.13, 0.09); },
    knot()   { env('square', 900 + Math.random() * 120, 620, 0.035, 0.045); },
    chain()  { env('sawtooth', 1500, 340, 0.10, 0.055); },
