<!--
================================================================================
  THE STANDING SALT
  a walling at the Netherwich brine house
================================================================================

  1. TITLE
  ------------------------------------------------------------------------
  THE STANDING SALT.
  In the old halls a "standing salt" was the great ceremonial salt cellar set
  at the middle of the table; you sat above it or below it, and that told
  everyone what you were worth. Here it means the other thing: salt that gets
  up off the floor and walks.

  2. PREMISE                                                    (232 words)
  ------------------------------------------------------------------------
  You are Aldis Wray, waller of the Netherwich brine house, hired for the
  last good draw of a spring that is going sour. A waller's work is to walk
  the pan floor while the brine blooms — to weight the tread-boards, shoulder
  the loaves, and carry the mother-crystal to the crib so the next bloom has
  something to grow upon.

  The brine at Netherwich is quick. It takes an impression. Whatever walks
  the floor while the pan is at bloom is written into the crystal, and when
  the wheel comes round and the house floods again, that writing gets up and
  walks it a second time: a figure of set salt with your shoulders and your
  limp, doing again, exactly, what you did. The house calls them the standing
  salt. A waller works alone and is never alone. The pan will bear four
  shifts of standing salt; the fifth slumps into the clods.

  The salt is obedient and it is brittle. It does not improvise. If it puts
  its foot where a loaf used to be, or reaches a hatch you have since let
  fall, or walks into your living body, the contradiction is more than the
  crystal will carry. It slakes — goes to water, all at once, and fouls the
  whole pan. Then the draw is spoiled, the fire is wasted, and the clerk
  writes down what you cost.

  Do the work. Do not argue with what you already did.

  3. ART DIRECTION
  ------------------------------------------------------------------------
  PALETTE (soot, tallow, brick, brine, bloom — no navy, no cyan, no magenta):
    #14100d  pan-house dark      (deepest shadow, page ground)
    #1f1813  floor shadow
    #2b211a  wet brick, unlit
    #3a2b20  brick, lit edge
    #52402e  timber, unlit
    #6d5538  timber, lit
    #8a6a3c  ochre plaster
    #b98b46  brass, wheel-iron highlight
    #d9a css— (see PAL in code)  tallow flame
    #e6d6b0  parchment / day-book
    #f3ecdb  salt bloom, brightest white-warm
    #9fae8b  brine green (sickly, vegetal — deliberately NOT cyan)
    #6e7c5c  brine green, deep
    #a8452a  rust, dried blood of iron
    #d8622f  fire mouth
    #7c3b1e  fire, banked
  LIGHT: two sources, both warm and both low. A tallow lamp hung at the east
  wall (upper right) and the fire-mouth under the pan (lower centre). Light
  falls from below and from the side, so figures are lit along one flank and
  the floor grout runs black. Everything more than five tiles from a flame is
  nearly silhouette. Salt is the only thing in the room that is bright; it
  catches light like wet sugar.
  SHAPE LANGUAGE: heavy, hand-cut, slightly out of true. Rounded shoulders,
  fat chamfers, no hairlines. Bricks are laid by eye. Every rectangle gets a
  1-2px wobble. Nothing in this building is square except the iron.
  ERA/TEXTURE: an inland English wich house, 1670s — brine pit, lead pan,
  wooden hurdles, salt loaves in their moulds, a clerk's day-book. Texture is
  drawn procedurally: brick stipple, salt granulation, soot gradient, drybrush
  scumble on the timber, steam.
  TYPOGRAPHY: serif throughout, in the register of a ledger. Headings in
  Georgia / Iowan Old Style small-caps at ordinary tracking. Body in the same
  serif. The clerk's asides in italic. Numbers as roman numerals for shifts
  and as scratched tallies for paddles. NO monospace anywhere; no letter-
  spaced all-caps; no gradients in the title.

  4. VOICE
  ------------------------------------------------------------------------
  Every string is the Netherwich clerk of the fire writing you up in the
  day-book — dry, second-person, period, faintly unkind, always counting.

================================================================================
  DECISIONS (rules that the brief left ambiguous; fixed here, and consistent)
  ------------------------------------------------------------------------
  D1. ORDER OF RESOLUTION. Within one paddle the salt moves first, eldest
      shift to youngest, and the living waller moves last. ("The dead have
      the right of way.") Because moves resolve one actor at a time against
      current occupancy, two bodies can never claim one tile; a head-on swap
      leaves both blocked; a follow-the-leader chain works.
  D2. THE THRESHOLD. The doorway tile holds any number of bodies. Every shift
      begins there, so it must. Every other tile holds exactly one.
  D3. HATCHES ANSWER LATE. Tread-boards are read after all movement in a
      paddle; a mover tests the hatch as it stood at the end of the previous
      paddle. Stepping off a board therefore leaves the hatch open for one
      more paddle.
  D4. A HATCH WILL NOT SEAT ON A BODY. If a hatch would close on an occupied
      tile it stays open until the way is clear. (This can never itself cause
      a slake; it only delays.)
  D5. SALT THAT OUTLIVES ITS SHIFT. A shift closed early leaves salt that
      stands where it stopped for the rest of the wheel. Standing salt still
      weights a board. This is the central trick of the trade.
  D6. LOAVES WEIGH BOARDS. A salt loaf holds a tread-board exactly as a body
      does. Loaves push one tile, Sokoban fashion, never two, never sideways.
  D7. THE MOTHER. Any actor entering the mother-crystal's tile takes it up
      without being told. Setting it down is deliberate (X). The walling is
      finished the moment the mother lies loose in the crib, whoever set it
      there — which can only ever be you, because the draw ends when it does.
  D8. FIVE SHIFTS. The pan bears four shifts of standing salt, so there are
      five shifts in a draw. Let the fifth burn out and the fire is wasted;
      the draw is spoiled (recoverable — unpick or draw again).
  D9. DIVERGENCE IS OUTCOME-BASED. Salt replays inputs, and the house
      remembers the outcome each input had when it was walked. Any mismatch —
      moved/blocked, what it pushed, whether it was carrying — slakes it.
  D10. UNDO IS RE-DERIVATION. State is a pure function of (level, input log).
      Undo pops one token and re-simulates from nothing, so undoing and
      replaying the same tokens is identical by construction.
================================================================================
-->

<script id="core">
/* ---------------------------------------------------------------------------
   THE PAN — pure simulation. No DOM in this block, on purpose: the self-test
   runs it headlessly. State is a function of (level, log) and nothing else.
   --------------------------------------------------------------------------- */
"use strict";
var NETHERWICH = (function () {

  var W = 13, H = 13;          // the pan floor, thirteen flags to a side
  var PADDLES = 44;            // one shift = forty-four paddles of the wheel
  var MAX_SALT = 4;            // the pan bears four shifts; the fifth slumps

  var GROUP = { '1': 'A', '2': 'B', '3': 'C' };   // board char -> hatch it draws
  var DIRS = { N: [0, -1], S: [0, 1], E: [1, 0], W: [-1, 0] };
  var DIRWORD = { N: 'north', S: 'south', E: 'east', W: 'west' };
  var ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI'];

  /* ------------------------------------------------------------------ levels */
  var LEVELS = [
    {
      id: 1,
      name: 'The First Walling',
      leaf: 'day one, the low pan',
      map: [
        '#############',
        '#.....#.....#',
        '#.....#....*#',
        '#..1..#.....#',
        '#.....#.....#',
        '#.....#.....#',
        '#.....#.....#',
        '#.....#.....#',
        '#.....#.....#',
        '#.....A.....#',
        '#.m...#.....#',
        '#@....#.....#',
        '#############'
      ],
      grates: [[9, 11], [10, 11]],
      brief: [
        'Wray. The low pan, first day, and the steward has taken the second waller off you.',
        'There is one hatch, one tread-board, and no one to stand on it but yourself — so stand on it, close the shift, and let the salt of you hold the board while the living of you carries the mother to the crib.',
        'That is the whole trade. Everything after this is the same trick, worse.'
      ],
      /* SOLUTION (paddle-by-paddle; the self-test walks it)
         Shift I  : E E N N N N N N N N |     park the salt on the board at 3,3
         Shift II : N E S E E E N N . . E E E E E E N N N N N N N X
                    take the mother at 2,10; wait out two paddles at 5,9 while
                    the salt climbs; through the hatch at 6,9; up the east pan
                    to the crib at 11,2; set it down.                        */
      solution: ['EENNNNNNNN|', 'NESEEENN..EEEEEENNNNNNNX']
    },

    {
      id: 2,
      name: 'The Barred Leat',
      leaf: 'day nine, the middle pan',
      map: [
        '#############',
        '#...#...#...#',
        '#.1.#.2.#.*.#',
        '#...#...#...#',
        '#...#...#...#',
        '#...#...#...#',
        '#...A...B...#',
        '#...#...#...#',
        '#...#...#...#',
        '#...#.o.#...#',
        '#...#.3.#...#',
        '#@..#m..#...#',
        '#############'
      ],
      grates: [[10, 11], [11, 11]],
      brief: [
        'The middle pan, and the leat is barred: the far hatch runs on two chains and will not lift unless both boards are weighted at once.',
        'You have a loaf in the mould at 6,9. A loaf holds a board as well as a body does, and it does not complain about the hours.',
        'Three shifts. Shove, stand, and carry, in that order.'
      ],
      /* SOLUTION
         Shift I  : N N N N N N N N N E |        salt onto board 2,2 (lifts A)
         Shift II : E E N N N N N . . . E E S S E S N N N N N N N |
                    through A at 4,6; shoulder the loaf south onto board 6,10;
                    climb to board 6,2 and set there. Both chains weighted: B.
         Shift III: . E E N N N N . . . . N E E S S S S S N N N N N E E E E E
                    N N N N X                                                */
      solution: [
        'NNNNNNNNNE|',
        'EENNNNN...EESSESNNNNNNN|',
        '.EENNNN....NEESSSSSNNNNNEEEEENNNNX'
      ]
    },

    {
      id: 3,
      name: 'What the Salt Holds',
      leaf: 'day nineteen, the high pan',
      map: [
        '#############',
        '#...#...#...#',
        '#.m.#.3.#..*#',
        '#...#...#...#',
        '#...#...#...#',
        '##A##...##C##',
        '#...........#',
        '#...........#',
        '#...........#',
        '#.....1.....#',
        '#...........#',
        '#@..........#',
        '#############'
      ],
      loaves: [[6, 9]],          // a loaf already sitting on the board: A stands open
      grates: [[11, 10], [11, 11]],
      brief: [
        'The high pan. The spring is going and this is the last mother in the house, so read this twice before you walk.',
        'The loaf on the board at 6,9 is the only thing holding the cistern hatch up, and the far chain wants that same loaf. Shift it too soon and you shut the door on your own back.',
        'And the mother: whoever takes it up first, took it. If you reach past yourself for it, the salt closes on nothing and goes to water. Let yourself hand it to you.'
      ],
      /* SOLUTION
         Shift I  : E E N N N N N W N N N N S S S S S X E |
                    in through A (held by the loaf), take the mother at 2,2,
                    carry it out and SET IT DOWN at 2,7, then step off it.
         Shift II : . E E E E E N . . . . . . . . . N N N N N N N E |
                    wait out the salt's last passage of A (paddle 14), then
                    shove the loaf seven north onto the far board 6,2. A shuts
                    behind it; nothing living needs it again.
         Shift III: N N N N (fifteen paddles of standing fast) E S E E E E E E
                    E E N N N N N N E X
                    take the mother off the floor at 2,7 the paddle after your
                    own salt lets go of it; east along the eight; up through
                    the crib hatch; set the mother in the crib.              */
      solution: [
        'EENNNNNWNNNNSSSSSXE|',
        '.EEEEEN.........NNNNNNNE|',
        'NNNN...............ESEEEEEEEENNNNNNEX'
      ]
    }
  ];

  /* --------------------------------------------------------------- level prep */
  function parseLevel(L) {
    if (L._p) return L._p;
    var walls = [], brine = [], boards = [], hatches = [], grate = {};
    var start = null, crib = null, mother = null, loaves = [];
    for (var y = 0; y < H; y++) {
      walls.push([]); brine.push([]);
      for (var x = 0; x < W; x++) {
        var c = L.map[y][x];
        walls[y].push(c === '#');
        brine[y].push(c === '~');
        if (c === '@') start = { x: x, y: y };
        if (c === '*') crib = { x: x, y: y };
        if (c === 'm') mother = { x: x, y: y };
        if (c === 'o') loaves.push({ x: x, y: y });
        if (GROUP[c]) boards.push({ x: x, y: y, g: GROUP[c] });
        if (c === 'A' || c === 'B' || c === 'C') hatches.push({ x: x, y: y, g: c });
      }
    }
    (L.loaves || []).forEach(function (p) { loaves.push({ x: p[0], y: p[1] }); });
    (L.grates || []).forEach(function (p) { grate[p[0] + ',' + p[1]] = true; });
    L._p = {
      walls: walls, brine: brine, boards: boards, hatches: hatches, grate: grate,
      start: start, crib: crib, mother: mother, loaves: loaves
    };
    return L._p;
  }

  /* --------------------------------------------------------------- the state */
  function freshWorld(L) {
    var p = parseLevel(L);
    return {
      loaves: p.loaves.map(function (o) { return { x: o.x, y: o.y }; }),
      mother: { x: p.mother.x, y: p.mother.y, held: -2 },   // -2 = loose on the floor
      open: []                                              // per hatch, by index
    };
  }

  function initState(L) {
    var p = parseLevel(L);
    var st = {
      L: L, shift: 0, paddle: 0,
      recs: [],                                  // [{acts:[], wit:[]}]
      cur: { acts: [], wit: [] },
      world: freshWorld(L),
      actors: [],                                // rebuilt each shift
      halt: null, won: false, spoiled: false,
      log: []
    };
    layShift(st);
    return st;
  }

  // Actor 0..n-1 are salt (eldest first); the last actor is the living waller.
  function layShift(st) {
    var p = parseLevel(st.L);
    st.world = freshWorld(st.L);
    st.actors = [];
    for (var i = 0; i < st.recs.length; i++) {
      st.actors.push({ x: p.start.x, y: p.start.y, salt: true, rec: i, carry: false, face: 'S', bump: null });
    }
    st.actors.push({ x: p.start.x, y: p.start.y, salt: false, rec: -1, carry: false, face: 'S', bump: null });
    st.paddle = 0;
    readBoards(st);
  }

  function weighted(st, bx, by) {
    for (var i = 0; i < st.actors.length; i++)
      if (st.actors[i].x === bx && st.actors[i].y === by) return true;
    for (var j = 0; j < st.world.loaves.length; j++)
      if (st.world.loaves[j].x === bx && st.world.loaves[j].y === by) return true;
    return false;
  }

  // D3/D4: boards are read after movement; a hatch will not seat on a body.
  function readBoards(st) {
    var p = parseLevel(st.L), want = {};
    p.boards.forEach(function (b) {
      if (want[b.g] === undefined) want[b.g] = true;
      if (!weighted(st, b.x, b.y)) want[b.g] = false;
    });
    p.hatches.forEach(function (h, i) {
      var w = want[h.g] === true;
      if (!w && occupied(st, h.x, h.y)) w = true;      // will not seat on a body
      st.world.open[i] = w;
    });
  }

  function occupied(st, x, y) {
    for (var i = 0; i < st.actors.length; i++)
      if (st.actors[i].x === x && st.actors[i].y === y) return true;
    for (var j = 0; j < st.world.loaves.length; j++)
      if (st.world.loaves[j].x === x && st.world.loaves[j].y === y) return true;
    return false;
  }

  function hatchAt(st, x, y) {
    var p = parseLevel(st.L);
    for (var i = 0; i < p.hatches.length; i++)
      if (p.hatches[i].x === x && p.hatches[i].y === y) return { h: p.hatches[i], i: i };
    return null;
  }
  function loafAt(st, x, y) {
    for (var i = 0; i < st.world.loaves.length; i++)
      if (st.world.loaves[i].x === x && st.world.loaves[i].y === y) return st.world.loaves[i];
    return null;
  }
  function actorAt(st, x, y) {
    for (var i = 0; i < st.actors.length; i++)
      if (st.actors[i].x === x && st.actors[i].y === y) return st.actors[i];
    return null;
  }
  function isThreshold(st, x, y) {
    var p = parseLevel(st.L);
    return p.start.x === x && p.start.y === y;
  }

  // Why a tile refuses you — used verbatim in the slake report.
  function refusal(st, x, y) {
    var p = parseLevel(st.L);
    if (x < 0 || y < 0 || x >= W || y >= H) return 'the pan wall';
    if (p.walls[y][x]) return 'the pan wall';
    if (p.brine[y][x]) return 'the brine gutter';
    if (p.grate[x + ',' + y]) return 'the fire grate';
    var h = hatchAt(st, x, y);
    if (h && !st.world.open[h.i]) return 'the seated hatch';
    if (loafAt(st, x, y)) return 'a loaf of salt';
    var a = actorAt(st, x, y);
    if (a && !isThreshold(st, x, y)) return a.salt ? ('the salt of shift ' + ROMAN[a.rec]) : 'your own living body';
    return 'nothing at all';
  }

  function passable(st, x, y) {
    var p = parseLevel(st.L);
    if (x < 0 || y < 0 || x >= W || y >= H) return false;
    if (p.walls[y][x] || p.brine[y][x]) return false;
    if (p.grate[x + ',' + y]) return false;
    var h = hatchAt(st, x, y);
    if (h && !st.world.open[h.i]) return false;
    return true;
  }

  /* ------------------------------------------------------- one actor, one act */
  function act(st, a, tok) {
    var out = { c: 's', x: a.x, y: a.y, carry: a.carry, push: 0, tx: a.x, ty: a.y, why: '' };
    if (tok === '.' || tok === undefined) { out.c = 's'; a.bump = null; return out; }

    if (tok === 'X') {                                  // set the mother down
      var m = st.world.mother;
      if (a.carry) {
        m.held = -2; m.x = a.x; m.y = a.y; a.carry = false;
        out.c = 'd'; out.carry = false;
      } else { out.c = 'x'; }
      a.bump = null;
      return out;
    }

    var d = DIRS[tok];
    if (!d) { out.c = 's'; return out; }
    a.face = tok;
    var nx = a.x + d[0], ny = a.y + d[1];
    out.tx = nx; out.ty = ny;

    var lf = loafAt(st, nx, ny);
    if (lf) {                                            // D6 — Sokoban, one tile
      var fx = nx + d[0], fy = ny + d[1];
      if (passable(st, fx, fy) && !occupied(st, fx, fy)) {
        lf.x = fx; lf.y = fy;
        a.x = nx; a.y = ny;
        out.c = 'm'; out.push = 1; out.x = nx; out.y = ny;
      } else {
        out.c = 'b'; out.why = 'a loaf that would not go on (' + refusal(st, fx, fy) + ')';
        a.bump = tok; return out;
      }
    } else if (!passable(st, nx, ny) || (actorAt(st, nx, ny) && !isThreshold(st, nx, ny))) {
      out.c = 'b'; out.why = refusal(st, nx, ny);
      a.bump = tok; return out;
    } else {
      a.x = nx; a.y = ny; out.c = 'm'; out.x = nx; out.y = ny;
    }

    a.bump = null;
    var mo = st.world.mother;                            // D7 — taken up unasked
    if (mo.held === -2 && mo.x === a.x && mo.y === a.y && !a.carry) {
      a.carry = true; mo.held = a.rec;
    }
    if (a.carry) { mo.x = a.x; mo.y = a.y; mo.held = a.rec; }
    out.carry = a.carry;
    return out;
  }

  function sameOutcome(p, q) {
    return p.c === q.c && p.x === q.x && p.y === q.y && p.carry === q.carry && p.push === q.push;
  }

  /* ------------------------------------------------------------- one paddle */
  function paddle(st, tok) {
    var order = st.actors, k = st.paddle;
    for (var i = 0; i < order.length; i++) {
      var a = order[i];
      if (a.salt) {
        var rec = st.recs[a.rec];
        var t = rec.acts[k];                              // D5 — outlived salt stands
        var got = act(st, a, t === undefined ? '.' : t);
        var want = rec.wit[k];
        if (want && !sameOutcome(got, want)) { st.halt = slake(st, a, k, want, got, t); return; }
      } else {
        var o = act(st, a, tok);
        st.cur.acts.push(tok);
        st.cur.wit.push(o);
      }
    }
    readBoards(st);
    st.paddle++;
    var mo = st.world.mother;
    var cr = parseLevel(st.L).crib;
    if (mo.held === -2 && mo.x === cr.x && mo.y === cr.y) st.won = true;
  }

  /* ------------------------------------------------- the catastrophe, in voice */
  function slake(st, a, k, want, got, tok) {
    var sh = ROMAN[a.rec], pd = k + 1, dir = DIRWORD[tok] || null;
    var head, said, now;
    if (want.c === 'm' && got.c === 'b') {
      head = 'The salt of shift ' + sh + ' walked into a shut world.';
      said = 'in its own shift it went ' + dir + ' to ' + want.x + ',' + want.y + ' and the way was clear';
      now = 'this draw the way is ' + got.why;
    } else if (want.c === 'b' && got.c === 'm') {
      head = 'The salt of shift ' + sh + ' fell through a wall that is no longer there.';
      said = 'in its own shift it shoved ' + dir + ' and was stopped at ' + want.x + ',' + want.y;
      now = 'this draw nothing stopped it, and it went on to ' + got.x + ',' + got.y;
    } else if (want.push !== got.push) {
      head = 'The salt of shift ' + sh + ' put its shoulder to a loaf that is not there.';
      said = 'in its own shift it shifted a loaf ' + dir + ' out of ' + want.tx + ',' + want.ty;
      now = 'this draw it shifted ' + (got.push ? 'a loaf that should have stayed put' : 'empty air');
    } else if (want.carry !== got.carry) {
      head = want.carry
        ? 'The salt of shift ' + sh + ' reached for the mother and closed on nothing.'
        : 'The salt of shift ' + sh + ' came up holding what it never held.';
      said = 'in its own shift it was ' + (want.carry ? 'carrying' : 'empty-handed') + ' after this paddle';
      now = 'this draw it is ' + (got.carry ? 'carrying' : 'empty-handed');
    } else if (want.c === 'd' && got.c !== 'd') {
      head = 'The salt of shift ' + sh + ' set down a mother it was never given.';
      said = 'in its own shift it laid the crystal at ' + want.x + ',' + want.y;
      now = 'this draw its hands were empty';
    } else {
      head = 'The salt of shift ' + sh + ' does not agree with the day-book.';
      said = 'it ended this paddle at ' + want.x + ',' + want.y;
      now = 'this draw it ended at ' + got.x + ',' + got.y;
    }
    return {
      head: head, shift: a.rec, roman: sh, paddle: pd,
      said: said, now: now,
      tile: { x: want.tx, y: want.ty },

    ctx.restore();
    ctx.strokeStyle = 'rgba(10,7,5,.8)'; ctx.lineWidth = 2;     // the frame
    ctx.beginPath(); ctx.moveTo(X + .8, Y); ctx.lineTo(X + .8, Y + TS); ctx.moveTo(X + TS - .8, Y); ctx.lineTo(X + TS - .8, Y + TS); ctx.stroke();
  }

  function drawThreshold(L, x, y, lv) {
    var X = px(x), Y = py(y);
    ctx.fillStyle = tint('#241c16', .6 + lv * .6); ctx.fillRect(X, Y, TS, TS);
    ctx.fillStyle = tint('#6b5a45', .55 + lv * .8);             // worn stone sill
    rr(X + 2, Y + TS - 13, TS - 4, 11, 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    rr(X + 5, Y + 1, TS - 10, TS - 15, 4); ctx.fill();
    ctx.fillStyle = 'rgba(217,162,78,' + (.05 + .04 * flick) + ')';
    rr(X + 6, Y + 2, TS - 12, TS - 17, 4); ctx.fill();
  }

  function drawCrib(L, x, y, lv, seeded) {
    var X = px(x), Y = py(y);
    drawFloorTile(L, x, y, lv);
    ctx.fillStyle = tint('#5a4a34', .55 + lv * .8);                        // oak surround
    rr(X + 1.5, Y + 2.5, TS - 3, TS - 5, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,228,180,' + (.12 * lv) + ')';
    ctx.fillRect(X + 3, Y + 3.5, TS - 6, 1.6);
    ctx.fillStyle = '#080604'; rr(X + 6, Y + 7, TS - 12, TS - 14, 3); ctx.fill();
    ctx.strokeStyle = tint('#8b8377', .55 + lv * .95); ctx.lineWidth = 3;  // lead lining
    rr(X + 5.5, Y + 6.5, TS - 11, TS - 13, 3); ctx.stroke();
    ctx.strokeStyle = 'rgba(243,236,219,' + (.10 + .12 * lv) + ')'; ctx.lineWidth = 1;
    rr(X + 8, Y + 9, TS - 16, TS - 18, 2); ctx.stroke();
    for (var i = 0; i < 5; i++) {                                          // liquor, waiting
      ctx.fillStyle = 'rgba(159,174,139,' + (.07 + .07 * Math.sin(T * .9 + i)) + ')';
      ctx.fillRect(X + 8, Y + 12 + i * 4, TS - 16, 2);
    }
    var wait = .5 + .5 * Math.sin(T * 1.1);                                // it wants a seed
    var wg = ctx.createRadialGradient(X + TS / 2, Y + TS / 2, 2, X + TS / 2, Y + TS / 2, TS * .62);
    wg.addColorStop(0, 'rgba(196,204,178,' + (.05 + .07 * wait) + ')');
    wg.addColorStop(1, 'rgba(196,204,178,0)');
    ctx.fillStyle = wg; ctx.beginPath(); ctx.arc(X + TS / 2, Y + TS / 2, TS * .62, 0, 7); ctx.fill();
    if (seeded) {
      var pu = .6 + .4 * Math.sin(T * 2.2);
      var g = ctx.createRadialGradient(X + TS / 2, Y + TS / 2, 1, X + TS / 2, Y + TS / 2, TS * .8);
      g.addColorStop(0, 'rgba(243,236,219,' + (.5 * pu) + ')');
      g.addColorStop(1, 'rgba(243,236,219,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X + TS / 2, Y + TS / 2, TS * .8, 0, 7); ctx.fill();
    }
  }

  function drawLoaf(sx, sy, lv) {
    var cx = sx + TS / 2, by = sy + TS - 7;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.ellipse(cx, by + 2, TS * .33, 5, 0, 0, 7); ctx.fill();
    ctx.beginPath();                                            // moulded cone, cut flat
    ctx.moveTo(cx - TS * .30, by);
    ctx.lineTo(cx - TS * .17, sy + 7);
    ctx.lineTo(cx + TS * .17, sy + 7);
    ctx.lineTo(cx + TS * .30, by); ctx.closePath();
    var g = ctx.createLinearGradient(cx - TS * .3, sy, cx + TS * .3, by);
    g.addColorStop(0, tint('#cfc0a2', .55 + lv * .75));
    g.addColorStop(.42, tint(PAL.bloom, .6 + lv * .85));
    g.addColorStop(1, tint('#9a8a70', .5 + lv * .6));
    ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = tint(PAL.bloom, .65 + lv * .9);
    ctx.beginPath(); ctx.ellipse(cx, sy + 7, TS * .17, 3.4, 0, 0, 7); ctx.fill();
    for (var i = 0; i < 16; i++) {                              // granulation
      var h1 = hash(i, 3, 11), h2 = hash(i, 9, 5);
      ctx.fillStyle = 'rgba(255,250,238,' + (.05 + h2 * .16) + ')';
      ctx.fillRect(cx - TS * .26 + h1 * TS * .52, sy + 9 + h2 * (TS - 18), 1.3, 1.3);
    }
    ctx.strokeStyle = 'rgba(30,22,16,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - TS * .30, by); ctx.lineTo(cx + TS * .30, by); ctx.stroke();
  }

  function drawMother(cx, cy, lv, sc) {
    sc = sc || 1;
    var pu = .72 + .28 * Math.sin(T * 2.6);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 17 * sc);
    g.addColorStop(0, 'rgba(255,244,214,' + (.42 * pu) + ')');
    g.addColorStop(1, 'rgba(255,244,214,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 17 * sc, 0, 7); ctx.fill();
    var sp = [[0, -9], [6, 2], [-6, 3], [2, 8], [-3, -3]];
    for (var i = 0; i < sp.length; i++) {
      var a = T * .25 + i * 1.9, dx = sp[i][0] * sc, dy = sp[i][1] * sc;
      ctx.save(); ctx.translate(cx + dx * .55, cy + dy * .55); ctx.rotate(a * .12 + i);
      ctx.beginPath();
      ctx.moveTo(0, -5.5 * sc); ctx.lineTo(2.6 * sc, 0); ctx.lineTo(0, 5.5 * sc); ctx.lineTo(-2.6 * sc, 0); ctx.closePath();
      ctx.fillStyle = i % 2 ? tint(PAL.bloom, 1.1) : tint('#e2d4b4', .8 + lv * .6);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,96,60,.5)'; ctx.lineWidth = .7; ctx.stroke();
      ctx.restore();
    }
  }

  window.HOUSE = {
    PAL: PAL, TS: TS, OX: OX, OY: OY, SERIF: SERIF, cv: cv, ctx: ctx, fit: fit,
    hash: hash, lerp: lerp, ease: ease, tint: tint, rr: rr, px: px, py: py,
    lightAt: lightAt, ambient: ambient, drawSteam: drawSteam, drawMotes: drawMotes,
    drawFloorTile: drawFloorTile, drawWall: drawWall, drawGrate: drawGrate,
    drawBrine: drawBrine, drawBoard: drawBoard, drawHatch: drawHatch,
    drawThreshold: drawThreshold, drawCrib: drawCrib, drawLoaf: drawLoaf,
    drawMother: drawMother, LAMP: LAMP,
    now: function () { return T; }, flick: function () { return flick; }
  };
})();
</script>
<script id="figures">
/* --------------------------------------------------------------------------
   THE HANDS — the living waller, and the salt of her earlier shifts. Same
   silhouette both times, because that is the whole horror of the trade.
   -------------------------------------------------------------------------- */
(function () {
  "use strict";
  var H = window.HOUSE, ctx = H.ctx, TS = H.TS, PAL = H.PAL;

  function limb(x1, y1, x2, y2, w1, w2, fill) {
    var a = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(a), ny = Math.cos(a);
    ctx.beginPath();
    ctx.moveTo(x1 + nx * w1, y1 + ny * w1);
    ctx.lineTo(x2 + nx * w2, y2 + ny * w2);
    ctx.lineTo(x2 - nx * w2, y2 - ny * w2);
    ctx.lineTo(x1 - nx * w1, y1 - ny * w1);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }

  // cx: tile centre x, fy: floor line y
  function drawFigure(cx, fy, o) {
    var lv = o.lv === undefined ? 1 : o.lv;
    var salt = !!o.salt, ph = o.phase || 0, mv = o.moving ? 1 : 0;
    var swing = Math.sin(ph * Math.PI * 2) * (mv ? 1 : .12);
    var bob = (mv ? Math.abs(Math.cos(ph * Math.PI * 2)) * 2.6 : Math.sin(H.now() * 1.6 + (o.seed || 0)) * .9);
    var lean = (o.face === 'E' ? 1.6 : o.face === 'W' ? -1.6 : 0);
    var s = TS / 42;

    var body, bodyHi, cloth, skin, edge;
    if (salt) {
      body = H.tint('#d9cbad', .62 + lv * .5); bodyHi = H.tint(PAL.bloom, .8 + lv * .5);
      cloth = H.tint('#c3b593', .6 + lv * .45); skin = H.tint('#efe6cd', .75 + lv * .4);
      edge = 'rgba(255,251,240,.32)';
    } else {
      body = H.tint('#241b12', .55 + lv * .55); bodyHi = H.tint('#4a3a27', .55 + lv * .7);
      cloth = H.tint('#7d5f33', .5 + lv * .75); skin = H.tint('#b08b60', .5 + lv * .7);
      edge = 'rgba(255,224,170,' + (.16 * lv).toFixed(3) + ')';
    }

    ctx.save();
    if (salt) ctx.globalAlpha = o.dim ? .45 : .88;
    else if (o.dim) ctx.globalAlpha = .5;

    // shadow, thrown away from the fire
    ctx.fillStyle = 'rgba(0,0,0,' + (salt ? .28 : .42) + ')';
    ctx.beginPath(); ctx.ellipse(cx + 2, fy - 2, 11 * s, 4.2 * s, 0, 0, 7); ctx.fill();

    if (salt) {                                    // the bloom it carries with it
      var g = ctx.createRadialGradient(cx, fy - 20 * s, 2, cx, fy - 20 * s, 26 * s);
      g.addColorStop(0, 'rgba(243,236,219,.16)'); g.addColorStop(1, 'rgba(243,236,219,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, fy - 20 * s, 26 * s, 0, 7); ctx.fill();
    }

    var hipY = fy - 17 * s - bob, shY = fy - 30 * s - bob;
    // legs
    limb(cx - 1.5 * s, hipY, cx - 1.5 * s + swing * 5 * s, fy - 1, 4.2 * s, 2.6 * s, H.tint(salt ? '#bfb193' : '#241c14', .55 + lv * .8));
    limb(cx + 1.5 * s, hipY, cx + 1.5 * s - swing * 5 * s, fy - 1, 4.2 * s, 2.6 * s, body);
    // torso: hunched, leaning into the work
    ctx.beginPath();
    ctx.moveTo(cx - 7 * s + lean * .3, hipY + 2 * s);
    ctx.quadraticCurveTo(cx - 9 * s + lean, shY + 4 * s, cx - 6.4 * s + lean, shY);
    ctx.quadraticCurveTo(cx + lean, shY - 3.4 * s, cx + 6.4 * s + lean, shY);
    ctx.quadraticCurveTo(cx + 9 * s + lean, shY + 4 * s, cx + 7 * s + lean * .3, hipY + 2 * s);
    ctx.closePath();
    ctx.fillStyle = body; ctx.fill();
    // apron / sacking, tied at the waist
    ctx.beginPath();
    ctx.moveTo(cx - 6 * s + lean * .6, shY + 5 * s);
    ctx.lineTo(cx + 6 * s + lean * .6, shY + 5 * s);
    ctx.lineTo(cx + 5 * s + lean * .2, hipY + 5 * s);
    ctx.lineTo(cx - 5 * s + lean * .2, hipY + 5 * s);
    ctx.closePath(); ctx.fillStyle = cloth; ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.fillRect(cx - 6 * s + lean * .5, shY + 10.5 * s, 12 * s, 1.6 * s);
    // lit flank
    ctx.fillStyle = bodyHi;
    ctx.beginPath();
    ctx.moveTo(cx + 3 * s + lean, shY - .5 * s);
    ctx.quadraticCurveTo(cx + 8.4 * s + lean, shY + 4 * s, cx + 6.6 * s + lean * .3, hipY + 2 * s);
    ctx.lineTo(cx + 3.6 * s, hipY + 2 * s); ctx.closePath(); ctx.fill();
    // arms
    var ax = cx + 5.6 * s + lean, aw = 3.1 * s;
    limb(cx - 5.6 * s + lean, shY + 2 * s, cx - 6.6 * s + lean - swing * 4 * s, hipY + 6 * s, aw, 2.1 * s, body);
    if (o.carrying) {
      limb(ax, shY + 2 * s, cx + 2.4 * s + lean, shY + 9 * s, aw, 2.1 * s, bodyHi);
      H.drawMother(cx + 1.5 * s + lean, shY + 10 * s, lv, .72);
    } else {
      limb(ax, shY + 2 * s, cx + 6.6 * s + lean + swing * 4 * s, hipY + 6 * s, aw, 2.1 * s, bodyHi);
    }
    // head, sunk between the shoulders, with a cap
    var hx = cx + lean * 1.5, hy = shY - 6.2 * s;
    ctx.beginPath(); ctx.ellipse(hx, hy, 5.1 * s, 5.6 * s, lean * .04, 0, 7);
    ctx.fillStyle = skin; ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx, hy - 2.2 * s, 5.6 * s, 4.2 * s, lean * .04, Math.PI, 0);
    ctx.fillStyle = H.tint(salt ? '#cabb9b' : '#241c14', .55 + lv * .8); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(hx - 5.4 * s, hy - 2.4 * s, 11 * s, 1.3 * s);
    // rim light along the flank nearest the fire
    ctx.strokeStyle = edge; ctx.lineWidth = 1.3 * s;
    ctx.beginPath();
    ctx.moveTo(hx + 4.4 * s, hy - 1 * s);
    ctx.quadraticCurveTo(cx + 8.6 * s + lean, shY + 3 * s, cx + 7 * s + lean * .3, hipY + 3 * s);
    ctx.stroke();

    if (salt) {                                    // granulation and the shift mark
      ctx.save();
      ctx.beginPath(); ctx.rect(cx - 11 * s, shY - 13 * s, 22 * s, 32 * s); ctx.clip();
      for (var i = 0; i < 26; i++) {
        var h1 = H.hash(i, o.seed || 0, 13), h2 = H.hash(i * 3, (o.seed || 0) + 5, 2);
        ctx.fillStyle = 'rgba(255,252,242,' + (.06 + h2 * .22) + ')';
        ctx.fillRect(cx - 9 * s + h1 * 18 * s, shY - 11 * s + h2 * 28 * s, 1.2, 1.2);
      }
      ctx.restore();
      if (o.mark) {
        ctx.font = 'italic ' + (10 * s).toFixed(1) + 'px ' + H.SERIF;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(72,52,30,.45)';
        ctx.fillText(o.mark, cx + lean * .6, shY + 7.4 * s);
      }
    }
    ctx.restore();
  }

  window.HOUSE.drawFigure = drawFigure;
})();
</script>

<script id="furniture">
/* --------------------------------------------------------------------------
   THE FURNITURE OF THE ROOM — the day-book on its nail, the wheel through the
   wall, the sluice board, the lamp. These are the instruments; there is no
   heads-up display in a wich house.
   -------------------------------------------------------------------------- */
(function () {
  "use strict";
  var H = window.HOUSE, ctx = H.ctx, PAL = H.PAL, S = H.SERIF, G = NETHERWICH;

  function parchment(x, y, w, h, seed) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 6;
    ctx.beginPath();
    var n = 26;
    for (var i = 0; i <= n; i++) {                        // torn, hand-cut edges
      var t = i / n, wob = (H.hash(i, seed || 0, 3) - .5) * 3.2;
      var px2, py2;
      if (t < .25) { px2 = x + (t / .25) * w; py2 = y + wob; }
      else if (t < .5) { px2 = x + w + wob; py2 = y + ((t - .25) / .25) * h; }
      else if (t < .75) { px2 = x + w - ((t - .5) / .25) * w; py2 = y + h + wob; }
      else { px2 = x + wob; py2 = y + h - ((t - .75) / .25) * h; }
      i ? ctx.lineTo(px2, py2) : ctx.moveTo(px2, py2);
    }
    ctx.closePath();
    ctx.fillStyle = '#e0cea7'; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.clip();
    for (var k = 0; k < 90; k++) {                        // foxing and brine stain
      var hx = H.hash(k, seed || 0, 17), hy = H.hash(k * 5, seed || 0, 23), hs = H.hash(k * 7, 1, 9);
      ctx.fillStyle = 'rgba(' + (140 + hs * 40 | 0) + ',' + (110 + hs * 30 | 0) + ',72,' + (.03 + hs * .07) + ')';
      ctx.beginPath(); ctx.arc(x + hx * w, y + hy * h, 2 + hs * 13, 0, 7); ctx.fill();
    }
    var vg = ctx.createLinearGradient(x, y, x, y + h);
    vg.addColorStop(0, 'rgba(90,66,38,.16)'); vg.addColorStop(.3, 'rgba(90,66,38,0)');
    vg.addColorStop(1, 'rgba(60,40,22,.22)');
    ctx.fillStyle = vg; ctx.fillRect(x, y, w, h);
    ctx.restore();
  }

  function nail(x, y) {
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.arc(x + 1, y + 1.5, 3.6, 0, 7); ctx.fill();
    ctx.fillStyle = H.tint(PAL.rust, .9); ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,224,170,.35)'; ctx.beginPath(); ctx.arc(x - .9, y - 1, 1.2, 0, 7); ctx.fill();
  }

  function mark(x, y, tok, col, sc) {
    sc = sc || 1;
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.lineWidth = 1.25 * sc; ctx.lineCap = 'round';
    ctx.beginPath();
    if (tok === 'N') { ctx.moveTo(x, y + 3 * sc); ctx.lineTo(x, y - 3.4 * sc); ctx.moveTo(x - 1.9 * sc, y - 1 * sc); ctx.lineTo(x, y - 3.4 * sc); ctx.lineTo(x + 1.9 * sc, y - 1 * sc); }
    else if (tok === 'S') { ctx.moveTo(x, y - 3 * sc); ctx.lineTo(x, y + 3.4 * sc); ctx.moveTo(x - 1.9 * sc, y + 1 * sc); ctx.lineTo(x, y + 3.4 * sc); ctx.lineTo(x + 1.9 * sc, y + 1 * sc); }
    else if (tok === 'E') { ctx.moveTo(x - 3 * sc, y); ctx.lineTo(x + 3.4 * sc, y); ctx.moveTo(x + 1 * sc, y - 1.9 * sc); ctx.lineTo(x + 3.4 * sc, y); ctx.lineTo(x + 1 * sc, y + 1.9 * sc); }
    else if (tok === 'W') { ctx.moveTo(x + 3 * sc, y); ctx.lineTo(x - 3.4 * sc, y); ctx.moveTo(x - 1 * sc, y - 1.9 * sc); ctx.lineTo(x - 3.4 * sc, y); ctx.lineTo(x - 1 * sc, y + 1.9 * sc); }
    else if (tok === 'X') { ctx.moveTo(x - 2.6 * sc, y - 2.6 * sc); ctx.lineTo(x + 2.6 * sc, y + 2.6 * sc); ctx.moveTo(x + 2.6 * sc, y - 2.6 * sc); ctx.lineTo(x - 2.6 * sc, y + 2.6 * sc); }
    else { ctx.moveTo(x - .3, y + 2.4 * sc); ctx.lineTo(x + .3, y + 2.4 * sc); }   // stood fast
    ctx.stroke();
  }

  /* -------------------------------------------------------- the day-book */
  function dayBook(st, L, hurt, hurtP) {
    if (hurt === undefined || hurt === null) hurt = -1;
    if (hurtP === undefined) hurtP = -1;
    var x = 20, y = 34, w = 234, h = 664;
    parchment(x, y, w, h, L.id);
    nail(x + 16, y + 12); nail(x + w - 16, y + 13);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = PAL.ink;
    ctx.font = '600 15px ' + S; ctx.fillText('The Netherwich Day-Book', x + 20, y + 40);
    ctx.strokeStyle = 'rgba(59,36,23,.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 20, y + 47); ctx.lineTo(x + w - 20, y + 45); ctx.stroke();
    ctx.font = 'italic 12.5px ' + S; ctx.fillStyle = 'rgba(59,36,23,.72)';
    ctx.fillText(L.leaf, x + 20, y + 64);
    ctx.font = '600 16.5px ' + S; ctx.fillStyle = PAL.inkRed;
    ctx.fillText(L.name, x + 20, y + 86);

    ctx.font = 'italic 11.5px ' + S; ctx.fillStyle = 'rgba(59,36,23,.6)';
    ctx.fillText('shifts walked, and what each did', x + 20, y + 108);

    var rowY = y + 132, rowH = 104;
    for (var i = 0; i < G.MAX_SALT + 1; i++) {
      var ry = rowY + i * rowH;
      var rec = st.recs[i], live = (i === st.recs.length && !st.spoiled);
      ctx.strokeStyle = 'rgba(59,36,23,.22)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + 18, ry + 84); ctx.lineTo(x + w - 18, ry + 82); ctx.stroke();

      ctx.font = '600 20px ' + S;
      ctx.fillStyle = rec ? (hurt === i ? PAL.inkRed : 'rgba(59,36,23,.9)') : live ? PAL.ink : 'rgba(59,36,23,.22)';
      ctx.fillText(G.ROMAN[i], x + 20, ry + 20);

      ctx.font = 'italic 11px ' + S;
      ctx.fillStyle = 'rgba(59,36,23,' + (rec || live ? .62 : .22) + ')';
      ctx.fillText(rec ? (rec.acts.length + ' paddles walked')
        : live ? 'walking now' : 'not yet walked', x + 54, ry + 18);

      var acts = rec ? rec.acts : (live ? st.cur.acts : null);
      if (acts) {
        var head = live ? acts.length : st.paddle;
        for (var k = 0; k < acts.length; k++) {
          var col = k % 11, row = (k / 11) | 0;
          var mx = x + 26 + col * 17.6, my = ry + 38 + row * 15;
          var done = live ? true : k < st.paddle;
          var bad = (hurt === i && k === hurtP);
          var c = bad ? PAL.inkRed : 'rgba(59,36,23,' + (done ? .78 : .24) + ')';
          mark(mx, my, acts[k], c, bad ? 1.5 : 1);
        }
        if (!live && st.paddle <= acts.length) {          // where the salt has got to
          var c2 = Math.min(acts.length, st.paddle) % 11, r2 = (Math.min(acts.length, st.paddle) / 11) | 0;
          var cx2 = x + 26 + c2 * 17.6 - 8, cy2 = ry + 38 + r2 * 15;
          ctx.strokeStyle = PAL.inkRed; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.moveTo(cx2, cy2 - 6); ctx.lineTo(cx2, cy2 + 6); ctx.stroke();
        }
        if (live) {
          var c3 = acts.length % 11, r3 = (acts.length / 11) | 0;
          var bx = x + 26 + c3 * 17.6, by2 = ry + 38 + r3 * 15;
          ctx.fillStyle = 'rgba(142,58,32,' + (.35 + .45 * Math.abs(Math.sin(H.now() * 2.4))) + ')';
          ctx.fillRect(bx - 6.5, by2 - 6, 1.6, 12);
        }
        if (rec && st.paddle > acts.length) {
          ctx.font = 'italic 10.5px ' + S; ctx.fillStyle = PAL.inkRed;
          ctx.fillText('standing', x + 168, ry + 18);
        }
      }
    }
  }

  /* ------------------------------------------------------------ the wheel */
  function wheel(st, quiet) {
    var cx = 1015, cy = 244, R = 84;
    var frac = st.paddle / G.PADDLES;
    var ang = frac * Math.PI * 2 * 2.2;

    ctx.save();
    ctx.fillStyle = 'rgba(8,6,4,.55)';                     // the hole in the wall
    ctx.beginPath(); ctx.arc(cx, cy, R + 26, 0, 7); ctx.fill();

  /* ------------------------------------------------------- the sluice board */

  /* ------------------------------------------------------------- the lamp */
  function lamp() {
    var cx = 1015, cy = 96, f = H.flick();

    ctx.fillStyle = H.tint('#4a3c2c', .9);

})();

<script id="works">
/* --------------------------------------------------------------------------
   THE WORKS — the day's running: what you press, what the clerk says about it,
   and the ending, which the clerk also writes.
   -------------------------------------------------------------------------- */
(function () {
  "use strict";
  var H = window.HOUSE, F = window.FURNITURE, G = NETHERWICH;

      o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), ac.currentTime + dur);
      g.gain.setValueAtTime(0, ac.currentTime);
      g.gain.linearRampToValueAtTime(vol, ac.currentTime + .006);

      o.connect(f); f.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur + .02);

      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      var n = ac.createBufferSource(); n.buffer = b;
      var f = ac.createBiquadFilter(); f.type = band ? 'bandpass' : 'lowpass'; f.frequency.value = cut; f.Q.value = band || 1;

    }

      wake: on,
      mute: function () { muted = !muted; if (bed) bed.gain.value = muted ? 0 : .05; return muted; },
      isMuted: function () { return muted; },

      bump: function () { noise(.09, .10, 420); },

      take: function () { env('sine', 1180, 1620, .16, .07); env('sine', 1760, 2340, .12, .035); },

  /* ------------------------------------------------------------------ state */

  function L() { return G.LEVELS[li]; }
  function rebuild() {

    st = G.run(L(), log);
    var after = st.actors.map(function (a) { return { x: a.x, y: a.y, c: a.carry }; });
    anim = { from: (before && before.length === after.length) ? before : after, to: after, t: 0 };
  }
  function startLevel(i) { li = i; log = []; st = null; rebuild(); anim.t = 1; mode = 'brief'; }

  function press(tok) {
    if (st.halt || st.won || st.spoiled) return;
    var openBefore = st.world.open.slice(), loafBefore = st.world.loaves.map(function (l) { return l.x + ',' + l.y; }).join();
    var carryBefore = st.actors[st.actors.length - 1].carry, shiftBefore = st.recs.length;

    var me = st.actors[st.actors.length - 1];
    if (st.halt) { AU.slake(); return; }
    if (st.spoiled) { AU.spoil(); return; }
    if (st.won) { AU.bell(); mode = 'won'; return; }
    if (st.recs.length !== shiftBefore) { AU.grind(); AU.clack(); return; }
    if (st.world.loaves.map(function (l) { return l.x + ',' + l.y; }).join() !== loafBefore) AU.scrape();
    else if (me.carry && !carryBefore) AU.take();
    else if (!me.carry && carryBefore) AU.drop();
    else if (tok !== '.' && anim.from[anim.from.length - 1] &&
      anim.from[anim.from.length - 1].x === me.x && anim.from[anim.from.length - 1].y === me.y) AU.bump();
    else AU.clack();
    if (st.world.open.join() !== openBefore.join()) AU.grind();
  }
  function settled() { return st.halt ? 'slake' : st.spoiled ? 'spoiled' : st.won ? 'won' : 'play'; }
  function unpickPaddle() { if (log.length) { log.pop(); rebuild(); anim.t = 1; AU.drop(); } }
  function unpickShift() {
    var target = st.shift;
    while (log.length) {

  /* ------------------------------------------------------------- the pan floor */
  function drawPan(dim) {
    var lv = L(), p = G.parseLevel(lv);
    ctx.save();
    ctx.fillStyle = '#0b0806';
    ctx.fillRect(H.OX - 16, H.OY - 20, L_WPX() + 32, L_HPX() + 34);
    for (var y = 0; y < G.H; y++) for (var x = 0; x < G.W; x++) {
      var l = H.lightAt(lv, x, y) * (0.86 + 0.14 * H.flick());
      if (dim) l *= .45;
      var c = lv.map[y][x];
      if (p.grate[x + ',' + y]) { H.drawGrate(lv, x, y, l); continue; }
      if (c === '#') { H.drawWall(lv, x, y, l); continue; }
      if (c === '~') { H.drawBrine(lv, x, y, l); continue; }
      if (c === '@') { H.drawThreshold(lv, x, y, l); continue; }
      if (c === '*') { H.drawCrib(lv, x, y, l, st.world.mother.held === -2 && st.world.mother.x === x && st.world.mother.y === y); continue; }

      var l = H.lightAt(lv, b.x, b.y) * (dim ? .45 : 1), down = false;

  }
  function L_WPX() { return G.W * TS; }
  function L_HPX() { return G.H * TS; }

  function drawBodies(dim) {
    var lv = L(), t = H.ease(Math.min(1, anim.t));
    var order = [];
    st.actors.forEach(function (a, i) {
      var f = anim.from[i] || { x: a.x, y: a.y }, tox = anim.to[i] || { x: a.x, y: a.y };
      var gx = H.lerp(f.x, tox.x, t), gy = H.lerp(f.y, tox.y, t);
      order.push({ a: a, i: i, gx: gx, gy: gy, moving: (f.x !== tox.x || f.y !== tox.y) });
    });

      order.push({ loaf: o, gx: o.x, gy: o.y });
    });

    if (mo.held === -2) H.drawMother(H.px(mo.x) + TS / 2, H.py(mo.y) + TS / 2, H.lightAt(lv, mo.x, mo.y) * (dim ? .5 : 1), 1);
    order.sort(function (u, v) { return (u.gy - v.gy) || ((u.loaf ? 0 : 1) - (v.loaf ? 0 : 1)); });
    order.forEach(function (e) {
      var l = H.lightAt(lv, Math.round(e.gx), Math.round(e.gy)) * (dim ? .5 : 1);

        salt: a.salt, lv: l, phase: e.moving ? t : (H.now() * .5 + a.rec),
        moving: e.moving && anim.t < 1, face: a.face, carrying: a.carry,
        seed: a.rec + 2, mark: a.salt ? G.ROMAN[a.rec] : null, dim: dim && !hurt

  }

    if (st.won) return 'The mother is in the crib. The bloom is taking.';
    if (me.carry) return 'You have the mother in your arm. Mind the boards and mind yourself.';
    if (st.recs.length === 0 && st.paddle === 0) return 'Shift I. Nothing has happened yet, which is the only clean part of the day.';
    if (st.paddle > G.PADDLES - 8) return 'The wheel is running out. Call it, or it calls itself.';
    if (st.recs.length >= G.MAX_SALT) return 'Four shifts of salt already standing. There is no fifth.';

  function keysScrap() {

      ['x', 'set the mother down'],
      ['return', 'call the wheel over'],

    for (var ty = 0; ty < 5; ty++) {
      for (var tx = 0; tx < 27; tx++) {

        var d = Math.hypot(X - 150, Y - 760) / 520;

        ctx.fillStyle = H.tint('#3a2a1e', (.5 + hh * .5) * (.35 + l));
        ctx.fillRect(X + 1.8, Y + 1.8, 42 + (hh - .5) * 3, 42 + (hh - .5) * 3);

      }
    }
    ctx.fillStyle = 'rgba(8,5,4,.94)'; ctx.fillRect(0, 528, 1200, 30);       // the pan lip
    ctx.fillStyle = H.tint('#5a4a34', .55); ctx.fillRect(0, 528, 1200, 10);
    ctx.fillStyle = 'rgba(255,236,198,.10)'; ctx.fillRect(0, 528, 1200, 2.5);
    // the fire-mouth, under the pan, where all this light comes from
    var gx = 46, gy = 646, gw = 168, gh = 84;
    ctx.fillStyle = '#080503'; ctx.fillRect(gx - 8, gy - 8, gw + 16, gh + 16);
    var gg = ctx.createLinearGradient(gx, gy + gh, gx, gy);
    gg.addColorStop(0, 'rgba(255,206,124,' + (.95 * f) + ')');
    gg.addColorStop(.45, 'rgba(216,98,47,' + (.9 * f) + ')');
    gg.addColorStop(1, 'rgba(60,24,12,.95)');
    ctx.fillStyle = gg; ctx.fillRect(gx, gy, gw, gh);
    ctx.strokeStyle = '#120c08'; ctx.lineWidth = 7;
    for (var bi = 1; bi < 5; bi++) {
      ctx.beginPath(); ctx.moveTo(gx, gy + bi * gh / 5); ctx.lineTo(gx + gw, gy + bi * gh / 5); ctx.stroke();
    }
    ctx.strokeStyle = '#1a120c'; ctx.lineWidth = 6; ctx.strokeRect(gx - 3, gy - 3, gw + 6, gh + 6);
    var fm = ctx.createRadialGradient(gx + gw / 2, gy + 20, 6, gx + gw / 2, gy + 20, 400 * f);
    fm.addColorStop(0, 'rgba(255,196,110,' + (.55 * f) + ')');
    fm.addColorStop(.18, 'rgba(216,98,47,' + (.26 * f) + ')');
    fm.addColorStop(1, 'rgba(216,98,47,0)');
    ctx.fillStyle = fm; ctx.beginPath(); ctx.arc(gx + gw / 2, gy + 20, 400 * f, 0, 7); ctx.fill();

    // one waller, and the four shifts of her the pan is still holding
    var wk = (H.now() * .5) % 1;
    ctx.save(); ctx.translate(0, 40); ctx.scale(1.5, 1.5);
    for (var k2 = 3; k2 >= 0; k2--) {
      ctx.save(); ctx.globalAlpha = .26 + k2 * .05;
      H.drawFigure(452 + k2 * 92, 434 - k2 * 5, {
        salt: true, lv: .78 - k2 * .09, phase: (wk + k2 * .25) % 1,
        moving: true, face: 'W', seed: k2 + 2, mark: G.ROMAN[3 - k2]
      });
      ctx.restore();
    }
    H.drawFigure(360, 440, { salt: false, lv: 1.25, phase: H.now() * .4, moving: false, face: 'W', seed: 1 });
    ctx.restore();

    var st0 = { paddle: (H.now() * 6) % G.PADDLES, recs: [], world: { open: [] } };
    ctx.save(); ctx.globalAlpha = .85; ctx.translate(-40, 118); F.wheel(st0, true); ctx.restore();
    F.lamp();
    H.drawSteam(); H.drawMotes();

    ctx.textAlign = 'left';
    ctx.fillStyle = PAL.parch;
    ctx.font = '600 74px ' + S;
    ctx.fillText('The Standing Salt', 96, 214);
    ctx.strokeStyle = 'rgba(20,14,10,.5)'; ctx.lineWidth = 1;
    ctx.strokeText('The Standing Salt', 96, 214);
    ctx.font = 'italic 20px ' + S; ctx.fillStyle = 'rgba(217,162,78,.9)';
    ctx.fillText('a walling at the Netherwich brine house', 100, 250);

    var y = 320;
    y = wrap('The brine here is quick. It takes an impression of whatever walks the floor at bloom, and when the wheel comes round it stands that impression up and walks it again.',
      100, y, 560, 27, '17px ' + S, 'rgba(230,214,176,.82)');
    y = wrap('You are Aldis Wray, and there is no second waller. There is only the four of you the pan can remember.',
      100, y + 12, 560, 27, '17px ' + S, 'rgba(230,214,176,.82)');
    y = wrap('Do the work. Do not argue with what you already did.',
      100, y + 12, 560, 27, 'italic 17px ' + S, 'rgba(217,162,78,.92)');

    ctx.font = '15px ' + S;
    ctx.fillStyle = 'rgba(230,214,176,' + (.35 + .35 * Math.abs(Math.sin(H.now() * 1.7))) + ')';
    ctx.fillText('press any key to sign the book', 100, 508);
    vignette();
  }

  function briefScreen() {
    drawPan(true); H.drawSteam();
    F.dayBook(st, L()); F.lamp(); F.wheel(st); F.sluice(st, L()); keysScrap();
    ctx.fillStyle = 'rgba(9,6,4,.72)'; ctx.fillRect(H.OX - 16, H.OY - 20, L_WPX() + 32, L_HPX() + 34);
    var x = H.OX + 6, y = H.OY + 92, w = L_WPX() - 12;
    F.parchment(x, y, w, 330, L().id * 3);
    F.nail(x + 22, y + 16); F.nail(x + w - 22, y + 18);
    ctx.textAlign = 'left';
    ctx.font = '600 15px ' + S; ctx.fillStyle = 'rgba(59,36,23,.7)';
    ctx.fillText('THE CLERK OF THE FIRE, TO A. WRAY, WALLER'.toLowerCase(), x + 34, y + 44);
    ctx.font = '600 30px ' + S; ctx.fillStyle = PAL.inkRed;
    ctx.fillText(L().name, x + 34, y + 84);
    ctx.font = 'italic 13px ' + S; ctx.fillStyle = 'rgba(59,36,23,.66)';
    ctx.fillText(L().leaf, x + 34, y + 104);
    var yy = y + 138;
    L().brief.forEach(function (line) {
      yy = wrap(line, x + 34, yy, w - 68, 23, '15.5px ' + S, 'rgba(45,28,18,.9)') + 9;
    });
    ctx.font = 'italic 14px ' + S;
    ctx.fillStyle = 'rgba(142,58,32,' + (.5 + .4 * Math.abs(Math.sin(H.now() * 1.7))) + ')';
    ctx.fillText('press return to go in', x + 34, yy + 14);
    vignette();
  }

  function slakeScreen() {
    var s = st.halt;
    drawPan(true);
    var tx = H.px(s.tile.x), ty = H.py(s.tile.y);
    var pl = .5 + .5 * Math.sin(H.now() * 6);
    ctx.save();
    ctx.fillStyle = 'rgba(168,69,42,' + (.16 + .16 * pl) + ')'; ctx.fillRect(tx, ty, TS, TS);
    ctx.strokeStyle = 'rgba(216,98,47,' + (.6 + .4 * pl) + ')'; ctx.lineWidth = 2.6;
    ctx.strokeRect(tx + 1.5, ty + 1.5, TS - 3, TS - 3);
    ctx.restore();
    drawBodies(true); H.drawSteam();
    F.dayBook(st, L(), s.shift, s.paddle - 1); F.lamp(); F.wheel(st); F.sluice(st, L()); keysScrap();

    // the notice goes to whichever end of the pan the slaked salt is not in
    var x = H.OX + 14, y = (s.tile.y < 6.5 ? 396 : 84), w = L_WPX() - 28;
    ctx.fillStyle = 'rgba(9,6,4,.5)'; ctx.fillRect(H.OX - 16, H.OY - 20, L_WPX() + 32, L_HPX() + 34);
    F.parchment(x, y, w, 236, 71);
    F.nail(x + 20, y + 15); F.nail(x + w - 20, y + 16);
    ctx.textAlign = 'left';
    ctx.font = '600 13px ' + S; ctx.fillStyle = 'rgba(59,36,23,.6)';
    ctx.fillText('entered in the day-book, and docked against you', x + 30, y + 34);
    ctx.font = '600 25px ' + S; ctx.fillStyle = PAL.inkRed;
    var yy = wrap('A slake.', x + 30, y + 66, w - 60, 30, '600 25px ' + S, PAL.inkRed);
    yy = wrap(s.head, x + 30, yy - 2, w - 60, 26, '600 19px ' + S, 'rgba(45,28,18,.92)');
    yy = wrap('Shift ' + s.roman + ', paddle ' + s.paddle + ', at ' + s.tile.x + ',' + s.tile.y + ' — ' + s.said + '; ' + s.now + '.',
      x + 30, yy + 8, w - 60, 22, '15px ' + S, 'rgba(45,28,18,.85)');
    yy = wrap('It went to water where it stood, and the pan is fouled.', x + 30, yy + 6, w - 60, 22, 'italic 15px ' + S, 'rgba(59,36,23,.7)');
    options([['U', 'unpick this shift'], ['Z', 'unpick a paddle'], ['R', 'draw again']], x + 30, y + 212, 152);
    vignette();
  }

  function spoiledScreen() {
    drawPan(true); drawBodies(true); H.drawSteam();
    F.dayBook(st, L()); F.lamp(); F.wheel(st); F.sluice(st, L()); keysScrap();
    var x = H.OX + 30, y = 232, w = L_WPX() - 60;
    ctx.fillStyle = 'rgba(9,6,4,.6)'; ctx.fillRect(H.OX - 16, H.OY - 20, L_WPX() + 32, L_HPX() + 34);
    F.parchment(x, y, w, 216, 44);
    F.nail(x + 20, y + 15); F.nail(x + w - 20, y + 16);
    ctx.textAlign = 'left';
    var yy = wrap('The fire is out.', x + 28, y + 58, w - 56, 30, '600 25px ' + S, PAL.inkRed);
    yy = wrap('Five shifts and no mother in the crib. The pan bears four shifts of salt and not one more; the fifth has slumped into the clods, and the brine has gone flat and grey.',
      x + 28, yy + 4, w - 56, 23, '15.5px ' + S, 'rgba(45,28,18,.88)');
    yy = wrap('Coals cost money.', x + 28, yy + 8, w - 56, 23, 'italic 15.5px ' + S, 'rgba(59,36,23,.75)');
    options([['U', 'unpick last shift'], ['Z', 'unpick a paddle'], ['R', 'draw again']], x + 28, yy + 16, 152);
    vignette();
  }

  function wonScreen() {
    drawPan(false); drawBodies(false); H.drawSteam(); H.drawMotes();
    F.dayBook(st, L()); F.lamp(); F.wheel(st); F.sluice(st, L()); keysScrap();
    var x = H.OX + 30, y = 240, w = L_WPX() - 60;
    F.parchment(x, y, w, 210, L().id * 9);
    F.nail(x + 20, y + 15); F.nail(x + w - 20, y + 16);
    ctx.textAlign = 'left';
    var closing = [
      'The mother sits in the crib and the liquor is already going cloudy round it. One pan drawn, one waller, two shifts of salt standing in it like posts. The steward will not ask how.',
      'Nine days on and you barely watch your own salt any more. That is the part the old wallers warn you about, and the part nobody quits over.',
      'Drawn. Set. Signed.'
    ][li];
    var yy = wrap('The bloom takes.', x + 28, y + 58, w - 56, 30, '600 25px ' + S, PAL.inkRed);
    yy = wrap(closing, x + 28, yy + 4, w - 56, 23, '15.5px ' + S, 'rgba(45,28,18,.88)');
    yy = wrap('Shifts walked: ' + (st.recs.length + 1) + '. Paddles spent: ' + st.paddle + '. Salt slaked: none.',
      x + 28, yy + 10, w - 56, 22, 'italic 14.5px ' + S, 'rgba(59,36,23,.72)');
    ctx.font = 'italic 14px ' + S;
    ctx.fillStyle = 'rgba(142,58,32,' + (.5 + .4 * Math.abs(Math.sin(H.now() * 1.7))) + ')';
    ctx.fillText(li < G.LEVELS.length - 1 ? 'press return for the next pan' : 'press return to be paid', x + 28, y + 186);
    vignette();
  }

  function endScreen(dt) {
    endT += dt;
    ctx.fillStyle = '#0d0a08'; ctx.fillRect(0, 0, 1200, 730);
    var f = H.flick();
    var g = ctx.createRadialGradient(600, 330, 10, 600, 340, 560);
    g.addColorStop(0, 'rgba(243,236,219,' + (.16 * (0.5 + 0.5 * Math.sin(endT * .8))) + ')');
    g.addColorStop(.35, 'rgba(217,162,78,' + (.07 * f) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 1200, 730);

    // four figures of salt, slumping now that nothing needs holding
    var slump = Math.min(1, endT / 16);
    for (var i = 0; i < 4; i++) {
      var fx = 288 + i * 208, fy = 694 - i * 4;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - slump * .95 - i * .02);
      ctx.translate(fx, fy); ctx.scale(1.35 + slump * .6, Math.max(.04, 1.35 - slump * 1.35));
      H.drawFigure(0, 0, { salt: true, lv: .95, phase: 0, moving: false, face: 'S', seed: i + 2, mark: G.ROMAN[i] });
      ctx.restore();
      for (var k = 0; k < 3; k++) {                     // what is left of them, pooling
        var pw = 14 + slump * (58 + i * 10);
        ctx.fillStyle = 'rgba(196,204,178,' + (.05 + slump * .13) + ')';
        ctx.beginPath(); ctx.ellipse(fx, fy + 2 + k * 2, pw, 3 + slump * 6, 0, 0, 7); ctx.fill();
      }
    }
    H.drawSteam(); H.drawMotes();

    var x = 238, y = 46, w = 724;
    F.parchment(x, y, w, 512, 5);
    F.nail(x + 24, y + 16); F.nail(x + w - 24, y + 17);
    ctx.textAlign = 'left';
    ctx.font = 'italic 13px ' + S; ctx.fillStyle = 'rgba(59,36,23,.6)';
    ctx.fillText('the last leaf of the Netherwich day-book', x + 40, y + 40);
    ctx.font = '600 30px ' + S; ctx.fillStyle = PAL.inkRed;
    ctx.fillText('What the Spring Was Worth', x + 40, y + 82);
    var yy = y + 116;
    [
      'The high pan drew clean. The mother sat, the liquor clouded, and by the first bell there was a crust on it you could stand a rake in. Nineteen days and the spring gave out three days after, exactly as the assayer said it would, so the house is to be pulled down for its timber.',
      'A. Wray is paid to the day and docked one loaf, which the steward insists was hers to account for.',
      'Note, for whoever keeps this book next. When the boards came up at last and nothing needed holding, the four shifts of standing salt let go together. They did not fall over. They went down the way a person sits when they have finished — knees first, then the shoulders — and then they were only salt on a floor, and we swept them into the clods with the rest and sold them at eightpence the bushel.',
      'Wray watched the whole of it from the doorway with her coat already on, and what she said was: they never once got in my way.',
      'I have written that down because it is the only kind thing anybody said in this house all season, and because it is not true. They got in her way constantly. She simply went round.'
    ].forEach(function (line, i) {
      yy = wrap(line, x + 40, yy, w - 80, 21.5, (i === 3 ? 'italic ' : '') + '14.5px ' + S, 'rgba(45,28,18,.9)') + 9;
    });
    ctx.font = 'italic 14px ' + S; ctx.fillStyle = 'rgba(59,36,23,.72)';
    ctx.textAlign = 'right';
    ctx.fillText('— clerk of the fire, Netherwich', x + w - 44, yy + 22);
    ctx.textAlign = 'left';
    ctx.font = '13.5px ' + S;
    ctx.fillStyle = 'rgba(230,214,176,' + (.3 + .3 * Math.abs(Math.sin(H.now() * 1.5))) + ')';
    ctx.textAlign = 'center';
    ctx.fillText('press return to walk it again', 600, 600);
    ctx.textAlign = 'left';
    vignette();
  }

  function auditScreen() {
    ctx.fillStyle = 'rgba(6,4,3,.9)'; ctx.fillRect(0, 0, 1200, 730);
    var x = 150, y = 46, w = 900, h = 622;
    F.parchment(x, y, w, h, 33);
    F.nail(x + 24, y + 16); F.nail(x + w - 24, y + 17);
    ctx.textAlign = 'left';
    ctx.font = '600 22px ' + S; ctx.fillStyle = PAL.inkRed;
    ctx.fillText('The clerk audits the book', x + 40, y + 52);
    var yy = wrap('Every pan walked from its written solution; every shift unpicked to the doorway and walked again, paddle by paddle, to see whether it lands where it landed before; and four deliberate contradictions, each checked for the right slake at the right paddle.',
      x + 40, y + 74, w - 80, 18, 'italic 13px ' + S, 'rgba(59,36,23,.66)') + 14;
    audit.lines.forEach(function (l) {
      ctx.font = '600 12.5px ' + S;
      ctx.fillStyle = l[0] === 'ok' ? '#3f5c33' : PAL.inkRed;
      ctx.fillText(l[0] === 'ok' ? 'drawn clean' : 'FOULED', x + 40, yy);
      ctx.font = '13.5px ' + S; ctx.fillStyle = 'rgba(45,28,18,.9)';
      ctx.fillText(l[1], x + 146, yy);
      yy += 22;
    });
    ctx.font = '600 17px ' + S;
    ctx.fillStyle = audit.fail ? PAL.inkRed : '#3f5c33';
    ctx.fillText(audit.pass + ' clean, ' + audit.fail + ' fouled', x + 40, yy + 20);
    ctx.font = 'italic 13.5px ' + S; ctx.fillStyle = 'rgba(59,36,23,.7)';
    ctx.fillText('press t to close the book', x + 40, yy + 44);
  }

  function playScreen() {
    drawPan(false); drawBodies(false); H.drawSteam(); H.drawMotes();
    F.dayBook(st, L()); F.lamp(); F.wheel(st); F.sluice(st, L()); keysScrap();
    bottomLine(clerkLine());
    vignette();
  }

  /* ------------------------------------------------------------------ input */
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key, lower = k.length === 1 ? k.toLowerCase() : k;
    if (k === ' ' || k.indexOf('Arrow') === 0) e.preventDefault();
    AU.wake();

    if (mode === 'title') { mode = 'brief'; startLevel(0); return; }
    if (lower === 'm') { AU.mute(); return; }
    if (lower === 't') {
      if (mode === 'audit') { mode = st.halt ? 'slake' : st.spoiled ? 'spoiled' : st.won ? 'won' : 'play'; }
      else { audit = G.selftest(); mode = 'audit'; }
      return;
    }
    if (mode === 'audit') return;

    // Unpicking is always to hand, even standing over a finished crib.
    if (mode === 'play' || mode === 'slake' || mode === 'spoiled' || mode === 'won') {
      if (lower === 'r') { startLevel(li); mode = 'play'; return; }
      if (lower === 'u') { unpickShift(); mode = settled(); return; }
      if (lower === 'z') { unpickPaddle(); mode = settled(); return; }
    }
    if (mode === 'brief') { if (k === 'Enter' || k === ' ') mode = 'play'; return; }
    if (mode === 'end') { if (k === 'Enter') { mode = 'title'; endT = 0; } return; }
    if (mode === 'won') {
      if (k === 'Enter') {
        if (li < G.LEVELS.length - 1) startLevel(li + 1);
        else { mode = 'end'; endT = 0; }
      }
      return;
    }
    if (mode === 'slake' || mode === 'spoiled') return;
    if (k === 'Escape') { mode = 'title'; return; }

    var tok = KEY[k] || KEY[lower] || null;
    if (k === ' ') tok = '.';
    if (lower === 'x') tok = 'X';
    if (k === 'Enter') tok = '|';
    if (tok) { press(tok); if (st.halt) mode = 'slake'; else if (st.spoiled) mode = 'spoiled'; }
  });

  /* ------------------------------------------------------------------- clock */
  var last = performance.now();
  function frame(now) {
    var dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
    H.ambient(dt, L());
    if (anim.t < 1) anim.t = Math.min(1, anim.t + dt * 7.5);
    ctx.setTransform(Math.min(2, window.devicePixelRatio || 1), 0, 0, Math.min(2, window.devicePixelRatio || 1), 0, 0);
    ctx.fillStyle = '#0d0a08'; ctx.fillRect(0, 0, 1200, 730);
    if (mode === 'title') titleScreen();
    else if (mode === 'audit') auditScreen();
    else if (mode === 'brief') briefScreen();
    else if (mode === 'slake') slakeScreen();
    else if (mode === 'spoiled') spoiledScreen();
    else if (mode === 'won') wonScreen();
    else if (mode === 'end') endScreen(dt);
    else playScreen();
    requestAnimationFrame(frame);
  }
  startLevel(0); mode = 'title';
  requestAnimationFrame(frame);

  // A hook for the bench: draw one frame on demand, and read the day's state.
  // The clerk's audit (T) uses none of this; it is only here so the house can
  // be photographed without the wheel turning.
  window.NETHERWICH_BENCH = {
    draw: function (t) { frame(t === undefined ? performance.now() : t); },
    look: function () {
      return {
        mode: mode, pan: li, log: log.join(''), shift: st.shift, paddle: st.paddle,
        recs: st.recs.map(function (r) { return r.acts.join(''); }),
        actors: st.actors.map(function (a) { return (a.salt ? 's' + a.rec : 'L') + '@' + a.x + ',' + a.y + (a.carry ? '*' : ''); }),
        hatches: st.world.open.map(function (o) { return o ? 1 : 0; }).join(''),
        loaves: st.world.loaves.map(function (l) { return l.x + ',' + l.y; }),
        mother: st.world.mother.x + ',' + st.world.mother.y + '/' + st.world.mother.held,
        won: st.won, spoiled: st.spoiled, halt: st.halt || null, sig: G.sig(st)
      };
    },
    to: function (m) { mode = m; },
    at: function (i) { startLevel(i); mode = 'play'; }
  };
})();
</script>
