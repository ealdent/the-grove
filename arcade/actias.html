        const h = o.hist[i], h2 = o.hist[Math.max(0, i - 2)];
        const q1 = prj(h.x, h.y, h.z), q2 = prj(h2.x, h2.y, h2.z);
        const ff = fogT(h.z), w = Math.max(1.4, q1.s * 0.06 * (1 - i / (o.segN * 4)) * 2);
        ctx.strokeStyle = col(mixRGB(ZAPPURPLE, [255, 255, 255], 0.2), (1 - ff) * (0.75 - i / (o.segN * 5)));
        ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.stroke();
      }
      const q = prj(o.x, o.y, o.z), s = q.s * 0.4;
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - f;
      ctx.drawImage(glowSpr.zap, q.x - s * 2, q.y - s * 2, s * 4, s * 4);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.fillStyle = o.hitT > 0 ? '#fff' : col([240, 235, 255], 1 - f);
      ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(2, s * 0.5), 0, TAU); ctx.fill();
      ctx.lineCap = 'butt';
      break;
    }
    case 'garc': {
      const q = prj(o.x, 0, o.z);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = col(ZAPPURPLE, 0.9);
      ctx.lineWidth = Math.max(1.5, q.s * 0.03);
      ctx.beginPath();
      let yy = 0;
      for (let i = 0; i <= 6; i++) {
        const hq = prj(o.x + rand(-0.4, 0.4), yy, o.z);
        i === 0 ? ctx.moveTo(hq.x, hq.y) : ctx.lineTo(hq.x, hq.y);
        yy += 0.24;
      }
      ctx.stroke();
      const gs = q.s * 1.4;
      ctx.globalAlpha = 0.7;
      ctx.drawImage(glowSpr.zap, q.x - gs / 2, q.y - gs / 2, gs, gs);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      break;
    }
  }
  if (o.hitT !== undefined && o.hitT > 0) o.hitT -= 1 / 60;
}

/* -------------------------------------------------------------- the boss */
function drawBoss() {
  const B = G.bossRef; if (!B) return;
  const q = prj(B.x, B.y, B.z), s = q.s;
  const f = fogT(B.z);
  const flick = B.flick > 0 ? (srand() < 0.4 ? 0.4 : 1) : 1;
  shadow(B.x, B.z, 2.6, 0.6);
  // twin sweep beams
  if (B.beams && B.st === 'atkA') {
    for (const bx of [B.bx1, B.bx2]) {
      const gq = prj(bx, 0, PZ + 1);
      ctx.globalCompositeOperation = 'lighter';
      const bg = ctx.createLinearGradient(q.x, q.y, gq.x, gq.y);
      bg.addColorStop(0, col([255, 240, 200], 0.5)); bg.addColorStop(1, col(SODIUM, 0.12));
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.moveTo(q.x - s * 0.2, q.y);
      ctx.lineTo(gq.x - gq.s * 1.05, gq.y); ctx.lineTo(gq.x + gq.s * 1.05, gq.y);
      ctx.lineTo(q.x + s * 0.2, q.y); ctx.closePath(); ctx.fill();
      ctx.fillStyle = col([255, 255, 240], 0.55);
      ctx.beginPath(); ctx.ellipse(gq.x, gq.y, gq.s * 1.1, gq.s * 0.2, 0, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  // corona of burned moths
  for (const m of B.corona) {
    if (!m.on) continue;
    const mx = q.x + Math.cos(m.a) * s * 3.1, my = q.y + Math.sin(m.a) * s * 1.5;
    const ms = s * 0.24, fl = Math.sin(G.t * 20 + m.a * 7) * 0.4;
    ctx.fillStyle = col([120, 95, 80], 0.85 * (1 - f));
    ctx.save(); ctx.translate(mx, my); ctx.rotate(m.a + 1.5);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-ms, -ms * (0.6 + fl), -ms * 1.2, ms * 0.1);
    ctx.quadraticCurveTo(0, ms * 0.24, ms * 1.2, ms * 0.1);
    ctx.quadraticCurveTo(ms, -ms * (0.6 + fl), 0, 0); ctx.fill();
    ctx.restore();
  }
  const r = s * 2.15 * flick;
  const hot = B.st.indexOf('tell') === 0 ? 0.5 + 0.5 * Math.sin(G.t * 16) : 0;
  // outer glow
  ctx.globalCompositeOperation = 'lighter';
  const gs = r * (3.4 + hot * 1.2);
  ctx.globalAlpha = (0.65 + hot * 0.35) * flick;
  ctx.drawImage(glowSpr.sodium, q.x - gs / 2, q.y - gs / 2, gs, gs);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  // glass envelope
  ctx.fillStyle = col([255, 214, 150], 0.16 + hot * 0.1);
  ctx.beginPath(); ctx.ellipse(q.x, q.y, r, r * 1.08, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = col([255, 236, 200], 0.75 * (1 - f) * flick);
  ctx.lineWidth = Math.max(1.5, s * 0.06);
  ctx.beginPath(); ctx.ellipse(q.x, q.y, r, r * 1.08, 0, 0, TAU); ctx.stroke();
  ctx.strokeStyle = col([255, 255, 255], 0.5 * flick);
  ctx.beginPath(); ctx.ellipse(q.x - r * 0.34, q.y - r * 0.4, r * 0.3, r * 0.5, -0.6, -0.8, 0.9); ctx.stroke();
  // screw base beneath
  ctx.fillStyle = col([96, 84, 64], 0.95);
  ctx.fillRect(q.x - r * 0.5, q.y + r * 0.95, r, r * 0.5);
  ctx.strokeStyle = col([50, 42, 32], 0.9);
  ctx.lineWidth = Math.max(1, s * 0.03);
  for (let i = 1; i <= 3; i++) { const yy = q.y + r * 0.95 + r * 0.125 * i;
    ctx.beginPath(); ctx.moveTo(q.x - r * 0.5, yy); ctx.lineTo(q.x + r * 0.5, yy); ctx.stroke(); }
  // filament — the false moon's heart
  const fGlow = (B.iris > 0.5 ? 1.35 : 0.9 + hot * 0.5) * flick;
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = col([255, 244, 214], Math.min(1, 0.9 * fGlow));
  ctx.lineWidth = Math.max(2, s * 0.1);
  ctx.beginPath(); ctx.moveTo(q.x - r * 0.42, q.y + r * 0.5);
  for (let i = 0; i <= 6; i++)
    ctx.lineTo(q.x - r * 0.42 + i * r * 0.14, q.y - r * 0.1 + ((i & 1) ? r * 0.26 : -r * 0.26) * 0.8);
  ctx.lineTo(q.x + r * 0.42, q.y + r * 0.5);
  ctx.stroke();
  const fs = r * 1.6 * fGlow;
  ctx.globalAlpha = 0.8;
  ctx.drawImage(glowSpr.sodium, q.x - fs / 2, q.y - r * 0.05 - fs / 2, fs, fs);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  // iris vent — open means vulnerable
  if (B.iris > 0.02) {
    ctx.strokeStyle = col(PLAYER_TINT, 0.85 * B.iris);
    ctx.lineWidth = Math.max(2, s * 0.07);
    ctx.beginPath(); ctx.arc(q.x, q.y, r * (1.18 - B.iris * 0.12), 0, TAU); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = B.iris * 0.5;
    const vs = r * 3.2;
    ctx.drawImage(glowSpr.luna, q.x - vs / 2, q.y - vs / 2, vs, vs);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
  // cracks accumulate
  if (B.crack > 0) {
    ctx.strokeStyle = col([255, 255, 255], 0.5);
    ctx.lineWidth = Math.max(1, s * 0.025);
    const n = B.crack * 3;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + 0.7;
      ctx.beginPath(); ctx.moveTo(q.x + Math.cos(a) * r * 0.3, q.y + Math.sin(a) * r * 0.3);
      ctx.lineTo(q.x + Math.cos(a + 0.3) * r * 0.7, q.y + Math.sin(a + 0.3) * r * 0.72);
      ctx.lineTo(q.x + Math.cos(a + 0.16) * r * 0.98, q.y + Math.sin(a + 0.16) * r * 1.02);
      ctx.stroke();
    }
  }
  if (B.hitT > 0) {
    ctx.strokeStyle = col([255, 255, 255], 0.9);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(q.x, q.y, r * 1.06, r * 1.14, 0, 0, TAU); ctx.stroke();
  }
}

/* ---------------------------------------------------------- the beam */
function drawBeam() {
  if (!G.beam || G.boss || G.bossRef) return;
  const par = -CAM.x * H * 0.02;
  const grow = lerp(0.3, 1, sat(G.stageT / G.stageDur[2]));
  const lx = W * 0.66 + par * 2.4, ly = HOR - H * 0.16 * grow - H * 0.16 * grow * 0.2;
  if (G.beam.st === 'sweep') {
    const bx = lerp(-11 * G.beam.dir, 11 * G.beam.dir, G.beam.t / 1.5);
    const gq = prj(bx, 0, PZ + 2);
    ctx.globalCompositeOperation = 'lighter';
    const bg = ctx.createLinearGradient(lx, ly, gq.x, gq.y);
    bg.addColorStop(0, col([255, 244, 210], 0.5)); bg.addColorStop(1, col(SODIUM, 0.16));
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.moveTo(lx - 3, ly);
    ctx.lineTo(gq.x - gq.s * 1.15, gq.y + 40); ctx.lineTo(gq.x + gq.s * 1.15, gq.y + 40);
    ctx.lineTo(lx + 3, ly); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col([255, 255, 240], 0.5);
    ctx.beginPath(); ctx.ellipse(gq.x, gq.y, gq.s * 1.4, gq.s * 0.24, 0, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* -------------------------------------------------------------- the moth
   Actias luna from behind and just above, flying into the scene: swept
   pointed forewings, small hindwings, and the long twin tail streamers the
   species is famous for. She loses a streamer when she is wounded. */
function drawPlayer() {
  if (G.mode === 'over') return;
  const blink = G.inv > 0 && (G.t * 14 | 0) % 2 === 0;
  const q = prj(P.x, P.y, PZ), s = q.s * 0.56;
  shadow(P.x, PZ, 0.8, 0.5 * (1 - P.y / 12));
  const alpha = blink ? 0.3 : 1;
  ctx.save();
  ctx.translate(q.x, q.y);
  ctx.rotate(P.bank);
  const gs = s * 3.4;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha * 0.26;
  ctx.drawImage(glowSpr.luna, -gs / 2, -gs / 2, gs, gs);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha;
  const lift = Math.sin(P.flap) * 0.3 + 0.06;
  const pinch = 1 - Math.max(0, lift) * 0.12;
  const tat = P.tatter;
  const inner = mixRGB(PLAYER_TINT, [255, 255, 255], 0.3);
  const outer = mixRGB(PLAYER_TINT, [104, 182, 150], 0.55);
  // tail streamers first, under the wings — procedural sway, lagging her turns
  ctx.lineCap = 'round';
  for (let side = -1; side <= 1; side += 2) {
    if (tat >= 2 && side === 1) continue; // a streamer burned away
    const sw = Math.sin(G.t * 2.7 + side * 2.1) * 0.13 - P.vx * 0.02 - Math.max(-0.1, P.vy * 0.012);
    const x0 = side * s * 0.24, y0 = s * 0.34;
    const tipx = x0 + side * s * 0.34 + sw * s * 1.6, tipy = s * 1.08;
    ctx.strokeStyle = col(inner, 0.72 * alpha);
    ctx.lineWidth = Math.max(1.1, s * 0.038);
    ctx.beginPath(); ctx.moveTo(x0, y0);
    ctx.bezierCurveTo(
      x0 + side * s * 0.06 + sw * s * 0.4, s * 0.62,
      x0 + side * s * 0.02 + sw * s, s * 0.88,
      tipx, tipy);
    ctx.stroke();
    ctx.lineWidth = Math.max(0.7, s * 0.016);
    ctx.strokeStyle = col([255, 255, 255], 0.3 * alpha);
    ctx.beginPath(); ctx.moveTo(x0, y0);
    ctx.bezierCurveTo(
      x0 + side * s * 0.06 + sw * s * 0.4, s * 0.62,
      x0 + side * s * 0.02 + sw * s, s * 0.88,
      tipx, tipy);
    ctx.stroke();
    ctx.fillStyle = col(inner, 0.7 * alpha);
    ctx.beginPath(); ctx.ellipse(tipx, tipy, s * 0.04, s * 0.085, sw + side * 0.5, 0, TAU); ctx.fill();
  }
  ctx.lineCap = 'butt';
  for (let side = -1; side <= 1; side += 2) {
    const sx = side * s * pinch;
    // hindwing — small rounded lobe tucked behind
    ctx.beginPath();
    ctx.moveTo(sx * 0.1, s * 0.02);
    ctx.quadraticCurveTo(sx * 0.62, s * (0.1 - lift * 0.2), sx * 0.58, s * (0.4 - lift * 0.16));
    ctx.quadraticCurveTo(sx * 0.3, s * 0.5, side * s * 0.08, s * 0.36);
    ctx.closePath();
    ctx.fillStyle = col(outer, 0.92); ctx.fill();
    ctx.strokeStyle = col([255, 255, 255], 0.32);
    ctx.lineWidth = Math.max(0.7, s * 0.012); ctx.stroke();
    // forewing — long, swept, pointed
    ctx.beginPath();
    ctx.moveTo(sx * 0.06, -s * 0.14);
    ctx.quadraticCurveTo(sx * 0.46, -s * (0.62 + lift * 0.9), sx * 1.04, -s * (0.5 + lift * 1.05));
    ctx.quadraticCurveTo(sx * 0.86, -s * (0.12 + lift * 0.3), sx * 0.44, s * 0.06);
    ctx.closePath();
    const wgrad = ctx.createLinearGradient(0, 0, sx, -s * (0.5 + lift * 0.9));
    wgrad.addColorStop(0, col(inner, 0.97));
    wgrad.addColorStop(1, col(outer, 0.94));
    ctx.fillStyle = wgrad; ctx.fill();
    ctx.strokeStyle = col([255, 255, 255], 0.55); // moonlit leading edge
    ctx.lineWidth = Math.max(0.8, s * 0.016);
    ctx.beginPath();
    ctx.moveTo(sx * 0.06, -s * 0.14);
    ctx.quadraticCurveTo(sx * 0.46, -s * (0.62 + lift * 0.9), sx * 1.04, -s * (0.5 + lift * 1.05));
    ctx.stroke();
    // veins
    ctx.strokeStyle = col([96, 152, 126], 0.6);
    ctx.lineWidth = Math.max(0.6, s * 0.01);
    for (let v = 0; v < 3; v++) {
      ctx.beginPath(); ctx.moveTo(sx * 0.1, -s * 0.12);
      ctx.quadraticCurveTo(sx * 0.44, -s * (0.3 + v * 0.1 + lift * 0.55), sx * (0.92 - v * 0.16), -s * (0.42 - v * 0.08 + lift * 0.85));
      ctx.stroke();
    }
    // eyespots — one per wing, like the living animal
    const ex = sx * 0.5, ey = -s * (0.3 + lift * 0.6);
    ctx.fillStyle = col([84, 104, 92], 0.9);
    ctx.beginPath(); ctx.arc(ex, ey, s * 0.05, 0, TAU); ctx.fill();
    ctx.fillStyle = col([248, 214, 150], 0.95);
    ctx.beginPath(); ctx.arc(ex, ey, s * 0.022, 0, TAU); ctx.fill();
    ctx.fillStyle = col([84, 104, 92], 0.75);
    ctx.beginPath(); ctx.arc(sx * 0.34, s * 0.22, s * 0.028, 0, TAU); ctx.fill();
    // scorched bites on the trailing edge when wounded
    if (tat > 0) {
      ctx.fillStyle = col([40, 38, 36], 0.9);
      for (let i = 0; i < tat + 1; i++) {
        ctx.beginPath();
        ctx.arc(sx * (0.72 - i * 0.2), -s * (0.2 + lift * 0.5 - i * 0.1), s * (0.05 + i * 0.014), 0, TAU);
        ctx.fill();
      }
    }
  }
  // fuzzy body + head
  ctx.fillStyle = col(mixRGB(PLAYER_TINT, [255, 255, 255], 0.5), 0.98);
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.085, s * 0.3, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = col([236, 250, 240], 1);
  ctx.beginPath(); ctx.arc(0, -s * 0.3, s * 0.07, 0, TAU); ctx.fill();
  ctx.strokeStyle = col(outer, 0.5);
  ctx.lineWidth = Math.max(0.6, s * 0.014);
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(-s * 0.07, -s * 0.1 + i * s * 0.12); ctx.lineTo(s * 0.07, -s * 0.1 + i * s * 0.12); ctx.stroke();
  }
  // feathered antennae, splayed like little ferns
  ctx.strokeStyle = col([235, 252, 240], 0.9);
  ctx.lineWidth = Math.max(0.7, s * 0.014);
  for (let side = -1; side <= 1; side += 2) {
    const tipX = side * s * 0.24, tipY = -s * 0.52;
    ctx.beginPath(); ctx.moveTo(side * s * 0.03, -s * 0.34);
    ctx.quadraticCurveTo(side * s * 0.12, -s * 0.46, tipX, tipY);
    ctx.stroke();
    for (let b = 1; b <= 4; b++) {
      const bt = b / 5;
      const bx = lerp(side * s * 0.05, tipX, bt), by = lerp(-s * 0.37, tipY, bt);
      ctx.beginPath(); ctx.moveTo(bx, by);
      ctx.lineTo(bx - side * s * 0.045 * (1 - bt * 0.5), by - s * 0.03); ctx.stroke();
    }
  }
  // muzzle shimmer while singing dust
  if (G.muzzle > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = G.muzzle / 0.09 * 0.8 * alpha;
    const ms = s * 0.9;
    ctx.drawImage(glowSpr.silver, -ms / 2, -s * 0.44 - ms / 2, ms, ms);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ----------------------------------------------------- shots & particles */
function drawShots() {
  ctx.globalCompositeOperation = 'lighter';
  for (const s of G.shots) {
    const q = prj(s.x, s.y, s.z); const qb = prj(s.x, s.y, s.z - 2.2);
    const f = 1 - fogT(s.z);
    ctx.strokeStyle = col(SILVER, 0.5 * f);
    ctx.lineWidth = Math.max(1, q.s * 0.03);
    ctx.beginPath(); ctx.moveTo(qb.x, qb.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    const gs = q.s * 0.6;
    ctx.globalAlpha = f;
    ctx.drawImage(glowSpr.luna, q.x - gs / 2, q.y - gs / 2, gs, gs);
    ctx.globalAlpha = 1;
    ctx.fillStyle = col([240, 255, 245], 0.95 * f);
    ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1.2, q.s * 0.05), 0, TAU); ctx.fill();
  }
  for (const b of G.bolts) {
    const q = prj(b.x, b.y, b.z), f = 1 - fogT(b.z);
    const c = b.boss ? SODIUM : ZAPPURPLE;
    const gs = q.s * 0.9;
    ctx.globalAlpha = f;
    ctx.drawImage(b.boss ? glowSpr.sodium : glowSpr.zap, q.x - gs / 2, q.y - gs / 2, gs, gs);
    ctx.globalAlpha = 1;
    ctx.fillStyle = col([255, 255, 255], 0.9 * f);
    ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1.3, q.s * 0.055), 0, TAU); ctx.fill();
    ctx.strokeStyle = col(c, 0.85 * f);
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(2.2, q.s * 0.1 * (1 + 0.15 * Math.sin(G.t * 12 + b.t * 9))), 0, TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawParticles() {
  for (const p of PARTS) {
    if (!p.on) continue;
    const q = prj(p.x, p.y, p.z);
    if (q.x < -40 || q.x > W + 40 || q.y < -40 || q.y > H + 40) continue;
    const lt = 1 - p.t / p.life;
    const sz = Math.max(0.8, p.size * q.s * 0.01);
    if (p.kind === 'smoke') {
      ctx.fillStyle = col(p.c, lt * 0.25);
      ctx.beginPath(); ctx.arc(q.x, q.y, sz * 2.4, 0, TAU); ctx.fill();
    } else if (p.kind === 'dust' || p.kind === 'spark' || p.kind === 'pop') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = lt * 0.85;
      if (sz > 2.2) {
        const spr = p.kind === 'dust' ? glowSpr.luna : p.kind === 'spark' ? glowSpr.zap : glowSpr.sodium;
        ctx.drawImage(spr, q.x - sz * 2, q.y - sz * 2, sz * 4, sz * 4);
      }
      ctx.fillStyle = col(p.c, lt);
      if (sz > 2) { ctx.beginPath(); ctx.arc(q.x, q.y, sz * 0.55, 0, TAU); ctx.fill(); }
      else ctx.fillRect(q.x - sz / 2, q.y - sz / 2, sz, sz);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    } else { // glass
      ctx.fillStyle = col(p.c, lt * 0.9);
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(p.t * 9 + p.size);
      ctx.fillRect(-sz, -sz * 0.4, sz * 2, sz * 0.8);
      ctx.restore();
    }
  }
  // fireflies — the meadow's own quiet lights
  if (G.stage === 0 || G.mode === 'title') {
    ctx.globalCompositeOperation = 'lighter';
    for (const fl of FIREFLIES) {
      const q = prj(fl.x, fl.y, fl.z), f = 1 - fogT(fl.z);
      const pulse = Math.max(0, Math.sin(fl.ph * 1.4 + fl.ph2 * 3));
      const gs = Math.max(3, q.s * 0.14) * (1 + pulse);
      ctx.globalAlpha = f * (0.25 + pulse * 0.6);
      ctx.drawImage(glowSpr.firefly, q.x - gs / 2, q.y - gs / 2, gs, gs);
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
}

/* ------------------------------------------------------------------ HUD */
function miniMoth(x, y, r, on) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = on ? col(PLAYER_TINT, 0.95) : col([70, 80, 74], 0.6);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-r, -r * 0.9, -r * 1.2, r * 0.16);
  ctx.quadraticCurveTo(-r * 0.4, r * 0.34, 0, r * 0.2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(r, -r * 0.9, r * 1.2, r * 0.16);
  ctx.quadraticCurveTo(r * 0.4, r * 0.34, 0, r * 0.2); ctx.fill();
  ctx.fillStyle = on ? col([255, 255, 255], 0.9) : col([90, 96, 92], 0.6);
  ctx.beginPath(); ctx.ellipse(0, r * 0.05, r * 0.14, r * 0.34, 0, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawHUD() {
  const u = H / 100, pad = 2.6 * u;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = FONT.hudSmall; ctx.fillStyle = col(SILVER, 0.55);
  ctx.fillText('L U M E N S', pad, pad + 1.4 * u);
  ctx.font = FONT.score; ctx.fillStyle = col(SILVER, 0.92);
  ctx.fillText('' + Math.floor(G.score), pad, pad + 6.2 * u);
  if (G.streak > 0 && G.mult > 1) {
    ctx.font = FONT.hud; ctx.fillStyle = col(PLAYER_TINT, 0.9);
    ctx.fillText('×' + G.mult, pad, pad + 9.4 * u);
    ctx.fillStyle = col(PLAYER_TINT, 0.5);
    ctx.fillRect(pad + 5.2 * u, pad + 8.7 * u, 10 * u * sat(G.streakT / 3.5), 0.35 * u);
  }
  ctx.textAlign = 'right';
  ctx.font = FONT.hud; ctx.fillStyle = col(SILVER, 0.8);
  ctx.fillText('NIGHT ' + romanN(G.night), W - pad, pad + 2 * u);
  ctx.font = FONT.hudSmall; ctx.fillStyle = col(SILVER, 0.4);
  ctx.fillText(G.boss || G.bossRef ? 'THE FALSE MOON' : STAGE_NAMES[G.stage], W - pad, pad + 4.2 * u);
  for (let i = 0; i < 3; i++) miniMoth(pad + 2 * u + i * 4.6 * u, H - pad - 1.6 * u, 1.7 * u, i < G.hp);
  // sound glyph
  ctx.textAlign = 'right'; ctx.font = FONT.hudSmall;
  ctx.fillStyle = col(SILVER, 0.4);
  ctx.fillText(G.muted ? 'M — SOUND OFF' : 'M — SOUND', W - pad, H - pad);
  // boss meter — a filament that dims as you win
  const B = G.bossRef;
  if (B && B.st !== 'enter') {
    const bw = W * 0.4, bx = W / 2 - bw / 2, by = pad + 2 * u;
    ctx.textAlign = 'center'; ctx.font = FONT.hudSmall;
    ctx.fillStyle = col(SODIUM, 0.85);
    ctx.fillText('V E S P E R — T H E  F A L S E  M O O N', W / 2, by);
    ctx.fillStyle = col([70, 60, 50], 0.7);
    ctx.fillRect(bx, by + u, bw, 0.6 * u);
    const frac = sat(B.hp / B.max);
    const fg = ctx.createLinearGradient(bx, 0, bx + bw * frac, 0);
    fg.addColorStop(0, col(SODIUM, 0.95)); fg.addColorStop(1, col([255, 240, 200], 0.95));
    ctx.fillStyle = fg;
    ctx.fillRect(bx, by + u, bw * frac, 0.6 * u);
    if (B.iris > 0.5) {
      ctx.fillStyle = col(PLAYER_TINT, 0.5 + 0.5 * Math.sin(G.t * 10));
      ctx.font = FONT.hudSmall;
      ctx.fillText('IT VENTS — STRIKE THE FILAMENT', W / 2, by + 3.4 * u);
    }
  }
  // early hints, first flight only
  if (G.firstRun && G.night === 1 && !G.attract) {
    ctx.textAlign = 'center'; ctx.font = FONT.hud;
    if (G.hintT > 0.8 && G.hintT < 4.4) {
      ctx.fillStyle = col(SILVER, 0.75 * Math.min(1, (G.hintT - 0.8)) * Math.min(1, 4.4 - G.hintT));
      ctx.fillText('the Moon calls — fly with WASD · arrows · mouse', W / 2, H * 0.62);
    }
    if (G.hintT > 4.8 && G.hintT < 8.4) {
      ctx.fillStyle = col(SILVER, 0.75 * Math.min(1, (G.hintT - 4.8)) * Math.min(1, 8.4 - G.hintT));
      ctx.fillText('sing your dust at the lights — SPACE · click', W / 2, H * 0.62);
    }
  }
  ctx.textAlign = 'left';
}
function drawPopups() {
  ctx.textAlign = 'center';
  for (const q of POPUPS) {
    const a = q.t < 0.15 ? q.t / 0.15 : 1 - Math.max(0, (q.t - 0.8)) / 0.6;
    ctx.font = FONT.pop;
    ctx.save(); ctx.translate(q.x, q.y); ctx.scale(q.size, q.size);
    ctx.fillStyle = col([6, 8, 14], a * 0.6); ctx.fillText(q.text, 1.5, 1.5);
    ctx.fillStyle = col(q.c, a); ctx.fillText(q.text, 0, 0);
    ctx.restore();
  }
  ctx.textAlign = 'left';
}
function drawCard() {
  if (G.cardT <= 0) return;
  const el = 3.4 - G.cardT;
  const a = Math.min(1, el / 0.5) * Math.min(1, G.cardT / 0.7);
  const u = H / 100, cy = H * 0.3;
  ctx.fillStyle = col([3, 5, 11], a * 0.35);
  ctx.fillRect(0, cy - 9 * u, W, 18 * u);
  ctx.strokeStyle = col(SILVER, a * 0.5); ctx.lineWidth = 1;
  const lw = W * 0.3 * easeOut(el / 0.9);
  ctx.beginPath(); ctx.moveTo(W / 2 - lw, cy - 9 * u); ctx.lineTo(W / 2 + lw, cy - 9 * u); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W / 2 - lw, cy + 9 * u); ctx.lineTo(W / 2 + lw, cy + 9 * u); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = FONT.card; ctx.fillStyle = col(SILVER, a);
  ctx.fillText(G.cardText, W / 2, cy - 0.6 * u);
  ctx.font = FONT.cardSub; ctx.fillStyle = col(G.cardText === 'VESPER' ? SODIUM : PLAYER_TINT, a * 0.9);
  ctx.fillText(G.cardSub, W / 2, cy + 4.6 * u);
  ctx.textAlign = 'left';
}

/* --------------------------------------------------------------- screens */
function drawTitle() {
  const u = H / 100;
  ctx.fillStyle = 'rgba(3,5,12,0.28)'; ctx.fillRect(0, 0, W, H);
  const lw = Math.min(W * 0.86, logoSpr.width);
  const lh = lw * logoSpr.height / logoSpr.width;
  const breathe = 1 + Math.sin(G.t * 1.1) * 0.006;
  ctx.drawImage(logoSpr, W / 2 - lw * breathe / 2, H * 0.2 - lh * breathe / 2, lw * breathe, lh * breathe);
  ctx.textAlign = 'center';
  ctx.font = FONT.sub; ctx.fillStyle = col(SILVER, 0.85);
  ctx.fillText('the seventh flight of the last luna moth', W / 2, H * 0.335);
  ctx.font = FONT.hudSmall; ctx.fillStyle = col(SILVER, 0.52);
  ctx.fillText('A luna moth lives seven nights, and has no mouth — she cannot stop, cannot eat.', W / 2, H * 0.415);
  ctx.fillText('The old road to the Moon is drowned in electric glare. Fly it anyway.', W / 2, H * 0.445);
  const pulse = 0.55 + 0.35 * Math.sin(G.t * 2.4);
  ctx.font = FONT.hud; ctx.fillStyle = col(PLAYER_TINT, pulse);
  ctx.fillText('B E G I N — A N Y  K E Y', W / 2, H * 0.79);
  ctx.font = FONT.hudSmall; ctx.fillStyle = col(SILVER, 0.45);
  ctx.fillText('FLY — WASD · ARROWS · MOUSE        SING DUST — SPACE · CLICK · HOLD', W / 2, H * 0.84);
  ctx.fillText('P — PAUSE        M — SOUND ' + (G.muted ? '(OFF)' : ''), W / 2, H * 0.87);
  if (G.best > 0) {
    ctx.font = FONT.hud; ctx.fillStyle = col(SILVER, 0.6);
    ctx.fillText('BEST NIGHT — ' + G.best + ' LUMENS', W / 2, H * 0.93);
  }
  ctx.textAlign = 'left';
}
function drawPause() {
  const u = H / 100;
  ctx.fillStyle = 'rgba(3,5,12,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = FONT.big; ctx.fillStyle = col(SILVER, 0.95);
  ctx.fillText('WINGS FOLDED', W / 2, H * 0.42);
  ctx.font = FONT.hud; ctx.fillStyle = col(SILVER, 0.6);
  ctx.fillText('P — fly on        R — start the road over        M — sound', W / 2, H * 0.52);
  ctx.font = FONT.hudSmall; ctx.fillStyle = col(SILVER, 0.4);
  ctx.fillText('but the Moon is setting, little one', W / 2, H * 0.58);
  ctx.textAlign = 'left';
}
function drawOver() {
  const a = Math.min(1, G.modeT / 0.9);
  const u = H / 100;
  ctx.fillStyle = col([4, 5, 12], a * 0.78); ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = FONT.big; ctx.fillStyle = col(SODIUM, a * 0.96);
  ctx.fillText('TAKEN BY THE GLARE', W / 2, H * 0.3);
  ctx.font = FONT.sub; ctx.fillStyle = col(SILVER, a * 0.6);
  ctx.fillText('she flew ' + romanN(G.night) + (G.night === 1 ? ' night' : ' nights') + ' of her seven', W / 2, H * 0.37);
  ctx.font = FONT.score; ctx.fillStyle = col(SILVER, a * 0.96);
  ctx.fillText(Math.floor(G.score) + ' LUMENS', W / 2, H * 0.49);
  const isBest = Math.floor(G.score) >= G.best && G.best > 0;
  ctx.font = FONT.hud;
  ctx.fillStyle = col(isBest ? PLAYER_TINT : SILVER, a * (isBest ? 0.95 : 0.55));
  ctx.fillText(isBest ? '✦ THE MOON REMEMBERS — NEW BEST ✦' : 'best — ' + G.best, W / 2, H * 0.55);
  ctx.font = FONT.hudSmall; ctx.fillStyle = col(SILVER, a * 0.55);
  ctx.fillText('lights snuffed — ' + G.kills + '        grazes — ' + G.grazes, W / 2, H * 0.61);
  if (G.modeT > 0.9) {
    const pulse = 0.5 + 0.4 * Math.sin(G.t * 2.6);
    ctx.font = FONT.hud; ctx.fillStyle = col(PLAYER_TINT, pulse);
    ctx.fillText('F L Y  A G A I N — A N Y  K E Y', W / 2, H * 0.74);
  }
  ctx.textAlign = 'left';
}

/* ------------------------------------------------------------- the frame */
const DRAWQ = [];
function draw() {
  PALC = mixedPal();
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  let shx = 0, shy = 0;
  if (G.shake > 0) { shx = rand(-1, 1) * G.shake * 0.14 * (H / 900); shy = rand(-1, 1) * G.shake * 0.14 * (H / 900); ctx.translate(shx, shy); }
  drawSky();
  drawGround();
  drawBeam();
  // z-sorted world
  DRAWQ.length = 0;
  for (const o of G.objects) DRAWQ.push(o);
  if (G.bossRef) DRAWQ.push({ k: '__boss', z: G.bossRef.z });
  DRAWQ.push({ k: '__player', z: PZ });
  DRAWQ.sort((a, b) => b.z - a.z);
  for (const o of DRAWQ) {
    if (o.k === '__player') drawPlayer();
    else if (o.k === '__boss') drawBoss();
    else drawObj(o);
  }
  drawParticles();
  drawShots();
  // sear warning — the light is cooking her wings
  if (G.searT > 0.02) {
    const sa = sat(G.searT / 0.38);
    ctx.fillStyle = col(SODIUM, sa * 0.22);
    ctx.fillRect(0, 0, W, H);
  }
  if (G.flash > 0) {
    ctx.fillStyle = col(G.flashCol, Math.min(0.38, G.flash * 0.7));
    ctx.fillRect(0, 0, W, H);
  }
  if (G.inv > 1.4 && G.mode === 'play') {
    const ia = Math.min(0.3, (G.inv - 1.4) / 0.9 * 0.3);
    const ig = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
    ig.addColorStop(0, col(DANGER, 0)); ig.addColorStop(1, col(DANGER, ia));
    ctx.fillStyle = ig; ctx.fillRect(0, 0, W, H);
  }
  ctx.drawImage(vinSpr, 0, 0, W, H);
  if (G.mode === 'dying') {
    ctx.fillStyle = col([4, 5, 12], sat(G.modeT / 2.2) * 0.6);
    ctx.fillRect(0, 0, W, H);
  }
  drawPopups();
  if (G.mode === 'title') drawTitle();
  else if (G.mode === 'over') drawOver();
  else { drawHUD(); drawCard(); }
  if (G.paused && G.mode === 'play') drawPause();
  if (shx || shy) ctx.setTransform(RES, 0, 0, RES, 0, 0);
}

/* ================================================================ INPUT */
let kbFire = false, mouseFire = false;
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
};
function anyKeyGate() {
  if (G.mode === 'title') { begin(); return true; }
  if (G.mode === 'over' && G.modeT > 0.9) { begin(); return true; }
  return false;
}
function begin() {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  G.firstRun = G.mode === 'title' && G.best === 0;
  startRun();
  sfxCard();
}
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const code = e.code;
  if (code === 'ArrowLeft' || code === 'ArrowRight' || code === 'ArrowUp' || code === 'ArrowDown' || code === 'Space') e.preventDefault();
  if (code === 'KeyM') { setMuted(!G.muted); return; }
  if (code === 'KeyP' || code === 'Escape') {
    if (G.mode === 'play') { G.paused = !G.paused; sfxUi(); if (!G.paused && AC && AC.state === 'suspended') AC.resume(); }
    return;
  }
  if (code === 'KeyR' && (G.paused || G.mode === 'over')) { G.paused = false; begin(); return; }
  if (anyKeyGate()) return;
  if (KEYMAP[code]) keys[KEYMAP[code]] = true;
  if (code === 'Space' || code === 'KeyZ' || code === 'KeyX' || code === 'KeyJ') kbFire = true;
});
window.addEventListener('keyup', e => {
  if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false;
  if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyX' || e.code === 'KeyJ') kbFire = false;
});
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.t = G.t; });
cv.addEventListener('mousedown', e => {
  e.preventDefault();
  if (anyKeyGate()) return;
  mouseFire = true; mouse.t = G.t;
});
window.addEventListener('mouseup', () => { mouseFire = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  kbFire = false; mouseFire = false;
  if (G.mode === 'play' && !G.attract) G.paused = true;
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.mode === 'play') G.paused = true;
});
let resizeQueued = false;
window.addEventListener('resize', () => {
  if (resizeQueued) return; resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; layout(); });
});

/* ================================================================= LOOP */
let lastNow = 0, emaMs = 16.7, resCD = 0, upOK = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastNow) lastNow = now;
  let ms = now - lastNow; lastNow = now;
  if (ms > 250) ms = 16.7; // tab was asleep
  emaMs = emaMs * 0.94 + Math.min(60, ms) * 0.06;
  const dtRaw = Math.min(0.05, ms / 1000);
  let ts = 1;
  if (G.hitstop > 0) { G.hitstop -= dtRaw; ts = 0.1; }
  else if (G.slowmo > 0) { G.slowmo -= dtRaw; ts = 0.24; }
  if (G.mode === 'dying') ts = Math.min(ts, 0.32);
  G.timeScale += (ts - G.timeScale) * Math.min(1, dtRaw * 16);
  fireHeld = kbFire || mouseFire;
  if (!G.paused) update(dtRaw * G.timeScale);
  musicTick();
  draw();
  // adaptive resolution — cut pixels, not scenery
  resCD -= dtRaw;
  if (resCD <= 0) {
    if (emaMs > 21 && resScale > 0.58) { resScale = Math.max(0.55, resScale - 0.15); resCD = 2.5; layout(); }
    else if (emaMs < 11.5 && resScale < 1) { upOK += 1; if (upOK > 3) { upOK = 0; resScale = Math.min(1, resScale + 0.15); resCD = 3; layout(); } }
  }
}

/* ================================================================= BOOT */
_seed = (Math.random() * 1e9) | 0;
layout();
seedMarks(); seedFireflies();
setPal(0, 1, true);

function startAt(stage) {
  begin();
  G.stage = stage; G.night = stage + 1; G.stageT = 0;
  setPal(stage, G.night, true);
  seedMarks(); if (stage === 0) seedFireflies(); else FIREFLIES.length = 0;
  card(nightName(), STAGE_NAMES[stage]);
}
const HASH = (location.hash || '').toLowerCase();
if (HASH.indexOf('mute') >= 0) G.muted = true;
if (HASH.indexOf('boss') >= 0) { startAt(2); G.stageT = G.stageDur[2] - 1.2; }
else if (HASH.indexOf('stage3') >= 0) startAt(2);
else if (HASH.indexOf('stage2') >= 0) startAt(1);
else if (HASH.indexOf('play') >= 0) startAt(0);

/* deterministic driver for headless verification — not part of play */
window.ACTIAS = {
  G, P, MUS, CAM,
  start: startRun, startAt, begin,
  step: (dt, n) => { for (let i = 0; i < (n || 1); i++) update(dt || 1 / 60); },
  render: draw, prj, fire: b => { kbFire = !!b; fireHeld = !!b; },
  damageBoss, playerHit, spawnBoss,
  state: () => ({
    mode: G.mode, night: G.night, stage: G.stage, stageT: +G.stageT.toFixed(2),
    score: Math.floor(G.score), hp: G.hp, objects: G.objects.length,
    shots: G.shots.length, bolts: G.bolts.length, boss: !!G.bossRef,
    bossHP: G.bossRef ? G.bossRef.hp : null, bossSt: G.bossRef ? G.bossRef.st : null,
    px: +P.x.toFixed(2), py: +P.y.toFixed(2), spd: +G.spd.toFixed(1),
  }),
};
requestAnimationFrame(frame);
</script>
</body>
</html>
