<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#070b1e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070b1e'/%3E%3Ccircle cx='40' cy='22' r='13' fill='%23e9edd9'/%3E%3Cpath d='M18 44 L30 32 L34 40 L26 52 Z' fill='%23bdf0cc'/%3E%3Cpath d='M34 40 L46 36 L44 48 L30 52 Z' fill='%2394d8ac'/%3E%3C/svg%3E">
<title>ACTIAS — The Seventh Flight of the Last Luna Moth</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #04060f;
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #cv { position: fixed; inset: 0; display: block; cursor: crosshair; }
  #cv.hidecursor { cursor: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* ============================================================================
   ACTIAS — the seventh flight of the last luna moth
   A Space Harrier descendant. One file, no assets, no libraries.
   Canvas 2D with a hand-built projection pipeline; all audio is Web Audio.
   ==========================================================================*/

/* ------------------------------------------------------------------ utils */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sat = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = t => { t = sat(t); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - (1 - sat(t)) * (1 - sat(t));
const easeIn = t => { t = sat(t); return t * t; };

let _seed = 1234567;
function srand() { // deterministic-ish; reseeded from Math.random at boot
  _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0;
  let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rand = (a = 1, b) => b === undefined ? srand() * a : a + srand() * (b - a);
const randSign = () => srand() < 0.5 ? -1 : 1;
const pick = arr => arr[srand() * arr.length | 0];

/* colors are [r,g,b]; col() builds rgba strings, mixRGB blends */
function col(c, a = 1) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }
function mixRGB(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

/* ------------------------------------------------------------- palettes */
/* Each night of the pilgrimage owns a palette. Nights IV–VI revisit the road
   colder and deeper; Night VII+ flies under the Last Night violet. */
const PAL_BASE = [
  { // Night I — The Meadow
    skyTop: [7, 9, 30], skyMid: [16, 24, 58], skyHor: [44, 58, 96],
    haze: [70, 86, 122], cloud: [10, 14, 34],
    ground0: [24, 34, 40], ground1: [9, 13, 17], groundLit: [98, 146, 124],
    sil: [9, 12, 22], sil2: [14, 19, 33],
    moon: [235, 238, 216], moonGlow: [178, 200, 186], star: [202, 212, 238],
    dome: [255, 150, 60], domeA: 0.0,
    water: 0, moonSize: 0.16, starA: 1.0,
  },
  { // Night II — The Powerline Road
    skyTop: [11, 9, 27], skyMid: [34, 22, 46], skyHor: [104, 58, 40],
    haze: [128, 78, 50], cloud: [22, 13, 26],
    ground0: [38, 28, 21], ground1: [14, 11, 9], groundLit: [150, 112, 72],
    sil: [15, 10, 18], sil2: [24, 15, 24],
    moon: [216, 210, 186], moonGlow: [170, 160, 140], star: [190, 180, 200],
    dome: [255, 148, 56], domeA: 0.34,
    water: 0, moonSize: 0.135, starA: 0.32,
  },
  { // Night III — The Lighthouse Shore
    skyTop: [5, 9, 28], skyMid: [12, 24, 56], skyHor: [36, 60, 98],
    haze: [66, 92, 128], cloud: [8, 13, 30],
    ground0: [16, 28, 50], ground1: [6, 11, 22], groundLit: [118, 158, 156],
    sil: [7, 11, 21], sil2: [11, 17, 30],
    moon: [238, 241, 222], moonGlow: [185, 208, 196], star: [206, 216, 240],
    dome: [255, 170, 80], domeA: 0.08,
    water: 1, moonSize: 0.185, starA: 1.0,
  },
];
/* variant tinting per lap of the road */
function palVariant(base, night) {
  const p = {}; for (const k in base) p[k] = Array.isArray(base[k]) ? base[k].slice() : base[k];
  const lap = Math.floor((night - 1) / 3);
  if (night >= 7) { // The Last Night — violet, enormous moon
    p.skyTop = mixRGB(p.skyTop, [26, 8, 46], 0.62); p.skyMid = mixRGB(p.skyMid, [46, 18, 70], 0.5);
    p.skyHor = mixRGB(p.skyHor, [96, 44, 96], 0.42); p.haze = mixRGB(p.haze, [140, 90, 150], 0.4);
    p.moonSize *= 1.25; p.moonGlow = mixRGB(p.moonGlow, [220, 190, 230], 0.5);
    p.groundLit = mixRGB(p.groundLit, [150, 110, 160], 0.4);
  } else if (lap === 1) { // Nights IV–VI — high, cold moon
    p.skyTop = mixRGB(p.skyTop, [2, 6, 20], 0.5); p.skyMid = mixRGB(p.skyMid, [10, 22, 50], 0.4);
    p.moon = mixRGB(p.moon, [240, 248, 255], 0.5); p.moonGlow = mixRGB(p.moonGlow, [200, 225, 235], 0.5);
    p.starA = Math.min(1, p.starA + 0.15); p.moonSize *= 1.08;
  }
  return p;
}

const PLAYER_TINT = [205, 240, 214];   // luna green
const SODIUM = [255, 158, 66];         // the Glare
const ZAPPURPLE = [186, 130, 255];     // bug-zapper arc
const EMBER = [255, 120, 52];
const SILVER = [225, 236, 230];
const DANGER = [255, 84, 56];

/* ================================================================== AUDIO
   Everything you hear is synthesized here: a music-box nocturne on D-minor
   pentatonic, crickets, waves, an owl — and the Glare's leitmotif, a 60 Hz
   mains hum that is deliberately out of key with the night. */
let AC = null, MASTER = null, SFXBUS = null, MUSBUS = null, AMBUS = null, VERB = null;
let NOISEBUF = null, humOsc = null, humOsc2 = null, humGain = null, waveNode = null, waveGain = null;
const MUS = {
  bpm: 66, nextT: 0, beat: 0, running: false,
  padStep: -1, melLast: 7, level: 0, boss: false,
  cricket: 0.5, wave: 0, humTarget: 0, ducked: 0, cricketNext: 0, owlNext: 8,
};
const SCALE = [0, 3, 5, 7, 10]; // D minor pentatonic (semitones from D)
const noteHz = (deg, oct = 0) => 293.665 * Math.pow(2, (SCALE[((deg % 5) + 5) % 5] + 12 * (Math.floor(deg / 5) + oct)) / 12);
const PADS = [ // chord tones as scale degrees, 2 bars each
  [-5, -3, 0], [-7, -5, -2], [-5, -2, 0], [-6, -4, -1],
];

function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  MASTER = AC.createGain(); MASTER.gain.value = G.muted ? 0 : 0.9;
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 22; comp.ratio.value = 5;
  MASTER.connect(comp); comp.connect(AC.destination);
  SFXBUS = AC.createGain(); SFXBUS.gain.value = 0.9; SFXBUS.connect(MASTER);
  MUSBUS = AC.createGain(); MUSBUS.gain.value = 0.8; MUSBUS.connect(MASTER);
  AMBUS = AC.createGain(); AMBUS.gain.value = 0.9; AMBUS.connect(MASTER);
  // impulse reverb, generated
  const len = AC.sampleRate * 1.7, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6) * 0.5; }
  VERB = AC.createConvolver(); VERB.buffer = ir;
  const vg = AC.createGain(); vg.gain.value = 0.9; VERB.connect(vg); vg.connect(MASTER);
  NOISEBUF = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  { const d = NOISEBUF.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  // the mains hum — always alive, usually silent
  humGain = AC.createGain(); humGain.gain.value = 0;
  const hlp = AC.createBiquadFilter(); hlp.type = 'lowpass'; hlp.frequency.value = 420;
  humOsc = AC.createOscillator(); humOsc.type = 'sawtooth'; humOsc.frequency.value = 60;
  humOsc2 = AC.createOscillator(); humOsc2.type = 'sine'; humOsc2.frequency.value = 120.4;
  humOsc.connect(hlp); humOsc2.connect(hlp); hlp.connect(humGain); humGain.connect(AMBUS);
  humOsc.start(); humOsc2.start();
  // waves — looped filtered noise, gain driven per stage
  waveGain = AC.createGain(); waveGain.gain.value = 0;
  waveNode = AC.createBufferSource(); waveNode.buffer = NOISEBUF; waveNode.loop = true;
  const wlp = AC.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 380;
  const wlfoG = AC.createGain(); wlfoG.gain.value = 140;
  const wlfo = AC.createOscillator(); wlfo.frequency.value = 0.11; wlfo.connect(wlfoG); wlfoG.connect(wlp.frequency); wlfo.start();
  waveNode.connect(wlp); wlp.connect(waveGain); waveGain.connect(AMBUS);
  waveNode.start();
  MUS.nextT = AC.currentTime + 0.1; MUS.running = true;
}

function verbSend(node, amt) { const g = AC.createGain(); g.gain.value = amt; node.connect(g); g.connect(VERB); }

/* one-shot tone helper */
function tone(o) {
  if (!AC) return;
  const t0 = o.at || AC.currentTime;
  const osc = AC.createOscillator(); osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f0, t0);
  if (o.f1) o.slide === 'lin'
    ? osc.frequency.linearRampToValueAtTime(o.f1, t0 + o.dur)
    : osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + o.dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.g || 0.2, t0 + (o.a || 0.008));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
  osc.connect(g); g.connect(o.dest || SFXBUS);
  if (o.verb) verbSend(g, o.verb);
  osc.start(t0); osc.stop(t0 + o.dur + 0.05);
}
/* one-shot noise helper */
function noiseHit(o) {
  if (!AC) return;
  const t0 = o.at || AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = NOISEBUF;
  src.playbackRate.value = o.rate || 1;
  const f = AC.createBiquadFilter(); f.type = o.ftype || 'bandpass';
  f.frequency.setValueAtTime(o.f0 || 1000, t0);
  if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + o.dur);
  f.Q.value = o.q || 0.9;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.g || 0.2, t0 + (o.a || 0.004));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
  src.connect(f); f.connect(g); g.connect(o.dest || SFXBUS);
  if (o.verb) verbSend(g, o.verb);
  src.start(t0, Math.random() * 1.2); src.stop(t0 + o.dur + 0.05);
}
/* celesta / music box voice — the Moon's instrument */
function celesta(deg, oct, t0, vel, dest) {
  if (!AC) return;
  const f = noteHz(deg, oct);
  tone({ type: 'sine', f0: f, dur: 0.9, g: vel, a: 0.004, at: t0, dest: dest, verb: 0.5 });
  tone({ type: 'sine', f0: f * 2.52, dur: 0.35, g: vel * 0.34, a: 0.002, at: t0, dest: dest, verb: 0.3 });
  tone({ type: 'sine', f0: f * 1.007, dur: 0.7, g: vel * 0.25, a: 0.004, at: t0, dest: dest });
}

/* --------------------------------------------------------------- the score */
function musicTick() {
  if (!AC || !MUS.running) return;
  MUS.bpm = G.boss ? 122 : [66, 78, 88][G.stage] + Math.min(14, (G.night - 1) * 3);
  const spb = 60 / MUS.bpm;
  // ambient targets ease continuously
  const k = 0.04;
  MUS.cricket += (cricketTarget() - MUS.cricket) * k;
  MUS.wave += ((G.stage === 2 && !G.muted ? 0.16 : 0) - MUS.wave) * k;
  if (waveGain) waveGain.gain.value = MUS.wave * (G.paused ? 0 : 1);
  if (humGain) {
    const hum = G.muted || G.paused ? 0 : humTarget();
    humGain.gain.value += (hum - humGain.gain.value) * 0.06;
  }
  while (MUS.nextT < AC.currentTime + 0.14) {
    scheduleBeat(MUS.nextT, MUS.beat, spb);
    MUS.nextT += spb / 2; // schedule on eighth notes
    MUS.beat++;
  }
}
function cricketTarget() {
  if (G.muted || G.paused) return 0;
  if (G.mode === 'title' || G.mode === 'over') return 0.5;
  if (G.boss) return 0;
  return [0.5, 0.1, 0.26][G.stage];
}
function humTarget() {
  if (G.mode === 'title') return 0;
  if (G.boss) return 0.05 + (G.bossRef && G.bossRef.ph === 2 ? 0.02 : 0);
  let t = G.stage === 1 ? 0.016 : 0.004;
  return t + Math.min(0.03, G.nearHum || 0);
}
function scheduleBeat(t, e, spb) {
  const inPlay = G.mode === 'play' || G.mode === 'bossintro' || G.mode === 'bossdie';
  const beat = e >> 1, eighth = e & 1, bar = beat >> 2, pos = beat & 3;
  const intensity = MUS.level;
  // crickets live off-grid
  if (MUS.cricket > 0.02 && t > MUS.cricketNext) {
    MUS.cricketNext = t + rand(0.28, 0.75);
    const n = 3 + (srand() * 3 | 0), g = MUS.cricket * rand(0.05, 0.1);
    for (let i = 0; i < n; i++)
      noiseHit({ f0: rand(3800, 4600), q: 12, dur: 0.045, g: g, at: t + i * 0.052, dest: AMBUS });
  }
  if (G.stage === 0 && !G.boss && MUS.cricket > 0.2 && t > MUS.owlNext) {
    MUS.owlNext = t + rand(9, 22);
    tone({ type: 'sine', f0: 392, f1: 330, dur: 0.38, g: 0.05, a: 0.06, at: t, dest: AMBUS, verb: 0.6 });
    tone({ type: 'sine', f0: 370, f1: 300, dur: 0.62, g: 0.045, a: 0.06, at: t + 0.5, dest: AMBUS, verb: 0.6 });
  }
  if (!inPlay && G.mode !== 'title') return;
  if (G.paused) return;
  if (eighth === 0) {
    // heart-pulse
    const pulseOn = G.boss ? true : (G.stage === 0 ? (pos === 0 || pos === 2) : true);
    if (pulseOn && G.mode !== 'title')
      tone({ type: 'sine', f0: 82, f1: 40, dur: 0.22, g: G.boss ? 0.34 : 0.22, a: 0.004, at: t, dest: MUSBUS });
    if (G.boss && pos === 2)
      noiseHit({ f0: 900, f1: 300, dur: 0.12, g: 0.1, at: t, dest: MUSBUS });
    // pads change every 2 bars
    const step = bar >> 1;
    if (pos === 0 && (bar & 1) === 0 && step !== MUS.padStep) {
      MUS.padStep = step;
      const chord = PADS[step % PADS.length];
      for (const d of chord) {
        const f = noteHz(d, -1);
        tone({ type: 'triangle', f0: f, dur: spb * 8.4, g: G.boss ? 0.045 : 0.062, a: spb * 1.4, at: t, dest: MUSBUS, verb: 0.7 });
        tone({ type: 'triangle', f0: f * 1.004, dur: spb * 8.4, g: 0.03, a: spb * 1.6, at: t, dest: MUSBUS });
      }
    }
    if (G.stage === 2 && !G.boss && pos === 0 && bar % 4 === 2) { // buoy bell
      tone({ type: 'sine', f0: 466, dur: 2.2, g: 0.055, a: 0.005, at: t, dest: AMBUS, verb: 0.85 });
      tone({ type: 'sine', f0: 699, dur: 1.4, g: 0.028, a: 0.005, at: t, dest: AMBUS, verb: 0.85 });
    }
  }
  // melody — the music box, wandering the pentatonic
  const dens = G.mode === 'title' ? 0.16 : 0.2 + intensity * 0.3 + (G.boss ? 0.18 : 0);
  if (srand() < dens && !(G.boss && eighth === 1 && srand() < 0.5)) {
    let step = MUS.melLast + (pick([-2, -1, -1, 1, 1, 2]) | 0);
    step = clamp(step, 3, 14); MUS.melLast = step;
    celesta(step, 0, t, 0.05 + srand() * 0.045 + intensity * 0.02, MUSBUS);
    if (srand() < 0.14) celesta(step + 2, 0, t + spb / 4, 0.035, MUSBUS);
  }
  if (G.boss && eighth === 0) { // alarm arpeggio riding the hum
    const arp = [0, 2, 3, 5][pos];
    tone({ type: 'square', f0: noteHz(arp, 1), dur: 0.1, g: 0.026, a: 0.004, at: t, dest: MUSBUS });
  }
}

/* ------------------------------------------------------------------ SFX */
let shootSeq = 0, lastSizzle = 0, lastTink = 0;
function sfxShoot() {
  const seq = [7, 9, 10, 12, 10, 9]; // in-key grace notes
  celesta(seq[shootSeq++ % seq.length], 0, 0, 0.045, SFXBUS);
  noiseHit({ f0: 2600, f1: 5200, dur: 0.07, g: 0.05, q: 2 });
}
function sfxPop(big) {
  tone({ type: 'square', f0: 620, f1: 140, dur: 0.09, g: 0.16 });
  noiseHit({ f0: 3400, dur: 0.06, g: 0.16, q: 1.4 });
  tone({ type: 'sine', f0: rand(2500, 3300), dur: 0.3, g: 0.08, verb: 0.5 });
  if (big) { // power-down whine — a light dying
    tone({ type: 'sawtooth', f0: 420, f1: 52, dur: 0.42, g: 0.09 });
    tone({ type: 'sine', f0: 130, f1: 46, dur: 0.34, g: 0.2 });
  }
}
function sfxGraze() { noiseHit({ f0: 700, f1: 2600, dur: 0.19, g: 0.11, q: 1.6 }); }
function sfxHit() {
  tone({ type: 'sine', f0: 120, f1: 36, dur: 0.5, g: 0.5 });
  noiseHit({ f0: 1800, f1: 300, dur: 0.4, g: 0.3, q: 0.8 });
  tone({ type: 'sawtooth', f0: 3200, f1: 700, dur: 0.2, g: 0.07 });
  duck(0.3, 0.5);
}
function sfxWeb() {
  tone({ type: 'triangle', f0: 240, f1: 190, dur: 0.3, g: 0.18, slide: 'lin' });
  tone({ type: 'triangle', f0: 355, f1: 300, dur: 0.22, g: 0.1, slide: 'lin', at: AC ? AC.currentTime + 0.04 : 0 });
}
function sfxBat() {
  if (!AC) return; const t0 = AC.currentTime;
  for (let i = 0; i < 3; i++) noiseHit({ f0: 3000, dur: 0.02, g: 0.13, q: 8, at: t0 + i * 0.1 });
}
function sfxBuzz() {
  if (!AC) return;
  tone({ type: 'sawtooth', f0: 88, f1: 118, dur: 0.55, g: 0.07, slide: 'lin' });
  tone({ type: 'sawtooth', f0: 177, f1: 235, dur: 0.55, g: 0.035, slide: 'lin' });
}
function sfxZap() {
  noiseHit({ f0: 2400, f1: 500, dur: 0.1, g: 0.15, ftype: 'highpass' });
  tone({ type: 'square', f0: 1300, f1: 240, dur: 0.09, g: 0.06 });
}
function sfxSizzle() {
  if (!AC || AC.currentTime - lastSizzle < 0.1) return; lastSizzle = AC.currentTime;
  noiseHit({ f0: rand(3000, 5000), dur: 0.07, g: 0.07, q: 3 });
}
function sfxHorn() {
  tone({ type: 'sawtooth', f0: 92, f1: 148, dur: 1.0, g: 0.11, a: 0.35, slide: 'lin', verb: 0.6 });
  tone({ type: 'sine', f0: 184, f1: 296, dur: 1.0, g: 0.06, a: 0.35, slide: 'lin', verb: 0.6 });
}
function sfxTink() {
  if (!AC || AC.currentTime - lastTink < 0.045) return; lastTink = AC.currentTime;
  tone({ type: 'sine', f0: rand(2800, 3800), dur: 0.1, g: 0.06 });
}
function sfxVent() {
  noiseHit({ f0: 2000, f1: 600, dur: 0.7, g: 0.09, q: 1.2 });
  tone({ type: 'sine', f0: 1400, f1: 500, dur: 0.6, g: 0.05 });
}
function sfxShatter() {
  noiseHit({ f0: 2600, f1: 700, dur: 0.9, g: 0.4, q: 0.7 });
  tone({ type: 'sine', f0: 140, f1: 30, dur: 1.1, g: 0.5 });
  if (AC) for (let i = 0; i < 12; i++)
    tone({ type: 'sine', f0: rand(1800, 4600), dur: rand(0.15, 0.5), g: 0.05, at: AC.currentTime + rand(0, 0.5), verb: 0.6 });
  duck(0.25, 0.9);
}
function sfxCard() {
  tone({ type: 'sine', f0: 220, dur: 2.4, g: 0.09, a: 0.01, verb: 0.85 });
  tone({ type: 'sine', f0: 331, dur: 1.7, g: 0.05, a: 0.01, verb: 0.85 });
  if (AC) { celesta(7, 0, AC.currentTime + 0.12, 0.07, MUSBUS); celesta(10, 0, AC.currentTime + 0.3, 0.06, MUSBUS); }
}
function sfxHeal() {
  if (!AC) return; const t0 = AC.currentTime;
  [7, 9, 12, 14].forEach((d, i) => celesta(d, 0, t0 + i * 0.09, 0.07, SFXBUS));
}
function sfxUi() { tone({ type: 'sine', f0: 1200, dur: 0.05, g: 0.05 }); }
function duck(to, dur) {
  if (!AC || G.muted) return;
  MASTER.gain.cancelScheduledValues(AC.currentTime);
  MASTER.gain.setValueAtTime(0.9 * to, AC.currentTime);
  MASTER.gain.linearRampToValueAtTime(0.9, AC.currentTime + dur);
}
function setMuted(m) {
  G.muted = m;
  try { localStorage.setItem('actias_mute', m ? '1' : '0'); } catch (e) {}
  if (MASTER) MASTER.gain.value = m ? 0 : 0.9;
}

/* ============================================================== CANVAS */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function layout() {

  DPR = Math.min(2, window.devicePixelRatio || 1);

  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  K = H * 1.02; HOR = H * 0.37;

    hud: `600 ${(2.1 * u).toFixed(1)}px "Avenir Next","Segoe UI",Helvetica,sans-serif`,

function offCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(2, w | 0); c.height = Math.max(2, h | 0); return c; }

function buildStars() {
  stars = [];
  const n = Math.round(210 * (W / 1400));
  for (let i = 0; i < n; i++) stars.push({
    x: srand(), y: srand() * srand(), s: rand(0.6, 1.9), tw: rand(TAU), spd: rand(0.4, 1.6),
  });
}
function buildSilhouettes() {
  // one jagged treeline, one town skyline, one dune/shore line — index by stage
  silPts = [[], [], []];
  let y = 0.42;
  for (let x = 0; x <= 1.25; x += 0.006) { // treeline: soft noise walk bristling with conifers
    y = clamp(y + rand(-0.09, 0.09), 0.14, 0.7);
    const spike = srand() < 0.3 ? rand(0.14, 0.5) : 0;
    silPts[0].push([x, y * 0.55 + spike]);
  }
  let bx = 0; // skyline: flat roofs, chimneys, a water tower, aerials
  while (bx < 1.25) {
    const bw = rand(0.02, 0.075), bh = srand() < 0.14 ? rand(0.55, 0.95) : rand(0.12, 0.45);
    silPts[1].push([bx, bh, bw, srand() < 0.22 ? 1 : 0]);
    bx += bw + rand(0.001, 0.02);
  }
  for (let x = 0; x <= 1.25; x += 0.03) silPts[2].push([x, rand(0.04, 0.12)]); // low dunes
}
function makeGlow(c, r) {
  const s = offCanvas(r * 2, r * 2), g = s.getContext('2d');
  const gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, col(c, 0.85)); gr.addColorStop(0.35, col(c, 0.28)); gr.addColorStop(1, col(c, 0));
  g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
  return s;
}
function buildSprites() {
  glowSpr = {
    luna: makeGlow(PLAYER_TINT, 64), sodium: makeGlow(SODIUM, 64), zap: makeGlow(ZAPPURPLE, 64),
    ember: makeGlow(EMBER, 48), silver: makeGlow(SILVER, 64), firefly: makeGlow([255, 224, 140], 40),
    danger: makeGlow(DANGER, 64),
  };
  // moon: disc with maria + separate halo
  const mr = Math.max(40, H * 0.24) | 0;
  moonSpr = offCanvas(mr * 2, mr * 2);
  const g = moonSpr.getContext('2d');
  g.fillStyle = '#e9edda';
  g.beginPath(); g.arc(mr, mr, mr * 0.62, 0, TAU); g.fill();
  g.globalAlpha = 0.16; g.fillStyle = '#7f8a86';
  const blobs = [[-0.18, -0.22, 0.3], [0.16, -0.02, 0.24], [-0.05, 0.24, 0.19], [0.28, 0.3, 0.12], [-0.32, 0.1, 0.13]];
  for (const b of blobs) { g.beginPath(); g.arc(mr + b[0] * mr, mr + b[1] * mr, b[2] * mr * 0.62 * 2, 0, TAU); g.fill(); }
  g.globalAlpha = 0.1; g.fillStyle = '#fff';
  g.beginPath(); g.arc(mr - mr * 0.14, mr - mr * 0.18, mr * 0.5, 0, TAU); g.fill();
  moonHalo = makeGlow([210, 225, 205], mr);
}
function buildVignette() {
  vinSpr = offCanvas(W / 2, H / 2);
  const g = vinSpr.getContext('2d');
  const gr = g.createRadialGradient(W / 4, H / 4, H * 0.22, W / 4, H / 4, H * 0.62);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(2,3,10,0.44)');
  g.fillStyle = gr; g.fillRect(0, 0, W / 2, H / 2);
}
function buildLogo() {
  const fs = H * 0.15, pad = fs * 0.9;
  const probe = offCanvas(10, 10).getContext('2d');
  probe.font = `400 ${fs}px Didot,"Bodoni 72",Georgia,serif`;
  const text = 'ACTIAS', ls = fs * 0.24;
  let tw = 0; for (const ch of text) tw += probe.measureText(ch).width + ls;
  logoSpr = offCanvas(tw + pad * 2, fs * 1.6 + pad * 2);
  const g = logoSpr.getContext('2d');
  g.font = probe.font; g.textBaseline = 'middle';
  const cy = logoSpr.height / 2;
  // soft bloom: many low-alpha jittered passes, then crisp core
  for (let pass = 0; pass < 14; pass++) {
    g.fillStyle = col(PLAYER_TINT, 0.05);
    let x = pad + rand(-3, 3);
    const jy = rand(-3, 3);
    for (const ch of text) { g.fillText(ch, x, cy + jy); x += probe.measureText(ch).width + ls; }
  }
  let x = pad; g.fillStyle = '#eafbee';
  for (const ch of text) { g.fillText(ch, x, cy); x += probe.measureText(ch).width + ls; }
}

const PRJ = { x: 0, y: 0, s: 0 };
function prj(x, y, z) {
  const s = K / z;

function director(dt) {
  if (G.mode !== 'play' || G.boss) return;
  const D = DIRECTOR[G.stage];
  for (const s of D.setpieces) {
    if (!s.done && G.stageT >= s.at) { s.done = true; s.fn(); }
  }
  // onboarding: the first night teaches by being gentle
  const gate = (G.night === 1 && G.stage === 0) ? 10 : 2.2;
  if (G.stageT < gate) return;
  G.spawnT -= dt;
  if (G.spawnT <= 0 && G.objects.length < 64) {
    const speedup = 1 - 0.28 * G.intensity - Math.min(0.22, (G.night - 1) * 0.05);
    G.spawnT = D.int * speedup * rand(0.75, 1.25);
    let tot = 0; for (const e of D.table) tot += e[1];
    let r = rand(tot);
    for (const e of D.table) { r -= e[1]; if (r <= 0) { e[0](); break; } }
  }
  // the lighthouse sweeps the shore
  if (G.stage === 2 && G.stageT > 10 && !G.beam) {
    G.beamCD -= dt;
    if (G.beamCD <= 0) {
      G.beamCD = rand(11, 15); G.beam = { st: 'tell', t: 0, dir: randSign() }; sfxHorn();
      if (!G.beamSeen) { G.beamSeen = true; popup('THE LAMP RAKES LOW — FLY HIGH', 0, 5.6, 26, SODIUM, 1.1); }
    }
  }
}

function stageOnboarding() {
  if (G.night !== 1 || G.stage !== 0) return;
  queueAt(2.6, () => spCinderChain(5, true));
  queueAt(5.6, () => spStalk(rand(-2, 2), 120));
  queueAt(7.4, () => spCinderChain(6));
  queueAt(9.0, () => spStalk(-2.6, 120));
  queueAt(9.4, () => spStalk(2.6, 121));
}

function shuffleAtk(ph) {
  const a = ph === 1 ? ['A', 'B', 'C'] : ['A', 'B', 'C', 'D'];
  for (let i = a.length - 1; i > 0; i--) { const j = srand() * (i + 1) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;

function ventOpen() { sfxVent(); popup('IT VENTS — STRIKE', G.bossRef.x, G.bossRef.y + 2.6, G.bossRef.z, PLAYER_TINT, 1.05); }

/* ======================================================== MODE / STAGES */

/* ============================================================== COMBAT */
function shake(n) { G.shake = Math.max(G.shake, n); }

function addKillScore(base, x, y, z, label) {

function killObj(o, silent) {
  if (o.dead) return; o.dead = true;

function playerHit(src) {

  if (G.bossRef && G.bossRef.st === 'enter') return;
  G.hp--; G.inv = 2.3; G.streak = 0; G.mult = 1;
  P.tatter = Math.min(2, P.tatter + 1);
  G.hitstop = 0.16; shake(26); flash(DANGER, 0.55);
  burst('dust', P.x, P.y, PZ, 18, 7, 1, 4, PLAYER_TINT);

/* ============================================================== UPDATE */
const keys = {};
const mouse = { x: 0, y: 0, down: false, t: -9 };
let fireHeld = false;

function controlVector() {
  let tx = 0, ty = 0, useMouse = false;
  if (keys.left) tx -= 1; if (keys.right) tx += 1;
  if (keys.up) ty += 1; if (keys.down) ty -= 1;
  if (tx === 0 && ty === 0 && G.t - mouse.t < 2.5) useMouse = true;
  return { tx, ty, useMouse };
}
function updatePlayer(dt) {
  if (G.mode === 'title') { // attract drift
    P.x = Math.sin(G.t * 0.5) * 2.2; P.y = 3.5 + Math.sin(G.t * 0.83) * 0.6;
    P.vx = Math.cos(G.t * 0.5) * 1.1; P.vy = Math.cos(G.t * 0.83) * 0.5;
  } else if (G.mode === 'play') {
    const c = controlVector();
    let ax, ay;
    if (c.useMouse) {
      const wx = clamp((mouse.x - W / 2) * PZ / K + CAM.x, -XLIM, XLIM);
      const wy = clamp((HOR - mouse.y) * PZ / K + CAM.y, YMIN, YMAX);
      ax = (wx - P.x) * 10.5; ay = (wy - P.y) * 10.5;
      ax = clamp(ax, -95, 95); ay = clamp(ay, -80, 80);
      P.vx += (clamp(ax, -1e3, 1e3) * dt); P.vy += ay * dt;
      P.vx *= Math.pow(0.0015, dt); P.vy *= Math.pow(0.0015, dt);
    } else {
      const MAXV = 11.5, MAXVY = 9;
      P.vx += (c.tx * MAXV - P.vx) * Math.min(1, dt * 7.2);
      P.vy += (c.ty * MAXVY - P.vy) * Math.min(1, dt * 7.2);
    }
    P.x += P.vx * dt; P.y += P.vy * dt;
    if (P.x < -XLIM) { P.x = -XLIM; P.vx *= -0.25; }
    if (P.x > XLIM) { P.x = XLIM; P.vx *= -0.25; }
    if (P.y < YMIN) { P.y = YMIN; P.vy *= -0.25; }
    if (P.y > YMAX) { P.y = YMAX; P.vy *= -0.25; }
  } else if (G.mode === 'dying') {
    P.x += P.vx * dt; P.vy -= 9 * dt; P.y = Math.max(0.1, P.y + P.vy * dt);
    P.bank += dt * 9;
  }
  if (G.mode !== 'dying') {
    const targetBank = clamp(P.vx * 0.075, -0.66, 0.66);
    P.bank += (targetBank - P.bank) * Math.min(1, dt * 8);
  }
  P.flap += dt * (8.5 + Math.max(0, P.vy) * 1.1 + (G.mode === 'dying' ? -5 : 0));
  // dust wake — she sheds moonlight as she flies
  if (G.mode !== 'over' && srand() < 0.75) {
    part('dust', P.x + rand(-0.5, 0.5), P.y + rand(-0.3, 0.3), PZ + rand(-0.1, 0.1),
      rand(-0.5, 0.5) - P.vx * 0.14, rand(-0.3, 0.5), rand(-3.5, -2),
      rand(0.5, 1.1), rand(1.6, 3.4), PLAYER_TINT);
  }
  if (Math.abs(P.vx) > 7 && srand() < 0.5)
    part('dust', P.x - Math.sign(P.vx) * 0.9, P.y, PZ, -P.vx * 0.22, rand(-0.5, 0.8), -2.5, 0.7, 2.5, PLAYER_TINT);
  // camera follows with a lean
  CAM.x += (P.x * 0.46 - CAM.x) * Math.min(1, dt * 5);
  CAM.y += ((2.55 + (P.y - 2.55) * 0.42) - CAM.y) * Math.min(1, dt * 5);
}

function fire() {
  if (G.coolFire > 0 || G.mode !== 'play') return;
  G.coolFire = 0.13;
  G.shots.push({ x: P.x, y: P.y + 0.12, z: PZ + 0.4, t: 0 });
  G.muzzle = 0.09;
  sfxShoot();
}
function updateShots(dt) {
  for (const s of G.shots) {
    s.t += dt; s.z += 92 * dt;
    if (s.z > 118) s.dead = true;
  }
  for (const b of G.bolts) {
    b.t += dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += (b.vz - (b.boss ? 0 : G.spd * 0.3)) * dt;
    if (b.z < PZ - 3 || b.t > 7 || b.y < 0 || b.y > 14 || Math.abs(b.x) > 22) b.dead = true;
    else if (G.mode === 'play' && G.inv <= 0 && Math.abs(b.z - PZ) < 1.1) {
      const dx = b.x - P.x, dy = b.y - P.y;
      if (dx * dx + dy * dy < (b.r + 0.5) * (b.r + 0.5)) { b.dead = true; playerHit('bolt'); }
    }
  }
  G.shots = G.shots.filter(s => !s.dead);
  G.bolts = G.bolts.filter(b => !b.dead);
}

/* per-kind object simulation */
function updateObjects(dt) {
  const spd = G.spd;
  let nearHum = 0;
  for (const o of G.objects) {
    o.t += dt; o.pz = o.z;
    if (o.k !== 'bat' && o.k !== 'garc') o.z -= spd * dt;
    switch (o.k) {
      case 'cinder':
        o.x = o.x0 + Math.sin(o.t * o.w + o.ph) * o.A;
        o.y = clamp(o.y0 + Math.sin(o.t * o.w * 0.7 + o.ph * 1.3) * o.B, 0.6, 7);
        break;
      case 'pyr': {
        if (o.del > 0) { o.del -= dt; break; }
        const k = Math.min(1, dt * 1.6);
        o.swirl += dt * 5;
        o.x += ((o.tx + Math.sin(o.swirl) * 0.8) - o.x) * k;
        o.y += ((o.ty + Math.cos(o.swirl * 0.8) * 0.5) - o.y) * k;
        o.z -= 6 * dt; // they press in faster than the world streams
        if (srand() < 0.3) part('pop', o.x, o.y, o.z, rand(-1, 1), rand(-1, 0), 2, 0.4, 2, EMBER);
        break;
      }
      case 'bat':
        o.z += (PZ + 0.3 - o.z) * Math.min(1, dt * 1.4); // closes to the moth's own depth
        if (o.st === 0) { // hover + echolocation tell
          o.stT += dt; o.ring += dt;
          o.x += (o.side * 8.6 - o.x) * Math.min(1, dt * 2);
          o.y += (P.y - o.y) * Math.min(1, dt * 1.1);
          if (o.ring > 0.32) { o.ring = 0; sfxBat(); }
          if (o.stT > 1.0) { o.st = 1; o.lockx = -o.side * 14; o.locky = P.y; }
        } else { // the dart
          o.x += -o.side * 26 * dt;
          o.y += (o.locky - o.y) * Math.min(1, dt * 6);
          if (o.x * o.side < -14) o.dead = true;
        }
        break;
      case 'zap':
        o.bob += dt;
        o.y += Math.sin(o.bob * 2.1) * dt * 0.5;
        if (o.z < 42 && o.st === 0) { o.st = 1; o.stT = 0; }
        if (o.st === 1) {
          o.z += spd * dt * 0.92; // hangs in the air, nearly stationary
          o.stT += dt;
          if (o.stT > 1.5) {
            o.stT = 0; o.volley++;
            sfxZap(); burst('spark', o.x, o.y, o.z, 5, 4, 0.4, 3, ZAPPURPLE);
            if (o.volley & 1) { // aimed
              const dx = P.x - o.x, dy = P.y - o.y, m = Math.hypot(dx, dy) || 1;
              G.bolts.push({ x: o.x, y: o.y, z: o.z, vx: dx / m * 6, vy: dy / m * 6, vz: -26, r: 0.45, t: 0 });
            } else for (let i = 0; i < 6; i++) { // radial
              const a = i / 6 * TAU + o.volley;
              G.bolts.push({ x: o.x, y: o.y, z: o.z, vx: Math.cos(a) * 4.6, vy: Math.sin(a) * 4.6, vz: -22, r: 0.45, t: 0 });
            }
            if (o.volley >= 3) o.st = 2;
          }
        }
        if (o.z < 55) nearHum = Math.max(nearHum, 0.03 * (1 - Math.abs(o.z - 30) / 30));
        break;
      case 'beet':
        o.wob += dt;
        if (o.st === 0) { o.z -= spd * dt * 0.1; if (o.z < 40) { o.st = 1; o.stT = 0; sfxBuzz(); } }
        else if (o.st === 1) { // telegraphed wind-up
          o.stT += dt; o.z += spd * dt; // hold position
          o.x += Math.sin(o.stT * 30) * dt * 2;
          if (o.stT > 0.75) { o.st = 2; o.lockx = P.x; o.locky = P.y; sfxBuzz(); }
        } else { // ram
          o.x += (o.lockx - o.x) * Math.min(1, dt * 3.2);
          o.y += (o.locky - o.y) * Math.min(1, dt * 3.2);
          o.z -= 34 * dt;
        }
        break;
      case 'eel': {
        o.ph += dt * 2.8;
        o.x += Math.cos(o.ph * 0.61) * 2.4 * dt;
        o.y = clamp(2.4 + Math.sin(o.ph) * 1.7, 0.7, 6);
        for (let i = 0; i < o.hist.length; i++) o.hist[i].z -= spd * dt; // the body streams with the world
        o.hist.unshift({ x: o.x, y: o.y, z: o.z });
        if (o.hist.length > o.segN * 4) o.hist.pop();
        if (srand() < 0.2) { const h = o.hist[(srand() * o.hist.length) | 0]; part('spark', h.x, h.y, h.z, rand(-1, 1), rand(-1, 1), 0, 0.3, 2.4, ZAPPURPLE); }
        break;
      }
      case 'sw':
        o.ph += dt * 3;
        o.x += Math.cos(o.ph) * dt * 1.4; o.y += Math.sin(o.ph * 1.3) * dt * 1.1;
        break;
      case 'garc': // the boss's filament lash racing along the ground
        o.z -= o.spd * dt;
        if (srand() < 0.8) part('spark', o.x + rand(-0.5, 0.5), rand(0.1, 1.4), o.z, rand(-2, 2), rand(0, 4), 0, 0.25, 3, ZAPPURPLE);
        if (o.z < PZ - 2) o.dead = true;
        break;
      case 'lamp':
        if (!o.lit) break;
        o.flick = srand() < 0.02 ? 0.5 : Math.max(0, o.flick - dt * 3);
        if (o.z < 45) nearHum = Math.max(nearHum, 0.022 * (1 - Math.abs(o.z - 25) / 25));
        break;
    }
    if (o.z < PZ - 3.5 && o.k !== 'bat') o.dead = true;
    if (o.k === 'bat' && o.t > 8) o.dead = true;
  }
  G.nearHum += (nearHum - G.nearHum) * Math.min(1, dt * 3);
  G.objects = G.objects.filter(o => !o.dead);
}

/* collisions: shots→enemies, player→world */
function collide(dt) {
  // shots vs things
  for (const s of G.shots) {
    if (s.dead) continue;
    for (const o of G.objects) {
      if (o.dead || o.k === 'garc') continue;
      const dz = o.z - s.z;
      if (dz < -1.6 || dz > 2.6) continue;
      if (o.en) {
        const oy = o.y === undefined ? (o.h || 1) * 0.7 : o.y;
        const dx = o.x - s.x, dy = oy - s.y, rr = o.r + 0.55;
        if (dx * dx + dy * dy < rr * rr) {
          s.dead = true;
          o.hp--;
          if (o.hp <= 0) killObj(o); else { o.hitT = 0.1; sfxTink(); burst('spark', o.x, oy, o.z, 3, 4, 0.3, 3, SILVER); }
          break;
        }
      } else if (o.k === 'lamp' && o.lit) { // the lamp head can be snuffed
        const dx = o.x - s.x, dy = (o.h - 0.35) - s.y;
        if (dx * dx + dy * dy < 1.1) {
          s.dead = true; o.hp--;
          if (o.hp <= 0) killObj(o); else { sfxTink(); burst('spark', o.x, o.h - 0.35, o.z, 4, 4, 0.3, 3, SODIUM); }
          break;
        }
      } else { // written world: dust splashes harmlessly off it
        let hit = false;
        if (o.k === 'stalk' || o.k === 'fox' || o.k === 'pole' || o.k === 'piling' || o.k === 'mast')
          hit = Math.abs(o.x - s.x) < o.w + 0.35 && s.y < o.h;
        else if (o.k === 'rock') hit = Math.abs(o.x - s.x) < o.w && s.y < o.h + 0.4;
        else if (o.k === 'web') { const dx = s.x - o.x, dy = s.y - o.y, d = Math.hypot(dx, dy);
          hit = d < o.R && Math.hypot(dx - o.hx, dy - o.hy) > o.hr; }
        if (hit && Math.abs(dz) < 1.2) { s.dead = true; burst('dust', s.x, s.y, s.z, 3, 2.5, 0.4, 2.5, SILVER); break; }
      }
    }
    // boss body
    if (!s.dead && G.bossRef) {
      const B = G.bossRef, dz = B.z - s.z;
      if (dz > -2 && dz < 3) {
        const dx = B.x - s.x, dy = B.y - s.y;
        if (dx * dx + dy * dy < 2.4 * 2.4) {
          s.dead = true; damageBoss(1);
          burst('spark', s.x, s.y, B.z - 1.5, 3, 4, 0.3, 3, SILVER);
        }
      }
    }
  }
  if (G.mode !== 'play') { G.sear = false; return; }
  // player vs world
  const pr = 0.5;
  let searing = false;
  for (const o of G.objects) {
    if (o.dead || !o.hz) continue;
    const crossed = (o.pz - PZ) * (o.z - PZ) <= 0 && o.pz !== o.z;
    const nearZ = Math.abs(o.z - PZ) < 1.5;
    if (o.en) { // enemies: continuous sphere check near the plane
      if (!nearZ) continue;
      const oy = o.y === undefined ? (o.h || 1) * 0.7 : o.y;
      const dx = o.x - P.x, dy = oy - P.y, d = Math.hypot(dx, dy), rr = o.r + pr;
      if (d < rr) { if (G.inv <= 0) { playerHit(o.k); if (o.k === 'cinder' || o.k === 'sw' || o.k === 'pyr') killObj(o, true); } }
      else if (d < rr + 1.4 && crossed) graze(o.x, oy, o.z);
      if (o.k === 'eel') for (let i = 4; i < o.hist.length; i += 3) {
        const h = o.hist[i];
        if (Math.abs(h.z - PZ) < 1.2) { const ddx = h.x - P.x, ddy = h.y - P.y;
          if (ddx * ddx + ddy * ddy < 1.1 && G.inv <= 0) playerHit('eel'); }
      }
      continue;
    }
    switch (o.k) {
      case 'stalk': case 'fox': case 'pole': case 'piling': case 'mast': {
        if (!crossed) break;
        const dx = Math.abs(o.x - P.x);
        if (dx < o.w + pr && P.y < o.h) { if (G.inv <= 0) playerHit(o.k); }
        else if (dx < o.w + pr + 1.5 && P.y < o.h + 1.2) graze(o.x, Math.min(P.y, o.h), o.z);
        break;
      }
      case 'rock': {
        if (!crossed) break;
        if (Math.abs(o.x - P.x) < o.w + pr && P.y < o.h + 0.5) { if (G.inv <= 0) playerHit('rock'); }
        break;
      }
      case 'web': {
        if (!crossed) break;
        const dx = P.x - o.x, dy = P.y - o.y, d = Math.hypot(dx, dy);
        if (d < o.R + pr * 0.5) {
          if (Math.hypot(dx - o.hx, dy - o.hy) < o.hr) {
            if (!o.threaded) { o.threaded = true; G.score += 300; popup('THREADED +300', o.x + o.hx, o.y + o.hy, o.z, PLAYER_TINT, 1); sfxWeb(); }
          } else if (G.inv <= 0) { playerHit('web'); o.torn = 1; sfxWeb(); }
        }
        break;
      }
      case 'wire': {
        if (!crossed) break;
        if (P.x > o.x0 - 0.4 && P.x < o.x1 + 0.4) {
          const t = (P.x - o.x0) / (o.x1 - o.x0);
          const wy = o.hy - o.sag * (1 - (2 * t - 1) * (2 * t - 1));
          const dy = Math.abs(P.y - wy);
          if (dy < 0.5 + pr * 0.5) { if (G.inv <= 0) { playerHit('wire'); burst('spark', P.x, wy, o.z, 8, 6, 0.5, 3, ZAPPURPLE); } }
          else if (dy < 1.6) graze(P.x, wy, o.z);
        }
        break;
      }
      case 'lamp': {
        if (o.lit && Math.abs(o.z - PZ) < 1.3 && P.y < 4.5) {
          const coneR = 0.15 + (4.5 - P.y) * 0.2;
          if (Math.abs(o.x - P.x) < coneR) {
            searing = true; G.searT += dt; sfxSizzle();
            part('smoke', P.x, P.y + 0.3, PZ, rand(-0.5, 0.5), rand(1, 2), -1, 0.7, 3, [80, 70, 60]);
            if (G.searT > 0.38 && G.inv <= 0) { playerHit('lamp'); G.searT = 0; }
          }
        }
        if (crossed) { // the pole is still a pole
          if (Math.abs(o.x - P.x) < o.w + pr && P.y < o.h) { if (G.inv <= 0) playerHit('pole'); }
        }
        break;
      }
      case 'garc': {
        if (Math.abs(o.z - PZ) < 1.4 && P.y < 1.7 && Math.abs(o.x - P.x) < o.r + pr) { if (G.inv <= 0) playerHit('garc'); }
        break;
      }
    }
  }
  if (!searing) G.searT = Math.max(0, G.searT - dt * 2.4);
  G.sear = searing;
  // boss contact
  if (G.bossRef && G.bossRef.st !== 'dying' && Math.abs(G.bossRef.z - PZ) < 2.5) {
    const dx = G.bossRef.x - P.x, dy = G.bossRef.y - P.y;
    if (dx * dx + dy * dy < 2.9 * 2.9 && G.inv <= 0) playerHit('boss');
  }
  // beam sweep — it rakes the water; ride above the light
  if (G.beam && G.beam.st === 'sweep' && G.inv <= 0 && P.y < 4.2) {
    const bx = lerp(-11 * G.beam.dir, 11 * G.beam.dir, G.beam.t / 1.5);
    if (Math.abs(P.x - bx) < 1.1) playerHit('beam');
  }
}

function updateParticles(dt) {
  for (const p of PARTS) {
    if (!p.on) continue;
    p.t += dt;
    if (p.t >= p.life) { p.on = false; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += (p.vz - (p.kind === 'dust' ? 0 : 0)) * dt;
    if (p.kind === 'glass' || p.kind === 'pop') p.vy -= 7 * dt;
    if (p.kind === 'smoke') { p.vy += 2 * dt; p.size += dt * 5; }
    if (p.y < 0.05 && p.kind !== 'smoke') { p.y = 0.05; p.vy *= -0.4; }
  }
  for (let i = POPUPS.length - 1; i >= 0; i--) {
    const q = POPUPS[i]; q.t += dt; q.y -= dt * H * 0.04;
    if (q.t > 1.4) POPUPS.splice(i, 1);
  }
}

function update(dt) {
  G.t += dt; G.modeT += dt;
  G.coolFire -= dt; G.grazeCD -= dt; G.inv = Math.max(0, G.inv - dt);
  G.muzzle = Math.max(0, G.muzzle - dt);
  G.shake = Math.max(0, G.shake - dt * 46);
  G.flash = Math.max(0, G.flash - dt * 2.4);
  G.palMix = Math.min(1, G.palMix + dt * 0.5);
  G.moonBoost = Math.max(0, G.moonBoost - dt * 0.12);
  G.cardT = Math.max(0, G.cardT - dt);
  G.streakT -= dt; if (G.streakT <= 0 && G.streak > 0) { G.streak = 0; G.mult = 1; }
  // queued events
  for (let i = G.queue.length - 1; i >= 0; i--)
    if (G.t >= G.queue[i].at) { const q = G.queue.splice(i, 1)[0]; q.fn(); }

  if (G.mode === 'play') {
    if (!G.boss) {
      G.stageT += dt;
      const ramp = Math.min(6, G.stageT * 0.09);
      G.spd = (24 + G.stage * 4.5 + ramp) * (1 + 0.11 * Math.floor((G.night - 1) / 3));
      G.intensity = sat(G.stageT / G.stageDur[G.stage]);
      if (G.stageT >= G.stageDur[G.stage]) {
        if (G.stage === 2) spawnBoss(); else nextStage();
      }
    } else {
      G.spd = 27;
      G.intensity = 1;
    }
    G.score += dt * 20 * (1 + (G.night - 1) * 0.15);
    G.dist += dt * G.spd;
    if (fireHeld) fire();
    G.hintT += dt;
  }
  if (G.mode === 'dying' && G.modeT > 2.5) gameOver();
  if (G.mode === 'title') { G.spd = 21; }

  MUS.level = G.intensity;
  updatePlayer(dt);
  director(dt);
  updateObjects(dt);
  updateShots(dt);
  if (G.bossRef && G.mode === 'play') updateBoss(dt);
  if (G.beam) {
    G.beam.t += dt;
    if (G.beam.st === 'tell' && G.beam.t > 1.35) { G.beam.st = 'sweep'; G.beam.t = 0; }
    else if (G.beam.st === 'sweep' && G.beam.t > 1.5) G.beam = null;
  }
  collide(dt);
  updateParticles(dt);
  // ground bed streams past
  for (const m of MARKS) {
    m.z -= G.spd * dt;
    if (m.z < 1.5) { m.z += 120; m.x = CAM.x + rand(-46, 46); m.seed = srand(); }
  }
  for (const f of FIREFLIES) {
    f.ph += dt; f.z -= G.spd * dt * 0.25;
    f.x += Math.sin(f.ph * 0.7 + f.ph2) * dt * 1.5;
    f.y = clamp(f.y + Math.cos(f.ph * 0.9 + f.ph2) * dt * 0.8, 0.4, 4);
    if (f.z < 4) { f.z = rand(60, 95); f.x = rand(-14, 14); }
  }
}

/* ============================================================== RENDER */
function shadow(x, z, r, a) {
  const q = prj(x, 0, z), rx = r * q.s;
  ctx.fillStyle = 'rgba(2,4,8,' + (a * (1 - fogT(z)) * 0.5).toFixed(3) + ')';
  ctx.beginPath(); ctx.ellipse(q.x, q.y, rx, rx * 0.22, 0, 0, TAU); ctx.fill();
}
function fogged(c, z, a) {
  const t = fogT(z);
  return col(mixRGB(c, PALC.haze, t * 0.85), a * (1 - t * t * 0.9));
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HOR + H * 0.08);
  g.addColorStop(0, col(PALC.skyTop)); g.addColorStop(0.62, col(PALC.skyMid)); g.addColorStop(1, col(PALC.skyHor));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HOR + H * 0.08);
  // stars — the pollution dome swallows them on the road
  ctx.fillStyle = col(PALC.star);
  const sa = PALC.starA;
  for (const s of stars) {
    const tw = 0.45 + 0.55 * Math.sin(s.tw + G.t * s.spd);
    ctx.globalAlpha = sa * tw * 0.9;
    ctx.fillRect(s.x * W, s.y * HOR * 0.94, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  // the Moon — the whole point of everything
  const msz = H * PALC.moonSize * (1 + G.moonBoost * 0.22);
  const mx = W * 0.5 - CAM.x * H * 0.012, my = HOR - H * 0.155 - G.moonBoost * H * 0.02;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.5 + G.moonBoost * 0.3;
  ctx.drawImage(moonHalo, mx - msz * 1.7, my - msz * 1.7, msz * 3.4, msz * 3.4);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(moonSpr, mx - msz, my - msz, msz * 2, msz * 2);
  // thin night clouds slide under the moon
  for (let i = 0; i < 3; i++) {
    const cy = HOR - H * (0.1 + i * 0.055), cw = W * (0.34 + i * 0.1);
    const cx = ((G.t * (4 + i * 3) + i * 500) % (W + cw * 2)) - cw;
    const cc = i === 0 ? PALC.cloud : mixRGB(PALC.cloud, PALC.moonGlow, 0.14);
    ctx.fillStyle = col(cc, 0.18);
    ctx.beginPath(); ctx.ellipse(cx, cy, cw, H * 0.009, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, cy, cw * 0.62, H * 0.013, 0, 0, TAU); ctx.fill();
  }
  // sodium dome — the Glare's stain on the sky
  if (PALC.domeA > 0.005) {
    const dg = ctx.createLinearGradient(0, HOR - H * 0.2, 0, HOR + 2);
    dg.addColorStop(0, col(PALC.dome, 0)); dg.addColorStop(1, col(PALC.dome, PALC.domeA * 0.4));
    ctx.fillStyle = dg; ctx.fillRect(0, HOR - H * 0.2, W, H * 0.2 + 2);
  }
  drawSilhouette();
  // haze seam softens the horizon line
  const hg = ctx.createLinearGradient(0, HOR - H * 0.03, 0, HOR + H * 0.045);
  hg.addColorStop(0, col(PALC.haze, 0)); hg.addColorStop(0.5, col(PALC.haze, 0.22)); hg.addColorStop(1, col(PALC.haze, 0));
  ctx.fillStyle = hg; ctx.fillRect(0, HOR - H * 0.03, W, H * 0.08);
}

function drawSilhouette() {
  const par = -CAM.x * H * 0.02, st = G.stage;
  ctx.fillStyle = col(PALC.sil);
  if (st === 0) {
    ctx.beginPath(); ctx.moveTo(-W * 0.15 + par, HOR + 2);
    for (const p of silPts[0]) ctx.lineTo(p[0] * W * 1.15 + par - W * 0.075, HOR - p[1] * H * 0.075);
    ctx.lineTo(W * 1.15 + par, HOR + 2); ctx.closePath(); ctx.fill();
  } else if (st === 1) {
    for (const b of silPts[1]) {
      const bx = b[0] * W * 1.15 + par - W * 0.075, bw = b[2] * W * 1.15, bh = b[1] * H * 0.085;
      ctx.fillRect(bx, HOR - bh, bw, bh + 2);
      if (b[3]) { // aerial mast with its patient red eye
        ctx.fillRect(bx + bw / 2 - 1, HOR - bh - H * 0.045, 2, H * 0.045);
        const blink = 0.4 + 0.6 * Math.max(0, Math.sin(G.t * 2 + b[0] * 40));
        ctx.fillStyle = col(DANGER, blink); ctx.fillRect(bx + bw / 2 - 1.5, HOR - bh - H * 0.045 - 2, 3, 3);
        ctx.fillStyle = col(PALC.sil);
      }
      // lit windows — someone is always awake under the Glare
      const wn = (b[0] * 97 | 0) % 3;
      ctx.fillStyle = col(SODIUM, 0.5);
      for (let wI = 0; wI < wn; wI++)
        ctx.fillRect(bx + bw * (0.25 + wI * 0.3), HOR - bh * rand01(b[0] + wI) * 0.8 - 2, 1.6, 2.2);
      ctx.fillStyle = col(PALC.sil);
    }
  } else {
    ctx.beginPath(); ctx.moveTo(-W * 0.15 + par, HOR + 2);
    for (const p of silPts[2]) ctx.lineTo(p[0] * W * 1.15 + par - W * 0.075, HOR - p[1] * H * 0.05);
    ctx.lineTo(W * 1.15 + par, HOR + 2); ctx.closePath(); ctx.fill();
    drawLighthouse(par);
  }
}
function rand01(seed) { const s = Math.sin(seed * 127.1) * 43758.5453; return s - Math.floor(s); }

function drawLighthouse(par) {
  const grow = G.boss || G.bossRef ? 1 : lerp(0.3, 1, sat(G.stageT / G.stageDur[2]));
  const lx = W * 0.66 + par * 2.4, hgt = H * 0.16 * grow, bw = hgt * 0.24;
  ctx.fillStyle = col(PALC.sil2);
  ctx.beginPath();
  ctx.moveTo(lx - bw / 2, HOR + 2); ctx.lineTo(lx - bw * 0.32, HOR - hgt);
  ctx.lineTo(lx + bw * 0.32, HOR - hgt); ctx.lineTo(lx + bw / 2, HOR + 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col(mixRGB(PALC.sil2, PALC.moon, 0.24));
  ctx.fillRect(lx - bw * 0.42, HOR - hgt * 0.42, bw * 0.84, hgt * 0.13);
  ctx.fillRect(lx - bw * 0.46, HOR - hgt * 0.72, bw * 0.92, hgt * 0.1);
  // lamp room
  ctx.fillStyle = col(PALC.sil2);
  ctx.fillRect(lx - bw * 0.44, HOR - hgt - hgt * 0.22, bw * 0.88, hgt * 0.22);
  ctx.beginPath(); ctx.arc(lx, HOR - hgt - hgt * 0.22, bw * 0.34, Math.PI, 0); ctx.fill();
  if (!G.boss && !G.bossRef) {
    const tell = G.beam && G.beam.st === 'tell' ? 0.5 + 0.5 * Math.sin(G.t * 18) : 0.35;
    const gs = bw * (2 + tell * 3);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5 + tell * 0.5;
    ctx.drawImage(glowSpr.sodium, lx - gs / 2, HOR - hgt - hgt * 0.2 - gs / 2, gs, gs);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
}

function drawGround() {
  const g = ctx.createLinearGradient(0, HOR, 0, H);
  g.addColorStop(0, col(PALC.ground0)); g.addColorStop(1, col(PALC.ground1));
  ctx.fillStyle = g; ctx.fillRect(0, HOR, W, H - HOR);
  const st = G.stage, water = PALC.water > 0.5;
  if (!water) { // lunar sheen pooling on the land beneath the Moon
    const mx = W * 0.5 - CAM.x * H * 0.012;
    const pg = ctx.createRadialGradient(mx, HOR + H * 0.09, 0, mx, HOR + H * 0.09, H * 0.55);
    pg.addColorStop(0, col(PALC.moonGlow, 0.07)); pg.addColorStop(1, col(PALC.moonGlow, 0));
    ctx.fillStyle = pg; ctx.fillRect(0, HOR, W, H - HOR);
  }
  if (st === 1) { // the pale dirt road below the powerlines, rutted by old wheels
    const gy = groundY(110);
    ctx.fillStyle = col(mixRGB(PALC.ground0, [74, 58, 40], 0.55), 0.4);
    ctx.beginPath();
    ctx.moveTo(prj(-2.6, 0, 3.4).x, H + 4); ctx.lineTo(prj(-2.6, 0, 110).x, gy);
    ctx.lineTo(prj(2.6, 0, 110).x, gy); ctx.lineTo(prj(2.6, 0, 3.4).x, H + 4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = col(mixRGB(PALC.ground1, [8, 6, 5], 0.5), 0.5);
    for (const rx of [-1.5, 1.5]) {
      ctx.lineWidth = Math.max(2, H * 0.008);
      ctx.beginPath(); ctx.moveTo(prj(rx, 0, 3.4).x, H + 4); ctx.lineTo(prj(rx, 0, 100).x, groundY(100)); ctx.stroke();
    }
  }
  if (water) { // the moon-road itself, laid on the sea in soft layers
    const mx = W * 0.5 - CAM.x * H * 0.012;
    ctx.globalCompositeOperation = 'lighter';
    for (let layer = 0; layer < 3; layer++) {
