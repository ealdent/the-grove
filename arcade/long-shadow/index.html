<style>
  :root { --ink:#1f3563; --paper:#efe6d2; --gold:#e9a23b; --ui-scale:1; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#17140f; overflow:hidden; }
  body { font-family:'IM Fell English', Georgia, 'Times New Roman', serif; color:var(--ink);
         -webkit-user-select:none; user-select:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #ui { position:fixed; pointer-events:none; }
  .scr { position:absolute; inset:0; display:none; }
  .scr.on { display:flex; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; pointer-events:auto; }

  /* HUD */
  #hud { position:absolute; left:0; right:0; top:0; display:none; justify-content:space-between; align-items:flex-start;
         padding:calc(12px*var(--ui-scale)) calc(16px*var(--ui-scale)); font-size:calc(18px*var(--ui-scale)); transition:color 1.2s; }
  #hud.on { display:flex; }
  body.night #hud, body.night #hint { color:#eadfc4; }
  #hudL { display:flex; flex-direction:column; gap:4px; min-width:30%; }
  #lives, #heat { display:flex; gap:6px; height:calc(22px*var(--ui-scale)); align-items:center; }
  #lives svg { width:calc(19px*var(--ui-scale)); height:calc(28px*var(--ui-scale)); }
  #heat i { width:calc(13px*var(--ui-scale)); height:calc(13px*var(--ui-scale)); border-radius:50%; border:1.5px solid currentColor; opacity:.55; display:block; }
  #heat i.hot { background:#e98a2c; border-color:#e98a2c; opacity:1; box-shadow:0 0 8px #f0a040; }
  #hudC { text-align:center; min-width:30%; }
  #score { font-family:'IM Fell English SC', Georgia, serif; font-size:calc(28px*var(--ui-scale)); letter-spacing:.06em; line-height:1; }
  #mult { font-style:italic; font-size:calc(17px*var(--ui-scale)); height:1.2em; opacity:.85; }
  #hudR { display:flex; flex-direction:column; align-items:flex-end; min-width:30%; }
  #dial { width:calc(176px*var(--ui-scale)); height:calc(68px*var(--ui-scale)); }
  #dayLbl { font-style:italic; font-size:calc(19px*var(--ui-scale)); margin-top:-2px; }

  #talk { position:absolute; left:50%; bottom:calc(18px*var(--ui-scale)); transform:translateX(-50%) translateY(8px);
          display:flex; align-items:center; gap:12px; opacity:0; transition:opacity .35s, transform .35s;
          background:rgba(241,233,214,.93); padding:6px 18px 6px 6px; border-radius:40px;
          box-shadow:0 2px 0 rgba(31,53,99,.25), 0 6px 22px rgba(0,0,0,.18); max-width:86%; }
  #talk.on { opacity:1; transform:translateX(-50%) translateY(0); }
  #talk img { width:calc(46px*var(--ui-scale)); height:calc(46px*var(--ui-scale)); border-radius:50%; object-fit:cover; flex:none;
              border:2px solid rgba(31,53,99,.5); }
  #talkTxt { font-style:italic; font-size:calc(21px*var(--ui-scale)); color:#1f3563; white-space:nowrap; }
  #hint { position:absolute; left:0; right:0; bottom:calc(84px*var(--ui-scale)); text-align:center; font-style:italic;
          font-size:calc(17px*var(--ui-scale)); opacity:0; transition:opacity .5s; text-shadow:0 0 6px rgba(239,230,210,.9); }
  #hint.on { opacity:.92; }
  body.night #hint { text-shadow:0 0 6px rgba(10,16,40,.9); }

  /* day card */
  #card { background:radial-gradient(ellipse at center, rgba(18,16,12,.72), rgba(18,16,12,.9)); align-items:center; justify-content:center; flex-direction:column; gap:14px; transition:opacity .8s; }
  #card .frame { width:min(56%, 760px); aspect-ratio:16/9; background-size:cover; background-position:center; border-radius:3px;
                 box-shadow:0 10px 40px rgba(0,0,0,.45); }
  #card .num { font-family:'IM Fell English SC', serif; font-size:calc(26px*var(--ui-scale)); color:#eadfc4; letter-spacing:.3em; }
  #card .nm { font-size:calc(44px*var(--ui-scale)); color:#f3ead6; font-style:italic; margin-top:-10px; }

  /* overlays on paper */
  .sheet { margin:auto; background:#efe6d2; color:var(--ink); padding:calc(22px*var(--ui-scale)) calc(30px*var(--ui-scale));
           border-radius:3px; box-shadow:0 12px 50px rgba(0,0,0,.5); text-align:center; pointer-events:auto; max-width:92%; }
  .sheet h2 { font-family:'IM Fell English SC', serif; font-weight:400; letter-spacing:.12em; margin:0 0 6px;
              font-size:calc(34px*var(--ui-scale)); }
  .sheet p { margin:.35em 0; font-size:calc(19px*var(--ui-scale)); }
  .sheet .row { display:flex; gap:26px; justify-content:center; margin-top:14px; }
  .btn { font-family:'IM Fell English SC', serif; font-size:calc(23px*var(--ui-scale)); letter-spacing:.08em; padding:4px 6px;
         border-bottom:1.5px solid transparent; }
  .btn:hover, .btn:focus-visible { border-bottom-color:currentColor; outline:none; }
  #plate .sheet { padding:calc(16px*var(--ui-scale)); }
  #plateWrap { position:relative; width:min(72vw, calc(112vh - 260px)); max-width:960px; aspect-ratio:16/9; }
  #plateWrap canvas { position:absolute; inset:0; width:100%; height:100%; }
  #plateRaw { transition:opacity 2.6s ease-in; }
  #plateCap { font-style:italic; font-size:calc(22px*var(--ui-scale)); margin-top:10px; }
  #plateStats { font-size:calc(17px*var(--ui-scale)); opacity:.85; }
  #pause .sheet table { margin:10px auto 0; border-collapse:collapse; font-size:calc(18px*var(--ui-scale)); }
  #pause td { padding:2px 10px; text-align:left; } #pause td:first-child { text-align:right; font-style:italic; opacity:.8; }
  #vol { width:160px; accent-color:#1f3563; pointer-events:auto; }

  /* title */
  #title { position:fixed; inset:0; z-index:5; flex-direction:column; align-items:center; justify-content:flex-end;
           background:#0d1426 center/cover no-repeat; color:#f2ead7; padding-bottom:7vh; }
  #title::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,18,40,.0) 30%, rgba(10,18,40,.55) 70%, rgba(10,18,40,.8)); }
  #title > * { position:relative; }
  #title h1 { font-family:'IM Fell English SC', serif; font-weight:400; font-size:clamp(46px, 9vw, 118px); letter-spacing:.08em;
              margin:0; text-shadow:0 2px 20px rgba(0,0,30,.6); }
  #title .sub { font-style:italic; font-size:clamp(17px, 2.2vw, 26px); margin:2px 0 26px; opacity:.92; }
  #title .menu { display:flex; gap:clamp(18px,3vw,40px); }
  #title .btn { color:#f2ead7; font-size:clamp(22px, 2.6vw, 30px); }
  #title .foot { position:absolute; bottom:14px; right:18px; font-size:15px; opacity:.75; display:flex; gap:12px; align-items:center; }
  #title .foot a { color:inherit; pointer-events:auto; }
  #title .best { font-style:italic; font-size:16px; opacity:.8; margin-top:16px; min-height:1.2em; }
  #album { position:fixed; inset:0; z-index:6; background:#1b1812; flex-direction:column; align-items:center; overflow:auto; padding:4vh 3vw; color:#efe6d2; }
  #album h2 { font-family:'IM Fell English SC', serif; font-weight:400; letter-spacing:.14em; font-size:38px; margin:0 0 4px; }
  #album .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap:22px; width:min(1200px, 100%); margin-top:20px; }
  #album figure { margin:0; background:#efe6d2; padding:10px 10px 6px; color:var(--ink); box-shadow:0 6px 20px rgba(0,0,0,.4); }
  #album figure img, #album figure .blank { width:100%; aspect-ratio:16/9; display:block; object-fit:cover; background:#e6dcc5; }
  #album figcaption { font-style:italic; text-align:center; padding-top:6px; font-size:17px; }
  #album .btn { color:#efe6d2; margin-top:22px; }
  #rot { position:fixed; inset:auto 0 12px 0; text-align:center; color:#efe6d2; font-style:italic; font-size:15px; display:none; z-index:7; pointer-events:none; }
  @media (orientation:portrait) and (max-width:700px) { #rot.show { display:block; } }

  #final { flex-direction:column; align-items:center; justify-content:center; }
  #finalBg { position:absolute; inset:0; background:#0b1022 center/cover no-repeat; opacity:0; transition:opacity 3s, transform 30s linear; transform:scale(1.0); }
  #finalBg.on { opacity:1; transform:scale(1.08); }
  #finalLine { position:relative; color:#f2ead7; font-style:italic; font-size:calc(34px*var(--ui-scale)); opacity:0; transition:opacity 2s; text-shadow:0 2px 14px #000; margin-top:46vh; }
  #finalLine.on { opacity:1; }
  #finalSheet { position:relative; display:none; margin-top:3vh; }
  #finalSheet.on { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div id="hudL"><div id="lives"></div><div id="heat"><i></i><i></i><i></i></div></div>
    <div id="hudC"><div id="score">0</div><div id="mult"></div></div>
    <div id="hudR"><canvas id="dial" width="352" height="136"></canvas><div id="dayLbl"></div></div>
  </div>
  <div id="hint"></div>
  <div id="talk"><img id="owlImg" src="assets/owl.jpg" alt=""><div id="talkTxt"></div></div>
  <div id="card" class="scr"><div class="frame"></div><div class="num"></div><div class="nm"></div></div>
  <div id="plate" class="scr"><div class="sheet">
    <div id="plateWrap"><canvas id="plateCv" width="960" height="540"></canvas><canvas id="plateRaw" width="960" height="540"></canvas></div>
    <div id="plateCap"></div><div id="plateStats"></div>
    <div class="row"><button class="btn" id="bKeep">Keep the print</button><button class="btn" id="bWalk">Walk on</button></div>
  </div></div>
  <div id="over" class="scr"><div class="sheet">
    <h2>Burnt out</h2><p id="overTxt">The sparks had the day.</p>
    <div class="row"><button class="btn" id="bRetry">Try the day again</button><button class="btn" id="bQuit">Title</button></div>
  </div></div>
  <div id="pause" class="scr"><div class="sheet">
    <h2>Resting</h2>
    <table>
      <tr><td id="kMove">walk</td><td>WASD or arrows</td></tr>
      <tr><td>cast your shadow</td><td>point with the mouse</td></tr>
      <tr><td>jump</td><td>space or click</td></tr>
      <tr><td>volume</td><td><input id="vol" type="range" min="0" max="1" step="0.05"></td></tr>
    </table>
    <div class="row"><button class="btn" id="bResume">Resume</button><button class="btn" id="bMute">Mute</button><button class="btn" id="bTitle">Title</button></div>
  </div></div>
  <div id="final" class="scr"><div id="finalBg"></div><div id="finalLine">Good morning.</div>
    <div id="finalSheet" class="sheet"><h2>Long Shadow</h2><p id="finalTxt"></p>
      <div class="row"><button class="btn" id="bFinalAlbum">Album</button><button class="btn" id="bAgain">Walk it again</button></div></div>
  </div>
</div>
<div id="title" class="scr">
  <h1>Long Shadow</h1>
  <div class="sub">Keep the sun at your back.</div>
  <div class="menu"><button class="btn" id="bBegin">Begin</button><button class="btn" id="bCont">Continue</button><button class="btn" id="bAlbum">Album</button></div>
  <div class="best" id="best"></div>
  <div class="foot"><button class="btn" id="bSnd" style="font-size:16px">sound on</button><a href="../">arcade</a></div>
</div>
<div id="album" class="scr"><h2>Album</h2><div style="font-style:italic;opacity:.8">One print for every day you walked.</div><div class="grid" id="albumGrid"></div><button class="btn" id="bAlbumBack">Back</button></div>
<div id="rot">Turn sideways for a bigger field.</div>

const SIL = {};
function loadAtlas() {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = makeCanvas(img.width, img.height), x = c.getContext('2d', { willReadFrequently: true });
        x.drawImage(img, 0, 0);
        const d = x.getImageData(0, 0, img.width, img.height).data;
        for (const name in ATLAS_META) {
          const [ax, ay, w, h, bx] = ATLAS_META[name];
          const cv = makeCanvas(w, h), cx = cv.getContext('2d'), id = cx.createImageData(w, h);
          const mw = Math.max(2, Math.ceil(w / 3)), mh = Math.max(2, Math.ceil(h / 3)), mask = new Uint8Array(mw * mh);
          for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
            const a = d[((ay + j) * img.width + ax + i) * 4], o = (j * w + i) * 4;
            id.data[o] = id.data[o + 1] = id.data[o + 2] = 255; id.data[o + 3] = a;
            if (a > 110) mask[((j / 3) | 0) * mw + ((i / 3) | 0)] = 1;
          }
          cx.putImageData(id, 0, 0);
          SIL[name] = { cv, w, h, bx, mask, mw, mh };
        }
      } catch (e) { console.warn('atlas', e); }
      resolve();
    };
    img.onerror = () => resolve();
    img.src = ATLAS_SRC;
  });
}

function sunVec(lat, dec, h) {
  const p = lat * DEG, d = dec * DEG, hh = h * DEG;
  return {
    east: -Math.cos(d) * Math.sin(hh),
    north: Math.cos(p) * Math.sin(d) - Math.sin(p) * Math.cos(d) * Math.cos(hh),
    up: Math.sin(p) * Math.sin(d) + Math.cos(p) * Math.cos(d) * Math.cos(hh)

  },
  playStep(st, t, prog) {

  },
  pad(ch, t, dur, vol) {
    const c = this.ctx, f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = this.phase === 'dusk' ? 1700 : this.phase === 'noon' ? 1300 : 1000; f.Q.value = 0.5;
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 1.4); g.gain.setValueAtTime(vol, t + dur - 0.2); g.gain.linearRampToValueAtTime(0, t + dur + 1.8);

  },
  pluck(n, t, v) {

  },
  bass(n, t, v) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.value = this.mtof(n);

  },
  thump(t, v) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.15);

  },
  shaker(t, v) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = this.noise; f.type = 'highpass'; f.frequency.value = 6500;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05); s.connect(f); f.connect(g); g.connect(this.mus); s.start(t, Math.random()); s.stop(t + 0.06);
  },
  bell(n, t, v, ratio) {
    const c = this.ctx, fr = this.mtof(n), o = c.createOscillator(), m = c.createOscillator(), mg = c.createGain(), g = c.createGain();

  },
  noiseHit(t, freq, q, v, dur, type) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = this.noise; f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t, Math.random()); s.stop(t + dur + 0.02);

  },
  ok() { return this.ctx && this.ctx.state === 'running'; },
  lastKills: [],
  kill(chain, type) {
    if (!this.ok()) return; const c = this.ctx, t = c.currentTime;
    this.lastKills = this.lastKills.filter(x => t - x < 0.18);
    this.noiseHit(t, 3800, 1.2, 0.04, 0.07);
    if (this.lastKills.length >= 4) return; this.lastKills.push(t);
    const ch = this.chord || [50, 57, 62, 66, 69], tones = [...new Set(ch.map(n => (n % 12)))].sort((a, b) => a - b);
    const idx = Math.max(0, chain - 1), oct = Math.floor(idx / tones.length);
    const n = 74 + tones[idx % tones.length] + Math.min(oct, 2) * 12;
    this.bell(n, t + this.lastKills.length * 0.035, type === 'glint' ? 0.06 : 0.085);
  },
  flare() { if (!this.ok()) return; const t = this.ctx.currentTime; this.bell(62, t, 0.1, 1.41); this.noiseHit(t, 900, 0.7, 0.08, 0.4, 'lowpass'); },
  glass() { if (!this.ok()) return; const t = this.ctx.currentTime; this.bell(93, t, 0.05, 2.76); this.bell(98, t + 0.05, 0.04, 2.76); },
  hit() { if (!this.ok()) return; const t = this.ctx.currentTime; this.thump(t, 0.3); const f = this.noiseHit(t, 2400, 0.8, 0.12, 0.45, 'lowpass'); f.frequency.exponentialRampToValueAtTime(400, t + 0.4); },
  lifeLost() { if (!this.ok()) return; const t = this.ctx.currentTime; this.thump(t, 0.4); [62, 57, 50].forEach((n, i) => this.bell(n, t + i * 0.16, 0.08, 1.41)); },
  extra() { if (!this.ok()) return; const t = this.ctx.currentTime; [74, 78, 81, 86].forEach((n, i) => this.bell(n, t + i * 0.09, 0.06)); },
  jump() { if (!this.ok()) return; const t = this.ctx.currentTime; const f = this.noiseHit(t, 600, 1.5, 0.05, 0.25); f.frequency.exponentialRampToValueAtTime(1800, t + 0.22); },
  land() { if (!this.ok()) return; const t = this.ctx.currentTime; this.noiseHit(t, 300, 0.8, 0.06, 0.12, 'lowpass'); },
  crack(x) { if (!this.ok()) return; const t = this.ctx.currentTime; this.bell(96, t, 0.035, 5.1); this.noiseHit(t, 5200, 3, 0.05, 0.12); void x; },
  cool() { if (!this.ok()) return; const t = this.ctx.currentTime; const f = this.noiseHit(t, 5000, 0.6, 0.04, 0.6, 'highpass'); f.frequency.exponentialRampToValueAtTime(9000, t + 0.5); },
  yip() { if (!this.ok()) return; const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(1500, t + 0.08); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.035, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12); o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t + 0.14); },
  aim() { if (!this.ok()) return; const t = this.ctx.currentTime; this.bell(88, t, 0.025, 7); },
  beam() { if (!this.ok()) return; const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(1320, t); o.frequency.linearRampToValueAtTime(1180, t + 1.3); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.04, t + 0.05); g.gain.setValueAtTime(0.04, t + 1.1); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.35); o.connect(g); g.connect(this.sfx); const sg = c.createGain(); sg.gain.value = 0.5; g.connect(sg); sg.connect(this.send); o.start(t); o.stop(t + 1.4); },
  sunset() { if (!this.ok()) return; const t = this.ctx.currentTime; this.pad([38, 50, 57, 62, 66, 69], t, 4, 0.06); this.bell(50, t, 0.08, 1.41); },
  lampLit(i) { if (!this.ok()) return; const t = this.ctx.currentTime; const sc = [62, 66, 69, 74, 78, 81, 86]; this.bell(sc[Math.min(i - 1, 6)], t, 0.09); const f = this.noiseHit(t, 300, 0.7, 0.08, 0.5, 'lowpass'); f.frequency.exponentialRampToValueAtTime(1400, t + 0.3); },
  wash() { if (!this.ok()) return; const t = this.ctx.currentTime; const f = this.noiseHit(t, 700, 0.5, 0.05, 2.4, 'lowpass'); f.frequency.exponentialRampToValueAtTime(2600, t + 1.2); },
  diamond() { if (!this.ok()) return; const t = this.ctx.currentTime; [86, 93, 98].forEach((n, i) => this.bell(n, t + i * 0.12, 0.08, 2.76)); },
  whistle(x) { if (!this.ok()) return; const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain(), pan = c.createStereoPanner ? c.createStereoPanner() : null; o.type = 'sine'; o.frequency.setValueAtTime(1900, t); o.frequency.exponentialRampToValueAtTime(1150, t + 0.7); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.018, t + 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8); o.connect(g); let out = g; if (pan) { pan.pan.value = clamp((x / W) * 2 - 1, -0.8, 0.8); g.connect(pan); out = pan; } out.connect(this.sfx); o.start(t); o.stop(t + 0.85); },

// ============================================================ main loop
let last = performance.now(), acc = 0, raf = 0, frames = 0, ftAcc = 0;
function frame(now) {
  raf = requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (dt > 0.25) dt = 0.25;
  ftAcc += dt * 1000; frames++; if (frames >= 30) { Q.ft = ftAcc / frames; frames = 0; ftAcc = 0; adaptQuality(); }
  G.frameDt = dt;
  if (!G.paused) {
    acc += dt; const step = 1 / 60; let n = 0;
    while (acc >= step && n < 5) { update(step); acc -= step; n++; }
    if (n === 5) acc = 0;
  }
  shakeA *= Math.exp(-10 * dt);
  pollPad();
  render();
  if (G.day) updateHud();
}
function update(dt) {
  G.mt += dt;
  updateTalk(dt);
  switch (G.mode) {
    case 'card': G.cardT += dt; if (G.cardT > 3.2) beginDay(); break;
    case 'day': dayUpdate(dt); break;
    case 'sunset': sunsetUpdate(dt); break;
    case 'lamps': lampsUpdate(dt); break;
    case 'night': nightUpdate(dt); break;
    case 'totality': totalityUpdate(dt); break;
    default: if (G.day) updateParts(dt);

function adaptQuality() {
  if (Q.ft > 24 && Q.dprCap > 1) { Q.slow++; if (Q.slow > 3) { Q.dprCap = Math.max(1, Q.dprCap - 0.25); Q.slow = 0; resize(); } }
  else Q.slow = 0;

// ============================================================ boot
async function boot() {
  buildTextures();
  await loadAtlas();
  $('title').style.backgroundImage = 'url(assets/keyart.jpg)';
  addEventListener('resize', resize);
  setupDay(0); resize();
  if (QS.has('day')) {
    const di = clamp((+QS.get('day') || 1) - 1, 0, 6); startRun(di); G.cardT = 99;
    if (QS.has('u')) { update(1 / 60); G.u = clamp(+QS.get('u'), 0, 0.99); }
  } else toTitle();
  raf = requestAnimationFrame(frame);
}
boot();

window.__ls_setupDay = setupDay;
window.__ls = {
  G, P, sun, DAYS, SIL, AU, IN, BOT, terrainShade, autoTarget,
  step(n, dt) { dt = dt || 1 / 60; for (let i = 0; i < (n || 1); i++) update(dt); render(); },
  setU(u) { G.u = u; computeSun(G.day, u); prepCasters(); },
  spawn(type, n) { spawn(type, n); },
  up: update, render, resize, setPause, advance, showPlate, beginNight, beginSunset, beginTotality, killAll() { for (const s of G.sparks) killSpark(s, true); },

})();
