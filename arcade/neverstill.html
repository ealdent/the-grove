<!DOCTYPE html>
<html lang="en">

    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:default}

<body>
<canvas id="gl" tabindex="0" aria-label="NEVERSTILL game canvas"></canvas>
<div id="fallback" hidden><div>NEVERSTILL NEEDS WEBGL2</div><div style="color:#aaa;font-size:13px">Try a current Chrome, Firefox, Safari or Edge.</div><a href="./">&larr; back to the arcade</a></div>
<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffd24a;background:#06030f;font:16px monospace">NEVERSTILL NEEDS JAVASCRIPT</div></noscript>
<script>
"use strict";
/* ============================================================================
   NEVERSTILL
   A free-roaming Space Harrier descendant. One file, WebGL2, no dependencies.

   The Endless Zone does not have a rail. It has hills, lakes, ridges and
   columns as far as you care to fly — but it has one law: you never stop.
   Turn, climb, dive, brake, boost, roll, circle forever. Just never stop.
   ========================================================================= */
(() => {

/* ------------------------------------------------------------------ util -- */
const PI = Math.PI, TAU = PI * 2;
const { abs, min, max, sqrt, sin, cos, atan2, floor, ceil, round, exp, pow, hypot, sign } = Math;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, l, dt) => a + (b - a) * (1 - exp(-l * dt));
const wrapA = a => { a = (a + PI) % TAU; if (a < 0) a += TAU; return a - PI; };
const dampAngle = (a, b, l, dt) => a + wrapA(b - a) * (1 - exp(-l * dt));
const rnd = Math.random;
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => floor(rr(a, b + 1));
const pick = arr => arr[floor(rnd() * arr.length)];
const hex = h => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const cssc = c => 'rgb(' + round(c[0] * 255) + ',' + round(c[1] * 255) + ',' + round(c[2] * 255) + ')';
const QS = new URLSearchParams(location.search);

/* vec3 as plain arrays */
const v3 = (x = 0, y = 0, z = 0) => [x, y, z];
const vset = (o, x, y, z) => (o[0] = x, o[1] = y, o[2] = z, o);
const vcopy = (o, a) => (o[0] = a[0], o[1] = a[1], o[2] = a[2], o);
const vadd = (o, a, b) => (o[0] = a[0] + b[0], o[1] = a[1] + b[1], o[2] = a[2] + b[2], o);
const vsub = (o, a, b) => (o[0] = a[0] - b[0], o[1] = a[1] - b[1], o[2] = a[2] - b[2], o);
const vsc = (o, a, s) => (o[0] = a[0] * s, o[1] = a[1] * s, o[2] = a[2] * s, o);
const vmad = (o, a, b, s) => (o[0] = a[0] + b[0] * s, o[1] = a[1] + b[1] * s, o[2] = a[2] + b[2] * s, o);
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vlen = a => sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]);
const vdist = (a, b) => hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const vdist2 = (a, b) => { const x = a[0] - b[0], y = a[1] - b[1], z = a[2] - b[2]; return x * x + y * y + z * z; };
const vcross = (o, a, b) => { const x = a[1] * b[2] - a[2] * b[1], y = a[2] * b[0] - a[0] * b[2], z = a[0] * b[1] - a[1] * b[0]; o[0] = x; o[1] = y; o[2] = z; return o; };
const vnorm = (o, a) => { const l = vlen(a) || 1; return vsc(o, a, 1 / l); };
const vlerp = (o, a, b, t) => (o[0] = lerp(a[0], b[0], t), o[1] = lerp(a[1], b[1], t), o[2] = lerp(a[2], b[2], t), o);
const UP = [0, 1, 0];
/* Heading convention: yaw 0 faces +Z; right-hand screen side is F x UP. */
const fwdYaw = (o, yaw) => vset(o, sin(yaw), 0, cos(yaw));
const fwdYP = (o, yaw, p) => vset(o, sin(yaw) * cos(p), sin(p), cos(yaw) * cos(p));
/* Rotate unit vector a toward unit vector b by at most ang radians. */
function rotToward(o, a, b, ang) {
  const d = clamp(vdot(a, b), -1, 1), th = Math.acos(d);
  if (th <= ang || th < 1e-5) return vcopy(o, b);
  const t = ang / th;
  const s = sin(th), wa = sin((1 - t) * th) / s, wb = sin(t * th) / s;
  o[0] = a[0] * wa + b[0] * wb; o[1] = a[1] * wa + b[1] * wb; o[2] = a[2] * wa + b[2] * wb;
  return vnorm(o, o);
}

/* ------------------------------------------------------------------ mat4 -- */
const M4 = {
  create() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(o, a, b) {
    const a0 = a[0], a1 = a[1], a2 = a[2], a3 = a[3], a4 = a[4], a5 = a[5], a6 = a[6], a7 = a[7],
      a8 = a[8], a9 = a[9], a10 = a[10], a11 = a[11], a12 = a[12], a13 = a[13], a14 = a[14], a15 = a[15];
    for (let i = 0; i < 16; i += 4) {
      const b0 = b[i], b1 = b[i + 1], b2 = b[i + 2], b3 = b[i + 3];
      o[i] = a0 * b0 + a4 * b1 + a8 * b2 + a12 * b3;
      o[i + 1] = a1 * b0 + a5 * b1 + a9 * b2 + a13 * b3;
      o[i + 2] = a2 * b0 + a6 * b1 + a10 * b2 + a14 * b3;
      o[i + 3] = a3 * b0 + a7 * b1 + a11 * b2 + a15 * b3;
    }
    return o;
  },
  persp(o, fy, asp, n, f) {
    const t = 1 / Math.tan(fy / 2); o.fill(0);
    o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); return o;
  },
  view(o, e, R, U, F) {
    o[0] = R[0]; o[1] = U[0]; o[2] = -F[0]; o[3] = 0;
    o[4] = R[1]; o[5] = U[1]; o[6] = -F[1]; o[7] = 0;
    o[8] = R[2]; o[9] = U[2]; o[10] = -F[2]; o[11] = 0;
    o[12] = -vdot(R, e); o[13] = -vdot(U, e); o[14] = vdot(F, e); o[15] = 1; return o;
  },
  basis(o, R, U, F, p, sx = 1, sy = 1, sz = 1) {
    o[0] = R[0] * sx; o[1] = R[1] * sx; o[2] = R[2] * sx; o[3] = 0;
    o[4] = U[0] * sy; o[5] = U[1] * sy; o[6] = U[2] * sy; o[7] = 0;
    o[8] = F[0] * sz; o[9] = F[1] * sz; o[10] = F[2] * sz; o[11] = 0;
    o[12] = p[0]; o[13] = p[1]; o[14] = p[2]; o[15] = 1; return o;
  },
  copy(o, a) { o.set(a); return o; },
  translate(o, m, x, y, z) {
    if (o !== m) o.set(m);
    o[12] = m[0] * x + m[4] * y + m[8] * z + m[12];
    o[13] = m[1] * x + m[5] * y + m[9] * z + m[13];
    o[14] = m[2] * x + m[6] * y + m[10] * z + m[14];
    return o;
  },
  rotX(o, m, a) {
    if (o !== m) o.set(m);
    const c = cos(a), s = sin(a);
    for (let i = 0; i < 3; i++) { const y = m[4 + i], z = m[8 + i]; o[4 + i] = y * c + z * s; o[8 + i] = z * c - y * s; }
    return o;
  },
  rotY(o, m, a) {
    if (o !== m) o.set(m);
    const c = cos(a), s = sin(a);
    for (let i = 0; i < 3; i++) { const x = m[i], z = m[8 + i]; o[i] = x * c - z * s; o[8 + i] = x * s + z * c; }
    return o;
  },
  rotZ(o, m, a) {
    if (o !== m) o.set(m);
    const c = cos(a), s = sin(a);
    for (let i = 0; i < 3; i++) { const x = m[i], y = m[4 + i]; o[i] = x * c + y * s; o[4 + i] = y * c - x * s; }
    return o;
  },
  scale(o, m, x, y, z) {
    if (o !== m) o.set(m);
    for (let i = 0; i < 3; i++) { o[i] *= x; o[4 + i] *= y; o[8 + i] *= z; }
    return o;
  },
  point(o, m, x, y, z) {
    o[0] = m[0] * x + m[4] * y + m[8] * z + m[12];
    o[1] = m[1] * x + m[5] * y + m[9] * z + m[13];
    o[2] = m[2] * x + m[6] * y + m[10] * z + m[14];
    return o;
  }
};

/* --------------------------------------------------------------- storage -- */
const STORE_KEY = 'neverstill.v1';
const settings = { res: 270, crt: true, music: 7, sfx: 8, voice: true, invertY: false, shake: true, mouse: false };
let hiscores = [['ACE', 60000], ['JET', 45000], ['SKY', 30000], ['ZIP', 20000], ['RUN', 10000]];
function loadStore() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (d && d.settings) Object.assign(settings, d.settings);
    if (d && Array.isArray(d.hi) && d.hi.length) hiscores = d.hi.slice(0, 5).map(r => [String(r[0]).slice(0, 3), r[1] | 0]);
  } catch (e) { /* private mode or blocked storage: defaults are fine */ }
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ settings, hi: hiscores })); } catch (e) { }
}
loadStore();
if (QS.get('res')) settings.res = clamp(+QS.get('res') || 270, 160, 720);

/* -------------------------------------------------------------------- GL -- */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('fallback').hidden = false; canvas.style.display = 'none'; return; }

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error(log + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
    throw new Error('shader: ' + log);
  }
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}

/* Shared GLSL: dithered quantisation, sky, haze, fog. */
const GLSL_HEAD = `#version 300 es
precision highp float;
precision highp int;
`;
const GLSL_COMMON = `
uniform vec3 uCam;
uniform vec3 uSkyTop, uSkyHor, uSkyLow, uFogCol, uSunDir, uLightDir, uSunCol, uLight, uAmbSky, uAmbGnd;
uniform vec3 uMtnA, uMtnB, uCloudCol;
uniform float uTime, uFogD, uFogFar, uSunSize, uStripes, uStars, uClouds, uLevels, uSun2Size, uMesa;
uniform vec3 uSun2Dir, uSun2Col;
float bayer(vec2 p){
  int x = int(mod(p.x, 4.0)), y = int(mod(p.y, 4.0));
  float m[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
  return (m[x + y * 4] + 0.5) / 16.0;
}
vec3 retro(vec3 c){ return floor(clamp(c, 0.0, 1.0) * uLevels + bayer(gl_FragCoord.xy)) / uLevels; }
float h13(vec3 p){ p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
float vn3(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h13(i), h13(i + vec3(1,0,0)), f.x), mix(h13(i + vec3(0,1,0)), h13(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h13(i + vec3(0,0,1)), h13(i + vec3(1,0,1)), f.x), mix(h13(i + vec3(0,1,1)), h13(i + vec3(1,1,1)), f.x), f.y), f.z);
}
vec3 hazeCol(vec3 d){
  vec2 a = normalize(d.xz + 1e-5), b = normalize(uSunDir.xz + 1e-5);
  float s = max(dot(a, b), 0.0);
  return mix(uFogCol, uSunCol, pow(s, 6.0) * 0.32);
}
float fogF(float dist){
  float f = 1.0 - exp(-pow(dist * uFogD, 2.0));
  return max(f, smoothstep(uFogFar * 0.72, uFogFar, dist));
}
vec3 applyFog(vec3 c, vec3 wp){
  vec3 d = wp - uCam; float dist = length(d);
  return mix(c, hazeCol(d / max(dist, 1e-3)), fogF(dist));
}
vec3 sky(vec3 d){
  float e = d.y;
  vec3 hz = hazeCol(d);
  vec3 c = e >= 0.0 ? mix(hz, uSkyTop, pow(clamp(e * 2.1, 0.0, 1.0), 0.72)) : mix(hz, uSkyLow, clamp(-e * 2.0, 0.0, 1.0));
  float sd = dot(d, uSunDir);
  c += uSunCol * pow(max(sd, 0.0), 14.0) * 0.28;
  if (uStars > 0.0 && e > 0.0) {
    vec3 q = floor(d * 330.0); float h = h13(q);
    if (h > 0.9972) { float tw = 0.55 + 0.45 * sin(uTime * 2.6 + h * 911.0); c = mix(c, vec3(1.0, 0.95, 0.9), uStars * tw * smoothstep(0.0, 0.2, e)); }
  }
  /* sun disc with optional arcade slits */
  float ang = acos(clamp(sd, -1.0, 1.0));
  if (ang < uSunSize) {
    float rel = (d.y - uSunDir.y) / uSunSize;
    bool cut = uStripes > 0.0 && rel < 0.15 && fract(rel * 5.0 + uTime * 0.25) < 0.18 + 0.28 * clamp(-rel, 0.0, 1.0);
    if (!cut) c = mix(vec3(1.0, 1.0, 0.92), uSunCol, clamp(0.35 - rel * 0.6, 0.0, 1.0));
  }
  if (uSun2Size > 0.0) {
    float s2 = dot(d, uSun2Dir);
    c += uSun2Col * pow(max(s2, 0.0), 30.0) * 0.22;
    if (acos(clamp(s2, -1.0, 1.0)) < uSun2Size) c = mix(uSun2Col, vec3(1.0, 0.92, 0.7), 0.2);
  }
  float az = atan(d.z, d.x);
  if (uClouds > 0.0 && e > 0.0) {
    float band = smoothstep(0.03, 0.09, e) * (1.0 - smoothstep(0.22, 0.42, e));
    vec3 cp = vec3(cos(az) * 5.0, sin(az) * 5.0, e * 26.0) + vec3(uTime * 0.02, 0.0, 0.0);
    float n = vn3(cp) * 0.65 + vn3(cp * 2.3) * 0.35;
    float cl = n * band;
    if (cl > 0.36) c = mix(c, uCloudCol, uClouds * (cl > 0.44 ? 0.95 : 0.6));
  }
  float m1 = 0.038 + 0.026 * sin(az * 3.0 + 1.3) + 0.018 * sin(az * 7.0 + 0.4) + 0.010 * sin(az * 17.0 + 2.0) + 0.004 * sin(az * 41.0);
  float m2 = 0.018 + 0.016 * sin(az * 5.0 + 3.1) + 0.011 * sin(az * 11.0 + 1.0) + 0.006 * sin(az * 23.0 + 0.7);
  if (uMesa > 0.0) {
    /* butte skyline: flat tops, sheer walls, the odd spire */
    float n1 = sin(az * 5.0 + 1.1) * 0.55 + sin(az * 11.0 + 2.3) * 0.3 + sin(az * 23.0 + 0.4) * 0.15;
    float n2 = sin(az * 7.0 + 3.3) * 0.5 + sin(az * 17.0 + 0.9) * 0.35 + sin(az * 31.0 + 2.0) * 0.15;
    m1 = 0.01 + smoothstep(0.16, 0.22, n1) * (0.05 + 0.016 * sin(az * 3.0)) + step(0.992, sin(az * 53.0)) * 0.035;
    m2 = 0.005 + smoothstep(0.32, 0.38, n2) * (0.026 + 0.01 * sin(az * 4.0 + 1.0));
  }
  if (e < m1 && e > -0.2) c = mix(uMtnA, hz, 0.42);
  if (e < m1 && e > m1 - 0.004) c = mix(c, uSkyHor * 1.12, 0.5);
  if (e < m2 && e > -0.2) c = mix(uMtnB, hz, 0.22);
  if (e < -0.004) c = mix(c, hz, smoothstep(-0.004, -0.03, e));
  return c;
}
`;

/* ------------------------------------------------------------- programs -- */
const VS_FULL = GLSL_HEAD + `
layout(location=0) in vec2 aP;
out vec2 vUv;
void main(){ vUv = aP * 0.5 + 0.5; gl_Position = vec4(aP, 0.0, 1.0); }`;

const PROG = {};
function buildPrograms() {
  PROG.sky = program(VS_FULL, GLSL_HEAD + GLSL_COMMON + `
in vec2 vUv; out vec4 o;
uniform vec3 uCR, uCU, uCF; uniform vec2 uTan;
void main(){
  vec2 s = vUv * 2.0 - 1.0;
  vec3 d = normalize(uCF + s.x * uTan.x * uCR + s.y * uTan.y * uCU);
  float sm = smoothstep(cos(uSunSize * 1.15), cos(uSunSize * 0.9), dot(d, uSunDir));
  o = vec4(retro(sky(d)), sm * 0.55);
}`);

  PROG.terrain = program(GLSL_HEAD + `
layout(location=0) in vec3 aPos;
layout(location=1) in float aHc;
layout(location=2) in vec3 aNrm;
uniform mat4 uVP; uniform vec3 uCam; uniform vec2 uMorph;
out vec3 vW; out vec3 vN;
void main(){
  float d = distance(aPos.xz, uCam.xz);
  float k = clamp((d - uMorph.x) / max(uMorph.y - uMorph.x, 1e-3), 0.0, 1.0);
  vec3 p = vec3(aPos.x, mix(aPos.y, aHc, k), aPos.z);
  vW = p; vN = aNrm;
  gl_Position = uVP * vec4(p, 1.0);
}`, GLSL_HEAD + GLSL_COMMON + `
in vec3 vW; in vec3 vN; out vec4 o;
uniform vec3 uGA, uGB, uHA, uHB, uRock, uSand, uGridCol;
uniform float uTile, uWL, uHigh, uGrid, uLava;
uniform vec4 uShadow[32]; uniform int uShadowN;
float checker(vec2 p){
  vec2 w = fwidth(p) + 1e-4;
  vec2 i = 2.0 * (abs(fract((p - 0.5 * w) * 0.5) - 0.5) - abs(fract((p + 0.5 * w) * 0.5) - 0.5)) / w;
  return 0.5 - 0.5 * i.x * i.y;
}
void main(){
  vec3 n = normalize(vN);
  vec2 q = vW.xz / uTile;
  float ch = checker(q);
  float hi = smoothstep(uHigh, uHigh + 30.0, vW.y + 8.0 * sin(vW.x * 0.013) * cos(vW.z * 0.011));
  vec3 A = mix(uGA, uHA, hi), B = mix(uGB, uHB, hi);
  vec3 col = mix(A, B, ch);
  float slope = 1.0 - n.y;
  col = mix(col, uRock * (0.86 + 0.22 * ch), smoothstep(0.32, 0.5, slope));
  float beach = 1.0 - smoothstep(uWL + 1.2, uWL + 3.6, vW.y);
  col = mix(col, uSand * (0.9 + 0.16 * ch), beach);
  if (uGrid > 0.0) {
    vec2 g = abs(fract(q) - 0.5); float gw = fwidth(q.x) * 1.2 + 0.02;
    float line = 1.0 - smoothstep(0.5 - gw, 0.5, max(g.x, g.y));
    col = mix(col, uGridCol, (1.0 - line) * uGrid);
  }
  float dif = max(dot(n, uLightDir), 0.0);
  float hemi = n.y * 0.5 + 0.5;
  vec3 lit = col * (mix(uAmbGnd, uAmbSky, hemi) + uLight * dif);
  if (uLava > 0.0) lit += uGridCol * uLava * smoothstep(uWL + 5.0, uWL, vW.y) * 0.6;
  float sh = 0.0;
  for (int i = 0; i < 32; i++) {
    if (i >= uShadowN) break;
    vec4 s = uShadow[i];
    vec2 dd = (vW.xz - s.xy) / s.z;
    float r = dot(dd, dd);
    if (r < 1.0) sh = max(sh, s.w * (r < 0.55 ? 1.0 : step(bayer(gl_FragCoord.xy), (1.0 - r) / 0.45)));

function drawKeyArt() {

    const bs = HH / ih, bw = iw * bs;

    hud.fillStyle = 'rgba(12,4,20,0.62)'; hud.fillRect(0, 0, HW, HH); hud.globalAlpha = 1;

    const cs = 4;
