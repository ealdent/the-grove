    ctx.fillStyle = PALETTE.lichen;
    ctx.font = `bold 15px Georgia, serif`;
    ctx.fillText("Lay this row true:", x + w / 2, y + 291);
    drawWrapped(level.objective, x + w / 2, y + 319, w - 110, 22, `16px Georgia, serif`, PALETTE.charcoal, "center", 4);
    ctx.restore();
    drawButton("Place Sava's first foot", x + w / 2 - 135, y + h - 76, 270, 50, beginAct, true);
  }

  function drawPlay(now) {
    const level = LEVELS[levelIndex];
    drawWorkshop(now, false);
    ctx.fillStyle = "rgba(43,36,31,0.31)";
    ctx.fillRect(0, 0, viewW, viewH);
    drawGameHeader(level);
    const layout = drawBoard(level, logic, now);
    drawSidebar(layout, level, logic);
    drawCompactBraid(level, logic, layout);
    drawControls(layout);
    drawHintRibbon(level, layout);

    if (logic.mode === "snarl") drawSnarlOverlay(logic, now);
    else if (logic.mode === "frayed") drawFrayedOverlay();
    else if (logic.mode === "won") drawWonOverlay(level);
  }

  function drawWovenMaret(x, y, size, now) {
    ctx.save();
    ctx.globalAlpha = 0.72;
    drawActorShape(x, y, size, { live: false, iteration: 4 }, now, false, false, false);
    ctx.globalAlpha = 0.72;
    ctx.strokeStyle = PALETTE.charcoal;
    ctx.lineWidth = Math.max(2, size * 0.025);
    ctx.beginPath();
    ctx.moveTo(x - size * 0.28, y - size * 0.68);
    ctx.quadraticCurveTo(x, y - size * 1.02, x + size * 0.31, y - size * 0.68);
    ctx.stroke();
    ctx.restore();
  }

  function drawEnding(now) {
    const elapsed = now - screenEnteredAt;
    const compact = viewW < 760;
    drawWorkshop(now, true);
    const loomW = Math.min(viewW * 0.54, 760);
    const loomH = Math.min(viewH * 0.75, 680);
    const loomX = viewW - loomW - Math.max(24, viewW * 0.035);
    const loomY = viewH * 0.08;
    drawWarpLoom(loomX, loomY, loomW, loomH, now, true);
    const flatten = clamp((elapsed - 500) / 2300, 0, 1);
    for (let i = 0; i < 4; i++) {
      const fx = loomX + loomW * (0.3 + i * 0.13);
      const fy = loomY + loomH * (0.43 + Math.sin(i) * 0.025);
      ctx.save();
      ctx.translate(fx, fy);
      ctx.scale(1, 1 - flatten * 0.78);
      ctx.translate(-fx, -fy);
      drawActorShape(fx, fy, loomH * 0.11, { live: false, iteration: i + 1 }, now, false, false, false);
      ctx.restore();
    }
    if (elapsed > 2100) drawWovenMaret(loomX + loomW * 0.51, loomY + loomH * 0.62, loomH * 0.2, now);
    drawActorShape(loomX - 28, loomY + loomH * 0.93, Math.min(116, viewH * 0.145), { live: true, iteration: 5 }, now, true, false, false);

    const w = compact ? viewW - 24 : Math.min(650, viewW * 0.47, viewW - 42);
    const x = compact ? 12 : Math.max(21, viewW * 0.04);
    const y = compact ? 12 : viewH * 0.1;
    const h = compact ? Math.min(viewH - 24, 530) : Math.min(610, viewH * 0.76);
    fillRound(x, y, w, h, 12, "rgba(43,36,31,0.79)", PALETTE.saffron, 2);
    ctx.save();
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = PALETTE.saffron;
    ctx.font = `bold ${compact ? clamp(w * 0.07, 22, 28) : clamp(w * 0.073, 31, 46)}px Georgia, serif`;
    ctx.fillText("The morning binds off", x + 28, y + 28);
    let ty = y + (compact ? 78 : 96);
    const endingLines = compact ? [
      "The Woven Figures loosen their shoulders and lie flat—not dead, child, but finished—becoming saffron road beneath the dawn.",
      "Maret's black strand remains. It was not a mistake; she gave grief one place, so it would not enter every color.",
      "The east brightens. Sava carries no stolen past; every faithful footstep rises beside the sun."
    ] : [
      "The Woven Figures loosen their shoulders. One by one, they lie flat—not dead, child, but finished—becoming the very road of saffron beneath the dawn.",
      "Maret's black strand remains across the cloth. It was never a mistake. She wove the shape of her leaving so grief would have a place, and would not spread into every color.",
      "Beyond the cliffside windows, the east finally brightens. Sava carries no stolen past with her; every faithful footstep rises in the sky beside the sun."
    ];
    endingLines.forEach((line, i) => {
      const lineHeight = compact ? (viewH < 520 ? 15 : 18) : 23;
      const fontSize = compact ? (viewH < 520 ? 12 : 14) : 17;
      ty += drawWrapped(line, x + (compact ? 20 : 28), ty, w - (compact ? 40 : 56), lineHeight, `${i === 1 ? "italic " : ""}${fontSize}px Georgia, serif`, i === 1 ? PALETTE.linen : PALETTE.bone, "left", compact ? 5 : 6) + (compact ? 8 : 15);
    });
    ctx.fillStyle = PALETTE.saffron;
    ctx.font = `italic ${compact ? (viewH < 520 ? 14 : 17) : 21}px Georgia, serif`;
    if (compact) {
      drawWrapped("There, child. Morning remembers what it cost.", x + 20, Math.min(y + h - 113, ty + 5), w - 40, viewH < 520 ? 16 : 20, `italic ${viewH < 520 ? 14 : 17}px Georgia, serif`, PALETTE.saffron, "left", 2);
    } else {
      ctx.fillText("There, child. Morning remembers what it cost.", x + 28, Math.min(y + h - 108, ty + 5));
    }
    ctx.restore();
    drawButton("Let the house see another dawn", x + (compact ? 20 : 28), y + h - 69, Math.min(310, w - (compact ? 40 : 56)), 45, returnToFirstLight, true);
  }

  function drawTestOverlay() {
    if (!testOpen || !testReport) return;
    drawVeil(0.79);
    const w = Math.min(850, viewW - 34);
    const h = Math.min(720, viewH - 34);
    const x = (viewW - w) / 2;
    const y = (viewH - h) / 2;
    fillRound(x, y, w, h, 12, PALETTE.bone, testReport.ok ? PALETTE.lichen : PALETTE.madder, 5);
    ctx.save();
    ctx.fillStyle = testReport.ok ? PALETTE.lichen : PALETTE.madder;
    ctx.font = `bold ${clamp(w * 0.045, 26, 38)}px Georgia, serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText("I have read the cloth's underside", x + w / 2, y + 25);
    drawWrapped(testReport.summary, x + w / 2, y + 73, w - 70, 23, `italic 18px Georgia, serif`, PALETTE.oxblood, "center", 3);
    let cy = y + 126;
    testReport.checks.forEach((check, i) => {
      const rowH = Math.max(30, wrapLines(check.text, w - 98, `14px Georgia, serif`, 2).length * 18 + 10);
      if (cy + rowH > y + h - 83) return;
      ctx.fillStyle = check.ok ? PALETTE.lichen : PALETTE.madder;
      ctx.beginPath();
      ctx.moveTo(x + 30, cy + 9);
      ctx.lineTo(x + 37, cy + 17);
      ctx.lineTo(x + 48, cy + 3);
      ctx.lineWidth = 3;
      ctx.strokeStyle = check.ok ? PALETTE.lichen : PALETTE.madder;
      ctx.stroke();
      drawWrapped(check.text, x + 60, cy, w - 88, 18, `14px Georgia, serif`, PALETTE.charcoal, "left", 2);
      cy += rowH;
    });
    ctx.restore();
    drawButton("Fold the underside away", x + w / 2 - 130, y + h - 65, 260, 46, () => { testOpen = false; }, testReport.ok);
  }

  function render(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, viewW, viewH);
    hitRegions = [];
    if (screen === "title") drawTitle(now);
    else if (screen === "act-intro") drawActIntro(now);
    else if (screen === "play") drawPlay(now);
    else if (screen === "ending") drawEnding(now);
    drawTestOverlay();
    requestAnimationFrame(render);
  }

  window.__LOOM_DEBUG__ = Object.freeze({
    runSelfTests,
    state: () => JSON.parse(logicDigest(logic)),
    solutionState: index => JSON.parse(logicDigest(derive(LEVELS[index], LEVELS[index].solutionLog))),
    sabotageState: () => JSON.parse(logicDigest(derive(LEVELS[2], LEVELS[2].sabotageLog))),
    playSolution: index => {
      levelIndex = clamp(index, 0, LEVELS.length - 1);
      screen = "play";
      inputLog = LEVELS[levelIndex].solutionLog.slice();
      logic = derive(LEVELS[levelIndex], inputLog);
      return JSON.parse(logicDigest(logic));
    },
    openLevel: index => {
      levelIndex = clamp(index, 0, LEVELS.length - 1);
      inputLog = [];
      logic = derive(LEVELS[levelIndex], inputLog);
      screen = "play";
      return JSON.parse(logicDigest(logic));
    },
    input: code => { appendInput(String(code).toUpperCase()); return JSON.parse(logicDigest(logic)); },
    undo: () => { pickBackBeat(); return JSON.parse(logicDigest(logic)); },
    log: () => inputLog.slice(),
    screen: () => screen
  });

  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("keydown", handleKey, { passive: false });
  canvas.addEventListener("pointerdown", handlePointer);
  resizeCanvas();
  requestAnimationFrame(render);
  canvas.focus();

  if (new URLSearchParams(window.location.search).has("selftest")) {
    setTimeout(inspectKnots, 0);
  }
})();
</script>
</body>
</html>
