<title>What the Cylinder Keeps</title>
<!--
=====================================================================
  WHAT THE CYLINDER KEEPS
  a music-box puzzle in three airs
=====================================================================

TITLE
  What the Cylinder Keeps

PREMISE
  You are the dancer of a Swiss cylinder music box: an enamelled tin
  figure, four inches tall, standing on a stage of walnut and red
  velvet under an open lid. Someone has wound the box and walked away.
  The comb plays one air, the cylinder turns once, and the air begins
  again. That is all a music box knows how to do.

  But this box was made by a repairer who over-reached. Its cylinder
  is not fixed. Whatever the dancer does while the air plays, the
  mechanism pins into the brass: every step she takes becomes a new
  row of pins, and when the cylinder comes round again the comb reads
  that row and drives a second figure through it. The "past selves"
  are the PINNED: tarnished brass automata, stamped from her own
  pattern, stepping exactly where she stepped, on exactly the notes
  she stepped there. The comb has room for four such voices beside
  hers. They are not ghosts and they are not memories. They are
  mechanism, and mechanism does not improvise.

  That is the danger. A pinned figure expects the stage as it was:
  the scenery flat it shoved, the curtain that stood open, the tile
  that was empty. If the dancer changes any of that, the pin strikes
  a tooth that is no longer there. The comb SNAGS. The air stops on
  a wrong note, the governor locks, and the whole box must be lifted
  back to the last turn that still agreed with itself.

  The dancer wants one thing: the winding key the repairer left lying
  on the stage, carried to the escapement at the heart of the works.
  A hand on the escapement stops the air. To reach it she must use
  the pinned figures as the extra hands she does not have, and then,
  when the route is finally clear, she must resist the fastest path
  across the stage, because the fastest path runs straight through
  the dances that made it possible.

ART DIRECTION
  Palette (used verbatim in the code):
    walnut case      #3b2314   deep case shadow  #24140b
    stage floor      #5a3a22   floor grain       #6b4629
    red velvet       #7a1f2b   velvet highlight  #a33a46
    brass            #c9a54e   bright brass      #e8cc7a
    tarnished brass  #8f6b2e   old brass shadow  #5c4218
    steel comb       #b8bcc0   steel shadow      #6f757b
    ivory enamel     #efe3c6   rose sash         #b5485a
    ink / engraving  #1d1109   lamp glow         #ffd9a0
    snag copper      #d8642a
  Light source: a single warm lamp above and to the left of the open
  lid. Everything casts a short shadow down-right; brass takes a
  highlight on its upper-left edge.
  Shape language: turned cylinders, small teeth, flat stamped tin
  figures on pin stems, painted scenery flats with rounded frames,
  velvet folds, engraved brass plates with bevelled edges. Nothing
  glows on its own; light is reflected, never emitted, except the
  lamp itself and the copper flash of a snag.
  Era / texture: a late-nineteenth-century Sainte-Croix cylinder box,
  a little worn: veneer grain, dust in lamplight, a mirror in the lid.
  Typography: an old-style serif (Georgia / Iowan Old Style / Palatino
  fallbacks). Plates use small caps and roman numerals; the repairer's
  voice is set in italic serif. No monospace anywhere; this is not a
  terminal, it is furniture.

VOICE
  Everything is spoken by the box's old repairer, addressing the
  dancer as an apprentice: precise about mechanism, fond, unhurried,
  and never once surprised.

GLOSSARY (fiction -> mechanic)
  the dancer      the live protagonist
  the pinned      recordings of previous turns (up to four)
  a turn          one iteration of the loop (36 notes)
  a note          one tick
  an air          a level
  the cylinder    the input timeline: one row of pins per turn
  the comb        the playhead; a snag is the catastrophe
  a treadle       an occupancy-triggered floor key
  a curtain       a doorway held open only while its treadle is weighted
  a flat          a pushable painted scenery piece (Sokoban rules)
  the key         the carryable winding key
  the escapement  the goal tile (needs the key and an open path)
  lifting a turn  undo the current iteration
  taking back a step   undo one tick

RULES DECIDED WHERE THE BRIEF WAS SILENT
  * Resolution order within a note: pinned figures move first, oldest
    turn first, then the dancer. Each move is checked against the
    stage exactly as it stands at that instant. Two figures never
    share a tile; whoever resolves later is the one who is blocked.
    A blocked dancer simply loses the note. A blocked pinned figure
    is a snag, because in its own turn it was not blocked.
  * A pinned figure is compared, every note, against what it did in
    its own turn: the tile it ended on, whether it pushed a flat, and
    whether it lifted the key. Any difference is a snag.
  * The stage resets at the start of every turn (flats, key, curtains).
    The pinned rebuild the past by repeating it.
  * A curtain is open exactly while some figure or flat weights any
    treadle linked to it. A figure already standing in a curtain tile
    when it closes is draped, not crushed: she may step out, but
    nothing may step in.
  * The key is lifted by whoever steps onto its tile first, pinned or
    dancer; the pinned lift it again every turn if they did before.
  * Letting the air run out (Enter) fills the remaining notes with
    stillness. The undo lever treats that as one step.
  * The comb holds four spare voices. If a fifth turn ends without the
    escapement reached, the box halts: lift a turn or begin the air
    again.
  * Game state is a pure function of (air, input log). Undo pops one
    token and recomputes from the first note, so undo-then-replay is
    identical by construction.
=====================================================================
-->

<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="title" class="card"></div>
  <div id="snag" class="card snag"></div>
  <div id="between" class="card"></div>
  <div id="ending" class="card"></div>
  <div id="testout"></div>
  <div id="test" title="Runs every air through its intended solution, unseen.">the repairer's bench test</div>
</div>
<script>
'use strict';
// @@ENGINE-BEGIN  (pure logic: no DOM, no time, no randomness)
const NOTES = 36, MAX_PINNED = 4;
const DIRS = { U:[0,-1], D:[0,1], L:[-1,0], R:[1,0] };

function parseAir(def){
  const rows = def.map, h = rows.length, w = rows[0].length;
  const air = { name:def.name, title:def.title, w, h, walls:[], start:null, key:null, goal:null,
    treadles:[], curtains:[], flats:[], solution:def.solution, intro:def.intro, outro:def.outro, hint:def.hint };
  for (let y=0;y<h;y++){ air.walls.push([]); for (let x=0;x<w;x++){
    const ch = rows[y][x]; air.walls[y].push(ch==='#');
    if (ch==='S') air.start={x,y};
    else if (ch==='K') air.key={x,y};
    else if (ch==='G') air.goal={x,y};
    else if (ch>='a'&&ch<='d') air.treadles.push({x,y,link:ch.toUpperCase()});
    else if (ch>='A'&&ch<='D') air.curtains.push({x,y,id:ch});
    else if (ch==='F') air.flats.push({x,y});
  }}
  return air;
}

function freshTurn(air, recs, turn, tokenStart){
  const fig = (rec)=>({ x:air.start.x, y:air.start.y, fx:air.start.x, fy:air.start.y, face:1, hasKey:false, rec });
  return { air, turn, note:0, recs, tokenStart,
    flats: air.flats.map(f=>({x:f.x,y:f.y,fx:f.x,fy:f.y})), keyAt: air.key ? {x:air.key.x,y:air.key.y} : null,
    dancer: fig(null), pinned: recs.map(r=>fig(r)),
    curInputs:[], curExpect:[], won:false, snag:null, full:false };
}

function figureAt(st, x, y, except){
  if (st.dancer!==except && st.dancer.x===x && st.dancer.y===y) return st.dancer;
  for (const p of st.pinned) if (p!==except && p.x===x && p.y===y) return p;
  return null;
}
function flatAt(st, x, y){ return st.flats.find(f=>f.x===x&&f.y===y) || null; }
function treadleWeighted(st, t){ return !!(figureAt(st,t.x,t.y,null) || flatAt(st,t.x,t.y)); }
function curtainOpen(st, id){ return st.air.treadles.some(t=>t.link===id && treadleWeighted(st,t)); }
function closedCurtainAt(st, x, y){ const c = st.air.curtains.find(c=>c.x===x&&c.y===y); return c ? !curtainOpen(st,c.id) : false; }
function isWall(air, x, y){ return x<0||y<0||x>=air.w||y>=air.h||air.walls[y][x]; }

// One figure attempts one token. Returns what actually happened.
function moveFigure(st, fig, tok){
  fig.fx = fig.x; fig.fy = fig.y;
  const out = { x:fig.x, y:fig.y, push:false, lift:false, tok, reason:null, tile:null };
  const d = DIRS[tok];
  if (d){
    if (d[0]) fig.face = d[0];
    const nx = fig.x+d[0], ny = fig.y+d[1];
    out.tile = {x:nx,y:ny};
    if (isWall(st.air,nx,ny)) out.reason='wall';
    else if (closedCurtainAt(st,nx,ny)) out.reason='curtain';
    else if (figureAt(st,nx,ny,fig)) out.reason = figureAt(st,nx,ny,fig)===st.dancer ? 'dancer' : 'pinned';
    else {
      const fl = flatAt(st,nx,ny);
      if (fl){
        const bx = nx+d[0], by = ny+d[1];
        if (isWall(st.air,bx,by) || closedCurtainAt(st,bx,by) || figureAt(st,bx,by,null) || flatAt(st,bx,by)) out.reason='flat';
        else { fl.fx=fl.x; fl.fy=fl.y; fl.x=bx; fl.y=by; fig.x=nx; fig.y=ny; out.push=true; }
      } else { fig.x=nx; fig.y=ny; }
    }
    out.x=fig.x; out.y=fig.y;
  }
  if (st.keyAt && st.keyAt.x===fig.x && st.keyAt.y===fig.y){ st.keyAt=null; fig.hasKey=true; out.lift=true; }
  return out;
}

function sameOutcome(a, b){ return a.x===b.x && a.y===b.y && a.push===b.push && a.lift===b.lift; }

// Advance the whole stage by one note. Returns false if the stage has halted.
function playNote(st, tok){
  if (st.won || st.snag || st.full) return false;
  st.note++;
  for (const f of st.flats){ f.fx=f.x; f.fy=f.y; }
  for (let i=0;i<st.pinned.length;i++){
    const p = st.pinned[i], exp = p.rec.expect[st.note-1];
    const act = moveFigure(st, p, p.rec.inputs[st.note-1]);
    if (!sameOutcome(act, exp)){
      st.snag = { idx:i, turn:p.rec.turn, note:st.note, tok:act.tok, expected:exp, actual:act,
        tile: act.tile || {x:p.x,y:p.y} };
      return false;
    }
  }
  const act = moveFigure(st, st.dancer, tok);
  st.curInputs.push(tok); st.curExpect.push({x:act.x,y:act.y,push:act.push,lift:act.lift});
  if (st.dancer.hasKey && st.air.goal && st.dancer.x===st.air.goal.x && st.dancer.y===st.air.goal.y){ st.won=true; return false; }
  if (st.note===NOTES){
    if (st.recs.length>=MAX_PINNED){ st.full=true; return false; }
    st.recs.push({ turn:st.turn, inputs:st.curInputs, expect:st.curExpect });
    return 'turn';
  }
  return true;
}

// The whole game is this: an air and a list of tokens (U D L R W, or X = let the air run out).
function simulate(air, log){
  let st = freshTurn(air, [], 1, 0);
  for (let i=0;i<log.length;i++){
    const tok = log[i];
    if (tok==='X'){
      let r=true; while (st.note<NOTES && r){ r=playNote(st,'W'); if (r==='turn') break; }
      if (r==='turn') st = freshTurn(air, st.recs, st.turn+1, i+1);
    } else {
      const r = playNote(st, tok);
      if (r==='turn') st = freshTurn(air, st.recs, st.turn+1, i+1);
    }
    if (st.won || st.snag || st.full){ st.logLen = i+1; return st; }
  }
  st.logLen = log.length;
  return st;
}

function stateHash(st){
  return JSON.stringify({ t:st.turn, n:st.note, d:[st.dancer.x,st.dancer.y,st.dancer.hasKey],
    p:st.pinned.map(p=>[p.x,p.y,p.hasKey]), f:st.flats.map(f=>[f.x,f.y]), k:st.keyAt, w:st.won, s:!!st.snag, u:st.full,
    r:st.recs.map(r=>r.inputs.join('')) });
}
// @@ENGINE-END
// @@AIRS-BEGIN
// Map legend: # wall  . floor  S dancer's mark  K winding key  G escapement
//             a-d treadle (holds curtain A-D open while weighted)  A-D curtain  F flat
const AIR_DEFS = [
{ name:'Air the First', title:'The Lid Opens',
  map:[ '##############',
        '#............#',
        '#.S..........#',
        '#............#',
        '#.....####A###',
        '#.....#......#',
        '#..a..#..K...#',
        '#.....#......#',
        '#.....########',
        '#............#',
        '#.....G......#',
        '##############' ],
  // Turn 1: walk to the treadle and let the air run out on it.
  // Turn 2: through the curtain (held by the pinned), lift the key, out again, down to the escapement.
  solution: 'DDDDRX' + 'RRRRRRRR' + 'DDDD' + 'L' + 'RUUU' + 'LLLLL' + 'DDDDDDD' + 'R',
  intro: 'Someone has wound us and gone. Listen: the air is thirty-six notes long, and then the cylinder comes round and it all begins again. Watch what the brass does with your steps. The key lies behind the curtain, and the curtain holds only while its treadle is weighted. You cannot stand on a treadle and walk through a curtain in the same turn. Nobody can. But next turn you will not be alone.',
  hint: 'Stand on the treadle and let the air run out. Next turn, a brass figure will do it for you.',
  outro: 'There. The figure that held the treadle was you, one turn ago, stamped in brass. She will do it again as often as the cylinder asks. That is what the cylinder keeps.' },

{ name:'Air the Second', title:'Four Hands',
  map:[ '##############',
        '#S.......#...#',
        '#........#.K.#',
        '#........A...#',
        '#.a......#####',
        '#............#',
        '#..F.......b.#',
        '#............#',
        '#######B######',
        '#............#',
        '#.......G....#',
        '##############' ],
  // Turn 1: shove the flat east along the sixth row until it rests on the far treadle.
  // Turn 2: step aside of the first figure, stand on the near treadle.
  // Turn 3: let them pass, then key, curtain, curtain, escapement.
  solution: 'DDDDDR' + 'RRRRRRRR' + 'X' + 'RDDD' + 'X' + 'WDDR' + 'RRRRRRR' + 'RRU' + 'DLLL' + 'DDDD' + 'LDDRD',
  intro: 'Two curtains this time, and a painted flat on casters. A flat weights a treadle as well as a foot does, and it stays where it is shoved. Remember that the pinned move before you do, oldest first. If one of them wants the tile you are standing on, she cannot have it, and that is a snag. Give them room, and if you must, hold a note.',
  hint: 'A flat on a treadle holds a curtain as well as a foot does. Let the pinned move first; hold a note when they need your tile.',
  outro: 'Three of you, and not one of you could have done it alone. The flat sits on its treadle every turn now because you put it there once, and the brass remembers the shove.' },

{ name:'Air the Third', title:'The Mercy of the Comb',
  map:[ '##############',
        '######a###...#',
        '#S....F..A.K.#',
        '#.####.###...#',
        '#........#####',
        '#.######.#####',
        '#.######.#.G.#',
        '#.######.#...#',
        '#.######.#B###',
        '#.......F...b#',
        '#............#',
        '##############' ],
  // Turn 1: around by the low row, shove the corridor flat north onto its treadle, then back out of the way.
  // Turn 2: hold one note for the first figure, down the west side, shove the long flat onto the far treadle.
  // Turn 3: the quick way east would shove the flat before the first figure can. Wait for her. Then go.
  solution: 'DD' + 'RRRRR' + 'UU' + 'DD' + 'LLLL' + 'X' + 'W' + 'DDDDDDD' + 'RRRRRR' + 'RRRR' + 'X'
          + 'RRRR' + 'WWWWW' + 'R' + 'RRRRR' + 'LLLLL' + 'DD' + 'RR' + 'DDDDD' + 'RR' + 'UU' + 'R' + 'U',
  intro: 'The last air, and the longest walk. You will see the quick way at once: straight along the top, through the flat, to the curtain. Do not take it. That flat is not scenery to you any more; it is a promise you made to a turn that has not happened yet. Protect what the pinned expect to find. Wait, if waiting is what it costs.',
  hint: 'The quick way east breaks the promise. Hold your notes until the first figure has made her shove and stepped clear.',
  outro: '' }
];
const AIRS = AIR_DEFS.map(parseAir);

// The one mutable thing in the game: a log of tokens. Everything else is recomputed from it.
function makeGame(air){
  const g = { air, log:[], state:null,
    recompute(){ g.state = simulate(g.air, g.log); return g.state; },
    push(tok){ if (g.state.won||g.state.snag||g.state.full) return false; g.log.push(tok); return g.recompute(); },
    undo(){ if (!g.log.length) return false; g.log.pop(); return g.recompute(); },
    liftTurn(){ const s = g.state.tokenStart; if (g.log.length<=s && s>0){ g.log.length = Math.max(0, s-1); } else g.log.length = s; return g.recompute(); },
    restart(){ g.log.length = 0; return g.recompute(); } };
  g.recompute();
  return g;
}

// The repairer's bench test: every air, headless, plus the promises the brief makes.
function runSelfTest(){
  const out = [];
  const ok = (name, cond, detail)=> out.push({ name, pass:!!cond, detail: detail||'' });
  AIRS.forEach((air, i)=>{
    const sol = air.solution.split('');
    const st = simulate(air, sol);
    ok(air.name+': intended solution reaches the escapement', st.won && !st.snag && !st.full,
      st.won ? `won on turn ${st.turn}, note ${st.note}` : (st.snag ? `snag turn ${st.snag.turn} note ${st.snag.note}` : `turn ${st.turn} note ${st.note}`));
    ok(air.name+': recordings replayed to the end without a snag', !st.snag);
    // Undo to the very first note through the same lever the player uses, then replay.
    const g = makeGame(air); sol.forEach(t=>g.push(t)); const h1 = stateHash(g.state);
    let n=0; while (g.log.length){ g.undo(); n++; }
    const h0 = stateHash(g.state), hFresh = stateHash(simulate(air, []));
    sol.forEach(t=>g.push(t)); const h2 = stateHash(g.state);
    ok(air.name+': undo to the first note and replay gives the identical state', h1===h2 && h0===hFresh, `${n} steps taken back`);
    // Every prefix of the solution must be a legal, un-snagged history (no hidden reliance on the halt).
    let prefixOk = true; for (let k=1;k<sol.length;k++){ const s=simulate(air, sol.slice(0,k)); if (s.snag||s.full){ prefixOk=false; break; } }
    ok(air.name+': no prefix of the solution snags', prefixOk);
  });
  // Deliberately contradict history in the first air: the first figure doubles back; stand where she must step.
  const broken = simulate(AIRS[0], 'RRDDLLX'.split('').concat('DDWWWW'.split('')));
  ok('A contradicted history snags at the right turn, note and cause',
    broken.snag && broken.snag.turn===1 && broken.snag.note===6 && broken.snag.actual.reason==='dancer' && broken.snag.tile.x===2 && broken.snag.tile.y===4,
    broken.snag ? `turn ${broken.snag.turn}, note ${broken.snag.note}, ${broken.snag.actual.reason}` : 'no snag raised');
  // A flat shoved before its time: the third air's quick way.
  const quick = simulate(AIRS[2], (AIRS[2].solution.slice(0, AIRS[2].solution.lastIndexOf('X')+1) + 'RRRRRRRRRR').split(''));

  if (mode!=='play') return;
  const tok = KEYS[k] || (e.code==='Space' ? 'W' : (e.code==='Enter'||e.code==='NumpadEnter') ? 'X' : null); if (!tok) return; e.preventDefault();
  if (G.push(tok)) afterChange('step');
});
$('test').onclick = ()=>{
  const out = $('testout'); if (out.style.display==='block'){ out.style.display='none'; return; }
  const res = runSelfTest(), passed = res.filter(r=>r.pass).length;
  const lines = res.map(r=>`${r.pass?'holds':'FAILS'} · ${r.name}${r.detail?` (${r.detail})`:''}`);
  out.textContent = `The bench test: ${passed} of ${res.length} hold.\n` + lines.join('\n'); out.style.display='block';
  console.log('[bench test]', `${passed}/${res.length}`, res);
};
// Debug hash flags (unseen in play): #air=2  #solve  #break  #test
(function boot(){
  const h = new URLSearchParams(location.hash.replace(/^#/,'').replace(/&/g,'&'));
  showTitle();
  if (h.has('air')){ beginAir(Math.max(0, Math.min(AIRS.length-1, (+h.get('air')||1)-1)), false); }
  if (h.has('solve')){ for (const t of AIRS[ai].solution) G.push(t); afterChange('step'); }
  if (h.has('break')){ G.restart(); for (const t of 'RRDDLLXDDWWWW') G.push(t); afterChange('step'); }
  if (h.has('test')) $('test').click();
  requestAnimationFrame(function frame(now){ render(G.state, now); requestAnimationFrame(frame); });
})();
// @@UI-END
</script>
