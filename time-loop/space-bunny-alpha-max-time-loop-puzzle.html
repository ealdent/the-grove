  const L = V.levels[i];
  showCard(
    '<h2 style="margin-bottom:6px">' + (i+1) + ' &mdash; watch the ' + ['first','second','last'][i] + '</h2>' +
    '<h1>' + L.name + '</h1>' +
    '<h2>' + L.sub + '</h2>' +
    '<div class="rule brass"></div>' +
    L.log.map(function(p,k){ return '<p' + (k===0?' class="lede"':'') + '>' + p + '</p>'; }).join('') +
    (LEVELS[i].counsel ? '<p><em>' + LEVELS[i].counsel[0] + '</em></p>' : '') +
    '<div class="go">any key to begin the watch</div>', '', 'side');
}
function showTorn(f){
  const t = G.turns[G.turns.length-1];
  let why = '';
  if (f.kind === 'pos'){
    why = V.tear.pos.replace('{{tile}}', tileName(f.exp)).replace('{{tile2}}', tileName(f.act));
    if (f.why === 'door') why += ' ' + V.tear.whyDoor;
    else if (f.why === 'wall') why += ' ' + V.tear.whyWall;
    else if (f.why === 'edge') why += ' ' + V.tear.whyEdge;
    else if (f.why === 'crate') why += ' ' + V.tear.whyCrate;
    else if (f.why === 'body') why += ' ' + V.tear.whoBody.replace('{{who}}', f.who || 'somebody');
  } else if (f.kind === 'crateGone') why = V.tear.pushMiss.replace('{{tile}}', tileName(f.exp));
  else if (f.kind === 'crateNew') why = V.tear.pushExtra.replace('{{tile}}', tileName(f.act));
  else if (f.kind === 'crateWrong') why = V.tear.whyCrateTile;
  else if (f.kind === 'canGone') why = V.tear.canMiss.replace('{{tile}}', tileName(f.exp));
  else if (f.kind === 'canNew') why = V.tear.canExtra.replace('{{tile}}', tileName(f.act));
  else if (f.kind === 'dropGone') why = V.tear.dropMiss;
  else if (f.kind === 'dropNew') why = V.tear.dropExtra;
  showCard(
    '<h1 class="bad">' + V.tear.head + '</h1>' +
    '<h2>watch the ' + ['first','second','third','fourth'][f.watch-1] + ' &nbsp;&middot;&nbsp; beat ' + (f.beat+1) + '</h2>' +
    '<div class="rule"></div>' +
    '<p class="lede">' + why + '</p>' +
    '<p>' + V.tear.tail + '</p>' +
    '<div class="keys"><b>z</b> ' + V.tear.undo + '<br><b>n</b> ' + V.tear.again + '</div>',
    'torn', 'thin');
  AU.tear();
}
function showWon(){
  const i = G.li;
  const body = (G.L.win.requireFullTurn && lastTurn().full) ? V.win.full : V.win.one;
  if (i >= LEVELS.length-1){
    G.mode = 'ending';
    setTimeout(showEnding, 380);
    return;
  }
  showCard(
    '<h2 style="margin-bottom:6px">the light comes round</h2>' +
    '<h1>' + V.levels[i].name + '</h1>' +
    '<div class="rule brass"></div>' +
    '<p class="lede">' + body + '</p>' +
    '<p>' + V.levels[i+1].log[1] + '</p>' +
    '<div class="go">any key for the next watch</div>', '', 'side');
}
function showEnding(){
  G.mode = 'ending';
  G.scene = 'attract';
  showCard(
    '<h1>' + V.ending.head + '</h1>' +
    '<h2>Cailleach Rock &mdash; the last entry</h2>' +
    '<div class="rule brass"></div>' +
    V.ending.body.map(function(p,i){
      return '<p' + (i===0 ? ' class="lede"' : (i===V.ending.body.length-1 ? ' style="font-style:italic"' : '')) + '>' + p + '</p>';
    }).join('') +
    '<div class="sig">' + V.ending.sig + '</div>' +
    '<div class="go">any key to keep the rock again</div>', '', 'side');
}

/* ============================================================== self-test */
function S(s){ return s.replace(/\s+/g,'').split(''); }
function runSelfTest(){
  const out = [];
  showCard('<h1>The book&rsquo;s own trial</h1><h2>every room, every watch, run headless</h2>' +
           '<div class="rule brass"></div><div id="log"></div>');
  const stream = document.getElementById('log');
  function flush(){
    stream.innerHTML = out.map(function(r){
      return '<div><b>' + (r.ok ? 'holds' : 'FAILS') + '</b> &nbsp;' + r.name +
        (r.detail ? '<br><span style="opacity:.7">' + r.detail + '</span>' : '') + '</div>';
    }).join('');
  }
  const jobs = [];
  LEVELS.forEach(function(def, i){
    const L = parseLevel(def);
    const sol = def.solution.map(S);
    jobs.push({ name:def.name + ' &mdash; the intended watch solves it', fn:function(){
      const turns = simulate(L, sol);
      const last = turns[turns.length-1];
      if (last.fault) return { ok:false, detail:'the trace tore at watch ' + last.fault.watch + ', beat ' + (last.fault.beat+1) + ' (' + last.fault.kind + ')' };
      if (!last.win) return { ok:false, detail:'no win. the lamp ' + (last.lit ? 'was dressed' : 'was never dressed') +
        (L.win.requireFullTurn && !last.full ? '; the watch was short (' + last.len + ' of ' + L.beats + ')' : '') +
        (L.win.needFeed ? '; the feed mark was ' + (last.last && last.last.crates.length ? 'not' : '') + 'checked' : '') };
      return { ok:true, detail: sol.length + ' turns, ' + last.len + ' beats, dressed at beat ' + (last.litBeat+1) };
    }});
    jobs.push({ name:def.name + ' &mdash; determinism: the same log, the same rock', fn:function(){
      const h1 = stateHash(L, sol), h2 = stateHash(L, sol), h3 = stateHash(L, sol.map(function(a){ return a.slice(); }));
      return { ok: h1===h2 && h2===h3, detail:'hash ' + h1.toString(16) + (h1===h2 && h2===h3 ? ' three times over' : ' but the rocks differ') };
    }});
    jobs.push({ name:def.name + ' &mdash; undo to the first tick, replay, identical state', fn:function(){
      const hashes = [stateHash(L, [[]])];
      const log = [[]];
      for (let t=0;t<sol.length;t++){
        for (const ch of sol[t]){ log[log.length-1].push(ch); hashes.push(stateHash(L, log.map(function(a){return a.slice();}))); }
        if (t < sol.length-1) log.push([]);
      }
      /* unwind everything */
      const back = [hashes[hashes.length-1]];
      while (log[log.length-1].length || log.length > 1){
        if (log[log.length-1].length) log[log.length-1].pop(); else log.pop();
        back.push(stateHash(L, log.map(function(a){return a.slice();})));
      }
      if (back[back.length-1] !== hashes[0]) return { ok:false, detail:'unwound to a different rock (' + back[back.length-1].toString(16) + ' against ' + hashes[0].toString(16) + ')' };
      /* and play the same inputs again */
      const again = [back[back.length-1]];
      const log2 = [[]];
      for (let t=0;t<sol.length;t++){
        for (const ch of sol[t]){ log2[log2.length-1].push(ch); again.push(stateHash(L, log2.map(function(a){return a.slice();}))); }
        if (t < sol.length-1) log2.push([]);
      }
      for (let i=0;i<hashes.length;i++){
        if (again[i] !== hashes[i]) return { ok:false, detail:'the replay diverged at tick ' + i + ' (' + again[i].toString(16) + ' against ' + hashes[i].toString(16) + ')' };
      }
      return { ok:true, detail: hashes.length + ' ticks forward and back, all identical' };
    }});
    jobs.push({ name:def.name + ' &mdash; breaking history tears the trace', fn:function(){
      const br = def.breakProbe.map(S);
      const turns = simulate(L, br);
      const f = turns[turns.length-1].fault;
      if (!f) return { ok:false, detail:'history was contradicted and the book did not notice' };
      const e = def.breakExpect || {};
      const wrong = [];
      if (e.watch !== undefined && f.watch !== e.watch) wrong.push('watch ' + f.watch + ', wanted ' + e.watch);
      if (e.kind !== undefined && f.kind !== e.kind) wrong.push('kind ' + f.kind + ', wanted ' + e.kind);
      if (e.why !== undefined && f.why !== e.why) wrong.push('cause ' + f.why + ', wanted ' + e.why);
      return { ok: !wrong.length, detail: (wrong.length ? wrong.join('; ') + '. ' : '') +
        'the book has it: watch ' + f.watch + ', beat ' + (f.beat+1) + ', ' + f.kind + (f.why ? ' (' + f.why + ')' : '') };
    }});
  });

  /* the trial floor: the rules, one at a time */
  const TR = parseLevel(TRIAL);
  function oneTurn(log){ const t = simulate(TR, [S(log)]); return t[t.length-1]; }
  function twoTurns(a,b){ const t = simulate(TR, [S(a), S(b)]); return t[t.length-1]; }
  const trials = [
    ['A blocked move still spends the beat', function(){
      const t = oneTurn('u u u u u u u u u u');
      const b = t.states[t.states.length-1].bodies[0];
      return { ok: t.len === 10 && b.y === 1, detail: t.len + ' beats given; the keeper climbed from y=' + TR.start[1] + ' to y=' + b.y +
        ' and the plating above him took the other ' + (t.len - (TR.start[1] - b.y)) + ' as wasted footfalls' };
    }],
    ['A shut door stops a man and spends the beat', function(){
      const t = oneTurn('l l u u u');
      const b = t.states[t.states.length-1].bodies[0];
      return { ok: b.x === 2 && b.y === 6, detail: 'the door is marked a and its treadle held nobody, so the keeper is still at ' + b.x + ',' + b.y + ' after five beats' };
    }],
    ['A treadle held by a man opens its own door', function(){
      const t = oneTurn('r r r u r');
      const s = t.states[t.states.length-1];
      return { ok: !!s.doors.a && s.bodies[0].x === 8 && s.bodies[0].y === 6,
        detail: 'the keeper is on the treadle at ' + s.bodies[0].x + ',' + s.bodies[0].y + ' and the door stands ' + (s.doors.a ? 'open' : 'shut') };
    }],
    ['A truck is two hundredweight and the lever will not answer to it', function(){
      const t = oneTurn('r r u r');
      const s = t.states[t.states.length-1];
      return { ok: s.crates[0].x === 8 && s.crates[0].y === 6 && !s.doors.a,
        detail: 'the truck is parked on the treadle at ' + s.crates[0].x + ',' + s.crates[0].y + ' and the door is ' + (s.doors.a ? 'open' : 'shut') };
    }],
    ['A truck will not be shoved into iron, and the beat is wasted', function(){
      const t = oneTurn('r r u r r r r');
      const s = t.states[t.states.length-1];
      return { ok: s.crates[0].x === 10 && s.bodies[0].x === 9,
        detail: 'the keeper pushed at the plating: the truck stands at ' + s.crates[0].x + ',' + s.crates[0].y + ' and the man is still at ' + s.bodies[0].x + ',' + s.bodies[0].y };
    }],
    ['The keeper may follow an older watch into the stone it is leaving', function(){
      const t = twoTurns('u u u', 'u u u');
      const s = t.states[t.states.length-1].bodies;
      return { ok: s[0].x === 4 && s[0].y === 4 && s[1].x === 4 && s[1].y === 5,
        detail: 'the watch stands at ' + s[0].x + ',' + s[0].y + ' and the keeper has walked into the stone it left at ' + s[1].x + ',' + s[1].y };
    }],
    ['The keeper never takes a stone from a watch', function(){
      const t = twoTurns('u u u u', 'u u u u');
      const s = t.states[t.states.length-1].bodies;
      return { ok: s[0].x === 4 && s[0].y === 3 && s[1].x === 4 && s[1].y === 4,
        detail: 'the watch holds ' + s[0].x + ',' + s[0].y + ' and the keeper is stayed at ' + s[1].x + ',' + s[1].y + ', a beat spent for nothing' };
    }],
    ['The can is lifted, and set down where he leaves it', function(){
      const t = oneTurn('r r r r r d d d d x');
      const s = t.states[t.states.length-1];
      return { ok: s.can.by === null && s.can.x === 9 && s.can.y === 10 && !s.bodies[0].carry,
        detail: 'the can lies at ' + s.can.x + ',' + s.can.y + ' and the keeper has empty hands' };
    }],
    ['A watch that finds the can gone is a torn trace, and says which stone', function(){
      const t = twoTurns('u u u r r r r r d d d d d', 'r r r r r d d d d x . . .');
      const f = t.fault;
      return { ok: !!f && f.kind === 'canGone' && f.watch === 1 && f.exp[0] === 9 && f.exp[1] === 9,
        detail: f ? ('watch ' + f.watch + ', beat ' + (f.beat+1) + ', the book has the can off ' + f.exp + ' and it is not there') : 'the can went missing and nothing tore' };
    }],
    ['A watch that finds the truck gone is a torn trace', function(){
      const t = twoTurns('r r r r u l', 'u r r r . .');
      const f = t.fault;
      return { ok: !!f && (f.kind === 'crateNew' || f.kind === 'crateGone' || f.kind === 'crateWrong') && f.watch === 1,
        detail: f ? ('watch ' + f.watch + ', beat ' + (f.beat+1) + ', ' + f.kind + ' at ' + f.act) : 'the truck went missing and nothing tore' };
    }],
    ['A fifth turn rubs the oldest watch out, and a door nobody holds shuts on a watch that needed it', function(){
      const t = simulate(TR, [S('r r r r u'), S('l l u u u u u'), S('u'), S('u'), S('u'), S('. . . . . . . .')]);
      const f = t[t.length-1].fault;
      return { ok: !!f && f.why === 'door' && f.watch === 1 && t[5].dropped && t[5].watches === 4,
        detail: f ? ('on the sixth turn the first watch is gone; watch ' + f.watch + ' finds the store door shut at beat ' + (f.beat+1)) : 'the door shut and nothing tore' };
    }],
    ['A fourth watch is the last the drum will take', function(){
      const five = simulate(TR, [S('r'),S('r'),S('r'),S('r'),S('r')]);
      return { ok: five.length === 5 && five[4].watches === 4,
        detail: 'the fifth turn runs with ' + five[4].watches + ' watches on the drum, and nothing rubbed out yet' };
    }],
    ['The same log always builds the same rock', function(){
      const a = [S('r r u r'), S('u u l l')];
      const h1 = stateHash(TR, a), h2 = stateHash(TR, a.map(function(x){ return x.slice(); }));
      return { ok: h1 === h2, detail: 'hash ' + h1.toString(16) + ' twice over' };
    }]
  ];
  trials.forEach(function(t){ jobs.push({ name:'the trial floor &mdash; ' + t[0], fn:t[1] }); });

  let i = 0;
  function step(){
    if (i >= jobs.length){
      const fails = out.filter(function(r){ return !r.ok; }).length;
      const div = document.createElement('div');
      div.className = fails ? 'bad' : 'good';
      div.style.cssText = 'font-variant-caps:all-small-caps;letter-spacing:.06em;padding-top:12px;margin-top:12px;border-top:1px solid rgba(34,27,18,.3)';
      div.textContent = fails ? (fails + ' of ' + out.length + ' do not hold') : ('all ' + out.length + ' hold');
      stream.appendChild(div);
      G.selftest = { total:out.length, fails:fails };
      window.__selftest = G.selftest;
      return;
    }
    const j = jobs[i++];
    let r;
    try { r = j.fn() || { ok:false, detail:'the trial returned nothing' }; }
    catch(e){ r = { ok:false, detail:'threw: ' + (e && e.message) }; }
    out.push({ name:j.name, ok:!!r.ok, detail:r.detail });
    flush();
    setTimeout(step, 0);
  }
  step();
}

/* ==================================================================== keys */
const KEYMAP = {
  ArrowUp:'u', KeyW:'u', ArrowDown:'d', KeyS:'d',
  ArrowLeft:'l', KeyA:'l', ArrowRight:'r', KeyD:'r',
  Space:'.', Period:'.', KeyX:'x'
};
window.addEventListener('keydown', function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.code === 'F9'){ e.preventDefault(); G.mode = 'test'; runSelfTest(); return; }
  if (G.mode === 'torn'){
    if (e.code === 'KeyZ'){ e.preventDefault(); undo(); return; }
    if (e.code === 'KeyN'){ e.preventDefault(); newWatch(); return; }
    return;
  }
  if (G.mode === 'title' || G.mode === 'ending' || G.mode === 'won' || G.mode === 'test'){
    if (e.code === 'KeyN' && G.mode === 'won'){ return; }
    e.preventDefault();
    if (e.isTrusted){ AU.init(); AU.resume(); }
    if (G.mode === 'title'){ G.scene = 'room'; bakeLevel(); G.mode = 'intro'; cardIntro(0); return; }
    if (G.mode === 'test'){ hideCard(); G.mode = 'play'; return; }
    if (G.mode === 'ending'){ G.mode = 'title'; G.scene = 'attract'; G.log = [[]];
      G.turns = simulate(G.L, G.log); baked = null; cardTitle(); return; }
    if (G.mode === 'won'){
      hideCard();
      loadLevel(G.li + 1);
      G.mode = 'intro'; cardIntro(G.li);
      return;
    }
  }
  if (G.mode === 'intro'){ hideCard(); G.mode = 'play'; if (e.isTrusted){ AU.init(); AU.resume(); } return; }
  if (G.mode !== 'play') return;
  if (KEYMAP[e.code]){
    if (e.repeat) return;                 /* the walk is metered here, not by the OS */
    e.preventDefault();
    if (e.isTrusted){ AU.init(); AU.resume(); }
    const ch = KEYMAP[e.code];
    if (ch !== '.'){ holdKey = e.code; holdT = 0.36; }
    input(ch);
    return;
  }
  if (e.code === 'KeyR'){ e.preventDefault(); ringChange(); return; }
  if (e.code === 'KeyZ'){ e.preventDefault(); undo(); return; }
  if (e.code === 'KeyN'){ e.preventDefault(); newWatch(); return; }
  if (e.code === 'KeyM'){ G.muted = !G.muted; G.entry = G.muted ? 'The bell-pull is tied. The rock is quieter than it was.' : 'The bell-pull is loose.'; return; }
  if (e.code === 'KeyH'){
    const k = sheet.querySelector('.keys');
    if (k) k.style.display = k.style.display === 'none' ? '' : 'none';
  }
});
/* held keys repeat at the tempo of a footfall */
let holdKey = null, holdT = 0;
window.addEventListener('keyup', function(e){ if (holdKey === e.code) holdKey = null; });
window.addEventListener('blur', function(){ holdKey = null; });

touchPad.addEventListener('click', function(e){
  const b = e.target.closest('button'); if (!b) return;
  if (e.isTrusted){ AU.init(); AU.resume(); }
  input(b.dataset.k === 'hold' ? '.' : b.dataset.k);
});

/* ============================================================== the page */
let last = 0;
function frame(ts){
  const now = ts / 1000;
  let dt = last ? Math.min(0.05, now - last) : 0;
  last = now;
  G.t += dt;

  if (G.wrapEnd > 0 && performance.now() >= G.wrapEnd){
    /* the light has come round: release anything the keeper pressed into it */
    G.wrap = 0; G.wrapEnd = 0; G.alpha = 1;
    if (G.queued && G.queued.length){
      const q = G.queued; G.queued = null;
      for (let i=0;i<q.length;i++) input(q[i]);
    }
    if (G.ringQueued){ G.ringQueued = false; ringChange(); }
  } else if (G.wrap > 0){
    G.wrap = Math.max(0, (G.wrapEnd - performance.now()) / 560);
  } else if (G.mode === 'play'){
    G.alpha = Math.min(1, G.alpha + dt / 0.13);
  }
  if (holdKey && G.mode === 'play' && !turnBusy() && G.wrap <= 0){
    holdT -= dt;
    if (holdT <= 0){ holdT = 0.21; input(KEYMAP[holdKey] || '.'); AU.step(); AU.tick(); }
  }

  const d = beginFrame();
  if (G.scene === 'attract') drawTitle(d);
  else drawGame(d);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------- boot */
function boot(){
  resize();
  G.L = parseLevel(LEVELS[0]);
  G.turns = simulate(G.L, [[]]);
  cardTitle();
  requestAnimationFrame(frame);
  window.__G = G;
  window.__simulate = simulate;
  window.__LEVELS = LEVELS;
  window.__parseLevel = parseLevel;
  /* a deterministic handle for headless checks and screenshots: everything a
     driver needs, and nothing it can use to cheat the simulation with */
  window.__dbg = { G:G, loadLevel:loadLevel, input:input, undo:undo,
    ringChange:ringChange, newWatch:newWatch, cardIntro:cardIntro,
    showEnding:showEnding, showTorn:showTorn, recompute:recompute };
  if (location.hash === '#selftest') setTimeout(runSelfTest, 60);
}
boot();
</script>
