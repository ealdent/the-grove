<!DOCTYPE html>
<!--
================================================================================
  THE WEIGHT AND THE WICK
  A time-loop puzzle for one keeper, four watches, and a lamp that will not
  stay dressed.  Single file.  No network, no assets, no libraries.

--------------------------------------------------------------------------------
1. TITLE
--------------------------------------------------------------------------------
  "The Weight and the Wick"

  The two halves of the title are the two halves of the machine: the weight
  that turns the lens and ends the night, and the wick that has to be fed
  before the night is worth signing.  No banned word appears in it.  It is also
  the one phrase on the rock that nobody says out loud, because saying it
  would be asking the tower for something.

--------------------------------------------------------------------------------
2. PREMISE  (delivered in the Log's voice, on the title card)
--------------------------------------------------------------------------------
  You are the assistant keeper at Cailleach Rock and you have been on the rock
  eleven days without sleep, which is not a thing a man can do, and yet here
  you are.

  The light turns because a weight falls down the shaft beneath the lamp room,
  and when the weight is spent the night has to be wound again.  You wound it.
  That is the part you cannot account for: the shaft was full when you came off
  the boat, and full again when you climbed, and you remember the weight coming
  down.

  This book is the station's log.  It is kept by a hand that is not yours, and
  it does not stop writing when you sleep.  Every watch you keep, the rock sets
  going again from the stair foot with the weather the same and the weight at
  the top -- and it sets the earlier watch going alongside you, so that it can
  do the work you cannot spare a body for.  They will not step aside.  They
  will not hear you.  They are the book's own memory, worn into the shape of a
  man.  The drum holds four watches at a time.  When the fifth comes, the
  oldest is rubbed out, and whatever it was holding is held by nobody.

  Do not argue with them.  If the book says a watch stood here at this beat,
  and he did not, the trace tears, and the night is void.

--------------------------------------------------------------------------------
3. ART DIRECTION
--------------------------------------------------------------------------------
  Palette (these are the actual values, used in the CSS variables and in C
  below; nothing in the file is any other colour):

    ink        #221b12   log ink, the deep brown-black of a wet nib
    ink-2      #14110c   the rock's own darkness
    paper      #e3dbc3   the drum's paper, the log's page
    paper-dim  #c8bfa3   paper in shadow
    fog        #cfc9b6   the sea-fog beyond the glazing (the light background)
    fog-deep   #9c9682   fog at the bottom of a pane
    stone      #6d6a5e   flagstone
    stone-dk   #4a483f   flagstone in shadow, mortar
    stone-lt   #8a8676   flagstone catching the lamp
    iron       #333b35   wall plating, verdigris-black
    iron-lt    #4a534a   the same, catching an edge
    verdigris  #4f8a72   oxidised copper, the fittings
    brass      #c9a227   the lens ring, the instrument plate, the truck
    brass-dk   #7d671c   brass in shadow
    brass-lt   #e8cf72   brass at a highlight
    lamp       #ffeec2   the flame itself, near white
    lamp-mid   #ffc45e   the halo round the flame
    lamp-deep  #e08a2c   the far edge of the pool of light
    rust       #8c4a26   oil-stain, corrosion, the torn-trace warning
    chalk      #cfc7b2   slate, tally marks, chalk circles

  Light source:  ONE lamp, a paraffin vapour burner at the centre of a
  first-order Fresnel lens, plus the keeper's own storm lantern, which is a
  weak warm pool that travels with him.  There is no ambient fill and no
  cool rim light.  Everything the player can see, the lamp is paying for.
  The lens itself turns mechanically on the falling weight, so the beam
  sweeps the floor once every turn whether or not the wick is dressed -- a
  cold grey sweep when the lamp is out, a warm one when it burns.  The beam
  IS the clock.  There is no clock in the interface.

  Shape language:  octagons and concentric rings (the lens, drawn in plan);
  long horizontals (stone courses, the glazing bars, the paper of the drum);
  diagonals used only for hatching (iron plating, the sea beyond the glass);
  and one repeated device -- a weight on a chain, always vertical, always
  descending.

  Era and texture:  1878, a Northern Lighthouse Board rock station.  Tarred
  hemp, riveted iron, oiled flagstone, one brass instrument plate bolted to
  the wall, and paper.  The only smooth surface in the game is the paper.
  Everything else is hatched, pitted, stained or corroded, and the hatching
  is drawn, not textured -- no image data anywhere in this file.

  Typography plan:  system serif only, no web fonts, no network.  Display and
  body are one Iowan/Palatino/Georgia stack.  Section labels are set in
  small caps at 0.06em, never tracked out, never monospace.  The log's own
  entries are set in italic to read as a hand.  Digits are the same serif --
  the only numbers on screen are beat counts, watch numbers and coordinates,
  and they are set in the same face as the prose so that the interface never
  looks like a different machine from the world.

  Hard bans, and how each is answered:
    - near-black navy/cyan/magenta:  the darkest value here is a green-black
      #14110c and a verdigris #333b35; the bright background is pale fog, not
      a dark one.  There is no cyan and no magenta anywhere.
    - blue-to-purple gradient title:  the title is ink on paper, one colour,
      with a brass rule.  No gradient on any glyph.
    - letter-spaced all-caps monospace headers:  small-caps serif, 0.06em.
      No title here calls itself one, and no string the game ever shows uses
      the word either: the rock calls it a turn, a watch, or the night.
    - glowing grid backdrops:  the background is fog and stone.  The grid that
      exists is a floor, and it is drawn as mortar.

--------------------------------------------------------------------------------
4. VOICE
--------------------------------------------------------------------------------
  The Log speaks.  Second person, clipped, plain, a station keeper's plain
  trade English with nothing wasted on it: it states what is true of the
  station and it never explains the rules.  It does not cheer and it does not
  console.  Its failure messages are the entry it wrote at the moment the trace
  tore, and they are always specific -- which watch, which beat, what he found
  where the book had something else.  It breaks into the first person exactly
  once, in the last line of the ending, and never again.

--------------------------------------------------------------------------------
5. WHAT THE NOUNS ARE  (the find-and-replace test)
--------------------------------------------------------------------------------
  player ................ the keeper
  ghost / recording ...... a watch (a recorded turn); its figure is an earlier
                           keep; the set of them is the tally; the medium is
                           the drum; the record on the paper is the trace
  tick ................... a beat
  iteration .............. a turn of the light
  plate / pressure plate . a treadle  (a floor lever; a truck will not answer
                           to it, a man will)
  door ................... a door marked with the same letter as its treadle
  key .................... the oil can
  crate / box ............ the oil truck
  goal / exit ............ the burner (the lamp itself)
  loop end ............... ring the change
  undo ................... set the watch back
  restart ................ break the tally
  paradox / tear ......... the trace tears

  Nothing in the game can be renamed back to the generic word without losing
  something: the "goal tile" is a physical lamp that has to be lit, the
  "carried key" is five gallons of paraffin, the "pressure plate" is a
  self-closing storm door on a counterweight latch, and the "ghost" is the
  station's own written record of a night it keeps re-covering.
================================================================================
-->

<script>
/* =============================================================================
   THE WEIGHT AND THE WICK
   Cailleach Rock Light, 1878.

   ------------------------------------------------------------------
   RULES, AND THE DECISIONS TAKEN WHERE THE BRIEF WAS AMBIGUOUS
   ------------------------------------------------------------------
   Every rule below is implemented exactly as written here.  Where the brief
   left a choice, the choice is stated, not smuggled.

   R1  PURE FUNCTION.  The entire game is a function of (level, input log).
       `log` is an array of turns; each turn is an array of input characters.
       There is no mutable world that persists between turns: the top of every
       turn rebuilds the station from the level and replays every recording.
       The ONLY thing that crosses a turn boundary is a recording, and a
       recording is nothing but an input log.  This is what makes undo,
       replay and the self-test trivially exact.

   R2  A BEAT.  One input = one beat.  Inputs are u d l r (move), '.' (stand),
       'x' (set the can down where you stand).  A blocked move still spends the
       beat: the body stays and the tick is gone.  Rendering interpolates
       between beats; nothing in the simulation reads the clock.

   R3  ORDER WITHIN A BEAT.  Bodies are resolved oldest-watch first and the
       living keeper LAST, one at a time, each seeing the positions left by
       the bodies already resolved this beat.  Consequences, all intended:
         - a body may follow an older body into the stone it is leaving, but
           never the reverse, so there are no swap cycles and no ambiguity;
         - where two bodies would hold one stone, the older holds it and the
           younger is stayed.  The keeper is the youngest body on the rock and
           is therefore stayed by any recording, and never the other way.
         - a body that is stayed has simply not moved.  For the keeper that is
           an ordinary obstruction.  For a recording it is a torn trace (R6).

   R4  DOORS AND TREADLES.  A door is a wall tile that is passable only while
       the treadle carrying the SAME LETTER is held by a body.  A treadle with
       no door of its letter is the fog-horn rope, and sounds while held.
       A TREADLE IS NOT HELD BY A TRUCK.  The truck is too heavy for the
       lever; the door knows the difference between a man and two hundredweight
       of iron and oil.  A body standing in the doorway when the treadle is
       let go does not stop the door shutting, and the next beat finds it shut.

   R5  A BEAT IS TAKEN IN TWO BREATHS.  Movement is resolved against the doors
       as they stood WHEN THE BEAT BEGAN.  The doors then answer the treadles
       as they now lie, and that is the state the lamp is judged in and the
       state that is drawn.

   R6  TEARING.  A recording carries, for each of its beats, what it was told
       would happen: where it would end up, which truck it would shove and
       from where, whether it would lift the can, whether it would set it
       down.  On every later turn those four things are checked, one at a
       time, against what actually happened.  This is deliberately NOT a
       whole-state comparison: the living keeper is a different man every turn
       and may stand anywhere, so comparing his position would be nonsense.
       Checking only what a recording actually TOUCHED means the rock can
       never tear on something that cannot matter, and can never fail to tear
       on something that can.
         A recording that is stayed, that shoves a truck that is not there,
         that finds the can gone from the flagstone the book has it on, or
         that sets down a can it was never holding, is a torn trace.

   R7  THE DRUM HOLDS FOUR.  At most four recordings are alive at once.  When a
       fifth turn begins, the oldest is rubbed out and its duty falls to
       nobody.  This is the only pressure that punishes a fumbled turn.

   R8  UNDO.  One key removes the last input.  If that empties a turn, the turn
       and its recording go with it, and the watch you were keeping resumes
       where it stood.  Depth is unlimited and it works back to the very first
       tick, after which the rock is as it was found.

   R9  SAME-STONE RULE, STATED PLAINLY, because it is the one players ask
       about:  older watches outrank younger ones, and the living keeper is
       the youngest thing on the rock.  He is never shoved aside by a memory.
       A memory, on the other hand, is never shoved aside by him -- if he is
       standing in a stone a recording needs, the recording stops, and the
       trace tears.  That asymmetry is the whole of the game's danger.

   R10 THE DRUM IS THE RECORD AND THE TRACE IS THE CHECK.  A short watch is
       padded with standing stills when it is replayed, so a helper that walks
       to a treadle and stays stays staying.
   ============================================================================= */

/* ---------------------------------------------------------------- palette */
const C = {
  ink:'#221b12', ink2:'#14110c',
  paper:'#e3dbc3', paperDim:'#c8bfa3',
  fog:'#cfc9b6', fogDeep:'#9c9682',
  stone:'#6d6a5e', stoneDk:'#4a483f', stoneLt:'#8a8676',
  iron:'#333b35', ironLt:'#4a534a', verdigris:'#4f8a72',
  brass:'#c9a227', brassDk:'#7d671c', brassLt:'#e8cf72',
  lamp:'#ffeec2', lampMid:'#ffc45e', lampDeep:'#e08a2c',
  rust:'#8c4a26', chalk:'#cfc7b2'
};

/* ---------------------------------------------------------------- the log */
const V = {
  /* title card, in the Log's voice.  This is the premise, in character. */
  premise: [
    'You are the assistant keeper at Cailleach Rock and you have been on the rock eleven days without sleep, which is not a thing a man can do, and yet here you are.',
    'The light turns because a weight falls down the shaft beneath the lamp room, and when the weight is spent the night has to be wound again. You wound it. The shaft was full when you came off the boat and full again when you climbed, and you remember the weight coming down.',
    'This book is the station log. It is kept by a hand that is not yours and it does not stop writing when you sleep. Every watch you keep, the rock sets going again from the stair foot, and it sets the earlier watch going alongside you, so that it can do the work you cannot spare a body for. They will not step aside. They will not hear you. They are the book&rsquo;s own memory, worn into the shape of a man. The drum holds four watches at a time; when the fifth comes, the oldest is rubbed out, and whatever it was holding is held by nobody.',
    'If the book says a watch stood here at this beat, and he did not, the trace tears, and the night is void.'
  ],
  levels: [
    {
      name:'The Oil Store',
      sub:'Cailleach Rock &mdash; the store, under the lamp room',
      log:[
        'First watch of your keeping here, and the lamp is out. The oil is in the store, the door is on the latch-treadle, and there is one of you.',
        'Walk to the treadle and you will find the door will not follow you through. That is not a fault. That is how the rock is built. The way out is to keep this watch twice.'
      ]
    },
    {
      name:'The Feed Run',
      sub:'Cailleach Rock &mdash; the store and the lamp-room floor',
      log:[
        'The pipe is capped. The feed truck stands where it was left, and the lamp will not take a drop until the truck is under its stand.',
        'The truck goes where it is pushed and no further, and the treadle will not answer to it &mdash; a truck is two hundredweight of iron and oil, and a door can tell a man from a truck at a glance. It wants a man on the rope, which is a thing you have one of.'
      ]
    },
    {
      name:'The Hour of the Light',
      sub:'Cailleach Rock &mdash; the lamp room, and the chamber behind it',
      log:[
        'The last watch of the night, and the book has it that the light never once went out. A master saw it burning at every hour of this watch; the book has it so, and the book does not carry a lie.',
        'The drum will take four watches. It is nearly full. If the oldest is rubbed out, the door it was holding is held by nobody, and the wheel is on your own side of the room.'
      ]
    }
  ],
  /* reactive entries, each spoken at most once, on the plate's last line */
  once:{
    treadle:'A treadle. The door of the same letter hangs on it, and swings with your weight.',
    shut:'The door is on its treadle. It will not lie open for a body that is somewhere else.',
    echo:'That is your own hand off an earlier watch. It will not hear you and it will not step aside.',
    push:'The truck goes where it is pushed. That is the whole of its character.',
    carry:'Five gallons of paraffin, and a spout long enough to reach down where you cannot see.',
    drop:'You set the can down. It stays where you leave it, which is not the same as where you meant it.',
    horn:'Somebody is on the whistle rope. The horn wants a man to hold it down.',
    heavy:'The truck is on the treadle and the door is shut. The lever cannot tell two hundredweight of iron from a man, and it does not care to try.',
    turn:'The weight is at the bottom. Ring the change and the night begins again at the stair foot, with the earlier watch set going beside you.',
    full:'The drum is full. One more watch and the oldest is rubbed out, and whatever it held is held by nobody.',
    rubbed:'The oldest watch is rubbed out. There is a door on this rock that nobody is holding now.',
    lit:'Dressed. The wick is taking oil and the lamp will burn to the end of the turn.',
    wore:'The light is out again. The rock does not keep what you lit; it keeps what you wrote.'
  },
  /* turn-change line, by how many watches are on the drum */
  turnLine:[
    'Second turn. The first watch is set going beside you now. Where he stands, the door will hang.',
    'Third turn. Two watches on the drum, and both of them are yours.',
    'Fourth turn. Three watches walking the room, and none of them will look at you.',
    'Fifth turn. Four watches, which is all the drum will take.',
    'Sixth turn. The oldest is rubbed out. The rest carry on.'
  ],
  tear:{
    head:'The trace is torn.',
    pos:'The book has him on {{tile}}. He is on {{tile2}}.',
    whyWall:'The stone ahead of him is iron where the book has flagstone.',
    whyEdge:'The book walks him off the edge of the room.',
    whyDoor:'The way in stood shut. He had it open when he wrote that beat.',
    whyCrate:'The truck is not where he left it, so the truck is not under his hand.',
    whyCrateTile:'The truck is standing on the stone he meant to shove it from.',
    whoBody:'But {{who}} is standing in the stone he needs.',
    pushMiss:'The book has him shoving the truck from {{tile}}. There is no truck there.',
    pushExtra:'He shoved the truck from {{tile}}. The book has that stone open.',
    canMiss:'The book has him lifting the can off {{tile}}. The can is not on it.',
    canExtra:'He lifted the can off {{tile}}. The book has that stone empty.',
    dropMiss:'The book has him setting the can down here. He has not got it.',
    dropExtra:'He set the can down. The book has him carrying it.',
    tail:'The night is void from this beat forward. The book will not be amended; it will be begun again.',
    undo:'Set the watch back one beat and the book closes over the tear.',
    again:'Break the tally and the rock is as you found it.'
  },
  win:{
    one:'The weight is at the bottom, the wick is dressed, and the book has the light burning at the hour it says it was burning. That watch will stand.',
    full:'The light has come round with the wick dressed and the feed capped and the trace whole. A full watch. The book will not argue with a full watch.',
    refuse:'The light is burning, but that watch is short, and the book has it that the light never went out. Ring the change early and the hour is a lie. Let it come round.'
  },
  ending:{

/* ============================================================== simulation */
const DIR = { u:[0,-1], d:[0,1], l:[-1,0], r:[1,0] };
const NOP = {u:'.',d:'.',l:'.',r:'.','.':'.','x':'x'};
const MAXWATCH = 4;                       // R7: the drum holds four

function k_(x,y){ return x+','+y; }

function parseLevel(def){
  const rows = def.grid, h = rows.length, w = rows[0].length;
  const L = { id:def.id, name:def.name, sub:def.sub, beats:def.beats,
    win:def.win, w:w, h:h,
    wall:new Set(), glass:new Set(), doors:{}, doorAt:{}, treadles:{}, rope:[],
    crates:[], can:null, burner:null, feed:null, start:[1,1] };
  for (let y=0;y<h;y++){
    for (let x=0;x<w;x++){
      const c = rows[y][x], k = k_(x,y);
      if (c==='#'){ L.wall.add(k); }
      else if (c==='~'){ L.wall.add(k); L.glass.add(k); }
      else if (c>='a' && c<='d'){ L.wall.add(k); L.doors[c]=[x,y]; L.doorAt[k]=c; }
      else if (c>='A' && c<='D'){ L.treadles[c.toLowerCase()] = [x,y]; }
      else if (c==='T'){ L.crates.push({id:L.crates.length,x:x,y:y}); }
      else if (c==='*'){ L.can = [x,y]; }
      else if (c==='%'){ L.burner = [x,y]; }
      else if (c==='='){ L.feed = [x,y]; }
      else if (c==='@'){ L.start = [x,y]; }
    }
  }
  for (const t in L.treadles) if (!L.doors[t]) L.rope.push(t);
  if (!L.can) L.can = [0,0];
  return L;
}

function tileName(t){ return t[0] + ', ' + t[1]; }

/* one turn.  watchLogs: [{log, exps}]; returns the turn record. */
function runTurn(L, watchLogs, liveLog){
  const len = liveLog.length;
  const bodies = watchLogs.map(function(w,i){
    return { key:'w'+i, label:i+1, rec:true, log:w.log, exps:w.exps,
             x:L.start[0], y:L.start[1], carry:false, face:'d', dir:[0,0] };
  });
  const live = { key:'K', label:0, rec:false, log:liveLog, exps:null,
                 x:L.start[0], y:L.start[1], carry:false, face:'d', dir:[0,0] };
  const all = bodies.concat([live]);
  const crates = L.crates.map(function(c){ return {id:c.id,x:c.x,y:c.y}; });
  const can = { x:L.can[0], y:L.can[1], by:null };
  const doors = {}; for (const d in L.doors) doors[d] = false;
  const doorBeat = {};                       /* doors as the beat began (R5) */
  const occ = new Map();
  all.forEach(function(b){ occ.set(k_(b.x,b.y), b); });

  function crateAt(x,y){ for (let i=0;i<crates.length;i++) if (crates[i].x===x && crates[i].y===y) return crates[i]; return null; }
  function passable(x,y,DD){
    if (x<0||y<0||x>=L.w||y>=L.h) return false;
    const k = k_(x,y);
    if (!L.wall.has(k)) return true;
    const d = L.doorAt[k];
    if (d) return !!DD[d];
    return false;
  }
  function readDoors(DD){
    for (const t in L.treadles){
      const p = L.treadles[t];
      const held = occ.has(k_(p[0],p[1]));       /* R4: bodies only, never a truck */
      DD[t] = held;
    }
    for (const d in L.doors) doors[d] = !!L.treadles[d] && DD[d];
  }

  const states = [];
  const seen = {};                              /* once-only log entries */
  let fault = null, lit = false, litBeat = -1, litLine = null, horn = false, sawEcho = false;
  const outExps = live.rec ? null : [];
  readDoors(doors);
  const base = snap(-1, all, crates, can, doors, false);

  for (let beat=0; beat<len; beat++){
    readDoors(doorBeat);
    for (let i=0;i<all.length && !fault;i++){
      const b = all[i];
      const inp = (b.log[beat] === undefined) ? '.' : b.log[beat];
      act(b, inp);
      if (b.rec){
        const e = b.exps ? b.exps[beat] : undefined;
        if (e){
          const f = check(b, e, beat, all);
          if (f){ fault = f; fault.watch = b.label; }
        } else if (b.exps){ /* unreachable; keeps the shape obvious */ }
      } else { outExps[beat] = capture(b); }
    }
    if (fault) break;

    readDoors(doors);
    /* fog horn: any rope-treadle held */
    horn = false;
    for (const r of L.rope) if (doors[r]) horn = true;
    for (const b of all) if (b.rec && !sawEcho){ sawEcho = true; seen.echo = true; }
    for (const b of all) if (b.carry && !seen.carry) seen.carry = true;

    /* the lamp (R5: judged on the doors as they now lie) */
    let litNow = false;
    if (L.burner){
      const fedOk = !L.win.needFeed || !!(L.feed && crateAt(L.feed[0], L.feed[1]));
      const wayOk = L.win.wayIn.every(function(d){ return !!doors[d]; });
      if (fedOk && wayOk){
        for (const b of all){
          if (b.carry && b.x===L.burner[0] && b.y===L.burner[1]){ litNow = true; break; }
        }
      }
      if (litNow && !lit){ lit = true; litBeat = beat; seen.lit = true; }
    }
    states.push(snap(beat, all, crates, can, doors, lit));
  }

  /* the win is judged as the turn ends, not mid-beat */
  const full = (len === L.beats);
  const win = lit && (!L.win.requireFullTurn || full);
  return { len:len, base:base, states:states, exps:outExps, fault:fault, lit:lit, litBeat:litBeat,
           win:win, full:full, horn:horn, seen:seen,
           last: states.length ? states[states.length-1] : null };

  function snap(beat, all, crates, can, doors, lit){
    return {
      beat:beat,
      bodies: all.map(function(b){
        return { key:b.key, rec:b.rec, label:b.label, x:b.x, y:b.y,
                 carry:b.carry, face:b.face, dirX:b.dir[0], dirY:b.dir[1] };
      }),
      crates: crates.map(function(c){ return {id:c.id,x:c.x,y:c.y}; }),
      can: { x:can.x, y:can.y, by:can.by },
      doors: Object.assign({}, doors),
      lit: lit
    };
  }

  function act(b, inp){
    b.stay = null; b.stayWho = null; b.push = null; b.take = false; b.drop = false;
    if (inp === 'x'){
      if (b.carry){
        b.carry = false; can.by = null; can.x = b.x; can.y = b.y; b.drop = true;
        if (b.rec) return;
      }
      return;
    }
    const v = DIR[inp];
    if (!v){ b.dir = [0,0]; return; }             /* '.' -- stand */
    const dx = v[0], dy = v[1];
    b.dir = [dx,dy];
    b.face = dx>0 ? 'r' : dx<0 ? 'l' : dy>0 ? 'd' : 'u';
    const nx = b.x+dx, ny = b.y+dy;
    if (nx<0 || ny<0 || nx>=L.w || ny>=L.h){ b.stay = 'edge'; return; }
    if (!passable(nx,ny,doorBeat)){
      b.stay = L.doorAt[k_(nx,ny)] ? 'door' : 'wall';
      return;
    }
    const who = occ.get(k_(nx,ny));
    if (who){ b.stay = 'body'; b.stayWho = who; return; }
    const c = crateAt(nx,ny);
    if (c){
      const px = nx+dx, py = ny+dy;
      if (!passable(px,py,doorBeat) || occ.has(k_(px,py)) || crateAt(px,py)){
        b.stay = 'crate'; return;                 /* R2: the beat is still spent */
      }
      c.x = px; c.y = py; b.push = { id:c.id, fx:nx, fy:ny, tx:px, ty:py };
    }
    occ.delete(k_(b.x,b.y));
    b.x = nx; b.y = ny;
    occ.set(k_(nx,ny), b);
    if (!b.carry && can.by===null && can.x===nx && can.y===ny){
      b.carry = true; can.by = b.key; b.take = true;
    }
  }

  function capture(b){
    return { x:b.x, y:b.y,
      push: b.push ? { id:b.push.id, fx:b.push.fx, fy:b.push.fy } : null,
      take: b.take, drop: b.drop };
  }

  function check(b, e, beat, all){
    /* R6: only what the recording actually touched. */
    if (b.x!==e.x || b.y!==e.y){
      return { kind:'pos', beat:beat, exp:[e.x,e.y], act:[b.x,b.y],
               why:b.stay, who:b.stayWho ? (b.stayWho.rec ? 'watch '+b.stayWho.label : 'the keeper') : null,
               push:e.push };
    }
    const p = b.push;
    if (!!p !== !!e.push){
      if (e.push && !p) return { kind:'crateGone', beat:beat, exp:[e.push.fx,e.push.fy], act:[b.x,b.y], why:'crate' };
      if (!e.push && p) return { kind:'crateNew', beat:beat, exp:null, act:[p.fx,p.fy], why:'crate' };
    } else if (p && e.push && (p.id!==e.push.id || p.fx!==e.push.fx || p.fy!==e.push.fy)){
      return { kind:'crateWrong', beat:beat, exp:[e.push.fx,e.push.fy], act:[p.fx,p.fy], why:'crate' };
    }
    if (!!b.take !== !!e.take){
      if (e.take && !b.take) return { kind:'canGone', beat:beat, exp:[e.x,e.y], act:[e.x,e.y], why:'can' };
      if (!e.take && b.take) return { kind:'canNew', beat:beat, exp:null, act:[b.x,b.y], why:'can' };
    }
    if (!!b.drop !== !!e.drop){
      if (e.drop && !b.drop) return { kind:'dropGone', beat:beat, exp:[e.x,e.y], act:[b.x,b.y], why:'can' };
      if (!e.drop && b.drop) return { kind:'dropNew', beat:beat, exp:null, act:[b.x,b.y], why:'can' };
    }
    return null;
  }
}

/* The whole game: log -> everything.  Pure.  */
function simulate(L, log){
  const turns = [];
  for (let t=0; t<log.length; t++){
    const from = Math.max(0, t - MAXWATCH);
    const watchLogs = [];
    for (let i=from; i<t; i++) watchLogs.push({ log:log[i], exps:turns[i].exps });
    const r = runTurn(L, watchLogs, log[t]);
    r.index = t;
    r.watches = watchLogs.length;
    r.dropped = t > 0 && from > 0;             /* the oldest was rubbed out */
    turns.push(r);
    if (r.fault) break;
  }
  return turns;
}

function stateHash(L, log){
  /* a total order over everything the log can affect, for the self-test */
  let h = 2166136261;
  function mix(v){ h ^= (v|0); h = Math.imul(h, 16777619); }
  const turns = simulate(L, log);
  for (const t of turns){
    mix(t.len);
    for (const s of t.states){
      for (const b of s.bodies){ mix(b.x); mix(b.y); mix(b.carry?1:0); mix(b.rec?1:0); }
      for (const c of s.crates){ mix(c.x); mix(c.y); mix(c.id); }
      mix(s.can.x); mix(s.can.y); mix(s.can.by ? 1 : 0);
      mix(s.lit?1:0);
      for (const d in s.doors) mix(s.doors[d]?1:0);
    }
  }
  return (h>>>0);
}

/* ================================================================== audio */
const AU = {
  ctx:null, master:null, ready:false,
  init(){
    if (this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.42;
      this.master.connect(this.ctx.destination);
      this.ready = true;
    }catch(e){ this.ready = false; }
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended'){ try{ this.ctx.resume(); }catch(e){} } },
  tone(freq, dur, type, vol, slide){
    if (!this.ready || G.muted) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, c.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, c.currentTime + Math.min(0.02, dur*0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(this.master); o.start(); o.stop(c.currentTime + dur + 0.02);
  },
  noise(dur, vol, f0, f1, q){
    if (!this.ready || G.muted) return;
    const c = this.ctx, n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2.2);
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q = q || 1.1;
    bp.frequency.setValueAtTime(f0, c.currentTime);
    bp.frequency.exponentialRampToValueAtTime(f1, c.currentTime + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    src.connect(bp); bp.connect(g); g.connect(this.master); src.start();
  },
  tick(){ this.noise(0.045, 0.16, 2600, 900, 2.2); this.tone(168, 0.05, 'triangle', 0.05); },
  clunk(){ this.tone(74, 0.34, 'sine', 0.16, 46); this.noise(0.12, 0.1, 700, 200, 1.4); },
  horn(){ if (!this.ready || G.muted) return;
    this.tone(88, 1.5, 'sine', 0.1); this.tone(132, 1.5, 'triangle', 0.045);
    this.noise(1.3, 0.035, 320, 180, 0.8); },
  tear(){ this.noise(0.6, 0.3, 3200, 240, 0.7); this.tone(220, 0.5, 'sawtooth', 0.05, 60); },
  chime(){ this.tone(392, 1.3, 'sine', 0.1); setTimeout(()=>this.tone(523.25,1.5,'sine',0.075), 170);
    setTimeout(()=>this.tone(659.25,1.8,'sine',0.05), 360); },
  step(){ this.noise(0.03, 0.05, 1100, 500, 1.6); }
};

function roomLayout(){
  const T = T_(), L = G.L;
  const rw = L.w * T, rh = L.h * T;
  const dh = rh + 36 + 104 + 30;
  /* the desk band is widened to whatever a window will take -- up to a limit --
     so that a wide screen is not a small game with black either side of it, and
     a narrow one is not a cropped one */
  const asp = (CW && CH) ? (CW / CH) : 1.4;
  const dw = Math.max(rw + 36, Math.min(920, Math.round(dh * asp)));
  return { dw: dw, dh: dh,
           room:{ x: Math.round((dw - rw) / 2), y: 18, w: rw, h: rh }, T: T };
}
function design(){
  if (G.scene === 'attract') return { dw: 780, dh: 560, room:{x:0,y:0,w:780,h:560} };
  return roomLayout();
}
function beginFrame(){
  const d = design();
  const s = Math.min(CW / d.dw, CH / d.dh);
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.clearRect(0,0,CW,CH);
  const ox = (CW - d.dw * s) / 2, oy = (CH - d.dh * s) / 2;
  G.view = { scale:s, ox:ox, oy:oy };
  cx.setTransform(DPR*s,0,0,DPR*s, DPR*ox, DPR*oy);
  return d;
}

/* ============================================================ small helpers */
function rr(g,x,y,w,h,r){
  const m = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+m,y); g.lineTo(x+w-m,y); g.quadraticCurveTo(x+w,y,x+w,y+m);
  g.lineTo(x+w,y+h-m); g.quadraticCurveTo(x+w,y+h,x+w-m,y+h);
  g.lineTo(x+m,y+h); g.quadraticCurveTo(x,y+h,x,y+h-m);
  g.lineTo(x,y+m); g.quadraticCurveTo(x,y,x+m,y); g.closePath();
}
function nz(x,y,s){ const n = Math.sin(x*127.1 + y*311.7 + (s||0)*74.7) * 43758.5453; return n - Math.floor(n); }
function shade(hex, f){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const cl = v => Math.max(0, Math.min(255, Math.round(v*f)));
  return 'rgb(' + cl(r) + ',' + cl(g) + ',' + cl(b) + ')';
}
function mixHex(a,b,t){
  const ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16);
  const br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
  const c = (x,y) => Math.round(x + (y-x)*t).toString(16).padStart(2,'0');
  return '#' + c(ar,br) + c(ag,bg) + c(ab,bb);
}

/* ================================================== baked room (static art) */
const DECOR = {
  store:[[1,10,'cask'],[1,1,'coil'],[4,1,'hook'],[11,1,'hook'],[11,10,'cask']],
  feed:[[1,1,'cask'],[1,5,'coil'],[13,1,'hook'],[13,9,'shelf'],[1,12,'barrel']],
  hour:[[1,1,'cask'],[6,1,'hook'],[14,1,'hook'],[14,11,'barrel'],[11,12,'coil']]
};
let baked = null, bakedFor = '';
function bakeLevel(){
  if (!G.L || G.scene !== 'room'){ baked = null; bakedFor = ''; return; }
  const d = roomLayout(), S = 2;
  const c = document.createElement('canvas');
  c.width = Math.round(d.dw * S); c.height = Math.round(d.dh * S);
  const g = c.getContext('2d');
  g.setTransform(S,0,0,S,0,0);
  if (!G.L){ baked = { c:c, id:'title' }; return; }
  const L = G.L, T = d.T, X = d.room.x, Y = d.room.y;

  /* ---- floor: flagstones, laid to a running bond over the whole floor ---- */
  g.save();
  g.beginPath(); g.rect(X,Y,L.w*T,L.h*T); g.clip();
  g.fillStyle = '#23211a'; g.fillRect(X,Y,L.w*T,L.h*T);
  const CH = T*0.5, J = 1.6;
  for (let cy=-1; cy*CH < L.h*T+CH; cy++){
    const shift = (cy % 2) ? CH*0.5 : 0;
    for (let cx=-1; cx*CH < L.w*T+CH; cx++){
      const px = X + cx*CH + shift, py = Y + cy*CH;
      const tx = Math.floor((px + CH*0.5 - X)/T), ty = Math.floor((py + CH*0.5 - Y)/T);
      if (L.wall.has(k_(tx,ty))) continue;
      const a = nz(cx+cy*7, cy, 1), b = nz(cx*3, cy*5, 2), c = nz(cx+11, cy+2, 3);
      let col = mixHex('#6e6959', '#4c493f', 0.12 + a*0.62);
      if (b > 0.9) col = mixHex(col, '#3c3931', 0.4);
      if (b < 0.1) col = mixHex(col, '#8e8873', 0.34);
      const jx = J + nz(cx,cy,4)*1.1, jy = J + nz(cx,cy,5)*1.1;
      g.fillStyle = col;
      g.fillRect(px + jx, py + jy, CH - jx*2, CH - jy*2);
      /* a lit top arris, a shaded bottom one: the lamp hangs above this floor */
      g.fillStyle = 'rgba(232,222,196,0.028)';
      g.fillRect(px + jx, py + jy, CH - jx*2, 1);
      g.fillStyle = 'rgba(14,12,9,0.34)';
      g.fillRect(px + jx, py + CH - jy - 1, CH - jx*2, 1);
      g.fillRect(px + CH - jx - 1, py + jy, 1, CH - jy*2);
      if (c > 0.93){
        g.strokeStyle = 'rgba(18,15,11,0.4)'; g.lineWidth = 0.8;
        g.beginPath();
        g.moveTo(px + CH*nz(cx,cy,6), py + 2);
        g.lineTo(px + CH*0.5, py + CH*nz(cx,cy,7));
        g.lineTo(px + CH*nz(cx,cy,8), py + CH - 2);
        g.stroke();
      }
    }
  }
  /* oil: the floor of a light station is never clean */
  for (let i=0;i<9;i++){
    const x = X + (0.15 + nz(i,7)*0.7)*L.w*T, y = Y + (0.15 + nz(i,8)*0.7)*L.h*T;
    const r = T*(0.9 + nz(i,9)*1.8);
    const og = g.createRadialGradient(x,y,0,x,y,r);
    og.addColorStop(0,'rgba(22,16,10,0.34)'); og.addColorStop(1,'rgba(22,16,10,0)');
    g.fillStyle = og; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  /* a warm bias toward the burner, which pays for the whole floor */
  if (L.burner){
    const bx = X + L.burner[0]*T, by = Y + L.burner[1]*T;
    const wg = g.createRadialGradient(bx,by,0,bx,by,Math.max(L.w,L.h)*T*0.6);
    wg.addColorStop(0,'rgba(255,206,140,0.10)'); wg.addColorStop(1,'rgba(255,206,140,0)');
    g.save(); g.globalCompositeOperation = 'lighter';
    g.fillStyle = wg; g.fillRect(X,Y,L.w*T,L.h*T); g.restore();
  }
  g.restore();
  /* grit */
  for (let i=0;i<2600;i++){
    const x = X + nz(i,1)*L.w*T, y = Y + nz(i,2)*L.h*T, a = nz(i,3);
    g.fillStyle = a > 0.5 ? 'rgba(226,218,196,0.10)' : 'rgba(18,15,11,0.16)';
    g.fillRect(x, y, 1.3, 1.3);
  }
  /* oil stains: the floor of a lighthouse is never clean */
  for (let i=0;i<9;i++){
    const x = X + (0.2 + nz(i,7)*0.6)*L.w*T, y = Y + (0.2 + nz(i,8)*0.6)*L.h*T;
    const r = T*(0.8 + nz(i,9)*1.5);
    const gr = g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(24,18,12,0.30)'); gr.addColorStop(1,'rgba(24,18,12,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  g.restore();

  /* ---- the lamp is above the floor, so the courses shade downward ---- */
  g.save();
  for (let y=0;y<L.h;y++) for (let x=0;x<L.w;x++){
    if (!L.wall.has(k_(x,y))) continue;
    const px = X + x*T, py = Y + y*T;
    const shade2 = (dx,dy,w,h,rot) => {
      g.save(); g.translate(px+dx, py+dy); g.rotate(rot||0);
      const gr = g.createLinearGradient(0,0,w,0);
      gr.addColorStop(0,'rgba(10,9,7,0.5)'); gr.addColorStop(1,'rgba(10,9,7,0)');
      g.fillStyle = gr; g.fillRect(0,0,w,h); g.restore();
    };
    shade2(T,0,T,T*0.7);
    shade2(0,T,T*0.7,T);
    shade2(0,0,T,T*0.7,0);
  }
  g.restore();

  /* ---- walls: iron plating, hatched, riveted ---- */
  for (let y=0;y<L.h;y++) for (let x=0;x<L.w;x++){
    const k = k_(x,y);
    if (!L.wall.has(k)) continue;
    const px = X + x*T, py = Y + y*T;
    if (L.glass.has(k)){ drawPane(g, px, py, T); continue; }
    const t = nz(x,y,11);
    g.fillStyle = mixHex('#222824', '#0b0e0c', 0.15 + t*0.4);
    g.fillRect(px, py, T, T);
    g.strokeStyle = 'rgba(126,150,132,0.055)'; g.lineWidth = 1;
    g.beginPath();
    for (let i=-T;i<T;i+=7){ g.moveTo(px+i, py+T); g.lineTo(px+i+T, py); }
    g.stroke();
    g.strokeStyle = 'rgba(206,196,166,0.07)';
    g.beginPath(); g.moveTo(px, py+0.5); g.lineTo(px+T, py+0.5); g.stroke();
    g.fillStyle = 'rgba(201,162,39,0.16)';
    g.beginPath(); g.arc(px+T-5, py+T-5, 1.4, 0, 7); g.fill();
  }

  /* ---- decor ---- */
  const dec = DECOR[L.id] || [];
  for (const d of dec) drawDecor(g, X + d[0]*T + T/2, Y + d[1]*T + T/2, T, d[2]);

  baked = { c:c, id:L.id, s:S };
}
function nx1(a,b){ return (nz(a,b,21) - 0.5) * 3.2; }
function drawPane(g, x, y, T){
  const gr = g.createLinearGradient(x, y, x, y+T);
  gr.addColorStop(0, C.fog); gr.addColorStop(0.55, C.fogDeep); gr.addColorStop(1, '#7d7a6c');
  g.fillStyle = gr; g.fillRect(x+3, y+3, T-6, T-6);
  /* the sea, a long way off, in a bad light */
  g.fillStyle = 'rgba(60,72,66,0.35)';
  g.beginPath();
  for (let i=0;i<=8;i++){
    const yy = y + T*0.62 + Math.sin(i*1.7)*T*0.03;
    g.lineTo(x+3 + (T-6)*i/8, yy);
  }
  g.lineTo(x+T-3, y+T-3); g.lineTo(x+3, y+T-3); g.closePath(); g.fill();
  g.fillStyle = 'rgba(46,54,50,0.5)'; g.fillRect(x+3, y+3, T-6, T*0.34);
  /* glazing bars */
  g.fillStyle = C.iron;
  g.fillRect(x + T*0.33 - 1.5, y+3, 3, T-6);
  g.fillRect(x + T*0.67 - 1.5, y+3, 3, T-6);
  g.fillRect(x+1, y+1, T-2, 3); g.fillRect(x+1, y+T-4, T-2, 3);
  g.fillRect(x+1, y+1, 3, T-2); g.fillRect(x+T-4, y+1, 3, T-2);
  g.fillStyle = 'rgba(201,162,39,0.28)'; g.fillRect(x+1, y+1, T-2, 1.2);
}
function drawDecor(g, x, y, T, kind){
  g.save(); g.translate(x,y);
  if (kind === 'cask' || kind === 'barrel'){
    const w = T*0.56, h = T*0.62, big = kind === 'barrel';
    g.fillStyle = shade('#5b4326', 1);
    g.beginPath();
    g.ellipse(0, h*0.1, w*0.52, h*0.18, 0, 0, 7); g.fill();
    g.fillRect(-w/2, -h/2, w, h);
    g.fillStyle = 'rgba(0,0,0,0.28)'; g.fillRect(w*0.15, -h/2, w*0.35, h);
    g.strokeStyle = 'rgba(201,162,39,0.55)'; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(-w/2, -h*0.22); g.lineTo(w/2, -h*0.22);
    g.moveTo(-w/2, h*0.22); g.lineTo(w/2, h*0.22); g.stroke();
    g.fillStyle = shade(C.iron, 1);
    g.beginPath(); g.ellipse(0, -h/2, w*0.52, h*0.17, 0, 0, 7); g.fill();
    if (big){ g.strokeStyle = 'rgba(201,162,39,0.4)'; g.lineWidth = 1.2;
      g.beginPath(); g.arc(0, 0, w*0.3, 0, 7); g.stroke(); }
  } else if (kind === 'coil'){
    g.strokeStyle = 'rgba(150,124,84,0.85)'; g.lineWidth = 2.4;
    for (let i=0;i<4;i++){ g.beginPath(); g.arc(0, 0, T*0.10 + i*2.6, 0, 7); g.stroke(); }
    g.strokeStyle = 'rgba(60,46,28,0.6)'; g.lineWidth = 0.9;
    for (let i=0;i<4;i++){ g.beginPath(); g.arc(0, 0, T*0.10 + i*2.6, 0.6, 2.4); g.stroke(); }
  } else if (kind === 'hook'){
    g.strokeStyle = C.ironLt; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0,-T*0.2); g.lineTo(0,T*0.05);
    g.arc(-T*0.07, T*0.05, T*0.07, 0, Math.PI); g.stroke();
    g.fillStyle = 'rgba(201,162,39,0.5)';
    g.beginPath(); g.arc(0,-T*0.2,2.2,0,7); g.fill();
  } else if (kind === 'shelf'){
    g.fillStyle = shade('#4a3a24',1);
    g.fillRect(-T*0.42, -T*0.06, T*0.84, 4);
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(-T*0.42, T*0.10, T*0.84, 3);
    g.fillStyle = 'rgba(201,162,39,0.45)';
    g.fillRect(-T*0.34, -T*0.16, 5, 10); g.fillRect(-T*0.20, -T*0.12, 4, 6);
  }
  g.restore();
}

/* ============================================================ the entities */
function keeper(g, x, y, T, o){
  /* o: {face, walk (0..1), carry, live, ghost (0..1), age, t} */
  const s = T / 40;
  g.save(); g.translate(x, y);
  g.fillStyle = 'rgba(6,6,5,0.42)';
  g.beginPath(); g.ellipse(0, T*0.36, T*0.26, T*0.09, 0, 0, 7); g.fill();
  g.scale(s, s);
  const body = o.ghost ? 'rgba(226,226,208,' + (0.16 + o.ghost*0.5) + ')' : (o.live ? '#241d15' : '#2b241a');
  const edge = o.ghost ? 'rgba(236,238,224,' + (0.14 + o.ghost*0.34) + ')' : (o.live ? 'rgba(255,206,138,0.55)' : 'rgba(190,205,190,0.22)');
  const w = o.walk;
  /* legs */
  g.strokeStyle = body; g.lineWidth = 3.4; g.lineCap = 'round';
  g.beginPath();
  g.moveTo(-3, 4); g.lineTo(-3 - Math.sin(w*Math.PI)*4.2, 13);
  g.moveTo(3, 4);  g.lineTo(3 + Math.sin(w*Math.PI)*4.2, 13);
  g.stroke();
  /* oilskin: shoulders to hem */
  g.beginPath();
  g.moveTo(-7, -6);
  g.quadraticCurveTo(-9.5, -1, -8.5, 7);
  g.lineTo(8.5, 7);
  g.quadraticCurveTo(9.5, -1, 7, -6);
  g.quadraticCurveTo(0, -9.5, -7, -6);
  g.closePath();
  g.fillStyle = body; g.fill();
  g.strokeStyle = edge; g.lineWidth = 0.9; g.stroke();
  /* collar */
  g.beginPath(); g.moveTo(-6, -5.5); g.lineTo(0, -2.2); g.lineTo(6, -5.5);
  g.strokeStyle = edge; g.lineWidth = 1; g.stroke();
  /* sou'wester */
  g.beginPath(); g.ellipse(0, -8.2, 8.4, 2.3, 0, 0, 7); g.fillStyle = body; g.fill();
  g.beginPath(); g.arc(0.4, -10.4, 4.5, Math.PI, 0); g.lineTo(4.6,-8.6); g.lineTo(-3.8,-8.6);
  g.closePath(); g.fillStyle = body; g.fill();
  g.strokeStyle = edge; g.lineWidth = 0.8;
  g.beginPath(); g.ellipse(0, -8.2, 8.4, 2.3, 0, 0, 7); g.stroke();
  /* the lantern, carried out to the side he faces */
  const dir = o.face === 'l' ? -1 : o.face === 'r' ? 1 : 0;
  const lx = dir === 0 ? 8.5 : dir * 9.5, ly = 0.5 + (o.face === 'u' ? 3 : 0);
  g.strokeStyle = body; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(dir*6, -4.5); g.lineTo(lx, ly-4); g.stroke();
  g.fillStyle = o.ghost ? 'rgba(70,74,68,0.75)' : shade(C.brassDk, 1.1);
  g.beginPath(); g.rect(lx-3, ly-3.4, 6, 7); g.fill();
  g.strokeStyle = o.ghost ? 'rgba(190,196,188,0.4)' : C.brass; g.lineWidth = 0.8;
  g.strokeRect(lx-3, ly-3.4, 6, 7);
  if (!o.ghost){
    g.fillStyle = C.lamp; g.beginPath(); g.arc(lx, ly, 1.5, 0, 7); g.fill();
  } else {
    g.strokeStyle = 'rgba(190,196,188,0.35)'; g.lineWidth = 0.7;
    g.beginPath(); g.moveTo(lx, ly-3.4);
    g.bezierCurveTo(lx+2, ly-6, lx-2, ly-8, lx+0.5, ly-11); g.stroke();
  }
  g.restore();
}
function truckArt(g, x, y, T){
  g.save(); g.translate(x,y);
  g.fillStyle = 'rgba(6,6,5,0.45)';
  g.beginPath(); g.ellipse(0, T*0.24, T*0.3, T*0.1, 0, 0, 7); g.fill();
  const w = T*0.56, h = T*0.4;
  g.fillStyle = shade(C.brassDk, 0.9);
  rr(g, -w/2, -h/2, w, h, 3); g.fill();
  const gr = g.createLinearGradient(0,-h/2,0,h/2);
  gr.addColorStop(0, 'rgba(232,207,114,0.55)'); gr.addColorStop(0.5,'rgba(201,162,39,0.12)');
  gr.addColorStop(1, 'rgba(0,0,0,0.28)');
  g.fillStyle = gr; rr(g, -w/2, -h/2, w, h, 3); g.fill();
  g.strokeStyle = 'rgba(232,207,114,0.65)'; g.lineWidth = 1; rr(g, -w/2, -h/2, w, h, 3); g.stroke();
  g.fillStyle = 'rgba(20,17,12,0.55)';
  for (let i=-1;i<=1;i++){ g.fillRect(i*w*0.28, -h/2+1, 2, h-2); }
  g.fillStyle = 'rgba(232,207,114,0.8)';
  g.beginPath(); g.arc(0, 0, 2.1, 0, 7); g.fill();
  g.restore();
}
function canArt(g, x, y, T, o){
  g.save(); g.translate(x,y);
  g.fillStyle = 'rgba(6,6,5,0.4)';
  g.beginPath(); g.ellipse(0, T*0.2, T*0.22, T*0.07, 0, 0, 7); g.fill();
  const w = T*0.3, h = T*0.32;
  const gr = g.createLinearGradient(-w/2,0,w/2,0);
  gr.addColorStop(0, shade(C.brassDk,0.8)); gr.addColorStop(0.45, C.brassLt); gr.addColorStop(1, shade(C.brassDk,1.1));
  g.fillStyle = gr; rr(g, -w/2, -h/2, w, h, 2.5); g.fill();
  g.strokeStyle = 'rgba(60,44,10,0.8)'; g.lineWidth = 1; rr(g, -w/2, -h/2, w, h, 2.5); g.stroke();
  g.fillStyle = 'rgba(140,74,38,0.55)';
  g.fillRect(-w/2+1, h*0.1, w-2, 3);
  /* the long spout */
  g.strokeStyle = shade(C.brassDk,1.2); g.lineWidth = 2.4; g.lineCap='round';
  g.beginPath(); g.moveTo(w/2-1, -h*0.2); g.quadraticCurveTo(w/2+7, -h*0.5, w/2+4, -h*0.75); g.stroke();
  g.strokeStyle = C.brass; g.lineWidth = 1.1;
  g.beginPath(); g.moveTo(w/2-1, -h*0.2); g.quadraticCurveTo(w/2+7, -h*0.5, w/2+4, -h*0.75); g.stroke();
  g.restore();
}

/* ============================================================ lamp + beam */
function lensRings(g, cx, cy, R, ang, lit, t){
  g.save(); g.translate(cx,cy);
  /* the brass cage does not care whether the wick is dressed */
  g.rotate(ang);
  g.strokeStyle = lit ? 'rgba(232,207,114,0.5)' : 'rgba(201,162,39,0.30)';
  g.lineWidth = Math.max(1, R*0.035);
  for (let k=0;k<8;k++){
    const a = k*Math.PI/4 + Math.PI/8;
    g.beginPath();
    g.moveTo(Math.cos(a)*R*0.18, Math.sin(a)*R*0.18);
    g.lineTo(Math.cos(a)*R*1.06, Math.sin(a)*R*1.06);
    g.stroke();
  }
  for (const f of [0.34, 0.68, 1.02]){
    g.beginPath();
    for (let k=0;k<8;k++){
      const a = k*Math.PI/4 + Math.PI/8;
      const x = Math.cos(a)*R*f, y = Math.sin(a)*R*f;
      if (k===0) g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.closePath(); g.stroke();
  }
  g.rotate(-ang);
  /* the prisms themselves: concentric octagonal belts of glass */
  for (let i=7;i>=1;i--){
    const r = R * i/7;
    g.beginPath();
    for (let k=0;k<8;k++){
      const a1 = k*Math.PI/4 + Math.PI/8, a2 = a1 + Math.PI/4;
      if (k===0) g.moveTo(Math.cos(a1)*r, Math.sin(a1)*r); else g.lineTo(Math.cos(a1)*r, Math.sin(a1)*r);
      g.lineTo(Math.cos((a1+a2)/2)*r*1.10, Math.sin((a1+a2)/2)*r*1.10);
      g.lineTo(Math.cos(a2)*r, Math.sin(a2)*r);
    }
    g.closePath();
    const gr = g.createLinearGradient(-r,-r,r,r);
    if (lit){
      gr.addColorStop(0, 'rgba(255,240,200,' + (0.16 + 0.05*Math.sin(t*3+i)) + ')');
      gr.addColorStop(0.5,'rgba(255,226,168,0.07)');
      gr.addColorStop(1, 'rgba(224,138,44,0.18)');
    } else {
      gr.addColorStop(0, 'rgba(196,206,192,0.13)');
      gr.addColorStop(0.5,'rgba(170,184,170,0.05)');
      gr.addColorStop(1, 'rgba(38,46,40,0.22)');
    }
    g.fillStyle = gr; g.fill();
    g.strokeStyle = lit ? 'rgba(255,244,214,0.34)' : 'rgba(196,206,192,0.20)';
    g.lineWidth = 0.9; g.stroke();
  }
  g.restore();
}
function beam(g, cx, cy, ang, warm, a, R){
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i=0;i<3;i++){
    const sp = 0.085 + i*0.085, al = a * (0.55 - i*0.15);
    if (al <= 0) continue;
    g.beginPath(); g.moveTo(cx,cy); g.arc(cx,cy,R,ang-sp,ang+sp); g.closePath();
    const gr = g.createRadialGradient(cx,cy,0,cx,cy,R);
    const col = warm ? '255,214,150' : '150,164,156';
    gr.addColorStop(0,'rgba('+col+','+al*0.55+')');
    gr.addColorStop(0.5,'rgba('+col+','+al*0.18+')');
    gr.addColorStop(1,'rgba('+col+',0)');
    g.fillStyle = gr; g.fill();
  }
  g.restore();
}

/* ================================================================== render */
function drawGame(d){
  const L = G.L, T = d.T, X = d.room.x, Y = d.room.y;
  const t = G.t;
  const turn = G.turns[G.turns.length-1];
  const b = turn ? turn.states.length-1 : -1;
  const cur = turn && turn.states[b] ? turn.states[b] : (turn ? turn.base : null);
  const prev = turn && b > 0 ? turn.states[b-1] : (turn ? turn.base : null);
  const a = G.alpha;
  const lit = cur ? cur.lit : false;
  const frac = turn && L.beats ? Math.min(1, (b+1)/L.beats) : 0;
  const ang = (b + a) / L.beats * Math.PI*2;

  if (baked && baked.id === L.id) cx.drawImage(baked.c, 0, 0, d.dw, d.dh);

  /* --- the room, when nothing has been resolved yet (a fresh turn) --- */
  const st = cur || { bodies:[{key:'K',rec:false,label:0,x:L.start[0],y:L.start[1],carry:false,face:'d'}],
                      crates:L.crates.map(function(c){return{id:c.id,x:c.x,y:c.y};}),
                      can:{x:L.can[0],y:L.can[1],by:null}, doors:{}, lit:false };

  /* --- mechanisms --- */
  drawTreadles(L, X, Y, T, st, t);
  drawDoors(L, X, Y, T, st, prev, a, t);
  if (L.feed) drawStand(L, X, Y, T, st, t);

  /* --- the ink trace of every watch on the drum --- */
  if (turn) drawTraces(turn, X, Y, T, a, b);

  /* --- the burner, the lens, the flame --- */
  if (L.burner) drawBurner(L, X, Y, T, st, t, lit, ang);

  /* --- the truck and the can --- */
  for (const c of st.crates) truckArt(cx, X + c.x*T + T/2, Y + c.y*T + T/2, T);
  if (st.can.by === null) canArt(cx, X + st.can.x*T + T/2, Y + st.can.y*T + T/2, T);

  /* --- the bodies --- */
  drawBodies(L, X, Y, T, prev, st, a, t);

  /* --- the fault, chalked on the floor --- */
  if (G.mode === 'torn' && G.fault) drawFault(L, X, Y, T);

  /* --- the light --- */
  if (L.burner) beam(cx, X + L.burner[0]*T + T/2, Y + L.burner[1]*T + T/2, ang, lit, lit?0.5:0.22, Math.max(L.w,L.h)*T*1.25);
  drawLampPool(X, Y, L, T, lit, t);
  drawFog(d, t, lit, T);

  /* --- the desk: instrument plate, the drum's paper, the log's last line --- */
  drawDesk(d, L, T, X, Y, turn, b, lit, t);

  /* --- the turn-change: the light comes round --- */
  if (G.wrap > 0){
    const w = 1 - G.wrap/0.55;
    cx.save(); cx.globalCompositeOperation = 'lighter';
    cx.fillStyle = 'rgba(255,238,194,' + (0.10*Math.sin(w*Math.PI)) + ')';
    cx.fillRect(0,0,d.dw,d.dh); cx.restore();
  }
  if (reduced && G.wrap > 0) G.wrap = 0;
}

function drawTreadles(L, X, Y, T, st, t){
  for (const k in L.treadles){
    const p = L.treadles[k], px = X + p[0]*T, py = Y + p[1]*T;
    const held = !!st.doors[k];
    const hasDoor = !!L.doors[k];
    cx.save();
    cx.fillStyle = 'rgba(24,20,14,0.5)';
    rr(cx, px+2, py+2, T-4, T-4, 3); cx.fill();
    /* the plate itself, sunk or flush */
    const off = held ? 2.5 : 0;
    const gr = cx.createLinearGradient(px, py+off, px, py+off+T);
    gr.addColorStop(0, held ? shade(C.brassDk,1.05) : shade(C.brass,0.62));
    gr.addColorStop(1, held ? shade(C.brassDk,0.7) : shade(C.brassDk,0.9));
    cx.fillStyle = gr;
    rr(cx, px+3, py+3+off, T-6, T-6-off, 2.5); cx.fill();
    cx.strokeStyle = 'rgba(255,240,190,0.30)'; cx.lineWidth = 1;
    rr(cx, px+3, py+3+off, T-6, T-6-off, 2.5); cx.stroke();
    /* the letter, stamped */
    cx.fillStyle = held ? 'rgba(255,240,190,0.5)' : 'rgba(30,24,14,0.5)';
    cx.font = (T*0.34) + 'px ' + SERIF;
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(k.toUpperCase(), px + T/2, py + T/2 + off*0.4);
    if (!hasDoor){ /* the whistle rope */
      cx.strokeStyle = 'rgba(190,166,110,0.5)'; cx.lineWidth = 1.4;
      cx.beginPath(); cx.moveTo(px+T*0.72, py+T*0.2); cx.lineTo(px+T*0.72, py+T*0.8); cx.stroke();
    }
    cx.restore();
  }
}
function drawDoors(L, X, Y, T, st, prev, a, t){
  for (const k in L.doors){
    const p = L.doors[k], px = X + p[0]*T, py = Y + p[1]*T;
    const open = !!st.doors[k], was = prev ? !!prev.doors[k] : open;
    const swing = open ? (was ? 1 : 0.55 + 0.45*Math.min(1,a)) : 0;
    cx.save();
    /* the frame */
    cx.fillStyle = C.iron;
    cx.fillRect(px, py, 3, T); cx.fillRect(px+T-3, py, 3, T);
    cx.fillRect(px, py, T, 2.5); cx.fillRect(px, py+T-2.5, T, 2.5);
    /* the leaf, hinged on the left, opening toward the top of the screen */
    cx.translate(px, py);
    cx.transform(Math.cos(-swing*1.45), Math.sin(-swing*1.45), 0, 1, 0, 0);
    const gr = cx.createLinearGradient(0,0,T,0);
    gr.addColorStop(0, shade(C.ironLt,1)); gr.addColorStop(0.5, C.iron); gr.addColorStop(1, shade(C.iron,0.7));
    cx.fillStyle = gr; cx.fillRect(0, 0, T-3, T-2.5);
    cx.strokeStyle = 'rgba(190,205,190,0.16)'; cx.lineWidth = 0.8;
    for (let i=4;i<T-4;i+=5){ cx.beginPath(); cx.moveTo(2,i); cx.lineTo(T-5,i); cx.stroke(); }
    cx.fillStyle = 'rgba(201,162,39,0.55)';
    cx.beginPath(); cx.arc(T-8, T/2, 2.2, 0, 7); cx.fill();
    cx.restore();
    if (!open){
      cx.fillStyle = 'rgba(20,17,12,0.35)';
      cx.fillRect(px+3, py+2.5, T-6, T-5);
    }
  }
}
function drawStand(L, X, Y, T, st, t){
  const px = X + L.feed[0]*T, py = Y + L.feed[1]*T;
  cx.save();
  cx.strokeStyle = 'rgba(201,162,39,0.55)'; cx.lineWidth = 1.4;
  cx.setLineDash([5,4]);
  cx.strokeRect(px+4, py+4, T-8, T-8);
  cx.setLineDash([]);
  cx.strokeStyle = 'rgba(201,162,39,0.30)'; cx.lineWidth = 1;
  cx.beginPath(); cx.moveTo(px+4, py+T/2); cx.lineTo(px+T-4, py+T/2); cx.stroke();
  cx.fillStyle = 'rgba(201,162,39,0.32)';
  cx.font = (T*0.2)+'px '+SERIF; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('stand', px+T/2, py+T*0.28);
  cx.restore();
}
function drawBurner(L, X, Y, T, st, t, lit, ang){
  const px = X + L.burner[0]*T + T/2, py = Y + L.burner[1]*T + T/2;
  const R = T*0.52;
  cx.save();
  /* the pedestal */
  cx.fillStyle = shade(C.brassDk, 0.85);
  cx.beginPath(); cx.ellipse(px, py+T*0.3, T*0.26, T*0.09, 0, 0, 7); cx.fill();
  cx.fillRect(px-T*0.07, py+T*0.06, T*0.14, T*0.26);
  /* the lens, in plan, turning on the weight */
  lensRings(cx, px, py - T*0.02, R, ang, lit, t);
  lampCore(cx, px, py, T, lit, t);
  cx.restore();
}
/* the burner, its glass, and the flame: shared by the room and the title */
function lampCore(g, px, py, T, lit, t){
  /* the fount: a brass font of paraffin, and the gallery the flame stands in */
  g.fillStyle = shade(C.brass, 0.86);
  g.beginPath();
  g.moveTo(px - T*0.115, py + T*0.13);
  g.lineTo(px + T*0.115, py + T*0.13);
  g.quadraticCurveTo(px + T*0.125, py + T*0.02, px + T*0.045, py - T*0.005);
  g.lineTo(px - T*0.045, py - T*0.005);
  g.quadraticCurveTo(px - T*0.125, py + T*0.02, px - T*0.115, py + T*0.13);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(38,28,10,0.65)'; g.lineWidth = Math.max(0.8, T*0.02); g.stroke();
  g.fillStyle = 'rgba(140,74,38,0.35)';
  g.fillRect(px - T*0.10, py + T*0.055, T*0.20, Math.max(1, T*0.028));
  if (lit){
    const f = 0.86 + 0.14*Math.sin(t*11.3) + 0.05*Math.sin(t*23.7);
    g.save(); g.globalCompositeOperation = 'lighter';
    const gr = g.createRadialGradient(px, py - T*0.11*f, 0, px, py - T*0.11*f, T*0.66*f);
    gr.addColorStop(0,   'rgba(255,206,132,0.50)');
    gr.addColorStop(0.18,'rgba(255,176,92,0.32)');
    gr.addColorStop(0.46,'rgba(230,146,58,0.15)');
    gr.addColorStop(1,   'rgba(224,138,44,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(px, py - T*0.11*f, T*0.66*f, 0, 7); g.fill();
    g.restore();
    /* the flame itself is drawn, not added: an amber envelope with a cream
       core, so that it never burns out to a white spot */
    g.fillStyle = 'rgba(255,186,96,0.95)';
    g.beginPath();
    g.moveTo(px, py - T*0.33*f);
    g.quadraticCurveTo(px + T*0.05, py - T*0.16, px + T*0.02, py - T*0.06);
    g.quadraticCurveTo(px, py - T*0.03, px - T*0.02, py - T*0.06);
    g.quadraticCurveTo(px - T*0.05, py - T*0.16, px, py - T*0.33*f);
    g.fill();
    g.fillStyle = '#ffeec2';
    g.beginPath();
    g.moveTo(px, py - T*0.20*f);
    g.quadraticCurveTo(px + T*0.024, py - T*0.125, px + T*0.008, py - T*0.07);
    g.quadraticCurveTo(px, py - T*0.055, px - T*0.008, py - T*0.07);
    g.quadraticCurveTo(px - T*0.024, py - T*0.125, px, py - T*0.20*f);
    g.fill();
  } else {
    g.fillStyle = 'rgba(120,132,124,0.30)';
    g.beginPath(); g.arc(px, py - T*0.14, T*0.022, 0, 7); g.fill();
  }
  /* the glass chimney, over the flame, with one highlight down it */
  g.fillStyle = lit ? 'rgba(255,246,214,0.13)' : 'rgba(150,162,150,0.09)';
  rr(g, px - T*0.075, py - T*0.36, T*0.15, T*0.36, T*0.03); g.fill();
  g.strokeStyle = lit ? 'rgba(255,244,210,0.34)' : 'rgba(176,188,174,0.20)';
  g.lineWidth = Math.max(0.7, T*0.016); rr(g, px - T*0.075, py - T*0.36, T*0.15, T*0.36, T*0.03); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.16)';
  g.fillRect(px - T*0.05, py - T*0.32, Math.max(1, T*0.022), T*0.26);
}
function drawTraces(turn, X, Y, T, a, b){
  const states = turn.states;
  cx.save();
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  for (let i=0;i<states.length;i++){
    const s = states[i];
    s.bodies.forEach(function(bd, bi){
      if (bd.rec && bd.label !== i+1) return;
      const prev = i>0 ? states[i-1].bodies[bi] : turn.base.bodies[bi];
      const age = 1 - (states.length-1-i)/(states.length+3);
      cx.beginPath();
      cx.moveTo(X + prev.x*T + T/2, Y + prev.y*T + T/2);
      cx.lineTo(X + s.bodies[bi].x*T + T/2, Y + s.bodies[bi].y*T + T/2);
      if (bd.rec){
        cx.strokeStyle = 'rgba(226,220,198,' + (0.05 + age*0.16) + ')';
        cx.lineWidth = 1.2; cx.setLineDash([3,3]);
      } else {
        cx.strokeStyle = 'rgba(34,27,18,' + (0.14 + age*0.34) + ')';
        cx.lineWidth = 1.9; cx.setLineDash([]);
      }
      cx.stroke();
      cx.setLineDash([]);
      if (bd.rec && states.length < 40){
        cx.fillStyle = 'rgba(226,220,198,' + (0.06 + age*0.2) + ')';
        cx.beginPath(); cx.arc(X + s.bodies[bi].x*T + T/2, Y + s.bodies[bi].y*T + T/2, 1.3, 0, 7); cx.fill();
      }
    });
  }
  cx.restore();
}
function drawBodies(L, X, Y, T, prev, st, a, t){
  const n = st.bodies.length;
  /* the pools go down first, so that every figure stands in its own light */
  cx.save(); cx.globalCompositeOperation = 'lighter';
  for (let i=0;i<n;i++){
    const b = st.bodies[i], p = prev ? prev.bodies[i] : b;
    const gx = X + (p.x + (b.x-p.x)*a)*T + T/2;
    const gy = Y + (p.y + (b.y-p.y)*a)*T + T/2;
    const R = T * (b.rec ? 0.9 : 1.5);
    const gr = cx.createRadialGradient(gx, gy, 0, gx, gy, R);
    if (b.rec){
      gr.addColorStop(0, 'rgba(168,178,166,0.055)');
      gr.addColorStop(0.5, 'rgba(150,162,150,0.022)');
    } else {
      const f = 0.9 + 0.1*Math.sin(t*7.3);
      gr.addColorStop(0, 'rgba(255,222,164,' + (0.15*f) + ')');
      gr.addColorStop(0.35, 'rgba(255,200,120,' + (0.05*f) + ')');
    }
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = gr;
    cx.beginPath(); cx.arc(gx, gy, R, 0, 7); cx.fill();
  }
  cx.restore();
  for (let i=0;i<n;i++){
    const b = st.bodies[i], p = prev ? prev.bodies[i] : b;
    const gx = X + (p.x + (b.x-p.x)*a)*T + T/2;
    const gy = Y + (p.y + (b.y-p.y)*a)*T + T/2;
    const moved = (b.x!==p.x || b.y!==p.y);
    const walk = moved ? a : 0;
    if (b.rec){
      /* a memory: chalk, doubled, slightly out of register, and numbered */
      keeper(cx, gx + 1.8, gy - 1.2, T, { face:b.face, walk:walk, carry:false, live:false,
        ghost:0.50 - 0.07*(b.label-1) });
      keeper(cx, gx, gy, T, { face:b.face, walk:walk, carry:false, live:false,
        ghost:0.44 - 0.07*(b.label-1) });
      cx.save();
      cx.fillStyle = 'rgba(244,238,216,0.80)';
      cx.font = (T*0.34) + 'px ' + SERIF;
      cx.textAlign = 'center'; cx.textBaseline = 'bottom';
      cx.fillText(String(b.label), gx + T*0.30, gy - T*0.28);
      cx.restore();
    } else {
      keeper(cx, gx, gy, T, { face:b.face, walk:walk, carry:b.carry, live:true, ghost:0 });
    }
  }
}
function drawFault(L, X, Y, T){
  const f = G.fault;
  if (!f || !f.act) return;
  const px = X + f.act[0]*T + T/2, py = Y + f.act[1]*T + T/2;
  cx.save();
  cx.strokeStyle = 'rgba(200,120,80,0.85)'; cx.lineWidth = 2.4;
  cx.setLineDash([6,4]);
  cx.beginPath(); cx.arc(px, py, T*0.44, 0, 7); cx.stroke();
  cx.setLineDash([]);
  cx.strokeStyle = 'rgba(200,120,80,0.35)'; cx.lineWidth = 6;
  cx.beginPath(); cx.arc(px, py, T*0.44 + 5, 0, 7); cx.stroke();
  cx.restore();
}
function drawLampPool(X, Y, L, T, lit, t){
  cx.save();
  const bx = X + L.burner[0]*T + T/2, by = Y + L.burner[1]*T + T/2;
  const cxm = X + L.w*T/2, cym = Y + L.h*T/2;
  /* the pool is centred on the lamp, not on the room: that is the whole
     reason the rooms are shaped the way they are */
  const R = Math.max(L.w,L.h)*T*0.92;
  const flick = 0.93 + 0.07*Math.sin(t*9.1) + 0.03*Math.sin(t*21.3);
  const gr = cx.createRadialGradient(bx, by, T*0.4, bx, by, R);
  gr.addColorStop(0, 'rgba(255,216,152,' + ((lit?0.20:0.075)*flick) + ')');
  gr.addColorStop(0.45, 'rgba(255,206,138,' + ((lit?0.07:0.026)*flick) + ')');
  gr.addColorStop(1, 'rgba(255,206,138,0)');
  cx.fillStyle = gr; cx.fillRect(X, Y, L.w*T, L.h*T);
  /* the corners fall away */
  const vg = cx.createRadialGradient(cxm, cym, Math.min(L.w,L.h)*T*0.24, cxm, cym, Math.max(L.w,L.h)*T*0.74);
  vg.addColorStop(0, 'rgba(8,9,8,0)'); vg.addColorStop(1, 'rgba(8,9,8,0.70)');
  cx.fillStyle = vg; cx.fillRect(X, Y, L.w*T, L.h*T);
  cx.restore();
}
function drawFog(d, t, lit, T){
  if (reduced) return;
  const w = d.room.w, h = d.room.h, X = d.room.x, Y = d.room.y;
  cx.save();
  cx.beginPath(); cx.rect(X,Y,w,h); cx.clip();
  cx.globalCompositeOperation = 'lighter';
  for (let i=0;i<6;i++){
    const sp = 5 + i*3.5;
    const x = X + (((t*sp + i*137) % (w+300)) - 150);
    const y = Y + h*(0.14 + 0.13*i) + Math.sin(t*0.4 + i)*7;
    const rx = 130 + i*34, ry = 26 + i*9;
    const gr = cx.createRadialGradient(x, y, 0, x, y, rx);
    gr.addColorStop(0, 'rgba(210,204,186,0.052)');
    gr.addColorStop(1, 'rgba(210,204,186,0)');
    cx.fillStyle = gr;
    cx.save(); cx.translate(x,y); cx.scale(1, ry/rx);
    cx.beginPath(); cx.arc(0,0,rx,0,7); cx.fill(); cx.restore();
  }
  /* motes off the flame */
  const L = G.L;
  if (L && L.burner){
    const bx = X + L.burner[0]*T + T/2, by = Y + L.burner[1]*T + T/2;
    for (let i=0;i<30;i++){
      const ph = (t*0.25 + i*0.137) % 1;
      const a = nz(i,5);
      const px = bx + Math.sin(t*0.7 + i*2.1)*(8 + ph*26) + (a-0.5)*10;
      const py = by - ph*70 - a*12;
      cx.fillStyle = 'rgba(255,226,170,' + (0.16*(1-ph)*(lit?1:0.4)) + ')';
      cx.fillRect(px, py, 1.4, 1.4);
    }
  }
  cx.restore();
}

/* ------------------------------------------------- instrument plate + drum */
function drawDesk(d, L, T, X, Y, turn, b, lit, t){
  const w = d.dw - 36, dx = 18, dy = Y + L.h*T + 12;
  drawPlate(d, L, T, dx, dy, turn, b, lit, t);
  drawStrip(d, L, T, dx, dy, turn, b, w);
  /* the log's last line, in a hand, across the whole sheet */
  cx.save();
  cx.font = 'italic 15.5px ' + SERIF;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillStyle = 'rgba(210,204,182,0.74)';
  cx.fillText(clip(cx, G.entry || '', w), dx + w/2, dy + 104 + 16);
  cx.restore();
}
function clip(g, s, w){
  if (g.measureText(s).width <= w) return s;
  let lo = 0, hi = s.length;
  while (lo < hi){ const m = (lo+hi+1) >> 1; if (g.measureText(s.slice(0,m)+'…').width <= w) lo = m; else hi = m-1; }

/* ================================================================== notes */
function note(key, alt){
  if (G.once[key]) return;
  G.once[key] = true;
  G.entry = alt || V.once[key] || '';
  G.entryT = 0;
}
function pollNotes(){
  const turn = G.turns[G.turns.length-1];
  if (!turn) return;
  const b = turn.states.length-1;
  if (b < 0) return;
  const s = turn.states[b], p = b>0 ? turn.states[b-1] : turn.base;
  const me = s.bodies[s.bodies.length-1];
  const pme = p.bodies[p.bodies.length-1];
  for (const k in G.L.treadles){
    const q = G.L.treadles[k];
    if (me.x===q[0] && me.y===q[1]) note('treadle');
  }
  if (me.carry) note('carry');
  if (me.x===pme.x && me.y===pme.y){
    const ch = G.log[G.log.length-1][b];
    const d = DIR[ch];
    if (d){
      const nx = me.x+d[0], ny = me.y+d[1];
      if (G.L.doorAt[k_(nx,ny)]) note('shut');
    }
  }
  for (let i=0;i<s.crates.length;i++){
    if (s.crates[i].x!==p.crates[i].x || s.crates[i].y!==p.crates[i].y) note('push');
    const k = G.L.treadles;
    for (const tl in k){
      if (s.crates[i].x===k[tl][0] && s.crates[i].y===k[tl][1] && !s.doors[tl]) note('heavy');
    }
  }
  if (s.lit) note('lit');
  if (turn.watches > 0) note('echo');
  if (turn.horn) note('horn');
  if (G.log.length - 1 >= MAXWATCH) note('full');
  if (turn.dropped) note('rubbed');
}

/* ================================================================= control */
function loadLevel(i){
  G.li = i;
  G.L = parseLevel(LEVELS[i]);
  G.scene = 'room';
  G.log = [[]];
  G.turns = simulate(G.L, G.log);
  G.once = {}; G.fault = null; G.alpha = 1;
  G.wrap = 0.55; G.wrapEnd = performance.now() + 560; G.queued = null; G.ringQueued = false;
  G.entry = V.levels[i].log[0];
  bakeLevel();
}
function recompute(){ G.turns = simulate(G.L, G.log); }
function lastTurn(){ return G.turns[G.turns.length-1]; }

function turnBusy(){ return G.wrapEnd > 0 && performance.now() < G.wrapEnd; }
function input(ch){
  if (G.mode !== 'play') return;
  if (turnBusy()){ if (!G.queued) G.queued = []; if (G.queued.length < 8) G.queued.push(ch); return; }
  const L = G.L, turn = lastTurn();
  if (turn && turn.fault) return;
  G.log[G.log.length-1].push(ch);
  G.alpha = 0;
  recompute();
  const t2 = lastTurn();
  pollNotes();
  if (t2.fault){
    G.mode = 'torn'; G.fault = t2.fault;
    AU.tear();
    showTorn(t2.fault);
    return;
  }
  if (t2.win){
    G.mode = 'won'; AU.chime();
    showWon();
    return;
  }
  if (t2.len >= L.beats){ endTurn(true); return; }
  AU.tick();
}
function endTurn(quiet){
  const L = G.L;
  if (G.log[G.log.length-1].length === 0) return;
  G.log.push([]);
  G.turns = simulate(G.L, G.log);
  G.wrap = 0.55; G.wrapEnd = performance.now() + 560;
  AU.clunk();
  const idx = G.log.length - 1;
  const line = V.turnLine[Math.min(idx-1, V.turnLine.length-1)];
  if (idx-1 === 0) note('turn');
  else if (!G.once['turnline'+idx]){ G.once['turnline'+idx] = true; G.entry = line; G.entryT = 0; }
  if (idx-1 >= MAXWATCH) note('rubbed');
  if (G.turns[idx] && G.turns[idx].dropped) note('rubbed');
}
function ringChange(){
  if (G.mode !== 'play') return;
  if (turnBusy()){ G.ringQueued = true; return; }
  const t = lastTurn();
  if (t && t.full && G.L.win.requireFullTurn){
    /* R: a short watch is a lie the book will not carry.  Say so, in voice. */
    G.entry = V.win.refuse; G.entryT = 0; G.once.refuse = true;
    AU.tone(120, 0.5, 'sine', 0.07, 90);
    return;
  }
  if (G.log[G.log.length-1].length === 0) return;
  endTurn();
}
function undo(){
  if (G.mode !== 'play' && G.mode !== 'torn') return;
  G.mode = 'play';
  hideCard();
  G.fault = null; G.wrap = 0; G.wrapEnd = 0; G.queued = null;
  const last = G.log[G.log.length-1];
  if (last.length) last.pop();
  else if (G.log.length > 1) G.log.pop();
  G.alpha = 1;
  recompute();
  pollNotes();
  AU.tone(300, 0.12, 'sine', 0.05, 190);
}
function newWatch(){
  G.mode = 'play'; hideCard(); G.fault = null;
  loadLevel(G.li);
  AU.tone(160, 0.4, 'sine', 0.08, 90);
}
