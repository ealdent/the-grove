<!DOCTYPE html>
<!--
================================================================================
  THE UNTOLD HOUR
  a time-loop puzzle in one file · vanilla JS + one canvas · no assets, no network
================================================================================

  DESIGN DOCUMENT

  1. TITLE
     The Untold Hour.
     ("Told" as a dial tells the hour. An hour no dial can tell does not pass.)

  2. PREMISE
     You are the youngest apprentice at an observatory built of masonry: stairs
     that point at the pole, marble rules cut with every mark of the day. This
     morning a tremor shook the styles (the brass blades that throw the shadow)
     out of the dials. A dial without its style throws no shadow; an hour that
     throws no shadow cannot be told; and here, where the country's noon is
     kept, an hour that cannot be told does not pass. So the same forty marks
     come round again, court by court, until somebody carries each style back
     to its Seat. You are the somebody.

     The courts are barred, and the bars are kept by sun-eyes: brass lids in
     the paving that hold their bars up for as long as they can see the sun.
     One body cannot shade an eye and also walk through its bars. But the sun
     will not cast one hour two ways. Whatever shadow you threw the last time
     the hour ran is still owed to the ground, so it gets up from the Threshold
     without you and walks the hour again, key for key, solid enough to shade
     an eye or put its shoulder to a stone globe. These are your shades. A
     court will bear four.

     The debt runs both ways. If a shade reaches for a globe that is no longer
     there, or meets bars where it met none, the sky has been asked to tell two
     stories about one hour and tells neither: eclipse, until the contradiction
     is unsaid.

     The Astronomer watches from the gallery and writes it down. In the last
     court you learn why she knows the rules so well: the Great Dial's style
     fell forty years ago, on her watch, and one of her shades is still walking.

  3. ART DIRECTION
     A sun-bleached court seen from the gallery, against the light. Reference:
     the masonry observatories of the 1720s and 30s (stair-gnomons, marble
     quadrants, lime-wash over sandstone) and the engraved almanacs of the same
     century. Nothing glows; the only darkness is shadow, and shadow is the
     whole mechanism.
       Light      one hard sun, north of the court, sweeping east to west over
                  the forty marks, so every shadow falls toward the viewer and
                  swings left to right. The shadows are the clock.
       Shapes     wedges, stairs, arcs and graduated rules. Right triangles
                  (gnomons, the style) and circle segments (eyes, the Seat, the
                  globes). No outlines except engraved lines.
       Palette    paving        #E9D3A8 #E2C898   joints  #C9A772
                  sandstone     #DE9A76 #EDB594   in shade #A85F49 #8C4A3C
                  marble        #F6EFE2 #D9CFC0 #B9AC9A
                  lime-wash     #EBDDBD #DCC89F   ochre   #E3B23C
                  shadow        #4A2F3F           a shade #33202E
                  brass         #B8862B #E6C36A #7A5518
                  inlays        copper #C8442E  lapis #2F5D8C  jade #2E8B6A  jet #3B3038
                  the apprentice  madder #A8321F, ochre head-wrap, skin #8A5A3C
                  daybook       paper #F2E6CB  ink #3A2A22  rubric #A8321F
                  eclipse       #2A1B22 with a corona of #F8E7B0
                  evening       #F0A66B #C96A5A #6B4660, first star #FFF6DA
       Type       one serif throughout (Baskerville, falling back through
                  Hoefler Text, Palatino and Georgia), mostly italic, mixed case:
                  the daybook is a hand, the kerb letters are cut stone. Roman
                  numerals for courts and shades. No monospace, no capitals with
                  air between them.
       Motion     the shadows swing with the hour and are put back when it is
                  taken again; kites cross the court as shadows only; a pennant
                  on the gnomon; dust in the light; the eyes' rays turn.

  4. VOICE
     Every word is the Astronomer's daybook, written to you in the second
     person (what is observed in the present tense, what is remembered in the
     past): dry and exact as an observation, never raising its voice, and
     fonder of you than it lets the page show.

  WHAT THE NOUNS ARE (and why they cannot be swapped back)
     the hour, 40 marks .... one iteration of N ticks; the marks are the
                             graduations of the marble rule under the court
     a casting ............. one run of the hour (you cast a shadow)
     a shade ............... a recording: last hour's shadow, still owed, which
                             replays your keys. It throws no shadow of its own;
                             it is one.
     the Threshold ......... the start flag; the only flag shades may share
     a sun-eye, its bars ... the occupancy mechanism. It is opened by SHADE, so
                             a walker, a globe, or a gnomon's moving shadow all
                             work, and the last of those is on a timetable
     a stone globe ......... the pushable thing (it rolls; nothing pulls it)
     the style ............. the carried thing, and the reason the hour is stuck
     the Seat .............. the goal: the socket of that court's dial
     an eclipse ............ the catastrophe: a shade met a different hour
     unsay ................. undo (the daybook strikes a line)

  HIDDEN
     T on the title page (or #proofs in the address) runs the proofs: every
     court's intended solution, undo-to-nothing-and-replay, seven deliberate
     contradictions checked for casting, mark, expected and found, and the two
     limit rules. ] on the title page opens every court without earning it.

  The rules decided where the brief was silent are listed once, at the head of
  the engine below. The intended solutions are written beside each court.
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Untold Hour</title>
<style>
  html, body { margin: 0; height: 100%; background: #EBDDBD; overflow: hidden; overscroll-behavior: none; }
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; background: #EBDDBD; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>
<canvas id="court" aria-label="The Untold Hour: a court of an observatory, a marble hour scale, and the Astronomer's daybook."></canvas>
<script>
(function () {
'use strict';

// @@ENGINE-BEGIN
// ---------------------------------------------------------------------------
// THE ENGINE. Pure: state = simulate(court, log). No clocks, no randomness,
// no DOM. The log is a string, one character per key the apprentice pressed:
//   U D L R  step north / south / west / east (a refused step still spends a mark)
//   .        stand a mark
//   X        take up the style at your feet, or set it down there
//   E        sit out the rest of the hour (runs the remaining marks as '.')
// Undo is log.slice(0, -1) and a fresh simulate; nothing else is remembered.
//
// RULES DECIDED WHERE THE BRIEF WAS SILENT (kept in one place on purpose):
//  1. Order within a mark. Sun-eyes are read once, at the start of the mark,
//     from where everyone stood when it began; bars answer a mark late. Then
//     each walker acts in turn and completely: shades eldest first, the
//     apprentice last. A later walker meets the world the earlier ones left.
//  2. Same-flag conflicts. Walkers are solid. Two walkers wanting one flag:
//     the elder has it, the younger is refused (and spends the mark). Two
//     walkers swapping places: both refused. The Threshold is the exception:
//     any number may stand on it, since every casting begins there.
//  3. A shade replays KEYS, not places. After each key it compares what came
//     of it (stepped / stepped and took the style / rolled a drum / refused /
//     took / set down / nothing) with what came of it in its own hour. Any
//     difference, lucky or unlucky, is an eclipse, and the mark stops there.
//     Only what the shade itself touched is compared, never the whole court.
//  4. A globe rolls one flag when walked into, if the flag beyond is free:
//     not masonry, not shut bars, not another globe, not a walker, not the
//     Threshold, not the Seat, and not a flag where the style lies.
//     (In the code a globe is a `drum`, the Threshold is `porch`.)
//  5. Walking onto the style takes it up. X sets it down underfoot, or takes
//     it up again. One walker carries it at a time.
//  6. Bars never fall on an occupant; they only refuse entry.
//  7. The hour is won the instant the apprentice (not a shade) stands on the
//     Seat with the style. Shades are released at once; the unspent marks
//     are not run.
//  8. Sitting out (E) runs the remaining marks at once, so a shade is always
//     a full hour long and an eclipse hidden later in the hour is found now.
//     It was one key, so one unsaying takes the whole sitting-out back.
//  9. The court bears four shades. If the hour runs out with four already
//     standing, the hour is spent: nothing more can be pressed but undo.
// 10. A tall gnomon's shadow is the sweep of its foot along the sun's line
//     for that mark. A sun-eye is shaded when its centre lies in the sweep,
//     or when a walker or a globe is on it.
// ---------------------------------------------------------------------------
var HOUR = 40;            // marks in the hour
var MAX_SHADES = 4;       // shades the court will bear
var SUN_AX = 1.25, SUN_BY = 0.75, GNOMON_H = 3;
var DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
var TOKENS = 'UDLR.XE';

// Shadow offset, in flags, of a thing one flag tall at mark t (t may be fractional).
function sunVec(t) { return [SUN_AX * (2 * t / HOUR - 1), SUN_BY]; }

function gnomonCovers(px, py, ex, ey, t) {
  var v = sunVec(t), dx = v[0] * GNOMON_H, dy = v[1] * GNOMON_H;
  var qx = ex - px, qy = ey - py, lo = 0, hi = 1, a, b, m;
  if (Math.abs(dx) < 1e-9) { if (Math.abs(qx) > 0.5) return false; }
  else { a = (qx - 0.5) / dx; b = (qx + 0.5) / dx; if (a > b) { m = a; a = b; b = m; } if (a > lo) lo = a; if (b < hi) hi = b; }
  a = (qy - 0.5) / dy; b = (qy + 0.5) / dy; if (a > b) { m = a; a = b; b = m; }
  if (a > lo) lo = a; if (b < hi) hi = b;
  return lo <= hi - 1e-9;
}

function parseCourt(def) {
  var rows = def.map, h = rows.length, w = rows[0].length, x, y, ch, k;
  var L = { def: def, w: w, h: h, tiles: [], eyes: [], gates: [], gnomons: [], drums0: [], style0: null, start: null, seat: null, given: [], colours: 0 };
  for (y = 0; y < h; y++) {
    if (rows[y].length !== w) throw new Error('ragged court ' + def.id + ' row ' + y);
    for (x = 0; x < w; x++) {
      ch = rows[y][x]; k = { k: 'floor', c: -1 };
      if (ch === '#') k.k = 'wall';
      else if (ch === '=') k.k = 'marble';
      else if (ch === '^') { k.k = 'gnomon'; L.gnomons.push({ x: x, y: y }); }
      else if (ch === 'P') { k.k = 'porch'; L.start = { x: x, y: y }; }
      else if (ch === 'S') { k.k = 'seat'; L.seat = { x: x, y: y }; }
      else if (ch === 'i') L.style0 = { x: x, y: y };
      else if (ch === 'o') L.drums0.push({ x: x, y: y });
      else if (ch >= 'a' && ch <= 'd') { k.k = 'eye'; k.c = ch.charCodeAt(0) - 97; L.eyes.push({ x: x, y: y, c: k.c }); }
      else if (ch >= 'A' && ch <= 'D') { k.k = 'gate'; k.c = ch.charCodeAt(0) - 65; L.gates.push({ x: x, y: y, c: k.c }); }
      else if (ch !== '.') throw new Error('unknown flag "' + ch + '" in ' + def.id);
      if (k.c >= L.colours) L.colours = k.c + 1;
      L.tiles.push(k);
    }
  }
  // The almanac: for each sun-eye, the marks at which a gnomon's shadow covers it.
  L.sunShade = L.eyes.map(function (e) {
    var out = [], t, g, s;
    for (t = 0; t < HOUR; t++) {
      s = false;
      for (g = 0; g < L.gnomons.length; g++) if (gnomonCovers(L.gnomons[g].x, L.gnomons[g].y, e.x, e.y, t)) s = true;
      out.push(s);
    }
    return out;
  });
  // A shade that was here before you: its keys are written in the court, and
  // what came of each key is worked out alone, with the bars named in `open`
  // standing open all hour, as her own (now vanished) shades once held them.
  (def.given || []).forEach(function (g) {
    var inputs = g.inputs; while (inputs.length < HOUR) inputs += '.';
    var W = freshWorld(L, 1), outs = [], t, c, open, held = g.open || '';
    for (t = 0; t < HOUR; t++) {
      open = openColours(L, W);
      for (c = 0; c < held.length; c++) open[held.charCodeAt(c) - 65] = true;
      outs.push(act(L, W, 0, inputs[t], open).code); W.t++;
    }
    L.given.push({ inputs: inputs, outs: outs, given: true });
  });
  return L;
}

function tileAt(L, x, y) { return (x < 0 || y < 0 || x >= L.w || y >= L.h) ? null : L.tiles[y * L.w + x]; }
function solid(k) { return !k || k.k === 'wall' || k.k === 'marble' || k.k === 'gnomon'; }

function freshWorld(L, nWalkers) {
  var W = { t: 0, walkers: [], drums: [], style: L.style0 ? { x: L.style0.x, y: L.style0.y } : null, seated: false }, i;
  for (i = 0; i < nWalkers; i++) W.walkers.push({ x: L.start.x, y: L.start.y, carry: false, face: 'D', did: 'W' });
  for (i = 0; i < L.drums0.length; i++) W.drums.push({ x: L.drums0[i].x, y: L.drums0[i].y });
  return W;
}

function walkerAt(W, x, y, except) {
  for (var i = 0; i < W.walkers.length; i++) if (i !== except && W.walkers[i].x === x && W.walkers[i].y === y) return i;
  return -1;
}
function drumAt(W, x, y) {
  for (var i = 0; i < W.drums.length; i++) if (W.drums[i].x === x && W.drums[i].y === y) return i;
  return -1;
}

// Which eyes are shaded right now, and so which colours of bars stand open.
function eyeShaded(L, W, i) {
  var e = L.eyes[i];
  return (W.t < HOUR && L.sunShade[i][W.t]) || walkerAt(W, e.x, e.y, -1) >= 0 || drumAt(W, e.x, e.y) >= 0;
}
function openColours(L, W) {
  var open = [], i;
  for (i = 0; i < L.colours; i++) open.push(false);
  for (i = 0; i < L.eyes.length; i++) if (eyeShaded(L, W, i)) open[L.eyes[i].c] = true;
  return open;
}

// One walker spends one key. Mutates W; returns what came of it.
function act(L, W, i, tok, open) {
  var a = W.walkers[i], d, tx, ty, k, who, di, bx, by, k2, code;
  if (tok === '.') { a.did = 'W'; return { code: 'W', x: a.x, y: a.y }; }
  if (tok === 'X') {
    if (a.carry) { a.carry = false; W.style = { x: a.x, y: a.y }; a.did = 'D'; return { code: 'D', x: a.x, y: a.y }; }
    if (W.style && W.style.x === a.x && W.style.y === a.y) { a.carry = true; W.style = null; a.did = 'T'; return { code: 'T', x: a.x, y: a.y }; }
    a.did = 'N'; return { code: 'N', x: a.x, y: a.y };
  }
  d = DIRS[tok]; tx = a.x + d[0]; ty = a.y + d[1]; a.face = tok; k = tileAt(L, tx, ty);
  if (solid(k)) { a.did = 'B'; return { code: 'B', why: 'wall', x: tx, y: ty, dir: tok }; }
  if (k.k === 'gate' && !open[k.c]) { a.did = 'B'; return { code: 'B', why: 'bars', c: k.c, x: tx, y: ty, dir: tok }; }
  if (k.k !== 'porch') {
    who = walkerAt(W, tx, ty, i);
    if (who >= 0) { a.did = 'B'; return { code: 'B', why: 'walker', who: who, x: tx, y: ty, dir: tok }; }
  }
  di = drumAt(W, tx, ty); code = 'M';
  if (di >= 0) {
    bx = tx + d[0]; by = ty + d[1]; k2 = tileAt(L, bx, by);
    if (solid(k2) || (k2.k === 'gate' && !open[k2.c]) || k2.k === 'porch' || k2.k === 'seat' ||
        drumAt(W, bx, by) >= 0 || walkerAt(W, bx, by, -1) >= 0 || (W.style && W.style.x === bx && W.style.y === by)) {
      a.did = 'B'; return { code: 'B', why: 'drum', x: tx, y: ty, dir: tok };
    }
    W.drums[di].x = bx; W.drums[di].y = by; code = 'P';
  }
  a.x = tx; a.y = ty; a.did = code;
  if (W.style && W.style.x === tx && W.style.y === ty && !a.carry) { a.carry = true; W.style = null; code += '+'; }
  return { code: code, x: tx, y: ty, dir: tok };
}

function cloneWorld(W) {
  return {
    t: W.t, seated: W.seated, style: W.style ? { x: W.style.x, y: W.style.y } : null,
    walkers: W.walkers.map(function (a) { return { x: a.x, y: a.y, carry: a.carry, face: a.face, did: a.did }; }),
    drums: W.drums.map(function (d) { return { x: d.x, y: d.y }; })
  };
}

// The whole game. Returns everything a caller could want to know about the
// court after `log`, including (in .frames) the worlds the LAST key passed
// through, so the picture can be animated without the engine keeping time.
function simulate(L, log) {
  var recs = L.given.map(function (g) { return g; });
  var W = freshWorld(L, recs.length + 1);
  var cur = { inputs: '', outs: [] };
  var S = { status: 'play', halt: null, used: 0, frames: [], last: null, turned: false };
  var n, tok;

  function tick(tk) {
    var open = openColours(L, W), i, res, r;
    for (i = 0; i < recs.length; i++) {
      r = recs[i];
      res = act(L, W, i, r.inputs[W.t], open);
      if (res.code !== r.outs[W.t]) {
        S.status = 'eclipse';
        S.halt = { shade: i, mark: W.t, key: r.inputs[W.t], expected: r.outs[W.t], found: res, casting: recs.length };
        return;
      }
    }
    res = act(L, W, recs.length, tk, open);
    cur.inputs += tk; cur.outs.push(res.code); S.last = res;
    W.t++;
    var me = W.walkers[recs.length];
    if (me.carry && me.x === L.seat.x && me.y === L.seat.y) { S.status = 'won'; W.seated = true; }
  }
  function turn() {
    if (recs.length >= MAX_SHADES) { S.status = 'spent'; return; }
    recs.push({ inputs: cur.inputs, outs: cur.outs, given: false });
    cur = { inputs: '', outs: [] };
    W = freshWorld(L, recs.length + 1);
    S.turned = true;
  }

  for (n = 0; n < log.length; n++) {
    if (S.status !== 'play') break;          // keys after a halt are not history
    tok = log[n]; S.used = n + 1; S.frames = []; S.turned = false; S.last = null;
    if (tok === 'E') {
      do { tick('.'); S.frames.push({ W: cloneWorld(W), status: S.status }); } while (S.status === 'play' && W.t < HOUR);
    } else {
      tick(tok); S.frames.push({ W: cloneWorld(W), status: S.status });
    }
    if (S.status === 'play' && W.t >= HOUR) { turn(); S.frames.push({ W: cloneWorld(W), status: S.status, turn: true }); }
  }
  S.W = W; S.recs = recs; S.cur = cur;
  S.t = W.t;
  S.shades = recs.length;                       // shades standing in the court
  S.casting = recs.length - L.given.length + 1; // which casting of yours this is
  S.open = openColours(L, W);
  return S;
}

function stateKey(S) {
  return JSON.stringify([S.status, S.W, S.recs.map(function (r) { return r.inputs + '|' + r.outs.join(''); }), S.cur.inputs, S.cur.outs.join(''), S.halt]);
}
// @@ENGINE-END

// @@COURTS-BEGIN
// Four courts, 14 flags by 12. Map letters:
//   #  parapet        =  old marble (also masonry)     ^  tall gnomon
//   P  the Threshold  S  the Seat      i  the style     o  a stone globe
//   a b c d  sun-eyes (copper, lapis, jade, jet)   A B C D  the bars each keeps
// `solution` is the INTENDED SOLUTION, one string of keys per casting
// (U D L R step, . stand, X take up or set down, E sit out the hour).
// The proofs replay every one of them.
var COURTS = [
  // I. One eye, one set of bars, one body: so, two castings.
  //    Casting 1  RUUU E         walk onto the copper eye at D6 and sit the hour out.
  //    Casting 2  UUUU RRRR R    up the west side and through the copper bars at H5
  //               RRR DDD        (the shade is on the eye from mark 5), take the style at K8,
  //               UUUUU          and carry it up to the Seat at K3.
  {
    id: 'small', numeral: 'I', name: 'The Apprentices’ Dial',
    map: [
      '##############',
      '#......#.....#',
      '#..^...#..S..#',
      '#......#.....#',
      '#......A.....#',
      '#..a...#.....#',
      '#......#.=...#',
      '#......#..i..#',
      '#.P....#.....#',
      '#......#.....#',
      '#......#.....#',
      '##############'
    ],
    solution: ['RUUUE', 'UUUURRRRRRRRDDDUUUUU']
  },
  // II. Two eyes, each in a pocket a globe cannot leave; one globe, plugging the door.
  //    Casting 1  D RRRR U       shove the globe out of the doorway (two rolls) and step round it,
  //               RRRRRR DDD E   then stand in the lapis pocket at M10 for the rest of the hour.
  //    Casting 2  . D RRRRR      wait a mark (the shade has the first flag), follow it through
  //               U R DD         the door, roll the globe the shade left at H8 east, then south
  //               UUU L UUU      twice into the copper pocket at I10; through the copper bars
  //               DDD RRRR UUU   for the style at H3, back out, and through the lapis bars to L3.
  {
    id: 'drums', numeral: 'II', name: 'The Court of Globes',
    map: [
      '##############',
      '#....#...#...#',
      '#....#.i.#.S.#',
      '#....#...#...#',
      '#....##A###B##',
      '#....#.......#',
      '#.P..#.......#',
      '#....o.......#',
      '#....#.......#',
      '#....#.#a#.#b#',
      '#....#.###.###',
      '##############'
    ],
    solution: ['DRRRRURRRRRRDDDE', '.DRRRRRURDDUUULUUUDDDRRRRUUU']
  },
  // III. The lapis eye (C6) is walled in; only the gnomon's shadow shades it, marks 1 to 8.
  //    The style lies in the lane, so whoever enters carries it, and the copper eye
  //    is two flags short of its own bars: the one who went in cannot come out.
  //    Casting 1  LLL UUU R      run: through the lapis bars at C8 on the seventh key;
  //               RRRRRR X L E   take the style in passing, set it down at I8, step back
  //                              onto the copper eye at H8 and sit the hour out.
  //    Casting 2  RRRRRRR UUU L  round the outside to K8, wait four marks for the
  //               .... LL RRR    copper bars, step in for the style at I8 and out again,
  //               UUUUU LLLLLLLL then north and west to the Seat at D3.
  {
    id: 'meridian', numeral: 'III', name: 'The Meridian Lane',
    map: [
      '##############',
      '#............#',
      '#..S.........#',
      '#............#',
      '#.#.^........#',
      '##b#.........#',
      '###########..#',
      '#.Bi...a.A...#',
      '#.#########..#',
      '#............#',
      '#...P........#',
      '##############'
    ],
    solution: ['LLLUUURRRRRRRXLE', 'RRRRRRRUUUL....LLRRRUUUUULLLLLLLL']
  },
  // IV. The Astronomer's fourth shade is already in the court (`given`). Her keys:
  //    she rolls the globe onto the lapis eye (E11), takes the style at I11, walks
  //    through the copper bars at K8 on mark 16 (one of her lost shades held them:

  if (x >= G.bx && x <= G.bx + 14 * G.S && y >= G.by - G.lift && y <= G.by + 12 * G.S) game.swipe = { x: x, y: y, id: e.pointerId };
}
function onUp(e) {
  var sw = game.swipe, r, x, y, dx, dy, me, tx, ty;
  if (!sw || sw.id !== e.pointerId) return;
  game.swipe = null; if (game.mode !== 'play') return;
  r = cv.getBoundingClientRect(); x = e.clientX - r.left; y = e.clientY - r.top; dx = x - sw.x; dy = y - sw.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > Math.max(14, G.S * 0.45)) { doAction(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U')); return; }
  // a tap on a flag in line with you is a step toward it; a tap on yourself is a mark stood
  me = game.S.W.walkers[game.S.W.walkers.length - 1]; tx = Math.floor((x - G.bx) / G.S); ty = Math.floor((y - G.by) / G.S);
  if (tx === me.x && ty === me.y) doAction('stand');
  else if (tx === me.x) doAction(ty < me.y ? 'U' : 'D');
  else if (ty === me.y) doAction(tx < me.x ? 'L' : 'R');
}

// ---- the loop ----------------------------------------------------------------
function animIdle(now) { var an = game.anim; return !an.queue.length && (an.dur <= 0 || now - an.t0 >= an.dur); }
function frame(now) {
  var c = cx, v, tf, T, S = game.S;
  game.now = now;
  c.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  if (game.mode === 'title') drawTitle(now);
  else if (game.mode === 'ending') drawEnding(now);
  else {
    if (game.keys.length) {      // keys wait their turn, in order; a waiting key hurries the picture along
      if (game.anim.queue.length > 1 || game.keys.length > 2) settle(); else if (game.anim.dur > 60) game.anim.dur = 60;
      if (animIdle(now)) doAction(game.keys.shift());
    }
    S = game.S;
    c.drawImage(bgCv, 0, 0, G.vw, G.vh);
    v = view(now); tf = drawCourt(now, v); drawScale(now, tf); drawPage(now, tf);
    T = TEXT.courts[game.L.def.id];
    if (game.mode === 'intro') drawSheet(now, game.L.def.numeral, game.L.def.name, T.intro, game.touch ? TEXT.turnPageTouch : TEXT.turnPage);
    else if (game.mode === 'wonCard') drawSheet(now, game.L.def.numeral, game.L.def.name, T.won.concat([wonEntry(game.L, S)]), game.touch ? TEXT.turnPageTouch : TEXT.turnPage);
    else if (S.status === 'won' && animIdle(now) && now - game.anim.wonAt > 1700) { game.keys = []; setMode(game.ci < COURTS.length - 1 ? 'wonCard' : 'ending'); }
  }
  if (game.proofs) drawProofs(now);
  window.requestAnimationFrame(frame);
}
function drawProofs(now) {
  var pr = game.proofs, lines = pr.items.map(function (it) { return (it.ok ? 'Proved. ' : 'Not proved. ') + it.text; });
  lines.unshift(pr.all ? 'Every proof holds: ' + pr.items.length + ' of ' + pr.items.length + '.' : 'A proof has failed. Read down.');
  var keep = game.modeAt; drawSheetSmall(now, 'Proofs', lines, game.touch ? 'Touch the page to shut the proofs.' : 'Any key shuts the proofs.', !pr.all);
  game.modeAt = keep;
}
function drawSheetSmall(now, title, paras, foot, bad) {
  var c = cx, w = Math.min(640, G.vw - 20), fs = clamp(Math.min(G.vw / 40, G.vh / 38), 10.5, 15), pad, h, y, i, tw, tries = 0;
  while (tries++ < 16) {
    pad = fs * 1.5; tw = w - pad * 2; c.font = fnt(fs); h = pad + fs * 2.6;
    for (i = 0; i < paras.length; i++) h = para(c, paras[i], 0, h, tw, fs * 1.34, true) + fs * 0.3;
    h += fs * 1.4 + pad * 0.5; if (h <= G.vh - 16 || fs < 8.2) break; fs *= 0.93;
  }
  var sx = Math.round((G.vw - w) / 2), sy = Math.round((G.vh - h) / 2);
  c.fillStyle = rgba(P.shadow, 0.4); c.fillRect(0, 0, G.vw, G.vh); paperSheet(c, sx, sy, w, h);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic'; y = sy + pad + fs * 1.3;
  c.fillStyle = P.rubric; c.font = fnt(fs * 1.5, 'italic'); c.fillText(title, sx + pad, y); y += fs * 1.9; c.font = fnt(fs);
  for (i = 0; i < paras.length; i++) { c.fillStyle = (i === 0 ? (bad ? P.rubric : P.ink) : paras[i].indexOf('Not proved') === 0 ? P.rubric : P.ink); y = para(c, paras[i], sx + pad, y, tw, fs * 1.34) + fs * 0.3; }
  c.fillStyle = P.inkSoft; c.font = fnt(fs * 0.9, 'italic'); c.textAlign = 'right'; c.fillText(foot, sx + w - pad, sy + h - pad * 0.6);
}

function boot() {
  cv = document.getElementById('court'); cx = cv.getContext('2d');
  loadStore();
  try { game.touch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); } catch (e) { game.touch = false; }
  layout();
  window.addEventListener('resize', layout); window.addEventListener('orientationchange', layout);
  window.addEventListener('keydown', onKey);
  cv.addEventListener('pointerdown', onDown); window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', function () { game.swipe = null; });
  if (/proofs/.test(window.location.hash)) game.proofs = runProofs();
  window.__untold = { game: game, simulate: simulate, parseCourt: parseCourt, COURTS: COURTS, runProofs: runProofs, press: press, openCourt: openCourt, setMode: setMode, stateKey: stateKey, eclipseEntry: eclipseEntry, layout: layout, G: G };
  window.requestAnimationFrame(function (t) { game.now = t; game.modeAt = t; frame(t); });
}
boot();

})();
</script>
