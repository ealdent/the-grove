const SFX = {
  step() { tone(96, 0.12, 'sine', 0.22, 0, 62); noise(0.05, 'lowpass', 900, 1, 0.05); },
  hop() { noise(0.05, 'bandpass', 1500, 6, 0.12); tone(420, 0.05, 'triangle', 0.05); },
  bump() { tone(70, 0.14, 'sine', 0.28, 0, 50); noise(0.07, 'lowpass', 400, 1, 0.1); },
  push() { noise(0.3, 'bandpass', 380, 2, 0.22, 0, 180); tone(55, 0.25, 'sine', 0.12); },
  sink() { noise(0.4, 'lowpass', 1400, 1, 0.22, 0, 200); for (let k = 0; k < 5; k++) tone(300 + k * 90, 0.06, 'sine', 0.06, 0.08 + k * 0.05, 600 + k * 120); },
  door(open) { tone(open ? 140 : 90, 0.25, 'triangle', 0.16, 0, open ? 190 : 60); noise(0.25, 'bandpass', open ? 700 : 300, 3, 0.12, 0.02, open ? 1100 : 200); },
  pan() { [612, 1337, 2241].forEach((f, i) => tone(f, 0.9 - i * 0.2, 'sine', 0.07 / (i + 1))); },
  take() { harp(SCALE[5], 0, 0.35); harp(SCALE[7], 0.08, 0.25); },
  set() { harp(SCALE[3], 0, 0.3); },
  grasp() { harp(SCALE[1], 0, 0.15); },
  sistrum(when) { for (let k = 0; k < 7; k++) noise(0.07, 'bandpass', 4200 + (k % 3) * 900, 8, 0.1, (when || 0) + k * 0.075); },
  turn() { SFX.sistrum(0); [7, 5, 3, 1].forEach((n, i) => harp(SCALE[n], 0.15 + i * 0.12, 0.22)); },
  lie() { tone(41, 2.2, 'sawtooth', 0.18, 0, 33); tone(43.5, 2.2, 'sawtooth', 0.14, 0, 34); noise(1.8, 'highpass', 2500, 0.7, 0.12, 0.25, 6000); },
  won() { [0, 2, 3, 5, 6, 8].forEach((n, i) => harp(SCALE[n], i * 0.11, 0.3)); SFX.sistrum(0.7); },
  undo() { noise(0.12, 'bandpass', 2400, 1.5, 0.08, 0, 900); },
  page() { noise(0.18, 'bandpass', 1800, 1, 0.06, 0, 700); },
  refuse() { tone(160, 0.08, 'square', 0.03); },
};
function sfx(name, arg) { if (!AU.ctx || AU.muted) return; try { SFX[name](arg); } catch (e) { /* sound is a courtesy */ } }

/* =====================================================================
   THE KEEPER OF THE RECORD  (game flow, input, hints; no drawing here)
   ===================================================================== */

const GAME = {
  screen: 'title', li: 0, L: null, style: null,
  log: [], states: [],
  view: { from: null, to: null, k: 1, t0: 0, dur: 0.16 },
  R: { panAnim: [], doorAnim: [], gateOpen: 0, lieK: 0, lightX: 0 },
  lay: null, caches: {}, dpr: 1, cw: 0, ch: 0,
  msg: { text: '', t0: 0 }, seen: new Set(), queue: [],
  turnAnim: null, lieT0: 0, wonT0: 0, restartArmed: -10,
  progress: { unlocked: 0, done: false }, buttons: [], hover: null, pointer: null,
  ending: { stage: 0, t0: 0 }, self: null, time: 0, titleT0: 0, toast: null,
};

// A hand on glass or keys under fingers: the words change to suit (keys win once pressed).
GAME.touch = (() => { try { return matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches; } catch (e) { return false; } })();
function txt(key) { return GAME.touch && TXT.touch[key] != null ? TXT.touch[key] : TXT[key] != null ? TXT[key] : TXT.hints[key]; }
function hintText(key) { return GAME.touch && TXT.touch[key] != null ? TXT.touch[key] : TXT.hints[key]; }
function keyName(k) { return GAME.touch ? '' : k; }

const STORE_KEY = 'trueOfVoice.v1';
function loadProgress() {
  try {
    const j = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    GAME.progress.unlocked = clamp(j.unlocked | 0, 0, LEVELS.length - 1);
    GAME.progress.done = !!j.done;
    if (j.muted) auMute(true);
  } catch (e) { /* a private window keeps no record; that is allowed */ }
}
function saveProgress() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ unlocked: GAME.progress.unlocked, done: GAME.progress.done, muted: AU.muted })); } catch (e) { /* nothing to do */ }
}

function top() { return GAME.states[GAME.states.length - 1]; }

// Coming back from the title to the hour you left keeps your record of it.
function openHour(i) {
  if (GAME.L && GAME.li === i && GAME.states.length && top().status !== 'won') { GAME.screen = 'play'; relayout(); sfx('page'); return; }
  enterHour(i);
}
function enterHour(i) {
  GAME.li = i;
  GAME.L = parseLevel(LEVELS[i]);
  GAME.style = STYLES[LEVELS[i].paint];
  GAME.log = [];
  GAME.states = [initialState(GAME.L)];
  GAME.view = { from: null, to: top(), k: 1, t0: 0, dur: 0.16 };
  GAME.R.panAnim = []; GAME.R.doorAnim = []; GAME.R.gateOpen = 0; GAME.R.lieK = 0;
  GAME.turnAnim = null; GAME.queue = [];
  GAME.caches.board = null; GAME.caches.wall = null;
  GAME.msg = { text: '', t0: GAME.time };
  GAME.screen = 'card';
  GAME.cardT0 = GAME.time;
  relayout();
}

function say(text) { if (GAME.msg.text !== text) GAME.msg = { text, t0: GAME.time }; }
function hint(key, text, always) {
  if (!always && GAME.seen.has(key)) return false;
  GAME.seen.add(key);
  say(text || hintText(key));
  return true;
}
function toast(text) { GAME.toast = { text, t0: GAME.time }; }

/* ---------- applying the record ---------- */
function play(tok, repeat) {
  if (GAME.screen !== 'play') return;
  // While a stroke is still being drawn, deliberate presses wait their turn in
  // order; a held key's repeats are taken only when nothing is waiting, so
  // letting go never leaves Hori walking on.
  if (GAME.turnAnim || GAME.view.k < 0.6 || GAME.queue.length) {
    if (!repeat && GAME.queue.length < 6 && top().status === 'play') GAME.queue.push(tok);
    return;
  }
  commit(tok);
}
function commit(tok) {
  const s = top();
  const n = step(GAME.L, s, tok);
  if (!n) {
    if (tok === 'E' && s.status === 'play' && s.stroke === 0) hint('nothing-yet', null, true);
    else if (tok === 'E' && s.status === 'play') hint('no-clay', null, true);
    sfx('refuse');
    return;
  }
  GAME.log.push(tok);
  GAME.states.push(n);
  if (n.turning !== s.turning) {
    GAME.turnAnim = { t0: GAME.time, from: s, to: n };
    GAME.view = { from: n, to: n, k: 1, t0: GAME.time, dur: 0.16 };
    GAME.R.doorAnim = []; GAME.R.panAnim = [];
  } else {
    GAME.view = { from: s, to: n, k: 0, t0: GAME.time, dur: 0.17 / (1 + GAME.queue.length * 0.8) };
  }
  sounds(s, n);
  afterStroke(s, n, tok);
}

function sounds(s, n) {
  const live = n.recs.length;
  const ev = n.events.map(e => e.k);
  if (ev.includes('lie')) { sfx('lie'); return; }
  if (ev.includes('turn')) { sfx('turn'); return; }
  if (ev.includes('spent')) { sfx('bump'); return; }
  const o = n.outs[live];
  if (o) {
    if (o.k === 'walk') sfx('step');
    else if (o.k === 'bump') sfx('bump');
    else if (o.k === 'push') sfx(o.sink ? 'sink' : 'push');
    else if (o.k === 'take') sfx('take');
    else if (o.k === 'set') sfx('set');
    else if (o.k === 'grasp') sfx('grasp');
  }
  for (let b = 0; b < live; b++) { const a = n.outs[b]; if (a && (a.k === 'walk' || a.k === 'push')) { sfx('hop'); if (a.k === 'push') sfx(a.sink ? 'sink' : 'push'); break; } }
  for (const e of n.events) if (e.k === 'door-open' || e.k === 'door-close') { sfx('door', e.k === 'door-open'); break; }
  if (n.panW.some((w, k) => w && !s.panW[k])) sfx('pan');
  if (ev.includes('won')) sfx('won');
}

function afterStroke(s, n, tok) {
  const L = GAME.L, id = L.def.id, live = n.recs.length;
  const item = ITEM[L.def.item];
  if (n.status === 'lie') { GAME.lieT0 = GAME.time; GAME.R.lieK = 0; return; }
  if (n.status === 'spent') { GAME.lieT0 = GAME.time; return; }
  if (n.status === 'won') {
    GAME.wonT0 = GAME.time;
    // the hour is passed the moment the gate opens, whether or not the papyrus is read
    if (GAME.li + 1 < LEVELS.length) GAME.progress.unlocked = Math.max(GAME.progress.unlocked, GAME.li + 1);
    else GAME.progress.done = true;
    saveProgress();
    return;
  }
  if (n.turning !== s.turning) {
    if (!hint('turned-1')) hint('turned');
    return;
  }
  const o = n.outs[live];
  const here = n.pos[live];
  if (n.stroke === 1) {
    if (id === 'I') hint('start-I');
    if (id === 'IV') hint('weight');
    if (id === 'VII') hint('pool');
    if (id === 'XII') hint('tamit-1');
  }
  if (L.panAt[here] >= 0 && n.panW[L.panAt[here]]) {
    if (L.pans[L.panAt[here]].sign === 'a') hint('ankh'); else hint('pan');
  }
  if (o && o.k === 'bump' && o.by === 'door' && GAME.seen.has('pan')) hint('door-fell');
  if (o && o.k === 'bump' && o.by === 'body' && o.who < live) {
    const theirs = n.outs[o.who];
    if (theirs && (theirs.k === 'walk' || theirs.k === 'push') && theirs.to === o.at) hint('same-square');
  }
  if (n.itemBy < 0 && n.itemPos === here && o && o.k === 'walk') hint('item-here-' + id, hintText('item-here').replace('{item}', item.noun));
  if (o && o.k === 'take') hint('item-taken-' + id, TXT.hints['item-taken']);
  if (o && o.k === 'set') hint('item-set', TXT.hints['item-set']);
  if (here === L.gate && n.itemBy !== live) hint('gate-' + id, TXT.hints['gate-empty'].replace('{keeper}', cap(TXT.hours[id].gate)));
  if (id === 'XII' && n.stroke === 22) hint('tamit-2');
  if (n.stroke >= 36 && n.turning === 1 && n.recs.length === L.history.length) hint('late');
}

function undo() {
  if (GAME.screen !== 'play' || GAME.log.length === 0) return;
  GAME.queue = [];
  const was = top();
  GAME.log.pop(); GAME.states.pop();
  GAME.turnAnim = null;
  GAME.view = { from: top(), to: top(), k: 1, t0: GAME.time, dur: 0.16 };
  GAME.R.lieK = 0;
  if (was.turning !== top().turning) { GAME.R.doorAnim = []; GAME.R.panAnim = []; }
  sfx('undo');
  if (was.status === 'lie') hint('lie-1');
}
// Wipe back to the start of this turning; at its start already, unwrite the last answerer too.
function unwriteTurning() {
  if (GAME.screen !== 'play' || GAME.log.length === 0) return;
  GAME.queue = [];
  const cur = top();
  const target = cur.stroke === 0 && cur.status === 'play' && cur.turning > 1 ? cur.turning - 1 : cur.turning;
  let k = 0;
  while (k < GAME.states.length && GAME.states[k].turning !== target) k++;
  GAME.log.length = k; GAME.states.length = k + 1;
  GAME.turnAnim = null;
  GAME.view = { from: top(), to: top(), k: 1, t0: GAME.time, dur: 0.16 };
  GAME.R.lieK = 0; GAME.R.doorAnim = []; GAME.R.panAnim = [];
  sfx('page');
  if (cur.status === 'lie') hint('lie-1');
}
function restartHour() {
  if (GAME.screen !== 'play') return;
  if (GAME.time - GAME.restartArmed > 2.5) { GAME.restartArmed = GAME.time; toast(txt('restartConfirm')); return; }
  GAME.restartArmed = -10;
  GAME.queue = [];
  GAME.log = []; GAME.states = [initialState(GAME.L)];
  GAME.turnAnim = null;
  GAME.view = { from: top(), to: top(), k: 1, t0: GAME.time, dur: 0.16 };
  GAME.R.lieK = 0; GAME.R.doorAnim = []; GAME.R.panAnim = []; GAME.R.gateOpen = 0;
  sfx('page');
}

function nextFromPassed() {
  const i = GAME.li;
  if (i + 1 < LEVELS.length) {
    GAME.progress.unlocked = Math.max(GAME.progress.unlocked, i + 1);
    saveProgress();
    enterHour(i + 1);
  } else {
    GAME.progress.done = true; saveProgress();
    GAME.screen = 'ending'; GAME.ending = { stage: 0, t0: GAME.time };
    relayout();
  }
}

// Where Enter on the title leads: the hour you were in, or the furthest you reached;
// once the night is done, a new night from the first hour.
function titleHour() {
  if (GAME.L && GAME.states.length && top().status !== 'won') return GAME.li;
  return GAME.progress.done ? 0 : GAME.progress.unlocked;
}

function toggleMute() { auMute(!AU.muted); saveProgress(); toast(AU.muted ? TXT.muted : TXT.unmuted); }

function runSelfTest() {
  GAME.screen = 'selftest';
  GAME.self = null;
  GAME.selfT0 = GAME.time;
  // give the page one frame to say what it is doing, then read
  setTimeout(() => {
    try { GAME.self = selfTest(); } catch (e) { GAME.self = { results: [{ hour: 'rule', key: 'solution', ok: false, detail: String(e) }], failed: 1, ms: 0 }; }
    window.__trueOfVoice.selfTestResult = GAME.self;
    console.info('[True of Voice] self-test: ' + (GAME.self.failed ? GAME.self.failed + ' failed' : 'all passed') + ' (' + GAME.self.ms + ' ms)');
    for (const r of GAME.self.results) console.info((r.ok ? 'PASS ' : 'FAIL ') + r.hour + ' ' + r.key + (r.detail ? ' — ' + r.detail : ''));
  }, 30);
}

/* ---------- keys ---------- */
const MOVE_KEYS = { ArrowUp: 'U', KeyW: 'U', ArrowDown: 'D', KeyS: 'D', ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R' };

function onKey(e) {
  auInit();
  GAME.touch = false;
  const k = e.code, sc = GAME.screen;
  if (k === 'KeyM') { toggleMute(); e.preventDefault(); return; }
  if (sc === 'title') {
    if (k === 'Enter' || k === 'Space') openHour(titleHour());
    else if (k === 'KeyN') enterHour(0);
    else if (k === 'KeyT') runSelfTest();
    else if (/^Digit[1-4]$/.test(k)) { const i = +k.slice(5) - 1; if (i <= GAME.progress.unlocked || GAME.progress.done) openHour(i); }
    e.preventDefault(); return;
  }
  if (sc === 'selftest') { if (k === 'Enter' || k === 'Escape' || k === 'Space') GAME.screen = 'title'; e.preventDefault(); return; }
  if (sc === 'card') { if (k === 'Enter' || k === 'Space') { GAME.screen = 'play'; sfx('page'); } else if (k === 'Escape') GAME.screen = 'title'; e.preventDefault(); return; }
  if (sc === 'ending') { if (k === 'Enter' || k === 'Space') advanceEnding(); else if (k === 'Escape') GAME.screen = 'title'; e.preventDefault(); return; }
  if (sc !== 'play') return;
  const s = top();
  if (k === 'Escape') { GAME.screen = 'title'; GAME.titleT0 = GAME.time; e.preventDefault(); return; }
  if (s.status === 'won') { if ((k === 'Enter' || k === 'Space') && GAME.time - GAME.wonT0 > 1.2) nextFromPassed(); e.preventDefault(); return; }
  if (k === 'KeyZ' || k === 'Backspace') { undo(); e.preventDefault(); return; }
  if (k === 'KeyX') { if (!e.repeat) unwriteTurning(); e.preventDefault(); return; }
  if (k === 'KeyR') { if (!e.repeat) restartHour(); e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { play(MOVE_KEYS[k], e.repeat); e.preventDefault(); return; }
  if (k === 'Space' || k === 'Period') { play('W', e.repeat); e.preventDefault(); return; }
  if (e.repeat) { e.preventDefault(); return; }
  if (k === 'KeyE') { play('A'); e.preventDefault(); return; }
  if (k === 'Enter' || k === 'NumpadEnter') { play('E'); e.preventDefault(); return; }
}

function advanceEnding() {
  const n = TXT.ending.length;
  if (GAME.time - GAME.ending.t0 < 0.6) return;
  sfx('page');
  if (GAME.ending.stage < n - 1) { GAME.ending.stage++; GAME.ending.t0 = GAME.time; if (GAME.ending.stage === 1) sfx('won'); }
  else { GAME.screen = 'title'; GAME.titleT0 = GAME.time; }
}

/* ---------- pointer: tablets, tap a square, swipe the floor ---------- */
// Tablets drawn later lie on top, so the hit test runs from the last drawn down;
// a sheet of Thoth's words swallows any touch that is not on one of its own tablets.
function hitButton(x, y) {
  for (let k = GAME.buttons.length - 1; k >= 0; k--) {
    const b = GAME.buttons[k];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.disabled ? null : b;
  }
  return null;
}
function onAnyButton(x, y) { return GAME.buttons.some(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h); }
function onPointerDown(e) {
  auInit();
  if (e.pointerType === 'touch' || e.pointerType === 'pen') GAME.touch = true;
  const x = e.clientX, y = e.clientY;
  GAME.pointer = { x, y, t: GAME.time, id: e.pointerId };
}
function onPointerMove(e) {
  const b = hitButton(e.clientX, e.clientY);
  GAME.hover = b ? b.id : null;
}
function onPointerUp(e) {
  const p = GAME.pointer; GAME.pointer = null;
  if (!p) return;
  const x = e.clientX, y = e.clientY;
  const dx = x - p.x, dy = y - p.y;
  const b = hitButton(x, y);
  const sc = GAME.screen;
  if (b && Math.hypot(dx, dy) < 12) { b.act(); return; }
  if (sc === 'title') { if (Math.hypot(dx, dy) < 12 && !onAnyButton(x, y)) openHour(titleHour()); return; }
  if (sc === 'card') { GAME.screen = 'play'; sfx('page'); return; }
  if (sc === 'selftest') { GAME.screen = 'title'; return; }
  if (sc === 'ending') { advanceEnding(); return; }
  if (sc !== 'play') return;
  const s = top();
  if (s.status === 'won') { if (GAME.time - GAME.wonT0 > 1.2) nextFromPassed(); return; }
  const lay = GAME.lay, B = lay.board;
  const onBoard = p.x >= B.x && p.x <= B.x + B.w && p.y >= B.y - B.tile && p.y <= B.y + B.h;
  if (!onBoard) return;
  if (Math.hypot(dx, dy) >= 24) { // a swipe walks
    play(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    return;
  }
  // a tap steps toward the square touched; a tap on yourself stands a stroke
  const L = GAME.L, live = s.recs.length;
  const [hx, hy] = tileXY(L, s.pos[live]);
  const tx = Math.floor((x - B.x) / B.tile), ty = Math.floor((y - B.y) / B.tile);
  const ddx = tx - hx, ddy = ty - hy;
  if (ddx === 0 && ddy === 0) { play('W'); return; }
  play(Math.abs(ddx) >= Math.abs(ddy) ? (ddx > 0 ? 'R' : 'L') : (ddy > 0 ? 'D' : 'U'));
}

/* ---------- per-frame upkeep ---------- */
function update(dt) {
  GAME.time += dt;
  const v = GAME.view;
  if (v.k < 1) v.k = clamp((GAME.time - v.t0) / v.dur, 0, 1);
  if (GAME.turnAnim && GAME.time - GAME.turnAnim.t0 > 1.05) GAME.turnAnim = null;
  if (GAME.screen === 'play' && !GAME.turnAnim && v.k >= 0.6 && GAME.queue.length) {
    if (top().status === 'play') commit(GAME.queue.shift()); else GAME.queue = [];
  }
  const s = GAME.states.length ? top() : null;
  if (s && s.status === 'lie') GAME.R.lieK = clamp((GAME.time - GAME.lieT0) / 1.4, 0, 1);
  GAME.R.gateOpen = s && s.status === 'won' ? clamp((GAME.time - GAME.wonT0) / 0.9, 0, 1) : Math.max(0, GAME.R.gateOpen - dt * 2);
}

/* =====================================================================
   SCREENS  (title, hour cards, the hour itself, lies, the ending)
   ===================================================================== */

function relayout() {
  GAME.lay = computeLayout(GAME.cw, GAME.ch, GAME.L);
  GAME.caches.board = null; GAME.caches.wall = null; GAME.caches.title = null;
}

const MOTES = [];
function motes(lay, dt, t) {
  const B = lay.board;
  while (MOTES.length < 46) MOTES.push({ x: Math.random(), y: Math.random(), v: 0.004 + Math.random() * 0.01, ph: Math.random() * 6, r: 0.6 + Math.random() * 1.4 });
  for (const m of MOTES) { m.y -= m.v * dt * 0.6; m.x += Math.sin(t * 0.4 + m.ph) * 0.0006; if (m.y < -0.05) { m.y = 1.05; m.x = Math.random(); } }
}
function drawMotes(g, lay, t) {
  const B = lay.board, lx = lay._barqueX || B.x;
  for (const m of MOTES) {
    const x = B.x + m.x * B.w, y = B.y - B.tile * 0.5 + m.y * (B.h + B.tile * 0.5);
    const near = 1 - clamp(Math.abs(x - lx) / (B.w * 0.6), 0, 1);
    const a = 0.12 + 0.55 * near * (0.6 + 0.4 * Math.sin(t * 1.7 + m.ph));
    g.fillStyle = 'rgba(255,236,190,' + a.toFixed(3) + ')';
    g.fillRect(x, y, m.r, m.r);
  }
}

function drawLight(g, lay, t, dark) {
  const B = lay.board, T = B.tile;
  const lx = lay._barqueX || B.x, ly = B.y - T * 1.6;
  const flick = 1 + Math.sin(t * 7.3) * 0.015 + Math.sin(t * 12.9) * 0.01;
  g.save();
  g.beginPath(); g.rect(B.x - T * 0.3, B.y - T * 1.0, B.w + T * 0.6, B.h + T * 1.3); g.clip();
  g.globalCompositeOperation = 'multiply';
  const gr = g.createRadialGradient(lx, ly, T * 1.5, lx, ly, B.w * 1.15 * flick);
  gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(0.5, '#F3E7D1'); gr.addColorStop(1, '#B89C74');
  g.fillStyle = gr; g.fillRect(B.x - T, B.y - T * 1.2, B.w + T * 2, B.h + T * 2.5);
  if (dark > 0) { g.fillStyle = rgba('#5A3A28', 0.55 * dark); g.fillRect(B.x - T, B.y - T * 1.2, B.w + T * 2, B.h + T * 2.5); }
  g.globalCompositeOperation = 'screen';
  const gr2 = g.createRadialGradient(lx, B.y, 0, lx, B.y, B.w * 0.5 * flick);
  gr2.addColorStop(0, 'rgba(255,196,110,' + (0.2 * (1 - dark * 0.7)).toFixed(3) + ')'); gr2.addColorStop(1, 'rgba(255,196,110,0)');
  g.fillStyle = gr2; g.fillRect(B.x - T, B.y - T * 1.2, B.w + T * 2, B.h + T * 2.5);
  g.restore();
}

// Apep's coils pass beneath the hour; in a lie he rises through it.
function drawUnderApep(g, lay, t, lieK, target) {
  const B = lay.board, T = B.tile;
  const pts = [];
  const y0 = B.y + B.h + T * 0.18;
  for (let x = B.x - T * 0.55; x <= B.x + B.w + T * 0.55; x += T * 0.45) pts.push(x, y0 + Math.sin(x * 0.018 + t * 0.45) * T * 0.22);
  drawSerpent(g, pts, T * 0.34, t);
}
// In a lie the serpent rises out from under the hour and strikes at the square
// where the record broke, coming to rest beside it, on the side away from the
// answerer that lied, so neither is hidden.
function drawRisingApep(g, lay, t, k, target, liar) {
  if (k <= 0) return;
  const B = lay.board, T = B.tile;
  const e = easeOut(k);
  let dx = target[0] - liar[0], dy = target[1] - liar[1];
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) { dx = 0; dy = 1; }
  const len = Math.hypot(dx, dy); dx /= len; dy /= len;
  let px = -dy, py = dx;
  if (px * (B.x + B.w / 2 - target[0]) + py * (B.y + B.h / 2 - target[1]) < 0) { px = -px; py = -py; }
  const ex = clamp(target[0] + px * T * 1.3, B.x + T * 0.5, B.x + B.w - T * 0.5);
  const ey = clamp(target[1] + py * T * 1.3 + T * 0.25, B.y + T * 0.5, B.y + B.h - T * 0.2);
  const sx = ex + (ex < B.x + B.w / 2 ? -T * 1.5 : T * 1.5), sy = B.y + B.h + T * 1.2;
  const hx = lerp(sx, ex, e), hy = lerp(sy, ey, e);
  const pts = [];
  for (let i = 0; i <= 14; i++) {
    const u = i / 14;
    pts.push(lerp(sx, hx, u) + Math.sin(u * 7 + t * 2) * T * 0.35 * (1 - u), lerp(sy + T, hy, u) + Math.sin(u * 5 + t * 1.5) * T * 0.25 * (1 - u));
  }
  g.save(); g.globalAlpha = clamp(k * 1.6, 0, 1);
  drawSerpent(g, pts, T * 0.5, t);
  drawSerpentHead(g, hx, hy, T * 1.1, Math.atan2(target[1] - hy, target[0] - hx), clamp(k * 1.3, 0, 1));
  g.restore();
}

/* ---------------- the hour itself ---------------- */
function renderPlay(g, t, dt) {
  const lay = GAME.lay, L = GAME.L, st = top(), style = GAME.style, paint = L.def.paint;
  const B = lay.board, T = B.tile, R = GAME.R, dpr = GAME.dpr;
  lay._stroke = st.stroke;
  if (!GAME.caches.wall) GAME.caches.wall = paintWall(GAME.cw, GAME.ch, 31 + GAME.li, paint, dpr);
  g.drawImage(GAME.caches.wall, 0, 0, GAME.cw, GAME.ch);
  drawBand(g, lay, st, GAME.view, t);
  drawUnderApep(g, lay, t, R.lieK);
  drawBoardFrame(g, lay, style, paint);
  if (!GAME.caches.board) GAME.caches.board = paintBoardCache(L, style, T, 100 + GAME.li * 7, dpr);
  g.drawImage(GAME.caches.board, B.x, B.y, B.w, B.h);
  R.tile = T; R.bx = B.x; R.by = B.y; R.bw = B.w; R.style = style; R.lightX = lay._barqueX;
  if (GAME.turnAnim) {
    const ta = GAME.turnAnim, p = clamp((GAME.time - ta.t0) / 0.75, 0, 1);
    const sx = B.x + B.w * (1 - ease(p));
    const oldView = { from: ta.from, to: ta.from, k: 1 };
    g.save(); g.beginPath(); g.rect(B.x - T, B.y - T * 2, sx - B.x + T, B.h + T * 3); g.clip();
    drawHourScene(g, R, L, oldView, t); g.restore();
    g.save(); g.beginPath(); g.rect(sx, B.y - T * 2, B.x + B.w + T - sx, B.h + T * 3); g.clip();
    g.drawImage(GAME.caches.board, B.x, B.y, B.w, B.h);
    drawHourScene(g, R, L, GAME.view, t); g.restore();
    if (p < 1) { // the wash of the turning hour
      const gr = g.createLinearGradient(sx - T * 1.2, 0, sx + T * 1.2, 0);
      gr.addColorStop(0, rgba(P.plaster, 0)); gr.addColorStop(0.5, rgba(P.plaster, 0.92)); gr.addColorStop(1, rgba(P.plaster, 0));
      g.fillStyle = gr; g.fillRect(sx - T * 1.2, B.y - T * 0.6, T * 2.4, B.h + T * 0.6);
      g.strokeStyle = P.red; g.lineWidth = 2; g.beginPath(); g.moveTo(sx, B.y - T * 0.5); g.lineTo(sx, B.y + B.h); g.stroke();
    }
  } else drawHourScene(g, R, L, GAME.view, t);
  drawLight(g, lay, t, st.status === 'lie' || st.status === 'spent' ? R.lieK : 0);
  motes(lay, dt, t); drawMotes(g, lay, t);
  if (st.status === 'lie') {
    const lie = st.lie;
    const tgt = lie.actual.at != null && lie.actual.at >= 0 ? lie.actual.at : lie.expected.to != null ? lie.expected.to : st.pos[lie.body];
    const [x, y] = tileXY(L, tgt), [lx, ly] = tileXY(L, st.pos[lie.body]);
    drawRisingApep(g, lay, t, R.lieK, [B.x + (x + 0.5) * T, B.y + (y + 0.5) * T], [B.x + (lx + 0.5) * T, B.y + (ly + 0.5) * T]);
  }
  drawPapyrus(g, lay, L, st, t, GAME.caches, dpr);
  if (lay.landscape) { drawLeftPanel(g, lay, t); drawRightPanel(g, lay, st, t); }
  else drawPortraitPanels(g, lay, st, t);
  if (st.status === 'lie' && R.lieK > 0.45) drawLiePanel(g, lay, L, st, t);
  if (st.status === 'spent') drawSpentPanel(g, lay, st, t);
  if (st.status === 'won' && GAME.time - GAME.wonT0 > 0.9) drawWonPanel(g, lay, L, t);
}

function hourHeader(L) { return TXT.hours[L.def.id]; }

function drawLeftPanel(g, lay, t) {
  const P0 = lay.left, fs = lay.fs, L = GAME.L, H = hourHeader(L);
  const vigH = Math.min(P0.h * 0.27, P0.w * 0.7);
  // Thoth in his vignette
  const vx = P0.x + 8, vy = P0.y + 8, vw = P0.w - 16;
  g.strokeStyle = L.def.paint === 0 ? P.red : P.ink; g.lineWidth = 1.5; g.strokeRect(vx, vy, vw, vigH);
  g.save(); g.beginPath(); g.rect(vx, vy, vw, vigH); g.clip();
  g.fillStyle = rgba(P.ochre, L.def.paint >= 2 ? 0.25 : 0.1); g.fillRect(vx, vy, vw, vigH);
  drawThoth(g, vx + vw * 0.36, vy + vigH - 6, vigH * 0.9, t);
  // the papyrus he writes on
  g.fillStyle = P.linen; g.fillRect(vx + vw * 0.58, vy + vigH * 0.42, vw * 0.3, vigH * 0.36);
  g.strokeStyle = P.ink; g.lineWidth = 1; g.strokeRect(vx + vw * 0.58, vy + vigH * 0.42, vw * 0.3, vigH * 0.36);
  for (let k = 0; k < 4; k++) { g.strokeStyle = rgba(k === 0 ? P.red : P.ink, 0.6); g.beginPath(); g.moveTo(vx + vw * 0.61, vy + vigH * (0.5 + k * 0.07)); g.lineTo(vx + vw * (0.84 - (k === 3 ? 0.1 * (0.5 + 0.5 * Math.sin(t)) : 0)), vy + vigH * (0.5 + k * 0.07)); g.stroke(); }
  g.restore();
  let y = vy + vigH + fs * 0.6;
  y += drawText(g, '{' + H.name + '}', P0.x + 10, y, fs * 1.45, P0.w - 20, { base: 'italic' });
  y += drawText(g, 'whose gate is ' + H.gate, P0.x + 10, y, fs * 0.92, P0.w - 20, { base: 'italic', color: rgba(P.ink, 0.75) }) + fs * 0.7;
  const msg = GAME.msg.text || H.intro[0];
  const reveal = Math.floor((GAME.time - GAME.msg.t0) * 90);
  g.strokeStyle = rgba(P.red, 0.5); g.lineWidth = 1; g.beginPath(); g.moveTo(P0.x + 10, y - fs * 0.35); g.lineTo(P0.x + P0.w * 0.4, y - fs * 0.35); g.stroke();
  const msgH = drawText(g, msg, P0.x + 10, y, fs, P0.w - 20, { reveal });
  drawInventory(g, P0, Math.max(y + msgH + fs * 1.2, P0.y + P0.h * 0.6), fs, t);
}

// A key to the hour, in Thoth's words: each thing drawn small beside its name.
function drawInventory(g, P0, y0, fs, t) {
  const L = GAME.L, rows = [];
  const ifs = fs * 0.86, ih = Math.max(22, ifs * 2.1);
  rows.push({ icon: (x, y, s) => drawItem(g, L.def.item, x, y + s * 0.15, s * 0.8, t, true), text: TXT.inv.item(cap(ITEM[L.def.item].noun)) });
  const signs = [...new Set(L.pans.map(p => p.sign))];
  for (const sg of signs) {
    const two = L.pans.filter(p => p.sign === sg).length > 1;
    rows.push({ icon: (x, y, s) => { drawPan(g, x - s * 0.22, y + s * 0.1, s * 0.62, sg, 0, false); drawSign(g, sg, x + s * 0.38, y, s * 0.42, P.red, 1.4); }, text: TXT.inv.pan(SIGN_WORD[sg], two) });
  }
  if (L.weights0.length) rows.push({ icon: (x, y, s) => drawWeight(g, x, y + s * 0.3, s * 0.72, 4), text: TXT.inv.weight });
  if (L.pools.length) rows.push({ icon: (x, y, s) => { g.fillStyle = P.water; g.fillRect(x - s * 0.32, y - s * 0.22, s * 0.64, s * 0.44); g.strokeStyle = P.ink; g.lineWidth = 1; g.strokeRect(x - s * 0.32, y - s * 0.22, s * 0.64, s * 0.44); }, text: TXT.inv.pool });
  rows.push({ icon: (x, y, s) => { g.save(); g.translate(x, y); g.scale(0.45, 0.45); drawGate(g, -s * 0.5, -s * 0.2, s, t, 0, GAME.style, L.def.id === 'XII'); g.restore(); }, text: TXT.inv.gate(L.def.id) });
  let y = y0;
  const s = ih * 0.92, tw = P0.w - 30 - s;
  const hs = rows.map(r => Math.max(ih, textHeight(g, r.text, ifs, tw, { base: 'italic', lh: 1.15 }) + 6));
  if (y + fs * 1.7 + hs.reduce((a, b) => a + b + 2, 0) > P0.y + P0.h) return;
  drawText(g, '{' + TXT.inHour + '}', P0.x + 10, y, fs * 0.95, P0.w - 20, { base: 'italic' });
  y += fs * 1.7;
  rows.forEach((r, i) => {
    const th = textHeight(g, r.text, ifs, tw, { base: 'italic', lh: 1.15 });
    r.icon(P0.x + 10 + s / 2, y + hs[i] / 2, s);
    drawText(g, r.text, P0.x + 18 + s, y + (hs[i] - th) / 2 - ifs * 0.18, ifs, tw, { base: 'italic', lh: 1.15 });
    y += hs[i] + 2;
  });
}

function drawRightPanel(g, lay, st, t) {
  const P0 = lay.right, fs = lay.fs;
  const boxH = drawBox(g, P0.x + 4, P0.y + 14, P0.w - 8, GAME.L, st, t);
  let y = P0.y + 14 + boxH + 10;
  const bw = (P0.w - 14) / 2, bh = Math.max(38, fs * 2.6);
  const lie = st.status !== 'play';
  const armed = GAME.time - GAME.restartArmed < 2.5;
  const items = [
    { id: 'wait', label: TXT.buttons.wait, key: keyName('Space'), act: () => play('W'), disabled: lie },
    { id: 'act', label: TXT.buttons.act, key: keyName('E'), act: () => play('A'), disabled: lie },
    { id: 'write', label: TXT.buttons.write, key: keyName('Enter'), act: () => play('E'), disabled: lie || st.stroke === 0 || st.recs.length >= MAX_ANSWERERS },
    { id: 'undo', label: TXT.buttons.undo, key: keyName('Z'), act: undo, disabled: GAME.log.length === 0 || st.status === 'won' },
    { id: 'unturn', label: TXT.buttons.unturn, key: keyName('X'), act: unwriteTurning, disabled: GAME.log.length === 0 || st.status === 'won' },
    { id: 'restart', label: armed ? TXT.restartArmed : TXT.buttons.restart, key: keyName('R twice'), act: restartHour, disabled: GAME.log.length === 0 || st.status === 'won' },

  items.forEach((it, i) => {
    const bt = { ...it, x: P0.x + 4 + (i % 2) * (bw + 6), y: y + Math.floor(i / 2) * (bh + 7), w: bw, h: bh, seed: 70 + i };
    drawTablet(g, bt, GAME.hover === it.id, Math.max(11, fs * 0.82));
    GAME.buttons.push(bt);
  });
  y += 3 * (bh + 7) + 8;
  g.globalAlpha = 0.62;
  const legend = GAME.touch ? TXT.legendShort : TXT.legend;
  drawText(g, legend, P0.x + 6, Math.max(y, P0.y + P0.h - textHeight(g, legend, fs * 0.72, P0.w - 12, { base: 'italic' }) - 4), fs * 0.72, P0.w - 12, { base: 'italic' });
  g.globalAlpha = 1;
  if (GAME.toast && GAME.time - GAME.toast.t0 < 2.6) {
    g.globalAlpha = clamp(2.6 - (GAME.time - GAME.toast.t0), 0, 1);
    drawText(g, GAME.toast.text, P0.x + 6, y - 2, fs * 0.85, P0.w - 12, { base: 'italic', color: P.red });
    g.globalAlpha = 1;
  }
}

function drawPortraitPanels(g, lay, st, t) {
  const fs = lay.fs, M = lay.msg, C = lay.ctrl, L = GAME.L, H = hourHeader(L);
  drawText(g, '{' + H.name + '}  ' + TXT.turningLabel(st.turning), M.x, M.y + (lay.compact ? 6 : 0), fs, M.w, { base: 'italic' });
  const msg = GAME.msg.text || H.intro[0];
  drawText(g, msg, M.x, M.y + fs * 1.45 + (lay.compact ? 6 : 0), fs * 0.92, M.w, { reveal: Math.floor((GAME.time - GAME.msg.t0) * 90) });
  if (GAME.toast && GAME.time - GAME.toast.t0 < 2.6) drawText(g, GAME.toast.text, M.x, M.y + M.h - fs * 1.4, fs * 0.85, M.w, { base: 'italic', color: P.red });
  // a cross of four tablets for walking, and the rest beside it
  const pad = Math.min(C.h * 0.95, C.w * 0.42), cx = C.x + pad / 2, cy = C.y + C.h / 2, s = pad / 3.1;
  const lie = st.status !== 'play';
  const dirs = [['U', 0, -1], ['D', 0, 1], ['L', -1, 0], ['R', 1, 0]];
  for (const [d, ox, oy] of dirs) {
    const bt = { id: 'mv' + d, label: '', glyph: d, x: cx + ox * s - s / 2, y: cy + oy * s - s / 2, w: s * 0.96, h: s * 0.96, act: () => play(d), disabled: lie, seed: d.charCodeAt(0) };
    drawTablet(g, bt, false, fs); GAME.buttons.push(bt);
  }
  const ax = C.x + pad + 10, aw = C.w - pad - 10, bw = (aw - 8) / 2, bh = Math.min(44, (C.h - 20) / 3);
  const items = [
    { id: 'wait', label: TXT.buttons.wait, act: () => play('W'), disabled: lie },
    { id: 'act', label: TXT.buttons.act, act: () => play('A'), disabled: lie },
    { id: 'write', label: TXT.buttons.write, act: () => play('E'), disabled: lie || st.stroke === 0 || st.recs.length >= MAX_ANSWERERS },
    { id: 'undo', label: TXT.buttons.undo, act: undo, disabled: GAME.log.length === 0 || st.status === 'won' },
    { id: 'unturn', label: TXT.buttons.unturn, act: unwriteTurning, disabled: GAME.log.length === 0 || st.status === 'won' },
    { id: 'restart', label: GAME.time - GAME.restartArmed < 2.5 ? TXT.restartArmed : TXT.buttons.restart, act: restartHour, disabled: GAME.log.length === 0 || st.status === 'won' },
  ];
  items.forEach((it, i) => {
    const bt = { ...it, x: ax + (i % 2) * (bw + 8), y: C.y + 4 + Math.floor(i / 2) * (bh + 6), w: bw, h: bh, seed: 80 + i };
    drawTablet(g, bt, false, Math.max(10, fs * 0.8)); GAME.buttons.push(bt);
  });
}

// Where a sheet of Thoth's words goes: never over what it is about, if there is
// any way to avoid it. `avoid` lists squares to keep in sight ({i, tall} where a
// tall square also keeps the figure standing on it in sight). On a wide wall the
// sheet may lie across the board's top or bottom, or narrower, over one of the
// side panels and the near edge of the board; the placement hiding least wins.
function placeSheet(lay, wFrac, measure, avoid) {
  const B = lay.board, cw = GAME.cw, ch = GAME.ch, T = B.tile;
  if (lay.compact) { // a phone on its side: the whole right-hand column, the hour stays in view
    const w = lay.msg.w + 8, f = fitAt(lay, w, ch - 8, measure);
    return { r: { x: lay.msg.x - 4, y: 4, w, h: ch - 8 }, fs: f.fs, inner: f.inner };
  }
  if (!lay.landscape) { // everything below the board: the record and the tablets go under the sheet
    const y = lay.papyrus.y - 4, w = cw - 12, f = fitAt(lay, w, ch - y - 6, measure);
    return { r: { x: 6, y, w, h: ch - y - 6 }, fs: f.fs, inner: f.inner };
  }
  const keep = (avoid || []).filter(a => a && a.i >= 0).map(a => {
    const [tx, ty] = tileXY(GAME.L, a.i);
    return { x: B.x + tx * T, y: B.y + ty * T - (a.tall ? T * 0.95 : 0), w: T, h: T * (a.tall ? 1.95 : 1) };
  });
  const cover = r => keep.reduce((sum, k) => sum + Math.max(0, Math.min(r.x + r.w, k.x + k.w) - Math.max(r.x, k.x)) *
    Math.max(0, Math.min(r.y + r.h, k.y + k.h) - Math.max(r.y, k.y)), 0);
  const cands = [];
  const ww = Math.min(B.w * wFrac, cw - 20), fw = fitAt(lay, ww, ch - 20, measure);
  cands.push({ r: { x: B.x + (B.w - ww) / 2, y: Math.min(B.y + B.h - fw.h - 8, ch - fw.h - 10), w: ww, h: fw.h }, f: fw });
  cands.push({ r: { x: B.x + (B.w - ww) / 2, y: Math.max(4, B.y + 8), w: ww, h: fw.h }, f: fw });
  const sw = clamp(cw * 0.36, 320, 500), fsd = fitAt(lay, sw, ch - 20, measure);
  const sy = clamp(B.y + B.h / 2 - fsd.h / 2, 10, ch - fsd.h - 10);
  cands.push({ r: { x: 10, y: sy, w: sw, h: fsd.h }, f: fsd });
  cands.push({ r: { x: cw - 10 - sw, y: sy, w: sw, h: fsd.h }, f: fsd });
  let best = cands[0], bc = cover(cands[0].r);
  for (const c of cands.slice(1)) { const v = cover(c.r); if (v < bc - 1) { best = c; bc = v; } }
  return { r: best.r, fs: best.f.fs, inner: best.f.inner };
}
function fitAt(lay, w, maxH, measure) {
  const inner = w - 36;
  let fs = lay.fs * (lay.compact ? 0.92 : 1);
  let h = measure(fs, inner);
  while (h > maxH && fs > 9) { fs -= 0.5; h = measure(fs, inner); }
  return { fs, inner, h: Math.min(h, maxH) };
}
// The squares a lie is about: where it happened, who told it, and what stood in the way.
function lieSquares(L, st) {
  const lie = st.lie, a = lie.actual;
  const tgt = a.at != null && a.at >= 0 ? a.at : lie.expected.to != null ? lie.expected.to : st.pos[lie.body];
  const out = [{ i: tgt, tall: true }, { i: st.pos[lie.body], tall: true }];
  const beyond = lieBeyond(L, st);
  if (beyond >= 0) out.push({ i: beyond, tall: true });
  return out;
}
// When a shove failed, the square behind the weight is part of the story.
function lieBeyond(L, st) {
  const a = st.lie.actual;
  if (a.k !== 'bump' || a.by !== 'weight' || a.at < 0) return -1;
  const [fx, fy] = tileXY(L, a.from), [tx, ty] = tileXY(L, a.at);
  const bx = tx + (tx - fx), by = ty + (ty - fy);
  return bx < 0 || by < 0 || bx >= L.W || by >= L.H ? -1 : by * L.W + bx;
}

function sheetTablets(g, r, fs, inner, prefix, seed) {
  // the sheet itself takes any touch that is not on one of its tablets
  GAME.buttons.push({ id: prefix + 'sheet', x: r.x, y: r.y, w: r.w, h: r.h, act: () => {} });
  const bw = (inner - 16) / 3, bh = Math.max(32, fs * 2.3), by = r.y + r.h - bh - 12;
  const armed = GAME.time - GAME.restartArmed < 2.5;
  [['undo', TXT.buttons.undo, keyName('Z'), undo], ['unturn', TXT.buttons.unturn, keyName('X'), unwriteTurning],
   ['restart', armed ? txt('restartArmed') : TXT.buttons.restart, keyName('R twice'), restartHour]].forEach(([id, label, key, act], i) => {
    const bt = { id: prefix + id, label, key, act, x: r.x + 18 + i * (bw + 8), y: by, w: bw, h: bh, seed: seed + i };
    drawTablet(g, bt, GAME.hover === bt.id, Math.max(10, fs * 0.85)); GAME.buttons.push(bt);
  });
}

function drawLiePanel(g, lay, L, st, t) {
  const lines = describeLie(L, st);
  const { r, fs, inner } = placeSheet(lay, 0.92, (f, w) => {
    let hh = 24 + f * 1.6 * 1.38;
    for (const ln of lines) hh += textHeight(g, ln, f, w) + f * 0.35;
    return hh + Math.max(32, f * 2.3) + 26;
  }, lieSquares(L, st));
  g.globalAlpha = clamp((GAME.R.lieK - 0.45) * 4, 0, 1);
  drawSheet(g, r.x, r.y, r.w, r.h, 21);
  let y = r.y + 14;
  y += drawText(g, '{' + TXT.lieTitle + '}', r.x + 18, y, fs * 1.6, inner, { base: 'italic' });
  for (const ln of lines) y += drawText(g, ln, r.x + 18, y, fs, inner) + fs * 0.35;
  sheetTablets(g, r, fs, inner, 'lie-', 90);
  g.globalAlpha = 1;
}

function drawSpentPanel(g, lay, st, t) {
  const text = TXT.spentText(st.spent.turning);
  const { r, fs, inner } = placeSheet(lay, 0.8, (f, w) => 30 + f * 1.6 * 1.38 + textHeight(g, text, f, w) + Math.max(32, f * 2.3) + 30,
    [{ i: st.pos[st.recs.length], tall: true }]);
  drawSheet(g, r.x, r.y, r.w, r.h, 23);
  let y = r.y + 14;
  y += drawText(g, '{' + TXT.spentTitle + '}', r.x + 18, y, fs * 1.6, inner, { base: 'italic' });
  drawText(g, text, r.x + 18, y, fs, inner);
  sheetTablets(g, r, fs, inner, 'sp-', 95);
}

function drawWonPanel(g, lay, L, t) {
  const H = hourHeader(L);
  const last = GAME.li === LEVELS.length - 1;
  const key = last ? txt('lastKey') : txt('wonKey');
  const { r, fs, inner } = placeSheet(lay, 0.78, (f, w) => {
    let hh = 28 + f * 1.5 * 1.38 + textHeight(g, key, f * 0.9, w) + 10;
    for (const ln of H.won) hh += textHeight(g, ln, f, w) + f * 0.4;
    return hh;
  }, [{ i: L.gate, tall: true }]);
  g.globalAlpha = clamp((GAME.time - GAME.wonT0 - 0.9) * 3, 0, 1);
  drawSheet(g, r.x, r.y, r.w, r.h, 27);
  let y = r.y + 14;
  y += drawText(g, '{' + cap(H.gate) + '}', r.x + 18, y, fs * 1.5, inner, { base: 'italic' });
  for (const ln of H.won) y += drawText(g, ln, r.x + 18, y, fs, inner) + fs * 0.4;
  drawText(g, key, r.x + 18, y + 2, fs * 0.9, inner, { base: 'italic', color: P.red });
  GAME.buttons.push({ id: 'next', x: r.x, y: r.y, w: r.w, h: r.h, act: () => { if (GAME.time - GAME.wonT0 > 1.2) nextFromPassed(); } });
  g.globalAlpha = 1;
}

/* ---------------- the hour card ---------------- */
function renderCard(g, t, dt) {
  const L = GAME.L, H = hourHeader(L), lay = GAME.lay, fs = lay.fs;
  renderPlayBackdrop(g, t, dt);
  g.fillStyle = rgba(P.umberDeep, 0.35); g.fillRect(0, 0, GAME.cw, GAME.ch);
  const w = Math.min(640, GAME.cw - 24), inner = w - 48;
  const k = clamp((GAME.time - GAME.cardT0) * 2.5, 0, 1);
  let h = 40 + fs * 2.2 * 1.38 + fs * 1.4;
  for (const p of H.intro) h += textHeight(g, p, fs * 1.02, inner) + fs * 0.6;
  h += fs * 2.4;
  const x = (GAME.cw - w) / 2, y = Math.max(10, (GAME.ch - h) / 2) + (1 - k) * 20;
  g.globalAlpha = k;
  drawSheet(g, x, y, w, h, 31 + GAME.li);
  let yy = y + 18;
  drawNumeralRoman(g, L.def.numeral, x + w - 30, yy + fs * 1.2, fs * 1.3);
  yy += drawText(g, '{' + H.name + '}', x + 24, yy, fs * 2.2, inner, { base: 'italic' });
  yy += drawText(g, 'whose gate is ' + H.gate, x + 24, yy, fs, inner, { base: 'italic', color: rgba(P.ink, 0.75) }) + fs * 0.6;
  for (const p of H.intro) yy += drawText(g, p, x + 24, yy, fs * 1.02, inner) + fs * 0.6;
  drawText(g, 'Press Enter, or touch, to walk the hour.', x + 24, yy + fs * 0.2, fs * 0.92, inner, { base: 'italic', color: P.red });
  g.globalAlpha = 1;
}
function drawNumeralRoman(g, s, x, y, px) { g.font = font(px, 'italic'); g.fillStyle = rgba(P.red, 0.8); g.textAlign = 'right'; g.fillText(s, x, y); g.textAlign = 'left'; }

function renderPlayBackdrop(g, t, dt) {
  // the hour as it stands, without the instruments
  const lay = GAME.lay, L = GAME.L, st = top(), style = GAME.style, B = lay.board, R = GAME.R;
  if (!GAME.caches.wall) GAME.caches.wall = paintWall(GAME.cw, GAME.ch, 31 + GAME.li, L.def.paint, GAME.dpr);
  g.drawImage(GAME.caches.wall, 0, 0, GAME.cw, GAME.ch);
  lay._stroke = st.stroke;
  drawBand(g, lay, st, GAME.view, t);
  drawUnderApep(g, lay, t, 0);
  drawBoardFrame(g, lay, style, L.def.paint);
  if (!GAME.caches.board) GAME.caches.board = paintBoardCache(L, style, B.tile, 100 + GAME.li * 7, GAME.dpr);
  g.drawImage(GAME.caches.board, B.x, B.y, B.w, B.h);
  R.tile = B.tile; R.bx = B.x; R.by = B.y; R.bw = B.w; R.style = style; R.lightX = lay._barqueX;
  drawHourScene(g, R, L, GAME.view, t);
  drawLight(g, lay, t, 0);
}

/* ---------------- the title ---------------- */
function renderTitle(g, t, dt) {
  const cw = GAME.cw, ch = GAME.ch, done = GAME.progress.done;
  if (!GAME.caches.title) {
    GAME.caches.title = makeCanvas(cw * GAME.dpr, ch * GAME.dpr);
    const tg = GAME.caches.title.getContext('2d'); tg.scale(GAME.dpr, GAME.dpr);
    paintPlaster(tg, 0, 0, cw, ch, P.plaster, 77, 1);
    // the draughtsman's grid, still showing where the wall is unfinished
    const r = rng(5), sq = Math.max(28, Math.min(cw, ch) / 18);
    tg.strokeStyle = rgba(P.red, done ? 0.08 : 0.22); tg.lineWidth = 1;
    for (let x = 0; x < cw; x += sq) handLine(tg, x, 0, x, ch, r, 1.5);
    for (let y = 0; y < ch; y += sq) handLine(tg, 0, y, cw, y, r, 1.5);
    const vg = tg.createRadialGradient(cw / 2, ch * 0.4, Math.min(cw, ch) * 0.25, cw / 2, ch / 2, Math.max(cw, ch) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, rgba(P.umber, 0.38));
    tg.fillStyle = vg; tg.fillRect(0, 0, cw, ch);
  }
  g.drawImage(GAME.caches.title, 0, 0, cw, ch);
  const S = Math.min(cw, ch), wide = cw / ch > 1.2;
  // the sky with the barque crossing it
  const sy = ch * 0.07, sw = cw * 0.86, sx = (cw - sw) / 2, sh = Math.max(10, S * 0.025);
  poly(g, [sx - 8, sy + sh + 8, sx - 4, sy, sx + sw + 4, sy, sx + sw + 8, sy + sh + 8, sx + sw - 2, sy + sh + 8, sx + sw - 4, sy + sh, sx + 4, sy + sh, sx + 2, sy + sh + 8]);
  fillStroke(g, P.blue, P.ink, 1.5);
  for (let k = 0; k < 42; k++) star(g, sx + (k + 0.5) * sw / 42, sy + sh / 2, sh * 0.36, P.gold);
  const bp = ((t * 0.035) % 1.15) - 0.05;
  drawBarque(g, sx + bp * sw, sy - S * 0.004, S * 0.055, t);
  // the title, its first letter in red
  const tsz = clamp(S * 0.12, 38, 118);
  const ty = ch * (wide ? 0.12 : 0.11);
  g.textBaseline = 'alphabetic';
  g.font = font(tsz, 'italic');
  const tw = g.measureText(TXT.title).width;
  const tw0 = g.measureText('T').width;
  g.fillStyle = P.red; g.textAlign = 'left'; g.fillText('T', cw / 2 - tw / 2, ty + tsz);
  g.fillStyle = P.ink; g.fillText(TXT.title.slice(1), cw / 2 - tw / 2 + tw0, ty + tsz);
  const fs = clamp(S * 0.024, 12, 20);
  const subY = ty + tsz * 1.3;
  const subH = drawText(g, TXT.subtitle, cw / 2, subY, fs * 0.95, Math.min(cw * 0.86, 720), { base: 'italic', align: 'center', color: rgba(P.ink, 0.8) });
  // laid out from the bottom up: footer, the hours crossed, the prompt, the serpent, the ground line
  const th = titleHour();
  const prompt = GAME.L && GAME.states.length && th === GAME.li && top().status !== 'won' && GAME.log.length ? txt('back')(hourTitle(LEVELS[th]).toLowerCase())
    : done ? txt('again') : GAME.progress.unlocked > 0 ? txt('resume')(hourTitle(LEVELS[th]).toLowerCase()) : TXT.begin;
  const pw = Math.min(cw * 0.9, 760), lw = Math.min(cw * 0.94, 900);
  const showHours = GAME.progress.unlocked > 0 || done;
  const listText = txt('hourPick');
  const tabH = Math.max(30, fs * 2.1);
  const pH = textHeight(g, prompt, fs, pw, { base: 'italic' });
  const lH = showHours ? textHeight(g, listText, fs * 0.72, lw, { base: 'italic' }) + tabH + fs * 0.5 : 0;
  const footH = fs * 0.7 + 16;
  const serpH = Math.max(22, S * 0.075);
  const gy = Math.min(ch * 0.82, ch - footH - lH - pH - serpH - 10);
  const short = ch < 520;
  // the register line the figures stand on: red sketch until the night is done
  const tbw = Math.min(wide ? cw * (short ? 0.58 : 0.48) : cw * 0.88, 640);
  const side = (cw - tbw) / 2 - cw * 0.03;
  let y = subY + subH + fs * 0.9;
  let fh = wide ? Math.min(clamp(S * 0.24, 70, 230), side / 1.85) : clamp(S * 0.26, 70, 200);
  // Thoth's words between the title and the figures (beside them when the wall is wide)
  const totalH = p => TXT.titleLines.reduce((a, ln) => a + textHeight(g, ln, p, tbw) + p * 0.5, 0);
  let px = fs;
  const roomFor = h => (wide ? gy - fs : gy - h * 1.06) - y;
  while (px > 11 && totalH(px) > roomFor(fh)) px -= 0.5;
  if (!wide) while (fh > 60 && totalH(px) > roomFor(fh)) fh -= 4;
  const reveal = Math.floor((GAME.time - GAME.titleT0) * 110);
  let shown = reveal;
  for (const ln of TXT.titleLines) {
    y += drawText(g, ln, cw / 2 - tbw / 2, y, px, tbw, { reveal: shown }) + px * 0.5;
    shown -= textLength(ln);
  }
  // on a tall narrow wall the procession grows into the space left under the words
  if (!wide) fh = clamp(Math.min((gy - y - 14) / 1.06, cw * 0.9 / 2.05, 230), 60, 230);
  g.fillStyle = done ? P.ochre : rgba(P.red, 0.18); g.fillRect(cw * 0.04, gy + 1, cw * 0.92, 5);
  g.strokeStyle = done ? P.ink : P.red; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(cw * 0.04, gy + 1); g.lineTo(cw * 0.96, gy + 1); g.moveTo(cw * 0.04, gy + 6); g.lineTo(cw * 0.96, gy + 6); g.stroke();
  const gateStyle = done ? STYLES[3] : STYLES[0];
  if (wide) {
    // the answerers follow Hori in procession toward the gate where Thoth writes
    for (let k = 0; k < 4; k++) drawShabti(g, cw * 0.05 + k * fh * 0.3, gy, fh * 0.66, { mat: MATS[3 - k], seed: 300 + k, tilt: Math.sin(t * 1.2 + k) * 0.015 });
    drawMan(g, cw * 0.05 + 4 * fh * 0.3 + fh * 0.12, gy, fh, { facing: 1, palette: true, brush: true, blink: (t % 4) < 0.12 });
    drawGate(g, cw * 0.95 - fh * 0.62, gy - fh * 0.62, fh * 0.62, t, done ? 1 : 0, gateStyle, false);
    drawThoth(g, cw * 0.95 - fh * 0.95, gy, fh * 1.02, t);
  } else {
    const x0 = Math.max(cw * 0.04, fh * 0.15);
    for (let k = 0; k < 4; k++) drawShabti(g, x0 + k * fh * 0.25, gy, fh * 0.6, { mat: MATS[3 - k], seed: 300 + k, tilt: Math.sin(t * 1.2 + k) * 0.015 });
    drawMan(g, x0 + 4 * fh * 0.25 + fh * 0.08, gy, fh, { facing: 1, palette: true, brush: true, blink: (t % 4) < 0.12 });
    drawThoth(g, cw - Math.max(cw * 0.04, fh * 0.3), gy, fh, t);
  }
  // Apep below the ground line, pinned with knives
  const ay = gy + 8 + serpH * 0.45;
  const wave = x => ay + Math.sin(x * 0.012 + t * 0.4) * serpH * 0.18;
  const pts = [];
  for (let x = -40; x <= cw - 70; x += 30) pts.push(x, wave(x));
  drawSerpent(g, pts, Math.max(9, serpH * 0.3), t);
  for (let k = 1; k < 6; k++) drawKnife(g, cw * k / 6.3, wave(cw * k / 6.3), Math.max(16, serpH * 0.55), k % 2 ? -0.3 : 0.3);
  drawSerpentHead(g, cw - 80, wave(cw - 80) - 2, Math.max(20, serpH * 0.7), -0.08, 0.2 + 0.15 * Math.max(0, Math.sin(t * 0.5)));
  // what to do
  const py = gy + 8 + serpH + 2;
  g.globalAlpha = 0.65 + 0.35 * Math.sin(t * 2.2);
  drawText(g, prompt, cw / 2, py, fs, pw, { base: 'italic', align: 'center', color: P.red });
  g.globalAlpha = 1;
  if (showHours) {
    g.globalAlpha = 0.7;
    const lh = drawText(g, listText, cw / 2, py + pH + fs * 0.1, fs * 0.72, lw, { base: 'italic', align: 'center' });
    g.globalAlpha = 1;
    const tw = Math.min(110, (cw - 40) / 4 - 8), ty0 = py + pH + fs * 0.25 + lh;
    LEVELS.forEach((d, i) => {
      const open = i <= GAME.progress.unlocked || done;
      const bt = { id: 'hour' + i, label: d.numeral, key: keyName(String(i + 1)), x: cw / 2 - (tw * 4 + 24) / 2 + i * (tw + 8), y: ty0, w: tw, h: tabH,
        act: () => openHour(i), disabled: !open, seed: 120 + i };
      drawTablet(g, bt, GAME.hover === bt.id, fs * 0.8); GAME.buttons.push(bt);
    });
  }
  const link = txt('selfTestLink');
  g.globalAlpha = 0.5;
  g.font = font(fs * 0.7, 'italic'); g.fillStyle = P.ink; g.textAlign = 'right';
  g.fillText(link, cw - 14, ch - 10);
  const linkW = g.measureText(link).width;
  g.textAlign = 'left';
  if (g.measureText(TXT.footer).width + linkW + 60 < cw) g.fillText(TXT.footer, 14, ch - 10);
  g.globalAlpha = 1;
  GAME.buttons.push({ id: 'selftest', x: cw - 20 - linkW, y: ch - 28, w: linkW + 20, h: 28, act: runSelfTest });
}

/* ---------------- Thoth checks his record ---------------- */
function renderSelfTest(g, t) {
  renderTitleBackdrop(g);
  const fs = clamp(Math.min(GAME.cw, GAME.ch) * 0.022, 12, 17);
  const w = Math.min(760, GAME.cw - 20), x = (GAME.cw - w) / 2, inner = w - 40;
  const res = GAME.self;
  const lines = [];
  if (!res) lines.push(TXT.selfRunning);
  else {
    let hour = '';
    for (const r of res.results) {
      if (r.hour !== hour) { hour = r.hour; const def = LEVELS.find(d => d.id === hour); lines.push({ head: def ? hourTitle(def) : TXT.selfRule }); }
      const det = TXT.selfDetail(r.key, r.info);
      lines.push({ ok: r.ok, text: (TXT.selfLabels[r.key] || r.key) + (det ? ' (' + det + ')' : '') });
    }
  }
  // every line wraps inside the sheet; the whole list shrinks until it fits the wall
  const sumH = f => lines.reduce((a, ln) => a + (typeof ln === 'string' ? textHeight(g, ln, f, inner, { base: 'italic' })
    : ln.head ? f * 1.32 : textHeight(g, (ln.ok ? 'True: ' : 'False: ') + ln.text, f, inner - 14, { lh: 1.22 })) + f * 0.12, 0);
  const head = fs * 1.7 * 1.38 + 20, foot = fs * 3.6;
  const maxH = GAME.ch - 20;
  let lfs = fs;
  while (lfs > 8 && head + sumH(lfs) + foot > maxH) lfs -= 0.5;
  const h = Math.min(maxH, head + sumH(lfs) + foot);
  const y = Math.max(10, (GAME.ch - h) / 2);
  drawSheet(g, x, y, w, h, 41);
  let yy = y + 14;
  yy += drawText(g, '{' + TXT.selfTitle + '}', x + 20, yy, fs * 1.7, inner, { base: 'italic' }) + 6;
  for (const ln of lines) {
    if (typeof ln === 'string') { yy += drawText(g, ln, x + 20, yy, lfs, inner, { base: 'italic' }) + lfs * 0.12; continue; }
    if (ln.head) { drawText(g, '{' + ln.head + '}', x + 20, yy, lfs, inner, { base: 'italic', lh: 1.32 }); yy += lfs * 1.32 + lfs * 0.12; continue; }
    yy += drawText(g, (ln.ok ? 'True: ' : 'False: ') + ln.text, x + 34, yy, lfs, inner - 14, { lh: 1.22, color: ln.ok ? P.ink : P.red }) + lfs * 0.12;
  }
  if (res) {
    drawText(g, TXT.selfSummary(res.failed, res.ms), x + 20, y + h - fs * 3.3, fs, inner, { base: 'italic', color: res.failed ? P.red : P.ink });
    drawText(g, txt('selfKeys'), x + 20, y + h - fs * 1.8, fs * 0.85, inner, { base: 'italic', color: P.red });
  }
}
function renderTitleBackdrop(g) {
  if (!GAME.caches.title) { const t0 = GAME.time; renderTitle(g, t0, 0); }
  g.drawImage(GAME.caches.title, 0, 0, GAME.cw, GAME.ch);
}

/* ---------------- the ending ---------------- */
function renderEnding(g, t) {
  const cw = GAME.cw, ch = GAME.ch, S = Math.min(cw, ch);
  const st = GAME.ending.stage, k = clamp((GAME.time - GAME.ending.t0) / 1.2, 0, 1);
  renderTitleBackdrop(g);
  const fs = clamp(S * 0.024, 12, 20);
  // the words first, so the picture can take whatever wall is left above them
  const ent = TXT.ending[st];
  const w = Math.min(720, cw - 24), inner = w - 44, x = (cw - w) / 2;
  const key = st === TXT.ending.length - 1 ? txt('endingLast') : txt('endingKey');
  let h = 30 + textHeight(g, key, fs * 0.9, inner);
  if (ent[0]) h += fs * 1.6 * 1.38;
  for (let i = 1; i < ent.length; i++) h += textHeight(g, ent[i], fs * 1.05, inner) + fs * 0.6;
  const sceneH = clamp(ch - h - 24, ch * 0.4, ch * 0.62), gy = sceneH * 0.92;
  const dawn = st >= 4 ? (st === 4 ? k : 1) : 0;
  if (dawn > 0) { const gr = g.createLinearGradient(0, 0, 0, sceneH); gr.addColorStop(0, rgba(P.gold, 0.5 * dawn)); gr.addColorStop(1, rgba(P.ochre, 0.15 * dawn)); g.fillStyle = gr; g.fillRect(0, 0, cw, sceneH); }
  g.strokeStyle = P.ink; g.lineWidth = 2; g.beginPath(); g.moveTo(cw * 0.04, gy); g.lineTo(cw * 0.96, gy); g.stroke();
  const fh = Math.min(clamp(sceneH * 0.5, 64, 260), cw / 4.2);
  if (st <= 1) {
    const settle = st === 0 ? 0 : k;
    const cx = cw / 2 + fh * 0.25;
    drawGreatBalance(g, cx, gy, fh * 1.25, t, settle);
    drawMan(g, cx - fh * 0.95, gy, fh, { facing: 1, head: 'jackal', wig: P.ink, skin: '#3A2A20', arms: 'carry', carry: null });
    drawThoth(g, cx + fh * 1.15, gy, fh, t);
    drawAmmit(g, cx + fh * 0.5, gy, fh * 0.4, t, settle);
    drawMan(g, cx - fh * 1.72, gy, fh * 0.95, { facing: 1, palette: false, brush: true, blink: (t % 4) < 0.12 });
  } else if (st === 2) {
    const x0 = (cw - fh * 2.5) / 2 + fh * 0.15;
    drawMan(g, x0, gy, fh, { facing: 1, brush: true });
    for (let i = 0; i < 4; i++) drawShabti(g, x0 + fh * 0.45 + i * fh * 0.42, gy, fh * 0.74, { mat: MATS[i], seed: 500 + i, rest: k > 0.6 });
    drawShabti(g, x0 + fh * 0.45 + 4 * fh * 0.42, gy, fh * 0.6, { mat: TAMIT_MAT, child: true, seed: 9, tilt: -0.06 });
  } else if (st === 3) {
    const os = Math.min(fh * 1.25, cw * 0.42);
    drawShabti(g, cw / 2 - Math.min(cw * 0.25, fh * 1.0), gy, Math.min(fh * 1.1, sceneH * 0.8), { mat: TAMIT_MAT, child: true, seed: 9, tilt: -0.05 });
    drawOstracon(g, cw / 2 + Math.min(cw * 0.2, fh * 0.75), gy - os * 0.5, os, t);
  } else {
    const rise = st === 4 ? easeOut(k) : 1;
    const aw = Math.min(cw * 0.5, fh * 2.0);
    g.save(); g.beginPath(); g.rect(0, 0, cw, gy); g.clip(); // the sun and the scarab come up out of the horizon
    const sunY = drawAkhet(g, cw / 2, gy, aw, rise, t);
    drawKhepri(g, cw / 2, sunY + aw * 0.19, aw * 0.15, t);
    g.restore();
    if (st === 5) {
      g.font = font(Math.min(clamp(S * 0.07, 26, 72), cw * 0.1), 'italic'); g.textAlign = 'center';
      g.fillStyle = P.ink; g.fillText(TXT.title, cw / 2, Math.max(gy - aw * 0.55 - 10, sceneH * 0.18));
      g.textAlign = 'left';
      drawMan(g, cw / 2 - aw * 0.62 - fh * 0.15, gy, fh * 0.8, { facing: 1, brush: true, arms: 'carry', carry: (gg, hx, hy, lw) => drawItem(gg, 'name', hx + 0.03, hy - 0.04, 0.16, t, true, lw) });
      drawShabti(g, cw / 2 + aw * 0.62 + fh * 0.15, gy, fh * 0.5, { mat: TAMIT_MAT, child: true, seed: 9, tilt: -0.05, rest: true });
    }
  }
  // the words
  const y = Math.min(ch - h - 10, sceneH + 6);
  g.globalAlpha = clamp(k * 2, 0, 1);
  drawSheet(g, x, y, w, h, 51 + st);
  let yy = y + 16;
  if (ent[0]) yy += drawText(g, '{' + ent[0] + '}', x + 22, yy, fs * 1.6, inner, { base: 'italic' });
  for (let i = 1; i < ent.length; i++) yy += drawText(g, ent[i], x + 22, yy, fs * 1.05, inner, { hand: P.red }) + fs * 0.6;
  drawText(g, key, x + 22, yy, fs * 0.9, inner, { base: 'italic', color: P.red });
  g.globalAlpha = 1;
}

function drawGreatBalance(g, x, gy, h, t, settle) {
  const lw = 2;
  g.save(); g.translate(x, gy);
  poly(g, [-h * 0.08, 0, h * 0.08, 0, h * 0.03, -h, -h * 0.03, -h]); fillStroke(g, P.gold, P.ink, lw);
  const tilt = (1 - settle) * (0.18 * Math.sin(t * 1.4) * Math.exp(-0.0 * t)) + (1 - settle) * 0.05;
  g.translate(0, -h);
  ell(g, 0, -h * 0.06, h * 0.06, h * 0.06); fillStroke(g, P.red, P.ink, lw);
  g.rotate(tilt);
  g.fillStyle = P.wood; g.fillRect(-h * 0.62, -h * 0.025, h * 1.24, h * 0.05); g.strokeStyle = P.ink; g.lineWidth = lw; g.strokeRect(-h * 0.62, -h * 0.025, h * 1.24, h * 0.05);
  for (const sx of [-1, 1]) {
    g.save(); g.translate(sx * h * 0.56, 0); g.rotate(-tilt);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(-h * 0.13, h * 0.42); g.moveTo(0, 0); g.lineTo(h * 0.13, h * 0.42); g.stroke();
    ell(g, 0, h * 0.44, h * 0.17, h * 0.04); fillStroke(g, P.gold, P.ink, lw);
    if (sx < 0) drawItem(g, 'heart', 0, h * 0.36, h * 0.2, t, true);
    else drawSign(g, 'f', 0, h * 0.3, h * 0.2, P.ink, 2.5);
    g.restore();
  }
  g.restore();
}
function drawAmmit(g, x, y, h, t, settle) { // crocodile head, lion's forequarters, hippo behind; lying down, hoping
  g.save(); g.translate(x, y);
  const lw = 1.6;
  // hippopotamus hindquarters
  g.beginPath(); g.moveTo(h * 0.2, 0); g.quadraticCurveTo(h * 0.15, -h * 0.62, h * 0.65, -h * 0.6); g.quadraticCurveTo(h * 1.1, -h * 0.55, h * 1.05, 0); g.closePath();
  fillStroke(g, '#8C6A3F', P.ink, lw);
  g.beginPath(); g.moveTo(h * 1.0, -h * 0.35); g.quadraticCurveTo(h * 1.18, -h * 0.3, h * 1.12, -h * 0.12); g.strokeStyle = P.ink; g.lineWidth = lw; g.stroke();
  // lion forequarters and mane
  g.beginPath(); g.moveTo(-h * 0.25, 0); g.quadraticCurveTo(-h * 0.3, -h * 0.52, h * 0.05, -h * 0.62); g.quadraticCurveTo(h * 0.35, -h * 0.6, h * 0.35, 0); g.closePath();
  fillStroke(g, P.ochre, P.ink, lw);
  g.fillStyle = '#7C5A2A';
  for (let k = 0; k < 7; k++) { ell(g, -h * 0.12 + (k % 4) * h * 0.08, -h * 0.5 + Math.floor(k / 4) * h * 0.12, h * 0.05, h * 0.035, 0.6); g.fill(); }
  // forepaws stretched toward the Balance
  poly(g, [-h * 0.2, -h * 0.02, -h * 0.62, -h * 0.02, -h * 0.66, -h * 0.1, -h * 0.2, -h * 0.12]); fillStroke(g, P.ochre, P.ink, lw);
  // the crocodile head, chin on the paws
  const jaw = (1 - settle) * 0.08 + Math.max(0, Math.sin(t * 0.8)) * 0.04 * (1 - settle);
  g.save(); g.translate(-h * 0.22, -h * 0.42);
  poly(g, [0, -h * 0.1, -h * 0.18, -h * 0.13, -h * 0.62, -h * 0.06 - jaw * h, -h * 0.66, 0, -h * 0.2, h * 0.02, 0, h * 0.06]);
  fillStroke(g, P.green, P.ink, lw);
  poly(g, [-h * 0.2, h * 0.02, -h * 0.64, h * 0.03, -h * 0.6, h * 0.11, -h * 0.18, h * 0.12]); fillStroke(g, P.greenPale, P.ink, lw);
  g.strokeStyle = P.linen; g.lineWidth = 1.2;
  for (let k = 0; k < 6; k++) { const tx = -h * (0.26 + k * 0.06); g.beginPath(); g.moveTo(tx, h * 0.01); g.lineTo(tx - h * 0.015, h * 0.045); g.stroke(); }
  ell(g, -h * 0.17, -h * 0.08, h * 0.03, h * 0.022); g.fillStyle = P.gold; g.fill();
  ell(g, -h * 0.17, -h * 0.08, h * 0.012, h * 0.016); g.fillStyle = P.ink; g.fill();
  g.restore();
  g.restore();
}
function drawKhepri(g, x, y, s, t) {
  g.save(); g.translate(x, y + Math.sin(t * 2) * s * 0.02);
  drawSign(g, 'k', 0, 0, s, P.ink, Math.max(2, s * 0.06));
  g.restore();
}
// The horizon sign: the sun coming up between two hills.
function drawAkhet(g, x, gy, w, rise, t) {
  const h = w * 0.36;
  const sunY = gy - h * 0.2 - rise * h * 0.95;
  const glow = g.createRadialGradient(x, sunY, 0, x, sunY, w * 1.1);
  glow.addColorStop(0, 'rgba(255,214,120,' + (0.25 + 0.5 * rise).toFixed(3) + ')'); glow.addColorStop(1, 'rgba(255,214,120,0)');
  g.fillStyle = glow; g.fillRect(x - w * 1.2, sunY - w * 1.1, w * 2.4, w * 1.6);
  ell(g, x, sunY, w * 0.13, w * 0.13); fillStroke(g, P.red, P.ink, 2);
  for (const sx of [-1, 1]) {
    g.beginPath(); g.moveTo(x + sx * w * 0.06, gy); g.quadraticCurveTo(x + sx * w * 0.08, gy - h * 1.15, x + sx * w * 0.32, gy - h * 1.05);
    g.quadraticCurveTo(x + sx * w * 0.52, gy - h * 0.95, x + sx * w * 0.55, gy); g.closePath();
    fillStroke(g, P.ochre, P.ink, 2);
    g.fillStyle = rgba(P.red, 0.6);
    for (let k = 0; k < 9; k++) { ell(g, x + sx * w * (0.15 + (k % 3) * 0.12), gy - h * (0.25 + Math.floor(k / 3) * 0.22), 2.2, 2.2); g.fill(); }
  }
  return sunY;
}
function drawOstracon(g, x, y, s, t) { // a cat herding geese, in a quick red-and-black hand
  g.save(); g.translate(x, y);
  poly(g, [-s * 0.55, -s * 0.2, -s * 0.3, -s * 0.42, s * 0.2, -s * 0.45, s * 0.55, -s * 0.25, s * 0.5, s * 0.25, s * 0.05, s * 0.4, -s * 0.48, s * 0.28]);
  fillStroke(g, '#F1EADA', P.ink, 2);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const ln = (col, w, f) => { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); f(); g.stroke(); };
  const u = s;
  // the cat, walking upright like a herdsman, a crook over its shoulder
  ln(P.ink, 2.2, () => {
    g.moveTo(-u * 0.36, u * 0.26); g.lineTo(-u * 0.3, u * 0.08);                 // back leg
    g.moveTo(-u * 0.24, u * 0.26); g.lineTo(-u * 0.26, u * 0.08);                // front leg
    g.moveTo(-u * 0.33, u * 0.1); g.quadraticCurveTo(-u * 0.38, -u * 0.08, -u * 0.27, -u * 0.16); // back
    g.quadraticCurveTo(-u * 0.2, -u * 0.08, -u * 0.24, u * 0.1);                  // belly
    g.moveTo(-u * 0.27, -u * 0.16); g.lineTo(-u * 0.29, -u * 0.27); g.lineTo(-u * 0.24, -u * 0.22); // ear
    g.lineTo(-u * 0.19, -u * 0.28); g.lineTo(-u * 0.19, -u * 0.17); g.quadraticCurveTo(-u * 0.14, -u * 0.14, -u * 0.19, -u * 0.12); // ear, muzzle
    g.moveTo(-u * 0.34, u * 0.06); g.quadraticCurveTo(-u * 0.5, u * 0.0, -u * 0.46, -u * 0.12); // tail
  });
  ln(P.ink, 1.6, () => { g.moveTo(-u * 0.24, -u * 0.05); g.lineTo(-u * 0.13, u * 0.0); });     // arm
  ln(P.red, 2, () => { g.moveTo(-u * 0.2, -u * 0.12); g.lineTo(-u * 0.04, u * 0.24); g.moveTo(-u * 0.2, -u * 0.12); g.quadraticCurveTo(-u * 0.22, -u * 0.2, -u * 0.15, -u * 0.2); });
  ell(g, -u * 0.215, -u * 0.17, 1.6, 1.6); g.fillStyle = P.ink; g.fill();
  // three geese in front, waddling off to the right
  for (let i = 0; i < 3; i++) {
    const gx = u * (0.06 + i * 0.15), gy0 = u * (0.14 - (i % 2) * 0.1);
    ln(P.ink, 2, () => {
      g.moveTo(gx - u * 0.07, gy0); g.quadraticCurveTo(gx - u * 0.02, gy0 + u * 0.06, gx + u * 0.05, gy0 + u * 0.02); // belly
      g.quadraticCurveTo(gx + u * 0.03, gy0 - u * 0.03, gx - u * 0.07, gy0);      // wing line back
      g.moveTo(gx + u * 0.04, gy0); g.quadraticCurveTo(gx + u * 0.08, gy0 - u * 0.05, gx + u * 0.07, gy0 - u * 0.12); // neck
      g.moveTo(gx - u * 0.01, gy0 + u * 0.05); g.lineTo(gx - u * 0.02, gy0 + u * 0.09);
      g.moveTo(gx + u * 0.02, gy0 + u * 0.045); g.lineTo(gx + u * 0.025, gy0 + u * 0.09);
    });
    ell(g, gx + u * 0.075, gy0 - u * 0.13, u * 0.018, u * 0.014); g.fillStyle = P.ink; g.fill();
    ln(P.red, 2, () => { g.moveTo(gx + u * 0.09, gy0 - u * 0.13); g.lineTo(gx + u * 0.12, gy0 - u * 0.12); });
  }
  g.restore();
}

/* =====================================================================
   OPENING THE RECORD  (boot, sizing, the frame loop, a debug window)
   ===================================================================== */

(function boot() {
  const cv = document.getElementById('wall');
  const g = cv.getContext('2d');
  GAME.cv = cv;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const cw = Math.max(320, window.innerWidth || document.documentElement.clientWidth || 1024);
    const ch = Math.max(320, window.innerHeight || document.documentElement.clientHeight || 768);
    if (cw === GAME.cw && ch === GAME.ch && dpr === GAME.dpr) return;
    GAME.cw = cw; GAME.ch = ch; GAME.dpr = dpr;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    relayout();
  }

  loadProgress();
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', onKey);
  cv.addEventListener('pointerdown', e => { onPointerDown(e); e.preventDefault(); });
  cv.addEventListener('pointermove', onPointerMove);
  cv.addEventListener('pointerup', e => { onPointerUp(e); e.preventDefault(); });
  cv.addEventListener('pointercancel', () => { GAME.pointer = null; });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  const q = new URLSearchParams(location.search);
  if (q.has('hour')) {
    const i = clamp((parseInt(q.get('hour'), 10) || 1) - 1, 0, LEVELS.length - 1);
    enterHour(i);
    if (q.has('play')) GAME.screen = 'play';
    if (q.has('log')) { GAME.screen = 'play'; for (const tok of cleanLog(q.get('log'))) commit(tok); GAME.view.k = 1; GAME.turnAnim = null; }
  }
  if (q.has('ending')) { GAME.screen = 'ending'; GAME.ending = { stage: clamp(+q.get('ending') || 0, 0, TXT.ending.length - 1), t0: -10 }; }
  if (q.has('selftest')) runSelfTest();

  let last = performance.now();
  function frame(now) {
    const dt = clamp((now - last) / 1000, 0, 0.1);
    last = now;
    resize();
    update(dt);
    g.setTransform(GAME.dpr, 0, 0, GAME.dpr, 0, 0);
    g.fillStyle = P.plaster; g.fillRect(0, 0, GAME.cw, GAME.ch);
    const t = GAME.time;
    GAME.buttons = []; // each screen lays down its own tablets every frame
    if (GAME.screen === 'title') renderTitle(g, t, dt);
    else if (GAME.screen === 'card') renderCard(g, t, dt);
    else if (GAME.screen === 'play') renderPlay(g, t, dt);
    else if (GAME.screen === 'ending') renderEnding(g, t);
    else if (GAME.screen === 'selftest') renderSelfTest(g, t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // A window for testing by hand or by harness. Everything here is the same
  // pure engine the game uses.
  window.__trueOfVoice = {
    selfTest, selfTestResult: null,
    state: () => top(), log: () => GAME.log.join(''), screen: () => GAME.screen, hour: () => GAME.li,
    enter: i => { enterHour(i); GAME.screen = 'play'; },
    input: tok => { for (const c of cleanLog(tok)) commit(c); GAME.view.k = 1; GAME.turnAnim = null; return top().status; },
    undo, unwrite: unwriteTurning, restart: () => { GAME.restartArmed = GAME.time; restartHour(); },
    simulate: (i, log) => simulate(parseLevel(LEVELS[i]), cleanLog(log)).state,
    describe: () => top().status === 'lie' ? describeLie(GAME.L, top()) : null,
    hash: () => hashState(top()),
    game: GAME,
  };
})();

})();
</script>
