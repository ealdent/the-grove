    g.fillStyle = rgba(P.linen, 0.35); ell(g, -s * 0.08, -s * 0.08, s * 0.04, s * 0.07, 0.4); g.fill();
  }
  g.restore();
}

/* ---------- things of the hour ---------- */
function drawWeight(g, x, y, s, seed) { // a bull-weight of Sokar: granite, a sleeping bull carved on top
  g.save(); g.translate(x, y);
  const lw = Math.max(1, s * 0.035);
  g.lineJoin = 'round';
  ell(g, 0, -s * 0.02, s * 0.4, s * 0.1); g.fillStyle = rgba(P.umberDeep, 0.25); g.fill();
  rrect(g, -s * 0.38, -s * 0.36, s * 0.76, s * 0.34, s * 0.08); fillStroke(g, P.granite, P.ink, lw);
  g.fillStyle = P.graniteDark; g.fillRect(-s * 0.36, -s * 0.12, s * 0.72, s * 0.08);
  const r = rng(seed || 3);
  for (let k = 0; k < 26; k++) { g.fillStyle = r() < 0.5 ? 'rgba(30,15,10,0.35)' : 'rgba(240,210,190,0.3)'; g.fillRect(-s * 0.34 + r() * s * 0.68, -s * 0.34 + r() * s * 0.3, s * 0.02, s * 0.02); }
  // the bull
  g.beginPath(); g.moveTo(-s * 0.3, -s * 0.36); g.quadraticCurveTo(-s * 0.28, -s * 0.56, -s * 0.05, -s * 0.55);
  g.quadraticCurveTo(s * 0.12, -s * 0.56, s * 0.16, -s * 0.48); g.lineTo(s * 0.3, -s * 0.5); g.lineTo(s * 0.34, -s * 0.42);
  g.lineTo(s * 0.26, -s * 0.36); g.closePath(); fillStroke(g, mix(P.granite, P.linen, 0.12), P.ink, lw);
  g.strokeStyle = P.ink; g.lineWidth = lw;
  g.beginPath(); g.moveTo(s * 0.27, -s * 0.5); g.quadraticCurveTo(s * 0.24, -s * 0.62, s * 0.33, -s * 0.64); g.stroke();
  g.beginPath(); g.moveTo(-s * 0.2, -s * 0.36); g.lineTo(-s * 0.1, -s * 0.36); g.stroke();
  ell(g, s * 0.27, -s * 0.46, s * 0.012, s * 0.012); g.fillStyle = P.ink; g.fill();
  g.restore();
}

function drawPan(g, x, y, s, sign, sink, lit) { // a copper pan of the balance, let into the floor
  g.save(); g.translate(x, y);
  const lw = Math.max(1, s * 0.03);
  ell(g, 0, 0, s * 0.38, s * 0.27); fillStroke(g, P.copperLight, P.ink, lw);
  ell(g, 0, s * 0.02 * sink, s * 0.3, s * 0.2); fillStroke(g, mix(P.copper, P.umberDeep, 0.15 + sink * 0.35), null);
  g.save(); ell(g, 0, s * 0.02 * sink, s * 0.3, s * 0.2); g.clip();
  ell(g, -s * 0.05, -s * 0.12 + s * 0.04 * sink, s * 0.3, s * 0.12); g.fillStyle = rgba('#000000', 0.12 + sink * 0.18); g.fill();
  g.restore();
  g.save(); g.scale(1, 0.72);
  drawSign(g, sign, 0, s * 0.04 * sink, s * 0.36, sink > 0.5 || lit ? P.red : P.ink, Math.max(1.2, s * 0.035));
  g.restore();
  g.restore();
}

// A door hung from its beam: jambs, lintel, and a cedar leaf that rises.
function drawDoor(g, x, y, s, sign, open, style) {
  g.save(); g.translate(x, y);
  const lw = Math.max(1, s * 0.03);
  const jamb = style.wallTop, face = style.wallFace;
  const top = -s * 0.32;
  // opening (the floor shows through when raised)
  g.fillStyle = rgba(P.umberDeep, 0.18 * (1 - open)); g.fillRect(s * 0.12, top, s * 0.76, s * 1.32 - s * 0.32);
  // the leaf
  const leafTop = top + s * 0.12, leafH = (s - leafTop) * (1 - open * 0.86);
  if (leafH > 1) {
    g.fillStyle = P.wood; g.fillRect(s * 0.14, leafTop, s * 0.72, leafH);
    g.strokeStyle = P.woodDark; g.lineWidth = lw * 0.8;
    for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(s * (0.14 + k * 0.18), leafTop); g.lineTo(s * (0.14 + k * 0.18), leafTop + leafH); g.stroke(); }
    g.fillStyle = P.copperLight; g.fillRect(s * 0.14, leafTop + leafH * 0.18, s * 0.72, s * 0.04); g.fillRect(s * 0.14, leafTop + leafH * 0.78, s * 0.72, s * 0.04);
    g.strokeStyle = P.ink; g.lineWidth = lw; g.strokeRect(s * 0.14, leafTop, s * 0.72, leafH);
    if (leafH > s * 0.4) {
      ell(g, s * 0.5, leafTop + leafH * 0.48, s * 0.2, s * 0.2); g.fillStyle = rgba(P.linen, 0.85); g.fill();
      drawSign(g, sign, s * 0.5, leafTop + leafH * 0.48, s * 0.3, P.ink, Math.max(1.1, s * 0.03));
    }
  }
  // jambs and lintel
  g.fillStyle = jamb; g.fillRect(0, top, s * 0.14, s - top); g.fillRect(s * 0.86, top, s * 0.14, s - top);
  g.fillStyle = face; g.fillRect(0, top, s, s * 0.14);
  g.strokeStyle = style.line; g.lineWidth = lw;
  g.strokeRect(0, top, s * 0.14, s - top); g.strokeRect(s * 0.86, top, s * 0.14, s - top); g.strokeRect(0, top, s, s * 0.14);
  // sign on the lintel, red while the door is up
  ell(g, s * 0.5, top + s * 0.07, s * 0.09, s * 0.06); g.fillStyle = P.linen; g.fill();
  drawSign(g, sign, s * 0.5, top + s * 0.07, s * 0.11, open > 0.5 ? P.red : P.ink, Math.max(1, s * 0.022));
  g.restore();
}

function drawColumn(g, x, y, s, style, seed) { // a papyrus column, or a dune-stele in Sokar's sand
  g.save(); g.translate(x, y);
  const lw = Math.max(1, s * 0.03);
  ell(g, 0, -s * 0.02, s * 0.32, s * 0.1); g.fillStyle = rgba(P.umberDeep, 0.22); g.fill();
  if (style.column === 'stele') {
    g.beginPath(); g.moveTo(-s * 0.26, 0); g.lineTo(-s * 0.26, -s * 0.85); g.quadraticCurveTo(0, -s * 1.15, s * 0.26, -s * 0.85); g.lineTo(s * 0.26, 0); g.closePath();
    fillStroke(g, style.wallTop, style.line, lw);
    drawSign(g, 'f', -s * 0.08, -s * 0.72, s * 0.22, P.ink, lw);
    g.strokeStyle = rgba(P.ink, 0.7); g.lineWidth = lw * 0.8;
    for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(-s * 0.18, -s * (0.5 - k * 0.11)); g.lineTo(s * 0.18, -s * (0.5 - k * 0.11)); g.stroke(); }
    g.restore(); return;
  }
  const H = s * 1.45;
  rrect(g, -s * 0.3, -s * 0.12, s * 0.6, s * 0.12, s * 0.04); fillStroke(g, style.wallFace, style.line, lw);
  poly(g, [-s * 0.2, -s * 0.12, -s * 0.18, -H + s * 0.4, s * 0.18, -H + s * 0.4, s * 0.2, -s * 0.12]); fillStroke(g, style.colShaft, style.line, lw);
  g.strokeStyle = rgba(P.ink, 0.35); g.lineWidth = lw * 0.7;
  for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(k * s * 0.08, -s * 0.14); g.lineTo(k * s * 0.07, -H + s * 0.42); g.stroke(); }
  for (let k = 0; k < 3; k++) { g.fillStyle = [P.red, style.band, P.red][k]; g.fillRect(-s * 0.185, -H + s * (0.48 + k * 0.05), s * 0.37, s * 0.035); }
  g.beginPath(); g.moveTo(-s * 0.18, -H + s * 0.4); g.quadraticCurveTo(-s * 0.4, -H + s * 0.15, -s * 0.32, -H); g.lineTo(s * 0.32, -H);
  g.quadraticCurveTo(s * 0.4, -H + s * 0.15, s * 0.18, -H + s * 0.4); g.closePath(); fillStroke(g, style.capital, style.line, lw);
  g.strokeStyle = rgba(P.ink, 0.45); g.lineWidth = lw * 0.7;
  for (let k = -2; k <= 2; k++) { g.beginPath(); g.moveTo(k * s * 0.04, -H + s * 0.38); g.lineTo(k * s * 0.12, -H + s * 0.02); g.stroke(); }
  rrect(g, -s * 0.24, -H - s * 0.08, s * 0.48, s * 0.08, s * 0.02); fillStroke(g, style.wallFace, style.line, lw);
  g.restore();
}

function drawThreshold(g, x, y, s) { // a reed mat at the door of the hour
  g.save(); g.translate(x, y);
  rrect(g, s * 0.1, s * 0.22, s * 0.8, s * 0.6, s * 0.05); fillStroke(g, '#CDAA5E', P.ink, Math.max(1, s * 0.025));
  g.strokeStyle = rgba(P.green, 0.8); g.lineWidth = Math.max(1, s * 0.03);
  for (let k = 1; k < 7; k++) { g.beginPath(); g.moveTo(s * (0.1 + k * 0.114), s * 0.24); g.lineTo(s * (0.1 + k * 0.114), s * 0.8); g.stroke(); }
  g.strokeStyle = rgba(P.red, 0.7); g.beginPath(); g.moveTo(s * 0.12, s * 0.52); g.lineTo(s * 0.88, s * 0.52); g.stroke();
  g.restore();
}

// The gate of the hour: a pylon with a winged disc and its keeper, a cobra.
function drawGate(g, x, y, s, t, open, style, balance) {
  g.save(); g.translate(x, y);
  const lw = Math.max(1, s * 0.03);
  if (balance) { drawBalanceSmall(g, s, t, open, lw); g.restore(); return; }
  const H = s * 1.45;
  g.fillStyle = rgba(P.gold, 0.15 + open * 0.55); g.fillRect(s * 0.28, -H + s * 0.9, s * 0.44, H - s * 0.9 + s);
  for (const sx of [0, 1]) { // two battered towers
    const outer = sx ? s * 1.06 : -s * 0.06, inner = sx ? s * 0.72 : s * 0.28;
    const lean = sx ? -s * 0.1 : s * 0.1;
    poly(g, [outer, s, inner, s, inner, -H + s * 0.55, outer + lean, -H + s * 0.55]);
    fillStroke(g, style.gateStone, style.line, lw);
    poly(g, [outer + lean - (sx ? -1 : 1) * s * 0.03, -H + s * 0.55, inner, -H + s * 0.55, inner, -H + s * 0.43, outer + lean - (sx ? -1 : 1) * s * 0.06, -H + s * 0.43]);
    fillStroke(g, style.name === 'sketch' ? style.gateStone : P.ochre, style.line, lw);
    g.strokeStyle = rgba(style.line, 0.3); g.lineWidth = lw * 0.7;
    for (let k = 1; k < 4; k++) { const yy = s - k * s * 0.42; g.beginPath(); g.moveTo(outer + lean * (1 - (yy + H) / (s + H)) * 0 + (sx ? -s * 0.03 : s * 0.03), yy); g.lineTo(inner, yy); g.stroke(); }
  }
  g.fillStyle = style.gateStone; g.fillRect(s * 0.26, -H + s * 0.75, s * 0.48, s * 0.22);
  g.strokeStyle = style.line; g.lineWidth = lw; g.strokeRect(s * 0.26, -H + s * 0.75, s * 0.48, s * 0.22);
  // winged disc
  const wy = -H + s * 0.86;
  for (const sx of [-1, 1]) { poly(g, [s * 0.5, wy, s * 0.5 + sx * s * 0.28, wy - s * 0.05, s * 0.5 + sx * s * 0.26, wy + s * 0.04]); fillStroke(g, P.blue, P.ink, lw * 0.7); }
  ell(g, s * 0.5, wy, s * 0.07, s * 0.07); fillStroke(g, P.red, P.ink, lw * 0.8);
  // doors of the gate
  const dw = s * 0.22 * (1 - open);
  g.fillStyle = P.wood; g.fillRect(s * 0.28, -H + s * 0.97, dw, H - s * 0.97 + s * 0.92); g.fillRect(s * 0.72 - dw, -H + s * 0.97, dw, H - s * 0.97 + s * 0.92);
  g.strokeStyle = P.ink; g.lineWidth = lw * 0.8;
  if (dw > 1) { g.strokeRect(s * 0.28, -H + s * 0.97, dw, H - s * 0.97 + s * 0.92); g.strokeRect(s * 0.72 - dw, -H + s * 0.97, dw, H - s * 0.97 + s * 0.92); }
  // the keeper: a rearing cobra on the right tower
  const sway = Math.sin(t * 1.3) * s * 0.03;
  g.save(); g.translate(s * 0.9 + sway, -H + s * 0.44);
  g.strokeStyle = P.ink; g.lineWidth = lw;
  g.beginPath(); g.moveTo(-s * 0.1, s * 0.04); g.quadraticCurveTo(s * 0.12, s * 0.04, s * 0.02, -s * 0.12);
  g.quadraticCurveTo(-s * 0.06, -s * 0.24, s * 0.02, -s * 0.34); g.lineWidth = s * 0.06; g.strokeStyle = P.green; g.stroke();
  g.lineWidth = lw; g.strokeStyle = P.ink; g.stroke();
  ell(g, s * 0.02, -s * 0.33, s * 0.07, s * 0.09); fillStroke(g, P.green, P.ink, lw);
  ell(g, s * 0.04, -s * 0.35, s * 0.012, s * 0.012); g.fillStyle = P.gold; g.fill();
  g.restore();
  g.restore();
}

function drawBalanceSmall(g, s, t, settle, lw) { // the great Balance over its pan, in the last hour
  const H = s * 1.32;
  g.strokeStyle = P.ink; g.lineWidth = lw;
  poly(g, [s * 0.42, s * 0.95, s * 0.58, s * 0.95, s * 0.55, -H + s * 0.5, s * 0.45, -H + s * 0.5]); fillStroke(g, P.gold, P.ink, lw);
  const tilt = Math.sin(t * 0.9) * 0.05 * (1 - settle);
  g.save(); g.translate(s * 0.5, -H + s * 0.5); g.rotate(tilt);
  g.fillStyle = P.wood; g.fillRect(-s * 0.8, -s * 0.035, s * 1.6, s * 0.07); g.strokeRect(-s * 0.8, -s * 0.035, s * 1.6, s * 0.07);
  drawSign(g, 'f', 0, -s * 0.16, s * 0.24, P.ink, lw);
  for (const sx of [-1, 1]) {
    g.save(); g.translate(sx * s * 0.72, 0); g.rotate(-tilt);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(-s * 0.17, s * 0.6); g.moveTo(0, 0); g.lineTo(s * 0.17, s * 0.6); g.stroke();
    ell(g, 0, s * 0.62, s * 0.2, s * 0.05); fillStroke(g, P.gold, P.ink, lw);
    if (sx > 0) drawSign(g, 'f', 0, s * 0.47, s * 0.24, P.ink, lw);
    g.restore();
  }
  g.restore();
}

function drawBarque(g, x, y, s, t) { // the night barque: papyrus hull, shrine, the sun inside
  g.save(); g.translate(x, y + Math.sin(t * 1.6) * s * 0.03);
  const lw = Math.max(1, s * 0.03);
  g.beginPath(); g.moveTo(-s * 0.9, -s * 0.3); g.quadraticCurveTo(-s * 0.7, s * 0.1, 0, s * 0.1); g.quadraticCurveTo(s * 0.7, s * 0.1, s * 0.95, -s * 0.35);
  g.quadraticCurveTo(s * 0.65, -s * 0.05, 0, -s * 0.05); g.quadraticCurveTo(-s * 0.6, -s * 0.05, -s * 0.9, -s * 0.3); g.closePath();
  fillStroke(g, P.ochre, P.ink, lw);
  g.strokeStyle = rgba(P.ink, 0.5); g.lineWidth = lw * 0.7;
  for (let k = -3; k <= 3; k++) { g.beginPath(); g.moveTo(k * s * 0.18, -s * 0.04); g.lineTo(k * s * 0.18, s * 0.08); g.stroke(); }
  for (const sx of [-1, 1]) { ell(g, sx * s * 0.93, -s * 0.38, s * 0.07, s * 0.05, sx * 0.5); fillStroke(g, P.green, P.ink, lw * 0.8); }
  // shrine
  g.fillStyle = P.linen; g.fillRect(-s * 0.28, -s * 0.5, s * 0.56, s * 0.45); g.strokeStyle = P.ink; g.lineWidth = lw; g.strokeRect(-s * 0.28, -s * 0.5, s * 0.56, s * 0.45);
  poly(g, [-s * 0.32, -s * 0.5, s * 0.32, -s * 0.5, s * 0.28, -s * 0.58, -s * 0.28, -s * 0.58]); fillStroke(g, P.blue, P.ink, lw);
  const glow = g.createRadialGradient(0, -s * 0.28, 0, 0, -s * 0.28, s * 0.7);
  glow.addColorStop(0, 'rgba(255,214,120,0.55)'); glow.addColorStop(1, 'rgba(255,214,120,0)');
  g.fillStyle = glow; g.fillRect(-s * 0.7, -s * 1, s * 1.4, s * 1.4);
  ell(g, 0, -s * 0.28, s * 0.13, s * 0.13); fillStroke(g, P.red, P.ink, lw);
  // a steersman at the stern
  g.strokeStyle = P.ink; g.lineWidth = lw * 1.1;
  g.beginPath(); g.moveTo(-s * 0.62, -s * 0.12); g.lineTo(-s * 0.62, -s * 0.42); g.moveTo(-s * 0.62, -s * 0.32); g.lineTo(-s * 0.85, s * 0.12); g.stroke();
  ell(g, -s * 0.62, -s * 0.47, s * 0.05, s * 0.05); g.fillStyle = P.ink; g.fill();
  g.restore();
}

function drawThoth(g, x, y, h, t) { // ibis-headed, writing in the record
  const pen = Math.sin(t * 5) * 0.5 + Math.sin(t * 13) * 0.3;
  drawMan(g, x, y, h, {
    facing: 1, head: 'ibis', wig: P.blueDeep, skin: '#A85A34', arms: 'write', pen, collarCols: [P.faience, P.gold, P.red],
    carry: (gg, hx, hy, lw) => { gg.save(); gg.translate(hx - 0.02, hy + 0.02); gg.rotate(-0.15);
      rrect(gg, -0.02, -0.015, 0.16, 0.03, 0.008); fillStroke(gg, P.linen, P.ink, lw); gg.restore(); },
  });
}

// Apep: a length of serpent along a path of points [x0,y0,x1,y1,...]
function drawSerpent(g, pts, w, t, opts) {
  const o = opts || {};
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  const path = () => { g.beginPath(); g.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length - 2; i += 2) g.quadraticCurveTo(pts[i], pts[i + 1], (pts[i] + pts[i + 2]) / 2, (pts[i + 1] + pts[i + 3]) / 2);
    g.lineTo(pts[pts.length - 2], pts[pts.length - 1]); };
  path(); g.strokeStyle = P.ink; g.lineWidth = w + 3; g.stroke();
  path(); g.strokeStyle = o.body || P.apep; g.lineWidth = w; g.stroke();
  g.setLineDash([w * 0.18, w * 0.5]); path(); g.strokeStyle = rgba(P.red, 0.85); g.lineWidth = w * 0.35; g.lineDashOffset = -t * w * 0.3; g.stroke();
  g.setLineDash([]);
  g.restore();
}
function drawSerpentHead(g, x, y, s, ang, gape) {
  g.save(); g.translate(x, y); g.rotate(ang);
  const lw = Math.max(1.2, s * 0.04);
  g.beginPath(); g.moveTo(-s * 0.2, -s * 0.18); g.quadraticCurveTo(s * 0.3, -s * 0.3, s * 0.55, -s * 0.05 - gape * s * 0.25);
  g.lineTo(s * 0.1, -s * 0.02 - gape * s * 0.05); g.lineTo(s * 0.5, s * 0.06 + gape * s * 0.2); g.quadraticCurveTo(s * 0.2, s * 0.25, -s * 0.2, s * 0.18); g.closePath();
  fillStroke(g, P.apep, P.ink, lw);
  if (gape > 0.1) { poly(g, [s * 0.14, -s * 0.03, s * 0.5, -s * 0.06 - gape * s * 0.22, s * 0.46, s * 0.05 + gape * s * 0.17]); g.fillStyle = P.red; g.fill(); }
  ell(g, s * 0.18, -s * 0.12, s * 0.04, s * 0.03); g.fillStyle = P.gold; g.fill();
  g.restore();
}
function drawKnife(g, x, y, s, ang) {
  g.save(); g.translate(x, y); g.rotate(ang);
  poly(g, [0, 0, s * 0.08, -s * 0.5, -s * 0.03, -s * 0.5]); fillStroke(g, '#D8D2C2', P.ink, Math.max(1, s * 0.04));
  rrect(g, -s * 0.05, -s * 0.72, s * 0.12, s * 0.24, s * 0.03); fillStroke(g, P.wood, P.ink, Math.max(1, s * 0.04));
  g.restore();
}

/* =====================================================================
   THE PAINTED HOUR  (the board: a wall in plan, figures in elevation)
   The hours are painted in the order a tomb was: red sketch on plaster,
   then black outline, then colour, then gold. Things that act in the
   hour (pans, doors, weights, figures) are always fully painted.
   ===================================================================== */

const STYLES = [
  { name: 'sketch', floor: P.plaster, floorShade: P.plasterShade, grid: 0.5, line: P.red, wallTop: '#E4D6B6', wallFace: '#D3C09A',
    hatch: true, colShaft: '#ECE2CB', capital: '#E4D6B6', band: P.redPale, gateStone: '#E6D9BA', column: 'column', sketch: 0 },
  { name: 'outline', floor: P.sand, floorShade: P.sandShade, grid: 0.26, line: P.ink, wallTop: '#CDAE72', wallFace: '#A9884F',
    courses: true, colShaft: '#D9BF8A', capital: '#C9A86A', band: P.green, gateStone: '#D5BB86', column: 'stele', sketch: 0.6 },
  { name: 'colour', floor: '#D8C391', floorShade: '#C3A86F', grid: 0.13, line: P.ink, wallTop: '#E6DCC4', wallFace: '#BBA67C',
    border: true, colShaft: '#E3D8BF', capital: P.green, band: P.blue, gateStone: '#E4D7B8', column: 'column', sketch: 0.35 },
  { name: 'gold', floor: P.alabaster, floorShade: '#DCCFB4', grid: 0.07, line: P.ink, wallTop: '#EADFC8', wallFace: '#C9B58C',
    border: true, frieze: true, colShaft: '#EFE6D2', capital: P.faience, band: P.blue, gateStone: '#EDE2C9', column: 'column', sketch: 0.15 },
];

function tileXY(L, i) { return [i % L.W, i / L.W | 0]; }
function isWallish(L, x, y) {
  if (x < 0 || y < 0 || x >= L.W || y >= L.H) return false;
  const t = L.tile[y * L.W + x];
  return t === T_WALL || t === T_DOOR;
}

// The parts of the hour that never move, painted once per hour and size.
function paintBoardCache(L, style, t, seed, dpr) {
  const W = L.W * t, H = L.H * t;
  const c = makeCanvas(W * dpr, H * dpr);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const r = rng(seed);
  paintPlaster(g, 0, 0, W, H, style.floor, seed, style.name === 'sketch' ? 1 : 0.7);
  // floors by kind
  for (let y = 0; y < L.H; y++) for (let x = 0; x < L.W; x++) {
    const i = y * L.W + x, tt = L.tile[i];
    const px = x * t, py = y * t;
    if (style.name === 'outline') { // wind-ripples in Sokar's sand
      g.strokeStyle = rgba(P.umber, 0.12); g.lineWidth = 1;
      for (let k = 0; k < 2; k++) { const yy = py + t * (0.3 + k * 0.4) + r() * 4; g.beginPath(); g.moveTo(px + 3, yy); g.quadraticCurveTo(px + t / 2, yy - 4, px + t - 3, yy); g.stroke(); }
    } else if (style.name === 'gold') { // alabaster flags
      g.strokeStyle = rgba(P.umber, 0.1); g.lineWidth = 1; g.strokeRect(px + 1.5, py + 1.5, t - 3, t - 3);
    } else if (style.name === 'colour' && tt !== T_POOL && tt !== T_COIL) {
      if (r() < 0.12) { g.strokeStyle = rgba(P.green, 0.5); g.lineWidth = 1.2; for (let k = 0; k < 3; k++) { const bx = px + t * (0.25 + r() * 0.5); g.beginPath(); g.moveTo(bx, py + t * 0.8); g.lineTo(bx + (r() - 0.5) * 6, py + t * (0.45 + r() * 0.2)); g.stroke(); } }
    }
    if (tt === T_COIL || tt === T_POOL) { // the river-mud under the serpent and the pools
      g.fillStyle = rgba('#7A5A36', 0.35); g.fillRect(px, py, t, t);
    }
  }
  // the draughtsman's red grid, under everything that is painted later
  g.strokeStyle = rgba(P.red, style.grid); g.lineWidth = Math.max(0.8, t * 0.025);
  for (let x = 0; x <= L.W; x++) handLine(g, x * t, 0, x * t, H, r, 1.2);
  for (let y = 0; y <= L.H; y++) handLine(g, 0, y * t, W, y * t, r, 1.2);
  // a ghost of the first sketch, offset from where the line finally went
  if (style.sketch > 0) {
    g.strokeStyle = rgba(P.red, 0.35 * style.sketch); g.lineWidth = 1;
    for (let y = 0; y < L.H; y++) for (let x = 0; x < L.W; x++) {
      if (!isWallish(L, x, y)) continue;
      if (!isWallish(L, x, y - 1)) handLine(g, x * t - 2, y * t - 3, x * t + t + 2, y * t - 2, r, 2);
    }
  }
  // walls: a top face and, where the floor drops away below, a front face
  for (let y = 0; y < L.H; y++) for (let x = 0; x < L.W; x++) {
    const i = y * L.W + x;
    if (L.tile[i] !== T_WALL) continue;
    paintWallTile(g, L, style, x, y, t, r);
  }
  // threshold and the start of things
  const [sx, sy] = tileXY(L, L.start);
  drawThreshold(g, sx * t, sy * t, t);
  return c;
}

function paintWallTile(g, L, style, x, y, t, r) {
  const px = x * t, py = y * t;
  const below = isWallish(L, x, y + 1);
  const faceH = below ? 0 : t * 0.3;
  g.fillStyle = style.wallTop; g.fillRect(px, py, t, t - faceH);
  if (faceH) { g.fillStyle = style.wallFace; g.fillRect(px, py + t - faceH, t, faceH); }
  g.save();
  g.beginPath(); g.rect(px, py, t, t - faceH); g.clip();
  if (style.hatch) {
    g.strokeStyle = rgba(P.red, 0.42); g.lineWidth = 1;
    for (let k = -t; k < t; k += t / 5) { g.beginPath(); g.moveTo(px + k, py + t); g.lineTo(px + k + t, py); g.stroke(); }
  } else if (style.courses) {
    g.fillStyle = rgba(P.umber, 0.12);
    for (let k = 0; k < 18; k++) g.fillRect(px + r() * t, py + r() * (t - faceH), 1.5, 1.5);
  }
  g.restore();
  // a column of text on the wall's top face: red sketch at first, ink later, colour at the end
  if (r() < 0.75) {
    const kind = r() * 8 | 0;
    const col = style.name === 'sketch' ? rgba(P.red, 0.5) : style.name === 'outline' ? rgba(P.ink, 0.45) :
      [P.blue, P.red, P.green][(x + y) % 3];
    drawDecoGlyph(g, kind, px + t / 2, py + (t - faceH) / 2, t * 0.42, col);
  }
  if (faceH && style.courses) {
    g.strokeStyle = rgba(P.ink, 0.35); g.lineWidth = 1;
    for (let k = 1; k < 3; k++) { g.beginPath(); g.moveTo(px, py + t - faceH + k * faceH / 3); g.lineTo(px + t, py + t - faceH + k * faceH / 3); g.stroke(); }
    for (let k = 0; k < 3; k++) { const off = (k % 2) * t / 4; for (let j = 0; j < 2; j++) { const bx = px + off + j * t / 2; g.beginPath(); g.moveTo(bx, py + t - faceH + k * faceH / 3); g.lineTo(bx, py + t - faceH + (k + 1) * faceH / 3); g.stroke(); } }
  }
  if (faceH && style.frieze) { // kheker: bundles of reeds tied at the top
    const n = 4, w = t / n;
    for (let k = 0; k < n; k++) {
      const bx = px + k * w;
      g.fillStyle = [P.red, P.blue, P.green, P.ochre][(x + k) % 4];
      g.fillRect(bx + w * 0.2, py + t - faceH + 2, w * 0.6, faceH - 4);
      g.fillStyle = P.linen; g.fillRect(bx + w * 0.2, py + t - faceH + faceH * 0.35, w * 0.6, 2);
    }
  } else if (faceH && style.border) { // block border along the face
    const n = 4, w = t / n;
    for (let k = 0; k < n; k++) { g.fillStyle = [P.blue, P.red, P.green, P.ochre][(x * 2 + k) % 4]; g.fillRect(px + k * w + 1, py + t - faceH * 0.62, w - 2, faceH * 0.36); }
  }
  if (style.border) { // a painted band on the top face where it meets open floor
    const bw = t * 0.09;
    const edges = [[!isWallish(L, x, y - 1), px, py, t, bw], [!isWallish(L, x - 1, y), px, py, bw, t - faceH], [!isWallish(L, x + 1, y), px + t - bw, py, bw, t - faceH]];
    for (const [on, ex, ey, ew, eh] of edges) if (on) { g.fillStyle = P.ochre; g.fillRect(ex, ey, ew, eh); }
  }
  // edges in line colour
  g.strokeStyle = style.line; g.lineWidth = Math.max(1, t * 0.035); g.lineCap = 'square';
  const ln = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
  if (!isWallish(L, x, y - 1)) ln(px, py, px + t, py);
  if (!isWallish(L, x - 1, y)) ln(px, py, px, py + t);
  if (!isWallish(L, x + 1, y)) ln(px + t, py, px + t, py + t);
  if (faceH) { ln(px, py + t, px + t, py + t); g.lineWidth = Math.max(0.8, t * 0.02); ln(px, py + t - faceH, px + t, py + t - faceH); }
}

/* ---------------- the moving hour ---------------- */

// Interpolated view of the hour between two states (the renderer's only job).
function bodyLook(L, view, b, t) {
  const st = view.to, prev = view.from;
  const out = st.outs ? st.outs[b] : null;
  const sameTurn = prev && prev.turning === st.turning && prev.pos.length === st.pos.length;
  let [x, y] = tileXY(L, st.pos[b]);
  let fx = x, fy = y, walk = 0, bumpOff = 0;
  if (sameTurn && view.k < 1 && out) {
    const [px, py] = tileXY(L, prev.pos[b]);
    const e = ease(view.k);
    if (out.k === 'walk' || out.k === 'push') { fx = lerp(px, x, e); fy = lerp(py, y, e); walk = view.k; }
    else if (out.k === 'bump') { const d = DIR[out.d]; const a = Math.sin(Math.PI * view.k) * 0.16; fx = x + d[0] * a; fy = y + d[1] * a; bumpOff = a; }
  }
  return { x: fx, y: fy, walk, bumpOff, out };
}

function weightLook(L, view, w) {
  const st = view.to, prev = view.from;
  const pos = st.weights[w];
  const sameTurn = prev && prev.turning === st.turning;
  if (pos < 0) { // sunk this turning
    if (sameTurn && prev.weights[w] >= 0 && view.k < 1) {
      // find the pool it went into
      const pushed = (st.outs || []).find(o => o && o.k === 'push' && o.w === w);
      if (pushed) {
        const [ax, ay] = tileXY(L, prev.weights[w]), [bx, by] = tileXY(L, pushed.wto);
        const e = ease(view.k);
        return { x: lerp(ax, bx, e), y: lerp(ay, by, e), sink: clamp((view.k - 0.5) * 2, 0, 1) };
      }
    }
    return null;
  }
  const [x, y] = tileXY(L, pos);
  if (sameTurn && view.k < 1 && prev.weights[w] >= 0 && prev.weights[w] !== pos) {
    const [px, py] = tileXY(L, prev.weights[w]);
    const e = ease(view.k);
    return { x: lerp(px, x, e), y: lerp(py, y, e), sink: 0 };
  }
  return { x, y, sink: 0 };
}

function answererMat(rec) { return rec.who === 'tamit' ? TAMIT_MAT : MATS[rec.n % MATS.length]; }

// Draw everything that moves or changes, sorted so nearer things cover farther ones.
function drawHourScene(g, R, L, view, t) {
  const st = view.to;
  const T = R.tile, bx = R.bx, by = R.by;
  const style = R.style;
  const live = st.recs.length;
  const sprites = [];
  const X = x => bx + x * T, Y = y => by + y * T;

  // pools (water moves; footings show their stone)
  for (let k = 0; k < L.pools.length; k++) {
    const [x, y] = tileXY(L, L.pools[k]);
    const px = X(x), py = Y(y);
    g.save(); g.beginPath(); g.rect(px + 1, py + 1, T - 2, T - 2); g.clip();
    g.fillStyle = P.water; g.fillRect(px, py, T, T);
    g.strokeStyle = rgba(P.ink, 0.55); g.lineWidth = Math.max(1, T * 0.03);
    for (let row = 0; row < 3; row++) {
      const yy = py + T * (0.25 + row * 0.25), ph = t * 1.2 + row * 1.7 + x;
      g.beginPath();
      for (let j = 0; j <= 8; j++) { const xx = px - T * 0.2 + j * T * 0.18 + (ph % 1) * T * 0.18; g.lineTo(xx, yy + (j % 2 ? -T * 0.06 : T * 0.06)); }
      g.stroke();
    }
    if (st.ford[k]) {
      rrect(g, px + T * 0.14, py + T * 0.18, T * 0.72, T * 0.6, T * 0.1); fillStroke(g, P.granite, P.ink, Math.max(1, T * 0.03));
      g.fillStyle = rgba(P.linen, 0.25); g.fillRect(px + T * 0.2, py + T * 0.22, T * 0.6, T * 0.08);
    }
    g.restore();
    g.strokeStyle = P.ink; g.lineWidth = Math.max(1, T * 0.03); g.strokeRect(px + 1, py + 1, T - 2, T - 2);
  }
  // pans
  for (let k = 0; k < L.pans.length; k++) {
    const p = L.pans[k];
    const [x, y] = tileXY(L, p.i);
    R.panAnim[k] = lerp(R.panAnim[k] == null ? 0 : R.panAnim[k], st.panW[k] ? 1 : 0, 0.25);
    drawPan(g, X(x) + T / 2, Y(y) + T * 0.55, T, p.sign, R.panAnim[k], false);
  }
  // footprints of what is written next (the red sketch of the coming strokes)
  if (st.status === 'play') {
    for (let b = 0; b < live; b++) {
      const rec = st.recs[b];
      for (let j = 0; j < 3; j++) {
        const o = rec.outs[st.stroke + j];
        if (!o || (o.k !== 'walk' && o.k !== 'push')) continue;
        const [x, y] = tileXY(L, o.to);
        drawStepGlyph(g, o.d, o, X(x) + T / 2, Y(y) + T / 2, T * 0.42, rgba(rec.who === 'tamit' ? P.clay : P.red, 0.62 - j * 0.18));
      }
    }
  }
  // where a lie was told
  if (st.status === 'lie') {
    const lie = st.lie;
    const tgt = lie.actual.at != null && lie.actual.at >= 0 ? lie.actual.at : lie.expected.to != null ? lie.expected.to : st.pos[lie.body];
    const [x, y] = tileXY(L, tgt);
    const pulse = 0.5 + 0.5 * Math.sin(t * 6);
    g.strokeStyle = rgba(P.red, 0.6 + 0.4 * pulse); g.lineWidth = Math.max(2, T * 0.08);
    g.strokeRect(X(x) + 3, Y(y) + 3, T - 6, T - 6);
    g.fillStyle = rgba(P.red, 0.18 + 0.12 * pulse); g.fillRect(X(x) + 3, Y(y) + 3, T - 6, T - 6);
    const a = lie.actual;
    if (a.k === 'bump' && a.by === 'weight' && a.at >= 0) { // and what stood behind the weight
      const [fx, fy] = tileXY(L, a.from);
      const bx = x + (x - fx), by2 = y + (y - fy);
      if (bx >= 0 && by2 >= 0 && bx < L.W && by2 < L.H) {
        g.save(); g.setLineDash([T * 0.12, T * 0.08]); g.strokeStyle = rgba(P.red, 0.55 + 0.4 * pulse); g.lineWidth = Math.max(2, T * 0.06);
        g.strokeRect(X(bx) + 4, Y(by2) + 4, T - 8, T - 8); g.restore();
      }
    }
  }

  // doors
  for (let k = 0; k < L.doors.length; k++) {
    const d = L.doors[k];
    const [x, y] = tileXY(L, d.i);
    R.doorAnim[k] = lerp(R.doorAnim[k] == null ? (st.doors[k] ? 1 : 0) : R.doorAnim[k], st.doors[k] ? 1 : 0, 0.22);
    const open = R.doorAnim[k];
    sprites.push({ y: Y(y) + T * 0.45, f: () => drawDoor(g, X(x), Y(y), T, d.sign, open, style) });
  }
  // columns, steles
  for (let i = 0; i < L.tile.length; i++) {
    if (L.tile[i] !== T_PILLAR) continue;
    const [x, y] = tileXY(L, i);
    sprites.push({ y: Y(y) + T * 0.9, f: () => drawColumn(g, X(x) + T / 2, Y(y) + T * 0.92, T, style, i) });
  }
  // the gate
  {
    const [x, y] = tileXY(L, L.gate);
    const open = R.gateOpen || 0;
    sprites.push({ y: Y(y) + T * 0.5, f: () => drawGate(g, X(x), Y(y), T, t, open, style, L.def.id === 'XII') });
  }
  // the coils of Apep lying in the seventh hour
  if (L.tile.some(v => v === T_COIL)) sprites.push({ y: -1e9, f: () => drawCoilRow(g, R, L, t) });
  // bull-weights
  for (let w = 0; w < st.weights.length; w++) {
    const lk = weightLook(L, view, w);
    if (!lk) continue;
    sprites.push({ y: Y(lk.y) + T * 0.86, f: () => {
      g.save();
      if (lk.sink > 0) { g.beginPath(); g.rect(X(lk.x) - T, Y(lk.y) - T, T * 3, T * 1.8); g.clip(); g.globalAlpha = 1 - lk.sink * 0.8; }
      drawWeight(g, X(lk.x) + T / 2, Y(lk.y) + T * 0.82 + lk.sink * T * 0.4, T, w + 1);
      g.restore();
    } });
  }
  // the part of you, lying on the floor
  if (st.itemBy < 0 && st.itemPos >= 0) {
    const [x, y] = tileXY(L, st.itemPos);
    const kind = L.def.item;
    sprites.push({ y: Y(y) + T * 0.7, f: () => {
      ell(g, X(x) + T / 2, Y(y) + T * 0.72, T * 0.26, T * 0.07); g.fillStyle = rgba(P.umberDeep, 0.2); g.fill();
      if (kind === 'heart') { g.save(); g.globalAlpha = 0.4 + 0.25 * Math.sin(t * 2.6); ell(g, X(x) + T / 2, Y(y) + T * 0.45, T * 0.45, T * 0.45); g.fillStyle = rgba(P.gold, 0.35); g.fill(); g.restore(); }
      drawItem(g, kind, X(x) + T / 2, Y(y) + T * (kind === 'shadow' ? 0.6 : kind === 'ba' ? 0.78 : 0.55), T * (kind === 'ba' ? 0.9 : 0.8), t + x, false);
    } });
  }
  // figures
  for (let b = 0; b <= live; b++) {
    const lk = bodyLook(L, view, b, t);
    const isLive = b === live;
    const carrying = st.itemBy === b;
    const cx = X(lk.x) + T / 2, cy = Y(lk.y) + T * 0.86;
    // figures sharing the threshold stand a little apart
    let spread = 0;
    if (st.pos[b] === L.start) { const at = []; for (let k = 0; k <= live; k++) if (st.pos[k] === L.start) at.push(k); if (at.length > 1) spread = (at.indexOf(b) - (at.length - 1) / 2) * T * 0.28; }
    const shadowX = (cx - R.lightX) / Math.max(1, R.bw) * T * 0.35;
    sprites.push({ y: cy + (isLive ? 0.01 : 0), f: () => {
      ell(g, cx + spread + shadowX, cy + T * 0.02, T * 0.24, T * 0.06); g.fillStyle = rgba(P.umberDeep, 0.22); g.fill();
      if (isLive) { g.save(); if (st.status === 'won') g.globalAlpha = 1 - 0.75 * (R.gateOpen || 0); drawHoriAt(g, R, L, st, b, cx + spread, cy, T, lk, t, carrying); g.restore(); }
      else drawAnswererAt(g, R, L, st, b, cx + spread, cy, T, lk, t, carrying, view);
    } });
  }
  sprites.sort((a, b) => a.y - b.y);
  for (const s of sprites) s.f();
}

function itemCarryFn(kind, t) {
  return (gg, hx, hy, lw) => {
    if (kind === 'shadow') return;
    gg.save(); gg.translate(hx, hy);
    // units here are the figure's height
    if (kind === 'ba') drawItem(gg, 'ba', 0.02, -0.02, 0.3, t, true, lw);
    else if (kind === 'heart') drawItem(gg, 'heart', 0.03, 0.0, 0.2, t, true, lw);
    else drawItem(gg, 'name', 0.04, -0.01, 0.2, t, true, lw);
    gg.restore();
  };
}

function drawHoriAt(g, R, L, st, b, cx, cy, T, lk, t, carrying) {
  const kind = L.def.item;
  const H = T * 1.5;
  const parity = st.stroke % 2 ? 1 : -1;
  const facing = st.facing[b];
  const idleBob = lk.walk ? 0 : Math.sin(t * 1.8) * 0.004;
  const blink = (t % 4.3) < 0.12;
  if (carrying && kind === 'shadow') { // the shadow at his heels again
    g.save(); g.globalAlpha = 0.55;
    g.translate(cx - facing * T * 0.22, cy); g.transform(1, 0, -0.5 * facing, 0.45, 0, 0);
    drawMan(g, 0, 0, H, { facing, silhouette: P.apep, walkP: lk.walk, lead: parity, arms: 'swing' });
    g.restore();
  }
  drawMan(g, cx, cy, H, {
    facing, walkP: lk.walk, lead: parity, bob: idleBob - (lk.walk ? Math.sin(Math.PI * lk.walk) * 0.012 : 0),
    arms: carrying && kind !== 'shadow' ? 'carry' : 'swing', palette: !carrying, brush: true, blink,
    carry: carrying && kind !== 'shadow' ? itemCarryFn(kind, t) : null,
  });
  if (st.status === 'lie' && R.lieK > 0) { /* Hori is not the liar; nothing extra */ }
}

function drawAnswererAt(g, R, L, st, b, cx, cy, T, lk, t, carrying, view) {
  const rec = st.recs[b];
  const mat = answererMat(rec);
  const child = rec.who === 'tamit';
  const H = T * (child ? 1.0 : 1.18);
  const hop = lk.walk ? Math.sin(Math.PI * lk.walk) : 0;
  const resting = st.stroke >= rec.inputs.length && st.status === 'play';
  const isLiar = st.status === 'lie' && st.lie.body === b;
  const shake = isLiar ? Math.sin(t * 40) * T * 0.02 * Math.min(1, R.lieK * 2) : 0;
  if (isLiar) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 6);
    ell(g, cx, cy - H * 0.5, T * 0.55, H * 0.66); g.fillStyle = rgba(P.red, 0.16 + 0.12 * pulse); g.fill();
    ell(g, cx, cy, T * 0.42, T * 0.13); g.strokeStyle = rgba(P.red, 0.6 + 0.4 * pulse); g.lineWidth = Math.max(2, T * 0.06); g.stroke();
  }
  drawShabti(g, cx + shake, cy, H, {
    mat, child, lift: hop * 0.12, squash: lk.walk && lk.walk > 0.85 ? (1 - lk.walk) * 4 : 0,
    tilt: child ? -0.06 + Math.sin(t * 1.4 + b) * 0.02 : Math.sin(t * 1.1 + b * 2) * 0.012,
    rest: resting, cracked: isLiar && R.lieK > 0.35, seed: (rec.born + 1) * 977 + rec.n * 31,
    carryFn: carrying ? (gg, hx, hy, lw) => { gg.save(); gg.translate(0, L.def.item === 'ba' ? -0.98 : -0.6); if (L.def.item === 'shadow') { gg.globalAlpha = 0.85; }
      drawItem(gg, L.def.item, 0, 0, L.def.item === 'ba' ? 0.34 : 0.28, t, true, lw); gg.restore(); } : null,
  });
}

// The serpent lying across the seventh hour: one body, pinned with knives,
// dipping under the pools.
function drawCoilRow(g, R, L, t) {
  const T = R.tile;
  const rows = {};
  for (let i = 0; i < L.tile.length; i++) if (L.tile[i] === T_COIL || L.tile[i] === T_POOL) { const [x, y] = tileXY(L, i); (rows[y] = rows[y] || []).push(x); }
  for (const yk of Object.keys(rows)) {
    const y = +yk, xs = rows[y].sort((a, b) => a - b);
    const pts = [];
    for (let x = xs[0]; x <= xs[xs.length - 1]; x += 0.25) pts.push(R.bx + (x + 0.5) * T, R.by + (y + 0.55) * T + Math.sin(x * 1.3 + t * 0.6) * T * 0.14);
    // above water only where the coil is
    g.save();
    g.beginPath();
    for (const x of xs) if (L.tile[y * L.W + x] === T_COIL) g.rect(R.bx + x * T - 1, R.by + y * T - T * 0.3, T + 2, T * 1.3);
    g.clip();
    drawSerpent(g, pts, T * 0.42, t);
    g.restore();
    // knives of Isis and Serqet
    for (let k = 0; k < xs.length; k += 3) {
      const x = xs[k];
      if (L.tile[y * L.W + x] !== T_COIL) continue;
      drawKnife(g, R.bx + (x + 0.5) * T, R.by + (y + 0.5) * T + Math.sin(x * 1.3 + t * 0.6) * T * 0.14, T * 0.55, -0.35 + (k % 2) * 0.7);
    }
    // his head at the east end, watching
    const hx = R.bx + (xs[xs.length - 1] + 0.75) * T, hy = R.by + (y + 0.45) * T + Math.sin(xs[xs.length - 1] * 1.3 + t * 0.6) * T * 0.14;
    drawSerpentHead(g, hx, hy, T * 0.7, -0.15 + Math.sin(t * 0.8) * 0.06, 0.15 + Math.max(0, Math.sin(t * 0.5)) * 0.15);
  }
}

/* =====================================================================
   THE WALL AROUND THE HOUR  (layout and the diegetic instruments)
   The stroke counter is the barque rowing star to star along the sky;
   the record of inputs is a papyrus in Thoth's hand; the answerers wait
   in their painted box; Thoth himself sits in the margin and writes.
   ===================================================================== */

function computeLayout(cw, ch, L) {
  const W = L ? L.W : 14, H = L ? L.H : 12;
  const lay = { cw, ch };
  const landscape = cw >= 880 && cw / ch >= 1.12 && ch >= 560;
  lay.landscape = landscape;
  if (!landscape && cw / ch >= 1.3) { // a phone on its side: the hour on the left, the rest on the right
    const pad = 8;
    const fs = clamp(Math.round(ch / 30), 11, 15);
    lay.fs = fs; lay.compact = true;
    const rw = Math.round(clamp(cw * 0.4, 230, 380));
    const lw = cw - rw - pad * 3;
    const bandH = 30;
    let tile = Math.floor(Math.min(lw / W, (ch - pad * 2 - bandH - 4) / (H + 0.4)));
    tile = clamp(tile, 10, 64);
    const bw = tile * W, bh = tile * H;
    const bx = Math.round(pad + (lw - bw) / 2);
    lay.band = { x: bx, y: pad, w: bw, h: bandH, ownCols: true };
    lay.board = { x: bx, y: Math.round(pad + bandH + tile * 0.4), w: bw, h: bh, tile };
    const rx = cw - rw - pad;
    const msgH = Math.round(fs * 1.38 * 3.4 + 16);
    const rows = 5, rowH = 11;
    const papH = 18 + rows * rowH;
    lay.msg = { x: rx, y: pad, w: rw, h: msgH };
    lay.papyrus = { x: rx, y: pad + msgH + 4, w: rw, h: papH, rowH, rows };
    lay.ctrl = { x: rx, y: pad + msgH + papH + 10, w: rw, h: ch - (pad + msgH + papH + 10) - pad };
    return lay;
  }
  if (landscape) {
    const pad = Math.round(clamp(cw * 0.012, 10, 20));
    const leftW = Math.round(clamp(cw * 0.25, 250, 380));
    const rightW = Math.round(clamp(cw * 0.17, 190, 260));
    const cx0 = pad * 2 + leftW, cx1 = cw - pad * 2 - rightW;
    const centerW = cx1 - cx0;
    const rows = 5, rowH = clamp(Math.round(ch * 0.022), 15, 21);
    const papH = 26 + rows * rowH;
    const bandH = clamp(Math.round(ch * 0.07), 44, 66);
    let tile = Math.floor(Math.min(centerW / W, (ch - pad * 2 - bandH - papH - 30) / (H + 0.6)));
    tile = clamp(tile, 16, 72);
    const bw = tile * W, bh = tile * H;
    const bx = Math.round(cx0 + (centerW - bw) / 2);
    const total = bandH + tile * 0.6 + bh + 20 + papH;
    const y0 = Math.round(Math.max(pad, (ch - total) / 2));
    lay.band = { x: bx, y: y0, w: bw, h: bandH };
    lay.board = { x: bx, y: Math.round(y0 + bandH + tile * 0.6), w: bw, h: bh, tile };
    lay.papyrus = { x: bx, y: lay.board.y + bh + 20, w: bw, h: papH, rowH, rows };
    lay.left = { x: pad, y: pad, w: leftW, h: ch - pad * 2 };
    lay.right = { x: cw - pad - rightW, y: pad, w: rightW, h: ch - pad * 2 };
    lay.fs = clamp(Math.round(Math.min(cw / 92, ch / 52)), 13, 19);
  } else {
    const pad = 10;
    const fs = clamp(Math.round(cw / 30), 12, 16);
    lay.fs = fs;
    const bandH = 40;
    const rows = 5, rowH = 13;
    const papH = 22 + rows * rowH;
    const msgH = Math.round(fs * 1.38 * 4 + 18);
    const ctrlH = clamp(Math.round(cw * 0.36), 118, 170);
    let tile = Math.floor(Math.min((cw - pad * 2) / W, (ch - pad * 2 - bandH - papH - msgH - ctrlH - 24) / (H + 0.6)));
    tile = clamp(tile, 12, 64);
    const bw = tile * W, bh = tile * H;
    const bx = Math.round((cw - bw) / 2);
    let y = pad;
    lay.band = { x: pad, y, w: cw - pad * 2, h: bandH }; y += bandH + tile * 0.6;
    lay.board = { x: bx, y: Math.round(y), w: bw, h: bh, tile }; y += bh + 14;
    lay.papyrus = { x: pad, y: Math.round(y), w: cw - pad * 2, h: papH, rowH, rows }; y += papH + 6;
    lay.msg = { x: pad, y: Math.round(y), w: cw - pad * 2, h: msgH }; y += msgH + 4;
    lay.ctrl = { x: pad, y: Math.round(y), w: cw - pad * 2, h: Math.max(ctrlH, ch - y - pad) };
  }
  return lay;
}

// The wall behind everything: plaster, a frieze, the register lines.
function paintWall(cw, ch, seed, paint, dpr) {
  const c = makeCanvas(cw * dpr, ch * dpr);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  paintPlaster(g, 0, 0, cw, ch, P.plaster, seed, 1);
  const vg = g.createRadialGradient(cw / 2, ch * 0.42, Math.min(cw, ch) * 0.2, cw / 2, ch / 2, Math.max(cw, ch) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, rgba(P.umber, 0.32));
  g.fillStyle = vg; g.fillRect(0, 0, cw, ch);
  // kheker frieze along the top, painted only as far as the hour is finished
  const fh = 12;
  for (let x = 0, k = 0; x < cw; x += 10, k++) {
    if (paint < 1) { g.strokeStyle = rgba(P.red, 0.5); g.lineWidth = 1; g.strokeRect(x + 2, 2, 6, fh); continue; }
    g.fillStyle = [P.red, P.blue, P.green, P.ochre][k % 4]; g.fillRect(x + 2, 2, 6, fh);
    g.fillStyle = P.linen; g.fillRect(x + 2, 6, 6, 1.5);
  }
  g.strokeStyle = paint < 1 ? rgba(P.red, 0.6) : P.ink; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(0, fh + 5); g.lineTo(cw, fh + 5); g.stroke();
  return c;
}

// Frame of the board: a painted border, red sketch in the first hour.
function drawBoardFrame(g, lay, style, paint) {
  const b = lay.board, m = Math.max(4, b.tile * 0.14);
  if (paint === 0) {
    g.strokeStyle = P.red; g.lineWidth = 2; g.strokeRect(b.x - m, b.y - m, b.w + m * 2, b.h + m * 2);
    g.lineWidth = 1; g.strokeRect(b.x - m * 0.4, b.y - m * 0.4, b.w + m * 0.8, b.h + m * 0.8);
    return;
  }
  g.fillStyle = paint >= 2 ? P.ochre : '#B99456';
  g.fillRect(b.x - m, b.y - m, b.w + m * 2, m); g.fillRect(b.x - m, b.y + b.h, b.w + m * 2, m);
  g.fillRect(b.x - m, b.y, m, b.h); g.fillRect(b.x + b.w, b.y, m, b.h);
  if (paint >= 2) { // block border
    const seg = m * 2.2;
    const cols = [P.blue, P.red, P.green, P.red];
    let k = 0;
    for (let x = b.x - m; x < b.x + b.w + m; x += seg, k++) {
      g.fillStyle = cols[k % 4];
      g.fillRect(x + 1, b.y - m + 1.5, Math.min(seg - 2, b.x + b.w + m - x - 1), m - 3);
      g.fillRect(x + 1, b.y + b.h + 1.5, Math.min(seg - 2, b.x + b.w + m - x - 1), m - 3);
    }
    k = 0;
    for (let y = b.y; y < b.y + b.h; y += seg, k++) {
      g.fillStyle = cols[(k + 1) % 4];
      g.fillRect(b.x - m + 1.5, y + 1, m - 3, Math.min(seg - 2, b.y + b.h - y - 1));
      g.fillRect(b.x + b.w + 1.5, y + 1, m - 3, Math.min(seg - 2, b.y + b.h - y - 1));

  }
  g.strokeStyle = P.ink; g.lineWidth = 1.5;
  g.strokeRect(b.x - m, b.y - m, b.w + m * 2, b.h + m * 2);
  g.strokeRect(b.x - 0.5, b.y - 0.5, b.w + 1, b.h + 1);
}

/* ---------- the barque's road: forty-two stars on the sky ---------- */
function strokeX(lay, k) { // x of the k-th star (1..N), shared with the papyrus columns
  const p = lay.papyrus, lab = papLabelW(lay);
  const win = papWindow(lay);
  return p.x + lab + ((k - 1 - win.from) + 0.5) * win.cell;
}
function papLabelW(lay) { return lay.landscape ? clamp(Math.round(lay.papyrus.w * 0.12), 62, 96) : 44; }
function papWindow(lay, stroke) {
  const lab = papLabelW(lay);
  const avail = lay.papyrus.w - lab - 6;
  let cell = avail / N_STROKES;
  if (cell >= 10) return { from: 0, count: N_STROKES, cell };
  const count = Math.max(8, Math.floor(avail / 11));
  cell = avail / count;
  const s = stroke == null ? (lay._stroke || 0) : stroke;
  const from = clamp(s - Math.floor(count * 0.6), 0, N_STROKES - count);
  return { from, count, cell };
}

function drawBand(g, lay, st, view, t, title) {
  const b = lay.band;
  const y = b.y + b.h * 0.62, h = b.h * 0.3;
  // the sky sign: a long slab with its ends turned down
  g.save();
  poly(g, [b.x - 8, y + h + 6, b.x - 4, y, b.x + b.w + 4, y, b.x + b.w + 8, y + h + 6, b.x + b.w - 2, y + h + 6, b.x + b.w - 4, y + h, b.x + 4, y + h, b.x + 2, y + h + 6]);
  fillStroke(g, P.blue, P.ink, 1.5);
  g.restore();
  const win = papWindow(lay, st.stroke);
  const sx = k => b.ownCols ? b.x + 6 + (k - 0.5) * (b.w - 12) / N_STROKES : strokeX(lay, k);
  for (let k = 1; k <= N_STROKES; k++) {
    if (!b.ownCols && (k - 1 < win.from || k - 1 >= win.from + win.count)) continue;
    const x = sx(k);
    const done = k <= st.stroke;
    star(g, x, y + h / 2, b.ownCols ? Math.min((b.w - 12) / N_STROKES * 0.45, h * 0.42) : Math.min(win.cell * 0.42, h * 0.42), done ? P.red : P.gold);
  }
  // the barque between the star it left and the star it rows toward
  const prev = view.from && view.from.turning === st.turning ? view.from.stroke : st.stroke;
  const sk = lerp(prev, st.stroke, ease(view.k));
  const cellW = b.ownCols ? (b.w - 12) / N_STROKES : win.cell;
  const at = k => b.ownCols ? b.x + 6 + (k - 0.5) * cellW : strokeX(lay, k);
  const bxp = st.stroke === 0 && sk === 0 ? at(1) - cellW * 0.9 : at(Math.max(1, sk)) + (sk < 1 ? (sk - 1) * cellW : 0);
  lay._barqueX = clamp(bxp, b.x, b.x + b.w);
  drawBarque(g, lay._barqueX, y - b.h * 0.06, b.h * 0.5, t);
  // numerals: strokes rowed so far

}
function star(g, x, y, r, col) {

}

/* ---------- the record: a papyrus with every stroke written ---------- */
function drawPapyrus(g, lay, L, st, t, cache, dpr) {
  const p = lay.papyrus;
  const key = p.w + 'x' + p.h + '@' + dpr;
  if (!cache.pap || cache.papKey !== key) {
    cache.pap = makeCanvas(p.w * dpr, p.h * dpr); cache.papKey = key;
    const pg = cache.pap.getContext('2d');
    pg.scale(dpr, dpr);
    paintPapyrus(pg, 0, 0, p.w, p.h, 11);
    pg.strokeStyle = rgba(P.umber, 0.5); pg.lineWidth = 1; pg.strokeRect(0.5, 0.5, p.w - 1, p.h - 1);
  }

  g.shadowColor = rgba(P.umberDeep, 0.35); g.shadowBlur = 8; g.shadowOffsetY = 2;

  const rows = [{ who: 'you' }].concat(st.recs.map((r, i) => ({ rec: r, b: i })));

  g.font = font(fs, 'italic');
  g.textBaseline = 'middle';
  const top = p.y + (lay.landscape ? 20 : 16);
  // column guides every ten strokes
  for (let k = 10; k < N_STROKES; k += 10) {
    if (k < win.from || k > win.from + win.count) continue;

    g.strokeStyle = rgba(P.red, 0.25); g.lineWidth = 1; g.beginPath(); g.moveTo(x, p.y + 6); g.lineTo(x, p.y + p.h - 4); g.stroke();
  }
  g.fillStyle = P.red; g.font = font(fs * 0.9, 'italic');
  g.fillText(TXT.turningLabel(st.turning), p.x + 6, p.y + (lay.landscape ? 10 : 8));
  g.font = font(fs, 'italic');
  rows.forEach((row, ri) => {
    const y = top + ri * p.rowH + p.rowH / 2;
    if (row.who === 'you') { g.fillStyle = P.ink; g.fillText(TXT.papyrusYou, p.x + 8, y); }
    else {
      const m = answererMat(row.rec);
      rrect(g, p.x + 6, y - p.rowH * 0.32, p.rowH * 0.5, p.rowH * 0.64, 2); fillStroke(g, m.body, P.ink, 1);
      g.fillStyle = P.ink;
      const name = row.rec.who === 'tamit' ? 'hers' : MATERIAL[row.rec.n];
      if (g.measureText(name).width + p.rowH * 0.6 + 10 < lab) g.fillText(name, p.x + 8 + p.rowH * 0.6, y);
    }
    const toks = row.who === 'you' ? st.liveIn : row.rec.inputs.split('');
    const outs = row.who === 'you' ? st.liveOut : row.rec.outs;
    const isLiar = st.status === 'lie' && row.b === st.lie.body;
    for (let k = win.from; k < win.from + win.count; k++) {
      const x = p.x + lab + (k - win.from + 0.5) * win.cell;
      if (k < toks.length) {
        const future = row.who !== 'you' && k >= st.stroke;
        let col = future ? rgba(P.ink, 0.42) : P.ink;
        if (isLiar && k === st.lie.stroke - 1) col = P.red;
        drawStepGlyph(g, toks[k], outs[k], x, y, Math.min(win.cell * 0.8, p.rowH * 0.78), col);
      } else if (row.who !== 'you' && k >= toks.length && toks.length > 0) {

  if (st.stroke >= win.from && st.stroke <= win.from + win.count) {
    g.strokeStyle = P.red; g.lineWidth = 2; g.beginPath(); g.moveTo(nx, p.y + 3); g.lineTo(nx, p.y + p.h - 3); g.stroke();
  }
  g.textBaseline = 'alphabetic';
}

/* ---------- the box of answerers ---------- */
function drawBox(g, x, y, w, L, st, t) {
  const h = w * 0.62;
  const lidH = h * 0.18;
  // vaulted lid and body of a painted wooden shabti box
  g.beginPath(); g.moveTo(x, y + lidH); g.quadraticCurveTo(x + w / 2, y - lidH * 0.6, x + w, y + lidH); g.closePath();
  fillStroke(g, P.wood, P.ink, 1.5);
  g.fillStyle = P.ink; g.font = font(Math.max(11, w * 0.06), 'italic'); g.textAlign = 'center';
  g.fillStyle = P.gold; g.fillText(TXT.boxTitle, x + w / 2, y + lidH * 0.7);
  rrect(g, x, y + lidH, w, h - lidH, 3); fillStroke(g, '#C99B55', P.ink, 1.5);
  g.fillStyle = P.wood; g.fillRect(x + 3, y + lidH + 3, w - 6, 5); g.fillRect(x + 3, y + h - 8, w - 6, 5);
  const nW = (w - 10) / 4;
  const hist = st.recs.filter(r => r.who !== 'hori');
  const slots = [];
  for (const r of hist) slots.push({ rec: r });
  for (let k = 0; slots.length < 4; k++) {
    const rec = st.recs.find(r => r.who === 'hori' && r.n === k);
    slots.push(rec ? { rec } : { mat: MATS[k], n: k });
  }
  slots.forEach((sl, k) => {
    const nx = x + 5 + k * nW, ny = y + lidH + 10, nh = h - lidH - 20;
    rrect(g, nx + 2, ny, nW - 4, nh, 3); fillStroke(g, '#7A5228', P.ink, 1);
    const m = sl.rec ? answererMat(sl.rec) : sl.mat;
    const written = !!sl.rec;
    g.save();
    if (written) g.globalAlpha = 0.35; // it is out in the hour, doing its writing
    drawShabti(g, nx + nW / 2, ny + nh - 4, nh * (sl.rec && sl.rec.who === 'tamit' ? 0.78 : 0.88), { mat: m, blank: !written, child: sl.rec && sl.rec.who === 'tamit', seed: 40 + k });
    g.restore();
  });
  g.textAlign = 'left';
  // labels under the box
  g.font = font(Math.max(10, w * 0.052), 'italic');
  let ly = y + h + 14;
  slots.forEach(sl => {
    const name = sl.rec ? (sl.rec.who === 'tamit' ? 'hers' : MATERIAL[sl.rec.n]) : MATERIAL[sl.n];
    const what = sl.rec ? TXT.boxWritten(sl.rec.born) : TXT.boxEmpty;
    g.fillStyle = P.ink; g.fillText(name, x + 2, ly);
    g.fillStyle = sl.rec ? P.red : rgba(P.ink, 0.55);
    g.fillText(what, x + 2 + w * 0.36, ly);
    ly += Math.max(13, w * 0.07);

}

/* ---------- tablets (buttons) ---------- */
function drawTablet(g, bt, hover, fs) {
  const r = rng(bt.seed || 1);
  const { x, y, w, h } = bt;
  poly(g, [x + r() * 4, y + r() * 3, x + w * 0.5, y - 1 + r() * 2, x + w - r() * 4, y + r() * 4, x + w + 1 - r() * 3, y + h * 0.5,
    x + w - r() * 5, y + h - r() * 2, x + w * 0.45, y + h + 1 - r() * 2, x + r() * 5, y + h - r() * 3, x - 1 + r() * 2, y + h * 0.5]);
  fillStroke(g, bt.disabled ? '#D9CEB6' : hover ? '#FBF6EA' : '#F0E8D6', rgba(P.ink, bt.disabled ? 0.3 : 0.8), 1.2);
  g.fillStyle = bt.disabled ? rgba(P.ink, 0.35) : P.ink;
  let tf = fs;
  g.font = font(tf);
  while (tf > 8 && g.measureText(bt.label).width > w - 10) { tf -= 0.5; g.font = font(tf); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(bt.label, x + w / 2, y + h / 2 - (bt.key ? fs * 0.3 : 0));
  if (bt.key) { g.font = font(fs * 0.72, 'italic'); g.fillStyle = bt.disabled ? rgba(P.red, 0.35) : P.red; g.fillText(bt.key, x + w / 2, y + h / 2 + fs * 0.62); }
  if (bt.glyph) drawStepGlyph(g, bt.glyph, null, x + w / 2, y + h / 2, Math.min(w, h) * 0.5, bt.disabled ? rgba(P.ink, 0.35) : P.ink);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
}

/* ---------- a papyrus sheet for Thoth's longer words ---------- */
function drawSheet(g, x, y, w, h, seed) {
  g.save();
  g.shadowColor = rgba(P.umberDeep, 0.4); g.shadowBlur = 16; g.shadowOffsetY = 4;
  g.fillStyle = P.papyrus; g.fillRect(x, y, w, h);
  g.restore();
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  paintPapyrus(g, x, y, w, h, seed || 5);
  g.restore();
  g.strokeStyle = rgba(P.umber, 0.55); g.lineWidth = 1; g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  g.fillStyle = rgba(P.umber, 0.25); g.fillRect(x, y, 6, h); g.fillRect(x + w - 6, y, 6, h);
}

/* =====================================================================
   THE SOUNDS OF THE HOUR  (WebAudio only; nothing is loaded)
   A harp plucked by Karplus-Strong into buffers, a sistrum of filtered
   noise, the oar-drum, clay knocks, stone scrapes, and the serpent.
   ===================================================================== */

const AU = { ctx: null, master: null, muted: false, harp: new Map(), drone: null };

function auInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume().catch(() => {}); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    AU.ctx = new AC();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = AU.muted ? 0 : 0.55;
    const comp = AU.ctx.createDynamicsCompressor();
    AU.master.connect(comp); comp.connect(AU.ctx.destination);
    startDrone();
  } catch (e) { AU.ctx = null; }
}
function auMute(m) {
  AU.muted = m;
  if (AU.master) AU.master.gain.setTargetAtTime(m ? 0 : 0.55, AU.ctx.currentTime, 0.05);
}
function now0() { return AU.ctx ? AU.ctx.currentTime : 0; }

function env(node, t, a, peak, d) {
  node.gain.setValueAtTime(0.0001, t);
  node.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
  node.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function tone(freq, dur, type, peak, when, glideTo) {

  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);

  env(gn, t, 0.005, peak, dur);

}
let noiseBuf = null;
function noise(dur, type, freq, q, peak, when, sweepTo) {

    noiseBuf = AU.ctx.createBuffer(1, AU.ctx.sampleRate * 1.5, AU.ctx.sampleRate);
    const d = noiseBuf.getChannelData(0), r = rng(99);
    for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
  }
  const t = (when || 0) + now0();

  const f = AU.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q || 1;

  src.connect(f); f.connect(gn); gn.connect(AU.master);

}
// A plucked harp string, rendered once per pitch.
function harp(freq, when, peak) {
  if (!AU.ctx) return;
  const key = Math.round(freq);
  let buf = AU.harp.get(key);

    const sr = AU.ctx.sampleRate, len = Math.floor(sr * 2.2);
    buf = AU.ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0), N = Math.max(2, Math.round(sr / freq)), r = rng(key);
    const ring = new Float32Array(N);

    let idx = 0;

  const gn = AU.ctx.createGain(); gn.gain.value = peak || 0.35;

const SCALE = [220, 246.9, 277.2, 329.6, 370, 440, 493.9, 554.4, 659.3, 740]; // a pentatonic for the harp

function startDrone() {
