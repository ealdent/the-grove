<!--
=======================================================================
  TRUE OF VOICE
  a puzzle of the twelve hours, kept by Thoth
  Design document (written before the code; the code follows it)
=======================================================================

1. TITLE
   True of Voice. ("maa-kheru": what the gods call a dead person whose
   every word held up when the heart was weighed.)

2. PREMISE
   Hori was an outline-draughtsman of the Place of Truth, the village
   of tomb-builders across the river from Thebes. For thirty years he
   drew the night on the walls of kings: the twelve hours of the Duat
   that the sun rows through between dusk and dawn. He died before his
   own tomb was finished. Its walls are still in red sketch, his name
   is not written on them, and he was buried with almost nothing: four
   answerers (shabti) he made himself from what was to hand, canal
   mud, a flake of limestone, a stick of tamarisk, and one of
   blue-green faience he traded a week's bread for.

   Now he must walk the night he painted. Each hour is closed by a
   gate whose keeper opens only to a whole person, and the parts of
   Hori (his name, his shadow, his ba, his heart) have come loose and
   lie scattered through the hours. An hour does not end until its
   gate is passed: when the barque of Ra has rowed its forty-two
   strokes, the hour turns back to its beginning and Hori with it.

   But nothing done in the Duat is undone. Thoth, who keeps the
   record, writes each spent turning onto one of Hori's answerers, and
   the answerer, which is clay, eyeless and obedient, does it again,
   stroke for stroke, beside him. If the world will not let it (its
   weight has been moved, its door is down, someone stands where it
   must step), what Thoth wrote has become a lie, and lies are what
   Apep eats: the serpent of unmaking rises and swallows the hour. To
   be declared true of voice at dawn, Hori must keep his own past
   true, and, in the last hour, someone else's.

3. ART DIRECTION
   The game is a painted tomb wall, and it is painted the way a tomb was:
   red ochre sketch on a red proportion grid, then the master's black
   outline, then flat colour, then gold. The First Hour is still red
   sketch; each hour you cross arrives more finished (somebody above is
   painting your tomb), and the ending is the finished wall.

   Palette (hex; these are the pigments the code is built on, in the P
   table of the paint module; wall tops and faces, the answerers' box and
   the reed mats are shades mixed from them):
     plaster ground #E9DEC4, plaster shade #DCCBA5, papyrus #DCC69A,
     Sokar's sand #D9BF8A, alabaster floor #EEE5D1,
     lamp-soot ink #211A14, red ochre #A8432A, umber shadow #4A3220 / #2E1F14,
     yellow ochre #D4A13E, orpiment gold #E8C25A, linen #F4EEE0,
     Egyptian blue #2F5D9E (the sky sign, wigs, small accents only),
     faience #3E9A8A, malachite #557A46, Nile water #3D7486,
     copper pans #9A5B2D / #C58A4E, red-granite weights #8E5244,
     cedar doors #8A5A2E,
     the conventional red-brown of a man's skin #9C4A2A, Apep #2A1E18.
     Answerers: canal mud #6B4A30, limestone #E6DCC6, tamarisk #2F2721
     written in yellow #D9A93F, faience #3E9A8A; Tamit's raw clay #B0673F.

   Light source: the night sun itself. The barque of Ra rows star to star
   along the sky sign above the hour, one star per stroke, and its gold
   light falls down and across the board from wherever it is; the far
   corners sink into umber, cast shadows swing as the hour goes on, and
   dust turns in the beam. In a lie the light gutters to brown.

   Shape language: aspective, as the Egyptians drew. Every thing is shown
   from its most telling side: the hour as a plan (like the garden pool in
   Nebamun's tomb), the living in profile with a frontal eye and shoulders,
   the clay answerers frontal and mummiform, doors and gates in elevation,
   pans from above. Hard even outlines, flat fills, everything standing on
   a ground line. Rectangles, registers and block borders for the made
   world; curves only for living things: serpents, birds, people.

   Era and texture: New Kingdom Thebes, about 1250 BCE. The yellow-ground
   paintings in Sennedjem's tomb at Deir el-Medina; the cursive Amduat on
   the walls of Thutmose III's tomb, drawn like a papyrus unrolled on
   stone; the red grids and black corrections left in unfinished tombs;
   the figured ostraca (quick drawings on limestone flakes) of the workmen
   of the Place of Truth. Texture is plaster grit, pigment loss, hairline
   cracks, papyrus fibre and the wobble of a reed pen.

   Typography: no webfonts and no monospace anywhere. A book serif stack
   (Iowan Old Style, Palatino, Book Antiqua, Georgia) in lamp-soot ink,
   sentence case. Rubrics are in red ochre as a scribe wrote them: the
   names of the hours, the first words of an entry, and the name of Apep.
   The title is ink italic with a red initial. Numbers in Thoth's prose are
   written out ("the seventeenth stroke"); the barque's count uses Egyptian
   numerals (heel-bones and strokes). The record's glyphs (footprints, a
   seated man, an arm and hand) and the signs on pans and doors (ankh,
   djed, wedjat, feather, ibis, scarab) are drawn with canvas paths.

   Deliberately absent: dark navy grounds, cyan or magenta accents,
   gradient title text, spaced capitals, glowing grids. The only grid is
   the draughtsman's red one, painted, and it fades as the tomb is finished.

4. VOICE
   Every word is Thoth's: the ibis-headed scribe of the gods keeps the
   record of Hori's night and writes to him as "you" in the measured,
   exact cadence of a funerary text, precise about every number, dry,
   unhurried, and fonder of the man than he will admit.

-----------------------------------------------------------------------
  THE FICTION'S NOUNS (what the usual words are called here)
    you ............ Hori, the living draughtsman (profile, red-brown)
    recording ...... an answerer: a shabti carrying Thoth's writing
    iteration ...... a turning of the hour; 42 strokes of the barque's oars
    tick ........... a stroke
    plate .......... a copper pan of a balance; doors hang from the beams
    door ........... the Door of the Ibis, of the Feather, of the Eye ...
    pushable ....... a bull-weight of Sokar (granite, a bull carved on it)
    item ........... a part of yourself: name, shadow, ba, heart
    goal ........... the gate of the hour; at the end, the pan of the Balance
    paradox ........ a lie in the record; Apep rises and swallows the hour
    undo ........... Thoth wipes a stroke (or the whole turning) off the papyrus
    win ............ the keeper opens; at dawn you are declared true of voice

  HOURS
    I    The First Hour       one answerer; pans, doors, carrying your name
    IV   The Fourth Hour      bull-weights; do not shove what your past shoves
    VII  The Seventh Hour     pools and footings, a two-pan door, Apep himself
    XII  The Twelfth Hour     your daughter's answerer walks what she remembers
                              of you; the obvious way breaks it

  Rules where the brief left room are written out at the top of the
  engine below ("THE LAWS OF THE DUAT"). The self-test (press T on the
  title, or open with ?selftest) plays every intended solution, plants a
  lie in each hour, wipes each solution stroke by stroke to the first and
  writes it again, and checks the same-square rule.
=======================================================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>True of Voice</title>
<meta name="description" content="The record of Hori, outline-draughtsman of the Place of Truth, who walked the night he had painted beside clay answerers that did again what he had done. Kept by Thoth.">
<style>
  html, body { margin: 0; height: 100%; background: #E9DEC4; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

<body>
<canvas id="wall" aria-label="The wall on which I keep the record of your night, Hori: walk with the arrow keys, stand with Space, take up with E, write a turning down with Enter, wipe a stroke with Z." role="img"></canvas>
<script>
(function () {
"use strict";
/* =====================================================================
   THE LAWS OF THE DUAT  (the simulation; pure, deterministic, no DOM)
   ---------------------------------------------------------------------
   Game state is a pure function of (hour, input log). Nothing here reads
   a clock, a random number or the screen. The renderer only interpolates.

   Tokens in the log
     U D L R  walk one square (north/south/west/east on the painted plan)
     W        stand still for one stroke
     A        take up the part of yourself lying here / set it down
     E        end the turning early ("write it down"): not a stroke
   Every token except E is exactly one stroke, even when the move is
   blocked (a blocked step still costs the stroke).

   Decisions where the brief left room (all deliberate, all tested):
   1. ORDER OF A STROKE. The past moves first. Answerers act one by one,
      eldest first (a written history such as Tamit's is the eldest of all),
      then the living Hori acts last. Each acts against the world as the
      ones before it have just left it. This is the same-square rule: if two
      figures step into one empty square on the same stroke, the elder gets
      it and the younger is stopped. A square Hori is leaving on this stroke
      is still his when an answerer tries to enter it (he has not moved
      yet), so stepping into it is a collision. Swaps through each other are
      therefore impossible.
   2. WHAT AN ANSWERER REMEMBERS. For every stroke it keeps the outcome of
      its own action: walked to X; shoved the weight from X to Y; was
      stopped at X by stone / a shut door / a weight / a body; took up or
      set down the part at X; grasped at nothing; stood. On replay the same
      input is resolved again; any difference in that outcome is a lie and
      the hour halts at once. (Bull-weights are interchangeable: what is
      compared is where weights went, not which one.)
   3. BALANCES SETTLE AT THE END OF THE STROKE. After everyone has acted,
      each pan is weighed (a body or a bull-weight on it), and each door
      opens if all of its pans are weighed. A door never falls on anything
      standing in it: it stays up until its doorway is empty.
   4. THE THRESHOLD. Everyone enters the hour on the threshold square, so
      any number of figures may stand there together. Weights cannot be
      shoved onto it, nor onto the gate, nor onto a part of you lying on
      the floor. The part of you can be set down anywhere except beneath a
      door.
   4b. POOLS (the Seventh Hour). Nobody can wade a pool. A bull-weight
      shoved into one sinks and leaves a footing for the rest of the
      turning; a footing is floor in every way. Pools refill when the hour
      turns.
   5. WHEN WRITING RUNS OUT. A turning ended early writes a short answerer.
      When its writing is done it stands where it is, still weighing on
      whatever it stands on, until the hour turns.
   6. THE GATE. When the living Hori ends a stroke on the gate carrying the
      part of himself, the hour is passed at once; later strokes never
      happen, so nothing written for them can be contradicted.
   7. CLAY. Four answerers at most may walk an hour together (a written
      history counts as one of the four). With no clay left a turning
      cannot be ended early (there is nothing to write it on), and when the
      barque ends it, the hour closes: wipe something away, or begin again.
   8. UNDO. The log is the truth. Wiping a stroke pops one token and the
      state is recomputed from the start of the hour, so wiping across a
      turning un-writes that answerer and resumes the turning before it
      mid-way; replaying the same tokens reproduces the same state.
   ===================================================================== */

const N_STROKES = 42;
const MAX_ANSWERERS = 4;
const DIR = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
const TICK_TOKENS = 'UDLRWA';
const T_FLOOR = 0, T_WALL = 1, T_DOOR = 2, T_PILLAR = 3, T_COIL = 4, T_POOL = 5;
const SIGN_NAMES = { a: 'ankh', d: 'djed', e: 'eye', f: 'feather', i: 'ibis', k: 'scarab' };

function parseLevel(def) {
  const rows = def.map;
  const H = rows.length, W = rows[0].length;
  const tile = new Uint8Array(W * H);
  const panAt = new Int16Array(W * H).fill(-1);
  const doorAt = new Int16Array(W * H).fill(-1);
  const poolAt = new Int16Array(W * H).fill(-1);
  const pans = [], doors = [], weights = [], pools = [];
  let start = -1, gate = -1, item = -1;
  for (let y = 0; y < H; y++) {
    if (rows[y].length !== W) throw new Error(def.id + ': ragged row ' + y);
    for (let x = 0; x < W; x++) {
      const ch = rows[y][x], i = y * W + x;
      if (ch === '#') tile[i] = T_WALL;
      else if (ch === 'x') tile[i] = T_PILLAR;
      else if (ch === 's') tile[i] = T_COIL;
      else if (ch === '~') { tile[i] = T_POOL; poolAt[i] = pools.length; pools.push(i); }
      else if (ch === '.') { /* floor */ }
      else if (ch === 'S') start = i;
      else if (ch === 'G') gate = i;
      else if (ch === 'o') weights.push(i);
      else if (ch === '*') item = i;
      else if (SIGN_NAMES[ch]) { panAt[i] = pans.length; pans.push({ i, sign: ch }); }
      else if (SIGN_NAMES[ch.toLowerCase()]) {
        tile[i] = T_DOOR; doorAt[i] = doors.length; doors.push({ i, sign: ch.toLowerCase(), pans: [] });
      } else throw new Error(def.id + ': unknown map mark "' + ch + '"');
    }
  }
  for (const [x, y] of def.extraWeights || []) weights.push(y * W + x);
  if (start < 0 || gate < 0 || item < 0) throw new Error(def.id + ': needs S, G and *');
  for (const d of doors) {
    pans.forEach((p, k) => { if (p.sign === d.sign) d.pans.push(k); });
    if (!d.pans.length) throw new Error(def.id + ': door without a pan');
  }
  for (const p of pans) if (!doors.some(d => d.sign === p.sign)) throw new Error(def.id + ': pan without a door');
  const L = { def, W, H, tile, panAt, doorAt, poolAt, pans, doors, pools, weights0: weights, start, gate, item0: item };
  L.history = (def.history || []).map(h => writeHistory(L, h));
  if (L.history.length >= MAX_ANSWERERS) throw new Error(def.id + ': history fills the box');
  return L;
}

// A written history (an answerer made by someone else) remembers walking its
// whole path unhindered: every step a clean walk, every W a quiet stand.
function writeHistory(L, h) {
  let p = L.start;
  const outs = [];
  for (const c of h.inputs) {
    if (c === 'W') outs.push({ k: 'wait', at: p });
    else if (DIR[c]) {
      const to = p + DIR[c][0] + DIR[c][1] * L.W;
      outs.push({ k: 'walk', d: c, from: p, to });
      p = to;
    } else throw new Error(L.def.id + ': history may only walk or stand');
  }
  return { who: h.who, n: -1, inputs: h.inputs, outs, born: 0 };
}

function initialState(L) {
  return startTurning(L, {
    turning: 1, stroke: 0, recs: L.history.slice(), status: 'play',
    lie: null, spent: null, outs: [], events: [], liveIn: [], liveOut: [],
  });
}

function startTurning(L, s) {
  const nb = s.recs.length + 1;
  s.pos = new Array(nb).fill(L.start);
  s.facing = new Array(nb).fill(1);
  s.weights = L.weights0.slice();
  s.ford = L.pools.map(() => false);
  s.itemPos = L.item0;
  s.itemBy = -1;
  s.stroke = 0;
  s.liveIn = [];
  s.liveOut = [];
  s.panW = L.pans.map(p => occupied(s, p.i));
  s.doors = L.doors.map(d => d.pans.every(k => s.panW[k]));
  return s;
}

function cloneState(s) {
  return {
    turning: s.turning, stroke: s.stroke, recs: s.recs, status: s.status,
    lie: s.lie, spent: s.spent, outs: [], events: [],
    liveIn: s.liveIn.slice(), liveOut: s.liveOut.slice(),
    pos: s.pos.slice(), facing: s.facing.slice(), weights: s.weights.slice(), ford: s.ford.slice(),
    itemPos: s.itemPos, itemBy: s.itemBy, panW: s.panW.slice(), doors: s.doors.slice(),
  };
}

function bodyAt(s, i, except) {
  for (let b = 0; b < s.pos.length; b++) if (b !== except && s.pos[b] === i) return b;
  return -1;
}
function weightAt(s, i) { return s.weights.indexOf(i); }
function occupied(s, i) { return bodyAt(s, i, -1) >= 0 || weightAt(s, i) >= 0; }
function liveBody(s) { return s.recs.length; }

function solidKind(t) { return t === T_WALL ? 'wall' : t === T_PILLAR ? 'pillar' : t === T_COIL ? 'coil' : null; }

// Why a bull-weight cannot be shoved into square (x, y); null if it can.
function weightBlock(L, s, x, y) {
  if (x < 0 || y < 0 || x >= L.W || y >= L.H) return 'edge';
  const i = y * L.W + x;
  const t = L.tile[i];
  if (solidKind(t)) return 'wall';
  if (t === T_DOOR && !s.doors[L.doorAt[i]]) return 'door';
  if (t === T_POOL && !s.ford[L.poolAt[i]]) return null; // it will sink
  if (i === L.start) return 'threshold';
  if (i === L.gate) return 'gate';
  if (weightAt(s, i) >= 0) return 'weight';
  if (bodyAt(s, i, -1) >= 0) return 'body';
  if (s.itemBy < 0 && s.itemPos === i) return 'item';
  return null;
}

// Resolve (without changing anything) what body b's token does right now.
function resolve(L, s, b, tok) {
  const at = s.pos[b];
  if (tok === 'W') return { k: 'wait', at };
  if (tok === 'A') {
    if (s.itemBy === b) {
      if (L.tile[at] === T_DOOR) return { k: 'grasp', at, why: 'door' };
      return { k: 'set', at };
    }
    if (s.itemBy < 0 && s.itemPos === at) return { k: 'take', at };
    return { k: 'grasp', at, why: s.itemBy >= 0 ? 'carried' : 'nothing' };
  }
  const [dx, dy] = DIR[tok];
  const x = at % L.W + dx, y = (at / L.W | 0) + dy;
  if (x < 0 || y < 0 || x >= L.W || y >= L.H) return { k: 'bump', d: tok, from: at, at: -1, by: 'edge' };
  const to = y * L.W + x;
  const t = L.tile[to];
  const sk = solidKind(t);
  if (sk) return { k: 'bump', d: tok, from: at, at: to, by: sk };
  if (t === T_DOOR && !s.doors[L.doorAt[to]]) return { k: 'bump', d: tok, from: at, at: to, by: 'door', door: L.doorAt[to] };
  if (t === T_POOL && !s.ford[L.poolAt[to]]) return { k: 'bump', d: tok, from: at, at: to, by: 'pool' };
  if (to !== L.start) {
    const ob = bodyAt(s, to, b);
    if (ob >= 0) return { k: 'bump', d: tok, from: at, at: to, by: 'body', who: ob };
  }
  const w = weightAt(s, to);
  if (w >= 0) {
    const why = weightBlock(L, s, x + dx, y + dy);
    if (why) {
      const beyond = (y + dy) * L.W + x + dx;
      return { k: 'bump', d: tok, from: at, at: to, by: 'weight', w, wBy: why,
               wWho: why === 'body' ? bodyAt(s, beyond, -1) : -1, wDoor: why === 'door' ? L.doorAt[beyond] : -1 };
    }
    const wto = (y + dy) * L.W + x + dx;
    const sink = L.tile[wto] === T_POOL && !s.ford[L.poolAt[wto]];
    return { k: 'push', d: tok, from: at, to, w, wto, sink };
  }
  return { k: 'walk', d: tok, from: at, to };
}

function blockClass(o) {
  return (o.by === 'edge' || o.by === 'wall' || o.by === 'pillar' || o.by === 'coil') ? 'solid' : o.by;
}

// Is outcome b the same experience as the remembered outcome a?
function sameOutcome(a, b) {
  if (a.k !== b.k) return false;
  switch (a.k) {
    case 'walk': return a.to === b.to;
    case 'push': return a.to === b.to && a.wto === b.wto && !!a.sink === !!b.sink;
    case 'bump': return a.at === b.at && blockClass(a) === blockClass(b);
    case 'wait': return true;
    default: return a.at === b.at; // take, set, grasp
  }
}

function applyOutcome(L, s, b, o) {
  if (o.k === 'walk') s.pos[b] = o.to;
  else if (o.k === 'push') {
    s.pos[b] = o.to;
    if (o.sink) { s.weights[o.w] = -1; s.ford[L.poolAt[o.wto]] = true; }
    else s.weights[o.w] = o.wto;
  }
  else if (o.k === 'take') { s.itemBy = b; s.itemPos = -1; }
  else if (o.k === 'set') { s.itemBy = -1; s.itemPos = o.at; }
  if (o.d === 'L') s.facing[b] = -1;
  else if (o.d === 'R') s.facing[b] = 1;
}

function settle(L, s) {
  s.panW = L.pans.map(p => occupied(s, p.i));
  for (let k = 0; k < L.doors.length; k++) {
    const d = L.doors[k];
    const want = d.pans.every(pk => s.panW[pk]);
    const was = s.doors[k];
    const open = want || (was && occupied(s, d.i));
    if (open !== was) s.events.push({ k: open ? 'door-open' : 'door-close', door: k });
    s.doors[k] = open;
  }
}

function endTurning(L, s, why) {
  if (s.recs.length >= MAX_ANSWERERS) {
    s.status = 'spent';
    s.spent = { turning: s.turning, stroke: s.stroke, why };
    s.events.push({ k: 'spent', why });
    return s;
  }
  const n = s.recs.filter(r => r.who === 'hori').length;
  const rec = { who: 'hori', n, inputs: s.liveIn.join(''), outs: s.liveOut.slice(), born: s.turning };
  s.recs = s.recs.concat([rec]);
  s.events.push({ k: 'turn', why, written: s.turning, len: rec.inputs.length });
  s.turning++;
  return startTurning(L, s);
}

// One token. Returns the next state, or null if the token is refused
// (refused tokens never enter the log).
function step(L, s0, tok) {
  if (s0.status !== 'play') return null;
  if (tok === 'E') {
    if (s0.stroke === 0 || s0.recs.length >= MAX_ANSWERERS) return null;
    return endTurning(L, cloneState(s0), 'early');
  }
  if (TICK_TOKENS.indexOf(tok) < 0 || tok.length !== 1) return null;
  const s = cloneState(s0);
  s.stroke++;
  const t = s.stroke - 1;
  const live = liveBody(s);
  for (let b = 0; b < live; b++) {
    const r = s.recs[b];
    if (t >= r.inputs.length) { s.outs[b] = { k: 'rest', at: s.pos[b] }; continue; }
    const tok2 = r.inputs[t];
    const got = resolve(L, s, b, tok2);
    const want = r.outs[t];
    s.outs[b] = got;
    if (!sameOutcome(want, got)) {
      s.status = 'lie';
      s.lie = { turning: s.turning, stroke: s.stroke, body: b, who: r.who, n: r.n, born: r.born,
                input: tok2, expected: want, actual: got };
      s.events.push({ k: 'lie' });
      return s;
    }
    applyOutcome(L, s, b, got);
  }
  const got = resolve(L, s, live, tok);
  s.outs[live] = got;
  applyOutcome(L, s, live, got);
  s.liveIn.push(tok);
  s.liveOut.push(got);
  settle(L, s);
  if (s.pos[live] === L.gate && s.itemBy === live) {
    s.status = 'won';
    s.events.push({ k: 'won' });
    return s;
  }
  if (s.stroke >= N_STROKES) return endTurning(L, s, 'barque');
  return s;
}

function cleanLog(str) { return str.replace(/[^UDLRWAE]/g, ''); }

// The whole hour from nothing: the only source of truth.
function simulate(L, log) {
  let s = initialState(L);
  for (let k = 0; k < log.length; k++) {
    const n = step(L, s, log[k]);
    if (!n) return { state: s, refusedAt: k };
    s = n;
  }
  return { state: s, refusedAt: -1 };
}

function hashState(s) {
  return JSON.stringify([s.turning, s.stroke, s.status, s.pos, s.facing, s.weights, s.ford, s.itemPos, s.itemBy,
    s.doors, s.panW, s.recs.map(r => r.who + ':' + r.inputs), s.liveIn.join(''),
    s.lie ? [s.lie.turning, s.lie.stroke, s.lie.body, s.lie.actual.k] : null,
    s.spent ? [s.spent.turning, s.spent.stroke] : null]);
}

/* =====================================================================
   THE RECORD  (every word the player reads; all of it is Thoth)
   Markup: {red words} are rubrics, written in red ochre as a scribe would;
   _words_ are the child's hand on the little answerer.
   ===================================================================== */

const ORD = ['zeroth', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth',
  'eleventh', 'twelfth', 'thirteenth', 'fourteenth', 'fifteenth', 'sixteenth', 'seventeenth', 'eighteenth', 'nineteenth'];
const TENS = ['', '', 'twent', 'thirt', 'fort', 'fift', 'sixt'];
function ordinal(n) {
  if (n < 20) return ORD[n];
  const t = Math.floor(n / 10), u = n % 10;
  return u === 0 ? TENS[t] + 'ieth' : TENS[t] + 'y-' + ORD[u];
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve',
  'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENW = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
function numberWords(n) {
  n = Math.max(0, Math.round(n));
  if (n < 20) return ONES[n];
  if (n < 100) return TENW[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
  if (n < 1000) return ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' and ' + numberWords(n % 100) : '');
  return numberWords(Math.floor(n / 1000)) + ' thousand' + (n % 1000 ? (n % 1000 < 100 ? ' and ' : ' ') + numberWords(n % 1000) : '');
}

// ---------------------------------------------------------------------
// Naming squares and figures, for the record of a lie.
function placeName(L, i) {
  if (i < 0) return 'the edge of the hour';
  if (i === L.start) return 'the threshold';
  if (i === L.gate) return L.def.id === 'XII' ? 'the pan of the Balance' : 'the gate';
  if (L.panAt[i] >= 0) return 'the Pan of the ' + SIGN_WORD[L.pans[L.panAt[i]].sign];
  if (L.doorAt[i] >= 0) return 'the Door of the ' + SIGN_WORD[L.doors[L.doorAt[i]].sign];
  if (L.tile[i] === T_POOL) return 'the pool ' + ordinal(i % L.W + 1) + ' across in the ' + ordinal((i / L.W | 0) + 1) + ' row';
  return 'the ' + ordinal(i % L.W + 1) + ' square of the ' + ordinal((i / L.W | 0) + 1) + ' row';
}
function answererName(rec) {
  if (rec.who === 'tamit') return 'the little one';
  return 'your ' + MATERIAL[rec.n] + ' answerer';
}
function bodyName(s, b, lieBody) {
  if (b === s.recs.length) return 'you';
  return b === lieBody ? 'it' : answererName(s.recs[b]);
}

function outcomeWords(L, s, o, who, item) {
  const into = o.to != null ? placeName(L, o.to) : placeName(L, o.at);
  switch (o.k) {
    case 'walk': return 'walk ' + DIR_WORD[o.d] + ' into ' + into;
    case 'push': return 'shove a bull-weight ' + DIR_WORD[o.d] + ' from ' + placeName(L, o.to) +
      (o.sink ? ' into the pool, where it sinks' : ' onto ' + placeName(L, o.wto));
    case 'bump': return 'step ' + DIR_WORD[o.d] + ' against ' + blockerWords(L, s, o) + ' and stop';
    case 'take': return 'take up ' + item + ' from ' + placeName(L, o.at);
    case 'set': return 'set ' + item + ' down on ' + placeName(L, o.at);
    case 'grasp': return 'reach for nothing on ' + placeName(L, o.at);
    case 'wait': return 'stand still on ' + placeName(L, o.at);
  }
  return o.k;
}
function blockerWords(L, s, o) {
  switch (o.by) {
    case 'edge': return 'the edge of the hour';
    case 'wall': case 'pillar': return 'the stone';
    case 'coil': return 'the coils of {Apep}';
    case 'pool': return 'open water';
    case 'door': return 'the shut Door of the ' + SIGN_WORD[L.doors[o.door].sign];
    case 'weight': return 'a bull-weight that would not move';
    case 'body': return o.who === s.recs.length ? 'you' : answererName(s.recs[o.who]);
  }
  return 'something';
}

// What stood behind a bull-weight that would not move; [words, verb].
function behindWords(L, s, a, item) {
  switch (a.wBy) {
    case 'body': return a.wWho === s.recs.length ? ['you', 'were'] : [answererName(s.recs[a.wWho]), 'was'];
    case 'door': return ['the shut Door of the ' + SIGN_WORD[L.doors[a.wDoor].sign], 'was'];
    case 'weight': return ['another bull-weight', 'was'];
    case 'threshold': return ['the threshold, where no weight may go,', 'was'];
    case 'gate': return ['the gate, where no weight may go,', 'was'];
    case 'item': return [item, 'was lying'];
    default: return ['stone', 'was'];
  }
}

// What actually happened, said plainly, against what was written.
function actualWords(L, s, lie, item) {
  const e = lie.expected, a = lie.actual;
  if (a.k === 'bump') {
    if (a.by === 'body') return a.who === s.recs.length ? 'You were standing there.' : cap(answererName(s.recs[a.who])) + ' was standing there.';
    if (a.by === 'door') return 'The Door of the ' + SIGN_WORD[L.doors[a.door].sign] + ' was down.';
    if (a.by === 'weight') {
      const [what, were] = behindWords(L, s, a, item);
      return (e.k === 'push' ? 'The bull-weight would not move: ' : 'A bull-weight lay there and would not move: ') + what + ' ' + were + ' behind it.';
    }
    if (a.by === 'pool') return 'It was open water.';
    return 'Stone was in the way.';
  }
  const it = s.recs[lie.body].who === 'tamit' ? 'she' : 'it';
  if (a.k === 'push' && e.k === 'push') {
    if (e.sink && !a.sink) return 'The pool there was already a footing, so the weight did not sink.';
    if (!e.sink && a.sink) return 'The weight went into open water and sank, which nobody wrote.';
    return 'The weight went somewhere else.';
  }
  if (a.k === 'push') return 'A bull-weight lay there, and ' + it + ' shoved it ' + DIR_WORD[a.d] + ', which nobody wrote.';
  if (a.k === 'walk') {
    if (e.k === 'push') return 'There was no bull-weight there to shove.';
    if (e.k === 'bump') return 'Nothing stopped ' + (it === 'she' ? 'her' : 'it') + ', and ' + it + ' walked on.';
    return cap(it) + ' walked somewhere else.';
  }
  if (a.k === 'grasp') return e.k === 'take' ? cap(item) + ' was not there.' : 'The hands were empty.';
  if (a.k === 'take') return cap(item) + ' was lying there, and ' + it + ' took it up.';
  return cap(it) + ' went otherwise.';
}

function shortWords(o, s) {
  switch (o.k) {
    case 'walk': return 'walks ' + DIR_WORD[o.d];
    case 'push': return 'shoves ' + DIR_WORD[o.d] + (o.sink ? ', the weight sinks' : '');
    case 'bump': return 'stopped going ' + DIR_WORD[o.d] + (o.by === 'body' ? (s && o.who === s.recs.length ? ', by you' : ', by another answerer') :
      o.by === 'door' ? ', by a shut door' : o.by === 'weight' ? ', by a weight' : o.by === 'pool' ? ', by water' : ', by stone');
    case 'take': return 'takes up';
    case 'set': return 'sets down';
    case 'grasp': return 'empty hands';
    case 'wait': return 'stands';
  }
  return o.k;
}

const TAMIT_MEMORY = {
  body: 'In what she wrote, nobody stands in her way.',
  door: 'In what she wrote, somebody holds that door up for her.',
  weight: 'In what she wrote, there is no stone on that road.',
  push: 'In what she wrote, there is no stone on that road.',
};

function describeLie(L, s) {
  const lie = s.lie;
  const rec = s.recs[lie.body];
  const item = ITEM[L.def.item].noun;
  const who = answererName(rec);
  const written = rec.who === 'tamit' ? 'written before you came' : 'written in the ' + ordinal(rec.born) + ' turning';
  const lines = [];
  lines.push('{The ' + ordinal(lie.turning) + ' turning, the ' + ordinal(lie.stroke) + ' stroke.}');
  lines.push(cap(who) + ', ' + written + ', was to ' + outcomeWords(L, s, lie.expected, who, item) + '. ' +
    actualWords(L, s, lie, item));
  if (rec.who === 'tamit') {
    const a = lie.actual;
    const m = a.k === 'push' ? TAMIT_MEMORY.push : a.k === 'bump' ? TAMIT_MEMORY[a.by] : null;
    if (m) lines.push(m);
  }
  lines.push('Written: ' + shortWords(lie.expected, s) + '. Done: ' + shortWords(lie.actual, s) + '.');
  lines.push(TXT.lieTail);
  return lines;
}

/* =====================================================================
   THOTH CHECKS HIS OWN RECORD  (headless self-test; no drawing)
   Run from the title screen (press T, or the small ibis seal), with
   ?selftest in the address, or window.__trueOfVoice.selfTest().
   ===================================================================== */

// A deliberately broken record for each hour, and where the lie must surface.
const BREAKS = {
  // the mud answerer waits five strokes; you stand in its road
  I: { log: 'WWWWWDDDDDDDDD E DWWWWW', turning: 2, stroke: 6, body: 0, k: 'bump' },
  // the limestone answerer dawdles before the weight; you shove it first
  IV: { log: 'DD E RDRRRRRWWWWWRDRUUDDDDDDLLLL E WDRRRRDRRRUDW', turning: 3, stroke: 13, body: 1, k: 'walk' },
  // you stand where the mud answerer steps back from the pool
  VII: { log: 'RRRDDURRRRRRDRU E RRRDRW', turning: 2, stroke: 6, body: 0, k: 'bump' },
  // you leave the stone in her road
  XII: { log: 'WWWWWWW', turning: 1, stroke: 7, body: 0, k: 'push' },
};

function selfTest() {
  const out = [];
  const add = (hour, key, ok, detail, info) => out.push({ hour, key, ok: !!ok, detail: detail || '', info: info || null });
  const t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());

  for (const def of LEVELS) {
    const L = parseLevel(def);
    const log = cleanLog(def.solution);
    // 1. the written way through, token by token, never refused, never a lie
    let s = initialState(L);
    const states = [s];
    let bad = '';
    for (let k = 0; k < log.length && !bad; k++) {
      const n = step(L, s, log[k]);
      if (!n) bad = 'refused at token ' + k;
      else { s = n; states.push(s); if (s.status === 'lie' || s.status === 'spent') bad = s.status + ' at token ' + k; }
    }
    const used = s.recs.filter(r => r.who === 'hori').length;
    add(def.id, 'solution', !bad && s.status === 'won', bad || ('turning ' + s.turning + ', stroke ' + s.stroke + ', answerers ' + used),
      bad ? null : { turning: s.turning, stroke: s.stroke, answerers: used });

    // 2. the same record written twice gives the same hour
    const h1 = hashState(simulate(L, log).state), h2 = hashState(simulate(L, log).state);
    add(def.id, 'determinism', h1 === h2 && h1 === hashState(s));

    // 3. wipe stroke by stroke to the very first, checking each against a fresh
    //    reading of the shortened record, then write it all again
    let undoOk = true, where = '';
    for (let k = log.length; k >= 0; k--) {
      const fresh = simulate(L, log.slice(0, k));
      if (fresh.refusedAt >= 0 || hashState(fresh.state) !== hashState(states[k])) { undoOk = false; where = 'at ' + k; break; }
    }
    let r = initialState(L);
    for (const tok of log) r = step(L, r, tok) || r;
    add(def.id, 'undo', undoOk && hashState(r) === hashState(s), where);

    // 4. a lie is caught where it is told, and named precisely
    const br = BREAKS[def.id];
    if (br) {
      const res = simulate(L, cleanLog(br.log));
      const lie = res.state.lie;
      const ok = res.state.status === 'lie' && lie && lie.turning === br.turning && lie.stroke === br.stroke &&
        lie.body === br.body && lie.actual.k === br.k && res.refusedAt === -1;
      add(def.id, 'lie', ok, lie ? ('turning ' + lie.turning + ', stroke ' + lie.stroke + ', body ' + lie.body +
        ', ' + lie.expected.k + ' -> ' + lie.actual.k) : 'no lie: ' + res.state.status,
        lie ? { turning: lie.turning, stroke: lie.stroke, expected: lie.expected, actual: lie.actual, live: res.state.recs.length } : null);
    }

    // 5. the hour cannot be passed without an answerer (or with its history alone)
    add(def.id, 'needs-clay', !soloCanWin(L), '');
  }

  // The same-square rule, on a tiny proving ground.
  const P = parseLevel(PROVING_GROUND);
  const at = (x, y) => y * P.W + x;
  const run = log => simulate(P, cleanLog(log)).state;
  let s = run('R E R');
  add('rule', 'elder-first', s.status === 'play' && s.pos[0] === at(1, 1) && s.pos[1] === at(0, 1) &&
    s.liveOut[0].k === 'bump' && s.liveOut[0].by === 'body');
  s = run('WR E RW');
  add('rule', 'standing-in-the-way', s.status === 'lie' && s.lie.stroke === 2 && s.lie.actual.by === 'body' && s.lie.actual.who === 1);
  s = run('WR E RL');
  add('rule', 'leaving-is-not-gone', s.status === 'lie' && s.lie.stroke === 2 && s.lie.actual.by === 'body');
  s = run('W E RL');
  add('rule', 'threshold-holds-many', s.status === 'play' && s.pos[1] === P.start && s.pos[0] === P.start);
  s = run('RRRRA E');
  const back = simulate(P, cleanLog('RRRRA')).state;
  add('rule', 'undo-across-a-turning', s.turning === 2 && s.recs.length === 1 && back.turning === 1 &&
    back.recs.length === 0 && back.stroke === 5 && back.itemBy === 0);
  s = run('WWWWWRRRRA E RRRRAUWWWW');
  add('rule', 'one-part-only', s.status === 'lie' && s.lie.stroke === 10 && s.lie.expected.k === 'take' &&
    s.lie.actual.k === 'grasp');
  s = run('E');
  add('rule', 'nothing-to-write', s.turning === 1 && simulate(P, 'E').refusedAt === 0);
  s = run('W E W E W E W E ' + 'W'.repeat(N_STROKES));
  const noClay = simulate(P, cleanLog('W E W E W E W E W E'));
  add('rule', 'four-and-no-more', s.status === 'spent' && s.recs.length === 4 && noClay.refusedAt === 9 && noClay.state.status === 'play');

  const ms = ((typeof performance !== 'undefined' ? performance.now() : Date.now()) - t0);
  const failed = out.filter(o => !o.ok).length;
  return { results: out, failed, ms: Math.round(ms) };
}

// Breadth-first search: can the living Hori pass the hour in one turning with
// no answerers of his own? (Used to prove each hour needs at least one.)
function soloCanWin(L) {
  const s0 = initialState(L);
  // With no written history nothing in the hour depends on the stroke, so a
  // square reached sooner covers the same square reached later.
  const timed = L.history.length > 0;
  const key = s => (timed ? s.stroke : '') + '|' + s.pos[s.recs.length] + '|' + s.weights.slice().sort((a, b) => a - b).join(',') +
    '|' + s.ford.map(Number).join('') + '|' + s.itemPos + '|' + s.itemBy + '|' + s.doors.map(Number).join('');
  let frontier = [s0];
  const seen = new Set([key(s0)]);
  while (frontier.length) {
    const next = [];
    for (const s of frontier) {
      for (const tok of TICK_TOKENS) {
        const n = step(L, s, tok);
        if (!n || n.status === 'lie' || n.status === 'spent' || n.turning !== s.turning) continue;
        if (n.status === 'won') return true;
        const k = key(n);
        if (seen.has(k)) continue;
        seen.add(k);
        next.push(n);
      }
    }
    frontier = next;
  }
  return false;
}

/* =====================================================================
   PIGMENTS, PLASTER AND SIGNS  (drawing primitives; all canvas paths)
   ===================================================================== */

const P = {
  plaster: '#E9DEC4', plasterShade: '#DCCBA5', papyrus: '#DCC69A', papyrusShade: '#C9AE7C',
  sand: '#D9BF8A', sandShade: '#C4A36B', alabaster: '#EEE5D1',
  umber: '#4A3220', umberDeep: '#2E1F14', ink: '#211A14', red: '#A8432A', redPale: '#C9826A',
  ochre: '#D4A13E', gold: '#E8C25A', blue: '#2F5D9E', blueDeep: '#23477A',
  faience: '#3E9A8A', faienceDeep: '#2C7468', green: '#557A46', greenPale: '#86A06A', linen: '#F4EEE0',
  copper: '#9A5B2D', copperLight: '#C58A4E', granite: '#8E5244', graniteDark: '#6A3A30',
  mud: '#5E412B', limestone: '#E3D8BF', tamarisk: '#2B241E', clay: '#B0673F',
  skin: '#9C4A2A', skinShade: '#7E3A20', apep: '#2A1E18', water: '#3D7486', waterDeep: '#2C5868', wood: '#8A5A2E', woodDark: '#5E3C1C',
};

const SERIF = '"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif';
const font = (px, style) => (style || '') + ' ' + Math.round(px) + 'px ' + SERIF;

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const easeOut = t => 1 - (1 - clamp(t, 0, 1)) * (1 - clamp(t, 0, 1));

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}
function mix(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const c = k => Math.round(lerp(a >> k & 255, b >> k & 255, t));
  return 'rgb(' + c(16) + ',' + c(8) + ',' + c(0) + ')';
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

function poly(g, pts, close) {
  g.beginPath();
  g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  if (close !== false) g.closePath();
}
function ell(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
function rrect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}
function fillStroke(g, fill, stroke, lw) {
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1; g.stroke(); }
}

// A reed-pen line: slightly wobbly, as a hand draws it.
function handLine(g, x1, y1, x2, y2, r, amp) {
  const len = Math.hypot(x2 - x1, y2 - y1);
  const n = Math.max(2, Math.round(len / 24));
  g.beginPath(); g.moveTo(x1 + (r() - 0.5) * amp, y1 + (r() - 0.5) * amp);
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    g.lineTo(x1 + (x2 - x1) * t + (r() - 0.5) * amp, y1 + (y2 - y1) * t + (r() - 0.5) * amp);
  }
  g.stroke();
}

// Plaster: a warm ground with grit, worn patches and hairline cracks.
function paintPlaster(g, x, y, w, h, base, seed, grit) {
  const r = rng(seed);
  g.fillStyle = base; g.fillRect(x, y, w, h);
  const blot = Math.max(2, Math.round(w * h / 26000));
  for (let k = 0; k < blot; k++) {
    const bx = x + r() * w, by = y + r() * h, br = 20 + r() * 90;
    const gr = g.createRadialGradient(bx, by, 0, bx, by, br);
    const light = r() < 0.55;
    gr.addColorStop(0, light ? 'rgba(255,248,230,0.16)' : 'rgba(120,85,45,0.07)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(bx - br, by - br, br * 2, br * 2);
  }
  const n = Math.round(w * h / 38 * (grit || 1));
  for (let k = 0; k < n; k++) {
    const sz = r() * 1.5 + 0.3;
    g.fillStyle = r() < 0.55 ? 'rgba(90,60,30,' + (r() * 0.1).toFixed(3) + ')' : 'rgba(255,252,240,' + (r() * 0.14).toFixed(3) + ')';
    g.fillRect(x + r() * w, y + r() * h, sz, sz);
  }
  const cracks = Math.round(w * h / 90000) + 1;
  g.lineCap = 'round';
  for (let k = 0; k < cracks; k++) {
    let cx = x + r() * w, cy = y + r() * h, a = r() * Math.PI * 2;
    g.strokeStyle = 'rgba(70,45,25,' + (0.12 + r() * 0.1).toFixed(3) + ')'; g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(cx, cy);
    const steps = 6 + r() * 14 | 0;
    for (let s = 0; s < steps; s++) { a += (r() - 0.5) * 1.1; cx += Math.cos(a) * 7; cy += Math.sin(a) * 7; g.lineTo(cx, cy); }
    g.stroke();
  }
}

// Papyrus: cross-laid fibres.
function paintPapyrus(g, x, y, w, h, seed) {
  const r = rng(seed);
  g.fillStyle = P.papyrus; g.fillRect(x, y, w, h);
  for (let i = 0; i < h; i += 2) {
    g.fillStyle = 'rgba(150,115,60,' + (0.03 + r() * 0.06).toFixed(3) + ')';
    g.fillRect(x, y + i, w, 1);
  }
  for (let i = 0; i < w; i += 3) {
    g.fillStyle = 'rgba(255,245,215,' + (0.03 + r() * 0.05).toFixed(3) + ')';
    g.fillRect(x + i, y, 1, h);
  }
  for (let k = 0; k < w * h / 300; k++) {
    g.fillStyle = 'rgba(110,80,40,' + (r() * 0.08).toFixed(3) + ')';
    g.fillRect(x + r() * w, y + r() * h, 1 + r() * 3, 1);
  }
}

/* ---------------- signs on pans and doors ---------------- */
function drawSign(g, sign, x, y, s, col, lw) {
  g.save();
  g.translate(x, y);
  g.strokeStyle = col; g.fillStyle = col;
  g.lineWidth = lw || Math.max(1, s * 0.09);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const u = s / 2;
  switch (sign) {
    case 'a': // ankh
      ell(g, 0, -u * 0.55, u * 0.32, u * 0.42); g.stroke();
      g.beginPath(); g.moveTo(-u * 0.6, -u * 0.1); g.lineTo(u * 0.6, -u * 0.1); g.stroke();
      g.beginPath(); g.moveTo(0, -u * 0.12); g.lineTo(0, u * 0.95); g.stroke();
      break;
    case 'd': // djed
      g.beginPath(); g.moveTo(-u * 0.18, u * 0.95); g.lineTo(-u * 0.18, -u * 0.6); g.lineTo(u * 0.18, -u * 0.6); g.lineTo(u * 0.18, u * 0.95); g.stroke();
      for (let k = 0; k < 4; k++) { const yy = -u * 0.55 + k * u * 0.2; g.beginPath(); g.moveTo(-u * 0.55, yy); g.lineTo(u * 0.55, yy); g.stroke(); }
      g.beginPath(); g.moveTo(-u * 0.4, u * 0.95); g.lineTo(u * 0.4, u * 0.95); g.stroke();
      break;
    case 'e': // wedjat eye
      g.beginPath(); g.moveTo(-u * 0.75, -u * 0.05); g.quadraticCurveTo(0, -u * 0.6, u * 0.75, -u * 0.05); g.quadraticCurveTo(0, u * 0.35, -u * 0.75, -u * 0.05); g.stroke();
      ell(g, 0, -u * 0.08, u * 0.17, u * 0.17); g.fill();
      g.beginPath(); g.moveTo(-u * 0.7, -u * 0.55); g.quadraticCurveTo(0, -u * 0.85, u * 0.75, -u * 0.5); g.stroke();
      g.beginPath(); g.moveTo(-u * 0.05, u * 0.2); g.lineTo(-u * 0.15, u * 0.85); g.stroke();
      g.beginPath(); g.moveTo(u * 0.15, u * 0.15); g.quadraticCurveTo(u * 0.5, u * 0.9, u * 0.7, u * 0.5); g.quadraticCurveTo(u * 0.75, u * 0.3, u * 0.55, u * 0.35); g.stroke();
      break;
    case 'f': // feather of Ma'at
      g.beginPath(); g.moveTo(0, u * 0.95); g.lineTo(0, -u * 0.7); g.quadraticCurveTo(u * 0.05, -u * 0.98, u * 0.42, -u * 0.8); g.stroke();
      g.beginPath(); g.moveTo(0, -u * 0.62); g.quadraticCurveTo(u * 0.5, -u * 0.6, u * 0.42, -u * 0.8);
      g.quadraticCurveTo(u * 0.32, u * 0.2, 0, u * 0.7); g.stroke();
      for (let k = 0; k < 4; k++) { const yy = -u * 0.4 + k * u * 0.25; g.beginPath(); g.moveTo(0, yy); g.lineTo(u * 0.3 - k * u * 0.05, yy - u * 0.12); g.stroke(); }
      break;
    case 'i': // ibis
      g.beginPath(); g.moveTo(-u * 0.55, -u * 0.05); g.quadraticCurveTo(-u * 0.2, -u * 0.45, u * 0.2, -u * 0.2);
      g.quadraticCurveTo(u * 0.35, -u * 0.1, u * 0.25, u * 0.15); g.quadraticCurveTo(-u * 0.2, u * 0.25, -u * 0.55, -u * 0.05); g.fill();
      g.beginPath(); g.moveTo(u * 0.15, -u * 0.25); g.lineTo(u * 0.22, -u * 0.62); g.stroke();
      ell(g, u * 0.25, -u * 0.66, u * 0.1, u * 0.08); g.fill();
      g.beginPath(); g.moveTo(u * 0.32, -u * 0.66); g.quadraticCurveTo(u * 0.75, -u * 0.6, u * 0.72, -u * 0.15); g.stroke();
      g.beginPath(); g.moveTo(-u * 0.1, u * 0.18); g.lineTo(-u * 0.15, u * 0.95); g.moveTo(u * 0.08, u * 0.18); g.lineTo(u * 0.15, u * 0.95); g.stroke();
      break;
    case 'k': // scarab
      ell(g, 0, u * 0.12, u * 0.36, u * 0.5); g.fill();
      ell(g, 0, -u * 0.48, u * 0.22, u * 0.14); g.fill();
      g.beginPath();
      for (const sx of [-1, 1]) {
        g.moveTo(sx * u * 0.3, -u * 0.15); g.lineTo(sx * u * 0.7, -u * 0.4);
        g.moveTo(sx * u * 0.34, u * 0.15); g.lineTo(sx * u * 0.75, u * 0.15);
        g.moveTo(sx * u * 0.3, u * 0.45); g.lineTo(sx * u * 0.65, u * 0.85);
      }
      g.stroke();
      g.strokeStyle = rgba(P.linen, 0.6); g.lineWidth = Math.max(0.6, s * 0.04);
      g.beginPath(); g.moveTo(0, -u * 0.32); g.lineTo(0, u * 0.6); g.stroke();
      break;
  }
  g.restore();
}

/* ---------------- wall inscriptions (never the six signs of the pans) ---------------- */
function drawDecoGlyph(g, kind, x, y, s, col) {
  g.save(); g.translate(x, y);
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = Math.max(0.8, s * 0.09); g.lineCap = 'round'; g.lineJoin = 'round';
  const u = s / 2;
  switch (kind) {
    case 0: ell(g, 0, 0, u * 0.55, u * 0.55); g.stroke(); ell(g, 0, 0, u * 0.12, u * 0.12); g.fill(); break;            // sun
    case 1: g.beginPath(); for (let k = 0; k <= 6; k++) g.lineTo(-u * 0.8 + k * u * 0.27, k % 2 ? -u * 0.15 : u * 0.15); g.stroke(); break; // water
    case 2: g.beginPath(); g.moveTo(0, u * 0.8); g.quadraticCurveTo(-u * 0.45, 0, 0, -u * 0.8); g.quadraticCurveTo(u * 0.25, 0, 0, u * 0.8); g.stroke(); break; // reed
    case 3: ell(g, 0, 0, u * 0.7, u * 0.3); g.stroke(); break;                                                           // mouth
    case 4: g.beginPath(); g.moveTo(-u * 0.6, u * 0.3); g.quadraticCurveTo(0, -u * 0.7, u * 0.6, u * 0.3); g.closePath(); g.stroke(); break; // loaf
    case 5: g.beginPath(); g.moveTo(-u * 0.6, u * 0.6); g.lineTo(-u * 0.6, -u * 0.5); g.lineTo(u * 0.6, -u * 0.5); g.lineTo(u * 0.6, u * 0.6); g.stroke(); break; // house
    case 6: g.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? u * 0.25 : u * 0.65; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); g.stroke(); break; // star
    case 7: g.beginPath(); g.moveTo(-u * 0.7, u * 0.5); g.lineTo(-u * 0.2, -u * 0.6); g.lineTo(u * 0.3, u * 0.5); g.moveTo(u * 0.1, -u * 0.2); g.lineTo(u * 0.7, -u * 0.2); g.stroke(); break; // legs-and-arm
  }
  g.restore();
}

/* ---------------- glyphs of the record (one per stroke) ---------------- */
// Footprints for walking, a seated man for standing, hands for taking.
function drawStepGlyph(g, tok, out, x, y, s, col) {
  g.save();
  g.translate(x, y);
  g.fillStyle = col; g.strokeStyle = col;
  g.lineWidth = Math.max(0.8, s * 0.08); g.lineCap = 'round'; g.lineJoin = 'round';
  const u = s / 2;
  if (tok === 'U' || tok === 'D' || tok === 'L' || tok === 'R') {
    const ang = { U: 0, R: Math.PI / 2, D: Math.PI, L: -Math.PI / 2 }[tok];
    g.rotate(ang);
    for (const sx of [-1, 1]) {
      const fx = sx * u * 0.26, fy = sx < 0 ? -u * 0.15 : u * 0.2;
      ell(g, fx, fy, u * 0.16, u * 0.34); g.fill();
      ell(g, fx, fy - u * 0.44, u * 0.11, u * 0.08); g.fill();
    }
    if (out && out.k === 'bump') { g.lineWidth = Math.max(1, s * 0.11); g.beginPath(); g.moveTo(-u * 0.6, -u * 0.85); g.lineTo(u * 0.6, -u * 0.85); g.stroke(); }
    if (out && out.k === 'push') { g.strokeRect(-u * 0.35, -u * 1.0, u * 0.7, u * 0.32); }
  } else if (tok === 'W') { // seated man
    ell(g, u * 0.15, -u * 0.6, u * 0.2, u * 0.2); g.fill();
    g.beginPath(); g.moveTo(u * 0.05, -u * 0.38); g.lineTo(-u * 0.1, u * 0.35); g.lineTo(u * 0.55, u * 0.35); g.lineTo(u * 0.55, u * 0.75); g.stroke();
    g.beginPath(); g.moveTo(u * 0.05, -u * 0.2); g.lineTo(u * 0.5, -u * 0.05); g.stroke();
  } else if (tok === 'A') { // arm and hand
    const k = out ? out.k : 'grasp';
    g.beginPath(); g.moveTo(-u * 0.85, u * 0.2); g.lineTo(u * 0.2, u * 0.2); g.stroke();
    if (k === 'take') { g.beginPath(); g.moveTo(u * 0.2, u * 0.2); g.quadraticCurveTo(u * 0.8, u * 0.1, u * 0.65, -u * 0.35); g.stroke(); ell(g, u * 0.55, -u * 0.6, u * 0.2, u * 0.2); g.fill(); }
    else if (k === 'set') { g.beginPath(); g.moveTo(u * 0.2, u * 0.2); g.lineTo(u * 0.75, u * 0.45); g.stroke(); ell(g, u * 0.6, u * 0.85, u * 0.22, u * 0.14); g.fill(); }
    else { g.beginPath(); g.moveTo(u * 0.2, u * 0.2); g.lineTo(u * 0.75, -u * 0.05); g.moveTo(u * 0.2, u * 0.2); g.lineTo(u * 0.75, u * 0.45); g.stroke(); }
  } else if (tok === '-') { // nothing more written: a quiet dash
    g.globalAlpha *= 0.45;
    g.beginPath(); g.moveTo(-u * 0.5, 0); g.lineTo(u * 0.5, 0); g.stroke();
  }
  g.restore();
}

// Egyptian numerals: heel-bones for tens, strokes for units.
function drawNumeral(g, n, x, y, s, col) {
  g.save();
  g.strokeStyle = col; g.lineWidth = Math.max(1, s * 0.12); g.lineCap = 'round';
  const tens = Math.floor(n / 10), units = n % 10;
  let cx = x;
  for (let k = 0; k < tens; k++) {
    g.beginPath(); g.moveTo(cx, y + s * 0.5); g.lineTo(cx, y - s * 0.15);
    g.quadraticCurveTo(cx, y - s * 0.55, cx + s * 0.25, y - s * 0.55);
    g.quadraticCurveTo(cx + s * 0.5, y - s * 0.55, cx + s * 0.5, y - s * 0.15); g.lineTo(cx + s * 0.5, y + s * 0.5);
    g.stroke(); cx += s * 0.72;
  }
  const rows = units > 4 ? 2 : 1, perRow = Math.ceil(units / rows);
  for (let k = 0; k < units; k++) {
    const row = Math.floor(k / perRow), col = k % perRow;
    const yy0 = rows === 1 ? y - s * 0.5 : y - s * 0.5 + row * s * 0.55;
    const yy1 = rows === 1 ? y + s * 0.5 : yy0 + s * 0.42;
    g.beginPath(); g.moveTo(cx + col * s * 0.22, yy0); g.lineTo(cx + col * s * 0.22, yy1); g.stroke();
  }
  g.restore();
  return cx + perRow * s * 0.22 - x;
}

/* ---------------- text with rubrics ---------------- */
// Splits "{red} plain _hand_" into styled words and wraps them to a width.
function parseRuns(text) {
  const runs = [];
  let mode = 'ink', buf = '';
  const flush = () => { if (buf) runs.push({ t: buf, m: mode }); buf = ''; };
  for (const ch of text) {
    if (ch === '{' || ch === '_' && mode === 'ink') { flush(); mode = ch === '{' ? 'red' : 'hand'; }
    else if (ch === '}' && mode === 'red' || ch === '_' && mode === 'hand') { flush(); mode = 'ink'; }
    else buf += ch;
  }
  flush();
  return runs;
}
function runFont(px, m, base) {
  if (m === 'hand') return font(px * 1.02, 'italic');
  return font(px, base || '');
}
function layoutText(g, text, px, maxW, base) {
  const words = [];
  for (const run of parseRuns(text)) {
    const parts = run.t.split(/(\s+)/);
    for (const p of parts) if (p) words.push({ t: p, m: run.m, sp: /^\s+$/.test(p) });
  }
  const lines = [];
  let line = [], w = 0;
  for (const wd of words) {
    g.font = runFont(px, wd.m, base);
    const ww = g.measureText(wd.t).width;
    if (wd.sp) { if (line.length) { line.push({ ...wd, w: ww }); w += ww; } continue; }
    if (w + ww > maxW && line.length) {
      while (line.length && line[line.length - 1].sp) { w -= line.pop().w; }
      lines.push({ words: line, w }); line = []; w = 0;
    }
    line.push({ ...wd, w: ww }); w += ww;
  }
  while (line.length && line[line.length - 1].sp) { w -= line.pop().w; }
  if (line.length) lines.push({ words: line, w });
  return lines;
}
// Returns the height used. align: 'left' | 'center'. reveal: chars to show (ink drying in).
function drawText(g, text, x, y, px, maxW, opts) {
  const o = opts || {};
  const lh = px * (o.lh || 1.38);
  const lines = layoutText(g, text, px, maxW, o.base);
  let shown = o.reveal == null ? Infinity : o.reveal;
  g.textBaseline = 'alphabetic';
  lines.forEach((ln, i) => {
    let cx = o.align === 'center' ? x - ln.w / 2 : x;
    const cy = y + px + i * lh;
    for (const wd of ln.words) {
      if (shown <= 0) return;
      g.font = runFont(px, wd.m, o.base);
      g.fillStyle = wd.m === 'red' ? (o.red || P.red) : wd.m === 'hand' ? (o.hand || P.red) : (o.color || P.ink);
      const t = shown < wd.t.length ? wd.t.slice(0, shown) : wd.t;
      g.fillText(t, cx, cy);
      shown -= wd.t.length;
      cx += wd.w;
    }
  });
  return lines.length * lh;
}
function textHeight(g, text, px, maxW, opts) {
  return layoutText(g, text, px, maxW, opts && opts.base).length * px * ((opts && opts.lh) || 1.38);
}
function textLength(text) { return parseRuns(text).reduce((a, r) => a + r.t.length, 0); }

/* =====================================================================
   FIGURES  (drawn in the canon: the living in profile, clay frontal)
   Every figure is drawn in its own units: feet on y = 0, height 1.
   ===================================================================== */

// Answerer materials, in the order Hori made them; Tamit's is separate.
const MATS = [
  { key: 'mud', body: '#6B4A30', shade: '#4E3421', face: '#7D573A', wig: '#21180F', ink: '#E9D9B6', line: '#2A1B10' },
  { key: 'limestone', body: '#E6DCC6', shade: '#C7B897', face: '#EDE5D2', wig: '#2A221C', ink: '#211A14', line: '#3A2E22' },
  { key: 'tamarisk', body: '#2F2721', shade: '#1D1712', face: '#3D332B', wig: '#16110D', ink: '#D9A93F', line: '#0E0A07' },
  { key: 'faience', body: '#3E9A8A', shade: '#2C7468', face: '#58AE9E', wig: '#1D2B45', ink: '#14231F', line: '#173B35' },
];
const TAMIT_MAT = { key: 'tamit', body: '#B0673F', shade: '#8C4D2C', face: '#BF7A50', wig: '#2A1A10', ink: '#7A2412', line: '#4A2412' };

function limb(g, x1, y1, x2, y2, w1, w2, fill, stroke, lw) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, wm = (w1 + w2) / 2 * 1.08;
  poly(g, [x1 + nx * w1, y1 + ny * w1, mx + nx * wm, my + ny * wm, x2 + nx * w2, y2 + ny * w2,
    x2 - nx * w2, y2 - ny * w2, mx - nx * wm, my - ny * wm, x1 - nx * w1, y1 - ny * w1]);
  fillStroke(g, fill, stroke, lw);
}

/* ---------- a figure of the living, in profile ----------
   o: facing, walkP (0..1 within a step), lead (+1/-1 which leg leads), bob,
      skin, head ('man' | 'ibis' | 'jackal'), wig, kilt, collar, palette,
      carry (fn(g, hx, hy) drawing the held thing at the hands), arms ('swing' | 'carry' | 'write'),
      silhouette (one flat colour, no lines), blink */
function drawMan(g, x, y, h, o) {
  g.save();
  g.translate(x, y);
  g.scale(o.facing < 0 ? -h : h, h);
  g.translate(0, o.bob || 0);
  const sil = o.silhouette;
  const lw = (o.lw || 1.5) / h;
  const ink = sil ? null : P.ink;
  const skin = sil || o.skin || P.skin;
  const kilt = sil || o.kilt || P.linen;
  g.lineJoin = 'round'; g.lineCap = 'round';

  const p = o.walkP || 0, lead = o.lead || 1;
  const sw = Math.cos(Math.PI * p);              // 1 at the start of a step, -1 at the end
  const lift = Math.sin(Math.PI * p) * 0.035;
  // leg A starts in front when lead = 1
  const fa = 0.085 * sw * lead + 0.01, fb = -0.085 * sw * lead + 0.01;
  const front = fa >= fb ? { x: fa, y: lead > 0 ? 0 : -lift } : { x: fb, y: lead > 0 ? -lift : 0 };
  const back = fa >= fb ? { x: fb, y: lead > 0 ? -lift : 0 } : { x: fa, y: lead > 0 ? 0 : -lift };
  if (!o.walkP) { front.x = 0.095; front.y = 0; back.x = -0.07; back.y = 0; }

  const swing = o.arms === 'swing' ? 0.32 * sw * lead : 0;
  const armBack = () => {
    if (o.arms === 'carry' || o.arms === 'write') {
      limb(g, -0.09, -0.74, -0.02, -0.6, 0.03, 0.024, mix(skin, '#000000', sil ? 0 : 0.12), ink, lw);
      limb(g, -0.02, -0.6, 0.1, -0.6, 0.024, 0.02, mix(skin, '#000000', sil ? 0 : 0.12), ink, lw);
    } else {
      const a = 0.18 - swing;
      const ex = -0.1 - Math.sin(a) * 0.17, ey = -0.74 + Math.cos(a) * 0.17;
      limb(g, -0.095, -0.745, ex, ey, 0.03, 0.024, mix(skin, '#000000', sil ? 0 : 0.12), ink, lw);
      const hx = ex - Math.sin(a * 0.7) * 0.15, hy = ey + Math.cos(a * 0.7) * 0.15;
      limb(g, ex, ey, hx, hy, 0.024, 0.019, mix(skin, '#000000', sil ? 0 : 0.12), ink, lw);
      ell(g, hx, hy + 0.012, 0.022, 0.026); fillStroke(g, mix(skin, '#000000', sil ? 0 : 0.12), ink, lw);
      if (o.palette && !sil) { // the scribe's palette, held low in the back hand
        g.save(); g.translate(hx, hy + 0.02); g.rotate(-0.25 + a * 0.5);
        rrect(g, -0.015, -0.01, 0.03, 0.15, 0.008); fillStroke(g, P.linen, ink, lw);
        ell(g, 0, 0.02, 0.008, 0.008); g.fillStyle = P.red; g.fill();
        ell(g, 0, 0.042, 0.008, 0.008); g.fillStyle = P.ink; g.fill();
        g.restore();
      }
    }
  };
  const leg = (f, behind) => {
    const c = behind ? mix(skin, '#000000', sil ? 0 : 0.12) : skin;
    limb(g, behind ? -0.015 : 0.02, -0.5, f.x, f.y - 0.04, 0.042, 0.021, c, ink, lw);
    poly(g, [f.x - 0.03, f.y, f.x - 0.026, f.y - 0.045, f.x + 0.016, f.y - 0.05, f.x + 0.085, f.y - 0.01, f.x + 0.085, f.y]);
    fillStroke(g, c, ink, lw);
  };
  armBack();
  leg(back, true);
  // torso
  poly(g, [-0.115, -0.765, 0.112, -0.765, 0.088, -0.69, 0.07, -0.6, 0.066, -0.535, -0.062, -0.535, -0.078, -0.62, -0.1, -0.7]);
  fillStroke(g, skin, ink, lw);
  // kilt with pleated apron
  poly(g, [-0.068, -0.545, 0.074, -0.545, 0.135, -0.3, -0.088, -0.3]);
  fillStroke(g, kilt, ink, lw);
  if (!sil) {
    poly(g, [0.02, -0.53, 0.14, -0.305, 0.035, -0.29]); fillStroke(g, mix(kilt, '#C8B48C', 0.25), ink, lw * 0.8);
    g.strokeStyle = rgba(P.ink, 0.35); g.lineWidth = lw * 0.6;
    for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(0.03 + k * 0.02, -0.5 + k * 0.03); g.lineTo(0.04 + k * 0.03, -0.3); g.stroke(); }
    g.fillStyle = o.belt || P.red; g.fillRect(-0.068, -0.56, 0.142, 0.03);
  }
  leg(front, false);
  // neck and head
  poly(g, [-0.022, -0.81, 0.036, -0.81, 0.04, -0.75, -0.03, -0.75]); fillStroke(g, skin, ink, lw);
  if (!sil && o.collar !== false) { // broad collar
    const cols = o.collarCols || [P.faience, P.red, P.ochre, P.blue];
    for (let k = 0; k < cols.length; k++) {
      g.strokeStyle = cols[k]; g.lineWidth = 0.017;
      g.beginPath(); g.moveTo(-0.1, -0.762 + k * 0.004); g.quadraticCurveTo(0.0, -0.69 + k * 0.016, 0.105, -0.765 + k * 0.004); g.stroke();
    }
    g.strokeStyle = ink; g.lineWidth = lw * 0.7;
    g.beginPath(); g.moveTo(-0.1, -0.745); g.quadraticCurveTo(0.0, -0.655, 0.105, -0.748); g.stroke();
  }
  drawHead(g, o, skin, ink, lw, sil);
  // front arm, over everything
  if (o.arms === 'carry') {
    limb(g, 0.095, -0.745, 0.13, -0.62, 0.03, 0.024, skin, ink, lw);
    limb(g, 0.13, -0.62, 0.2, -0.66, 0.024, 0.02, skin, ink, lw);
    if (o.carry) o.carry(g, 0.2, -0.67, lw);
    ell(g, 0.2, -0.66, 0.024, 0.022); fillStroke(g, skin, ink, lw);
  } else if (o.arms === 'write') {
    limb(g, 0.095, -0.745, 0.15, -0.64, 0.03, 0.024, skin, ink, lw);
    limb(g, 0.15, -0.64, 0.16 + (o.pen || 0) * 0.02, -0.75, 0.024, 0.02, skin, ink, lw);
    if (!sil) { g.strokeStyle = P.ink; g.lineWidth = lw * 1.1; g.beginPath(); g.moveTo(0.16, -0.74); g.lineTo(0.2, -0.82); g.stroke(); }
    if (o.carry) o.carry(g, 0.1, -0.6, lw);
  } else {
    const a = 0.12 + swing;
    const ex = 0.1 + Math.sin(a) * 0.17, ey = -0.745 + Math.cos(a) * 0.17;
    limb(g, 0.1, -0.745, ex, ey, 0.03, 0.024, skin, ink, lw);
    const hx = ex + Math.sin(a * 0.6) * 0.15, hy = ey + Math.cos(a * 0.6) * 0.15;
    limb(g, ex, ey, hx, hy, 0.024, 0.019, skin, ink, lw);
    ell(g, hx, hy + 0.012, 0.022, 0.026); fillStroke(g, skin, ink, lw);
    if (o.carry) o.carry(g, hx, hy, lw);
  }
  g.restore();
}

function drawHead(g, o, skin, ink, lw, sil) {
  const kind = o.head || 'man';
  if (kind === 'man') {
    poly(g, [-0.065, -0.88, -0.06, -0.93, -0.03, -0.965, 0.02, -0.972, 0.055, -0.952, 0.068, -0.92, 0.074, -0.905,
      0.098, -0.882, 0.08, -0.872, 0.083, -0.86, 0.077, -0.848, 0.074, -0.836, 0.05, -0.818, 0.02, -0.81, -0.03, -0.82, -0.06, -0.85]);

    poly(g, [-0.068, -0.86, -0.062, -0.935, -0.03, -0.97, 0.02, -0.978, 0.058, -0.955, 0.062, -0.935, 0.03, -0.935, 0.0, -0.905, -0.02, -0.86]);

    ell(g, -0.004, -0.882, 0.014, 0.02); fillStroke(g, mix(skin, '#000000', 0.12), ink, lw * 0.8);

    g.save();

    if (!blink) g.quadraticCurveTo(0.047, -0.896, 0.028, -0.905);
    g.fillStyle = P.linen; if (!blink) g.fill();
    g.strokeStyle = P.ink; g.lineWidth = lw * 1.1; g.stroke();
    if (!blink) { ell(g, 0.05, -0.906, 0.0065, 0.0065); g.fillStyle = P.ink; g.fill(); }
    g.beginPath(); g.moveTo(0.028, -0.905); g.lineTo(0.008, -0.9); g.stroke();
    g.lineWidth = lw * 0.9; g.beginPath(); g.moveTo(0.03, -0.926); g.quadraticCurveTo(0.05, -0.934, 0.068, -0.924); g.stroke();
    g.restore();
    if (o.brush) { g.strokeStyle = P.ink; g.lineWidth = lw * 1.2; g.beginPath(); g.moveTo(-0.03, -0.955); g.lineTo(0.03, -0.99); g.stroke();
      g.strokeStyle = P.red; g.beginPath(); g.moveTo(0.03, -0.99); g.lineTo(0.04, -0.995); g.stroke(); }

  const wig = sil || o.wig || P.blueDeep;
  poly(g, [-0.075, -0.95, -0.03, -0.985, 0.03, -0.975, 0.045, -0.93, 0.03, -0.86, 0.035, -0.71, -0.02, -0.7, -0.03, -0.82, -0.085, -0.72, -0.105, -0.74, -0.09, -0.86]);
  fillStroke(g, wig, ink, lw);
  if (!sil) {
    g.strokeStyle = rgba(P.linen, 0.35); g.lineWidth = lw * 0.7;
    for (let k = 0; k < 6; k++) { g.beginPath(); g.moveTo(-0.08 + k * 0.012, -0.93); g.lineTo(-0.1 + k * 0.012, -0.76); g.stroke(); }
    g.beginPath(); g.moveTo(0.012, -0.85); g.lineTo(0.01, -0.73); g.stroke();
  }
  const dark = sil || P.ink;
  if (kind === 'ibis') {
    ell(g, 0.03, -0.93, 0.05, 0.04, -0.2); fillStroke(g, dark, null);
    g.beginPath(); g.moveTo(0.07, -0.945); g.quadraticCurveTo(0.2, -0.93, 0.255, -0.82);
    g.quadraticCurveTo(0.19, -0.9, 0.065, -0.915); g.closePath(); fillStroke(g, dark, null);
    if (!sil) { ell(g, 0.045, -0.94, 0.008, 0.008); g.fillStyle = P.linen; g.fill(); }
  } else if (kind === 'jackal') {

/* ---------- an answerer: a shabti figure, seen from the front ----------
   o: mat, hop (0..1), sway, cracked, carryKind, carryFn, rest, tilt, child */
function drawShabti(g, x, y, h, o) {
  const m = o.mat;
  g.save();
  g.translate(x, y - (o.lift || 0) * h);
  if (o.tilt) g.rotate(o.tilt);
  const sq = o.squash || 0;
  g.scale(h * (1 + sq * 0.12), h * (1 - sq * 0.1));
  const lw = 1.4 / h;
  g.lineJoin = 'round'; g.lineCap = 'round';
  const child = !!o.child;
  // base
  rrect(g, -0.16, -0.045, 0.32, 0.045, 0.01); fillStroke(g, m.shade, m.line, lw);
  // mummiform body (Tamit's is lopsided)
  const a = child ? 0.025 : 0;
  poly(g, [-0.115, -0.045, -0.14 - a, -0.28, -0.15, -0.44, -0.19 - a, -0.66, -0.17, -0.72, 0.17, -0.72, 0.195, -0.65, 0.155 + a, -0.42, 0.13, -0.26, 0.11, -0.045]);
  fillStroke(g, m.body, m.line, lw);
  // shading down one side
  poly(g, [0.06, -0.06, 0.11, -0.05, 0.13, -0.26, 0.155, -0.42, 0.195, -0.65, 0.12, -0.66, 0.1, -0.4, 0.08, -0.25]);
  g.fillStyle = rgba('#000000', 0.12); g.fill();
  // the writing: bands of signs (what Thoth wrote, or a child's scrawl)
  const r = rng(o.seed || 7);
  g.strokeStyle = m.ink; g.fillStyle = m.ink;
  for (let k = 0; k < 5; k++) {
    const yy = -0.39 + k * 0.07, half = 0.13 - k * 0.006;
    if (o.blank) { g.globalAlpha = 0.18; }
    g.lineWidth = lw * 0.8;
    g.beginPath(); g.moveTo(-half, yy); g.lineTo(half, yy + (child ? (r() - 0.5) * 0.03 : 0)); g.stroke();
    if (!o.blank) {
      g.lineWidth = lw * 0.9;
      for (let j = 0; j < 5; j++) {
        const gx = -half + 0.025 + j * (half * 2 - 0.05) / 4, kind = r();
        g.beginPath();
        if (kind < 0.3) { g.moveTo(gx, yy + 0.012); g.lineTo(gx, yy + 0.05); }
        else if (kind < 0.55) { g.arc(gx, yy + 0.033, 0.013, 0, Math.PI * 2); }
        else if (kind < 0.8) { g.moveTo(gx - 0.015, yy + 0.045); g.lineTo(gx, yy + 0.015); g.lineTo(gx + 0.015, yy + 0.045); }
        else { g.moveTo(gx - 0.016, yy + 0.03); g.lineTo(gx + 0.016, yy + 0.03); }
        g.stroke();
      }
    }
    g.globalAlpha = 1;
  }
  // crossed arms holding hoes
  limb(g, -0.17, -0.64, 0.07, -0.545, 0.032, 0.03, m.body, m.line, lw);
  limb(g, 0.17, -0.64, -0.07, -0.545, 0.032, 0.03, m.body, m.line, lw);
  for (const sx of [-1, 1]) {
    ell(g, sx * 0.075, -0.548, 0.03, 0.026); fillStroke(g, m.face, m.line, lw);
    g.strokeStyle = m.line; g.lineWidth = lw * 1.5;
    g.beginPath(); g.moveTo(sx * 0.075, -0.6); g.lineTo(sx * 0.1, -0.47); g.stroke();
    poly(g, [sx * 0.1, -0.47, sx * 0.135, -0.455, sx * 0.13, -0.435, sx * 0.095, -0.45]); fillStroke(g, m.line, null);
  }
  // the wig with its lappets, then the face
  if (child) {
    ell(g, 0, -0.83, 0.155, 0.16); fillStroke(g, m.face, m.line, lw);
    g.fillStyle = m.wig; g.beginPath(); g.moveTo(0.1, -0.93); g.quadraticCurveTo(0.2, -0.85, 0.16, -0.66);
    g.quadraticCurveTo(0.12, -0.75, 0.12, -0.86); g.fill(); // the sidelock of youth
    ell(g, -0.055, -0.85, 0.022, 0.022); g.fillStyle = P.ink; g.fill();
    ell(g, 0.045, -0.845, 0.018, 0.024); g.fill();
    g.strokeStyle = P.ink; g.lineWidth = lw * 1.1; g.beginPath(); g.moveTo(-0.06, -0.78); g.quadraticCurveTo(-0.005, -0.73, 0.06, -0.785); g.stroke();
    g.fillStyle = rgba('#4A2412', 0.35);
    for (let k = 0; k < 6; k++) { ell(g, -0.1 + r() * 0.2, -0.2 - r() * 0.4, 0.018, 0.012, r() * 3); g.fill(); }
  } else {
    poly(g, [-0.2, -0.66, -0.2, -0.86, -0.15, -0.97, 0, -1.0, 0.15, -0.97, 0.2, -0.86, 0.2, -0.66, 0.13, -0.66, 0.12, -0.8, -0.12, -0.8, -0.13, -0.66]);
    fillStroke(g, m.wig, m.line, lw);
    g.strokeStyle = rgba(m.ink === P.ink ? '#6E8FBF' : m.ink, 0.45); g.lineWidth = lw * 0.7;
    for (let k = 0; k < 4; k++) { const yy = -0.77 + k * 0.03; g.beginPath(); g.moveTo(-0.195, yy); g.lineTo(-0.135, yy); g.moveTo(0.135, yy); g.lineTo(0.195, yy); g.stroke(); }
    ell(g, 0, -0.81, 0.105, 0.125); fillStroke(g, m.face, m.line, lw);
    g.strokeStyle = m.line; g.lineWidth = lw * 0.9;
    if (o.rest) { g.beginPath(); g.moveTo(-0.06, -0.835); g.lineTo(-0.02, -0.835); g.moveTo(0.02, -0.835); g.lineTo(0.06, -0.835); g.stroke(); }
    else {
      for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(sx * 0.065, -0.835); g.quadraticCurveTo(sx * 0.04, -0.85, sx * 0.015, -0.835); g.quadraticCurveTo(sx * 0.04, -0.825, sx * 0.065, -0.835); g.stroke();
        ell(g, sx * 0.04, -0.836, 0.008, 0.008); g.fillStyle = m.line; g.fill(); }
    }
    g.beginPath(); g.moveTo(0, -0.82); g.lineTo(-0.008, -0.785); g.moveTo(-0.025, -0.755); g.lineTo(0.025, -0.755); g.stroke();
  }
  if (o.cracked) {
    g.strokeStyle = P.ink; g.lineWidth = lw * 2.4;
    g.beginPath(); g.moveTo(-0.02, -1.0); g.lineTo(0.04, -0.8); g.lineTo(-0.03, -0.62); g.lineTo(0.05, -0.4); g.lineTo(-0.02, -0.2); g.lineTo(0.03, -0.05); g.stroke();
    g.lineWidth = lw * 1.6; g.beginPath(); g.moveTo(0.04, -0.8); g.lineTo(0.12, -0.75); g.moveTo(-0.03, -0.62); g.lineTo(-0.12, -0.55); g.moveTo(0.05, -0.4); g.lineTo(0.12, -0.3); g.stroke();
    g.strokeStyle = P.red; g.lineWidth = lw * 0.9;
    g.beginPath(); g.moveTo(-0.02, -1.0); g.lineTo(0.04, -0.8); g.lineTo(-0.03, -0.62); g.lineTo(0.05, -0.4); g.lineTo(-0.02, -0.2); g.stroke();
  }
  if (o.carryFn) o.carryFn(g, 0, -0.6, lw);
  g.restore();
}

/* ---------- the parts of the self ---------- */
function drawItem(g, kind, x, y, s, t, held, lwUnits) {
  g.save();
  g.translate(x, y);
  g.lineJoin = 'round'; g.lineCap = 'round';
  const lw = lwUnits || Math.max(1, s * 0.045);
  if (kind === 'name') { // a flake of limestone with a falcon: Hori, "he of Horus"
    const bob = held ? 0 : Math.sin(t * 2) * s * 0.02;
    g.translate(0, bob);
    poly(g, [-s * 0.32, s * 0.05, -s * 0.24, -s * 0.2, s * 0.05, -s * 0.27, s * 0.3, -s * 0.15, s * 0.33, s * 0.1, s * 0.05, s * 0.2, -s * 0.2, s * 0.16]);
    fillStroke(g, '#F1EADA', P.ink, lw);
    g.fillStyle = P.ink;
    g.beginPath(); g.moveTo(-s * 0.12, s * 0.08); g.quadraticCurveTo(-s * 0.15, -s * 0.1, -s * 0.02, -s * 0.13);
    g.lineTo(s * 0.03, -s * 0.17); g.lineTo(s * 0.06, -s * 0.12); g.quadraticCurveTo(s * 0.04, s * 0.0, s * 0.09, s * 0.09); g.closePath(); g.fill();
    g.strokeStyle = P.red; g.lineWidth = lw;
    for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(s * (0.14 + k * 0.05), -s * 0.1); g.lineTo(s * (0.14 + k * 0.05), s * 0.08); g.stroke(); }
  } else if (kind === 'shadow') { // lying: a dark cloak in the shape of a man
    g.fillStyle = rgba(P.apep, held ? 0.8 : 0.72);
    g.beginPath();
    g.ellipse(-s * 0.32, -s * 0.02, s * 0.09, s * 0.07, 0, 0, Math.PI * 2);
    g.moveTo(-s * 0.22, -s * 0.06); g.lineTo(s * 0.2, -s * 0.08); g.lineTo(s * 0.42, -s * 0.03); g.lineTo(s * 0.42, s * 0.05);
    g.lineTo(s * 0.2, s * 0.08); g.lineTo(-s * 0.22, s * 0.06); g.closePath(); g.fill();
    g.strokeStyle = rgba(P.apep, 0.5); g.lineWidth = s * 0.05;
    g.beginPath(); g.moveTo(-s * 0.12, -s * 0.07); g.lineTo(s * 0.05, -s * 0.15); g.moveTo(-s * 0.12, s * 0.07); g.lineTo(s * 0.08, s * 0.14); g.stroke();
  } else if (kind === 'ba') { // the ba: a hawk with Hori's face
    const hop = held ? 0 : Math.max(0, Math.sin(t * 3.2)) * s * 0.05;
    const flap = Math.sin(t * (held ? 2 : 9)) * 0.5 + 0.5;
    g.translate(0, -hop);
    const u = s * 0.9;
    g.strokeStyle = P.ink; g.lineWidth = lw;
    g.beginPath(); g.moveTo(-u * 0.04, -u * 0.08); g.lineTo(-u * 0.06, 0); g.moveTo(u * 0.06, -u * 0.08); g.lineTo(u * 0.06, 0); g.stroke();
    poly(g, [-u * 0.32, -u * 0.25, -u * 0.18, -u * 0.18, -u * 0.38, -u * 0.12]); fillStroke(g, P.blue, P.ink, lw * 0.8);
    ell(g, 0, -u * 0.2, u * 0.2, u * 0.13, -0.15); fillStroke(g, P.ochre, P.ink, lw);
    g.save(); g.translate(-u * 0.02, -u * 0.24); g.rotate(-0.25 - flap * 0.5);
    poly(g, [0, 0, -u * 0.3, -u * 0.02, -u * 0.26, u * 0.07, -u * 0.05, u * 0.08]); fillStroke(g, P.faience, P.ink, lw * 0.8);
    g.strokeStyle = P.red; g.lineWidth = lw * 0.8; g.beginPath(); g.moveTo(-u * 0.08, u * 0.02); g.lineTo(-u * 0.22, u * 0.03); g.stroke();
    g.restore();
    ell(g, u * 0.17, -u * 0.38, u * 0.085, u * 0.09); fillStroke(g, P.skin, P.ink, lw);
    poly(g, [u * 0.09, -u * 0.36, u * 0.1, -u * 0.46, u * 0.2, -u * 0.48, u * 0.24, -u * 0.43, u * 0.17, -u * 0.43, u * 0.14, -u * 0.36]);
    fillStroke(g, P.ink, null);
    ell(g, u * 0.205, -u * 0.39, u * 0.012, u * 0.01); g.fillStyle = P.linen; g.fill();
  } else if (kind === 'heart') { // the ib: a heart shaped like a little jar
    const beat = held ? 1 : 1 + Math.max(0, Math.sin(t * 2.6)) * 0.05;
    g.scale(beat, beat);
    g.beginPath(); g.moveTo(-s * 0.1, -s * 0.3); g.lineTo(s * 0.1, -s * 0.3); g.lineTo(s * 0.08, -s * 0.22);

    g.quadraticCurveTo(-s * 0.17, s * 0.18, -s * 0.22, s * 0.0); g.quadraticCurveTo(-s * 0.26, -s * 0.18, -s * 0.08, -s * 0.22); g.closePath();
