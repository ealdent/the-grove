<style>
  :root {
    --plaster: #e7d3b0;
    --plaster-light: #f3e6cf;
    --paper: #f6efe2;
    --ink: #2c1810;

<body>
<div id="stage">
  <canvas id="board" width="544" height="714" aria-label="The bakery floor"></canvas>
  <div id="paper" role="dialog" aria-modal="true">
    <h1 id="paper-title"></h1>
    <p id="paper-body"></p>
    <div id="paper-actions"></div>
  </div>
</div>
<p id="note"></p>
<div class="pads" id="pads">
  <div class="pad" aria-label="Steps">
    <span></span>
    <button type="button" data-go="U" aria-label="Step north">↑</button>
    <span></span>
    <button type="button" data-go="L" aria-label="Step west">←</button>
    <button type="button" data-go="." aria-label="Stand and let a step pass">·</button>
    <button type="button" data-go="R" aria-label="Step east">→</button>
  </div>
  <div class="side">
    <button type="button" data-go="D" aria-label="Step south">step south</button>

  </div>
</div>
<p class="gloss">Arrows, or w a s d, are steps. Space is standing still. Enter strikes the kneading-bell early. Z unsays one step, even back through a bell. R begins this room again.</p>
<div class="rehearse-row">
  <button type="button" id="rehearse">Rehearse the office</button>
  <span id="rehearse-out"></span>
</div>
<script id="office">
/*
THE KNEADING OFFICE
====================

1. Title
   The Kneading Office

2. Premise
   You are the novice of a fen-edge bakery. Between the kneading-bell and the
   oven-bell the cellarer gives you forty steps, because the starter has gone
   cool and will not be trusted to a cold niche. When the oven-bell sounds, the
   room is restored and you begin again from the threshold, still yourself.

   The figures beside you are flour. The draught that climbs off the oven lifts
   the shape of whatever you disturb — a foot on a hearth-stone, a shoulder set
   to a trough, the angle of your hood — and holds that flour in the air in the
   posture you wore. At the next bell the draught spends the memory, and the
   flour walks those steps again, because warm air remembers a disturbance
   exactly and will not invent one. It can hold four hands. A fifth asks for
   warmth the oven has already spent.

   If a flour-hand reaches for a trough that is no longer where the shoulder
   expects, or a damper that has fallen, or a flag where you are standing, the
   memory has been lied to. The draught lets go. Every held handful drops at
   once, and the office breaks on that count. You may unsay a step, even back
   through a bell, until the room agrees again, or begin again from the
   threshold with the flour settled.

   The office is complete only when you, the living novice, set the crock in
   the proofing niche while every damper on the way is up, and while each
   earlier hand still meets the room it was promised. Then the cellarer strikes
   the oven-bell once. The draught sets the flour down as ordinary dust. The
   house eats at noon. You will not walk the forty steps again.

3. Art direction
   Palette: #e7d3b0 plaster, #f3e6cf plaster light, #f6efe2 paper, #c4a074
   flagstone, #8d6b45 grout, #5c3a28 timber, #3a2418 timber dark, #2c1810 soot
   ink, #e25b2a ember, #8f2d12 ember deep, #f6f1e6 flour, #c47a3a crust,
   #6e7d4f crock glaze, #3f4a2c glaze dark, #8d3b3b madder, #6d5344 wool,
   #e0b48a skin, #c6a15b bell brass, #3f5c3a herb.
   Light: a high east window (screen-right) gives a cool milk-gold wash;
   the oven mouth on the west (screen-left) gives a low ember rim. Shadows
   fall west. Shape language: round arches, thick chamfered timber, belly-round
   crocks and loaves, hooded shoulders, slightly irregular stones.
   Era: a 14th-century fen bakery — limewashed plaster, worn oak, iron-banded
   troughs, madder wool, oxidized green glaze, flour in the joints. A Book of
   Hours kitchen miniature.
   Typography: Liberation Serif / DejaVu Serif / Palatino / Georgia. Sentence
   case and title case, italic for the cellarer's asides. No monospace, no
   tracked capitals, no gradient type.

4. Voice
   The cellarer speaks to the novice, second person, fond and exact, as if
   teaching a house rule beside the oven.

HOUSE RULES (deterministic; documented where the brief left a choice)
-----------------------------------------------------------------------
- The whole office is a pure function of (room, kneading log). A kneading log
  is an array of strings. Every string but the last is a sealed kneading. The
  last string is the one you are walking now. Rendering may glide; the rules
  never do.
- Forty steps close a kneading by themselves. Enter seals it early, after at
  least one step. Sealing returns you to the threshold and the draught spends
  that kneading as a flour-hand. At most four hands can be held. A fifth seal
  breaks the office.
- Each step, hands act from the oldest kneading to the newest. You are last.
- A step into timber, a shut damper, or another body is spent standing still.
  You, being youngest, are merely stopped. A flour-hand that cannot finish the
  step it was owed makes the draught let go.
- A dough trough shoves one flag if the far flag is empty at that instant:
  not timber, not a shut damper, not the crock, not another trough, not the
  niche, not any body — including a younger body who has not yet stepped.
  There is no chain shove. Older hands shove first.
- Two bodies may share the threshold only before the first step of a kneading.
  After a step, if a flour-hand shares a flag, the draught lets go. The older
  hand keeps the claim; the message names both.
- Hearth-stones heed a body or a trough. Sole-stones heed only a foot, living
  or remembered; wood does not warm them. Stones are read when the step ends.
  The damper they govern rises on the NEXT step, and falls on the step after
  the weight is gone. At the first step every damper is down.
- The crock is lifted by whichever body enters its flag. It is never shoved.
  A hand whose steps end while holding it takes that memory of the crock out
  of the room; the crock is not left behind for you.
- Only the living novice completes the office, and only by standing in the
  proofing niche with the crock in hand.
- Z unsays the last thing that happened. A step comes back one at a time. If
  the present kneading has no step yet, Z unsays the bell. An early bell, once
  unsaid, restores that kneading at its last step and lifts its flour-hand, so
  you are inside it again. The fortieth step is what rings the oven-bell, so
  unsaying that bell also unsays the fortieth step. The same steps and the same
  bells afterwards build the same room.
- Same-flag conflicts: oldest kneading acts and keeps the flag. A later body
  that wanted it spends the step where it already stood, unless that later body
  is a flour-hand owed the flag — then the draught lets go.
*/

(function () {
  const CELL = 34;
  const COLS = 16;
  const TOP = 78;
  const BOT = 92;
  const WIDTH = COLS * CELL;
  const HEIGHT = TOP + COLS * CELL + BOT;
  const TICKS = 40;
  const FONT = '"Liberation Serif", "DejaVu Serif", Palatino, Georgia, serif';
  const PAL = {
    plaster: '#e7d3b0', plasterDeep: '#d9c09a', plasterLight: '#f3e6cf',
    flag: '#c4a074', flagDark: '#a8845c', grout: '#8d6b45',
    timber: '#5c3a28', timberDark: '#3a2418', soot: '#2c1810',
    ember: '#e25b2a', emberDeep: '#8f2d12', coal: '#3b1d14',
    flour: '#f6f1e6', crust: '#c47a3a', crustDark: '#8a4e22',
    crock: '#6e7d4f', crockDark: '#3f4a2c', madder: '#8d3b3b',
    wool: '#6d5344', woolDark: '#4a3428', skin: '#e0b48a',
    brass: '#c6a15b', herb: '#3f5c3a', paper: '#f6efe2'
  };
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0], '.': [0, 0] };
  const HANDS = ['the first hand', 'the second hand', 'the third hand', 'the fourth hand'];
  const HAND_RIM = ['#c4a074', '#8d3b3b', '#5c3a28', '#3f5c3a'];

  const RAW_LEVELS = [
    {
      id: 'hearth',
      name: 'The Hearth-Stone',
      intro: 'The oven damper falls unless the morning hearth-stone feels a foot. It rises on the step after the stone is weighted, and the flour only stands while the remembered steps last. Stand on the stone, let the bell take that standing, and on the next kneading carry the crock through. You cannot be the stone and the carrier in the same step.',
      success: 'The niche is warm, and the first hand did not fall. Come. The next room has a trough in the aisle, and the trough is heavier than pride.',
      names: { a: 'the morning hearth-stone', A: 'the oven damper' },
      /*
        Intended solution, threshold at (1,1), stone at (6,4), damper at (7,8),
        crock at (6,10), niche at (6,13).
        Kneading 1: RRRRRDDD then twenty stands, then the bell.
          The hand is on the stone from tick 8 through tick 28, so the damper
          is up on tick 12 when you cross.
        Kneading 2: down the west flags, east along the rank above the damper,
          through, and south with the crock.
          DDDDDDRRRRRRDDLDDDD
      */
      solution: [
        'RRRRRDDD....................',
        'DDDDDDRRRRRRDDLDDDD'
      ],
      rows: [
        '################',
        '#@.............#',
        '#..........===.#',
        '#..........===.#',
        '#.....a........#',
        '#..............#',
        '#..............#',
        '#..............#',
        '#######A########',
        '#..............#',
        '#.....C........#',
        '#..............#',
        '#==............#',
        '#==...N........#',
        '#..............#',
        '################'
      ]
    },
    {
      id: 'weight',
      name: 'A Weight of Dough',
      intro: 'The trough will do for the aisle damper; wood is heavy, and that hearth-stone is not proud. The far damper wants a foot. Teach one hand to shove the trough home and then to stand the whole count. On the kneading after, you bring the crock. Do not stand in the shove you already promised.',
      success: 'Wood held one damper, and a remembered foot held the other. Do not grow proud. In the last room the count is already written, and an early shove will lie to a hand you have already taught.',
      names: {
        a: 'the aisle hearth-stone', A: 'the aisle damper',
        b: 'the far hearth-stone', B: 'the niche damper'
      },
      /*
        Trough at (12,2), aisle stone at (14,2), aisle damper at (8,5),
        far stone at (1,8), niche damper at (8,10), crock (8,12), niche (8,14).
        Kneading 1 (forty steps, the oven-bell seals it):
          RRRRRRRRRRDRRLLLLLDDDDLLLLLLLDD.........
          Ten east, south, two shoves onto the aisle stone, back to the damper,
          through, and west onto the far stone, then stand.
        Kneading 2:
          DDDRRRRRRR...DDRRRRRRDDDLLLLLL.DDDDD
          West side first so the hand keeps the aisle, through once the trough
          has seated, around the east flags, and down with the crock while the
          far foot still weighs its stone.
      */
      solution: [
        'RRRRRRRRRRDRRLLLLLDDDDLLLLLLLDD.........',
        'DDDRRRRRRR...DDRRRRRRDDDLLLLLL.DDDDD'
      ],
      rows: [
        '################',
        '#@.............#',
        '#...........*.a#',
        '#....=.........#',
        '#.............=#',
        '########A#######',
        '#..............#',
        '#..............#',
        '#b.............#',
        '#..............#',
        '########B#######',
        '#..............#',
        '#.......C......#',
        '#.............=#',
        '#.......N.....=#',
        '################'
      ]
    },
    {
      id: 'count',
      name: 'The Count Already Written',
      intro: 'Two sole-stones guard the last niche, and a sole-stone will not heed a trough — only a foot, living or remembered. The dough trough lies in the short hall. You will want to shove it aside and walk straight down. Do not. That shove is already owed. Leave the hand their shoulder, take the west flags around, and let both feet keep their stones until the crock is in the niche.',
      success: '',
      names: {
        s: 'the west sole-stone', S: 'the west damper',
        t: 'the east sole-stone', T: 'the east damper'
      },
      /*
        West sole at (1,4), west damper at (8,6), trough at (8,8),
        east sole at (14,8), east damper at (8,12), crock (8,13), niche (8,14).
        Kneading 1, forty steps: DDD then stand. The first hand is on the west
          sole from tick 3 through the count, so the west damper is up from tick 4.
        Kneading 2, forty steps: the second hand goes the long way, waits one
          step above the trough, shoves it south on tick 19, and stands the
          east sole out the count. The east damper rises on tick 26.
          RRRRRRRRRLLDDDDDD.DRRRRRR then fifteen stands.
        Kneading 3, the living novice, who must not take that shove:
          RRRRRRRRDDDDDDLLLLLLDDDDRRRRRRDDD
          The first east step is spent, because the second hand already has
          that flag. Then east along the top, down beside the trough, west
          around it, down the west flags, and through the east damper.
        The obvious shove, RRRRRRRRDDDDDRDDRRR, moves the trough before tick 19.
          On kneading 2, tick 19, the second hand finds it gone.
      */
      solution: [
        'DDD' + '.'.repeat(37),
        'RRRRRRRRRLLDDDDDD.DRRRRRR' + '.'.repeat(15),
        'RRRRRRRRDDDDDDLLLLLLDDDDRRRRRRDDD'
      ],
      rows: null
    }
  ];

  function carveCount() {
    const g = Array.from({ length: 16 }, function (_, y) {
      return Array.from({ length: 16 }, function (_, x) {
        return (x === 0 || y === 0 || x === 15 || y === 15) ? '#' : '.';
      });
    });
    function set(x, y, c) { g[y][x] = c; }
    function fill(x0, y0, x1, y1, c) {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) g[y][x] = c;
    }
    set(1, 1, '@');
    set(1, 4, 's');
    fill(1, 6, 14, 6, '#'); set(8, 6, 'S');
    fill(1, 7, 14, 7, '#');
    for (let x = 2; x <= 8; x++) set(x, 7, '.');
    fill(1, 8, 14, 8, '#');
    set(2, 8, '.');
    set(8, 8, '*');
    for (let x = 9; x <= 14; x++) set(x, 8, '.');
    set(14, 8, 't');
    fill(1, 9, 14, 9, '#'); set(2, 9, '.'); set(8, 9, '.');
    fill(1, 10, 14, 10, '#'); set(2, 10, '.'); set(8, 10, '.');
    fill(1, 11, 14, 11, '#');
    for (let x = 2; x <= 8; x++) set(x, 11, '.');
    fill(1, 12, 14, 12, '#'); set(8, 12, 'T');
    set(8, 13, 'C');
    set(8, 14, 'N');
    set(2, 13, '='); set(3, 13, '='); set(3, 14, '=');
    set(12, 13, '='); set(13, 13, '='); set(12, 14, '='); set(13, 14, '=');
    return g.map(function (r) { return r.join(''); });
  }

  RAW_LEVELS[2].rows = carveCount();

  function parseLevel(def) {
    const walls = new Set();
    const sacks = new Set();
    const plates = [];
    const gates = [];
    const troughs = [];
    const placeNames = {};
    let start = null, crock = null, niche = null;
    const gateFor = { A: 'a', B: 'b', C: 'c', S: 's', T: 't' };
    const h = def.rows.length;
    const w = def.rows[0].length;
    for (let y = 0; y < h; y++) {
      if (def.rows[y].length !== w) throw new Error(def.name + ' row ' + y + ' is ' + def.rows[y].length);
      for (let x = 0; x < w; x++) {
        const ch = def.rows[y][x];
        const key = x + ',' + y;
        if (ch === '#' || ch === '=') {
          walls.add(key);
          if (ch === '=') sacks.add(key);
        } else if (ch === '@') start = { x: x, y: y };
        else if (ch === 'C') crock = { x: x, y: y };
        else if (ch === 'N') niche = { x: x, y: y };
        else if (ch === '*') troughs.push({ id: '*', x: x, y: y });
        else if (gateFor[ch]) gates.push({ id: ch, plate: gateFor[ch], x: x, y: y, name: def.names[ch] || ch });
        else if ('abcst'.indexOf(ch) >= 0) {
          plates.push({
            id: ch, x: x, y: y,
            kind: (ch === 's' || ch === 't') ? 'sole' : 'hearth',
            name: def.names[ch] || ch
          });
        } else if (ch !== '.') {
          throw new Error(def.name + ' bad mark ' + ch + ' at ' + key);
        }
      }
    }
    if (!start || !crock || !niche) throw new Error(def.name + ' missing threshold, crock, or niche');
    placeNames[start.x + ',' + start.y] = 'the threshold';
    placeNames[crock.x + ',' + crock.y] = "the crock's flag";
    placeNames[niche.x + ',' + niche.y] = 'the proofing niche';
    plates.forEach(function (p) { placeNames[p.x + ',' + p.y] = p.name; });
    gates.forEach(function (g) { placeNames[g.x + ',' + g.y] = g.name; });
    const gateAt = {};
    gates.forEach(function (g) { gateAt[g.x + ',' + g.y] = g; });
    return {
      id: def.id, name: def.name, intro: def.intro, success: def.success,
      solution: def.solution, w: w, h: h, ticks: TICKS,
      walls: walls, sacks: sacks, plates: plates, gates: gates, gateAt: gateAt,
      troughs: troughs, start: start, crock: crock, niche: niche,
      placeNames: placeNames, rows: def.rows
    };
  }

  const LEVELS = RAW_LEVELS.map(parseLevel);

  function placePhrase(level, x, y) {
    const name = level.placeNames[x + ',' + y];
    const coord = x + ' east, ' + y + ' south';
    return name ? name + ' (' + coord + ')' : 'the flag ' + coord;
  }

  function pushKey(p) {
    if (!p) return '';
    return p.id + '@' + p.fromX + ',' + p.fromY + '>' + p.toX + ',' + p.toY;
  }

  function snapEqual(a, b) {
    return a && b && a.x === b.x && a.y === b.y && !!a.carrying === !!b.carrying && pushKey(a.push) === pushKey(b.push);
  }

  function blankGates(level) {
    const o = {};
    level.plates.forEach(function (p) { o[p.id] = false; });
    return o;
  }

  function initWorld(level, logs) {
    return {
      troughs: level.troughs.map(function (t) { return { id: t.id, x: t.x, y: t.y }; }),
      crock: { x: level.crock.x, y: level.crock.y, carriedBy: null },
      actors: logs.map(function (inputs, i) {
        return {
          i: i,
          live: i === logs.length - 1,
          inputs: inputs,
          x: level.start.x, y: level.start.y,
          px: level.start.x, py: level.start.y,
          carrying: false,
          present: false,
          facing: 'D'
        };
      })
    };
  }

  function blockedCell(level, x, y, gateOpen) {
    if (x < 0 || y < 0 || x >= level.w || y >= level.h) return 'timber';
    if (level.walls.has(x + ',' + y)) return 'timber';
    const gate = level.gateAt[x + ',' + y];
    if (gate && !gateOpen[gate.plate]) return 'damper';
    return null;
  }

  function planMove(level, world, actor, input, gateOpen) {
    const d = DIRS[input];
    if (!d) throw new Error('unknown step ' + input);
    const dx = d[0], dy = d[1];
    if (dx === 0 && dy === 0) {
      return { x: actor.x, y: actor.y, push: null, pickup: false, blocked: false, reason: '', facing: actor.facing };
    }
    const nx = actor.x + dx, ny = actor.y + dy;
    const stop = function (reason) {
      return { x: actor.x, y: actor.y, push: null, pickup: false, blocked: true, reason: reason, facing: input };
    };
    const block = blockedCell(level, nx, ny, gateOpen);
    if (block) return stop(block);
    const trough = world.troughs.find(function (t) { return t.x === nx && t.y === ny; });
    let push = null;
    if (trough) {
      const tx = nx + dx, ty = ny + dy;
      const far = blockedCell(level, tx, ty, gateOpen);
      if (far) return stop(far === 'damper' ? 'trough-damper' : 'trough-timber');
      if (world.troughs.some(function (t) { return t !== trough && t.x === tx && t.y === ty; })) return stop('trough-trough');
      if (world.crock.carriedBy == null && world.crock.x === tx && world.crock.y === ty) return stop('trough-crock');
      if (level.niche.x === tx && level.niche.y === ty) return stop('trough-niche');
      if (world.actors.some(function (o) { return o.present && o !== actor && o.x === tx && o.y === ty; })) return stop('trough-body');
      push = { id: trough.id, fromX: trough.x, fromY: trough.y, toX: tx, toY: ty };
    }
    if (world.actors.some(function (o) { return o.present && o !== actor && o.x === nx && o.y === ny; })) return stop('body');
    const pickup = world.crock.carriedBy == null && world.crock.x === nx && world.crock.y === ny;
    return { x: nx, y: ny, push: push, pickup: pickup, blocked: false, reason: '', facing: input };
  }

  function computeGates(level, world) {
    const open = blankGates(level);
    level.plates.forEach(function (p) {
      const body = world.actors.some(function (a) { return a.present && a.x === p.x && a.y === p.y; });
      if (p.kind === 'sole') open[p.id] = body;
      else open[p.id] = body || world.troughs.some(function (t) { return t.x === p.x && t.y === p.y; });
    });
    return open;
  }

  function statePhrase(level, snap) {
    const hands = snap.carrying ? 'the crock in their hands' : 'empty hands';
    const shove = snap.push
      ? 'having shoved the dough trough onto ' + placePhrase(level, snap.push.toX, snap.push.toY)
      : 'with no shove of their own';
    return placePhrase(level, snap.x, snap.y) + ', ' + hands + ', ' + shove;
  }

  function namedBody(level, world, x, y, actor) {
    const who = world && world.actors.find(function (o) {
      return o.present && o !== actor && o.x === x && o.y === y;
    });
    const place = placePhrase(level, x, y);
    if (!who) return ' The flag they were owed was not empty.';
    if (who.live) return ' You were already standing on ' + place + '.';
    const name = HANDS[who.i] || 'a later hand';
    return ' ' + name.charAt(0).toUpperCase() + name.slice(1) + ' was already standing on ' + place + '.';
  }

  function because(level, plan, world, actor, exp, actual) {
    if (plan && plan.blocked) {
      const d = DIRS[plan.facing] || [0, 0];
      const r = plan.reason;
      if (r === 'body') return namedBody(level, world, actor.x + d[0], actor.y + d[1], actor);
      if (r === 'trough-body') return namedBody(level, world, actor.x + d[0] * 2, actor.y + d[1] * 2, actor);
      if (r === 'damper' || r === 'trough-damper') return ' The damper was down.';
      if (r === 'timber' || r === 'trough-timber') return ' Timber stood where the flags had been clear.';
      if (r === 'trough-trough') return ' Another trough refused the shove.';
      if (r === 'trough-crock') return ' The crock sat where the trough was meant to go.';
      if (r === 'trough-niche') return ' The niche would not take the trough.';
    }
    if (exp && exp.push && !(actual && actual.push) && world) {
      const tr = world.troughs.find(function (t) { return t.id === exp.push.id; });
      if (!tr || tr.x !== exp.push.fromX || tr.y !== exp.push.fromY) {
        return ' The dough trough was not on ' + placePhrase(level, exp.push.fromX, exp.push.fromY) + ', where the shoulder remembered it.';
      }
    }
    return '';
  }

  function makeParadox(level, actor, tick, exp, actual, plan, world) {
    const hand = HANDS[actor.i] || 'the flour-hand';
    const msg = 'The draught lets go. On kneading ' + (actor.i + 1) + ', tick ' + (tick + 1) +
      ', ' + hand + ' expected ' + statePhrase(level, exp) +
      '. What was actual: ' + statePhrase(level, actual) + '.' +
      because(level, plan, world, actor, exp, actual);
    return {
      kneading: actor.i + 1,
      tick: tick + 1,
      actor: actor.i,
      hx: exp.x, hy: exp.y,
      message: msg
    };
  }

  function run(level, logs, priorTraces) {
    const world = initWorld(level, logs);
    const live = world.actors[world.actors.length - 1];
    const trace = [];
    let gateOpen = blankGates(level);
    const n = live.inputs.length;
    let paradox = null;
    let win = false;
    let tick = 0;
    for (; tick < n; tick++) {
      world.actors.forEach(function (a) {
        a.px = a.x; a.py = a.y;
        a.present = tick < a.inputs.length;
      });
      const movers = world.actors.filter(function (a) { return a.present; });
      for (let mi = 0; mi < movers.length; mi++) {
        const a = movers[mi];
        const input = a.inputs[tick];
        const plan = planMove(level, world, a, input, gateOpen);
        if (plan.push) {
          const tr = world.troughs.find(function (t) { return t.id === plan.push.id; });
          tr.x = plan.push.toX; tr.y = plan.push.toY;
        }
        a.x = plan.x; a.y = plan.y;
        a.facing = plan.facing || a.facing;
        if (plan.pickup) {
          a.carrying = true;
          world.crock.carriedBy = a.i;
        }
        if (a.carrying) {
          world.crock.x = a.x; world.crock.y = a.y;
        }
        const snap = { x: a.x, y: a.y, carrying: !!a.carrying, push: plan.push ? {
          id: plan.push.id, fromX: plan.push.fromX, fromY: plan.push.fromY, toX: plan.push.toX, toY: plan.push.toY
        } : null, input: input };
        if (!a.live) {
          const exp = priorTraces[a.i] && priorTraces[a.i][tick];
          if (!exp || !snapEqual(exp, snap)) {
            const owed = exp || { x: a.px, y: a.py, carrying: false, push: null };
            paradox = makeParadox(level, a, tick, owed, snap, plan, world);
            break;
          }
        } else {
          trace.push(snap);
          if (a.carrying && a.x === level.niche.x && a.y === level.niche.y) win = true;
        }
      }
      if (!paradox) {
        const seen = new Map();
        for (let si = 0; si < movers.length; si++) {
          const a = movers[si];
          const k = a.x + ',' + a.y;
          if (seen.has(k)) {
            const older = seen.get(k);
            const younger = a;
            const owed = older;
            const exp = { x: older.x, y: older.y, carrying: !!older.carrying, push: null };
            const actual = { x: younger.x, y: younger.y, carrying: !!younger.carrying, push: null };
            const hand = HANDS[older.i] || 'the flour-hand';
            const who = younger.live ? 'you stood' : 'a later hand stood';
            paradox = {
              kneading: older.i + 1,
              tick: tick + 1,
              actor: older.i,
              hx: older.x, hy: older.y,
              message: 'The draught lets go. On kneading ' + (older.i + 1) + ', tick ' + (tick + 1) +
                ', ' + hand + ' expected to keep ' + placePhrase(level, older.x, older.y) +
                ' alone, empty of any second body. What was actual: ' + who +
                ' on that same flag with them.'
            };
            break;
          }
          seen.set(k, a);
        }
      }
      gateOpen = computeGates(level, world);
      if (paradox || win) break;
    }
    return {
      ok: !paradox,
      paradox: paradox,
      win: win,
      world: world,
      liveTrace: trace,
      gateOpen: gateOpen,
      tick: (paradox || win) ? tick : n
    };
  }

  function simulate(level, logs) {
    const use = logs && logs.length ? logs : [''];
    const traces = [];
    let last = null;
    for (let i = 0; i < use.length; i++) {
      last = run(level, use.slice(0, i + 1), traces);
      if (!last.ok) return last;
      if (i < use.length - 1) traces.push(last.liveTrace);
    }
    last.traces = traces;
    return last;
  }

  function withMove(logs, ch, nTicks) {
    const next = logs.slice();
    next[next.length - 1] = next[next.length - 1] + ch;
    if (next[next.length - 1].length >= nTicks) next.push('');
    return next;
  }

  function withBell(logs) {
    return logs.concat(['']);
  }

  function undone(logs, nTicks) {
    if (!logs || (logs.length === 1 && logs[0].length === 0)) return [''];
    const next = logs.slice();
    const last = next[next.length - 1];
    if (last.length > 0) {
      next[next.length - 1] = last.slice(0, -1);
      return next;
    }
    next.pop();
    const prev = next[next.length - 1];
    if (prev.length >= nTicks) next[next.length - 1] = prev.slice(0, -1);
    return next;
  }

  function fingerprint(result) {
    const w = result.world;
    return JSON.stringify({
      ok: result.ok, win: !!result.win,
      p: result.paradox ? [result.paradox.kneading, result.paradox.tick, result.paradox.hx, result.paradox.hy] : null,
      a: w.actors.map(function (a) { return [a.i, a.x, a.y, a.carrying ? 1 : 0]; }),
      t: w.troughs.map(function (t) { return [t.id, t.x, t.y]; }),
      c: [w.crock.x, w.crock.y, w.crock.carriedBy],
      g: result.gateOpen
    });
  }

  function actionsFromSolution(sol, nTicks) {
    const actions = [];
    for (let i = 0; i < sol.length; i++) {
      for (let k = 0; k < sol[i].length; k++) actions.push(sol[i].charAt(k));
      if (i < sol.length - 1 && sol[i].length < nTicks) actions.push('!');
    }
    return actions;
  }

  function reduceActions(actions, nTicks) {
    let logs = [''];
    actions.forEach(function (a) {
      logs = a === '!' ? withBell(logs) : withMove(logs, a, nTicks);
    });
    return logs;
  }

  function roundtrip(level) {
    const actions = actionsFromSolution(level.solution, level.ticks);
    let logs = [''];
    const states = [logs];
    actions.forEach(function (a) {
      logs = a === '!' ? withBell(logs) : withMove(logs, a, level.ticks);
      states.push(logs);
    });
    if (JSON.stringify(logs) !== JSON.stringify(level.solution)) {
      return { ok: false, detail: 'the walked kneadings did not match the written office' };
    }
    const fps = states.map(function (s) { return fingerprint(simulate(level, s)); });
    let cur = logs;
    for (let i = states.length - 2; i >= 0; i--) {
      cur = undone(cur, level.ticks);
      if (JSON.stringify(cur) !== JSON.stringify(states[i])) {
        return { ok: false, detail: 'unsaying did not return kneading shape ' + i };
      }
      if (fingerprint(simulate(level, cur)) !== fps[i]) {
        return { ok: false, detail: 'unsaying did not return the same room at shape ' + i };
      }
    }
    const again = reduceActions(actions, level.ticks);
    if (fingerprint(simulate(level, again)) !== fps[fps.length - 1]) {
      return { ok: false, detail: 'walking the same steps again built a different room' };
    }
    return { ok: true };
  }

  function selfTest() {
    const lines = [];
    let pass = true;
    function bad(s) { pass = false; lines.push(s); }

    LEVELS.forEach(function (level) {
      if (!level.solution) {
        bad(level.name + ' has no written kneading.');
        return;
      }
      const result = simulate(level, level.solution);
      if (!(result.ok && result.win)) {
        bad(level.name + ' did not set the crock in the niche. ' + (result.paradox ? result.paradox.message : 'the office simply did not complete'));
      } else lines.push(level.name + ' agrees.');
      const trip = roundtrip(level);
      if (!trip.ok) bad(level.name + ': ' + trip.detail);
    });

    const hearth = LEVELS[0];
    const blocked = simulate(hearth, ['U']);
    const novice = blocked.world.actors[0];
    if (novice.x !== hearth.start.x || novice.y !== hearth.start.y || hearth && blocked.world.actors[0].inputs.length !== 1) {
      bad('A step into timber still has to spend itself on the threshold.');
    }

    const share = simulate(hearth, ['.', '.']);
    if (!share.paradox || share.paradox.kneading !== 1 || share.paradox.tick !== 1) {
      bad('Two bodies standing the first step on the threshold did not break the draught.');
    } else if (share.paradox.message.indexOf('expected') < 0 || share.paradox.message.indexOf('actual') < 0) {
      bad('The draught spoke, but not of what was expected and what was actual.');
    }

    const raced = simulate(hearth, ['DDDDRRRRRU....', 'RRRRRDDD..']);
    if (!raced.paradox) {
      bad('Standing on the morning hearth-stone ahead of the first hand did not break the draught.');
    } else if (raced.paradox.kneading !== 1 || raced.paradox.message.indexOf('tick') < 0) {
      bad('The broken kneading was not named with its tick.');
    } else lines.push('A lied-to hand lets go, and names the kneading and the tick.');

    const count = LEVELS[2];
    const early = simulate(count, [count.solution[0], count.solution[1], 'RRRRRRRRDDDDDRDDRRR']);
    if (!early.paradox || early.paradox.kneading !== 2 || early.paradox.tick !== 19) {
      bad('Shoving the trough ahead of the second hand did not break kneading 2 on tick 19.');
    } else if (early.paradox.message.indexOf('having shoved') < 0 || early.paradox.message.indexOf('dough trough was not') < 0 || early.paradox.message.indexOf('expected') < 0 || early.paradox.message.indexOf('actual') < 0) {
      bad('The early shove was not told as a trough the shoulder remembered.');
    } else lines.push('An early shove lies to the second hand, and the draught names the tick.');

    if (pass) {
      lines.unshift('The rehearsal holds.');
    } else {
      lines.unshift('The rehearsal broke.');
    }
    return { pass: pass, report: lines.join(' ') };
  }

  /* ---------- presentation ---------- */

  const canvas = typeof document !== 'undefined' ? document.getElementById('board') : null;
  let ctx = null;
  let dpr = 1;
  const shown = new Map();
  let motes = [];
  let embers = [];
  let audioCtx = null;
  let drone = null;
  let audioOn = false;
  let lastNow = 0;
  const reduced = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const game = {
    levelIndex: 0,
    logs: [''],
    mode: 'title',
    result: null,
    note: '',
    full: false,
    baked: null,
    bakedId: ''
  };

  function level() { return LEVELS[game.levelIndex]; }

  function refresh() {
    game.result = simulate(level(), game.logs);
  }

  function hash2(x, y) {
    let n = (x * 374761393 + y * 668265263) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }

  function roundRect(c, x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function bake(lv) {
    const b = document.createElement('canvas');
    const scale = 2;
    b.width = lv.w * CELL * scale;
    b.height = lv.h * CELL * scale;
    const g = b.getContext('2d');
    g.setTransform(scale, 0, 0, scale, 0, 0);
    g.fillStyle = PAL.plasterDeep;
    g.fillRect(0, 0, lv.w * CELL, lv.h * CELL);
    for (let y = 0; y < lv.h; y++) {
      for (let x = 0; x < lv.w; x++) {
        const key = x + ',' + y;
        const px = x * CELL, py = y * CELL;
        if (lv.walls.has(key)) {
          if (lv.sacks.has(key)) {
            g.fillStyle = PAL.flagDark;
            g.fillRect(px, py, CELL, CELL);
            g.fillStyle = PAL.flour;
            roundRect(g, px + 4, py + 7, CELL - 8, CELL - 14, 6);
            g.fill();
            g.fillStyle = '#e7dcc8';
            roundRect(g, px + 7, py + 10, CELL - 16, 8, 3);
            g.fill();
            g.strokeStyle = PAL.timber;
            g.lineWidth = 1;
            g.beginPath();
            g.moveTo(px + 6, py + 18);
            g.lineTo(px + CELL - 6, py + 18);
            g.stroke();
          } else {
            const edge = x === 0 || y === 0 || x === lv.w - 1 || y === lv.h - 1;
            g.fillStyle = edge ? PAL.timber : PAL.plasterLight;
            g.fillRect(px, py, CELL, CELL);
            if (!edge) {
              g.strokeStyle = 'rgba(92,58,40,0.35)';
              g.strokeRect(px + 0.5, py + 0.5, CELL - 1, CELL - 1);
              g.fillStyle = PAL.timber;
              g.fillRect(px, py, CELL, 4);
            } else {
              g.fillStyle = 'rgba(58,36,24,0.25)';
              if (hash2(x, y) > 0.6) g.fillRect(px + 4, py + 8, 2, 2);
            }
          }
        } else {
          const n = hash2(x, y);
          g.fillStyle = n > 0.5 ? PAL.flag : PAL.flagDark;
          g.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
          g.strokeStyle = 'rgba(141,107,69,0.45)';
          g.lineWidth = 1;
          if (n > 0.25) {
            g.beginPath();
            g.moveTo(px, py + CELL);
            g.lineTo(px + CELL * (0.4 + n * 0.5), py + CELL);
            g.stroke();
          }
          if (n < 0.2) {
            g.fillStyle = 'rgba(246,241,230,0.35)';
            g.beginPath();
            g.ellipse(px + 10 + n * 12, py + 18, 6, 3, n, 0, 7);
            g.fill();
          }
        }
      }
    }
    /* east window wash, west oven wash */
    const wash = g.createLinearGradient(lv.w * CELL, 0, lv.w * CELL * 0.45, 0);
    wash.addColorStop(0, 'rgba(255,244,220,0.28)');
    wash.addColorStop(1, 'rgba(255,244,220,0)');
    g.fillStyle = wash;
    g.fillRect(0, 0, lv.w * CELL, lv.h * CELL);
    const oven = g.createRadialGradient(0, lv.h * CELL * 0.55, 10, 0, lv.h * CELL * 0.55, 180);
    oven.addColorStop(0, 'rgba(226,91,42,0.18)');
    oven.addColorStop(1, 'rgba(226,91,42,0)');
    g.fillStyle = oven;
    g.fillRect(0, 0, lv.w * CELL, lv.h * CELL);

    lv.plates.forEach(function (p) {
      const px = p.x * CELL, py = p.y * CELL;
      g.fillStyle = p.kind === 'sole' ? '#d7c4a4' : '#8d6a45';
      roundRect(g, px + 6, py + 6, CELL - 12, CELL - 12, 4);
      g.fill();
      g.strokeStyle = PAL.timberDark;
      g.lineWidth = 1;
      g.stroke();
      g.beginPath();
      g.fillStyle = p.kind === 'sole' ? '#c4a88a' : '#5c4030';
      g.ellipse(px + CELL / 2, py + CELL / 2, 7, 5, 0, 0, 7);
      g.fill();
    });

    const niche = lv.niche;
    g.fillStyle = '#6b4a34';
    roundRect(g, niche.x * CELL + 5, niche.y * CELL + 4, CELL - 10, CELL - 8, 8);
    g.fill();
    g.fillStyle = PAL.flour;
    roundRect(g, niche.x * CELL + 8, niche.y * CELL + 16, CELL - 16, 10, 3);
    g.fill();
    g.strokeStyle = PAL.herb;
    g.lineWidth = 1.2;
    g.beginPath();
    const nx = niche.x * CELL + CELL / 2, ny = niche.y * CELL + 10;
    g.moveTo(nx, ny + 6);
    g.quadraticCurveTo(nx - 6, ny, nx, ny - 2);
    g.quadraticCurveTo(nx + 6, ny, nx, ny + 6);
    g.stroke();

    return b;
  }

  function spawnMotes() {
    motes = [];
    for (let i = 0; i < 64; i++) {
      motes.push({
        x: Math.random() * WIDTH,
        y: TOP + Math.random() * (COLS * CELL),
        v: 6 + Math.random() * 10,
        s: 1 + Math.random() * 1.7,
        p: Math.random() * 6.28,
        a: 0.25 + Math.random() * 0.45
      });
    }
    embers = [];
    for (let i = 0; i < 18; i++) embers.push(spawnEmber(true));
  }

  function spawnEmber(any) {
    return {
      x: 10 + Math.random() * 16,
      y: TOP + COLS * CELL * (0.42 + Math.random() * 0.22),
      vy: -(10 + Math.random() * 18),
      life: Math.random(),
      any: any
    };
  }

  function ensureAudio() {
    if (audioCtx || typeof window === 'undefined') return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { audioCtx = new AC(); } catch (e) { audioCtx = null; }
  }

  function hum(on) {
    if (!audioCtx) return;
    if (on && !drone) {
      const o1 = audioCtx.createOscillator();
      const o2 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o1.type = 'sine'; o2.type = 'triangle';
      o1.frequency.value = 62; o2.frequency.value = 93;
      g.gain.value = 0.012;
      o1.connect(g); o2.connect(g); g.connect(audioCtx.destination);
      o1.start(); o2.start();
      drone = { o1: o1, o2: o2, g: g };
    } else if (!on && drone) {
      try { drone.o1.stop(); drone.o2.stop(); } catch (e) { /* already stopped */ }
      drone = null;
    }
  }

  function blip(kind) {
    if (!audioOn || !audioCtx) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if (kind === 'step') {
      o.type = 'triangle'; o.frequency.value = 180;
      g.gain.setValueAtTime(0.03, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      o.start(t); o.stop(t + 0.07);
    } else if (kind === 'bell') {
      o.type = 'sine'; o.frequency.setValueAtTime(520, t);
      o.frequency.exponentialRampToValueAtTime(260, t + 0.4);
      g.gain.setValueAtTime(0.05, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.start(t); o.stop(t + 0.46);
    } else if (kind === 'shove') {
      o.type = 'square'; o.frequency.value = 90;
      g.gain.setValueAtTime(0.03, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      o.start(t); o.stop(t + 0.1);
    } else if (kind === 'fail') {
      o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(60, t + 0.35);
      g.gain.setValueAtTime(0.04, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
      o.start(t); o.stop(t + 0.37);
    } else if (kind === 'warm') {
      o.type = 'sine'; o.frequency.setValueAtTime(330, t);
      o.frequency.linearRampToValueAtTime(440, t + 0.2);
      g.gain.setValueAtTime(0.04, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.start(t); o.stop(t + 0.36);
    }
  }

  function drawCrock(c, x, y, s) {
    c.save();
    c.translate(x, y);
    c.scale(s, s);
    c.fillStyle = 'rgba(42,24,16,0.18)';
    c.beginPath(); c.ellipse(0, 8, 7, 2.4, 0, 0, 7); c.fill();
    c.fillStyle = PAL.crockDark;
    c.beginPath(); c.ellipse(0, 2, 8, 7, 0, 0, 7); c.fill();
    c.fillStyle = PAL.crock;
    c.beginPath(); c.ellipse(-1, 1, 6.5, 6, 0, 0, 7); c.fill();
    c.fillStyle = '#d9d3c4';
    roundRect(c, -5, -8, 10, 5, 1);
    c.fill();
    c.strokeStyle = PAL.herb;
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(-5, -5); c.lineTo(5, -5); c.stroke();
    c.fillStyle = 'rgba(255,244,220,0.45)';
    c.beginPath(); c.ellipse(-2, 0, 2, 3, -0.4, 0, 7); c.fill();
    c.restore();
  }

  function drawTrough(c, x, y) {
    c.save();
    c.translate(x, y);
    c.fillStyle = 'rgba(42,24,16,0.2)';
    c.beginPath(); c.ellipse(0, 8, 12, 3.2, 0, 0, 7); c.fill();
    c.fillStyle = PAL.crustDark;
    roundRect(c, -13, -6, 26, 14, 4);
    c.fill();
    c.fillStyle = PAL.crust;
    roundRect(c, -12, -7, 24, 12, 4);
    c.fill();
    c.strokeStyle = '#3a2418';
    c.lineWidth = 1.4;
    c.beginPath();
    c.moveTo(-6, -7); c.lineTo(-6, 5);
    c.moveTo(6, -7); c.lineTo(6, 5);
    c.stroke();
    c.fillStyle = PAL.flour;
    c.beginPath(); c.ellipse(0, -2, 8, 3.2, 0, 0, 7); c.fill();
    c.restore();
  }

  function drawFigure(c, x, y, o) {
    c.save();
    c.translate(x, y);
    const walking = o.walking && !reduced;
    const step = walking ? Math.sin(o.now / 110) : 0;
    const bob = walking ? Math.abs(Math.sin(o.now / 110)) * -2.2 : Math.sin(o.now / 520 + o.seed) * 0.7;
    c.translate(o.ox || 0, bob);
    c.globalAlpha = o.alpha == null ? 1 : o.alpha;
    c.fillStyle = o.flour ? 'rgba(246,241,230,0.35)' : 'rgba(42,24,16,0.2)';
    c.beginPath(); c.ellipse(0, 2, o.flour ? 9 : 8, 3.1, 0, 0, 7); c.fill();
    const left = step * 3.2, right = -step * 3.2;
    const wool = o.flour ? '#f4efe6' : PAL.wool;
    const woolDark = o.flour ? (o.rim || '#c4a074') : PAL.woolDark;
    c.fillStyle = o.flour ? '#e7dfd2' : '#3a2418';
    roundRect(c, -7 + left, -3, 5, 3.4, 1.2); c.fill();
    roundRect(c, 2 + right, -3, 5, 3.4, 1.2); c.fill();
    c.fillStyle = wool;
    c.beginPath();
    c.moveTo(-8, -21);
    c.quadraticCurveTo(-11, -8, -9, -4);
    c.lineTo(9, -4);
    c.quadraticCurveTo(11, -8, 8, -21);
    c.quadraticCurveTo(0, -24, -8, -21);
    c.fill();
    c.strokeStyle = woolDark;
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, -20); c.quadraticCurveTo(-1, -12, -1.5, -6); c.stroke();
    if (!o.flour) {
      c.fillStyle = PAL.flour;
      c.beginPath();
      c.moveTo(-6, -17);
      c.lineTo(-6.5, -6);
      c.quadraticCurveTo(0, -4, 6.5, -6);
      c.lineTo(6, -17);
      c.quadraticCurveTo(0, -15.5, -6, -17);
      c.fill();
    }
    c.strokeStyle = wool;
    c.lineWidth = 2.5;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-7, -17); c.lineTo(-11, -11 + left);
    c.moveTo(7, -17); c.lineTo(11, -11 + right);
    c.stroke();
    c.fillStyle = o.flour ? PAL.flour : PAL.skin;
    c.beginPath();
    c.arc(-11, -11 + left, 1.7, 0, 7);
    c.arc(11, -11 + right, 1.7, 0, 7);
    c.fill();
    c.fillStyle = o.flour ? '#f7f3ea' : PAL.timber;
    c.beginPath();
    c.arc(0, -26, 6.3, Math.PI * 1.02, Math.PI * 1.98, false);
    c.quadraticCurveTo(7.2, -20, 6, -18);
    c.lineTo(-6, -18);
    c.quadraticCurveTo(-7.2, -20, -6.4, -26);
    c.fill();
    if (o.flour) {
      c.fillStyle = 'rgba(92,58,40,0.28)';
      c.beginPath(); c.ellipse(0.4, -24.2, 2.4, 2.8, 0, 0, 7); c.fill();
      c.fillStyle = o.rim || PAL.grout;
      for (let i = 0; i < 8; i++) {
        const a = o.seed + i;
        c.fillRect(Math.sin(a) * 10, -16 + (i % 4) * 3, 1.4, 1.4);
      }
    } else {
      c.fillStyle = PAL.skin;
      c.beginPath(); c.ellipse(0.7, -24.4, 3.3, 3.6, 0, 0, 7); c.fill();
      c.fillStyle = PAL.soot;
      c.beginPath();
      c.arc(-0.8, -24.8, 0.55, 0, 7);
      c.arc(1.8, -24.8, 0.55, 0, 7);
      c.fill();
      c.fillStyle = 'rgba(246,241,230,0.9)';
      c.beginPath(); c.ellipse(2.3, -23.2, 1.3, 0.8, 0.4, 0, 7); c.fill();
    }
    if (o.carrying) drawCrock(c, 0, -13, 0.62);
    if (o.marked) {
      c.strokeStyle = PAL.madder;
      c.lineWidth = 1.6;
      c.beginPath();
      c.ellipse(0, -14, 14, 20, 0, 0, 7);
      c.stroke();
    }
    c.restore();
  }

  function drawDamper(c, gate, open, now) {
    const px = gate.x * CELL, py = TOP + gate.y * CELL;
    c.save();
    c.translate(px, py);
    c.fillStyle = '#7a4a32';
    c.fillRect(0, 0, CELL, CELL);
    c.fillStyle = '#5a3424';
    for (let i = 0; i < 3; i++) c.fillRect(2, 3 + i * 10, CELL - 4, 8);
    if (open) {
      const glow = c.createRadialGradient(CELL / 2, CELL / 2 + 2, 2, CELL / 2, CELL / 2, 16);
      glow.addColorStop(0, 'rgba(226,91,42,0.95)');
      glow.addColorStop(1, 'rgba(63,29,20,0.95)');
      c.fillStyle = glow;
      roundRect(c, 7, 6, CELL - 14, CELL - 10, 8);
      c.fill();
      const flick = reduced ? 0 : Math.sin(now / 180) * 1.5;
      c.fillStyle = PAL.ember;
      c.beginPath(); c.ellipse(CELL / 2, CELL / 2 + 4 + flick, 4, 2.2, 0, 0, 7); c.fill();
    } else {
      c.fillStyle = '#3a2418';
      roundRect(c, 6, 5, CELL - 12, CELL - 9, 3);
      c.fill();
      c.strokeStyle = PAL.brass;
      c.lineWidth = 1;
      c.strokeRect(9.5, 8.5, CELL - 19, CELL - 16);
      c.beginPath(); c.arc(CELL / 2, CELL / 2 + 1, 2.2, 0, 7); c.stroke();
    }
    c.restore();
  }

  function drawHooks(c, now) {
    c.fillStyle = PAL.timberDark;
    roundRect(c, 16, 14, WIDTH - 32, 18, 3);
    c.fill();
    const sealed = Math.max(0, game.logs.length - 1);
    for (let i = 0; i < 4; i++) {
      const x = 48 + i * 120;
      c.strokeStyle = PAL.brass;
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(x, 16);
      c.lineTo(x, 28);
      c.arc(x, 30, 4, Math.PI, 0, true);
      c.stroke();
      if (i < sealed) {
        const sway = reduced ? 0 : Math.sin(now / 700 + i) * 1.4;
        c.save();
        c.translate(x + sway, 34);
        c.fillStyle = i === 1 ? '#e7d3c4' : PAL.flour;
        c.strokeStyle = HAND_RIM[i];
        roundRect(c, -10, 0, 20, 22, 3);
        c.fill(); c.stroke();
        c.fillStyle = HAND_RIM[i];
        c.fillRect(-10, 0, 20, 3);
        c.restore();
      }
    }
    c.fillStyle = PAL.soot;
    c.font = 'italic 18px ' + FONT;
    c.textAlign = 'left';
    const lv = level();
    c.fillText(lv.name, 18, 68);
    c.font = 'italic 13px ' + FONT;
    c.fillStyle = 'rgba(44,24,16,0.75)';
    const bits = lv.gates.map(function (g) {
      const up = game.result && game.result.gateOpen[g.plate];
      return g.name + (up ? ' is up' : ' is down');
    });
    c.textAlign = 'right';
    c.fillText(bits.join('   ·   '), WIDTH - 16, 68);
  }

  function drawPeel(c) {
    const y = TOP + COLS * CELL + 16;
    c.fillStyle = PAL.crustDark;
    roundRect(c, 28, y, WIDTH - 56, 28, 8);
    c.fill();
    c.fillStyle = PAL.crust;
    roundRect(c, 30, y + 2, WIDTH - 60, 22, 7);
    c.fill();
    const cur = game.logs[game.logs.length - 1] || '';
    const inner = WIDTH - 92;
    const slot = inner / TICKS;
    for (let i = 0; i < TICKS; i++) {
      const x = 46 + i * slot;
      c.fillStyle = 'rgba(58,36,24,0.35)';
      c.fillRect(x, y + 6, 2, i % 5 === 0 ? 16 : 10);
      if (i < cur.length) {
        c.fillStyle = PAL.flour;
        c.fillRect(x - 1, y + 8, 4, 8);
      }
    }
    const tickShown = game.result && game.result.paradox ? game.result.paradox.tick : cur.length;
    if (cur.length > 0 || (game.result && game.result.paradox)) {
      const x = 46 + Math.min(TICKS - 1, Math.max(0, tickShown - 1)) * slot;
      c.fillStyle = PAL.ember;
      c.beginPath(); c.arc(x + 1, y + 12, 3.2, 0, 7); c.fill();
    }
    c.fillStyle = PAL.soot;
    c.font = 'italic 14px ' + FONT;
    c.textAlign = 'left';
    const kneading = game.logs.length;
    const step = cur.length;
    c.fillText('Kneading ' + kneading + '  ·  step ' + step + ' of ' + TICKS, 30, y + 48);
    c.textAlign = 'right';
    c.fillText(game.logs.length - 1 + ' of 4 hands in the flour', WIDTH - 28, y + 48);
    /* small bell at the peel's end */
    c.strokeStyle = PAL.brass;
    c.lineWidth = 1.6;
    c.beginPath();
    c.arc(WIDTH - 48, y + 13, 7, Math.PI, 0);
    c.lineTo(WIDTH - 41, y + 18);
    c.stroke();
  }

  function drawOvenMargin(c, now) {
    c.save();
    c.translate(0, TOP + 7 * CELL);
    c.fillStyle = '#6a3b28';
    roundRect(c, 2, 8, CELL - 6, CELL * 3, 10);
    c.fill();
    const glow = c.createRadialGradient(CELL / 2, CELL * 2, 4, CELL / 2, CELL * 2, 28);
    glow.addColorStop(0, 'rgba(226,91,42,' + (0.75 + Math.sin(now / 300) * 0.15) + ')');
    glow.addColorStop(1, 'rgba(63,20,12,0.2)');
    c.fillStyle = glow;
    c.beginPath(); c.ellipse(CELL / 2 - 2, CELL * 1.7, 10, 16, 0, 0, 7); c.fill();
    c.restore();
    /* east window */
    c.save();
    c.translate(WIDTH - CELL + 4, TOP + 2 * CELL);
    c.fillStyle = 'rgba(255,244,220,0.85)';
    roundRect(c, 4, 6, CELL - 12, CELL * 3.2, 6);
    c.fill();
    c.strokeStyle = PAL.timberDark;
    c.lineWidth = 2;
    c.stroke();
    c.beginPath();
    c.moveTo(CELL / 2, 6); c.lineTo(CELL / 2, 6 + CELL * 3.2);
    c.moveTo(4, 6 + CELL * 1.6); c.lineTo(CELL - 8, 6 + CELL * 1.6);
    c.stroke();
    c.restore();
  }

  function drawWorld(now) {
    if (!ctx) return;
    const lv = level();
    if (!game.baked || game.bakedId !== lv.id) {
      game.baked = bake(lv);
      game.bakedId = lv.id;
    }
    ctx.clearRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = PAL.plaster;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    drawHooks(ctx, now);
    ctx.drawImage(game.baked, 0, TOP, WIDTH, COLS * CELL);
    drawOvenMargin(ctx, now);
    const result = game.result;
    if (!result) return;
    lv.plates.forEach(function (p) {
      if (!result.gateOpen[p.id]) return;
      ctx.save();
      ctx.translate(p.x * CELL + CELL / 2, TOP + p.y * CELL + CELL / 2);
      ctx.fillStyle = p.kind === 'sole' ? 'rgba(141,59,59,0.35)' : 'rgba(226,91,42,0.45)';
      ctx.beginPath(); ctx.ellipse(0, 0, 8, 5, 0, 0, 7); ctx.fill();
      ctx.restore();
    });
    lv.gates.forEach(function (g) { drawDamper(ctx, g, !!result.gateOpen[g.plate], now); });

    const actors = result.world.actors.filter(function (a) { return a.live || a.inputs.length > 0; });
    actors.forEach(function (a) {
      let s = shown.get(lv.id + ':' + a.i + ':' + game.logs.length);
      if (!s) {
        s = { x: a.x, y: a.y };
        shown.set(lv.id + ':' + a.i + ':' + game.logs.length, s);
      }
      const dx = a.x - s.x, dy = a.y - s.y;
      if (dx * dx + dy * dy > 2.2 || reduced) { s.x = a.x; s.y = a.y; }
      else { s.x += dx * 0.35; s.y += dy * 0.35; }
      a._sx = s.x; a._sy = s.y;
    });

    if (result.world.crock.carriedBy == null) {
      drawCrock(ctx, result.world.crock.x * CELL + CELL / 2, TOP + result.world.crock.y * CELL + CELL / 2 + 2, 1);
    }
    result.world.troughs.forEach(function (t) {
      drawTrough(ctx, t.x * CELL + CELL / 2, TOP + t.y * CELL + CELL / 2 + 2);
    });

    const dissolve = game.mode === 'ending' ? Math.max(0, 1 - ((now % 6000) / 6000)) : 1;
    actors.filter(function (a) { return !a.live; }).forEach(function (a) {
      const walking = a.x !== a.px || a.y !== a.py;
      drawFigure(ctx, a._sx * CELL + CELL / 2, TOP + a._sy * CELL + CELL - 6, {
        flour: true, walking: walking, now: now, seed: a.i * 1.7,
        carrying: a.carrying, alpha: 0.8 * (game.mode === 'ending' ? dissolve : 1),
        rim: HAND_RIM[a.i] || PAL.grout,
        ox: (a.i - 1) * 2,
        marked: !!(result.paradox && result.paradox.actor === a.i)
      });
    });
    actors.filter(function (a) { return a.live; }).forEach(function (a) {
      const walking = a.x !== a.px || a.y !== a.py;
      drawFigure(ctx, a._sx * CELL + CELL / 2, TOP + a._sy * CELL + CELL - 6, {
        flour: false, walking: walking, now: now, seed: 0.2, carrying: a.carrying, alpha: 1
      });
    });

    if (result.paradox) {
      const hx = result.paradox.hx * CELL + CELL / 2;
      const hy = TOP + result.paradox.hy * CELL + CELL / 2;
      ctx.save();
      ctx.strokeStyle = PAL.madder;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(hx, hy, 14 + Math.sin(now / 120) * 1.5, 0, 7); ctx.stroke();
      ctx.restore();
    }

    motes.forEach(function (m) {
      ctx.globalAlpha = m.a * (game.mode === 'ending' ? 0.9 : 0.7);
      ctx.fillStyle = PAL.flour;
      ctx.fillRect(m.x, m.y, m.s, m.s);
      ctx.globalAlpha = 1;
    });
    embers.forEach(function (e) {
      ctx.globalAlpha = 1 - e.life;
      ctx.fillStyle = PAL.ember;
      ctx.fillRect(e.x, e.y, 2, 2);
      ctx.globalAlpha = 1;
    });
    drawPeel(ctx);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastNow) / 1000 || 0.016);
    lastNow = now;
    if (!reduced) {
      const fall = game.mode === 'ending';
      motes.forEach(function (m) {
        m.p += dt;
        m.x += Math.cos(m.p * 0.7) * dt * 8 + dt * m.v * (fall ? 0.15 : 1);
        m.y += dt * (fall ? 28 + m.v : Math.sin(m.p) * 6);
        if (m.x > WIDTH + 4) m.x = -4;
        if (m.y > TOP + COLS * CELL) m.y = TOP + 4;
        if (m.y < TOP) m.y = TOP + COLS * CELL - 4;
      });
      embers.forEach(function (e) {
        e.y += e.vy * dt;
        e.life += dt * 0.6;
        if (e.life > 1) {
          e.x = 8 + Math.random() * 18;
          e.y = TOP + COLS * CELL * (0.48 + Math.random() * 0.2);
          e.life = 0;
          e.vy = -(12 + Math.random() * 16);
        }
      });
    }
    drawWorld(now);
    requestAnimationFrame(frame);
  }

  /* ---------- conduct ---------- */

  const paper = typeof document !== 'undefined' ? document.getElementById('paper') : null;
  const paperTitle = typeof document !== 'undefined' ? document.getElementById('paper-title') : null;
  const paperBody = typeof document !== 'undefined' ? document.getElementById('paper-body') : null;
  const paperActions = typeof document !== 'undefined' ? document.getElementById('paper-actions') : null;
  const noteEl = typeof document !== 'undefined' ? document.getElementById('note') : null;

  function setNote(s) {
    game.note = s || '';
    if (noteEl) noteEl.textContent = game.note;
  }

  function button(label, cls, fn) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener('click', function () { b.blur(); fn(); });
    return b;
  }

  function showPaper() {
    if (!paper) return;
    paper.hidden = false;
    paperActions.innerHTML = '';
    const lv = level();
    if (game.mode === 'title') {
      paperTitle.innerHTML = 'The Kneading Office <span class="sprig">a house rule for the starter</span>';
      paperBody.textContent = 'Come in off the yard. The starter has cooled, and I will not feed a cold crock to a hot oven. From the kneading-bell to the oven-bell you have forty steps in this room. Whatever you move, the draught lifts into the flour and holds as a hand — your shoulder, your stance, the shove you gave the trough. At the next bell that flour walks the steps again. I can keep four hands in the air. No more. Set the crock in the proofing niche while the dampers are up. If a flour-hand reaches for a thing you have since moved, the draught lets go.';
      paperActions.appendChild(button('Begin the office', '', function () { beginPlay(); }));
      paperActions.appendChild(button(audioOn ? 'Quiet the oven' : 'Let the oven hum', 'quiet', toggleHum));
    } else if (game.mode === 'intro') {
      paperTitle.textContent = lv.name;
      paperBody.textContent = lv.intro;
      paperActions.appendChild(button('I am at the threshold', '', function () {
        game.mode = 'play';
        showPaper();
      }));
    } else if (game.mode === 'play') {
      paper.hidden = true;
    } else if (game.mode === 'paradox' || game.mode === 'full') {
      paperTitle.textContent = 'The draught lets go';
      paperBody.textContent = game.mode === 'full'
        ? 'A fifth hand asks to be held, and four already drink the warmth. I will not lift another. Take back the last kneading, or begin this room again.'
        : (game.result.paradox ? game.result.paradox.message : 'The flour has fallen.');
      paperActions.appendChild(button('Take back the last kneading', '', undoLastKneading));
      paperActions.appendChild(button('Begin this room again', 'quiet', restart));
      paperActions.appendChild(button('Unsay one step', 'quiet', undoOne));
    } else if (game.mode === 'leveldone') {
      paperTitle.textContent = lv.name;
      paperBody.textContent = lv.success;
      paperActions.appendChild(button('Step into the next room', '', nextRoom));
    } else if (game.mode === 'ending') {
      paperTitle.textContent = 'The house eats at noon';
      paperBody.textContent = 'There. I have put my hand on the crock and it is warm. You carried it; the flour only kept the promises you made on the way. I strike the oven-bell once, and not again. The draught, having nothing left to argue with, sets every hand down as dust on the flags — quietly, which is how flour ought to fall. The office is complete. Wash, and come to the table. You will not walk those forty steps again.';
      paperActions.appendChild(button('Leave the threshold', 'quiet', function () {
        game.levelIndex = 0;
        game.logs = [''];
        game.mode = 'title';
        game.full = false;
        shown.clear();
        refresh();
        showPaper();
      }));
    }
  }

  function toggleHum() {
    ensureAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    audioOn = !audioOn;
    hum(audioOn);
    showPaper();
  }

  function beginPlay() {
    ensureAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (!audioOn) { audioOn = true; hum(true); }
    game.levelIndex = 0;
    game.logs = [''];
    game.mode = 'intro';
    game.full = false;
    shown.clear();
    refresh();
    showPaper();
  }

  function nextRoom() {
    if (game.levelIndex >= LEVELS.length - 1) {
      game.mode = 'ending';
    } else {
      game.levelIndex += 1;
      game.logs = [''];
      game.mode = 'intro';
      shown.clear();
      refresh();
    }
    showPaper();
  }

  function restart() {
    game.logs = [''];
    game.mode = 'play';
    game.full = false;
    setNote('The flour is settled. Begin from the threshold.');
    shown.clear();
    refresh();
    showPaper();
  }

  function undoOne() {
    if (game.mode !== 'play' && game.mode !== 'paradox' && game.mode !== 'full') return;
    const before = JSON.stringify(game.logs);
    game.logs = undone(game.logs, level().ticks);
    if (JSON.stringify(game.logs) === before) return;
    game.mode = 'play';
    game.full = false;
    setNote('');
    refresh();
    showPaper();
  }

  function undoLastKneading() {
    const logs = game.logs.slice();
    if (logs.length <= 1) {
      restart();
      return;
    }
    logs.pop();
    if (logs.length === 0) {
      restart();
      return;
    }
    logs.pop();
    logs.push('');
    game.logs = logs;
    game.mode = 'play';
    game.full = false;
    setNote('That kneading is out of the flour.');
    shown.clear();
    refresh();
    showPaper();
  }

  function doStep(ch) {
    if (game.mode !== 'play') return;
    const lv = level();
    const pre = game.logs.slice();
    if (pre[pre.length - 1].length >= lv.ticks) return;
    pre[pre.length - 1] = pre[pre.length - 1] + ch;
    const result = simulate(lv, pre);
    if (!result.ok) {
      game.logs = pre;
      game.result = result;
      game.mode = 'paradox';
      game.full = false;
      setNote('');
      blip('fail');
      showPaper();
      return;
    }
    if (result.win) {
      game.logs = pre;
      game.result = result;
      game.mode = game.levelIndex === LEVELS.length - 1 ? 'ending' : 'leveldone';
      setNote('');
      blip('warm');
      showPaper();
      return;
    }
    const moved = result.world.actors[result.world.actors.length - 1];
    const shoved = result.liveTrace.length && result.liveTrace[result.liveTrace.length - 1].push;
    if (pre[pre.length - 1].length >= lv.ticks) {
      if (pre.length >= 5) {
        game.logs = pre;
        game.result = result;
        game.mode = 'full';
        blip('fail');
        showPaper();
        return;
      }
      game.logs = pre.concat(['']);
      game.result = simulate(lv, game.logs);
      setNote('The oven-bell. Your steps stay in the flour.');
      blip('bell');
      showPaper();
      return;
    }
    game.logs = pre;
    game.result = result;
    setNote('');
    blip(shoved ? 'shove' : 'step');
  }

  function doBell() {
    if (game.mode !== 'play') return;
    const last = game.logs[game.logs.length - 1];
    if (!last.length) {
      setNote('Strike the bell after you have taken at least one step. The draught cannot remember a kneading that never was.');
      return;
    }
    if (last.length >= level().ticks) return;
    if (game.logs.length >= 5) {
      game.mode = 'full';
      blip('fail');
      showPaper();
      return;
    }
    game.logs = withBell(game.logs);
    refresh();
    setNote('The kneading-bell. That hand is in the flour.');
    blip('bell');
    showPaper();
  }

  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const k = e.key;
    if (game.mode === 'title' && (k === 'Enter' || k === ' ')) {
      e.preventDefault();
      beginPlay();
      return;
    }
    if (game.mode === 'intro' && k === 'Enter') {
      e.preventDefault();
      game.mode = 'play';
      showPaper();
      return;
    }
    if (game.mode === 'leveldone' && k === 'Enter') {
      e.preventDefault();
      nextRoom();
      return;
    }
    const map = {
      ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R',
      w: 'U', a: 'L', s: 'D', d: 'R', W: 'U', A: 'L', S: 'D', D: 'R'
    };
    if (map[k]) { e.preventDefault(); doStep(map[k]); return; }
    if (k === ' ' || k === 'Spacebar') { e.preventDefault(); doStep('.'); return; }
    if (k === 'Enter') { e.preventDefault(); doBell(); return; }
    if (k === 'z' || k === 'Z' || k === 'Backspace') { e.preventDefault(); undoOne(); return; }
    if (k === 'r' || k === 'R') { e.preventDefault(); if (game.mode === 'play' || game.mode === 'paradox' || game.mode === 'full') restart(); }
  }

  function fitCanvas() {
    if (!canvas) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(WIDTH * dpr);
    canvas.height = Math.round(HEIGHT * dpr);
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function init() {
    if (!canvas) return;
    fitCanvas();
    spawnMotes();
    refresh();
    showPaper();
    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', fitCanvas);
    document.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () { b.blur(); doStep(b.getAttribute('data-go')); });
    });
    document.getElementById('btn-bell').addEventListener('click', function (e) { e.target.blur(); doBell(); });
    document.getElementById('btn-undo').addEventListener('click', function (e) { e.target.blur(); undoOne(); });
    document.getElementById('rehearse').addEventListener('click', function () {
      const out = selfTest();
      document.getElementById('rehearse-out').textContent = out.report;
    });
    requestAnimationFrame(frame);
  }

  const api = {
    LEVELS: LEVELS,
    simulate: simulate,
    selfTest: selfTest,
    withMove: withMove,
    withBell: withBell,
    undone: undone,
    fingerprint: fingerprint,
    TICKS: TICKS,
    carveCount: carveCount
  };
  const root = typeof globalThis !== 'undefined' ? globalThis : window;
  root.KneadingOffice = api;

  if (typeof document !== 'undefined' && canvas) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  }
})();
</script>
</body>
</html>
