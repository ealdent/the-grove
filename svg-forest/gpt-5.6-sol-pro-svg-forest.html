<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>The Glassroot Choir</title>

  <style>
    :root {
      color-scheme: dark;
      --ink: #eafff8;
      --cyan: #8fffe7;
      --violet: #c19cff;
      --panel: rgba(6, 8, 24, 0.56);
      --line: rgba(170, 255, 235, 0.38);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #050611;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
      background: #070816;
    }

    #game.dragging {
      cursor: grabbing;
    }

    .touch-ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .joystick {
      --size: clamp(112px, 24vw, 156px);

      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: var(--size);
      height: var(--size);
      border: 1px solid rgba(188, 255, 239, 0.3);
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(126, 255, 226, 0.08) 0 38%,
          transparent 39%
        ),
        radial-gradient(
          circle at 50% 50%,
          rgba(21, 22, 56, 0.76),
          rgba(7, 8, 27, 0.4)
        );
      box-shadow:
        inset 0 0 28px rgba(126, 255, 226, 0.08),
        0 0 30px rgba(97, 80, 182, 0.16);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      opacity: 0.82;
      pointer-events: auto;
      touch-action: none;
      transition:
        opacity 120ms ease,
        border-color 120ms ease;
    }

    .joystick.left {
      left: max(18px, env(safe-area-inset-left));
    }

    .joystick.right {
      right: max(18px, env(safe-area-inset-right));
    }

    .joystick::before,
    .joystick::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(174, 255, 238, 0.16);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .joystick::before {
      width: 1px;
      height: 62%;
    }

    .joystick::after {
      width: 62%;
      height: 1px;
    }

    .joystick.active {
      opacity: 1;
      border-color: rgba(188, 255, 239, 0.62);
    }

    .joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 42%;
      border: 1px solid rgba(220, 255, 248, 0.72);
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 38% 32%,
          rgba(234, 255, 249, 0.52),
          rgba(113, 255, 224, 0.18) 35%,
          rgba(22, 20, 58, 0.72) 72%
        ),
        rgba(8, 10, 29, 0.72);
      box-shadow:
        0 0 20px rgba(111, 255, 225, 0.2),
        inset 0 0 18px rgba(186, 153, 255, 0.18);
      transform: translate(-50%, -50%);
      pointer-events: none;
      will-change: transform;
    }

    .joystick-label {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      color: rgba(224, 255, 248, 0.55);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      pointer-events: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .joystick {
        display: none;
      }
    }

    @media (max-width: 520px) {
      .joystick {
        --size: clamp(104px, 29vw, 138px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .joystick,
      .joystick-knob {
        transition: none;
      }
    }
  </style>
</head>

          fill="#d7fff6"
          letter-spacing="1"
        >
          X 0 · Z 0 · N
        </text>
      </g>
    </g>
  </svg>

  <div class="touch-ui" aria-hidden="true">
    <div class="joystick left" id="moveStick">
      <div class="joystick-knob"></div>
      <div class="joystick-label">MOVE</div>
    </div>

    <div class="joystick right" id="turnStick">
      <div class="joystick-knob"></div>
      <div class="joystick-label">TURN</div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const SVG_NS = "http://www.w3.org/2000/svg";
      const XLINK_NS = "http://www.w3.org/1999/xlink";
      const TAU = Math.PI * 2;
      const DEG = Math.PI / 180;

      const game = document.getElementById("game");
      const stars = document.getElementById("stars");
      const auroraA = document.getElementById("auroraA");
      const auroraB = document.getElementById("auroraB");
      const auroraLayer = document.getElementById("auroraLayer");
      const largeMoon = document.getElementById("largeMoon");
      const smallMoon = document.getElementById("smallMoon");
      const horizonHalo = document.getElementById("horizonHalo");
      const groundFill = document.getElementById("groundFill");
      const groundShade = document.getElementById("groundShade");
      const groundBandsGroup = document.getElementById("groundBands");
      const veinsFarGlow = document.getElementById("veinsFarGlow");
      const veinsFarCore = document.getElementById("veinsFarCore");
      const veinsNearGlow = document.getElementById("veinsNearGlow");
      const veinsNearCore = document.getElementById("veinsNearCore");
      const propLayer = document.getElementById("propLayer");
      const motesLayer = document.getElementById("motes");
      const hudPanel = document.getElementById("hudPanel");
      const hudTitle = document.getElementById("hudTitle");
      const hudSubtitle = document.getElementById("hudSubtitle");
      const hudHelp = document.getElementById("hudHelp");
      const reticle = document.getElementById("reticle");
      const coordPanel = document.getElementById("coordPanel");
      const coordBack = document.getElementById("coordBack");
      const coordText = document.getElementById("coordText");

      const camera = {
        x: 4.2,
        z: -3.5,
        yaw: 0.23,
        pitch: 0,
        pathTravel: 0,
        walkPhase: 0,
        moveBlend: 0
      };

      const input = {
        moveStick: 0,
        turnStick: 0,
        dragId: null,
        dragX: 0,
        dragY: 0
      };

      const keys = new Set();
      const groundBands = [];
      const propPool = [];
      const motes = [];

      let width = 1;
      let height = 1;
      let focal = 700;
      let baseHorizon = 400;
      let currentHorizon = 400;
      let cameraHeight = 2.25;
      let activeChunkX = Number.NaN;
      let activeChunkZ = Number.NaN;
      let worldProps = [];
      let worldVeins = [];
      let frameNumber = 0;
      let lastTime = performance.now();
      let coarsePointer = window.matchMedia("(pointer: coarse)").matches;

      const CHUNK_SIZE = 34;
      const CHUNK_RADIUS = 5;
      const NEAR_CLIP = 2.2;
      const FAR_CLIP = 168;
      const FOV = 70 * DEG;
      const MOVE_SPEED = 13.5;
      const TURN_SPEED = 1.38;
      const MAX_VISIBLE_PROPS = 132;
      const BAND_COUNT = 14;
      const MOTE_COUNT = 28;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function mod(value, divisor) {
        return ((value % divisor) + divisor) % divisor;
      }

      function smoothstep(edge0, edge1, value) {
        const t = clamp(
          (value - edge0) / (edge1 - edge0),
          0,
          1
        );

        return t * t * (3 - 2 * t);
      }

      function hash2(x, z, salt = 0) {
        let h =
          Math.imul(x | 0, 0x1f123bb5) ^
          Math.imul(z | 0, 0x5f356495) ^
          Math.imul(salt | 0, 0x27d4eb2d);

        h ^= h >>> 15;
        h = Math.imul(h, 0x2c1b3c6d);
        h ^= h >>> 12;
        h = Math.imul(h, 0x297a2d39);
        h ^= h >>> 15;

        return (h >>> 0) / 4294967296;
      }

      function setUseHref(node, value) {
        if (node.dataset.href === value) {
          return;
        }

        node.setAttribute("href", value);
        node.setAttributeNS(XLINK_NS, "href", value);
        node.dataset.href = value;
      }

      function createSvgElement(name, attributes = {}) {
        const node = document.createElementNS(SVG_NS, name);

        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }

        return node;
      }

      function initializePools() {
        for (let i = 0; i < BAND_COUNT; i += 1) {
          const band = createSvgElement("path", {
            fill: "none",
            stroke: i % 3 === 0 ? "#c48fff" : "#7fffe1",
            "stroke-linecap": "round"
          });

          groundBandsGroup.appendChild(band);
          groundBands.push(band);
        }

        for (let i = 0; i < MAX_VISIBLE_PROPS; i += 1) {
          const use = createSvgElement("use", {
            display: "none",
            "pointer-events": "none"
          });

          propLayer.appendChild(use);
          propPool.push(use);
        }

        for (let i = 0; i < MOTE_COUNT; i += 1) {
          const circle = createSvgElement("circle", {
            fill: i % 5 === 0 ? "#c39aff" : "#cffff4"
          });

          motesLayer.appendChild(circle);

          motes.push({
            node: circle,
            xSeed: hash2(i, 41, 700),
            ySeed: hash2(i, 79, 701),
            phase: hash2(i, 17, 702) * TAU,
            speed: 0.012 + hash2(i, 23, 703) * 0.03,
            depth: 0.25 + hash2(i, 31, 704) * 0.75
          });
        }
      }

      function rebuildStars() {
        stars.replaceChildren();

        const baseCount = Math.round(
          clamp((width * height) / 22000, 38, 82)
        );

        for (let i = 0; i < baseCount; i += 1) {
          const baseX = hash2(i, 11, 801) * width;
          const y =
            hash2(i, 13, 802) *
            Math.max(80, height * 0.58);
          const r =
            0.45 +
            hash2(i, 17, 803) * 1.55;
          const opacity =
            0.18 +
            hash2(i, 19, 804) * 0.58;

          for (let copy = 0; copy < 3; copy += 1) {
            const star = createSvgElement("circle", {
              cx: (baseX + copy * width).toFixed(2),
              cy: y.toFixed(2),
              r: r.toFixed(2),
              fill: i % 8 === 0 ? "#d2b7ff" : "#e8fff9",
              opacity: opacity.toFixed(2)
            });

            stars.appendChild(star);
          }
        }
      }

      function layoutSky() {
        auroraA.setAttribute(
          "d",
          [
            `M ${-0.12 * width} ${0.18 * height}`,
            `C ${0.12 * width} ${0.03 * height}, ${0.26 * width} ${0.34 * height}, ${0.47 * width} ${0.16 * height}`,
            `S ${0.83 * width} ${0.27 * height}, ${1.14 * width} ${0.08 * height}`,
            `L ${1.14 * width} ${0.21 * height}`,
            `C ${0.84 * width} ${0.36 * height}, ${0.63 * width} ${0.28 * height}, ${0.45 * width} ${0.29 * height}`,
            `S ${0.08 * width} ${0.16 * height}, ${-0.12 * width} ${0.33 * height} Z`
          ].join(" ")
        );

        auroraB.setAttribute(
          "d",
          [
            `M ${-0.08 * width} ${0.33 * height}`,
            `C ${0.17 * width} ${0.18 * height}, ${0.35 * width} ${0.38 * height}, ${0.57 * width} ${0.22 * height}`,
            `S ${0.91 * width} ${0.35 * height}, ${1.1 * width} ${0.2 * height}`,
            `L ${1.1 * width} ${0.31 * height}`,
            `C ${0.86 * width} ${0.44 * height}, ${0.7 * width} ${0.34 * height}, ${0.53 * width} ${0.37 * height}`,
            `S ${0.15 * width} ${0.3 * height}, ${-0.08 * width} ${0.43 * height} Z`
          ].join(" ")
        );
      }

      function layoutHud() {
        const mobile = coarsePointer || width < 720;
        const panelX = mobile ? 16 : 24;
        const panelY = mobile ? 38 : 24;
        const panelW = Math.min(
          width - panelX * 2,
          mobile ? 360 : 410
        );
        const panelH = mobile ? 98 : 104;
        const titleSize = mobile
          ? clamp(width / 22, 15, 20)
          : 21;
        const smallSize = mobile ? 10.5 : 11.5;

        hudPanel.setAttribute("x", panelX);
        hudPanel.setAttribute("y", panelY);
        hudPanel.setAttribute("width", panelW);
        hudPanel.setAttribute("height", panelH);

        hudTitle.setAttribute("x", panelX + 16);
        hudTitle.setAttribute("y", panelY + 31);
        hudTitle.setAttribute("font-size", titleSize);

        hudSubtitle.setAttribute("x", panelX + 16);
        hudSubtitle.setAttribute("y", panelY + 55);
        hudSubtitle.setAttribute("font-size", smallSize);

        hudHelp.setAttribute("x", panelX + 16);
        hudHelp.setAttribute("y", panelY + 80);
        hudHelp.setAttribute("font-size", smallSize);
        hudHelp.textContent = mobile
          ? "LEFT: MOVE · RIGHT: TURN · MULTITOUCH READY"
          : "W/S MOVE · A/D TURN · DRAG TO LOOK";

        reticle.setAttribute(
          "transform",
          `translate(${width / 2} ${height / 2})`
        );

        const coordW = Math.min(290, width - 32);
        const coordH = 34;

        coordPanel.setAttribute(
          "transform",
          `translate(${width / 2} ${height - (mobile ? 30 : 24)})`
        );

        coordBack.setAttribute("x", -coordW / 2);
        coordBack.setAttribute("y", -coordH);
        coordBack.setAttribute("width", coordW);
        coordBack.setAttribute("height", coordH);

        coordText.setAttribute("x", 0);
        coordText.setAttribute("y", -11);
        coordText.setAttribute(
          "font-size",
          mobile ? 10.5 : 11.5
        );
      }

      function resize() {
        const rect = game.getBoundingClientRect();

        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);

        game.setAttribute(
          "viewBox",
          `0 0 ${width} ${height}`
        );

        focal = width / (2 * Math.tan(FOV / 2));
        baseHorizon = height * 0.47;
        coarsePointer =
          window.matchMedia("(pointer: coarse)").matches;

        rebuildStars();
        layoutSky();
        layoutHud();
      }

      function rebuildWorld(force = false) {
        const centerChunkX =
          Math.floor(camera.x / CHUNK_SIZE);
        const centerChunkZ =
          Math.floor(camera.z / CHUNK_SIZE);

        if (
          !force &&
          centerChunkX === activeChunkX &&
          centerChunkZ === activeChunkZ
        ) {
          return;
        }

        activeChunkX = centerChunkX;
        activeChunkZ = centerChunkZ;

        const props = [];
        const veins = [];

        for (
          let cz = centerChunkZ - CHUNK_RADIUS;
          cz <= centerChunkZ + CHUNK_RADIUS;
          cz += 1
        ) {
          for (
            let cx = centerChunkX - CHUNK_RADIUS;
            cx <= centerChunkX + CHUNK_RADIUS;
            cx += 1
          ) {
            const propCount =
              2 +
              Math.floor(
                hash2(cx, cz, 11) * 3.999
              );

            for (
              let i = 0;
              i < propCount;
              i += 1
            ) {
              const x =
                (
                  cx +
                  0.08 +
                  hash2(cx, cz, 100 + i * 17) *
                    0.84
                ) *
                CHUNK_SIZE;

              const z =
                (
                  cz +
                  0.08 +
                  hash2(cx, cz, 101 + i * 17) *
                    0.84
                ) *
                CHUNK_SIZE;

              const selector =
                hash2(cx, cz, 102 + i * 17);
              const phase =
                hash2(cx, cz, 103 + i * 17) *
                TAU;
              const flip =
                hash2(cx, cz, 104 + i * 17) <
                0.5
                  ? -1
                  : 1;

              let type;
              let scale;
              let y = 0;

              if (selector < 0.38) {
                type = "bloom";
                scale =
                  0.72 +
                  hash2(
                    cx,
                    cz,
                    105 + i * 17
                  ) *
                    0.78;
              } else if (selector < 0.64) {
                type = "spire";
                scale =
                  0.58 +
                  hash2(
                    cx,
                    cz,
                    105 + i * 17
                  ) *
                    0.82;
              } else if (selector < 0.84) {
                type = "arch";
                scale =
                  0.62 +
                  hash2(
                    cx,
                    cz,
                    105 + i * 17
                  ) *
                    0.76;
              } else {
                type = "veil";
                scale =
                  0.56 +
                  hash2(
                    cx,
                    cz,
                    105 + i * 17
                  ) *
                    0.66;
                y =
                  4.8 +
                  hash2(
                    cx,
                    cz,
                    106 + i * 17
                  ) *
                    5.8;
              }

              props.push({
                x,
                z,
                y,
                type,
                scale,
                phase,
                flip
              });
            }

            const veinCount =
              2 +
              Math.floor(
                hash2(cx, cz, 411) * 2.999
              );

            for (
              let i = 0;
              i < veinCount;
              i += 1
            ) {
              const centerX =
                (
                  cx +
                  hash2(
                    cx,
                    cz,
                    420 + i * 13
                  )
                ) *
                CHUNK_SIZE;

              const centerZ =
                (
                  cz +
                  hash2(
                    cx,
                    cz,
                    421 + i * 13
                  )
                ) *
                CHUNK_SIZE;

              const angle =
                hash2(
                  cx,
                  cz,
                  422 + i * 13
                ) * TAU;

              const length =
                4 +
                hash2(
                  cx,
                  cz,
                  423 + i * 13
                ) *
                  10;

              const half = length * 0.5;
              const cosine = Math.cos(angle);
              const sine = Math.sin(angle);

              const x1 =
                centerX - cosine * half;
              const z1 =
                centerZ - sine * half;
              const x2 =
                centerX + cosine * half;
              const z2 =
                centerZ + sine * half;

              veins.push({
                x1,
                z1,
                x2,
                z2,
                cx: centerX,
                cz: centerZ
              });

              if (
                hash2(
                  cx,
                  cz,
                  424 + i * 13
                ) > 0.48
              ) {
                const branchAngle =
                  angle +
                  (
                    hash2(
                      cx,
                      cz,
                      425 + i * 13
                    ) -
                    0.5
                  ) *
                    1.6;

                const branchLength =
                  length *
                  (
                    0.28 +
                    hash2(
                      cx,
                      cz,
                      426 + i * 13
                    ) *
                      0.25
                  );

                veins.push({
                  x1: centerX,
                  z1: centerZ,
                  x2:
                    centerX +
                    Math.cos(branchAngle) *
                      branchLength,
                  z2:
                    centerZ +
                    Math.sin(branchAngle) *
                      branchLength,
                  cx: centerX,
                  cz: centerZ
                });
              }
            }
          }
        }

        worldProps = props;
        worldVeins = veins;
      }

      function projectGroundSegment(
        segment,
        nearParts,
        farParts,
        bobX
      ) {
        const centerDx =
          segment.cx - camera.x;
        const centerDz =
          segment.cz - camera.z;

        if (
          centerDx * centerDx +
            centerDz * centerDz >
          FAR_CLIP * FAR_CLIP * 1.18
        ) {
          return;
        }

        const sine = Math.sin(camera.yaw);
        const cosine = Math.cos(camera.yaw);

        const dx1 = segment.x1 - camera.x;
        const dz1 = segment.z1 - camera.z;
        const dx2 = segment.x2 - camera.x;
        const dz2 = segment.z2 - camera.z;

        let x1 = dx1 * cosine - dz1 * sine;
        let z1 = dx1 * sine + dz1 * cosine;
        let x2 = dx2 * cosine - dz2 * sine;
        let z2 = dx2 * sine + dz2 * cosine;

        if (
          z1 <= NEAR_CLIP &&
          z2 <= NEAR_CLIP
        ) {
          return;
        }

        if (z1 <= NEAR_CLIP) {
          const t =
            (NEAR_CLIP - z1) /
            (z2 - z1);

          x1 += (x2 - x1) * t;
          z1 = NEAR_CLIP;
        } else if (z2 <= NEAR_CLIP) {
          const t =
            (NEAR_CLIP - z2) /
            (z1 - z2);

          x2 += (x1 - x2) * t;
          z2 = NEAR_CLIP;
        }

        if (
          z1 > FAR_CLIP &&
          z2 > FAR_CLIP
        ) {
          return;
        }

        const sx1 =
          width * 0.5 +
          bobX +
          (x1 * focal) / z1;

        const sy1 =
          currentHorizon +
          (cameraHeight * focal) / z1;

        const sx2 =
          width * 0.5 +
          bobX +
          (x2 * focal) / z2;

        const sy2 =
          currentHorizon +
          (cameraHeight * focal) / z2;

        if (
          (sx1 < -100 && sx2 < -100) ||
          (
            sx1 > width + 100 &&
            sx2 > width + 100
          )
        ) {
          return;
        }

        if (
          (
            sy1 > height + 120 &&
            sy2 > height + 120
          ) ||
          (
            sy1 < currentHorizon - 4 &&
            sy2 < currentHorizon - 4
          )
        ) {
          return;
        }

        const path =
          `M${sx1.toFixed(1)} ${sy1.toFixed(1)}` +
          `L${sx2.toFixed(1)} ${sy2.toFixed(1)}`;

        const averageDepth =
          (z1 + z2) * 0.5;

        if (averageDepth < 72) {
          nearParts.push(path);
        } else {
          farParts.push(path);
        }
      }

      function renderGroundBands() {
        const spacing = 13.5;
        const phase = mod(
          camera.pathTravel,
          spacing
        );
        const wrapSpan =
          spacing * (BAND_COUNT + 2);

        for (
          let i = 0;
          i < BAND_COUNT;
          i += 1
        ) {
          let distance =
            6.5 +
            i * spacing -
            phase;

          while (distance < 3.2) {
            distance += wrapSpan;
          }

          const y =
            currentHorizon +
            (cameraHeight * focal) /
              distance;

          const band = groundBands[i];

          if (
            y > height + 35 ||
            y < currentHorizon + 1
          ) {
            band.setAttribute(
              "display",
              "none"
            );
            continue;
          }

          const sag = Math.min(
            24,
            (y - currentHorizon) * 0.055
          );

          const perspectiveFade =
            1 -
            smoothstep(
              70,
              FAR_CLIP,
              distance
            );

          const lowerFade =
            1 -
            smoothstep(
              height * 0.82,
              height * 1.02,
              y
            );

          const opacity =
            (
              0.035 +
              perspectiveFade * 0.095
            ) *
            lowerFade;

          const strokeWidth =
            0.6 +
            perspectiveFade * 0.8;

          band.setAttribute(
            "display",
            "inline"
          );

          band.setAttribute(
            "d",
            [
              `M ${-0.08 * width} ${y.toFixed(1)}`,
              `Q ${0.5 * width} ${(y + sag).toFixed(1)}`,
              `${1.08 * width} ${y.toFixed(1)}`
            ].join(" ")
          );

          band.setAttribute(
            "opacity",
            opacity.toFixed(3)
          );

          band.setAttribute(
            "stroke-width",
            strokeWidth.toFixed(2)
          );
        }
      }

      function renderVeins(bobX) {
        const nearParts = [];
        const farParts = [];

        for (const segment of worldVeins) {
          projectGroundSegment(
            segment,
            nearParts,
            farParts,
            bobX
          );
        }

        const nearPath =
          nearParts.join("");
        const farPath =
          farParts.join("");

        veinsNearGlow.setAttribute(
          "d",
          nearPath
        );

        veinsNearCore.setAttribute(
          "d",
          nearPath
        );

        veinsFarGlow.setAttribute(
          "d",
          farPath
        );

        veinsFarCore.setAttribute(
          "d",
          farPath
        );
      }

      function renderProps(
        timeSeconds,
        bobX
      ) {
        const visible = [];
        const sine = Math.sin(camera.yaw);
        const cosine = Math.cos(camera.yaw);
        const cullingTangent =
          Math.tan(FOV * 0.58);

        for (const prop of worldProps) {
          let dx = prop.x - camera.x;
          let dz = prop.z - camera.z;

          if (prop.type === "veil") {
            const drift =
              Math.sin(
                timeSeconds * 0.38 +
                  prop.phase
              ) * 0.55;

            dx +=
              Math.cos(prop.phase) * drift;

            dz +=
              Math.sin(prop.phase) * drift;
          }

          const cameraX =
            dx * cosine -
            dz * sine;

          const depth =
            dx * sine +
            dz * cosine;

          if (
            depth <= NEAR_CLIP ||
            depth >= FAR_CLIP
          ) {
            continue;
          }

          if (
            Math.abs(cameraX) >
            depth * cullingTangent + 8
          ) {
            continue;
          }

          visible.push({
            prop,
            cameraX,
            depth
          });
        }

        visible.sort(
          (a, b) => b.depth - a.depth
        );

        const list =
          visible.length >
          MAX_VISIBLE_PROPS
            ? visible.slice(
                visible.length -
                  MAX_VISIBLE_PROPS
              )
            : visible;

        let poolIndex = 0;

        for (const item of list) {
          const { prop, depth } = item;
          const use = propPool[poolIndex];

          const scale =
            (focal / depth) *
            prop.scale;

          const floatingY =
            prop.type === "veil"
              ? prop.y +
                Math.sin(
                  timeSeconds * 0.72 +
                    prop.phase
                ) *
                  0.48
              : prop.y;

          const screenX =
            width * 0.5 +
            bobX +
            (item.cameraX * focal) /
              depth;

          const screenY =
            currentHorizon -
            (
              (floatingY -
                cameraHeight) *
              focal
            ) /
              depth;

          const fog =
            1 -
            smoothstep(
              FAR_CLIP * 0.48,
              FAR_CLIP,
              depth
            ) *
              0.88;

          const nearFade =
            smoothstep(
              NEAR_CLIP,
              NEAR_CLIP + 1.2,
              depth
            );

          const opacity = clamp(
            fog * nearFade,
            0,
            1
          );

          let sway = 0;

          if (prop.type === "bloom") {
            sway =
              Math.sin(
                timeSeconds * 0.6 +
                  prop.phase
              ) * 1.2;
          } else if (
            prop.type === "veil"
          ) {
            sway =
              Math.sin(
                timeSeconds * 0.85 +
                  prop.phase
              ) * 4.2;
          }

          setUseHref(
            use,
            `#prop-${prop.type}`
          );

          use.setAttribute(
            "display",
            "inline"
          );

          use.setAttribute(
            "opacity",
            opacity.toFixed(3)
          );

          use.setAttribute(
            "transform",
            [
              `translate(${screenX.toFixed(2)} ${screenY.toFixed(2)})`,
              `rotate(${sway.toFixed(2)})`,
              `scale(${(scale * prop.flip).toFixed(4)} ${scale.toFixed(4)})`
            ].join(" ")
          );

          poolIndex += 1;
        }

        for (
          ;
          poolIndex < propPool.length;
          poolIndex += 1
        ) {
          propPool[
            poolIndex
          ].setAttribute(
            "display",
            "none"
          );
        }
      }

      function renderMotes(timeSeconds) {
        const yawDrift =
          mod(camera.yaw / TAU, 1) *
          width;

        for (
          let i = 0;
          i < motes.length;
          i += 1
        ) {
          const mote = motes[i];

          const travel =
            timeSeconds *
            width *
            mote.speed;

          const x =
            mod(
              mote.xSeed * width +
                travel -
                yawDrift *
                  mote.depth *
                  0.18,
              width + 120
            ) -
            60;

          const baseY =
            mote.ySeed * height;

          const y =
            baseY +
            Math.sin(
              timeSeconds *
                (
                  0.35 +
                  mote.depth * 0.42
                ) +
                mote.phase
            ) *
              (
                10 +
                20 * mote.depth
              );

          const radius =
            0.7 +
            mote.depth * 1.65;

          const opacity =
            0.07 +
            mote.depth * 0.16;

          mote.node.setAttribute(
            "cx",
            x.toFixed(1)
          );

          mote.node.setAttribute(
            "cy",
            y.toFixed(1)
          );

          mote.node.setAttribute(
            "r",
            radius.toFixed(2)
          );

          mote.node.setAttribute(
            "opacity",
            opacity.toFixed(3)
          );
        }
      }

      function compassLabel(yaw) {
        const labels = [
          "N",
          "NE",
          "E",
          "SE",
          "S",
          "SW",
          "W",
          "NW"
        ];

        const normalized = mod(
          yaw,
          TAU
        );

        const index =
          Math.round(
            normalized /
              (TAU / labels.length)
          ) % labels.length;

        return labels[index];
      }

      function updateHud() {
        coordText.textContent =
          `X ${Math.round(camera.x)}` +
          ` · Z ${Math.round(camera.z)}` +
          ` · ${compassLabel(camera.yaw)}`;
      }

      function updateSky(
        timeSeconds,
        bobY
      ) {
        const starOffset =
          mod(camera.yaw / TAU, 1) *
          width;

        const pitchShift =
          -camera.pitch *
            height *
            0.16 +
          bobY * 0.2;

        stars.setAttribute(
          "transform",
          `translate(${-width - starOffset} ${pitchShift.toFixed(2)})`
        );

        const auroraShift =
          Math.sin(
            camera.yaw + 0.4
          ) *
          width *
          0.035;

        auroraLayer.setAttribute(
          "transform",
          `translate(${auroraShift.toFixed(2)} ${(pitchShift * 0.36).toFixed(2)})`
        );

        const moonScale = clamp(
          Math.min(width, height) / 900,
          0.58,
          1.15
        );

        const moonX =
          width * 0.78 -
          Math.sin(camera.yaw) *
            width *
            0.09;

        const moonY =
          height * 0.18 +
          pitchShift * 0.55;

        largeMoon.setAttribute(
          "transform",
          `translate(${moonX.toFixed(1)} ${moonY.toFixed(1)}) scale(${moonScale.toFixed(3)})`
        );

        const smallScale =
          moonScale * 0.72;

        const smallX =
          width * 0.18 -
          Math.sin(
            camera.yaw + 1.8
          ) *
            width *
            0.05;

        const smallY =
          height * 0.27 +
          pitchShift * 0.35 +
          Math.sin(
            timeSeconds * 0.05
          ) *
            3;

        smallMoon.setAttribute(
          "transform",
          `translate(${smallX.toFixed(1)} ${smallY.toFixed(1)}) scale(${smallScale.toFixed(3)})`
        );
      }

      function render(timeSeconds) {
        const headBobWorld =
          Math.sin(
            camera.walkPhase * 2.05
          ) *
          0.055 *
          camera.moveBlend;

        const bobY =
          Math.sin(
            camera.walkPhase * 2.05
          ) *
          2.7 *
          camera.moveBlend;

        const bobX =
          Math.sin(
            camera.walkPhase *
              1.025 +
              1.2
          ) *
          2.2 *
          camera.moveBlend;

        cameraHeight =
          2.26 + headBobWorld;

        currentHorizon =
          baseHorizon -
          camera.pitch *
            height *
            0.34 +
          bobY;

        currentHorizon = clamp(
          currentHorizon,
          height * 0.25,
          height * 0.67
        );

        groundFill.setAttribute(
          "d",
          `M0 ${currentHorizon.toFixed(1)} H${width} V${height} H0 Z`
        );

        groundShade.setAttribute(
          "d",
          [
            `M0 ${(currentHorizon + height * 0.31).toFixed(1)}`,
            `Q${(width * 0.5).toFixed(1)} ${(height * 0.83).toFixed(1)}`,
            `${width} ${(currentHorizon + height * 0.31).toFixed(1)}`,
            `V${height} H0 Z`
          ].join(" ")
        );

        horizonHalo.setAttribute(
          "cx",
          width * 0.5
        );

        horizonHalo.setAttribute(
          "cy",
          currentHorizon + 8
        );

        horizonHalo.setAttribute(
          "rx",
          width * 0.62
        );

        horizonHalo.setAttribute(
          "ry",
          Math.max(
            70,
            height * 0.19
          )
        );

        renderGroundBands();
        renderVeins(bobX);
        renderProps(timeSeconds, bobX);
        renderMotes(timeSeconds);
        updateSky(timeSeconds, bobY);

        if (frameNumber % 6 === 0) {
          updateHud();
        }
      }

      function isPressed(...names) {
        return names.some((name) =>
          keys.has(name)
        );
      }

      function update(deltaTime) {
        const keyboardMove =
          (
            isPressed(
              "w",
              "arrowup"
            )
              ? 1
              : 0
          ) -
          (
            isPressed(
              "s",
              "arrowdown"
            )
              ? 1
              : 0
          );

        const keyboardTurn =
          (
            isPressed(
              "d",
              "arrowright"
            )
              ? 1
              : 0
          ) -
          (
            isPressed(
              "a",
              "arrowleft"
            )
              ? 1
              : 0
          );

        const movement = clamp(
          keyboardMove +
            input.moveStick,
          -1,
          1
        );

        const turning = clamp(
          keyboardTurn +
            input.turnStick,
          -1,
          1
        );

        camera.yaw = mod(
          camera.yaw +
            turning *
              TURN_SPEED *
              deltaTime,
          TAU
        );

        if (
          Math.abs(movement) >
          0.001
        ) {
          const speed =
            movement >= 0
              ? MOVE_SPEED
              : MOVE_SPEED * 0.68;

          const distance =
            movement *
            speed *
            deltaTime;

          camera.x +=
            Math.sin(camera.yaw) *
            distance;

          camera.z +=
            Math.cos(camera.yaw) *
            distance;

          camera.pathTravel +=
            distance;

          camera.walkPhase +=
            Math.abs(distance) *
            0.72;
        }

        const blendRate =
          1 -
          Math.exp(
            -deltaTime * 10
          );

        camera.moveBlend +=
          (
            Math.min(
              1,
              Math.abs(movement)
            ) -
            camera.moveBlend
          ) *
          blendRate;

        rebuildWorld();
      }

      function frame(now) {
        const deltaTime = Math.min(
          0.05,
          Math.max(
            0,
            (now - lastTime) / 1000
          )
        );

        lastTime = now;
        frameNumber += 1;

        update(deltaTime);
        render(now / 1000);

        requestAnimationFrame(frame);
      }

      function bindJoystick(
        element,
        axis
      ) {
        const knob =
          element.querySelector(
            ".joystick-knob"
          );

        let pointerId = null;

        function setKnob(dx, dy) {
          knob.style.transform =
            `translate(-50%, -50%) ` +
            `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
        }

        function applyPointer(event) {
          const rect =
            element.getBoundingClientRect();

          const centerX =
            rect.left +
            rect.width * 0.5;

          const centerY =
            rect.top +
            rect.height * 0.5;

          const maximum =
            rect.width * 0.3;

          let dx =
            event.clientX -
            centerX;

          let dy =
            event.clientY -
            centerY;

          const length =
            Math.hypot(dx, dy);

          if (length > maximum) {
            dx =
              (dx / length) *
              maximum;

            dy =
              (dy / length) *
              maximum;
          }

          if (axis === "vertical") {
            const value = clamp(
              -dy / maximum,
              -1,
              1
            );

            input.moveStick =
              Math.abs(value) < 0.08
                ? 0
                : value;

            setKnob(0, dy);
          } else {
            const value = clamp(
              dx / maximum,
              -1,
              1
            );

            input.turnStick =
              Math.abs(value) < 0.08
                ? 0
                : value;

            setKnob(dx, 0);
          }
        }

        function reset() {
          if (axis === "vertical") {
            input.moveStick = 0;
          } else {
            input.turnStick = 0;
          }

          pointerId = null;
          element.classList.remove(
            "active"
          );

          setKnob(0, 0);
        }

        element.addEventListener(
          "pointerdown",
          (event) => {
            if (pointerId !== null) {
              return;
            }

            pointerId =
              event.pointerId;

            element.setPointerCapture(
              pointerId
            );

            element.classList.add(
              "active"
            );

            applyPointer(event);
            event.preventDefault();
          }
        );

        element.addEventListener(
          "pointermove",
          (event) => {
            if (
              event.pointerId !==
              pointerId
            ) {
              return;
            }

            applyPointer(event);
            event.preventDefault();
          }
        );

        for (const eventName of [
          "pointerup",
          "pointercancel",
          "lostpointercapture"
        ]) {
          element.addEventListener(
            eventName,
            (event) => {
              if (
                event.pointerId !==
                pointerId
              ) {
                return;
              }

              reset();
              event.preventDefault();
            }
          );
        }
      }

      window.addEventListener(
        "keydown",
        (event) => {
          const key =
            event.key.toLowerCase();

          if (
            [
              "w",
              "a",
              "s",
              "d",
              "arrowup",
              "arrowdown",
              "arrowleft",
              "arrowright"
            ].includes(key)
          ) {
            keys.add(key);
            event.preventDefault();
          }
        },
        { passive: false }
      );

      window.addEventListener(
        "keyup",
        (event) => {
          keys.delete(
            event.key.toLowerCase()
          );
        }
      );

      window.addEventListener(
        "blur",
        () => {
          keys.clear();
          input.moveStick = 0;
          input.turnStick = 0;
        }
      );

      game.addEventListener(
        "pointerdown",
        (event) => {
          if (
            event.pointerType !==
              "mouse" ||
            event.button !== 0
          ) {
            return;
          }

          input.dragId =
            event.pointerId;
          input.dragX =
            event.clientX;
          input.dragY =
            event.clientY;

          game.setPointerCapture(
            event.pointerId
          );

          game.classList.add(
            "dragging"
          );

          event.preventDefault();
        }
      );

      game.addEventListener(
        "pointermove",
        (event) => {
          if (
            event.pointerId !==
            input.dragId
          ) {
            return;
          }

          const dx =
            event.clientX -
            input.dragX;

          const dy =
            event.clientY -
            input.dragY;

          input.dragX =
            event.clientX;

          input.dragY =
            event.clientY;

          camera.yaw = mod(
            camera.yaw +
              dx * 0.0042,
            TAU
          );

          camera.pitch = clamp(
            camera.pitch +
              dy * 0.0024,
            -0.42,
            0.42
          );

          event.preventDefault();
        }
      );

      function endDrag(event) {
        if (
          event.pointerId !==
          input.dragId
        ) {
          return;
        }

        input.dragId = null;

        game.classList.remove(
          "dragging"
        );
      }

      game.addEventListener(
        "pointerup",
        endDrag
      );

      game.addEventListener(
        "pointercancel",
        endDrag
      );

      game.addEventListener(
        "lostpointercapture",
        endDrag
      );

      game.addEventListener(
        "contextmenu",
        (event) =>
          event.preventDefault()
      );

      document.addEventListener(
        "touchmove",
        (event) =>
          event.preventDefault(),
        { passive: false }
      );

      document.addEventListener(
        "gesturestart",
        (event) =>
          event.preventDefault(),
        { passive: false }
      );

      document.addEventListener(
        "gesturechange",
        (event) =>
          event.preventDefault(),
        { passive: false }
      );

      document.addEventListener(
        "gestureend",
        (event) =>
          event.preventDefault(),
        { passive: false }
      );

      window.addEventListener(
        "resize",
        resize,
        { passive: true }
      );

      window
        .matchMedia("(pointer: coarse)")
        .addEventListener?.(
          "change",
          resize
        );

      document.addEventListener(
        "visibilitychange",
        () => {
          lastTime =
            performance.now();
        }
      );

      bindJoystick(
        document.getElementById(
          "moveStick"
        ),
        "vertical"
      );

      bindJoystick(
        document.getElementById(
          "turnStick"
        ),
        "horizontal"
      );

      initializePools();
      resize();
      rebuildWorld(true);
      render(performance.now() / 1000);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
