<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#172522">
<meta name="description" content="Walk the ironwood forests of Orra and recover a lost transmission in a standalone SVG exploration game.">
<title>Longwave — The Ferrite Basin</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --paper: #f3e6c9; --amber: #ffae6a; --ink: #182723; --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; --sans: "Barlow", "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body { position: fixed; inset: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); user-select: none; -webkit-user-select: none; }
  button { position: relative; padding: 0; border: 0; color: inherit; background: transparent; font: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  button svg { pointer-events: none; }
  svg { display: block; }
  svg text { font-family: var(--sans); fill: var(--paper); }
  .mono { font-family: var(--mono); font-weight: 500; }
  .dim { fill: #b1bbab; }
  .amber { fill: var(--amber); }
  #game { height: 100%; height: 100dvh; display: grid; grid-template-rows: calc(65px + env(safe-area-inset-top)) minmax(0, 1fr) calc(39px + env(safe-area-inset-bottom)); }
  .rail { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 0 max(26px, env(safe-area-inset-right)) 0 max(26px, env(safe-area-inset-left)); isolation: isolate; }
  header.rail { padding-top: env(safe-area-inset-top); z-index: 2; }
  footer.rail { padding-bottom: env(safe-area-inset-bottom); }
  .rail-skin { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  #brand { width: 191px; height: 39px; }
  #compass { width: min(29vw, 364px); height: 45px; position: absolute; left: 50%; transform: translateX(-50%); overflow: hidden; }
  .actions { display: flex; gap: 9px; align-items: center; }
  .tool { height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 11px; }
  .tool .plate { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; fill: #23332e; stroke: #526158; overflow: visible; }
  .tool:hover .plate, .tool:focus-visible .plate { fill: #38483e; stroke: #b2a585; }
  .tool-icon { width: 17px; height: 17px; fill: none; stroke: var(--paper); stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
  .tool-word { height: 18px; width: 83px; }
  #sound-button { width: 37px; padding: 0; }
  #sound-on, #sound-button[aria-pressed="true"] #sound-off { display: none; }
  #sound-button[aria-pressed="true"] #sound-on { display: inline; }
  #viewport { position: relative; overflow: hidden; isolation: isolate; touch-action: none; }
  #world { width: 100%; height: 100%; overflow: hidden; cursor: grab; touch-action: none; }
  #world.dragging { cursor: grabbing; }
  .overlay { position: absolute; pointer-events: none; }
  #place { bottom: 23px; left: max(26px, env(safe-area-inset-left)); width: 287px; height: 79px; }
  #receiver { right: max(26px, env(safe-area-inset-right)); bottom: 23px; width: 201px; height: 70px; }
  #notification { left: 50%; bottom: 35px; transform: translateX(-50%); width: min(295px, 86vw); height: 44px; }
  #notification[hidden], #journal[hidden], .sr-only[hidden] { display: none; }
  #desktop-keys { width: 389px; height: 22px; }
  #touch-keys { display: none; width: 160px; height: 22px; }
  #footer-log { width: 137px; height: 22px; }
  .stick { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #journal { position: absolute; z-index: 5; inset: 0; display: grid; place-items: center; }
  #scrim { width: 100%; height: 100%; position: absolute; inset: 0; }
  .sheet { position: relative; width: min(484px, calc(100vw - 22px), calc((100dvh - 12px) * 1.04)); aspect-ratio: 480 / 457; }
  .page { width: 100%; height: 100%; }
  #close-notes { position: absolute; right: 4.3%; top: 4.3%; width: 9%; aspect-ratio: 1; }
  #close-notes svg { width: 100%; height: 100%; }
  @media (max-width: 760px) {
    .rail { padding-left: max(15px, env(safe-area-inset-left)); padding-right: max(15px, env(safe-area-inset-right)); }
    #place { left: max(15px, env(safe-area-inset-left)); }
    #receiver { right: max(15px, env(safe-area-inset-right)); }
    .actions { gap: 6px; }
    #notification { bottom: 105px; }
  }
  @media (max-width: 580px) {
    #game { grid-template-rows: calc(53px + env(safe-area-inset-top)) minmax(0, 1fr) calc(32px + env(safe-area-inset-bottom)); }
    #brand { width: 128px; height: 29px; }
    #compass { width: 99px; height: 37px; left: 54%; }
    .tool { width: 31px; height: 31px; padding: 0; }
    #sound-button { width: 31px; }
    .tool-word { display: none; }
    .rail { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
    #place { width: 206px; height: 57px; bottom: 14px; }
    #receiver { width: 142px; height: 50px; bottom: 16px; }
    #desktop-keys { width: min(59vw, 265px); }
    #footer-log { width: 110px; }
  }
  @media (pointer: coarse), (any-pointer: coarse) {
    #desktop-keys { display: none; }
    #touch-keys { display: block; }
    #place { top: 14px; bottom: auto; width: clamp(180px, 34vw, 256px); height: auto; }
    #receiver { right: max(15px, env(safe-area-inset-right)); top: 15px; bottom: auto; width: clamp(119px, 23vw, 174px); height: auto; }
    #notification { bottom: 25px; }
    .stick { position: absolute; display: grid; place-items: center; bottom: max(18px, env(safe-area-inset-bottom)); width: clamp(84px, 12vw, 108px); aspect-ratio: 1; border: 1px solid #f2ddad8c; border-radius: 50%; background: #1a272681; box-shadow: inset 0 0 0 5px #25302a40; touch-action: none; }
    #move-stick { left: max(21px, env(safe-area-inset-left)); }
    #turn-stick { right: max(21px, env(safe-area-inset-right)); }
    .stick .arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .stick .thumb { width: 39%; aspect-ratio: 1; pointer-events: none; border: 1px solid #fae5bbd9; background: #cbb08059; border-radius: 50%; }
    .stick.held { border-color: var(--amber); }
    .stick.held .thumb { background: #f4ad729e; border-color: #ffddbe; }
    .stick-name { position: absolute; top: 100%; margin-top: 3px; font: 9px var(--mono); letter-spacing: 1.4px; color: #fff0cf; text-shadow: 0 1px 2px #24312b; }
  }
  @media (pointer: coarse) and (max-width: 580px) {
    #notification { bottom: 116px; }
    #place { left: max(11px, env(safe-area-inset-left)); width: clamp(151px, 47vw, 212px); }
    #sector { font-size: 14px; letter-spacing: 1.1px; }
    #coords { font-size: 15px; letter-spacing: .25px; }
    #receiver { right: max(10px, env(safe-area-inset-right)); width: clamp(132px, 37vw, 171px); }
    #receiver text { font-size: 12.5px; }
    #receiver #signal-distance { font-size: 13.5px; }
  }
  @media (max-height: 490px) {
    #game { grid-template-rows: calc(41px + env(safe-area-inset-top)) minmax(0, 1fr) calc(26px + env(safe-area-inset-bottom)); }
    #brand { height: 28px; width: 143px; }
    #compass { height: 34px; }
    .tool { height: 28px; }
    #place { width: 171px; height: auto; }
    #receiver { width: 126px; height: auto; }
    .stick { width: 73px; bottom: 17px; }
  }
  @media (max-width: 355px) {
    #brand { width: 112px; }
    #compass { width: 77px; }
  }
</style>
</head>

<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;
  const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));
  const mod = (value, period) => ((value % period) + period) % period;
  const signedAngle = angle => mod(angle + Math.PI, TAU) - Math.PI;
  const svg = (tag, attrs, parent) => {
    const node = document.createElementNS(NS, tag);

  const set = (node, key, value) => {
    if (node.getAttribute(key) !== value) node.setAttribute(key, value);
  };
  const label = (id,value) => {
    const node=$(id);
    if(node.textContent!==value) node.textContent=value;
  };
  function hash(x, z, salt = 0) {
    let n = Math.imul(x, 0x45d9f3b) ^ Math.imul(z, 0x27d4eb2d) ^ salt;
    n = Math.imul(n ^ (n >>> 16), 0x85ebca6b);
    return (n ^ (n >>> 13)) >>> 0;
  }
  function random(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const world = $('world');
  const defs = world.querySelector('defs');
  // Start a portrait expedition in the same clearing, where a whole crown fits the narrower view.
  const portraitStart = matchMedia('(max-aspect-ratio: 4/5)').matches;
  const camera = { x: portraitStart?9.5:0, z: portraitStart?6.4:0, yaw: portraitStart?TAU-.06:0, pitch: 0, gait: 0, stride: 0 };
  const view = { w: 1, h: 1, f: 1, horizon: 1, eye: 2.6, x: 0, z: 0, sin: 0, cos: 1, half: 1, nearGround: 1 };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const kinds = {
    dishwood: { unit: .050, width: 101, height: 267, solid: 1.15, name: 'Dishwood', line: 'First light reached us.' },
    forkspire: { unit: .046, width: 45, height: 242, solid: .78, name: 'Fork spire', line: 'The seeds took.' },
    coilreed: { unit: .029, width: 73, height: 156, solid: 0, name: 'Coil reed', line: 'Leave the receiver on.' },
    agave: { unit: .028, width: 65, height: 59, solid: 0 },
    rock: { unit: .046, width: 52, height: 26, solid: 0 }
  };
  const species = ['dishwood', 'forkspire', 'coilreed'];
  const storageKey = 'longwave.orra.fragments.v1';
  let logged = new Set();
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
    if (Array.isArray(saved)) logged = new Set(saved.filter(id => species.includes(id)));
  } catch { /* The expedition also runs with storage disabled. */ }
  function updateLog() {
    $('log-count').textContent = logged.size + '/3 SIGNALS';
    $('notes-count').textContent = logged.size + ' / 3 FRAGMENTS RECOVERED';
    species.forEach((id, i) => {
      if (logged.has(id)) $('entry-' + id).textContent = '“' + kinds[id].line + '”';
      $('log-lights').children[i].setAttribute('fill', logged.has(id) ? '#ffb174' : 'none');
    });
  }
  updateLog();

  const burin=random(84632);
  let orbEtch='',screenEtch='';
  for(let row=0;row<34;row++) {
    const y=row*1.85+27;
    for(let j=0;j<9;j++) {
      const x=-99+burin()*210;
      if(y<66-.0019*x*x+burin()*10) continue;
      orbEtch+='M'+x.toFixed(1)+' '+(y+burin()).toFixed(1)+'q4 .5 '+(3+burin()*12).toFixed(1)+' -.2';
    }
  }
  for(let j=0;j<265;j++) {
    const x=-92+burin()*191,y=-257+burin()*99;
    screenEtch+='M'+x.toFixed(1)+' '+y.toFixed(1)+'l'+(1+burin()*2.8).toFixed(1)+' -1.5';
  }
  $('orb-etch').setAttribute('d',orbEtch);
  $('screen-etch').setAttribute('d',screenEtch);

  // A continuous horizon wraps once per revolution. Each plate has a drawn face and its own strata.
  const back = [[0,-54],[31,-58],[60,-54],[91,-65],[119,-68],[145,-85],[165,-82],[187,-96],[217,-95],[240,-105],[266,-103],[294,-83],[313,-80],[334,-67],[366,-59],[387,-62],[427,-49],[465,-43],[498,-50],[523,-50],[548,-60],[575,-58],[608,-74],[630,-69],[659,-77],[683,-75],[718,-54],[754,-52],[791,-35],[832,-41],[863,-56],[882,-55],[915,-69],[939,-67],[964,-78],[990,-77],[1030,-106],[1052,-103],[1075,-113],[1113,-111],[1140,-89],[1171,-84],[1205,-71],[1231,-73],[1264,-60],[1292,-63],[1320,-47],[1354,-54],[1392,-44],[1421,-49],[1443,-57],[1478,-54],[1500,-54]];
  const middle = [[0,-30],[38,-36],[71,-34],[100,-42],[134,-44],[149,-66],[167,-67],[171,-74],[226,-75],[240,-69],[258,-68],[273,-40],[308,-32],[351,-35],[376,-26],[414,-27],[446,-15],[484,-17],[521,-12],[558,-18],[598,-14],[624,-22],[660,-25],[684,-34],[713,-33],[728,-47],[762,-48],[774,-53],[797,-50],[803,-35],[843,-23],[885,-29],[916,-25],[955,-40],[989,-42],[1002,-54],[1036,-58],[1042,-68],[1098,-70],[1110,-53],[1124,-50],[1134,-33],[1171,-21],[1211,-24],[1244,-18],[1286,-24],[1334,-20],[1370,-29],[1411,-30],[1455,-23],[1482,-29],[1500,-30]];
  const front = [[0,-15],[31,-17],[62,-14],[92,-23],[129,-24],[139,-32],[185,-33],[191,-29],[219,-27],[249,-12],[280,-10],[313,-3],[348,-7],[396,-4],[438,-12],[477,-14],[486,-22],[499,-22],[508,-33],[561,-33],[576,-30],[579,-20],[597,-19],[610,-10],[661,-5],[698,-7],[740,-1],[781,0],[819,-7],[851,-5],[875,-12],[915,-12],[931,-17],[965,-18],[984,-11],[1015,-10],[1055,-2],[1097,-6],[1124,-15],[1153,-15],[1166,-29],[1218,-30],[1228,-26],[1247,-25],[1255,-13],[1290,-6],[1339,-9],[1381,-2],[1420,-8],[1457,-7],[1485,-14],[1500,-15]];
  const relief = [
    { points: back, color: '#b9a48a', shadow: '#a69783', detail: '#cfb497', seed: 176 },
    { points: middle, color: '#b98c70', shadow: '#a87965', detail: '#d4a67e', seed: 211 },
    { points: front, color: '#ae775b', shadow: '#966955', detail: '#d09a70', seed: 247 }
  ];
  const rangeLayers = [];
  for (let i = 0; i < relief.length; i++) {
    const r = relief[i], points = r.points, next = random(r.seed);
    const art = svg('g', {id: 'ridge-' + i}, defs);
    const silhouette = 'M' + points.map(p => p.join(' ')).join('L') + 'V10H0Z';
    svg('path', {d: silhouette, fill: r.color}, art);
    let faces = '', cuts = '', ledges = '';
    for (let j = 1; j < points.length - 1; j++) {
      const [x,y] = points[j], [px,py] = points[j-1], [nx,ny] = points[j+1];
      if (ny - y > 4) {
        const foot = Math.min(1498, nx + 9 + next()*22);
        faces += 'M'+x+' '+y+'L'+nx+' '+ny+' '+foot.toFixed(0)+' 4 '+(x+8).toFixed(0)+' '+(y*.47).toFixed(0)+'Z';
      }
      if (x-px > 13 && Math.abs(y-py) < 8 && y < -12) {
        ledges += 'M'+(px+3)+' '+(py+3)+'l'+(x-px-6)+' '+(y-py);
        const n = Math.floor((x-px)/9);
        for (let k = 0; k < n; k++) {
          const ax = px+4+next()*(x-px-7), ay = Math.max(y,py)+6+next()*3;
          cuts += 'M'+ax.toFixed(0)+' '+ay.toFixed(0)+'l'+(2+next()*3).toFixed(0)+' '+(3+next()*7).toFixed(0);
        }
      }
    }
    svg('path', {d: faces, fill: r.shadow}, art);
    svg('path', {d: cuts, fill: 'none', stroke: r.shadow, 'stroke-width': 1.15}, art);
    svg('path', {d: ledges, fill: 'none', stroke: r.detail, 'stroke-width': 1.35}, art);
    rangeLayers.push(svg('g', {}, $('ranges')));
  }
  const skyRandom = random(401);
  const stars = Array.from({length: 92}, (_, i) => {
    const az = skyRandom()*TAU, alt = .10+skyRandom()*.72, r = .55+skyRandom()*.75;
    const node = svg(i%9===0 ? 'path' : 'circle', i%9===0 ? {d:'M-2.5 0h5M0 -2.5v5', fill:'none', stroke:'#fff0c7', 'stroke-width':.8} : {r:r.toFixed(2)}, $('stars'));
    node.setAttribute('opacity', (.31+skyRandom()*.52).toFixed(2));
    return {az, alt, node};
  });
  const clouds = Array.from({length:32}, () => {
    const az = skyRandom()*TAU, alt = .065+skyRandom()*.48;
    const width = 24+skyRandom()*70;
    const node = svg('path', {d:'M0 0q'+(width*.38).toFixed(1)+' -1.8 '+width.toFixed(1)+' -2m-'+(width*.73).toFixed(1)+' 4  '+(width*.37).toFixed(1)+' -.8', stroke:'#f4e2b7', 'stroke-width':1.1, opacity:(.22+skyRandom()*.34).toFixed(2)}, $('high-clouds'));
    return {az,alt,node};
  });
  const skyMarks=[...stars,...clouds];
  const seeds = svg('path', {fill:'#59695a', opacity:'.8'}, $('high-clouds'));
  const tickNodes = Array.from({length:25}, () => {
    const group = svg('g', {}, $('compass-ticks'));
    const line = svg('path',{stroke:'#94a192','stroke-width':1},group);
    const label = svg('text',{'text-anchor':'middle',y:10.5,'font-size':9,class:'mono dim'},group);
    return {group, line, label};
  });
  const directions = ['N','NE','E','SE','S','SW','W','NW'];
  function drawCompass() {
    const degrees = mod(camera.yaw * 180 / Math.PI, 360);
    const whole = Math.floor(degrees / 5);
    tickNodes.forEach(({group,line,label}, i) => {
      const step = (whole + i - 12)*5, d = mod(step,360);

      for(const p of props) {
        if(!p.model.solid) continue;
        const radius=p.model.solid*p.size,dx=camera.x-p.x,dz=camera.z-p.z;
        if(Math.abs(dx)>radius||Math.abs(dz)>radius) continue;
        const len=Math.hypot(dx,dz);
        if(len<radius && len>.0001) {camera.x=p.x+dx/len*radius;camera.z=p.z+dz/len*radius;}
      }
      camera.gait=mod(camera.gait+Math.abs(meters)*1.38,TAU);
    }
    const wasMoving=camera.stride>.008;
    camera.stride+=(Math.abs(speed)-camera.stride)*Math.min(1,dt*14);
    if(!speed && camera.stride<.008) camera.stride=0;
    return !!(speed||spin||wasMoving);
  }
  function paintReceiver(now) {
    const t=reduced.matches?0:now*.002;
    const amplitude=2+signalStrength*6.6;
    let line='';
    for(let i=0;i<=80;i++) {
      const x=i/80, envelope=.14+.86*Math.pow(Math.sin(Math.PI*x),2);
      const v=Math.sin(i*.73+t)*.54+Math.sin(i*1.85-t*1.4)*.26+Math.sin(i*.29+t)*.20;
      line+=(i?'L':'M')+(13+x*175).toFixed(1)+' '+(37.3-amplitude*envelope*v).toFixed(1);
    }
    set($('wave'),'d',line);
    if(carrier && audio && soundOn) carrier.frequency.setTargetAtTime(106+signalStrength*27,audio.currentTime,.22);
    if(noticeUntil && now>noticeUntil) {$('notification').setAttribute('hidden','');noticeUntil=0;}
    let motes='';
    const flock=skyPoint(.105,.17);
    if(flock) {
      const scale=clamp(view.f/760,.50,1.6);
      for(let i=0;i<7;i++) {
        const phase=i*2.16+t*.65, drift=reduced.matches?0:Math.sin(t*.11+i*.32)*3;
        const x=flock[0]+(i*11+drift)*scale, y=flock[1]+(Math.sin(i*.89)*7-i*2+Math.sin(phase)*.7)*scale;
        const wing=(2+Math.sin(phase)*1.5)*scale;
        motes+='M'+(x-3.9*scale).toFixed(1)+' '+(y-wing).toFixed(1)+'l'+(3.9*scale).toFixed(1)+' '+(wing*.62).toFixed(1)+' '+(3.5*scale).toFixed(1)+' '+(-wing*.91).toFixed(1)+' '+(-3.5*scale).toFixed(1)+' '+(wing+scale).toFixed(1)+'Z';
      }
    }
    set(seeds,'d',motes);
  }
  function paintScene() {
    prepareView();paintSky();paintLand();drawCompass();updateReceiver();dirty=false;
  }
  function tick(now) {
    frame=0;
    if(!focused||notesOpen||document.hidden) return;
    // A high-refresh display needs no more than sixty new full-window plates a second.
    if(previous && now-previous<15.7) {frame=requestAnimationFrame(tick);return;}
    const dt=previous?Math.min((now-previous)/1000,.055):0;previous=now;
    const moved=step(dt);
    if(dirty||moved) {updateChunks();paintScene();}
    if(now-previousHud>=90) {paintReceiver(now);previousHud=now;}
    frame=requestAnimationFrame(tick);
  }
  function pause() {
    focused=false;clearInput();
    if(frame) cancelAnimationFrame(frame);
    frame=0;previous=0;dirty=true;volume();
  }
  function resume() {
    focused=true;
    if(!document.hidden&&!notesOpen&&!frame) {previous=0;frame=requestAnimationFrame(tick);}
    volume();
  }
  function resize() {
    const width=world.clientWidth,height=world.clientHeight;
    if(width<1||height<1) return;
    view.w=width;view.h=height;view.f=Math.min(height*.965,width*.94);
    world.setAttribute('viewBox','0 0 '+width+' '+height);
    const tile=view.f*TAU/3, copies=Math.ceil(width/tile)+2;
    rangeLayers.forEach((layer,i)=>{
      while(layer.children.length<copies) svg('use',{href:'#ridge-'+i,x:1500*layer.children.length},layer);
      while(layer.children.length>copies) layer.lastElementChild.remove();
    });
    set($('reticle'),'transform','translate('+(width/2).toFixed(1)+' '+(height/2).toFixed(1)+')');
    set($('shade'),'y',(height*.62).toFixed(1));set($('shade'),'height',(height*.38+1).toFixed(1));
    updateChunks();paintScene();paintReceiver(performance.now());
  }
  window.addEventListener('blur',pause);
  window.addEventListener('focus',resume);
  document.addEventListener('visibilitychange',()=>{if(document.hidden) pause();else if(document.hasFocus()) resume();});
  window.addEventListener('pagehide',pause);
  window.addEventListener('pageshow',resume);
  window.addEventListener('resize',resize);
  reduced.addEventListener('change',()=>{dirty=true;});
  resize();resume();
})();
</script>
</body>
</html>
