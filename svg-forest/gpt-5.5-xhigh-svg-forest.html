<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Prism Mycelium</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05050b;
      color: #ffffff;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: system-ui, sans-serif;
    }

    #world {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100svh;
      display: block;
      background: #05050b;
      cursor: grab;
      touch-action: none;
    }

    #world.dragging {
      cursor: grabbing;
    }

    .stick {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom));
      width: clamp(104px, 19vmin, 148px);
      aspect-ratio: 1;
      border: 1px solid rgba(178, 255, 244, 0.32);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(195, 255, 244, 0.18) 0 22%, transparent 23%),
        radial-gradient(circle at 50% 50%, rgba(69, 246, 220, 0.12), rgba(18, 25, 45, 0.2) 58%, rgba(4, 9, 18, 0.45));
      box-shadow:
        0 0 22px rgba(49, 255, 218, 0.16),
        inset 0 0 18px rgba(255, 255, 255, 0.08);
      opacity: 0.78;
      pointer-events: auto;
      touch-action: none;
    }

    #leftStick {
      left: max(22px, env(safe-area-inset-left));
    }

    #rightStick {
      right: max(22px, env(safe-area-inset-right));
    }

    .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      aspect-ratio: 1;
      border: 1px solid rgba(255, 248, 181, 0.55);
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.84), rgba(255, 248, 181, 0.38) 26%, rgba(255, 108, 199, 0.22) 62%, rgba(38, 248, 224, 0.2));
      box-shadow:
        0 0 18px rgba(255, 97, 197, 0.28),
        inset 0 0 12px rgba(255, 255, 255, 0.18);
      transform: translate(-50%, -50%);
      pointer-events: none;
      will-change: transform;
    }

    .reticle-dot {
      mix-blend-mode: screen;
    }

    @media (hover: hover) and (pointer: fine) {
      .stick {
        opacity: 0.33;
      }

      .stick:active {
        opacity: 0.72;
      }
    }
  </style>
</head>
<body>
  <svg id="world" role="application" aria-label="First person SVG exploration game">
    <defs>
      <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#070318"></stop>
        <stop offset="33%" stop-color="#122c4a"></stop>
        <stop offset="67%" stop-color="#29113a"></stop>
        <stop offset="100%" stop-color="#06131a"></stop>
      </linearGradient>

      <linearGradient id="groundGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#082927"></stop>
        <stop offset="46%" stop-color="#09151b"></stop>
        <stop offset="100%" stop-color="#150b1d"></stop>
      </linearGradient>

      <linearGradient id="auroraA" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#25f6dc" stop-opacity="0"></stop>
        <stop offset="25%" stop-color="#25f6dc" stop-opacity="0.62"></stop>
        <stop offset="58%" stop-color="#f560c9" stop-opacity="0.58"></stop>
        <stop offset="100%" stop-color="#ffef7a" stop-opacity="0"></stop>
      </linearGradient>

      <linearGradient id="auroraB" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ffef7a" stop-opacity="0"></stop>
        <stop offset="24%" stop-color="#ffef7a" stop-opacity="0.4"></stop>
        <stop offset="62%" stop-color="#67f7ff" stop-opacity="0.5"></stop>
        <stop offset="100%" stop-color="#f560c9" stop-opacity="0"></stop>
      </linearGradient>

      <radialGradient id="horizonGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#6ffff0" stop-opacity="0.36"></stop>
        <stop offset="44%" stop-color="#d86bff" stop-opacity="0.18"></stop>
        <stop offset="100%" stop-color="#05050b" stop-opacity="0"></stop>
      </radialGradient>

      <linearGradient id="towerStem" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#0f4b50"></stop>
        <stop offset="42%" stop-color="#bdfbf4"></stop>
        <stop offset="100%" stop-color="#1d356a"></stop>
      </linearGradient>

      <linearGradient id="towerCap" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fff6a6"></stop>
        <stop offset="42%" stop-color="#ff6ecf"></stop>
        <stop offset="100%" stop-color="#6d5bff"></stop>
      </linearGradient>

      <linearGradient id="crystalShard" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ecfff8" stop-opacity="0.92"></stop>
        <stop offset="48%" stop-color="#52f5ff" stop-opacity="0.62"></stop>
        <stop offset="100%" stop-color="#6a58ff" stop-opacity="0.74"></stop>
      </linearGradient>

      <radialGradient id="creatureBell" cx="40%" cy="28%" r="70%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"></stop>
        <stop offset="34%" stop-color="#ffef7a" stop-opacity="0.72"></stop>
        <stop offset="68%" stop-color="#ff65c6" stop-opacity="0.52"></stop>
        <stop offset="100%" stop-color="#3cebe0" stop-opacity="0.28"></stop>
      </radialGradient>

      <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
        <feMerge>
          <feMergeNode in="blur"></feMergeNode>
          <feMergeNode in="SourceGraphic"></feMergeNode>
        </feMerge>
      </filter>

      <filter id="wideGlow" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
        <feMerge>
          <feMergeNode in="blur"></feMergeNode>
          <feMergeNode in="SourceGraphic"></feMergeNode>
        </feMerge>
      </filter>
    </defs>
    <g id="skyLayer"></g>
    <g id="groundLayer"></g>
    <g id="objectLayer"></g>
    <g id="hudLayer"></g>
  </svg>

  <div id="leftStick" class="stick" aria-label="Move control">
    <div class="knob"></div>
  </div>
  <div id="rightStick" class="stick" aria-label="Turn control">
    <div class="knob"></div>
  </div>

  <script>
    (() => {
      "use strict";

      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("world");
      const skyLayer = document.getElementById("skyLayer");
      const groundLayer = document.getElementById("groundLayer");
      const objectLayer = document.getElementById("objectLayer");
      const hudLayer = document.getElementById("hudLayer");

      const CELL = 520;
      const FAR = 4300;
      const NEAR = 48;
      const CAMERA_HEIGHT = 165;
      const CHUNK_RADIUS = Math.ceil(FAR / CELL) + 1;

      const player = {
        x: 0,
        z: -180,
        yaw: 0,
        bobPhase: 0
      };

      const input = {
        keys: new Set(),
        left: { x: 0, y: 0 },
        right: { x: 0, y: 0 }
      };

      const chunks = new Map();
      const rendered = new Map();
      const skyDots = [];
      const rowPaths = [];
      const veinPaths = [];

      let W = 1;
      let H = 1;
      let focal = 720;
      let horizon = 1;
      let lastTime = performance.now();
      let bobAmount = 0;
      let headBobY = 0;
      let headSwayX = 0;

      function svgEl(name, attrs) {
        const node = document.createElementNS(NS, name);
        if (attrs) setAttrs(node, attrs);
        return node;
      }

      function setAttrs(node, attrs) {
        for (const key in attrs) {
          node.setAttribute(key, attrs[key]);
        }
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * clamp(t, 0, 1);
      }

      function positiveMod(value, divisor) {
        return ((value % divisor) + divisor) % divisor;
      }

      function hash(ix, iz, salt) {
        let h = Math.imul(ix, 374761393) ^ Math.imul(iz, 668265263) ^ Math.imul(salt, 1442695041);
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h = (h ^ (h >>> 16)) >>> 0;
        return h / 4294967296;
      }

      function makeSky() {
        const sky = svgEl("rect", { id: "skyRect", x: 0, y: 0, fill: "url(#skyGradient)" });
        const glow = svgEl("ellipse", { id: "horizonHalo", fill: "url(#horizonGlow)", filter: "url(#wideGlow)" });
        const ribbonA = svgEl("path", {
          id: "ribbonA",
          fill: "none",
          stroke: "url(#auroraA)",
          "stroke-linecap": "round",
          "stroke-width": 42,
          opacity: 0.7
        });
        const ribbonB = svgEl("path", {
          id: "ribbonB",
          fill: "none",
          stroke: "url(#auroraB)",
          "stroke-linecap": "round",
          "stroke-width": 28,
          opacity: 0.58
        });
        const dotGroup = svgEl("g", { id: "skyDots" });

        skyLayer.append(sky, glow, ribbonA, ribbonB, dotGroup);

        for (let i = 0; i < 76; i++) {
          const dot = svgEl("circle", {
            fill: i % 3 === 0 ? "#ffef7a" : i % 3 === 1 ? "#76fff1" : "#fda0ff",
            opacity: 0.26 + hash(i, 3, 9) * 0.58
          });
          skyDots.push({
            node: dot,
            x: hash(i, 7, 2),
            y: 0.06 + hash(i, 9, 4) * 0.62,
            r: 0.7 + hash(i, 11, 6) * 2.2,
            drift: 0.35 + hash(i, 13, 8) * 1.6
          });
          dotGroup.appendChild(dot);
        }
      }

      function makeGround() {
        const ground = svgEl("path", { id: "groundShape", fill: "url(#groundGradient)" });
        const nearGlow = svgEl("path", { id: "nearGlow", fill: "#25f6dc", opacity: 0.06 });
        const rows = svgEl("g", { id: "groundRows", opacity: 0.62 });
        const veins = svgEl("g", { id: "groundVeins", opacity: 0.72 });

        groundLayer.append(ground, nearGlow, rows, veins);

        for (let i = 0; i < 19; i++) {
          const p = svgEl("path", {
            fill: "none",
            stroke: i % 2 ? "rgba(255, 239, 122, 0.16)" : "rgba(51, 255, 226, 0.2)",
            "stroke-width": 1.15,
            "stroke-linecap": "round"
          });
          rowPaths.push(p);
          rows.appendChild(p);
        }

        for (let i = 0; i < 23; i++) {
          const p = svgEl("path", {
            fill: "none",
            stroke: i % 3 === 0 ? "rgba(255, 94, 203, 0.18)" : "rgba(100, 252, 243, 0.16)",
            "stroke-width": 1.4,
            "stroke-linecap": "round"
          });
          veinPaths.push(p);
          veins.appendChild(p);
        }
      }

      function makeHud() {
        const reticle = svgEl("g", { id: "reticle", class: "reticle-dot", opacity: 0.72 });
        reticle.append(
          svgEl("circle", { id: "reticleOuter", fill: "none", stroke: "#d9fff8", "stroke-width": 1.1, opacity: 0.72 }),
          svgEl("circle", { id: "reticleInner", fill: "#ffef7a", opacity: 0.86 })
        );
        hudLayer.appendChild(reticle);
      }

      function resize() {
        W = Math.max(320, window.innerWidth || document.documentElement.clientWidth || 320);
        H = Math.max(420, window.innerHeight || document.documentElement.clientHeight || 420);
        focal = Math.max(520, Math.min(W, H) * 0.96);
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      }

      function projectCamera(side, depth, elevation) {
        if (depth < NEAR || depth > FAR) return null;
        const scale = focal / depth;
        return {
          x: W * 0.5 + (side + headSwayX) * scale,
          y: horizon + headBobY + (CAMERA_HEIGHT - elevation) * scale,
          scale
        };
      }

      function projectWorld(x, z, elevation) {
        const dx = x - player.x;
        const dz = z - player.z;
        const sin = Math.sin(player.yaw);
        const cos = Math.cos(player.yaw);
        const depth = dx * sin + dz * cos;
        if (depth < NEAR || depth > FAR) return null;
        const side = dx * cos - dz * sin;
        const projected = projectCamera(side, depth, elevation || 0);
        if (!projected) return null;
        projected.depth = depth;
        projected.side = side;
        return projected;
      }

      function updateSky(now) {
        horizon = H * 0.455 + headBobY * 0.42;

        const skyRect = document.getElementById("skyRect");
        const groundShape = document.getElementById("groundShape");
        const nearGlow = document.getElementById("nearGlow");
        const halo = document.getElementById("horizonHalo");
        const ribbonA = document.getElementById("ribbonA");
        const ribbonB = document.getElementById("ribbonB");

        setAttrs(skyRect, { width: W, height: horizon + H * 0.12 });
        setAttrs(groundShape, {
          d: `M 0 ${horizon - 6}
              C ${W * 0.26} ${horizon + 24}, ${W * 0.68} ${horizon - 28}, ${W} ${horizon + 8}
              L ${W} ${H} L 0 ${H} Z`
        });
        setAttrs(nearGlow, {
          d: `M 0 ${H * 0.78}
              C ${W * 0.28} ${H * 0.7}, ${W * 0.74} ${H * 0.73}, ${W} ${H * 0.79}
              L ${W} ${H} L 0 ${H} Z`
        });
        setAttrs(halo, {
          cx: W * 0.52,
          cy: horizon + 8,
          rx: W * 0.58,
          ry: H * 0.15
        });

        const t = now * 0.00024;
        const yawShift = Math.sin(player.yaw * 0.7) * W * 0.08;
        setAttrs(ribbonA, {
          d: `M ${-W * 0.18 + yawShift} ${H * (0.16 + Math.sin(t) * 0.018)}
              C ${W * 0.18} ${H * (0.05 + Math.sin(t + 1.2) * 0.02)},
                ${W * 0.54} ${H * (0.32 + Math.sin(t + 2.1) * 0.02)},
                ${W * 1.18 + yawShift} ${H * (0.19 + Math.cos(t) * 0.018)}`
        });
        setAttrs(ribbonB, {
          d: `M ${-W * 0.12 - yawShift * 0.35} ${H * (0.31 + Math.cos(t + 1.5) * 0.012)}
              C ${W * 0.2} ${H * (0.23 + Math.sin(t + 0.4) * 0.018)},
                ${W * 0.63} ${H * (0.1 + Math.cos(t + 2.5) * 0.02)},
                ${W * 1.14 - yawShift * 0.35} ${H * (0.27 + Math.sin(t + 3.3) * 0.016)}`
        });

        for (let i = 0; i < skyDots.length; i++) {
          const dot = skyDots[i];
          const drift = player.yaw * 34 * dot.drift + now * 0.004 * dot.drift;
          const x = positiveMod(dot.x * W + drift, W + 60) - 30;
          const y = dot.y * Math.max(100, horizon - 22);
          setAttrs(dot.node, {
            cx: x.toFixed(1),
            cy: y.toFixed(1),
            r: dot.r.toFixed(2)
          });
        }
      }

      function updateGround() {
        const forwardPos = player.x * Math.sin(player.yaw) + player.z * Math.cos(player.yaw);
        const lateralPos = player.x * Math.cos(player.yaw) - player.z * Math.sin(player.yaw);
        const rowStep = 245;
        const lateralStep = 260;
        const rowOffset = positiveMod(forwardPos, rowStep);
        const latOffset = positiveMod(lateralPos, lateralStep);

        for (let i = 0; i < rowPaths.length; i++) {
          const depth = 160 + i * rowStep - rowOffset;
          const safeDepth = depth < 92 ? depth + rowPaths.length * rowStep : depth;
          const span = safeDepth * (W / focal) * 0.72;
          const a = projectCamera(-span, safeDepth, 0);
          const b = projectCamera(0, safeDepth, 0);
          const c = projectCamera(span, safeDepth, 0);
          if (!a || !b || !c) {
            rowPaths[i].setAttribute("d", "");
            continue;
          }
          const ripple = Math.sin(i * 0.9 + player.x * 0.004) * 9;
          rowPaths[i].setAttribute("d", `M ${a.x.toFixed(1)} ${a.y.toFixed(1)} Q ${b.x.toFixed(1)} ${(b.y + ripple).toFixed(1)} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`);
          rowPaths[i].setAttribute("opacity", clamp(1 - safeDepth / FAR, 0.08, 0.72).toFixed(2));
        }

        const half = Math.floor(veinPaths.length / 2);
        for (let i = 0; i < veinPaths.length; i++) {
          const lane = (i - half) * lateralStep - latOffset;
          let d = "";
          for (let k = 0; k < 14; k++) {
            const depth = 100 + k * 310;
            const bend = Math.sin(depth * 0.006 + i * 1.4 + player.z * 0.002) * 24;
            const p = projectCamera(lane + bend, depth, 0);
            if (!p) continue;
            d += `${d ? " L" : "M"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
          }
          veinPaths[i].setAttribute("d", d);
          veinPaths[i].setAttribute("opacity", i === half ? 0.12 : 0.55);
        }
      }

      function ensureChunk(cx, cz) {
        const key = `${cx},${cz}`;
        if (chunks.has(key)) return;

        const count = 3 + Math.floor(hash(cx, cz, 4) * 3);
        const objects = [];
        for (let i = 0; i < count; i++) {
          const x = (cx + hash(cx, cz, 20 + i * 9)) * CELL;
          const z = (cz + hash(cx, cz, 40 + i * 11)) * CELL;
          const roll = hash(cx, cz, 70 + i);
          const type = roll < 0.31 ? "tower" : roll < 0.56 ? "arch" : roll < 0.82 ? "sedge" : "drifter";
          const sizeBase = type === "tower" ? 0.78 : type === "arch" ? 0.86 : type === "sedge" ? 0.62 : 0.58;
          const sizeRange = type === "sedge" ? 0.92 : type === "drifter" ? 0.56 : 0.74;
          const nearOrigin = Math.hypot(x, z + 180) < 240;
          objects.push({
            id: `${key}:${i}`,
            type,
            x: nearOrigin ? x + 320 : x,
            z: nearOrigin ? z + 260 : z,
            size: sizeBase + hash(cx, cz, 100 + i) * sizeRange,
            seed: hash(cx, cz, 130 + i) * 1000,
            hue: 138 + hash(cx, cz, 160 + i) * 176
          });
        }
        chunks.set(key, objects);
      }

      function updateChunks() {
        const cx = Math.floor(player.x / CELL);
        const cz = Math.floor(player.z / CELL);
        for (let ix = cx - CHUNK_RADIUS; ix <= cx + CHUNK_RADIUS; ix++) {
          for (let iz = cz - CHUNK_RADIUS; iz <= cz + CHUNK_RADIUS; iz++) {
            ensureChunk(ix, iz);
          }
        }

        const keep = CHUNK_RADIUS + 2;
        for (const [key, objects] of chunks) {
          const split = key.split(",");
          const ox = Number(split[0]);
          const oz = Number(split[1]);
          if (Math.abs(ox - cx) > keep || Math.abs(oz - cz) > keep) {
            for (const obj of objects) {
              const node = rendered.get(obj.id);
              if (node) {
                node.remove();
                rendered.delete(obj.id);
              }
            }
            chunks.delete(key);
          }
        }
      }

      function createObjectNode(obj) {
        if (obj.type === "tower") return makeTower(obj);
        if (obj.type === "arch") return makeArch(obj);
        if (obj.type === "sedge") return makeSedge(obj);
        return makeDrifter(obj);
      }

      function getObjectNode(obj) {
        let node = rendered.get(obj.id);
        if (!node) {
          node = createObjectNode(obj);
          rendered.set(obj.id, node);
        }
        return node;
      }

      function makeTower(obj) {
        const g = svgEl("g", { "data-type": "tower", filter: "url(#softGlow)" });
        const accent = `hsl(${obj.hue.toFixed(0)} 92% 67%)`;
        const dim = `hsl(${(obj.hue + 42).toFixed(0)} 70% 35%)`;

        g.append(
          svgEl("ellipse", { cx: 0, cy: 4, rx: 42, ry: 11, fill: "#03070c", opacity: 0.34 }),
          svgEl("path", {
            d: "M -17 0 C -24 -58 -18 -124 -8 -188 C -4 -213 12 -214 17 -188 C 28 -119 24 -54 15 0 Z",
            fill: "url(#towerStem)",
            stroke: "#bdfbf4",
            "stroke-width": 1.2,
            opacity: 0.92
          }),
          svgEl("path", {
            d: "M -77 -176 C -50 -231 46 -236 78 -178 C 50 -148 -45 -146 -77 -176 Z",
            fill: "url(#towerCap)",
            stroke: accent,
            "stroke-width": 2
          }),
          svgEl("ellipse", { cx: 0, cy: -176, rx: 61, ry: 13, fill: "#fff9c7", opacity: 0.28 }),
          svgEl("path", {
            d: "M -49 -179 C -23 -191 23 -192 51 -178 M -25 -202 C -8 -194 8 -194 25 -203 M -9 -30 C -2 -80 4 -126 8 -178",
            fill: "none",
            stroke: "#ffffff",
            "stroke-width": 1.4,
            opacity: 0.42,
            "stroke-linecap": "round"
          }),
          svgEl("circle", { cx: -38, cy: -177, r: 5.2, fill: "#ffef7a", opacity: 0.92 }),
          svgEl("circle", { cx: 4, cy: -196, r: 4.4, fill: "#67f7ff", opacity: 0.84 }),
          svgEl("circle", { cx: 35, cy: -174, r: 5.8, fill: dim, opacity: 0.78 })
        );
        return g;
      }

      function makeArch(obj) {
        const g = svgEl("g", { "data-type": "arch", filter: "url(#softGlow)" });
        const stroke = `hsl(${obj.hue.toFixed(0)} 95% 72%)`;
        const core = `hsl(${(obj.hue + 76).toFixed(0)} 95% 68%)`;

        g.append(
          svgEl("ellipse", { cx: 0, cy: 3, rx: 86, ry: 13, fill: "#03070c", opacity: 0.36 }),
          svgEl("path", {
            d: "M -86 0 L -55 0 L -48 -116 C -41 -185 43 -185 50 -116 L 56 0 L 87 0 L 76 -132 C 66 -224 -66 -224 -76 -132 Z",
            fill: "url(#crystalShard)",
            stroke,
            "stroke-width": 2
          }),
          svgEl("path", {
            d: "M -32 0 L -24 -106 C -19 -146 20 -146 25 -106 L 33 0 Z",
            fill: "#031119",
            opacity: 0.78
          }),
          svgEl("path", {
            d: "M -66 -15 L -47 -118 L -25 -169 M 66 -15 L 49 -118 L 27 -169 M -48 -116 C -28 -139 28 -139 50 -116",
            fill: "none",
            stroke: "#ffffff",
            "stroke-width": 1.35,
            opacity: 0.48,
            "stroke-linecap": "round"
          }),
          svgEl("circle", { cx: 0, cy: -128, r: 8, fill: core, opacity: 0.72 })
        );
        return g;
      }

      function makeSedge(obj) {
        const g = svgEl("g", { "data-type": "sedge", filter: "url(#softGlow)" });
        const baseHue = obj.hue;
        g.appendChild(svgEl("ellipse", { cx: 0, cy: 3, rx: 58, ry: 9, fill: "#03070c", opacity: 0.28 }));

        for (let i = 0; i < 8; i++) {
          const t = i - 3.5;
          const height = 72 + Math.sin(obj.seed + i * 1.7) * 23 + hash(i, Math.floor(obj.seed), 7) * 22;
          const root = t * 10;
          const bend = Math.sin(obj.seed * 0.01 + i) * 35;
          const tipX = root + bend;
          const tipY = -height;
          const hue = baseHue + i * 13;
          const width = 3 + hash(i, Math.floor(obj.seed), 3) * 3.2;
          g.append(
            svgEl("path", {
              d: `M ${root.toFixed(1)} 0 C ${(root - bend * 0.28).toFixed(1)} ${(-height * 0.36).toFixed(1)}, ${(root + bend * 0.54).toFixed(1)} ${(-height * 0.72).toFixed(1)}, ${tipX.toFixed(1)} ${tipY.toFixed(1)}`,
              fill: "none",
              stroke: `hsl(${hue.toFixed(0)} 78% 58%)`,
              "stroke-width": width.toFixed(1),
              "stroke-linecap": "round",
              opacity: 0.82
            }),
            svgEl("ellipse", {
              cx: tipX.toFixed(1),
              cy: tipY.toFixed(1),
              rx: (8 + hash(i, 2, 5) * 6).toFixed(1),
              ry: (14 + hash(i, 4, 5) * 10).toFixed(1),
              fill: i % 2 ? "#ffef7a" : "#53fff1",
              opacity: 0.58,
              transform: `rotate(${(bend * 0.45).toFixed(1)} ${tipX.toFixed(1)} ${tipY.toFixed(1)})`
            })
          );
        }
        return g;
      }

      function makeDrifter(obj) {
        const g = svgEl("g", { "data-type": "drifter", filter: "url(#wideGlow)" });
        const hue = obj.hue.toFixed(0);
        g.append(
          svgEl("path", {
            d: "M -45 -12 C -37 -55 37 -55 45 -12 C 29 12 -29 12 -45 -12 Z",
            fill: "url(#creatureBell)",
            stroke: `hsl(${hue} 96% 74%)`,
            "stroke-width": 1.8,
            opacity: 0.9
          }),
          svgEl("ellipse", { cx: 0, cy: -12, rx: 33, ry: 10, fill: "#ffffff", opacity: 0.18 }),
          svgEl("circle", { cx: -14, cy: -16, r: 4, fill: "#06131a", opacity: 0.72 }),
          svgEl("circle", { cx: 15, cy: -16, r: 4, fill: "#06131a", opacity: 0.72 }),
          svgEl("path", {
            d: "M -28 4 C -34 25 -18 36 -25 58 M -8 7 C -14 31 4 42 -5 68 M 12 7 C 5 31 25 44 15 67 M 31 2 C 26 25 39 35 31 55",
            fill: "none",
            stroke: "#ffef7a",
            "stroke-width": 3.5,
            "stroke-linecap": "round",
            opacity: 0.64
          }),
          svgEl("path", {
            d: "M -37 -5 C -59 0 -59 19 -40 22 M 37 -5 C 59 1 59 19 40 22",
            fill: "none",
            stroke: "#67f7ff",
            "stroke-width": 3,
            "stroke-linecap": "round",
            opacity: 0.58
          })
        );
        return g;
      }

      function renderObjects(now) {
        updateChunks();

        const visible = [];
        for (const objects of chunks.values()) {
          for (const obj of objects) {
            const floatHeight = obj.type === "drifter" ? 128 + Math.sin(now * 0.0018 + obj.seed) * 26 : 0;
            const p = projectWorld(obj.x, obj.z, floatHeight);
            if (!p) continue;

            const objectScale = p.scale * obj.size;
            const margin = 150 * objectScale + 120;
            if (p.x < -margin || p.x > W + margin || p.y < -H * 0.6 || p.y > H + margin) continue;

            visible.push({
              obj,
              x: p.x,
              y: p.y,
              depth: p.depth,
              scale: objectScale
            });
          }
        }

        visible.sort((a, b) => b.depth - a.depth);
        const seen = new Set();

        for (const item of visible) {
          const obj = item.obj;
          const node = getObjectNode(obj);
          const drift = obj.type === "drifter" ? Math.sin(now * 0.003 + obj.seed) * 10 * item.scale : 0;
          const fadeNear = clamp((item.depth - NEAR) / 140, 0, 1);
          const fadeFar = clamp((FAR - item.depth) / 900, 0, 1);
          const opacity = clamp(Math.min(fadeNear, fadeFar), 0.06, 1);

          node.setAttribute("transform", `translate(${(item.x + drift).toFixed(2)} ${item.y.toFixed(2)}) scale(${item.scale.toFixed(4)})`);
          node.setAttribute("opacity", opacity.toFixed(3));
          objectLayer.appendChild(node);
          seen.add(obj.id);
        }

        for (const [id, node] of rendered) {
          if (!seen.has(id)) {
            node.remove();
            rendered.delete(id);
          }
        }
      }

      function updateHud() {
        const outer = document.getElementById("reticleOuter");
        const inner = document.getElementById("reticleInner");
        setAttrs(outer, { cx: W * 0.5, cy: H * 0.5, r: Math.max(5, Math.min(W, H) * 0.008) });
        setAttrs(inner, { cx: W * 0.5, cy: H * 0.5, r: Math.max(1.8, Math.min(W, H) * 0.0026) });
      }

      function updatePlayer(dt) {
        const keyForward =
          (input.keys.has("w") || input.keys.has("arrowup") ? 1 : 0) -
          (input.keys.has("s") || input.keys.has("arrowdown") ? 1 : 0);
        const keyTurn =
          (input.keys.has("d") || input.keys.has("arrowright") ? 1 : 0) -
          (input.keys.has("a") || input.keys.has("arrowleft") ? 1 : 0);

        const move = clamp(keyForward + input.left.y, -1, 1);
        const turn = clamp(keyTurn + input.right.x, -1, 1);
        const moving = Math.abs(move) > 0.03 || Math.abs(turn) > 0.04;

        player.yaw += turn * 2.35 * dt;

        const pace = 235 * (input.keys.has("shift") ? 1.45 : 1);
        player.x += Math.sin(player.yaw) * move * pace * dt;
        player.z += Math.cos(player.yaw) * move * pace * dt;

        const targetBob = moving ? clamp(Math.abs(move) + Math.abs(turn) * 0.34, 0, 1) : 0;
        bobAmount = lerp(bobAmount, targetBob, dt * 7.5);
        if (bobAmount > 0.004) {
          player.bobPhase += dt * (7.2 + Math.abs(move) * 4.5);
        }
        headBobY = Math.sin(player.bobPhase * 2) * 4.6 * bobAmount;
        headSwayX = Math.sin(player.bobPhase) * 5.2 * bobAmount;
      }

      function frame(now) {
        const dt = Math.min(0.045, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;

        updatePlayer(dt);
        updateSky(now);
        updateGround();
        renderObjects(now);
        updateHud();

        requestAnimationFrame(frame);
      }

      function bindKeyboard() {
        const controlKeys = new Set(["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", "shift"]);
        window.addEventListener("keydown", (event) => {
          const key = event.key.toLowerCase();
          if (controlKeys.has(key)) {
            input.keys.add(key);
            event.preventDefault();
          }
        }, { passive: false });

        window.addEventListener("keyup", (event) => {
          input.keys.delete(event.key.toLowerCase());
        });
      }

      function bindMouseLook() {
        const drag = {
          active: false,
          id: null,
          x: 0
        };

        svg.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "touch") return;
          drag.active = true;
          drag.id = event.pointerId;
          drag.x = event.clientX;
          svg.setPointerCapture(event.pointerId);
          svg.classList.add("dragging");
          event.preventDefault();
        });

        svg.addEventListener("pointermove", (event) => {
          if (!drag.active || event.pointerId !== drag.id) return;
          const dx = event.clientX - drag.x;
          drag.x = event.clientX;
          player.yaw += dx * 0.0045;
          event.preventDefault();
        });

        const endDrag = (event) => {
          if (!drag.active || event.pointerId !== drag.id) return;
          drag.active = false;
          drag.id = null;
          svg.classList.remove("dragging");
          try {
            svg.releasePointerCapture(event.pointerId);
          } catch (error) {
            return;
          }
        };

        svg.addEventListener("pointerup", endDrag);
        svg.addEventListener("pointercancel", endDrag);
        svg.addEventListener("lostpointercapture", () => {
          drag.active = false;
          drag.id = null;
          svg.classList.remove("dragging");
        });
      }

      function bindStick(shellId, state, mode) {
        const shell = document.getElementById(shellId);
        const knob = shell.querySelector(".knob");
        const active = { id: null };

        function reset() {
          active.id = null;
          state.x = 0;
          state.y = 0;
          knob.style.transform = "translate(-50%, -50%)";
        }

        function update(event) {
          const rect = shell.getBoundingClientRect();
          const radius = rect.width * 0.5;
          const dx = event.clientX - (rect.left + radius);
          const dy = event.clientY - (rect.top + radius);
          const distance = Math.hypot(dx, dy);
          const limit = radius * 0.54;
          const scale = distance > limit ? limit / distance : 1;
          const knobX = dx * scale;
          const knobY = dy * scale;
          const nx = clamp(knobX / limit, -1, 1);
          const ny = clamp(knobY / limit, -1, 1);

          if (mode === "move") {
            state.x = 0;
            state.y = clamp(-ny, -1, 1);
          } else {
            state.x = clamp(nx, -1, 1);
            state.y = 0;
          }
          knob.style.transform = `translate(calc(-50% + ${knobX.toFixed(1)}px), calc(-50% + ${knobY.toFixed(1)}px))`;
        }

        shell.addEventListener("pointerdown", (event) => {
          if (active.id !== null) return;
          active.id = event.pointerId;
          shell.setPointerCapture(event.pointerId);
          update(event);
          event.preventDefault();
          event.stopPropagation();
        }, { passive: false });

        shell.addEventListener("pointermove", (event) => {
          if (event.pointerId !== active.id) return;
          update(event);
          event.preventDefault();
          event.stopPropagation();
        }, { passive: false });

        const end = (event) => {
          if (event.pointerId !== active.id) return;
          try {
            shell.releasePointerCapture(event.pointerId);
          } catch (error) {
            reset();
            return;
          }
          reset();
          event.preventDefault();
          event.stopPropagation();
        };

        shell.addEventListener("pointerup", end, { passive: false });
        shell.addEventListener("pointercancel", end, { passive: false });
        shell.addEventListener("lostpointercapture", reset);
      }

      function blockMobileDefaults() {
        const prevent = (event) => event.preventDefault();
        document.addEventListener("touchstart", prevent, { passive: false });
        document.addEventListener("touchmove", prevent, { passive: false });
        document.addEventListener("gesturestart", prevent, { passive: false });
        document.addEventListener("gesturechange", prevent, { passive: false });
        document.addEventListener("gestureend", prevent, { passive: false });
        window.addEventListener("contextmenu", prevent);
        window.addEventListener("wheel", (event) => {
          if (event.ctrlKey) event.preventDefault();
        }, { passive: false });
      }

      function boot() {
        makeSky();
        makeGround();
        makeHud();
        resize();
        bindKeyboard();
        bindMouseLook();
        bindStick("leftStick", input.left, "move");
        bindStick("rightStick", input.right, "turn");
        blockMobileDefaults();
        window.addEventListener("resize", resize);
        window.addEventListener("orientationchange", resize);
        requestAnimationFrame((now) => {
          lastTime = now;
          requestAnimationFrame(frame);
        });
      }

      boot();
    })();
  </script>
</body>
</html>
