<!DOCTYPE html>
<html lang="en">

<meta name="description" content="The Upturned Sea: a first-person walk across the dry floor of the world, beneath a sea that hangs overhead. Rendered entirely in SVG.">
<title>The Upturned Sea</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #1d6573;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body { position: fixed; inset: 0; }
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  #stage > svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #view { cursor: grab; }
  #view.drag { cursor: grabbing; }
  #veil, #hud, #overlay { pointer-events: none; }
  #veil { will-change: transform; }
  #overlay .hit { pointer-events: all; }

  svg text { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif; }
  svg text.hand { font-family: "Snell Roundhand", "Segoe Script", "Bradley Hand", "Apple Chancery", "URW Chancery L", cursive; }
  svg text.ui { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  .stick { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 164px; height: 164px;
           display: none; touch-action: none; z-index: 5; }
  .stick.l { left: calc(8px + env(safe-area-inset-left, 0px)); }
  .stick.r { right: calc(8px + env(safe-area-inset-right, 0px)); }
  body.touch .stick { display: block; }
  body.intro .stick, body.reading .stick { visibility: hidden; }
  .stick .ring { position: absolute; left: 18px; top: 18px; width: 128px; height: 128px; border-radius: 50%;
                 border: 2px solid rgba(234, 248, 243, .5);
                 background: radial-gradient(circle at 50% 50%, rgba(12, 58, 68, .12), rgba(12, 58, 68, .34) 72%);
                 box-shadow: inset 0 0 16px rgba(234, 248, 243, .16); transition: border-color .15s; }
  .stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
                 background: radial-gradient(circle at 38% 32%, rgba(255, 255, 255, .96), rgba(214, 238, 232, .86) 55%, rgba(140, 196, 192, .82));

                font: 600 10px/1 system-ui, -apple-system, sans-serif; letter-spacing: .22em;
                color: rgba(234, 248, 243, .82); text-shadow: 0 1px 2px rgba(8, 40, 48, .7); }

<body class="intro">
<div id="stage">
  <svg id="view" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" role="img" aria-label="The Upturned Sea: first-person view">
    <defs id="defs"></defs>
    <g id="scene"></g>
  </svg>
  <svg id="veil" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"></svg>
  <svg id="hud" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"></svg>
  <div class="stick l" id="stickL"><div class="ring"></div><div class="knob"></div><div class="lab">WALK</div></div>
  <div class="stick r" id="stickR"><div class="ring"></div><div class="knob"></div><div class="lab">TURN</div></div>
  <svg id="overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
</div>
<script>
'use strict';
/* =====================================================================
   THE UPTURNED SEA
   Three hundred years ago the sea went up. It hangs twenty fathoms over
   the old seabed, surface facing down, and its ships sail it upside down.
   You walk the Floor beneath it.

   Everything visible is SVG: gradients, paths and pooled <use> sprites.
   Engine notes
   - Camera: yaw + true pitch pinhole projection (not y-shearing), so you
     can stand under a ship and look up at it.
   - Floor and ceiling (the sea's underside) are planes. Their line work is
     projected per frame into a handful of <path>s; distance fog for those
     comes from screen-space gradients recomputed when pitch changes.
   - Props are <use> sprites of procedurally drawn symbols. Fog, LOD and
     outline width reach the symbol through inherited CSS custom
     properties, so there is one copy of each symbol, not one per fog step.
   - The world is chunked; chunks load ahead and unload behind, returning
     their sprite elements to a pool. Painter's order is kept with a
     minimal-move DOM reconcile each frame.
   ===================================================================== */

const QS = new URLSearchParams(location.search);
const NS = 'http://www.w3.org/2000/svg';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const r1 = v => Math.round(v * 10) / 10;
const r3 = v => Math.round(v * 1000) / 1000;
const wrapAngle = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };

const CFG = {
  EYE: 1.7,            // eye height (m)
  CEIL: 36,            // underside of the sea (m), "twenty fathoms"
  NEAR: 0.3,
  CHUNK: 32,
  REGION: 300,
  WALK: 5.5, RUN: 10.5, STICK_SPEED: 8,
  TURN: 1.9, STICK_TURN: 2.5,
  PITCH_MIN: -0.55, PITCH_MAX: 1.0,
  FAR: 140,            // sprite fog-out distance, scaled by quality
  CEIL_FAR: 360,
  RADIUS: 0.42,        // walker collision radius
  FATHOM: 1.8288,
};

const HAZE = '#b3ddd3';
const PAL = {
  ink: '#153a44', shadow: '#1b4a52', white: '#ffffff',
  coral: '#f2845c', coralHi: '#ffb996', coralTip: '#ffe4cc',
  coralP: '#e7738f', coralPHi: '#ffadc0', coralPTip: '#ffe0e8',
  fan: '#b04a7f', fanDark: '#7a2c59', fanHi: '#e583b1',
  fanO: '#dc6340', fanODark: '#94361f', fanOHi: '#f7a07a',
  brain: '#d8b650', brainShade: '#aa8732', brainGroove: '#86661f',
  brainG: '#9fb35a', brainGShade: '#768a3a', brainGGroove: '#56692a',
  sponge: '#f2b53b', spongeShade: '#c98627', spongeIn: '#6e3f17',
  spongeV: '#a86bc2', spongeVShade: '#7b4796', spongeVIn: '#3d1d4f',
  anem: '#f59bb1', anemTip: '#fff0f3', anemBody: '#d4627d',
  kelp: '#a9a53e', kelpShade: '#7c7b27', kelpStipe: '#6c6722', kelpFloat: '#cdb755', kelpDark: '#4f4d16',
  rock: '#8f9d95', rockShade: '#67766f', rockLine: '#51605a', barn: '#e7e1d0', lichen: '#c9b25a',
  bone: '#f1e9d3', boneShade: '#cabd9b', boneDark: '#5e533f',
  wood: '#7b5b3e', woodShade: '#533b27', woodDark: '#2c1f15', woodHi: '#a57e55',
  hull: '#5b3c28', hullHi: '#86613f', hullStripe: '#caa056', hullSub: '#2b6b74',
  sail: '#f3ebd6', sailShade: '#cbbd9c', mast: '#6a4a2f', rope: '#3b2b1d', flag: '#c63f30', lamp: '#ffd76a',
  iron: '#3f4f55', ironShade: '#28353b', rust: '#9b5631',
  jelly: '#f9dbe6', jellyRim: '#d57d9c', jellyInner: '#e5739a', jellyArm: '#f5b7cc', jellyTent: '#f3bfd1',
  jellyB: '#dcecf7', jellyBRim: '#7fa6c9', jellyBInner: '#8fb3dc', jellyBArm: '#bcd6ee', jellyBTent: '#c7ddf0',
  glass: '#5fb493', glassHi: '#eafff6', cork: '#a3714a', paper: '#f5edd8',
  glint: '#fff5c4',
  pillar: '#7c8c88', pillarShade: '#5c6c6a', pillarLine: '#4c5b59', foam: '#ecf8f4', pillarSub: '#3d7d86',
};

/* ---------- colour ---------- */
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbHex(r, g, b) {
  return '#' + ((1 << 24) | (clamp(Math.round(r), 0, 255) << 16) | (clamp(Math.round(g), 0, 255) << 8) | clamp(Math.round(b), 0, 255)).toString(16).slice(1);
}
function mix(a, b, t) {
  const A = hexRGB(a), B = hexRGB(b);
  return rgbHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
}
// Fog: clear up close, thickening toward the haze. Everything fades to HAZE.
function fogAt(d, far) {
  const t = (d - 10) / (far - 10);
  return t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(t, 1.25);
}
const FOG_STEPS = 40;
const FOGTAB = {};
for (const k in PAL) {
  FOGTAB[k] = [];
  for (let i = 0; i <= FOG_STEPS; i++) FOGTAB[k].push(mix(PAL[k], HAZE, i / FOG_STEPS));
}

/* ---------- hashing & noise ---------- */
function hash2(x, z, s) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(z | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function hashInt(x, z, s) { return (hash2(x, z, s) * 4294967296) >>> 0; }
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function vnoise(x, z, s) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi, s), b = hash2(xi + 1, zi, s), c = hash2(xi, zi + 1, s), d = hash2(xi + 1, zi + 1, s);
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}

/* ---------- DOM ---------- */
function mk(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const $ = id => document.getElementById(id);

/* ---------- state ---------- */
const SEED = (QS.has('seed') ? parseInt(QS.get('seed'), 10) : (Math.random() * 1e9) | 0) >>> 0;
const S = {
  x: 0, z: 0, yaw: 0, pitch: 0.07,
  vFwd: 0, vYaw: 0, t: 0, frame: 0,
  bobPhase: 0, bobAmp: 0,
  walked: 0, letters: 0, taken: new Set(), letterIdx: 0,
  started: false, reading: false, region: null, seen: new Set(),
  Q: clamp(parseFloat(QS.get('q')) || 1, 0.5, 1), qLocked: QS.has('q'),
  footAcc: 0, footSide: 1,
};
const IN = { keys: new Set(), sl: { x: 0, y: 0, id: null }, sr: { x: 0, y: 0, id: null }, look: null };

/* =====================================================================
   PROCEDURAL SYMBOLS
   Every prop is drawn by a small generator in local units of 10 per metre,
   base at (0,0), up is -y (hanging things grow toward +y). A generator
   returns layers {d, f, s, w, ns, fo, so, lod}; f/s name palette keys that
   become CSS custom properties, so one <g> serves every fog level.
   lod 0 = close-up detail only, lod 1 = close + mid, undefined = always.
   ===================================================================== */

const P2 = (x, y) => r1(x) + ' ' + r1(y);
function polyD(pts, close = true) {
  let d = 'M' + P2(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) d += 'L' + P2(pts[i][0], pts[i][1]);
  return close ? d + 'Z' : d;
}
// Catmull-Rom through points, emitted as cubic Beziers.
function crD(pts, closed) {
  const n = pts.length;
  if (n < 3) return polyD(pts, closed);
  const g = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  let d = 'M' + P2(pts[0][0], pts[0][1]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    d += 'C' + P2(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6) + ' ' +
         P2(p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6) + ' ' + P2(p2[0], p2[1]);
  }
  return closed ? d + 'Z' : d;
}
// Dense polyline of the same spline (used to cut shading regions that match the outline).
function crSample(pts, closed, per = 6) {
  const n = pts.length, out = [];
  const g = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    for (let k = 0; k < per; k++) {
      const t = k / per, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
    }
  }
  if (!closed) out.push(pts[n - 1]);
  return out;
}
function clipHalf(poly, a, b, c) { // keep a*x + b*y + c >= 0
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length];
    const fp = a * p[0] + b * p[1] + c, fq = a * q[0] + b * q[1] + c;
    if (fp >= 0) out.push(p);
    if ((fp >= 0) !== (fq >= 0)) { const t = fp / (fp - fq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); }
  }
  return out;
}
// Shadow side of a shape: everything right of a slanted cut through (x0, 0) and (x1, yTop).
function shadeRight(poly, x0, x1, yTop) {
  const out = clipHalf(poly, 1, -(x1 - x0) / yTop, -x0);
  return out.length > 2 ? polyD(out) : '';
}
function circD(x, y, r) { return `M${r1(x - r)} ${r1(y)}a${r1(r)} ${r1(r)} 0 1 0 ${r1(2 * r)} 0a${r1(r)} ${r1(r)} 0 1 0 ${r1(-2 * r)} 0Z`; }
function ellD(x, y, rx, ry) { return `M${r1(x - rx)} ${r1(y)}a${r1(rx)} ${r1(ry)} 0 1 0 ${r1(2 * rx)} 0a${r1(rx)} ${r1(ry)} 0 1 0 ${r1(-2 * rx)} 0Z`; }
const shadowL = (rx, ry) => ({ d: ellD(0, 0.6, rx, ry), f: 'shadow', fo: 0.2, lod: 1 });
function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], hi = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], q) <= 0) hi.pop(); hi.push(q); }
  hi.pop(); lo.pop();
  return lo.concat(hi);
}
function bez(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
          u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]];
}
function bezTan(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return [3 * u * u * (p1[0] - p0[0]) + 6 * u * t * (p2[0] - p1[0]) + 3 * t * t * (p3[0] - p2[0]),
          3 * u * u * (p1[1] - p0[1]) + 6 * u * t * (p2[1] - p1[1]) + 3 * t * t * (p3[1] - p2[1])];
}
// Variable-width band along a cubic: ribs, necks, masts that taper.
function bandBez(p0, p1, p2, p3, w0, w1, n = 16) {
  const L = [], R = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, p = bez(p0, p1, p2, p3, t), d = bezTan(p0, p1, p2, p3, t);
    const m = Math.hypot(d[0], d[1]) || 1, nx = -d[1] / m, ny = d[0] / m, w = (w0 + (w1 - w0) * t) / 2;
    L.push([p[0] + nx * w, p[1] + ny * w]);
    R.push([p[0] - nx * w, p[1] - ny * w]);
  }
  return L.concat(R.reverse());
}
// Pointed leaf from a base point; ang is measured from straight up (+ = right).
function leaf(bx, by, ang, len, wid, droop = 0) {
  const ux = Math.sin(ang), uy = -Math.cos(ang), nx = -uy, ny = ux;
  const tx = bx + ux * len, ty = by + uy * len + droop;
  const a1 = [bx + ux * len * 0.28 + nx * wid, by + uy * len * 0.28 + ny * wid];
  const a2 = [bx + ux * len * 0.78 + nx * wid * 0.7, by + uy * len * 0.78 + ny * wid * 0.7 + droop * 0.6];
  const b2 = [bx + ux * len * 0.78 - nx * wid * 0.7, by + uy * len * 0.78 - ny * wid * 0.7 + droop * 0.6];
  const b1 = [bx + ux * len * 0.28 - nx * wid, by + uy * len * 0.28 - ny * wid];
  const lo = ang >= 0 ? [a1, a2] : [b1, b2];   // the underside takes the shade
  const mid = [bx + ux * len * 0.5, by + uy * len * 0.5 + droop * 0.3];
  return {
    d: `M${P2(bx, by)}C${P2(a1[0], a1[1])} ${P2(a2[0], a2[1])} ${P2(tx, ty)}C${P2(b2[0], b2[1])} ${P2(b1[0], b1[1])} ${P2(bx, by)}Z`,
    half: `M${P2(bx, by)}C${P2(lo[0][0], lo[0][1])} ${P2(lo[1][0], lo[1][1])} ${P2(tx, ty)}Q${P2(mid[0], mid[1])} ${P2(bx, by)}Z`,
    rib: `M${P2(bx + ux * 2, by + uy * 2)}Q${P2(mid[0], mid[1])} ${P2(bx + ux * len * 0.82, by + uy * len * 0.82 + droop * 0.55)}`,
    tip: [tx, ty],
  };
}
// Branch segments [x0,y0,mx,my,x1,y1,thickness] drawn in three passes:
// ink outline, flesh, and an offset highlight, each bucketed by thickness.
function branchLayers(segs, fill, hi, lodOutline = 1) {
  const classes = [[3.2, 99], [1.7, 3.2], [0, 1.7]];
  const out = [];
  const pick = ([lo, hi2]) => segs.filter(s => s[6] >= lo && s[6] < hi2);
  const dOf = (list, ox) => list.map(s => `M${P2(s[0] + ox * s[6], s[1])}Q${P2(s[2] + ox * s[6], s[3])} ${P2(s[4] + ox * s[6], s[5])}`).join('');
  const avg = list => list.reduce((t, s) => t + s[6], 0) / list.length;
  const buckets = classes.map(pick).filter(l => l.length);
  for (const l of buckets) out.push({ d: dOf(l, 0), s: 'ink', w: r1(avg(l) + 1.2), lod: lodOutline });
  for (const l of buckets) out.push({ d: dOf(l, 0), s: fill, w: r1(avg(l)) });
  if (hi) for (const l of buckets) out.push({ d: dOf(l, -0.22), s: hi, w: r1(avg(l) * 0.34), lod: 0 });
  return out;
}
function segExtents(segs, pad) {
  let minY = 0, hw = 0;
  for (const s of segs) {
    minY = Math.min(minY, s[1], s[3], s[5]);
    hw = Math.max(hw, Math.abs(s[0]), Math.abs(s[2]), Math.abs(s[4]));
  }
  return { top: minY - pad, hw: hw + pad };
}

const GEN = {};

/* ---- staghorn coral: antler branches with pale growing tips ---- */
GEN.stag = (R, v) => {
  const pal = v === 2 ? ['coralP', 'coralPHi', 'coralPTip'] : ['coral', 'coralHi', 'coralTip'];
  const segs = [], tips = [];
  function br(x, y, ang, len, th, dep) {
    const bend = (R() - 0.5) * 0.6, a1 = ang + bend * 0.5, a2 = ang + bend;
    const mx = x + Math.sin(a1) * len * 0.55, my = y - Math.cos(a1) * len * 0.55;
    const ex = x + Math.sin(a2) * len, ey = y - Math.cos(a2) * len;
    segs.push([x, y, mx, my, ex, ey, th]);
    if (dep <= 0) { tips.push([ex, ey, th]); return; }
    const n = R() < 0.3 ? 3 : 2;
    for (let i = 0; i < n; i++) {

/* ---- sea fan: a flat lattice of fine branches ---- */
GEN.fan = (R, v) => {
  const pal = v === 1 ? ['fanO', 'fanODark', 'fanOHi'] : ['fan', 'fanDark', 'fanHi'];
  const segs = [], nodes = [];
  function br(x, y, ang, len, th, dep) {
    ang = clamp(ang, -1.2, 1.2);
    const ex = x + Math.sin(ang) * len, ey = y - Math.cos(ang) * len;
    const mx = (x + ex) / 2 + (R() - 0.5) * len * 0.22, my = (y + ey) / 2 + (R() - 0.5) * len * 0.12;
    segs.push([x, y, mx, my, ex, ey, th]);
    nodes.push([ex, ey, dep]);
    if (dep <= 0) return;
    const sp = 0.24 + R() * 0.16;
    br(ex, ey, ang - sp, len * (0.74 + R() * 0.14), th * 0.72, dep - 1);
    br(ex, ey, ang + sp, len * (0.74 + R() * 0.14), th * 0.72, dep - 1);
  }
  segs.push([0, 0, 0.6, -4, 0, -8, 3.4]);
  for (let i = 0; i < 3; i++) br(0, -8, (i - 1) * 0.6 + (R() - 0.5) * 0.14, 10 + R() * 3, 2.3, 4);
  const outer = nodes.filter(n => n[2] <= 2);
  let links = '';
  for (let i = 0; i < outer.length; i++) for (let j = i + 1; j < outer.length; j++) {
    const dx = outer[i][0] - outer[j][0], dy = outer[i][1] - outer[j][1];
    if (dx * dx + dy * dy < 40 && R() < 0.6) links += `M${P2(outer[i][0], outer[i][1])}L${P2(outer[j][0], outer[j][1])}`;
  }
  const hull = convexHull(nodes.map(n => [n[0], n[1]]).concat([[-2.5, -8], [2.5, -8]]));
  let cx = 0, cy = 0; for (const p of hull) { cx += p[0]; cy += p[1]; } cx /= hull.length; cy /= hull.length;
  const sil = hull.map(p => [cx + (p[0] - cx) * 0.94, cy + (p[1] - cy) * 0.94]);
  const ext = segExtents(segs, 3);
  const layers = [shadowL(ext.hw * 0.45, 2.5),
    { d: crD(sil, true), f: pal[0], fo: 0.3, lod: 1 },
    { d: links, s: pal[1], w: 0.5, lod: 0 },
    ...branchLayers(segs, pal[0], pal[2])];
  return { layers, top: ext.top, hw: ext.hw, bot: 3 };
};

function bandPart(p0, p1, p2, p3, w0, w1, t0, t1, n = 14) {
  const L = [], R = [];
  for (let i = 0; i <= n; i++) {
    const t = t0 + (t1 - t0) * i / n, p = bez(p0, p1, p2, p3, t), d = bezTan(p0, p1, p2, p3, t);
    const m = Math.hypot(d[0], d[1]) || 1, nx = -d[1] / m, ny = d[0] / m, w = (w0 + (w1 - w0) * t) / 2;
    L.push([p[0] + nx * w, p[1] + ny * w]);
    R.push([p[0] - nx * w, p[1] - ny * w]);
  }
  return L.concat(R.reverse());
}
// Clip an open polyline to y <= 0 (above the sand) and emit its visible runs.
function clipPolyUp(pts) {
  let d = '', pen = false;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (i > 0) {
      const q = pts[i - 1];
      if ((q[1] <= 0) !== (p[1] <= 0)) {
        const t = q[1] / (q[1] - p[1]), x = q[0] + (p[0] - q[0]) * t;
        d += (pen ? 'L' : 'M') + P2(x, 0);
        pen = !pen;
      }
    }
    if (p[1] <= 0) { d += (pen ? 'L' : 'M') + P2(p[0], p[1]); pen = true; } else pen = false;
  }
  return d;
}

  if (l.fo != null) st += `;fill-opacity:${l.fo}`;

  if (l.lod === 0) st += ';display:var(--d0,inline)';

      if (!l.d) continue;
      if (l.f) keys.add(l.f);
      if (l.s) keys.add(l.s);
      body += layerMarkup(l);
    }
    SYM[id] = { id, top: g.top, bot: g.bot, hw: g.hw, tip: g.tip != null ? g.tip : g.top, keys: [...keys], cache: [] };

function styleFor(sym, lv) {

const REGS = new Map();

/* ---- chunk streaming: generate ahead, release behind ---- */
let chunkCenter = '';
const genQueue = [];
function streamChunks(all) {
  const C = CFG.CHUNK, pci = Math.floor(S.x / C), pcj = Math.floor(S.z / C);
  const R = Math.ceil((CFG.FAR * S.Q + 30) / C);
  const k = pci + ',' + pcj + ',' + R;
  if (k !== chunkCenter) {
    chunkCenter = k;

    for (let di = -R; di <= R; di++) for (let dj = -R; dj <= R; dj++) {
      const kk = ckey(pci + di, pcj + dj);
      if (!CH.has(kk)) genQueue.push([pci + di, pcj + dj, di * di + dj * dj]);
    }
    genQueue.sort((a, b) => b[2] - a[2]);   // nearest last, popped first
    for (const [kk, ch] of CH) if (Math.abs(ch.ci - pci) > R + 1 || Math.abs(ch.cj - pcj) > R + 1) {
      for (const s of ch.sprites) releaseSprite(s);

  let budget = all ? 1e9 : 3;

    genQueue.pop();

/* =====================================================================

  const zc = Z * cam.cp + Y * cam.sp;

  const N = CFG.NEAR, c = [];
  for (const [x, y, z] of pts) {

// A static vignette in its own layer: the edges of vision darken like looking through water.
function layoutVeil() {
  const v = $('veil');
  while (v.firstChild) v.firstChild.remove();
  const g = mk('radialGradient', { id: 'gVeil', cx: '50%', cy: '46%', r: '75%' }, mk('defs', null, v));
  mk('stop', { offset: 0.55, 'stop-color': '#0a3a44', 'stop-opacity': 0 }, g);
  mk('stop', { offset: 1, 'stop-color': '#062a33', 'stop-opacity': 0.3 }, g);
  mk('rect', { x: 0, y: 0, width: cam.W, height: cam.H, fill: 'url(#gVeil)' }, v);
}
// Frame pacing is judged against the best 2.5 s average this device has managed, not a
// fixed 60 Hz budget: a display capped at 30 Hz (low-power mode, throttled iframe) is
// steady at 33 ms and should keep full quality; a 60 Hz device sagging to 30 should not.
let perfAcc = 0, perfN = 0, perfBest = Infinity;
function adaptQuality(dtMs) {
  if (S.qLocked || document.hidden || !(dtMs > 0) || dtMs > 250) return;
  perfAcc += dtMs; perfN++;
  if (perfAcc < 2500) return;
  const avg = perfAcc / perfN;
  perfAcc = perfN = 0;
  perfBest = Math.min(perfBest, avg);
  if (!S.started) return;
  if (avg > Math.max(perfBest * 1.45, 22) && S.Q > 0.6) S.Q = Math.max(0.6, r3(S.Q - 0.1));
  else if (avg < perfBest * 1.18 && S.Q < 1) S.Q = Math.min(1, r3(S.Q + 0.05));
}
let lastT = null;
function frame(now) {
  requestAnimationFrame(frame);
  if (lastT === null) lastT = now;
  const dtMs = now - lastT;
  lastT = now;
  const dt = Math.min(0.05, Math.max(0, dtMs / 1000));
  checkSize();
  update(dt);
  streamChunks(false);
  render(dt);
  updateHUD(dt);
  adaptQuality(dtMs);
}

/* =====================================================================
   BOOT
   ===================================================================== */
function boot() {
  buildSymbols($('defs'));
  setupScene();
  setupHUD();
  setupOverlay();
  setupInput();
  if (!S.qLocked && document.body.classList.contains('touch')) S.Q = 0.85;   // phones start a little lighter
  resize();
  streamChunks(true);
  spawnVoyager(120, 0.9);
  voyTimer = 30;
  S.region = regionAt(S.x, S.z);
  if (QS.has('nointro')) startGame();
  render(0);
  updateHUD(0);
  requestAnimationFrame(frame);
}

// Debug handle for deterministic headless checks (step the sim without rAF).
window.__upturned = {
  S, cam, CFG, CH, IN, SYM,
  step(dt = 1 / 60, n = 1) {
    for (let i = 0; i < n; i++) { update(dt); streamChunks(true); }
    render(dt); updateHUD(dt);
    return this.stats();
  },
  teleport(x, z, yaw, pitch) {
    S.x = x; S.z = z;
    if (yaw != null) S.yaw = yaw;
    if (pitch != null) S.pitch = pitch;
    streamChunks(true); render(0); updateHUD(0);
    return this.stats();
  },
  start: () => startGame(),
  stats: () => ({ x: r1(S.x), z: r1(S.z), yaw: r3(S.yaw), pitch: r3(S.pitch), sprites: VIS.length, dom: V.world.childNodes.length,
                  chunks: CH.size, pool: POOL.use.length, letters: S.letters, region: S.region && S.region.name, q: S.Q, bob: r3(S.bobAmp) }),
};
boot();
</script>
