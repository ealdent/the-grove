<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>Sporefall — The Mycelium Vale</title>
<!--
  SPOREFALL · the mycelium vale
  A first-person exploration of an endless bioluminescent fungal valley,
  rendered entirely with SVG (no canvas, no WebGL, no images).

  Engine notes:
   · World is an infinite deterministic hash-grid; each cell may hold one prop.
   · Props are drawn once in <defs> and instanced through a fixed pool of <use>
     elements whose transforms/opacity are rewritten each frame (painter-sorted
     far-to-near), so no SVG nodes are created or destroyed while exploring.
   · Sky, moons, aurora and the distant ridge live on a wrapping parallax band
     that translates with the camera heading (period = 2π·focal-length).
   · Per-instance hue variation flows into the shared prop art via the CSS
     custom property --a on each <use>.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04060d;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:"Avenir Next",Futura,"Segoe UI",system-ui,sans-serif}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #view.dragging{cursor:grabbing}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 95% at 50% 44%, transparent 52%, rgba(2,7,16,.62) 100%)}
  #hud{position:fixed;top:5.5%;left:0;right:0;text-align:center;pointer-events:none;
    color:#c4efe2;opacity:1;transition:opacity 2.6s ease;z-index:8}
  #hud.hide{opacity:0}
  #t1{font-size:clamp(22px,4.6vw,44px);font-weight:600;letter-spacing:.55em;padding-left:.55em;
    text-shadow:0 0 22px rgba(95,242,208,.55),0 0 60px rgba(95,242,208,.25)}
  #t2{margin-top:6px;font-size:clamp(11px,1.9vw,15px);font-style:italic;opacity:.75;
    letter-spacing:.38em;padding-left:.38em}
  #t3{margin-top:16px;padding:0 16px;font-size:clamp(10px,1.6vw,13px);letter-spacing:.14em;opacity:.8}
  #hintM{display:none}
  body.touch #hintM{display:inline}
  body.touch #hintPC{display:none}
  .joy{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    width:128px;height:128px;border-radius:50%;display:none;z-index:9;touch-action:none;
    background:radial-gradient(circle at 50% 42%, rgba(70,225,185,.10), rgba(18,58,58,.20) 62%, rgba(120,255,220,.05));
    border:1px solid rgba(140,255,225,.32);
    box-shadow:inset 0 0 26px rgba(60,220,180,.16), 0 4px 20px rgba(0,0,0,.4)}
  #joyL{left:calc(env(safe-area-inset-left,0px) + 22px)}
  #joyR{right:calc(env(safe-area-inset-right,0px) + 22px)}
  .joy::before{content:attr(data-glyph);position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;font-size:40px;color:#aef4de;opacity:.16}
  .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
    border-radius:50%;
    background:radial-gradient(circle at 36% 30%, rgba(225,255,246,.95), rgba(110,235,200,.55) 60%, rgba(55,150,130,.45));
    box-shadow:0 0 18px rgba(120,255,220,.55)}
  body.touch .joy{display:block}
  @media (pointer:coarse){.joy{display:block}}
</style>
</head>
<body>

<svg id="view" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

  <!-- ======================= props =======================
       Each prop is drawn with its base at (0,0), growing in -y.
       --a carries the per-instance accent hue. -->

    <ellipse cx="0" cy="-212" rx="92" ry="42" fill="var(--a,#5ff2d0)" opacity=".28"/>

    <path d="M-11,0 C-19,-72 -5,-140 -7,-198 L10,-198 C7,-140 17,-72 14,0 Z" fill="url(#stemG)"/>
    <ellipse cx="1" cy="-196" rx="50" ry="18" fill="url(#orbGlow)" opacity=".5"/>
    <g stroke="var(--a,#5ff2d0)" stroke-width="2" opacity=".35" fill="none">
      <path d="M-44,-192 L-8,-206"/><path d="M2,-194 L2,-208"/><path d="M46,-190 L12,-206"/>

    <ellipse cx="1" cy="-236" rx="52" ry="24" fill="var(--a,#5ff2d0)" opacity=".3"/>

  <!-- spirefern cluster -->

    <g fill="none" stroke="#2f6b5e" stroke-width="5" stroke-linecap="round">
      <path d="M0,0 C-8,-50 -30,-80 -58,-104"/><path d="M0,0 C-4,-60 -14,-100 -30,-138"/>
      <path d="M0,0 C2,-64 6,-110 2,-150"/><path d="M0,0 C6,-58 20,-96 40,-128"/>
      <path d="M0,0 C10,-44 34,-72 62,-88"/>
    </g>
    <g fill="none" stroke="#66c9ad" stroke-width="1.8" stroke-linecap="round" opacity=".55">
      <path d="M0,0 C-8,-50 -30,-80 -58,-104"/><path d="M0,0 C-4,-60 -14,-100 -30,-138"/>
      <path d="M0,0 C2,-64 6,-110 2,-150"/><path d="M0,0 C6,-58 20,-96 40,-128"/>
      <path d="M0,0 C10,-44 34,-72 62,-88"/>
    </g>
    <g fill="var(--a,#5ff2d0)" opacity=".85">
      <animate attributeName="opacity" values=".55;.95;.55" dur="3.2s" repeatCount="indefinite"/>
      <circle cx="-58" cy="-104" r="4"/><circle cx="-30" cy="-138" r="4"/>
      <circle cx="2" cy="-150" r="4"/><circle cx="40" cy="-128" r="4"/><circle cx="62" cy="-88" r="4"/>
    </g>
  </g>

  <!-- glowgrass tuft -->
  <g id="p-grass">
    <ellipse cx="0" cy="0" rx="16" ry="4" fill="url(#poolG)" opacity=".3"/>
    <g fill="none" stroke="#2c6157" stroke-width="3" stroke-linecap="round">
      <path d="M0,0 Q-5,-14 -13,-24"/><path d="M0,0 Q-1,-18 -4,-30"/>
      <path d="M0,0 Q4,-15 12,-27"/><path d="M0,0 Q7,-10 16,-16"/><path d="M0,0 Q-8,-8 -18,-13"/>

    <g fill="var(--a,#7dfcd9)" opacity=".85">

</defs>

<!-- scene root: head-bob + pitch translate everything together -->
<g id="scene">
  <rect id="skyR" x="-1700" y="-360" width="6800" height="756" fill="url(#skyG)"/>
  <ellipse id="horizGlow" cx="800" cy="396" rx="2600" ry="170" fill="url(#horizonGlowG)">
    <animate attributeName="opacity" values=".8;1;.8" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <g id="skypar">
    <g id="skyband"></g>
    <use id="bandL" href="#skyband" x="-6918"/>
    <use id="bandR" href="#skyband" x="6918"/>
  </g>
  <rect id="groundR" x="-1700" y="396" width="6800" height="864" fill="url(#groundG)"/>
  <ellipse id="gndGlow" cx="800" cy="422" rx="2600" ry="110" fill="url(#gndGlowG)">
    <animate attributeName="opacity" values=".7;1;.7" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <g id="props"></g>

<g id="motes"></g>
</svg>

<div id="vignette"></div>
<div id="hud">
  <div id="t1">SPOREFALL</div>
  <div id="t2">the mycelium vale</div>
  <div id="t3">
    <span id="hintPC">W A S D / arrows — walk &amp; turn · Q E — drift · click-drag — look</span>
    <span id="hintM">left stick — walk · right stick — turn</span>
  </div>
</div>
<div class="joy" id="joyL" data-glyph="↕"><div class="knob"></div></div>
<div class="joy" id="joyR" data-glyph="↔"><div class="knob"></div></div>

<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const svg = $('view'), scene = $('scene'), skypar = $('skypar'), band = $('skyband'),
      propsG = $('props'), motesG = $('motes');

/* ---------------- camera / world constants ---------------- */
const HOR = 396;          // horizon y in viewBox units
const EYE = 46;           // eye height in world units
const CELL = 230;         // world grid cell size
const VIEW = 3800;        // far plane
const POOLN = 260;        // instance pool size
const TAU = Math.PI * 2;

let Wv = 1600, CX = 800, F = 1101, L = 6918, cone = 0.9;

/* ---------------- deterministic hashing ---------------- */
function hash(ix, iz, s) {
  let h = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + Math.imul(s, 974634497)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------- prop catalogue ---------------- */
// hw: half-width (world units) for culling · s0/s1: scale variance · far: max draw z
const TYPES = [
  { href: '#p-shroom',  hw: 130, s0: 0.80, s1: 0.90, far: 3800 },
  { href: '#p-shroom2', hw: 95,  s0: 0.75, s1: 0.80, far: 3800 },
  { href: '#p-fern',    hw: 85,  s0: 0.70, s1: 0.75, far: 2900 },
  { href: '#p-grass',   hw: 30,  s0: 0.80, s1: 0.90, far: 1600 },
  { href: '#p-wisp',    hw: 65,  s0: 0.60, s1: 0.65, far: 3300, fly: true },
  { href: '#p-mono',    hw: 80,  s0: 0.80, s1: 0.70, far: 3800 },
];
TYPES.forEach(t => t.fw = Math.min(950, t.far * 0.5));
function pickType(r) {
  return r < .095 ? 0 : r < .165 ? 1 : r < .36 ? 2 : r < .66 ? 3 : r < .70 ? 4 : r < .725 ? 5 : -1;
}
const PALETTE = ['#5ff2d0', '#6fd8ff', '#c08bff', '#ff8fd8', '#ffd27a'];
const palIdx = r => r < .34 ? 0 : r < .58 ? 1 : r < .76 ? 2 : r < .90 ? 3 : 4;

/* ---------------- instance pool (no per-frame DOM churn) ---------------- */
const pool = [];
for (let i = 0; i < POOLN; i++) {
  const u = document.createElementNS(NS, 'use');
  u.setAttribute('href', '#p-grass');
  u.style.display = 'none';
  u._hid = true; u._t = -1; u._pi = -1;
  propsG.appendChild(u);
  pool.push(u);
}

/* ---------------- ambient spore motes (screen space) ---------------- */
const motes = [];
for (let i = 0; i < 18; i++) {
  const c = document.createElementNS(NS, 'circle');
  const m = {
    el: c, x: Math.random() * 1600, y: Math.random() * 900,
    vx: -8 + Math.random() * 16, vy: -6 - Math.random() * 11,
    ph: Math.random() * TAU, dp: 0.4 + Math.random() * 0.6
  };
  c.setAttribute('r', (1.2 + Math.random() * 1.8).toFixed(1));
  c.setAttribute('fill', '#bfeee0');
  c.setAttribute('opacity', (0.2 + Math.random() * 0.4).toFixed(2));
  motesG.appendChild(c);
  motes.push(m);
}

/* ---------------- distant parallax band (stars · moons · aurora · ridge) ---------------- */
function buildSky() {
  const R = mulberry32(20260702);
  const out = [];

  // stars
  const ns = Math.round(L / 26);
  const starCols = ['#cfe9ff', '#ffe9c9', '#d5ffe9'];
  for (let i = 0; i < ns; i++) {
    const x = (R() * L).toFixed(1), y = (-330 + Math.pow(R(), 1.35) * 660).toFixed(1);
    const r = (0.5 + R() * 1.3).toFixed(2), o = (0.25 + R() * 0.6).toFixed(2);
    const col = starCols[(R() * 3) | 0];
    if (R() < 0.18) {
      const d = (2 + R() * 3.5).toFixed(1);
      out.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" opacity="${o}"><animate attributeName="opacity" values="${o};${(o * 0.2).toFixed(2)};${o}" dur="${d}s" begin="-${(R() * d).toFixed(1)}s" repeatCount="indefinite"/></circle>`);
    } else {
      out.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" opacity="${o}"/>`);
    }
  }

  // aurora ribbons
  for (let a = 0; a < 3; a++) {
    const bx = R() * L, span = 1200 + R() * 1600, y0 = 50 + R() * 90, ph = R() * 6, seg = 7;
    const pts = [];
    for (let k = 0; k <= seg; k++)
      pts.push([bx + span * k / seg, y0 + Math.sin(ph + k * 1.25) * 38 + R() * 14]);
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let k = 1; k < seg; k++) {
      const mx = (pts[k][0] + pts[k + 1][0]) / 2, my = (pts[k][1] + pts[k + 1][1]) / 2;
      d += ` Q${pts[k][0].toFixed(1)},${pts[k][1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
    }
    const dur = (8 + R() * 6).toFixed(1);
    out.push(`<path d="${d}" fill="none" stroke="url(#auroraG)" stroke-width="${(90 + R() * 100) | 0}" stroke-linecap="round" opacity="${(0.5 + R() * 0.3).toFixed(2)}"><animate attributeName="opacity" values=".45;.8;.45" dur="${dur}s" begin="-${(R() * 8).toFixed(1)}s" repeatCount="indefinite"/></path>`);
  }

  // twin moons
  const mx1 = L * 0.18;
  out.push(`<circle cx="${mx1}" cy="96" r="120" fill="url(#moonHalo)"/>`,
           `<circle cx="${mx1}" cy="96" r="56" fill="url(#moonG)"/>`,
           `<circle cx="${mx1 - 18}" cy="86" r="9" fill="#9fccbd" opacity=".55"/>`,
           `<circle cx="${mx1 + 15}" cy="110" r="7" fill="#a7d2c3" opacity=".5"/>`,
           `<circle cx="${mx1 + 4}" cy="70" r="5" fill="#a7d2c3" opacity=".45"/>`);
  const mx2 = L * 0.56;
  out.push(`<circle cx="${mx2}" cy="150" r="48" fill="url(#moon2Halo)"/>`,
           `<circle cx="${mx2}" cy="150" r="21" fill="url(#moon2G)"/>`);

  // far ridge — integer harmonics of L so the band tiles seamlessly
  const rY = x => HOR - (46 + 26 * Math.sin(TAU * 3 * x / L + 1.7)
                            + 16 * Math.sin(TAU * 7 * x / L + 0.5)
                            + 10 * Math.sin(TAU * 13 * x / L + 3.0));
  let rd = `M0,${rY(0).toFixed(1)}`;
  for (let x = 90; x <= L; x += 90) rd += ` L${x},${rY(x).toFixed(1)}`;
  rd += ` L${L},${HOR + 80} L0,${HOR + 80} Z`;
  out.push(`<path d="${rd}" fill="#0e1a36" opacity=".95"/>`);

  // silhouette mushroom forest on the ridge line
  const slots = Math.floor(L / 240);
  let sd = '';
  const dots = [];
  for (let s = 0; s < slots; s++) {
    if (R() < 0.28) continue;
    const x = s * 240 + R() * 140, h = 55 + R() * 115, w = h * (0.95 + R() * 0.5), st = w * 0.16;
    sd += `M${(x - st).toFixed(1)},${HOR + 4} L${(x - st * 0.7).toFixed(1)},${(HOR - h * 0.62).toFixed(1)} Q${(x - w / 2).toFixed(1)},${(HOR - h * 0.55).toFixed(1)} ${(x - w / 2).toFixed(1)},${(HOR - h * 0.72).toFixed(1)} Q${x.toFixed(1)},${(HOR - h * 1.12).toFixed(1)} ${(x + w / 2).toFixed(1)},${(HOR - h * 0.72).toFixed(1)} Q${(x + w / 2).toFixed(1)},${(HOR - h * 0.55).toFixed(1)} ${(x + st * 0.7).toFixed(1)},${(HOR - h * 0.62).toFixed(1)} L${(x + st).toFixed(1)},${HOR + 4} Z `;
    if (R() < 0.3) dots.push(`<circle cx="${x.toFixed(1)}" cy="${(HOR - h * 0.72).toFixed(1)}" r="2.4" fill="#64e0c0" opacity=".55"/>`);
  }
  out.push(`<path d="${sd}" fill="#0a1426"/>`, ...dots);

  // scattered vale-lights at the foot of the ridge
  const nl = Math.round(L / 300);
  for (let i = 0; i < nl; i++) {
    const x = (R() * L).toFixed(1), y = (HOR - 6 - R() * 26).toFixed(1);
    out.push(`<circle cx="${x}" cy="${y}" r="${(1.5 + R() * 1.5).toFixed(1)}" fill="${R() < 0.5 ? '#64e0c0' : '#6fc8e8'}" opacity="${(0.35 + R() * 0.4).toFixed(2)}"/>`);
  }

  band.innerHTML = out.join('');
  $('bandL').setAttribute('x', -L);
  $('bandR').setAttribute('x', L);
}

/* ---------------- responsive projection ---------------- */
function resize() {
  const aw = Math.max(1, innerWidth), ah = Math.max(1, innerHeight);
  const aspect = aw / ah;
  Wv = Math.max(500, Math.min(3400, 900 * aspect));
  const fovDeg = Math.min(80, Math.max(54, 46 + 18 * aspect));
  const T = Math.tan(fovDeg * Math.PI / 360);
  CX = Wv / 2;
  F = CX / T;
  cone = T * 1.15;
  svg.setAttribute('viewBox', `0 0 ${Wv.toFixed(1)} 900`);
  $('horizGlow').setAttribute('cx', CX);
  $('gndGlow').setAttribute('cx', CX);
  const newL = Math.round(TAU * F);
  if (Math.abs(newL - L) > 2) { L = newL; buildSky(); }
}
addEventListener('resize', resize);
resize();

/* ---------------- input: keyboard ---------------- */
const key = Object.create(null);
const KEYMAP = {
  w: 'f', arrowup: 'f', s: 'b', arrowdown: 'b',
  a: 'l', arrowleft: 'l', d: 'r', arrowright: 'r',
  q: 'q', e: 'e', shift: 'sh'
};
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = KEYMAP[e.key.toLowerCase()];
  if (k) { key[k] = 1; e.preventDefault(); }
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.key.toLowerCase()];
  if (k) key[k] = 0;
});
addEventListener('blur', () => { for (const k in key) key[k] = 0; });

/* ---------------- input: drag-to-look ---------------- */
let heading = 0.6, pitch = 0;
let dragId = null, dragX = 0, dragY = 0;
svg.addEventListener('pointerdown', e => {
  if (dragId !== null) return;
  dragId = e.pointerId; dragX = e.clientX; dragY = e.clientY;
  svg.setPointerCapture(dragId);
  svg.classList.add('dragging');
});
svg.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  const dx = e.clientX - dragX, dy = e.clientY - dragY;
  dragX = e.clientX; dragY = e.clientY;
  heading -= dx * (2 * Math.atan(cone / 1.15) / innerWidth);   // ~1 screen-width ≈ 1 FOV
  pitch = Math.max(-150, Math.min(170, pitch + dy * (900 / innerHeight) * 0.55));
});
const endDrag = e => {
  if (e.pointerId !== dragId) return;
  dragId = null;
  svg.classList.remove('dragging');
};
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

/* ---------------- input: multitouch virtual joysticks ---------------- */
const joy = { move: 0, strafe: 0, turn: 0 };
function makeJoy(el, cb) {
  const knob = el.querySelector('.knob');
  let id = null, cx = 0, cy = 0;
  const move = e => {
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const m = Math.hypot(dx, dy), R = 44;
    if (m > R) { dx *= R / m; dy *= R / m; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    cb(dx / R, dy / R);
  };
  el.addEventListener('pointerdown', e => {
    if (id !== null) return;
    id = e.pointerId;
    el.setPointerCapture(id);
    const r = el.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    knob.style.transition = 'none';
    move(e);
    e.preventDefault();
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === id) move(e); });
  const end = e => {
    if (e.pointerId !== id) return;
    id = null;
    knob.style.transition = 'transform .18s';
    knob.style.transform = '';
    cb(0, 0);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
makeJoy($('joyL'), (x, y) => { joy.move = -y; joy.strafe = x * 0.8; });
makeJoy($('joyR'), (x)    => { joy.turn = x; });

/* ---------------- mobile browser behaviour guards ---------------- */
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
if ('ontouchstart' in window || matchMedia('(pointer:coarse)').matches)
  document.body.classList.add('touch');
addEventListener('touchstart', () => document.body.classList.add('touch'), { once: true });

/* ---------------- HUD fade ---------------- */
setTimeout(() => $('hud').classList.add('hide'), 7000);

/* ---------------- main loop ---------------- */
let px = 40, pz = 30;
let vel = 0, velS = 0, bobPhase = 0, lastT = 0, prevHeading = heading;
const clamp1 = v => Math.max(-1, Math.min(1, v));

function frame(now) {
  requestAnimationFrame(frame);
  const t = now / 1000;
  let dt = t - lastT; lastT = t;
  if (dt <= 0) return;
  if (dt > 0.06) dt = 0.06;

  /* movement */
  const fwdIn = clamp1((key.f ? 1 : 0) - (key.b ? 1 : 0) + joy.move);
  const strIn = clamp1((key.e ? 1 : 0) - (key.q ? 1 : 0) + joy.strafe);
  const trnIn = clamp1((key.r ? 1 : 0) - (key.l ? 1 : 0) + joy.turn);
  const sprint = key.sh ? 1.75 : 1;
  heading = (heading + trnIn * 1.8 * dt) % TAU;
  const k = Math.min(1, dt * 7);
  vel  += (fwdIn * 340 * sprint - vel)  * k;
  velS += (strIn * 250 * sprint - velS) * k;
  const sinH = Math.sin(heading), cosH = Math.cos(heading);
  px += (sinH * vel + cosH * velS) * dt;
  pz += (cosH * vel - sinH * velS) * dt;

  /* head bob */
  const ratio = Math.min(1, Math.hypot(vel, velS) / 340);
  if (ratio > 0.03) bobPhase += dt * (5.5 + 4.5 * ratio);
  const bobY = Math.sin(bobPhase * 2) * 6 * ratio;
  const swayX = Math.sin(bobPhase) * 4 * ratio;
  scene.setAttribute('transform', `translate(${swayX.toFixed(2)} ${(pitch + bobY).toFixed(2)})`);

  /* sky parallax */
  const sh = ((heading % TAU) + TAU) % TAU / TAU * L;
  skypar.setAttribute('transform', `translate(${(-sh).toFixed(1)} 0)`);

  /* gather + project visible props */
  const list = [];
  const ci = Math.round(px / CELL), cj = Math.round(pz / CELL);
  const RC = Math.ceil(VIEW / CELL);
  for (let j = cj - RC; j <= cj + RC; j++) {
    const bz = j * CELL - pz;
    for (let i = ci - RC; i <= ci + RC; i++) {
      const bx = i * CELL - px;
      // coarse cell cull (centre + margin)
      const cz = (bx + 115) * sinH + (bz + 115) * cosH;
      if (cz < -180 || cz > VIEW + 170) continue;
      const cxl = (bx + 115) * cosH - (bz + 115) * sinH;
      if (Math.abs(cxl) > cz * cone + 340) continue;
      // understory: extra glowgrass tuft in ~half of all near cells,
      // so the foreground stays alive inside the narrow close-range cone
      if (cz < 1750 && hash(i, j, 7) < 0.55) {
        const g = TYPES[3];
        const uwx = bx + (0.1 + 0.8 * hash(i, j, 8)) * CELL;
        const uwz = bz + (0.1 + 0.8 * hash(i, j, 9)) * CELL;
        const uz = uwx * sinH + uwz * cosH;
        if (uz >= 40 && uz <= g.far) {
          const ux = uwx * cosH - uwz * sinH;
          const us = F / uz;
          const uvs = g.s0 + g.s1 * hash(i, j, 10);
          const usx = CX + (ux / uz) * F;
          const uhw = g.hw * us * uvs;
          if (usx >= -uhw - 60 && usx <= Wv + uhw + 60) {
            let uo = 1;
            if (uz > g.far - g.fw) uo = (g.far - uz) / g.fw;
            if (uz < 150) uo *= (uz - 40) / 110;
            list.push({
              z: uz, sxp: usx, syp: HOR + EYE / uz * F, sc: us * uvs, o: uo,
              fl: hash(i, j, 11) < 0.5 ? -1 : 1, ty: 3, pi: palIdx(hash(i, j, 12))
            });
          }
        }
      }
      const r0 = hash(i, j, 1);
      const ti = pickType(r0);
      if (ti < 0) continue;
      const T2 = TYPES[ti];
      const wx = bx + (0.16 + 0.68 * hash(i, j, 2)) * CELL;
      const wz = bz + (0.16 + 0.68 * hash(i, j, 3)) * CELL;
      const z = wx * sinH + wz * cosH;
      if (z < 40 || z > T2.far) continue;
      const x = wx * cosH - wz * sinH;
      const s0 = F / z;
      const vs = T2.s0 + T2.s1 * hash(i, j, 4);
      const sxp = CX + (x / z) * F;
      const hw = T2.hw * s0 * vs;
      if (sxp < -hw - 60 || sxp > Wv + hw + 60) continue;
      const elev = T2.fly ? 130 + 26 * Math.sin(t * 0.85 + r0 * 37) : 0;
      const syp = HOR + (EYE - elev) / z * F;
      let o = 1;
      if (z > T2.far - T2.fw) o = (T2.far - z) / T2.fw;
      if (z < 150) o *= (z - 40) / 110;
      list.push({
        z, sxp, syp, sc: s0 * vs, o,
        fl: hash(i, j, 5) < 0.5 ? -1 : 1,
        ty: ti, pi: palIdx(hash(i, j, 6))
      });
    }
  }

  /* painter sort far→near, keep nearest POOLN, rewrite the pool in place */
  list.sort((a, b) => b.z - a.z);
  const start = Math.max(0, list.length - POOLN);
  let n = 0;
  for (let idx = start; idx < list.length; idx++, n++) {
    const p = list[idx], el = pool[n];
    if (el._t !== p.ty) { el.setAttribute('href', TYPES[p.ty].href); el._t = p.ty; }
    if (el._pi !== p.pi) { el.style.setProperty('--a', PALETTE[p.pi]); el._pi = p.pi; }
    el.setAttribute('transform',
      `translate(${p.sxp.toFixed(1)} ${p.syp.toFixed(1)}) scale(${(p.sc * p.fl).toFixed(3)} ${p.sc.toFixed(3)})`);
    el.setAttribute('opacity', p.o >= 0.995 ? '1' : p.o.toFixed(2));
    if (el._hid) { el.style.display = ''; el._hid = false; }
  }
  for (let idx = n; idx < POOLN; idx++) {
    const el = pool[idx];
    if (!el._hid) { el.style.display = 'none'; el._hid = true; }
  }

  /* ambient motes drift + slight parallax with turning */
  const dHead = heading - prevHeading; prevHeading = heading;
  for (const m of motes) {
    m.x += (m.vx + Math.sin(t * 0.7 + m.ph) * 6) * dt - dHead * F * 0.3 * m.dp;
    m.y += m.vy * dt + Math.cos(t * 0.5 + m.ph) * 4 * dt;
    if (m.x < -30) m.x += Wv + 60; else if (m.x > Wv + 30) m.x -= Wv + 60;
    if (m.y < -20) m.y += 940; else if (m.y > 920) m.y -= 940;
    m.el.setAttribute('cx', m.x.toFixed(1));
    m.el.setAttribute('cy', m.y.toFixed(1));
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
