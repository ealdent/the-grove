<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lumenwood — SVG Forest</title>
<style>
  :root{color-scheme:dark;--ink:#f4f4e9;--muted:#a6b7a8;--cyan:#7cf6d4;--violet:#aa91ff;--panel:rgba(8,18,25,.72)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06121b;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
  body{user-select:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block}
  .topbar{position:fixed;z-index:5;top:max(18px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .brand,.readout{pointer-events:auto;border:1px solid rgba(188,245,221,.2);background:var(--panel);box-shadow:0 14px 38px rgba(0,0,0,.18);backdrop-filter:blur(12px);border-radius:18px}
  .brand{padding:13px 17px}.brand strong{display:block;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .readout{display:flex;gap:14px;padding:10px 13px;color:var(--ink);font-variant-numeric:tabular-nums;font-size:12px}.readout b{color:var(--cyan);font-weight:600}
  .hint{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;color:rgba(246,255,242,.88);text-shadow:0 2px 20px #000;transition:opacity .5s}.hint h1{font-size:clamp(23px,4vw,46px);letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}.hint p{margin:0;color:#c5d6c9;font-size:13px;letter-spacing:.12em;text-transform:uppercase}.hint.hide{opacity:0}
  .legend{position:fixed;z-index:4;bottom:22px;left:50%;transform:translateX(-50%);padding:9px 13px;border-radius:999px;border:1px solid rgba(188,245,221,.16);background:rgba(5,15,21,.55);color:#a9c2b5;font-size:11px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;white-space:nowrap}
  .joystick{position:fixed;z-index:10;bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px));width:130px;height:130px;border-radius:50%;border:1px solid rgba(160,245,211,.3);background:radial-gradient(circle,rgba(104,241,198,.12),rgba(13,29,34,.35) 68%,rgba(10,24,31,.05));box-shadow:inset 0 0 25px rgba(112,255,208,.05);display:none;touch-action:none}
  #leftStick{left:max(20px,calc(env(safe-area-inset-left) + 14px))}#rightStick{right:max(20px,calc(env(safe-area-inset-right) + 14px));border-color:rgba(177,145,255,.35);background:radial-gradient(circle,rgba(177,145,255,.13),rgba(13,24,38,.36) 68%,rgba(10,24,31,.05))}
  .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;border:1px solid rgba(211,255,239,.72);background:rgba(131,243,207,.25);box-shadow:0 0 24px rgba(121,255,212,.22);transform:translate(0,0);pointer-events:none}.rightKnob{background:rgba(182,155,255,.28);box-shadow:0 0 24px rgba(169,133,255,.25)}
  @media (max-width:700px){.topbar{left:12px;right:12px}.readout{gap:8px;font-size:10px}.readout span:last-child{display:none}.legend{display:none}.joystick{display:block;width:112px;height:112px;bottom:18px}.knob{width:48px;height:48px;margin:-24px}.hint{top:42%}.hint p{font-size:10px}.brand{padding:10px 12px}#leftStick{left:18px!important}#rightStick{right:18px!important}}
  @media (min-width:701px){.hint{opacity:1}.hint.hide{opacity:0}.joystick{display:none}}
</style>
</head>
<body>
<svg id="game" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-label="Lumenwood first-person SVG forest">
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#080d29"/><stop offset=".47" stop-color="#18284a"/><stop offset="1" stop-color="#5b3661"/></linearGradient>
    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#182e35"/><stop offset=".55" stop-color="#0b2028"/><stop offset="1" stop-color="#030c13"/></linearGradient>
    <linearGradient id="path" x2="0" y2="1"><stop stop-color="#304c55"/><stop offset="1" stop-color="#0b1920"/></linearGradient>
    <radialGradient id="moon"><stop stop-color="#d8ffd9"/><stop offset=".45" stop-color="#a3eebc" stop-opacity=".8"/><stop offset="1" stop-color="#9cebbd" stop-opacity="0"/></radialGradient>
    <linearGradient id="trunk" x2="1" y2="1"><stop stop-color="#172b31"/><stop offset=".55" stop-color="#375c55"/><stop offset="1" stop-color="#0d1a22"/></linearGradient>
    <linearGradient id="leaf" x2="0" y2="1"><stop stop-color="#b1ffcf"/><stop offset=".45" stop-color="#4fd49d"/><stop offset="1" stop-color="#15746b"/></linearGradient>
    <linearGradient id="mushroom" x2="0" y2="1"><stop stop-color="#ffb8ea"/><stop offset=".5" stop-color="#c978db"/><stop offset="1" stop-color="#683a9b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <circle cx="950" cy="148" r="118" fill="url(#moon)" opacity=".55"/>
  <circle cx="950" cy="148" r="42" fill="#d9ffd8" opacity=".84"/>
  <g id="stars" fill="#d4ffe9" opacity=".7">
    <circle cx="94" cy="90" r="2"/><circle cx="180" cy="160" r="1.5"/><circle cx="335" cy="83" r="1.6"/><circle cx="451" cy="132" r="2"/><circle cx="603" cy="70" r="1.3"/><circle cx="738" cy="166" r="1.7"/><circle cx="1080" cy="72" r="1.5"/><circle cx="1145" cy="211" r="2"/>
  </g>
  <path d="M0 360L110 238 193 332 315 202 425 334 548 218 661 336 777 206 880 325 1008 200 1200 350V465H0Z" fill="#131f3b" opacity=".9"/>
  <path d="M0 394L130 292 230 365 351 258 470 371 612 254 735 370 842 252 972 366 1090 267 1200 346V477H0Z" fill="#1a3445" opacity=".8"/>
  <rect y="390" width="1200" height="310" fill="url(#ground)"/>
  <path d="M505 395L695 395 1050 700H150Z" fill="url(#path)" opacity=".65"/>
  <path d="M540 423L660 423 760 700H468Z" fill="#213d43" opacity=".35"/>
  <g id="world" aria-hidden="true"></g>
  <g id="vignette" pointer-events="none"><rect width="1200" height="700" fill="none" stroke="#02090d" stroke-width="80" opacity=".33"/></g>
</svg>
<div class="topbar"><div class="brand"><strong>Lumenwood</strong><span>SVG forest / lunar trail</span></div><div class="readout"><span>DEPTH <b id="depth">000</b></span><span>BEARING <b id="bearing">N</b></span></div></div>
<div class="hint" id="hint"><h1>Enter the Lumenwood</h1><p>WASD / arrows to walk · drag to look</p></div>
<div class="legend">the trees remember where you have been</div>
<div class="joystick" id="leftStick" aria-label="Move joystick"><div class="knob" id="leftKnob"></div></div>
<div class="joystick" id="rightStick" aria-label="Turn joystick"><div class="knob rightKnob" id="rightKnob"></div></div>
<script>
(() => {
  const svgNS='http://www.w3.org/2000/svg', svg=document.getElementById('game'), world=document.getElementById('world');
  const W=1200,H=700, horizon=398, fov=1.02, poolSize=42, TAU=Math.PI*2;
  const state={x:0,z:0,yaw:0,bob:0,bobPhase:0,moving:0,started:false,drag:false,lastX:0,keys:new Set(),leftId:null,rightId:null,left:{x:0,y:0},right:{x:0,y:0},last:performance.now()};
  const types=['spire','lantern','mushroom','fern','stone'];
  const objects=[];
  const rand=(n)=>{const x=Math.sin(n*999.17)*43758.5453;return x-Math.floor(x)};
  const seeded=(i)=>{let s=i*73.17;return {x:(rand(s)-.5)*32,z:5+rand(s+2)*72,type:types[Math.floor(rand(s+4)*types.length)],scale:.68+rand(s+6)*.8,seed:s};};
  for(let i=0;i<75;i++){const a=seeded(i);if(Math.abs(a.x)<2.4&&a.z<14)a.x+=i%2?4:-4;objects.push(a)}
  function el(name,attrs={}){const n=document.createElementNS(svgNS,name);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
  function add(parent,name,attrs){const n=el(name,attrs);parent.appendChild(n);return n}
  function prop(type){const g=el('g');g.dataset.type=type;
    if(type==='spire'){add(g,'path',{d:'M-18 0 Q-10-36 0-55 Q10-36 18 0Z',fill:'url(#leaf)',opacity:.95});add(g,'path',{d:'M0-54V0',stroke:'#b6ffe0','stroke-width':2,opacity:.6});add(g,'circle',{cy:-48,r:5,fill:'#eaffd5',filter:'url(#glow)'});add(g,'path',{d:'M-12-18Q0-27 12-18',fill:'none',stroke:'#e1ffcd','stroke-width':2,opacity:.6})}
    if(type==='lantern'){add(g,'path',{d:'M-7 0L-5-45H5L7 0Z',fill:'url(#trunk)'});add(g,'path',{d:'M-14-44Q0-57 14-44L10-20Q0-12-10-20Z',fill:'#4a526e',stroke:'#92ffe3','stroke-width':2});add(g,'circle',{cy:-32,r:7,fill:'#d8ffc9',filter:'url(#glow)'});add(g,'path',{d:'M-9-48Q0-65 9-48',fill:'none',stroke:'#637f77','stroke-width':3})}
    if(type==='mushroom'){add(g,'path',{d:'M-5 0L-4-25H4L5 0Z',fill:'#d8c1b1'});add(g,'path',{d:'M-22-23Q-14-45 0-43Q14-45 22-23Q13-13 0-17Q-13-13-22-23Z',fill:'url(#mushroom)'});add(g,'circle',{cx:-9,cy:-28,r:3,fill:'#ffe7ff'});add(g,'circle',{cx:6,cy:-35,r:2,fill:'#ffe7ff'});add(g,'circle',{cx:13,cy:-23,r:2,fill:'#ffe7ff'})}
    if(type==='fern'){add(g,'path',{d:'M0 0Q-2-27 0-57',fill:'none',stroke:'#52d7ac','stroke-width':3});for(let i=0;i<5;i++){const y=-12-i*9;add(g,'path',{d:`M0 ${y}Q${-12-i*2} ${y-10} ${-24-i*2} ${y-4}`,fill:'none',stroke:'#86f4ba','stroke-width':3});add(g,'path',{d:`M0 ${y-5}Q${12+i*2} ${y-15} ${24+i*2} ${y-9}`,fill:'none',stroke:'#43ba96','stroke-width':3})}}
    if(type==='stone'){add(g,'path',{d:'M-24 0L-17-24 2-32 24-19 19 0Z',fill:'#324a55',stroke:'#719598','stroke-width':2});add(g,'path',{d:'M-12-20L2-25 12-18',fill:'none',stroke:'#a1d4bd','stroke-width':2,opacity:.5});add(g,'circle',{cx:-1,cy:-16,r:3,fill:'#a0ffcb',filter:'url(#glow)'})}
    return g;
  }
  const pool=[];for(let i=0;i<poolSize;i++){const g=el('g');world.appendChild(g);pool.push(g)}
  function renderObjects(){const visible=[];for(const o of objects){let dx=o.x-state.x,dz=o.z-state.z;const c=Math.cos(state.yaw),s=Math.sin(state.yaw),side=dx*c-dz*s,depth=dx*s+dz*c;if(depth>.8&&Math.abs(side)<depth*1.55)visible.push({...o,side,depth})}visible.sort((a,b)=>b.depth-a.depth);for(let i=0;i<poolSize;i++){const g=pool[i],o=visible[i];if(!o){g.setAttribute('display','none');continue}const scale=Math.min(9,310/o.depth)*o.scale;const sx=W/2+(o.side/o.depth)*(W/2/fov), sy=horizon+9;g.setAttribute('display','block');g.setAttribute('transform',`translate(${sx.toFixed(1)} ${(sy+state.bob).toFixed(1)}) scale(${scale.toFixed(3)})`);if(g.dataset.type!==o.type){g.replaceChildren(prop(o.type).firstChild);while(g.firstChild.nextSibling)g.removeChild(g.firstChild.nextSibling);const fresh=prop(o.type);g.replaceChildren(...fresh.childNodes);g.dataset.type=o.type}g.setAttribute('opacity',Math.max(.1,Math.min(1,1.25-o.depth/78)))}}
  function resize(){const r=svg.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${W} ${H}`);}
  function bearing(){const a=((state.yaw/TAU)%1+1)%1;return ['N','NE','E','SE','S','SW','W','NW'][Math.round(a*8)%8]}
  function updateReadout(){document.getElementById('depth').textContent=String(Math.floor(Math.max(0,state.z))).padStart(3,'0');document.getElementById('bearing').textContent=bearing()}
  function axis(){let move=0;if(state.keys.has('w')||state.keys.has('arrowup'))move+=1;if(state.keys.has('s')||state.keys.has('arrowdown'))move-=1;let turn=0;if(state.keys.has('a')||state.keys.has('arrowleft'))turn-=1;if(state.keys.has('d')||state.keys.has('arrowright'))turn+=1;return {move:Math.max(-1,Math.min(1,move+state.left.y)),turn:Math.max(-1,Math.min(1,turn+state.right.x))}}
  function loop(now){const dt=Math.min(.04,(now-state.last)/1000);state.last=now;const a=axis();state.moving=Math.abs(a.move)+Math.abs(a.turn);state.yaw+=a.turn*dt*1.75;state.z=Math.max(0,state.z+a.move*dt*8);state.x+=Math.sin(state.yaw)*a.move*dt*8;state.x=Math.max(-18,Math.min(18,state.x));state.bobPhase+=dt*(state.moving?11:4);state.bob=Math.sin(state.bobPhase)*Math.min(3.2,state.moving*2.1);renderObjects();updateReadout();if(state.moving&&!state.started){state.started=true;document.getElementById('hint').classList.add('hide')}requestAnimationFrame(loop)}
  window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();state.keys.add(k)});
  window.addEventListener('keyup',e=>state.keys.delete(e.key.toLowerCase()));
  svg.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){state.drag=true;state.lastX=e.clientX;svg.setPointerCapture(e.pointerId)}});svg.addEventListener('pointermove',e=>{if(state.drag){state.yaw+=(e.clientX-state.lastX)*.006;state.lastX=e.clientX}});svg.addEventListener('pointerup',()=>state.drag=false);svg.addEventListener('pointercancel',()=>state.drag=false);
  function stick(elm,knob,side){const max=42;function set(e){const r=elm.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y),m=Math.min(max,len),nx=len?x/len*m:0,ny=len?y/len*m:0;knob.style.transform=`translate(${nx}px,${ny}px)`;side.x=nx/max;side.y=-ny/max}function end(e){if(e.pointerId===state[side===state.left?'leftId':'rightId']){if(side===state.left)state.leftId=null;else state.rightId=null;side.x=side.y=0;knob.style.transform='translate(0,0)';elm.releasePointerCapture(e.pointerId)}}elm.addEventListener('pointerdown',e=>{e.preventDefault();if(side===state.left){if(state.leftId!==null)return;state.leftId=e.pointerId}else{if(state.rightId!==null)return;state.rightId=e.pointerId}elm.setPointerCapture(e.pointerId);set(e)});elm.addEventListener('pointermove',e=>{if(e.pointerId===(side===state.left?state.leftId:state.rightId))set(e)});elm.addEventListener('pointerup',end);elm.addEventListener('pointercancel',end)}
  stick(document.getElementById('leftStick'),document.getElementById('leftKnob'),state.left);stick(document.getElementById('rightStick'),document.getElementById('rightKnob'),state.right);
  window.addEventListener('resize',resize);resize();renderObjects();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
