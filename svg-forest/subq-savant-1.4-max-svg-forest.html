<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120b1a">
<meta name="description" content="Emberwold — walk an endless orchard of sleeping suns. A first-person world rendered entirely in SVG.">
<title>Emberwold — The Orchard of Sleeping Suns</title>
<style>
  :root { color-scheme: dark; --ink: #f4e3cd; --ink-dim: rgba(244,227,205,.6); }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0b0712; color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  #game { position: fixed; inset: 0; overflow: hidden; }
  #stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }

  .hud { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .titlecard {
    position: absolute; left: max(20px, env(safe-area-inset-left)); top: max(18px, env(safe-area-inset-top));
    animation: settle 2.4s ease 6s forwards;
  }
  .titlecard h1 {
    margin: 0; font-size: clamp(17px, 3vw, 25px); letter-spacing: .34em; font-weight: 500;
    text-transform: uppercase; text-shadow: 0 0 26px rgba(255,150,80,.5);
  }
  .titlecard .sub {
    margin: 5px 0 0; font-size: clamp(9px, 1.3vw, 11px); letter-spacing: .24em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .titlecard .lore {
    margin: 10px 0 0; max-width: 34ch; font-size: clamp(11px, 1.5vw, 13px);
    line-height: 1.5; font-style: italic; color: rgba(244,227,205,.5);
  }
  @keyframes settle { to { opacity: .16; } }

  .hint {
    position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%); margin: 0; font-size: clamp(9px, 2.4vw, 11px); letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-dim); white-space: nowrap;
    max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
    animation: settle 2.4s ease 7s forwards;
  }
  body.touch .hint { bottom: calc(max(18px, env(safe-area-inset-bottom)) + 146px); }

  /* Scoped to the hint: a bare `.touch` rule would also match <body class="touch">. */
  .hint .desk { display: inline; } .hint .touch { display: none; }
  body.touch .hint .desk { display: none; } body.touch .hint .touch { display: inline; }

  .stick {
    position: fixed; bottom: max(20px, env(safe-area-inset-bottom));
    width: 122px; height: 122px; border-radius: 50%;
    display: none; touch-action: none; z-index: 30;
    -webkit-user-select: none; user-select: none;
  }
  body.touch .stick { display: block; }
  #stickMove { left: max(16px, env(safe-area-inset-left)); }
  #stickTurn { right: max(16px, env(safe-area-inset-right)); }
  .stick .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(255,198,150,.26);
    background: radial-gradient(circle at 50% 50%, rgba(255,168,110,.10), rgba(255,168,110,.03) 58%, rgba(255,168,110,0) 72%);
  }
  .stick .knob {
    position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px;
    border-radius: 50%; will-change: transform;
    background: radial-gradient(circle at 38% 32%, rgba(255,226,188,.9), rgba(206,112,62,.55));
    box-shadow: 0 0 20px rgba(255,150,90,.45);
  }
  @media (max-height: 430px) {
    .stick { width: 98px; height: 98px; }
    .stick .knob { width: 40px; height: 40px; margin: -20px 0 0 -20px; }
  }
</style>
</head>
<body>
<div id="game">
  <svg id="stage" preserveAspectRatio="none" role="img" aria-label="Emberwold: an endless orchard of sleeping suns, rendered entirely in SVG"></svg>

  <div class="hud">
    <header class="titlecard">
      <h1>Emberwold</h1>
      <p class="sub">The Orchard of Sleeping Suns</p>
      <p class="lore">When the last sun closed its eye, the ember-gatherers buried its light like a seed. The seeds remembered being stars.</p>
    </header>
    <p class="hint">
      <span class="desk">WASD / arrows to walk &middot; drag to look</span>
      <span class="touch">Left stick walks &middot; right stick turns</span>
    </p>
  </div>

  <div class="stick" id="stickMove" aria-hidden="true"><div class="ring"></div><div class="knob"></div></div>
  <div class="stick" id="stickTurn" aria-hidden="true"><div class="ring"></div><div class="knob"></div></div>
</div>

<script>
(() => {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;

  /* ------------------------------------------------------------------ *
   * Deterministic hash noise. Every prop in the world comes from this,
   * so the world is stable: leave a clearing, come back, it is the same.
   * ------------------------------------------------------------------ */
  function h2(x, y, seed) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed | 0, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const mod = (a, b) => ((a % b) + b) % b;
  const wrapTo = (v, center, span) => center - span / 2 + mod(v - (center - span / 2), span);
  const wrapAngle = a => mod(a + Math.PI, TAU) - Math.PI;

  const TOUCH = (window.matchMedia && matchMedia('(hover: none) and (pointer: coarse)').matches)
    || 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (TOUCH) document.body.classList.add('touch');
  const QMAX = TOUCH ? 0.6 : 1;

  /* ------------------------------------------------------------------ *
   * The world, in metres
   * ------------------------------------------------------------------ */
  const EYE = 1.62;          // standing eye height
  const NEAR = 0.85;        // near clip for the ground plane
  const Z_MAX = 96;         // draw distance
  const CELL = 8;          // world cell size for prop scattering
  const FUR = 7.5;         // furrow spacing
  const SUN_ANGLE = -0.38;  // bearing of the sleeping sun
  // A prop is one metre-unit tall and scaled by f / depth, so a close one
  // would swallow the screen. Anything that would cover more than this
  // fraction of the viewport height is faded out instead of drawn.
  const MAX_PROP_SCREEN = 0.72;

  const GROUND_NEAR = [34, 17, 27];
  const GROUND_FAR = [182, 97, 47];   // exactly the sky's lowest stop: no horizon seam

  const SKY = [
    [0.00, '#090511'],
    [0.30, '#160c27'],
    [0.56, '#2b1230'],
    [0.78, '#4c2036'],
    [0.92, '#7d3a35'],
    [1.00, '#b6612f'],
  ];

  const BARK = '#160d17', LEAF = '#3b1a35', LEAF2 = '#57263c', LEAF_RIM = '#6d3043';
  const EMBER = '#ffae5e', EMBER_HOT = '#ffd9a2', LANTERN = '#8ff2da';

  /* ------------------------------------------------------------------ *
   * DOM
   * ------------------------------------------------------------------ */
  const stage = document.getElementById('stage');
  const camera = document.createElementNS(NS, 'g');
  const sky = document.createElementNS(NS, 'g');
  const world = document.createElementNS(NS, 'g');
  camera.append(sky, world);
  stage.append(camera);

  const canInnerHTML = (() => {
    try {
      const g = document.createElementNS(NS, 'g');
      g.innerHTML = '<rect/>';
      return g.childElementCount === 1;
    } catch (e) { return false; }
  })();

  function setMarkup(el, markup) {
    if (canInnerHTML) { el.innerHTML = markup; return; }
    const doc = new DOMParser().parseFromString('<svg xmlns="' + NS + '">' + markup + '</svg>', 'image/svg+xml');
    const src = doc.documentElement;
    const frag = document.createDocumentFragment();
    while (src.childNodes.length) frag.appendChild(document.importNode(src.childNodes[0], true));
    el.replaceChildren(frag);
  }

  /* ------------------------------------------------------------------ *
   * State
   * ------------------------------------------------------------------ */
  const S = {
    W: 1, H: 1, f: 800, cx: 0, hz: 0,
    px: 0, pz: 0, yaw: 0, pitchPx: 0,
    bobPhase: 0, bobAmp: 0, bobY: 0, bobX: 0,
    t: 0, avgDt: 16, quality: QMAX,
  };

  function focal(W, H) {
    const tn = deg => Math.tan(deg * Math.PI / 180);
    if (W / H < 0.85) {
      // portrait: a narrower horizontal field keeps the world from smearing
      return Math.min((W / 2) / tn(30), (H / 2) / tn(34));
    }
    const fH = (W / 2) / tn(39);    // 78 degrees horizontal
    const fV = (H / 2) / tn(27.5);  // 55 degrees vertical
    return Math.max(fH, fV);
  }

  function resize() {
    const W = Math.max(1, window.innerWidth), H = Math.max(1, window.innerHeight);
    S.W = W; S.H = H;
    S.f = focal(W, H);
    S.cx = W / 2;
    S.hz = Math.round(H * 0.55);
    S.pitchPx = clamp(S.pitchPx, -H * 0.16, H * 0.16);
    stage.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    buildSky();
    draw();
  }

  function buildSky() {
    const W = S.W, H = S.H, hz = S.hz;
    const stops = SKY.map(s => '<stop offset="' + (s[0] * 100).toFixed(1) + '%" stop-color="' + s[1] + '"/>').join('');
    const top = -H * 0.4;
    setMarkup(sky,
      '<defs>' +
        '<linearGradient id="skyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="' + top.toFixed(1) + '" x2="0" y2="' + hz.toFixed(1) + '">' + stops + '</linearGradient>' +
        '<linearGradient id="hazeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="' + (hz - H * 0.34).toFixed(1) + '" x2="0" y2="' + hz.toFixed(1) + '">' +
          '<stop offset="0%" stop-color="#c96a34" stop-opacity="0"/>' +
          '<stop offset="68%" stop-color="#c96a34" stop-opacity=".16"/>' +
          '<stop offset="100%" stop-color="#e08a45" stop-opacity=".42"/>' +
        '</linearGradient>' +
      '</defs>' +
      '<rect x="0" y="' + top.toFixed(1) + '" width="' + W + '" height="' + (hz - top + 1).toFixed(1) + '" fill="url(#skyGrad)"/>' +
      '<rect x="0" y="' + (hz - H * 0.34).toFixed(1) + '" width="' + W + '" height="' + (H * 0.34).toFixed(1) + '" fill="url(#hazeGrad)"/>');
  }

  /* ------------------------------------------------------------------ *
   * Props
   *
   * Local space: ground at y = 0, up is negative y, one unit = one metre.
   * Each returns { s: markup, h: height in metres } so the renderer can
   * cull by on-screen size before committing anything to the DOM.
   * ------------------------------------------------------------------ */

  // A sun-ember tree: a tapered sloe-dark trunk forking into thin boughs,
  // each bough ending in a flat drifting canopy, one dreaming sun hanging
  // in the crown. Shape varies with the hash so a stand never repeats.
  function propTree(r1, r2, r3) {
    const h = 5.6 + r1 * 3.8;
    const lean = (r2 - 0.5) * 1.4;
    const orbX = lean * 0.7 + (r3 - 0.5) * 1.1;
    const orbY = -h * 0.8;
    const w0 = 0.19 + r3 * 0.1, w1 = w0 * 0.34;
    const nB = 4 + Math.floor(h2(Math.round(r1 * 97), Math.round(r2 * 61), 41) * 3);
    let o =
      // tapered trunk, drawn as a filled shape so it narrows with height
      '<path d="M ' + (-w0).toFixed(2) + ' 0 C ' + (-w0 * 0.55).toFixed(2) + ' ' + (-h * 0.38).toFixed(2) + ' ' +
        (lean - w1 * 1.2).toFixed(2) + ' ' + (-h * 0.7).toFixed(2) + ' ' + (lean - w1).toFixed(2) + ' ' + (-h * 0.98).toFixed(2) +
        ' L ' + (lean + w1).toFixed(2) + ' ' + (-h * 0.98).toFixed(2) + ' C ' + (lean + w1 * 1.2).toFixed(2) + ' ' + (-h * 0.7).toFixed(2) + ' ' +
        (w0 * 0.55).toFixed(2) + ' ' + (-h * 0.38).toFixed(2) + ' ' + w0.toFixed(2) + ' 0 Z" fill="' + BARK + '"/>' +
      // root flare and shadow
      '<ellipse cx="0" cy="0" rx="' + (0.42 + r1 * 0.3).toFixed(2) + '" ry=".07" fill="#1d0d18" opacity=".6"/>';

    for (let i = 0; i < nB; i++) {
      const rr = h2(i, Math.round(r1 * 100), 7);
      const side = (i % 2) ? 1 : -1;
      const y0 = -h * (0.24 + (i / nB) * 0.6);
      const len = (0.8 + rr * 1.7) * (1 - i * 0.05);
      const ex = lean * 0.55 + side * len;
      const ey = y0 - len * (0.55 + rr * 0.7);
      o += '<path d="M ' + (lean * 0.5).toFixed(2) + ' ' + y0.toFixed(2) + ' Q ' + (lean * 0.5 + side * len * 0.45).toFixed(2) + ' ' +
        (y0 - len * 0.1).toFixed(2) + ' ' + ex.toFixed(2) + ' ' + ey.toFixed(2) +
        '" stroke="' + BARK + '" stroke-width="' + Math.max(0.035, 0.1 - i * 0.01).toFixed(3) + '" fill="none" stroke-linecap="round"/>';
      const rx = 0.72 + rr * 0.95, ry = 0.28 + rr * 0.26;
      o += '<ellipse cx="' + ex.toFixed(2) + '" cy="' + ey.toFixed(2) + '" rx="' + rx.toFixed(2) +
        '" ry="' + ry.toFixed(2) + '" fill="' + ((i % 2) ? LEAF2 : LEAF) + '" opacity=".96"/>';
      // a second lobe and a warm underside keep the canopy from reading as an oval
      o += '<ellipse cx="' + (ex + side * 0.26).toFixed(2) + '" cy="' + (ey - 0.14).toFixed(2) + '" rx="' + (rx * 0.52).toFixed(2) +
        '" ry="' + (ry * 0.62).toFixed(2) + '" fill="' + LEAF + '" opacity=".8"/>';
      o += '<ellipse cx="' + (ex + side * 0.1).toFixed(2) + '" cy="' + (ey + ry * 0.5).toFixed(2) + '" rx="' + (rx * 0.74).toFixed(2) +
        '" ry="' + (ry * 0.24).toFixed(2) + '" fill="' + LEAF_RIM + '" opacity=".45"/>';
    }

    o += '<circle cx="' + orbX.toFixed(2) + '" cy="' + orbY.toFixed(2) + '" r="' + (1.5 + r3 * 0.8).toFixed(2) + '" fill="url(#emberHalo)" opacity=".6"/>';
    o += '<circle cx="' + orbX.toFixed(2) + '" cy="' + orbY.toFixed(2) + '" r="' + (0.36 + r2 * 0.24).toFixed(2) + '" fill="url(#emberCore)"/>';
    o += '<circle cx="' + (orbX - 1.1).toFixed(2) + '" cy="' + (orbY + 0.95).toFixed(2) + '" r=".13" fill="' + EMBER_HOT + '" opacity=".8"/>';
    o += '<circle cx="' + (orbX + 0.9).toFixed(2) + '" cy="' + (orbY - 0.78).toFixed(2) + '" r=".09" fill="' + EMBER + '" opacity=".6"/>';
    return { s: o, h: h };
  }

  // A Hollow Warden: a slim faceless cowl, no eyes, a seam of ember where a
  // face would be, a lantern heart hanging in its open chest.
  function propWarden(r1, r2, r3) {
    const h = 3.1 + r1 * 1.1;
    const sway = (r2 - 0.5) * 0.3;
    const hy = -h * 0.44;                  // the lantern heart
    const hoodY = -h * 0.8;                // where the hood begins
    const hip = -h * 0.16;
    // One silhouette: shoulders up to the hood, down the other side, then a
    // ragged hem that always rests exactly on the ground line.
    const hem = [
      [-0.5, hip], [-0.46, 0], [-0.36, -h * 0.05], [-0.26, 0],
      [-0.14, -h * 0.06], [-0.02, 0], [0.1, -h * 0.05],
      [0.22, 0], [0.34, -h * 0.06], [0.46, 0], [0.5, hip],
    ].map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' L ');
    let o = '<path d="M ' + hem +
      ' C 0.34 ' + (-h * 0.6).toFixed(2) + ' ' + (0.24 + sway).toFixed(2) + ' ' + (hoodY + 0.4).toFixed(2) + ' ' + (sway + 0.11).toFixed(2) + ' ' + hoodY.toFixed(2) +
      ' L ' + (sway - 0.11).toFixed(2) + ' ' + hoodY.toFixed(2) +
      ' C ' + (-0.24 + sway).toFixed(2) + ' ' + (hoodY + 0.4).toFixed(2) + ' -0.34 ' + (-h * 0.6).toFixed(2) + ' -0.5 ' + hip.toFixed(2) +
      ' Z" fill="#130a15"/>' +
      // hood: an oval shell with a dark opening and a sliver of ember inside
      '<ellipse cx="' + sway.toFixed(2) + '" cy="' + (hoodY - 0.16).toFixed(2) + '" rx=".23" ry=".33" fill="#130a15"/>' +
      '<ellipse cx="' + sway.toFixed(2) + '" cy="' + (hoodY - 0.13).toFixed(2) + '" rx=".14" ry=".21" fill="#080409"/>' +
      '<path d="M ' + sway.toFixed(2) + ' ' + (hoodY - 0.28).toFixed(2) + ' L ' + sway.toFixed(2) + ' ' + (hoodY - 0.04).toFixed(2) +
        '" stroke="' + EMBER + '" stroke-width=".022" fill="none" opacity=".5" stroke-linecap="round"/>' +
      // shoulder rim catching the sleeping sun
      '<path d="M ' + (sway + 0.09).toFixed(2) + ' ' + (hoodY + 0.05).toFixed(2) + ' Q ' + (sway + 0.3).toFixed(2) + ' ' + (-h * 0.6).toFixed(2) + ' ' +
        (0.38 + sway).toFixed(2) + ' ' + (-h * 0.28).toFixed(2) + '" stroke="#5a2a3e" stroke-width=".035" fill="none" opacity=".75"/>' +
      // lantern heart, hanging in the open ribs
      '<circle cx="' + sway.toFixed(2) + '" cy="' + hy.toFixed(2) + '" r="' + (0.8 + r3 * 0.3).toFixed(2) + '" fill="url(#lanternHalo)" opacity=".55"/>' +
      '<path d="M ' + sway.toFixed(2) + ' ' + (hoodY + 0.1).toFixed(2) + ' L ' + sway.toFixed(2) + ' ' + (hy - 0.3).toFixed(2) +
        '" stroke="#130a15" stroke-width=".035"/>' +
      '<path d="M ' + (sway - 0.13).toFixed(2) + ' ' + (hy - 0.24).toFixed(2) + ' L ' + (sway + 0.13).toFixed(2) + ' ' + (hy - 0.24).toFixed(2) +
        ' L ' + (sway + 0.1).toFixed(2) + ' ' + (hy + 0.24).toFixed(2) + ' L ' + (sway - 0.1).toFixed(2) + ' ' + (hy + 0.24).toFixed(2) +
        ' Z" fill="#0d0710" stroke="#6fc9b8" stroke-width=".03"/>' +
      '<circle cx="' + sway.toFixed(2) + '" cy="' + hy.toFixed(2) + '" r=".075" fill="' + LANTERN + '"/>';
    return { s: o, h: h };
  }

  // An ember cairn: a leaning stack of stones around a live coal.
  function propCairn(r1, r2, r3) {
    const n = 3 + Math.floor(r1 * 3);
    let y = 0, w = 0.34 + r2 * 0.16, o = '';
    for (let i = 0; i < n; i++) {
      const ht = 0.13 + 0.11 * h2(i, 3, 17);
      const ww = w * (1 - i * 0.13);
      const xo = (h2(i, 5, 17) - 0.5) * 0.12;
      o += '<ellipse cx="' + xo.toFixed(2) + '" cy="' + (y - ht / 2).toFixed(2) + '" rx="' + ww.toFixed(2) +
        '" ry="' + (ht * 0.6).toFixed(2) + '" fill="' + ((i % 2) ? '#2b1a27' : '#38212f') + '"/>';
      o += '<ellipse cx="' + xo.toFixed(2) + '" cy="' + (y - ht * 0.86).toFixed(2) + '" rx="' + (ww * 0.8).toFixed(2) +
        '" ry="' + (ht * 0.16).toFixed(2) + '" fill="#57303f" opacity=".5"/>';
      y -= ht * 1.02;
    }
    const ey = y + 0.06;
    o += '<circle cx="0" cy="' + ey.toFixed(2) + '" r=".42" fill="url(#emberHalo)" opacity=".55"/>';
    o += '<circle cx="0" cy="' + ey.toFixed(2) + '" r=".075" fill="' + EMBER_HOT + '"/>';
    o += '<path d="M0 ' + (ey + 0.03).toFixed(2) + ' q .15 -.3 .04 -.55" stroke="' + EMBER + '" stroke-width=".035" fill="none" opacity="' + (0.35 + r3 * 0.4).toFixed(2) + '"/>';
    return { s: o, h: Math.abs(ey) + 0.3 };
  }

  // Ember grass: a tuft of curved blades, tips glowing.
  function propFern(r1, r2, r3) {
    const n = 5 + Math.floor(r1 * 3);
    let o = '';
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + ((i / Math.max(1, n - 1)) - 0.5) * 2.6 + (h2(i, 2, 29) - 0.5) * 0.25;
      const len = 0.26 + 0.3 * h2(i, 1, 23) + r2 * 0.16;
      const ex = Math.cos(a) * len, ey = Math.sin(a) * len * 0.95;
      const bend = (h2(i, 4, 29) - 0.5) * 0.3;
      o += '<path d="M0 0 Q ' + (ex * 0.42 + bend).toFixed(2) + ' ' + (ey * 0.62).toFixed(2) + ' ' + ex.toFixed(2) + ' ' + ey.toFixed(2) +
        '" stroke="#3a1c33" stroke-width="' + (0.03 + 0.02 * r3).toFixed(3) + '" fill="none" stroke-linecap="round"/>';
      if (i % 2 === 0) {
        o += '<circle cx="' + ex.toFixed(2) + '" cy="' + ey.toFixed(2) + '" r="' + (0.03 + 0.03 * r3).toFixed(3) +
          '" fill="' + EMBER_HOT + '" opacity=".8"/>';
      }
    }
    return { s: o, h: 0.85 };
  }

  // An ember gate: two posts and a lintel hung with a coal, a place the
  // gatherers once used to mark a row's end.
  function propArch(r1, r2, r3) {
    const h = 3.6 + r1 * 1.6;
    const w = 1.1 + r2 * 0.7;
    let o =
      '<path d="M ' + (-w).toFixed(2) + ' 0 L ' + (-w + 0.1).toFixed(2) + ' ' + (-h).toFixed(2) + ' L ' + (-w + 0.26).toFixed(2) + ' ' + (-h).toFixed(2) +
        ' L ' + (-w + 0.2).toFixed(2) + ' 0 Z" fill="#180d1a"/>' +
      '<path d="M ' + (w - 0.2).toFixed(2) + ' 0 L ' + (w - 0.26).toFixed(2) + ' ' + (-h).toFixed(2) + ' L ' + (w - 0.1).toFixed(2) + ' ' + (-h).toFixed(2) +
        ' L ' + w.toFixed(2) + ' 0 Z" fill="#180d1a"/>' +
      '<path d="M ' + (-w + 0.1).toFixed(2) + ' ' + (-h).toFixed(2) + ' Q 0 ' + (-h - 0.7).toFixed(2) + ' ' + (w - 0.1).toFixed(2) + ' ' + (-h).toFixed(2) +
        '" fill="none" stroke="#180d1a" stroke-width=".2" stroke-linecap="round"/>' +
      '<circle cx="0" cy="' + (-h - 0.52).toFixed(2) + '" r="0.95" fill="url(#emberHalo)" opacity=".5"/>' +
      '<circle cx="0" cy="' + (-h - 0.52).toFixed(2) + '" r=".13" fill="' + EMBER_HOT + '"/>' +
      '<path d="M 0 ' + (-h - 0.36).toFixed(2) + ' L 0 ' + (-h + 0.1).toFixed(2) + '" stroke="' + EMBER + '" stroke-width=".035" opacity=".4" stroke-dasharray=".12 .12"/>' +
      '<circle cx="' + (-w + 0.18).toFixed(2) + '" cy="' + (-h * 0.5).toFixed(2) + '" r="0.34" fill="url(#lanternHalo)" opacity=".4"/>' +
      '<circle cx="' + (w - 0.18).toFixed(2) + '" cy="' + (-h * 0.68).toFixed(2) + '" r="0.34" fill="url(#lanternHalo)" opacity=".4"/>';
    return { s: o, h: h + 0.8 };
  }

  /* ------------------------------------------------------------------ *
   * Renderer: project the world into SVG every frame, depth sorted.
   * Off-screen things are never created, and each frame replaces the
   * previous one wholesale, so no nodes accumulate as you walk.
   * ------------------------------------------------------------------ */
  function draw() {
    const W = S.W, H = S.H, f = S.f, cx = S.cx, hz = S.hz;
    const px = S.px, pz = S.pz, yaw = S.yaw, t = S.t, q = S.quality;
    const eye = EYE + S.bobY;         // head-bob as real parallax: eye height
    const lat = S.bobX;               // ...and a small lateral sway
    const c = Math.cos(yaw), sn = Math.sin(yaw);
    const camX = (dx, dz) => dx * c - dz * sn - lat;
    const camZ = (dx, dz) => dx * sn + dz * c;
    const parts = [];

    /* ---- the sleeping sun: infinitely distant, so it turns but never
       slides as you walk. Drawn as a closed eye on the horizon. ---- */
    const sunDa = wrapAngle(SUN_ANGLE - yaw);
    const sunX = cx + f * Math.tan(clamp(sunDa, -1.3, 1.3));
    if (Math.abs(sunDa) < 1.3) {
      const R = Math.max(20, f * 0.1);
      const w = R * 1.75;          // half-width of the closed eye
      const hUp = R * 0.34;        // how far the seam bows upward
      const hDn = R * 0.5;         // how far the light spills below it
      let lashes = '';
      for (let i = -4; i <= 4; i++) {
        const u = i / 4;
        // points along the seam, and the droop of each lash
        const lx = u * w * 0.94;
        const ly = -hUp * (1 - u * u);
        const droop = R * (0.3 - Math.abs(u) * 0.1);
        lashes += '<path d="M ' + lx.toFixed(1) + ' ' + ly.toFixed(1) + ' q ' + (u * R * 0.07).toFixed(1) + ' ' +
          (droop * 0.5).toFixed(1) + ' ' + (u * R * 0.16).toFixed(1) + ' ' + droop.toFixed(1) +
          '" stroke="#200b17" stroke-width="' + (R * 0.024).toFixed(1) + '" stroke-linecap="round" fill="none" opacity=".9"/>';
      }
      parts.push('<g transform="translate(' + sunX.toFixed(1) + ' ' + hz.toFixed(1) + ')">' +
        // a sun still burning under its lid: wide low halo
        '<ellipse cx="0" cy="' + (-hUp * 0.4).toFixed(1) + '" rx="' + (w * 3.4).toFixed(1) + '" ry="' + (R * 1.5).toFixed(1) + '" fill="url(#sunHalo)"/>' +
        // the light that escapes the closure: a lens, upper arc the seam,
        // lower arc spilling into the horizon
        '<path d="M ' + (-w).toFixed(1) + ' 0 Q 0 ' + (-hUp * 1.25).toFixed(1) + ' ' + w.toFixed(1) + ' 0 Q 0 ' + hDn.toFixed(1) +
          ' ' + (-w).toFixed(1) + ' 0 Z" fill="url(#sunCore)" opacity=".95"/>' +
        // a hotter core right at the seam
        '<ellipse cx="0" cy="' + (-hUp * 0.2).toFixed(1) + '" rx="' + (w * 0.34).toFixed(1) + '" ry="' + (R * 0.16).toFixed(1) +
          '" fill="#fff6e4" opacity=".95"/>' +
        // the lid: a heavy dome over the light, its lower edge the closed seam
        '<path d="M ' + (-w).toFixed(1) + ' 0 Q 0 ' + (-hUp * 1.25).toFixed(1) + ' ' + w.toFixed(1) + ' 0 Q 0 ' +
          (-hUp * 1.95).toFixed(1) + ' ' + (-w).toFixed(1) + ' 0 Z" fill="#22101d"/>' +
        // the seam, a thread of light along the closure
        '<path d="M ' + (-w).toFixed(1) + ' 0 Q 0 ' + (-hUp * 1.25).toFixed(1) + ' ' + w.toFixed(1) + ' 0' +
          '" fill="none" stroke="#ffd9a2" stroke-width="' + (R * 0.055).toFixed(1) + '" opacity=".85" stroke-linecap="round"/>' +
        lashes + '</g>');
    }

    /* ---- a few stars, fixed to the sky dome ---- */
    const nStars = Math.round(64 * q);
    for (let k = 0; k < nStars; k++) {
      const da = wrapAngle(h2(k, 0, 91) * TAU - yaw);
      if (Math.abs(da) > 1.3) continue;
      const sx = cx + f * Math.tan(da);
      if (sx < -10 || sx > W + 10) continue;
      const sy = hz - (0.05 + 0.8 * h2(k, 1, 91)) * hz;
      const r = 0.5 + 1.5 * h2(k, 2, 91);
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * (0.6 + 1.8 * h2(k, 3, 91)) + k * 2.1));
      parts.push('<circle cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="' + r.toFixed(2) +
        '" fill="#ffeacd" opacity="' + (tw * 0.7).toFixed(2) + '"/>');
    }

    /* ---- ground: bands of soil receding to the horizon ---- */
    const yTop = hz, yBot = H + 140;
    const zAtY = y => f * eye / Math.max(0.5, y - hz);
    const nBands = Math.max(18, Math.round(44 * q));
    const edges = new Array(nBands + 1);
    for (let i = 0; i <= nBands; i++) {
      const u = i / nBands;
      edges[i] = yTop + (yBot - yTop) * Math.pow(u, 1.16);
    }
    for (let i = 0; i < nBands; i++) {
      const y0 = edges[i], y1 = edges[i + 1];
      const fog = Math.pow(1 - Math.exp(-Math.min(zAtY(y1), Z_MAX) / 34), 0.72);
      parts.push('<rect x="0" y="' + y0.toFixed(1) + '" width="' + W + '" height="' + (y1 - y0 + 0.7).toFixed(1) +
        '" fill="rgb(' + Math.round(GROUND_NEAR[0] + (GROUND_FAR[0] - GROUND_NEAR[0]) * fog) + ',' +
        Math.round(GROUND_NEAR[1] + (GROUND_FAR[1] - GROUND_NEAR[1]) * fog) + ',' +
        Math.round(GROUND_NEAR[2] + (GROUND_FAR[2] - GROUND_NEAR[2]) * fog) + ')"/>');
    }

    /* the sleeping sun's light pooling on the soil */
    parts.push('<ellipse cx="' + clamp(sunX, -W * 0.4, W * 1.4).toFixed(1) + '" cy="' + hz.toFixed(1) +
      '" rx="' + (W * 0.8).toFixed(1) + '" ry="' + ((H - hz) * 1.2 + 40).toFixed(1) +
      '" fill="url(#groundGlow)" opacity=".55"/>');

    /* ---- furrows: world-space lines on the soil, clipped at the near plane ---- */
    function seg(ax, az, bx, bz, warm) {
      let axc = camX(ax - px, az - pz), azc = camZ(ax - px, az - pz);
      let bxc = camX(bx - px, bz - pz), bzc = camZ(bx - px, bz - pz);
      if (azc < NEAR && bzc < NEAR) return '';
      if (azc < NEAR) { const k = (NEAR - azc) / (bzc - azc); axc += (bxc - axc) * k; azc += (bzc - azc) * k; }
      else if (bzc < NEAR) { const k = (NEAR - bzc) / (azc - bzc); bxc += (axc - bxc) * k; bzc += (azc - bzc) * k; }
      const x1 = cx + f * axc / azc, y1 = hz + f * eye / azc;
      const x2 = cx + f * bxc / bzc, y2 = hz + f * eye / bzc;
      if ((x1 < -40 && x2 < -40) || (x1 > W + 40 && x2 > W + 40)) return '';
      if (y1 > H + 400 && y2 > H + 400) return '';
      const zm = Math.min((azc + bzc) * 0.5, Z_MAX);
      const op = Math.exp(-zm / 26) * (warm ? 0.5 : 0.34);
      if (op < 0.03) return '';
      return '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) +
        '" stroke="' + (warm ? '#ffb87a' : '#ff9a5e') + '" stroke-width="1" opacity="' + op.toFixed(2) + '"/>';
    }

    const m0 = Math.round(px / FUR);
    for (let k = -7; k <= 7; k++) {
      const wx = (m0 + k) * FUR;
      parts.push(seg(wx, pz - 45, wx, pz + 110, false));
    }
    const n0 = Math.round((pz - 20) / FUR), n1 = Math.round((pz + 110) / FUR);
    for (let m = n0; m <= n1; m++) parts.push(seg(px - 46, m * FUR, px + 46, m * FUR, true));

    /* ---- embers dropped on the soil ---- */
    const nDrop = Math.round(34 * q);
    for (let k = 0; k < nDrop; k++) {
      const dx = wrapTo(h2(k, 0, 55) * 211.7, px, 60) - px;
      const dz = wrapTo(h2(k, 1, 55) * 211.7, pz, 60) - pz;
      const Z = camZ(dx, dz);
      if (Z < NEAR || Z > 46) continue;
      const sx = cx + f * camX(dx, dz) / Z;
      if (sx < -20 || sx > W + 20) continue;
      const sy = hz + f * eye / Z;
      if (sy > H + 30) continue;
      const rr = Math.max(0.5, f * 0.04 / Z);
      parts.push('<ellipse cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" rx="' + rr.toFixed(2) +
        '" ry="' + (rr * 0.34).toFixed(2) + '" fill="#ff9a52" opacity="' + (Math.exp(-Z / 22) * 0.9).toFixed(2) + '"/>');
    }

    /* ---- props: scattered per cell, depth sorted, culled by what they
       would actually cover on screen ---- */
    const props = [];
    const RAD = Math.ceil(Z_MAX / CELL) + 1;
    const ci = Math.floor(px / CELL), cj = Math.floor(pz / CELL);
    for (let i = ci - RAD; i <= ci + RAD; i++) {
      for (let j = cj - RAD; j <= cj + RAD; j++) {
        const dx = (i * CELL + h2(i, j, 1) * CELL) - px;
        const dz = (j * CELL + h2(i, j, 2) * CELL) - pz;
        const Z = camZ(dx, dz);
        if (Z < 1.2 || Z > Z_MAX) continue;
        const sx = cx + f * camX(dx, dz) / Z;
        if (sx < -W * 0.35 || sx > W * 1.35) continue;

        const grove = 0.5 + 0.5 * Math.sin(i * 0.33 + j * 0.21) * Math.cos(j * 0.27 - i * 0.11);
        const dens = (0.34 + 0.42 * grove) * (0.55 + 0.45 * q);
        if (h2(i, j, 3) > dens) continue;

        const r1 = h2(i, j, 13), r2 = h2(i, j, 17), r3 = h2(i, j, 19);
        const kind = h2(i, j, 5);
        const p = kind < 0.42 ? propFern(r1, r2, r3)
          : kind < 0.74 ? propTree(r1, r2, r3)
          : kind < 0.89 ? propCairn(r1, r2, r3)
          : kind < 0.975 ? propWarden(r1, r2, r3)
          : propArch(r1, r2, r3);

        const sc = f / Z;
        const screenH = p.h * sc;                 // metres * px per metre = px
        const cap = H * MAX_PROP_SCREEN;
        if (screenH > cap) continue;              // would fill the view: skip
        const shrink = clamp((cap - screenH) / (H * 0.3), 0, 1);
        const fog = Math.exp(-Z / 30);
        const op = fog * shrink;
        if (op < 0.08) continue;

        const flip = h2(i, j, 23) > 0.5 ? -1 : 1;
        props.push({
          z: Z,
          g: '<g transform="translate(' + sx.toFixed(1) + ' ' + (hz + f * eye / Z).toFixed(1) + ') scale(' +
             (flip * sc).toFixed(3) + ' ' + sc.toFixed(3) + ')" opacity="' + op.toFixed(2) + '">' + p.s + '</g>'
        });
      }
    }

    /* ---- ember moths, drifting between the sleeping suns ---- */
    const nMoths = Math.round(22 * q);
    for (let k = 0; k < nMoths; k++) {
      const dx = wrapTo(h2(k, 0, 31) * 380 + Math.sin(t * 0.6 + k) * 2.2, px, 60) - px;
      const dz = wrapTo(h2(k, 1, 31) * 380 + Math.cos(t * 0.44 + k * 1.7) * 2.2, pz, 60) - pz;
      const Z = camZ(dx, dz);
      if (Z < 1.6 || Z > 60) continue;
      const sx = cx + f * camX(dx, dz) / Z;
      if (sx < -30 || sx > W + 30) continue;
      const hy = 0.7 + 3.4 * h2(k, 2, 31) + Math.sin(t * 1.2 + k) * 0.3;
      const sy = hz + f * (eye - hy) / Z;
      if (sy < -40 || sy > H + 40) continue;
      const rr = Math.max(0.7, 0.05 * f / Z);
      const op = Math.exp(-Z / 26) * (0.55 + 0.45 * Math.sin(t * 2.2 + k * 3.1));
      if (op <= 0.02) continue;
      props.push({
        z: Z,
        g: '<g transform="translate(' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ')" opacity="' + op.toFixed(2) + '">' +
           '<circle r="' + (rr * 4.2).toFixed(1) + '" fill="url(#emberHalo)"/>' +
           '<circle r="' + rr.toFixed(2) + '" fill="#ffd9a2"/></g>'
      });
    }

    props.sort((a, b) => b.z - a.z);
    for (let k = 0; k < props.length; k++) parts.push(props[k].g);

    setMarkup(world, parts.join(''));
  }

  /* ------------------------------------------------------------------ *
   * Input
   * ------------------------------------------------------------------ */
  const keys = new Set();
  const stickMove = { x: 0, y: 0 }, stickTurn = { x: 0, y: 0 };

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'a' || k === 's' || k === 'd' || k.startsWith('arrow')) {
      keys.add(k);
      e.preventDefault();
    }
  });
  addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  addEventListener('blur', () => keys.clear());

  /* desktop: click and drag to look */
  let dragId = null, lastX = 0, lastY = 0;
  stage.addEventListener('pointerdown', e => {
    if (dragId !== null) return;
    dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
    try { stage.setPointerCapture(dragId); } catch (err) { /* ignore */ }
  });
  stage.addEventListener('pointermove', e => {
    if (e.pointerId !== dragId) return;
    S.yaw += (e.clientX - lastX) * 0.0026;
    S.pitchPx = clamp(S.pitchPx - (e.clientY - lastY) * 0.9, -S.H * 0.16, S.H * 0.16);
    lastX = e.clientX; lastY = e.clientY;
  });
  const endDrag = e => { if (e.pointerId === dragId) dragId = null; };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('lostpointercapture', endDrag);

  /* Two on-screen sticks. Each keeps its own pointer id, so both thumbs
     stay live at once: walk and turn at the same time. */
  function bindStick(el, state) {
    const knob = el.querySelector('.knob');
    const RADIUS = 46;
    let pid = null, ox = 0, oy = 0;
    const move = e => {
      let dx = e.clientX - ox, dy = e.clientY - oy;
      const d = Math.hypot(dx, dy) || 1;
      if (d > RADIUS) { dx = dx / d * RADIUS; dy = dy / d * RADIUS; }
      knob.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
      state.x = dx / RADIUS; state.y = dy / RADIUS;
    };
    const end = e => {
      if (e.pointerId !== pid) return;
      pid = null; state.x = 0; state.y = 0;
      knob.style.transform = '';
    };
    el.addEventListener('pointerdown', e => {
      if (pid !== null) return;
      pid = e.pointerId;
      const b = el.getBoundingClientRect();
      ox = b.left + b.width / 2; oy = b.top + b.height / 2;
      try { el.setPointerCapture(pid); } catch (err) { /* ignore */ }
      move(e);
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => {
      if (e.pointerId !== pid) return;
      move(e);
      e.preventDefault();
    });
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('lostpointercapture', end);
  }
  bindStick(document.getElementById('stickMove'), stickMove);
  bindStick(document.getElementById('stickTurn'), stickTurn);

  /* keep the mobile browser from scrolling, pinching or swipe-navigating */
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  /* ------------------------------------------------------------------ *
   * Simulation
   * ------------------------------------------------------------------ */
  const SPEED = 5.2, TURN = 2.0;
  const BOB_Y = 0.055, BOB_X = 0.03;   // metres of head travel

  function update(dt) {
    let fwd = 0, turn = 0;
    if (keys.has('w') || keys.has('arrowup')) fwd += 1;
    if (keys.has('s') || keys.has('arrowdown')) fwd -= 1;
    if (keys.has('a') || keys.has('arrowleft')) turn -= 1;
    if (keys.has('d') || keys.has('arrowright')) turn += 1;
    fwd -= stickMove.y;
    turn += stickTurn.x;
    fwd = clamp(fwd, -1, 1);
    turn = clamp(turn, -1, 1);

    S.px += Math.sin(S.yaw) * fwd * SPEED * dt;
    S.pz += Math.cos(S.yaw) * fwd * SPEED * dt;
    S.yaw += turn * TURN * dt;

    const moving = Math.abs(fwd) > 0.05 || Math.abs(turn) > 0.05;
    if (moving) S.bobPhase += dt * (7.4 + Math.abs(fwd) * 3.2);
    S.bobAmp += ((moving ? 1 : 0) - S.bobAmp) * Math.min(1, dt * 9);
    // vertical bob at the stride rate, lateral sway at half of it
    S.bobY = Math.sin(S.bobPhase) * BOB_Y * S.bobAmp;
    S.bobX = Math.cos(S.bobPhase * 0.5) * BOB_X * S.bobAmp;
  }

  function applyCamera() {
    camera.setAttribute('transform', 'translate(0 ' + S.pitchPx.toFixed(2) + ')');
  }

  /* ------------------------------------------------------------------ *
   * Shared glows. Everything is gradients and shapes: no SVG filters,
   * which would cost a full-surface blur every frame.
   * ------------------------------------------------------------------ */
  function buildDefs() {
    const d = document.createElementNS(NS, 'defs');
    setMarkup(d,
      '<radialGradient id="sunHalo"><stop offset="0" stop-color="#ffb066" stop-opacity=".42"/>' +
        '<stop offset="38%" stop-color="#ff8a4a" stop-opacity=".16"/><stop offset="100%" stop-color="#ff6a2a" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="sunCore"><stop offset="0" stop-color="#fff3d6"/>' +
        '<stop offset="55%" stop-color="#ffcf8a"/><stop offset="100%" stop-color="#f0853c" stop-opacity=".35"/></radialGradient>' +
      '<radialGradient id="groundGlow"><stop offset="0" stop-color="#ff9c52" stop-opacity=".5"/>' +
        '<stop offset="45%" stop-color="#e0703a" stop-opacity=".16"/><stop offset="100%" stop-color="#a04a28" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="emberHalo"><stop offset="0" stop-color="#ffd9a2" stop-opacity=".95"/>' +
        '<stop offset="35%" stop-color="#ff9d4d" stop-opacity=".45"/><stop offset="100%" stop-color="#ff6a1e" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="emberCore"><stop offset="0" stop-color="#fff6e4"/>' +
        '<stop offset="60%" stop-color="#ffc47a"/><stop offset="100%" stop-color="#ff8a3c" stop-opacity=".2"/></radialGradient>' +
      '<radialGradient id="lanternHalo"><stop offset="0" stop-color="#bafff2" stop-opacity=".9"/>' +
        '<stop offset="42%" stop-color="#5fe0cc" stop-opacity=".35"/><stop offset="100%" stop-color="#2ea79a" stop-opacity="0"/></radialGradient>');
    stage.append(d);
  }

  /* ------------------------------------------------------------------ *
   * Main loop
   * ------------------------------------------------------------------ */
  let last = 0, lastDraw = 0, lastKey = '';
  function loop(now) {
    const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016);
    last = now;
    S.t += dt;

    // Trim detail before frames are dropped on slower devices.
    S.avgDt = S.avgDt * 0.92 + dt * 1000 * 0.08;
    if (S.avgDt > 24) S.quality = Math.max(0.4, S.quality * 0.97);
    else if (S.avgDt < 15) S.quality = Math.min(QMAX, S.quality * 1.01);

    update(dt);
    applyCamera();

    const key = S.px.toFixed(2) + ',' + S.pz.toFixed(2) + ',' + S.yaw.toFixed(4) + ',' +
                S.pitchPx.toFixed(1) + ',' + S.bobY.toFixed(2) + ',' + S.bobX.toFixed(2) + ',' + S.quality.toFixed(2);
    if (key !== lastKey || S.t - lastDraw > 0.07) {
      draw();
      lastKey = key;
      lastDraw = S.t;
    }
    requestAnimationFrame(loop);
  }

  /* ------------------------------------------------------------------ *
   * Boot
   * ------------------------------------------------------------------ */
  buildDefs();
  resize();
  addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 120));
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
