/* ============================================================================
   WEFTRUNNER — THE LAST BOLT
   A rail shooter on the Great Loom.  Zero dependencies, one file.

   The world is a cloth. Ahead is the Beam, where new cloth is born.
   Behind is the Fray, where it comes undone. You are a Mender. Run the weft.
   ========================================================================= */

/* ------------------------------------------------------------------ math -- */
const PI = Math.PI, TAU = PI * 2;
const abs = Math.abs, min = Math.min, max = Math.max, sqrt = Math.sqrt;
const sin = Math.sin, cos = Math.cos, pow = Math.pow, atan2 = Math.atan2;
const floor = Math.floor, ceil = Math.ceil, rnd = Math.random;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function rr(a, b) { return a + rnd() * (b - a); }
function ri(a, b) { return (a + rnd() * (b - a + 1)) | 0; }
function pick(arr) { return arr[(rnd() * arr.length) | 0]; }
function chance(p) { return rnd() < p; }
function sign(v) { return v < 0 ? -1 : v > 0 ? 1 : 0; }
function ease(t) { return t * t * (3 - 2 * t); }
function easeOut(t) { return 1 - (1 - t) * (1 - t); }
function easeIn(t) { return t * t; }
function approach(cur, tgt, rate) {
  if (cur < tgt) return min(tgt, cur + rate);
  return max(tgt, cur - rate);
}
/* deterministic value noise for cloth grain / stains */
function hash2(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const xi = floor(x), yi = floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

/* ----------------------------------------------------------------- color -- */
function hx(s) { const n = parseInt(s.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgb(r, g, b) { return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")"; }
function rgba(r, g, b, a) { return "rgba(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + "," + a + ")"; }
function C(c) { return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")"; }
function CA(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + a + ")"; }
function mixc(a, b, t, out) {
  out = out || [0, 0, 0];
  out[0] = a[0] + (b[0] - a[0]) * t;
  out[1] = a[1] + (b[1] - a[1]) * t;
  out[2] = a[2] + (b[2] - a[2]) * t;
  return out;
}
function scalec(a, k, out) {
  out = out || [0, 0, 0];
  out[0] = clamp(a[0] * k, 0, 255); out[1] = clamp(a[1] * k, 0, 255); out[2] = clamp(a[2] * k, 0, 255);
  return out;
}

let dprScale = 1;          /* dropped automatically if frames get expensive  */
function resize() {
  const w = max(320, window.innerWidth | 0), h = max(240, window.innerHeight | 0);
  const area = w * h;
  DPR = min(window.devicePixelRatio || 1, area > 2600000 ? 1.35 : 2) * dprScale;
  DPR = max(0.62, DPR);
  W = w; H = h;
  cv.width = (w * DPR) | 0; cv.height = (h * DPR) | 0;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W * 0.5; HALFW = CX;
  F = H * 0.85;
  CY = H * 0.44;
  PLAY_W = clamp(6.29 * (W / H), 6.0, 9.6);
  const pad = 46;
  for (let i = 0; i <= GX; i++) SXS[i] = -pad + (W + pad * 2) * (i / GX);
  buildOverlay();
  skyDirty = true;
}

window.addEventListener("keydown", e => {
  if (e.repeat) { if (e.code === "Space") e.preventDefault(); return; }
  keys[e.code] = true;
  if (e.code === "Space" || e.code === "Enter") { anyKeyEdge = true; e.preventDefault(); }
  if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyZ") dashEdge = true;
  if (e.code === "KeyP" || e.code === "Escape") pauseEdge = true;

  if (e.code === "KeyR") G.restartEdge = true;
  if (KEYMAP[e.code]) { IN.mode = "key"; e.preventDefault(); }

window.addEventListener("keyup", e => { keys[e.code] = false; });
window.addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  IN.mouseDown = false; IN.fire = false;
});

cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  IN.mx = e.clientX - r.left; IN.my = e.clientY - r.top;
  IN.mouseT = G.t; IN.mode = "mouse";

cv.addEventListener("mousedown", e => {
  if (e.button === 0) { IN.mouseDown = true; anyKeyEdge = true; }
  if (e.button === 2) { dashEdge = true; }
  e.preventDefault();
});
window.addEventListener("mouseup", e => { if (e.button === 0) IN.mouseDown = false; });

/* touch is not a supported control scheme, but do not let it scroll the page */
cv.addEventListener("touchstart", e => { anyKeyEdge = true; e.preventDefault(); }, { passive: false });

function readInput() {
  const l = keys.ArrowLeft || keys.KeyA, r = keys.ArrowRight || keys.KeyD;
  const u = keys.ArrowUp || keys.KeyW, d = keys.ArrowDown || keys.KeyS;
  IN.x = (r ? 1 : 0) - (l ? 1 : 0);
  IN.y = (u ? 1 : 0) - (d ? 1 : 0);
  if (IN.x || IN.y) IN.mode = "key";
  IN.fire = IN.mouseDown || !!keys.Space || !!keys.KeyJ;
}

/* ----------------------------------------------------------- projection -- */
/* Camera looks straight down +z.  Screen shake is folded into the centre. */
let camX = 0, camY = CAM_H, shX = 0, shY = 0, shRot = 0, fovK = 1;
let scrX = 0, scrY = 0, scrS = 0;    /* scratch outputs from project()        */

function project(wx, wy, wz) {
  if (wz < 0.05) wz = 0.05;
  const k = (F * fovK) / wz;
  scrX = CX + shX + (wx - camX) * k;
  scrY = CY + shY + (camY - wy) * k;
  scrS = k;
  return k;
}
function screenScale(wz) { return (F * fovK) / (wz < 0.05 ? 0.05 : wz); }

/* the cloth is not flat — it breathes, and it is hanging from something */
let waveAmp = 1.05, waveT = 0;
function clothY(x, z) {
  return waveAmp * (
    sin(z * 0.041 + waveT * 1.05) * 0.50 +
    sin(x * 0.086 - z * 0.021 + waveT * 0.72) * 0.30 +
    sin(x * 0.030 + z * 0.058 - waveT * 0.51) * 0.22
  );
}
function clothDZ(x, z) {
  return waveAmp * (
    0.041 * cos(z * 0.041 + waveT * 1.05) * 0.50 -
    0.021 * cos(x * 0.086 - z * 0.021 + waveT * 0.72) * 0.30 +
    0.058 * cos(x * 0.030 + z * 0.058 - waveT * 0.51) * 0.22
  );
}
function clothDX(x, z) {
  return waveAmp * (
    0.086 * cos(x * 0.086 - z * 0.021 + waveT * 0.72) * 0.30 +
    0.030 * cos(x * 0.030 + z * 0.058 - waveT * 0.51) * 0.22
  );
}

    comp.threshold.value = -14; comp.knee.value = 24; comp.ratio.value = 5;
    comp.attack.value = 0.004; comp.release.value = 0.22;
    comp.connect(c.destination);

    this.master = c.createGain(); this.master.gain.value = 0.85; this.master.connect(comp);
    this.musicBus = c.createGain(); this.musicBus.gain.value = 0.9; this.musicBus.connect(this.master);
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.95; this.sfxBus.connect(this.master);

    this.pluckBright = this._ks(110, 3.0, 0.9942, 0.55);
    this.pluckSoft = this._ks(110, 3.4, 0.9962, 0.20);
    this.noiseBuf = this._noise(1.6);

    /* sustained drone: three detuned saws through a slow filter */
    this.padGain = c.createGain(); this.padGain.gain.value = 0; this.padGain.connect(this.musicBus);
    const pf = c.createBiquadFilter(); pf.type = "lowpass"; pf.frequency.value = 620; pf.Q.value = 0.7;
    pf.connect(this.padGain);
    this.padFilter = pf;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = c.createGain(); lfoG.gain.value = 190;
    lfo.connect(lfoG); lfoG.connect(pf.frequency); lfo.start();
    this.padOsc = [];
    for (let i = 0; i < 3; i++) {
      const o = c.createOscillator(); o.type = i === 2 ? "triangle" : "sawtooth";
      const g = c.createGain(); g.gain.value = i === 2 ? 0.5 : 0.28;
      o.connect(g); g.connect(pf); o.start();
      this.padOsc.push({ o, g });
    }

    /* the loom room: a low mechanical hum that lives under everything */
    this.loomGain = c.createGain(); this.loomGain.gain.value = 0; this.loomGain.connect(this.musicBus);
    const hum = c.createOscillator(); hum.type = "triangle"; hum.frequency.value = 48.5;
    const hum2 = c.createOscillator(); hum2.type = "sine"; hum2.frequency.value = 73.2;
    const hg = c.createGain(); hg.gain.value = 0.5;
    hum.connect(hg); hum2.connect(hg); hg.connect(this.loomGain);
    hum.start(); hum2.start();

    /* airflow — the cloth going past. tied to speed. */
    this.windGain = c.createGain(); this.windGain.gain.value = 0; this.windGain.connect(this.master);
    const wsrc = c.createBufferSource(); wsrc.buffer = this.noiseBuf; wsrc.loop = true;
    const wf = c.createBiquadFilter(); wf.type = "bandpass"; wf.frequency.value = 480; wf.Q.value = 0.55;
    const wf2 = c.createBiquadFilter(); wf2.type = "highpass"; wf2.frequency.value = 180;
    wsrc.connect(wf); wf.connect(wf2); wf2.connect(this.windGain); wsrc.start();
    this.windFilter = wf;

    this.ok = true;
    this.nextT = c.currentTime + 0.06;
    /* re-apply whatever track was selected before the context existed */
    const tn = this.trackName;
    this.trackName = "␀";
    this.setTrack(tn || "title");
  },

  /* Karplus-Strong: a real plucked string, rendered once, then pitched by rate */
  _ks(f0, dur, damp, bright) {
    const c = this.ctx, sr = c.sampleRate;
    const N = max(2, Math.round(sr / f0)), len = ceil(sr * dur);
    const buf = c.createBuffer(1, len, sr), d = buf.getChannelData(0);
    const ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = rnd() * 2 - 1;
    let p = 0;
    for (let i = 0; i < N; i++) { p += (ring[i] - p) * bright; ring[i] = p; }
    let idx = 0;
    for (let i = 0; i < len; i++) {
      const cur = ring[idx], nxt = ring[(idx + 1) % N];
      d[i] = cur;
      ring[idx] = (cur + nxt) * 0.5 * damp;
      idx = (idx + 1) % N;
    }
    const tail = (sr * 0.06) | 0;
    for (let i = 0; i < tail; i++) d[len - 1 - i] *= i / tail;
    return buf;
  },
  _noise(dur) {
    const c = this.ctx, sr = c.sampleRate, len = ceil(sr * dur);
    const buf = c.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
    return buf;
  },

  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.85, this.ctx.currentTime, 0.05);
  },
  resume() {
    if (!this.started) this.init();
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },

  /* ------------------------------------------------------------ voices -- */
  pluck(t, f, g, soft, pan) {
    if (!this.ok) return;
    const c = this.ctx;
    const s = c.createBufferSource();
    s.buffer = soft ? this.pluckSoft : this.pluckBright;
    s.playbackRate.value = clamp(f / 110, 0.12, 14);
    const gn = c.createGain();
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.004);
    gn.gain.setTargetAtTime(0, t + 0.02, 0.34);
    const lp = c.createBiquadFilter(); lp.type = "lowpass";
    lp.frequency.value = clamp(f * 7 + 700, 500, 12000);
    s.connect(lp); lp.connect(gn);
    if (pan !== undefined && c.createStereoPanner) {
      const p = c.createStereoPanner(); p.pan.value = pan; gn.connect(p); p.connect(this.musicBus);
    } else gn.connect(this.musicBus);
    s.start(t); s.stop(t + 2.4);
  },
  bassNote(t, f, g, dur) {
    if (!this.ok) return;
    const c = this.ctx;
    const o = c.createOscillator(); o.type = "triangle"; o.frequency.value = f;
    const o2 = c.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 0.5;
    const lp = c.createBiquadFilter(); lp.type = "lowpass";
    lp.frequency.setValueAtTime(min(2400, f * 9), t);
    lp.frequency.exponentialRampToValueAtTime(max(90, f * 2), t + dur);
    const gn = c.createGain();
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.008);
    gn.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(lp); o2.connect(lp); lp.connect(gn); gn.connect(this.musicBus);
    o.start(t); o2.start(t); o.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);
  },
  clack(t, g, bright) {
    if (!this.ok) return;
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = rr(0.85, 1.2);
    const bp = c.createBiquadFilter(); bp.type = "bandpass";
    bp.frequency.value = bright * 1400 + 700; bp.Q.value = 2.2;
    const gn = c.createGain();
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(g * 0.5, t + 0.002);
    gn.gain.exponentialRampToValueAtTime(0.0005, t + 0.055);
    s.connect(bp); bp.connect(gn); gn.connect(this.musicBus);
    s.start(t, rnd() * 1.2); s.stop(t + 0.09);
    /* the wooden body of the shuttle */
    const o = c.createOscillator(); o.type = "triangle";
    o.frequency.setValueAtTime(210 + bright * 90, t);
    o.frequency.exponentialRampToValueAtTime(96, t + 0.05);
    const g2 = c.createGain();
    g2.gain.setValueAtTime(g * 0.34, t);
    g2.gain.exponentialRampToValueAtTime(0.0005, t + 0.07);
    o.connect(g2); g2.connect(this.musicBus);
    o.start(t); o.stop(t + 0.09);
  },
  bell(t, f, g, dur) {
    if (!this.ok) return;
    const c = this.ctx;
    const car = c.createOscillator(); car.type = "sine"; car.frequency.value = f;
    const mod = c.createOscillator(); mod.type = "sine"; mod.frequency.value = f * 2.76;
    const mg = c.createGain(); mg.gain.setValueAtTime(f * 2.4, t);
    mg.gain.exponentialRampToValueAtTime(f * 0.05, t + dur * 0.6);
    mod.connect(mg); mg.connect(car.frequency);
    const gn = c.createGain();
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.006);
    gn.gain.exponentialRampToValueAtTime(0.0006, t + dur);
    car.connect(gn); gn.connect(this.musicBus);
    car.start(t); mod.start(t); car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
  },
  noiseHit(t, g, f0, f1, dur, type, q) {
    if (!this.ok) return;
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = rr(0.8, 1.25);
    const bp = c.createBiquadFilter(); bp.type = type || "bandpass";
    bp.frequency.setValueAtTime(f0, t);
    bp.frequency.exponentialRampToValueAtTime(max(40, f1), t + dur);
    bp.Q.value = q === undefined ? 1.1 : q;
    const gn = c.createGain();
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.006);
    gn.gain.exponentialRampToValueAtTime(0.0004, t + dur);
    s.connect(bp); bp.connect(gn); gn.connect(this.sfxBus);
    s.start(t, rnd()); s.stop(t + dur + 0.04);
  },
  blip(t, g, f0, f1, dur, type) {
    if (!this.ok) return;
    const c = this.ctx;
    const o = c.createOscillator(); o.type = type || "square";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(max(28, f1), t + dur);
    const gn = c.createGain();
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.005);
    gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    o.connect(gn); gn.connect(this.sfxBus);
    o.start(t); o.stop(t + dur + 0.02);
  },
  /* a plucked string that is snapped rather than played */
  snap(t, f, g, bendTo) {
    if (!this.ok) return;
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.pluckBright;
    s.playbackRate.setValueAtTime(clamp(f / 110, 0.1, 12), t);
    s.playbackRate.exponentialRampToValueAtTime(clamp(bendTo / 110, 0.06, 12), t + 0.42);
    const gn = c.createGain();
    gn.gain.setValueAtTime(g, t);
    gn.gain.exponentialRampToValueAtTime(0.0006, t + 0.55);
    s.connect(gn); gn.connect(this.sfxBus);
    s.start(t); s.stop(t + 0.7);
  },

  /* --------------------------------------------------------------- sfx -- */
  sfx(name, arg) {
    if (!this.ok || this.muted) return;
    const t = this.ctx.currentTime + 0.001;
    switch (name) {
      case "shot":
        this.blip(t, 0.052, 1500 + rr(-120, 120), 420, 0.055, "triangle");
        this.noiseHit(t, 0.030, 3600, 1400, 0.05, "highpass", 0.6);
        break;
      case "tick":
        this.noiseHit(t, 0.10, 2800, 1500, 0.05, "bandpass", 2.4);
        break;
      case "kill": {
        this.noiseHit(t, 0.20, 1500, 260, 0.28, "bandpass", 0.9);
        const sc = G.scaleNow, r = G.rootNow;
        const d = 7 + ((G.comboKills | 0) % 7);
        this.pluck(t, degF(r, sc, d) * 2, 0.16, false, rr(-0.4, 0.4));
        break;
      }
      case "killbig":
        this.noiseHit(t, 0.30, 900, 130, 0.55, "bandpass", 0.8);
        this.blip(t, 0.16, 200, 55, 0.35, "sawtooth");
        this.bell(t + 0.02, degF(G.rootNow, G.scaleNow, 7) * 2, 0.14, 0.9);
        break;
      case "hurt":
        this.snap(t, 520, 0.34, 90);
        this.blip(t, 0.30, 150, 42, 0.42, "sine");
        this.noiseHit(t, 0.26, 1800, 220, 0.4, "bandpass", 0.7);
        break;
      case "graze":
        this.noiseHit(t, 0.075, 6200, 3200, 0.11, "highpass", 0.8);
        this.bell(t, 1760 * (1 + (arg || 0) * 0.06), 0.045, 0.16);
        break;
      case "pickup":
        this.bell(t, 880, 0.16, 0.35);
        this.bell(t + 0.075, 1320, 0.14, 0.5);
        this.pluck(t + 0.02, 660, 0.12, true);
        break;
      case "dash":
        this.noiseHit(t, 0.19, 320, 4200, 0.3, "bandpass", 1.4);
        this.blip(t, 0.07, 240, 900, 0.22, "triangle");
        break;
      case "thorn":
        this.blip(t, 0.075, 900, 300, 0.1, "square");
        break;
      case "warn":
        this.blip(t, 0.13, 740, 740, 0.1, "square");
        this.blip(t + 0.14, 0.13, 560, 560, 0.12, "square");
        break;
      case "tell":
        this.noiseHit(t, 0.16, 260, 2600, 0.55, "bandpass", 1.6);
        this.blip(t, 0.12, 70, 190, 0.6, "sawtooth");
        break;
      case "bosshit":
        this.noiseHit(t, 0.13, 3200, 900, 0.09, "bandpass", 3.5);
        this.blip(t, 0.07, 420, 210, 0.07, "square");
        break;
      case "bossdie": {
        for (let i = 0; i < 7; i++) {
          this.blip(t + i * 0.075, 0.13, 480 - i * 46, 60, 0.9, "sawtooth");
        }
        this.noiseHit(t, 0.34, 2400, 90, 2.0, "lowpass", 0.6);
        break;
      }
      case "clear": {
        const sc = G.scaleNow, r = G.rootNow;
        for (let i = 0; i < 6; i++) this.bell(t + i * 0.11, degF(r, sc, 7 + i * 2) * 2, 0.17, 1.1);
        break;
      }
      case "over": {
        for (let i = 0; i < 10; i++) {
          this.pluck(t + i * 0.1, 330 * pow(0.86, i), 0.2, true, rr(-0.5, 0.5));
        }
        this.noiseHit(t, 0.2, 900, 60, 2.4, "lowpass", 0.5);
        break;
      }
      case "ui":
        this.blip(t, 0.10, 640, 900, 0.07, "triangle");
        this.pluck(t, 660, 0.1, true);
        break;
      case "start":
        this.bell(t, 523, 0.2, 0.7);
        this.bell(t + 0.1, 784, 0.2, 0.9);
        this.bell(t + 0.2, 1046, 0.22, 1.4);
        this.noiseHit(t, 0.2, 200, 3000, 0.7, "bandpass", 1.2);
        break;
      case "stagecard":
        this.pluck(t, degF(G.rootNow, G.scaleNow, 0), 0.24, true);
        this.pluck(t + 0.09, degF(G.rootNow, G.scaleNow, 4), 0.2, true);
        this.bell(t + 0.2, degF(G.rootNow, G.scaleNow, 7) * 2, 0.16, 1.2);
        break;
    }
  },

  /* ------------------------------------------------------------- music -- */
  setTrack(name) {
    if (this.trackName === name) return;
    this.trackName = name;
    const tr = TRACKS[name] || null;
    this.track = tr;
    this.targetPad = tr ? tr.padG : 0;
    this.targetLoom = tr ? tr.loom : 0;
    if (!tr) return;
    this.spb = 60 / tr.bpm / 4;
    this.step = 0;
    if (!this.ok) return;
    this.nextT = max(this.nextT, this.ctx.currentTime + 0.05);
    const now = this.ctx.currentTime;
    for (let i = 0; i < this.padOsc.length; i++) {
      const semi = tr.pad[i % tr.pad.length];
      const f = tr.root * pow(2, semi / 12) * (i === 2 ? 0.5 : 1) * (1 + (i - 1) * 0.004);
      this.padOsc[i].o.frequency.setTargetAtTime(f, now, 0.35);
    }
  },
  silence() {
    this.trackName = "silent"; this.track = null;
    this.targetPad = 0; this.targetLoom = 0;
  },
  update(dt, speedK) {
    if (!this.ok) return;
    const c = this.ctx, now = c.currentTime;
    this.padGain.gain.setTargetAtTime(this.muted ? 0 : this.targetPad, now, 0.5);
    this.loomGain.gain.setTargetAtTime(this.muted ? 0 : this.targetLoom, now, 0.6);
    this.windGain.gain.setTargetAtTime(this.muted ? 0 : 0.028 + speedK * 0.075, now, 0.25);
    this.windFilter.frequency.setTargetAtTime(340 + speedK * 900, now, 0.3);

    const tr = this.track;
    if (!tr) return;
    const look = now + 0.14;
    let guard = 0;
    while (this.nextT < look && guard++ < 64) {
      const s = this.step % 16, bar = (this.step / 16 | 0) % tr.bars.length;
      const pat = tr.bars[bar];
      const swing = (s % 2 === 1) ? this.spb * (tr.swing || 0) : 0;
      const t = this.nextT + swing;
      if (!this.muted) this.playStep(tr, pat, s, t, bar);
      this.step++;
      this.nextT += this.spb;
    }
  },
  playStep(tr, pat, s, t, bar) {
    const b = pat.bass[s];
    if (b !== null && b !== undefined) {
      this.bassNote(t, degF(tr.root, tr.scale, b) * 0.5, 0.30, tr.urgent ? 0.16 : 0.3);
    }
    const m = pat.mel[s];
    if (m !== null && m !== undefined) {
      const f = degF(tr.root, tr.scale, m);
      if (tr.bell) {
        this.bell(t, f * 2, 0.11, 1.5);
        this.pluck(t, f, 0.13, true, rr(-0.3, 0.3));
      } else {
        this.pluck(t, f, tr.urgent ? 0.15 : 0.135, false, rr(-0.45, 0.45));
        if (tr.flutter && s % 4 === 0) this.pluck(t + this.spb * 0.5, f, 0.055, false, rr(-0.5, 0.5));
      }
    }
    const k = pat.clk[s];
    if (k !== null && k !== undefined) this.clack(t, k * 0.5, s % 4 === 0 ? 0.35 : 0.8);
    /* an extra shuttle pass at the top of every phrase */
    if (s === 0 && bar === 0) this.noiseHit(t, 0.06, 900, 240, 0.4, "bandpass", 0.7);
  }
};
function degF(root, scale, d) {
  const n = scale.length;
  const oct = floor(d / n), idx = ((d % n) + n) % n;
  return root * pow(2, (scale[idx] + 12 * oct) / 12);
}

/* ==========================================================================
   THE CLOTH — sky, Beam, and the woven ground plane
   ======================================================================== */
const MAXROWS = 72;
const rowZ = new Float32Array(MAXROWS);
const rowN = new Int32Array(MAXROWS);
const rowYs = [];
for (let i = 0; i < MAXROWS; i++) rowYs.push(new Float32Array(GX + 1));
let nRows = 0;

const FOGC = [0, 0, 0];
const _sh = [0, 0, 0];
/* light comes from over the Beam, ahead and above */
const LX = 0.26, LY = 0.80, LZ = 0.54;
const HX = 0.271, HY = 0.834, HZ = -0.480;

function fogAt(z) { return 1 - Math.exp(-z / PAL.fogD); }

function shadeCloth(base, dx, dz, fogv, tint, out) {
  const inv = 1 / sqrt(dx * dx + 1 + dz * dz);
  const nx = -dx * inv, ny = inv, nz = -dz * inv;
  let lam = nx * LX + ny * LY + nz * LZ; if (lam < 0) lam = 0;
  let sp = nx * HX + ny * HY + nz * HZ; if (sp < 0) sp = 0;
  sp = pow(sp, 22) * PAL.sheen;
  const k = 0.40 + 0.72 * lam;
  out[0] = base[0] * k + PAL.beam[0] * sp * 0.62;
  out[1] = base[1] * k + PAL.beam[1] * sp * 0.62;
  out[2] = base[2] * k + PAL.beam[2] * sp * 0.62;
  if (tint) { out[0] += tint[0]; out[1] += tint[1]; out[2] += tint[2]; }
  out[0] += (FOGC[0] - out[0]) * fogv;
  out[1] += (FOGC[1] - out[1]) * fogv;
  out[2] += (FOGC[2] - out[2]) * fogv;
  return out;
}

/* ---------------------------------------------------------------- sky --- */
let skyDirty = true;
function drawSky() {
  const hz = CY + shY;
  const g = ctx.createLinearGradient(0, -H * 0.12, 0, hz);
  g.addColorStop(0, C(PAL.skyTop));
  g.addColorStop(0.52, C(mixc(PAL.skyTop, PAL.skyMid, 0.72, _sh)));
  g.addColorStop(0.86, C(PAL.skyMid));
  g.addColorStop(1, C(PAL.skyHaze));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, max(0, hz));

  /* the Beam: the wall of light where new cloth is born */
  const bx = CX + shX - camX * 4.5;
  const rad = H * 1.05;
  const bg = ctx.createRadialGradient(bx, hz, 0, bx, hz, rad);
  bg.addColorStop(0, CA(PAL.beamCore, 0.85));
  bg.addColorStop(0.10, CA(PAL.beam, 0.52));
  bg.addColorStop(0.34, CA(PAL.beam, 0.16));
  bg.addColorStop(1, CA(PAL.beam, 0));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, max(0, hz + 2));

  /* god-rays hanging off the loom frame */
  const n = 9;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < n; i++) {
    const ph = G.t * 0.045 + i * 1.913;
    const a = (0.016 + 0.015 * sin(ph * 2.1 + i)) * (1 - G.flash * 0.5);
    if (a <= 0.002) continue;
    const spread = H * (0.5 + 0.9 * ((i * 0.37 + sin(ph)) % 1));
    const off = (i - (n - 1) / 2) * W * 0.085 + sin(ph * 0.7) * W * 0.02;
    const rg = ctx.createLinearGradient(bx + off, hz, bx + off * 2.2, hz - spread);
    rg.addColorStop(0, CA(PAL.beam, a));
    rg.addColorStop(1, CA(PAL.beam, 0));
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(bx + off - W * 0.008, hz + 4);
    ctx.lineTo(bx + off + W * 0.008, hz + 4);
    ctx.lineTo(bx + off * 2.2 + W * 0.045, hz - spread);
    ctx.lineTo(bx + off * 2.2 - W * 0.045, hz - spread);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* lint banks drifting in the upper air */
  for (let i = 0; i < 4; i++) {
    const ph = i * 2.7 + G.dist * 0.0012 + G.t * 0.012;
    const y = hz - H * (0.07 + i * 0.085) - sin(ph * 0.6) * H * 0.02;
    const x = ((ph * 0.31) % 2 - 1) * W * 0.8 + CX - camX * (3 + i);
    const rw = W * (0.30 + i * 0.1), rh = H * (0.014 + i * 0.006);
    const cg = ctx.createRadialGradient(x, y, 0, x, y, rw);
    cg.addColorStop(0, CA(PAL.skyHaze, 0.16 - i * 0.025));
    cg.addColorStop(1, CA(PAL.skyHaze, 0));
    ctx.fillStyle = cg;
    ctx.save(); ctx.translate(x, y); ctx.scale(1, rh / rw);
    ctx.beginPath(); ctx.arc(0, 0, rw, 0, TAU); ctx.fill();
    ctx.restore();
  }

  /* the world loom stands over everything: colossal frame posts in the haze */
  ctx.save();
  ctx.globalAlpha = 0.13 + 0.10 * PAL.sheen;
  for (let i = -2; i <= 2; i++) {
    if (i === 0) continue;
    const px = bx + i * W * 0.26 - camX * 2.0;
    const wdt = W * 0.018 * abs(i);
    const top = hz - H * (0.62 - abs(i) * 0.06);
    const gg = ctx.createLinearGradient(0, top, 0, hz);
    gg.addColorStop(0, CA(PAL.skyTop, 0.0));
    gg.addColorStop(0.5, CA(PAL.ink, 0.30));
    gg.addColorStop(1, CA(PAL.ink, 0.44));
    ctx.fillStyle = gg;
    ctx.fillRect(px - wdt / 2, top, wdt, hz - top);
  }
  ctx.restore();
}

/* ------------------------------------------------------------- ground --- */
function buildRows() {
  const n0 = ceil((G.dist + ZNEAR) / ROWSP);
  nRows = 0;
  for (let n = n0; nRows < MAXROWS; n++) {
    const z = n * ROWSP - G.dist;
    if (z > ZFAR) break;
    if (nRows > 3) {
      const dy = camY * F * ROWSP / (z * (z + ROWSP));
      if (dy < 0.8) break;
    }
    rowZ[nRows] = z; rowN[nRows] = n;
    const ys = rowYs[nRows];
    const k = (F * fovK) / z, base = CY + shY, cyk = camY * k;
    const zx = z / (F * fovK);
    for (let j = 0; j <= GX; j++) {
      const wx = camX + (SXS[j] - CX - shX) * zx;
      ys[j] = base + cyk - clothY(wx, z) * k;
    }
    nRows++;
  }
}

function drawGround() {
  const hz = CY + shY;
  const bottom = H + 4;
  /* atmosphere under the horizon so the far rows have something to fade into */
  const fg = ctx.createLinearGradient(0, hz, 0, bottom);
  fg.addColorStop(0, C(FOGC));
  fg.addColorStop(0.35, C(mixc(FOGC, PAL.clothB, 0.55, _sh)));
  fg.addColorStop(1, C(mixc(PAL.clothB, PAL.clothLow, 0.35, _sh)));
  ctx.fillStyle = fg;
  ctx.fillRect(0, hz - 1, W, bottom - hz + 1);

  if (nRows < 2) return;
  const c1 = [0, 0, 0], c2 = [0, 0, 0], c3 = [0, 0, 0];
  const tint = G.groundTint;

  for (let i = nRows - 2; i >= 0; i--) {
    const yn = rowYs[i], yf = rowYs[i + 1];
    const zn = rowZ[i], zf = rowZ[i + 1], zm = (zn + zf) * 0.5;
    const fogv = fogAt(zm);
    const par = rowN[i] & 1;
    const base = par ? PAL.clothA : PAL.clothB;
    const zx = zm / (F * fovK);
    const wxL = camX + (SXS[0] - CX - shX) * zx;
    const wxM = camX + (CX - CX) * zx;
    const wxR = camX + (SXS[GX] - CX - shX) * zx;

    ctx.beginPath();
    ctx.moveTo(SXS[0], yf[0]);
    for (let j = 1; j <= GX; j++) ctx.lineTo(SXS[j], yf[j]);
    for (let j = GX; j >= 0; j--) ctx.lineTo(SXS[j], yn[j]);
    ctx.closePath();

    if (i < 16) {
      shadeCloth(base, clothDX(wxL, zm), clothDZ(wxL, zm), fogv, tint, c1);
      shadeCloth(base, clothDX(wxM, zm), clothDZ(wxM, zm), fogv, tint, c2);
      shadeCloth(base, clothDX(wxR, zm), clothDZ(wxR, zm), fogv, tint, c3);
      const g = ctx.createLinearGradient(SXS[0], 0, SXS[GX], 0);
      g.addColorStop(0, C(c1)); g.addColorStop(0.5, C(c2)); g.addColorStop(1, C(c3));
      ctx.fillStyle = g;
    } else {
      shadeCloth(base, clothDX(wxM, zm), clothDZ(wxM, zm), fogv, tint, c2);
      ctx.fillStyle = C(c2);
    }
    ctx.fill();
  }

  drawWeaveCells();

  /* --- warp threads: the pillars of the world, running away to the Beam --- */
  const zFar = rowZ[nRows - 1];
  const mSpan = ceil((HALFW * zFar / F + abs(camX)) / WARPSP) + 1;
  const m0 = Math.round(camX / WARPSP);
  ctx.lineCap = "round";
  for (let m = m0 - mSpan; m <= m0 + mSpan; m++) {
    const wx = m * WARPSP;
    let started = false, lastZ = 0, firstZ = 0;
    ctx.beginPath();
    for (let i = 0; i < nRows; i++) {
      const z = rowZ[i], k = (F * fovK) / z;
      const sx = CX + shX + (wx - camX) * k;
      if (sx < -70 || sx > W + 70) { if (started) break; else continue; }
      const sy = CY + shY + (camY - clothY(wx, z)) * k;
      if (!started) { ctx.moveTo(sx, sy); started = true; firstZ = z; }
      else ctx.lineTo(sx, sy);
      lastZ = z;
    }
    if (!started || firstZ > 105) continue;
    const fv = fogAt(min(lastZ, 46));
    const wLW = clamp(F / max(3, firstZ) * 0.019, 0.9, 11);
    /* near threads get a shadow side and a lit side, which is what makes them
       look round. far ones are two pixels wide and nobody can tell. */
    if (firstZ < 24) {
      ctx.save();
      ctx.translate(0, wLW * 0.34);
      ctx.strokeStyle = CA(PAL.ink, 0.26 * (1 - fv * 0.9));
      ctx.lineWidth = wLW;
      ctx.stroke();
      ctx.restore();
    }
    ctx.strokeStyle = CA(PAL.warp, (0.44 + 0.36 * PAL.sheen) * (1 - fv * 0.82));
    ctx.lineWidth = wLW;
    ctx.stroke();
  }

  /* --- weft rows: the crossing thread, brightest right under the Mender --- */
  for (let i = 0; i < nRows; i++) {
    const z = rowZ[i];
    if (z > 62) break;
    const ys = rowYs[i];
    const a = (1 - fogAt(z)) * 0.5;
    if (a < 0.012) continue;
    ctx.beginPath();
    ctx.moveTo(SXS[0], ys[0]);
    for (let j = 1; j <= GX; j++) ctx.lineTo(SXS[j], ys[j]);
    const lw = clamp(F / z * 0.010, 0.7, 6);
    ctx.strokeStyle = CA(PAL.fine, a);
    ctx.lineWidth = max(0.6, lw * 0.55);
    ctx.stroke();
  }

  /* --- a pool of Beam-light lying on the cloth ahead of the Mender --- */
  const lz = 44, lk = (F * fovK) / lz;
  const lx = CX + shX + (0 - camX) * lk, ly = CY + shY + camY * lk;
  const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, W * 0.55);
  lg.addColorStop(0, CA(PAL.beam, 0.13 + 0.10 * PAL.sheen));
  lg.addColorStop(0.45, CA(PAL.beam, 0.045));
  lg.addColorStop(1, CA(PAL.beam, 0));
  ctx.save();
  ctx.translate(lx, ly); ctx.scale(1, 0.24); ctx.translate(-lx, -ly);
  ctx.fillStyle = lg;
  const lyTop = ly - (H - ly) / 0.24, lyBot = ly + (H - ly) / 0.24;
  ctx.fillRect(0, max(lyTop, ly - W * 0.6), W, min(lyBot, ly + W * 0.6) - max(lyTop, ly - W * 0.6));
  ctx.restore();
}

/* ---- the plain weave itself: over-one, under-one, close to the Mender ---- */
const CELLX = 15, CELLROWS = 11;
const cellPX = [], cellPY = [];
for (let i = 0; i <= CELLROWS; i++) { cellPX.push(new Float32Array(CELLX * 2 + 2)); cellPY.push(new Float32Array(CELLX * 2 + 2)); }

function drawWeaveCells() {
  if (nRows < 3) return;
  const nR = min(CELLROWS, nRows - 1);
  if (rowZ[0] > 34) return;
  const m0 = Math.round(camX / WARPSP) - CELLX;
  const nC = CELLX * 2 + 1;
  let rows = 0;
  for (let i = 0; i <= nR; i++) {
    const z = rowZ[i];
    if (z > 40) break;
    const k = (F * fovK) / z;
    const px = cellPX[rows], py = cellPY[rows];
    for (let j = 0; j <= nC; j++) {
      const wx = (m0 + j) * WARPSP;
      px[j] = CX + shX + (wx - camX) * k;
      py[j] = CY + shY + (camY - clothY(wx, z)) * k;
    }
    rows++;
  }
  if (rows < 2) return;
  /* two passes: the threads that ride over, and the ones that duck under */
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    let any = false;
    for (let i = 0; i < rows - 1; i++) {
      const n0 = rowN[i];
      const pa = cellPX[i], ya = cellPY[i], pb = cellPX[i + 1], yb = cellPY[i + 1];
      for (let j = 0; j < nC; j++) {
        if ((((m0 + j) + n0) & 1) !== pass) continue;
        if (pa[j + 1] < -30 || pa[j] > W + 30) continue;
        ctx.moveTo(pa[j], ya[j]);
        ctx.lineTo(pa[j + 1], ya[j + 1]);
        ctx.lineTo(pb[j + 1], yb[j + 1]);
        ctx.lineTo(pb[j], yb[j]);
        ctx.closePath();
        any = true;
      }
    }
    if (!any) continue;
    const fadeT = clamp(1 - rowZ[0] / 34, 0, 1);
    ctx.fillStyle = pass === 0
      ? CA(PAL.fine, 0.052 * (0.35 + 0.65 * fadeT))
      : CA(PAL.ink, 0.048 * (0.35 + 0.65 * fadeT));
    ctx.fill();
  }
}

/* ------------------------------------------- damage worn into the cloth -- */
/* Stage II eats holes clean through. Stage III bleeds dye. Both live here. */
const holes = [];
const stains = [];
let holeNextZ = 0, stainNextZ = 0;

function updateGroundFeatures(dt) {
  const d = G.dist;
  if (G.holeRate > 0) {
    while (holeNextZ < d + ZFAR) {
      holeNextZ += rr(9, 26) / G.holeRate;
      holes.push({ x: rr(-24, 24), z: holeNextZ, r: rr(1.4, 5.2), s: rnd() * 9 });
    }
  } else holeNextZ = max(holeNextZ, d + ZFAR);
  if (G.stainRate > 0) {
    while (stainNextZ < d + ZFAR) {
      stainNextZ += rr(7, 20) / G.stainRate;
      stains.push({ x: rr(-26, 26), z: stainNextZ, r: rr(3, 11), s: rnd() * 9, dark: chance(0.4) });
    }
  } else stainNextZ = max(stainNextZ, d + ZFAR);
  for (let i = holes.length - 1; i >= 0; i--) if (holes[i].z - d < 0.6) holes.splice(i, 1);
  for (let i = stains.length - 1; i >= 0; i--) if (stains[i].z - d < 0.6) stains.splice(i, 1);
}

/* the air is never empty here — lint, wing-dust, steam, gold */
let ambT = 0;
function updateAmbient(dt) {
  ambT += dt;
  const st = G.palTo;
  const rate = st === 2 ? 26 : st === 1 ? 20 : st === 3 ? 22 : 13;
  let n = ambT * rate;
  if (n < 1) return;
  const spawn = min(6, n | 0);
  ambT -= spawn / rate;
  for (let i = 0; i < spawn; i++) {
    const z = rr(14, 150), x = camX + rr(-30, 30);
    if (st === 2) {
      /* steam coming off the dye */
      addParticle(x, clothY(x, z) + rr(0, 0.8), z, rr(-1, 1), rr(2.4, 5.5), rr(-4, 4),
        rr(1.6, 3.4), 4, mixc(PAL.skyHaze, PAL.beam, 0.4, [0, 0, 0]), rr(1.6, 3.6));
    } else if (st === 1) {
      /* wing-dust, falling */
      addParticle(x, rr(1, 14), z, rr(-0.6, 0.6), rr(-1.4, -0.3), rr(-3, 3),
        rr(2.2, 4.5), 0, PAL.fine, rr(0.4, 1.0));
    } else if (st === 3) {
      /* the Beam throwing sparks of new thread */
      addParticle(x, rr(1, 13), z, rr(-0.5, 0.5), rr(0.3, 1.6), rr(-6, 2),
        rr(1.4, 3.2), 5, mixc(PAL.accent, PAL.beam, 0.5, [0, 0, 0]), rr(0.5, 1.1));
    } else {
      /* plain lint, turning in the light */
      addParticle(x, rr(1, 13), z, rr(-0.5, 0.5), rr(-0.5, 0.7), rr(-3, 3),
        rr(2.4, 5.0), 0, PAL.fine, rr(0.5, 1.2));
    }
  }
}

function drawStains() {
  if (!stains.length) return;
  ctx.save();
  for (let i = stains.length - 1; i >= 0; i--) {
    const s = stains[i], z = s.z - G.dist;
    if (z < 1.2 || z > 120) continue;
    const k = (F * fovK) / z;
    const sx = CX + shX + (s.x - camX) * k;
    const sy = CY + shY + (camY - clothY(s.x, z)) * k;
    const rx = s.r * k, ry = rx * 0.30;
    if (sx + rx < -20 || sx - rx > W + 20) continue;
    const a = (1 - fogAt(z)) * 0.34;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s.r * k);
    const col = s.dark ? mixc(PAL.ink, PAL.clothLow, 0.45, [0, 0, 0]) : PAL.clothLow;
    g.addColorStop(0, CA(col, a));
    g.addColorStop(0.55, CA(col, a * 0.55));
    g.addColorStop(1, CA(col, 0));
    ctx.save();
    ctx.translate(sx, sy); ctx.scale(1, ry / rx);
    ctx.fillStyle = g;
    ctx.beginPath();
    for (let t = 0; t <= 14; t++) {
      const th = t / 14 * TAU;
      const rr_ = s.r * k * (0.78 + 0.30 * vnoise(cos(th) * 2 + s.s, sin(th) * 2 + s.s));
      const px = cos(th) * rr_, py = sin(th) * rr_;
      if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawHoles() {
  if (!holes.length) return;
  for (let i = holes.length - 1; i >= 0; i--) {
    const h = holes[i], z = h.z - G.dist;
    if (z < 1.0 || z > 130) continue;
    const k = (F * fovK) / z;
    const sx = CX + shX + (h.x - camX) * k;
    const cy0 = clothY(h.x, z);
    const sy = CY + shY + (camY - cy0) * k;
    const rx = h.r * k, ry = rx * 0.32;
    if (sx + rx < -30 || sx - rx > W + 30 || ry < 0.6) continue;
    const vis = 1 - fogAt(z);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(1, ry / rx);
    /* the void under the world */
    ctx.beginPath();
    for (let t = 0; t <= 18; t++) {
      const th = t / 18 * TAU;
      const rd = rx * (0.80 + 0.30 * vnoise(cos(th) * 2.4 + h.s, sin(th) * 2.4 + h.s * 1.7));
      const px = cos(th) * rd, py = sin(th) * rd;
      if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    const vg = ctx.createRadialGradient(0, -rx * 0.1, 0, 0, 0, rx);
    vg.addColorStop(0, "rgba(2,2,6," + (0.96 * vis).toFixed(3) + ")");
    vg.addColorStop(0.66, "rgba(6,5,14," + (0.90 * vis).toFixed(3) + ")");
    vg.addColorStop(1, CA(PAL.clothLow, 0.55 * vis));
    ctx.fillStyle = vg;
    ctx.fill();
    /* torn threads catching the light of the Beam on the far lip */
    ctx.strokeStyle = CA(PAL.warp, 0.5 * vis);
    ctx.lineWidth = max(0.6, rx * 0.012);
    ctx.beginPath();
    for (let t = 0; t <= 10; t++) {
      const th = PI + t / 10 * PI;
      const rd = rx * (0.80 + 0.30 * vnoise(cos(th) * 2.4 + h.s, sin(th) * 2.4 + h.s * 1.7));
      const px = cos(th) * rd, py = sin(th) * rd;
      if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    /* loose ends */
    const nw = rx > 26 ? 9 : 5;
    ctx.strokeStyle = CA(PAL.fine, 0.4 * vis);
    ctx.lineWidth = max(0.5, rx * 0.008);
    ctx.beginPath();
    for (let t = 0; t < nw; t++) {
      const th = (t / nw) * TAU + h.s;
      const rd = rx * (0.80 + 0.30 * vnoise(cos(th) * 2.4 + h.s, sin(th) * 2.4 + h.s * 1.7));
      const wob = sin(G.t * 2.2 + t * 2 + h.s) * 0.16;
      ctx.moveTo(cos(th) * rd, sin(th) * rd);
      ctx.lineTo(cos(th + wob) * rd * 1.30, sin(th + wob) * rd * 1.30);
    }
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------- heddle frames passing overhead -- */
const arches = [];
let archNextZ = 0;
function updateArches(dt) {
  while (archNextZ < G.dist + ZFAR * 0.92) {
    archNextZ += rr(46, 78);
    arches.push({ z: archNextZ, w: rr(15, 23), h: rr(11, 17), s: rnd() * 10 });
  }
  for (let i = arches.length - 1; i >= 0; i--) if (arches[i].z - G.dist < 0.55) arches.splice(i, 1);
}
function drawArch(a) {
  const z = a.z - G.dist;
  if (z < 0.6) return;
  const k = (F * fovK) / z;
  const vis = 1 - fogAt(z) * 0.92;
  if (vis <= 0.02) return;
  const cyb = camY * k;
  const xL = CX + shX + (-a.w - camX) * k, xR = CX + shX + (a.w - camX) * k;
  if (xR < -60 || xL > W + 60) return;
  const yBase = min(H + 200, CY + shY + cyb);
  const yTop = max(-200, CY + shY + (camY - a.h) * k);
  const pw = max(1.2, 0.85 * k);
  const dark = mixc(PAL.ink, PAL.clothLow, 0.18, _sh);
  const lit = mixc(PAL.warp, PAL.beam, 0.4, [0, 0, 0]);

  ctx.save();
  ctx.globalAlpha = clamp(vis * 1.15, 0, 1);
  /* posts */
  for (const px of [xL, xR]) {
    const g = ctx.createLinearGradient(px - pw, 0, px + pw, 0);
    g.addColorStop(0, C(dark));
    g.addColorStop(0.35, C(mixc(dark, lit, 0.42, [0, 0, 0])));
    g.addColorStop(1, C(scalec(dark, 0.55, [0, 0, 0])));
    ctx.fillStyle = g;
    ctx.fillRect(px - pw, yTop, pw * 2, yBase - yTop);
  }
  /* the beam across the top */
  const bh = max(1.5, 1.15 * k);
  const bg = ctx.createLinearGradient(0, yTop - bh, 0, yTop + bh);
  bg.addColorStop(0, C(scalec(dark, 0.6, [0, 0, 0])));
  bg.addColorStop(0.4, C(mixc(dark, lit, 0.5, [0, 0, 0])));
  bg.addColorStop(1, C(scalec(dark, 0.4, [0, 0, 0])));
  ctx.fillStyle = bg;
  ctx.fillRect(xL - pw, yTop - bh, (xR - xL) + pw * 2, bh * 2);
  /* the heddles: wires hanging from the beam, each holding one warp thread */
  const nH = 15;
  ctx.strokeStyle = CA(PAL.fine, 0.34 * vis);
  ctx.lineWidth = max(0.5, 0.06 * k);
  ctx.beginPath();
  for (let i = 1; i < nH; i++) {
    const t = i / nH;
    const hx_ = xL + (xR - xL) * t;
    const drop = (yBase - yTop) * (0.16 + 0.11 * (0.5 + 0.5 * sin(a.s + i * 1.7 + G.t * 0.7)));
    ctx.moveTo(hx_, yTop + bh);
    ctx.lineTo(hx_ + sin(a.s + i) * 0.1 * k, yTop + bh + drop);
  }
  ctx.stroke();
  /* light catching the top edge */
  ctx.strokeStyle = CA(PAL.beam, 0.35 * vis);
  ctx.lineWidth = max(0.7, 0.10 * k);
  ctx.beginPath(); ctx.moveTo(xL - pw, yTop - bh); ctx.lineTo(xR + pw, yTop - bh); ctx.stroke();
  ctx.restore();
}

/* --------------------------------------------------------- CRT overlay -- */
let overlay = null;
function buildOverlay() {
  const ow = max(2, (W * DPR) | 0), oh = max(2, (H * DPR) | 0);
  overlay = document.createElement("canvas");
  overlay.width = ow; overlay.height = oh;
  const o = overlay.getContext("2d");
  o.clearRect(0, 0, ow, oh);
  const step = max(2, Math.round(3 * DPR));
  o.fillStyle = "rgba(0,0,0,0.055)";
  for (let y = 0; y < oh; y += step) o.fillRect(0, y, ow, max(1, step * 0.34));
  const g = o.createRadialGradient(ow / 2, oh / 2, min(ow, oh) * 0.24, ow / 2, oh / 2, max(ow, oh) * 0.76);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(0.62, "rgba(0,0,0,0.16)");
  g.addColorStop(1, "rgba(0,0,0,0.62)");
  o.fillStyle = g;
  o.fillRect(0, 0, ow, oh);
}

/* ==========================================================================
   THE MENDER — the player. A needle-spirit whose legs have already come
   undone into thread. Everything below the waist is unravelling behind her.
   ======================================================================== */
const P = {
  x: 0, y: 2.6, vx: 0, vy: 0,
  fireCD: 0, alt: 1, hitT: 0, invuln: 0,
  dashT: 0, dashCD: 0, dashX: 0, dashY: 0,
  bank: 0, pitch: 0, bob: 0, alive: true, deadT: 0,
  sx: 0, sy: 0, sk: 0
};
const TRAIL_N = 26;
const trailX = new Float32Array(TRAIL_N), trailY = new Float32Array(TRAIL_N);
let trailHead = 0, trailFill = 0;

function resetPlayer() {
  P.x = 0; P.y = 2.6; P.vx = 0; P.vy = 0; P.fireCD = 0; P.hitT = 0; P.invuln = 1.4;
  P.dashT = 0; P.dashCD = 0; P.bank = 0; P.pitch = 0; P.alive = true; P.deadT = 0;
  trailFill = 0; trailHead = 0;
}

function updatePlayer(dt) {
  readInput();
  const ACC = 92, MAXV = 15.5, FRIC = 11;

  if (P.alive) {
    if (dashEdge && P.dashCD <= 0) {
      dashEdge = false;
      P.dashCD = 1.9; P.dashT = 0.26;
      let dx = IN.x, dy = IN.y;
      if (IN.mode === "mouse") {
        dx = clamp((mouseTargetX() - P.x) * 0.6, -1, 1);
        dy = clamp((mouseTargetY() - P.y) * 0.6, -1, 1);
      }
      if (!dx && !dy) { dx = 0; dy = 0; G.surge = 0.55; }
      const L = Math.hypot(dx, dy) || 1;
      P.dashX = dx / L; P.dashY = dy / L;
      P.invuln = max(P.invuln, 0.34);
      Audio_.sfx("dash");
      for (let i = 0; i < 14; i++) {
        addParticle(P.x + rr(-.4, .4), P.y + rr(-.4, .4), PZ + rr(-.3, .3),
          rr(-3, 3), rr(-3, 3), rr(-16, -4), 0.45, 2, PAL.warp);
      }
    }
    dashEdge = false;

    if (P.dashT > 0) {
      P.dashT -= dt;
      P.vx = P.dashX * 42; P.vy = P.dashY * 32;
    } else if (IN.mode === "mouse" && G.t - IN.mouseT < 6) {
      const tx = mouseTargetX(), ty = mouseTargetY();
      P.vx = clamp((tx - P.x) * 13, -MAXV * 1.5, MAXV * 1.5);
      P.vy = clamp((ty - P.y) * 13, -MAXV * 1.3, MAXV * 1.3);
    } else {
      if (IN.x) P.vx = clamp(P.vx + IN.x * ACC * dt, -MAXV, MAXV);
      else P.vx -= P.vx * min(1, FRIC * dt);
      if (IN.y) P.vy = clamp(P.vy + IN.y * ACC * 0.82 * dt, -MAXV * .84, MAXV * .84);
      else P.vy -= P.vy * min(1, FRIC * dt);
    }
  } else {
    P.vx *= 1 - min(1, 2.2 * dt);
    P.vy -= 16 * dt;
  }

  P.x += P.vx * dt; P.y += P.vy * dt;
  if (P.x < -PLAY_W) { P.x = -PLAY_W; P.vx *= -0.22; }
  if (P.x > PLAY_W) { P.x = PLAY_W; P.vx *= -0.22; }
  if (P.y < PY_MIN) { P.y = PY_MIN; P.vy = max(0, P.vy) * 0.3; }
  if (P.y > PY_MAX) { P.y = PY_MAX; P.vy = min(0, P.vy) * 0.3; }

  P.bank += (clamp(-P.vx * 0.055, -0.62, 0.62) - P.bank) * min(1, 9 * dt);
  P.pitch += (clamp(P.vy * 0.03, -0.3, 0.3) - P.pitch) * min(1, 8 * dt);
  P.bob += dt * 3.1;
  if (P.dashCD > 0) P.dashCD -= dt;
  if (P.invuln > 0) P.invuln -= dt;
  if (P.hitT > 0) P.hitT -= dt;

  /* stitching */
  P.fireCD -= dt;
  if (P.alive && IN.fire && P.fireCD <= 0 && G.state === "play") {
    P.fireCD = 0.095;
    P.alt = -P.alt;
    fireStitch(P.x + P.alt * 0.42, P.y - 0.1);
    Audio_.sfx("shot");
    G.muzzle = 1;
  }
  if (G.muzzle > 0) G.muzzle -= dt * 7;

  /* screen anchor for this frame */
  project(P.x, P.y, PZ);
  P.sx = scrX; P.sy = scrY; P.sk = scrS;
  trailHead = (trailHead + 1) % TRAIL_N;
  trailX[trailHead] = P.sx; trailY[trailHead] = P.sy;
  if (trailFill < TRAIL_N) trailFill++;
}

function mouseTargetX() {
  return clamp((IN.mx - CX) / (W * 0.40) * PLAY_W, -PLAY_W, PLAY_W);
}
function mouseTargetY() {
  const t = clamp((IN.my - H * 0.20) / (H * 0.66), 0, 1);
  return lerp(PY_MAX, PY_MIN, t);
}

/* ------------------------------------------------------------- drawing -- */
function drawMenderShadow() {
  const z = PZ, k = (F * fovK) / z;
  const gy = clothY(P.x, z);
  const sx = CX + shX + (P.x - camX) * k;
  const sy = CY + shY + (camY - gy) * k;
  const hgt = clamp((P.y - gy) / 6, 0, 1);
  const r = k * (0.62 - hgt * 0.22);
  const a = (0.44 - hgt * 0.30) * (P.alive ? 1 : max(0, 1 - P.deadT));
  if (a <= 0.01) return;
  ctx.save();
  ctx.translate(sx, sy); ctx.scale(1, 0.30);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, CA(PAL.ink, a));
  g.addColorStop(0.6, CA(PAL.ink, a * 0.55));
  g.addColorStop(1, CA(PAL.ink, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawTrail() {
  if (trailFill < 4) return;
  ctx.save();
  ctx.lineCap = "round";
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    let first = true;
    for (let i = trailFill - 1; i >= 0; i--) {
      const idx = (trailHead - i + TRAIL_N * 2) % TRAIL_N;
      const t = 1 - i / trailFill;
      const wob = sin(G.t * 11 - i * 0.55) * (1 - t) * 7;
      const x = trailX[idx] + wob, y = trailY[idx] + (1 - t) * 12 + cos(G.t * 8 - i * .4) * (1 - t) * 3;
      if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = pass === 0 ? CA(PAL.accent, 0.16) : CA(PAL.beam, 0.55);
    ctx.lineWidth = pass === 0 ? 8 : 2.1;
    ctx.stroke();
  }
  ctx.restore();
}

function drawMender() {
  if (!P.alive && P.deadT > 1.1) return;
  const u = P.sk * 0.070;
  const flick = (P.invuln > 0 && P.hitT <= 0 && ((G.t * 22) | 0) % 2 === 0) ? 0.42 : 1;
  ctx.save();
  ctx.translate(P.sx, P.sy);
  if (!P.alive) {
    ctx.rotate(P.deadT * 5.5);
    ctx.globalAlpha = max(0, 1 - P.deadT * 0.9);
  } else {
    ctx.rotate(P.bank * 0.55);
    ctx.globalAlpha = flick;
  }
  const s = u * (1 + (P.dashT > 0 ? 0.12 : 0));
  ctx.scale(s, s);

  const dark = mixc(PAL.ink, [12, 10, 16], 0.5, [0, 0, 0]);
  const cloth = mixc(PAL.clothA, PAL.accent, 0.30, [0, 0, 0]);
  const hot = P.hitT > 0 ? 1 : 0;

  /* the unravelled lower half — a narrow bundle of thread streaming back */
  ctx.lineCap = "round";
  for (let i = 0; i < 8; i++) {
    const ph = G.t * 8 + i * 1.31;
    const sp = (i - 3.5) * 0.30;
    ctx.beginPath();
    ctx.moveTo(sp * 0.6, 4.2);
    ctx.quadraticCurveTo(sp * 1.2 + sin(ph) * 0.5, 8.5 + cos(ph * 0.7) * 0.8,
      sp * 1.7 + sin(ph * 1.3) * 1.0 - P.bank * 3.5, 14 + sin(ph) * 1.6);
    ctx.strokeStyle = i === 3 ? CA(PAL.accent, 0.45) : CA(cloth, 0.20);
    ctx.lineWidth = 0.26;
    ctx.stroke();
  }

  /* two long thin ribbons off the shoulders, snapping in the airflow */
  for (const sd of [-1, 1]) {
    for (let i = 0; i < 2; i++) {
      const ph = G.t * 7 + i * 2.4 + (sd > 0 ? 1.1 : 0);
      const sw = sin(ph) * 2.6 - P.bank * 6;
      ctx.beginPath();
      ctx.moveTo(sd * 2.4, -3.2);
      ctx.bezierCurveTo(
        sd * (3.5 + i * 0.5) + sw * 0.6, -0.8 + i,
        sd * (3.1 + i * 0.8) + sw, 5.4 + i * 1.4,
        sd * (1.9 + i * 1.1) + sw * 1.3, 12.0 + i * 2.4);
      ctx.strokeStyle = i === 0 ? CA(cloth, 0.85) : CA(scalec(cloth, 0.6, [0, 0, 0]), 0.6);
      ctx.lineWidth = i === 0 ? 1.5 : 0.9;
      ctx.stroke();
    }
  }

  /* arms, reaching up and forward to hold the needle out into the depth */
  ctx.strokeStyle = C(mixc(dark, cloth, 0.30, [0, 0, 0]));
  ctx.lineWidth = 1.15;
  ctx.lineCap = "round";
  for (const sd of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(sd * 2.9, -4.0);
    ctx.quadraticCurveTo(sd * 3.4, -6.4, sd * 0.9, -8.0);
    ctx.stroke();
  }

  /* the coat: broad shoulders, a waist, a hem that has begun to give */
  ctx.beginPath();
  ctx.moveTo(-3.35, -4.15);
  ctx.quadraticCurveTo(-3.55, -1.20, -1.85, 1.55);
  ctx.quadraticCurveTo(-2.35, 3.30, -2.60, 4.75);
  ctx.lineTo(-1.55, 3.85); ctx.lineTo(-0.95, 5.05);
  ctx.lineTo(0.00, 3.75); ctx.lineTo(0.95, 5.05);
  ctx.lineTo(1.55, 3.85); ctx.lineTo(2.60, 4.75);
  ctx.quadraticCurveTo(2.35, 3.30, 1.85, 1.55);
  ctx.quadraticCurveTo(3.55, -1.20, 3.35, -4.15);
  ctx.quadraticCurveTo(2.20, -5.35, 0.00, -5.50);
  ctx.quadraticCurveTo(-2.20, -5.35, -3.35, -4.15);
  ctx.closePath();
  const bg = ctx.createLinearGradient(-3.6, -5.6, 3.0, 3.6);
  bg.addColorStop(0, C(mixc(cloth, PAL.beam, 0.42 + hot * 0.45, [0, 0, 0])));
  bg.addColorStop(0.34, C(mixc(dark, cloth, 0.62, [0, 0, 0])));
  bg.addColorStop(0.74, C(mixc(dark, cloth, 0.22, [0, 0, 0])));
  bg.addColorStop(1, C(scalec(dark, 0.72, [0, 0, 0])));
  ctx.fillStyle = bg;
  ctx.fill();
  /* Beam-light along the top of the shoulders */
  ctx.beginPath();
  ctx.moveTo(-3.30, -4.20);
  ctx.quadraticCurveTo(-2.20, -5.40, 0.00, -5.55);
  ctx.quadraticCurveTo(2.20, -5.40, 3.30, -4.20);
  ctx.strokeStyle = CA(PAL.beam, 0.62);
  ctx.lineWidth = 0.46;
  ctx.stroke();

  /* one seam down the spine, cross-stitched shut */
  ctx.strokeStyle = CA(PAL.accent, 0.85);
  ctx.lineWidth = 0.26;
  ctx.beginPath();
  ctx.moveTo(0, -4.9); ctx.lineTo(0, 2.4);
  for (let i = 0; i < 4; i++) {
    const y = -3.7 + i * 1.75;
    ctx.moveTo(-0.62, y - 0.34); ctx.lineTo(0.62, y + 0.34);
    ctx.moveTo(0.62, y - 0.34); ctx.lineTo(-0.62, y + 0.34);
  }
  ctx.stroke();

  /* a hood, on a neck, so she reads as a person and not a beetle */
  ctx.fillStyle = C(scalec(dark, 0.55, [0, 0, 0]));
  ctx.fillRect(-0.72, -6.4, 1.44, 1.4);
  ctx.beginPath();
  ctx.moveTo(-1.62, -5.55);
  ctx.bezierCurveTo(-2.05, -7.30, -1.20, -8.85, 0, -8.85);
  ctx.bezierCurveTo(1.20, -8.85, 2.05, -7.30, 1.62, -5.55);
  ctx.quadraticCurveTo(0, -6.35, -1.62, -5.55);
  ctx.closePath();
  const hg = ctx.createLinearGradient(-2, -8.9, 1.6, -5.4);
  hg.addColorStop(0, C(mixc(cloth, PAL.beam, 0.34, [0, 0, 0])));
  hg.addColorStop(0.55, C(mixc(dark, cloth, 0.40, [0, 0, 0])));
  hg.addColorStop(1, C(scalec(dark, 0.5, [0, 0, 0])));
  ctx.fillStyle = hg;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-1.55, -6.30);
  ctx.bezierCurveTo(-1.85, -7.60, -1.05, -8.95, 0, -8.95);
  ctx.bezierCurveTo(1.05, -8.95, 1.85, -7.60, 1.55, -6.30);
  ctx.strokeStyle = CA(PAL.beam, 0.72);
  ctx.lineWidth = 0.38;
  ctx.stroke();

  /* the needle, held forward into the depth */
  const ng = ctx.createLinearGradient(0, -26, 0, -6);
  ng.addColorStop(0, CA(PAL.beam, 0.05));
  ng.addColorStop(0.45, CA(PAL.beam, 0.95));
  ng.addColorStop(1, C(mixc(PAL.warp, PAL.beam, 0.5, [0, 0, 0])));
  ctx.beginPath();
  ctx.moveTo(-0.36, -6.6);
  ctx.lineTo(-0.07, -27 - G.muzzle * 7);
  ctx.lineTo(0.07, -27 - G.muzzle * 7);
  ctx.lineTo(0.36, -6.6);
  ctx.closePath();
  ctx.fillStyle = ng;
  ctx.fill();
  /* the eye of the needle, with the thread still through it */
  ctx.beginPath();
  ctx.ellipse(0, -8.6, 0.5, 1.35, 0, 0, TAU);
  ctx.strokeStyle = CA(PAL.beam, 0.9); ctx.lineWidth = 0.28; ctx.stroke();

  if (G.muzzle > 0) {
    const mg = ctx.createRadialGradient(0, -25, 0, 0, -25, 8 * G.muzzle);
    mg.addColorStop(0, CA(PAL.beam, 0.85 * G.muzzle));
    mg.addColorStop(1, CA(PAL.accent, 0));
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(0, -25, 8 * G.muzzle, 0, TAU); ctx.fill();
  }
  if (hot) {
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(255,120,110," + (0.45 * P.hitT / 0.3) + ")";
    ctx.beginPath(); ctx.arc(0, -2, 9, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* dash after-image */
  if (P.dashT > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const a = P.dashT / 0.26;
    for (let i = 1; i <= 3; i++) {
      const off = i * 15 * a;
      ctx.globalAlpha = 0.16 * a / i;
      ctx.beginPath();
      ctx.ellipse(P.sx - P.dashX * off, P.sy + P.dashY * off, u * 5, u * 9, 0, 0, TAU);
      ctx.fillStyle = C(PAL.beam);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ==========================================================================
   STITCHES — the player's shot. A stitch flies out on a thread.
   ======================================================================== */
const bullets = [];
const bulletPool = [];
function fireStitch(x, y) {
  const b = bulletPool.pop() || {};
  b.x = x; b.y = y; b.z = PZ + 0.7;
  b.vx = 0; b.vy = 0; b.life = 2.4; b.dead = false;
  b.spin = rnd() * TAU;
  bullets.push(b);
}
function updateBullets(dt) {
  const vz = BULLET_V - G.speed;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    /* the thread wants to find what it should be sewn to */
    let best = null, bestD = 1e9;
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (e.dead || e.z < b.z + 1) continue;
      const dz = e.z - b.z;
      if (dz > 46) continue;
      const dx = e.x - b.x, dy = e.y - b.y;
      const d = dx * dx + dy * dy;
      if (d < 9 && d < bestD) { bestD = d; best = e; }
    }
    if (!best && BOSS.active && BOSS.z > b.z + 1 && BOSS.z - b.z < 46) {
      const dx = BOSS.x - b.x, dy = BOSS.y - b.y;
      if (dx * dx + dy * dy < 16) best = BOSS;
    }
    if (best) {
      b.vx += clamp(best.x - b.x, -1, 1) * 15 * dt;
      b.vy += clamp(best.y - b.y, -1, 1) * 15 * dt;
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += vz * dt;
    b.life -= dt;
    if (b.life <= 0 || b.z > 210 || b.dead) {
      bullets.splice(i, 1); bulletPool.push(b);
    }
  }
}
function drawBullet(b) {
  const k = project(b.x, b.y, b.z);
  const x = scrX, y = scrY;
  if (x < -40 || x > W + 40) return;
  const back = project(b.x - b.vx * 0.02, b.y - b.vy * 0.02, b.z - 3.4);
  const bx = scrX, by = scrY;
  const s = max(0.8, k * 0.030);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = CA(PAL.accent, 0.42);
  ctx.lineWidth = max(0.6, s * 0.34);
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(x, y); ctx.stroke();
  /* the stitch itself: a small bright cross */
  ctx.translate(x, y);
  ctx.rotate(b.spin + G.t * 3);
  ctx.strokeStyle = CA(PAL.beam, 0.95);
  ctx.lineWidth = max(0.8, s * 0.42);
  ctx.beginPath();
  ctx.moveTo(-s, -s); ctx.lineTo(s, s);
  ctx.moveTo(s, -s); ctx.lineTo(-s, s);
  ctx.stroke();
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 3);
  g.addColorStop(0, CA(PAL.beam, 0.5));
  g.addColorStop(1, CA(PAL.accent, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, s * 3, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ==========================================================================
   THORNS — what shoots back
   ======================================================================== */
const thorns = [];
const thornPool = [];
function fireThorn(x, y, z, spd, lead) {
  const t = thornPool.pop() || {};
  const tz = max(2, z - PZ);
  const tt = tz / spd;
  t.x = x; t.y = y; t.z = z;
  const aimx = P.x + P.vx * (lead || 0) * tt, aimy = P.y + P.vy * (lead || 0) * tt;
  t.vx = (aimx - x) / tt; t.vy = (aimy - y) / tt; t.vz = -spd;
  t.life = 6; t.spin = rnd() * TAU; t.dead = false;
  thorns.push(t);
  Audio_.sfx("thorn");
}
function updateThorns(dt) {
  for (let i = thorns.length - 1; i >= 0; i--) {
    const t = thorns[i];
    t.x += t.vx * dt; t.y += t.vy * dt;
    t.z += (t.vz - G.speed * 0.15) * dt;
    t.life -= dt;
    if (t.z < 0.6 || t.life <= 0 || t.dead) { thorns.splice(i, 1); thornPool.push(t); }
  }
}
function drawThorn(t) {
  const k = project(t.x, t.y, t.z);
  const x = scrX, y = scrY;
  if (x < -50 || x > W + 50) return;
  const s = max(1.2, k * 0.055);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(t.spin + G.t * 6);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 2.6);
  g.addColorStop(0, CA(PAL.accent2, 0.55));
  g.addColorStop(1, CA(PAL.accent2, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, s * 2.6, 0, TAU); ctx.fill();
  ctx.fillStyle = C(PAL.accent2);
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = i / 3 * TAU;
    ctx.moveTo(0, 0);
    ctx.lineTo(cos(a) * s * 1.9, sin(a) * s * 1.9);
    ctx.lineTo(cos(a + 1.0) * s * 0.55, sin(a + 1.0) * s * 0.55);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = CA(PAL.beam, 0.9);
  ctx.beginPath(); ctx.arc(0, 0, s * 0.5, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ==========================================================================
   PARTICLES — lint, dust, thread ends, sparks, steam
   ======================================================================== */
const MAXPART = 560;
const parts = [];
const partPool = [];
/* kind: 0 dust  1 spark  2 thread  3 ring  4 steam  5 ember */
function addParticle(x, y, z, vx, vy, vz, life, kind, col, size) {
  if (parts.length >= MAXPART) return null;
  const p = partPool.pop() || {};
  p.x = x; p.y = y; p.z = z; p.vx = vx; p.vy = vy; p.vz = vz;
  p.life = life; p.max = life; p.kind = kind;
  p.col = col || PAL.warp; p.size = size || 1;
  p.rot = rnd() * TAU; p.spin = rr(-7, 7);
  parts.push(p);
  return p;
}
function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.z += (p.vz - G.speed) * dt;
    p.rot += p.spin * dt;
    if (p.kind === 1) { p.vy -= 13 * dt; p.vx *= 1 - min(1, 1.2 * dt); }
    else if (p.kind === 0) { p.vy += 1.1 * dt; p.vx *= 1 - min(1, 1.6 * dt); p.vy *= 1 - min(1, 1.6 * dt); }
    else if (p.kind === 4) { p.vy += 3.2 * dt; p.vx *= 1 - min(1, 0.7 * dt); }
    else if (p.kind === 2) { p.vy -= 5 * dt; }
    else if (p.kind === 5) { p.vy += 2.4 * dt; p.vx += sin(G.t * 3 + p.rot) * 2 * dt; }
    p.life -= dt;
    if (p.life <= 0 || p.z < 0.5) { parts.splice(i, 1); partPool.push(p); }
  }
}
function drawParticle(p) {
  const k = project(p.x, p.y, p.z);
  const x = scrX, y = scrY;
  if (x < -60 || x > W + 60 || y < -60 || y > H + 60) return;
  const t = p.life / p.max;
  const s = max(0.5, k * 0.02 * p.size);
  switch (p.kind) {
    case 3: {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = CA(p.col, 0.55 * t);
      ctx.lineWidth = max(0.8, s * 0.4);
      ctx.beginPath();
      ctx.ellipse(x, y, s * 9 * (1.35 - t), s * 9 * (1.35 - t) * 0.55, 0, 0, TAU);
      ctx.stroke();
      ctx.restore();
      break;
    }
    case 2: {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(p.rot);
      ctx.strokeStyle = CA(p.col, 0.8 * t);
      ctx.lineWidth = max(0.6, s * 0.28);
      ctx.beginPath(); ctx.moveTo(-s * 2.2, 0); ctx.lineTo(s * 2.2, 0); ctx.stroke();
      ctx.restore();
      break;
    }
    case 1: {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createRadialGradient(x, y, 0, x, y, s * 3.2);
      g.addColorStop(0, CA(p.col, 0.9 * t));
      g.addColorStop(1, CA(p.col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, s * 3.2, 0, TAU); ctx.fill();
      ctx.restore();
      break;
    }
    case 4: case 0: default: {
      const a = (p.kind === 4 ? 0.30 : 0.55) * t;
      if (s < 2.3) {
        ctx.fillStyle = CA(p.col, a * 0.85);
        const q = max(1, s * 2);
        ctx.fillRect(x - q * 0.5, y - q * 0.5, q, q);
        break;
      }
      const g = ctx.createRadialGradient(x, y, 0, x, y, s * 4.2);
      g.addColorStop(0, CA(p.col, a));
      g.addColorStop(1, CA(p.col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, s * 4.2, 0, TAU); ctx.fill();
      break;
    }
    case 5: {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = CA(p.col, 0.8 * t);
      ctx.fillRect(x - s, y - s, s * 2, s * 2);
      ctx.restore();
      break;
    }
  }
}
function burst(x, y, z, n, col, spd, kind, life) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU, e = rnd() * PI - PI / 2;
    const v = spd * (0.35 + rnd() * 0.85);
    addParticle(x, y, z,
      cos(a) * cos(e) * v, sin(e) * v, sin(a) * cos(e) * v * 0.7,
      life * (0.6 + rnd() * 0.7), kind, col, 0.7 + rnd() * 0.9);
  }
}

/* ==========================================================================
   SPOOLS — dropped thread. Picking one up mends you.
   ======================================================================== */
const pickups = [];
function addPickup(x, y, z, kind) {
  pickups.push({ x, y, z, kind: kind || 0, t: 0, dead: false });
}
function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.t += dt;
    p.z -= G.speed * dt;
    p.y += sin(p.t * 3) * 1.1 * dt;
    /* magnetism once it is close */
    if (p.z < PZ + 26) {
      p.x += clamp(P.x - p.x, -1, 1) * 7 * dt;
      p.y += clamp(P.y - p.y, -1, 1) * 6 * dt;
    }
    if (p.z < PZ + 1.1 && p.z > PZ - 2.4) {
      const dx = abs(p.x - P.x), dy = abs(p.y - P.y);
      if (dx < 1.5 && dy < 1.5) {
        p.dead = true;
        Audio_.sfx("pickup");
        if (p.kind === 1) { G.fray = max(0, G.fray - 34); G.floatText("MENDED", PAL.accent2); }
        else { G.fray = max(0, G.fray - 13); G.addScore(500, false); }
        burst(p.x, p.y, p.z, 16, PAL.accent, 8, 1, 0.6);
      }
    }
    if (p.dead || p.z < 0.6) pickups.splice(i, 1);
  }
}
function drawPickup(p) {
  const k = project(p.x, p.y, p.z);
  const x = scrX, y = scrY;
  const s = max(1.5, k * 0.075);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(sin(p.t * 2) * 0.35);
  const col = p.kind === 1 ? PAL.accent2 : PAL.accent;
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 3.4);
  g.addColorStop(0, CA(col, 0.55));
  g.addColorStop(1, CA(col, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, s * 3.4, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = "source-over";
  /* a spool: two flanges and a wound barrel */
  ctx.fillStyle = C(mixc(col, PAL.ink, 0.45, [0, 0, 0]));
  ctx.fillRect(-s * 1.15, -s * 1.4, s * 2.3, s * 0.42);
  ctx.fillRect(-s * 1.15, s * 0.98, s * 2.3, s * 0.42);
  ctx.fillStyle = C(col);
  ctx.fillRect(-s * 0.82, -s * 1.05, s * 1.64, s * 2.1);
  ctx.strokeStyle = CA(PAL.beam, 0.55);
  ctx.lineWidth = max(0.4, s * 0.09);
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const yy = -s * 0.9 + i * s * 0.45;
    ctx.moveTo(-s * 0.82, yy); ctx.lineTo(s * 0.82, yy + s * 0.16);
  }
  ctx.stroke();
  ctx.restore();
}
