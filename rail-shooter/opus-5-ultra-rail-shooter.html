      rg.addColorStop(1, C(scalec(steel, 0.5, [0, 0, 0])));
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.30, 0, TAU); ctx.fill();
    }
  }
};

function spawnEnemy(type, x, y, z, opt) {
  const cfg = ET[type];
  const e = enemyPool.pop() || {};
  e.type = type; e.x = x; e.y = y; e.z = z === undefined ? 205 : z;
  e.ax = x; e.ay = y; e.t = 0; e.ph = rnd() * TAU;
  e.amp = opt && opt.amp !== undefined ? opt.amp : rr(1.2, 3.4);
  e.hp = (opt && opt.hp) || Math.round(cfg.hp * G.hpScale);
  e.maxhp = e.hp;
  e.r = cfg.r * ((opt && opt.scale) || 1);
  e.dead = false; e.hitT = 0; e.fireT = rr(0.4, 1.4); e.flash = 0;
  e.dived = false; e.snapped = false; e.roll = 0; e.open = 0.6;
  e.tx = x; e.ty = y; e.grazed = false;
  e.spd = cfg.spd * (opt && opt.spd !== undefined ? opt.spd : 1);
  enemies.push(e);
  return e;
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt;
    e.z -= (G.speed + e.spd) * dt;
    ET[e.type].ai(e, dt);
    if (e.hitT > 0) e.hitT -= dt;
    if (e.dead || e.z < 0.4) { enemies.splice(i, 1); enemyPool.push(e); }
  }
}

function drawEnemy(e) {
  const k = project(e.x, e.y, e.z);
  const x = scrX, y = scrY;
  const s = k * e.r * 0.5;
  if (s < 0.5 || x + s * 3 < 0 || x - s * 3 > W) return;
  const vis = clamp(1 - fogAt(e.z) * 0.88, 0, 1);
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = vis;
  ET[e.type].draw(e, s);
  ctx.restore();
  if (e.hitT > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const a = clamp(e.hitT / 0.12, 0, 1) * 0.65 * vis;
    const g = ctx.createRadialGradient(x, y, s * 0.35, x, y, s * 2.0);
    g.addColorStop(0, "rgba(255,255,255,0)");
    g.addColorStop(0.55, "rgba(255,245,225," + (a).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,220,180,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, s * 2.0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function killEnemy(e, byPlayer) {
  if (e.dead) return;
  e.dead = true;
  const cfg = ET[e.type];
  const big = cfg.score >= 400;
  if (byPlayer) {
    G.comboKills++;
    G.addScore(cfg.score, true);
    G.fray = max(0, G.fray - 0.9);
    Audio_.sfx(big ? "killbig" : "kill");
    G.shake(big ? 5 : 2, big ? 0.20 : 0.10);
  }
  burst(e.x, e.y, e.z, big ? 22 : 13, PAL.fine, big ? 13 : 9, 0, 0.85);
  burst(e.x, e.y, e.z, big ? 14 : 8, PAL.accent, big ? 17 : 11, 1, 0.5);
  burst(e.x, e.y, e.z, big ? 10 : 5, PAL.warp, 8, 2, 0.7);
  addParticle(e.x, e.y, e.z, 0, 0, 0, 0.42, 3, PAL.beam, e.r * 1.6);
  if (cfg.splits && byPlayer) {
    for (let i = 0; i < cfg.splits; i++) {
      const c = spawnEnemy("wraithlet", e.x + rr(-1.5, 1.5), e.y + rr(-1, 1), e.z, { amp: rr(0.6, 1.6) });
      c.ax = c.x; c.ay = c.y;
    }
  }
  if (e.type === "bobbin" && byPlayer && chance(0.30)) addPickup(e.x, e.y, e.z, 0);
  if (big && byPlayer && chance(0.14)) addPickup(e.x, e.y, e.z, 1);
}

/* ==========================================================================
   THE STANDING THINGS — dodge these. Most of them will not move.
   ======================================================================== */
const obstacles = [];
let obNextZ = 0;

const OB = {
  warppost: { rx: 0.62, top: 99, hp: 0, score: 0 },
  pin: { rx: 1.05, top: 4.6, hp: 0, score: 0 },
  thimble: { rx: 2.15, top: 2.9, hp: 0, score: 0 },
  spool: { rx: 1.45, top: 3.6, hp: 5, score: 350 }
};

function addObstacle(kind, x, z) {
  obstacles.push({
    kind, x, z, hp: OB[kind].hp * (G.hpScale > 1 ? 2 : 1), hitT: 0,
    s: rnd() * 10, dead: false, grazed: false, lean: rr(-0.25, 0.25)
  });
}

function updateObstacles(dt) {
  /* formations, so there is always a way through if you read it early */
  if (BOSS.active) obNextZ = max(obNextZ, G.dist + ZFAR);
  while (obNextZ < G.dist + ZFAR * 0.9) {
    obNextZ += G.obGap * rr(0.75, 1.35);
    const z = obNextZ;
    const roll = rnd();
    const kinds = G.obKinds;
    if (roll < 0.34) {
      addObstacle(pick(kinds), rr(-PLAY_W - 1, PLAY_W + 1), z);
    } else if (roll < 0.60) {
      const gap = rr(-PLAY_W * 0.55, PLAY_W * 0.55);
      addObstacle(pick(kinds), gap - rr(3.4, 5.5), z);
      addObstacle(pick(kinds), gap + rr(3.4, 5.5), z);
    } else if (roll < 0.82) {
      const open = ri(0, 3);
      for (let i = 0; i < 4; i++) {
        if (i === open) continue;
        addObstacle(pick(kinds), -PLAY_W - 1 + i * (PLAY_W * 2 + 2) / 3, z);
      }
    } else {
      for (let i = 0; i < 3; i++) {
        addObstacle(pick(kinds), (i % 2 ? 1 : -1) * rr(2.5, PLAY_W), z + i * 11);
      }
      obNextZ += 22;
    }
  }
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.z -= G.speed * dt;
    if (o.hitT > 0) o.hitT -= dt;
    if (o.dead || o.z < 0.4) obstacles.splice(i, 1);
  }
}

function drawObstacle(o) {
  const z = o.z;
  const k = project(o.x, clothY(o.x, z), z);
  const bx = scrX, by = scrY;
  const s = k;
  if (bx + s * 3 < 0 || bx - s * 3 > W) return;
  const vis = clamp(1 - fogAt(z) * 0.9, 0, 1);
  if (vis <= 0.015) return;
  ctx.save();
  ctx.globalAlpha = vis;
  const hot = o.hitT > 0;

  if (o.kind === "warppost") {
    /* a warp thread under tension, running from the cloth up out of sight */
    const topY = max(-80, CY + shY + (camY - 40) * k);
    const wdt = max(1, 0.13 * k);
    const g = ctx.createLinearGradient(bx - wdt, 0, bx + wdt, 0);
    g.addColorStop(0, C(scalec(PAL.warp, 0.42, [0, 0, 0])));
    g.addColorStop(0.35, C(mixc(PAL.warp, PAL.beam, 0.55, [0, 0, 0])));
    g.addColorStop(1, C(scalec(PAL.warp, 0.55, [0, 0, 0])));
    ctx.fillStyle = g;
    ctx.fillRect(bx - wdt, topY, wdt * 2, by - topY);
    /* the bobbin anchoring it */
    ctx.fillStyle = C(mixc(PAL.clothLow, PAL.ink, 0.3, [0, 0, 0]));
    ctx.beginPath(); ctx.ellipse(bx, by, 0.62 * k, 0.20 * k, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = C(mixc(PAL.clothLow, PAL.accent, 0.35, [0, 0, 0]));
    ctx.fillRect(bx - 0.34 * k, by - 0.62 * k, 0.68 * k, 0.62 * k);
    ctx.fillStyle = CA(PAL.beam, 0.5);
    ctx.fillRect(bx - 0.34 * k, by - 0.62 * k, 0.10 * k, 0.62 * k);
  } else if (o.kind === "pin") {
    const topY = CY + shY + (camY - 4.6) * k;
    const lean = o.lean * 0.5 * k;
    const wdt = max(1, 0.10 * k);
    const g = ctx.createLinearGradient(bx - wdt, 0, bx + wdt, 0);
    g.addColorStop(0, C(scalec(PAL.warp, 0.35, [0, 0, 0])));
    g.addColorStop(0.4, C(PAL.beam));
    g.addColorStop(1, C(scalec(PAL.warp, 0.5, [0, 0, 0])));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(bx - wdt, by); ctx.lineTo(bx + wdt, by);
    ctx.lineTo(bx + lean + wdt * 1.4, topY); ctx.lineTo(bx + lean - wdt * 1.4, topY);
    ctx.closePath(); ctx.fill();
    const hr = 0.55 * k;
    const hg = ctx.createRadialGradient(bx + lean - hr * 0.35, topY - hr * 1.3, 0,
      bx + lean, topY - hr * 0.8, hr * 1.3);
    hg.addColorStop(0, C(PAL.beam));
    hg.addColorStop(0.45, C(mixc(PAL.accent, PAL.beam, 0.35, [0, 0, 0])));
    hg.addColorStop(1, C(scalec(PAL.accent, 0.35, [0, 0, 0])));
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(bx + lean, topY - hr * 0.8, hr, 0, TAU); ctx.fill();
    ctx.fillStyle = CA(PAL.beam, 0.9);
    ctx.beginPath(); ctx.arc(bx + lean - hr * 0.35, topY - hr * 1.2, hr * 0.24, 0, TAU); ctx.fill();
  } else if (o.kind === "thimble") {
    const hgt = 2.9 * k;
    const rw = 2.0 * k;
    const g = ctx.createLinearGradient(bx - rw, 0, bx + rw, 0);
    const met = mixc(PAL.warp, [170, 165, 150], 0.5, [0, 0, 0]);
    g.addColorStop(0, C(scalec(met, 0.32, [0, 0, 0])));
    g.addColorStop(0.34, C(mixc(met, PAL.beam, 0.5, [0, 0, 0])));
    g.addColorStop(0.62, C(met));
    g.addColorStop(1, C(scalec(met, 0.4, [0, 0, 0])));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(bx - rw, by);
    ctx.lineTo(bx - rw * 0.86, by - hgt * 0.62);
    ctx.quadraticCurveTo(bx - rw * 0.72, by - hgt, bx, by - hgt);
    ctx.quadraticCurveTo(bx + rw * 0.72, by - hgt, bx + rw * 0.86, by - hgt * 0.62);
    ctx.lineTo(bx + rw, by);
    ctx.closePath(); ctx.fill();
    /* dimples */
    ctx.fillStyle = CA(PAL.ink, 0.30);
    for (let r0 = 0; r0 < 4; r0++) {
      for (let c0 = 0; c0 < 7; c0++) {
        const dx = (c0 - 3) * rw * 0.24 * (1 - r0 * 0.06);
        const dy = by - hgt * (0.20 + r0 * 0.18);
        if (abs(dx) > rw * 0.8) continue;
        ctx.beginPath(); ctx.arc(bx + dx, dy, max(0.5, rw * 0.055), 0, TAU); ctx.fill();
      }
    }
    ctx.strokeStyle = CA(PAL.beam, 0.5);
    ctx.lineWidth = max(0.6, rw * 0.05);
    ctx.beginPath();
    ctx.moveTo(bx - rw * 0.88, by - hgt * 0.56);
    ctx.quadraticCurveTo(bx - rw * 0.7, by - hgt * 0.98, bx - rw * 0.1, by - hgt * 1.0);
    ctx.stroke();
  } else {
    /* spool tower — the only one you can shoot down */
    const unit = 1.15 * k;
    for (let i = 0; i < 3; i++) {
      const yb = by - i * unit * 1.05;
      const wob = sin(o.s + i + G.t * 0.8) * 0.05 * k;
      ctx.fillStyle = C(scalec(mixc(PAL.clothLow, [150, 104, 58], 0.55, [0, 0, 0]), 0.75, [0, 0, 0]));
      ctx.beginPath(); ctx.ellipse(bx + wob, yb, unit * 0.95, unit * 0.22, 0, 0, TAU); ctx.fill();
      const g = ctx.createLinearGradient(bx - unit * 0.7, 0, bx + unit * 0.7, 0);
      const col = hot ? PAL.beam : PAL.accent;
      g.addColorStop(0, C(scalec(col, 0.35, [0, 0, 0])));
      g.addColorStop(0.42, C(col));
      g.addColorStop(1, C(scalec(col, 0.48, [0, 0, 0])));
      ctx.fillStyle = g;
      ctx.fillRect(bx + wob - unit * 0.68, yb - unit * 0.86, unit * 1.36, unit * 0.86);
      ctx.fillStyle = C(mixc(PAL.clothLow, [150, 104, 58], 0.55, [0, 0, 0]));
      ctx.beginPath(); ctx.ellipse(bx + wob, yb - unit * 0.86, unit * 0.95, unit * 0.22, 0, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

/* ==========================================================================
   HAZARDS — the shapes that close on you. Everything a boss throws that
   is not a thorn is one of these: a thing at depth, coming.
   ======================================================================== */
const hazards = [];
/* kind: rip | lashH | lashV | lattice | scalewall */
function addHazard(kind, o) {
  const h = {
    kind, z: o.z === undefined ? 130 : o.z, vz: o.vz || 66,
    y: o.y || 0, x: o.x || 0, gx: o.gx || 0, gy: o.gy || 2.8,
    gr: o.gr || 2.2, gw: o.gw || 2.2, h: o.h || 2.4,
    t: 0, s: rnd() * 10, done: false, dmg: o.dmg || 20
  };
  hazards.push(h);
  return h;
}
function hazardPasses(h) {
  switch (h.kind) {
    case "rip": return P.y >= h.h;
    case "lashH": return abs(P.y - h.y) > 1.05;
    case "lashV": return abs(P.x - h.x) > 1.15;
    case "lattice": return abs(P.x - h.gx) < h.gw;
    case "scalewall": {
      const dx = (P.x - h.gx) / h.gr, dy = (P.y - h.gy) / (h.gr * 0.85);
      return dx * dx + dy * dy < 1;
    }
  }
  return true;
}
function updateHazards(dt) {
  for (let i = hazards.length - 1; i >= 0; i--) {
    const h = hazards[i];
    const pz = h.z;
    h.t += dt;
    h.z -= (h.vz + G.speed * 0.35) * dt;
    if (!h.done && pz > PZ && h.z <= PZ) {
      h.done = true;
      if (!hazardPasses(h)) hurtPlayer(h.dmg);
      else { G.addScore(160, false); G.floatText("THREADED", PAL.accent2); Audio_.sfx("graze"); }
    }
    if (h.z < 0.4 || h.t > 14) hazards.splice(i, 1);
  }
}
function drawHazard(h) {
  const z = h.z;
  if (z < 0.6) return;
  const k = (F * fovK) / z;
  const vis = clamp(1 - fogAt(z) * 0.75, 0, 1);
  const warn = h.z > PZ + 6 ? 1 : max(0, (h.z - PZ) / 6);
  ctx.save();
  ctx.globalAlpha = vis;
  if (h.kind === "rip") {
    /* a seam torn open across the cloth, racing at you */
    const yb = CY + shY + camY * k;
    const hgt = h.h * k;
    ctx.beginPath();
    ctx.moveTo(-20, yb);
    for (let i = 0; i <= 26; i++) {
      const t = i / 26;
      const xx = -20 + (W + 40) * t;
      const jag = (vnoise(t * 9 + h.s, h.s) - 0.5) * hgt * 0.55;
      ctx.lineTo(xx, yb - hgt * 0.30 + jag);
    }
    ctx.lineTo(W + 20, yb + hgt * 0.4);
    ctx.lineTo(-20, yb + hgt * 0.4);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, yb - hgt * 0.7, 0, yb + hgt * 0.4);
    g.addColorStop(0, "rgba(255,236,190,0.0)");
    g.addColorStop(0.35, CA(PAL.accent, 0.75));
    g.addColorStop(0.7, "rgba(8,4,10,0.92)");
    g.addColorStop(1, "rgba(4,2,6,0.85)");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = CA(PAL.beam, 0.9);
    ctx.lineWidth = max(1, 0.05 * k);
    ctx.beginPath();
    for (let i = 0; i <= 26; i++) {
      const t = i / 26, xx = -20 + (W + 40) * t;
      const jag = (vnoise(t * 9 + h.s, h.s) - 0.5) * hgt * 0.55;
      if (i === 0) ctx.moveTo(xx, yb - hgt * 0.30 + jag); else ctx.lineTo(xx, yb - hgt * 0.30 + jag);
    }
    ctx.stroke();
    /* threads standing up out of the tear */
    ctx.strokeStyle = CA(PAL.warp, 0.55);
    ctx.lineWidth = max(0.6, 0.02 * k);
    ctx.beginPath();
    for (let i = 0; i < 34; i++) {
      const t = (i + 0.5) / 34, xx = -20 + (W + 40) * t;
      const hh = hgt * (0.3 + 0.6 * vnoise(t * 17 + h.s, 3.3));
      ctx.moveTo(xx, yb - hgt * 0.30);
      ctx.lineTo(xx + sin(h.t * 9 + i) * hgt * 0.12, yb - hgt * 0.30 - hh);
    }
    ctx.stroke();
  } else if (h.kind === "lashH") {
    const yy = CY + shY + (camY - h.y) * k;
    const sag = 0.06 * k;
    ctx.strokeStyle = CA(PAL.accent, 0.35 + 0.4 * warn);
    ctx.lineWidth = max(3, 0.20 * k);
    ctx.beginPath();
    ctx.moveTo(-30, yy);
    ctx.quadraticCurveTo(CX, yy + sag + sin(h.t * 18) * 0.05 * k, W + 30, yy);
    ctx.stroke();
    ctx.strokeStyle = CA(PAL.beam, 0.95);
    ctx.lineWidth = max(1, 0.06 * k);
    ctx.beginPath();
    ctx.moveTo(-30, yy);
    ctx.quadraticCurveTo(CX, yy + sag + sin(h.t * 18) * 0.05 * k, W + 30, yy);
    ctx.stroke();
  } else if (h.kind === "lashV") {
    const xx = CX + shX + (h.x - camX) * k;
    ctx.strokeStyle = CA(PAL.accent, 0.35 + 0.4 * warn);
    ctx.lineWidth = max(3, 0.20 * k);
    ctx.beginPath(); ctx.moveTo(xx, -30); ctx.lineTo(xx + sin(h.t * 16) * 0.04 * k, H + 30); ctx.stroke();
    ctx.strokeStyle = CA(PAL.beam, 0.95);
    ctx.lineWidth = max(1, 0.06 * k);
    ctx.beginPath(); ctx.moveTo(xx, -30); ctx.lineTo(xx + sin(h.t * 16) * 0.04 * k, H + 30); ctx.stroke();
  } else if (h.kind === "lattice") {
    const yb = min(H + 160, CY + shY + camY * k);
    const yt = max(-160, CY + shY + (camY - 13) * k);
    /* bars start exactly at the edge of the gap, so what you see is what hits */
    for (let n = 0; n <= 7; n++) {
      for (const sd of [-1, 1]) {
        const wx = h.gx + sd * (h.gw + 0.35 + n * 1.75);
        const xx = CX + shX + (wx - camX) * k;
        if (xx < -40 || xx > W + 40) continue;
        const wdt = max(1.4, 0.30 * k);
        const g = ctx.createLinearGradient(xx - wdt, 0, xx + wdt, 0);
        g.addColorStop(0, CA(PAL.warp, 0.4));
        g.addColorStop(0.4, CA(PAL.beam, 0.95));
        g.addColorStop(1, CA(PAL.warp, 0.5));
        ctx.fillStyle = g;
        ctx.fillRect(xx - wdt, yt, wdt * 2, yb - yt);
      }
    }
    /* the gap glows so you can find it early */
    const gxs = CX + shX + (h.gx - camX) * k;
    ctx.strokeStyle = CA(PAL.accent2, 0.5 + 0.3 * sin(h.t * 9));
    ctx.lineWidth = max(1, 0.05 * k);
    ctx.strokeRect(gxs - h.gw * k, yt, h.gw * 2 * k, yb - yt);
  } else if (h.kind === "scalewall") {
    /* a curtain of wing-scales with one hole in it */
    const gxs = CX + shX + (h.gx - camX) * k;
    const gys = CY + shY + (camY - h.gy) * k;
    const gr = h.gr * k;
    ctx.save();
    ctx.beginPath();
    ctx.rect(-40, -40, W + 80, H + 80);
    ctx.moveTo(gxs + gr, gys);
    ctx.ellipse(gxs, gys, gr, gr * 0.85, 0, 0, TAU, true);
    ctx.clip();
    const cols = 22, rows = 9;
    for (let r0 = 0; r0 < rows; r0++) {
      for (let c0 = 0; c0 < cols; c0++) {
        const wx = h.gx + (c0 - cols / 2) * 1.9 + (r0 % 2) * 0.95;
        const wy = 0.5 + r0 * 1.65;
        const xx = CX + shX + (wx - camX) * k;
        const yy = CY + shY + (camY - wy) * k;
        if (xx < -30 || xx > W + 30 || yy < -30 || yy > H + 30) continue;
        const sc = 0.85 * k * 0.55;
        const n = vnoise(c0 * 1.7 + h.s, r0 * 1.3);
        ctx.fillStyle = CA(mixc(PAL.clothB, [180, 170, 200], 0.35 + n * 0.4, [0, 0, 0]),
          0.55 + n * 0.35);
        ctx.beginPath();
        ctx.ellipse(xx, yy + sin(h.t * 4 + c0 + r0) * sc * 0.12, sc * 0.5, sc * 0.85,
          sin(c0 + r0 + h.s) * 0.4, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
    ctx.strokeStyle = CA(PAL.accent, 0.75);
    ctx.lineWidth = max(1.4, 0.05 * k);
    ctx.beginPath(); ctx.ellipse(gxs, gys, gr, gr * 0.85, 0, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

/* ==========================================================================
   BOSSES
   ======================================================================== */
const BOSS = {
  active: false, def: null, idx: 0,
  x: 0, y: 3.2, z: 30, hp: 1, maxhp: 1, t: 0, hitT: 0,
  state: "enter", stT: 0, phase: 0, atk: "", atkT: 0, tellT: 0, tellMax: 1,
  parts: [], dieT: 0, r: 7, shielded: false, homeZ: 28, sway: 0, dead: true,
  beamX: null, beamT: 0, beamDir: 1, rage: 0, eyeAim: 0, passY: 3.4, passLock: false
};
/* how big a boss draws, in screen units per world unit of its radius */
const BS = 0.38;

function bossStart(idx) {
  const def = BOSSDEF[idx];
  BOSS.active = true; BOSS.def = def; BOSS.idx = idx;
  BOSS.x = 0; BOSS.y = def.y; BOSS.z = 170; BOSS.homeZ = def.z;
  BOSS.maxhp = Math.round(def.hp * G.hpScale);
  BOSS.hp = BOSS.maxhp;
  BOSS.t = 0; BOSS.state = "enter"; BOSS.stT = 0; BOSS.phase = 0;
  BOSS.atk = ""; BOSS.atkT = 0; BOSS.tellT = 0; BOSS.dieT = 0; BOSS.hitT = 0;
  BOSS.r = def.r; BOSS.dead = false; BOSS.beamX = null; BOSS.rage = 0;
  BOSS.eyeAim = 0; BOSS.passY = def.y; BOSS.passLock = false; BOSS.sway = 0;
  BOSS.parts = def.parts ? def.parts.map(p => ({
    ox: p.ox, oy: p.oy, r: p.r, hp: Math.round(p.hp * G.hpScale),
    maxhp: Math.round(p.hp * G.hpScale), alive: true, kind: p.kind, hitT: 0
  })) : [];
  BOSS.shielded = BOSS.parts.some(p => p.kind === "shield");
  Audio_.setTrack("boss");
  G.banner(def.name, def.title, 3.4);
  Audio_.sfx("warn");
}

function bossAliveShields() {
  let n = 0;
  for (const p of BOSS.parts) if (p.alive && p.kind === "shield") n++;
  return n;
}

function bossHit(dmg, wx, wy) {
  const b = BOSS;
  if (!b.active || b.state === "enter" || b.state === "die") return false;
  /* parts are hit first if the stitch lands on one */
  for (const p of b.parts) {
    if (!p.alive) continue;
    const px = b.x + p.ox, py = b.y + p.oy;
    if (abs(wx - px) < p.r && abs(wy - py) < p.r) {
      p.hp -= dmg; p.hitT = 0.12; b.hitT = 0.08;
      Audio_.sfx("bosshit");
      burst(px, py, b.z - 0.5, 4, PAL.beam, 7, 1, 0.35);
      if (p.hp <= 0) {
        p.alive = false;
        burst(px, py, b.z, 26, PAL.fine, 14, 0, 1.0);
        burst(px, py, b.z, 18, PAL.accent, 18, 1, 0.6);
        G.addScore(2500, true);
        G.shake(9, 0.3);
        Audio_.sfx("killbig");
        b.shielded = bossAliveShields() > 0;
      }
      return true;
    }
  }
  const shieldK = b.shielded ? 0.28 : 1;
  b.hp -= dmg * shieldK;
  b.hitT = 0.1;
  Audio_.sfx("bosshit");
  burst(wx, wy, b.z - 0.5, 3, b.shielded ? PAL.accent2 : PAL.beam, 6, 1, 0.3);
  if (b.hp <= 0 && b.state !== "die") {
    b.hp = 0; b.state = "die"; b.stT = 0; b.dieT = 0;
    Audio_.sfx("bossdie");
    G.shake(22, 1.2);
    G.slowmo = 1.1;
    hazards.length = 0;
    thorns.length = 0;
  }
  return true;
}

/* ------------------------------------------------------------ behaviour -- */
function updateBoss(dt) {
  const b = BOSS;
  if (!b.active) return;
  b.t += dt; b.stT += dt;
  if (b.hitT > 0) b.hitT -= dt;
  for (const p of b.parts) if (p.hitT > 0) p.hitT -= dt;

  if (b.state === "enter") {
    const t = clamp(b.stT / 2.8, 0, 1);
    b.z = lerp(170, b.homeZ, ease(t));
    b.x = sin(b.stT * 1.4) * 2.2;
    if (t >= 1) { b.state = "idle"; b.stT = 0; }
    return;
  }
  if (b.state === "die") {
    b.dieT += dt;
    b.z += dt * 3;
    b.y -= dt * 0.7;
    b.x += sin(b.dieT * 3) * dt * 2;
    if (chance(min(1, dt * 13))) {
      const a = rnd() * TAU, rr_ = rnd() * b.r;
      burst(b.x + cos(a) * rr_, b.y + sin(a) * rr_ * 0.7, b.z, 9, PAL.beam, 16, 1, 0.7);
      burst(b.x + cos(a) * rr_, b.y + sin(a) * rr_ * 0.7, b.z, 7, PAL.fine, 11, 0, 1.1);
      G.shake(4, 0.12);
    }
    if (b.dieT > 2.9 && !b.dead) {
      b.dead = true;
      burst(b.x, b.y, b.z, 70, PAL.beam, 26, 1, 1.4);
      burst(b.x, b.y, b.z, 50, PAL.fine, 18, 0, 2.0);
      burst(b.x, b.y, b.z, 30, PAL.accent, 22, 2, 1.6);
      addParticle(b.x, b.y, b.z, 0, 0, 0, 1.1, 3, PAL.beam, b.r * 2.6);
      G.shake(26, 0.9); G.flash = 1;
      G.onBossDead();
    }
    return;
  }

  /* phase escalation */
  const frac = b.hp / b.maxhp;
  const np = frac < 0.34 ? 2 : frac < 0.68 ? 1 : 0;
  if (np !== b.phase) {
    b.phase = np;
    b.rage = np * 0.5;
    G.shake(10, 0.4);
    Audio_.sfx("warn");
    burst(b.x, b.y, b.z, 30, PAL.accent, 16, 1, 0.9);
  }

  b.def.move(b, dt);

  if (b.state === "idle") {
    if (b.stT > b.def.gap / (1 + b.rage)) {
      const list = b.def.atks[min(b.phase, b.def.atks.length - 1)];
      b.atk = pick(list);
      b.state = "tell"; b.stT = 0;
      b.tellMax = b.def.tell(b, b.atk);
      Audio_.sfx("tell");
    }
  } else if (b.state === "tell") {
    b.def.onTell(b, dt, b.stT / b.tellMax);
    if (b.stT >= b.tellMax) { b.state = "strike"; b.stT = 0; b.def.onStrike(b); }
  } else if (b.state === "strike") {
    b.def.onStrikeUpdate(b, dt);
    if (b.stT >= b.def.strikeDur) { b.state = "idle"; b.stT = 0; }
  }
}

/* --------------------------------------------------------- boss drawing -- */
function drawBoss() {
  const b = BOSS;
  if (!b.active || b.dead) return;
  const k = project(b.x, b.y, b.z);
  const x = scrX, y = scrY;
  const s = k * b.r * BS;
  ctx.save();
  ctx.translate(x, y);
  if (b.state === "die") {
    ctx.rotate(sin(b.dieT * 4) * 0.12 * b.dieT);
    ctx.globalAlpha = max(0, 1 - b.dieT / 3.1);
  }
  b.def.draw(b, s, k);
  ctx.restore();
  if (b.hitT > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const a = clamp(b.hitT / 0.1, 0, 1) * 0.4;
    const g = ctx.createRadialGradient(x, y, s * 0.4, x, y, s * 1.9);
    g.addColorStop(0, "rgba(255,255,255,0)");
    g.addColorStop(0.6, "rgba(255,250,235," + a.toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,220,180,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, s * 1.9, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* helper: a tell ring that closes as the attack charges */
function tellRing(s, t, col) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const r = s * (2.6 - 1.7 * t);
  ctx.strokeStyle = CA(col, 0.25 + 0.55 * t);
  ctx.lineWidth = max(1.4, s * 0.05 * (1 + t * 2));
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = CA(col, 0.18 * t);
  ctx.lineWidth = max(1, s * 0.02);
  ctx.beginPath(); ctx.arc(0, 0, r * 1.25, 0, TAU); ctx.stroke();
  ctx.restore();
}

   blade of light it cuts the field with */

  const b = BOSS;
  if (!b.active) return;
  if (b.state === "tell" && b.atk === "pass" && b.passLock) {
    const t = clamp(b.stT / b.tellMax, 0, 1);

   COLLISION
   ======================================================================== */
function collide() {
  /* stitches into vermin */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    let hit = false;
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (e.dead) continue;
      const rz = 2.4 + e.r;
      if (abs(b.z - e.z) > rz) continue;
      if (abs(b.x - e.x) > e.r * 1.15 || abs(b.y - e.y) > e.r * 1.15) continue;
      e.hp--; e.hitT = 0.13; hit = true;
      Audio_.sfx("tick");
      burst(b.x, b.y, b.z, 3, PAL.beam, 6, 1, 0.25);
      if (e.hp <= 0) { killEnemy(e, true); G.kills++; }
      break;
    }
    if (!hit) {
      for (let j = 0; j < obstacles.length; j++) {
        const o = obstacles[j];
        if (o.dead) continue;
        const def = OB[o.kind];
        if (abs(b.z - o.z) > 2.6) continue;
        if (abs(b.x - o.x) > def.rx * 1.3) continue;
        const gy = clothY(o.x, o.z);
        if (b.y > gy + def.top || b.y < gy - 0.6) continue;
        hit = true;
        o.hitT = 0.12;
        if (def.hp > 0) {
          o.hp--;
          Audio_.sfx("tick");
          burst(b.x, b.y, b.z, 4, PAL.accent, 7, 1, 0.3);
          if (o.hp <= 0) {
            o.dead = true;
            G.addScore(def.score, true);
            Audio_.sfx("killbig");
            burst(o.x, gy + 1.5, o.z, 24, PAL.accent, 13, 0, 1.0);
            burst(o.x, gy + 1.5, o.z, 14, PAL.warp, 16, 2, 0.8);
            G.shake(5, 0.2);
            if (chance(0.35)) addPickup(o.x, gy + 1.6, o.z, 0);
          }
        } else {
          Audio_.sfx("tick");
          burst(b.x, b.y, b.z, 4, PAL.beam, 9, 1, 0.22);
        }
        break;
      }
    }
    if (!hit && BOSS.active && BOSS.state !== "enter" && BOSS.state !== "die") {
      if (abs(b.z - BOSS.z) < 3.0 + BOSS.r * 0.18) {
        const dx = abs(b.x - BOSS.x), dy = abs(b.y - BOSS.y);
        let inPart = false;
        for (const p of BOSS.parts) {
          if (!p.alive) continue;
          if (abs(b.x - (BOSS.x + p.ox)) < p.r && abs(b.y - (BOSS.y + p.oy)) < p.r) { inPart = true; break; }
        }
        if (inPart || (dx < BOSS.def.coreW && dy < BOSS.def.coreH)) {
          bossHit(1, b.x, b.y);
          hit = true;
        }
      }
    }
    if (hit) { bullets.splice(i, 1); bulletPool.push(b); }
  }

  if (!P.alive || G.state !== "play") return;

  /* vermin into you, and the near misses that keep you honest */
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    const dz = abs(e.z - PZ);
    if (dz > 8) continue;
    const dx = abs(e.x - P.x), dy = abs(e.y - P.y);
    const cfg = ET[e.type];
    if (dz < 1.7 && dx < e.r * 0.9 + 0.5 && dy < e.r * 0.9 + 0.5) {
      hurtPlayer(20);
      killEnemy(e, false);
      continue;
    }
    if (!e.grazed && dz < 3.2 && dx < cfg.grazeR && dy < cfg.grazeR) {
      e.grazed = true;
      G.grazes++;
      G.addScore(90, true);
      Audio_.sfx("graze", G.combo);
      G.fray = max(0, G.fray - 0.7);
      G.floatText("GRAZE", PAL.accent2);
      burst(e.x, e.y, e.z, 5, PAL.accent2, 6, 1, 0.32);
    }
  }
  /* the standing things */
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.dead) continue;
    const dz = abs(o.z - PZ);
    if (dz > 8) continue;
    const def = OB[o.kind];
    const gy = clothY(o.x, o.z);
    const dx = abs(o.x - P.x);
    const inY = P.y < gy + def.top;
    if (dz < 1.8 && dx < def.rx + 0.45 && inY) {
      hurtPlayer(24);
      o.hitT = 0.2;
      G.shake(14, 0.4);
      burst(P.x, P.y, PZ, 16, PAL.warp, 12, 2, 0.7);
      continue;
    }
    if (!o.grazed && dz < 3.0 && dx < def.rx + 1.5 && inY) {
      o.grazed = true;
      G.grazes++;
      G.addScore(120, true);
      Audio_.sfx("graze", G.combo);
      G.fray = max(0, G.fray - 0.9);
      G.floatText("GRAZE", PAL.accent2);
    }
  }
  /* thorns */
  for (let i = 0; i < thorns.length; i++) {
    const t = thorns[i];
    if (t.dead) continue;
    if (abs(t.z - PZ) < 1.8 && abs(t.x - P.x) < 0.95 && abs(t.y - P.y) < 0.95) {
      t.dead = true;
      hurtPlayer(14);
    }
  }
  /* the boss body itself */
  if (BOSS.active && BOSS.state !== "enter" && BOSS.state !== "die") {
    if (abs(BOSS.z - PZ) < 3.4 &&
      abs(BOSS.x - P.x) < BOSS.def.coreW + 1 && abs(BOSS.y - P.y) < BOSS.def.coreH + 1) {
      hurtPlayer(26);
    }
  }
  /* the Snarl's cinch */
  if (G.cinchT > 0 && abs(P.x) > G.cinchW) hurtPlayer(16);
}

function glyphW(ch, key) {
  const k = key + ch;
  let w = _gw.get(k);
  if (w === undefined) { w = ctx.measureText(ch).width; _gw.set(k, w); }
  return w;
}
const _wds = [];
function tracked(txt, x, y, size, font, tr, align, fill) {
  ctx.font = size + "px " + font;
  ctx.textAlign = "left";
  const key = size + font;
  let total = 0;
  const wds = _wds; wds.length = 0;
  for (let i = 0; i < txt.length; i++) {
    const w = glyphW(txt[i], key);
    wds.push(w); total += w + tr;
  }
  total -= tr;
  let cx = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
  ctx.fillStyle = fill;
  for (let i = 0; i < txt.length; i++) {
    ctx.fillText(txt[i], cx, y);
    cx += wds[i] + tr;
  }
  return total;
}
function trackedWidth(txt, size, font, tr) {
  ctx.font = size + "px " + font;
  const key = size + font;
  let total = 0;
  for (let i = 0; i < txt.length; i++) total += glyphW(txt[i], key) + tr;
  return total - tr;
}

function drawFrayMeter() {
  const x = 26, y = H - 78, w = min(280, W * 0.26), h = 26;
  const f = G.fray / 100;
  ctx.save();
  ctx.font = "10px " + MONO;
  ctx.textBaseline = "alphabetic";
  tracked("FRAY", x, y - 14, 10, MONO, 3.4, "left", CA(PAL.beam, 0.55));
  const n = 11;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const yy = y + t * h;
    const broken = t < f;
    ctx.beginPath();
    if (!broken) {
      ctx.moveTo(x, yy);
      ctx.lineTo(x + w, yy + sin(G.t * 3 + i) * 0.8);
      ctx.strokeStyle = CA(PAL.warp, 0.72);
      ctx.lineWidth = 1.7;
    } else {
      const cut = x + w * (0.18 + 0.5 * vnoise(i * 3.7, G.t * 0.4));
      ctx.moveTo(x, yy);
      ctx.lineTo(cut, yy + sin(G.t * 7 + i * 2) * 2.2);
      ctx.moveTo(cut + 9 + sin(G.t * 5 + i) * 3, yy + cos(G.t * 6 + i) * 3);
      ctx.lineTo(x + w, yy + sin(G.t * 4 + i) * 2.6);
      ctx.strokeStyle = CA([230, 92, 74], 0.66);
      ctx.lineWidth = 1.3;
    }
    ctx.stroke();
  }
  ctx.strokeStyle = CA(PAL.beam, 0.22);
  ctx.lineWidth = 1;
  ctx.strokeRect(x - 6, y - 7, w + 12, h + 14);
  /* the cinch charge sits under it */
  const cw = w * 0.42, cy = y + h + 16;
  const rdy = P.dashCD <= 0;
  ctx.fillStyle = CA(PAL.beam, 0.12);
  ctx.fillRect(x, cy, cw, 4);
  ctx.fillStyle = rdy ? CA(PAL.accent2, 0.9) : CA(PAL.accent, 0.5);
  ctx.fillRect(x, cy, cw * (rdy ? 1 : 1 - P.dashCD / 1.9), 4);
  tracked(rdy ? "CINCH READY" : "CINCH", x + cw + 10, cy + 5, 9, MONO, 2.4, "left",
    CA(PAL.beam, rdy ? 0.6 : 0.28));
  ctx.restore();
}

function drawBossBar() {
  const b = BOSS;
  if (!b.active || b.state === "enter") return;
  const w = min(760, W * 0.62), x = CX - w / 2, y = 68;
  const f = clamp(b.hp / b.maxhp, 0, 1);
  ctx.save();
  tracked(b.def.name, CX, y - 14, 13, DISPLAY, 5.2, "center", CA(PAL.beam, 0.9));
  const n = 7;
  for (let i = 0; i < n; i++) {
    const yy = y + i * 3.4;
    ctx.beginPath();
    ctx.moveTo(x, yy);
    ctx.lineTo(x + w * f, yy + sin(G.t * 5 + i) * 1.1);
    ctx.strokeStyle = i % 2 ? CA(PAL.accent, 0.85) : CA(PAL.beam, 0.75);
    ctx.lineWidth = 2;
    ctx.stroke();
    if (f < 1) {
      ctx.beginPath();
      const fx = x + w * f;
      ctx.moveTo(fx, yy);
      ctx.quadraticCurveTo(fx + 14 + sin(G.t * 6 + i * 2) * 7, yy + sin(G.t * 4 + i) * 6,
        fx + 26 + cos(G.t * 3 + i) * 9, yy + cos(G.t * 5 + i) * 9);
      ctx.strokeStyle = CA(PAL.accent, 0.28);
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }
  /* the parts you can shear off */
  let px = x;
  for (const p of b.parts) {
    const pw = w / b.parts.length - 6;
    ctx.fillStyle = p.alive ? CA(PAL.accent2, 0.55) : CA(PAL.beam, 0.10);
    ctx.fillRect(px, y + n * 3.4 + 5, pw * (p.alive ? clamp(p.hp / p.maxhp, 0, 1) : 1), 2.5);
    ctx.strokeStyle = CA(PAL.beam, 0.18);
    ctx.lineWidth = 1;
    ctx.strokeRect(px, y + n * 3.4 + 5, pw, 2.5);
    px += pw + 6;
  }
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = "alphabetic";
  /* score */
  tracked("SCORE", 26, 34, 10, MONO, 3.4, "left", CA(PAL.beam, 0.5));
  tracked(String(G.score).padStart(8, "0"), 26, 62, 26, MONO, 2.6, "left", CA(PAL.beam, 0.95));
  ctx.strokeStyle = CA(PAL.accent, 0.55);
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  const sw = trackedWidth(String(G.score).padStart(8, "0"), 26, MONO, 2.6);
  for (let i = 0; i < 9; i++) {
    const x0 = 26 + sw * i / 9, x1 = 26 + sw * (i + 0.62) / 9;
    ctx.moveTo(x0, 70); ctx.lineTo(x1, 70);
  }
  ctx.stroke();
  /* high score */
  tracked("BEST", W - 26, 34, 10, MONO, 3.4, "right", CA(PAL.beam, 0.4));
  tracked(String(max(G.hi, G.score)).padStart(8, "0"), W - 26, 58, 16, MONO, 2.2, "right",
    CA(PAL.beam, 0.62));
  /* stage */
  const st = PALETTES[G.stage];
  tracked("BOLT " + roman(G.loop) + " · STAGE " + st.roman, CX, 30, 11, MONO, 4.2, "center",
    CA(PAL.beam, 0.45));
  if (!BOSS.active) {
    tracked(st.name, CX, 52, 15, DISPLAY, 6.5, "center", CA(PAL.beam, 0.8));
    /* distance to the boss, as thread paid out */
    const prog = clamp(G.stageT / STAGES[G.stage].dur, 0, 1);
    const bw = min(300, W * 0.24);
    ctx.strokeStyle = CA(PAL.beam, 0.16);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(CX - bw / 2, 62); ctx.lineTo(CX + bw / 2, 62); ctx.stroke();
    ctx.strokeStyle = CA(PAL.accent, 0.7);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(CX - bw / 2, 62); ctx.lineTo(CX - bw / 2 + bw * prog, 62); ctx.stroke();
  }
  /* combo */
  if (G.combo > 1) {
    const a = clamp(G.comboT / 2.6, 0, 1);
    const sz = 22 + (G.combo > 8 ? 6 : 0);
    tracked("×" + G.combo, W - 26, H - 44, sz, MONO, 2, "right", CA(PAL.accent, 0.55 + a * 0.45));
    tracked("STITCH RUN", W - 26, H - 26, 9, MONO, 3, "right", CA(PAL.beam, 0.3 + a * 0.3));
  }
  drawFrayMeter();
  drawBossBar();
  /* floating text */
  for (const f of G.floats) {
    const t = f.t / f.life;
    ctx.globalAlpha = (1 - t) * 0.95;
    tracked(f.txt, f.x, f.y - t * 34, f.big ? 26 : 13, f.big ? DISPLAY : MONO, f.big ? 5 : 2.6,
      "center", C(f.col));
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawBanner() {
  if (G.bannerT <= 0) return;
  const t = 1 - G.bannerT / G.bannerMax;
  const a = clamp(min(G.bannerT * 2.2, t * 6), 0, 1);
  ctx.save();
  ctx.globalAlpha = a;

  const g = ctx.createLinearGradient(0, y - 40, 0, y + 20);

  g.addColorStop(0.5, "rgba(0,0,0,0.45)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, y - 46, W, 74);
  tracked(G.bannerA, CX, y, min(46, W * 0.052), DISPLAY, min(16, W * 0.016), "center", C(PAL.beam));
  if (G.bannerB) tracked(G.bannerB, CX, y + 24, 12, MONO, 3.4, "center", CA(PAL.accent, 0.8));
  ctx.restore();
}

/* --------------------------------------------------------- full screens -- */
function stitchedRule(x, y, w, phase, col, weight) {
  ctx.strokeStyle = col;
  ctx.lineWidth = weight || 2;
  ctx.beginPath();
  const seg = 16, n = Math.round(w / seg);
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 0.58) / n;
    if (t0 > phase) break;
    ctx.moveTo(x + w * t0, y + sin(i * 0.7 + G.t) * 0.8);
    ctx.lineTo(x + w * min(t1, phase), y + sin(i * 0.7 + 0.4 + G.t) * 0.8);
  }
  ctx.stroke();
}

  const gg = ctx.createLinearGradient(CX - tw / 2, 0, CX + tw / 2, 0);

  gg.addColorStop(0.42, C(PAL.beamCore));
  gg.addColorStop(0.6, C(PAL.beam));
  gg.addColorStop(1, C(PAL.accent));
  ctx.save();
  ctx.shadowColor = CA(PAL.accent, 0.55);

  tracked("WEFTRUNNER", CX, ty, size, DISPLAY, tr, "center", gg);

  stitchedRule(CX - tw / 2, ty + size * 0.20, tw, clamp(t * 0.5, 0, 1), CA(PAL.accent, 0.9), 2.4);
  tracked("THE LAST BOLT", CX, ty + size * 0.42, min(19, W * 0.019), MONO, min(13, W * 0.013),
    "center", CA(PAL.beam, 0.72));

  const lines = [
    "The world is a cloth on the Great Loom.",
    "Ahead of you it is still being woven. Behind you it is coming undone,",

  ctx.textAlign = "center";
  for (let i = 0; i < lines.length; i++) {

  ctx.globalAlpha = 0.42;
  tracked("MOVE  ←↑↓→ / WASD / MOUSE", CX, H * 0.845, 11, MONO, 2.6, "center", C(PAL.beam));
  tracked("STITCH  SPACE / CLICK        CINCH  SHIFT / RIGHT-CLICK", CX, H * 0.878, 11, MONO, 2.6,
    "center", C(PAL.beam));
  tracked("PAUSE  P        MUTE  M        RESTART  R", CX, H * 0.911, 11, MONO, 2.6, "center", C(PAL.beam));

}

  ctx.fillRect(0, 0, W, H);
  tracked("SEAM HELD", CX, H * 0.34, min(64, W * 0.062), DISPLAY, min(20, W * 0.02), "center", C(PAL.beam));
  stitchedRule(CX - W * 0.2, H * 0.36, W * 0.4, clamp(t * 0.55, 0, 1), CA(PAL.accent, 0.85), 2.2);

    ["STAGE", PALETTES[G.stage].name],
    ["MENDED", String(G.kills) + " VERMIN"],

function drawOver() {
  const t = G.overT;
  const a = clamp(t * 1.1, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = "rgba(2,1,4,0.78)";
  ctx.fillRect(0, 0, W, H);
  /* the title comes apart */
  const size = min(W * 0.085, 108);
  const tr = size * 0.16;
  const word = "UNRAVELLED";
  ctx.font = size + "px " + DISPLAY;
  let total = 0;
  const wds = [];
  for (let i = 0; i < word.length; i++) { const w = ctx.measureText(word[i]).width; wds.push(w); total += w + tr; }
  total -= tr;
  let cx = CX - total / 2;
  for (let i = 0; i < word.length; i++) {
    const d = clamp(t - 0.2 - i * 0.045, 0, 3);
    const fall = d * d * 26;
    ctx.save();
    ctx.translate(cx + wds[i] / 2, H * 0.33 + fall);
    ctx.rotate(sin(i * 2.3) * d * 0.28);
    ctx.globalAlpha = a * clamp(1.5 - d * 0.42, 0, 1);
    ctx.fillStyle = C(PAL.beam);
    ctx.textAlign = "center";
    ctx.fillText(word[i], 0, 0);
    ctx.restore();
    cx += wds[i] + tr;
  }
  ctx.globalAlpha = a;
  ctx.textAlign = "center";
  ctx.font = "italic " + min(18, W * 0.016) + "px " + DISPLAY;
  ctx.fillStyle = CA(PAL.beam, 0.6);
  ctx.fillText("the Fray took the thread you were standing on", CX, H * 0.44);

  const rows = [
    ["SCORE", String(G.score).padStart(8, "0")],
    ["BEST", String(max(G.hi, G.score)).padStart(8, "0")],
    ["REACHED", "BOLT " + roman(G.loop) + " · STAGE " + PALETTES[G.stage].roman],
    ["MENDED", String(G.kills)],
    ["GRAZES", String(G.grazes)]
  ];
  for (let i = 0; i < rows.length; i++) {
    const yy = H * 0.53 + i * min(30, H * 0.038);
    ctx.globalAlpha = a * clamp(t * 1.6 - 0.5 - i * 0.2, 0, 1);
    tracked(rows[i][0], CX - 18, yy, 12, MONO, 3.2, "right", CA(PAL.beam, 0.45));
    tracked(rows[i][1], CX + 18, yy, 14, MONO, 2.2, "left",
      i === 0 ? CA(PAL.accent, 0.95) : CA(PAL.beam, 0.8));
  }
  if (G.score >= G.hi && G.score > 0) {
    ctx.globalAlpha = a * (0.6 + 0.4 * sin(t * 5));
    tracked("A NEW LENGTH OF CLOTH", CX, H * 0.50, 13, MONO, 4.4, "center", C(PAL.accent));
  }
  ctx.globalAlpha = a * (0.55 + 0.45 * sin(t * 3.2));
  tracked("PRESS  SPACE  TO  RUN  AGAIN", CX, H * 0.88, min(19, W * 0.018), MONO, min(7, W * 0.006),
    "center", C(PAL.accent));
  ctx.restore();
}

/* the Fray closing in from behind, drawn as tendrils at the screen edge */
function drawFrayVignette() {
  const f = G.fray / 100;
  if (f < 0.02 && G.state !== "dead") return;
  const amt = G.state === "dead" ? clamp(0.35 + G.deadT * 0.55, 0, 1.4) : f;
  ctx.save();
  const g = ctx.createRadialGradient(CX, CY + H * 0.16, H * (0.62 - amt * 0.34),
    CX, CY + H * 0.16, H * (1.15 - amt * 0.35));
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(26,3,10," + (0.30 + amt * 0.68).toFixed(3) + ")");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const n = (10 + amt * 26) | 0;
  ctx.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const side = i % 4;
    const t = (i * 0.137 + G.t * 0.05) % 1;
    const len = (0.05 + 0.20 * amt) * (0.5 + vnoise(i * 5.1, G.t * 0.3));
    let x0, y0, dx, dy;
    if (side === 0) { x0 = 0; y0 = t * H; dx = W * len; dy = 0; }
    else if (side === 1) { x0 = W; y0 = t * H; dx = -W * len; dy = 0; }
    else if (side === 2) { x0 = t * W; y0 = H; dx = 0; dy = -H * len * 1.4; }
    else { x0 = t * W; y0 = 0; dx = 0; dy = H * len * 0.8; }
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(x0 + dx * 0.5 + sin(G.t * 3 + i) * 14, y0 + dy * 0.5 + cos(G.t * 2 + i) * 14,
      x0 + dx, y0 + dy);
    ctx.strokeStyle = "rgba(214,74,64," + (0.10 + amt * 0.34).toFixed(3) + ")";
    ctx.lineWidth = 1 + amt * 2.4;
    ctx.stroke();
  }
  ctx.restore();
}

/* the Snarl's cinch: thread curtains pulled in on both sides */
function drawCinch() {
  if (G.cinchT <= 0) return;
  const a = clamp(min(G.cinchT * 2, 1), 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  for (const sd of [-1, 1]) {
    const k = project(sd * G.cinchW, 0, PZ);
    const xn = scrX;
    project(sd * G.cinchW, 0, 90);
    const xf = scrX;
    ctx.beginPath();
    ctx.moveTo(sd < 0 ? -20 : W + 20, H + 20);
    ctx.lineTo(xn, H + 20);
    ctx.lineTo(xf, CY + shY);
    ctx.lineTo(sd < 0 ? -20 : W + 20, CY + shY);
    ctx.closePath();
    const g = ctx.createLinearGradient(sd < 0 ? 0 : W, 0, xn, 0);
    g.addColorStop(0, CA(PAL.accent, 0.42));
    g.addColorStop(1, CA(PAL.accent, 0.08));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = CA(PAL.beam, 0.8);
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(xn, H + 20); ctx.lineTo(xf, CY + shY); ctx.stroke();
    for (let i = 0; i < 9; i++) {
      const t = i / 9;
      ctx.beginPath();
      ctx.moveTo(lerp(sd < 0 ? -20 : W + 20, xn, t), H + 20);
      ctx.lineTo(lerp(sd < 0 ? -20 : W + 20, xf, t) + sin(G.t * 4 + i) * 4, CY + shY);
      ctx.strokeStyle = CA(PAL.warp, 0.18);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ==========================================================================
   FRAME
   ======================================================================== */
const rlPool = [];
let rlN = 0;
const RL = [];
function rlAdd(z, t, o) {
  let r = rlPool[rlN];
  if (!r) r = rlPool[rlN] = { z: 0, t: 0, o: null };
  r.z = z; r.t = t; r.o = o;
  RL[rlN] = r; rlN++;
}
function rlSort(a, b) { return b.z - a.z; }

function update(dt) {
  G.t += dt;

  /* palette cross-fade between stages */
  if (G.palT < 1) G.palT = min(1, G.palT + dt * 0.55);
  setPalette(PALETTES[G.palFrom], PALETTES[G.palTo], ease(G.palT));
  mixc(PAL.skyMid, PAL.skyHaze, 0.68, FOGC);
  waveAmp += (PAL.wave - waveAmp) * min(1, dt * 1.2);
  waveT += dt;

  /* camera */
  camX = P.x * CAM_XK;
  camY = CAM_H + P.y * CAM_YK;
  if (G.shakeT > 0) {
    G.shakeT -= dt;
    const k = G.shakeA * clamp(G.shakeT / G.shakeMax, 0, 1);
    shX = rr(-k, k); shY = rr(-k, k);
    if (G.shakeT <= 0) { G.shakeA = 0; shX = shY = 0; }
  } else { shX *= 0.7; shY *= 0.7; G.shakeA = 0; }
  fovK += ((1 + G.surge * 0.13 - (G.speed - 40) * 0.0009) - fovK) * min(1, dt * 3);

  if (G.flash > 0) G.flash = max(0, G.flash - dt * 2.4);
  if (G.surge > 0) G.surge = max(0, G.surge - dt * 1.4);
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) { G.combo = 1; G.comboKills = 0; } }
  if (G.bannerT > 0) G.bannerT -= dt;
  if (G.cinchT > 0) G.cinchT -= dt;
  for (let i = G.floats.length - 1; i >= 0; i--) {
    G.floats[i].t += dt;
    if (G.floats[i].t >= G.floats[i].life) G.floats.splice(i, 1);
  }

  /* speed */
  G.speed += (G.targetSpeed * (1 + G.surge * 0.5) - G.speed) * min(1, dt * 1.5);
  G.dist += G.speed * dt;

  updateTimers(dt);
  updateArches(dt);
  updateGroundFeatures(dt);
  updateAmbient(dt);
  updateParticles(dt);

  switch (G.state) {
    case "title": {
      G.titleT += dt;
      G.targetSpeed = 34;
      Audio_.setTrack("title");
      if (chance(dt * 0.85)) {
        const e = spawnEnemy(chance(0.75) ? "moth" : "wraith", rr(-11, 11), rr(1.6, 5.6), 200, {});
        e.ax = e.x; e.ay = e.y;
      }
      updateEnemies(dt);
      updateObstacles(dt);
      if (anyKeyEdge) {
        anyKeyEdge = false;
        Audio_.resume(); Audio_.init(); Audio_.resume();
        Audio_.sfx("start");
        startRun();
      }
      break;
    }
    case "card": {
      G.cardT += dt;
      updatePlayer(dt);
      updateEnemies(dt);
      updateObstacles(dt);
      updateBullets(dt);
      if (G.cardT > 2.9) { G.state = "play"; G.bossPending = false; }
      break;
    }
    case "play": {
      updateDirector(dt);
      updatePlayer(dt);
      updateEnemies(dt);
      updateObstacles(dt);
      updateBullets(dt);
      updateThorns(dt);
      updateHazards(dt);
      updatePickups(dt);
      updateBoss(dt);
      collide();
      /* the cloth mends itself, slowly, if you let it */
      G.fray = max(0, G.fray - dt * 1.5);
      break;
    }
    case "clear": {
      G.clearT += dt;
      G.targetSpeed = lerp(G.targetSpeed, 30, min(1, dt));
      updatePlayer(dt);
      updateBullets(dt);
      updateEnemies(dt);
      updateObstacles(dt);
      if (G.clearT > 4.6) nextStage();
      break;
    }
    case "dead": {
      G.deadT += dt; P.deadT += dt;
      G.targetSpeed = max(6, G.targetSpeed - dt * 30);
      updatePlayer(dt);
      updateEnemies(dt);
      updateObstacles(dt);
      updateThorns(dt);
      if (G.deadT > 2.6) { G.state = "over"; G.overT = 0; anyKeyEdge = false; }
      break;
    }
    case "over": {
      G.overT += dt;
      G.targetSpeed = 18;
      updateEnemies(dt);
      updateObstacles(dt);
      if (G.overT > 0.9 && anyKeyEdge) {
        anyKeyEdge = false;
        Audio_.sfx("start");
        startRun();
      } else if (G.overT > 15) {
        goTitle();       /* nobody came back. the cabinet returns to attract. */
      }
      break;
    }
  }
  anyKeyEdge = false;
  dashEdge = false;

  if (G.slowmo > 0) G.slowmo = max(0, G.slowmo - dt * 1.4);
  Audio_.update(dt, clamp((G.speed - 30) / 55, 0, 1.3));

  /* the world reddens as you come apart */
  const fr = G.fray / 100;
  if (fr > 0.02) {
    if (!G.groundTint) G.groundTint = [0, 0, 0];
    G.groundTint[0] = fr * 26; G.groundTint[1] = -fr * 10; G.groundTint[2] = -fr * 12;
  } else G.groundTint = null;
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky();
  buildRows();
  drawGround();
  drawStains();
  drawHoles();

  /* everything in the world, back to front */
  rlN = 0;
  for (let i = 0; i < arches.length; i++) rlAdd(arches[i].z - G.dist, 0, arches[i]);
  for (let i = 0; i < obstacles.length; i++) rlAdd(obstacles[i].z, 1, obstacles[i]);
  for (let i = 0; i < enemies.length; i++) rlAdd(enemies[i].z, 2, enemies[i]);
  for (let i = 0; i < bullets.length; i++) rlAdd(bullets[i].z, 3, bullets[i]);
  for (let i = 0; i < thorns.length; i++) rlAdd(thorns[i].z, 4, thorns[i]);
  for (let i = 0; i < parts.length; i++) rlAdd(parts[i].z, 5, parts[i]);
  for (let i = 0; i < pickups.length; i++) rlAdd(pickups[i].z, 6, pickups[i]);
  for (let i = 0; i < hazards.length; i++) rlAdd(hazards[i].z, 8, hazards[i]);
  if (BOSS.active && !BOSS.dead) rlAdd(BOSS.z, 7, BOSS);
  RL.length = rlN;
  RL.sort(rlSort);
  for (let i = 0; i < rlN; i++) {
    const r = RL[i];
    switch (r.t) {
      case 0: drawArch(r.o); break;
      case 1: drawObstacle(r.o); break;
      case 2: drawEnemy(r.o); break;
      case 3: drawBullet(r.o); break;
      case 4: drawThorn(r.o); break;
      case 5: drawParticle(r.o); break;
      case 6: drawPickup(r.o); break;
      case 7: drawBoss(); break;
      case 8: drawHazard(r.o); break;
    }
  }
  drawWardenFX();
  drawCinch();

  if (G.state !== "title" && G.state !== "over") {
    drawMenderShadow();
    drawTrail();
    drawMender();
  }

  drawFrayVignette();

  if (G.flash > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(255,240,220," + (G.flash * 0.5).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  if (overlay) ctx.drawImage(overlay, 0, 0, W, H);

  if (G.state === "play" || G.state === "card" || G.state === "clear" || G.state === "dead") drawHUD();
  if (G.state === "card") drawCard();
  if (G.state === "clear") drawClear();
  if (G.state === "title") drawTitle();
  if (G.state === "over") drawOver();
  drawBanner();
  if (G.paused) drawPause();

  if (Audio_.muted) {
    tracked("MUTED", W - 26, H - 14, 10, MONO, 3, "right", CA(PAL.beam, 0.35));
  }
}

/* --------------------------------------------------- adaptive resolution -- */
/* This renderer is fill-rate bound. Rather than guess at a device's canvas
   throughput, watch the real frame cost and trade pixels for frames. */
let frAvg = 16.7, frHot = 0, frCool = 0;
const DPR_STEPS = [1, 0.82, 0.68, 0.56];
let dprStep = 0;
function adaptResolution(dtMs) {
  frAvg += (min(dtMs, 90) - frAvg) * 0.06;
  if (frAvg > 21 && dprStep < DPR_STEPS.length - 1) {
    frHot += dtMs; frCool = 0;
    if (frHot > 1400) { frHot = 0; dprStep++; dprScale = DPR_STEPS[dprStep]; resize(); frAvg = 16.7; }
  } else if (frAvg < 11.5 && dprStep > 0) {
    frCool += dtMs; frHot = 0;
    if (frCool > 5000) { frCool = 0; dprStep--; dprScale = DPR_STEPS[dprStep]; resize(); frAvg = 16.7; }
  } else { frHot = 0; frCool = 0; }
}

/* ------------------------------------------------------------- the loop -- */
let lastT = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.2) dt = 0.2;
  if (G.t > 2) adaptResolution(dt * 1000);

  /* self-heal if the viewport arrives late or changes under us */
  if (window.innerWidth && (abs(window.innerWidth - W) > 1 || abs(window.innerHeight - H) > 1)) resize();

  if (pauseEdge) {
    pauseEdge = false;
    if (G.state === "play" || G.state === "card" || G.paused) {
      G.paused = !G.paused;
      Audio_.sfx("ui");
      if (Audio_.ok) Audio_.musicBus.gain.setTargetAtTime(G.paused ? 0.15 : 0.9, Audio_.ctx.currentTime, 0.1);
    }
  }
  if (G.restartEdge) {
    G.restartEdge = false;
    if (G.state !== "title") { G.paused = false; saveHi(); Audio_.sfx("start"); startRun(); }
  }

  if (!G.paused) {
    const scale = G.slowmo > 0 ? lerp(1, 0.28, clamp(G.slowmo, 0, 1)) : 1;
    acc += dt * scale;
    const step = 1 / 60;
    let n = 0;
    while (acc >= step && n < 5) { update(step); acc -= step; n++; }
    if (n === 5) acc = 0;
  }
  render();
}

/* --------------------------------------------------------------- start -- */
resize();
setPalette(PALETTES[0], PALETTES[0], 0);
mixc(PAL.skyMid, PAL.skyHaze, 0.68, FOGC);
archNextZ = 40;
obNextZ = 60;
G.obKinds = STAGES[0].obKinds;
G.obGap = STAGES[0].obGap;
G.targetSpeed = 34; G.speed = 34;
window.addEventListener("pointerdown", () => { Audio_.resume(); }, { once: true });
window.addEventListener("keydown", () => { Audio_.resume(); }, { once: true });
requestAnimationFrame(frame);

/* A handle for driving the loom by hand: stepping frames, jumping to a stage
   or a boss, and reading state. Used to verify the game without playing it. */
window.weftrunner = {
  G, P, BOSS, IN, Audio_, PALETTES, STAGES, BOSSDEF, ET, OB,
  enemies, obstacles, bullets, thorns, parts, hazards, pickups, holes, stains, arches,
  update, render, resize, startRun, beginStage, bossStart, spawnEnemy, addObstacle,
  hurtPlayer, killPlayer, goTitle, bossHit, addHazard, fireThorn,
  drawSky, drawGround, buildRows, drawHoles, drawStains, drawHUD, drawFrayVignette,
  drawWeaveCells, drawMender, drawTrail, drawParticle,
  step(n, dt) { for (let i = 0; i < (n || 1); i++) update(dt || 1 / 60); },
  jump(stage, toBoss) {
    startRun();
    beginStage(clamp(stage | 0, 0, STAGES.length - 1));
    G.state = "play"; G.cardT = 9;
    if (toBoss) { G.stageT = STAGES[G.stage].dur + 1; bossStart(G.stage); BOSS.stT = 3; BOSS.state = "idle"; BOSS.z = BOSS.homeZ; }
  }
};
</script>
</body>
