<script>
"use strict";
const Sea = (() => {
  // Four inks for the paper, three for the salt, two for the engraved foreground.
  const inks = [
    {top:'#123a48', water:'#397982', haze:'#a4c3ad', sun:'#ffe2a4', sunShade:'#eab478', distant:'#81aba4', middle:'#608e8b', close:'#3d7075', silhouette:'#254f5d', ink:'#142f42', bed:['#42777a','#67918a','#83a697','#a4b99c','#c0c6a3','#355e67'], plant:'#264f57', leaf:'#448587', edge:'#9bbca1', vermilion:'#c85542'},
    {top:'#442e46', water:'#89605d', haze:'#dfa58a', sun:'#ffdc9c', sunShade:'#d88765', distant:'#be8e80', middle:'#a17a75', close:'#7d6469', silhouette:'#5b4d60', ink:'#2c3045', bed:['#896c68','#ab8172','#c89578','#d9aa82','#e3bd8c','#785b61'], plant:'#5b4759', leaf:'#956e70', edge:'#d5aa89', vermilion:'#ef7856'},
    {top:'#171e39', water:'#43466d', haze:'#9a9db6', sun:'#e1d0af', sunShade:'#a191a6', distant:'#868da7', middle:'#697392', close:'#515d80', silhouette:'#3d4669', ink:'#1b233e', bed:['#4c5876','#636b86','#7d8299','#9294a6','#aca9ac','#3c4765'], plant:'#333f61', leaf:'#686e96', edge:'#a9a8b5', vermilion:'#f6866b'}
  ];
  const TAU = Math.PI * 2;
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const fract = v=>v-Math.floor(v);
  function rand(seed) {
    let s = seed>>>0;
    return ()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};
  }
  function surface(w,h) {
    const el=document.createElement('canvas');el.width=w;el.height=h;return el;
  }
  function line(c,x,y,xx,yy,color,width=1) {
    c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x,y);c.lineTo(xx,yy);c.stroke();
  }
  function poly(c,pts,color) {
    c.fillStyle=color;c.beginPath();c.moveTo(pts[0],pts[1]);
    for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);
    c.closePath();c.fill();
  }
  function ellipse(c,x,y,rx,ry,col) {
    c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill();
  }
  function skyline(c,x,base,height,kind,col,trim) {
    c.save();c.translate(Math.round(x),Math.round(base));c.scale(height/80,height/80);
    c.fillStyle=col;
    if(kind===0) {
      // A bell pagoda with flared eaves at each of its five stories.
      c.fillRect(-6,-65,12,64);c.fillRect(-12,-17,24,17);
      for(let j=0;j<5;j++){
        const y=-8-j*12, span=21-j*2.7;
        poly(c,[-span,y,-span+1,y-3,-span*.7,y-2,-4,y-9,4,y-9,span*.7,y-2,span-1,y-3,span,y,span*.65,y+2,-span*.65,y+2],col);
        c.fillStyle=trim;c.fillRect(-2,y-7,2.3,4);
      }
      poly(c,[-3,-64,-1,-78,0,-82,2,-65],col);
    } else if(kind===1) {
      // Porous arched columbarium, topped by a pair of smoke pots.
      c.fillRect(-13,-42,26,42);c.fillRect(-16,-45,32,3);
      for(const s of [-1,1]){
        c.fillRect(s*11-2,-61,4,17);
        poly(c,[s*11-4,-60,s*11,-77,s*11+4,-60],col);
      }
      poly(c,[-11,-46,0,-67,11,-46],col);
      for(let j=0;j<3;j++)for(let i=-1;i<=1;i++)
        {ellipse(c,i*7,-37+j*10,1.6,3.6,trim);}
    } else {
      // The choir's organ: pipes of unequal length with open cutaway mouths.
      for(let j=-3;j<=3;j++){
        const v=66-Math.abs(j)*9+(j%2)*7;
        poly(c,[j*5-2,0,j*5-2,-v,j*5+2,-v-3,j*5+2,0],col);
        c.fillStyle=trim;c.fillRect(j*5-1,-v+4,1.5,4);
      }
      poly(c,[-20,-6,-13,-14,13,-14,20,-6,20,0,-20,0],col);
    }
    c.restore();
  }
  let backKey='', back;
  function background(w,h,stage,attract) {
    const p=inks[stage], horizon=h*.51,r=rand(419+stage*73);
    const b=surface(w,h),c=b.getContext('2d');
    const grad=c.createLinearGradient(0,0,0,horizon);
    grad.addColorStop(0,p.top);grad.addColorStop(.55,p.water);grad.addColorStop(1,p.haze);
    c.fillStyle=grad;c.fillRect(0,0,w,horizon+2);
    const sunX=w*(attract?.737:.62),sunY=h*(attract?.286:.245),radius=h*(attract?.192:.115);
    const glow=c.createRadialGradient(sunX,sunY,0,sunX,sunY,radius*2.8);
    glow.addColorStop(0,p.sun+'88');glow.addColorStop(.48,p.sun+'42');glow.addColorStop(1,p.sun+'00');
    c.fillStyle=glow;c.fillRect(0,0,w,horizon);
    // Shafts bend in the same current as the stippled surface lace.
    for(let i=0;i<35;i++){
      const x=r()*w*1.25, width=1+r()*w*.017, skew=h*(.10+.22*r());
      poly(c,[x,-1,x+width,-1,x-skew+width*1.7,horizon,x-skew,horizon],p.sun+(i%4?'08':'12'));
    }
    c.save();
    c.beginPath();c.arc(sunX,sunY,radius,0,TAU);c.clip();
    const disc=c.createLinearGradient(0,sunY-radius,0,sunY+radius);
    disc.addColorStop(0,'#ffedd0');disc.addColorStop(.6,p.sun);disc.addColorStop(1,p.sunShade);
    c.fillStyle=disc;c.fillRect(sunX-radius,sunY-radius,radius*2,radius*2);
    for(let i=0;i<170;i++){
      const x=sunX+(r()-.5)*radius*2,y=sunY+(r()-.5)*radius*2;
      c.fillStyle=i%3===0?'#fff0c4':'#d99762';c.globalAlpha=.12+r()*.15;
      c.fillRect(x|0,y|0,1+r()*radius*.17,i%9===0?2:1);
    }
    c.restore();
    // Seen from below, moving water has flat, dark bellies and luminous folded edges.
    // The deepening gaps between these ribbons let the shafts read as transmitted light.
    const surfRand=rand(7392+stage);
    const canopy=c.createLinearGradient(0,0,0,h*.145);
    canopy.addColorStop(0,p.ink+'a6');canopy.addColorStop(.43,p.top+'49');canopy.addColorStop(1,p.top+'00');
    c.fillStyle=canopy;c.fillRect(0,0,w,h*.15);
    for(let row=0;row<7;row++){
      const level=row/6, unit=(1.32-level*.72)*h/500;
      let x=-48*unit;
      while(x<w+50*unit){
        const width=(40+surfRand()*85)*unit;
        const y=h*(.005+.126*level)+h*(.012*Math.sin(x/w*9+row*.82)+.009*Math.sin(x/w*20-row));
        const span=(2.5+surfRand()*8.5)*unit;
        const tip=y+span*(surfRand()-.5);
        // Two creases meeting at the narrow end of a single refracting water facet.
        c.beginPath();c.moveTo(x,y);
        c.bezierCurveTo(x+width*.13,y-span*.20,x+width*.22,y-span*1.45,x+width*.37,y-span*.65);
        c.bezierCurveTo(x+width*.55,y+span*.48,x+width*.77,y+span*.82,x+width,tip);
        c.bezierCurveTo(x+width*.73,y+span*1.22,x+width*.51,y+span*.78,x+width*.34,y-span*.20);
        c.bezierCurveTo(x+width*.22,y-span*.78,x+width*.1,y+span*.32,x,y);
        const lit=surfRand()>.36;
        c.fillStyle=lit?p.haze+['72','62','58','47','36','28','1b'][row]:p.ink+'46';c.fill();
        if(lit && surfRand()>.34){
          c.beginPath();c.moveTo(x+width*.32,y-span*.74);
          c.bezierCurveTo(x+width*.44,y-span*.48,x+width*.52,y+span*.64,x+width*.67,y+span*.61);
          c.strokeStyle=p.sun+['9c','83','6a','48','35','29','18'][row];c.lineWidth=Math.max(.65,unit*1.18);c.stroke();
        }
        x+=width*(.72+surfRand()*.24);
      }
    }
    // Shallow bands sit between the surface canopy and the underwater ridges.
    for(let i=0;i<Math.floor(w*.24);i++){
      const x=r()*w, y=Math.pow(r(),1.7)*horizon*.59, v=(10+r()*48)*h/500;

function damageBoss(n){
  const b=g.boss;if(!b||b.hp<=0)return;b.hp-=n;b.flash=.12;g.score+=42*n;
  if(b.hp<=0)endRun(true);else ScoreAudio.fx('hit');

function bossStep(dt){
  const b=g.boss;b.t+=dt;b.z=lerp(b.z,16,1-Math.exp(-dt*.75));b.x=.52*Math.sin(b.t*.55);b.y=-.42+.32*Math.sin(b.t*.83);
  b.flash=Math.max(0,b.flash-dt);b.clock-=dt;
  if(b.wind>0){
    b.wind-=dt;
    if(b.wind<=0){
      if(b.kind===0){
        for(let i=-2;i<=2;i++)pellet(b.x+i*.17,b.y,b.z,b.tx+i*.38,b.ty,20);
      }else if(b.kind===1){
        for(let i=0;i<12;i++){
          const a=i*TAU/12;pellet(b.x+Math.cos(a)*.3,b.y+Math.sin(a)*.22,b.z,b.tx+Math.cos(a)*.73,b.ty+Math.sin(a)*.72,17);
        }
        pellet(b.x,b.y,b.z,b.tx,b.ty,15);

        for(let i=-4;i<=4;i++)pellet(b.x+i*.07,b.y,b.z,b.tx+i*.25,b.ty+i*.18,19);

    b.tx=hero.x;b.ty=hero.y;b.pose=b.kind+1;ScoreAudio.fx('tell');

function target(){
  let best=null,rank=Infinity;
  function consider(e,boss){
    if(e.dead||e.z<1||e.z>125)return;
    const dx=(e.x-hero.x),dy=(e.y-hero.y);
    const separation=dx*dx+dy*dy*.78,margin=boss?.62:.24;
    if(separation>margin)return;
    const cost=separation+Math.max(0,e.z)*.0017;
    if(cost<rank){rank=cost;best=e}
  }
  for(const e of enemies)consider(e,false);for(const v of urns)consider(v,false);if(g.boss)consider(g.boss,true);return best;
}
function toll(){
  const e=g.lock;hero.flash=.13;hero.side*=-1;
  const sx=hero.x+hero.side*.063,sy=hero.y-.045;
  const dz=e?Math.max(4,e.z):60;
  shots.push({x:sx,y:sy,z:.4,ox:sx,oy:sy,dx:(e?e.x-sx:hero.x-sx)/dz,dy:(e?e.y-sy:hero.y-sy)/dz,dead:false});
  ScoreAudio.fx('fire');
}
function crossed(s,oldZ,e,rx,ry){
  if(e.dead||e.z<oldZ-2||e.z>s.z+2)return false;
  const dx=(s.ox+s.dx*e.z-e.x)/rx,dy=(s.oy+s.dy*e.z-e.y)/ry;
  return dx*dx+dy*dy<1;
}
function movePlayer(dt){
  let kx=Number(keys.has('ArrowRight')||keys.has('KeyD'))-Number(keys.has('ArrowLeft')||keys.has('KeyA'));
  let ky=Number(keys.has('ArrowDown')||keys.has('KeyS'))-Number(keys.has('ArrowUp')||keys.has('KeyW'));
  let vx,vy;
  if(mouse.on){
    vx=clamp((mouse.x-hero.x)*12,-4.1,4.1);vy=clamp((mouse.y-hero.y)*12,-5,5);
  }else{
    const d=Math.hypot(kx,ky)||1;vx=kx/d*2.35;vy=ky/d*3.05;
  }
  hero.vx=lerp(hero.vx,vx,1-Math.exp(-dt*14));hero.vy=lerp(hero.vy,vy,1-Math.exp(-dt*14));
  hero.x=clamp(hero.x+hero.vx*dt,-1,1);hero.y=clamp(hero.y+hero.vy*dt,-1,1);
  hero.immune=Math.max(0,hero.immune-dt);hero.flash=Math.max(0,hero.flash-dt);
}
function updateEffects(dt){
  g.shake=Math.max(0,g.shake-dt*2);g.flash=Math.max(0,g.flash-dt*1.8);g.peal=Math.max(0,g.peal-dt);
  for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=dt*.045;p.vx*=1-dt*1.2;p.life-=dt}
  for(const r of rings){r.life-=dt;r.r+=dt*95}
  sparks=sparks.filter(p=>p.life>0);rings=rings.filter(r=>r.life>0);
}
function playStep(dt){

  g.speed=21+g.stage*4.8+Math.min(4,g.clock*.07);g.distance+=g.speed*dt;g.score+=dt*(5+g.stage*2);
  updateEffects(dt);movePlayer(dt);

      g.stage++;g.clock=0;g.wave=0;g.waveT=1.6;g.stoneT=3.7;g.stoneN=0;hero.health=Math.min(4,hero.health+1);
      ScoreAudio.stage(g.stage);ScoreAudio.fx('stage');announce(['','SECOND PASSAGE','THIRD PASSAGE'][g.stage],names[g.stage]);

  }
  for(const e of enemies){

    const a=e.age*(e.type===2?2.45:1.55)+e.phase;
    e.x=e.bx+Math.sin(a)*(e.type===2?.37:e.type===1?.12:.21);
    e.y=e.by+Math.cos(a*(e.type===1?1.23:.78))*(e.type===1?.37:.14);
    if(e.type!==0&&!e.fired&&e.z<58){e.warn+=dt;if(e.warn>.82){

    }
  }

    if(p.z< -10)p.dead=true;
  }
  for(const b of pearls){
    if(b.dead)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z-=dt*b.speed;
    if(b.z<=0){const d=Math.hypot(b.x-hero.x,(b.y-hero.y)*.77);if(d<.16)hurt();else if(d<.29)near();b.dead=true}
  }
  for(const v of urns){
    v.z-=g.speed*dt;
    if(v.z<=0){const d=Math.hypot(v.x-hero.x,(v.y-hero.y)*.8);if(d<.21)hurt();else if(d<.4)near();v.dead=true}
  }
  for(const v of gifts){
    v.z-=g.speed*dt;
    if(v.z<=0){
      if(Math.hypot(v.x-hero.x,(v.y-hero.y)*.78)<.36){hero.health=Math.min(4,hero.health+1);hero.charge=3;g.score+=250;ScoreAudio.fx('pickup');burst(v.x,v.y,0,16,'#c0ffe6');notice('VOTIVE  ·  BELL RESTORED')}
      v.dead=true;
    }
  }
  if(state!=='play')return;
  g.lock=target();if((keys.has('Space')||mouse.down)&&g.fireT<=0){toll();g.fireT=.145}
  for(const s of shots){
    const old=s.z;s.z+=dt*124;s.x=s.ox+s.dx*s.z;s.y=s.oy+s.dy*s.z;
    for(const e of enemies){if(crossed(s,old,e,.27,.31)){
      s.dead=true;e.hp--;e.flash=.12;if(e.hp<=0)release(e);else{ScoreAudio.fx('hit');burst(e.x,e.y,e.z,5,'#fff0c2')}break;
    }}
    if(!s.dead)for(const p of pillars){
      if(p.z>=old-1&&p.z<=s.z+1&&Math.abs(s.ox+s.dx*p.z-p.x)<.12){
        const sy=s.oy+s.dy*p.z;
        if(sy>p.y-p.height&&sy<p.y){s.dead=true;burst(p.x,sy,p.z,3,'#c1e1d9');
          if(!g.stoneHint){g.stoneHint=true;notice('ANCHORED  ·  FLY OVER OR AROUND',1.65)}break;
        }

    if(!s.dead&&g.boss&&crossed(s,old,g.boss,.56,.65)){s.dead=true;damageBoss(1);burst(g.boss.x,g.boss.y,g.boss.z,4,'#ffa57a')}
    if(s.z>150)s.dead=true;
  }
  enemies=enemies.filter(e=>!e.dead);pillars=pillars.filter(p=>!p.dead);pearls=pearls.filter(p=>!p.dead);
  shots=shots.filter(s=>!s.dead);urns=urns.filter(v=>!v.dead);gifts=gifts.filter(v=>!v.dead);
}
function ellipse(x,y,rx,ry,color,stroke,width=1){
  if(rx<=0||ry<=0)return;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);
  if(color){ctx.fillStyle=color;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}
}
function line(x1,y1,x2,y2,color,width=1){
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke();
}
function diamond(x,y,r,color){
  ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r*.7,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r*.7,y);ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
function sight(x,y,r,color,thick=1){
  for(const a of [-1,1])for(const b of [-1,1]){
    ctx.beginPath();ctx.moveTo(x+a*(r*.55),y+b*r);ctx.lineTo(x+a*r,y+b*r);ctx.lineTo(x+a*r,y+b*r*.55);
    ctx.lineWidth=thick+1.5;ctx.strokeStyle='#102c39';ctx.stroke();ctx.lineWidth=thick;ctx.strokeStyle=color;ctx.stroke();
  }
}
function driftWake(x,y,size,t){

    const dy=(.20+.83*f)*size;

    ellipse(x+dx,y+dy,1+size*.024*f,1+size*.035*f,null,i%3?'#d4eee0':'#ffd9a2',.8);
  }
  ctx.globalAlpha=1;
}

function frame(now){
  const elapsed=lastFrame?Math.min(.09,(now-lastFrame)/1000):0;lastFrame=now;
  if(state!=='pause'&&state!=='dead'&&state!=='win')age+=elapsed;
  if(state==='title')titleDistance+=elapsed*4;
  if(state==='play'||state==='ending'){
    accumulator+=elapsed;
    while(accumulator>=1/60){
      if(state==='play')playStep(1/60);
      else if(state==='ending'){updateEffects(1/60);g.distance+=.04;g.deathT-=1/60;if(g.deathT<=0)finish()}
      accumulator-=1/60;
    }
  }else accumulator=0;
  if((uiTick+=elapsed)>.075){uiTick=0;syncUI()}
  ScoreAudio.update();render();requestAnimationFrame(frame);
}
$('begin').onclick=start;$('soundButton').onclick=toggleSound;$('pauseButton').onclick=pause;
$('primary').onclick=()=>{if(state==='pause')resume();else start()};$('secondary').onclick=openTitle;
$('fullButton').onclick=async()=>{ScoreAudio.unlock();try{
  if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();
}catch{$('fullButton').hidden=true}};
if(!document.fullscreenEnabled)$('fullButton').hidden=true;
document.addEventListener('fullscreenchange',()=>{$('fullButton').querySelector('span').textContent=document.fullscreenElement?'Windowed':'Fullscreen'});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.metaKey||e.ctrlKey)return;
  if(e.code==='Tab')return;
  if(e.code==='KeyM'&&!e.repeat){toggleSound();return}
  if(e.code==='Enter'&&document.activeElement?.tagName==='BUTTON')return;
  if(e.code==='Space'&&document.activeElement?.tagName==='BUTTON'&&state!=='play')return;
  if(!['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyW','KeyA','KeyS','KeyD','Enter','KeyP','Escape','KeyR','KeyX','ShiftLeft','ShiftRight'].includes(e.code))return;
  e.preventDefault();
  if(!e.repeat){
    if(e.code==='Enter'&&['title','dead','win'].includes(state)){start();return}
    if(e.code==='Enter'&&state==='pause'){resume();return}
    if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')pause();else if(state==='pause')resume();return}
    if(e.code==='KeyR'&&['dead','win','pause','play'].includes(state)){start();return}
    if(['KeyX','ShiftLeft','ShiftRight'].includes(e.code)){peal();return}
  }
  if(state==='play'){keys.add(e.code);if(e.code!=='Space')mouse.on=false}
});
document.addEventListener('keyup',e=>keys.delete(e.code));
function steer(e){const r=scene.getBoundingClientRect();mouse.on=true;
  mouse.x=clamp(((e.clientX-r.left)/r.width-.5)/.425,-1,1);
  mouse.y=clamp(((e.clientY-r.top)/r.height-.64)/.28,-1,1);
}
scene.addEventListener('pointermove',e=>{if(state==='play')steer(e)});
scene.addEventListener('pointerdown',e=>{if(state!=='play')return;ScoreAudio.unlock();if(e.button===2){peal();return}if(e.button!==0)return;steer(e);mouse.down=true;scene.setPointerCapture(e.pointerId)});
scene.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('pointerup',()=>mouse.down=false);window.addEventListener('pointercancel',()=>mouse.down=false);
window.addEventListener('blur',()=>{if(state==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
fresh();requestAnimationFrame(frame);
</script>
</body>
</html>
