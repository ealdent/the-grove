<style>

*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#191620;color:var(--paper);font-family:var(--mono)}button{font:inherit;color:inherit}

.mark{width:31px;height:31px;border:1px solid #fbd3a1;display:grid;place-items:center;transform:rotate(45deg);margin:0 11px 0 6px;flex:none}.mark i{width:15px;height:15px;border:1px solid #fbd3a1;display:block}.mark:after{content:"";width:7px;height:7px;background:var(--rust);position:absolute}
h1,h2,p{margin:0}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.092em;line-height:.78;text-shadow:0 9px 30px #150b14ad}h1{font-size:clamp(67px,11.7vw,190px);margin:.25em 0 .18em}h1 em{font-weight:400;color:#ffc19b;letter-spacing:-.102em}h2{font-size:clamp(64px,9vw,143px);margin:.33em 0 .27em}
.promise{font-family:Georgia,serif;font-size:clamp(19px,2.2vw,29px);line-height:1.16;max-width:390px;color:#ffddb5;text-wrap:balance}.sub{margin-top:12px;line-height:1.62;font-size:12px;color:var(--dim);max-width:410px}
.actions{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:28px}.action{border:1px solid #ffe5bc;background:#ffe7bf;color:#2b1820;min-height:48px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:25px;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;transition:background .18s,color .18s;white-space:nowrap}.action:hover{background:#ffad86}.action span{font-size:16px}.action.ghost{background:#1d1520b3;color:#ffedca;border-color:#ffdbad68}.action.ghost:hover{background:#745047}.action:focus-visible,#sound:focus-visible,#pause:focus-visible{outline:2px solid #fff1cb;outline-offset:4px}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:16px;color:var(--dim);font-size:10px;letter-spacing:.05em;line-height:1.9}.controls kbd{font:inherit;color:#ffe8c9;padding:0 6px;border:1px solid #ffcf9a62;line-height:1.65}.controls b{font-weight:400;margin-right:11px}
.folio{position:fixed;right:5vw;bottom:5vh;text-align:right;letter-spacing:.18em;text-transform:uppercase;color:#ffdfb0ba;font-size:10px;line-height:1.7;pointer-events:none}.folio i{font-family:Georgia,serif;font-size:19px;letter-spacing:0;color:#ffeac9;margin-right:3px}
#utility{position:fixed;right:clamp(15px,3vw,45px);top:clamp(13px,2.8vh,30px);display:flex;gap:7px;z-index:5}#sound,#pause{border:1px solid #ffe2b34f;background:#271921aa;color:var(--paper);padding:8px 9px;min-width:39px;cursor:pointer;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}#sound:hover,#pause:hover{background:#734c42}
#hud{position:fixed;inset:0;pointer-events:none;text-transform:uppercase;text-shadow:0 2px 8px #170a14;letter-spacing:.12em}.readout{position:absolute;top:3.05vh;left:3.1vw;display:flex;align-items:flex-start;gap:clamp(18px,3vw,54px)}.label{display:block;color:#ffdeadd1;font-size:9px;line-height:1.4}.number{display:block;color:#fff1d3;font-size:clamp(19px,2.5vw,34px);line-height:1.28;font-variant-numeric:tabular-nums;letter-spacing:.02em}.mult{font-size:11px;color:#ff9c74;margin-left:5px}.pulse{display:flex;gap:6px;margin-top:9px}.pulse i{height:12px;width:9px;transform:skew(-17deg);border:1px solid #ffe4b193;background:#ffd6a7;box-shadow:0 0 9px #ff9a626a}.pulse i.spent{background:#2c162299;box-shadow:none;opacity:.7}
#track{position:absolute;left:3.1vw;right:3.1vw;bottom:3.15vh;display:flex;align-items:end;gap:16px}.tracklabel{color:#ffe8c4;font-size:10px;white-space:nowrap}.rule{background:#fce0b741;height:2px;flex:1;margin-bottom:5px;position:relative}.rule i{position:absolute;left:0;top:0;bottom:0;background:#ffe0b2;box-shadow:0 0 10px #ffab78;width:0}.rule b{position:absolute;top:-3px;height:8px;width:1px;background:#ffe8c486}.rule b:nth-child(2){left:33.33%}.rule b:nth-child(3){left:66.67%}.velocity{font-size:10px;color:#ffe8c4;white-space:nowrap}
#bossHud{position:absolute;top:10.5vh;left:50%;width:min(365px,45vw);transform:translateX(-50%);text-align:center;font-size:10px;color:#fff0d0}.bossbar{height:5px;margin:7px auto;background:#271522ab;border:1px solid #ffcb9e88}.bossbar i{display:block;height:100%;background:#ffa378;box-shadow:0 0 9px #ff734b;width:100%}#bossCue{color:#ffc692;font-size:9px;line-height:1.3}
#chapter{position:fixed;top:26.5vh;left:50%;width:90%;transform:translate(-50%,-50%);text-align:center;text-shadow:0 3px 20px #200e20,0 2px 4px #1e0f20;pointer-events:none;opacity:0}#chapter span{display:block;font-size:10px;font-weight:700;letter-spacing:.29em;color:#ffd9a9;text-transform:uppercase;margin-bottom:8px}#chapter strong{font-family:Georgia,serif;font-size:clamp(30px,6.2vw,93px);line-height:1;font-weight:400;letter-spacing:-.065em;text-wrap:balance}
#toast{position:fixed;top:72%;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.19em;color:#fff0b2;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 4px #2c0d19,0 0 18px #2a0d19;pointer-events:none;opacity:0}
.result{display:flex;gap:35px;margin-top:25px}.result div{min-width:95px}.result strong{display:block;margin-top:3px;color:#ffcc9e;font-weight:500;font-size:clamp(22px,3.5vw,40px);letter-spacing:-.07em}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-height:630px){#screen{padding-top:45px}.edition{font-size:9px}h1{font-size:clamp(57px,17vh,128px);margin:.27em 0 .17em}h2{font-size:clamp(49px,13vh,104px)}.actions{margin-top:17px}.sub{margin-top:8px}.result{margin-top:15px}.controls{margin-top:9px}.folio{display:none}}
@media(max-width:640px){#screen{padding-left:7vw;background:linear-gradient(90deg,#170f1ae0,#170f1a63 70%,transparent)}.folio{display:none}.mark{width:24px;height:24px}.mark i{width:11px;height:11px}.readout{top:6vh}.tracklabel,.velocity{font-size:8px}}
@media(prefers-reduced-motion:reduce){.action{transition:none}.grain{display:none}}

<body>
<canvas id="view" aria-label="Vesper Press, a letterpress rail shooter"></canvas>
<div class="shade"></div><div class="grain"></div>
<div id="utility"><button id="pause" type="button" aria-label="Pause game" hidden>Pause</button><button id="sound" type="button" aria-label="Mute sound" aria-pressed="false">Sound on</button></div>
<div id="hud" hidden>
  <div class="readout"><div><span class="label">Impression score</span><span class="number"><span id="score">000000</span><span class="mult" id="mult"></span></span></div><div><span class="label">Paper plies</span><div class="pulse" id="plies" role="meter" aria-label="Paper plies" aria-valuemin="0" aria-valuemax="4" aria-valuenow="4"><i></i><i></i><i></i><i></i></div></div></div>
  <div id="bossHud" hidden><span id="bossName"></span><div class="bossbar"><i id="bossLife"></i></div><div id="bossCue"></div></div>

</div>
<div id="chapter" aria-hidden="true"><span></span><strong></strong></div>
<div id="toast" aria-hidden="true"></div>
<main id="screen" data-mode="title">
  <section class="card" id="titleCard" aria-labelledby="title">
    <div class="edition"><span class="mark" aria-hidden="true"><i></i></span> The last edition</div>
    <h1 id="title">Vesper<br><em>Press</em></h1>
    <p class="promise">Carry the last unprinted name through a drowned letterpress.</p>
    <p class="sub">Keep it moving. If the ink sets, the press owns the name.</p>
    <div class="actions"><button class="action" id="begin" type="button">Enter the press <span aria-hidden="true">↗</span></button></div>
    <div class="controls"><kbd>WASD</kbd><kbd>↑↓←→</kbd><b>Fly</b><kbd>Space</kbd><b>Fire</b><kbd>Esc</kbd><b>Pause</b><kbd>M</kbd><b>Sound</b></div>
  </section>

    <div class="actions"><button class="action" id="primary" type="button"><span id="primaryLabel"></span><span aria-hidden="true">↗</span></button><button class="action ghost" id="secondary" type="button"><span id="secondaryLabel"></span></button></div>
  </section>

<div class="folio" id="folio"><i>iii</i> sections<br>Ink · Type · Binding</div>
<div class="sr" id="status" role="status" aria-live="polite"></div>
<script>
'use strict';
(() => {
const audio = (() => {
  let context, master, music, effects, noiseBuffer, clock;
  let muted = false, paused = false, stage = 0, boss = false;
  let beat = 0, nextBeat = 0;
  const lastEffect = new Map();
  const scores = [
    {
      pulse: .277,
      chords: [[50, 57, 60, 64], [43, 55, 59, 65], [48, 55, 62, 64], [45, 52, 55, 60]],
      motif: [[74, 77, 81, 79, 76, 74], [71, 0, 74, 79, 77, 0], [76, 79, 84, 81, 79, 76], [72, 0, 76, 74, 69, 0]]
    }, {
      pulse: .249,
      chords: [[51, 58, 61, 66], [42, 54, 58, 65], [47, 54, 58, 63], [46, 53, 56, 62]],
      motif: [[75, 78, 82, 80, 77, 75], [73, 0, 77, 78, 77, 0], [75, 78, 83, 82, 78, 75], [74, 0, 77, 71, 70, 0]]
    }, {
      pulse: .221,
      chords: [[50, 57, 61, 66], [47, 54, 57, 62], [43, 54, 59, 66], [45, 52, 55, 61]],
      motif: [[74, 78, 81, 83, 76, 74], [71, 0, 74, 78, 81, 0], [79, 83, 86, 85, 81, 78], [76, 0, 81, 79, 73, 0]]
    }
  ];
  const bossScore = {
    pulse: .195,
    chords: [[38, 50, 56, 65], [41, 53, 59, 65], [39, 51, 57, 66], [37, 49, 55, 64]],
    motif: [[74, 0, 68, 77, 76, 0], [77, 0, 71, 74, 77, 0], [75, 0, 69, 78, 77, 0], [73, 0, 67, 76, 70, 0]]
  };
  const frequency = note => 440 * 2 ** ((note - 69) / 12);
  const gates = { shot: .075, hit: .065, kill: .1, graze: .17, hurt: .21, tell: .24, pickup: .11 };

  function envelope(source, bus, time, hold, volume, attack = .004) {
    const gain = context.createGain();
    gain.gain.setValueAtTime(.0001, time);
    gain.gain.exponentialRampToValueAtTime(Math.max(.0002, volume), time + attack);
    gain.gain.exponentialRampToValueAtTime(.0001, time + hold);
    source.connect(gain);
    gain.connect(bus);
    return gain;
  }

  function tone(bus, time, from, to, hold, volume, type = 'sine', attack = .004) {
    const source = context.createOscillator();
    source.type = type;
    source.frequency.setValueAtTime(from, time);
    if (to !== from) source.frequency.exponentialRampToValueAtTime(to, time + hold * .8);
    envelope(source, bus, time, hold, volume, attack);
    source.start(time);
    source.stop(time + hold + .018);
  }

  function texture(bus, time, from, to, hold, volume, resonance = 1.25, attack = .004) {
    const source = context.createBufferSource();
    const filter = context.createBiquadFilter();
    source.buffer = noiseBuffer;
    filter.type = 'bandpass';
    filter.Q.value = resonance;
    filter.frequency.setValueAtTime(from, time);
    if (to !== from) filter.frequency.exponentialRampToValueAtTime(to, time + hold * .9);
    source.connect(filter);
    envelope(filter, bus, time, hold, volume, attack);
    source.start(time, Math.random() * .62);
    source.stop(time + hold + .018);
  }

  // A felt strike leaves short, slightly inharmonic brass overtones.
  function bell(bus, time, note, hold, volume) {
    const pitch = frequency(note);
    tone(bus, time, pitch, pitch * .999, hold, volume, 'triangle');
    tone(bus, time, pitch * 2.013, pitch * 2.006, hold * .63, volume * .21);
    tone(bus, time, pitch * 3.87, pitch * 3.83, hold * .4, volume * .14);
  }

  function playBeat(time, count, score) {
    const step = count % 6;
    const bar = Math.floor(count / 6) % 4;
    const chord = score.chords[bar];
    const eighth = score.pulse;
    if (step === 0) {
      tone(music, time, frequency(chord[0] - 12), frequency(chord[0] - 12), eighth * 5.7, .073, 'triangle', .074);
      chord.slice(1).forEach((note, i) => {
        const pitch = frequency(note + (i === 0 ? 0 : 12));
        tone(music, time + i * .033, pitch, pitch * 1.003, eighth * 5.65, .025, 'sine', .18);
      });
      texture(music, time, 1880, 690, eighth * 2.2, .043, .7, .09);
    }
    if (step === 0 || step === 3) {
      const chase = boss ? 1.25 : 1;
      tone(music, time, step === 0 ? 98 : 75, 37, .24, .104 * chase, 'sine');
      texture(music, time, 1190, 340, .105, .1 * chase, 1.3);
      if (step === 3) bell(music, time + .014, chord[1], eighth * 2.5, .037);
    }
    if (step === 2 || step === 4 || step === 5) {
      const weight = step === 5 ? .87 : .58;
      texture(music, time, 5050, 1660, .088, .105 * weight, 2.8);
      tone(music, time, 619, 427, .045, .029 * weight, 'triangle');
    }
    const note = score.motif[bar][step];
    if (note) {
      const lead = step === 0 || step === 3;
      bell(music, time + .012, note, eighth * (lead ? 2.5 : 1.4), lead ? .053 : .036);
      if (lead) bell(music, time + eighth * .705, note - 12, eighth * 1.65, .018);
    }
  }

  function schedule() {
    if (paused || muted || context.state !== 'running') return;
    const now = context.currentTime;
    if (nextBeat < now) nextBeat = now + .025;
    while (nextBeat < now + .125) {
      const score = boss ? bossScore : scores[stage];
      playBeat(nextBeat, beat, score);
      beat++;
      nextBeat += score.pulse;
    }
  }

  function syncGain() {
    if (!context || !master) return;
    const now = context.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setTargetAtTime(muted || paused ? 0 : .76, now, .028);
  }

  function start() {
    if (!context) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      try {
        context = new AudioContext();
        effects = context.createGain();
        music = context.createGain();
        master = context.createGain();
        effects.gain.value = .85;
        music.gain.value = .64;
        master.gain.value = muted || paused ? 0 : .76;
        const compressor = context.createDynamicsCompressor();
        compressor.threshold.value = -18;
        compressor.knee.value = 13;
        compressor.ratio.value = 6;
        compressor.attack.value = .009;
        compressor.release.value = .14;
        effects.connect(master);
        music.connect(master);
        master.connect(compressor);
        compressor.connect(context.destination);

        const echo = context.createDelay(.44);
        const shade = context.createBiquadFilter();
        const echoGain = context.createGain();
        echo.delayTime.value = .187;
        shade.type = 'lowpass';
        shade.frequency.value = 2450;
        echoGain.gain.value = .23;
        music.connect(echo);
        echo.connect(shade);
        shade.connect(echoGain);
        echoGain.connect(master);
        echoGain.connect(echo);

        noiseBuffer = context.createBuffer(1, Math.floor(context.sampleRate * 2.1), context.sampleRate);
        const samples = noiseBuffer.getChannelData(0);
        for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
        clock = window.setInterval(schedule, 40);
      } catch (error) {
        if (clock) window.clearInterval(clock);
        if (context) context.close().catch(() => {});
        context = undefined;
        return;
      }
    }
    if (context.state !== 'running') context.resume().catch(() => {});
  }

  function fx(name, strength = 1) {
    if (!context || muted || paused || context.state === 'closed') return;
    const time = context.currentTime + .012;
    if (time - (lastEffect.get(name) ?? -20) < (gates[name] ?? .12)) return;
    lastEffect.set(name, time);
    const level = Math.max(.2, Math.min(1.35, strength));
    const metal = (offset, note, hold, weight) => bell(effects, time + offset, note, hold, weight * level);
    const motor = (offset, from, to, hold, weight, type, attack) => tone(effects, time + offset, from, to, hold, weight * level, type, attack);
    const paper = (offset, from, to, hold, weight, resonance, attack) => texture(effects, time + offset, from, to, hold, weight * level, resonance, attack);
    switch (name) {
      case 'shot':
        paper(0, 2960, 950, .105, .118, 1.9);
        motor(0, 415, 124, .115, .058, 'triangle');
        break;
      case 'hit':
        paper(0, 1580, 4360, .08, .155, 2.5);
        metal(.008, 78 + Math.floor(Math.random() * 4), .19, .068);
        break;
      case 'kill':
        paper(0, 5200, 920, .29, .23, .93);
        motor(0, 142, 58, .28, .10, 'triangle');
        metal(.025, 77, .37, .11);
        metal(.084, 84, .42, .083);
        break;
      case 'graze':
        paper(0, 440, 5450, .34, .22, 1.1, .071);
        metal(.096, 88, .21, .045);
        break;
      case 'hurt':
        motor(0, 132, 36, .41, .234, 'triangle');
        paper(0, 2670, 385, .39, .27, 1.45);
        metal(.035, 59, .46, .09);
        metal(.014, 73, .29, .106);
        break;
      case 'death':
        motor(0, 181, 31, .93, .23, 'triangle');
        paper(0, 1830, 155, 1.12, .35, 1.2, .034);
        metal(.075, 60, .82, .12);
        metal(.238, 56, 1.2, .10);
        metal(.495, 50, 1.35, .194);
        break;
      case 'phase':
        paper(0, 560, 3900, .76, .19, .9, .17);
        [62, 69, 74, 77, 81].forEach((note, i) => metal(i * .118, note, .82, .091));
        break;
      case 'boss':
        paper(0, 460, 170, .97, .26, .82, .025);
        motor(0, 78, 35, .81, .22, 'triangle');
        [50, 56, 65].forEach((note, i) => metal(i * .119, note, .94, .106));
        break;
      case 'tell':
        motor(0, 425, 495, .28, .101, 'triangle', .039);
        paper(0, 1300, 4200, .31, .108, 2.5, .023);
        metal(.022, 68, .44, .094);
        metal(.19, 74, .36, .106);
        break;
      case 'win':
        [62, 66, 69, 76, 74, 78, 81, 86].forEach((note, i) => metal(i * .125, note, 1.08, i % 4 === 0 ? .13 : .09));
        motor(0, 73.42, 73.42, 1.38, .12, 'triangle', .17);
        break;
      case 'start':
        paper(0, 2490, 490, .42, .27, 1.53);
        motor(.03, 110, 53, .39, .17, 'triangle');
        [62, 69, 74].forEach((note, i) => metal(.063 + i * .066, note, .72, .092));
        break;
      case 'pickup':
        [81, 86, 90].forEach((note, i) => metal(i * .063, note, .39, .086));
        break;
    }
  }

  return {
    start, fx,
    mute(value = !muted) {
      muted = value;
      syncGain();
      return muted;
    },
    pause(value) {
      paused = value;
      syncGain();
    },
    setScene(index, encounter) {
      const nextStage = Math.max(0, Math.min(2, index | 0));
      const nextBoss = Boolean(encounter);
      if (stage === nextStage && boss === nextBoss) return;
      stage = nextStage;
      boss = nextBoss;
      beat = 0;
    }
  };
})();
const $ = id => document.getElementById(id);
const canvas = $('view');
const ctx = canvas.getContext('2d', {alpha:false});
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = 2 * Math.PI;
const clamp = (n,a,b) => Math.min(b,Math.max(a,n));
const lerp = (a,b,t) => a+(b-a)*t;
const smooth = t => t*t*(3-2*t);
const rand = (a,b) => a+(b-a)*Math.random();
const hash = n => {const p=Math.sin(n*127.1+311.7)*43758.5453;return p-Math.floor(p);};
const mix = (a,b,t) => 'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')+')';
const rgba = (rgb,a) => 'rgba('+rgb.join(',')+','+a+')';

      }else {puff(e.x,e.y,e.z,5,'#ffdcb2',.68);audio.fx('hit');}
    }else if(boss&&boss.mode!=='breaking'&&z0<=boss.z+.95&&p.z>=boss.z-.95){
      const b=boss, dx=Math.abs(p.x-b.x), dy=Math.abs(p.y-b.y), open=b.mode==='recover'||b.mode==='arrive';
      const hit=dx<b.w*(open?.80:.62)&&dy<(open?1.42:1.22);
      if(hit){
        p.dead=true;
        if(open){
          const core=dx<.71&&dy<.67;
          b.hp-=core?3:1;b.hit=.085;points+=35*multiplier();
          puff(p.x,p.y,b.z,core?9:4,core?'#fff4bb':'#ffb280',.77);audio.fx('hit',core?1.14:.62);
          if(b.hp<=0)bossDefeated(b);
        }else if(particles.length<135)puff(p.x,p.y,b.z,3,'#bc695c',.57);
      }
    }
  }
  shots=shots.filter(p=>!p.dead&&p.z<FAR);
}
function playing(dt) {
  stageTime+=dt;
  speed=stageSpeed(stage,stageTime);
  if(boss)speed*=.91;
  travel+=dt*speed;
  chainTimer=Math.max(0,chainTimer-dt);
  if(chainTimer===0)chain=0;
  transition=Math.max(0,transition-dt);if(transition===0)visualStage=stage;
  updatePlayer(dt);
  if(!boss){
    if(stageTime>=stages[stage].time)summonBoss();
    else{
      activation-=dt;nextObstacle-=dt;
      if(activation<=0&&stageTime<stages[stage].time-2.1)stageWave();
      if(nextObstacle<=0&&stageTime<stages[stage].time-2.8)stageObstacles();
    }
  }
  updateFire(dt);
  updateWorld(dt);
  updateHostile(dt);
  if(mode==='playing')updateBoss(dt);
  driftEffects(dt,speed);
}
function update(dt) {
  if(mode==='pause'||mode==='over'||mode==='win')return;
  time+=dt;chapterAge+=dt;toastAge+=dt;
  if(mode==='title')titleLoop(dt);
  else if(mode==='playing')playing(dt);
  else if(mode==='dying'){
    ending+=dt;travel+=dt*speed*Math.max(.06,.55-ending*.37);
    for(const e of world)e.z-=dt*speed*.27;
    driftEffects(dt,speed*.31);
    if(ending>1.42){audio.pause(true);finish(false);}
  }
}
function syncUI() {
  $('chapter').style.opacity=String(mode==='playing'?clamp(Math.min(chapterAge*3,(2.55-chapterAge)*1.35),0,1):0);
  $('toast').style.opacity=String(mode==='playing'?clamp(Math.min(toastAge*7,(1.1-toastAge)*2),0,1):0);
  if(mode==='title'||mode==='over'||mode==='win')return;
  const progress=Math.floor((stage+(boss?lerp(.83,1,1-clamp(boss.hp/boss.max,0,1)):.83*clamp(stageTime/stages[stage].time,0,1)))/3*100);
  const row=[points,multiplier(),player.life,stage,progress,Math.round(speed*2.25)].join('/');
  if(lastHud!==row){
    lastHud=row;
    $('score').textContent=String(points).padStart(6,'0');$('mult').textContent=multiplier()>1?'×'+multiplier():'';
    $('plies').setAttribute('aria-valuenow',String(player.life));
    Array.from($('plies').children).forEach((el,index)=>el.classList.toggle('spent',index>=player.life));
    $('trackName').textContent=stages[stage].number+' · '+stages[stage].name;
    $('distance').style.width=progress+'%';$('velocity').textContent=Math.round(speed*2.25)+' KM/H';
  }
  $('bossHud').hidden=!boss;
  if(boss){
    const b=boss, cue=b.mode==='windup'?{column:'Vertical pressure · Clear the band',row:'Cross pressure · Clear the band',stamp:'Registration stamp · Clear the mark',fan:'Type volley · Watch the slugs'}[b.warning.kind]:b.mode==='attack'?'Pressure released':b.mode==='breaking'?'Form broken':'Seam exposed · Fire';
    const status=[stage,b.hp,cue].join('/');
    if(status!==bossHud){
      bossHud=status;$('bossName').textContent=stages[stage].boss;$('bossLife').style.width=clamp(b.hp/b.max*100,0,100)+'%';$('bossCue').textContent=cue;
    }
  }
}
function frame(now) {
  const dt=lastNow?clamp((now-lastNow)/1000,.001,.04):.01667;
  lastNow=now;
  if(redraw||mode==='title'||mode==='playing'||mode==='dying'){
    redraw=false;update(dt);render();syncUI();
  }
  requestAnimationFrame(frame);
}
window.addEventListener('keydown',e=>{
  if(!stateKey.has(e.code)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target instanceof HTMLButtonElement&&(e.code==='Space'||e.code==='Enter'))return;
  e.preventDefault();
  if(e.code==='KeyM'&&!e.repeat){
    if(muted&&mode!=='title')audio.start();
    setMuted(!muted);return;
  }
  if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat)pause();return;}
  if(e.code==='KeyR'&&!e.repeat&&mode!=='title'&&mode!=='dying'){reset();return;}
  if((mode==='title'||mode==='over'||mode==='win')&&!e.repeat&&(e.code==='Enter'||e.code==='Space')){
    reset();if(e.code==='Space')keys.add('Space');return;
  }
  if(mode==='playing')keys.add(e.code);
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear();if(mode==='playing')pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause();});
$('begin').addEventListener('click',reset);
$('pause').addEventListener('click',pause);
$('sound').addEventListener('click',()=>{if(muted&&mode!=='title')audio.start();setMuted(!muted);if(mode==='playing')canvas.focus({preventScroll:true});});
$('primary').addEventListener('click',()=>{if(mode==='pause')pause();else reset();});
$('secondary').addEventListener('click',()=>{if(mode==='pause')reset();else showTitle();});
canvas.tabIndex=-1;setMuted(muted);showTitle();requestAnimationFrame(frame);
})();
</script>
