<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Codex Incendia trailer overlays</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<!-- Trailer overlays (title, captions, end card, flashes), drawn with the game's own fonts and gold treatment.
     overlays.mjs calls render(T) per frame and captures the page with a transparent background. -->
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: transparent; }
  * { box-sizing: border-box; }
  .layer { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .gold {
    position: relative; display: inline-block; font-family: 'Cinzel Decorative', 'Cinzel', serif; font-weight: 900;
    letter-spacing: 0.04em; line-height: 1.02; white-space: nowrap;
  }
  .gold .t {
    background: linear-gradient(180deg, #fffbe0 0%, #f3c65f 45%, #b8811c 80%, #f9e498 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 2px rgba(10, 6, 3, 0.95)) drop-shadow(0 0 22px rgba(212, 175, 55, 0.55));
  }
  .gold .glint {
    position: absolute; left: 0; top: 0;
    background: linear-gradient(100deg, rgba(255,255,255,0) 42%, rgba(255,253,235,0.95) 50%, rgba(255,255,255,0) 58%);
    background-size: 320% 100%; background-repeat: no-repeat;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .kicker { font-family: 'Cinzel', serif; font-weight: 700; color: #fbbf24; letter-spacing: 0.36em; text-transform: uppercase;
    text-shadow: 0 2px 3px rgba(0,0,0,0.95), 0 0 14px rgba(0,0,0,0.8); }
  .sub { font-family: 'Cinzel', serif; font-weight: 700; color: #fde68a; letter-spacing: 0.3em;
    text-shadow: 0 2px 3px rgba(0,0,0,0.95), 0 0 14px rgba(0,0,0,0.8); }
  .italic { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 600; color: #f5ebd6;
    text-shadow: 0 2px 3px rgba(0,0,0,0.95); }
  .rule { height: 1px; margin: 12px auto; background: linear-gradient(90deg, transparent, #fbbf24, transparent); }

  #topveil { background: radial-gradient(ellipse 70% 62% at 50% 22%, rgba(8, 5, 4, 0.78) 0%, rgba(8, 5, 4, 0.45) 45%, rgba(8, 5, 4, 0) 75%); }
  #title { display: flex; flex-direction: column; align-items: center; padding-top: 70px; }
  #title .kicker { font-size: 15px; margin-bottom: 8px; }
  #title .gold { font-size: 96px; }
  #title .sub { font-size: 25px; margin-top: 8px; }
  #title .credit { margin-top: 10px; font-size: 25px; }

  #cap { display: flex; flex-direction: column; align-items: center; padding-top: 128px; }
  #cap .gold { font-size: 54px; }
  #cap .kicker { font-size: 16px; color: #ff4d58; margin-bottom: 4px; letter-spacing: 0.42em; }
  #cap.big { padding-top: 54px; }
  #cap.big .gold { font-size: 74px; }

  #veil { background: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(8, 5, 4, 0.55), rgba(8, 5, 4, 0.82)); }
  #end { display: flex; align-items: center; justify-content: center; }
  .panel {
    position: relative; width: 760px; padding: 34px 40px 30px; text-align: center; border-radius: 18px;
    background: linear-gradient(165deg, rgba(20, 15, 12, 0.93) 0%, rgba(10, 7, 6, 0.97) 100%);
    border: 1px solid rgba(212, 175, 55, 0.6);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 22px rgba(212, 175, 55, 0.16);
  }
  .panel::before { content: ''; position: absolute; inset: 4px; border: 1px solid rgba(212, 175, 55, 0.28); border-radius: 15px; }
  .corner { position: absolute; color: rgba(245, 158, 11, 0.5); font-size: 20px; }
  #end .kicker { font-size: 13px; }
  #end .gold { font-size: 70px; margin-top: 6px; }
  #end .sub { font-size: 20px; margin-top: 6px; }
  #end .italic { font-size: 30px; }
  #end .url { font-family: 'Cinzel', serif; font-weight: 700; font-size: 22px; color: #fcd34d; letter-spacing: 0.06em; margin-top: 4px; }
  #end .credit { font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; color: #fde68a; letter-spacing: 0.3em; margin-top: 18px; opacity: 0.85; }
  #flash { opacity: 1; }
</style>
</head>
<body>
<div id="topveil" class="layer"></div>
<div id="title" class="layer">
  <div class="kicker">A Space Harrier descendant</div>
  <div class="gold"><span class="t">CODEX INCENDIA</span><span class="glint">CODEX INCENDIA</span></div>
  <div class="sub">THE LAST ILLUMINATOR</div>
  <div class="italic credit">made by Gemini 4 Argon</div>
</div>
<div id="cap" class="layer"><div class="kicker"></div><div class="gold"><span class="t"></span><span class="glint"></span></div></div>
<div id="veil" class="layer"></div>
<div id="end" class="layer">
  <div class="panel">
    <span class="corner" style="top:10px;left:16px">✦</span><span class="corner" style="top:10px;right:16px">✦</span>
    <span class="corner" style="bottom:10px;left:16px">✦</span><span class="corner" style="bottom:10px;right:16px">✦</span>
    <div class="kicker e1">A Space Harrier descendant</div>
    <div class="gold e1"><span class="t">CODEX INCENDIA</span><span class="glint">CODEX INCENDIA</span></div>
    <div class="sub e2">THE LAST ILLUMINATOR</div>
    <div class="rule e2" style="width: 300px"></div>
    <div class="italic e3">Play free in your browser</div>
    <div class="url e3">ealdent.github.io/the-grove/rail-shooter</div>
    <div class="credit e4">MADE BY GEMINI 4 ARGON · HIGH</div>
  </div>
</div>
<div id="flash" class="layer"></div>
<script>
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const outCubic = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const set = (el, o) => { for (const k in o) el.style[k] = o[k]; };
// window.EDL and window.BAR are injected by overlays.mjs (edl.json + the 146 bpm bar length)
window.render = (T) => {
  const E = window.EDL, B = window.BAR, beat = B / 4, at = b => b * B;
  let any = false;
  // a soft gold pulse on every kick while a text element is up
  const pulse = 1 + 0.22 * Math.exp(-((T % beat) / 0.09));
  const glint = (el, t0, dur = 0.7) => { const k = (T - t0) / dur; el.style.backgroundPosition = `${(1 - clamp(k, -0.1, 1.1)) * 100}% 0`; };

  // ---- title: fully up on frame 0 (it is the poster frame), settles, glints, leaves on the cut ----
  const t0 = at(E.title.b0), t1 = at(E.title.b1);
  const ton = T >= t0 && T < t1;
  if (ton) {
    any = true;
    const out = clamp((T - (t1 - 0.2)) / 0.2, 0, 1);
    set($('#topveil'), { opacity: 1 - out });
    set($('#title'), { opacity: 1 - out, transform: `scale(${1.04 - 0.04 * outCubic((T - t0) / 1.2) + 0.05 * out})`, filter: `brightness(${pulse})` });
    glint($('#title .glint'), t0 + 0.05, 0.9);
  } else { $('#topveil').style.opacity = 0; $('#title').style.opacity = 0; }

  // ---- captions: snap in on their downbeat, gone with the cut ----
  const cap = E.captions.find(c => T >= at(c.b0) && T < at(c.b1));
  const ce = $('#cap');
  if (cap) {
    any = true;
    const c0 = at(cap.b0), k = (T - c0) / 0.14;
    ce.className = 'layer' + (cap.big ? ' big' : '');
    ce.querySelector('.kicker').textContent = cap.kicker || '';
    ce.querySelector('.kicker').style.display = cap.kicker ? 'block' : 'none';
    ce.querySelector('.t').textContent = cap.text.toUpperCase();
    ce.querySelector('.glint').textContent = cap.text.toUpperCase();
    set(ce, { opacity: clamp(k * 1.6, 0, 1), transform: `scale(${1.12 - 0.12 * outCubic(k)})`, filter: `brightness(${pulse})` });
    glint(ce.querySelector('.glint'), c0 + 0.08, 0.55);
  } else ce.style.opacity = 0;

  // ---- end card: the game's own title-screen panel over the last run of footage ----
  const e0 = at(E.endcard.b0);
  if (T >= e0) {
    any = true;
    const k = (T - e0) / 0.35;
    set($('#veil'), { opacity: clamp(k, 0, 1) });
    set($('#end'), { opacity: clamp(k, 0, 1), transform: `translateY(${(1 - outCubic(k)) * 16}px)` });
    for (const [cls, d] of [['.e1', 0], ['.e2', 1], ['.e3', 2], ['.e4', 3]]) {
      const kk = (T - e0 - d * beat) / 0.22;
      document.querySelectorAll('#end ' + cls).forEach(el => set(el, { opacity: clamp(kk, 0, 1), transform: `translateY(${(1 - outCubic(kk)) * 8}px)` }));
    }
    glint($('#end .glint'), e0 + 0.25, 0.9);
  } else { $('#veil').style.opacity = 0; $('#end').style.opacity = 0; }

  // ---- flashes on the big hits ----
  let fl = null;
  for (const f of E.flashes) { const k = Math.round((T - at(f.b)) * 60); if (k >= 0 && k < f.frames) fl = [f, k]; }
  if (fl) { any = true; const [f, k] = fl; $('#flash').style.background = `rgba(${f.color},${(f.a * (1 - k / f.frames)).toFixed(3)})`; }
  else $('#flash').style.background = 'transparent';
  return any;
};
window.__ready = true;
</script>
</body>
</html>
